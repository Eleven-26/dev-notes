<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 528" width="1000" height="528" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="528" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">要不要 clone：四问过筛</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">原型模式的判据只有一句 —— 需要的对象已经创建过，才考虑复制它</text>

  <g transform="translate(20,72)">
    <rect x="0" y="0" width="290" height="62" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="145" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">① 对象的构造便宜吗？</text>
    <text x="145" y="45" text-anchor="middle" font-size="10.5" fill="#92400e">几乎无状态、new 一下就有</text>
  </g>
  <line x1="310" y1="103" x2="328" y2="103" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(330,72)">
    <rect x="0" y="0" width="210" height="62" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="105" y="25" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">直接 new</text>
    <text x="105" y="45" text-anchor="middle" font-size="10.5" fill="#334155">别用 clone</text>
  </g>
  <line x1="540" y1="103" x2="558" y2="103" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(560,72)">
    <rect x="0" y="0" width="420" height="62" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="14" y="25" font-size="11" fill="#334155">构造不昂贵时，clone 省下的那点内存不值一提。</text>
    <text x="14" y="45" font-size="11" fill="#991b1b">⚠️ 它反而增加了"到底共不共享"的心智负担。</text>
  </g>

  <g transform="translate(20,144)">
    <rect x="0" y="0" width="290" height="62" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="145" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">② 对象几乎是不可变的吗？</text>
    <text x="145" y="45" text-anchor="middle" font-size="10.5" fill="#92400e">改动只是换掉某几个字段</text>
  </g>
  <line x1="310" y1="175" x2="328" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(330,144)">
    <rect x="0" y="0" width="210" height="62" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="105" y="25" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">withXxx() 返回新实例</text>
    <text x="105" y="45" text-anchor="middle" font-size="10.5" fill="#1e40af">8.1+ 可配合 readonly</text>
  </g>
  <line x1="540" y1="175" x2="558" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(560,144)">
    <rect x="0" y="0" width="420" height="62" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="14" y="25" font-size="11" fill="#14532d">✅ 语义最清楚：新对象是显式造出来的，不靠"拷完再改"。</text>
    <text x="14" y="45" font-size="11" fill="#334155">Java 一栏也把它列为比 Cloneable 更推荐的替代（见第九节）。</text>
  </g>

  <g transform="translate(20,216)">
    <rect x="0" y="0" width="290" height="62" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="145" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">③ 对象图里有环或资源句柄吗？</text>
    <text x="145" y="45" text-anchor="middle" font-size="10.5" fill="#92400e">父子互指、fopen / PDO</text>
  </g>
  <line x1="310" y1="247" x2="328" y2="247" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(330,216)">
    <rect x="0" y="0" width="210" height="62" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="105" y="25" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">不能拷</text>
    <text x="105" y="45" text-anchor="middle" font-size="10.5" fill="#991b1b">改引用 ID / 重新建资源</text>
  </g>
  <line x1="540" y1="247" x2="558" y2="247" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(560,216)">
    <rect x="0" y="0" width="420" height="62" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="14" y="25" font-size="11" fill="#991b1b">手动 __clone 遇到环会无限递归；"深到第几层"本来就不确定。</text>
    <text x="14" y="45" font-size="11" fill="#991b1b">句柄拷完是共享同一底层资源，谁关闭都会让对方拿到已关闭连接。</text>
  </g>

  <g transform="translate(20,288)">
    <rect x="0" y="0" width="290" height="62" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="145" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">④ 要"以现成对象为起点派生"？</text>
    <text x="145" y="45" text-anchor="middle" font-size="10.5" fill="#92400e">基准配置 / 快照撤销 / 大对象</text>
  </g>
  <line x1="310" y1="319" x2="328" y2="319" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(330,288)">
    <rect x="0" y="0" width="210" height="62" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="105" y="25" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">clone + __clone</text>
    <text x="105" y="45" text-anchor="middle" font-size="10.5" fill="#14532d">这才是原型的主场</text>
  </g>
  <line x1="540" y1="319" x2="558" y2="319" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(560,288)">
    <rect x="0" y="0" width="420" height="62" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="14" y="25" font-size="11" fill="#14532d">✅ 仅需内存拷贝，省掉重复初始化；变体各改各的。</text>
    <text x="14" y="45" font-size="11" fill="#92400e">必做：在 __clone() 里逐个数引用属性，该深拷的深拷、该重建的重建。</text>
  </g>

  <g transform="translate(20,362)">
    <rect x="0" y="0" width="960" height="150" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">三语言对照：浅拷贝是默认，深拷贝要显式</text>

    <text x="14" y="52" font-size="11.5" fill="#334155"><tspan font-weight="bold">PHP</tspan>：clone 关键字 + __clone() 钩子；默认浅拷；数组属性天然值拷贝，对象属性共享。</text>
    <text x="14" y="74" font-size="11.5" fill="#334155"><tspan font-weight="bold">Java</tspan>：clone() 需实现 Cloneable；默认浅拷；集合属性必须新建 —— 更推荐拷贝构造器。</text>
    <text x="14" y="96" font-size="11.5" fill="#334155"><tspan font-weight="bold">Go</tspan>：没有 clone 关键字，赋值即值拷贝，但 slice / 指针字段仍共享；要手写 Clone() 并 copy。</text>
    <text x="14" y="124" font-size="11.5" font-weight="bold" fill="#92400e">⭐ 三语言共通：深到哪一层没有统一答案 —— 原文"深拷贝要深入到多少层，是一个不确定的问题"，</text>
    <text x="14" y="142" font-size="11.5" font-weight="bold" fill="#92400e">它必须由业务决定，而不是由语言决定。PHP 还是本系列里唯一一个语言关键字直接支持的模式。</text>
  </g>
</svg>
