<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">要不要工厂：四问过筛，命中即停</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">判据只有一条主轴 —— "造哪个类"是写代码时定死，还是运行时按输入决定</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="290" height="64" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="145" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">① 写代码时就知道要 new 谁吗？</text>
    <text x="145" y="46" text-anchor="middle" font-size="10.5" fill="#92400e">关系固定，不随输入变</text>
  </g>
  <line x1="310" y1="106" x2="328" y2="106" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(330,74)">
    <rect x="0" y="0" width="210" height="64" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="105" y="26" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">直接 new / 构造注入</text>
    <text x="105" y="46" text-anchor="middle" font-size="10.5" fill="#334155">不需要工厂</text>
  </g>
  <line x1="540" y1="106" x2="558" y2="106" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(560,74)">
    <rect x="0" y="0" width="420" height="64" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="14" y="26" font-size="11" fill="#334155">这是最常见的情况：依赖关系本来就该在构造函数里看得见。</text>
    <text x="14" y="48" font-size="11" fill="#991b1b">⚠️ 此处套工厂 = 多余的一层，依赖关系并没有变。</text>
  </g>

  <g transform="translate(20,146)">
    <rect x="0" y="0" width="290" height="64" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="145" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">② 要按配置或环境切换实现吗？</text>
    <text x="145" y="46" text-anchor="middle" font-size="10.5" fill="#92400e">dev 用 file，prod 用 s3</text>
  </g>
  <line x1="310" y1="178" x2="328" y2="178" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(330,146)">
    <rect x="0" y="0" width="210" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="105" y="26" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">容器绑定</text>
    <text x="105" y="46" text-anchor="middle" font-size="10.5" fill="#1e40af">bind() / singleton()</text>
  </g>
  <line x1="540" y1="178" x2="558" y2="178" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(560,146)">
    <rect x="0" y="0" width="420" height="64" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="14" y="26" font-size="11" fill="#334155">切换点写在装配处，调用方仍只依赖接口 —— 不需要 if 判断。</text>
    <text x="14" y="48" font-size="11" fill="#14532d">✅ 想让 new "解耦"要的是依赖注入，不是工厂（见 DIP）</text>
  </g>

  <g transform="translate(20,218)">
    <rect x="0" y="0" width="290" height="64" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="145" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">③ 要按运行时输入决定造哪个？</text>
    <text x="145" y="46" text-anchor="middle" font-size="10.5" fill="#92400e">用户传参、数据库里的类型字段</text>
  </g>
  <line x1="310" y1="250" x2="328" y2="250" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(330,218)">
    <rect x="0" y="0" width="210" height="64" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="105" y="26" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">工厂</text>
    <text x="105" y="46" text-anchor="middle" font-size="10.5" fill="#14532d">这才是它的适用面</text>
  </g>
  <line x1="540" y1="250" x2="558" y2="250" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(560,218)">
    <rect x="0" y="0" width="420" height="64" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="14" y="26" font-size="11" fill="#14532d">✅ 把"造哪个"这个决定收拢到一处：改工厂即全改，调用方不动。</text>
    <text x="14" y="48" font-size="11" fill="#334155">典型：导出格式 CSV/JSON、按渠道选支付、各类 Handler / Exporter。</text>
  </g>

  <g transform="translate(20,290)">
    <rect x="0" y="0" width="290" height="64" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="145" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">④ 抽象程度选哪一档？</text>
    <text x="145" y="46" text-anchor="middle" font-size="10.5" fill="#92400e">按"新增产品的频率与代价"决定</text>
  </g>
  <line x1="310" y1="322" x2="328" y2="322" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(330,290)">
    <rect x="0" y="0" width="210" height="64" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="105" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">简单 / 工厂方法 / 抽象</text>
    <text x="105" y="46" text-anchor="middle" font-size="10.5" fill="#334155">见上图三形态</text>
  </g>
  <line x1="540" y1="322" x2="558" y2="322" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(560,290)">
    <rect x="0" y="0" width="420" height="64" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="14" y="26" font-size="11" fill="#334155">新增频繁、要严格开闭 → 工厂方法；产品成族出现 → 抽象工厂。</text>
    <text x="14" y="48" font-size="11" fill="#92400e">只有一条产品线时别硬上抽象工厂 —— 抽象层数要匹配真实变化。</text>
  </g>

  <g transform="translate(20,368)">
    <rect x="0" y="0" width="960" height="152" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">工厂与容器的分工（最容易混的一刀）</text>
    <text x="14" y="50" font-size="11.5" fill="#334155">工厂负责"<tspan font-weight="bold">根据输入决定造哪个</tspan>"；容器负责"<tspan font-weight="bold">装配与生命周期</tspan>"。二者常一起用：</text>
    <text x="14" y="70" font-size="11.5" fill="#334155">工厂作为服务注册进容器，由容器保证它是单例 —— 见单例篇 3.2 的 Container::singleton()。</text>
    <text x="14" y="98" font-size="11.5" fill="#991b1b">⚠️ 反模式：只是为了"看起来解耦"，把每个 new 都包进工厂 —— 复杂度从一处摊到了各处。</text>
    <text x="14" y="120" font-size="11.5" fill="#334155">症状很具体：多一个类、多一层跳转，而依赖关系一点没变，读代码的人反而要找两遍。</text>
    <text x="14" y="142" font-size="11.5" font-weight="bold" fill="#14532d">⭐ 记住主轴：写代码时就定死 → 不用工厂；运行时按输入决定 → 才用工厂。</text>
  </g>
</svg>
