<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
    <marker id="arwG" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#16a34a"/>
    </marker>
    <marker id="arwR" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">set / get / remove 的调用时序，与两条异常分支</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">标准写法把「取不到」和「重复注册」都推到异常分支上，而不是返回 null 让调用方判空</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="660" height="420" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 一次请求内的四次调用（实测编号对应第二节）</text>

    <rect x="15" y="42" width="110" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="70" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">调用方</text>
    <rect x="195" y="42" width="110" height="30" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
    <text x="250" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Registry</text>
    <rect x="375" y="42" width="110" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="430" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">$items 表</text>
    <rect x="525" y="42" width="110" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="6"/>
    <text x="580" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">异常分支</text>

    <line x1="70" y1="72" x2="70" y2="400" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="250" y1="72" x2="250" y2="400" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="430" y1="72" x2="430" y2="400" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="580" y1="72" x2="580" y2="400" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

    <line x1="70" y1="104" x2="248" y2="104" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="160" y="98" text-anchor="middle" font-size="10" fill="#334155">① set('logger', new Logger('app'))</text>
    <line x1="250" y1="136" x2="428" y2="136" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="340" y="130" text-anchor="middle" font-size="10" fill="#334155">isset 为否 → 写入</text>

    <line x1="70" y1="180" x2="248" y2="180" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="160" y="174" text-anchor="middle" font-size="10" fill="#334155">② get('logger')</text>
    <line x1="250" y1="212" x2="72" y2="212" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arwG)"/>
    <text x="160" y="206" text-anchor="middle" font-size="10" fill="#14532d">同一个实例句柄（1a : true）</text>

    <line x1="70" y1="256" x2="248" y2="256" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="160" y="250" text-anchor="middle" font-size="10" fill="#334155">③ remove 之后再 get</text>
    <line x1="250" y1="288" x2="578" y2="288" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arwR)"/>
    <text x="414" y="282" text-anchor="middle" font-size="10" fill="#991b1b">OutOfBoundsException（1d）</text>

    <line x1="70" y1="332" x2="248" y2="332" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="160" y="326" text-anchor="middle" font-size="10" fill="#334155">④ 对同一个 id 再 set 一次</text>
    <line x1="250" y1="364" x2="578" y2="364" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arwR)"/>
    <text x="414" y="358" text-anchor="middle" font-size="10" fill="#991b1b">LogicException（1e）</text>
  </g>

  <g transform="translate(690,74)">
    <rect x="0" y="0" width="290" height="420" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 三条设计决定</text>

    <text x="14" y="52" font-size="11.5" font-weight="bold" fill="#1e40af">1. 不继承 ArrayObject</text>
    <text x="14" y="72" font-size="10.5" fill="#334155">省几个方法名，却把 append、asort、</text>
    <text x="14" y="90" font-size="10.5" fill="#334155">exchangeArray 全暴露给调用方</text>

    <text x="14" y="122" font-size="11.5" font-weight="bold" fill="#1e40af">2. 不用全静态方法</text>
    <text x="14" y="142" font-size="10.5" fill="#334155">静态表＝全局状态，测试互相污染，</text>
    <text x="14" y="160" font-size="10.5" fill="#334155">同进程跑不了两张隔离的表</text>

    <text x="14" y="192" font-size="11.5" font-weight="bold" fill="#1e40af">3. 取不到抛异常，不返回 null</text>
    <text x="14" y="212" font-size="10.5" fill="#334155">原文 get() 返回 null，键名拼错的错误</text>
    <text x="14" y="230" font-size="10.5" fill="#334155">被推到调用方；类型也不再可空</text>

    <rect x="14" y="252" width="262" height="150" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="145" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">原文写法还剩的三个问题</text>
    <text x="28" y="300" font-size="10.5" fill="#92400e">全静态 + 内部单例＝双重全局状态</text>
    <text x="28" y="320" font-size="10.5" fill="#92400e">取不到返回 null，判空靠自觉</text>
    <text x="28" y="340" font-size="10.5" fill="#92400e">offsetExists 与 offsetGet 分两次查，</text>
    <text x="28" y="358" font-size="10.5" fill="#92400e">单请求下不致命，常驻模型是隐患</text>
    <text x="28" y="382" font-size="10.5" font-weight="bold" fill="#991b1b">表跨请求存活 → 请求级数据会串号</text>
  </g>

  <g transform="translate(20,506)">
    <rect x="0" y="0" width="960" height="112" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">实测读数（PHP 8.0.2 CLI，Java / Go 输出逐行一致）</text>
    <text x="14" y="50" font-size="11" fill="#334155">1a_取回的是同一对象 : true　　1b_has 判断 : true　　1c_remove 之后 has : false</text>
    <text x="14" y="72" font-size="11" fill="#991b1b">1d_取未注册项 : 未注册：logger　　1e_重复注册 : 已注册，重复注册通常是 bug：mailer</text>
    <text x="14" y="98" font-size="11.5" font-weight="bold" fill="#92400e">对照容器：2a_get 之前构造次数 : 0，2b_两次 get 之后次数 : 1 —— 同一张表，创建时机完全不同。</text>
  </g>
</svg>
