<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
    <marker id="arwR" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#dc2626"/>
    </marker>
    <marker id="arwG" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">PHP 的单例只"单"一次请求：两种运行模型下的存活范围</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">同一份代码，php-fpm 每个请求都重造；常驻模型才是真的整个进程一份 —— 但代价跟着来</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="470" height="340" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. php-fpm：shared-nothing</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">请求结束 Zend 回收用户态内存，静态属性随之消失</text>

    <line x1="24" y1="150" x2="450" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="24" y="166" font-size="10" fill="#64748b">时间</text>

    <rect x="34" y="62" width="150" height="76" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="109" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">请求 1</text>
    <text x="109" y="102" text-anchor="middle" font-size="10.5" fill="#1e40af">instance() → 新建</text>
    <text x="109" y="122" text-anchor="middle" font-size="10.5" fill="#1e40af">set('env','prod')</text>

    <line x1="212" y1="56" x2="212" y2="150" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arwR)"/>
    <text x="222" y="76" font-size="10.5" fill="#991b1b">请求结束</text>
    <text x="222" y="94" font-size="10.5" fill="#991b1b">内存被回收</text>
    <text x="222" y="112" font-size="10.5" fill="#991b1b">$instance 归 null</text>

    <rect x="286" y="62" width="150" height="76" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="361" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">请求 2</text>
    <text x="361" y="102" text-anchor="middle" font-size="10.5" fill="#334155">instance() → 又新建</text>
    <text x="361" y="122" text-anchor="middle" font-size="10.5" fill="#991b1b">拿不到上一个请求的值</text>

    <text x="14" y="196" font-size="12" font-weight="bold" fill="#991b1b">⭐ 单例只「单」一次请求</text>
    <text x="14" y="222" font-size="11" fill="#334155">省的不是"每次请求的连接开销"—— 连接本来就随请求销毁</text>
    <text x="14" y="246" font-size="11" fill="#14532d">省的是"同一请求内重复 new 同一个东西"</text>
    <text x="14" y="276" font-size="11" fill="#334155">原文那段"极大降低资源耗费"在 php-fpm 下要这样收窄口径；</text>
    <text x="14" y="298" font-size="11" fill="#334155">在常驻进程（Java / Go / Swoole）里则完全成立。</text>
  </g>

  <g transform="translate(500,74)">
    <rect x="0" y="0" width="480" height="340" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. Swoole / RoadRunner / 常驻</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">整个进程生命周期内唯一，天然复用</text>

    <rect x="30" y="56" width="420" height="74" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="8"/>
    <text x="240" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">worker 进程：唯一实例活在这里</text>
    <text x="240" y="98" text-anchor="middle" font-size="10.5" fill="#14532d">首次 instance() 新建，之后全部复用</text>
    <text x="240" y="118" text-anchor="middle" font-size="10.5" fill="#14532d">连接池 / 客户端 / 配置：真的省掉了重复建立</text>

    <rect x="30" y="156" width="128" height="40" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
    <rect x="176" y="156" width="128" height="40" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
    <rect x="322" y="156" width="128" height="40" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
    <text x="94" y="181" text-anchor="middle" font-size="11" fill="#334155">请求 1</text>
    <text x="240" y="181" text-anchor="middle" font-size="11" fill="#334155">请求 2</text>
    <text x="386" y="181" text-anchor="middle" font-size="11" fill="#334155">请求 3</text>
    <line x1="94" y1="156" x2="94" y2="132" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>
    <line x1="240" y1="156" x2="240" y2="132" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>
    <line x1="386" y1="156" x2="386" y2="132" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>

    <text x="14" y="228" font-size="12" font-weight="bold" fill="#991b1b">代价：它变成跨请求共享状态</text>
    <text x="14" y="252" font-size="11" fill="#991b1b">① 里面存了用户态数据就会串号（与观察者篇的"注册表跨请求"同一件事）</text>
    <text x="14" y="276" font-size="11" fill="#334155">② 多进程不共享：每个 worker 各一份，"唯一"只在单进程内成立</text>
    <text x="14" y="300" font-size="11" fill="#334155">③ 协程下 ??= 没有并发保护 —— 要加锁</text>
  </g>

  <g transform="translate(20,424)">
    <rect x="0" y="0" width="960" height="76" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="12.5" font-weight="bold" fill="#0f172a">instance() 的作用域：php-fpm = 单个请求内唯一；Swoole 等常驻 = 整个进程生命周期；CLI = 单次进程运行</text>
    <text x="14" y="46" font-size="11.5" fill="#14532d">适合：连接 / 客户端对象、全进程只读配置、无状态工具类（日志、事件派发器）</text>
    <text x="14" y="66" font-size="11.5" fill="#991b1b">不适合：任何带请求级状态的对象（用户上下文、当前租户）—— 那会变成串数据的根源</text>
  </g>
</svg>
