<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">单例的"四私一公"与三条必须堵住的后门</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">私有构造只挡得住 new；clone 与反序列化要各自单独堵 —— 读数抄自第四节实测</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="430" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 唯一实例存放在类内部</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">不创建副本，而是向类内部存储的实例返回一个引用</text>

    <rect x="14" y="54" width="402" height="144" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" rx="6"/>
    <text x="215" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">final class Config</text>
    <line x1="14" y1="82" x2="416" y2="82" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="100" font-size="10.5" fill="#334155">private static ?self $instance</text>
    <text x="240" y="100" font-size="10.5" fill="#64748b">① 唯一实例的载体</text>
    <text x="28" y="122" font-size="10.5" fill="#334155">private function __construct()</text>
    <text x="240" y="122" font-size="10.5" fill="#64748b">② 挡 new</text>
    <text x="28" y="144" font-size="10.5" fill="#334155">private function __clone()</text>
    <text x="240" y="144" font-size="10.5" fill="#64748b">③ 挡 clone（须 private）</text>
    <text x="28" y="166" font-size="10.5" fill="#334155">public function __wakeup()</text>
    <text x="240" y="166" font-size="10.5" fill="#64748b">④ 挡反序列化（须 public）</text>
    <text x="28" y="188" font-size="10.5" fill="#1e40af">public static function instance()</text>
    <text x="240" y="188" font-size="10.5" fill="#64748b">⑤ 全局访问点</text>

    <text x="14" y="220" font-size="11" fill="#334155">四私一公 = 三个私有方法 + 一个私有属性 + 一个公共方法</text>
    <text x="14" y="244" font-size="11" fill="#92400e">final 不能省：子类 extends 后静态属性会被共享，语义错乱</text>
    <text x="14" y="266" font-size="11" fill="#334155">?self 而非 self：让"尚未创建"在类型系统里显式存在</text>
    <text x="14" y="288" font-size="11" fill="#92400e">??= new self() 天然幂等，但没有并发保护（协程下要加锁）</text>
  </g>

  <g transform="translate(460,74)">
    <rect x="0" y="0" width="520" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 三条后门：逐条堵，少一条就漏</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">第 2、3 条最容易被忽略，实测就是针对它们</text>

    <rect x="16" y="54" width="180" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="106" y="74" text-anchor="middle" font-size="11" fill="#1e40af">new Config()</text>
    <line x1="196" y1="69" x2="212" y2="69" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="218" y="74" font-size="11" fill="#14532d">私有 __construct 挡住 ✅</text>

    <rect x="16" y="106" width="180" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="106" y="126" text-anchor="middle" font-size="11" fill="#1e40af">clone $config</text>
    <line x1="196" y1="121" x2="212" y2="121" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="218" y="120" font-size="10.5" fill="#991b1b">Error - Call to private Config::__clone()</text>
    <text x="218" y="136" font-size="10.5" fill="#92400e">⚠️ 是 Error 不是异常：catch Exception 抓不到</text>

    <rect x="16" y="158" width="180" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="106" y="178" text-anchor="middle" font-size="10.5" fill="#1e40af">unserialize(serialize($c))</text>
    <line x1="196" y1="173" x2="212" y2="173" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="218" y="172" font-size="10.5" fill="#991b1b">LogicException - 单例不允许反序列化</text>
    <text x="218" y="188" font-size="10.5" fill="#334155">反序列化不走构造函数，只触发 __wakeup()</text>

    <rect x="16" y="202" width="488" height="82" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="222" font-size="11.5" font-weight="bold" fill="#92400e">原文写法的两个坑（本机实测过）</text>
    <text x="28" y="244" font-size="10.5" fill="#92400e">1. private function __wakeup(){} 报 Warning：must have public visibility</text>
    <text x="28" y="264" font-size="10.5" fill="#991b1b">2. 空实现挡不住：实测造出第二个实例 is_same_object: false</text>
    <text x="28" y="280" font-size="10.5" font-weight="bold" fill="#991b1b">可见性写错 + 空实现 = 完全没防（POP 链也靠这些入口打进去）</text>
  </g>

  <g transform="translate(20,388)">
    <rect x="0" y="0" width="960" height="160" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">C. 同样是"全局唯一"，两种形态的差别在谁保证唯一</text>

    <rect x="14" y="36" width="460" height="88" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="56" font-size="12" font-weight="bold" fill="#1e40af">形态一：类自己管单例</text>
    <text x="28" y="76" font-size="10.5" fill="#1e40af">两次 instance() 同一对象（实测 true），状态共享：prod</text>
    <text x="28" y="94" font-size="10.5" fill="#92400e">唯一性写死在类里：测什么都得先 Config::instance()</text>
    <text x="28" y="112" font-size="10.5" fill="#991b1b">⚠️ 它带着全局状态，没法换成替身</text>

    <rect x="486" y="36" width="460" height="88" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="500" y="56" font-size="12" font-weight="bold" fill="#14532d">形态二：交给容器（推荐）</text>
    <text x="500" y="76" font-size="10.5" fill="#14532d">同一 id 只造一次（实测 get 两次 true），Logger 仍是普通类</text>
    <text x="500" y="94" font-size="10.5" fill="#14532d">测试时可自由 new：实测 [test] hello</text>
    <text x="500" y="112" font-size="10.5" fill="#14532d">⭐ 唯一性与类解耦 —— 这是容器存在的理由</text>

    <text x="14" y="146" font-size="11.5" fill="#334155">第 5 行与第 6 行合起来才是重点：容器保证了"同一 id 只创建一次"，但 Logger 自己没有被写死成单例。</text>
  </g>
</svg>
