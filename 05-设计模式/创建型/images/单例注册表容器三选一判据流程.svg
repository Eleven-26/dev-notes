<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
    <marker id="arwO" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">单例 / 注册表 / 容器：四问过筛</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">判据只有一条主轴 —— 管的是「一个」还是「一组」，以及要不要「用到才造」</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="366" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">按顺序问，第一个「是」就是答案</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">越往下越现代；走到第 4 行说明压根不需要中央存储</text>

    <rect x="20" y="62" width="290" height="56" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="165" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">① 只管一个类的一个实例？</text>
    <text x="165" y="102" text-anchor="middle" font-size="10" fill="#92400e">没有 key、不需要替换</text>
    <line x1="310" y1="90" x2="330" y2="90" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="332" y="62" width="200" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="432" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">单例</text>
    <text x="432" y="102" text-anchor="middle" font-size="10" fill="#1e40af">Config::instance()</text>
    <line x1="532" y1="90" x2="552" y2="90" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="554" y="62" width="386" height="56" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="747" y="84" text-anchor="middle" font-size="11" fill="#334155">实例藏在类内部，写死在类里、不能替换</text>
    <text x="747" y="102" text-anchor="middle" font-size="10.5" fill="#64748b">PHP 下只「单」一次请求（见单例篇第五节）</text>

    <rect x="20" y="134" width="290" height="56" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="165" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">② 要按 key 存取一组对象？</text>
    <text x="165" y="174" text-anchor="middle" font-size="10" fill="#92400e">对象已经造好了</text>
    <line x1="310" y1="162" x2="330" y2="162" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="332" y="134" width="200" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="432" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">注册表</text>
    <text x="432" y="174" text-anchor="middle" font-size="10" fill="#1e40af">Registry::set/get</text>
    <line x1="532" y1="162" x2="552" y2="162" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="554" y="134" width="386" height="56" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="747" y="156" text-anchor="middle" font-size="11" fill="#991b1b">⚠️ 注册那一刻就构造，用不到也造了</text>
    <text x="747" y="174" text-anchor="middle" font-size="10.5" fill="#991b1b">全局静态 → 测试互相污染（第四节）</text>

    <rect x="20" y="206" width="290" height="56" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="165" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">③ 要「用到才造、只造一次」？</text>
    <text x="165" y="246" text-anchor="middle" font-size="10" fill="#92400e">还要能声明依赖</text>
    <line x1="310" y1="234" x2="330" y2="234" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="332" y="206" width="200" height="56" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="432" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">容器</text>
    <text x="432" y="246" text-anchor="middle" font-size="10" fill="#14532d">PSR-11 / Spring</text>
    <line x1="532" y1="234" x2="552" y2="234" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="554" y="206" width="386" height="56" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="747" y="228" text-anchor="middle" font-size="11" fill="#334155">存构造方案，第一次 get() 才创建并缓存</text>
    <text x="747" y="246" text-anchor="middle" font-size="10.5" fill="#64748b">实测 2a=0、2b=1 就是这条的证据</text>

    <rect x="20" y="278" width="290" height="56" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="165" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">④ 依赖要看得见？</text>
    <text x="165" y="318" text-anchor="middle" font-size="10" fill="#92400e">构造函数签名里能读出来</text>
    <line x1="310" y1="306" x2="330" y2="306" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="332" y="278" width="200" height="56" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="432" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">依赖注入</text>
    <text x="432" y="318" text-anchor="middle" font-size="10" fill="#14532d">构造注入 / wire</text>
    <line x1="532" y1="306" x2="552" y2="306" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="554" y="278" width="386" height="56" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="747" y="300" text-anchor="middle" font-size="11" fill="#334155">容器负责装配，业务代码不出现 get()</text>
    <text x="747" y="318" text-anchor="middle" font-size="10.5" fill="#64748b">这才是容器的现代用法，而不是 Service Locator</text>
  </g>

  <g transform="translate(20,452)">
    <rect x="0" y="0" width="960" height="100" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">三语言对「注册表」的态度</text>
    <text x="14" y="48" font-size="11.5" fill="#334155">PHP：原文的静态 Registry → 标准写法是可实例化类，实际项目里由 PSR-11 容器接管。</text>
    <text x="14" y="68" font-size="11.5" fill="#334155">Java：ServiceLocator 基本被判反模式；Spring 的 ApplicationContext 是容器一侧的对应物。</text>
    <text x="14" y="88" font-size="11.5" fill="#334155">Go：社区强烈反对全局表，标准做法是在 main() 里显式构造依赖并层层传递。</text>
  </g>
</svg>
