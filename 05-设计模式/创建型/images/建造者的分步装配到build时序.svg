<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
    <marker id="arwB" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">分步装配到 build()：建造者的调用时序与那条"不可变"前提</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">场景是 SQL 查询构建器；每个设置方法返回 $this，所以能链式，但链式不是它的本质</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="620" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>

    <rect x="55" y="52" width="70" height="40" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
    <rect x="255" y="52" width="130" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <rect x="475" y="52" width="130" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="90" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">调用方</text>
    <text x="90" y="86" text-anchor="middle" font-size="10" fill="#64748b">业务代码</text>
    <text x="320" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">QueryBuilder</text>
    <text x="320" y="86" text-anchor="middle" font-size="10" fill="#1e40af">Builder：持有可变状态</text>
    <text x="540" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">Query</text>
    <text x="540" y="86" text-anchor="middle" font-size="10" fill="#14532d">Product：只读</text>

    <line x1="90" y1="100" x2="90" y2="360" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="320" y1="100" x2="320" y2="360" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="540" y1="100" x2="540" y2="360" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

    <line x1="90" y1="126" x2="316" y2="126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="203" y="118" text-anchor="middle" font-size="10.5" fill="#334155">① new QueryBuilder('users')</text>
    <line x1="90" y1="160" x2="316" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="203" y="152" text-anchor="middle" font-size="10.5" fill="#334155">② select('id','name','email')</text>
    <line x1="90" y1="194" x2="316" y2="194" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="203" y="186" text-anchor="middle" font-size="10.5" fill="#334155">③ where("status = 'active'")</text>
    <line x1="90" y1="228" x2="316" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="203" y="220" text-anchor="middle" font-size="10.5" fill="#334155">④ orderBy('created_at DESC')</text>
    <line x1="90" y1="262" x2="316" y2="262" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="203" y="254" text-anchor="middle" font-size="10.5" fill="#334155">⑤ limit(20)</text>

    <rect x="228" y="272" width="264" height="24" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="4"/>
    <text x="360" y="288" text-anchor="middle" font-size="10.5" fill="#92400e">⑥ 校验在设置时：limit(0) 当场抛异常</text>

    <line x1="320" y1="316" x2="536" y2="316" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <text x="428" y="308" text-anchor="middle" font-size="10.5" fill="#1e40af">⑦ build() → new Query(...)</text>
    <line x1="90" y1="350" x2="536" y2="350" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="190" y="342" text-anchor="middle" font-size="10.5" fill="#334155">⑧ toSql()</text>

    <text x="14" y="320" font-size="10.5" fill="#64748b">①~⑤ 每步都</text>
    <text x="14" y="336" font-size="10.5" fill="#64748b">返回 $this</text>
  </g>

  <g transform="translate(650,74)">
    <rect x="0" y="0" width="330" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 实测读数（PHP 8.0.2 CLI）</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">第 2 组三行才是这一节的关键</text>

    <rect x="12" y="52" width="306" height="118" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="22" y="70" font-size="10" fill="#334155">2a_第一个产物 : SELECT * FROM orders WHERE paid = 1</text>
    <text x="22" y="88" font-size="10" fill="#334155">2b_派生第二个 : ... WHERE paid = 1 LIMIT 5</text>
    <text x="22" y="106" font-size="10" font-weight="bold" fill="#14532d">2c_第一个产物未变 : true</text>
    <text x="22" y="124" font-size="10" fill="#991b1b">3_非法参数被拦 : limit 必须为正数</text>
    <text x="22" y="142" font-size="10" fill="#334155">4_只给表名 : SELECT * FROM logs</text>
    <text x="22" y="162" font-size="10" fill="#334155">1_构建出的 SQL : SELECT id, name, email ... LIMIT 20</text>

    <text x="14" y="196" font-size="12.5" font-weight="bold" fill="#0f172a">同一个 builder 可反复派生</text>
    <text x="14" y="220" font-size="11" fill="#334155">$base->build() 之后再加 limit() 重新 build，</text>
    <text x="14" y="240" font-size="11" fill="#334155">已交出去的产物不受影响（2c 为 true）。</text>
    <text x="14" y="268" font-size="11.5" font-weight="bold" fill="#92400e">⚠️ 前提：产品必须不可变</text>
    <text x="14" y="290" font-size="11" fill="#334155">Query 只有 getter 与 toSql()：造完还能改，</text>
    <text x="14" y="310" font-size="11" fill="#334155">"分步构造"就失去意义了。</text>
    <text x="14" y="338" font-size="11" fill="#334155">build() 应当无参、无副作用，可反复调用；</text>
    <text x="14" y="358" font-size="11" fill="#334155">有副作用会让"链到一半 build"不可预期。</text>
    <text x="14" y="382" font-size="11" fill="#14532d">链式是最常见的书写形式，不是本质。</text>
  </g>

  <g transform="translate(20,488)">
    <rect x="0" y="0" width="960" height="60" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="11.5" fill="#334155">四个角色：Builder 定义分步接口（QueryBuilder）、ConcreteBuilder 记录已设置的部分、Director 封装固定流程（可选）、Product 是最终产物（Query）。</text>
    <text x="14" y="46" font-size="11.5" fill="#92400e">本目录没写 Director：它只在"同一套流程要反复用于不同 builder"时才有价值，业务里构造流程多是一次性的，直接链式更清楚。</text>
  </g>
</svg>
