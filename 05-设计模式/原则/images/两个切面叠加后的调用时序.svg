<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
    <marker id="arwR" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#dc2626"/>
    </marker>
    <marker id="arwO" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">两个切面叠加后，一次调用到底经过了谁</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">实测场景 5：LoggingAspect 包住 CallAspectWithInterface —— 装饰器式与 __call 式叠在同一条链上</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="650" height="460" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>

    <rect x="48" y="52" width="64" height="44" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
    <rect x="168" y="52" width="115" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <rect x="330" y="52" width="150" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <rect x="520" y="52" width="110" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="6"/>
    <text x="80" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">调用方</text>
    <text x="80" y="88" text-anchor="middle" font-size="10" fill="#64748b">客户端</text>
    <text x="225" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">LoggingAspect</text>
    <text x="225" y="88" text-anchor="middle" font-size="10" fill="#1e40af">装饰器式切面</text>
    <text x="405" y="70" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">CallAspectWithInterface</text>
    <text x="405" y="88" text-anchor="middle" font-size="10" fill="#14532d">__call 式切面</text>
    <text x="575" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">RealUserService</text>
    <text x="575" y="88" text-anchor="middle" font-size="10" fill="#991b1b">业务本体</text>

    <line x1="80" y1="105" x2="80" y2="410" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="225" y1="105" x2="225" y2="410" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="405" y1="105" x2="405" y2="410" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="575" y1="105" x2="575" y2="410" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

    <line x1="80" y1="130" x2="221" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="150" y="122" text-anchor="middle" font-size="11" fill="#334155">① rename(10,'Dan')</text>
    <text x="225" y="152" text-anchor="middle" font-size="10.5" fill="#1e40af">先 start 计时</text>

    <line x1="225" y1="178" x2="401" y2="178" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="313" y="170" text-anchor="middle" font-size="11" fill="#334155">② 转发 rename(...)</text>

    <rect x="322" y="198" width="166" height="22" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="4"/>
    <text x="405" y="213" text-anchor="middle" font-size="10.5" fill="#92400e">③ 显式转 __call(...)</text>

    <line x1="405" y1="240" x2="571" y2="240" stroke="#b45309" stroke-width="1.5" marker-end="url(#arwO)"/>
    <text x="488" y="232" text-anchor="middle" font-size="11" fill="#92400e">④ target-&gt;rename(...)</text>
    <text x="575" y="262" text-anchor="middle" font-size="10.5" fill="#991b1b">⑤ 记下 before/after</text>

    <line x1="575" y1="288" x2="409" y2="288" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arwR)"/>
    <text x="492" y="280" text-anchor="middle" font-size="11" fill="#991b1b">⑥ user#10 -&gt; Dan</text>

    <line x1="405" y1="320" x2="229" y2="320" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arwR)"/>
    <text x="317" y="312" text-anchor="middle" font-size="11" fill="#991b1b">⑦ mixed（类型退化）</text>

    <line x1="225" y1="360" x2="84" y2="360" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arwR)"/>
    <text x="152" y="352" text-anchor="middle" font-size="11" fill="#1e40af">⑧ string（类型保住）</text>

    <text x="14" y="400" font-size="12" font-weight="bold" fill="#14532d">每层拦到的方法名与参数完全一致 —— 这正是装饰器能叠级的原因</text>
    <text x="14" y="424" font-size="11.5" fill="#334155">两个切面都实现 UserService，所以外层可以只认接口、不认内层是谁</text>
  </g>

  <g transform="translate(680,74)">
    <rect x="0" y="0" width="300" height="460" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 实测读数</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">PHP 8.0.2 CLI，逐行抄自正文</text>

    <rect x="12" y="52" width="276" height="98" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="22" y="70" font-size="10.5" fill="#334155">1_装饰器式返回值 : user#7 -&gt; Ann</text>
    <text x="22" y="88" font-size="10.5" fill="#334155">2_装饰器式日志 : rename(7) 0.012ms</text>
    <text x="22" y="106" font-size="10.5" fill="#334155">3a___call 式返回值 : user#8 -&gt; Bob</text>
    <text x="22" y="124" font-size="10.5" fill="#334155">3b___call 式日志 : before/after</text>
    <text x="22" y="142" font-size="10.5" fill="#92400e">5_两种切面叠加 : user#10 -&gt; Dan</text>

    <text x="14" y="176" font-size="13" font-weight="bold" fill="#0f172a">两种写法的取舍</text>
    <text x="14" y="200" font-size="11" fill="#14532d">装饰器式：类型安全、IDE 可跳转</text>
    <text x="14" y="222" font-size="11" fill="#92400e">代价：加一个方法要转发一次</text>
    <text x="14" y="246" font-size="11" fill="#14532d">__call 式：不用转发就能拦任意方法</text>
    <text x="14" y="268" font-size="11" fill="#92400e">代价：返回值退化成 mixed</text>

    <rect x="12" y="284" width="276" height="60" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="6"/>
    <text x="22" y="302" font-size="11" font-weight="bold" fill="#991b1b">最关键的坑（第 4 行实测）</text>
    <text x="22" y="322" font-size="10.5" fill="#991b1b">__call 只在"未定义方法"时触发 ——</text>
    <text x="22" y="338" font-size="10.5" fill="#991b1b">实现接口后必须显式转发，否则拦不到</text>

    <text x="14" y="368" font-size="11.5" fill="#334155">PHP 没有静态织入：这条链全靠手写。</text>
    <text x="14" y="390" font-size="11.5" fill="#14532d">好处是可读性 —— 一次调用经过了哪些</text>
    <text x="14" y="412" font-size="11.5" fill="#14532d">切面，读代码就能看出来，不靠编译器。</text>
  </g>

  <g transform="translate(20,544)">
    <rect x="0" y="0" width="960" height="56" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="12.5" font-weight="bold" fill="#0f172a">一句话</text>
    <text x="14" y="44" font-size="12" fill="#334155">切面不是"自动生效"的：PHP 里它就是包在对象外面的一层代理，日志、事务、计时都要显式写在这层的转发方法里。</text>
    <text x="200" y="24" font-size="12" fill="#334155">与 Java 运行期生成代理相比 —— 多写几行，但少一层黑盒，读代码就能数清经过了谁。</text>
  </g>
</svg>
