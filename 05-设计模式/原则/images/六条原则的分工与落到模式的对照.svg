<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">六条原则在做同一件事：把「变化」关进一个可替换的单元</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">区别只在于「变化」在哪里：职责（SRP）、扩展点（OCP）、实现（LSP / DIP）、依赖面（LoD / ISP）</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="540" height="460" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
    <text x="16" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 六条原则各自回答什么（原文定义）</text>

    <rect x="14" y="38" width="512" height="54" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="26" y="59" font-size="11" font-weight="bold" fill="#1e40af">1 单一职责 SRP</text>
    <text x="514" y="59" font-size="10.5" fill="#1e40af" text-anchor="end">变的是「职责」</text>
    <text x="26" y="79" font-size="10.5" fill="#1e40af">有且只有一个原因引起类的变更，不能有多个导致变更的原因</text>

    <rect x="14" y="96" width="512" height="54" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="26" y="117" font-size="11" font-weight="bold" fill="#14532d">2 开闭原则 OCP</text>
    <text x="514" y="117" font-size="10.5" fill="#14532d" text-anchor="end">变的是「扩展点」</text>
    <text x="26" y="137" font-size="10.5" fill="#14532d">一个类、模块或函数应该对扩展来实现变化，对修改关闭</text>

    <rect x="14" y="154" width="512" height="54" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="26" y="175" font-size="11" font-weight="bold" fill="#92400e">3 里氏替换 LSP</text>
    <text x="514" y="175" font-size="10.5" fill="#92400e" text-anchor="end">变的是「实现」</text>
    <text x="26" y="195" font-size="10.5" fill="#92400e">所有引用基类的地方必须能透明地使用其子类的对象</text>

    <rect x="14" y="212" width="512" height="54" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
    <text x="26" y="233" font-size="11" font-weight="bold" fill="#334155">4 迪米特法则 LoD</text>
    <text x="514" y="233" font-size="10.5" fill="#334155" text-anchor="end">变的是「依赖面」</text>
    <text x="26" y="253" font-size="10.5" fill="#334155">一个类应该对自己需要耦合或者调用的类知道得最少</text>

    <rect x="14" y="270" width="512" height="54" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
    <text x="26" y="291" font-size="11" font-weight="bold" fill="#334155">5 接口隔离 ISP</text>
    <text x="514" y="291" font-size="10.5" fill="#334155" text-anchor="end">变的是「依赖面」</text>
    <text x="26" y="311" font-size="10.5" fill="#334155">客户端不应依赖它不需要的接口；依赖关系建立在最小接口上</text>

    <rect x="14" y="328" width="512" height="54" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="26" y="349" font-size="11" font-weight="bold" fill="#92400e">6 依赖倒置 DIP</text>
    <text x="514" y="349" font-size="10.5" fill="#92400e" text-anchor="end">变的是「实现」</text>
    <text x="26" y="369" font-size="10.5" fill="#92400e">抽象不依赖细节，细节依赖抽象；高层与底层都依赖抽象</text>

    <text x="16" y="404" font-size="10.5" fill="#334155">第七条（不在六大之列，但同样重要）：<tspan font-weight="bold">优先使用组合而不是继承</tspan></text>
    <text x="16" y="424" font-size="10.5" fill="#334155">装饰器、组合、代理都是它的产物</text>
    <text x="16" y="446" font-size="10.5" fill="#14532d">⭐ 共同点：把变化关进一个可替换的单元，让不变的部分不受影响</text>
  </g>

  <g transform="translate(570,74)">
    <rect x="0" y="0" width="410" height="270" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
    <text x="16" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 六条原则落到哪些模式</text>

    <text x="16" y="52" font-size="10.5" fill="#334155"><tspan font-weight="bold">SRP → </tspan>几乎所有模式的共同前提（工厂只管造、观察者只管通知）</text>
    <text x="16" y="80" font-size="10.5" fill="#334155"><tspan font-weight="bold">OCP → </tspan>策略、工厂方法、过滤器</text>
    <text x="16" y="108" font-size="10.5" fill="#334155"><tspan font-weight="bold">LSP → </tspan>原型（clone 语义要一致）、组合（叶子与容器可互换）</text>
    <text x="16" y="136" font-size="10.5" fill="#334155"><tspan font-weight="bold">LoD → </tspan>外观、代理</text>
    <text x="16" y="164" font-size="10.5" fill="#334155"><tspan font-weight="bold">ISP → </tspan>适配器（只声明真正需要的）、迭代器</text>
    <text x="16" y="192" font-size="10.5" fill="#334155"><tspan font-weight="bold">DIP → </tspan>工厂、单例（容器 singleton）、观察者</text>
    <text x="16" y="220" font-size="10.5" fill="#334155"><tspan font-weight="bold">组合优于继承 → </tspan>装饰器、组合、代理</text>
    <text x="16" y="248" font-size="10.5" fill="#64748b">每个模式本质上都是某条原则的具体解法</text>
  </g>

  <g transform="translate(570,364)">
    <rect x="0" y="0" width="410" height="170" fill="#f8fafc" stroke="#dc2626" stroke-width="1.2" rx="10"/>
    <text x="16" y="24" font-size="15" font-weight="bold" fill="#991b1b">C. 违反后的具体症状（反例才是判据）</text>
    <text x="16" y="46" font-size="10.5" fill="#991b1b">SRP：改邮箱规则要动注册逻辑，改注册要重测发信</text>
    <text x="16" y="64" font-size="10.5" fill="#991b1b">OCP：每加一种类型都要改同一个方法并重跑全部测试</text>
    <text x="16" y="82" font-size="10.5" fill="#991b1b">LSP：换成子类后，原来能跑的边界值抛异常</text>
    <text x="16" y="100" font-size="10.5" fill="#991b1b">LoD：Address 改名，所有调用点编译失败</text>
    <text x="16" y="118" font-size="10.5" fill="#991b1b">ISP：实现类里出现空方法或 NotSupported 异常</text>
    <text x="16" y="136" font-size="10.5" fill="#991b1b">DIP：无法为高层写单测，因为它自己 new 了低层</text>
    <text x="16" y="158" font-size="10.5" font-weight="bold" fill="#0f172a">判断原则有没有被遵守，看改动会波及多少地方</text>
  </g>
</svg>
