<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
    <marker id="arwG" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#16a34a"/>
    </marker>
    <marker id="arwB" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">横切关注点：OOP 管得到"从上到下"，管不到"从左到右"</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">左：日志代码水平散布在每一层；右：抽成一个切面后，核心流程只剩一条竖线</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="470" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 未抽切面：每一层都手写一遍</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">原文：日志代码往往水平地散布在所有对象层次中</text>

    <rect x="16" y="54" width="438" height="52" fill="#fef3c7"/>
    <rect x="16" y="114" width="438" height="52" fill="#fef3c7"/>
    <rect x="16" y="174" width="438" height="52" fill="#fef3c7"/>

    <rect x="26" y="66" width="120" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <rect x="26" y="126" width="120" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <rect x="26" y="186" width="120" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="86" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">控制器层</text>
    <text x="86" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">服务层</text>
    <text x="86" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">仓储层</text>

    <line x1="86" y1="96" x2="86" y2="122" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="86" y1="156" x2="86" y2="182" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <text x="160" y="86" font-size="11" fill="#92400e">logger-&gt;info(...)   // 与路由无关</text>
    <text x="160" y="146" font-size="11" fill="#92400e">logger-&gt;info(...)   // 与业务无关</text>
    <text x="160" y="206" font-size="11" fill="#92400e">logger-&gt;info(...)   // 与存储无关</text>

    <text x="16" y="248" font-size="12" font-weight="bold" fill="#991b1b">⚠️ 同一件事写了三遍：改一次日志格式要动三层</text>
    <text x="16" y="272" font-size="11" fill="#64748b">原文：OOP 允许你定义从上到下的关系，但并不适合定义从左到右的关系</text>
  </g>

  <g transform="translate(500,74)">
    <rect x="0" y="0" width="480" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 抽成切面：核心关注点只剩一条竖线</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">原文：AOP 把系统分成核心关注点与横切关注点</text>

    <rect x="26" y="66" width="140" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <rect x="26" y="126" width="140" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <rect x="26" y="186" width="140" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="96" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">控制器层</text>
    <text x="96" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">服务层</text>
    <text x="96" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">仓储层</text>
    <line x1="96" y1="96" x2="96" y2="122" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="96" y1="156" x2="96" y2="182" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="300" y="76" width="164" height="176" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="10"/>
    <text x="382" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">LoggingAspect</text>
    <text x="382" y="124" text-anchor="middle" font-size="11" fill="#14532d">耗时统计只写一次</text>
    <text x="382" y="146" text-anchor="middle" font-size="11" fill="#14532d">三处都拦得到</text>
    <text x="382" y="168" text-anchor="middle" font-size="11" fill="#14532d">业务代码零改动</text>
    <text x="382" y="196" text-anchor="middle" font-size="11" fill="#92400e">代价：加方法要转发</text>
    <text x="382" y="220" text-anchor="middle" font-size="10.5" fill="#14532d">= 原文说的 aspect</text>

    <line x1="298" y1="90" x2="172" y2="82" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arwG)"/>
    <line x1="298" y1="148" x2="172" y2="142" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arwG)"/>
    <line x1="298" y1="206" x2="172" y2="202" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arwG)"/>

    <text x="14" y="252" font-size="11" fill="#334155">横切关注点的特性：经常发生在核心关注点的多处，而各处都基本相似</text>
    <text x="14" y="276" font-size="12" font-weight="bold" fill="#14532d">⭐ 通用服务与商业逻辑分离 —— AOP 是 OOP 的补充和完善</text>
  </g>

  <g transform="translate(20,388)">
    <rect x="0" y="0" width="960" height="150" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">C. 术语与实现技术（读 Spring / 框架文档会反复遇到）</text>

    <text x="20" y="52" font-size="11.5" fill="#334155"><tspan font-weight="bold">join point 连接点</tspan> = 被包装对象的方法</text>
    <text x="20" y="74" font-size="11.5" fill="#334155"><tspan font-weight="bold">point cut 切入点</tspan> = 装饰器里那次转发调用</text>
    <text x="20" y="96" font-size="11.5" fill="#334155"><tspan font-weight="bold">advice 通知</tspan> = 转发前后的那几行</text>
    <text x="20" y="118" font-size="11.5" fill="#334155"><tspan font-weight="bold">aspect 方面</tspan> = 一个装饰器类（横向关系）</text>
    <text x="20" y="140" font-size="11.5" fill="#64748b"><tspan font-weight="bold">introduce 引入</tspan> = PHP 无原生支持</text>

    <text x="500" y="52" font-size="11.5" fill="#334155"><tspan font-weight="bold">动态代理</tspan>：运行时生成代理拦截 → Java ✅ / PHP 手写 ✅</text>
    <text x="500" y="74" font-size="11.5" fill="#991b1b"><tspan font-weight="bold">静态织入</tspan>：编译期插进字节码 → PHP 没有这个机制</text>
    <text x="500" y="96" font-size="11.5" fill="#334155">两种切面可叠加（都实现同一接口）：实测 user#10 -&gt; Dan</text>
    <text x="500" y="118" font-size="11.5" fill="#92400e">⚠️ __call 只在调用"未定义方法"时触发 → 实现接口的类要显式转发</text>
    <text x="500" y="140" font-size="11.5" fill="#334155">PHP 的四种手法：装饰器 / 闭包管道 / __call 代理 / 属性 + 反射</text>
  </g>
</svg>
