<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">PHP 里没有"织入"：四种切面手法怎么选</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">从上往下依次问，命中即停 —— 四条路的"类型安全"与"要不要写转发"正好相反</text>

  <g transform="translate(20,78)">
    <rect x="0" y="0" width="290" height="64" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="145" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">① 它是每次请求都要过的逻辑吗？</text>
    <text x="145" y="46" text-anchor="middle" font-size="10.5" fill="#92400e">鉴权、计时、请求日志 —— 与具体对象无关</text>
  </g>
  <line x1="310" y1="110" x2="328" y2="110" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(330,78)">
    <rect x="0" y="0" width="210" height="64" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="105" y="26" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">闭包管道 / 中间件</text>
    <text x="105" y="46" text-anchor="middle" font-size="10.5" fill="#14532d">洋葱式 fn($next)</text>
  </g>
  <line x1="540" y1="110" x2="558" y2="110" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(560,78)">
    <rect x="0" y="0" width="420" height="64" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="14" y="26" font-size="11" fill="#334155">框架最常用的一种：Laravel 的 Middleware、Symfony 的事件都长这个形状。</text>
    <text x="14" y="48" font-size="11" fill="#92400e">代价：一层套一层，请求链越长越要按顺序数着读。</text>
  </g>

  <g transform="translate(20,150)">
    <rect x="0" y="0" width="290" height="64" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="145" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">② 被拦的类实现了接口吗？</text>
    <text x="145" y="46" text-anchor="middle" font-size="10.5" fill="#92400e">接口方法必须显式转发，否则 __call 不触发</text>
  </g>
  <line x1="310" y1="182" x2="328" y2="182" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(330,150)">
    <rect x="0" y="0" width="210" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="105" y="26" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">装饰器式切面（推荐）</text>
    <text x="105" y="46" text-anchor="middle" font-size="10.5" fill="#1e40af">本篇 3.1</text>
  </g>
  <line x1="540" y1="182" x2="558" y2="182" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(560,150)">
    <rect x="0" y="0" width="420" height="64" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="14" y="26" font-size="11" fill="#14532d">✅ 类型安全、IDE 可跳转、返回值仍是 string（实测 user#7 -&gt; Ann）</text>
    <text x="14" y="48" font-size="11" fill="#92400e">代价：每加一个方法都要在这里转发一次</text>
  </g>

  <g transform="translate(20,222)">
    <rect x="0" y="0" width="290" height="64" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="145" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">③ 方法很多、又不要类型检查？</text>
    <text x="145" y="46" text-anchor="middle" font-size="10.5" fill="#92400e">动态性优先，愿意牺牲类型</text>
  </g>
  <line x1="310" y1="254" x2="328" y2="254" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(330,222)">
    <rect x="0" y="0" width="210" height="64" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="105" y="26" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">__call 代理</text>
    <text x="105" y="46" text-anchor="middle" font-size="10.5" fill="#14532d">本篇 3.2（原文写法）</text>
  </g>
  <line x1="540" y1="254" x2="558" y2="254" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(560,222)">
    <rect x="0" y="0" width="420" height="64" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="14" y="26" font-size="11" fill="#14532d">✅ 一行转发都不写就能拦任意方法（实测 before/after rename）</text>
    <text x="14" y="48" font-size="11" fill="#991b1b">⚠️ 返回值退化成 mixed、IDE 不认、接口方法要显式转发</text>
  </g>

  <g transform="translate(20,294)">
    <rect x="0" y="0" width="290" height="64" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="145" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">④ 想按"注解"声明式地拦？</text>
    <text x="145" y="46" text-anchor="middle" font-size="10.5" fill="#92400e">希望调用处只写一个标记</text>
  </g>
  <line x1="310" y1="326" x2="328" y2="326" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(330,294)">
    <rect x="0" y="0" width="210" height="64" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="105" y="26" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">属性 + 反射</text>
    <text x="105" y="46" text-anchor="middle" font-size="10.5" fill="#334155">最接近注解驱动</text>
  </g>
  <line x1="540" y1="326" x2="558" y2="326" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
  <g transform="translate(560,294)">
    <rect x="0" y="0" width="420" height="64" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="14" y="26" font-size="11" fill="#334155">要自己扫描属性、自己建代理、自己转发 —— 等于手写一个 mini AOP。</text>
    <text x="14" y="48" font-size="11" fill="#92400e">代价：启动期开销 + 一层新的黑盒，收益只在"切面特别多"时才划算</text>
  </g>

  <g transform="translate(20,372)">
    <rect x="0" y="0" width="960" height="210" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">四条路的共同前提：都是"运行时手工代理"。对照 Java 与 Go（§五 §六 §七）</text>

    <rect x="14" y="36" width="300" height="122" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="164" y="58" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">PHP：显式手写</text>
    <text x="26" y="80" font-size="11" fill="#1e40af">静态织入：没有通用机制</text>
    <text x="26" y="100" font-size="11" fill="#1e40af">切面要有人显式包上，忘了包</text>
    <text x="26" y="118" font-size="11" fill="#1e40af">就等于横切逻辑静默失效</text>
    <text x="26" y="142" font-size="11" fill="#14532d">好处：读代码就知道经过了谁</text>

    <rect x="330" y="36" width="300" height="122" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="480" y="58" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">Java：运行期生成代理</text>
    <text x="342" y="80" font-size="11" fill="#14532d">InvocationHandler + Proxy</text>
    <text x="342" y="100" font-size="11" fill="#14532d">实测代理类 $Proxy0，源码里不存在</text>
    <text x="342" y="118" font-size="11" fill="#14532d">业务类一行未改；代理还能再被代理</text>
    <text x="342" y="142" font-size="11" fill="#991b1b">⚠️ 同类内部调用不走代理（事务失效）</text>

    <rect x="646" y="36" width="300" height="122" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="796" y="58" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">Go：函数式中间件</text>
    <text x="658" y="80" font-size="11" fill="#92400e">func(next HandlerFunc) HandlerFunc</text>
    <text x="658" y="100" font-size="11" fill="#92400e">Chain(business, Timing, Logging)</text>
    <text x="658" y="118" font-size="11" fill="#92400e">组装顺序即执行顺序（洋葱模型）</text>
    <text x="658" y="142" font-size="11" fill="#14532d">实测 handled:order-1、before/after</text>

    <text x="14" y="178" font-size="11.5" font-weight="bold" fill="#0f172a">⭐ 三语言共通：都不改业务代码，代价都是"控制流变得不直观"。</text>
    <text x="14" y="198" font-size="11.5" fill="#334155">第八节判据：切面适合"各处都基本相似、且与业务无关"的逻辑；一旦它开始依赖业务细节，就不再是横切关注点，而是被藏起来的业务逻辑。</text>
  </g>
</svg>
