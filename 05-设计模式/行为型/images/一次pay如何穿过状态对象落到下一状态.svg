<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一次 pay() 怎么走：Order 只转发，「去哪」由当前状态类决定</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">对照实测第 3、4 行：合法迁移会 printf 出「旧状态 → 新状态」，非法迁移在状态类里直接抛 LogicException</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="660" height="470" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>

    <rect x="20" y="56" width="100" height="28" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
    <text x="70" y="74" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#334155">调用方</text>
    <rect x="190" y="56" width="100" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="240" y="74" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">Order</text>
    <rect x="380" y="56" width="100" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="430" y="74" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">当前状态对象</text>
    <rect x="550" y="56" width="100" height="28" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="600" y="74" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">stdout</text>

    <line x1="70" y1="84" x2="70" y2="350" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="240" y1="84" x2="240" y2="350" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="430" y1="84" x2="430" y2="350" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="600" y1="84" x2="600" y2="350" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

    <text x="14" y="102" font-size="11.5" font-weight="bold" fill="#1e40af">第 1 笔：pay() —— 走的是 PendingPayment 里那条边（实测 3）</text>
    <text x="155" y="120" text-anchor="middle" font-size="9" fill="#64748b">$order-&gt;pay()</text>
    <line x1="70" y1="126" x2="238" y2="126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="335" y="146" text-anchor="middle" font-size="9" fill="#64748b">$this-&gt;state-&gt;pay($this)　Order 不做任何判断</text>
    <line x1="240" y1="152" x2="428" y2="152" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="335" y="176" text-anchor="middle" font-size="9" fill="#14532d">transitionTo(new Paid())　「去哪」写在状态类里</text>
    <line x1="430" y1="182" x2="242" y2="182" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="420" y="206" text-anchor="middle" font-size="9" fill="#92400e">state = $next，再 printf(id, state-&gt;name(), next-&gt;name())</text>
    <line x1="240" y1="212" x2="598" y2="212" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="14" y="236" font-size="10" fill="#14532d">SO-1001: 待支付 → 已支付　←　实测第 3 行下面那行缩进输出就是这句 printf</text>

    <text x="14" y="266" font-size="11.5" font-weight="bold" fill="#991b1b">第 2 笔：重复 pay() —— Paid 没有这条边（实测 4）</text>
    <text x="155" y="284" text-anchor="middle" font-size="9" fill="#64748b">$order-&gt;pay()</text>
    <line x1="70" y1="290" x2="238" y2="290" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="335" y="310" text-anchor="middle" font-size="9" fill="#64748b">$this-&gt;state-&gt;pay($this)，此刻 state 是 Paid</text>
    <line x1="240" y1="316" x2="428" y2="316" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="300" y="330" width="300" height="52" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="314" y="352" font-size="9.5" font-weight="bold" fill="#991b1b">reject('支付')</text>
    <text x="314" y="374" font-size="9" fill="#991b1b">throw new LogicException('当前状态「已支付」不允许「支付」')</text>

    <text x="14" y="408" font-size="10" fill="#991b1b">实测 4_重复支付 : 拒绝：当前状态「已支付」不允许「支付」　｜　6_发货后取消、8_终态再取消 同理</text>
    <text x="14" y="430" font-size="10" fill="#334155">Order 里一处 if 都没有：动作分支全在状态类里。延伸追问给的做法是 —— grep transitionTo 就能把整张状态图画出来</text>
    <text x="14" y="452" font-size="10" fill="#14532d">实测 9_共享同一状态对象 : true（PHP 用静态池 shared()，Go 用空结构体）｜ 10_但状态不存实例数据 : 订单表里存的是状态名「待支付」</text>
  </g>

  <g transform="translate(700,74)">
    <rect x="0" y="0" width="280" height="470" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 第三节：先问要不要类</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">转移规则只是一张表时，用表就够了</text>

    <rect x="14" y="56" width="252" height="126" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="26" y="76" font-size="11" font-weight="bold" fill="#92400e">const TRANSITIONS = [</text>
    <text x="26" y="96" font-size="9" fill="#92400e">'待支付' =&gt; ['pay' =&gt; '已支付', 'cancel' =&gt; '已取消'],</text>
    <text x="26" y="114" font-size="9" fill="#92400e">'已支付' =&gt; ['ship' =&gt; '已发货', 'cancel' =&gt; '已取消'],</text>
    <text x="26" y="132" font-size="9" fill="#92400e">'已发货' =&gt; ['confirm' =&gt; '已完成'],</text>
    <text x="26" y="150" font-size="9" fill="#92400e">'已完成' =&gt; []，'已取消' =&gt; []</text>
    <text x="26" y="172" font-size="9.5" fill="#92400e">表本身就是图，还能直接喂给前端画状态图</text>

    <text x="14" y="204" font-size="10" fill="#14532d">实测 4_表驱动·pay : 待支付 → 已支付</text>
    <text x="14" y="224" font-size="10" fill="#334155">5_表驱动·重复 pay : 拒绝…不允许「pay」</text>
    <text x="14" y="244" font-size="10" font-weight="bold" fill="#0f172a">输出与状态类版完全一致：40 行 vs 200 行</text>

    <rect x="14" y="262" width="252" height="112" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="26" y="282" font-size="11" font-weight="bold" fill="#14532d">这三条成立才用状态类</text>
    <text x="26" y="302" font-size="9.5" fill="#14532d">转移还要看别的条件（金额、等级）</text>
    <text x="26" y="320" font-size="9.5" fill="#14532d">状态要携带数据（部分发货，已发 2 件）</text>
    <text x="26" y="338" font-size="9.5" fill="#14532d">转移时要做不同的事（发通知、写日志）</text>
    <text x="26" y="360" font-size="9.5" font-weight="bold" fill="#991b1b">混用是常态，别整篇二选一</text>

    <text x="14" y="392" font-size="10" fill="#991b1b">⚠️ 反过来的坑：某个状态一旦冒出「自己的</text>
    <text x="14" y="412" font-size="10" fill="#991b1b">数据」，表就退化成「表里塞 JSON」</text>
    <text x="14" y="436" font-size="10" fill="#334155">PHP 8.1+ 可用 enum 拿到强类型，但本仓库</text>
    <text x="14" y="456" font-size="10" fill="#334155">验证环境只到 8.0.2，故正文未采用</text>
  </g>

  <g transform="translate(20,556)">
    <rect x="0" y="0" width="960" height="116" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="12" font-weight="bold" fill="#0f172a">第五节判据：状态之间有「下一步」，策略之间没有</text>
    <text x="14" y="46" font-size="11" fill="#334155">两者结构几乎一样（都是「把一段行为搬到一个类里，由 Context 转发」），区别在有没有转移 —— 状态对象会把自己换成下一个状态，策略对象不会</text>
    <text x="14" y="66" font-size="11" fill="#334155">第七节三语言：PHP $order-&gt;transitionTo(new Paid())｜Java order.transitionTo(new Paid())｜Go o.transitionTo(paid{})，空结构体可比较、天然共享</text>
    <text x="14" y="86" font-size="11" fill="#334155">Java 版每次 new 所以「共享同一状态对象」判定是 false —— 改成引用 enum 常量即可与 PHP/Go 对齐</text>
    <text x="14" y="106" font-size="11" fill="#991b1b">⚠️ Java 别存 enum.ordinal()：枚举顺序一改，历史数据的含义全变 —— 存 name() 或显式的 code 字段</text>
  </g>
</svg>
