<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">备忘录的三个角色：负责人手里有一堆快照，却读不出快照里是什么</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">「宽接口给原发器、窄接口给负责人」是备忘录的灵魂 —— 快照字段全 private、类是 final，负责人只能 push / pop</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="600" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 谁持有谁</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">Originator = TextEditor，Caretaker = SnapshotHistory，快照 = EditorSnapshot</text>

    <rect x="20" y="60" width="260" height="118" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="8"/>
    <text x="150" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">final class TextEditor（原发器）</text>
    <text x="34" y="102" font-size="9.5" fill="#1e40af">type(string $text) / setTitle(string $t)</text>
    <text x="34" y="120" font-size="9.5" fill="#1e40af">save(): EditorSnapshot</text>
    <text x="34" y="138" font-size="9.5" fill="#1e40af">restore(EditorSnapshot $snapshot): void</text>
    <text x="34" y="160" font-size="9.5" font-weight="bold" fill="#991b1b">save() 里要 clone $this-&gt;meta</text>

    <rect x="320" y="60" width="260" height="118" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="8"/>
    <text x="450" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">final class EditorSnapshot</text>
    <text x="334" y="102" font-size="9.5" fill="#14532d">private string $content / int $cursor</text>
    <text x="334" y="120" font-size="9.5" fill="#14532d">private Meta $meta（构造时定死）</text>
    <text x="334" y="138" font-size="9.5" fill="#14532d">宽接口：content() cursor() meta()</text>
    <text x="334" y="160" font-size="9.5" fill="#14532d">窄接口：summary(): string</text>

    <rect x="20" y="230" width="260" height="82" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="150" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">final class SnapshotHistory（负责人）</text>
    <text x="34" y="272" font-size="9.5" fill="#334155">__construct(private int $limit = 10)</text>
    <text x="34" y="290" font-size="9.5" fill="#334155">push(EditorSnapshot) / pop(): ?EditorSnapshot / size()</text>

    <rect x="320" y="230" width="260" height="82" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="450" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">final class Meta（可变的状态对象）</text>
    <text x="334" y="272" font-size="9.5" fill="#92400e">public string $title = '初稿'</text>
    <text x="334" y="290" font-size="9.5" fill="#92400e">public array $tags = ['draft']　← 浅拷贝就栽在它身上</text>

    <line x1="280" y1="100" x2="318" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="299" y="94" text-anchor="middle" font-size="9" fill="#64748b">save()</text>
    <line x1="450" y1="178" x2="282" y2="248" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="300" y="196" font-size="9" fill="#64748b">push() 存进栈</text>
    <line x1="150" y1="230" x2="150" y2="182" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="158" y="212" font-size="9" fill="#64748b">restore(pop())</text>
    <line x1="410" y1="230" x2="410" y2="182" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="418" y="212" font-size="9" fill="#64748b">快照里装着 Meta</text>

    <text x="14" y="338" font-size="10" fill="#14532d">实测 9_快照字段可见性 : private（只能构造时赋值）　10_快照类是否 final : true（不可被继承改写）</text>
    <text x="14" y="358" font-size="10" fill="#334155">负责人只做 push / pop / size，它拿到的是窄接口：只能问 summary()，问不出 content 与 cursor</text>
    <text x="14" y="380" font-size="10" fill="#991b1b">恢复时整体替换，不逐字段打补丁 —— 逐字段恢复迟早漏掉一个（新增字段时最明显，第二节细节 5）</text>
  </g>

  <g transform="translate(640,74)">
    <rect x="0" y="0" width="340" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 第三节：两种接口</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">同一个快照类，对两类人露出不同面</text>

    <rect x="14" y="56" width="302" height="104" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="78" font-size="11.5" font-weight="bold" fill="#1e40af">宽接口 → 给原发器</text>
    <text x="28" y="98" font-size="10" fill="#1e40af">content() / cursor() / meta()</text>
    <text x="28" y="116" font-size="10" fill="#1e40af">restore() 需要读回整份状态</text>
    <text x="28" y="138" font-size="10" fill="#1e40af">PHP 里靠「同包 + final + private」实现：</text>
    <text x="28" y="154" font-size="10" fill="#1e40af">只有 TextEditor 会去读这些方法</text>

    <rect x="14" y="172" width="302" height="96" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="194" font-size="11.5" font-weight="bold" fill="#14532d">窄接口 → 给负责人</text>
    <text x="28" y="214" font-size="10" fill="#14532d">只暴露 summary(): string</text>
    <text x="28" y="232" font-size="10" fill="#14532d">栈里存多少个快照都行，但都读不出内容</text>
    <text x="28" y="252" font-size="10" font-weight="bold" fill="#14532d">这才叫「封装内部状态」</text>

    <rect x="14" y="280" width="302" height="106" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="28" y="300" font-size="11" font-weight="bold" fill="#334155">三语言各自的实现手段（第九行实测）</text>
    <text x="28" y="320" font-size="9.5" fill="#334155">Java 9_窄接口方法数 : 声明的方法 0 个，</text>
    <text x="28" y="336" font-size="9.5" fill="#334155">真实类型 Snapshot 是私有的</text>
    <text x="28" y="356" font-size="9.5" fill="#334155">Go 9_窄接口的唯一方法 : *main.snapshot</text>
    <text x="28" y="372" font-size="9.5" fill="#334155">只暴露 summary()（未导出，包外调用不了）</text>
  </g>

  <g transform="translate(20,486)">
    <rect x="0" y="0" width="960" height="156" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">第五节：撤销有两条路，备忘录与命令是配套关系</text>
    <text x="14" y="48" font-size="11.5" fill="#334155">备忘录存「执行前的完整状态」（通用但费内存）；命令存「反向操作所需的信息」（省内存但要逐个写反向逻辑，且不可逆操作无解）</text>
    <text x="14" y="70" font-size="11" fill="#334155">文本编辑这类「增量小、可逆」的操作用命令的逆操作；表单草稿、批量提交这类「一次一份完整状态」的操作用备忘录 —— 另见「命令模式」第三节</text>
    <text x="14" y="94" font-size="11" fill="#14532d">与原型的关系：两者手段相同（都是复制对象），意图不同 —— 原型的副本要接着被改，快照存起来就为了不改</text>
    <text x="14" y="118" font-size="11" fill="#334155">后端最常见的形态：把快照写到磁盘 / 数据库，就成了「版本历史」（Git 的 commit、配置中心的版本回滚）—— 模式不变，只是负责人换成了存储层</text>
    <text x="14" y="142" font-size="11" font-weight="bold" fill="#991b1b">三语言共通的一条：能在快照里只放不可变数据，就别放可变对象</text>
  </g>
</svg>
