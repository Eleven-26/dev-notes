<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">策略的连线形状：上下文只认接口，具体策略随便换</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">抽象策略只声明"算什么"，不声明"怎么选" —— 选择权在调用方手里</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="600" height="410" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 三个角色与三个可替换实现</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">类名与方法签名逐字抄第三节；常量与判据同节</text>

    <rect x="16" y="58" width="155" height="44" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="93" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">调用方</text>
    <text x="93" y="93" text-anchor="middle" font-size="9" fill="#334155">new 具体策略并注入</text>

    <line x1="93" y1="102" x2="93" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>

    <rect x="16" y="122" width="155" height="64" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="93" y="140" text-anchor="middle" font-size="9" fill="#14532d">final class</text>
    <text x="93" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">PriceCalculator</text>
    <text x="93" y="176" text-anchor="middle" font-size="9" fill="#14532d">payable(): int</text>

    <line x1="171" y1="150" x2="198" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="174" y="138" font-size="8.5" fill="#64748b">只认接口</text>

    <rect x="200" y="110" width="190" height="80" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="295" y="128" text-anchor="middle" font-size="9" fill="#1e40af">interface</text>
    <text x="295" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">DiscountStrategy</text>
    <text x="295" y="164" text-anchor="middle" font-size="9.5" fill="#1e40af">discountFor(</text>
    <text x="295" y="180" text-anchor="middle" font-size="9.5" fill="#1e40af">int $amountInCents): int</text>

    <line x1="392" y1="150" x2="418" y2="80" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="392" y1="150" x2="418" y2="152" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="392" y1="150" x2="418" y2="224" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>

    <rect x="420" y="52" width="170" height="58" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="505" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">final class NoDiscount</text>
    <text x="505" y="94" text-anchor="middle" font-size="9" fill="#14532d">return 0</text>

    <rect x="420" y="122" width="170" height="58" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="505" y="144" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">final class FullReduction</text>
    <text x="505" y="164" text-anchor="middle" font-size="9" fill="#14532d">满 20000 减 3000</text>

    <rect x="420" y="192" width="170" height="58" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="505" y="212" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#14532d">final class PercentageDiscount</text>
    <text x="505" y="232" text-anchor="middle" font-size="9" fill="#14532d">基点 0~10000</text>

    <text x="14" y="278" font-size="10.5" fill="#14532d">payable() 里只有一行减法：$amountInCents - $this-&gt;strategy-&gt;discountFor($amountInCents)</text>
    <text x="14" y="300" font-size="10.5" fill="#991b1b">上下文出现 if ($type === ...) 就说明选择职责回流了（第三节细节 5）</text>
    <text x="14" y="322" font-size="10.5" fill="#334155">构造器里校验：折扣率不在 0~10000 之间就抛 InvalidArgumentException</text>
    <text x="14" y="344" font-size="10.5" fill="#334155">具体策略无状态，可以被安全复用；金额一律用 int 的"分"，除法用 intdiv</text>
    <text x="14" y="366" font-size="10.5" fill="#92400e">接口不提供 factory() —— 一旦提供，"怎么选"就溜进策略层了</text>
    <text x="14" y="390" font-size="10.5" fill="#92400e">php-fpm 下策略对象的生命周期仅当前请求，所以不要存请求级状态</text>
  </g>

  <g transform="translate(630,74)">
    <rect x="0" y="0" width="350" height="410" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 第八节的边界对照</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">五个"看起来都在选东西"的模式，分界在返回值与选择权</text>

    <rect x="14" y="58" width="322" height="42" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="175" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">策略</text>
    <text x="175" y="93" text-anchor="middle" font-size="9.5" fill="#1e40af">用哪种算法，选在调用方</text>

    <rect x="14" y="108" width="322" height="42" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="175" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">工厂</text>
    <text x="175" y="143" text-anchor="middle" font-size="9.5" fill="#334155">造哪个对象</text>

    <rect x="14" y="158" width="322" height="42" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="175" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">状态</text>
    <text x="175" y="193" text-anchor="middle" font-size="9.5" fill="#334155">自己迁移</text>

    <rect x="14" y="208" width="322" height="42" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="175" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">责任链</text>
    <text x="175" y="243" text-anchor="middle" font-size="9.5" fill="#334155">沿链传递</text>

    <rect x="14" y="258" width="322" height="42" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="175" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">过滤器</text>
    <text x="175" y="293" text-anchor="middle" font-size="9.5" fill="#334155">筛集合</text>

    <text x="14" y="326" font-size="10.5" fill="#334155">简单工厂 vs 策略（第 4.2 节那张表）：</text>
    <text x="14" y="348" font-size="10.5" fill="#334155">工厂按入参选，策略由调用方（或容器）选。</text>
    <text x="14" y="370" font-size="10.5" fill="#991b1b">用 ReflectionClass 拼类名把选择写回上下文，</text>
    <text x="14" y="392" font-size="10.5" fill="#991b1b">代价是 IDE 无法跳转、重构不同步、拼错运行时才炸。</text>
  </g>

  <g transform="translate(20,496)">
    <rect x="0" y="0" width="960" height="134" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">三语言实测：同一笔 25000 分原价</text>
    <text x="14" y="48" font-size="11" fill="#334155">不打折 原价 25000 分 -&gt; 应付 25000 分　　满200减30 原价 25000 分 -&gt; 应付 22000 分　　9折 原价 25000 分 -&gt; 应付 22500 分</text>
    <text x="14" y="70" font-size="11" fill="#334155">改95折 原价 25000 分 -&gt; 应付 23750 分　　4_拒绝非法折扣率 : 折扣率必须在 0~10000 个基点之间</text>
    <text x="14" y="94" font-size="11" fill="#14532d">Java 块标题原文：JDK 1.8 实测输出与 PHP 版逐行一致　｜　Go 块标题原文：go1.26.5 实测输出（与前两语言一致）</text>
    <text x="14" y="118" font-size="11" fill="#92400e">第五节的替代写法：闭包策略 $discounts['vip'](25000) 得 2500；match 的适用判据是"分支 ≤3 个且长期稳定"</text>
  </g>
</svg>
