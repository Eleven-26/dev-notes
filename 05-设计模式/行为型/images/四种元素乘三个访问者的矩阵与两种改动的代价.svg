<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">4 种元素 × 3 个 Visitor 的矩阵，与两种改动的代价差</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">列方向加一格 = 加一种操作（便宜）；行方向加一行 = 加一种元素（每列都要跟着加）</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="640" height="442" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 同一份文档，三个 Visitor 的三种产出</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">格子里的文字抄自 PHP 8.0.2 CLI 实测输出（节选，长行折成两行）</text>

    <rect x="114" y="54" width="168" height="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="198" y="69" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">HtmlVisitor</text>
    <rect x="286" y="54" width="168" height="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="370" y="69" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">MarkdownVisitor</text>
    <rect x="458" y="54" width="168" height="22" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="542" y="69" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">PlainTextVisitor</text>

    <rect x="14" y="84" width="92" height="78" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="60" y="112" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">Heading</text>
    <text x="60" y="130" text-anchor="middle" font-size="9.5" fill="#14532d">「设计模式」</text>
    <text x="60" y="146" text-anchor="middle" font-size="9.5" fill="#14532d">level = 1</text>
    <rect x="114" y="84" width="168" height="78" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="124" y="112" font-size="9.5" fill="#334155">&lt;h1&gt;设计模式&lt;/h1&gt;</text>
    <rect x="286" y="84" width="168" height="78" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="296" y="112" font-size="9.5" fill="#334155"># 设计模式</text>
    <rect x="458" y="84" width="168" height="78" fill="#fffbeb" stroke="#facc15" stroke-width="1" rx="6"/>
    <text x="468" y="106" font-size="9.5" fill="#92400e">设计模式</text>
    <text x="468" y="124" font-size="9.5" fill="#92400e">====</text>

    <rect x="14" y="168" width="92" height="78" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="60" y="196" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">Paragraph</text>
    <text x="60" y="214" text-anchor="middle" font-size="9.5" fill="#14532d">text()</text>
    <rect x="114" y="168" width="168" height="78" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="124" y="190" font-size="9.5" fill="#334155">&lt;p&gt;访问者模式把操作</text>
    <text x="124" y="206" font-size="9.5" fill="#334155">从数据结构里剥离出来。&lt;/p&gt;</text>
    <rect x="286" y="168" width="168" height="78" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="296" y="190" font-size="9.5" fill="#334155">访问者模式把操作</text>
    <text x="296" y="206" font-size="9.5" fill="#334155">从数据结构里剥离出来。</text>
    <rect x="458" y="168" width="168" height="78" fill="#fffbeb" stroke="#facc15" stroke-width="1" rx="6"/>
    <text x="468" y="190" font-size="9.5" fill="#92400e">访问者模式把操作</text>
    <text x="468" y="206" font-size="9.5" fill="#92400e">从数据结构里剥离出来。</text>

    <rect x="14" y="252" width="92" height="78" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="60" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">Image</text>
    <text x="60" y="298" text-anchor="middle" font-size="9.5" fill="#14532d">src() alt()</text>
    <rect x="114" y="252" width="168" height="78" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="124" y="274" font-size="9.5" fill="#334155">&lt;img src="visitor.png"</text>
    <text x="124" y="290" font-size="9.5" fill="#334155">alt="结构图"&gt;</text>
    <rect x="286" y="252" width="168" height="78" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="296" y="274" font-size="9.5" fill="#334155">![结构图]</text>
    <text x="296" y="290" font-size="9.5" fill="#334155">(visitor.png)</text>
    <rect x="458" y="252" width="168" height="78" fill="#fffbeb" stroke="#facc15" stroke-width="1" rx="6"/>
    <text x="468" y="274" font-size="9.5" fill="#92400e">[图片：结构图</text>
    <text x="468" y="290" font-size="9.5" fill="#92400e">（visitor.png）]</text>

    <rect x="14" y="336" width="92" height="78" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="60" y="364" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">Table</text>
    <text x="60" y="382" text-anchor="middle" font-size="9.5" fill="#991b1b">rows()</text>
    <rect x="114" y="336" width="168" height="78" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="124" y="358" font-size="9.5" fill="#334155">&lt;table&gt;&lt;tr&gt;&lt;td&gt;元素&lt;/td&gt;</text>
    <text x="124" y="374" font-size="9.5" fill="#334155">&lt;td&gt;Visitor 方法&lt;/td&gt;…</text>
    <rect x="286" y="336" width="168" height="78" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="296" y="358" font-size="9.5" fill="#334155">| 元素 | Visitor 方法 |</text>
    <text x="296" y="374" font-size="9.5" fill="#334155">| --- | --- |　← 补分隔行</text>
    <rect x="458" y="336" width="168" height="78" fill="#fffbeb" stroke="#facc15" stroke-width="1" rx="6"/>
    <text x="468" y="358" font-size="9.5" fill="#92400e">元素 [TAB] Visitor 方法</text>
    <text x="468" y="374" font-size="9.5" fill="#92400e">制表符分隔，无标记</text>

    <text x="14" y="432" font-size="10.5" fill="#334155">第 4 个细节：块之间的空白由 Visitor 决定（Document::export 里 implode("\n\n")）—— 元素类里一个格式字符都没有</text>
  </g>

  <g transform="translate(680,74)">
    <rect x="0" y="0" width="300" height="442" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 第三节：耦合换了方向</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">加操作便宜，加元素贵 —— 取舍说在前面</text>

    <rect x="14" y="54" width="272" height="104" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="26" y="72" font-size="10.5" font-weight="bold" fill="#14532d">✅ 加一种操作（新导出格式）</text>
    <text x="26" y="90" font-size="9.5" fill="#14532d">加一个 Visitor 类，元素不动</text>
    <text x="26" y="106" font-size="9.5" fill="#14532d">实测第 3) 组就是新写的纯文本</text>
    <text x="26" y="122" font-size="9.5" fill="#14532d">Heading / Paragraph / Image / Table</text>
    <text x="26" y="140" font-size="9.5" font-weight="bold" fill="#14532d">一个字都没动 —— 这就是全部价值</text>

    <rect x="14" y="166" width="272" height="112" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="26" y="184" font-size="10.5" font-weight="bold" fill="#991b1b">❌ 加一种元素（如 CodeBlock）</text>
    <text x="26" y="202" font-size="9.5" fill="#991b1b">所有 Visitor 都要加方法：</text>
    <text x="26" y="218" font-size="9.5" fill="#991b1b">3 个具体 Visitor × 1 方法 = 3 处</text>
    <text x="26" y="234" font-size="9.5" fill="#991b1b">加上 DocumentVisitor 接口 = 4 处</text>
    <text x="26" y="252" font-size="9.5" font-weight="bold" fill="#991b1b">不用访问者时反过来：只加一个元素类 ✅</text>
    <text x="26" y="268" font-size="9.5" fill="#991b1b">实测 4_Visitor 方法数 = 5_元素种类数</text>

    <rect x="14" y="286" width="272" height="66" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="26" y="304" font-size="10.5" font-weight="bold" fill="#92400e">组合数：两边都是 V × E 个方法</text>
    <text x="26" y="322" font-size="9.5" fill="#92400e">用访问者 → 分散在 V 个类里</text>
    <text x="26" y="340" font-size="9.5" fill="#92400e">不用访问者 → 分散在 E 个类里</text>

    <rect x="14" y="360" width="272" height="72" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="26" y="378" font-size="10.5" font-weight="bold" fill="#334155">什么时候用（判据）</text>
    <text x="26" y="396" font-size="9.5" fill="#334155">元素种类稳定 + 操作不断增加 → 用</text>
    <text x="26" y="412" font-size="9.5" fill="#334155">元素还在频繁增加 → 不要用</text>
    <text x="26" y="428" font-size="9.5" fill="#334155">甜点区：编译器 AST（结构几十年不变）</text>
  </g>

  <g transform="translate(20,528)">
    <rect x="0" y="0" width="960" height="158" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">第四节的两条代价、第五节的分界、第七节的三语言</text>
    <text x="14" y="48" font-size="11" fill="#991b1b">代价一：元素必须为访问者开门（实测 7_Table 暴露给 Visitor : rows）—— 与迪米特法则冲突；缓解是只开读方法、收紧 Visitor 可见性、或整包给一个 toArray()</text>
    <text x="14" y="68" font-size="11" fill="#991b1b">代价二：双分派不直观，读者要在 accept() 与 visitXxx() 之间来回跳 —— 所以有的语言直接内置：Java 17+ 的 sealed interface + switch 模式匹配（本机 JDK 8 无法验证，仅作说明）</text>
    <text x="14" y="88" font-size="11" fill="#334155">第五节分界：访问者 = 一组不同类型的对象 × 多种操作｜策略 = 一个算法可替换（接口 1 个方法）｜迭代器 = 怎么遍历｜组合 = 一棵树递归</text>
    <text x="14" y="108" font-size="11" fill="#334155">第七节生态代表：PHP-Parser 的 AST 遍历、Doctrine 的 SQL 生成｜javax.lang.model.element.ElementVisitor、ASM 的 ClassVisitor｜go/ast 的 ast.Walk + Visitor</text>
    <text x="14" y="128" font-size="11" fill="#334155">三语言实测：JDK 1.8 与 go1.26.5 的输出与 PHP 版逐行一致；元素只读 PHP 用 private + getter、Java 用 final 字段 + getter，Go 只能导出字段（没有只读机制）</text>
    <text x="14" y="148" font-size="11" font-weight="bold" fill="#0f172a">⭐ 现代 Java 里访问者的价值明显下降：sealed + switch 能强制穷尽（新增变体立刻报错），还没有双分派的心智负担 —— 要不要用，先看你们家 JDK 版本</text>
  </g>
</svg>
