<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一条规则解析成的语法树，与四类节点</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">蓝 = 非终结符（有自己的孩子，interpret 是组合逻辑）　绿 = 终结符（叶子，interpret 去 Context 取值比较）</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="640" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. age &gt; 18 AND (vip = true OR amount &gt; 1000)</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">实测第 1、2 行：字符串进去，树出来，括号被吸收进结构里</text>

    <rect x="228" y="58" width="184" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="320" y="78" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">AndExpression（根）</text>
    <text x="320" y="96" text-anchor="middle" font-size="9.5" fill="#1e40af">left-&gt;interpret &amp;&amp; right-&gt;interpret</text>

    <line x1="290" y1="114" x2="150" y2="174" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="350" y1="114" x2="500" y2="174" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>

    <rect x="52" y="176" width="176" height="56" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="140" y="196" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">Comparison（叶子）</text>
    <text x="140" y="214" text-anchor="middle" font-size="10" fill="#14532d">age &gt; 18</text>

    <rect x="418" y="176" width="184" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="510" y="196" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">OrExpression</text>
    <text x="510" y="214" text-anchor="middle" font-size="9.5" fill="#1e40af">left-&gt;interpret || right-&gt;interpret</text>

    <line x1="480" y1="232" x2="386" y2="288" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="540" y1="232" x2="600" y2="288" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>

    <rect x="300" y="290" width="150" height="52" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="375" y="310" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">Comparison</text>
    <text x="375" y="328" text-anchor="middle" font-size="10" fill="#14532d">vip = true</text>

    <rect x="470" y="290" width="150" height="52" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="545" y="310" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">Comparison</text>
    <text x="545" y="328" text-anchor="middle" font-size="10" fill="#14532d">amount &gt; 1000</text>

    <text x="28" y="262" font-size="9.5" fill="#64748b">左孩子</text>
    <text x="14" y="358" font-size="10.5" fill="#334155">describe() 自底向上还原：实测 2_语法树 : (age &gt; 18 AND (vip = true OR amount &gt; 1000))</text>
    <text x="14" y="378" font-size="10.5" fill="#334155">括号不见了但优先级还在 —— 求值时不再需要关心括号，这是「字符串变成树」最直观的产出</text>
  </g>

  <g transform="translate(680,74)">
    <rect x="0" y="0" width="300" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 文法 → 类（第三节）</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">「子节点数」就是那张表的判据</text>

    <rect x="14" y="56" width="272" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="76" font-size="10.5" font-weight="bold" fill="#1e40af">非终结符 = 有孩子的节点</text>
    <text x="28" y="96" font-size="10" fill="#1e40af">OrExpression　2 个孩子</text>
    <text x="28" y="114" font-size="10" fill="#1e40af">AndExpression　2 个孩子</text>
    <text x="28" y="132" font-size="10" fill="#1e40af">NotExpression　1 个孩子</text>
    <text x="28" y="152" font-size="10" fill="#1e40af">多个 OR 会左结合嵌套（a OR b OR c）</text>
    <text x="28" y="170" font-size="10" font-weight="bold" fill="#1e40af">Comparison　0 个孩子 → 终结符</text>

    <rect x="14" y="186" width="272" height="74" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="206" font-size="10.5" font-weight="bold" fill="#92400e">优先级 = 文法的层数</text>
    <text x="28" y="226" font-size="10" fill="#92400e">parseOr → parseAnd → parseNot → parsePrimary</text>
    <text x="28" y="246" font-size="10" fill="#92400e">NOT 绑定最紧、OR 最松；改优先级只调层顺序</text>

    <rect x="14" y="270" width="272" height="70" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="290" font-size="10.5" font-weight="bold" fill="#14532d">第二棵树：一个孩子的形态</text>
    <text x="28" y="310" font-size="10" fill="#14532d">实测 4_规则 : NOT status = "banned"</text>
    <text x="28" y="328" font-size="10" fill="#14532d">5_语法树 : NOT status = "banned"</text>

    <text x="14" y="356" font-size="10" fill="#334155">6_正常用户 : 通过　7_被封禁用户 : 拒绝</text>
    <text x="14" y="374" font-size="10" fill="#334155">NotExpression 的 interpret 只有一行：</text>
    <text x="14" y="392" font-size="10" fill="#334155">return !inner-&gt;interpret($context)</text>
  </g>

  <g transform="translate(20,486)">
    <rect x="0" y="0" width="960" height="176" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">四个角色与「什么时候别写解释器」</text>
    <text x="14" y="48" font-size="11" fill="#334155">角色：Expression（接口，interpret(Context): bool + describe(): string）｜终结符 Comparison（field / operator / value）</text>
    <text x="14" y="66" font-size="11" fill="#334155">非终结符 And / Or / Not｜Context（get(name) 取不到就抛 InvalidArgumentException「变量「x」未定义」）。</text>
    <text x="14" y="86" font-size="11" fill="#334155">第四节的判断标准是「类的数量」：类数 ≈ 文法产生式数 × 2。几个操作符 + 括号 → 手写约 250 行还附带漂亮报错；十几条产生式 → 考虑现成表达式库；</text>
    <text x="14" y="104" font-size="11" fill="#991b1b">有语法嵌套结构（JSON、SQL、模板语言、编程语言）→ 别手写，用 ANTLR / yacc / bison。GoF 原书对这点警告过，延伸追问第一条就是它。</text>
    <text x="14" y="124" font-size="11" fill="#334155">与 eval 的对照：安全 —— eval 是任意代码执行（配置被篡改 = 服务器沦陷），解释器只能表达已定义的文法；性能 —— eval 每次都要编译，解释器是解析一次、求值多次。</text>
    <text x="14" y="144" font-size="11" fill="#334155">第六节三语言：短路 PHP / Java 由 &amp;&amp; 与 || 自带，Go 必须手写控制流（if !left { return false, nil }）—— 短路是行为，不是运算符的附带效果。</text>
    <text x="14" y="164" font-size="11" fill="#64748b">求值失败：PHP / Java 抛异常自动冒泡，Go 返回 error 逐层传递。JDK 1.8 与 go1.26.5 实测输出与 PHP 版逐行一致。</text>
  </g>
</svg>
