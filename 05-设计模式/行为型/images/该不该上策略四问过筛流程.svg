<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">该不该上策略：四问过筛</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">判据全部来自第五节那张「什么时候不必上策略」的表与第三节的细节清单</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="366" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">按顺序问，第一个「是」就是答案</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">总判据只有一句：同一件事有多个可替换的做法，而且以后还会加新的做法</text>

    <rect x="20" y="62" width="290" height="56" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="165" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">① 只有两种分支且长期稳定？</text>
    <text x="165" y="102" text-anchor="middle" font-size="10" fill="#92400e">分支持续增长？不是</text>
    <line x1="310" y1="90" x2="330" y2="90" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="332" y="62" width="200" height="56" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="432" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">不必上策略</text>
    <text x="432" y="102" text-anchor="middle" font-size="10" fill="#334155">match 就够</text>
    <line x1="532" y1="90" x2="552" y2="90" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="554" y="62" width="386" height="56" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="747" y="84" text-anchor="middle" font-size="11" fill="#334155">第五节判据：match 适合「分支 ≤3 个且长期稳定」</text>
    <text x="747" y="102" text-anchor="middle" font-size="10.5" fill="#64748b">为了两个永不分叉的分支建三个类，是纯开销</text>

    <rect x="20" y="134" width="290" height="56" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="165" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">② 差异只在参数？</text>
    <text x="165" y="174" text-anchor="middle" font-size="10" fill="#92400e">同一算法，只是数字不同</text>
    <line x1="310" y1="162" x2="330" y2="162" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="332" y="134" width="200" height="56" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="432" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">闭包策略</text>
    <text x="432" y="174" text-anchor="middle" font-size="10" fill="#14532d">不要建类</text>
    <line x1="532" y1="162" x2="552" y2="162" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="554" y="134" width="386" height="56" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="747" y="156" text-anchor="middle" font-size="11" fill="#334155">第五节实测：$discounts['vip'](25000) 得 2500</text>
    <text x="747" y="174" text-anchor="middle" font-size="10.5" fill="#64748b">PercentageDiscount 本身就是「参数化策略」的类化版本</text>

    <rect x="20" y="206" width="290" height="56" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="165" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">③ 分支持续增长、内部逻辑较重？</text>
    <text x="165" y="246" text-anchor="middle" font-size="10" fill="#92400e">每个分支要单独测</text>
    <line x1="310" y1="234" x2="330" y2="234" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="332" y="206" width="200" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="432" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">上策略</text>
    <text x="432" y="246" text-anchor="middle" font-size="10" fill="#1e40af">一个分支一个类</text>
    <line x1="532" y1="234" x2="552" y2="234" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="554" y="206" width="386" height="56" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="747" y="228" text-anchor="middle" font-size="11" fill="#334155">类 final、属性 private、构造注入并在构造里校验</text>
    <text x="747" y="246" text-anchor="middle" font-size="10.5" fill="#64748b">接口不提供 factory()；上下文只做编排 + 转发</text>

    <rect x="20" y="278" width="290" height="56" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="165" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">④ 运行时按配置切换？</text>
    <text x="165" y="318" text-anchor="middle" font-size="10" fill="#92400e">数据库 / 缓存驱动</text>
    <line x1="310" y1="306" x2="330" y2="306" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="332" y="278" width="200" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="432" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">上策略并注入</text>
    <text x="432" y="318" text-anchor="middle" font-size="10" fill="#1e40af">策略不存请求级状态</text>
    <line x1="532" y1="306" x2="552" y2="306" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="554" y="278" width="386" height="56" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="747" y="300" text-anchor="middle" font-size="11" fill="#991b1b">php-fpm 下策略对象的生命周期仅当前请求</text>
    <text x="747" y="318" text-anchor="middle" font-size="10.5" fill="#991b1b">常驻进程才谈得上复用实例 —— 第八节生命周期对照</text>
  </g>

  <g transform="translate(20,452)">
    <rect x="0" y="0" width="960" height="100" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">第四节：原文那三种写法为什么不算策略</text>
    <text x="14" y="48" font-size="11.5" fill="#991b1b">4.1 兜底赋成字符串 —— 实测 PHP Fatal error: Uncaught Error: Call to a member function inertiaRotate() on string（静默降级 + 延迟爆炸）。</text>
    <text x="14" y="70" font-size="11.5" fill="#991b1b">4.2 用 ReflectionClass 拼类名在上下文里选实现 —— 那其实是简单工厂（工厂按入参选，策略由调用方或容器选）。</text>
    <text x="14" y="92" font-size="11.5" fill="#991b1b">4.3 Context 自己 newInstance() —— 依赖倒置被破坏，无法替换测试替身。</text>
  </g>
</svg>
