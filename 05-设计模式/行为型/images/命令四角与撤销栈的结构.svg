<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="570" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">命令模式的四个角：Command 把调用方和接收者隔开</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">Receiver 不知道 Command，Invoker 不知道具体命令 —— 撤销靠 history 栈倒着走</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="600" height="350" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 类名与签名逐字抄第二节</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">历史用数组存，出栈用 array_pop —— 没有别的隐藏状态</text>

    <rect x="14" y="58" width="160" height="40" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="94" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">调用方</text>
    <text x="94" y="91" text-anchor="middle" font-size="9" fill="#334155">只发意图，不认识具体命令</text>

    <line x1="94" y1="98" x2="94" y2="116" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>

    <rect x="14" y="118" width="160" height="76" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="94" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">final class CommandInvoker</text>
    <text x="94" y="154" text-anchor="middle" font-size="9" fill="#14532d">run(Command) / undoLast(): bool</text>
    <text x="94" y="170" text-anchor="middle" font-size="9" fill="#14532d">historySize(): int</text>
    <text x="94" y="186" text-anchor="middle" font-size="9" fill="#14532d">private array $history = []</text>

    <line x1="174" y1="156" x2="208" y2="156" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="191" y="142" text-anchor="middle" font-size="8.5" fill="#64748b">只认接口</text>

    <rect x="210" y="118" width="170" height="76" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="295" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">interface Command</text>
    <text x="295" y="156" text-anchor="middle" font-size="9.5" fill="#1e40af">execute(): void</text>
    <text x="295" y="176" text-anchor="middle" font-size="9.5" fill="#1e40af">undo(): void</text>

    <line x1="380" y1="140" x2="412" y2="106" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="380" y1="176" x2="412" y2="212" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>

    <rect x="414" y="76" width="170" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="499" y="94" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">final class InsertTextCommand</text>
    <text x="499" y="112" text-anchor="middle" font-size="8.5" fill="#14532d">(TextEditor $editor, string $text)</text>
    <text x="499" y="128" text-anchor="middle" font-size="8.5" fill="#14532d">undo 时 deleteTail(strlen(text))</text>

    <rect x="414" y="182" width="170" height="60" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="499" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">final class DeleteTailCommand</text>
    <text x="499" y="218" text-anchor="middle" font-size="8.5" fill="#92400e">(TextEditor $editor, int $length)</text>
    <text x="499" y="234" text-anchor="middle" font-size="8.5" fill="#92400e">private string $removed = ''</text>

    <line x1="499" y1="136" x2="499" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="499" y1="242" x2="499" y2="266" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>

    <rect x="390" y="268" width="200" height="46" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="490" y="286" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#334155">final class TextEditor（接收者）</text>
    <text x="490" y="304" text-anchor="middle" font-size="9" fill="#334155">insert() / deleteTail() / content()</text>

    <text x="14" y="240" font-size="10" fill="#334155">执行链：run() → command-&gt;execute() → editor 改动，</text>
    <text x="14" y="260" font-size="10" fill="#334155">　　　　然后 $this-&gt;history[] = $command</text>
    <text x="14" y="284" font-size="10" fill="#991b1b">撤销链：undoLast() → array_pop(history) →</text>
    <text x="14" y="304" font-size="10" fill="#991b1b">　　　　command-&gt;undo() → editor 反向改动</text>
    <text x="14" y="330" font-size="10" fill="#92400e">history 空时 undoLast() 返回 false（bool 而不是抛异常）</text>
  </g>

  <g transform="translate(630,74)">
    <rect x="0" y="0" width="350" height="350" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 撤销的两种做法（第三节）</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">先决定撤销方式，再决定要不要用这个模式</text>

    <rect x="14" y="56" width="322" height="112" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="78" font-size="11.5" font-weight="bold" fill="#14532d">逆操作（本篇采用）</text>
    <text x="28" y="98" font-size="10" fill="#14532d">每个命令实现一个与 execute 相反的动作</text>
    <text x="28" y="116" font-size="10" fill="#14532d">优点：内存占用小</text>
    <text x="28" y="134" font-size="10" fill="#991b1b">缺点：每个命令都要仔细写反向逻辑</text>
    <text x="28" y="154" font-size="10" fill="#991b1b">某些操作不可逆（如"发短信"）</text>

    <rect x="14" y="180" width="322" height="86" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="202" font-size="11.5" font-weight="bold" fill="#92400e">快照（备忘录模式）</text>
    <text x="28" y="222" font-size="10" fill="#92400e">执行前把接收者的状态存一份</text>
    <text x="28" y="240" font-size="10" fill="#92400e">优点：实现简单、通用</text>
    <text x="28" y="258" font-size="10" fill="#92400e">缺点：占内存；状态大时不可行</text>

    <text x="14" y="290" font-size="10.5" font-weight="bold" fill="#0f172a">另外两条要点（第三节）</text>
    <text x="14" y="310" font-size="10" fill="#334155">并非所有操作都能撤销；撤销栈通常有上限，</text>
    <text x="14" y="328" font-size="10" fill="#334155">否则长时间编辑会吃掉大量内存。</text>
  </g>

  <g transform="translate(20,436)">
    <rect x="0" y="0" width="960" height="120" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">实测（PHP 8.0.2 CLI）</text>
    <text x="14" y="50" font-size="11.5" fill="#334155">1_连续两步之后 : Hello, World　　2_撤销一步 : Hello　　3_再撤销一步 : (空)　　6_历史条数 : 1</text>
    <text x="14" y="72" font-size="11.5" fill="#334155">4_删除末尾 3 个 : abc　　5_撤销删除 : abcdef（恢复的是当时删掉的内容）</text>
    <text x="14" y="98" font-size="11.5" fill="#14532d">Java：JDK 1.8 实测输出与 PHP 版逐行一致｜Go：go1.26.5 实测输出（与 PHP/Java 一致），唯一差异是第 5 行 abcdef 后多一个空格</text>
  </g>
</svg>
