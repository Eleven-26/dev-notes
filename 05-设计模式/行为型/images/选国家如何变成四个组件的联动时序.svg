<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一次「选国家」如何变成四个组件的联动：信息先往外流，再由中介者往回写</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">同事只会 notify 自己变了；「谁受影响、改成什么」全部由 RegistrationForm 的 notify() + sync() 决定</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="580" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>

    <rect x="20" y="56" width="140" height="28" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
    <text x="90" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">脚本（调用方）</text>
    <rect x="210" y="56" width="140" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="280" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">CountrySelect</text>
    <rect x="400" y="56" width="140" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="470" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">RegistrationForm</text>
    <rect x="590" y="56" width="140" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="660" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">ProvinceSelect</text>
    <rect x="780" y="56" width="140" height="28" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="850" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">按钮 / 提示</text>

    <line x1="90" y1="84" x2="90" y2="530" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="280" y1="84" x2="280" y2="530" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="470" y1="84" x2="470" y2="530" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="660" y1="84" x2="660" y2="530" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="850" y1="84" x2="850" y2="530" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

    <text x="14" y="102" font-size="11.5" font-weight="bold" fill="#1e40af">第 1 步：选国家「中国」—— 省份列表随之重载，按钮仍是禁用</text>
    <text x="185" y="120" text-anchor="middle" font-size="9.5" fill="#334155">country()-&gt;select('中国')</text>
    <line x1="90" y1="126" x2="280" y2="126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="185" y="150" text-anchor="middle" font-size="9.5" fill="#14532d">值变了 → changed()</text>
    <line x1="280" y1="156" x2="470" y2="156" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="375" y="180" text-anchor="middle" font-size="9.5" fill="#14532d">mediator-&gt;notify($this, 'changed')</text>
    <text x="470" y="204" text-anchor="middle" font-size="9.5" fill="#1e40af">log[] = 'CountrySelect.changed'</text>
    <text x="565" y="228" text-anchor="middle" font-size="9.5" fill="#334155">province-&gt;load('中国')：选项换成广东/浙江/江苏，value 清空</text>
    <line x1="470" y1="234" x2="660" y2="234" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="660" y="258" text-anchor="middle" font-size="9.5" fill="#334155">sync()：message-&gt;show('请选择省份…')、submit-&gt;setEnabled(false)</text>
    <line x1="470" y1="264" x2="850" y2="264" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="14" y="286" font-size="10" fill="#14532d">实测 2_选国家「中国」 : 省份选项=广东,浙江,江苏 已选省份=(空) 提示=请选择省份（省份列表随国家变化） 按钮=禁用</text>

    <text x="14" y="310" font-size="11.5" font-weight="bold" fill="#14532d">第 2 步：选省份「浙江」—— 同一条通路，sync() 这次判定可以提交</text>
    <text x="375" y="328" text-anchor="middle" font-size="9.5" fill="#334155">province()-&gt;select('浙江')　→　notify($this, 'changed')</text>
    <line x1="90" y1="334" x2="660" y2="334" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="565" y="358" text-anchor="middle" font-size="9.5" fill="#14532d">log[] = 'ProvinceSelect.changed'，sync()：提示=(无)、按钮=启用</text>
    <line x1="470" y1="364" x2="850" y2="364" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="14" y="386" font-size="10" fill="#14532d">实测 3_选省份「浙江」 : 省份选项=广东,浙江,江苏 已选省份=浙江 提示=(无) 按钮=启用</text>

    <text x="14" y="410" font-size="11.5" font-weight="bold" fill="#92400e">第 3 步：换国家「美国」—— 这一行最能体现中介者的价值</text>
    <text x="185" y="428" text-anchor="middle" font-size="9.5" fill="#334155">country()-&gt;select('美国')</text>
    <line x1="90" y1="434" x2="470" y2="434" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="375" y="458" text-anchor="middle" font-size="9.5" fill="#334155">notify 里判 $sender === $this-&gt;country → 重载并作废</text>
    <text x="565" y="482" text-anchor="middle" font-size="9.5" fill="#92400e">province-&gt;load('美国')：选项=加州,德州，已选省份清空</text>
    <line x1="470" y1="488" x2="660" y2="488" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="660" y="512" text-anchor="middle" font-size="9.5" fill="#334155">sync()：按钮回到禁用</text>
    <line x1="470" y1="518" x2="850" y2="518" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="14" y="540" font-size="10" fill="#14532d">实测 4_换国家「美国」 : 省份选项=加州,德州 已选省份=(空) 提示=请选择省份（省份列表随国家变化） 按钮=禁用　← 已选省份被作废</text>
    <text x="14" y="562" font-size="10.5" fill="#991b1b">不用中介者，就得让 CountrySelect 去操作 ProvinceSelect（$this-&gt;province-&gt;reset()）—— 两个组件从此绑死，挪不到别的表单</text>
  </g>

  <g transform="translate(20,666)">
    <rect x="0" y="0" width="960" height="84" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="22" font-size="11.5" fill="#14532d">实测 6_通知日志 : CountrySelect.changed &gt; ProvinceSelect.changed &gt; CountrySelect.changed &gt; ProvinceSelect.changed —— 顺序就是联动顺序</text>
    <text x="14" y="46" font-size="11" fill="#334155">构造时注入中介者并 sync() 一遍：实测 1_初始状态 的「提示=请选择国家 按钮=禁用」是规则算出来的，不是各组件默认值的巧合</text>
    <text x="14" y="70" font-size="11" fill="#334155">第六节三语言：PHP 用 abstract class Component 兜住 setMediator()/changed()；Java 在 notify() 里 instanceof 判发送者；Go 内嵌 base + 类型断言，且必须把 sender 显式传进去</text>
  </g>
</svg>
