<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">组合模式的树：容器本身也是组件，所以树能一直长</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">「容器也是 Node」是唯一难点，也是全部力量的来源 —— 调用方不需要区分文件与目录（树形与读数取自实测脚本）</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="620" height="330" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 实测那棵三层树</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">叶子与容器实现同一个 interface Node，所以容器里能放容器</text>

    <rect x="165" y="60" width="180" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="255" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">DirectoryNode project</text>
    <text x="255" y="94" text-anchor="middle" font-size="9.5" fill="#14532d">Composite：实测 3_根 : 3800</text>

    <line x1="215" y1="100" x2="88" y2="128" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="255" y1="100" x2="228" y2="128" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="300" y1="100" x2="372" y2="128" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="352" y="118" font-size="9.5" fill="#64748b">add(Node $node)</text>

    <rect x="14" y="130" width="130" height="40" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="79" y="148" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#334155">FileNode README.md</text>
    <text x="79" y="162" text-anchor="middle" font-size="9" fill="#334155">Leaf：1200</text>

    <rect x="160" y="130" width="130" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="225" y="148" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">DirectoryNode src</text>
    <text x="225" y="162" text-anchor="middle" font-size="9" fill="#14532d">实测 2_目录 : 2300</text>

    <rect x="306" y="130" width="130" height="40" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="371" y="148" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#334155">FileNode composer.json</text>
    <text x="371" y="162" text-anchor="middle" font-size="9" fill="#334155">Leaf：300</text>

    <line x1="205" y1="170" x2="192" y2="198" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="245" y1="170" x2="303" y2="198" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>

    <rect x="140" y="200" width="104" height="40" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="192" y="218" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#334155">FileNode index.php</text>
    <text x="192" y="232" text-anchor="middle" font-size="9" fill="#334155">Leaf：800</text>

    <rect x="252" y="200" width="110" height="40" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="307" y="218" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#334155">FileNode router.php</text>
    <text x="307" y="232" text-anchor="middle" font-size="9" fill="#334155">Leaf：1500</text>

    <rect x="470" y="60" width="130" height="220" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="535" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">interface Node</text>
    <text x="535" y="106" text-anchor="middle" font-size="10" fill="#1e40af">name(): string</text>
    <text x="535" y="124" text-anchor="middle" font-size="10" fill="#1e40af">size(): int</text>
    <text x="535" y="152" text-anchor="middle" font-size="10" fill="#1e40af">两个类都实现它</text>
    <text x="535" y="176" text-anchor="middle" font-size="10" fill="#1e40af">调用方只依赖它</text>
    <text x="535" y="204" text-anchor="middle" font-size="9.5" fill="#1e40af">totalSize(Node $node)</text>
    <text x="535" y="228" text-anchor="middle" font-size="10" fill="#1e40af">不含任何 instanceof</text>
    <text x="535" y="256" text-anchor="middle" font-size="10" fill="#1e40af">4_叶子与目录 : true</text>

    <text x="14" y="268" font-size="11.5" fill="#14532d">递归只写在容器里：目录遍历 children 累加，叶子直接返回自身字节数</text>
    <text x="14" y="292" font-size="11" fill="#334155">800 + 1500 = 2300，1200 + 2300 + 300 = 3800 —— 两个和都来自实测，不是估算</text>
    <text x="14" y="316" font-size="10.5" fill="#991b1b">容器 add 的入参类型是 Node，所以「目录里放目录」不需要任何特殊处理</text>
  </g>

  <g transform="translate(650,74)">
    <rect x="0" y="0" width="330" height="330" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. add() 该定义在哪里</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">第三节：透明性 vs 安全性</text>

    <rect x="14" y="56" width="302" height="106" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="78" font-size="11.5" font-weight="bold" fill="#92400e">透明型</text>
    <text x="28" y="98" font-size="10.5" fill="#92400e">add / remove 也放进 Component</text>
    <text x="28" y="116" font-size="10.5" fill="#92400e">优点：调用方完全一致，无需判断类型</text>
    <text x="28" y="134" font-size="10.5" fill="#991b1b">缺点：叶子被迫空实现或抛异常</text>
    <text x="28" y="154" font-size="10.5" font-weight="bold" fill="#991b1b">→ 违反接口隔离原则</text>

    <rect x="14" y="174" width="302" height="106" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="196" font-size="11.5" font-weight="bold" fill="#14532d">安全型（本篇采用）</text>
    <text x="28" y="216" font-size="10.5" fill="#14532d">add / remove 只在 DirectoryNode 上</text>
    <text x="28" y="234" font-size="10.5" fill="#14532d">FileNode 上没有 add()</text>
    <text x="28" y="252" font-size="10.5" fill="#14532d">「给文件加子文件」在静态分析阶段</text>
    <text x="28" y="270" font-size="10.5" fill="#14532d">就不成立；代价是组装时要知道谁是容器</text>

    <text x="14" y="298" font-size="11" fill="#991b1b">原文的荒谬点：叶子 Archer、Cavalry</text>
    <text x="14" y="318" font-size="11" fill="#991b1b">也继承了 CompositeUnit → 弓箭手能 addUnit</text>
  </g>

  <g transform="translate(20,416)">
    <rect x="0" y="0" width="960" height="134" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">第五节：组合与装饰器都靠「实现同一接口」，但形状不同</text>
    <text x="14" y="48" font-size="11.5" fill="#334155">结构：树（一对多）vs 链（恰好一个子对象）｜递归方向：父 → 所有子 vs 外 → 内（层层转发）｜目的：统一部分与整体 vs 接口不变加行为</text>
    <text x="14" y="70" font-size="11.5" fill="#334155">典型例子：文件系统、组织架构、菜单树 vs PSR-15 中间件栈、java.io 流链</text>
    <text x="14" y="94" font-size="11.5" fill="#14532d">实测（PHP 8.0.2 CLI，Java / Go 逐行一致）：1_叶子文件大小 : 1200　2_目录大小（递归求和）: 2300　3_根目录大小 : 3800</text>
    <text x="14" y="118" font-size="11.5" fill="#991b1b">5_直接成环被拒 : 不允许成环：project　6_间接成环也被拒 : 不允许成环：project —— 成环检测见下一张图</text>
  </g>
</svg>
