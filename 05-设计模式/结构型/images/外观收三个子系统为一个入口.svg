<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
    <marker id="arwR" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">外观的连线形状：N 个子系统收成 1 个入口，依赖是单向的</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">原文判据：子系统没有 Facade 的任何信息，没有对 Facade 对象的引用</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="620" height="330" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 三个子系统，一个入口</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">CheckoutFacade 的方法体只有转发 + 顺序编排</text>

    <rect x="20" y="58" width="120" height="54" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="80" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">调用方</text>
    <text x="80" y="100" text-anchor="middle" font-size="10" fill="#1e40af">只认识一个类</text>

    <line x1="140" y1="85" x2="172" y2="85" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>

    <rect x="180" y="50" width="220" height="70" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="290" y="70" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">CheckoutFacade</text>
    <text x="290" y="90" text-anchor="middle" font-size="10" fill="#14532d">place(int $orderId, int $sku,</text>
    <text x="290" y="106" text-anchor="middle" font-size="10" fill="#14532d">int $qty, int $amountInCents)</text>

    <line x1="400" y1="66" x2="424" y2="66" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="400" y1="122" x2="424" y2="122" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="400" y1="178" x2="424" y2="178" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>

    <rect x="430" y="44" width="170" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="515" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">InventoryService</text>
    <text x="515" y="80" text-anchor="middle" font-size="10" fill="#1e40af">reserve(int $sku, int $qty)</text>
    <rect x="430" y="100" width="170" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="515" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">PaymentGateway</text>
    <text x="515" y="136" text-anchor="middle" font-size="10" fill="#1e40af">charge(int $amountInCents)</text>
    <rect x="430" y="156" width="170" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="515" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">NotificationService</text>
    <text x="515" y="192" text-anchor="middle" font-size="10" fill="#1e40af">notifyPaid(int $orderId)</text>

    <line x1="80" y1="112" x2="424" y2="160" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arwR)"/>

    <text x="14" y="226" font-size="11.5" font-weight="bold" fill="#14532d">箭头只往一个方向走：外观 → 子系统，子系统不认识外观</text>
    <text x="14" y="248" font-size="11" fill="#991b1b">虚线是「不独占」：调用方可以绕过外观直接用一个子系统</text>
    <text x="14" y="270" font-size="11" fill="#334155">1_外观调用 : txn_25000　2_子系统单独使用 : txn_999　3_子系统直接询问 : reserved 88x1</text>
    <text x="14" y="292" font-size="11" fill="#334155">反过来若子系统必须回调外观，那已经不是外观模式 —— 是中介者</text>
    <text x="14" y="314" font-size="11" fill="#92400e">三条性质缺一条就不是外观：降接口面 / 不独占 / 无业务决策</text>
  </g>

  <g transform="translate(650,74)">
    <rect x="0" y="0" width="330" height="330" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 和中介者怎么分（第五节）</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">判据是它回答的问题，不是类图</text>

    <rect x="14" y="56" width="302" height="112" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="78" font-size="11.5" font-weight="bold" fill="#14532d">外观（结构型）</text>
    <text x="28" y="98" font-size="10.5" fill="#14532d">为谁服务：外部调用方，少记几个类</text>
    <text x="28" y="116" font-size="10.5" fill="#14532d">依赖方向：单向，子系统不知道外观</text>
    <text x="28" y="134" font-size="10.5" fill="#14532d">解决的问题：用这套系统的人太多</text>
    <text x="28" y="154" font-size="10.5" font-weight="bold" fill="#14532d">删掉之后：子系统依然完整可用</text>

    <rect x="14" y="180" width="302" height="112" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="202" font-size="11.5" font-weight="bold" fill="#92400e">中介者（行为型）</text>
    <text x="28" y="222" font-size="10.5" fill="#92400e">为谁服务：子系统内部，同事对象</text>
    <text x="28" y="240" font-size="10.5" fill="#92400e">依赖方向：双向，同事持有并回调它</text>
    <text x="28" y="258" font-size="10.5" fill="#92400e">解决的问题：模块互相调用成网</text>
    <text x="28" y="278" font-size="10.5" font-weight="bold" fill="#92400e">删掉之后：退回互相直连的蛛网</text>

    <text x="14" y="306" font-size="11" fill="#334155">适配器改的是形状；外观是接口太多，</text>
    <text x="14" y="322" font-size="11" fill="#334155">主动设计一个简化新口</text>
  </g>

  <g transform="translate(20,416)">
    <rect x="0" y="0" width="960" height="134" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">生态里三个真外观，和一个名字撞车的假外观（第六节）</text>
    <text x="14" y="48" font-size="11.5" fill="#334155">PDO：对 pdo_mysql / pdo_pgsql / pdo_sqlite 驱动 —— 换驱动不改业务代码，query() 内部编排「准备 → 执行 → 取回」</text>
    <text x="14" y="70" font-size="11.5" fill="#334155">League\Flysystem：Filesystem 对 aws/s3、本地磁盘、FTP 各 adapter —— 业务只调 write() / read()，不知道文件落在哪个云</text>
    <text x="14" y="94" font-size="11.5" font-weight="bold" fill="#991b1b">假外观：Illuminate\Support\Facades\Facade 基类是静态代理 —— __callStatic 从容器解析真实实例再转发，与「降接口面」无关</text>
    <text x="14" y="118" font-size="11.5" fill="#92400e">Laravel 里 GoF 外观的对位物是应用服务层；三语言共通一句：外观是「入口」，不是「真相源」（第九节）</text>
  </g>
</svg>
