<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">过滤器 / 策略 / 责任链：四行对照与一条口诀</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">都是"把一段逻辑抽出来交给别的东西"，分界只看返回值、是否改数据、组合后还是不是同一种东西</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="292" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">第五节那张对照表</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">四行判据都落在"接口形状"上，不看类名、不看包名</text>

    <rect x="20" y="54" width="150" height="34" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
    <text x="95" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">判据</text>
    <rect x="176" y="54" width="250" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="301" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">过滤器</text>
    <rect x="432" y="54" width="250" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="557" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">策略</text>
    <rect x="688" y="54" width="252" height="34" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="814" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">责任链</text>

    <rect x="20" y="94" width="150" height="38" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="95" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">返回值</text>
    <rect x="176" y="94" width="250" height="38" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" rx="6"/>
    <text x="301" y="118" text-anchor="middle" font-size="10.5" fill="#1e40af">bool，只回答"要不要"</text>
    <rect x="432" y="94" width="250" height="38" fill="#f0fdf4" stroke="#86efac" stroke-width="1" rx="6"/>
    <text x="557" y="118" text-anchor="middle" font-size="10.5" fill="#14532d">业务结果</text>
    <rect x="688" y="94" width="252" height="38" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" rx="6"/>
    <text x="814" y="118" text-anchor="middle" font-size="10.5" fill="#92400e">处理结果，或传给下一个</text>

    <rect x="20" y="134" width="150" height="38" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="95" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">对数据做什么</text>
    <rect x="176" y="134" width="250" height="38" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" rx="6"/>
    <text x="301" y="158" text-anchor="middle" font-size="10.5" fill="#1e40af">只选不改，纯函数</text>
    <rect x="432" y="134" width="250" height="38" fill="#f0fdf4" stroke="#86efac" stroke-width="1" rx="6"/>
    <text x="557" y="158" text-anchor="middle" font-size="10.5" fill="#14532d">可任意加工</text>
    <rect x="688" y="134" width="252" height="38" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" rx="6"/>
    <text x="814" y="158" text-anchor="middle" font-size="10.5" fill="#92400e">可加工、拦截、短路</text>

    <rect x="20" y="174" width="150" height="38" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="95" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">顺序敏感吗</text>
    <rect x="176" y="174" width="250" height="38" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" rx="6"/>
    <text x="301" y="198" text-anchor="middle" font-size="10.5" fill="#1e40af">不敏感：与或非可交换</text>
    <rect x="432" y="174" width="250" height="38" fill="#f0fdf4" stroke="#86efac" stroke-width="1" rx="6"/>
    <text x="557" y="198" text-anchor="middle" font-size="10.5" fill="#14532d">单选一个</text>
    <rect x="688" y="174" width="252" height="38" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" rx="6"/>
    <text x="814" y="198" text-anchor="middle" font-size="10.5" fill="#92400e">顺序即语义</text>

    <rect x="20" y="214" width="150" height="38" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="95" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">组合代数</text>
    <rect x="176" y="214" width="250" height="38" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" rx="6"/>
    <text x="301" y="238" text-anchor="middle" font-size="10.5" fill="#1e40af">and / or / not 封闭，组合后仍是谓词</text>
    <rect x="432" y="214" width="250" height="38" fill="#f0fdf4" stroke="#86efac" stroke-width="1" rx="6"/>
    <text x="557" y="238" text-anchor="middle" font-size="10.5" fill="#14532d">一般不提供组合子</text>
    <rect x="688" y="214" width="252" height="38" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" rx="6"/>
    <text x="814" y="238" text-anchor="middle" font-size="10.5" fill="#92400e">链式传递，不能取反</text>

    <text x="14" y="272" font-size="11.5" fill="#334155">表里第一行是硬分界：返回 bool 才谈得上"组合后仍是谓词"；返回业务结果的是策略，返回"我处理了 / 交给下一个"的是责任链。</text>
  </g>

  <g transform="translate(20,378)">
    <rect x="0" y="0" width="960" height="130" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">口诀、上下游、以及什么时候根本不该用内存筛</text>
    <text x="14" y="50" font-size="11.5" fill="#1e40af">判别口诀：能画出"谓词进 → bool 出 → 组合后仍是谓词"这个闭环的才是过滤器；会改数据、会中断流程的已经滑向责任链。</text>
    <text x="14" y="72" font-size="11.5" fill="#334155">与迭代器是上下游：过滤器管"筛出哪些"，迭代器管"怎么被消费" —— 两者的交汇处正是 Go 1.23 的 iter.Seq。</text>
    <text x="14" y="94" font-size="11.5" fill="#991b1b">下推判据：数据源能接条件就下推 SQL（传输是 O(命中行数)）；内存筛要付出 O(全表行数) 的进程内存，百万行表先 OOM 的是 PHP。</text>
    <text x="14" y="116" font-size="11.5" fill="#334155">仍该用内存谓词的四类：已加载集合的二次筛选、外部接口返回的整包 JSON、单元测试 fixture、依赖进程内状态（会话 / Feature flag）的判定。</text>
  </g>
</svg>
