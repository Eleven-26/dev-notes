<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">都"包一层"，判据是包这一层改了什么</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">适配器换形状，代理控访问，装饰器加行为，外观收入口 —— 第五节的四问</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="366" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">按顺序问，第一个「是」就是答案</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">四行的问法都落在"接口"与"目的"两列上，不看类名</text>

    <rect x="20" y="62" width="290" height="56" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="165" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">① 接口形状对不上？</text>
    <text x="165" y="102" text-anchor="middle" font-size="10" fill="#92400e">对方是第三方 / 遗留代码，不配合</text>
    <line x1="310" y1="90" x2="330" y2="90" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="332" y="62" width="200" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="432" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">适配器</text>
    <text x="432" y="102" text-anchor="middle" font-size="10" fill="#1e40af">改成调用方要的形状</text>
    <line x1="532" y1="90" x2="552" y2="90" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="554" y="62" width="386" height="56" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="747" y="84" text-anchor="middle" font-size="11" fill="#334155">send(to, message) 翻成 dispatchMessage(text, phone)</text>
    <text x="747" y="102" text-anchor="middle" font-size="10.5" fill="#64748b">返回值也从 array 翻回 string；接口一变就改这一处</text>

    <rect x="20" y="134" width="290" height="56" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="165" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">② 形状对，但要控制访问？</text>
    <text x="165" y="174" text-anchor="middle" font-size="10" fill="#92400e">延迟创建、缓存、权限、禁写</text>
    <line x1="310" y1="162" x2="330" y2="162" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="332" y="134" width="200" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="432" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">代理</text>
    <text x="432" y="174" text-anchor="middle" font-size="10" fill="#1e40af">接口完全相同</text>
    <line x1="532" y1="162" x2="552" y2="162" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="554" y="134" width="386" height="56" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="747" y="156" text-anchor="middle" font-size="11" fill="#334155">真实对象由代理自己决定、自己创建</text>
    <text x="747" y="174" text-anchor="middle" font-size="10.5" fill="#64748b">叠两层缓存代理没意义 —— 不做自由排列组合</text>

    <rect x="20" y="206" width="290" height="56" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="165" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">③ 形状对，只想加行为？</text>
    <text x="165" y="246" text-anchor="middle" font-size="10" fill="#92400e">还要能运行时任意叠加</text>
    <line x1="310" y1="234" x2="330" y2="234" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="332" y="206" width="200" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="432" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">装饰器</text>
    <text x="432" y="246" text-anchor="middle" font-size="10" fill="#1e40af">接口不变，加层</text>
    <line x1="532" y1="234" x2="552" y2="234" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="554" y="206" width="386" height="56" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="747" y="228" text-anchor="middle" font-size="11" fill="#334155">被装饰对象由调用方传入，天生可叠多层</text>
    <text x="747" y="246" text-anchor="middle" font-size="10.5" fill="#64748b">顺序即语义：zlib(enc(olleh)) 与 enc()olleh(bilz)</text>

    <rect x="20" y="278" width="290" height="56" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="165" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">④ 几十个类，只有一个用例？</text>
    <text x="165" y="318" text-anchor="middle" font-size="10" fill="#92400e">调用方不该认识那几十个类</text>
    <line x1="310" y1="306" x2="330" y2="306" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="332" y="278" width="200" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="432" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">外观</text>
    <text x="432" y="318" text-anchor="middle" font-size="10" fill="#1e40af">设计一个新的简化接口</text>
    <line x1="532" y1="306" x2="552" y2="306" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <rect x="554" y="278" width="386" height="56" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="747" y="300" text-anchor="middle" font-size="11" fill="#334155">把 N 个子系统收成一个入口</text>
    <text x="747" y="318" text-anchor="middle" font-size="10.5" fill="#64748b">与适配器的分界：外观主动设计，适配器被动翻译</text>
  </g>

  <g transform="translate(20,452)">
    <rect x="0" y="0" width="960" height="100" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">另外两组常问的对比</text>
    <text x="14" y="50" font-size="11.5" fill="#334155">适配器 vs 策略：适配器是"对不同策略的接口做统一"，策略是"随需求切换选哪个算法"；两者常一起用 —— 策略要统一接口，而各实现形状不一时，中间就加适配器。</text>
    <text x="14" y="72" font-size="11.5" fill="#334155">对象适配器 vs 类适配器：本目录一律用对象适配器（组合 + 注入）。PHP 单继承、Go 无继承，类适配器不可行；Java 虽可行但一继承就占掉唯一继承位，无法同时适配多个来源。</text>
    <text x="14" y="92" font-size="11.5" fill="#92400e">三语言声明：PHP/Java 用 interface + implements 约束；Go 隐式实现 —— 忘了实现某方法要等赋值给接口变量时编译器才报。</text>
  </g>
</svg>
