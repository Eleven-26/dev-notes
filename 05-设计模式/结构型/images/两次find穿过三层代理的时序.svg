<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
    <marker id="arwG" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">两次 find(5) 穿过三层代理，真实对象只被查一次</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">栈是 保护(缓存(虚拟(真实主题))) —— 对应实测第 4 组：4a / 4b 都是 doc#5，4c 是 1</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="660" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 叠加代理的一次完整往返</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">调用方自始至终只调 DocumentRepository::find()</text>

    <rect x="21" y="56" width="118" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="80" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">调用方</text>
    <rect x="141" y="56" width="118" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="200" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">保护代理</text>
    <rect x="261" y="56" width="118" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="320" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">缓存代理</text>
    <rect x="381" y="56" width="118" height="28" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="440" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">虚拟代理</text>
    <rect x="511" y="56" width="118" height="28" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
    <text x="570" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">真实主题</text>

    <line x1="80" y1="84" x2="80" y2="470" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="200" y1="84" x2="200" y2="470" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="320" y1="84" x2="320" y2="470" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="440" y1="84" x2="440" y2="470" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="570" y1="84" x2="570" y2="470" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

    <line x1="80" y1="104" x2="192" y2="104" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="136" y="96" text-anchor="middle" font-size="10.5" fill="#334155">① find(5)</text>
    <text x="212" y="130" font-size="10.5" fill="#14532d">② 角色 admin，放行</text>

    <line x1="200" y1="156" x2="312" y2="156" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="256" y="148" text-anchor="middle" font-size="10.5" fill="#334155">③ find(5)</text>
    <text x="332" y="182" font-size="10.5" fill="#334155">④ 缓存未命中</text>

    <line x1="320" y1="208" x2="432" y2="208" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="376" y="200" text-anchor="middle" font-size="10.5" fill="#334155">⑤ find(5)</text>
    <text x="452" y="234" font-size="10.5" fill="#92400e">⑥ 此刻才创建真实对象</text>

    <line x1="440" y1="260" x2="562" y2="260" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="501" y="252" text-anchor="middle" font-size="10.5" fill="#334155">⑦ find(5)</text>
    <text x="558" y="286" text-anchor="end" font-size="10.5" fill="#334155">⑧ queries[] = 5，返回 doc#5</text>

    <line x1="570" y1="314" x2="448" y2="314" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arwG)"/>
    <text x="509" y="306" text-anchor="middle" font-size="10.5" fill="#14532d">⑨ doc#5</text>
    <line x1="440" y1="340" x2="328" y2="340" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arwG)"/>
    <text x="384" y="332" text-anchor="middle" font-size="10.5" fill="#14532d">⑩ doc#5</text>
    <text x="332" y="366" font-size="10.5" fill="#334155">⑪ 写入 $cache[5]</text>
    <line x1="320" y1="392" x2="88" y2="392" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arwG)"/>
    <text x="204" y="384" text-anchor="middle" font-size="10.5" fill="#14532d">⑫ 4a : doc#5</text>

    <line x1="80" y1="420" x2="192" y2="420" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="136" y="412" text-anchor="middle" font-size="10.5" fill="#334155">⑬ 再调 find(5)</text>
    <line x1="200" y1="446" x2="312" y2="446" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="256" y="438" text-anchor="middle" font-size="10.5" fill="#334155">⑭ find(5)</text>
    <text x="332" y="466" font-size="10.5" fill="#991b1b">⑮ 命中，直接返回</text>

    <text x="14" y="490" font-size="11" fill="#14532d">第二次只走到缓存代理就返回：4b : doc#5，4c_真实查询次数（应为 1）: 1</text>
  </g>

  <g transform="translate(690,74)">
    <rect x="0" y="0" width="290" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 叠加顺序即语义</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">第十节最后一条追问</text>

    <text x="14" y="66" font-size="11" fill="#334155">保护(缓存(虚拟))：</text>
    <text x="14" y="86" font-size="11" fill="#14532d">先鉴权，再查缓存</text>
    <text x="14" y="110" font-size="11" fill="#334155">缓存(保护(虚拟))：</text>
    <text x="14" y="130" font-size="11" fill="#991b1b">缓存命中就绕过鉴权</text>

    <rect x="14" y="146" width="262" height="86" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="168" font-size="11.5" font-weight="bold" fill="#92400e">⭐ 能叠加，只因接口一致</text>
    <text x="28" y="188" font-size="10.5" fill="#92400e">代理持有一律是接口类型，</text>
    <text x="28" y="206" font-size="10.5" fill="#92400e">不是 RealSubject —— 类型写成</text>
    <text x="28" y="224" font-size="10.5" fill="#92400e">具体类，叠加当场就不成立</text>

    <rect x="14" y="246" width="262" height="98" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="28" y="268" font-size="11.5" font-weight="bold" fill="#991b1b">⚠️ 代理里的状态才是坑</text>
    <text x="28" y="288" font-size="10.5" fill="#991b1b">php-fpm：缓存代理只活一次请求</text>
    <text x="28" y="306" font-size="10.5" fill="#991b1b">常驻进程：跨请求共享，</text>
    <text x="28" y="324" font-size="10.5" fill="#991b1b">会读到脏数据 —— 与单例模式</text>
    <text x="28" y="340" font-size="10.5" fill="#991b1b">篇第五节的串号同源</text>

    <text x="14" y="366" font-size="11" fill="#334155">第 2 组实测：find(2) 两次、</text>
    <text x="14" y="386" font-size="11" fill="#334155">find(3) 一次，真实只被查 2 次</text>
    <text x="14" y="410" font-size="11" fill="#991b1b">第 3 组：拒绝发生在代理层，</text>
    <text x="14" y="430" font-size="11" fill="#991b1b">真实对象完全不知道有人来过</text>
    <text x="14" y="456" font-size="11" fill="#92400e">只读视图收窄到接口子集，</text>
    <text x="14" y="476" font-size="11" fill="#92400e">也常被归为保护代理（第六节）</text>
  </g>

  <g transform="translate(20,586)">
    <rect x="0" y="0" width="960" height="112" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">三语言「省掉转发样板」的手段完全不同，实测读数也各不相同</text>
    <text x="14" y="48" font-size="11.5" fill="#334155">Java：Proxy.newProxyInstance 运行时生成 —— 实测 3_动态代理是运行时生成的类 : $Proxy0，真实查询次数 2 -&gt; [1, 2]</text>
    <text x="14" y="70" font-size="11.5" fill="#334155">Go：结构体嵌入接口 —— 实测 3_只覆盖了 Find，其它方法零成本转发；调用计数 = 1</text>
    <text x="14" y="96" font-size="11.5" font-weight="bold" fill="#92400e">PHP：两者都没有 —— 要么 __call（接口方法仍须显式声明），要么引入代码生成；所以本篇四个代理类都是手写转发</text>
  </g>
</svg>
