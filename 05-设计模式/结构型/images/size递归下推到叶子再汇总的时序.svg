<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
    <marker id="arwG" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">size() 的递归方向：父 → 所有子，逐层下推再逐层汇总</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">与装饰器的「外 → 内层层转发」对照 —— 同一招「实现同一接口」，两种用法</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="660" height="460" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. totalSize(root) 的一次递归</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">调用方传进来的只是 Node，它不知道下面是几层树</text>

    <rect x="21" y="56" width="118" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="80" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">调用方</text>
    <rect x="181" y="56" width="118" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="240" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">project 容器</text>
    <rect x="361" y="56" width="118" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="420" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">src 容器</text>
    <rect x="521" y="56" width="118" height="28" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
    <text x="580" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">FileNode 叶子</text>

    <line x1="80" y1="84" x2="80" y2="400" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="240" y1="84" x2="240" y2="400" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="420" y1="84" x2="420" y2="400" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="580" y1="84" x2="580" y2="400" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

    <line x1="80" y1="108" x2="232" y2="108" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="156" y="100" text-anchor="middle" font-size="10" fill="#334155">① root.size()</text>
    <text x="252" y="134" font-size="10" fill="#14532d">② foreach children 累加</text>

    <line x1="240" y1="162" x2="412" y2="162" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="326" y="154" text-anchor="middle" font-size="10" fill="#334155">③ child.size()</text>
    <text x="432" y="188" font-size="10" fill="#14532d">④ 遍历两个文件</text>

    <line x1="420" y1="216" x2="572" y2="216" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="496" y="208" text-anchor="middle" font-size="10" fill="#334155">⑤ index.php.size()</text>
    <line x1="580" y1="244" x2="428" y2="244" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arwG)"/>
    <text x="504" y="236" text-anchor="middle" font-size="10" fill="#14532d">⑥ 直接返回 $bytes</text>

    <line x1="420" y1="272" x2="572" y2="272" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="496" y="264" text-anchor="middle" font-size="10" fill="#334155">⑦ README.size()</text>
    <line x1="580" y1="300" x2="428" y2="300" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arwG)"/>
    <text x="504" y="292" text-anchor="middle" font-size="10" fill="#14532d">⑧ 又是 $bytes</text>

    <line x1="420" y1="328" x2="248" y2="328" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arwG)"/>
    <text x="334" y="320" text-anchor="middle" font-size="10" fill="#14532d">⑨ 子项之和返回</text>
    <line x1="240" y1="356" x2="88" y2="356" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arwG)"/>
    <text x="164" y="348" text-anchor="middle" font-size="10" fill="#14532d">⑩ 根目录的和</text>

    <text x="14" y="386" font-size="11" fill="#334155">⑪ 全程没有一次 instanceof：叶子和容器走的是同一条代码路径</text>
    <text x="14" y="410" font-size="11" fill="#14532d">递归只写在容器里 —— 叶子不知道自己在一棵树里</text>
    <text x="14" y="434" font-size="11" fill="#991b1b">若容器里出现环，这条递归就永远回不来（见下一张判据流程图）</text>
  </g>

  <g transform="translate(690,74)">
    <rect x="0" y="0" width="290" height="460" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 树与链的递归对照</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">第五节那张表画成两条路径</text>

    <rect x="14" y="56" width="262" height="112" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="78" font-size="11.5" font-weight="bold" fill="#14532d">组合：父 → 所有子</text>
    <text x="28" y="98" font-size="10.5" fill="#14532d">一个容器有任意多个孩子</text>
    <text x="28" y="116" font-size="10.5" fill="#14532d">size() / 遍历 / 序列化都是分叉的</text>
    <text x="28" y="134" font-size="10.5" fill="#14532d">求和要把所有分支都算完</text>
    <text x="28" y="156" font-size="10.5" font-weight="bold" fill="#14532d">实测 2_目录 : 2300，3_根 : 3800</text>

    <rect x="14" y="180" width="262" height="112" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="202" font-size="11.5" font-weight="bold" fill="#1e40af">装饰器：外 → 内</text>
    <text x="28" y="222" font-size="10.5" fill="#1e40af">恰好一个被装饰对象</text>
    <text x="28" y="240" font-size="10.5" fill="#1e40af">层层转发，是一条链不是树</text>
    <text x="28" y="258" font-size="10.5" fill="#1e40af">读时还要原路剥回来</text>
    <text x="28" y="280" font-size="10.5" font-weight="bold" fill="#1e40af">实测 zlib(enc(olleh)) → hello</text>

    <text x="14" y="312" font-size="11" font-weight="bold" fill="#92400e">共同点只有一条：都实现同一接口</text>
    <text x="14" y="332" font-size="11" fill="#334155">区别在「一个孩子」还是「一群孩子」</text>
    <text x="14" y="352" font-size="11" fill="#334155">组合统一部分与整体；装饰器加行为</text>
    <text x="14" y="378" font-size="11" fill="#991b1b">本篇采安全型：容器才有的方法</text>
    <text x="14" y="398" font-size="11" fill="#991b1b">绝不放进 Component 接口</text>
    <text x="14" y="424" font-size="11" fill="#334155">Java 的对位物是 java.io.File：</text>
    <text x="14" y="444" font-size="11" fill="#334155">同一个类既当文件又当目录，拿不到统一接口的好处</text>
  </g>

  <g transform="translate(20,546)">
    <rect x="0" y="0" width="960" height="96" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">三语言：结构一样，编译器帮忙的程度不一样（第七节）</text>
    <text x="14" y="50" font-size="11.5" fill="#334155">PHP / Java：interface Node + implements 显式约束；Go：接口隐式实现，「叶子与容器同接口」在编译期自动成立（var asFile Node = readme）</text>
    <text x="14" y="76" font-size="11.5" fill="#92400e">三语言的实测输出逐行一致：1 : 1200　2 : 2300　3 : 3800　4 : true　5 / 6 : 不允许成环：project —— 组合模式是结构模式，与语言无关</text>
  </g>
</svg>
