<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#94a3b8"/>
    </marker>
    <marker id="arwG" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">place() 的一次编排：reserve → charge → notifyPaid</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">方法体里只有三次转发和一个 return —— 实测 7 行、0 分支、0 内部可变状态</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="660" height="420" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 外观内部只转发 + 顺序编排</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">调用方只发一次意图，不必回头查状态</text>

    <rect x="21" y="56" width="118" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="80" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">调用方</text>
    <rect x="141" y="56" width="118" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="200" y="74" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">CheckoutFacade</text>
    <rect x="271" y="56" width="118" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="330" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">库存服务</text>
    <rect x="401" y="56" width="118" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="460" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">支付网关</text>
    <rect x="531" y="56" width="118" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="590" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">通知服务</text>

    <line x1="80" y1="84" x2="80" y2="330" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="200" y1="84" x2="200" y2="330" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="330" y1="84" x2="330" y2="330" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="460" y1="84" x2="460" y2="330" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="590" y1="84" x2="590" y2="330" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

    <line x1="80" y1="106" x2="192" y2="106" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="136" y="98" text-anchor="middle" font-size="10" fill="#334155">① place(1, 88, 1, 25000)</text>

    <line x1="200" y1="140" x2="322" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="261" y="132" text-anchor="middle" font-size="10" fill="#334155">② reserve(88, 1)</text>
    <line x1="330" y1="168" x2="208" y2="168" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arwG)"/>
    <text x="269" y="160" text-anchor="middle" font-size="10" fill="#14532d">reserved 88x1</text>

    <line x1="200" y1="200" x2="452" y2="200" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="326" y="192" text-anchor="middle" font-size="10" fill="#334155">③ charge(25000)</text>
    <line x1="460" y1="228" x2="208" y2="228" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arwG)"/>
    <text x="334" y="220" text-anchor="middle" font-size="10" fill="#14532d">$txn = txn_25000</text>

    <line x1="200" y1="260" x2="582" y2="260" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="391" y="252" text-anchor="middle" font-size="10" fill="#334155">④ notifyPaid(1)</text>
    <line x1="590" y1="288" x2="208" y2="288" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arwG)"/>
    <text x="399" y="280" text-anchor="middle" font-size="10" fill="#14532d">notified 1</text>

    <line x1="200" y1="320" x2="88" y2="320" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arwG)"/>
    <text x="144" y="312" text-anchor="middle" font-size="10" fill="#14532d">⑤ return $txn</text>

    <text x="14" y="356" font-size="11.5" font-weight="bold" fill="#334155">顺序由外观固定：先占库存、再扣款、最后通知</text>
    <text x="14" y="378" font-size="11" fill="#14532d">实测三行：1_外观调用 : txn_25000　2_子系统单独使用 : txn_999　3_子系统直接询问 : reserved 88x1</text>
    <text x="14" y="400" font-size="11" fill="#991b1b">第 2、3 行是关键：外观不独占子系统，排错时能绕开门面直接问某个子系统</text>
  </g>

  <g transform="translate(690,74)">
    <rect x="0" y="0" width="290" height="420" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 方法体里能有什么</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">第三节的四条「标准写法」细节</text>

    <text x="14" y="66" font-size="11" font-weight="bold" fill="#14532d">① 只有转发 + 顺序编排</text>
    <text x="14" y="84" font-size="10.5" fill="#334155">出现 if / match 判断业务，</text>
    <text x="14" y="100" font-size="10.5" fill="#334155">说明领域规则住错了地方</text>

    <text x="14" y="126" font-size="11" font-weight="bold" fill="#14532d">② 依赖全部构造注入、private</text>
    <text x="14" y="144" font-size="10.5" fill="#334155">外观自己 new 子系统</text>
    <text x="14" y="160" font-size="10.5" fill="#334155">就无法替换测试替身</text>

    <text x="14" y="186" font-size="11" font-weight="bold" fill="#14532d">③ 一个用例一个类</text>
    <text x="14" y="204" font-size="10.5" fill="#334155">CheckoutFacade 而不是</text>
    <text x="14" y="220" font-size="10.5" fill="#334155">OrderService::handle($action)</text>

    <text x="14" y="246" font-size="11" font-weight="bold" fill="#14532d">④ 返回业务上有意义的东西</text>
    <text x="14" y="264" font-size="10.5" fill="#334155">返回 $txn，不返回「成功」</text>

    <rect x="14" y="282" width="262" height="120" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="28" y="304" font-size="11.5" font-weight="bold" fill="#991b1b">越界的写法会长成什么样</text>
    <text x="28" y="326" font-size="10.5" fill="#991b1b">OrderGodService::handle()：</text>
    <text x="28" y="344" font-size="10.5" fill="#991b1b">vip 且 qty 大于 10 就改数量、</text>
    <text x="28" y="362" font-size="10.5" fill="#991b1b">match 渠道算手续费、</text>
    <text x="28" y="380" font-size="10.5" fill="#991b1b">还自己养一个 $memo 缓存</text>
    <text x="28" y="398" font-size="10.5" font-weight="bold" fill="#991b1b">→ 见第四节那张反射量法图</text>
  </g>

  <g transform="translate(20,506)">
    <rect x="0" y="0" width="960" height="96" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">三语言实测逐行一致，差别只在形态与错误传播</text>
    <text x="14" y="48" font-size="11.5" fill="#334155">PHP：XxxUseCase / application service ｜ Java：@Service 用例类（构造注入 + 容器）｜ Go：XxxUseCase struct（NewXxx 里装配）</text>
    <text x="14" y="74" font-size="11.5" fill="#92400e">错误传播：PHP / Java 抛异常，Go 是 error 逐层返回。共通的一条：外观是「入口」，不是「真相源」（第九节）</text>
  </g>
</svg>
