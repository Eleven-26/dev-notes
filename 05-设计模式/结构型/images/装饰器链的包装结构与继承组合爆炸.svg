<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">装饰器链的形状：一层套一层，每层都实现同一个接口</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">用组合和委托，而不是继承来解决扩展问题 —— 原文的题眼</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="600" height="330" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. Counting(Encryption(Compression(Plain)))</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">最外面是计数，往里是加密、压缩，最内层才是真正存数据的对象</text>

    <rect x="20" y="58" width="560" height="180" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="36" y="78" font-size="11.5" font-weight="bold" fill="#14532d">CountingDecorator —— 只加统计，转发时不改数据</text>

    <rect x="46" y="86" width="508" height="140" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="62" y="106" font-size="11.5" font-weight="bold" fill="#1e40af">EncryptionDecorator —— write 加 enc()、read 剥 enc() 再 strrev</text>

    <rect x="72" y="114" width="456" height="100" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="88" y="134" font-size="11.5" font-weight="bold" fill="#92400e">CompressionDecorator —— 加 / 剥 zlib()</text>

    <rect x="98" y="142" width="404" height="60" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="114" y="162" font-size="11.5" font-weight="bold" fill="#334155">PlainDataSource（ConcreteComponent）</text>
    <text x="114" y="182" font-size="10.5" fill="#334155">public string $stored —— 真正落盘的地方</text>
    <text x="114" y="196" font-size="10" fill="#64748b">它完全不知道自己被包了三层</text>

    <text x="14" y="258" font-size="11" fill="#14532d">写：write('hello') 从最外层进，落到最内层是 zlib(enc(olleh))</text>
    <text x="14" y="278" font-size="11" fill="#14532d">读：read() 从最外层进，逐层剥掉包装，读回 hello（实测 3_两者读回来相同 : true）</text>
    <text x="14" y="300" font-size="10.5" fill="#92400e">装饰器之间互不知情：CountingDecorator 不知道里面还有加密，它只按接口转发</text>
    <text x="14" y="318" font-size="10.5" fill="#334155">前提只有一条：装饰器自己也实现 DataSource 接口 —— 所以能被再包一层</text>
  </g>

  <g transform="translate(640,74)">
    <rect x="0" y="0" width="340" height="330" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 为什么不用继承</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">原文理由 2：子类过多、继承链很长</text>

    <text x="14" y="66" font-size="11.5" font-weight="bold" fill="#991b1b">3 种加工能力用继承：</text>
    <text x="14" y="86" font-size="10.5" fill="#991b1b">2³ = 8 个组合子类</text>
    <text x="14" y="106" font-size="10.5" fill="#334155">Plain / C / E / N / CE / CN / EN / CEN</text>
    <text x="14" y="126" font-size="10.5" fill="#991b1b">再加一种能力就变 16 个</text>
    <text x="14" y="146" font-size="10.5" fill="#991b1b">编译期固定，运行时不能重组</text>

    <rect x="14" y="160" width="312" height="100" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="182" font-size="11.5" font-weight="bold" fill="#14532d">用装饰器：3 个类</text>
    <text x="28" y="204" font-size="10.5" fill="#14532d">Compression / Encryption / Counting</text>
    <text x="28" y="224" font-size="10.5" fill="#14532d">运行时任意排列组合</text>
    <text x="28" y="244" font-size="10.5" font-weight="bold" fill="#14532d">子类数量从指数级降到线性</text>

    <text x="14" y="282" font-size="10.5" fill="#334155">原文那句"父与子关系不超过 3 个"</text>
    <text x="14" y="302" font-size="10.5" fill="#92400e">代价：层数不透明 —— 叠加层数要克制</text>
  </g>

  <g transform="translate(20,416)">
    <rect x="0" y="0" width="960" height="134" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">C. 三个角色与四条「标准写法」细节</text>
    <text x="14" y="48" font-size="11.5" fill="#334155">Component：被装饰对象与所有装饰器共用的接口 —— 这是"可以再被装饰"的前提，也是与代理最容易混淆的一点。</text>
    <text x="14" y="70" font-size="11.5" fill="#334155">ConcreteComponent：真正干活的原始对象。Decorator：也实现 Component，内部持有一个 Component，转发并加工。</text>
    <text x="14" y="92" font-size="11.5" fill="#334155">四条细节：抽象基类收拢 $wrapped；装饰器之间互不知情；被装饰对象由构造器传入（不在装饰器里 new，否则无法组合、也测不了）。</text>
    <text x="14" y="116" font-size="11.5" fill="#92400e">三语言落地：PHP PSR-7/PSR-15 中间件栈 ｜ Java java.io 流链（BufferedReader 包 InputStreamReader）｜ Go func(next T) T</text>
  </g>
</svg>
