<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" role="img">
<title>一次请求的端到端链路时序图</title>
<desc>请求从客户端进程出发，经本机协议栈、出口网关 SNAT、公网逐跳转发、目标负载均衡，到达服务端进程；响应原路或经不同路径返回。图中标注了三处改写点：网关 SNAT 改源 IP 与端口、LB DNAT 或 L7 代理改目的 IP 或新开连接、每跳重写 MAC。</desc>
<rect x="0" y="0" width="700" height="560" fill="#1e1e1e"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="24" width="116" height="54" rx="10" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="98" y="44" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#B5D4F4">客户端进程</text>
<text x="98" y="62" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#85B7EB">socket</text>
<rect x="166" y="24" width="116" height="54" rx="10" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="224" y="44" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#B5D4F4">本机协议栈</text>
<text x="224" y="62" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#85B7EB">路由表 + ARP</text>
<rect x="292" y="24" width="116" height="54" rx="10" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/>
<text x="350" y="44" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#FAC775">出口网关</text>
<text x="350" y="62" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#EF9F27">NAT + 防火墙</text>
<rect x="418" y="24" width="116" height="54" rx="10" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/>
<text x="476" y="44" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#FAC775">目标 LB / 代理</text>
<text x="476" y="62" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#EF9F27">L4 转发 / L7 终结</text>
<rect x="544" y="24" width="116" height="54" rx="10" fill="#2C2C2A" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="602" y="44" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#F1EFE8">服务端进程</text>
<text x="602" y="62" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#B4B2A9">accept / recv</text>
<line x1="98" y1="78" x2="98" y2="418" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="224" y1="78" x2="224" y2="418" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="350" y1="78" x2="350" y2="418" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="476" y1="78" x2="476" y2="418" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="602" y1="78" x2="602" y2="418" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="98" y1="120" x2="218" y2="120" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="106" y="108" font-size="11" fill="#B5D4F4">① 查路由表 → ARP 拿网关 MAC</text>
<line x1="224" y1="156" x2="344" y2="156" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="232" y="144" font-size="11" fill="#B5D4F4">② SYN, src = 10.44.147.x:54321</text>
<rect x="300" y="176" width="230" height="40" rx="8" fill="#412402" stroke="#854F0B" stroke-width="0.5"/>
<text x="310" y="190" font-size="11" fill="#FAC775">③ SNAT：改写为 203.0.113.9:40001</text>
<text x="310" y="206" font-size="11" fill="#EF9F27">   同时在 conntrack 里记一行映射</text>
<line x1="350" y1="240" x2="470" y2="240" stroke="#EF9F27" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="358" y="228" font-size="11" fill="#FAC775">④ 经运营商 AS / BGP 逐跳转发（只换 MAC、TTL−1）</text>
<line x1="476" y1="276" x2="596" y2="276" stroke="#EF9F27" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="484" y="264" font-size="11" fill="#FAC775">⑤ DNAT 到后端 / 或 L7 代理新开一条 TCP</text>
<line x1="98" y1="312" x2="596" y2="312" stroke="#85B7EB" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="240" y="300" font-size="11" fill="#B5D4F4">⑥ 握手完成后发请求（端到端 IP 不变）</text>
<line x1="602" y1="348" x2="104" y2="348" stroke="#9FE1CB" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="240" y="336" font-size="11" fill="#9FE1CB">⑦ 响应回程：可能走另一条 AS 路径，经网关反向还原</text>
<rect x="40" y="418" width="620" height="122" rx="10" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="56" y="440" font-size="11" fill="#D3D1C7">改写点只有三处：网关 SNAT（改源 IP:端口）、LB DNAT（改目的 IP）或 L7 代理（新开一条 TCP）、每跳重写 MAC</text>
<text x="56" y="464" font-size="11" fill="#D3D1C7">IP 端到端不变（NAT / LB 除外）；端口只有 NAT 会改；TTL 每跳减 1 —— 这三条决定了抓包时你会看到什么</text>
<text x="56" y="488" font-size="11" fill="#D3D1C7">回程不一定与去程同路：客户端侧的 traceroute 只画得出「去程」，回程问题要找对端或中间设备配合</text>
<text x="56" y="512" font-size="11" fill="#888780">长连接被"静默断开"的根因就在③与⑤：会话空闲超时 → 映射被删 → 两端都不知情（心跳要短于最小超时）</text>
</svg>
