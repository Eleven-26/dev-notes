<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="880" height="720" fill="#ffffff"/>

  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">网关的七模块请求流水线</text>
  <text x="440" y="56" text-anchor="middle" font-size="12.5" fill="#6b7280">顺序不是风格问题：鉴权必须在限流前、熔断必须在选节点前</text>

  <!-- 客户端 -->
  <rect x="330" y="76" width="220" height="42" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="440" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#3730a3">客户端</text>
  <path d="M440 118 L440 142" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 网关外框 -->
  <rect x="96" y="146" width="688" height="466" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
  <text x="120" y="172" font-size="14" font-weight="700" fill="#0f172a">API 网关</text>
  <text x="760" y="172" text-anchor="end" font-size="11.5" fill="#64748b">每个模块一个 .go 文件</text>

  <!-- 七个模块条 -->
  <!-- 1 -->
  <rect x="120" y="186" width="640" height="50" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="138" y="208" font-size="13.5" font-weight="700" fill="#1d4ed8">① 路由匹配</text>
  <text x="138" y="226" font-size="11.5" fill="#475569">Host / Path（exact &gt; regex &gt; 最长 prefix）/ Method / Header　→ 不匹配即 404</text>
  <text x="744" y="216" text-anchor="end" font-size="11" fill="#1e40af">route.go</text>

  <!-- 2 -->
  <rect x="120" y="246" width="640" height="50" rx="7" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
  <text x="138" y="268" font-size="13.5" font-weight="700" fill="#b91c1c">② 认证鉴权</text>
  <text x="138" y="286" font-size="11.5" fill="#475569">JWT(HS256) / API Key　→ 401（凭证问题）与 403（权限不足）分开</text>
  <text x="744" y="276" text-anchor="end" font-size="11" fill="#991b1b">auth.go</text>

  <!-- 3 -->
  <rect x="120" y="306" width="640" height="50" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="138" y="328" font-size="13.5" font-weight="700" fill="#b45309">③ 限流（令牌桶）</text>
  <text x="138" y="346" font-size="11.5" fill="#475569">按用户（未登录回落 IP）　→ 429 + Retry-After　※ 必须在鉴权之后</text>
  <text x="744" y="336" text-anchor="end" font-size="11" fill="#92400e">limit.go</text>

  <!-- 4 -->
  <rect x="120" y="366" width="640" height="50" rx="7" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
  <text x="138" y="388" font-size="13.5" font-weight="700" fill="#b91c1c">③ 熔断（三态机）</text>
  <text x="138" y="406" font-size="11.5" fill="#475569">看上游错误率　→ 打开后直接 503 快速失败　※ 必须在选节点之前</text>
  <text x="744" y="396" text-anchor="end" font-size="11" fill="#991b1b">breaker.go</text>

  <!-- 5 -->
  <rect x="120" y="426" width="640" height="50" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="138" y="448" font-size="13.5" font-weight="700" fill="#047857">④ 负载均衡</text>
  <text x="138" y="466" font-size="11.5" fill="#475569">轮询 / 加权轮询 / 最少连接 / 一致性哈希（150 个虚拟节点）　→ 选出上游地址</text>
  <text x="744" y="456" text-anchor="end" font-size="11" fill="#065f46">balancer.go</text>

  <!-- 6 -->
  <rect x="120" y="486" width="640" height="50" rx="7" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="138" y="508" font-size="13.5" font-weight="700" fill="#6d28d9">⑤ 协议转换　/　⑥ 反向代理</text>
  <text x="138" y="526" font-size="11.5" fill="#475569">HTTP+JSON → gRPC（连接池 + 方法名直调）　或　ReverseProxy + 头部治理</text>
  <text x="744" y="516" text-anchor="end" font-size="11" fill="#5b21b6">transcode.go / proxy.go</text>

  <!-- 7 -->
  <rect x="120" y="546" width="640" height="50" rx="7" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.4"/>
  <text x="138" y="568" font-size="13.5" font-weight="700" fill="#0369a1">⑦ 可观测性</text>
  <text x="138" y="586" font-size="11.5" fill="#475569">TraceID 生成/透传　·　结构化访问日志（route / via / who / upstream）　·　/metrics</text>
  <text x="744" y="576" text-anchor="end" font-size="11" fill="#075985">observ.go</text>

  <!-- 横向的「最后统一记账」提示 -->
  <path d="M762 186 L784 186 L784 596 L762 596" fill="none" stroke="#0ea5e9" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="790" y="384" text-anchor="middle" font-size="11" fill="#0369a1" transform="rotate(90 790 384)">无论走哪条分支，最后都记账</text>

  <path d="M440 612 L440 640" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 后端 -->
  <rect x="200" y="644" width="480" height="52" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="440" y="666" text-anchor="middle" font-size="13.5" font-weight="600" fill="#3730a3">后端服务（HTTP ×3 + gRPC ×1）</text>
  <text x="440" y="685" text-anchor="middle" font-size="11.5" fill="#6b7280">实测落点：轮询严格交替 B C A；一致性哈希 300 用户分布 28.3% / 37.0% / 34.7%</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
