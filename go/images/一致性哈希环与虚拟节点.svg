<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="880" height="560" fill="#ffffff"/>

  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">一致性哈希环与虚拟节点</text>
  <text x="440" y="56" text-anchor="middle" font-size="12.5" fill="#6b7280">前提是哈希函数雪崩性够好 —— 否则虚拟节点会全部挤在一起，等于没加</text>

  <!-- 环 -->
  <circle cx="270" cy="290" r="160" fill="none" stroke="#334155" stroke-width="2.5"/>
  <circle cx="270" cy="290" r="4" fill="#334155"/>

  <!-- 虚拟节点：A 蓝 / B 绿 / C 橙，各若干 -->
  <circle cx="270" cy="130" r="6.5" fill="#3b82f6"/><text x="270" y="116" text-anchor="middle" font-size="10" fill="#1d4ed8">A#0</text>
  <circle cx="392" cy="168" r="6.5" fill="#10b981"/><text x="404" y="160" font-size="10" fill="#047857">B#0</text>
  <circle cx="432" cy="264" r="6.5" fill="#f59e0b"/><text x="446" y="262" font-size="10" fill="#b45309">C#0</text>
  <circle cx="410" cy="386" r="6.5" fill="#3b82f6"/><text x="422" y="402" font-size="10" fill="#1d4ed8">A#1</text>
  <circle cx="300" cy="440" r="6.5" fill="#10b981"/><text x="300" y="460" text-anchor="middle" font-size="10" fill="#047857">B#1</text>
  <circle cx="168" cy="416" r="6.5" fill="#f59e0b"/><text x="150" y="432" text-anchor="end" font-size="10" fill="#b45309">C#1</text>
  <circle cx="114" cy="320" r="6.5" fill="#3b82f6"/><text x="100" y="324" text-anchor="end" font-size="10" fill="#1d4ed8">A#2</text>
  <circle cx="140" cy="212" r="6.5" fill="#10b981"/><text x="124" y="200" text-anchor="end" font-size="10" fill="#047857">B#2</text>
  <circle cx="216" cy="142" r="6.5" fill="#f59e0b"/><text x="200" y="128" text-anchor="end" font-size="10" fill="#b45309">C#2</text>

  <!-- key 落点 -->
  <circle cx="352" cy="180" r="5" fill="#ef4444"/>
  <text x="358" y="176" font-size="10.5" fill="#b91c1c" font-weight="700">key = user-7</text>

  <!-- 顺时针查找弧 -->
  <path d="M352 180 A 160 160 0 0 1 432 264" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar5)"/>
  <text x="415" y="215" font-size="10.5" fill="#b91c1c">顺时针找第一个 ≥ h</text>

  <!-- 说明框 -->
  <rect x="546" y="120" width="310" height="176" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="564" y="146" font-size="13" font-weight="700" fill="#334155">为什么要虚拟节点</text>
  <text x="564" y="170" font-size="11.5" fill="#475569">3 个真实节点直接上环，分布极不均：</text>
  <text x="574" y="190" font-size="11.5" fill="#b91c1c">每节点 1 个  → 最大偏差 90.7%</text>
  <text x="574" y="210" font-size="11.5" fill="#b45309">每节点 10 个 → 最大偏差 37.6%</text>
  <text x="574" y="230" font-size="11.5" fill="#047857">每节点 150 个 → 最大偏差 3.9%</text>
  <text x="574" y="250" font-size="11.5" fill="#6b7280">每节点 2000 个 → 2.9%（边际收益已尽）</text>
  <text x="564" y="276" font-size="11.5" fill="#475569">实测：10 万个 key、3 个节点</text>

  <!-- 哈希函数对比 -->
  <rect x="546" y="312" width="310" height="146" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
  <text x="564" y="338" font-size="13" font-weight="700" fill="#b91c1c">⚠️ 比虚拟节点更前置的坑</text>
  <text x="564" y="360" font-size="11.5" fill="#475569">哈希函数雪崩性差，虚拟节点会失效：</text>
  <text x="564" y="382" font-size="11.5" fill="#1f2937">FNV-1a：A#0..A#9 跨度 <tspan font-weight="700" fill="#b91c1c">0.000066%</tspan> 的环</text>
  <text x="564" y="402" font-size="11.5" fill="#1f2937">MD5  ：A#0..A#9 跨度 <tspan font-weight="700" fill="#047857">76.3%</tspan> 的环</text>
  <text x="564" y="424" font-size="11.5" fill="#475569">结果：FNV 下分布偏差 <tspan font-weight="700" fill="#b91c1c">48.1%</tspan>，</text>
  <text x="564" y="442" font-size="11.5" fill="#475569">且「1 个」与「10 个」虚拟节点分布<tspan font-weight="700">完全相同</tspan>。</text>

  <!-- 底部：迁移率 -->
  <rect x="70" y="478" width="742" height="62" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
  <text x="88" y="502" font-size="12.5" font-weight="700" fill="#047857">用哈希环的真正理由：扩容时少迁移（10 万 key、3 → 4 节点实测）</text>
  <text x="88" y="524" font-size="11.5" fill="#475569">哈希环迁移 <tspan font-weight="700" fill="#047857">22.8%</tspan>（理想 1/4 = 25%）；直接取模迁移 <tspan font-weight="700" fill="#b91c1c">74.8%</tspan>（理想 3/4 = 75%）—— 几乎全量重排、缓存全部失效。</text>

  <defs>
    <marker id="ar5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>
</svg>
