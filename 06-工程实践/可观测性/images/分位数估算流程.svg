<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="pq1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">histogram_quantile(0.95, …) 的估算步骤</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">它是「桶内均匀分布 + 线性插值」的近似，不是真值；误差上界约等于桶宽</text>

  <rect x="70" y="84" width="860" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="90" y="116" font-size="14" font-weight="bold" fill="#1e3a8a">① 算 rank（要哪一个位置的样本）</text>
  <text x="90" y="146" font-size="13" fill="#1e3a8a">rank = q × _count = 0.95 × 100 = 95</text>

  <rect x="70" y="196" width="860" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="90" y="228" font-size="14" font-weight="bold" fill="#1e3a8a">② 找第一个「累计计数 ≥ rank」的桶</text>
  <text x="90" y="258" font-size="13" fill="#1e3a8a">le="0.1" 累计 90 &lt; 95 ；le="0.25" 累计 100 ≥ 95 → 命中桶 (0.1, 0.25]</text>

  <rect x="70" y="308" width="860" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="90" y="340" font-size="14" font-weight="bold" fill="#1e3a8a">③ 假定桶内均匀分布 → 线性插值</text>
  <text x="90" y="370" font-size="13" fill="#1e3a8a">0.1 + (0.25 − 0.1) × (95 − 90) / (100 − 90) = 0.175 s = 175 ms</text>

  <rect x="70" y="420" width="860" height="90" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="90" y="452" font-size="14" font-weight="bold" fill="#7c2d12">④ 与真值对比</text>
  <text x="90" y="482" font-size="13" fill="#7c2d12">真值 p95 = 200 ms；插值 175 ms，偏差 25 ms（12.5%）—— 来自 0.1~0.25 这段 150 ms 的桶宽</text>

  <line x1="500" y1="174" x2="500" y2="196" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#pq1)"/>
  <line x1="500" y1="286" x2="500" y2="308" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#pq1)"/>
  <line x1="500" y1="398" x2="500" y2="420" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#pq1)"/>

  <rect x="20" y="528" width="960" height="76" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="36" y="556" font-size="12.5" fill="#0f172a">⚠️ 误差来源是「桶内均匀分布」这个假设 —— 真实延迟通常右偏，插值结果与真值必有偏差，偏差上界约等于桶宽。</text>
  <text x="36" y="584" font-size="12.5" fill="#0f172a">⭐⭐ 所以 SLO 阈值应当正好落在某个桶边界上；若边界只有 0.25 与 0.5，判定就落在插值区间里，误差最大可达 250 ms。</text>
</svg>
