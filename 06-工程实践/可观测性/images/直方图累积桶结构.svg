<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="pb1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">直方图的累积桶结构（副本 A：90 × 5ms + 10 × 200ms）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">每个 le 桶存的是「耗时 ≤ 上界」的累计次数，从左到右单调不减；_sum 与 _count 同样逐点可加</text>

  <line x1="110" y1="460" x2="900" y2="460" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="110" y1="170" x2="900" y2="170" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="110" y1="200" x2="900" y2="200" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="100" y="204" text-anchor="end" font-size="12" fill="#64748b">90</text>
  <text x="100" y="174" text-anchor="end" font-size="12" fill="#64748b">100</text>
  <text x="100" y="464" text-anchor="end" font-size="12" fill="#64748b">0</text>
  <text x="118" y="132" font-size="12" fill="#334155">累计次数</text>

  <polyline points="130,460 242,460 242,200 522,200 522,170 858,170" fill="none" stroke="#2563eb" stroke-width="2.6"/>
  <circle cx="242" cy="200" r="4.5" fill="#2563eb"/>
  <circle cx="522" cy="170" r="4.5" fill="#2563eb"/>

  <line x1="242" y1="200" x2="300" y2="92" stroke="#334155" stroke-width="1.2" marker-end="url(#pb1)"/>
  <text x="306" y="88" font-size="12.5" fill="#1e3a8a">le="0.005" → ≤ 5ms 的累计 90 次</text>
  <line x1="522" y1="170" x2="560" y2="88" stroke="#334155" stroke-width="1.2" marker-end="url(#pb1)"/>
  <text x="566" y="84" font-size="12.5" fill="#1e3a8a">le="0.25" → 累计 100 次（10 个 200ms 落在此格）</text>

  <text x="130" y="482" text-anchor="middle" font-size="11" fill="#64748b">0.001</text>
  <text x="242" y="482" text-anchor="middle" font-size="11" fill="#64748b">0.005</text>
  <text x="466" y="482" text-anchor="middle" font-size="11" fill="#64748b">0.1</text>
  <text x="522" y="482" text-anchor="middle" font-size="11" fill="#64748b">0.25</text>
  <text x="802" y="482" text-anchor="middle" font-size="11" fill="#64748b">10</text>
  <text x="858" y="482" text-anchor="middle" font-size="11" fill="#64748b">+Inf</text>
  <text x="500" y="502" text-anchor="middle" font-size="11" fill="#94a3b8">le（秒，非等距示意）</text>

  <rect x="20" y="520" width="960" height="122" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="548" font-size="12.5" fill="#334155">① `_bucket{"le"}` 是「≤ 上界」的累计计数，不是「正好落在本格」的计数 —— 所以从左到右单调不减。</text>
  <text x="36" y="574" font-size="12.5" fill="#334155">② `_sum` = 90 × 0.005 + 10 × 0.2 = 2.45（秒）；`_count` = 100，恒等于 `le="+Inf"` 那一行。</text>
  <text x="36" y="600" font-size="12.5" fill="#334155">③ 累积序列是 `histogram_quantile()` 定位桶的前提；若渲染时重复累积，`le` 序列会错位（实测过 0,0,1,2,3,5,7…）。</text>
  <text x="36" y="626" font-size="12.5" fill="#b91c1c">⚠️ 本项目采取「观测只加到第一个匹配的桶、渲染时做前缀和」，避免两边都累积把数值算两遍。</text>
</svg>
