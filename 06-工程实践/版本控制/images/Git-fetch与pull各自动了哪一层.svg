<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">fetch 与 pull 各自动了哪一层</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">数据从远程到工作区要过五层，两条命令的差别就是"走到第几层就停"</text>

  <rect x="25" y="96" width="176" height="118" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="113" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">远程仓库</text>
  <text x="113" y="142" text-anchor="middle" font-size="10.5" fill="#64748b">另一处的 main</text>
  <text x="113" y="166" text-anchor="middle" font-size="10.5" fill="#334155">9592af4</text>
  <text x="113" y="186" text-anchor="middle" font-size="10.5" fill="#334155">远程新增第 2 行</text>

  <rect x="217" y="96" width="176" height="118" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="305" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">远程跟踪分支</text>
  <text x="305" y="142" text-anchor="middle" font-size="10.5" fill="#166534">refs/remotes</text>
  <text x="305" y="162" text-anchor="middle" font-size="10.5" fill="#166534">/origin/main</text>
  <text x="305" y="186" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">fetch 改的就是它</text>

  <rect x="409" y="96" width="176" height="118" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="497" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">本地分支</text>
  <text x="497" y="142" text-anchor="middle" font-size="10.5" fill="#1d4ed8">refs/heads/main</text>
  <text x="497" y="166" text-anchor="middle" font-size="10.5" fill="#1d4ed8">fetch 后仍 5d03fda</text>
  <text x="497" y="186" text-anchor="middle" font-size="10.5" fill="#1d4ed8">pull 后才 9592af4</text>

  <rect x="601" y="96" width="176" height="118" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="689" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">暂存区 index</text>
  <text x="689" y="142" text-anchor="middle" font-size="10.5" fill="#b45309">合并时一并更新</text>
  <text x="689" y="166" text-anchor="middle" font-size="10.5" fill="#b45309">fetch 完全不碰</text>

  <rect x="793" y="96" width="176" height="118" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="881" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">工作区 app.txt</text>
  <text x="881" y="142" text-anchor="middle" font-size="10.5" fill="#9a3412">fetch 前后都是 line-1</text>
  <text x="881" y="166" text-anchor="middle" font-size="10.5" fill="#9a3412">pull 后多出行 2</text>
  <text x="881" y="186" text-anchor="middle" font-size="10.5" fill="#9a3412">别人的改动落地</text>

  <line x1="201" y1="155" x2="215" y2="155" stroke="#334155" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="393" y1="155" x2="407" y2="155" stroke="#334155" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="585" y1="155" x2="599" y2="155" stroke="#334155" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="777" y1="155" x2="791" y2="155" stroke="#334155" stroke-width="1.8" marker-end="url(#arw)"/>

  <rect x="25" y="240" width="368" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="209" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">git fetch origin：只走这两层，下载对象并推进跟踪分支</text>

  <rect x="25" y="294" width="944" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="497" y="319" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">git pull = fetch + merge：继续往后走，移动本地分支指针、更新暂存区与工作区</text>

  <rect x="20" y="356" width="960" height="188" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="384" font-size="13" font-weight="bold" fill="#0f172a">同一场景三个时点的实测读数（本地 clone 一个裸仓库当远程）</text>
  <text x="40" y="412" font-size="12" fill="#334155">fetch 前：本地 main 5d03fda ｜ origin/main 5d03fda ｜ 工作区只有 line-1 ｜ status 首行 "## main...origin/main" ｜ behind 0</text>
  <text x="40" y="438" font-size="12" fill="#15803d">fetch 后：本地 main 5d03fda ｜ origin/main 9592af4 ｜ 工作区仍只有 line-1 ｜ status 首行 "[behind 1]" ｜ behind 1</text>
  <text x="40" y="464" font-size="12" fill="#1d4ed8">pull 后：本地 main 9592af4 ｜ origin/main 9592af4 ｜ 工作区变成 line-1 加 line-2 ｜ behind 归零</text>
  <text x="40" y="494" font-size="12" fill="#0f172a">要点：fetch 后 "git log --oneline HEAD..origin/main" 就能列出别人做了什么（实测输出 9592af4），确认过再手动 merge。</text>
  <text x="40" y="520" font-size="12" fill="#b45309">注意：手动 fetch + merge 与直接 pull 得到同样结果（实测都是本地分支 9592af4、文件两行），差别只在中间有没有停下来看过。</text>

  <text x="20" y="578" font-size="12" fill="#0f172a">延伸：pull 默认走 merge，想让它改成 rebase 用 "git pull --rebase"；想让 fetch 顺带清理失效引用加 "--prune"。</text>
  <text x="20" y="602" font-size="11.5" fill="#94a3b8">读数取自 git 2.44.0.windows.1，完整过程见本篇 4.5 节；reset 三种模式的三区流转见 Git-reset三种模式的三区数据流转.svg。</text>
</svg>
