<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">reset 三种模式的三区数据流转：HEAD 都退，但退到哪一区不同</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">基线都是 A1 到 A2 到 A3 三个提交，命令都是 git reset --模式 A2；c.txt 是 A3 新增的文件</text>

  <rect x="30" y="96" width="150" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="105" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748b">列的含义</text>
  <text x="105" y="134" text-anchor="middle" font-size="10.5" fill="#94a3b8">三个区各存什么</text>

  <rect x="200" y="96" width="240" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="116" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">仓库：提交链与 HEAD</text>
  <text x="320" y="133" text-anchor="middle" font-size="10.5" fill="#1d4ed8">三种模式都在这里把指针退回 A2</text>

  <rect x="460" y="96" width="240" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="580" y="116" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">暂存区 index</text>
  <text x="580" y="133" text-anchor="middle" font-size="10.5" fill="#166534">git diff --cached 看这里</text>

  <rect x="720" y="96" width="240" height="46" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="840" y="116" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">工作区</text>
  <text x="840" y="133" text-anchor="middle" font-size="10.5" fill="#9a3412">磁盘上真实的文件</text>

  <line x1="460" y1="119" x2="442" y2="119" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="720" y1="119" x2="702" y2="119" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="30" y="166" width="150" height="104" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="105" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">--soft</text>
  <text x="105" y="214" text-anchor="middle" font-size="10.5" fill="#64748b">只搬 HEAD 指针</text>
  <text x="105" y="234" text-anchor="middle" font-size="10.5" fill="#64748b">另两区一概不动</text>
  <text x="105" y="254" text-anchor="middle" font-size="10.5" fill="#b45309">用途：改提交信息</text>

  <rect x="200" y="166" width="240" height="104" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="192" text-anchor="middle" font-size="12" fill="#1e3a8a">HEAD 退回 A2</text>
  <text x="320" y="214" text-anchor="middle" font-size="12" fill="#1e3a8a">A3 被甩成分叉外的游离提交</text>
  <text x="320" y="240" text-anchor="middle" font-size="11" fill="#1d4ed8">log 首行：85401fb commit-A2</text>

  <rect x="460" y="166" width="240" height="104" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="580" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">不动，仍是 A3 的样子</text>
  <text x="580" y="216" text-anchor="middle" font-size="12" fill="#166534">diff --cached 列出 c.txt</text>
  <text x="580" y="240" text-anchor="middle" font-size="11" fill="#166534">status 读数：A 空格 c.txt</text>

  <rect x="720" y="166" width="240" height="104" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="840" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">不动</text>
  <text x="840" y="216" text-anchor="middle" font-size="12" fill="#9a3412">a.txt b.txt c.txt 都在</text>
  <text x="840" y="240" text-anchor="middle" font-size="11" fill="#9a3412">diff 未暂存为空</text>

  <line x1="440" y1="218" x2="458" y2="218" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="700" y1="218" x2="718" y2="218" stroke="#94a3b8" stroke-width="1.8"/>

  <rect x="30" y="290" width="150" height="104" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="105" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">--mixed</text>
  <text x="105" y="338" text-anchor="middle" font-size="10.5" fill="#64748b">默认模式</text>
  <text x="105" y="358" text-anchor="middle" font-size="10.5" fill="#64748b">HEAD 加暂存区</text>
  <text x="105" y="378" text-anchor="middle" font-size="10.5" fill="#b45309">用途：重新挑着提交</text>

  <rect x="200" y="290" width="240" height="104" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="316" text-anchor="middle" font-size="12" fill="#1e3a8a">HEAD 退回 A2</text>
  <text x="320" y="340" text-anchor="middle" font-size="11" fill="#1d4ed8">log 首行：2c07c51 commit-A2</text>
  <text x="320" y="364" text-anchor="middle" font-size="11" fill="#1d4ed8">与 soft 的唯一区别在暂存区</text>

  <rect x="460" y="290" width="240" height="104" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="580" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">重置成 A2 的样子</text>
  <text x="580" y="340" text-anchor="middle" font-size="12" fill="#b45309">diff --cached 变空</text>
  <text x="580" y="364" text-anchor="middle" font-size="11" fill="#b45309">status 读数：问号 c.txt</text>

  <rect x="720" y="290" width="240" height="104" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="840" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">不动</text>
  <text x="840" y="340" text-anchor="middle" font-size="12" fill="#9a3412">三个文件都还在磁盘</text>
  <text x="840" y="364" text-anchor="middle" font-size="11" fill="#9a3412">c.txt 只是变成未跟踪</text>

  <line x1="440" y1="342" x2="458" y2="342" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="700" y1="342" x2="718" y2="342" stroke="#94a3b8" stroke-width="1.8"/>

  <rect x="30" y="414" width="150" height="104" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="105" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">--hard</text>
  <text x="105" y="462" text-anchor="middle" font-size="10.5" fill="#64748b">三区全对齐 A2</text>
  <text x="105" y="482" text-anchor="middle" font-size="10.5" fill="#dc2626">改动真被丢弃</text>
  <text x="105" y="502" text-anchor="middle" font-size="10.5" fill="#b45309">危险，靠 reflog 兜底</text>

  <rect x="200" y="414" width="240" height="104" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="440" text-anchor="middle" font-size="12" fill="#1e3a8a">HEAD 退回 A2</text>
  <text x="320" y="464" text-anchor="middle" font-size="11" fill="#1d4ed8">log 首行：98aff32 commit-A2</text>
  <text x="320" y="488" text-anchor="middle" font-size="11" fill="#1d4ed8">A3 在 reflog 里仍是 560fd38</text>

  <rect x="460" y="414" width="240" height="104" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="580" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">重置成 A2 的样子</text>
  <text x="580" y="464" text-anchor="middle" font-size="12" fill="#b45309">diff --cached 变空</text>
  <text x="580" y="488" text-anchor="middle" font-size="11" fill="#b45309">status 读数：整行空白</text>

  <rect x="720" y="414" width="240" height="104" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="840" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">重置成 A2 的样子</text>
  <text x="840" y="464" text-anchor="middle" font-size="12" fill="#b91c1c">ls 只剩 a.txt 与 b.txt</text>
  <text x="840" y="488" text-anchor="middle" font-size="11" fill="#b91c1c">c.txt 已从磁盘消失</text>

  <line x1="440" y1="466" x2="458" y2="466" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="700" y1="466" x2="718" y2="466" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arw)"/>

  <text x="30" y="550" font-size="12" fill="#0f172a">要点：红实线箭头表示这一区被 reset 改了，灰色横线表示没动。三种模式搬 HEAD 的动作完全一样，区别只在跟着改到哪一区。</text>
  <text x="30" y="574" font-size="12" fill="#b91c1c">注意：mixed 后新增文件显示成未跟踪（问号）而不是已修改，git clean -fd 会直接把它删掉，git add 才重新收进暂存区。</text>
  <text x="30" y="598" font-size="12" fill="#64748b">实测：hard 后用 git branch back-560fd38 560fd38 重新挂上分支，git show 560fd38:c.txt 输出 third，对象还在库里。</text>
  <text x="30" y="622" font-size="11.5" fill="#94a3b8">读数取自本机 git 2.44.0.windows.1 的临时仓库，见本篇 4.4 节；换机器跑哈希会变，但状态读数字符串不变。</text>
</svg>
