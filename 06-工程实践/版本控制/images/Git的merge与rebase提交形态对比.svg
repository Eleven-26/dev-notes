<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="aro" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">merge 与 rebase 的提交形态对比：同一分叉走两条路</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">起点相同（main 有 b69296f，feature-login 有 cc577d8 与 07a93e3），差别只在被重放的提交换没换哈希</text>

  <rect x="20" y="80" width="460" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="520" y="80" width="460" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="250" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">git merge --no-ff：保留分叉</text>
  <text x="750" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">git rebase main：变成直线</text>

  <rect x="160" y="120" width="180" height="40" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="250" y="145" text-anchor="middle" font-size="12" fill="#334155">2cd5113 init: v1</text>
  <rect x="160" y="180" width="180" height="40" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="250" y="205" text-anchor="middle" font-size="12" fill="#7c2d12">f29d2aa feat: 登录</text>
  <rect x="40" y="240" width="180" height="40" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="130" y="265" text-anchor="middle" font-size="12" fill="#1e3a8a">b69296f fix: 补配置</text>
  <rect x="270" y="240" width="180" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="360" y="265" text-anchor="middle" font-size="12" fill="#14532d">cc577d8 feat: 登录页</text>
  <rect x="270" y="296" width="180" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="360" y="321" text-anchor="middle" font-size="12" fill="#14532d">07a93e3 test: 用例</text>
  <rect x="200" y="350" width="180" height="40" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="290" y="375" text-anchor="middle" font-size="12" fill="#7f1d1d">f054075 merge 提交</text>

  <line x1="250" y1="160" x2="250" y2="178" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="215" y1="220" x2="150" y2="238" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="285" y1="220" x2="345" y2="238" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="360" y1="280" x2="360" y2="294" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="160" y1="280" x2="256" y2="348" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="360" y1="336" x2="320" y2="348" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="655" y="120" width="190" height="40" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="750" y="145" text-anchor="middle" font-size="12" fill="#334155">2cd5113 init: v1</text>
  <rect x="655" y="176" width="190" height="40" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="750" y="201" text-anchor="middle" font-size="12" fill="#7c2d12">f29d2aa feat: 登录</text>
  <rect x="655" y="232" width="190" height="40" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="750" y="257" text-anchor="middle" font-size="12" fill="#1e3a8a">b69296f fix: 补配置</text>
  <rect x="655" y="288" width="190" height="40" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="750" y="307" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">2112dd9 feat: 登录页</text>
  <text x="750" y="322" text-anchor="middle" font-size="10.5" fill="#9a3412">原 cc577d8，哈希已改写</text>
  <rect x="655" y="344" width="190" height="40" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="750" y="363" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">81209f9 test: 用例</text>
  <text x="750" y="378" text-anchor="middle" font-size="10.5" fill="#9a3412">原 07a93e3，哈希已改写</text>

  <line x1="750" y1="160" x2="750" y2="174" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="750" y1="216" x2="750" y2="230" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="750" y1="272" x2="750" y2="286" stroke="#ea580c" stroke-width="1.8" marker-end="url(#aro)"/>
  <line x1="750" y1="328" x2="750" y2="342" stroke="#ea580c" stroke-width="1.8" marker-end="url(#aro)"/>

  <text x="750" y="400" text-anchor="middle" font-size="12" fill="#64748b">rebase 后 main 再 merge 是快进，只剩一条直线</text>

  <rect x="20" y="404" width="460" height="182" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="432" font-size="13" font-weight="bold" fill="#0f172a">左：merge 的真实图形态</text>
  <text x="40" y="458" font-size="12" fill="#334155">提交数 5 变 6，只多一个合并提交 f054075。</text>
  <text x="40" y="480" font-size="12" fill="#334155">f054075 有两个父：父一 b69296f、父二 07a93e3。</text>
  <text x="40" y="502" font-size="12" fill="#334155">既有五个提交的哈希一个都没变。</text>
  <text x="40" y="524" font-size="12" fill="#334155">代价：图上留下分叉，公共分支看不出谁先谁后。</text>
  <text x="40" y="552" font-size="12" fill="#b45309">适合公共分支：不改写别人基于其工作的历史。</text>

  <rect x="520" y="404" width="460" height="182" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="540" y="432" font-size="13" font-weight="bold" fill="#0f172a">右：rebase 的真实图形态</text>
  <text x="540" y="458" font-size="12" fill="#334155">reflog 证据：rebase (finish) onto b69296f3……</text>
  <text x="540" y="480" font-size="12" fill="#334155">cc577d8 变 2112dd9，07a93e3 变 81209f9。</text>
  <text x="540" y="502" font-size="12" fill="#334155">main 原有的 b69296f、f29d2aa、2cd5113 不变。</text>
  <text x="540" y="524" font-size="12" fill="#334155">收益是没有分叉的一条直线；代价是提交哈希全变。</text>
  <text x="540" y="552" font-size="12" fill="#b45309">注意：只能对未推送的本地提交做，推送后要 --force-with-lease。</text>

  <text x="20" y="606" font-size="12.5" fill="#0f172a">要点：判据不是「哪个更好看」，而是「被重放的这批提交有没有别人基于它工作」。</text>
</svg>
