  <rect x="260" y="280" width="180" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="350" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">cc577d8</text>
