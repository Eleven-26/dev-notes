  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">提交图的 DAG 形态：分叉、公共祖先与双父合并</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">实测 git 2.44.0.windows.1：git merge --no-ff 只新增一个提交，既有提交的哈希一个都不变</text>

  <text x="60" y="92" font-size="14" font-weight="bold" fill="#0f172a">合并前：两个分支各自前进</text>
  <text x="540" y="92" font-size="14" font-weight="bold" fill="#0f172a">git merge --no-ff 之后：多出一个双父提交</text>

  <rect x="20" y="104" width="440" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="500" y="104" width="480" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

