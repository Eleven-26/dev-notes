  <text x="240" y="237" text-anchor="middle" font-size="11.5" fill="#b45309">feat: 登录（公共祖先）</text>

  <rect x="40" y="280" width="180" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">b69296f</text>
