  <text x="865" y="317" text-anchor="middle" font-size="11.5" fill="#166534">feat: 登录页</text>

  <rect x="770" y="356" width="190" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="865" y="376" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">07a93e3</text>
