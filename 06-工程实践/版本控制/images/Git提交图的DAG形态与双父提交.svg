  <rect x="630" y="432" width="220" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="740" y="453" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">f054075 merge: 合并登录功能</text>
  <text x="740" y="471" text-anchor="middle" font-size="11.5" fill="#b91c1c">新增的合并提交，有两个父提交</text>

  <line x1="740" y1="166" x2="740" y2="198" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="700" y1="246" x2="620" y2="278" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="780" y1="246" x2="858" y2="278" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="865" y1="326" x2="865" y2="354" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="640" y1="326" x2="716" y2="430" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="865" y1="402" x2="786" y2="430" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

  <text x="20" y="536" font-size="12.5" fill="#0f172a">要点：箭头方向 = 提交指向自己的父提交。合并提交是图里唯一「有两个入边」的节点，因此能还原真实的并行开发过程。</text>
  <text x="20" y="560" font-size="12.5" fill="#64748b">对照 rebase 的形态见 Git的merge与rebase提交形态对比.svg；命令与真实输出见本篇 4.2 节。</text>
  <text x="20" y="584" font-size="12.5" fill="#64748b">注意：短哈希随仓库内容变，图中哈希来自本机临时仓库的一次实测，结构关系才是固定的知识点。</text>
</svg>
