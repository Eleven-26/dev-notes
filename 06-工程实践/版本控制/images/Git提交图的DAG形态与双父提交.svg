  <text x="350" y="397" text-anchor="middle" font-size="11.5" fill="#166534">test: 登录用例</text>

  <text x="240" y="440" text-anchor="middle" font-size="12" fill="#64748b">main 在 b69296f，feature-login 在 07a93e3</text>

  <line x1="240" y1="166" x2="240" y2="198" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="200" y1="246" x2="140" y2="278" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="280" y1="246" x2="345" y2="278" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="350" y1="326" x2="350" y2="358" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="645" y="120" width="190" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="740" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">2cd5113</text>
  <text x="740" y="157" text-anchor="middle" font-size="11.5" fill="#64748b">init: v1</text>

  <rect x="645" y="200" width="190" height="46" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="740" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">f29d2aa</text>
  <text x="740" y="237" text-anchor="middle" font-size="11.5" fill="#b45309">feat: 登录（merge-base）</text>

  <rect x="520" y="280" width="180" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="610" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">b69296f</text>
