<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一条 stop，四条时间轴：宽限期由谁决定，退出码由谁决定</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">横轴单位是秒（本机 Docker Desktop 29.7.2 + alpine:3.21 实测），每条轴的耗时都取多次采样的代表值</text>

  <line x1="180" y1="110" x2="180" y2="440" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="249" y1="110" x2="249" y2="440" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="318" y1="110" x2="318" y2="440" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="387" y1="110" x2="387" y2="440" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="456" y1="110" x2="456" y2="440" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="525" y1="110" x2="525" y2="440" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="594" y1="110" x2="594" y2="440" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="664" y1="110" x2="664" y2="440" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="733" y1="110" x2="733" y2="440" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="802" y1="110" x2="802" y2="440" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="871" y1="110" x2="871" y2="440" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="940" y1="110" x2="940" y2="440" stroke="#e2e8f0" stroke-width="1"/>
  <text x="180" y="460" text-anchor="middle" font-size="10.5" fill="#64748b">0s</text>
  <text x="249" y="460" text-anchor="middle" font-size="10.5" fill="#64748b">1s</text>
  <text x="318" y="460" text-anchor="middle" font-size="10.5" fill="#64748b">2s</text>
  <text x="387" y="460" text-anchor="middle" font-size="10.5" fill="#64748b">3s</text>
  <text x="456" y="460" text-anchor="middle" font-size="10.5" fill="#64748b">4s</text>
  <text x="525" y="460" text-anchor="middle" font-size="10.5" fill="#64748b">5s</text>
  <text x="594" y="460" text-anchor="middle" font-size="10.5" fill="#64748b">6s</text>
  <text x="664" y="460" text-anchor="middle" font-size="10.5" fill="#64748b">7s</text>
  <text x="733" y="460" text-anchor="middle" font-size="10.5" fill="#64748b">8s</text>
  <text x="802" y="460" text-anchor="middle" font-size="10.5" fill="#64748b">9s</text>
  <text x="871" y="460" text-anchor="middle" font-size="10.5" fill="#64748b">10s</text>
  <text x="940" y="460" text-anchor="middle" font-size="10.5" fill="#64748b">11s</text>

  <text x="170" y="128" text-anchor="end" font-size="11" font-weight="bold" fill="#14532d">PID 1 里 trap 了 TERM</text>
  <text x="170" y="144" text-anchor="end" font-size="10.5" fill="#15803d">docker stop -t 10</text>
  <rect x="180" y="120" width="108" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="296" y="137" font-size="10.5" fill="#15803d">优雅退出 exit=0，三轮 1736 / 1332 / 1586 ms，日志 got-term</text>

  <text x="170" y="198" text-anchor="end" font-size="11" font-weight="bold" fill="#7f1d1d">PID 1 = busybox sleep</text>
  <text x="170" y="214" text-anchor="end" font-size="10.5" fill="#b91c1c">stop -t 1（三轮对照）</text>
  <rect x="180" y="190" width="140" height="26" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="330" y="207" font-size="10.5" fill="#b91c1c">1s 宽限 + 开销 = 2001 / 2036 / 1800 ms，exit=137</text>

  <text x="170" y="268" text-anchor="end" font-size="11" font-weight="bold" fill="#7c2d12">不带 -t，用 daemon 默认</text>
  <text x="170" y="284" text-anchor="end" font-size="10.5" fill="#9a3412">default-stop-timeout=3</text>
  <rect x="180" y="260" width="283" height="26" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="471" y="277" font-size="10.5" fill="#9a3412">3957 / 3905 / 4256 ms → exit=137：默认不是 10 秒</text>

  <text x="170" y="338" text-anchor="end" font-size="11" font-weight="bold" fill="#78350f">容器级配置生效</text>
  <text x="170" y="354" text-anchor="end" font-size="10.5" fill="#92400e">--stop-signal SIGINT</text>
  <rect x="180" y="330" width="385" height="26" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="573" y="347" font-size="10.5" fill="#92400e">--stop-timeout 5 + 不带 -t：5580 ms，容器级优先</text>

  <text x="170" y="408" text-anchor="end" font-size="11" font-weight="bold" fill="#334155">PID 1 不接信号，-t 10</text>
  <text x="170" y="424" text-anchor="end" font-size="10.5" fill="#64748b">等满宽限期才被硬杀</text>
  <rect x="180" y="396" width="739" height="26" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="186" y="390" font-size="10.5" fill="#b91c1c">五轮 10627~10826 ms：SIGTERM 被内核忽略（1 号进程无 handler）→ 10s 到点 SIGKILL，exit=137 且 OOMKilled=false</text>

  <text x="170" y="446" text-anchor="end" font-size="10.5" fill="#94a3b8">横轴：从发出信号到容器 exited</text>

  <rect x="16" y="484" width="968" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="34" y="508" font-size="13" font-weight="bold" fill="#0f172a">三个变量各管一件事，别混</text>
  <text x="34" y="532" font-size="11.5" fill="#334155">宽限期由 -t / --stop-timeout / daemon 默认三层决定，优先级就是这三层的顺序；kill 完全跳过宽限期，实测 685 ms 就 exit=137。</text>
  <text x="34" y="554" font-size="11.5" fill="#334155">退出码由 1 号进程处不处理信号决定：处理了就 0，没处理就是等满后的 137；restart 复用同一条 stop 路径（不带 -t 三轮 4423~5176 ms）。</text>
  <text x="34" y="576" font-size="11.5" fill="#334155">137 = 128 + 9（SIGKILL）：要区分内存超限还是宽限期到点，看 .State.OOMKilled（本组实测全部 false）。</text>

  <text x="20" y="618" font-size="12.5" fill="#0f172a">⭐ 写 stop-timeout 之前先确认 1 号进程会不会转发信号：trap 不上的进程，把 -t 调到 60 也只是白等 60 秒。</text>
</svg>
