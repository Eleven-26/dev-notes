<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">容器生命周期的 7 个状态：命令触发的是迁移，不是设置状态</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">每条边的读数都是本机 docker inspect -f 的原样输出（alpine:3.21 / Docker 29.7.2 / 容器名 w2ra6-*）</text>

  <line x1="135" y1="72" x2="135" y2="96" stroke="#334155" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="146" y="86" font-size="10.5" fill="#334155">docker create / docker run</text>

  <rect x="60" y="100" width="150" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="135" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">created</text>
  <text x="135" y="143" text-anchor="middle" font-size="10" fill="#64748b">pid=0 running=false</text>
  <text x="135" y="158" text-anchor="middle" font-size="10" fill="#64748b">ps 看不到 ps -a 看得到</text>

  <rect x="390" y="100" width="170" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="475" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">running</text>
  <text x="475" y="143" text-anchor="middle" font-size="10" fill="#15803d">pid=13627</text>
  <text x="475" y="158" text-anchor="middle" font-size="10" fill="#15803d">exec / top / stats 可用</text>

  <rect x="770" y="100" width="150" height="64" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="845" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">paused</text>
  <text x="845" y="143" text-anchor="middle" font-size="10" fill="#92400e">pid 不变 Running=true</text>
  <text x="845" y="158" text-anchor="middle" font-size="10" fill="#92400e">exec 被拒 unpause 前</text>

  <rect x="390" y="270" width="170" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="475" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">exited</text>
  <text x="475" y="313" text-anchor="middle" font-size="10" fill="#1d4ed8">pid=0 exit=137</text>
  <text x="475" y="328" text-anchor="middle" font-size="10" fill="#1d4ed8">0 / 3 / 127 看主进程</text>

  <rect x="640" y="270" width="150" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="715" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">restarting</text>
  <text x="715" y="313" text-anchor="middle" font-size="10" fill="#1d4ed8">restarting=true</text>
  <text x="715" y="328" text-anchor="middle" font-size="10" fill="#1d4ed8">瞬时态 30ms 才采到</text>

  <rect x="60" y="270" width="150" height="64" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="135" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">removing</text>
  <text x="135" y="313" text-anchor="middle" font-size="10" fill="#9a3412">60 次轮询只采到 1 次</text>
  <text x="135" y="328" text-anchor="middle" font-size="10" fill="#9a3412">Dead 恒为 false</text>

  <rect x="810" y="270" width="150" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="885" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748b">dead</text>
  <text x="885" y="315" text-anchor="middle" font-size="10" fill="#94a3b8">本机未复现</text>

  <rect x="60" y="440" width="150" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="135" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#64748b">对象消失</text>
  <text x="135" y="483" text-anchor="middle" font-size="10" fill="#94a3b8">no such object</text>

  <line x1="210" y1="124" x2="386" y2="124" stroke="#334155" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="298" y="116" text-anchor="middle" font-size="10.5" fill="#334155">docker start</text>

  <line x1="560" y1="118" x2="766" y2="118" stroke="#334155" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="663" y="110" text-anchor="middle" font-size="10.5" fill="#334155">docker pause</text>
  <line x1="770" y1="148" x2="564" y2="148" stroke="#334155" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="663" y="164" text-anchor="middle" font-size="10.5" fill="#334155">docker unpause</text>

  <line x1="440" y1="168" x2="440" y2="266" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="432" y="200" text-anchor="end" font-size="10.5" fill="#b91c1c">docker stop / kill</text>
  <text x="432" y="216" text-anchor="end" font-size="10.5" fill="#b91c1c">主进程自己退出</text>

  <line x1="510" y1="270" x2="510" y2="168" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arg)"/>
  <text x="518" y="214" font-size="10.5" fill="#15803d">start 或 restart，换新 pid</text>

  <line x1="560" y1="292" x2="636" y2="292" stroke="#334155" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="598" y="284" text-anchor="middle" font-size="10" fill="#334155">策略命中</text>
  <line x1="640" y1="318" x2="564" y2="318" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="598" y="334" text-anchor="middle" font-size="10" fill="#b91c1c">用完 3 次</text>

  <line x1="700" y1="270" x2="549" y2="168" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arg)"/>
  <text x="666" y="232" font-size="10.5" fill="#15803d">拉起：仍是同一个容器</text>

  <line x1="135" y1="168" x2="135" y2="266" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="127" y="216" text-anchor="end" font-size="10.5" fill="#9a3412">docker rm</text>

  <line x1="390" y1="318" x2="214" y2="318" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="300" y="306" text-anchor="middle" font-size="10" fill="#9a3412">rm 须已停止 / rm -f 强制</text>

  <line x1="135" y1="338" x2="135" y2="436" stroke="#334155" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="146" y="386" font-size="10.5" fill="#334155">第二次采样：对象已不存在</text>

  <rect x="16" y="520" width="968" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="34" y="546" font-size="13" font-weight="bold" fill="#0f172a">读图时最容易记错的三条边界</text>
  <text x="34" y="572" font-size="11.5" fill="#334155">paused 时 .State.Running 依旧是 true，判断挂起只能看 .State.Paused；docker top 的 STAT 列变 1，unpause 后还是 pid=13627 那个进程。</text>
  <text x="34" y="594" font-size="11.5" fill="#334155">created 态：pause 报 is not running；stop 是空操作（返回容器名、rc=0，状态不变）；restart 等价于 start，实测把它推进到 running。</text>
  <text x="34" y="616" font-size="11.5" fill="#334155">restart 的中间态：30ms 轮询抓到 running pid=92952 → exited pid=0 → running pid=93062；100ms 粒度会误判成「根本没停过」。</text>
  <text x="34" y="638" font-size="11.5" fill="#dc2626">dead 未复现：rm -f 后高频轮询 60 次只采到一次 removing，之后 inspect 报 no such object —— 不要为它写脚本分支。</text>

  <text x="20" y="698" font-size="12.5" fill="#0f172a">⭐ 排障先问「现在在哪个状态、是被哪条边推到这里的」，再挑命令：同一个 exited 可能是 0（跑完）、137（宽限期到点）或 127（镜像里没这个二进制）。</text>
</svg>
