<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">退出码 137 的两种含义：怎么判定</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">137 = 128 + 9（SIGKILL）—— 是被 OOM 杀，还是 stop 宽限期到点，靠 OOMKilled 字段区分</text>

  <rect x="360" y="86" width="280" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="500" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">容器退出，ExitCode = 137</text>
  <text x="500" y="130" text-anchor="middle" font-size="11.5" fill="#b91c1c">= 128 + 9（SIGKILL）</text>

  <line x1="500" y1="142" x2="500" y2="186" stroke="#334155" stroke-width="1.8" marker-end="url(#arw)"/>

  <rect x="330" y="190" width="340" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">docker inspect 看 .State.OOMKilled</text>
  <text x="500" y="236" text-anchor="middle" font-size="11" fill="#1d4ed8">这一个字段决定处置方向</text>

  <line x1="490" y1="250" x2="288" y2="294" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="510" y1="250" x2="712" y2="294" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arg)"/>
  <text x="392" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">true</text>
  <text x="608" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">false</text>

  <rect x="40" y="296" width="440" height="120" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="58" y="324" font-size="13" font-weight="bold" fill="#7f1d1d">内存超限被杀</text>
  <text x="58" y="350" font-size="11.5" fill="#b91c1c">触及 memory.max 且回收失败，就在本 cgroup 内挑进程杀。</text>
  <text x="58" y="374" font-size="11.5" fill="#b91c1c">处置：查泄漏 / 调大 limit；--oom-kill-disable 只排除宿主</text>
  <text x="58" y="394" font-size="11.5" fill="#b91c1c">全局 OOM，撞自己的 memory.max 照样被杀。</text>

  <rect x="520" y="296" width="440" height="120" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="538" y="324" font-size="13" font-weight="bold" fill="#7c2d12">docker stop 宽限期到点被硬杀</text>
  <text x="538" y="350" font-size="11.5" fill="#9a3412">stop 只把信号发给 PID 1，等满 grace period 后 SIGKILL。</text>
  <text x="538" y="374" font-size="11.5" fill="#9a3412">处置：查优雅关闭 —— PID 1 是否转发信号、应用是否</text>
  <text x="538" y="394" font-size="11.5" fill="#9a3412">处理 SIGTERM（见 容器原理.md 第四节）。</text>

  <text x="20" y="448" font-size="12.5" fill="#0f172a">⭐ 两者处置完全不同：一个是内存问题，一个是信号 / 宽限期问题 —— 先看 OOMKilled 再动手，别一上来就加内存。</text>
</svg>
