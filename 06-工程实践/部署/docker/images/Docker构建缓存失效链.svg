<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">构建缓存的 key 与链式失效</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">改一个文件为什么会让「后面所有层」全废——原因在缓存 key 的构成</text>

  <rect x="20" y="82" width="960" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="40" y="112" font-size="14" font-weight="bold" fill="#1e3a8a">缓存 key = 指令文本 + 基础镜像层 ID + （COPY / ADD 时）被拷贝文件的内容校验和</text>
  <text x="40" y="130" font-size="11.5" fill="#1d4ed8">层 ID 依赖上一层 ID —— 所以缓存是链式的，指令字符串没变也没用</text>

  <rect x="20" y="180" width="160" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="100" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">FROM node:20</text>
  <text x="100" y="232" text-anchor="middle" font-size="11" fill="#475569">基础层</text>

  <rect x="220" y="180" width="160" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="300" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">COPY package*.json</text>
  <text x="300" y="232" text-anchor="middle" font-size="11" fill="#475569">只拷依赖清单</text>

  <rect x="420" y="180" width="160" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="500" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">RUN npm ci</text>
  <text x="500" y="232" text-anchor="middle" font-size="11" fill="#475569">依赖没变就命中</text>

  <rect x="620" y="180" width="160" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="700" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">COPY . .</text>
  <text x="700" y="232" text-anchor="middle" font-size="11" fill="#b91c1c">key = 全部文件校验和</text>

  <rect x="820" y="180" width="160" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="900" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">RUN npm run build</text>
  <text x="900" y="232" text-anchor="middle" font-size="11" fill="#b91c1c">必然重建</text>

  <line x1="184" y1="215" x2="216" y2="215" stroke="#334155" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="384" y1="215" x2="416" y2="215" stroke="#334155" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="584" y1="215" x2="616" y2="215" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="784" y1="215" x2="816" y2="215" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arw)"/>

  <text x="700" y="170" text-anchor="middle" font-size="11.5" fill="#b91c1c">改一个 README → 从这层开始全废</text>

  <text x="20" y="290" font-size="12.5" fill="#0f172a">① 改了个 README，COPY . . 之后全废 —— 修复：.dockerignore（排除 .git / node_modules / 构建产物 / *.log / 数据 / .env）。</text>
  <text x="20" y="320" font-size="12.5" fill="#0f172a">② 前面一层失效，后面的 RUN 必然重建 —— 缓存是链式的，层 ID 依赖上一层 ID。</text>
  <text x="20" y="350" font-size="12.5" fill="#0f172a">③ 基础镜像升版（node:20 → node:22）全废 —— 链条从头断。</text>
  <text x="20" y="382" font-size="11.5" fill="#64748b">⚠️ ADD 比 COPY 多两个行为（自动解压 tar、支持 URL），且 URL 内容不参与校验和 → 构建镜像一律用 COPY。</text>
</svg>
