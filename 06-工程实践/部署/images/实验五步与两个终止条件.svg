<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#334155"/>
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">实验五步闭环，两个终止条件随时可以打断它</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">五步里最容易被跳过的是第 1 步和第 5 步：稳态没定量就没法判成败，终止条件没设就可能把演练做成事故</text>

  <rect x="28" y="82" width="176" height="112" rx="9" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="116" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#312e81">① 定义稳态</text>
  <text x="116" y="134" text-anchor="middle" font-size="11" fill="#3730a3">错误率 + 尾延迟</text>
  <text x="116" y="152" text-anchor="middle" font-size="11" fill="#3730a4">+ 饱和度</text>
  <text x="116" y="176" text-anchor="middle" font-size="10.5" fill="#4338ca">三个量缺一不可</text>

  <rect x="222" y="82" width="176" height="112" rx="9" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="310" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#312e81">② 写假设</text>
  <text x="310" y="134" text-anchor="middle" font-size="11" fill="#3730a3">注入 X，指标 M</text>
  <text x="310" y="152" text-anchor="middle" font-size="11" fill="#3730a3">不超过 V</text>
  <text x="310" y="176" text-anchor="middle" font-size="10.5" fill="#4338ca">必须可证伪</text>

  <rect x="416" y="82" width="176" height="112" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="504" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">③ 注入</text>
  <text x="504" y="134" text-anchor="middle" font-size="11" fill="#166534">先旁路标定兑现率</text>
  <text x="504" y="152" text-anchor="middle" font-size="11" fill="#166534">再看命中率</text>
  <text x="504" y="176" text-anchor="middle" font-size="10.5" fill="#15803d">配置值不等于业务值</text>

  <rect x="610" y="82" width="176" height="112" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="698" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">④ 观察</text>
  <text x="698" y="134" text-anchor="middle" font-size="11" fill="#854d0e">窗口长过自愈周期</text>
  <text x="698" y="152" text-anchor="middle" font-size="11" fill="#854d0e">连跑多轮不合并</text>
  <text x="698" y="176" text-anchor="middle" font-size="10.5" fill="#a16207">一轮的结论是随机的</text>

  <rect x="804" y="82" width="176" height="112" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="892" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">⑤ 收敛或终止</text>
  <text x="892" y="134" text-anchor="middle" font-size="11" fill="#991b1b">假设成立 → 记录边界</text>
  <text x="892" y="152" text-anchor="middle" font-size="11" fill="#991b1b">被推翻 → 记缺陷</text>
  <text x="892" y="176" text-anchor="middle" font-size="10.5" fill="#b91c1c">撤销注入并核对残留</text>

  <line x1="206" y1="138" x2="220" y2="138" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="400" y1="138" x2="414" y2="138" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="594" y1="138" x2="608" y2="138" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="788" y1="138" x2="802" y2="138" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="28" y="222" width="952" height="104" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="504" y="246" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">两个终止条件：任一触发即撤销注入，且撤销通道不能依赖被注入的链路</text>

  <rect x="52" y="260" width="430" height="50" rx="7" fill="#ffffff" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="72" y="281" font-size="11.5" font-weight="bold" fill="#991b1b">稳态突破</text>
  <text x="72" y="300" font-size="11" fill="#7f1d1d">指标越阈值连续 N 个采样点，不是单点触发</text>

  <rect x="526" y="260" width="430" height="50" rx="7" fill="#ffffff" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="546" y="281" font-size="11.5" font-weight="bold" fill="#991b1b">兜底时长</text>
  <text x="546" y="300" font-size="11" fill="#7f1d1d">duration 到期强制恢复，但不替代上一条</text>

  <line x1="504" y1="196" x2="504" y2="218" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="698" y1="196" x2="698" y2="218" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arr)"/>

  <text x="500" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">第 3、4 步最容易得出反的结论</text>
  <text x="500" y="376" text-anchor="middle" font-size="11.5" fill="#475569">配 delay 100ms，直连兑现 100.8ms、经网关兑现 201.5ms，差在往返次数，不在配置</text>
  <text x="500" y="398" text-anchor="middle" font-size="11.5" fill="#475569">冻结一个副本六批观测：失败率 50% 到 20% 再到 0%，故障没变轻，是网关摘点在中间生效</text>
  <text x="500" y="424" text-anchor="middle" font-size="11" fill="#94a3b8">读数来自本机三容器实验台：nginx 1.26-alpine 轮询两副本 + python:3-alpine 被测服务</text>
</svg>
