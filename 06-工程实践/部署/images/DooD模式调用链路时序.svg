<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">DooD（Docker outside of Docker）的调用链路</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">真正完成构建的不是 Runner 本身，而是 Runner 启动的一个新容器；docker.sock 是整个链路的枢纽</text>

  <rect x="40" y="78" width="260" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="170" y="106" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">dockerd（宿主机 + docker.sock）</text>
  <rect x="340" y="78" width="260" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="470" y="106" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">GitLab Runner 容器</text>
  <rect x="640" y="78" width="320" height="44" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="800" y="106" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c2d12">执行器容器（只装 docker 客户端）</text>

  <line x1="170" y1="122" x2="170" y2="540" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="470" y1="122" x2="470" y2="420" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="800" y1="122" x2="800" y2="420" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>

  <text x="320" y="146" text-anchor="middle" font-size="11.5" fill="#64748b">⓪ Runner 容器启动时把宿主机的 docker.sock 映射进去</text>

  <line x1="462" y1="170" x2="182" y2="170" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="320" y="162" text-anchor="middle" font-size="12" fill="#0f172a">① 请启动一个真正的执行器容器</text>

  <line x1="182" y1="222" x2="792" y2="222" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="486" y="214" text-anchor="middle" font-size="12" fill="#0f172a">② dockerd 创建执行器容器</text>

  <rect x="690" y="252" width="290" height="48" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="708" y="280" font-size="11" fill="#7c2d12">容器内通常只装 docker 客户端，不具备构建能力</text>

  <line x1="792" y1="350" x2="182" y2="350" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="486" y="342" text-anchor="middle" font-size="12" fill="#0f172a">③ 容器内 docker 客户端 → 通过同一个 socket → 请求 dockerd</text>

  <rect x="40" y="386" width="260" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="170" y="414" text-anchor="middle" font-size="11.5" fill="#14532d">dockerd 真正完成镜像构建</text>

  <line x1="302" y1="474" x2="556" y2="474" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="560" y="450" width="400" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="760" y="478" text-anchor="middle" font-size="12.5" fill="#1e3a8a">④ 构建成功后推送镜像 → 按配置部署</text>

  <rect x="20" y="516" width="960" height="88" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="36" y="544" font-size="12.5" fill="#0f172a">⭐ docker.sock 是 docker CLI 与 dockerd 之间的通信通道。</text>
  <text x="36" y="570" font-size="12.5" fill="#0f172a">⭐ 通过一次 socket 映射，容器内的 docker 客户端也有了操作宿主 Daemon 的能力 —— 这就是 DooD 与 DinD 的本质区别。</text>
  <text x="36" y="596" font-size="11.5" fill="#b91c1c">⚠️ 把 docker.sock 挂进 job 容器 = 把宿主机 root 交给这个 job（能 docker run -v /:/host ...）。</text>
</svg>
