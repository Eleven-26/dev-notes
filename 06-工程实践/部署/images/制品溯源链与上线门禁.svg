<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" width="1040" height="650" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1040" height="650" fill="#ffffff"/>
  <text x="520" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">制品溯源链与上线门禁：镜像从 CI 走到生产</text>
  <text x="520" y="58" text-anchor="middle" font-size="13" fill="#64748b">同一份制品按环境逐级晋级；tag 是人给的名字，digest 是内容算出来的身份证</text>

  <rect x="40" y="110" width="290" height="38" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="185" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">CI 侧：流水线构建</text>
  <rect x="375" y="110" width="290" height="38" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="520" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">镜像仓库：枢纽</text>
  <rect x="710" y="110" width="300" height="38" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="860" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">运行侧：按环境分权</text>

  <rect x="58" y="160" width="254" height="56" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="185" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">构建镜像</text>
  <text x="185" y="202" text-anchor="middle" font-size="10.5" fill="#1d4ed8">DooD / 容器 executor</text>
  <rect x="58" y="224" width="254" height="56" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="185" y="246" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">打不可变 tag</text>
  <text x="185" y="266" text-anchor="middle" font-size="10.5" fill="#1d4ed8">以 commit SHA 为 tag</text>
  <rect x="58" y="288" width="254" height="56" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="185" y="310" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">推送前自检</text>
  <text x="185" y="330" text-anchor="middle" font-size="10.5" fill="#1d4ed8">测试不过就不推</text>
  <rect x="58" y="352" width="254" height="56" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="185" y="374" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">同一份制品</text>
  <text x="185" y="394" text-anchor="middle" font-size="10.5" fill="#1d4ed8">下游环境只引用、不重建</text>

  <path d="M 330 285 L 382 285" fill="none" stroke="#4f46e5" stroke-width="1.8"/>
  <path d="M 376 279 L 388 279 L 382 287 z" fill="#4f46e5"/>
  <text x="356" y="277" text-anchor="middle" font-size="10.5" fill="#4f46e5">推送</text>

  <rect x="393" y="160" width="254" height="56" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="520" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#312e81">不可变 tag</text>
  <text x="520" y="202" text-anchor="middle" font-size="10.5" fill="#4338ca">推上去就不再被覆盖</text>
  <rect x="393" y="224" width="254" height="56" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="520" y="246" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#312e81">digest 是身份证</text>
  <text x="520" y="266" text-anchor="middle" font-size="10.5" fill="#4338ca">tag 被换掉也认得出</text>
  <rect x="393" y="288" width="254" height="56" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="520" y="310" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#312e81">签名与 SBOM</text>
  <text x="520" y="330" text-anchor="middle" font-size="10.5" fill="#4338ca">防同名替换、出 CVE 反查</text>
  <rect x="393" y="352" width="254" height="56" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="520" y="374" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#312e81">label：谁推的</text>
  <text x="520" y="394" text-anchor="middle" font-size="10.5" fill="#4338ca">哪条流水线、哪个 job</text>

  <path d="M 665 160 L 704 160" fill="none" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M 698 154 L 710 154 L 704 162 z" fill="#16a34a"/>
  <text x="684" y="152" text-anchor="middle" font-size="10" fill="#15803d">开发</text>
  <path d="M 665 290 L 704 290" fill="none" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M 698 284 L 710 284 L 704 292 z" fill="#16a34a"/>
  <text x="684" y="282" text-anchor="middle" font-size="10" fill="#15803d">预发</text>
  <path d="M 665 420 L 704 420" fill="none" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M 698 414 L 710 414 L 704 422 z" fill="#16a34a"/>
  <text x="684" y="412" text-anchor="middle" font-size="10" fill="#15803d">生产</text>

  <rect x="710" y="110" width="300" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="860" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">开发 / 特性分支</text>
  <text x="860" y="170" text-anchor="middle" font-size="11.5" fill="#166534">push 分支即部署，无需审批</text>
  <text x="860" y="192" text-anchor="middle" font-size="11.5" fill="#166534">随便重跑也不影响别人</text>
  <rect x="710" y="240" width="300" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="860" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">预发 / 集成</text>
  <text x="860" y="300" text-anchor="middle" font-size="11.5" fill="#166534">合并主干自动部署</text>
  <text x="860" y="322" text-anchor="middle" font-size="11.5" fill="#166534">与生产同构 + 脱敏数据</text>
  <rect x="710" y="370" width="300" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="860" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">生产</text>
  <text x="860" y="430" text-anchor="middle" font-size="11.5" fill="#166534">只认版本 tag，引用 digest</text>
  <text x="860" y="452" text-anchor="middle" font-size="11.5" fill="#166534">受保护分支 + 人工点击</text>

  <rect x="40" y="496" width="970" height="134" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="60" y="524" font-size="13" font-weight="bold" fill="#0f172a">三级门禁：越靠近生产，门禁越硬</text>
  <rect x="60" y="540" width="300" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="210" y="562" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">开发：无审批</text>
  <text x="210" y="582" text-anchor="middle" font-size="10.5" fill="#475569">谁触发都能部署、随便重跑</text>
  <rect x="375" y="540" width="300" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="525" y="562" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">预发：自动门禁</text>
  <text x="525" y="582" text-anchor="middle" font-size="10.5" fill="#475569">测试通过 + 迁移已在预发演练</text>
  <rect x="690" y="540" width="300" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="840" y="562" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">生产：人工 + 机器</text>
  <text x="840" y="582" text-anchor="middle" font-size="10.5" fill="#475569">签名与 digest 可查 + 人工点同意</text>
  <text x="60" y="616" font-size="11" fill="#64748b">图只回答「制品怎么流、门禁加在哪」；三个锚点与验签的取舍见第六节，环境分权见第八节。</text>
</svg>
