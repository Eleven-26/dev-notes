<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">needs：用 DAG 打破 stage 串行</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">job 只要它依赖的那些 job 跑完就能开始，不必等同 stage 全部结束</text>

  <line x1="500" y1="86" x2="500" y2="340" stroke="#cbd5e1" stroke-width="1"/>

  <text x="40" y="110" font-size="14" font-weight="bold" fill="#0f172a">默认：按 stage 串行</text>
  <rect x="40" y="130" width="170" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="125" y="159" text-anchor="middle" font-size="13" fill="#0f172a">build</text>
  <rect x="40" y="214" width="170" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="125" y="243" text-anchor="middle" font-size="13" fill="#1e3a8a">test:a</text>
  <rect x="240" y="214" width="170" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="325" y="243" text-anchor="middle" font-size="13" fill="#0f172a">lint</text>
  <rect x="40" y="298" width="170" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="125" y="327" text-anchor="middle" font-size="13" fill="#14532d">package</text>
  <line x1="125" y1="176" x2="125" y2="210" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="185" y1="162" x2="298" y2="208" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="125" y1="260" x2="125" y2="294" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="305" y1="260" x2="192" y2="294" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arw)"/>

  <text x="540" y="110" font-size="14" font-weight="bold" fill="#0f172a">用 needs（DAG）：只等指定的 job</text>
  <rect x="540" y="130" width="170" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="625" y="159" text-anchor="middle" font-size="13" fill="#0f172a">build</text>
  <rect x="540" y="214" width="170" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="625" y="243" text-anchor="middle" font-size="13" fill="#1e3a8a">test:a</text>
  <rect x="740" y="214" width="170" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="825" y="243" text-anchor="middle" font-size="13" fill="#0f172a">lint</text>
  <rect x="540" y="298" width="170" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="625" y="327" text-anchor="middle" font-size="13" fill="#14532d">package</text>
  <line x1="625" y1="176" x2="625" y2="210" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arg)"/>
  <line x1="625" y1="260" x2="625" y2="294" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arg)"/>
  <text x="636" y="198" font-size="10.5" fill="#15803d">needs: [build]</text>
  <text x="636" y="282" font-size="10.5" fill="#15803d">needs: [test:a]</text>
  <text x="740" y="284" font-size="10.5" fill="#64748b">未被 needs，立刻跑</text>

  <text x="40" y="372" font-size="12" fill="#334155">package 要等 test stage 全部结束（含 lint）</text>
  <text x="540" y="372" font-size="12" fill="#334155">package 只等 test:a —— stage 顺序与 lint 都被绕过</text>

  <line x1="20" y1="392" x2="960" y2="392" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="416" font-size="12.5" fill="#0f172a">⭐ needs 是 DAG 依赖（跨 stage 也行）；dependencies 只控制「下载哪些 job 的 artifacts」，不改变执行顺序。</text>
  <text x="20" y="444" font-size="12.5" fill="#b91c1c">⚠️ 被依赖的 job 若因 rules 没被创建，依赖它的 job 会直接因「依赖不存在」而失败。</text>
</svg>
