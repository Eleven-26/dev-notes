<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="b1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">染色头的四跳旅程：每一跳都可能静默丢掉标记</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">Nginx 1.26.3 三容器实测；标「实测」的是本机原始输出，标「文档」的是按官方文档陈述</text>

  <rect x="40" y="86" width="200" height="82" rx="9" fill="#0f172a"/>
  <text x="140" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">① 入口加标记</text>
  <text x="140" y="138" text-anchor="middle" font-size="10.5" fill="#cbd5e1">split_clients / map</text>
  <text x="140" y="157" text-anchor="middle" font-size="10.5" fill="#cbd5e1">X-Gray: 1 → 灰度池</text>

  <path d="M240,127 L300,127" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#b1)"/>

  <rect x="300" y="86" width="200" height="82" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="400" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">② HTTP 逐跳</text>
  <text x="400" y="138" text-anchor="middle" font-size="10.5" fill="#334155">自定义头默认透传</text>
  <text x="400" y="157" text-anchor="middle" font-size="10.5" fill="#166534">实测：x_gray=[1] 到达</text>

  <path d="M500,127 L560,127" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#b1)"/>

  <rect x="560" y="86" width="200" height="82" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="660" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">③ 线程 / 协程</text>
  <text x="660" y="138" text-anchor="middle" font-size="10.5" fill="#334155">ThreadLocal / ctx</text>
  <text x="660" y="157" text-anchor="middle" font-size="10.5" fill="#b45309">线程池复用不继承</text>

  <path d="M760,127 L820,127" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#b1)"/>

  <rect x="820" y="86" width="150" height="82" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="895" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">④ 异步 / 任务</text>
  <text x="895" y="138" text-anchor="middle" font-size="10.5" fill="#334155">MQ / 定时 / CDC</text>
  <text x="895" y="157" text-anchor="middle" font-size="10.5" fill="#b91c1c">无上游，天然无标记</text>

  <text x="40" y="206" font-size="14" font-weight="bold" fill="#0f172a">实测到的四个丢失点（都是「不报错」的那种）</text>

  <rect x="40" y="222" width="455" height="112" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="56" y="246" font-size="12" font-weight="bold" fill="#7f1d1d">丢失点 A：proxy_set_header 覆盖</text>
  <text x="56" y="270" font-size="10.5" font-family="Consolas, monospace" fill="#334155">proxy_set_header X-Gray "";</text>
  <text x="56" y="290" font-size="10.5" font-family="Consolas, monospace" fill="#334155">proxy_set_header X-Gray-Version "ghost";</text>
  <text x="56" y="314" font-size="11" fill="#b91c1c">后端实测：x_gray=[] gray_ver=[ghost] —— 下游按稳定版处理</text>

  <rect x="515" y="222" width="455" height="112" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="531" y="246" font-size="12" font-weight="bold" fill="#7f1d1d">丢失点 B：手写 conf 不带 X-Forwarded-For</text>
  <text x="531" y="270" font-size="10.5" font-family="Consolas, monospace" fill="#334155">后端实测：xff=[]  host=[stable]</text>
  <text x="531" y="292" font-size="11" fill="#b91c1c">灰度能用，但按 IP 限流 / 风控 / 地域判断全部失效</text>
  <text x="531" y="314" font-size="10.5" fill="#64748b">nginx 内置默认只设 Host 与 Connection</text>

  <rect x="40" y="350" width="455" height="112" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="56" y="374" font-size="12" font-weight="bold" fill="#78350f">丢失点 C：变量 proxy_pass 未配 resolver</text>
  <text x="56" y="398" font-size="10.5" font-family="Consolas, monospace" fill="#334155">no resolver defined to resolve stable</text>
  <text x="56" y="418" font-size="10.5" font-family="Consolas, monospace" fill="#334155">→ 502 Bad Gateway（nginx/1.26.3）</text>
  <text x="56" y="442" font-size="11" fill="#b45309">只在有请求时才报，启动阶段看起来完全正常</text>

  <rect x="515" y="350" width="455" height="112" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="531" y="374" font-size="12" font-weight="bold" fill="#78350f">丢失点 D：白名单是单向的</text>
  <text x="531" y="398" font-size="10.5" font-family="Consolas, monospace" fill="#334155">X-Gray: 1 → stable 用户被拉进灰度</text>
  <text x="531" y="418" font-size="10.5" font-family="Consolas, monospace" fill="#334155">X-Gray: 0 → gray 用户仍在灰度</text>
  <text x="531" y="442" font-size="11" fill="#b45309">map 只定义了 "1"，0 落到 default 等于「不干预」</text>

  <rect x="40" y="488" width="930" height="106" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="56" y="514" font-size="12.5" font-weight="bold" fill="#0f172a">判断「标记有没有断」的唯一办法：在后端把收到的头原样回显一次</text>
  <text x="56" y="540" font-size="11" fill="#334155">Nginx：return 200 "x_gray=[$http_x_gray] traceparent=[$http_traceparent] xff=[$http_x_forwarded_for]";</text>
  <text x="56" y="562" font-size="11" fill="#334155">应用：把关键头写进一条日志（不要只在入口看）——入口对不代表第三跳对</text>
  <text x="56" y="584" font-size="10.5" fill="#64748b">第五节还要再往下走一步：MQ 与定时任务里没有「请求头」，染色只能落到消息属性与库字段</text>
</svg>
