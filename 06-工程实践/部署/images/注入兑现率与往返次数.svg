<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一份 delay 配置，兑现率等于这条链路上的往返次数</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">netem 挂在出方向网卡上：一次请求-响应付一个延迟，一次建连握手再付一个</text>

  <rect x="30" y="76" width="450" height="252" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="255" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">配 delay 100ms，业务侧看到多少</text>

  <text x="52" y="130" font-size="11" fill="#475569">直连副本，keep-alive 复用连接</text>
  <rect x="52" y="136" width="86" height="22" rx="4" fill="#4f46e5"/>
  <text x="146" y="152" font-size="11.5" font-weight="bold" fill="#312e81">+100.8ms</text>
  <text x="212" y="152" font-size="10.5" fill="#64748b">兑现 1.01x</text>

  <text x="52" y="184" font-size="11" fill="#475569">经 nginx，每请求新建上游连接</text>
  <rect x="52" y="190" width="171" height="22" rx="4" fill="#7c3aed"/>
  <text x="231" y="206" font-size="11.5" font-weight="bold" fill="#4c1d95">+201.5ms</text>
  <text x="300" y="206" font-size="10.5" fill="#64748b">兑现 2.01x</text>

  <text x="52" y="238" font-size="11" fill="#475569">配 delay 200ms，经 nginx</text>
  <rect x="52" y="244" width="341" height="22" rx="4" fill="#b91c1c"/>
  <text x="401" y="260" font-size="11.5" font-weight="bold" fill="#7f1d1d">+400.9ms</text>
  <text x="52" y="288" font-size="10.5" fill="#64748b">基线：直连 5.78 到 6.03ms，经网关 7.05 到 7.29ms</text>
  <text x="52" y="308" font-size="10.5" fill="#64748b">每组三档读数取区间，被测服务自身 sleep 5ms</text>

  <rect x="520" y="76" width="450" height="252" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="745" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">注入贡献与被注入服务的自身耗时无关</text>

  <text x="542" y="130" font-size="11" fill="#475569">业务自身 5ms</text>
  <rect x="542" y="136" width="175" height="22" rx="4" fill="#16a34a"/>
  <text x="725" y="152" font-size="11.5" font-weight="bold" fill="#14532d">+204.9ms</text>
  <text x="542" y="176" font-size="10.5" fill="#64748b">注入前后合计 7.1 → 212.0ms</text>

  <text x="542" y="212" font-size="11" fill="#475569">业务自身 50ms</text>
  <rect x="542" y="218" width="174" height="22" rx="4" fill="#16a34a"/>
  <text x="724" y="234" font-size="11.5" font-weight="bold" fill="#14532d">+204.4ms</text>
  <text x="542" y="258" font-size="10.5" fill="#64748b">注入前后合计 52.5 → 256.9ms</text>

  <text x="542" y="290" font-size="11" fill="#991b1b">两条增量几乎等长：注入是叠加，不是替代</text>
  <text x="542" y="310" font-size="10.5" fill="#64748b">判读时看注入前后的差值，别看绝对值</text>

  <rect x="30" y="346" width="940" height="86" rx="9" fill="#fffbeb" stroke="#ca8a04" stroke-width="1.3"/>
  <text x="50" y="372" font-size="12" font-weight="bold" fill="#713f12">所以「配置值当预期值」是个系统性错误</text>
  <text x="50" y="394" font-size="11" fill="#854d0e">网关有没有带上游 keep-alive、有没有 gRPC 的多轮流控、有没有重试，都会改变往返次数，也就改变了兑现率。</text>
  <text x="50" y="416" font-size="11" fill="#854d0e">先把同一份注入在旁路跑一遍、量出兑现率，再用它反推该配多少，比事后解释「为什么慢了这么多」便宜得多。</text>
</svg>
