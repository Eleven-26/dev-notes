<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">灰度的四个坐标：切分键比比例更重要</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">同一个比例，键选错就变成「每个用户都在新旧之间跳」；本机实测以 1000 个 uid 为样本</text>

  <rect x="30" y="82" width="230" height="186" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="46" y="108" font-size="13.5" font-weight="bold" fill="#1e3a8a">① 按用户</text>
  <text x="46" y="134" font-size="11" fill="#334155">uid / 租户 ID / 设备 ID</text>
  <text x="46" y="154" font-size="11" fill="#334155">哈希落桶</text>
  <text x="46" y="182" font-size="11" font-weight="bold" fill="#166534">要点：同一用户始终同侧</text>
  <text x="46" y="204" font-size="10.5" fill="#b45309">坑：未登录流量无法归组</text>
  <text x="46" y="224" font-size="10.5" fill="#b45309">设备 ID 换端会变</text>
  <text x="46" y="250" font-size="10.5" fill="#64748b">适合体验一致的灰度</text>

  <rect x="270" y="82" width="230" height="186" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="286" y="108" font-size="13.5" font-weight="bold" fill="#14532d">② 按请求头</text>
  <text x="286" y="134" font-size="11" fill="#334155">X-Gray: 1 / 员工标记</text>
  <text x="286" y="154" font-size="11" fill="#334155">入口 map 强制覆盖</text>
  <text x="286" y="182" font-size="11" font-weight="bold" fill="#166534">要点：能精确拉人进灰度</text>
  <text x="286" y="204" font-size="10.5" fill="#b91c1c">坑：只进不出（实测 0 无效）</text>
  <text x="286" y="224" font-size="10.5" fill="#b91c1c">头可伪造，只在可信入口加</text>
  <text x="286" y="250" font-size="10.5" fill="#64748b">适合内部先验与白名单</text>

  <rect x="510" y="82" width="230" height="186" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="526" y="108" font-size="13.5" font-weight="bold" fill="#7c2d12">③ 按比例</text>
  <text x="526" y="134" font-size="11" fill="#334155">配置 30% → 实测 28.9%</text>
  <text x="526" y="154" font-size="11" fill="#334155">配置 10% → 实测 7.9%</text>
  <text x="526" y="182" font-size="11" font-weight="bold" fill="#166534">要点：样本到 20000 才收敛</text>
  <text x="526" y="204" font-size="10.5" fill="#b45309">坑：别按人数核对比例</text>
  <text x="526" y="224" font-size="10.5" fill="#b45309">缩小比例只踢人、不换人</text>
  <text x="526" y="250" font-size="10.5" fill="#64748b">适合扩面阶段</text>

  <rect x="750" y="82" width="220" height="186" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="766" y="108" font-size="13.5" font-weight="bold" fill="#334155">④ 按地域 / 机房</text>
  <text x="766" y="134" font-size="11" fill="#334155">单机房先上</text>
  <text x="766" y="154" font-size="11" fill="#334155">再按机房扩</text>
  <text x="766" y="182" font-size="11" font-weight="bold" fill="#166534">要点：故障域与灰度域重合</text>
  <text x="766" y="204" font-size="10.5" fill="#b45309">坑：跨机房调用把标记带出去</text>
  <text x="766" y="224" font-size="10.5" fill="#b45309">下游必须也认这个标记</text>
  <text x="766" y="250" font-size="10.5" fill="#64748b">适合多机房部署</text>

  <text x="30" y="306" font-size="14" font-weight="bold" fill="#0f172a">同一份配置下的三种行为：键决定了「稳不稳」</text>

  <rect x="30" y="322" width="300" height="180" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="46" y="346" font-size="12.5" font-weight="bold" fill="#14532d">seed = uid（正确）</text>
  <text x="46" y="372" font-size="11" fill="#334155">user-3 连打 5 次</text>
  <text x="46" y="394" font-size="11.5" font-family="Consolas, monospace" fill="#166534">stable stable stable stable stable</text>
  <text x="46" y="422" font-size="11" fill="#334155">user-42 连打 5 次</text>
  <text x="46" y="444" font-size="11.5" font-family="Consolas, monospace" fill="#166534">stable stable stable stable stable</text>
  <text x="46" y="478" font-size="11" font-weight="bold" fill="#166534">5 / 5 一致</text>

  <rect x="350" y="322" width="300" height="180" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="366" y="346" font-size="12.5" font-weight="bold" fill="#7f1d1d">seed = $request_id（反例）</text>
  <text x="366" y="372" font-size="11" fill="#334155">user-3 连打 5 次</text>
  <text x="366" y="394" font-size="11.5" font-family="Consolas, monospace" fill="#b91c1c">stable stable gray stable stable</text>
  <text x="366" y="422" font-size="11" fill="#334155">user-42 连打 5 次</text>
  <text x="366" y="444" font-size="11.5" font-family="Consolas, monospace" fill="#b91c1c">stable gray gray stable stable</text>
  <text x="366" y="478" font-size="11" font-weight="bold" fill="#b91c1c">分布仍是 30%，但人在跳</text>

  <rect x="670" y="322" width="300" height="180" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="686" y="346" font-size="12.5" font-weight="bold" fill="#78350f">比例是统计值（N 的影响）</text>
  <text x="686" y="374" font-size="11" fill="#334155">N = 1000  → 10% 配置实测 7.90%</text>
  <text x="686" y="396" font-size="11" fill="#334155">N = 5000  → 10% 配置实测 8.82%</text>
  <text x="686" y="418" font-size="11" fill="#334155">N = 20000 → 10% 配置实测 9.79%</text>
  <text x="686" y="446" font-size="11" fill="#64748b">30% 配置：28.90% / 28.90% / 29.82%</text>
  <text x="686" y="478" font-size="11" font-weight="bold" fill="#78350f">看组间差异，不看组内人数</text>
</svg>
