<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">K8s 从零到上线：四段流程</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">顺序不能乱：①没通就没有③；②不做（镜像可变），④的回滚就是空话</text>

  <rect x="20" y="96" width="960" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="124" font-size="13" font-weight="bold" fill="#0f172a">① 集群层</text>
  <rect x="40" y="130" width="142" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="111" y="152" text-anchor="middle" font-size="11.5" fill="#1e3a8a">集群本身</text>
  <rect x="194" y="130" width="142" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="265" y="152" text-anchor="middle" font-size="11.5" fill="#1e3a8a">容器运行时</text>
  <rect x="348" y="130" width="142" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="419" y="152" text-anchor="middle" font-size="11.5" fill="#1e3a8a">CNI</text>
  <rect x="502" y="130" width="142" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="573" y="152" text-anchor="middle" font-size="11.5" fill="#1e3a8a">存储</text>
  <rect x="656" y="130" width="142" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="727" y="152" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Ingress</text>
  <rect x="810" y="130" width="142" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="881" y="152" text-anchor="middle" font-size="11.5" fill="#1e3a8a">观测</text>

  <line x1="40" y1="172" x2="40" y2="192" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arw)"/>

  <rect x="20" y="196" width="960" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="224" font-size="13" font-weight="bold" fill="#0f172a">② 制品层</text>
  <rect x="40" y="230" width="280" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="180" y="252" text-anchor="middle" font-size="11.5" fill="#14532d">镜像（不可变 tag）</text>
  <rect x="336" y="230" width="280" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="476" y="252" text-anchor="middle" font-size="11.5" fill="#14532d">清单 / Chart（进 Git）</text>

  <line x1="40" y1="272" x2="40" y2="292" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arw)"/>

  <rect x="20" y="296" width="960" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="324" font-size="13" font-weight="bold" fill="#0f172a">③ 应用层</text>
  <rect x="40" y="330" width="120" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="100" y="352" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Namespace</text>
  <rect x="170" y="330" width="120" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="230" y="352" text-anchor="middle" font-size="11.5" fill="#1e3a8a">凭证</text>
  <rect x="300" y="330" width="120" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="360" y="352" text-anchor="middle" font-size="11.5" fill="#1e3a8a">ConfigMap/Secret</text>
  <rect x="430" y="330" width="120" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="490" y="352" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Deployment</text>
  <rect x="560" y="330" width="120" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="620" y="352" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Service</text>
  <rect x="690" y="330" width="120" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="750" y="352" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Ingress</text>
  <rect x="820" y="330" width="120" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="880" y="352" text-anchor="middle" font-size="11.5" fill="#1e3a8a">HPA/PDB</text>

  <line x1="40" y1="372" x2="40" y2="392" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arw)"/>

  <rect x="20" y="396" width="960" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="424" font-size="13" font-weight="bold" fill="#0f172a">④ 变更层</text>
  <rect x="40" y="430" width="240" height="34" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="160" y="452" text-anchor="middle" font-size="11.5" fill="#7c2d12">发布（滚动 / 灰度）</text>
  <rect x="300" y="430" width="240" height="34" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="420" y="452" text-anchor="middle" font-size="11.5" fill="#7c2d12">观测</text>
  <rect x="560" y="430" width="240" height="34" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="680" y="452" text-anchor="middle" font-size="11.5" fill="#7c2d12">回滚</text>
</svg>
