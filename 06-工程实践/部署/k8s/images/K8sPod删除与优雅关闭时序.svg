<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Pod 删除与优雅关闭：两条并行的路</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">(A) endpoint 摘除要传播到每个节点；(B) preStop → SIGTERM → grace period → SIGKILL</text>

  <rect x="50" y="78" width="200" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="150" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">API Server</text>
  <rect x="280" y="78" width="200" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="380" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Service endpoint / Ingress</text>
  <rect x="540" y="78" width="200" height="44" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="640" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">kubelet</text>
  <rect x="780" y="78" width="200" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="880" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">应用进程</text>

  <line x1="150" y1="122" x2="150" y2="520" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="380" y1="122" x2="380" y2="520" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="640" y1="122" x2="640" y2="520" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="880" y1="122" x2="880" y2="520" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>

  <rect x="40" y="138" width="220" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="150" y="166" text-anchor="middle" font-size="11" fill="#1e3a8a">① delete pod → 打 deletionTimestamp</text>

  <line x1="158" y1="224" x2="372" y2="224" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="265" y="216" text-anchor="middle" font-size="12" fill="#0f172a">② (A) endpoint 摘除</text>

  <rect x="270" y="250" width="330" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="288" y="280" font-size="11" fill="#334155">各节点 kube-proxy / Ingress 规则更新（异步、要传播）</text>

  <rect x="530" y="308" width="220" height="44" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="640" y="336" text-anchor="middle" font-size="11" fill="#7c2d12">④ 先跑 preStop hook</text>

  <line x1="648" y1="392" x2="872" y2="392" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="760" y="384" text-anchor="middle" font-size="12" fill="#0f172a">⑤ (B) 发 SIGTERM</text>

  <rect x="760" y="430" width="230" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="875" y="458" text-anchor="middle" font-size="11" fill="#14532d">⑥ 优雅排空后 exit 0</text>

  <line x1="648" y1="500" x2="872" y2="500" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="760" y="492" text-anchor="middle" font-size="12" fill="#b91c1c">⑦ 到 grace period 仍存活 → SIGKILL</text>

  <rect x="20" y="540" width="960" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="36" y="568" font-size="12.5" fill="#0f172a">⭐ (A) 与 (B) 是并行的两条路：endpoint 摘除要传播到每个节点；preStop 的时间算在 grace period 里面。</text>
  <text x="36" y="594" font-size="12" fill="#0f172a">⚠️ 应用侧顺序：① 停止 accept → ② 摘注册中心 / readiness 转失败 → ③ 等在途请求（有上限）→ ④ 关资源 → exit 0。</text>
</svg>
