<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="530" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">应用上线：对象层级与依赖顺序</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">上一步没做，这一步就会以奇怪方式失败；Deployment 之下才是 ReplicaSet → Pod</text>

  <text x="40" y="96" font-size="14" font-weight="bold" fill="#0f172a">对象层级：Deployment → ReplicaSet → Pod</text>

  <rect x="60" y="112" width="280" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="200" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Deployment</text>
  <rect x="60" y="194" width="280" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="200" y="227" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">ReplicaSet</text>
  <rect x="60" y="276" width="280" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="200" y="309" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Pod（replicas=3）</text>

  <line x1="200" y1="166" x2="200" y2="190" stroke="#334155" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="200" y1="248" x2="200" y2="272" stroke="#334155" stroke-width="1.8" marker-end="url(#arw)"/>

  <text x="352" y="134" font-size="11" fill="#1d4ed8">副本数 / 策略 / 探针</text>
  <text x="352" y="216" font-size="11" fill="#1d4ed8">每次发布新建一个 RS</text>
  <text x="352" y="298" font-size="11" fill="#166534">selector 匹配 Pod label</text>

  <line x1="500" y1="86" x2="500" y2="440" stroke="#cbd5e1" stroke-width="1"/>

  <text x="520" y="96" font-size="14" font-weight="bold" fill="#0f172a">上线顺序（依赖在前）</text>

  <rect x="540" y="112" width="380" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="730" y="139" text-anchor="middle" font-size="12" fill="#334155">Namespace（隔离边界）</text>
  <rect x="540" y="168" width="380" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="730" y="195" text-anchor="middle" font-size="12" fill="#334155">imagePullSecrets（私有仓库才能拉镜像）</text>
  <rect x="540" y="224" width="380" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="730" y="251" text-anchor="middle" font-size="12" fill="#334155">ConfigMap / Secret（应用启动就要读）</text>
  <rect x="540" y="280" width="380" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="730" y="307" text-anchor="middle" font-size="12" fill="#334155">Deployment / StatefulSet（工作负载）</text>
  <rect x="540" y="336" width="380" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="730" y="363" text-anchor="middle" font-size="12" fill="#334155">Service（稳定的四层入口）</text>
  <rect x="540" y="392" width="380" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="730" y="419" text-anchor="middle" font-size="12" fill="#334155">Ingress（七层路由 / 域名 / TLS）</text>

  <line x1="580" y1="154" x2="580" y2="166" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="580" y1="210" x2="580" y2="222" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="580" y1="266" x2="580" y2="278" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="580" y1="322" x2="580" y2="334" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="580" y1="378" x2="580" y2="390" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

  <text x="20" y="480" font-size="12.5" fill="#0f172a">⭐ 先建隔离边界与拉取凭证：这一步不做，后面所有 Pod 都会 ImagePullBackOff。</text>
  <text x="20" y="508" font-size="12.5" fill="#b91c1c">⚠️ 常见漏项：get endpoints 为空 = Service 的 selector 与 Pod label 不一致（或探针没过、Pod 不在 Ready）。</text>
</svg>
