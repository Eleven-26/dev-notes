<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arwD" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">OAuth 2.0 授权码流程：浏览器只经手授权码</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">令牌交换走客户端与授权服务器之间的后端通道，不经过浏览器地址栏</text>

  <g font-size="14" font-weight="bold" fill="#1e3a8a">
    <rect x="40" y="74" width="180" height="42" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="130" y="101" text-anchor="middle">用户（资源所有者）</text>
    <rect x="280" y="74" width="180" height="42" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="370" y="101" text-anchor="middle">客户端</text>
    <rect x="530" y="74" width="180" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="620" y="101" text-anchor="middle">授权服务器</text>
    <rect x="770" y="74" width="180" height="42" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text x="860" y="101" text-anchor="middle">资源服务器</text>
  </g>

  <g stroke="#cbd5e1" stroke-dasharray="4 5">
    <line x1="130" y1="116" x2="130" y2="520"/>
    <line x1="370" y1="116" x2="370" y2="520"/>
    <line x1="620" y1="116" x2="620" y2="520"/>
    <line x1="860" y1="116" x2="860" y2="520"/>
  </g>

  <g font-size="13" fill="#334155">
    <text x="250" y="147" text-anchor="middle">① 访问受保护资源</text>
    <line x1="130" y1="155" x2="364" y2="155" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arw)"/>

    <text x="495" y="187" text-anchor="middle">② /authorize + code_challenge</text>
    <line x1="370" y1="195" x2="614" y2="195" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arw)"/>

    <text x="375" y="232" text-anchor="middle">③ 登录并同意 scope</text>
    <line x1="620" y1="240" x2="136" y2="240" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#arwD)"/>

    <text x="495" y="277" text-anchor="middle">④ 回跳 ?code=...&amp;state=...</text>
    <line x1="620" y1="285" x2="376" y2="285" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#arwD)"/>

    <text x="495" y="322" text-anchor="middle">⑤ /token + code_verifier</text>
    <line x1="370" y1="330" x2="614" y2="330" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arw)"/>

    <text x="495" y="367" text-anchor="middle">⑥ access / refresh / ID token</text>
    <line x1="620" y1="375" x2="376" y2="375" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arw)"/>

    <text x="615" y="412" text-anchor="middle">⑦ 携带 access token 调 API</text>
    <line x1="370" y1="420" x2="854" y2="420" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arw)"/>

    <text x="615" y="452" text-anchor="middle">⑧ 返回资源</text>
    <line x1="860" y1="460" x2="376" y2="460" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arw)"/>
  </g>

  <g font-size="12" fill="#475569">
    <line x1="40" y1="552" x2="90" y2="552" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arw)"/>
    <text x="100" y="556">直接请求（后端通道）</text>
    <line x1="330" y1="552" x2="380" y2="552" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#arwD)"/>
    <text x="390" y="556">浏览器重定向（前端通道）</text>
  </g>
</svg>
