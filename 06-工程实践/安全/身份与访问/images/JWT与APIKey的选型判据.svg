<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">JWT 给「人」，API Key 给「系统」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">选型只看一个问题：这个调用方是一个用户，还是另一个系统</text>
  <defs>
    <marker id="k4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="40" y="84" width="150" height="50" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="115" y="114" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold">维度</text>
  <rect x="198" y="84" width="370" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="383" y="114" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold">JWT（HS256）</text>
  <rect x="576" y="84" width="384" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="768" y="114" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="bold">API Key</text>
  <rect x="40" y="142" width="150" height="52" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="174" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">承载信息</text>
  <rect x="198" y="142" width="370" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="212" y="174" font-size="10" fill="#334155" text-anchor="start">有：sub / role / 自定义 claim</text>
  <rect x="576" y="142" width="384" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="590" y="174" font-size="10" fill="#334155" text-anchor="start">无：只知道「是谁」</text>
  <rect x="40" y="202" width="150" height="52" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="234" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">有效期</text>
  <rect x="198" y="202" width="370" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="212" y="234" font-size="10" fill="#334155" text-anchor="start">有：exp，必须</text>
  <rect x="576" y="202" width="384" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="590" y="234" font-size="10" fill="#334155" text-anchor="start">无：长期有效，靠人工轮换</text>
  <rect x="40" y="262" width="150" height="52" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="294" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">撤销</text>
  <rect x="198" y="262" width="370" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="212" y="294" font-size="10" fill="#334155" text-anchor="start">难：无状态，只能等过期或换密钥</text>
  <rect x="576" y="262" width="384" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="590" y="294" font-size="10" fill="#334155" text-anchor="start">容易：换掉那个 key 即可</text>
  <rect x="40" y="322" width="150" height="52" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="354" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">适用</text>
  <rect x="198" y="322" width="370" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="212" y="354" font-size="10" fill="#334155" text-anchor="start">用户会话：谁登录了、有什么角色</text>
  <rect x="576" y="322" width="384" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="590" y="354" font-size="10" fill="#334155" text-anchor="start">服务间调用：哪个系统在调我</text>
  <rect x="40" y="382" width="150" height="52" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="414" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">泄露影响</text>
  <rect x="198" y="382" width="370" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="212" y="414" font-size="10" fill="#334155" text-anchor="start">有效期内的身份被冒用</text>
  <rect x="576" y="382" width="384" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="590" y="414" font-size="10" fill="#334155" text-anchor="start">直到被发现并轮换为止</text>
  <rect x="40" y="452" width="450" height="66" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="56" y="476" font-size="11.5" fill="#1e3a8a" text-anchor="start" font-weight="bold">面向用户 → JWT</text>
  <text x="56" y="500" font-size="10" fill="#334155" text-anchor="start">能带角色信息（省一次查询），能按用户维度限流</text>
  <rect x="510" y="452" width="450" height="66" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="526" y="476" font-size="11.5" fill="#166534" text-anchor="start" font-weight="bold">面向服务 → API Key</text>
  <text x="526" y="500" font-size="10" fill="#334155" text-anchor="start">简单，且可单独轮换（换一家不影响别人）</text>
  <text x="44" y="546" font-size="11" fill="#b91c1c" text-anchor="start">⚠ 同一条路由只选一种（auth.scheme），不要「两种都接受」—— 后者会让「究竟是谁在调用」变模糊，鉴权日志也失去意义</text>
</svg>
