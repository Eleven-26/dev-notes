<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">授权模型选型决策树</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">先问「权限由什么决定」，再决定要不要混合</text>

  <rect x="380" y="86" width="240" height="54" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="500" y="119" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">权限由什么决定？</text>

  <g font-size="13">
    <rect x="20" y="236" width="215" height="72" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="127" y="264" text-anchor="middle" font-weight="bold" fill="#166534">岗位 / 职能</text>
    <text x="127" y="288" text-anchor="middle" font-size="11.5" fill="#166534">RBAC</text>

    <rect x="260" y="236" width="215" height="72" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text x="367" y="264" text-anchor="middle" font-weight="bold" fill="#9a3412">对象间共享 / 关系</text>
    <text x="367" y="288" text-anchor="middle" font-size="11.5" fill="#9a3412">ReBAC</text>

    <rect x="500" y="236" width="215" height="72" rx="8" fill="#fefce8" stroke="#ca8a04"/>
    <text x="607" y="264" text-anchor="middle" font-weight="bold" fill="#854d0e">属性 / 环境条件</text>
    <text x="607" y="288" text-anchor="middle" font-size="11.5" fill="#854d0e">ABAC</text>

    <rect x="740" y="236" width="215" height="72" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="847" y="264" text-anchor="middle" font-weight="bold" fill="#1e3a8a">少量固定资源清单</text>
    <text x="847" y="288" text-anchor="middle" font-size="11.5" fill="#1e3a8a">ACL</text>
  </g>

  <g stroke="#475569" stroke-width="1.6" fill="none">
    <line x1="440" y1="140" x2="190" y2="230" marker-end="url(#d)"/>
    <line x1="480" y1="140" x2="360" y2="230" marker-end="url(#d)"/>
    <line x1="520" y1="140" x2="610" y2="230" marker-end="url(#d)"/>
    <line x1="560" y1="140" x2="800" y2="230" marker-end="url(#d)"/>
  </g>

  <g font-size="11.5" fill="#64748b" text-anchor="middle">
    <text x="285" y="178">按岗位授权</text>
    <text x="400" y="200">按关系共享</text>
    <text x="575" y="200">按条件判断</text>
    <text x="700" y="178">资源少且固定</text>
  </g>

  <rect x="40" y="370" width="920" height="104" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="500" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">大多数系统的实际形态：混合</text>
  <text x="500" y="424" text-anchor="middle" font-size="12.5" fill="#334155">RBAC 管「岗位能做什么」 + 对象归属/成员表管「这条数据是不是你的」</text>
  <text x="500" y="450" text-anchor="middle" font-size="12.5" fill="#334155">ABAC 只补少量动态条件（时间、IP、数据分级），不承担全部授权</text>

  <text x="500" y="528" text-anchor="middle" font-size="12" fill="#64748b">反模式：给每个资源建一个角色（角色爆炸）；或把所有判断塞进一套万能策略</text>
</svg>
