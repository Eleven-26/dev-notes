<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="h" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="hr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">横向越权与纵向越权</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">凭证都是真的，问题出在「对象归不归你」和「动作够不够格」</text>

  <g>
    <rect x="20" y="80" width="460" height="300" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="40" y="108" font-size="14.5" font-weight="bold" fill="#991b1b">横向越权（IDOR / BOLA）</text>
    <text x="40" y="132" font-size="12" fill="#7f1d1d">同角色，换一个不属于自己的对象 ID</text>

    <rect x="45" y="160" width="150" height="46" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="120" y="180" text-anchor="middle" font-size="12" fill="#0f172a">用户 A（t-1）</text>
    <text x="120" y="197" text-anchor="middle" font-size="11" fill="#64748b">合法令牌</text>

    <rect x="250" y="160" width="205" height="46" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="352" y="180" text-anchor="middle" font-size="12" fill="#0f172a">GET /orders/1002</text>
    <text x="352" y="197" text-anchor="middle" font-size="11" fill="#64748b">对象属于用户 B</text>

    <line x1="195" y1="183" x2="244" y2="183" stroke="#475569" marker-end="url(#h)"/>

    <rect x="120" y="255" width="300" height="46" rx="8" fill="#ffffff" stroke="#dc2626"/>
    <text x="270" y="275" text-anchor="middle" font-size="12" fill="#991b1b">订单 1002 的 owner_id = user-B</text>
    <text x="270" y="292" text-anchor="middle" font-size="11.5" fill="#dc2626">没有对象级检查 → 数据泄露</text>
    <line x1="352" y1="206" x2="300" y2="250" stroke="#dc2626" marker-end="url(#hr)"/>

    <text x="45" y="340" font-size="12" fill="#991b1b">正确：查询与更新都必须带 tenant_id + owner/成员条件</text>
    <text x="45" y="362" font-size="12" fill="#991b1b">跨租户/他人对象统一返回 404，避免枚举</text>
  </g>

  <g>
    <rect x="520" y="80" width="460" height="300" rx="10" fill="#fff7ed" stroke="#ea580c"/>
    <text x="540" y="108" font-size="14.5" font-weight="bold" fill="#9a3412">纵向越权（BFLA）</text>
    <text x="540" y="132" font-size="12" fill="#7f1d1d">低权限角色调用高权限功能</text>

    <rect x="545" y="160" width="150" height="46" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="620" y="180" text-anchor="middle" font-size="12" fill="#0f172a">普通成员</text>
    <text x="620" y="197" text-anchor="middle" font-size="11" fill="#64748b">role = member</text>

    <rect x="750" y="160" width="205" height="46" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="852" y="180" text-anchor="middle" font-size="12" fill="#0f172a">POST /admin/delete</text>
    <text x="852" y="197" text-anchor="middle" font-size="11" fill="#64748b">要求 admin</text>

    <line x1="695" y1="183" x2="744" y2="183" stroke="#475569" marker-end="url(#h)"/>

    <rect x="620" y="255" width="300" height="46" rx="8" fill="#ffffff" stroke="#dc2626"/>
    <text x="770" y="275" text-anchor="middle" font-size="12" fill="#991b1b">路由级鉴权缺失 / 只藏了菜单</text>
    <text x="770" y="292" text-anchor="middle" font-size="11.5" fill="#dc2626">直达 URL 就能执行管理动作</text>
    <line x1="852" y1="206" x2="800" y2="250" stroke="#dc2626" marker-end="url(#hr)"/>

    <text x="545" y="340" font-size="12" fill="#9a3412">正确：菜单隐藏只是 UI；每个管理接口都要服务端校验角色</text>
    <text x="545" y="362" font-size="12" fill="#9a3412">高危动作再做一次服务端权限确认与审计</text>
  </g>

  <g>
    <rect x="20" y="410" width="960" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="500" y="438" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">两类越权的防线不同，不能互相替代</text>
    <text x="500" y="464" text-anchor="middle" font-size="12.5" fill="#334155">功能级鉴权（网关注册哪些角色可调）只挡纵向；对象级授权（租户 + 归属 + 关系）才挡横向</text>
    <text x="500" y="490" text-anchor="middle" font-size="12.5" fill="#334155">横向越权的高发位置：详情、批量、导出、搜索、下载、订阅、GraphQL 嵌套字段</text>
    <text x="500" y="514" text-anchor="middle" font-size="12.5" fill="#64748b">测试口径：两个租户 × 两个角色，对每个接口都跑一遍矩阵</text>
  </g>

  <text x="500" y="566" text-anchor="middle" font-size="12" fill="#64748b">合法的请求 + 合法的凭证 + 不属于你的对象 = 最容易被漏掉的漏洞</text>
</svg>
