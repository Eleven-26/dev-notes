<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">OAuth 2.0 授权模式决策树</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">先问「有没有用户在场」，再问「客户端能不能保守秘密 / 能不能输入」</text>

  <g font-size="14">
    <rect x="390" y="88" width="220" height="54" rx="10" fill="#eff6ff" stroke="#2563eb"/>
    <text x="500" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">有用户参与吗？</text>

    <rect x="150" y="206" width="290" height="54" rx="10" fill="#ffffff" stroke="#2563eb"/>
    <text x="295" y="239" text-anchor="middle" fill="#0f172a">客户端能安全保存 secret？</text>

    <rect x="580" y="206" width="270" height="54" rx="10" fill="#ffffff" stroke="#2563eb"/>
    <text x="715" y="239" text-anchor="middle" fill="#0f172a">输入受限的设备？</text>

    <rect x="40" y="336" width="240" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="160" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">机密客户端</text>
    <text x="160" y="383" text-anchor="middle" font-size="12.5" fill="#166534">授权码 + PKCE + secret</text>

    <rect x="310" y="336" width="230" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="425" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">公开客户端</text>
    <text x="425" y="383" text-anchor="middle" font-size="12.5" fill="#166534">授权码 + PKCE</text>

    <rect x="570" y="336" width="170" height="64" rx="8" fill="#fefce8" stroke="#ca8a04"/>
    <text x="655" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">输入受限设备</text>
    <text x="655" y="383" text-anchor="middle" font-size="12.5" fill="#854d0e">Device Grant</text>

    <rect x="750" y="336" width="180" height="64" rx="8" fill="#fefce8" stroke="#ca8a04"/>
    <text x="840" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">机器对机器</text>
    <text x="840" y="383" text-anchor="middle" font-size="12.5" fill="#854d0e">Client Credentials</text>
  </g>

  <g stroke="#475569" stroke-width="1.6" fill="none">
    <line x1="460" y1="142" x2="320" y2="200" marker-end="url(#a)"/>
    <line x1="540" y1="142" x2="690" y2="200" marker-end="url(#a)"/>
    <line x1="250" y1="260" x2="175" y2="330" marker-end="url(#a)"/>
    <line x1="340" y1="260" x2="410" y2="330" marker-end="url(#a)"/>
    <line x1="680" y1="260" x2="655" y2="330" marker-end="url(#a)"/>
    <line x1="760" y1="260" x2="840" y2="330" marker-end="url(#a)"/>
  </g>

  <g font-size="12.5" fill="#475569" text-anchor="middle">
    <text x="378" y="176">有</text>
    <text x="625" y="176">无</text>
    <text x="196" y="300">能</text>
    <text x="392" y="300">不能</text>
    <text x="656" y="300">是</text>
    <text x="832" y="300">否</text>
  </g>

  <rect x="150" y="460" width="700" height="56" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="500" y="485" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#991b1b">隐式流程 / 密码模式：OAuth 2.1 已移除，新接入不要使用</text>
  <text x="500" y="505" text-anchor="middle" font-size="12" fill="#991b1b">所有涉及用户的推荐路径都要求 PKCE（S256）</text>

  <text x="500" y="556" text-anchor="middle" font-size="12" fill="#64748b">判断顺序：用户在场 → 客户端类型 → 输入能力；没有用户时才考虑服务身份</text>
</svg>
