<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">四种授权模型的表达方式</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">同样回答「谁能对什么做什么」，复杂度落在不同位置</text>

  <g>
    <rect x="20" y="78" width="460" height="210" rx="10" fill="#eff6ff" stroke="#2563eb"/>
    <text x="40" y="105" font-size="14" font-weight="bold" fill="#1e3a8a">ACL：权限直接挂在资源上</text>
    <text x="40" y="128" font-size="12" fill="#334155">资源条目里列出主体与动作，直观但数量爆炸</text>

    <rect x="60" y="150" width="120" height="48" rx="8" fill="#ffffff" stroke="#2563eb"/>
    <text x="120" y="179" text-anchor="middle" font-size="13" fill="#0f172a">doc-7</text>
    <rect x="245" y="145" width="140" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="315" y="167" text-anchor="middle" font-size="12" fill="#334155">alice: read/write</text>
    <rect x="245" y="187" width="140" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="315" y="209" text-anchor="middle" font-size="12" fill="#334155">bob: read</text>
    <line x1="180" y1="174" x2="239" y2="162" stroke="#475569" marker-end="url(#m)"/>
    <line x1="180" y1="180" x2="239" y2="204" stroke="#475569" marker-end="url(#m)"/>
    <text x="40" y="262" font-size="12" fill="#1e40af">适用：文件系统、对象存储、少量固定资源</text>
  </g>

  <g>
    <rect x="500" y="78" width="460" height="210" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="520" y="105" font-size="14" font-weight="bold" fill="#166534">RBAC：主体 → 角色 → 权限</text>
    <text x="520" y="128" font-size="12" fill="#334155">按岗位授权，人员变动只改角色绑定</text>

    <rect x="525" y="155" width="100" height="42" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="575" y="181" text-anchor="middle" font-size="12.5" fill="#0f172a">user</text>
    <rect x="665" y="155" width="100" height="42" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="715" y="181" text-anchor="middle" font-size="12.5" fill="#0f172a">role</text>
    <rect x="805" y="155" width="120" height="42" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="865" y="181" text-anchor="middle" font-size="12.5" fill="#0f172a">permission</text>
    <line x1="625" y1="176" x2="659" y2="176" stroke="#475569" marker-end="url(#m)"/>
    <line x1="765" y1="176" x2="799" y2="176" stroke="#475569" marker-end="url(#m)"/>
    <text x="520" y="262" font-size="12" fill="#166534">适用：后台管理、企业岗位；弱在对象级权限</text>
  </g>

  <g>
    <rect x="20" y="304" width="460" height="210" rx="10" fill="#fefce8" stroke="#ca8a04"/>
    <text x="40" y="331" font-size="14" font-weight="bold" fill="#854d0e">ABAC：属性 + 策略在请求时求值</text>
    <text x="40" y="354" font-size="12" fill="#334155">主体、资源、环境属性一起参与判断</text>

    <rect x="45" y="380" width="110" height="34" rx="6" fill="#ffffff" stroke="#ca8a04"/>
    <text x="100" y="402" text-anchor="middle" font-size="11.5" fill="#334155">部门 / 密级</text>
    <rect x="45" y="424" width="110" height="34" rx="6" fill="#ffffff" stroke="#ca8a04"/>
    <text x="100" y="446" text-anchor="middle" font-size="11.5" fill="#334155">时间 / IP</text>
    <rect x="205" y="392" width="100" height="54" rx="8" fill="#ffffff" stroke="#ca8a04"/>
    <text x="255" y="415" text-anchor="middle" font-size="12" fill="#0f172a">策略引擎</text>
    <text x="255" y="433" text-anchor="middle" font-size="11" fill="#64748b">PDP</text>
    <rect x="345" y="392" width="110" height="54" rx="8" fill="#ffffff" stroke="#16a34a"/>
    <text x="400" y="425" text-anchor="middle" font-size="12.5" fill="#166534">allow/deny</text>
    <line x1="155" y1="397" x2="199" y2="410" stroke="#475569" marker-end="url(#m)"/>
    <line x1="155" y1="441" x2="199" y2="428" stroke="#475569" marker-end="url(#m)"/>
    <line x1="305" y1="419" x2="339" y2="419" stroke="#475569" marker-end="url(#m)"/>
    <text x="40" y="488" font-size="12" fill="#854d0e">适用：合规、风控、数据分级；代价是策略治理</text>
  </g>

  <g>
    <rect x="500" y="304" width="460" height="210" rx="10" fill="#fff7ed" stroke="#ea580c"/>
    <text x="520" y="331" font-size="14" font-weight="bold" fill="#9a3412">ReBAC：权限是关系图上的可达性</text>
    <text x="520" y="354" font-size="12" fill="#334155">共享、嵌套组与继承都表达成边</text>

    <rect x="530" y="382" width="95" height="36" rx="6" fill="#ffffff" stroke="#ea580c"/>
    <text x="577" y="405" text-anchor="middle" font-size="11.5" fill="#0f172a">doc:readme</text>
    <rect x="675" y="382" width="95" height="36" rx="6" fill="#ffffff" stroke="#ea580c"/>
    <text x="722" y="405" text-anchor="middle" font-size="11.5" fill="#0f172a">group:eng</text>
    <rect x="820" y="382" width="100" height="36" rx="6" fill="#ffffff" stroke="#ea580c"/>
    <text x="870" y="405" text-anchor="middle" font-size="11.5" fill="#0f172a">user:bob</text>
    <line x1="625" y1="400" x2="669" y2="400" stroke="#475569" marker-end="url(#m)"/>
    <line x1="770" y1="400" x2="814" y2="400" stroke="#475569" marker-end="url(#m)"/>
    <text x="647" y="388" text-anchor="middle" font-size="10.5" fill="#64748b">viewer</text>
    <text x="792" y="388" text-anchor="middle" font-size="10.5" fill="#64748b">member</text>
    <text x="520" y="452" font-size="12" fill="#9a3412">判定：从 doc 的 viewer 出发，能否到达 bob</text>
    <text x="520" y="488" font-size="12" fill="#9a3412">适用：文档协作、网盘、项目空间</text>
  </g>

  <text x="500" y="552" text-anchor="middle" font-size="12" fill="#64748b">工程上通常是混合：RBAC 管岗位，对象归属/成员表管共享，ABAC 管条件</text>
</svg>
