<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">取证的易失性顺序：越靠上越易失，越要先取</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">顺序摘自本篇第 6.1 节的七层表；位置越靠上，留给你取证的时间越短</text>
  <defs>
    <marker id="b1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="20" y="92" width="960" height="38" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.4"/>
  <text x="500" y="116" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">先取易失数据，再取持久数据；顺序反过来，前面几层往往已经没了</text>
  <line x1="36" y1="167" x2="36" y2="479" stroke="#b91c1c" stroke-width="2" marker-end="url(#b1)"/>
  <text x="46" y="160" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="bold">先取</text>
  <text x="46" y="496" font-size="12" fill="#64748b" text-anchor="start" font-weight="bold">后取</text>
  <rect x="80" y="144" width="884" height="46" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="100" y="173" font-size="15" fill="#991b1b" text-anchor="start" font-weight="bold">1</text>
  <text x="130" y="173" font-size="14" fill="#0f172a" text-anchor="start" font-weight="bold">CPU 寄存器 / 缓存</text>
  <line x1="376" y1="154" x2="376" y2="180" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="396" y="173" font-size="13" fill="#334155" text-anchor="start">秒级消失</text>
  <rect x="80" y="196" width="884" height="46" rx="8" fill="#ffedd5" stroke="#fdba74" stroke-width="1.3"/>
  <text x="100" y="225" font-size="15" fill="#9a3412" text-anchor="start" font-weight="bold">2</text>
  <text x="130" y="225" font-size="14" fill="#0f172a" text-anchor="start" font-weight="bold">内存</text>
  <line x1="376" y1="206" x2="376" y2="232" stroke="#fdba74" stroke-width="1.2"/>
  <text x="396" y="225" font-size="13" fill="#334155" text-anchor="start">进程、密钥、连接、恶意代码常只在内存</text>
  <rect x="80" y="248" width="884" height="46" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.3"/>
  <text x="100" y="277" font-size="15" fill="#92400e" text-anchor="start" font-weight="bold">3</text>
  <text x="130" y="277" font-size="14" fill="#0f172a" text-anchor="start" font-weight="bold">网络连接 / 路由 / ARP</text>
  <line x1="376" y1="258" x2="376" y2="284" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="396" y="277" font-size="13" fill="#334155" text-anchor="start">重启或断网后消失</text>
  <rect x="80" y="300" width="884" height="46" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.3"/>
  <text x="100" y="329" font-size="15" fill="#854d0e" text-anchor="start" font-weight="bold">4</text>
  <text x="130" y="329" font-size="14" fill="#0f172a" text-anchor="start" font-weight="bold">运行中的进程与句柄</text>
  <line x1="376" y1="310" x2="376" y2="336" stroke="#fde047" stroke-width="1.2"/>
  <text x="396" y="329" font-size="13" fill="#334155" text-anchor="start">进程退出后难恢复</text>
  <rect x="80" y="352" width="884" height="46" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
  <text x="100" y="381" font-size="15" fill="#166534" text-anchor="start" font-weight="bold">5</text>
  <text x="130" y="381" font-size="14" fill="#0f172a" text-anchor="start" font-weight="bold">磁盘 / 文件系统</text>
  <line x1="376" y1="362" x2="376" y2="388" stroke="#86efac" stroke-width="1.2"/>
  <text x="396" y="381" font-size="13" fill="#334155" text-anchor="start">持久，但可被删除或覆盖</text>
  <rect x="80" y="404" width="884" height="46" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="100" y="433" font-size="15" fill="#1e40af" text-anchor="start" font-weight="bold">6</text>
  <text x="130" y="433" font-size="14" fill="#0f172a" text-anchor="start" font-weight="bold">远程日志 / 审计</text>
  <line x1="376" y1="414" x2="376" y2="440" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="396" y="433" font-size="13" fill="#334155" text-anchor="start">可能被轮转或篡改</text>
  <rect x="80" y="456" width="884" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="100" y="485" font-size="15" fill="#475569" text-anchor="start" font-weight="bold">7</text>
  <text x="130" y="485" font-size="14" fill="#0f172a" text-anchor="start" font-weight="bold">备份 / 归档</text>
  <line x1="376" y1="466" x2="376" y2="492" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="396" y="485" font-size="13" fill="#334155" text-anchor="start">最后手段，可能已被污染</text>
  <text x="500" y="556" font-size="12.5" fill="#475569" text-anchor="middle">注意：第 5 层之后的东西「看起来还在」，但它们的可信度取决于前四层有没有被安全地取走 ——</text>
  <text x="500" y="580" font-size="12.5" fill="#475569" text-anchor="middle">先重装系统再想分析，第 1~4 层全部作废，磁盘上的痕迹也已被覆盖</text>
  <text x="500" y="606" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">本节要点：取证的核心不是「找到东西」，而是证明找到的东西没有被动过</text>
</svg>
