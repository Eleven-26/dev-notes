<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="s" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">SDL 七阶段：每个阶段有产出物，每个门禁看证据</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">左移不是多跑几个扫描器，而是把安全决策放到信息最完整、修改成本最低的位置</text>

  <g>
    <rect x="20" y="86" width="125" height="316" rx="9" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="20" y="86" width="125" height="42" rx="9" fill="#dbeafe" stroke="#2563eb"/>
    <text x="82" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">1. 需求</text>
    <text x="34" y="154" font-size="10.5" fill="#0f172a">数据分级</text>
    <text x="34" y="174" font-size="10.5" fill="#0f172a">安全验收标准</text>
    <text x="34" y="194" font-size="10.5" fill="#0f172a">滥用场景</text>
    <text x="34" y="224" font-size="10" fill="#64748b">产出：</text>
    <text x="34" y="242" font-size="10.5" fill="#334155">需求安全条目</text>
    <rect x="32" y="286" width="101" height="80" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="82" y="304" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">门禁</text>
    <text x="82" y="324" text-anchor="middle" font-size="10" fill="#334155">敏感 / 对外</text>
    <text x="82" y="342" text-anchor="middle" font-size="10" fill="#334155">必须评估</text>
  </g>

  <g>
    <rect x="160" y="86" width="125" height="316" rx="9" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="160" y="86" width="125" height="42" rx="9" fill="#dbeafe" stroke="#2563eb"/>
    <text x="222" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">2. 设计</text>
    <text x="174" y="154" font-size="10.5" fill="#0f172a">DFD + 信任边界</text>
    <text x="174" y="174" font-size="10.5" fill="#0f172a">STRIDE 威胁</text>
    <text x="174" y="194" font-size="10.5" fill="#0f172a">缓解方案</text>
    <text x="174" y="224" font-size="10" fill="#64748b">产出：</text>
    <text x="174" y="242" font-size="10.5" fill="#334155">威胁清单</text>
    <rect x="172" y="286" width="101" height="80" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="222" y="304" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">门禁</text>
    <text x="222" y="324" text-anchor="middle" font-size="10" fill="#334155">高风险威胁</text>
    <text x="222" y="342" text-anchor="middle" font-size="10" fill="#334155">必须有结论</text>
  </g>

  <g>
    <rect x="300" y="86" width="125" height="316" rx="9" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="300" y="86" width="125" height="42" rx="9" fill="#dbeafe" stroke="#2563eb"/>
    <text x="362" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">3. 编码</text>
    <text x="314" y="154" font-size="10.5" fill="#0f172a">评审清单</text>
    <text x="314" y="174" font-size="10.5" fill="#0f172a">密钥扫描</text>
    <text x="314" y="194" font-size="10.5" fill="#0f172a">危险 API 替换</text>
    <text x="314" y="224" font-size="10" fill="#64748b">产出：</text>
    <text x="314" y="242" font-size="10.5" fill="#334155">评审与扫描记录</text>
    <rect x="312" y="286" width="101" height="80" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="362" y="304" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">门禁</text>
    <text x="362" y="324" text-anchor="middle" font-size="10" fill="#334155">新增高危</text>
    <text x="362" y="342" text-anchor="middle" font-size="10" fill="#334155">阻断</text>
  </g>

  <g>
    <rect x="440" y="86" width="125" height="316" rx="9" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="440" y="86" width="125" height="42" rx="9" fill="#dbeafe" stroke="#2563eb"/>
    <text x="502" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">4. 构建</text>
    <text x="454" y="154" font-size="10.5" fill="#0f172a">锁依赖</text>
    <text x="454" y="174" font-size="10.5" fill="#0f172a">SCA + SBOM</text>
    <text x="454" y="194" font-size="10.5" fill="#0f172a">最小基础镜像</text>
    <text x="454" y="224" font-size="10" fill="#64748b">产出：</text>
    <text x="454" y="242" font-size="10.5" fill="#334155">SBOM / 门禁日志</text>
    <rect x="452" y="286" width="101" height="80" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="502" y="304" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">门禁</text>
    <text x="502" y="324" text-anchor="middle" font-size="10" fill="#334155">严重漏洞 /</text>
    <text x="502" y="342" text-anchor="middle" font-size="10" fill="#334155">许可证</text>
  </g>

  <g>
    <rect x="580" y="86" width="125" height="316" rx="9" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="580" y="86" width="125" height="42" rx="9" fill="#dbeafe" stroke="#2563eb"/>
    <text x="642" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">5. 测试</text>
    <text x="594" y="154" font-size="10.5" fill="#0f172a">SAST / DAST</text>
    <text x="594" y="174" font-size="10.5" fill="#0f172a">渗透测试</text>
    <text x="594" y="194" font-size="10.5" fill="#0f172a">越权用例</text>
    <text x="594" y="224" font-size="10" fill="#64748b">产出：</text>
    <text x="594" y="242" font-size="10.5" fill="#334155">测试报告</text>
    <rect x="592" y="286" width="101" height="80" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="642" y="304" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">门禁</text>
    <text x="642" y="324" text-anchor="middle" font-size="10" fill="#334155">高危未修</text>
    <text x="642" y="342" text-anchor="middle" font-size="10" fill="#334155">阻断发布</text>
  </g>

  <g>
    <rect x="720" y="86" width="125" height="316" rx="9" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="720" y="86" width="125" height="42" rx="9" fill="#dbeafe" stroke="#2563eb"/>
    <text x="782" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">6. 发布</text>
    <text x="734" y="154" font-size="10.5" fill="#0f172a">配置基线</text>
    <text x="734" y="174" font-size="10.5" fill="#0f172a">镜像签名</text>
    <text x="734" y="194" font-size="10.5" fill="#0f172a">密钥轮换</text>
    <text x="734" y="224" font-size="10" fill="#64748b">产出：</text>
    <text x="734" y="242" font-size="10.5" fill="#334155">发布单 / 签名</text>
    <rect x="732" y="286" width="101" height="80" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="782" y="304" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">门禁</text>
    <text x="782" y="324" text-anchor="middle" font-size="10" fill="#334155">签名 + 基线</text>
    <text x="782" y="342" text-anchor="middle" font-size="10" fill="#334155">一致</text>
  </g>

  <g>
    <rect x="855" y="86" width="125" height="316" rx="9" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="855" y="86" width="125" height="42" rx="9" fill="#dbeafe" stroke="#2563eb"/>
    <text x="917" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">7. 运营</text>
    <text x="869" y="154" font-size="10.5" fill="#0f172a">漏洞 SLA</text>
    <text x="869" y="174" font-size="10.5" fill="#0f172a">审计与检测</text>
    <text x="869" y="194" font-size="10.5" fill="#0f172a">应急演练</text>
    <text x="869" y="224" font-size="10" fill="#64748b">产出：</text>
    <text x="869" y="242" font-size="10.5" fill="#334155">补丁与复盘</text>
    <rect x="867" y="286" width="101" height="80" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="917" y="304" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">门禁</text>
    <text x="917" y="324" text-anchor="middle" font-size="10" fill="#334155">超 SLA</text>
    <text x="917" y="342" text-anchor="middle" font-size="10" fill="#334155">升级</text>
  </g>

  <g stroke="#475569" stroke-width="1.4">
    <line x1="145" y1="110" x2="155" y2="110" marker-end="url(#s)"/>
    <line x1="285" y1="110" x2="295" y2="110" marker-end="url(#s)"/>
    <line x1="425" y1="110" x2="435" y2="110" marker-end="url(#s)"/>
    <line x1="565" y1="110" x2="575" y2="110" marker-end="url(#s)"/>
    <line x1="705" y1="110" x2="715" y2="110" marker-end="url(#s)"/>
    <line x1="845" y1="110" x2="850" y2="110" marker-end="url(#s)"/>
  </g>

  <g>
    <rect x="20" y="428" width="960" height="140" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="40" y="454" font-size="14" font-weight="bold" fill="#334155">门禁的三条纪律</text>
    <text x="40" y="482" font-size="12" fill="#0f172a">① 只检查可验证的证据：SBOM、签名、扫描报告、威胁处置结论；没有证据的活动不算完成</text>
    <text x="40" y="506" font-size="12" fill="#0f172a">② 存量与新增分开：只阻断新增高危，存量按 SLA 收敛，避免「长期红着 → 全员绕过」</text>
    <text x="40" y="530" font-size="12" fill="#0f172a">③ 例外要有 Owner、理由、补偿控制与到期日；到期自动重新评估，不能永久豁免</text>
    <text x="40" y="554" font-size="11.5" fill="#64748b">密钥泄漏与新增严重漏洞永远阻断；中低危给建议与趋势，不制造告警疲劳</text>
  </g>
</svg>
