<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">应急响应六阶段：先止血，再根除，最后复盘</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">顺序错了，常见结果是证据被清掉、攻击者被惊动、问题再次复发</text>

  <g>
    <rect x="20" y="86" width="306" height="150" rx="9" fill="#eff6ff" stroke="#2563eb"/>
    <text x="38" y="112" font-size="14" font-weight="bold" fill="#1e3a8a">① 准备</text>
    <text x="38" y="138" font-size="11.5" fill="#334155">资产清单 / 联系人 / 值班表</text>
    <text x="38" y="160" font-size="11.5" fill="#334155">Playbook / 权限包 / 备份</text>
    <text x="38" y="182" font-size="11.5" fill="#334155">桌面演练与工具包</text>
    <text x="38" y="212" font-size="11.5" fill="#166534">产出：可执行的响应手册</text>
  </g>
  <g>
    <rect x="347" y="86" width="306" height="150" rx="9" fill="#eff6ff" stroke="#2563eb"/>
    <text x="365" y="112" font-size="14" font-weight="bold" fill="#1e3a8a">② 检测与分析</text>
    <text x="365" y="138" font-size="11.5" fill="#334155">验证告警、定级、圈定范围</text>
    <text x="365" y="160" font-size="11.5" fill="#334155">保全审计与主机证据</text>
    <text x="365" y="182" font-size="11.5" fill="#334155">写出时间线初稿</text>
    <text x="365" y="212" font-size="11.5" fill="#166534">产出：等级 + 影响范围</text>
  </g>
  <g>
    <rect x="674" y="86" width="306" height="150" rx="9" fill="#fef2f2" stroke="#dc2626"/>
    <text x="692" y="112" font-size="14" font-weight="bold" fill="#991b1b">③ 遏制</text>
    <text x="692" y="138" font-size="11.5" fill="#334155">网络隔离、撤销会话与令牌</text>
    <text x="692" y="160" font-size="11.5" fill="#334155">封禁入口、关闭功能</text>
    <text x="692" y="182" font-size="11.5" fill="#334155">保留运行状态与证据</text>
    <text x="692" y="212" font-size="11.5" fill="#166534">产出：攻击面被切断</text>
  </g>

  <g>
    <rect x="20" y="268" width="306" height="150" rx="9" fill="#fef2f2" stroke="#dc2626"/>
    <text x="38" y="294" font-size="14" font-weight="bold" fill="#991b1b">④ 根除</text>
    <text x="38" y="320" font-size="11.5" fill="#334155">清除恶意代码与持久化</text>
    <text x="38" y="342" font-size="11.5" fill="#334155">修复入口、补丁与配置</text>
    <text x="38" y="364" font-size="11.5" fill="#334155">轮换凭证与密钥</text>
    <text x="38" y="394" font-size="11.5" fill="#166534">产出：入口关闭、证据留存</text>
  </g>
  <g>
    <rect x="347" y="268" width="306" height="150" rx="9" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="365" y="294" font-size="14" font-weight="bold" fill="#14532d">⑤ 恢复</text>
    <text x="365" y="320" font-size="11.5" fill="#334155">干净镜像重建，不用旧盘</text>
    <text x="365" y="342" font-size="11.5" fill="#334155">分批放量、观察复发</text>
    <text x="365" y="364" font-size="11.5" fill="#334155">加强监控与告警</text>
    <text x="365" y="394" font-size="11.5" fill="#166534">产出：业务恢复、复发监控</text>
  </g>
  <g>
    <rect x="674" y="268" width="306" height="150" rx="9" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="692" y="294" font-size="14" font-weight="bold" fill="#14532d">⑥ 复盘</text>
    <text x="692" y="320" font-size="11.5" fill="#334155">时间线、根因、检测缺口</text>
    <text x="692" y="342" font-size="11.5" fill="#334155">影响范围与处置评估</text>
    <text x="692" y="364" font-size="11.5" fill="#334155">行动项：Owner + 截止 + 验证</text>
    <text x="692" y="394" font-size="11.5" fill="#166534">产出：整改清单与闭环</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M326 160 L345 160"/>
    <path d="M653 160 L672 160"/>
    <path d="M827 236 L827 250 L173 250 L173 266"/>
    <path d="M326 342 L345 342"/>
    <path d="M653 342 L672 342"/>
  </g>
  <g fill="#94a3b8">
    <polygon points="345,156 351,160 345,164"/>
    <polygon points="672,156 678,160 672,164"/>
    <polygon points="169,266 173,260 177,266"/>
    <polygon points="345,338 351,342 345,346"/>
    <polygon points="672,338 678,342 672,346"/>
  </g>

  <g>
    <rect x="20" y="446" width="960" height="132" rx="9" fill="#0f172a"/>
    <text x="40" y="472" font-size="12.5" font-weight="bold" fill="#ffffff">三个反直觉的点</text>
    <text x="40" y="498" font-size="11.5" fill="#e2e8f0">遏制不等于关机：优先网络隔离，保留内存、连接与恶意进程；关机可能把关键证据一起关掉。</text>
    <text x="40" y="522" font-size="11.5" fill="#e2e8f0">先取证再清理：删文件、重装系统会让根因分析失去依据；至少先做快照与哈希。</text>
    <text x="40" y="546" font-size="11.5" fill="#fca5a5">别打草惊蛇：确认范围前不要用攻击者可见的方式封号、改密，避免其提前破坏或转移。</text>
    <text x="40" y="570" font-size="11.5" fill="#94a3b8">指标：MTTD / MTTA / MTTC / MTTR；对外沟通只有一个出口。</text>
  </g>
</svg>
