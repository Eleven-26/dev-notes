<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">四类安全测试：看的东西不同，盲区也不同</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">没有一种工具能覆盖全部；组合的关键是让它们的盲区互相补位</text>

  <g>
    <rect x="20" y="84" width="465" height="200" rx="10" fill="#eff6ff" stroke="#2563eb"/>
    <text x="40" y="110" font-size="15" font-weight="bold" fill="#1e3a8a">SAST：静态应用安全测试</text>
    <text x="40" y="136" font-size="12" fill="#334155">看什么：源码 / 字节码里的数据流与危险模式</text>
    <text x="40" y="160" font-size="12" fill="#334155">什么时候：PR、每日构建</text>
    <text x="40" y="186" font-size="12" fill="#166534">强项：早、能定位到行、覆盖未执行分支</text>
    <text x="40" y="212" font-size="12" fill="#b91c1c">盲区：误报多；不懂运行时配置与框架魔法</text>
    <rect x="40" y="232" width="425" height="34" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="52" y="254" font-size="11.5" fill="#1e40af">典型：gosec、Semgrep、CodeQL；只阻断新增高危</text>
  </g>

  <g>
    <rect x="515" y="84" width="465" height="200" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="535" y="110" font-size="15" font-weight="bold" fill="#14532d">DAST：动态应用安全测试</text>
    <text x="535" y="136" font-size="12" fill="#334155">看什么：运行中的应用，从外部发真实请求</text>
    <text x="535" y="160" font-size="12" fill="#334155">什么时候：测试环境、发布前</text>
    <text x="535" y="186" font-size="12" fill="#166534">强项：认证流程、运行时配置、真实响应</text>
    <text x="535" y="212" font-size="12" fill="#b91c1c">盲区：依赖爬虫；看不到源码；状态难复现</text>
    <rect x="535" y="232" width="425" height="34" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="547" y="254" font-size="11.5" fill="#166534">典型：ZAP、Burp；需要可用的测试账号与数据</text>
  </g>

  <g>
    <rect x="20" y="304" width="465" height="200" rx="10" fill="#fefce8" stroke="#ca8a04"/>
    <text x="40" y="330" font-size="15" font-weight="bold" fill="#854d0e">SCA：软件组成分析</text>
    <text x="40" y="356" font-size="12" fill="#334155">看什么：依赖清单 / 锁文件里的组件与版本</text>
    <text x="40" y="380" font-size="12" fill="#334155">什么时候：每次构建</text>
    <text x="40" y="406" font-size="12" fill="#166534">强项：已知 CVE、许可证、传递依赖</text>
    <text x="40" y="432" font-size="12" fill="#b91c1c">盲区：不知道漏洞是否可达；依赖情报更新</text>
    <rect x="40" y="452" width="425" height="34" rx="6" fill="#ffffff" stroke="#ca8a04"/>
    <text x="52" y="474" font-size="11.5" fill="#854d0e">典型：govulncheck、Dependabot、Syft + Grype</text>
  </g>

  <g>
    <rect x="515" y="304" width="465" height="200" rx="10" fill="#fff7ed" stroke="#ea580c"/>
    <text x="535" y="330" font-size="15" font-weight="bold" fill="#9a3412">IAST：交互式应用安全测试</text>
    <text x="535" y="356" font-size="12" fill="#334155">看什么：插桩后的运行时，结合请求与代码执行</text>
    <text x="535" y="380" font-size="12" fill="#334155">什么时候：测试执行期间</text>
    <text x="535" y="406" font-size="12" fill="#166534">强项：数据流准确、误报较低</text>
    <text x="535" y="432" font-size="12" fill="#b91c1c">盲区：需要插桩；覆盖取决于测试用例</text>
    <rect x="535" y="452" width="425" height="34" rx="6" fill="#ffffff" stroke="#ea580c"/>
    <text x="547" y="474" font-size="11.5" fill="#9a3412">典型：测试环境 Agent；与集成测试一起跑</text>
  </g>

  <g>
    <rect x="20" y="524" width="960" height="52" rx="8" fill="#0f172a"/>
    <text x="40" y="546" font-size="12" font-weight="bold" fill="#ffffff">组合方式</text>
    <text x="40" y="566" font-size="11.5" fill="#e2e8f0">PR：SAST + 密钥扫描　构建：SCA + SBOM　测试环境：DAST / IAST　发布前：渗透测试 + 越权用例</text>
  </g>
</svg>
