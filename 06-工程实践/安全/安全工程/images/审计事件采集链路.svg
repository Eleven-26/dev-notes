<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">审计事件从产生到可查询：一条不能丢的链路</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">业务可以失败，审计不能跟着消失；采集停止本身就是一个告警事件</text>

  <g>
    <rect x="20" y="92" width="140" height="108" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="90" y="116" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">业务进程</text>
    <text x="90" y="142" text-anchor="middle" font-size="11.5" fill="#334155">产生事件</text>
    <text x="90" y="164" text-anchor="middle" font-size="11.5" fill="#334155">分配唯一 ID</text>
    <text x="90" y="186" text-anchor="middle" font-size="11.5" fill="#334155">不随事务回滚</text>
  </g>
  <g>
    <rect x="180" y="92" width="140" height="108" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="250" y="116" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">本地缓冲</text>
    <text x="250" y="142" text-anchor="middle" font-size="11.5" fill="#334155">持久化落盘</text>
    <text x="250" y="164" text-anchor="middle" font-size="11.5" fill="#334155">容量与降级策略</text>
    <text x="250" y="186" text-anchor="middle" font-size="11.5" fill="#334155">满了怎么办</text>
  </g>
  <g>
    <rect x="340" y="92" width="140" height="108" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="410" y="116" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">采集传输</text>
    <text x="410" y="142" text-anchor="middle" font-size="11.5" fill="#334155">批量发送</text>
    <text x="410" y="164" text-anchor="middle" font-size="11.5" fill="#334155">mTLS + 重试</text>
    <text x="410" y="186" text-anchor="middle" font-size="11.5" fill="#334155">至少一次投递</text>
  </g>
  <g>
    <rect x="500" y="92" width="140" height="108" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="570" y="116" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">流处理</text>
    <text x="570" y="142" text-anchor="middle" font-size="11.5" fill="#334155">校验 schema</text>
    <text x="570" y="164" text-anchor="middle" font-size="11.5" fill="#334155">补全字段</text>
    <text x="570" y="186" text-anchor="middle" font-size="11.5" fill="#334155">计算哈希链</text>
  </g>
  <g>
    <rect x="660" y="92" width="140" height="108" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="730" y="116" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">热存储</text>
    <text x="730" y="142" text-anchor="middle" font-size="11.5" fill="#334155">30～90 天</text>
    <text x="730" y="164" text-anchor="middle" font-size="11.5" fill="#334155">日常查询</text>
    <text x="730" y="186" text-anchor="middle" font-size="11.5" fill="#334155">按主体 / 资源索引</text>
  </g>
  <g>
    <rect x="820" y="92" width="160" height="108" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="900" y="116" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">冷存储</text>
    <text x="900" y="142" text-anchor="middle" font-size="11.5" fill="#334155">WORM 对象锁</text>
    <text x="900" y="164" text-anchor="middle" font-size="11.5" fill="#334155">独立账号</text>
    <text x="900" y="186" text-anchor="middle" font-size="11.5" fill="#334155">长期留存与锚点</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M160 146 L178 146"/>
    <path d="M320 146 L338 146"/>
    <path d="M480 146 L498 146"/>
    <path d="M640 146 L658 146"/>
    <path d="M800 146 L818 146"/>
  </g>
  <g fill="#94a3b8">
    <polygon points="178,142 184,146 178,150"/>
    <polygon points="338,142 344,146 338,150"/>
    <polygon points="498,142 504,146 498,150"/>
    <polygon points="658,142 664,146 658,150"/>
    <polygon points="818,142 824,146 818,150"/>
  </g>

  <g>
    <rect x="20" y="228" width="960" height="86" rx="8" fill="#0f172a"/>
    <text x="40" y="252" font-size="12.5" font-weight="bold" fill="#ffffff">链路要守住的四条</text>
    <text x="40" y="276" font-size="11.5" fill="#e2e8f0">至少一次 + event_id 去重　|　同一租户 / 资源进同一分区、单写者　|　背压与丢弃必须可见　|　静默即故障</text>
    <text x="40" y="300" font-size="11.5" fill="#fca5a5">任何一条没做到，后面再强的分析都可能建立在缺失或不一致的证据上。</text>
  </g>

  <g>
    <rect x="20" y="340" width="306" height="140" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="38" y="366" font-size="13.5" font-weight="bold" fill="#991b1b">坑一：跟业务事务一起回滚</text>
    <text x="38" y="392" font-size="11.5" fill="#334155">业务失败 → 审计也没了</text>
    <text x="38" y="414" font-size="11.5" fill="#334155">「操作失败」这件事反而查不到</text>
    <text x="38" y="440" font-size="11.5" fill="#166534">做法：outbox / 独立审计服务 /</text>
    <text x="38" y="462" font-size="11.5" fill="#166534">本地追加文件</text>
  </g>
  <g>
    <rect x="347" y="340" width="306" height="140" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="365" y="366" font-size="13.5" font-weight="bold" fill="#991b1b">坑二：审计服务挂了就丢</text>
    <text x="365" y="392" font-size="11.5" fill="#334155">没有本地缓冲，同步调用失败</text>
    <text x="365" y="414" font-size="11.5" fill="#334155">高危操作无人知道是否被记录</text>
    <text x="365" y="440" font-size="11.5" fill="#166534">做法：高危失败即拒绝；低危</text>
    <text x="365" y="462" font-size="11.5" fill="#166534">缓冲 + 告警，不静默丢</text>
  </g>
  <g>
    <rect x="674" y="340" width="306" height="140" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="692" y="366" font-size="13.5" font-weight="bold" fill="#991b1b">坑三：采样与静默丢弃</text>
    <text x="692" y="392" font-size="11.5" fill="#334155">把审计当普通日志采样 1%</text>
    <text x="692" y="414" font-size="11.5" fill="#334155">正好丢掉攻击者的那几条</text>
    <text x="692" y="440" font-size="11.5" fill="#166534">做法：审计不采样；丢弃计数</text>
    <text x="692" y="462" font-size="11.5" fill="#166534">必须告警</text>
  </g>
</svg>
