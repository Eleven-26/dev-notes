<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">供应链与 SBOM 闸门：每一段都有攻击面</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">从源码到部署准入，安全证据要一路传下去，而不是在最后补一份清单</text>

  <g>
    <rect x="26" y="84" width="148" height="76" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="100" y="107" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">① 源码</text>
    <text x="100" y="128" text-anchor="middle" font-size="11.5" fill="#334155">分支保护</text>
    <text x="100" y="146" text-anchor="middle" font-size="11.5" fill="#334155">评审 + 密钥扫描</text>
  </g>
  <g>
    <rect x="186" y="84" width="148" height="76" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="260" y="107" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">② 依赖解析</text>
    <text x="260" y="128" text-anchor="middle" font-size="11.5" fill="#334155">锁文件固定版本</text>
    <text x="260" y="146" text-anchor="middle" font-size="11.5" fill="#334155">私有源 + 校验和</text>
  </g>
  <g>
    <rect x="346" y="84" width="148" height="76" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="420" y="107" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">③ 构建</text>
    <text x="420" y="128" text-anchor="middle" font-size="11.5" fill="#334155">最小基础镜像</text>
    <text x="420" y="146" text-anchor="middle" font-size="11.5" fill="#334155">可复现构建</text>
  </g>
  <g>
    <rect x="506" y="84" width="148" height="76" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="580" y="107" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">④ SBOM</text>
    <text x="580" y="128" text-anchor="middle" font-size="11.5" fill="#334155">CycloneDX / SPDX</text>
    <text x="580" y="146" text-anchor="middle" font-size="11.5" fill="#334155">组件 + 许可证</text>
  </g>
  <g>
    <rect x="666" y="84" width="148" height="76" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="740" y="107" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">⑤ 签名与出处</text>
    <text x="740" y="128" text-anchor="middle" font-size="11.5" fill="#334155">cosign 签名</text>
    <text x="740" y="146" text-anchor="middle" font-size="11.5" fill="#334155">SLSA 出处证明</text>
  </g>
  <g>
    <rect x="826" y="84" width="148" height="76" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="900" y="107" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">⑥ 部署准入</text>
    <text x="900" y="128" text-anchor="middle" font-size="11.5" fill="#334155">准入策略校验</text>
    <text x="900" y="146" text-anchor="middle" font-size="11.5" fill="#334155">无签名不放行</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M176 122 L184 122"/>
    <path d="M336 122 L344 122"/>
    <path d="M496 122 L504 122"/>
    <path d="M656 122 L664 122"/>
    <path d="M816 122 L824 122"/>
  </g>
  <g fill="#94a3b8">
    <polygon points="184,118 190,122 184,126"/>
    <polygon points="344,118 350,122 344,126"/>
    <polygon points="504,118 510,122 504,126"/>
    <polygon points="664,118 670,122 664,126"/>
    <polygon points="824,118 830,122 824,126"/>
  </g>

  <text x="26" y="196" font-size="13" font-weight="bold" fill="#334155">四类典型攻击：不是“用了开源”有风险，而是“不知道用了什么、从哪来”</text>

  <g>
    <rect x="26" y="210" width="228" height="128" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="42" y="234" font-size="13.5" font-weight="bold" fill="#991b1b">依赖混淆</text>
    <text x="42" y="258" font-size="11.5" fill="#334155">在公开源注册同名包</text>
    <text x="42" y="280" font-size="11.5" fill="#334155">版本号更高 → 构建优先</text>
    <text x="42" y="302" font-size="11.5" fill="#334155">拉到公开源的恶意包</text>
    <text x="42" y="324" font-size="11.5" fill="#166534">拦法：私有源优先 + scope</text>
  </g>
  <g>
    <rect x="266" y="210" width="228" height="128" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="282" y="234" font-size="13.5" font-weight="bold" fill="#991b1b">仿冒包</text>
    <text x="282" y="258" font-size="11.5" fill="#334155">名字差一个字符，或拼写</text>
    <text x="282" y="280" font-size="11.5" fill="#334155">相近 → 开发者装错包</text>
    <text x="282" y="302" font-size="11.5" fill="#334155">恶意代码随依赖进入</text>
    <text x="282" y="324" font-size="11.5" fill="#166534">拦法：锁文件评审 + 白名单</text>
  </g>
  <g>
    <rect x="506" y="210" width="228" height="128" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="522" y="234" font-size="13.5" font-weight="bold" fill="#991b1b">维护者被攻陷</text>
    <text x="522" y="258" font-size="11.5" fill="#334155">合法包的下一个版本被</text>
    <text x="522" y="280" font-size="11.5" fill="#334155">植入恶意代码（xz 事件）</text>
    <text x="522" y="302" font-size="11.5" fill="#334155">签名与仓库都“正常”</text>
    <text x="522" y="324" font-size="11.5" fill="#166534">拦法：锁版本 + 行为检测</text>
  </g>
  <g>
    <rect x="746" y="210" width="228" height="128" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="762" y="234" font-size="13.5" font-weight="bold" fill="#991b1b">CI Action 未固定</text>
    <text x="762" y="258" font-size="11.5" fill="#334155">用 @main 而不是 @commit</text>
    <text x="762" y="280" font-size="11.5" fill="#334155">上游一改就跟着执行</text>
    <text x="762" y="302" font-size="11.5" fill="#334155">构建链直接落到别人手里</text>
    <text x="762" y="324" font-size="11.5" fill="#166534">拦法：固定 SHA + 最小权限</text>
  </g>

  <text x="26" y="370" font-size="13" font-weight="bold" fill="#334155">四道门禁：缺一道，前面的证据都白做</text>

  <g>
    <rect x="26" y="384" width="228" height="84" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text x="42" y="408" font-size="13" font-weight="bold" fill="#9a3412">严重漏洞阻断</text>
    <text x="42" y="432" font-size="11.5" fill="#334155">可达的 CRITICAL / HIGH</text>
    <text x="42" y="454" font-size="11.5" fill="#334155">不修就进不了生产</text>
  </g>
  <g>
    <rect x="266" y="384" width="228" height="84" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text x="282" y="408" font-size="13" font-weight="bold" fill="#9a3412">禁用许可证阻断</text>
    <text x="282" y="432" font-size="11.5" fill="#334155">AGPL / 未识别许可证</text>
    <text x="282" y="454" font-size="11.5" fill="#334155">不能靠“应该没事”放行</text>
  </g>
  <g>
    <rect x="506" y="384" width="228" height="84" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text x="522" y="408" font-size="13" font-weight="bold" fill="#9a3412">无签名阻断</text>
    <text x="522" y="432" font-size="11.5" fill="#334155">镜像与制品没有签名</text>
    <text x="522" y="454" font-size="11.5" fill="#334155">准入层直接拒绝</text>
  </g>
  <g>
    <rect x="746" y="384" width="228" height="84" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text x="762" y="408" font-size="13" font-weight="bold" fill="#9a3412">来源不明阻断</text>
    <text x="762" y="432" font-size="11.5" fill="#334155">出处无法追溯到提交</text>
    <text x="762" y="454" font-size="11.5" fill="#334155">无法评估影响范围</text>
  </g>

  <g>
    <rect x="26" y="492" width="948" height="112" rx="8" fill="#0f172a"/>
    <text x="46" y="518" font-size="12.5" font-weight="bold" fill="#ffffff">SBOM 是证据，不是装饰</text>
    <text x="46" y="544" font-size="11.5" fill="#e2e8f0">SBOM 回答“用了什么”，签名与出处回答“谁构建的、从哪个提交构建”；两者缺一，出事后无法回答影响范围。</text>
    <text x="46" y="568" font-size="11.5" fill="#e2e8f0">解析层级写错会静默漏检：实测把 licenses[].license.id 读成 licenses[].id，AGPL 组件被直接判成 PASS。</text>
    <text x="46" y="592" font-size="11.5" fill="#fca5a5">门禁代码本身也要有测试：漏掉一个字段，比没有门禁更危险。</text>
  </g>
</svg>
