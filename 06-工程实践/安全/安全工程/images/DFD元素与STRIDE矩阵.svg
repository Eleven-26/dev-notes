<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="f" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">DFD 元素与 STRIDE：先画边界，再按元素问威胁</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">威胁建模的输入是数据流与信任边界，不是一份功能列表</text>

  <g>
    <rect x="20" y="80" width="270" height="212" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="38" y="106" font-size="13.5" font-weight="bold" fill="#334155">DFD 四类元素</text>

    <rect x="40" y="122" width="86" height="28" rx="3" fill="#ffffff" stroke="#2563eb"/>
    <text x="136" y="141" font-size="11.5" fill="#334155">外部实体（用户 / 第三方）</text>

    <rect x="40" y="162" width="86" height="28" rx="10" fill="#ffffff" stroke="#16a34a"/>
    <text x="136" y="181" font-size="11.5" fill="#334155">进程（API / 消费者）</text>

    <path d="M40 212 L126 212 L126 232 L40 232 Z" fill="#ffffff" stroke="#ca8a04"/>
    <text x="136" y="226" font-size="11.5" fill="#334155">数据存储（库 / 缓存）</text>

    <line x1="40" y1="258" x2="120" y2="258" stroke="#475569" stroke-width="1.6" marker-end="url(#f)"/>
    <text x="136" y="262" font-size="11.5" fill="#334155">数据流（请求 / 消息）</text>

    <line x1="40" y1="282" x2="130" y2="282" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="140" y="286" font-size="11.5" fill="#991b1b">信任边界</text>
  </g>

  <g>
    <rect x="310" y="80" width="670" height="212" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="330" y="106" font-size="13.5" font-weight="bold" fill="#334155">示例：下单链路</text>

    <line x1="430" y1="118" x2="430" y2="276" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="436" y="132" font-size="10.5" fill="#991b1b">公网 / 内网边界</text>

    <rect x="330" y="150" width="86" height="46" rx="4" fill="#eff6ff" stroke="#2563eb"/>
    <text x="373" y="178" text-anchor="middle" font-size="12" fill="#1e3a8a">用户</text>

    <rect x="455" y="150" width="96" height="46" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="503" y="178" text-anchor="middle" font-size="12" fill="#14532d">网关</text>

    <rect x="585" y="150" width="100" height="46" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="635" y="178" text-anchor="middle" font-size="12" fill="#14532d">订单服务</text>

    <path d="M735 156 L805 156 L805 192 L735 192 Z" fill="#fefce8" stroke="#ca8a04"/>
    <text x="770" y="179" text-anchor="middle" font-size="12" fill="#854d0e">订单库</text>

    <rect x="600" y="232" width="120" height="40" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-dasharray="5 3"/>
    <text x="660" y="257" text-anchor="middle" font-size="11.5" fill="#9a3412">第三方支付</text>

    <g stroke="#475569" stroke-width="1.5">
      <line x1="416" y1="173" x2="449" y2="173" marker-end="url(#f)"/>
      <line x1="551" y1="173" x2="579" y2="173" marker-end="url(#f)"/>
      <line x1="685" y1="173" x2="729" y2="173" marker-end="url(#f)"/>
      <line x1="660" y1="196" x2="660" y2="226" marker-end="url(#f)"/>
    </g>
    <text x="760" y="226" font-size="10.5" fill="#64748b">每条跨边界流都要问认证 / 授权 / 脱敏</text>
  </g>

  <g>
    <rect x="20" y="312" width="960" height="276" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="40" y="340" font-size="13.5" font-weight="bold" fill="#334155">元素 × STRIDE：高 = 重点问，中 = 按场景问，低 = 通常次要</text>

    <rect x="40" y="356" width="240" height="40" rx="5" fill="#f1f5f9"/>
    <text x="160" y="381" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">DFD 元素</text>
    <g>
      <rect x="300" y="356" width="100" height="40" rx="5" fill="#f1f5f9"/>
      <text x="350" y="381" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">S 伪装</text>
      <rect x="410" y="356" width="100" height="40" rx="5" fill="#f1f5f9"/>
      <text x="460" y="381" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">T 篡改</text>
      <rect x="520" y="356" width="100" height="40" rx="5" fill="#f1f5f9"/>
      <text x="570" y="381" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">R 抵赖</text>
      <rect x="630" y="356" width="100" height="40" rx="5" fill="#f1f5f9"/>
      <text x="680" y="381" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">I 泄露</text>
      <rect x="740" y="356" width="100" height="40" rx="5" fill="#f1f5f9"/>
      <text x="790" y="381" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">D 拒绝</text>
      <rect x="850" y="356" width="100" height="40" rx="5" fill="#f1f5f9"/>
      <text x="900" y="381" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">E 提权</text>
    </g>

    <rect x="40" y="404" width="240" height="40" rx="5" fill="#eff6ff"/>
    <text x="52" y="429" font-size="12" fill="#1e3a8a">外部实体</text>
    <rect x="300" y="404" width="100" height="40" rx="5" fill="#fee2e2"/>
    <text x="350" y="429" text-anchor="middle" font-size="12" fill="#991b1b">高</text>
    <rect x="410" y="404" width="100" height="40" rx="5" fill="#f8fafc"/>
    <text x="460" y="429" text-anchor="middle" font-size="12" fill="#64748b">低</text>
    <rect x="520" y="404" width="100" height="40" rx="5" fill="#fee2e2"/>
    <text x="570" y="429" text-anchor="middle" font-size="12" fill="#991b1b">高</text>
    <rect x="630" y="404" width="100" height="40" rx="5" fill="#f8fafc"/>
    <text x="680" y="429" text-anchor="middle" font-size="12" fill="#64748b">低</text>
    <rect x="740" y="404" width="100" height="40" rx="5" fill="#f8fafc"/>
    <text x="790" y="429" text-anchor="middle" font-size="12" fill="#64748b">低</text>
    <rect x="850" y="404" width="100" height="40" rx="5" fill="#f8fafc"/>
    <text x="900" y="429" text-anchor="middle" font-size="12" fill="#64748b">低</text>

    <rect x="40" y="452" width="240" height="40" rx="5" fill="#f0fdf4"/>
    <text x="52" y="477" font-size="12" fill="#14532d">进程</text>
    <rect x="300" y="452" width="100" height="40" rx="5" fill="#fee2e2"/>
    <text x="350" y="477" text-anchor="middle" font-size="12" fill="#991b1b">高</text>
    <rect x="410" y="452" width="100" height="40" rx="5" fill="#fee2e2"/>
    <text x="460" y="477" text-anchor="middle" font-size="12" fill="#991b1b">高</text>
    <rect x="520" y="452" width="100" height="40" rx="5" fill="#fee2e2"/>
    <text x="570" y="477" text-anchor="middle" font-size="12" fill="#991b1b">高</text>
    <rect x="630" y="452" width="100" height="40" rx="5" fill="#fee2e2"/>
    <text x="680" y="477" text-anchor="middle" font-size="12" fill="#991b1b">高</text>
    <rect x="740" y="452" width="100" height="40" rx="5" fill="#fee2e2"/>
    <text x="790" y="477" text-anchor="middle" font-size="12" fill="#991b1b">高</text>
    <rect x="850" y="452" width="100" height="40" rx="5" fill="#fee2e2"/>
    <text x="900" y="477" text-anchor="middle" font-size="12" fill="#991b1b">高</text>

    <rect x="40" y="500" width="240" height="40" rx="5" fill="#fefce8"/>
    <text x="52" y="525" font-size="12" fill="#854d0e">数据存储</text>
    <rect x="300" y="500" width="100" height="40" rx="5" fill="#f8fafc"/>
    <text x="350" y="525" text-anchor="middle" font-size="12" fill="#64748b">低</text>
    <rect x="410" y="500" width="100" height="40" rx="5" fill="#fee2e2"/>
    <text x="460" y="525" text-anchor="middle" font-size="12" fill="#991b1b">高</text>
    <rect x="520" y="500" width="100" height="40" rx="5" fill="#fef3c7"/>
    <text x="570" y="525" text-anchor="middle" font-size="12" fill="#854d0e">中</text>
    <rect x="630" y="500" width="100" height="40" rx="5" fill="#fee2e2"/>
    <text x="680" y="525" text-anchor="middle" font-size="12" fill="#991b1b">高</text>
    <rect x="740" y="500" width="100" height="40" rx="5" fill="#fee2e2"/>
    <text x="790" y="525" text-anchor="middle" font-size="12" fill="#991b1b">高</text>
    <rect x="850" y="500" width="100" height="40" rx="5" fill="#fef3c7"/>
    <text x="900" y="525" text-anchor="middle" font-size="12" fill="#854d0e">中</text>

    <rect x="40" y="548" width="240" height="24" rx="5" fill="#fff7ed"/>
    <text x="52" y="565" font-size="12" fill="#9a3412">数据流</text>
    <rect x="300" y="548" width="100" height="24" rx="5" fill="#fef3c7"/>
    <text x="350" y="565" text-anchor="middle" font-size="11.5" fill="#854d0e">中</text>
    <rect x="410" y="548" width="100" height="24" rx="5" fill="#fee2e2"/>
    <text x="460" y="565" text-anchor="middle" font-size="11.5" fill="#991b1b">高</text>
    <rect x="520" y="548" width="100" height="24" rx="5" fill="#f8fafc"/>
    <text x="570" y="565" text-anchor="middle" font-size="11.5" fill="#64748b">低</text>
    <rect x="630" y="548" width="100" height="24" rx="5" fill="#fee2e2"/>
    <text x="680" y="565" text-anchor="middle" font-size="11.5" fill="#991b1b">高</text>
    <rect x="740" y="548" width="100" height="24" rx="5" fill="#fee2e2"/>
    <text x="790" y="565" text-anchor="middle" font-size="11.5" fill="#991b1b">高</text>
    <rect x="850" y="548" width="100" height="24" rx="5" fill="#f8fafc"/>
    <text x="900" y="565" text-anchor="middle" font-size="11.5" fill="#64748b">低</text>
  </g>
</svg>
