<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">机密该放在哪里：一条决策路径</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">先问生命周期与使用方式，再选托管形态；不是越高级越好</text>

  <rect x="350" y="90" width="300" height="56" rx="9" fill="#eff6ff" stroke="#2563eb"/>
  <text x="500" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">进程运行时需要读取它吗？</text>

  <rect x="40" y="204" width="280" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="180" y="230" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">构建期 / 一次性使用</text>
  <text x="180" y="251" text-anchor="middle" font-size="11" fill="#475569">制品签名私钥、发布 token</text>

  <rect x="560" y="194" width="380" height="64" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="750" y="232" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">是：它是不是长期凭证？</text>

  <rect x="560" y="304" width="380" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="750" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">优先换成短期凭证</text>
  <text x="750" y="351" text-anchor="middle" font-size="11" fill="#475569">workload identity / 动态数据库凭据</text>

  <rect x="40" y="304" width="440" height="64" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="260" y="342" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">有合规 / 多服务 / 审计要求吗？</text>

  <rect x="40" y="424" width="440" height="72" rx="8" fill="#fefce8" stroke="#ca8a04"/>
  <text x="260" y="452" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#854d0e">KMS / Vault / 云 Secret Manager</text>
  <text x="260" y="475" text-anchor="middle" font-size="11" fill="#475569">信封加密 + 按 key 授权 + 访问审计</text>

  <rect x="560" y="424" width="380" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="750" y="452" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">K8s Secret + RBAC + 静态加密</text>
  <text x="750" y="475" text-anchor="middle" font-size="11" fill="#475569">或挂载文件；base64 本身不算加密</text>

  <g stroke="#475569" stroke-width="1.5" fill="none">
    <polyline points="400,146 400,164 180,164 180,198"/>
    <polyline points="570,146 570,180 750,180 750,188"/>
    <line x1="750" y1="258" x2="750" y2="298"/>
    <line x1="560" y1="336" x2="486" y2="336"/>
    <line x1="220" y1="368" x2="220" y2="418"/>
    <polyline points="470,368 470,400 750,400 750,418"/>
  </g>
  <g fill="#475569">
    <path d="M180,198 L175,188 L185,188 Z"/>
    <path d="M750,188 L745,178 L755,178 Z"/>
    <path d="M750,298 L745,288 L755,288 Z"/>
    <path d="M486,336 L496,331 L496,341 Z"/>
    <path d="M220,418 L215,408 L225,408 Z"/>
    <path d="M750,418 L745,408 L755,408 Z"/>
  </g>

  <g font-size="11.5" fill="#64748b">
    <text x="300" y="158">否</text>
    <text x="588" y="174">是</text>
    <text x="763" y="284">是</text>
    <text x="518" y="328" text-anchor="middle">否</text>
    <text x="233" y="400">是</text>
    <text x="600" y="392" text-anchor="middle">否</text>
  </g>

  <text x="500" y="548" text-anchor="middle" font-size="12" fill="#64748b">判据不是「哪个组件更高级」，而是「密钥是否与密文分离、能否按最小权限访问、能否轮换与审计」</text>
</svg>
