<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">HMAC 与数字签名：一个共享密钥，一个公私钥对</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">两者都能做完整性校验与来源确认，但信任模型和成本完全不同 —— 选型由「验证方可不可信」决定</text>
  <defs>
    <marker id="k1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="40" y="84" width="450" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="265" y="116" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="bold">HMAC（对称）</text>
  <rect x="510" y="84" width="450" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="735" y="116" font-size="13" fill="#166534" text-anchor="middle" font-weight="bold">数字签名（非对称）</text>
  <rect x="40" y="148" width="130" height="52" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="180" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">密钥</text>
  <rect x="178" y="148" width="312" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="192" y="180" font-size="10" fill="#334155" text-anchor="start">双方共享同一把密钥</text>
  <rect x="510" y="148" width="450" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="524" y="180" font-size="10" fill="#334155" text-anchor="start">一方持私钥签名，所有人持公钥验</text>
  <rect x="40" y="208" width="130" height="52" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="240" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">防抵赖</text>
  <rect x="178" y="208" width="312" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="192" y="240" font-size="10" fill="#334155" text-anchor="start">不能：双方都能生成，无法证明是谁做的</text>
  <rect x="510" y="208" width="450" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="524" y="240" font-size="10" fill="#334155" text-anchor="start">能：只有私钥持有者能生成</text>
  <rect x="40" y="268" width="130" height="52" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="300" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">验证方保密</text>
  <rect x="178" y="268" width="312" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="192" y="300" font-size="10" fill="#334155" text-anchor="start">需要：有密钥就能伪造</text>
  <rect x="510" y="268" width="450" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="524" y="300" font-size="10" fill="#334155" text-anchor="start">不需要：公钥可以公开</text>
  <rect x="40" y="328" width="130" height="52" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="360" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">性能</text>
  <rect x="178" y="328" width="312" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="192" y="360" font-size="10" fill="#334155" text-anchor="start">快：纯哈希 + 一次异或</text>
  <rect x="510" y="328" width="450" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="524" y="360" font-size="10" fill="#334155" text-anchor="start">慢：大数运算</text>
  <rect x="40" y="388" width="130" height="52" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="420" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">密钥分发</text>
  <rect x="178" y="388" width="312" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="192" y="420" font-size="10" fill="#334155" text-anchor="start">N 个参与方需 N 把或统一一把</text>
  <rect x="510" y="388" width="450" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="524" y="420" font-size="10" fill="#334155" text-anchor="start">只需分发公钥</text>
  <rect x="40" y="448" width="130" height="52" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="480" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">适用</text>
  <rect x="178" y="448" width="312" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="192" y="480" font-size="10" fill="#334155" text-anchor="start">内部服务间、Webhook 验签、短链防篡改</text>
  <rect x="510" y="448" width="450" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="524" y="480" font-size="10" fill="#334155" text-anchor="start">跨信任域：JWT、开放平台 API、证书、制品签名</text>
  <rect x="40" y="512" width="920" height="76" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="58" y="538" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="bold">实测性能差两个数量级（256 字节载荷重复 2000 次，JDK 1.8）</text>
  <text x="58" y="562" font-size="10.5" fill="#334155" text-anchor="start">HMAC-SHA256 77.3 ms（2.59 万次/秒）　vs　SHA256withRSA 9234.8 ms（0.02 万次/秒）　→ 签名慢 119 倍</text>
  <text x="58" y="582" font-size="10.5" fill="#64748B" text-anchor="start">⚠ 成本主要在私钥运算（initSign + sign），验签快得多 —— 所以「签名慢」的压力落在签发方，不在验证方</text>
</svg>
