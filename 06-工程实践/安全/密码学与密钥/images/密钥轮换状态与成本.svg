<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">密钥轮换的状态与两种成本</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">版本并存解决可用性；重包与重加密解决成本</text>

  <g font-size="12.5">
    <rect x="20" y="84" width="215" height="78" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="127" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Active</text>
    <text x="127" y="132" text-anchor="middle" fill="#166534">只此一版：加密 + 解密</text>
    <text x="127" y="151" text-anchor="middle" font-size="11" fill="#475569">新数据都写 current</text>

    <rect x="268" y="84" width="215" height="78" rx="8" fill="#fefce8" stroke="#ca8a04"/>
    <text x="375" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">Rotating</text>
    <text x="375" y="132" text-anchor="middle" font-size="12" fill="#854d0e">current 加密，previous 解密</text>
    <text x="375" y="151" text-anchor="middle" font-size="11" fill="#475569">双密钥窗口，保证旧数据可读</text>

    <rect x="516" y="84" width="215" height="78" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text x="623" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">Retired</text>
    <text x="623" y="132" text-anchor="middle" fill="#9a3412">只解密，不再加密</text>
    <text x="623" y="151" text-anchor="middle" font-size="11" fill="#475569">等待存量密文处理完</text>

    <rect x="764" y="84" width="215" height="78" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="871" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Destroyed</text>
    <text x="871" y="132" text-anchor="middle" fill="#991b1b">密钥材料删除，不可逆</text>
    <text x="871" y="151" text-anchor="middle" font-size="11" fill="#475569">只有确认无引用后才允许</text>

    <line x1="235" y1="123" x2="262" y2="123" stroke="#475569" marker-end="url(#m)"/>
    <line x1="483" y1="123" x2="510" y2="123" stroke="#475569" marker-end="url(#m)"/>
    <line x1="731" y1="123" x2="758" y2="123" stroke="#475569" marker-end="url(#m)"/>
  </g>

  <text x="239" y="180" text-anchor="middle" font-size="10.5" fill="#64748b">新增 v2 并提升</text>
  <text x="487" y="180" text-anchor="middle" font-size="10.5" fill="#64748b">存量已无 v1 引用</text>
  <text x="735" y="180" text-anchor="middle" font-size="10.5" fill="#64748b">保留期结束</text>

  <g>
    <rect x="20" y="204" width="470" height="300" rx="10" fill="#eff6ff" stroke="#2563eb"/>
    <text x="38" y="232" font-size="14" font-weight="bold" fill="#1e3a8a">KEK 轮换：只重包 DEK</text>
    <text x="38" y="254" font-size="11.5" fill="#475569">数据密文一个字节都不用动</text>

    <rect x="38" y="272" width="130" height="58" rx="7" fill="#ffffff" stroke="#2563eb"/>
    <text x="103" y="296" text-anchor="middle" font-size="11.5" fill="#0f172a">旧 KEK</text>
    <text x="103" y="316" text-anchor="middle" font-size="11" fill="#475569">解包 wrapped DEK</text>

    <rect x="190" y="272" width="130" height="58" rx="7" fill="#ffffff" stroke="#2563eb"/>
    <text x="255" y="296" text-anchor="middle" font-size="11.5" fill="#0f172a">新 KEK</text>
    <text x="255" y="316" text-anchor="middle" font-size="11" fill="#475569">重新包裹同一把 DEK</text>

    <rect x="342" y="272" width="130" height="58" rx="7" fill="#ffffff" stroke="#2563eb"/>
    <text x="407" y="296" text-anchor="middle" font-size="11.5" fill="#0f172a">只改密钥头</text>
    <text x="407" y="316" text-anchor="middle" font-size="11" fill="#475569">nonce / 密文不变</text>

    <line x1="168" y1="301" x2="184" y2="301" stroke="#475569" marker-end="url(#m)"/>
    <line x1="320" y1="301" x2="336" y2="301" stroke="#475569" marker-end="url(#m)"/>

    <text x="38" y="362" font-size="12" fill="#1e40af">成本：每条记录一次解包 + 一次包裹，</text>
    <text x="38" y="384" font-size="12" fill="#1e40af">与数据大小无关，可以在线分批做。</text>
    <text x="38" y="416" font-size="12" fill="#1e40af">适用：定期换 KEK、怀疑 KEK 泄漏、</text>
    <text x="38" y="438" font-size="12" fill="#1e40af">把根密钥从自管迁到 KMS。</text>
    <text x="38" y="474" font-size="11.5" fill="#dc2626">⚠ 重包时加密恒用 current；previous 只解密。</text>
  </g>

  <g>
    <rect x="510" y="204" width="470" height="300" rx="10" fill="#fff7ed" stroke="#ea580c"/>
    <text x="528" y="232" font-size="14" font-weight="bold" fill="#9a3412">DEK 轮换：必须重加密数据</text>
    <text x="528" y="254" font-size="11.5" fill="#475569">数据密钥换了，旧密文只能解开再重写</text>

    <rect x="528" y="272" width="130" height="58" rx="7" fill="#ffffff" stroke="#ea580c"/>
    <text x="593" y="296" text-anchor="middle" font-size="11.5" fill="#0f172a">读取</text>
    <text x="593" y="316" text-anchor="middle" font-size="11" fill="#475569">解包 DEK 并解出明文</text>

    <rect x="680" y="272" width="130" height="58" rx="7" fill="#ffffff" stroke="#ea580c"/>
    <text x="745" y="296" text-anchor="middle" font-size="11.5" fill="#0f172a">新 DEK</text>
    <text x="745" y="316" text-anchor="middle" font-size="11" fill="#475569">新 nonce + 新密文</text>

    <rect x="832" y="272" width="130" height="58" rx="7" fill="#ffffff" stroke="#ea580c"/>
    <text x="897" y="296" text-anchor="middle" font-size="11.5" fill="#0f172a">写回</text>
    <text x="897" y="316" text-anchor="middle" font-size="11" fill="#475569">原子替换 + 进度记录</text>

    <line x1="658" y1="301" x2="674" y2="301" stroke="#475569" marker-end="url(#m)"/>
    <line x1="810" y1="301" x2="826" y2="301" stroke="#475569" marker-end="url(#m)"/>

    <text x="528" y="362" font-size="12" fill="#9a3412">成本：O(数据量)，要限速、可断点续跑，</text>
    <text x="528" y="384" font-size="12" fill="#9a3412">并保证重写期间读写都兼容新旧格式。</text>
    <text x="528" y="416" font-size="12" fill="#9a3412">适用：DEK 疑似泄漏、算法升级、</text>
    <text x="528" y="438" font-size="12" fill="#9a3412">按主体删钥（crypto-shredding）之后。</text>
    <text x="528" y="474" font-size="11.5" fill="#dc2626">⚠ 密钥销毁不可逆：先备份策略，再谈删除。</text>
  </g>

  <text x="500" y="546" text-anchor="middle" font-size="12" fill="#64748b">轮换不是「换一个值」：先发布新版本 → 双版本并行 → 处理存量 → 退休旧版本 → 到期销毁</text>
</svg>
