<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">机密的生命周期与八个泄漏面</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">生命周期管「每个阶段谁能碰」；泄漏面决定「出事时先去哪查」</text>

  <g font-size="12.5">
    <rect x="30" y="86" width="140" height="52" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="100" y="118" text-anchor="middle" fill="#1e3a8a">生成</text>
    <rect x="196" y="86" width="140" height="52" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="266" y="118" text-anchor="middle" fill="#1e3a8a">分发 / 注入</text>
    <rect x="362" y="86" width="140" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="432" y="118" text-anchor="middle" fill="#166534">使用</text>
    <rect x="528" y="86" width="140" height="52" rx="8" fill="#fefce8" stroke="#ca8a04"/>
    <text x="598" y="118" text-anchor="middle" fill="#854d0e">轮换</text>
    <rect x="694" y="86" width="140" height="52" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text x="764" y="118" text-anchor="middle" fill="#9a3412">吊销</text>
    <rect x="860" y="86" width="110" height="52" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="915" y="118" text-anchor="middle" fill="#991b1b">销毁</text>

    <line x1="170" y1="112" x2="190" y2="112" stroke="#475569" marker-end="url(#m)"/>
    <line x1="336" y1="112" x2="356" y2="112" stroke="#475569" marker-end="url(#m)"/>
    <line x1="502" y1="112" x2="522" y2="112" stroke="#475569" marker-end="url(#m)"/>
    <line x1="668" y1="112" x2="688" y2="112" stroke="#475569" marker-end="url(#m)"/>
    <line x1="834" y1="112" x2="854" y2="112" stroke="#475569" marker-end="url(#m)"/>
  </g>

  <text x="30" y="170" font-size="13" font-weight="bold" fill="#0f172a">泄漏面：密钥不只在代码里，以下每一处都要单独管</text>

  <g>
    <rect x="30" y="186" width="220" height="92" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="44" y="211" font-size="12.5" font-weight="bold" fill="#991b1b">① Git 历史</text>
    <text x="44" y="234" font-size="11" fill="#334155">删掉当前版本不等于消失，</text>
    <text x="44" y="252" font-size="11" fill="#334155">fork / PR / 旧提交仍可查。</text>

    <rect x="270" y="186" width="220" height="92" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="284" y="211" font-size="12.5" font-weight="bold" fill="#991b1b">② 镜像层</text>
    <text x="284" y="234" font-size="11" fill="#334155">COPY 进层的密钥会留在层里，</text>
    <text x="284" y="252" font-size="11" fill="#334155">后续 RUN rm 只是遮蔽。</text>

    <rect x="510" y="186" width="220" height="92" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="524" y="211" font-size="12.5" font-weight="bold" fill="#991b1b">③ CI 日志</text>
    <text x="524" y="234" font-size="11" fill="#334155">echo、set -x、错误堆栈，</text>
    <text x="524" y="252" font-size="11" fill="#334155">都会把变量原样打出来。</text>

    <rect x="750" y="186" width="220" height="92" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="764" y="211" font-size="12.5" font-weight="bold" fill="#991b1b">④ 运行环境</text>
    <text x="764" y="234" font-size="11" fill="#334155">env、ps、/proc、inspect</text>
    <text x="764" y="252" font-size="11" fill="#334155">都能读到明文环境变量。</text>

    <rect x="30" y="296" width="220" height="92" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="44" y="321" font-size="12.5" font-weight="bold" fill="#991b1b">⑤ 日志与监控</text>
    <text x="44" y="344" font-size="11" fill="#334155">请求体、异常、trace 标签</text>
    <text x="44" y="362" font-size="11" fill="#334155">可能顺手带走凭证。</text>

    <rect x="270" y="296" width="220" height="92" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="284" y="321" font-size="12.5" font-weight="bold" fill="#991b1b">⑥ 备份与工单</text>
    <text x="284" y="344" font-size="11" fill="#334155">备份文件、支持包、截图、</text>
    <text x="284" y="362" font-size="11" fill="#334155">聊天记录都可能带明文。</text>

    <rect x="510" y="296" width="220" height="92" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="524" y="321" font-size="12.5" font-weight="bold" fill="#991b1b">⑦ 配置中心</text>
    <text x="524" y="344" font-size="11" fill="#334155">明文配置 + 过宽读权限，</text>
    <text x="524" y="362" font-size="11" fill="#334155">等于凭证随配置扩散。</text>

    <rect x="750" y="296" width="220" height="92" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="764" y="321" font-size="12.5" font-weight="bold" fill="#991b1b">⑧ 客户端包</text>
    <text x="764" y="344" font-size="11" fill="#334155">前端 bundle、App 反编译，</text>
    <text x="764" y="362" font-size="11" fill="#334155">任何打进客户端的值都不算密。</text>
  </g>

  <g>
    <rect x="30" y="410" width="460" height="130" rx="10" fill="#eff6ff" stroke="#2563eb"/>
    <text x="46" y="437" font-size="13" font-weight="bold" fill="#1e3a8a">最短止损顺序</text>
    <text x="46" y="462" font-size="11.5" fill="#334155">① 先轮换 / 吊销，别先删日志 —— 证据要留。</text>
    <text x="46" y="484" font-size="11.5" fill="#334155">② 查 access log，确定这把凭证被谁用过。</text>
    <text x="46" y="506" font-size="11.5" fill="#334155">③ 再清理仓库历史、镜像与共享文件。</text>
    <text x="46" y="528" font-size="11.5" fill="#334155">④ 补检测：pre-commit + CI 扫描 + 日志脱敏。</text>

    <rect x="510" y="410" width="460" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="526" y="437" font-size="13" font-weight="bold" fill="#166534">判断「泄漏」还是「丢失」</text>
    <text x="526" y="462" font-size="11.5" fill="#334155">泄漏：还能解密，但要假设攻击者已经拿到。</text>
    <text x="526" y="484" font-size="11.5" fill="#334155">丢失：没有备份就永远解不开，先查托管与托管删除期。</text>
    <text x="526" y="506" font-size="11.5" fill="#334155">两者的动作不同：一个换钥，一个恢复 / 接受损失。</text>
    <text x="526" y="528" font-size="11.5" fill="#334155">销毁密钥前，必须确认没有密文还引用该版本。</text>
  </g>
</svg>
