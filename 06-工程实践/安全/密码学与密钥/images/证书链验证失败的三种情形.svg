<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">证书链验证失败：先按报错关键字分诊</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">三类根因对应完全不同的修法 —— 分不清就会去续期一张根本没问题的证书</text>
  <defs>
    <marker id="k2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="340" y="84" width="320" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="500" y="112" font-size="11.5" fill="#92400e" text-anchor="middle" font-weight="bold">浏览器 / curl 报证书错误</text>
  <line x1="500" y1="132" x2="185" y2="158" stroke="#dc2626" stroke-width="1.3" marker-end="url(#k2)"/>
  <rect x="40" y="160" width="290" height="62" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="54" y="184" font-size="11.5" fill="#991b1b" text-anchor="start" font-weight="bold">error 20</text>
  <text x="54" y="206" font-size="9.5" fill="#334155" text-anchor="start">unable to get local issuer certificate</text>
  <line x1="500" y1="132" x2="495" y2="158" stroke="#dc2626" stroke-width="1.3" marker-end="url(#k2)"/>
  <rect x="350" y="160" width="290" height="62" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="364" y="184" font-size="11.5" fill="#991b1b" text-anchor="start" font-weight="bold">No extensions</text>
  <text x="364" y="206" font-size="9.5" fill="#334155" text-anchor="start">证书里没有 SAN，只有 CN</text>
  <line x1="500" y1="132" x2="805" y2="158" stroke="#dc2626" stroke-width="1.3" marker-end="url(#k2)"/>
  <rect x="660" y="160" width="290" height="62" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="674" y="184" font-size="11.5" fill="#991b1b" text-anchor="start" font-weight="bold">其余报错</text>
  <text x="674" y="206" font-size="9.5" fill="#334155" text-anchor="start">过期 / 域名不匹配 / 自签 / 已吊销</text>
  <rect x="40" y="240" width="290" height="150" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="56" y="264" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="bold">「找不到签发者」的两种场景</text>
  <text x="56" y="288" font-size="10" fill="#334155" text-anchor="start">① 自签证书没导入信任库</text>
  <text x="56" y="308" font-size="9.5" fill="#64748B" text-anchor="start">　　开发环境常见</text>
  <text x="56" y="332" font-size="10" fill="#b91c1c" text-anchor="start">② 服务端没下发中间证书</text>
  <text x="56" y="352" font-size="9.5" fill="#64748B" text-anchor="start">　　生产最常见的配置错误</text>
  <text x="56" y="376" font-size="9.5" fill="#166534" text-anchor="start">修法：配置 fullchain 而不是单张站点证书</text>
  <rect x="350" y="240" width="290" height="150" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="366" y="264" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="bold">「只有 CN」为什么不行</text>
  <text x="366" y="288" font-size="10" fill="#334155" text-anchor="start">RFC 6125 与主流实现均已废弃 CN 校验</text>
  <text x="366" y="312" font-size="10" fill="#334155" text-anchor="start">现代浏览器 / curl 只认 SAN</text>
  <text x="366" y="340" font-size="9.5" fill="#b91c1c" text-anchor="start">表现：明明是自己的域名却报主机名不匹配</text>
  <text x="366" y="364" font-size="9.5" fill="#166534" text-anchor="start">修法：重新签发，把全部域名与 IP 加进 SAN</text>
  <rect x="660" y="240" width="300" height="150" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="676" y="264" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="bold">其余四类的处理</text>
  <text x="676" y="290" font-size="9" fill="#991b1b" text-anchor="start">certificate has expired</text>
  <text x="676" y="302" font-size="8.5" fill="#64748B" text-anchor="start">立即续期，并查自动续期为何失败</text>
  <text x="676" y="314" font-size="9" fill="#991b1b" text-anchor="start">hostname mismatch</text>
  <text x="676" y="326" font-size="8.5" fill="#64748B" text-anchor="start">重签，补全 SAN</text>
  <text x="676" y="338" font-size="9" fill="#991b1b" text-anchor="start">self signed certificate</text>
  <text x="676" y="350" font-size="8.5" fill="#64748B" text-anchor="start">开发导入信任库，生产换受信 CA</text>
  <text x="676" y="362" font-size="9" fill="#991b1b" text-anchor="start">certificate revoked</text>
  <text x="676" y="374" font-size="8.5" fill="#64748B" text-anchor="start">换证，查私钥是否泄露</text>
  <text x="44" y="424" font-size="12" fill="#1e3a8a" text-anchor="start" font-weight="bold">分诊顺序：先看 openssl verify 退出码与 error 编号，再看 SAN 有没有，最后才查有效期与吊销状态</text>
  <rect x="40" y="442" width="920" height="152" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="468" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">本机实测的两条命令与原始输出</text>
  <text x="60" y="494" font-size="10" fill="#1e3a8a" text-anchor="start">openssl verify -CAfile other.crt server.crt</text>
  <text x="60" y="514" font-size="10" fill="#991b1b" text-anchor="start">→ error 20 at 0 depth lookup: unable to get local issuer certificate（退出码 2）</text>
  <text x="60" y="540" font-size="10" fill="#1e3a8a" text-anchor="start">openssl x509 -in old.crt -noout -ext subjectAltName</text>
  <text x="60" y="560" font-size="10" fill="#991b1b" text-anchor="start">→ No extensions in certificate</text>
  <text x="60" y="584" font-size="9.5" fill="#64748B" text-anchor="start">两条输出直接对应上面第一、第二个分支，不需要再猜</text>
</svg>
