<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">四种攻击方式分两组：进入系统前 与 库已泄露后</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">这个分界决定了防御手段完全不同 —— 加盐对在线暴力破解毫无作用，因为攻击者是在猜明文而不是在查表</text>
  <defs>
    <marker id="k3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="40" y="84" width="450" height="54" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="265" y="106" font-size="11.5" fill="#92400e" text-anchor="middle" font-weight="bold">组一：进入系统前（在线）</text>
  <text x="265" y="126" font-size="9.5" fill="#64748B" text-anchor="middle">不知道加密方法，通过认证接口反复尝试</text>
  <rect x="510" y="84" width="450" height="54" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="735" y="106" font-size="11.5" fill="#991b1b" text-anchor="middle" font-weight="bold">组二：库已泄露后（离线）</text>
  <text x="735" y="126" font-size="9.5" fill="#64748B" text-anchor="middle">已知密码的 hash 值，用自己的工具慢慢查</text>
  <rect x="40" y="150" width="450" height="48" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1.1"/>
  <text x="56" y="170" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="bold">猜密码</text>
  <text x="56" y="190" font-size="9.5" fill="#64748B" text-anchor="start">靠猜 123456、admin123、手机号后几位</text>
  <rect x="40" y="206" width="450" height="48" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1.1"/>
  <text x="56" y="226" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="bold">字典攻击</text>
  <text x="56" y="246" font-size="9.5" fill="#64748B" text-anchor="start">准备常用密码表，遍历比较哈希</text>
  <rect x="40" y="262" width="450" height="48" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1.1"/>
  <text x="56" y="282" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="bold">暴力破解</text>
  <text x="56" y="302" font-size="9.5" fill="#64748B" text-anchor="start">逐个推算直到命中，理论上只是时间问题</text>
  <rect x="510" y="150" width="450" height="104" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="526" y="174" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="bold">彩虹表攻击</text>
  <text x="526" y="196" font-size="9.5" fill="#334155" text-anchor="start">前提是「已知密码的 hash」—— 库已经泄露了</text>
  <text x="526" y="216" font-size="9.5" fill="#64748B" text-anchor="start">用预先算好的明文到哈希大表反查（主流表 100G 以上）</text>
  <text x="526" y="238" font-size="9.5" fill="#64748B" text-anchor="start">本质是空间换时间：算得少、存得多</text>
  <text x="44" y="330" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">两组的防御手段完全不同</text>
  <rect x="40" y="346" width="450" height="92" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="56" y="370" font-size="11" fill="#166534" text-anchor="start" font-weight="bold">防组一：在「认证接口」这一层</text>
  <text x="56" y="394" font-size="10" fill="#334155" text-anchor="start">登录失败锁定、验证码、限流、密码复杂度要求</text>
  <text x="56" y="418" font-size="10" fill="#b91c1c" text-anchor="start">⚠ 加盐对这一组没有任何作用</text>
  <rect x="510" y="346" width="450" height="92" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="526" y="370" font-size="11" fill="#166534" text-anchor="start" font-weight="bold">防组二：只剩「存储本身的强度」</text>
  <text x="526" y="394" font-size="10" fill="#334155" text-anchor="start">加盐 + 慢哈希（bcrypt / scrypt / Argon2）</text>
  <text x="526" y="418" font-size="10" fill="#64748B" text-anchor="start">此时网络层的防护全部失效</text>
  <rect x="40" y="460" width="920" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="58" y="486" font-size="11.5" fill="#991b1b" text-anchor="start" font-weight="bold">最容易答错的地方：一说「防暴力破解」就答「加盐」</text>
  <text x="58" y="508" font-size="10.5" fill="#334155" text-anchor="start">在线暴力破解的攻击者在猜明文，不是在查表 —— 盐不参与比对过程，加不加盐都拦不住他</text>
  <text x="44" y="556" font-size="10.5" fill="#64748B" text-anchor="start">彩虹表的定位：比「每次尝试重新算哈希」省时间、比「对每条输入都查表」省空间，是两者之间的折中；而慢哈希把单次计算成本抬高，正好打掉它的成本优势</text>
</svg>
