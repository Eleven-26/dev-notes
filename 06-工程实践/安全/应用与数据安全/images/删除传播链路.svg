<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">删除传播：一条记录不止一处副本</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">主库只是起点；缓存、索引、数仓、对象存储、日志、导出、备份、第三方都要逐站处理</text>

  <g>
    <rect x="380" y="226" width="240" height="140" rx="12" fill="#0f172a"/>
    <text x="500" y="258" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">主库</text>
    <text x="500" y="284" text-anchor="middle" font-size="12" fill="#e2e8f0">标记删除 → 物理清理</text>
    <text x="500" y="308" text-anchor="middle" font-size="12" fill="#e2e8f0">保留墓碑：ID + 时间</text>
    <text x="500" y="332" text-anchor="middle" font-size="12" fill="#e2e8f0">外键 / 审计表一并评估</text>
    <text x="500" y="354" text-anchor="middle" font-size="11" fill="#94a3b8">删除任务的编排中心</text>
  </g>

  <g>
    <rect x="30" y="104" width="220" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="140" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">缓存</text>
    <text x="140" y="152" text-anchor="middle" font-size="11.5" fill="#334155">删 key / TTL 兜底</text>
    <text x="140" y="170" text-anchor="middle" font-size="11" fill="#64748b">键别用明文手机号</text>
  </g>
  <g>
    <rect x="30" y="204" width="220" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="140" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">搜索索引</text>
    <text x="140" y="252" text-anchor="middle" font-size="11.5" fill="#334155">按文档 ID 删除并刷新</text>
    <text x="140" y="270" text-anchor="middle" font-size="11" fill="#64748b">注意别名与快照</text>
  </g>
  <g>
    <rect x="30" y="304" width="220" height="76" rx="8" fill="#fefce8" stroke="#ca8a04"/>
    <text x="140" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">数据仓库</text>
    <text x="140" y="352" text-anchor="middle" font-size="11.5" fill="#334155">分区重写 / 行级删除</text>
    <text x="140" y="370" text-anchor="middle" font-size="11" fill="#64748b">衍生表与历史分区</text>
  </g>
  <g>
    <rect x="30" y="404" width="220" height="76" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="140" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">导出文件</text>
    <text x="140" y="452" text-anchor="middle" font-size="11.5" fill="#334155">失效链接 / 回收文件</text>
    <text x="140" y="470" text-anchor="middle" font-size="11" fill="#64748b">水印便于追溯</text>
  </g>

  <g>
    <rect x="750" y="104" width="220" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="860" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">对象存储</text>
    <text x="860" y="152" text-anchor="middle" font-size="11.5" fill="#334155">删除对象与所有版本</text>
    <text x="860" y="170" text-anchor="middle" font-size="11" fill="#64748b">回收站 / CDN 缓存</text>
  </g>
  <g>
    <rect x="750" y="204" width="220" height="76" rx="8" fill="#fefce8" stroke="#ca8a04"/>
    <text x="860" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">日志 / APM</text>
    <text x="860" y="252" text-anchor="middle" font-size="11.5" fill="#334155">按保留期滚动删除</text>
    <text x="860" y="270" text-anchor="middle" font-size="11" fill="#64748b">已进 SIEM 的单独处理</text>
  </g>
  <g>
    <rect x="750" y="304" width="220" height="76" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="860" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">备份</text>
    <text x="860" y="352" text-anchor="middle" font-size="11.5" fill="#334155">保留窗口到期销毁</text>
    <text x="860" y="370" text-anchor="middle" font-size="11" fill="#64748b">或 crypto-shredding</text>
  </g>
  <g>
    <rect x="750" y="404" width="220" height="76" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="860" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">第三方</text>
    <text x="860" y="452" text-anchor="middle" font-size="11.5" fill="#334155">调用删除接口并留回执</text>
    <text x="860" y="470" text-anchor="middle" font-size="11" fill="#64748b">合同与再委托要覆盖</text>
  </g>

  <g stroke="#475569" stroke-width="1.4">
    <line x1="380" y1="270" x2="256" y2="150" marker-end="url(#d)"/>
    <line x1="380" y1="292" x2="256" y2="240" marker-end="url(#d)"/>
    <line x1="380" y1="310" x2="256" y2="336" marker-end="url(#d)"/>
    <line x1="380" y1="338" x2="256" y2="436" marker-end="url(#d)"/>
    <line x1="620" y1="270" x2="744" y2="150" marker-end="url(#d)"/>
    <line x1="620" y1="292" x2="744" y2="240" marker-end="url(#d)"/>
    <line x1="620" y1="310" x2="744" y2="336" marker-end="url(#d)"/>
    <line x1="620" y1="338" x2="744" y2="436" marker-end="url(#d)"/>
  </g>

  <g>
    <rect x="30" y="508" width="940" height="88" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="50" y="534" font-size="13.5" font-weight="bold" fill="#334155">执行顺序与验证</text>
    <text x="50" y="558" font-size="12" fill="#0f172a">阻断入口 → 主库标记 → 副本传播 → 物理清理 → 抽样验证 → 记录审计</text>
    <text x="50" y="582" font-size="11.5" fill="#b91c1c">红色站点是「不能逐条删」的高难点：备份靠保留窗口，第三方靠合同与回执，导出靠链接失效</text>
  </g>
</svg>
