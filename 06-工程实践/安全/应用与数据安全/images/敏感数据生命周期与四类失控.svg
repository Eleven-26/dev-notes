<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">敏感数据生命周期：四个动作最容易失控</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">多收、乱放、乱给、忘删；每一类都要有对应的工程控制，而不是只写在制度里</text>

  <g>
    <rect x="20" y="88" width="145" height="92" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="92" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">收集</text>
    <text x="92" y="136" text-anchor="middle" font-size="11" fill="#334155">目的明确</text>
    <text x="92" y="154" text-anchor="middle" font-size="11" fill="#334155">最小必要</text>
    <text x="92" y="172" text-anchor="middle" font-size="11" fill="#334155">告知 / 同意</text>
  </g>
  <g>
    <rect x="181" y="88" width="145" height="92" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="253" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">传输</text>
    <text x="253" y="136" text-anchor="middle" font-size="11" fill="#334155">TLS</text>
    <text x="253" y="154" text-anchor="middle" font-size="11" fill="#334155">服务身份</text>
    <text x="253" y="172" text-anchor="middle" font-size="11" fill="#334155">最小字段</text>
  </g>
  <g>
    <rect x="342" y="88" width="145" height="92" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="414" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">存储</text>
    <text x="414" y="136" text-anchor="middle" font-size="11" fill="#334155">分级</text>
    <text x="414" y="154" text-anchor="middle" font-size="11" fill="#334155">加密 / 令牌化</text>
    <text x="414" y="172" text-anchor="middle" font-size="11" fill="#334155">访问控制</text>
  </g>
  <g>
    <rect x="503" y="88" width="145" height="92" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="575" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">使用 / 共享</text>
    <text x="575" y="136" text-anchor="middle" font-size="11" fill="#334155">字段级授权</text>
    <text x="575" y="154" text-anchor="middle" font-size="11" fill="#334155">动态脱敏</text>
    <text x="575" y="172" text-anchor="middle" font-size="11" fill="#334155">导出审计</text>
  </g>
  <g>
    <rect x="664" y="88" width="145" height="92" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="736" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">归档</text>
    <text x="736" y="136" text-anchor="middle" font-size="11" fill="#334155">独立账号</text>
    <text x="736" y="154" text-anchor="middle" font-size="11" fill="#334155">只读 + 审计</text>
    <text x="736" y="172" text-anchor="middle" font-size="11" fill="#334155">到期转冷</text>
  </g>
  <g>
    <rect x="825" y="88" width="155" height="92" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="902" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">删除</text>
    <text x="902" y="136" text-anchor="middle" font-size="11" fill="#334155">到期任务</text>
    <text x="902" y="154" text-anchor="middle" font-size="11" fill="#334155">副本传播</text>
    <text x="902" y="172" text-anchor="middle" font-size="11" fill="#334155">可验证审计</text>
  </g>

  <g stroke="#475569" stroke-width="1.5">
    <line x1="165" y1="134" x2="175" y2="134" marker-end="url(#m)"/>
    <line x1="326" y1="134" x2="336" y2="134" marker-end="url(#m)"/>
    <line x1="487" y1="134" x2="497" y2="134" marker-end="url(#m)"/>
    <line x1="648" y1="134" x2="658" y2="134" marker-end="url(#m)"/>
    <line x1="809" y1="134" x2="819" y2="134" marker-end="url(#m)"/>
  </g>

  <g>
    <rect x="20" y="224" width="225" height="150" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="132" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">① 多收</text>
    <text x="38" y="278" font-size="11.5" fill="#334155">表单多要字段、默认勾选</text>
    <text x="38" y="300" font-size="11.5" fill="#334155">SDK 暗采、埋点带明文</text>
    <text x="38" y="322" font-size="11.5" fill="#334155">「以后可能有用」先存着</text>
    <text x="38" y="352" font-size="11.5" fill="#b91c1c">控制：字段清单 + 收集评审</text>
  </g>

  <g>
    <rect x="255" y="224" width="225" height="150" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="367" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">② 乱放</text>
    <text x="273" y="278" font-size="11.5" fill="#334155">生产数据拷进测试库</text>
    <text x="273" y="300" font-size="11.5" fill="#334155">日志 / APM 记录完整 body</text>
    <text x="273" y="322" font-size="11.5" fill="#334155">备份、导出无人认领</text>
    <text x="273" y="352" font-size="11.5" fill="#b91c1c">控制：环境隔离 + 写入端脱敏</text>
  </g>

  <g>
    <rect x="490" y="224" width="225" height="150" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="602" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">③ 乱给</text>
    <text x="508" y="278" font-size="11.5" fill="#334155">客服 / 运维可查全量</text>
    <text x="508" y="300" font-size="11.5" fill="#334155">导出无审批、无水印</text>
    <text x="508" y="322" font-size="11.5" fill="#334155">第三方共享超出必要范围</text>
    <text x="508" y="352" font-size="11.5" fill="#b91c1c">控制：字段级授权 + 导出审计</text>
  </g>

  <g>
    <rect x="725" y="224" width="255" height="150" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="852" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">④ 忘删</text>
    <text x="743" y="278" font-size="11.5" fill="#334155">只删主库，缓存 / 索引 / 数仓还在</text>
    <text x="743" y="300" font-size="11.5" fill="#334155">软删 = 没删；备份永久保留</text>
    <text x="743" y="322" font-size="11.5" fill="#334155">导出文件与第三方副本失联</text>
    <text x="743" y="352" font-size="11.5" fill="#b91c1c">控制：删除矩阵 + 执行报告</text>
  </g>

  <g>
    <rect x="20" y="410" width="960" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="40" y="436" font-size="14" font-weight="bold" fill="#334155">三层控制，分别解决不同问题</text>

    <rect x="40" y="454" width="290" height="86" rx="8" fill="#ffffff" stroke="#2563eb"/>
    <text x="185" y="478" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">字段级数据清单</text>
    <text x="54" y="500" font-size="11.5" fill="#334155">回答「哪里有、谁在用、留多久」</text>
    <text x="54" y="520" font-size="11.5" fill="#334155">是分级、删除、DSAR 的共同底座</text>

    <rect x="350" y="454" width="290" height="86" rx="8" fill="#ffffff" stroke="#16a34a"/>
    <text x="495" y="478" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">字段级权限与脱敏</text>
    <text x="364" y="500" font-size="11.5" fill="#334155">按角色 / 对象 / 场景裁剪</text>
    <text x="364" y="520" font-size="11.5" fill="#334155">展示、日志、导出分别处理</text>

    <rect x="660" y="454" width="300" height="86" rx="8" fill="#ffffff" stroke="#ea580c"/>
    <text x="810" y="478" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a3412">副本级留存与删除</text>
    <text x="674" y="500" font-size="11.5" fill="#334155">按数据地图逐个副本处理</text>
    <text x="674" y="520" font-size="11.5" fill="#334155">备份靠保留窗口 + 密钥销毁收口</text>
  </g>
</svg>
