<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">API 安全的四层边界：同一条请求，四层各回答一个问题</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">认证解决「谁在调用」，授权解决「能不能碰这条数据」，出站校验解决「服务能访问哪里」</text>

  <g>
    <rect x="380" y="74" width="240" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="500" y="96" text-anchor="middle" font-size="13" fill="#334155">调用方：脚本 / SDK / 第三方服务</text>
  </g>

  <g>
    <rect x="20" y="130" width="225" height="330" rx="10" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="20" y="130" width="225" height="52" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="132" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">1. 入口层（网关）</text>
    <text x="132" y="171" text-anchor="middle" font-size="11.5" fill="#1e40af">谁在调用？能调多少？</text>

    <text x="38" y="208" font-size="12.5" fill="#0f172a">· 认证与令牌校验</text>
    <text x="38" y="234" font-size="12.5" fill="#0f172a">· 路由默认拒绝</text>
    <text x="38" y="260" font-size="12.5" fill="#0f172a">· body / 分页 / 并发上限</text>
    <text x="38" y="286" font-size="12.5" fill="#0f172a">· 路由清单与版本下线</text>

    <text x="38" y="330" font-size="11" fill="#64748b">缺口后果：</text>
    <text x="38" y="350" font-size="11.5" fill="#334155">无认证的「内部接口」</text>
    <text x="38" y="370" font-size="11.5" fill="#334155">被脚本无限调用</text>
    <text x="38" y="390" font-size="11.5" fill="#334155">旧版本绕过新限流</text>

    <rect x="38" y="418" width="189" height="26" rx="5" fill="#ffffff" stroke="#2563eb"/>
    <text x="132" y="436" text-anchor="middle" font-size="11" fill="#1e40af">API2 · API4 · API9</text>
  </g>

  <g>
    <rect x="265" y="130" width="225" height="330" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <rect x="265" y="130" width="225" height="52" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="377" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">2. 服务层</text>
    <text x="377" y="171" text-anchor="middle" font-size="11.5" fill="#166534">你能不能动这一条？</text>

    <text x="283" y="208" font-size="12.5" fill="#0f172a">· 功能级鉴权</text>
    <text x="283" y="234" font-size="12.5" fill="#0f172a">· 对象级授权</text>
    <text x="283" y="260" font-size="12.5" fill="#0f172a">· 查询天然带租户 / 归属</text>
    <text x="283" y="286" font-size="12.5" fill="#0f172a">· 敏感业务流风控</text>

    <text x="283" y="330" font-size="11" fill="#64748b">缺口后果：</text>
    <text x="283" y="350" font-size="11.5" fill="#334155">换一个 ID 就能看别人订单</text>
    <text x="283" y="370" font-size="11.5" fill="#334155">普通用户直调管理接口</text>
    <text x="283" y="390" font-size="11.5" fill="#334155">领券 / 下单被脚本刷</text>

    <rect x="283" y="418" width="189" height="26" rx="5" fill="#ffffff" stroke="#16a34a"/>
    <text x="377" y="436" text-anchor="middle" font-size="11" fill="#166534">API1 · API5 · API6</text>
  </g>

  <g>
    <rect x="510" y="130" width="225" height="330" rx="10" fill="#fefce8" stroke="#ca8a04"/>
    <rect x="510" y="130" width="225" height="52" rx="10" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="622" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">3. 数据层</text>
    <text x="622" y="171" text-anchor="middle" font-size="11.5" fill="#854d0e">哪些字段能写、能看？</text>

    <text x="528" y="208" font-size="12.5" fill="#0f172a">· 请求 DTO 白名单</text>
    <text x="528" y="234" font-size="12.5" fill="#0f172a">· 未知字段拒绝 / 丢弃</text>
    <text x="528" y="260" font-size="12.5" fill="#0f172a">· 响应字段裁剪</text>
    <text x="528" y="286" font-size="12.5" fill="#0f172a">· 敏感字段按角色授权</text>

    <text x="528" y="330" font-size="11" fill="#64748b">缺口后果：</text>
    <text x="528" y="350" font-size="11.5" fill="#334155">请求塞 role / balance</text>
    <text x="528" y="370" font-size="11.5" fill="#334155">响应带出 hash / 手机号</text>
    <text x="528" y="390" font-size="11.5" fill="#334155">同一接口人人看全字段</text>

    <rect x="528" y="418" width="189" height="26" rx="5" fill="#ffffff" stroke="#ca8a04"/>
    <text x="622" y="436" text-anchor="middle" font-size="11" fill="#854d0e">API3</text>
  </g>

  <g>
    <rect x="755" y="130" width="225" height="330" rx="10" fill="#fff7ed" stroke="#ea580c"/>
    <rect x="755" y="130" width="225" height="52" rx="10" fill="#ffedd5" stroke="#ea580c"/>
    <text x="867" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">4. 出站层</text>
    <text x="867" y="171" text-anchor="middle" font-size="11.5" fill="#9a3412">服务能访问哪个地址？</text>

    <text x="773" y="208" font-size="12.5" fill="#0f172a">· 协议白名单</text>
    <text x="773" y="234" font-size="12.5" fill="#0f172a">· 全部解析结果检查</text>
    <text x="773" y="260" font-size="12.5" fill="#0f172a">· 固定 IP 拨号</text>
    <text x="773" y="286" font-size="12.5" fill="#0f172a">· 跳转逐跳复检</text>

    <text x="773" y="330" font-size="11" fill="#64748b">缺口后果：</text>
    <text x="773" y="350" font-size="11.5" fill="#334155">读取云元数据凭证</text>
    <text x="773" y="370" font-size="11.5" fill="#334155">打内网 Redis / ES</text>
    <text x="773" y="390" font-size="11.5" fill="#334155">file / gopher 读文件</text>

    <rect x="773" y="418" width="189" height="26" rx="5" fill="#ffffff" stroke="#ea580c"/>
    <text x="867" y="436" text-anchor="middle" font-size="11" fill="#9a3412">API7 · API10</text>
  </g>

  <g stroke="#475569" stroke-width="1.5">
    <line x1="245" y1="295" x2="259" y2="295" marker-end="url(#arw)"/>
    <line x1="490" y1="295" x2="504" y2="295" marker-end="url(#arw)"/>
    <line x1="735" y1="295" x2="749" y2="295" marker-end="url(#arw)"/>
  </g>

  <text x="500" y="505" text-anchor="middle" font-size="13" fill="#0f172a">请求从左往右穿过四层；攻击者则在任意一层寻找「检查缺口」把影响范围放大</text>
  <text x="500" y="532" text-anchor="middle" font-size="12" fill="#64748b">API1 对象越权 · API2 认证 · API3 字段越权 · API4 资源消耗 · API5 功能越权</text>
  <text x="500" y="554" text-anchor="middle" font-size="12" fill="#64748b">API6 业务流 · API7 SSRF · API8 配置 · API9 清单 · API10 第三方响应</text>
  <text x="500" y="580" text-anchor="middle" font-size="11.5" fill="#94a3b8">清单是 OWASP API Security Top 10（2023 版）的十类风险，映射到本项目的分层只是工程归类</text>
</svg>
