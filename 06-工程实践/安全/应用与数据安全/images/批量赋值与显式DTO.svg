<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">批量赋值与过度暴露：同一个实体，两个方向都漏</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">请求方向多收了字段，响应方向多给了字段；根因都是「实体即契约」</text>

  <g>
    <rect x="30" y="92" width="280" height="210" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="50" y="118" font-size="14" font-weight="bold" fill="#334155">攻击者提交的 JSON</text>
    <text x="50" y="146" font-size="12.5" fill="#0f172a">{</text>
    <text x="66" y="170" font-size="12.5" fill="#0f172a">"name": "bob",</text>
    <text x="66" y="194" font-size="12.5" fill="#b91c1c">"role": "admin",</text>
    <text x="66" y="218" font-size="12.5" fill="#b91c1c">"balance": 999999,</text>
    <text x="66" y="242" font-size="12.5" fill="#b91c1c">"tenant_id": "t-other"</text>
    <text x="50" y="266" font-size="12.5" fill="#0f172a">}</text>
    <text x="50" y="290" font-size="11.5" fill="#b91c1c">红色字段都不在「修改资料」的授权范围内</text>
  </g>

  <g>
    <rect x="370" y="92" width="280" height="210" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="390" y="118" font-size="14" font-weight="bold" fill="#991b1b">路径 A：直接解到 User 实体</text>
    <text x="390" y="146" font-size="12.5" fill="#0f172a">type User struct { ID, Name,</text>
    <text x="406" y="170" font-size="12.5" fill="#0f172a">Role, Balance, Tenant }</text>
    <text x="390" y="198" font-size="12.5" fill="#334155">json.Unmarshal(body, &amp;u)</text>
    <text x="390" y="224" font-size="12.5" fill="#0f172a">db.Save(&amp;u)</text>
    <text x="390" y="256" font-size="12.5" font-weight="bold" fill="#b91c1c">role=admin</text>
    <text x="390" y="278" font-size="12.5" font-weight="bold" fill="#b91c1c">balance=999999 · tenant=t-other</text>
  </g>

  <g>
    <rect x="370" y="340" width="280" height="170" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="390" y="366" font-size="14" font-weight="bold" fill="#166534">路径 B：显式 ProfileUpdate DTO</text>
    <text x="390" y="394" font-size="12.5" fill="#0f172a">type ProfileUpdate struct {</text>
    <text x="406" y="418" font-size="12.5" fill="#0f172a">Name string `json:"name"`</text>
    <text x="390" y="442" font-size="12.5" fill="#0f172a">}</text>
    <text x="390" y="470" font-size="12.5" fill="#166534">name=bob；其余字段被拒绝或丢弃</text>
    <text x="390" y="492" font-size="11.5" fill="#64748b">DisallowUnknownFields：遇到 role 直接报错</text>
  </g>

  <g>
    <rect x="710" y="92" width="260" height="210" rx="10" fill="#fff1f2" stroke="#dc2626"/>
    <text x="730" y="118" font-size="14" font-weight="bold" fill="#991b1b">结果：一次请求三重越权</text>
    <text x="730" y="150" font-size="12.5" fill="#b91c1c">① 提权：role → admin</text>
    <text x="730" y="178" font-size="12.5" fill="#b91c1c">② 改余额：balance → 999999</text>
    <text x="730" y="206" font-size="12.5" fill="#b91c1c">③ 横跨租户：tenant_id 被换</text>
    <text x="730" y="244" font-size="11.5" fill="#334155">响应方向同理：直接序列化实体，</text>
    <text x="730" y="264" font-size="11.5" fill="#334155">会把 hash、手机号、内部状态带出</text>
  </g>

  <g>
    <rect x="710" y="340" width="260" height="170" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="730" y="366" font-size="14" font-weight="bold" fill="#166534">结果：字段边界成立</text>
    <text x="730" y="398" font-size="12.5" fill="#166534">请求：只允许 name</text>
    <text x="730" y="426" font-size="12.5" fill="#166534">响应：只返回约定字段</text>
    <text x="730" y="454" font-size="12.5" fill="#166534">敏感字段：按角色裁剪</text>
    <text x="730" y="482" font-size="11.5" fill="#64748b">契约由 DTO 定义，不由数据库表定义</text>
  </g>

  <g stroke="#475569" stroke-width="1.5">
    <line x1="310" y1="180" x2="364" y2="180" marker-end="url(#a)"/>
    <line x1="310" y1="230" x2="330" y2="230" stroke-dasharray="5 4"/>
    <line x1="330" y1="230" x2="330" y2="425" stroke-dasharray="5 4"/>
    <line x1="330" y1="425" x2="364" y2="425" marker-end="url(#a)"/>
    <line x1="650" y1="180" x2="704" y2="180" marker-end="url(#a)"/>
    <line x1="650" y1="425" x2="704" y2="425" marker-end="url(#a)"/>
  </g>

  <text x="500" y="548" text-anchor="middle" font-size="12" fill="#64748b">请求 DTO 与响应 DTO 都独立定义；实体只负责持久化，不直接面向外部契约</text>
</svg>
