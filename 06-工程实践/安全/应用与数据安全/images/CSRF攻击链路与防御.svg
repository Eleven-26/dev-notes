<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="wc1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="wc2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">CSRF：借用户的身份发一个「合法」请求</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">利用的是「站点对用户浏览器的信任」—— 只要请求带上 Cookie，服务端就认它是本人</text>

  <rect x="80" y="84" width="180" height="46" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="170" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">用户浏览器</text>
  <rect x="410" y="84" width="180" height="46" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="500" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">目标站点</text>
  <rect x="740" y="84" width="180" height="46" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="830" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">攻击者站点</text>

  <line x1="170" y1="130" x2="170" y2="430" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="500" y1="130" x2="500" y2="430" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="830" y1="130" x2="830" y2="430" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>

  <line x1="172" y1="168" x2="496" y2="168" stroke="#334155" stroke-width="1.6" marker-end="url(#wc1)"/>
  <text x="335" y="160" text-anchor="middle" font-size="11.5" fill="#0f172a">① 登录成功，浏览器持有会话 Cookie</text>

  <line x1="172" y1="226" x2="826" y2="226" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#wc2)"/>
  <text x="500" y="218" text-anchor="middle" font-size="11.5" fill="#b91c1c">② 用户访问被诱导的攻击者页面</text>

  <line x1="828" y1="284" x2="174" y2="284" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#wc2)"/>
  <text x="500" y="276" text-anchor="middle" font-size="11.5" fill="#b91c1c">③ 攻击者返回自动发起请求的表单 / &lt;img&gt;</text>

  <line x1="172" y1="342" x2="496" y2="342" stroke="#334155" stroke-width="1.6" marker-end="url(#wc1)"/>
  <text x="335" y="334" text-anchor="middle" font-size="11.5" fill="#0f172a">④ 请求自动带上会话 Cookie（跨站也带）</text>

  <line x1="498" y1="400" x2="174" y2="400" stroke="#334155" stroke-width="1.6" marker-end="url(#wc1)"/>
  <text x="335" y="392" text-anchor="middle" font-size="11.5" fill="#b91c1c">⑤ 视为本人操作 → 转账 / 发帖得逞</text>

  <rect x="20" y="450" width="960" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="480" font-size="14" font-weight="bold" fill="#0f172a">三种防护（优先用 SameSite Cookie）</text>
  <text x="36" y="510" font-size="12.5" fill="#14532d">⭐ SameSite=Lax / Strict（首选）：跨站请求根本不会带上 Cookie → 步骤 ④ 直接失败，CSRF 的立足点被抽掉。</text>
  <text x="36" y="536" font-size="12.5" fill="#334155">表单 Token：页面里放一个随机 Token，伪造请求拿不到该值（⚠️ 要存服务端或 HMAC 签名，且不能放 Cookie）。</text>
  <text x="36" y="562" font-size="12.5" fill="#334155">Referer 校验：检查来源域是否合法；⚠️ 该字段可以为空或手动修改，只能提高攻击成本，无法完全防护。</text>
  <text x="36" y="592" font-size="12.5" fill="#b91c1c">⚠️ 与 XSS 的区别：CSRF 借 Cookie 自动携带来「冒用身份」；XSS 是在页面里「执行脚本」。防御手段完全不同。</text>
  <text x="36" y="618" font-size="12.5" fill="#b91c1c">   所以 CSRF 用 SameSite + Token，XSS 用输出转义 + CSP。</text>
</svg>
