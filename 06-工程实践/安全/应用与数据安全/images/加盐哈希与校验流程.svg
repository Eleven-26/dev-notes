<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="pa1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="pa2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">加盐哈希：注册与登录的同一条管线</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">每个人一个盐：同一口令两次注册得到不同密文；盐与密文一起明文存储</text>

  <text x="40" y="92" font-size="13" font-weight="bold" fill="#1e3a8a">注册 / 改密</text>
  <rect x="40" y="104" width="200" height="64" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="140" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">口令 pwd</text>
  <text x="140" y="154" text-anchor="middle" font-size="11" fill="#1e3a8a">用户明文输入</text>
  <rect x="280" y="104" width="200" height="64" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="380" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">生成随机盐</text>
  <text x="380" y="154" text-anchor="middle" font-size="11" fill="#7c2d12">16 字节，CSPRNG</text>
  <rect x="520" y="104" width="200" height="64" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="620" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">hash(pwd + salt)</text>
  <text x="620" y="154" text-anchor="middle" font-size="11" fill="#1e3a8a">慢哈希 + 工作因子</text>
  <rect x="760" y="104" width="200" height="64" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="860" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">存「盐 + 摘要」</text>
  <text x="860" y="154" text-anchor="middle" font-size="11" fill="#14532d">盐明文、摘要入库</text>
  <line x1="240" y1="136" x2="280" y2="136" stroke="#334155" stroke-width="1.6" marker-end="url(#pa1)"/>
  <line x1="480" y1="136" x2="520" y2="136" stroke="#334155" stroke-width="1.6" marker-end="url(#pa1)"/>
  <line x1="720" y1="136" x2="760" y2="136" stroke="#334155" stroke-width="1.6" marker-end="url(#pa1)"/>

  <text x="40" y="214" font-size="13" font-weight="bold" fill="#14532d">登录校验</text>
  <rect x="40" y="226" width="200" height="64" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="140" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">输入 pwd</text>
  <text x="140" y="276" text-anchor="middle" font-size="11" fill="#1e3a8a">用户提交</text>
  <rect x="280" y="226" width="200" height="64" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="380" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">取出该用户的盐</text>
  <text x="380" y="276" text-anchor="middle" font-size="11" fill="#7c2d12">从库里读回</text>
  <rect x="520" y="226" width="200" height="64" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="620" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">hash(pwd + salt)</text>
  <text x="620" y="276" text-anchor="middle" font-size="11" fill="#1e3a8a">按同样参数重算</text>
  <rect x="760" y="226" width="200" height="64" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="860" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">常量时间比较</text>
  <text x="860" y="276" text-anchor="middle" font-size="11" fill="#14532d">MessageDigest.isEqual</text>
  <line x1="240" y1="258" x2="280" y2="258" stroke="#334155" stroke-width="1.6" marker-end="url(#pa1)"/>
  <line x1="480" y1="258" x2="520" y2="258" stroke="#334155" stroke-width="1.6" marker-end="url(#pa1)"/>
  <line x1="720" y1="258" x2="760" y2="258" stroke="#334155" stroke-width="1.6" marker-end="url(#pa1)"/>

  <polyline points="860,168 860,196 380,196 380,226" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="380" y1="196" x2="380" y2="224" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pa2)"/>
  <text x="620" y="190" text-anchor="middle" font-size="11" fill="#64748b">盐明文存库，登录时取回</text>

  <rect x="20" y="312" width="960" height="328" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="342" font-size="14" font-weight="bold" fill="#0f172a">加盐为什么能挡住彩虹表</text>
  <text x="36" y="374" font-size="12.5" fill="#334155">• 每个用户的盐唯一 → 即使两个用户密码相同，最终密文也不同。</text>
  <text x="36" y="402" font-size="12.5" fill="#334155">• 彩虹表命中的前提是「明文 → 摘要」映射全局唯一；加盐后攻击者必须为每一个盐重新建表</text>
  <text x="36" y="426" font-size="12.5" fill="#334155">  （工作量 ≈ 用户数 × 单表成本），彩虹表直接失去意义。</text>
  <text x="36" y="456" font-size="12.5" fill="#14532d">• 实测：不加盐 5 / 5 命中（100%）；加盐 0 / 5 命中（0%）。</text>
  <text x="36" y="488" font-size="12.5" fill="#b91c1c">⚠️ 加盐防的是彩虹表（离线、已知 hash）；对在线暴力破解毫无作用 —— 那靠失败锁定、验证码、限流。</text>
  <text x="36" y="516" font-size="12.5" fill="#b91c1c">⚠️ 盐不需要保密，但必须唯一；随机源必须是 CSPRNG（crypto/rand、SecureRandom、random_bytes）。</text>
  <text x="36" y="544" font-size="12.5" fill="#b91c1c">⚠️ 全站共用同一个盐等于没加盐 —— 彩虹表只需为这一个盐重建一次即可。</text>
  <text x="36" y="576" font-size="12.5" fill="#0f172a">⭐ 加盐只解决「彩虹表」；「太快」还要靠慢哈希：bcrypt / scrypt / Argon2 + 工作因子。</text>
  <text x="36" y="604" font-size="12.5" fill="#334155">   慢哈希把「算一次很慢」变成设计目标，让攻击从秒级变成天级，而用户登录只多等几十毫秒。</text>
</svg>
