<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ca1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">CSR → CA 签发 → 证书链：一条完整的签发流程</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">这套命令不依赖网络，可在本机完整跑通（OpenSSL 实测）</text>

  <rect x="70" y="88" width="860" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="90" y="118" font-size="13" font-weight="bold" fill="#1e3a8a">① 生成服务端密钥对（openssl req -newkey rsa:2048）</text>
  <text x="90" y="144" font-size="12" fill="#1e3a8a">得到 server.key（私钥）与对应的公钥</text>

  <rect x="70" y="176" width="860" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="90" y="206" font-size="13" font-weight="bold" fill="#1e3a8a">② 生成 CSR（公钥 + 主体信息，由私钥自签名）</text>
  <text x="90" y="232" font-size="12" fill="#1e3a8a">主体 /C=CN/O=Demo/CN=example.local → server.csr</text>

  <rect x="70" y="264" width="860" height="76" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="90" y="294" font-size="13" font-weight="bold" fill="#7c2d12">③ 交给 CA，用 ca.key 按 san.ext 签发（必须带 SAN）</text>
  <text x="90" y="320" font-size="12" fill="#7c2d12">subjectAltName=DNS:example.local,DNS:*.example.local,IP:127.0.0.1</text>

  <rect x="70" y="352" width="860" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="90" y="382" font-size="13" font-weight="bold" fill="#14532d">④ 得到终端证书 server.crt（issuer = Demo Root CA）</text>
  <text x="90" y="408" font-size="12" fill="#14532d">实测 subject=C=CN, O=Demo, CN=example.local，-days 825</text>

  <rect x="70" y="440" width="860" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="90" y="470" font-size="13" font-weight="bold" fill="#14532d">⑤ 部署时下发 fullchain（终端证书 + 中间证书）</text>
  <text x="90" y="496" font-size="12" fill="#14532d">只下发终端证书，客户端链不完整 → error 20</text>

  <line x1="500" y1="164" x2="500" y2="176" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ca1)"/>
  <line x1="500" y1="252" x2="500" y2="264" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ca1)"/>
  <line x1="500" y1="340" x2="500" y2="352" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ca1)"/>
  <line x1="500" y1="428" x2="500" y2="440" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ca1)"/>

  <rect x="20" y="530" width="960" height="72" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="36" y="558" font-size="12.5" fill="#0f172a">⭐ issuer 就是「谁在担保」：客户端拿到证书后，用 issuer 的公钥去验签；上一级是自签根 CA 时，只要它被导入信任库，整条链就成立。</text>
  <text x="36" y="584" font-size="12.5" fill="#b91c1c">⚠️ 证书必须带 SAN，现代浏览器只认 SAN；CN 已不再用于主机名校验。CA 私钥必须加密存储或放在 HSM / KMS 里。</text>
</svg>
