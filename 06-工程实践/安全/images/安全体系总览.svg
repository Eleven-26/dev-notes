<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwS" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">安全体系总览：四条线从「算法与密钥」走到「流程与响应」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">现存 13 篇正文 · 四组均已落位 · 按「先懂机制、再管身份、再防入口、最后进流程」阅读</text>

  <g font-size="12" fill="#475569">
    <rect x="820" y="70" width="26" height="14" rx="3" fill="#ffffff" stroke="#2563eb"/>
    <text x="854" y="82" font-size="11">正文篇目（均已建立链接）</text>
  </g>

  <g>
    <rect x="20" y="96" width="225" height="404" rx="10" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="20" y="96" width="225" height="66" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="122" y="133" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">1. 密码学与密钥</text>
    <text x="132" y="153" text-anchor="middle" font-size="11.5" fill="#1e40af">算法怎么用、密钥怎么管</text>
    <text x="233" y="112" text-anchor="end" font-size="10.5" fill="#1e40af">4 现存 / 0 规划</text>

    <rect x="36" y="176" width="193" height="38" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="132" y="200" text-anchor="middle" font-size="13" fill="#0f172a">加密算法</text>
    <rect x="36" y="224" width="193" height="38" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="132" y="248" text-anchor="middle" font-size="13" fill="#0f172a">摘要与数字签名</text>
    <rect x="36" y="272" width="193" height="38" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="132" y="296" text-anchor="middle" font-size="13" fill="#0f172a">数字证书与PKI</text>
    <rect x="36" y="336" width="193" height="38" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="132" y="360" text-anchor="middle" font-size="13" fill="#0f172a">密钥与机密管理</text>

    <text x="36" y="412" font-size="11" fill="#334155">主线：对称/非对称/散列</text>
    <text x="36" y="430" font-size="11" fill="#334155">→ 完整性 → 信任链</text>
    <text x="36" y="448" font-size="11" fill="#334155">→ 密钥生命周期</text>
  </g>

  <g>
    <rect x="265" y="96" width="225" height="404" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <rect x="265" y="96" width="225" height="66" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="370" y="133" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">2. 身份与访问</text>
    <text x="375" y="153" text-anchor="middle" font-size="11.5" fill="#166534">你是谁、你能做什么</text>
    <text x="478" y="112" text-anchor="end" font-size="10.5" fill="#166534">3 现存 / 0 规划</text>

    <rect x="281" y="176" width="193" height="38" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="377" y="200" text-anchor="middle" font-size="13" fill="#0f172a">JWT与APIKey鉴权</text>
    <rect x="281" y="238" width="193" height="38" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="377" y="262" text-anchor="middle" font-size="13" fill="#0f172a">OAuth2与OIDC</text>
    <rect x="281" y="292" width="193" height="38" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="377" y="316" text-anchor="middle" font-size="13" fill="#0f172a">授权模型与越权防护</text>

    <text x="281" y="412" font-size="11" fill="#334155">主线：凭证怎么验</text>
    <text x="281" y="430" font-size="11" fill="#334155">→ 委托授权怎么走</text>
    <text x="281" y="448" font-size="11" fill="#334155">→ 对象级权限怎么判</text>
  </g>

  <g>
    <rect x="510" y="96" width="225" height="404" rx="10" fill="#fffbeb" stroke="#b45309"/>
    <rect x="510" y="96" width="225" height="66" rx="10" fill="#fef3c7" stroke="#b45309"/>
    <text x="622" y="133" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">3. 应用与数据安全</text>
    <text x="608" y="153" text-anchor="middle" font-size="11.5" fill="#92400e">入口和数据怎么防</text>
    <text x="723" y="112" text-anchor="end" font-size="10.5" fill="#92400e">4 现存 / 0 规划</text>

    <rect x="526" y="176" width="193" height="38" rx="6" fill="#ffffff" stroke="#b45309"/>
    <text x="622" y="200" text-anchor="middle" font-size="13" fill="#0f172a">Web攻击与防御</text>
    <rect x="526" y="224" width="193" height="38" rx="6" fill="#ffffff" stroke="#b45309"/>
    <text x="622" y="248" text-anchor="middle" font-size="13" fill="#0f172a">密码与敏感信息存储</text>
    <rect x="526" y="282" width="193" height="38" rx="6" fill="#ffffff" stroke="#b45309"/>
    <text x="622" y="306" text-anchor="middle" font-size="13" fill="#0f172a">API安全</text>
    <rect x="526" y="336" width="193" height="38" rx="6" fill="#ffffff" stroke="#b45309"/>
    <text x="622" y="360" text-anchor="middle" font-size="13" fill="#0f172a">敏感数据治理与合规</text>

    <text x="526" y="412" font-size="11" fill="#334155">主线：注入与浏览器攻击</text>
    <text x="526" y="430" font-size="11" fill="#334155">→ API 特有风险</text>
    <text x="526" y="448" font-size="11" fill="#334155">→ 数据分类、脱敏与留存</text>
  </g>

  <g>
    <rect x="755" y="96" width="225" height="404" rx="10" fill="#f5f3ff" stroke="#4f46e5"/>
    <rect x="755" y="96" width="225" height="66" rx="10" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="847" y="133" text-anchor="middle" font-size="15" font-weight="bold" fill="#3730a3">4. 安全工程</text>
    <text x="867" y="153" text-anchor="middle" font-size="11.5" fill="#4338ca">怎么在流程里持续做对</text>
    <text x="968" y="112" text-anchor="end" font-size="10.5" fill="#4338ca">2 现存 / 0 规划</text>

    <rect x="771" y="176" width="193" height="38" rx="6" fill="#ffffff" stroke="#4f46e5"/>
    <text x="867" y="200" text-anchor="middle" font-size="13" fill="#0f172a">安全开发生命周期</text>
    <rect x="771" y="230" width="193" height="38" rx="6" fill="#ffffff" stroke="#4f46e5"/>
    <text x="867" y="254" text-anchor="middle" font-size="13" fill="#0f172a">审计与应急响应</text>

    <text x="771" y="412" font-size="11" fill="#334155">主线：需求与设计阶段</text>
    <text x="771" y="430" font-size="11" fill="#334155">放闸门 → 运行期留审计</text>
    <text x="771" y="448" font-size="11" fill="#334155">→ 出事能收敛与复盘</text>
  </g>

  <g stroke="#475569" stroke-width="1.4">
    <line x1="247" y1="300" x2="261" y2="300" marker-end="url(#arwS)"/>
    <line x1="492" y1="300" x2="506" y2="300" marker-end="url(#arwS)"/>
    <line x1="737" y1="300" x2="751" y2="300" marker-end="url(#arwS)"/>
  </g>

  <rect x="20" y="518" width="960" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="540" font-size="11.5" fill="#334155">不在本目录：TLS/HTTPS 握手 → 02 计算机基础/网络 · 容器与 K8s 安全 → 06 工程实践/部署 · 限流与 DDoS → 04 分布式/稳定性 · 网关鉴权代码 → 01 Go 语言</text>
  <text x="36" y="562" font-size="11.5" fill="#334155">阅读主线：密码学与密钥 → 身份与访问 → 应用与数据安全 → 安全工程；安全工程同时反向给前三组提供流程闸门与运行期反馈。</text>

  <text x="500" y="594" text-anchor="middle" font-size="10.5" fill="#94a3b8">2026-10-19 P6 完成：四组共 13 篇正文全部落位，无规划中的篇目</text>
</svg>
