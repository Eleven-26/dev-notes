<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ra1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">RSA 密钥生成只有五步：把四个数论概念拼起来</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">例：p = 61、q = 53 → n = 3233、φ(n) = 3120、e = 17、d = 2753</text>

  <rect x="50" y="84" width="580" height="62" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="70" y="122" font-size="12.5" fill="#1e3a8a">① 选两个大质数 p、q</text>

  <rect x="50" y="160" width="580" height="62" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="70" y="198" font-size="12.5" fill="#1e3a8a">② n = p × q（n 的二进制长度就是「密钥长度」）</text>

  <rect x="50" y="236" width="580" height="62" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="70" y="274" font-size="12.5" fill="#1e3a8a">③ φ(n) = (p − 1)(q − 1)   ← 欧拉函数</text>

  <rect x="50" y="312" width="580" height="62" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="70" y="350" font-size="12.5" fill="#1e3a8a">④ 选整数 e，使 e 与 φ(n) 互质   ← 互质关系</text>

  <rect x="50" y="388" width="580" height="62" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="70" y="426" font-size="12.5" fill="#14532d">⑤ d = e⁻¹ mod φ(n)   ← 模反元素</text>

  <line x1="340" y1="146" x2="340" y2="160" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ra1)"/>
  <line x1="340" y1="222" x2="340" y2="236" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ra1)"/>
  <line x1="340" y1="298" x2="340" y2="312" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ra1)"/>
  <line x1="340" y1="374" x2="340" y2="388" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ra1)"/>

  <rect x="650" y="84" width="330" height="366" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="666" y="114" font-size="13.5" font-weight="bold" fill="#0f172a">安全性来自哪一步</text>
  <text x="666" y="144" font-size="12" fill="#334155">公钥里只有 n，p 与 q 用完就被扔掉。</text>
  <text x="666" y="168" font-size="12" fill="#334155">想知道 d 就得先知道 φ(n)，</text>
  <text x="666" y="192" font-size="12" fill="#334155">而 φ(n) = (p−1)(q−1) 必须先分解 n。</text>
  <text x="666" y="224" font-size="12" fill="#b91c1c">→ RSA 的安全性 = 大整数分解的难度：</text>
  <text x="666" y="248" font-size="12" fill="#b91c1c">  两个大素数相乘十分容易，</text>
  <text x="666" y="272" font-size="12" fill="#b91c1c">  对乘积做因式分解却极其困难。</text>
  <text x="666" y="304" font-size="12" fill="#334155">公钥 = (n, e)，私钥 = (n, d)</text>
  <text x="666" y="328" font-size="12" fill="#334155">加密 c = m^e mod n</text>
  <text x="666" y="352" font-size="12" fill="#334155">解密 m = c^d mod n</text>
  <text x="666" y="384" font-size="12" fill="#334155">解密能还原靠的正是欧拉定理：</text>
  <text x="666" y="408" font-size="11.5" fill="#334155">c^d = m^(e·d) = m^(1 + k·φ(n)) ≡ m (mod n)</text>
  <text x="666" y="434" font-size="12" fill="#334155">公钥指数默认 65537 = 2^16 + 1，只有</text>
  <text x="666" y="454" font-size="12" fill="#334155">两个 1，模幂乘法次数最少。</text>

  <rect x="20" y="470" width="960" height="130" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="36" y="500" font-size="12.5" fill="#0f172a">实测（p = 61、q = 53、e = 17）：n = 3233；φ(n) = 3120；d = 2753（校验 e × d mod φ(n) = 1）。</text>
  <text x="36" y="526" font-size="12.5" fill="#0f172a">明文 m = 65 → 密文 c = m^e mod n = 2790 → 解密 c^d mod n = 65，还原成功。</text>
  <text x="36" y="556" font-size="12.5" fill="#334155">破解进度：被破解的最长 RSA 密钥是 768 个二进制位，所以 1024 位基本安全、2048 位极其安全。</text>
  <text x="36" y="582" font-size="12.5" fill="#b91c1c">⚠️ 「2048 位」说的是二进制位，换算成十进制约 617 位 —— 这是两个容易混的口径。</text>
</svg>
