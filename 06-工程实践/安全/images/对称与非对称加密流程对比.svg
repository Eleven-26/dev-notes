<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ea1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">对称与非对称加密的流程差异</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">对称：加解密同一把密钥，快但密钥分发难；非对称：公钥加密、私钥解密，密钥分发易但慢</text>

  <rect x="20" y="84" width="960" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="114" font-size="14" font-weight="bold" fill="#1e3a8a">对称加密：加解密用同一把密钥</text>
  <rect x="60" y="142" width="170" height="58" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="145" y="177" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">A 方（明文）</text>
  <rect x="310" y="142" width="180" height="58" rx="9" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="400" y="177" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">密文</text>
  <rect x="570" y="142" width="170" height="58" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="655" y="177" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">B 方（明文）</text>
  <rect x="780" y="142" width="180" height="58" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="870" y="166" text-anchor="middle" font-size="11.5" fill="#334155">DES / 3DES / AES</text>
  <text x="870" y="188" text-anchor="middle" font-size="11.5" fill="#334155">AES 密钥 128/192/256 位</text>
  <line x1="230" y1="171" x2="308" y2="171" stroke="#334155" stroke-width="1.6" marker-end="url(#ea1)"/>
  <text x="269" y="163" text-anchor="middle" font-size="11" fill="#334155">① 密钥 K 加密</text>
  <line x1="490" y1="171" x2="568" y2="171" stroke="#334155" stroke-width="1.6" marker-end="url(#ea1)"/>
  <text x="529" y="163" text-anchor="middle" font-size="11" fill="#334155">② 密钥 K 解密</text>
  <text x="40" y="240" font-size="12.5" fill="#b91c1c">⚠️ 前提：A 必须先把密钥 K 安全地告诉 B —— 「保存和传递密钥」是最头疼的问题；对称算法不适合互联网、一般用于内部系统。</text>

  <rect x="20" y="300" width="960" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="330" font-size="14" font-weight="bold" fill="#14532d">非对称加密：公钥加密、私钥解密</text>
  <rect x="60" y="356" width="200" height="72" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="160" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">B 方生成密钥对</text>
  <text x="160" y="410" text-anchor="middle" font-size="11.5" fill="#14532d">公钥公开 / 私钥保密</text>
  <rect x="330" y="356" width="230" height="72" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="445" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">A 方用 B 的公钥加密</text>
  <text x="445" y="410" text-anchor="middle" font-size="11.5" fill="#14532d">公钥加密的信息只有私钥解得开</text>
  <rect x="630" y="356" width="210" height="72" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="735" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">B 方用自己的私钥解密</text>
  <text x="735" y="410" text-anchor="middle" font-size="11.5" fill="#14532d">私钥不泄漏即安全</text>
  <line x1="260" y1="392" x2="328" y2="392" stroke="#334155" stroke-width="1.6" marker-end="url(#ea1)"/>
  <text x="294" y="384" text-anchor="middle" font-size="11" fill="#334155">① 分发公钥</text>
  <line x1="560" y1="392" x2="628" y2="392" stroke="#334155" stroke-width="1.6" marker-end="url(#ea1)"/>
  <text x="594" y="384" text-anchor="middle" font-size="11" fill="#334155">密文</text>
  <text x="40" y="462" font-size="12.5" fill="#334155">密钥容易管理（公钥可公开分发）、安全性高，但比对称慢好几个数量级，适合小数据量加解密或数据签名。</text>
  <text x="40" y="488" font-size="12.5" fill="#334155">RSA 基于大整数分解、DSA 基于整数有限域离散对数、ECC 基于椭圆曲线离散对数（ECDLP）。</text>

  <rect x="20" y="530" width="960" height="100" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="36" y="558" font-size="12.5" fill="#0f172a">⭐ 实际系统两者结合使用：用非对称算法安全地交换对称密钥，再用对称算法加密真正的数据 —— 这正是 SSL / TLS 的做法。</text>
  <text x="36" y="584" font-size="12.5" fill="#0f172a">握手阶段用非对称加密，传输阶段用对称加密。</text>
  <text x="36" y="610" font-size="12.5" fill="#b91c1c">⚠️ 数字签名的密钥用法正好相反：私钥签名、公钥验签（加密才是公钥加密、私钥解密）。</text>
</svg>
