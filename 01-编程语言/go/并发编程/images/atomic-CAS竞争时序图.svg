<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">CAS 循环：两个协程竞争同一切换点</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">for { old := Load(); if CAS(old, old+1) { break } } —— 交换失败就重载重试，绝不丢失更新</text>

  <rect x="70" y="80" width="380" height="40" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="260" y="106" text-anchor="middle" font-size="14" fill="#1e3a8a">协程 A</text>
  <rect x="550" y="80" width="380" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="740" y="106" text-anchor="middle" font-size="14" fill="#14532d">协程 B</text>

  <rect x="420" y="80" width="160" height="40" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="500" y="100" text-anchor="middle" font-size="12" fill="#0f172a">共享值 n = 100</text>
  <text x="500" y="116" text-anchor="middle" font-size="11" fill="#64748b">atomic.Int64</text>

  <rect x="70" y="140" width="380" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="260" y="168" text-anchor="middle" font-size="12.5" fill="#334155">① Load → old=100</text>
  <rect x="550" y="140" width="380" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="740" y="168" text-anchor="middle" font-size="12.5" fill="#334155">① Load → old=100</text>

  <line x1="260" y1="186" x2="260" y2="212" stroke="#334155" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="740" y1="186" x2="740" y2="212" stroke="#334155" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="70" y="214" width="380" height="46" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="260" y="242" text-anchor="middle" font-size="12.5" fill="#854d0e">② CAS(100 → 101)</text>
  <rect x="550" y="214" width="380" height="46" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="740" y="242" text-anchor="middle" font-size="12.5" fill="#854d0e">② CAS(100 → 101)</text>

  <line x1="450" y1="237" x2="548" y2="237" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3"/>

  <rect x="70" y="284" width="380" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="260" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">③ 成功：n=101</text>
  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#14532d">break 退出循环</text>

  <rect x="550" y="284" width="380" height="52" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="740" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">③ 失败：n 已非 100</text>
  <text x="740" y="326" text-anchor="middle" font-size="11" fill="#7f1d1d">A 已抢先改成 101</text>

  <line x1="740" y1="336" x2="740" y2="366" stroke="#334155" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="762" y="344" width="56" height="20" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="790" y="358" text-anchor="middle" font-size="10" fill="#334155">重试</text>

  <rect x="550" y="368" width="380" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="740" y="396" text-anchor="middle" font-size="12.5" fill="#334155">④ 重新 Load → old=101</text>
  <line x1="740" y1="414" x2="740" y2="440" stroke="#334155" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="550" y="442" width="380" height="46" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="740" y="470" text-anchor="middle" font-size="12.5" fill="#14532d">⑤ CAS(101 → 102) 成功</text>

  <rect x="30" y="504" width="940" height="96" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="48" y="530" font-size="12" fill="#0f172a">· 关键：CAS 失败不是异常，而是「有人改过了」的正常信号 —— 必须回到循环顶部重新 Load 最新值再试。</text>
  <text x="48" y="554" font-size="12" fill="#0f172a">· 结果：A、B 各成功 +1 一次，最终 n=102（不是被覆盖的 101）—— 这正是它比裸 a++ 安全的地方。</text>
  <text x="48" y="578" font-size="11.5" fill="#7f1d1d">· ABA 隐患：若中途别人把 n 从 100 改成 101 又改回 100，CAS 会误判「没变」而成功；Go 里靠版本号/单调计数器规避。</text>
</svg>
