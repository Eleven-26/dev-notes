<text x="80" y="330" font-size="13" fill="#7f1d1d">fatal error: all goroutines are asleep - deadlock!</text>
<text x="80" y="352" font-size="13" fill="#334155">goroutine 1 [chan send]:</text>

<text x="60" y="392" font-size="13" fill="#7c2d12">✅ 运行时立即中止，并直接指出「哪个协程卡在哪一行」</text>

<text x="500" y="460" font-size="13" text-anchor="middle" fill="#0f172a">⭐ Go 推荐 channel 最硬的理由：不是性能，而是错误更容易暴露</text>
