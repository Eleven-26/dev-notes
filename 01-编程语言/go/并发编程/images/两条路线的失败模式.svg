<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>

<rect x="30" y="48" width="940" height="180" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="52" y="80" font-size="16" font-weight="700" fill="#7f1d1d">共享内存路线：静默出错</text>

<rect x="60" y="100" width="880" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="80" y="128" font-size="13" fill="#334155">普通运行结果（不报错）: 145745  期望 200000</text>

<text x="60" y="178" font-size="13" fill="#7f1d1d">⚠️ 不 panic、不报错、正常退出（退出码 0）</text>
<text x="60" y="206" font-size="13" fill="#64748b">生产上只表现为「数据慢慢对不上」—— 靠 -race 跑到那条路径才可能抓到</text>

<rect x="30" y="252" width="940" height="180" rx="10" fill="#ffedd5" stroke="#ea580c"/>
<text x="52" y="284" font-size="16" font-weight="700" fill="#7c2d12">CSP 路线：当场响亮地失败</text>

