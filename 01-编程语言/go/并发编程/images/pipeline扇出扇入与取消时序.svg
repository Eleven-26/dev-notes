<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="m1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="mr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">三段式 pipeline 时序：正常消息流 + 取消传播顺序</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">抓取(扇出) → 解析 → 落库(扇入)；任一段失败即触发 errgroup 派生 ctx 取消</text>

  <!-- 生命线标题 -->
  <rect x="60" y="80" width="150" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="135" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">主协程 / errgroup</text>
  <rect x="290" y="80" width="150" height="46" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="365" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">抓取 stage</text>
  <text x="365" y="118" text-anchor="middle" font-size="10.5" fill="#64748b">3 个 worker（扇出）</text>
  <rect x="540" y="80" width="150" height="46" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="615" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">解析 stage</text>
  <text x="615" y="118" text-anchor="middle" font-size="10.5" fill="#64748b">2 个 worker</text>
  <rect x="790" y="80" width="150" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="865" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">落库 stage</text>
  <text x="865" y="118" text-anchor="middle" font-size="10.5" fill="#64748b">2 个 worker（扇入）</text>

  <!-- 生命线竖线 -->
  <line x1="135" y1="126" x2="135" y2="560" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="365" y1="126" x2="365" y2="560" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="615" y1="126" x2="615" y2="560" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="865" y1="126" x2="865" y2="560" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>

  <!-- 正常消息流 -->
  <text x="500" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">① 正常运行：数据从左流到右，各级 select ctx 仍可提前退出</text>
  <line x1="135" y1="172" x2="361" y2="172" stroke="#334155" stroke-width="1.6" marker-end="url(#m1)"/>
  <text x="248" y="164" text-anchor="middle" font-size="11" fill="#0f172a">URL 投进 in</text>
  <line x1="365" y1="202" x2="611" y2="202" stroke="#334155" stroke-width="1.6" marker-end="url(#m1)"/>
  <text x="488" y="194" text-anchor="middle" font-size="11" fill="#0f172a">Raw 写 rawCh</text>
  <line x1="615" y1="232" x2="861" y2="232" stroke="#334155" stroke-width="1.6" marker-end="url(#m1)"/>
  <text x="738" y="224" text-anchor="middle" font-size="11" fill="#0f172a">Parsed 写 parsedCh</text>
  <line x1="865" y1="262" x2="885" y2="262" stroke="#334155" stroke-width="1.6"/>
  <rect x="820" y="252" width="90" height="20" rx="4" fill="#dcfce7"/>
  <text x="865" y="266" text-anchor="middle" font-size="10.5" fill="#14532d">Row 写 rowCh</text>

  <!-- 收口：单点 close -->
  <line x1="135" y1="300" x2="361" y2="300" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#m1)"/>
  <text x="248" y="292" text-anchor="middle" font-size="10.5" fill="#15803d">抓取多 worker 全退 → 协调协程 close(rawCh)</text>

  <!-- 取消传播 -->
  <text x="500" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">② 抓取阶段命中失败点 → errgroup 记录首错并 cancel 派生 ctx</text>
  <rect x="285" y="352" width="160" height="24" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="365" y="368" text-anchor="middle" font-size="11" fill="#7f1d1d">worker 返回 error</text>
  <line x1="365" y1="388" x2="139" y2="388" stroke="#dc2626" stroke-width="1.8" marker-end="url(#mr)"/>
  <text x="252" y="380" text-anchor="middle" font-size="11" fill="#7f1d1d">首错交给 g（errOnce）</text>
  <line x1="135" y1="418" x2="361" y2="418" stroke="#dc2626" stroke-width="1.8" marker-end="url(#mr)"/>
  <text x="248" y="410" text-anchor="middle" font-size="11" fill="#7f1d1d">cancel(ctx) 广播</text>
  <line x1="135" y1="448" x2="611" y2="448" stroke="#dc2626" stroke-width="1.8" marker-end="url(#mr)"/>
  <line x1="135" y1="478" x2="861" y2="478" stroke="#dc2626" stroke-width="1.8" marker-end="url(#mr)"/>
  <text x="600" y="440" text-anchor="middle" font-size="11" fill="#7f1d1d">解析 worker 的 select ctx.Done() 命中 → return</text>
  <text x="600" y="470" text-anchor="middle" font-size="11" fill="#7f1d1d">落库 worker 同理退出 → 不泄漏</text>

  <line x1="135" y1="520" x2="155" y2="520" stroke="#334155" stroke-width="1.6"/>
  <rect x="90" y="510" width="190" height="22" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="185" y="525" text-anchor="middle" font-size="11" fill="#0f172a">g.Wait() 返回首错（本批部分落库）</text>

  <!-- 底部判据 -->
  <rect x="20" y="548" width="960" height="76" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="36" y="572" font-size="12" fill="#0f172a">⭐ 谁 close：多生产者不能各自 close，必须等全部 worker 退出后由一个协调协程单点 close(out)（WaitGroup / errgroup 收口）。</text>
  <text x="36" y="594" font-size="12" fill="#0f172a">⭐ 取消三条件：发送 select ctx.Done()、接收 for-range 感知 close、worker 退出后 wg.Done() —— 缺一即可能泄漏。</text>
  <text x="36" y="614" font-size="12" fill="#7f1d1d">⚠️ 首错只广播不"强杀"：不检查 ctx 的当前一轮任务仍会跑完（实测见正文第二节）。</text>
</svg>
