<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <defs>
    <marker id="e1" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">经典版 entry.p 的状态机（Go 1.9–1.25）</text>
  <text x="40" y="58" font-size="13" fill="#64748b">墓碑不是特殊键，而是 entry.p 取 nil / expunged 两个哨兵值；现行哈希前缀树无此状态机</text>

  <rect x="50" y="140" width="220" height="120" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="160" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">正常：p 指向实值</text>
  <text x="160" y="200" text-anchor="middle" font-size="10.5" fill="#14532d">entry 有效，在 read.m[key]</text>
  <text x="160" y="222" text-anchor="middle" font-size="10.5" fill="#14532d">dirty != nil 时</text>
  <text x="160" y="244" text-anchor="middle" font-size="10.5" fill="#14532d">也在 dirty[key]</text>

  <rect x="370" y="140" width="220" height="120" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">已删除：p == nil</text>
  <text x="480" y="200" text-anchor="middle" font-size="10.5" fill="#334155">键已删；dirty == nil</text>
  <text x="480" y="222" text-anchor="middle" font-size="10.5" fill="#334155">或 dirty[key] 仍</text>
  <text x="480" y="244" text-anchor="middle" font-size="10.5" fill="#334155">指向该 entry</text>

  <rect x="690" y="140" width="220" height="120" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="800" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">墓碑：p == expunged</text>
  <text x="800" y="200" text-anchor="middle" font-size="10.5" fill="#7f1d1d">已删且 dirty != nil</text>
  <text x="800" y="222" text-anchor="middle" font-size="10.5" fill="#7f1d1d">该键不在 dirty 里</text>
  <text x="800" y="244" text-anchor="middle" font-size="10.5" fill="#7f1d1d">要 unexpunge 才能再写</text>

  <line x1="270" y1="185" x2="366" y2="185" stroke="#334155" stroke-width="1.6" marker-end="url(#e1)"/>
  <text x="318" y="176" text-anchor="middle" font-size="11" fill="#0f172a">Delete</text>
  <text x="318" y="204" text-anchor="middle" font-size="9.5" fill="#334155">原子替换为 nil</text>

  <line x1="590" y1="185" x2="686" y2="185" stroke="#334155" stroke-width="1.6" marker-end="url(#e1)"/>
  <text x="638" y="176" text-anchor="middle" font-size="11" fill="#0f172a">重建 dirty</text>
  <text x="638" y="204" text-anchor="middle" font-size="9.5" fill="#334155">nil 换成 expunged</text>

  <path d="M 130,140 C 130,100 200,100 200,140" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#e1)"/>
  <text x="165" y="92" text-anchor="middle" font-size="11" fill="#0f172a">覆盖写 Store：原子换 p，无锁</text>

  <path d="M 800,260 L 800,320 L 160,320 L 160,260" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#e1)"/>
  <text x="480" y="344" text-anchor="middle" font-size="11" fill="#0f172a">Store 命中墓碑键：持 mu 把 entry 复制进 dirty 并 unexpunge，恢复实值</text>

  <text x="40" y="380" font-size="11" fill="#64748b">注：现行版（go1.26）Delete 直接把 children 槽 Store(nil)、空节点置 dead=true——没有 nil/expunged 墓碑，也没有 dirty 重建。</text>
</svg>
