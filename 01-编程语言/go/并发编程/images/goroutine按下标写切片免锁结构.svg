<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="626" viewBox="0 0 1000 626" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="626" fill="#ffffff"/>
  <defs>
    <marker id="arSL" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="arSLR" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">取结果：按下标写切片免锁 vs append 竞争</text>
  <text x="40" y="58" font-size="13" fill="#64748b">results := make([]Result, len(ids)) —— 预分配、长度固定、不用 append</text>

  <rect x="40" y="76" width="920" height="285" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="56" y="96" width="120" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="116" y="116" text-anchor="middle" font-size="11" fill="#1e3a8a">协程 i=0</text>
  <rect x="246" y="96" width="120" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="306" y="116" text-anchor="middle" font-size="11" fill="#1e3a8a">协程 i=1</text>
  <rect x="436" y="96" width="120" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="496" y="116" text-anchor="middle" font-size="11" fill="#1e3a8a">协程 i=2</text>
  <rect x="626" y="96" width="120" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="686" y="116" text-anchor="middle" font-size="11" fill="#1e3a8a">协程 i=3</text>
  <rect x="816" y="96" width="120" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="876" y="116" text-anchor="middle" font-size="11" fill="#1e3a8a">协程 i=4</text>

  <rect x="40" y="162" width="920" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="500" y="190" text-anchor="middle" font-size="11.5" fill="#334155">results[i] = fetchOne(id) —— 协程 i 只写自己那一格；wg.Wait() 返回后统一读</text>

  <rect x="56" y="240" width="868" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="56" y="240" width="173" height="92" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="142" y="270" text-anchor="middle" font-size="11" fill="#14532d">results[0]</text>
  <text x="142" y="292" text-anchor="middle" font-size="10.5" fill="#64748b">fetchOne(id0)</text>
  <rect x="230" y="240" width="173" height="92" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="316" y="270" text-anchor="middle" font-size="11" fill="#14532d">results[1]</text>
  <text x="316" y="292" text-anchor="middle" font-size="10.5" fill="#64748b">fetchOne(id1)</text>
  <rect x="404" y="240" width="173" height="92" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="490" y="270" text-anchor="middle" font-size="11" fill="#14532d">results[2]</text>
  <text x="490" y="292" text-anchor="middle" font-size="10.5" fill="#64748b">fetchOne(id2)</text>
  <rect x="578" y="240" width="173" height="92" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="664" y="270" text-anchor="middle" font-size="11" fill="#14532d">results[3]</text>
  <text x="664" y="292" text-anchor="middle" font-size="10.5" fill="#64748b">fetchOne(id3)</text>
  <rect x="752" y="240" width="172" height="92" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="838" y="270" text-anchor="middle" font-size="11" fill="#14532d">results[4]</text>
  <text x="838" y="292" text-anchor="middle" font-size="10.5" fill="#64748b">fetchOne(id4)</text>

  <line x1="116" y1="126" x2="116" y2="162" stroke="#334155" stroke-width="1.4"/>
  <line x1="306" y1="126" x2="306" y2="162" stroke="#334155" stroke-width="1.4"/>
  <line x1="496" y1="126" x2="496" y2="162" stroke="#334155" stroke-width="1.4"/>
  <line x1="686" y1="126" x2="686" y2="162" stroke="#334155" stroke-width="1.4"/>
  <line x1="876" y1="126" x2="876" y2="162" stroke="#334155" stroke-width="1.4"/>
  <line x1="116" y1="208" x2="116" y2="236" stroke="#334155" stroke-width="1.4" marker-end="url(#arSL)"/>
  <line x1="306" y1="208" x2="306" y2="236" stroke="#334155" stroke-width="1.4" marker-end="url(#arSL)"/>
  <line x1="496" y1="208" x2="496" y2="236" stroke="#334155" stroke-width="1.4" marker-end="url(#arSL)"/>
  <line x1="686" y1="208" x2="686" y2="236" stroke="#334155" stroke-width="1.4" marker-end="url(#arSL)"/>
  <line x1="876" y1="208" x2="876" y2="236" stroke="#334155" stroke-width="1.4" marker-end="url(#arSL)"/>

  <text x="56" y="352" font-size="11.5" fill="#15803d">各写各的下标 —— 没有任何两个协程碰同一个内存位置，天然无竞争，不用加锁。</text>

  <rect x="40" y="374" width="920" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="56" y="392" width="200" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="156" y="412" text-anchor="middle" font-size="11" fill="#1e3a8a">协程 A</text>
  <rect x="306" y="392" width="200" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="406" y="412" text-anchor="middle" font-size="11" fill="#1e3a8a">协程 B</text>
  <rect x="556" y="392" width="200" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="656" y="412" text-anchor="middle" font-size="11" fill="#1e3a8a">协程 C</text>
  <rect x="752" y="450" width="180" height="44" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="842" y="470" text-anchor="middle" font-size="11" fill="#7f1d1d">append 尾部槽</text>
  <text x="842" y="486" text-anchor="middle" font-size="10.5" fill="#7f1d1d">+ len / header</text>
  <line x1="156" y1="422" x2="772" y2="444" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arSLR)"/>
  <line x1="406" y1="422" x2="832" y2="444" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arSLR)"/>
  <line x1="656" y1="422" x2="882" y2="444" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arSLR)"/>
  <text x="300" y="476" font-size="11" fill="#7f1d1d">append(results, r) —— 三个协程的读改写叠在同一位置上</text>

  <text x="40" y="556" font-size="11" fill="#64748b">适用：结果数量已知、要按输入顺序 → 预分配长度、按下标写（各写各的格，天然无竞争）。</text>
  <text x="40" y="578" font-size="11" fill="#64748b">数量不定 / 要先到先处理 → 换 channel 汇总收结果；append 写法同读 len、写同一尾部、又更新 header，那时才需要加锁。</text>
</svg>
