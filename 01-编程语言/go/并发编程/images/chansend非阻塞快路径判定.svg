<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">chansend 的「能立刻成功」四条快路径</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">只有 block == false（select + default）才返回 bool；阻塞模式则挂起或 panic</text>

  <rect x="20" y="96" width="620" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="36" y="120" font-size="12" fill="#14532d">① recvq 非空：有协程在等我发数据</text>
  <text x="36" y="142" font-size="11" fill="#166534">接收队列非空说明缓冲区必然为空 —— 有数据的话接收方早就取走了</text>
  <rect x="660" y="96" width="320" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="820" y="132" text-anchor="middle" font-size="11.5" fill="#14532d">→ 直接把数据交给它：成功</text>

  <rect x="20" y="170" width="620" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="36" y="194" font-size="12" fill="#14532d">② qcount &lt; dataqsiz：缓冲区没满</text>
  <text x="36" y="216" font-size="11" fill="#166534">一定能写入，所以也算「非阻塞」—— 写进 buf 就返回</text>
  <rect x="660" y="170" width="320" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="820" y="206" text-anchor="middle" font-size="11.5" fill="#14532d">→ 写入缓冲区：成功</text>

  <rect x="20" y="244" width="620" height="62" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="36" y="268" font-size="12" fill="#7c2d12">③ channel 未初始化（nil）</text>
  <text x="36" y="290" font-size="11" fill="#9a3412">nil channel 收发都永久阻塞，这正是「在 select 里摘掉一个分支」的技巧来源</text>
  <rect x="660" y="244" width="320" height="62" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="820" y="272" text-anchor="middle" font-size="11" fill="#7c2d12">非阻塞 → 返回 false</text>
  <text x="820" y="292" text-anchor="middle" font-size="11" fill="#9a3412">阻塞模式 → 永久阻塞</text>

  <rect x="20" y="318" width="620" height="62" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="36" y="342" font-size="12" fill="#7f1d1d">④ channel 已关闭</text>
  <text x="36" y="364" font-size="11" fill="#b91c1c">close 的语义是广播「不会再有数据了」，不是「数据没了」</text>
  <rect x="660" y="318" width="320" height="62" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="820" y="346" text-anchor="middle" font-size="11" fill="#7f1d1d">非阻塞 → 返回 false</text>
  <text x="820" y="366" text-anchor="middle" font-size="11" fill="#b91c1c">阻塞模式 → panic</text>

  <rect x="20" y="396" width="960" height="118" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="422" font-size="12.5" font-weight="bold" fill="#0f172a">①② 都不满足，且不是 ③④（缓冲区满、也没有等待中的接收方）：</text>
  <rect x="36" y="434" width="460" height="54" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="266" y="466" text-anchor="middle" font-size="11.5" fill="#7c2d12">非阻塞模式：返回 false → 命中 select 的 default</text>
  <rect x="516" y="434" width="460" height="54" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="746" y="466" text-anchor="middle" font-size="11.5" fill="#7f1d1d">阻塞模式：封装成 sudog 加入 sendq 并挂起</text>
  <text x="36" y="506" font-size="11.5" fill="#64748b">代码就停在这里，只有接收流程来激活它才会继续往下走。</text>
</svg>
