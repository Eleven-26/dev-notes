<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="e1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="490" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">导出对账 CSV：逐环节能不能上并发</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">正确答案是逐环节看，而不是一句「能」或「不能」；括号外为判据，含本机实测读数</text>

  <rect x="20" y="84" width="580" height="164" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="110" font-size="13" font-weight="bold" fill="#14532d">① 多个独立查询：✅ 能并发</text>
  <rect x="40" y="124" width="170" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="125" y="151" text-anchor="middle" font-size="12" fill="#14532d">四口径汇总</text>
  <rect x="222" y="124" width="170" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="307" y="151" text-anchor="middle" font-size="12" fill="#14532d">收款流水</text>
  <rect x="404" y="124" width="170" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="489" y="151" text-anchor="middle" font-size="12" fill="#14532d">退款单据</text>
  <text x="36" y="196" font-size="11.5" fill="#0f172a">三段互不依赖，errgroup 一把收；实测 305ms → 205ms</text>
  <text x="36" y="218" font-size="11.5" fill="#b45309">⚠️ 只有「各段耗时之和」明显大于「最慢那一段」时才划算</text>
  <text x="36" y="238" font-size="11.5" fill="#64748b">⚠️ gctx 要派生自请求 ctx；并发段数要超过 MaxOpenConns 就危险</text>

  <rect x="620" y="84" width="360" height="164" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="636" y="110" font-size="13" font-weight="bold" fill="#7f1d1d">② 写 CSV / 写响应：❌ 不能</text>
  <rect x="640" y="124" width="320" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="800" y="151" text-anchor="middle" font-size="12" fill="#7f1d1d">csv.Writer / HTTP 响应</text>
  <text x="636" y="196" font-size="11.5" fill="#0f172a">两者都是单一有序流 → 只能并发取数、串行写出</text>
  <text x="636" y="218" font-size="11.5" fill="#15803d">改流式 io.Writer：堆峰值 40.0 MB → 0.0 MB</text>
  <text x="636" y="238" font-size="11.5" fill="#64748b">签名从 (string, []byte, error) 改成 w io.Writer</text>

  <rect x="20" y="270" width="470" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="296" font-size="13" font-weight="bold" fill="#b45309">③ 单个大查询：⚠️ 有条件</text>
  <text x="36" y="320" font-size="11.5" fill="#0f172a">只能按区间 / 分页切片并发，且必须保序</text>
  <text x="36" y="342" font-size="11.5" fill="#64748b">否则导出文件行序错乱</text>
  <text x="36" y="366" font-size="11.5" fill="#64748b">通常不如先把索引 / 分页做好</text>

  <rect x="510" y="270" width="470" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="526" y="296" font-size="13" font-weight="bold" fill="#b91c1c">④ 一次 Find(&amp;list) 全量加载：❌ 不要</text>
  <text x="526" y="320" font-size="11.5" fill="#0f172a">内存 O(行数)，且首字节要等全部查完</text>
  <text x="526" y="342" font-size="11.5" fill="#15803d">改：游标 / 分页 + 边查边写</text>
  <text x="526" y="366" font-size="11.5" fill="#64748b">内存与首字节时间都受益</text>

  <rect x="20" y="406" width="960" height="62" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="36" y="430" font-size="12.5" fill="#0f172a">⭐ 导出场景的优化优先级：① 流式写出 &gt; ② 单查询拆并行 / 加索引 &gt; ③ 三段小查询并发。</text>
  <text x="36" y="454" font-size="12.5" fill="#0f172a">⭐ 并发点要选在「纯计算」和「独立 I/O」上，绝不要选在「写库」和「写响应」上。</text>
</svg>
