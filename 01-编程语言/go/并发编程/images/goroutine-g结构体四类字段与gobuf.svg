<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arGG" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">g 结构体：四类字段与切换现场 gobuf</text>
  <text x="40" y="58" font-size="13" fill="#64748b">runtime/runtime2.go（Go 1.26.5）摘关键字段 —— 切换只换 gobuf 里这几个字</text>

  <rect x="60" y="90" width="380" height="382" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="76" y="112" font-size="13" font-weight="bold" fill="#0f172a">type g struct</text>

  <rect x="72" y="124" width="356" height="86" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="84" y="142" font-size="11" font-weight="bold" fill="#1e3a8a">① 栈</text>
  <text x="128" y="142" font-size="11" fill="#0f172a">stack  区间 [lo, hi)</text>
  <text x="84" y="164" font-size="11" fill="#0f172a">stackguard0 增长高水位，抢占时设 StackPreempt</text>
  <text x="84" y="186" font-size="11" fill="#0f172a">stackguard1 g0 / gsignal 用（普通 G 是 ~0）</text>

  <rect x="72" y="216" width="356" height="66" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="84" y="234" font-size="11" font-weight="bold" fill="#14532d">② 现场</text>
  <text x="136" y="234" font-size="11" fill="#0f172a">m *m  当前绑定的 M</text>
  <text x="84" y="256" font-size="11" fill="#0f172a">sched gobuf ⭐ 切换时保存的执行现场 →</text>

  <rect x="72" y="288" width="356" height="112" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="84" y="306" font-size="11" font-weight="bold" fill="#7c2d12">③ 状态</text>
  <text x="136" y="306" font-size="11" fill="#0f172a">atomicstatus ⭐ 状态机的状态</text>
  <text x="84" y="328" font-size="11" fill="#0f172a">waitreason ⭐ 为什么阻塞（dump 里的 [chan receive]）</text>
  <text x="84" y="350" font-size="11" fill="#0f172a">goid 内部编号 · schedlink 队列串链 · waitsince</text>
  <text x="84" y="372" font-size="11" fill="#0f172a">_panic（最内层 panic，recover 靠它）· _defer</text>

  <rect x="72" y="406" width="356" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="84" y="424" font-size="11" font-weight="bold" fill="#334155">④ 控制位</text>
  <text x="148" y="424" font-size="11" fill="#0f172a">preempt 抢占信号 · preemptStop</text>
  <text x="84" y="446" font-size="11" fill="#0f172a">preemptShrink 同步安全点上收缩栈</text>

  <line x1="434" y1="249" x2="554" y2="249" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arGG)"/>

  <rect x="560" y="130" width="380" height="240" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="1.4"/>
  <text x="576" y="152" font-size="13" font-weight="bold" fill="#14532d">type gobuf struct</text>
  <text x="576" y="178" font-size="11" fill="#0f172a">sp   uintptr     栈指针</text>
  <text x="576" y="202" font-size="11" fill="#0f172a">pc   uintptr     下一条要执行的指令</text>
  <text x="576" y="226" font-size="11" fill="#0f172a">g    guintptr    这个现场属于哪个 g</text>
  <text x="576" y="250" font-size="11" fill="#0f172a">ctxt unsafe.Pointer  闭包上下文（funcval）</text>
  <text x="576" y="274" font-size="11" fill="#0f172a">lr   uintptr     返回地址（有 link register 的架构）</text>
  <text x="576" y="298" font-size="11" fill="#0f172a">bp   uintptr     栈基址（帧指针）</text>
  <text x="576" y="330" font-size="11" fill="#64748b">编译器保证：函数调用边界上，</text>
  <text x="576" y="348" font-size="11" fill="#64748b">其余寄存器要么是死的、要么已落在栈里</text>

  <text x="40" y="502" font-size="11" fill="#64748b">对照：OS 切线程要保存整套寄存器（含浮点 / SIMD）、还可能换页表；goroutine 之间切换只换 sp / pc / bp / lr / ctxt 这几个字。</text>
  <text x="40" y="524" font-size="11" fill="#64748b">⭐ 这就是第 1.1 节「切换代价」一行差两个数量级的来源 —— 现场小，是协程便宜的根本原因之一。</text>
</svg>
