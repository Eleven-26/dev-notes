<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="l" markerWidth="9" markerHeight="9" refX="2" refY="3" orient="auto">
      <path d="M7,0 L0,3 L7,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="570" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">并发编程：四条读线与 16 篇分组</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#64748b">列内竖箭头是篇内前置，四条读线各 4 篇；分组与读序取自第三节</text>

  <rect x="15" y="72" width="214" height="330" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.4"/>
  <text x="122" y="93" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">线 1 · 协程本体</text>
  <rect x="27" y="112" width="190" height="34" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="122" y="133" text-anchor="middle" font-size="11.5" fill="#1e3a8a">① goroutine</text>
  <line x1="122" y1="146" x2="122" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="27" y="160" width="190" height="34" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="122" y="181" text-anchor="middle" font-size="11.5" fill="#1e3a8a">② 协程与线程成本</text>
  <line x1="122" y1="194" x2="122" y2="206" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="27" y="208" width="190" height="34" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="122" y="229" text-anchor="middle" font-size="11.5" fill="#1e3a8a">③ goroutine实战模式</text>
  <line x1="122" y1="242" x2="122" y2="254" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="27" y="256" width="190" height="34" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="122" y="277" text-anchor="middle" font-size="11.5" fill="#1e3a8a">④ 并发控制实战</text>
  <rect x="25" y="304" width="194" height="88" rx="7" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="122" y="328" text-anchor="middle" font-size="11" fill="#1d4ed8">一个协程值多少钱、</text>
  <text x="122" y="348" text-anchor="middle" font-size="11" fill="#1d4ed8">怎么起、怎么收</text>
  <text x="122" y="376" text-anchor="middle" font-size="10.5" fill="#334155">唯一不能跳的地基</text>

  <rect x="267" y="72" width="214" height="330" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="1.4"/>
  <text x="374" y="93" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">线 2 · channel 通信</text>
  <rect x="279" y="112" width="190" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="374" y="133" text-anchor="middle" font-size="11.5" fill="#14532d">① channel原理与底层实现</text>
  <line x1="374" y1="146" x2="374" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="279" y="160" width="190" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="374" y="181" text-anchor="middle" font-size="11.5" fill="#14532d">② channel使用陷阱</text>
  <line x1="374" y1="194" x2="374" y2="206" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="279" y="208" width="190" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="374" y="229" text-anchor="middle" font-size="11.5" fill="#14532d">③ channel实战模式</text>
  <line x1="374" y1="242" x2="374" y2="254" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="279" y="256" width="190" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="374" y="277" text-anchor="middle" font-size="11.5" fill="#14532d">④ errgroup与pipeline</text>
  <rect x="277" y="304" width="194" height="88" rx="7" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="374" y="328" text-anchor="middle" font-size="11" fill="#166534">不共享内存的话，</text>
  <text x="374" y="348" text-anchor="middle" font-size="11" fill="#166534">靠什么把顺序约住</text>
  <text x="374" y="376" text-anchor="middle" font-size="10.5" fill="#334155">与线 3 是两条并行路线</text>

  <line x1="484" y1="225" x2="516" y2="225" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,4" marker-start="url(#l)" marker-end="url(#r)"/>

  <rect x="519" y="72" width="214" height="330" rx="10" fill="#f8fafc" stroke="#ea580c" stroke-width="1.4"/>
  <text x="626" y="93" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">线 3 · 同步原语</text>
  <rect x="531" y="112" width="190" height="34" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="626" y="133" text-anchor="middle" font-size="11.5" fill="#7c2d12">① 并发同步原语</text>
  <line x1="626" y1="146" x2="626" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="531" y="160" width="190" height="34" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="626" y="181" text-anchor="middle" font-size="11.5" fill="#7c2d12">② sync.Map</text>
  <line x1="626" y1="194" x2="626" y2="206" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="531" y="208" width="190" height="34" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="626" y="229" text-anchor="middle" font-size="11.5" fill="#7c2d12">③ atomic操作</text>
  <line x1="626" y1="242" x2="626" y2="254" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="531" y="256" width="190" height="34" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="626" y="277" text-anchor="middle" font-size="11.5" fill="#7c2d12">④ sync.Pool</text>
  <rect x="529" y="304" width="194" height="88" rx="7" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="626" y="328" text-anchor="middle" font-size="11" fill="#9a3412">一定要共享时，</text>
  <text x="626" y="348" text-anchor="middle" font-size="11" fill="#9a3412">用哪一把锁、代价多大</text>
  <text x="626" y="376" text-anchor="middle" font-size="10.5" fill="#334155">三篇是原语篇的展开</text>

  <rect x="771" y="72" width="214" height="330" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="878" y="93" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">线 4 · 语义与现场</text>
  <rect x="783" y="112" width="190" height="34" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="878" y="133" text-anchor="middle" font-size="11.5" fill="#334155">① 线程安全与CSP</text>
  <line x1="878" y1="146" x2="878" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="783" y="160" width="190" height="34" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="878" y="181" text-anchor="middle" font-size="11.5" fill="#334155">② Go内存模型</text>
  <line x1="878" y1="194" x2="878" y2="206" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="783" y="208" width="190" height="34" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="878" y="229" text-anchor="middle" font-size="11.5" fill="#334155">③ 协程泄漏与死锁</text>
  <line x1="878" y1="242" x2="878" y2="254" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="783" y="256" width="190" height="34" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="878" y="277" text-anchor="middle" font-size="11.5" fill="#334155">④ 限流器</text>
  <rect x="781" y="304" width="194" height="88" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="878" y="328" text-anchor="middle" font-size="11" fill="#334155">哪条保证是语言给的、</text>
  <text x="878" y="348" text-anchor="middle" font-size="11" fill="#334155">出问题当场怎么查</text>
  <text x="878" y="376" text-anchor="middle" font-size="10.5" fill="#334155">前两篇判据、后两篇现场</text>

  <rect x="15" y="414" width="970" height="30" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="500" y="434" text-anchor="middle" font-size="12" fill="#7c2d12">线 1 是唯一的地基：Mutex 阻塞时挂在哪、channel 为什么建立 happens-before，都要回到 g 的状态机与 hchan 的队列上讲</text>

  <rect x="15" y="456" width="970" height="98" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="30" y="480" font-size="12" fill="#334155">线 2 与线 3 的顺序可以换，但线 1 不能跳；中间那条双向虚线表示同一个问题两边都能解，选哪边看冲突有多密。</text>
  <text x="30" y="506" font-size="12" fill="#334155">线 4 前两篇回答「凭什么说它线程安全」，后两篇回答「已经出问题了怎么办」；只读现场篇会把结论背成清单。</text>
  <text x="30" y="532" font-size="12" fill="#64748b">想拿工程代码读线 1 与线 2 的第三、四篇，想搞清语义读线 4 前两篇 —— 两组几乎没有重叠，不必按顺序全通。</text>
</svg>
