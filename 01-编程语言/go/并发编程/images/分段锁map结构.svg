<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="h1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">分段锁 map：一张大表拆成 16 张</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">同一个 key 必须永远落到同一个分片 —— 所以只做哈希、不能加随机</text>

  <rect x="30" y="130" width="130" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="95" y="158" text-anchor="middle" font-size="11.5" fill="#1e3a8a">key = "a"</text>
  <rect x="30" y="210" width="130" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="95" y="238" text-anchor="middle" font-size="11.5" fill="#1e3a8a">key = "b"</text>
  <line x1="162" y1="156" x2="186" y2="182" stroke="#334155" stroke-width="1.5" marker-end="url(#h1)"/>
  <line x1="162" y1="232" x2="186" y2="212" stroke="#334155" stroke-width="1.5" marker-end="url(#h1)"/>

  <rect x="190" y="160" width="180" height="76" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="280" y="186" text-anchor="middle" font-size="11" fill="#7c2d12">h = h*31 + int(key[i])</text>
  <text x="280" y="208" text-anchor="middle" font-size="11" fill="#9a3412">分片号 = h &amp; (N-1)</text>
  <text x="280" y="228" text-anchor="middle" font-size="10" fill="#9a3412">N 取 2 的幂，比取模快</text>
  <line x1="372" y1="180" x2="414" y2="144" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#h1)"/>
  <line x1="372" y1="216" x2="414" y2="284" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#h1)"/>

  <text x="698" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">16 个分片（每个分片自带一把 RWMutex + 一张小 map）</text>

  <rect x="420" y="112" width="130" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="485" y="136" text-anchor="middle" font-size="11" fill="#1e3a8a">shard 0</text>
  <text x="485" y="158" text-anchor="middle" font-size="10" fill="#64748b">RWMutex + map</text>
  <rect x="562" y="112" width="130" height="62" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="627" y="136" text-anchor="middle" font-size="11" fill="#1e3a8a">shard 1</text>
  <text x="627" y="158" text-anchor="middle" font-size="10" fill="#64748b">RWMutex + map</text>
  <rect x="704" y="112" width="130" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="769" y="136" text-anchor="middle" font-size="11" fill="#1e3a8a">shard 2</text>
  <text x="769" y="158" text-anchor="middle" font-size="10" fill="#64748b">RWMutex + map</text>
  <rect x="846" y="112" width="130" height="62" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="911" y="136" text-anchor="middle" font-size="11" fill="#1e3a8a">shard 3</text>
  <text x="911" y="158" text-anchor="middle" font-size="10" fill="#64748b">RWMutex + map</text>

  <rect x="420" y="182" width="130" height="62" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="485" y="206" text-anchor="middle" font-size="11" fill="#1e3a8a">shard 4</text>
  <text x="485" y="228" text-anchor="middle" font-size="10" fill="#64748b">RWMutex + map</text>
  <rect x="562" y="182" width="130" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="627" y="206" text-anchor="middle" font-size="11" fill="#1e3a8a">shard 5</text>
  <text x="627" y="228" text-anchor="middle" font-size="10" fill="#64748b">RWMutex + map</text>
  <rect x="704" y="182" width="130" height="62" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="769" y="206" text-anchor="middle" font-size="11" fill="#1e3a8a">shard 6</text>
  <text x="769" y="228" text-anchor="middle" font-size="10" fill="#64748b">RWMutex + map</text>
  <rect x="846" y="182" width="130" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="911" y="206" text-anchor="middle" font-size="11" fill="#1e3a8a">shard 7</text>
  <text x="911" y="228" text-anchor="middle" font-size="10" fill="#64748b">RWMutex + map</text>

  <rect x="420" y="252" width="130" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="485" y="276" text-anchor="middle" font-size="11" fill="#1e3a8a">shard 8</text>
  <text x="485" y="298" text-anchor="middle" font-size="10" fill="#64748b">RWMutex + map</text>
  <rect x="562" y="252" width="130" height="62" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="627" y="276" text-anchor="middle" font-size="11" fill="#1e3a8a">shard 9</text>
  <text x="627" y="298" text-anchor="middle" font-size="10" fill="#64748b">RWMutex + map</text>
  <rect x="704" y="252" width="130" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="769" y="276" text-anchor="middle" font-size="11" fill="#1e3a8a">shard 10</text>
  <text x="769" y="298" text-anchor="middle" font-size="10" fill="#64748b">RWMutex + map</text>
  <rect x="846" y="252" width="130" height="62" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="911" y="276" text-anchor="middle" font-size="11" fill="#1e3a8a">shard 11</text>
  <text x="911" y="298" text-anchor="middle" font-size="10" fill="#64748b">RWMutex + map</text>

  <rect x="420" y="322" width="130" height="62" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="485" y="346" text-anchor="middle" font-size="11" fill="#1e3a8a">shard 12</text>
  <text x="485" y="368" text-anchor="middle" font-size="10" fill="#64748b">RWMutex + map</text>
  <rect x="562" y="322" width="130" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="627" y="346" text-anchor="middle" font-size="11" fill="#1e3a8a">shard 13</text>
  <text x="627" y="368" text-anchor="middle" font-size="10" fill="#64748b">RWMutex + map</text>
  <rect x="704" y="322" width="130" height="62" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="769" y="346" text-anchor="middle" font-size="11" fill="#1e3a8a">shard 14</text>
  <text x="769" y="368" text-anchor="middle" font-size="10" fill="#64748b">RWMutex + map</text>
  <rect x="846" y="322" width="130" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="911" y="346" text-anchor="middle" font-size="11" fill="#1e3a8a">shard 15</text>
  <text x="911" y="368" text-anchor="middle" font-size="10" fill="#64748b">RWMutex + map</text>

  <rect x="30" y="300" width="340" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="46" y="326" font-size="11.5" fill="#14532d">不同分片之间没有任何共享状态 →</text>
  <text x="46" y="348" font-size="11.5" fill="#14532d">天然无竞争，只有落到同一分片时</text>
  <text x="46" y="370" font-size="11.5" fill="#14532d">才会真正抢锁。</text>

  <rect x="20" y="414" width="960" height="102" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="36" y="440" font-size="12" fill="#0f172a">⭐ 段数取 2 的幂（16 / 32 / 64）：hash &amp; (N-1) 比取模快；段太少照样抢锁，段太多白占内存。</text>
  <text x="36" y="464" font-size="12" fill="#0f172a">⚠️ 跨 key 的原子操作做不到（两个账户互转、统计全表总数），这种场景还是得回到单把全局锁。</text>
  <text x="36" y="488" font-size="12" fill="#0f172a">⭐ 代价对照：RWMutex + 普通 map 也要全局一把锁；sync.Map 在写多 / key 频繁增删时反而更慢。</text>
</svg>
