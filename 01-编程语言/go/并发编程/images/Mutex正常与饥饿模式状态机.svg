<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="450" fill="#ffffff"/>
  <defs>
    <marker id="u1" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">Mutex：正常模式 ↔ 饥饿模式</text>
  <text x="40" y="58" font-size="13" fill="#64748b">公平和吞吐是矛盾的；切换阈值 starvationThresholdNs = 1e6（1ms）</text>

  <rect x="60" y="130" width="380" height="170" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">正常模式（默认）</text>
  <text x="250" y="186" text-anchor="middle" font-size="11.5" fill="#0f172a">新来的协程可直接 CAS 抢锁，允许插队</text>
  <text x="250" y="208" text-anchor="middle" font-size="11.5" fill="#0f172a">被唤醒的等待者要和新来的再抢一次</text>
  <text x="250" y="230" text-anchor="middle" font-size="11.5" fill="#0f172a">抢输回到队首（FIFO 但不严格先来先得）</text>
  <text x="250" y="256" text-anchor="middle" font-size="11" fill="#16a34a">优点：整体吞吐更高，省掉大量挂起/唤醒</text>
  <text x="250" y="278" text-anchor="middle" font-size="11" fill="#dc2626">代价：队尾可能长时间拿不到锁</text>

  <rect x="560" y="130" width="380" height="170" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="750" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">饥饿模式（mutexStarving）</text>
  <text x="750" y="186" text-anchor="middle" font-size="11.5" fill="#0f172a">锁直接从解锁者手里交给队首等待者</text>
  <text x="750" y="208" text-anchor="middle" font-size="11.5" fill="#0f172a">新来的不许抢，严格 FIFO 先来先得</text>
  <text x="750" y="230" text-anchor="middle" font-size="11.5" fill="#0f172a">此模式下不允许自旋（要公平就不能再赌）</text>
  <text x="750" y="256" text-anchor="middle" font-size="11" fill="#16a34a">优点：避免个别协程被无限饿死</text>
  <text x="750" y="278" text-anchor="middle" font-size="11" fill="#dc2626">代价：交接开销更大，吞吐略降</text>

  <path d="M 250,130 L 250,95 L 750,95 L 750,130" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#u1)"/>
  <text x="500" y="84" text-anchor="middle" font-size="12" fill="#0f172a">某等待者等待 &gt; 1ms → 置位 mutexStarving</text>

  <path d="M 750,300 L 750,352 L 250,352 L 250,300" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#u1)"/>
  <text x="500" y="372" text-anchor="middle" font-size="12" fill="#0f172a">队列只剩最后一个等待者（或它已拿到锁）时清掉 mutexStarving 切回</text>
  <text x="500" y="392" text-anchor="middle" font-size="11" fill="#64748b">源码判据：old&gt;&gt;mutexWaiterShift == 1</text>

  <text x="40" y="422" font-size="11" fill="#64748b">小结：状态位与计数共用一次 CAS——拆开就丢了"无竞争只需一次 CAS"的优势；自旋副条件 old&amp;(mutexLocked|mutexStarving) == mutexLocked，饥饿模式不满足故不自旋。</text>
</svg>
