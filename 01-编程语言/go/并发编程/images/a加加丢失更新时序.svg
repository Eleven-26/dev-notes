<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
<defs>
<marker id="ar1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
</defs>

<rect x="30" y="48" width="940" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="52" y="80" font-size="16" font-weight="700" fill="#0f172a">两个协程并发执行 a++（三步：读 → 加一 → 写回）</text>

<rect x="80" y="100" width="380" height="40" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="270" y="126" font-size="15" text-anchor="middle" fill="#1e3a8a">协程 A</text>
<rect x="540" y="100" width="380" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="730" y="126" font-size="15" text-anchor="middle" fill="#14532d">协程 B</text>

<rect x="80" y="160" width="380" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="270" y="190" font-size="13" text-anchor="middle" fill="#334155">① 读到 a = 100</text>
<rect x="540" y="160" width="380" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="730" y="190" font-size="13" text-anchor="middle" fill="#334155">① 读到 a = 100</text>

<rect x="80" y="222" width="380" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="270" y="252" font-size="13" text-anchor="middle" fill="#334155">② 计算：100 + 1 = 101</text>
<rect x="540" y="222" width="380" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="730" y="252" font-size="13" text-anchor="middle" fill="#334155">② 计算：100 + 1 = 101</text>

<rect x="80" y="284" width="380" height="48" rx="8" fill="#ffedd5" stroke="#ea580c"/>
<text x="270" y="314" font-size="13" text-anchor="middle" fill="#7c2d12">③ 写回 a = 101</text>
<rect x="540" y="284" width="380" height="48" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="730" y="314" font-size="13" text-anchor="middle" fill="#7f1d1d">③ 写回 a = 101（覆盖 A 的结果）</text>

<rect x="30" y="400" width="940" height="170" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="52" y="434" font-size="16" font-weight="700" fill="#7f1d1d">结果：两次「写回 101」互相覆盖，只留下一次累加</text>
<text x="52" y="468" font-size="14" fill="#7f1d1d">共享变量 a = 101，本应是 102（两次成功的 +1）</text>
<text x="52" y="500" font-size="14" fill="#334155">放大到 1000 个协程：期望 1000，实测 971 —— 这就是「丢失更新」</text>
</svg>
