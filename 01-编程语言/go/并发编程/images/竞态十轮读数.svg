  <rect x="90" y="334" width="862" height="14" fill="#f8fafc"/>
  <text x="521" y="345" font-size="10" fill="#64748b" text-anchor="middle">轮次</text>

  <rect x="30" y="362" width="940" height="72" rx="8" fill="#fefce8" stroke="#fde047"/>
  <rect x="44" y="370" width="912" height="20" fill="#fefce8"/>
  <text x="48" y="384" font-size="11.5" fill="#713f12">红线是期望值 8000000：10 根柱里 4 根恰好落在线上，不是机器有毛病，是那几轮调度恰好把两段临界区错开了。</text>
  <rect x="44" y="392" width="912" height="20" fill="#fefce8"/>
  <text x="48" y="406" font-size="11.5" fill="#713f12">对照实验（同一份逻辑换成 atomic.Int64.Add）：结果 8000000，等于期望 —— 差别不在跑得多快，在有没有规范保证这个结果。</text>
  <rect x="44" y="412" width="912" height="18" fill="#fefce8"/>
  <text x="48" y="426" font-size="11.5" fill="#b45309">规范不作任何保证：既可能偏差 35%，也可能恰好完全正确 —— 两者都不可依赖，所以「跑对一次」不是证据。</text>

  <rect x="36" y="442" width="932" height="22" fill="#ffffff"/>
  <text x="40" y="456" font-size="10.5" fill="#64748b">口径：go1.26.5 / Windows / 8 逻辑核，独立程序连跑 10 轮；数值含调度随机性，因此不参与「两遍逐行相同」的判定。</text>
</svg>
