  <rect x="30" y="20" width="940" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="45" font-size="17" fill="#0f172a">同一份无同步代码连跑 10 轮：4 轮恰好正确、6 轮丢了 20% 到 35%</text>
  <text x="46" y="65" font-size="11.5" fill="#475569">8 个 goroutine 各递增 1000000 次，期望 8000000；绿柱是「恰好等于期望」，红柱是「丢了」</text>

  <rect x="30" y="96" width="940" height="256" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>

