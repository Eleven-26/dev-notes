<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect width="1000" height="620" fill="#ffffff"/>
<defs>
<marker id="arPA" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
</defs>
<text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">pprof 的数据流：三种采集入口 → profile 文件 → 无头读法</text>
<text x="40" y="58" font-size="13" fill="#64748b">同一份 profile 既能看 flat（自己消耗）也能看 cum（含调用链）；block 与 mutex 要先开采样率</text>

<rect x="40" y="100" width="230" height="110" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="52" y="120" font-size="12" font-weight="bold" fill="#1d4ed8">① 程序内 runtime/pprof</text>
<text x="52" y="141" font-size="11" fill="#0f172a">pprof.StartCPUProfile(f)</text>
<text x="52" y="160" font-size="11" fill="#0f172a">StopCPUProfile 必须调用</text>
<text x="52" y="179" font-size="11" fill="#0f172a">runtime.GC() + WriteHeapProfile</text>
<text x="52" y="198" font-size="11" fill="#0f172a">SetBlockProfileRate(1) 先开</text>

<rect x="40" y="224" width="230" height="110" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="52" y="244" font-size="12" font-weight="bold" fill="#15803d">② net/http/pprof</text>
<text x="52" y="265" font-size="11" fill="#0f172a">/debug/pprof/profile 采 30 秒</text>
<text x="52" y="284" font-size="11" fill="#0f172a">/debug/pprof/heap 与 goroutine</text>
<text x="52" y="303" font-size="11" fill="#0f172a">?debug=2 给全量原始栈</text>
<text x="52" y="322" font-size="11" fill="#0f172a">只绑 127.0.0.1:6060</text>

<rect x="40" y="348" width="230" height="110" rx="8" fill="#ffedd5" stroke="#ea580c"/>
<text x="52" y="368" font-size="12" font-weight="bold" fill="#b45309">③ go test 旗标</text>
<text x="52" y="389" font-size="11" fill="#0f172a">-cpuprofile=cpu.out</text>
<text x="52" y="408" font-size="11" fill="#0f172a">-memprofile=mem.out</text>
<text x="52" y="427" font-size="11" fill="#0f172a">-benchmem 出 B/op 与 allocs/op</text>
<text x="52" y="446" font-size="11" fill="#0f172a">B/op、allocs/op 比 ns/op 稳定</text>

<rect x="300" y="100" width="170" height="358" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="385" y="122" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">profile 文件</text>
<text x="312" y="150" font-size="11" fill="#0f172a">cpu.pprof</text>
<text x="312" y="170" font-size="11" fill="#0f172a">heap.pprof</text>
<text x="312" y="190" font-size="11" fill="#dc2626">block.pprof</text>
<text x="312" y="210" font-size="11" fill="#dc2626">mutex.pprof</text>
<text x="312" y="230" font-size="11" fill="#0f172a">goroutine.pprof</text>
<text x="312" y="258" font-size="11" fill="#64748b">Lookup("block")</text>
<text x="312" y="276" font-size="11" fill="#64748b">.WriteTo(f3, 0)</text>
<text x="312" y="304" font-size="11" fill="#dc2626">默认不采样</text>
<text x="312" y="322" font-size="11" fill="#dc2626">→ 空文件</text>
<text x="312" y="350" font-size="11" fill="#64748b">heap 有四种</text>
<text x="312" y="368" font-size="11" fill="#64748b">sample_index</text>
<text x="312" y="396" font-size="11" fill="#64748b">inuse 前要先</text>
<text x="312" y="414" font-size="11" fill="#64748b">runtime.GC()</text>

<rect x="500" y="100" width="250" height="358" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="625" y="122" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">无头读法（命令行与火焰图）</text>
<text x="512" y="150" font-size="11" fill="#0f172a">-top -cum 找调用路径</text>
<text x="512" y="170" font-size="11" fill="#0f172a">-top 看 flat 定位函数</text>
<text x="512" y="190" font-size="11" fill="#0f172a">-list main.hot 逐行标值</text>
<text x="512" y="210" font-size="11" fill="#0f172a">-peek 看调用者与被调用者</text>
<text x="512" y="230" font-size="11" fill="#0f172a">-traces 列出含它的栈</text>
<text x="512" y="250" font-size="11" fill="#0f172a">-diff_base 两版相减</text>
<text x="512" y="270" font-size="11" fill="#64748b">-sample_index=inuse_space</text>
<text x="512" y="298" font-size="11" fill="#15803d">-http=:8080 火焰图</text>
<text x="512" y="316" font-size="11" fill="#15803d">已实测：无头可看</text>
<text x="512" y="334" font-size="11" fill="#b45309">调用图 / -svg 需 Graphviz</text>
<text x="512" y="352" font-size="11" fill="#64748b">判据：先 cum 找路径</text>
<text x="512" y="370" font-size="11" fill="#64748b">再 flat 定位到函数</text>

<rect x="780" y="100" width="180" height="358" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="870" y="122" font-size="13" font-weight="bold" text-anchor="middle" fill="#92400e">读数（一轮样例）</text>
<text x="792" y="150" font-size="11" fill="#0f172a">Duration: 210.92ms</text>
<text x="792" y="168" font-size="11" fill="#0f172a">Total samples 210ms</text>
<text x="792" y="194" font-size="11" fill="#0f172a">main.main</text>
<text x="792" y="212" font-size="11" fill="#0f172a">flat 0 / cum 100%</text>
<text x="792" y="232" font-size="11" fill="#64748b">入口不是热点</text>
<text x="792" y="258" font-size="11" fill="#0f172a">main.hot 180ms</text>
<text x="792" y="276" font-size="11" fill="#0f172a">flat 85.71%</text>
<text x="792" y="302" font-size="11" fill="#0f172a">main.warm 30ms</text>
<text x="792" y="320" font-size="11" fill="#0f172a">flat 14.29%</text>
<text x="792" y="346" font-size="11" fill="#64748b">函数名带 (inline)</text>
<text x="792" y="372" font-size="11" fill="#dc2626">数值每次运行都变</text>
<text x="792" y="390" font-size="11" fill="#dc2626">只用它排序找热点</text>

<line x1="270" y1="155" x2="300" y2="155" stroke="#334155" stroke-width="1.5" marker-end="url(#arPA)"/>
<line x1="270" y1="279" x2="300" y2="279" stroke="#334155" stroke-width="1.5" marker-end="url(#arPA)"/>
<line x1="270" y1="403" x2="300" y2="403" stroke="#334155" stroke-width="1.5" marker-end="url(#arPA)"/>
<line x1="470" y1="279" x2="500" y2="279" stroke="#334155" stroke-width="1.5" marker-end="url(#arPA)"/>
<line x1="750" y1="279" x2="780" y2="279" stroke="#334155" stroke-width="1.5" marker-end="url(#arPA)"/>

<rect x="40" y="474" width="920" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="60" y="500" font-size="13" font-weight="bold" fill="#0f172a">三个坑：StopCPUProfile 不调 → 文件是空的；取 inuse_space 前不 GC → 虚高；采样率要在被测代码之前设</text>
<text x="60" y="524" font-size="13" fill="#334155">线上常开用 SetBlockProfileRate(10000)（万分之一抽样），或只在排查窗口内开</text>
<text x="60" y="548" font-size="13" fill="#334155">-diff_base 适合同一负载的两个代码版本，不适合两个不同的负载</text>
<text x="40" y="600" font-size="11" fill="#64748b">小结：三种入口都落到同一类 .pprof 文件，读法全在命令行；先测再改，一次只改一个变量</text>
</svg>
