<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arPDa" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arPDb" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">pollDesc 的读等待字段：四种取值与六条边</text>
  <text x="40" y="58" font-size="13" fill="#64748b">rg 不是布尔值，它存 pdNil / pdWait / pdReady 或一个 G 指针；netpollblock 与 netpollunblock 各管一半的边。</text>

  <rect x="280" y="84" width="440" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="500" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">pdNil = 0：没人等，也没有待取的事件</text>
  <text x="500" y="132" font-size="12" text-anchor="middle" fill="#334155">新连接刚注册完就是这一态</text>

  <rect x="280" y="176" width="440" height="62" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="500" y="202" font-size="14" font-weight="bold" text-anchor="middle" fill="#9a3412">pdWait = 2：G 正在 park，指针还没写进去</text>
  <text x="500" y="224" font-size="12" text-anchor="middle" fill="#334155">gopark 的 prepare 与 commit 之间</text>

  <rect x="280" y="268" width="440" height="62" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="500" y="294" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">G 指针：G 确实挂在这个方向上</text>
  <text x="500" y="316" font-size="12" text-anchor="middle" fill="#334155">等待者计数 netpollWaiters 已 +1</text>

  <rect x="280" y="360" width="440" height="62" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="386" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">pdReady = 1：事件已到，还没被取走</text>
  <text x="500" y="408" font-size="12" text-anchor="middle" fill="#334155">就是「存款」，下一个等待者直接取用</text>

  <line x1="380" y1="146" x2="380" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#arPDa)"/>
  <line x1="380" y1="238" x2="380" y2="264" stroke="#64748b" stroke-width="2" marker-end="url(#arPDa)"/>
  <line x1="380" y1="330" x2="380" y2="356" stroke="#16a34a" stroke-width="2" marker-end="url(#arPDb)"/>

  <rect x="404" y="147" width="26" height="24" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="417" y="164" font-size="12" font-weight="bold" text-anchor="middle" fill="#334155">①</text>
  <rect x="404" y="239" width="26" height="24" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="417" y="256" font-size="12" font-weight="bold" text-anchor="middle" fill="#334155">②</text>
  <rect x="404" y="331" width="26" height="24" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="417" y="348" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">③</text>

  <path d="M280,391 L200,391 L200,115 L276,115" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arPDa)"/>
  <rect x="187" y="243" width="26" height="24" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="200" y="260" font-size="12" font-weight="bold" text-anchor="middle" fill="#334155">④</text>

  <path d="M280,299 L240,299 L240,146 L276,146" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arPDa)"/>
  <rect x="227" y="207" width="26" height="24" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="240" y="224" font-size="12" font-weight="bold" text-anchor="middle" fill="#b91c1c">⑤</text>

  <path d="M720,115 L800,115 L800,391 L724,391" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arPDb)"/>
  <rect x="787" y="243" width="26" height="24" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="800" y="260" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">⑥</text>

  <rect x="40" y="436" width="920" height="164" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="459" font-size="13" font-weight="bold" fill="#0f172a">六条边分别由谁触发</text>

  <text x="58" y="486" font-size="12" fill="#334155">① netpollblock：CAS(pdNil→pdWait)，紧接着 gopark</text>
  <text x="58" y="510" font-size="12" fill="#334155">② netpollblockcommit：gopark 内 CAS(pdWait→G)</text>
  <text x="58" y="534" font-size="12" fill="#334155">③ netpollunblock(ioready=true)：取出 G 交给 goready</text>

  <text x="510" y="486" font-size="12" fill="#334155">④ netpollblock：CAS(pdReady→pdNil) 命中则返回 true、不入睡</text>
  <text x="510" y="510" font-size="12" fill="#334155">⑤ netpollunblock(ioready=false)：超时或关闭，返回 G 并置回 pdNil</text>
  <text x="510" y="534" font-size="12" fill="#334155">⑥ netpollunblock(ioready=true) 且无人等待：只置 pdReady、不返回 G</text>

  <text x="58" y="562" font-size="12" font-weight="bold" fill="#0f172a">⭐ ④ 与 ⑥ 合起来就是「存款」：事件不会因为当时没人等而丢失，边缘触发才敢只用一次通知。</text>
  <text x="58" y="586" font-size="12" fill="#64748b">⑤ 是 deadline 到期走的边：状态打回 pdNil 而不是 pdReady，所以这次等待以 i/o timeout 结束，fd 本身不关闭。</text>
</svg>
