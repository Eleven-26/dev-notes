<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

<text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">内存视图的四类失效：改到了、活不长、搬了家、认不出</text>
<text x="40" y="58" font-size="13" fill="#64748b">共同点：编译期不报、出错点不报，程序看起来还在正常工作——这才是 unsafe 真正贵的地方</text>

<rect x="40" y="84" width="920" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="56" y="94" width="150" height="84" rx="6" fill="#fee2e2" stroke="#dc2626"/>
<text x="131" y="128" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">一 · 改到了</text>
<text x="131" y="152" font-size="11" text-anchor="middle" fill="#7f1d1d">写穿了「不可变」</text>
<text x="226" y="118" font-size="12" fill="#334155">触发：拿 []byte 造出 string 视图，之后又去改 []byte 的字节。</text>
<text x="226" y="142" font-size="12" fill="#334155">string 的不可变性是语言约定，视图绕过了这条约定，但没绕过内存。</text>
<text x="226" y="170" font-size="12" font-weight="bold" fill="#dc2626">实测：b[0]='D' 之后 s 从 "dev-notes" 变成 "Dev-notes"</text>

<rect x="40" y="204" width="920" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="56" y="214" width="150" height="84" rx="6" fill="#fee2e2" stroke="#dc2626"/>
<text x="131" y="248" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">二 · 活不长</text>
<text x="131" y="272" font-size="11" text-anchor="middle" fill="#7f1d1d">对象先走一步</text>
<text x="226" y="238" font-size="12" fill="#334155">触发：地址存进 uintptr，GC 不把它当引用，原对象被回收或内存被复用。</text>
<text x="226" y="262" font-size="12" fill="#334155">地址数值仍然有效，但它指向的已经不是你的对象。</text>
<text x="226" y="290" font-size="12" font-weight="bold" fill="#dc2626">实测：finalizer 已运行，用 uintptr 读回 0 / -999，全程没有报错</text>

<rect x="40" y="324" width="920" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="56" y="334" width="150" height="84" rx="6" fill="#fee2e2" stroke="#dc2626"/>
<text x="131" y="368" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">三 · 搬了家</text>
<text x="131" y="392" font-size="11" text-anchor="middle" fill="#7f1d1d">旧视图指着老数组</text>
<text x="226" y="358" font-size="12" fill="#334155">触发：对原 slice append 超出 cap，运行时分配新数组并搬走数据。</text>
<text x="226" y="382" font-size="12" fill="#334155">此前造出的视图仍握着旧 Data，读写都落在那块已经没人认领的内存上。</text>
<text x="226" y="410" font-size="12" font-weight="bold" fill="#dc2626">实测：Data 相同=false、Cap 从 8 涨到 16</text>

<rect x="40" y="444" width="920" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="56" y="454" width="150" height="84" rx="6" fill="#fee2e2" stroke="#dc2626"/>
<text x="131" y="488" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">四 · 认不出</text>
<text x="131" y="512" font-size="11" text-anchor="middle" fill="#7f1d1d">map key 变了内容</text>
<text x="226" y="478" font-size="12" fill="#334155">触发：把 []byte 当 map 的 string key 插进去，之后又改那块字节。</text>
<text x="226" y="502" font-size="12" fill="#334155">map 存的是 string 头、不复制字节；哈希按插入时算，内容却变了。</text>
<text x="226" y="530" font-size="12" font-weight="bold" fill="#dc2626">实测：lookup(key1)=false、lookup(视图 k)=false，range 出来 key="key2"</text>

<rect x="40" y="564" width="920" height="76" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="60" y="588" font-size="13" font-weight="bold" fill="#1e40af">四条全都过 go vet；提前发现只剩两条路</text>
<text x="60" y="612" font-size="12" fill="#1e3a8a">① 用 -gcflags=all=-d=checkptr=2 跑一遍（注意 =1 只查一半，见第六节）；② 自己断言数据指针与长度，别靠肉眼。</text>
</svg>
