<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
<defs>
<marker id="ar1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
</defs>

<rect x="60" y="48" width="900" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="80" y="76" font-size="13" fill="#334155">逃逸只有两大类原因：① 生命周期超出函数　② 大小或类型编译期不确定</text>

<rect x="60" y="110" width="340" height="250" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="230" y="140" font-size="13" text-anchor="middle" font-weight="700" fill="#1e3a8a">函数 f 的栈帧（返回即整体回收）</text>

<rect x="90" y="160" width="130" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="155" y="188" font-size="12" text-anchor="middle" fill="#334155">i int</text>
<rect x="240" y="160" width="130" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="305" y="188" font-size="12" text-anchor="middle" fill="#334155">slice</text>
<rect x="90" y="214" width="130" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="155" y="242" font-size="12" text-anchor="middle" fill="#334155">map</text>
<rect x="240" y="214" width="130" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="305" y="242" font-size="12" text-anchor="middle" fill="#334155">闭包 / 接口</text>

<text x="90" y="292" font-size="12" fill="#1e3a8a">函数返回 → 栈帧整体回收</text>
<text x="90" y="318" font-size="12" fill="#7f1d1d">被外部引用的变量必须搬到堆上</text>
<text x="90" y="344" font-size="12" fill="#64748b">否则外部引用会变成悬空指针</text>

<rect x="660" y="160" width="300" height="180" rx="8" fill="#ffedd5" stroke="#ea580c"/>
<text x="810" y="196" font-size="14" text-anchor="middle" font-weight="700" fill="#7c2d12">堆</text>
<text x="810" y="226" font-size="12" text-anchor="middle" fill="#7c2d12">逃逸的变量落在这里</text>
<text x="810" y="252" font-size="12" text-anchor="middle" fill="#64748b">等 GC 周期回收</text>

<line x1="400" y1="185" x2="656" y2="185" stroke="#334155" stroke-width="1.5" marker-end="url(#ar1)"/>
<line x1="400" y1="215" x2="656" y2="215" stroke="#334155" stroke-width="1.5" marker-end="url(#ar1)"/>
<line x1="400" y1="245" x2="656" y2="245" stroke="#334155" stroke-width="1.5" marker-end="url(#ar1)"/>
<line x1="400" y1="275" x2="656" y2="275" stroke="#334155" stroke-width="1.5" marker-end="url(#ar1)"/>
<line x1="400" y1="305" x2="656" y2="305" stroke="#334155" stroke-width="1.5" marker-end="url(#ar1)"/>
<text x="528" y="179" font-size="12" text-anchor="middle" fill="#64748b">①</text>
<text x="528" y="209" font-size="12" text-anchor="middle" fill="#64748b">②</text>
<text x="528" y="239" font-size="12" text-anchor="middle" fill="#64748b">③</text>
<text x="528" y="269" font-size="12" text-anchor="middle" fill="#64748b">④</text>
<text x="528" y="299" font-size="12" text-anchor="middle" fill="#64748b">⑤</text>

<rect x="60" y="386" width="900" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="80" y="416" font-size="12" fill="#334155">① 返回指针 / 切片 / map —— 地址何时还被使用未知，且大小不确定</text>
<text x="80" y="442" font-size="12" fill="#334155">② 向 channel 发送指针 —— 接收方何时引用未知</text>
<text x="80" y="468" font-size="12" fill="#334155">③ 闭包捕获 —— i 在 f 返回的函数里被引用，生命周期超出 f</text>
<text x="80" y="494" font-size="12" fill="#334155">④ 切片 / map 里存指针 —— 其他函数或协程可能引用其中元素</text>
<text x="80" y="520" font-size="12" fill="#334155">⑤ 动态类型（interface 多态）—— 编译期定不下具体类型与大小</text>
</svg>
