<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>
<defs>
<marker id="ar1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
</defs>

<text x="125" y="100" font-size="12" text-anchor="middle" fill="#1e3a8a">参数个数</text>
<text x="320" y="100" font-size="12" text-anchor="middle" fill="#14532d">参数列表</text>
<text x="595" y="100" font-size="12" text-anchor="middle" fill="#7c2d12">环境变量列表</text>
<text x="825" y="100" font-size="12" text-anchor="middle" fill="#7f1d1d">辅助向量列表</text>

<rect x="80" y="110" width="90" height="86" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<text x="125" y="160" font-size="12" text-anchor="middle" fill="#1e3a8a">argc</text>

<rect x="180" y="110" width="280" height="86" rx="6" fill="#dcfce7" stroke="#16a34a"/>
<text x="320" y="146" font-size="12" text-anchor="middle" fill="#14532d">argv[0] … argv[argc-1]</text>
<text x="320" y="172" font-size="12" text-anchor="middle" fill="#14532d">NULL（结尾）</text>

<rect x="470" y="110" width="250" height="86" rx="6" fill="#ffedd5" stroke="#ea580c"/>
<text x="595" y="146" font-size="12" text-anchor="middle" fill="#7c2d12">envp[0] … envp[n-1]</text>
<text x="595" y="172" font-size="12" text-anchor="middle" fill="#7c2d12">NULL（结尾）</text>

<rect x="730" y="110" width="190" height="86" rx="6" fill="#fee2e2" stroke="#dc2626"/>
<text x="825" y="146" font-size="12" text-anchor="middle" fill="#7f1d1d">auxv[0] auxv[1] …</text>
<text x="825" y="172" font-size="12" text-anchor="middle" fill="#7f1d1d">AT_NULL（结尾）</text>

<line x1="320" y1="222" x2="820" y2="222" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar1)"/>
<text x="570" y="216" font-size="11" text-anchor="middle" fill="#64748b">跳过 argv、再跳过 envp → 落在 auxv 起始地址</text>

<rect x="60" y="240" width="880" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="80" y="268" font-size="12" fill="#334155">① argv + argc + 1 → 指向环境变量列表头部</text>
<text x="80" y="294" font-size="12" fill="#334155">② while *v != nil { v++ } → 一路自增，跳过整个 envp</text>
<text x="80" y="320" font-size="12" fill="#334155">③ v++ → 再跳过一个 NULL 分隔符</text>
<text x="80" y="346" font-size="12" fill="#334155">④ 此时位置就落在辅助向量（auxv）的起始地址上</text>
<text x="80" y="372" font-size="12" fill="#7f1d1d">auxv 是 tag + value 的键值对结构，以 AT_NULL 结尾</text>
</svg>
