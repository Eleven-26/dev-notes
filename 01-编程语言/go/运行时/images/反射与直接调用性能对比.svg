<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">反射 vs 接口 vs 直接调用：同一轮 -count=5 的实测区间</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">横轴为对数刻度（ns/op），色带＝5 次读数的最小~最大区间；数据来自容器 golang:1.26-alpine，i7-6700HQ，-benchtime=200000x -benchmem</text>

  <!-- 网格 -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="450" y1="92" x2="450" y2="612"/>
    <line x1="600" y1="92" x2="600" y2="612"/>
    <line x1="750" y1="92" x2="750" y2="612"/>
    <line x1="900" y1="92" x2="900" y2="612"/>
  </g>
  <text x="450" y="628" text-anchor="middle" font-size="11" fill="#64748b">1 ns</text>
  <text x="600" y="628" text-anchor="middle" font-size="11" fill="#64748b">10 ns</text>
  <text x="750" y="628" text-anchor="middle" font-size="11" fill="#64748b">100 ns</text>
  <text x="900" y="628" text-anchor="middle" font-size="11" fill="#64748b">1000 ns</text>

  <!-- 面板 A -->
  <text x="30" y="106" font-size="12.5" font-weight="bold" fill="#1e3a8a">A. 一次方法调用（Add(3,4)）</text>

  <text x="30" y="136" font-size="11.5" fill="#0f172a">DirectNoInline 直接调用</text>
  <rect x="491.6" y="124" width="24.9" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="530" y="139" font-size="11" fill="#14532d">1.893 ~ 2.774　0 allocs</text>

  <text x="30" y="172" font-size="11.5" fill="#0f172a">IfaceNoInline 接口调用</text>
  <rect x="541.3" y="160" width="36.9" height="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="586" y="175" font-size="11" fill="#1e3a8a">4.062 ~ 7.154　0 allocs</text>

  <text x="30" y="208" font-size="11.5" fill="#0f172a">ReflectCallCached 缓存方法值+参数</text>
  <rect x="848.4" y="196" width="32.9" height="20" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="600" y="211" font-size="11" fill="#854d0e">452.7 ~ 750.8　40 B / 3 allocs</text>

  <text x="30" y="244" font-size="11.5" fill="#0f172a">ReflectCallFresh 每次 MethodByName+现场装箱</text>
  <rect x="900" y="232" width="10.9" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="600" y="247" font-size="11" fill="#7f1d1d">1000 ~ 1182　192 B / 6 allocs</text>

  <rect x="30" y="264" width="920" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="286" font-size="11.5" fill="#334155">倍数（同一次运行内取区间两端相除）：反射 ≈ 直接调用的 360 ~ 530 倍，≈ 接口调用的 140 ~ 250 倍；缓存能砍一半，但剩下的是 Call 自身，仍差两个数量级。</text>
  <text x="46" y="304" font-size="11.5" fill="#7f1d1d">对照（陷阱一）：不加 //go:noinline 时 DirectInlineOnly 只 0.7446 ~ 0.8716、IfaceInlineOnly 2.357 ~ 2.790 —— 去虚化后"分母"被优化没了。</text>

  <!-- 面板 B -->
  <text x="30" y="344" font-size="12.5" font-weight="bold" fill="#14532d">B. 一轮遍历 8 个 Row{A,B,C int}、读 3 个字段（写操作见下）</text>

  <text x="30" y="374" font-size="11.5" fill="#0f172a">FieldDirect　r.A+r.B+r.C</text>
  <rect x="616.9" y="362" width="29.4" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="660" y="377" font-size="11" fill="#14532d">12.97 ~ 20.36</text>

  <text x="30" y="410" font-size="11.5" fill="#0f172a">FieldPureUnsafe　unsafe.Add 按偏移</text>
  <rect x="685.9" y="398" width="14.5" height="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="716" y="413" font-size="11" fill="#334155">37.38 ~ 46.67</text>

  <text x="30" y="446" font-size="11.5" fill="#0f172a">FieldReflectInt　Field(i).Int()</text>
  <rect x="783.5" y="434" width="21.9" height="20" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="818" y="449" font-size="11" fill="#854d0e">210.4 ~ 294.5　0 allocs</text>

  <text x="30" y="482" font-size="11.5" fill="#0f172a">FieldReflectPlusUnsafe　Addr().UnsafePointer()</text>
  <rect x="899.7" y="470" width="30.4" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="600" y="485" font-size="11" fill="#7f1d1d">995.1 ~ 1582　0 allocs</text>

  <text x="30" y="518" font-size="11.5" fill="#0f172a">FieldReflectInterface　Field(i).Interface().(int)</text>
  <rect x="904" y="506" width="30" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="600" y="521" font-size="11" fill="#7f1d1d">1064 ~ 1684　192 B / 8 allocs</text>

  <text x="30" y="554" font-size="11.5" fill="#0f172a">SetReflect　循环外预备，Field(0).Set(in)</text>
  <rect x="652.6" y="542" width="22" height="20" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="690" y="557" font-size="11" fill="#854d0e">22.42 ~ 31.41</text>

  <text x="30" y="590" font-size="11.5" fill="#0f172a">SetUnsafe　*(*int)(p) = 7</text>
  <rect x="391" y="578" width="61" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="465" y="593" font-size="11" fill="#14532d">0.4041 ~ 1.031</text>

  <!-- 结论 -->
  <rect x="30" y="644" width="920" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="46" y="662" font-size="11.5" fill="#334155">读图：反射的开销不是一个常数——读字段 Int() 约 15 倍、装箱约 80 倍、方法调用约 400 倍、写一个字段约 60 倍。</text>
  <text x="46" y="678" font-size="11.5" fill="#7f1d1d">波动：极差最大的是 FieldReflectInterface（约 58%）与 IfaceNoInline（约 76%）；倍数只在同一次运行内比较，跨运行绝对值不可比。</text>
</svg>
