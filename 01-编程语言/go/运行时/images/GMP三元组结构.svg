<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="450" fill="#ffffff"/>
<defs>
<marker id="ar1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
</defs>

<rect x="200" y="56" width="280" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="340" y="78" font-size="13" text-anchor="middle" fill="#334155">M　Machine</text>
<text x="340" y="98" font-size="12" text-anchor="middle" fill="#64748b">OS 线程，真正执行代码</text>
<line x1="340" y1="112" x2="340" y2="138" stroke="#334155" stroke-width="1.5" marker-end="url(#ar1)"/>
<text x="352" y="132" font-size="12" fill="#64748b">同一时刻最多绑 1 个 M</text>

<rect x="60" y="142" width="560" height="180" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="80" y="172" font-size="14" font-weight="700" fill="#1e3a8a">P　Processor（逻辑处理器）</text>
<text x="80" y="194" font-size="12" fill="#1e3a8a">G 的调度器，持有本地队列</text>

<rect x="90" y="208" width="160" height="44" rx="6" fill="#ffedd5" stroke="#ea580c"/>
<text x="170" y="236" font-size="12" text-anchor="middle" fill="#7c2d12">runnext（1 个）</text>
<rect x="270" y="208" width="330" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
<text x="435" y="236" font-size="12" text-anchor="middle" fill="#14532d">runq [256] 环形队列（无锁）</text>
<rect x="90" y="262" width="250" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="215" y="290" font-size="12" text-anchor="middle" fill="#334155">gFree：空闲 G 链表</text>
<rect x="360" y="262" width="240" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="480" y="290" font-size="12" text-anchor="middle" fill="#334155">mcache：小对象缓存</text>

<rect x="90" y="340" width="70" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<text x="125" y="365" font-size="12" text-anchor="middle" fill="#1e3a8a">G</text>
<rect x="170" y="340" width="70" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<text x="205" y="365" font-size="12" text-anchor="middle" fill="#1e3a8a">G</text>
<rect x="250" y="340" width="70" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<text x="285" y="365" font-size="12" text-anchor="middle" fill="#1e3a8a">G</text>
<rect x="330" y="340" width="70" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<text x="365" y="365" font-size="12" text-anchor="middle" fill="#1e3a8a">G</text>
<text x="430" y="365" font-size="12" fill="#334155">…新建的 G 优先入本地队列</text>

<line x1="620" y1="200" x2="676" y2="192" stroke="#334155" stroke-width="1.5" marker-end="url(#ar1)"/>
<rect x="680" y="142" width="280" height="100" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="820" y="172" font-size="13" text-anchor="middle" fill="#7f1d1d">全局队列 GRQ</text>
<text x="820" y="196" font-size="12" text-anchor="middle" fill="#7f1d1d">所有 M 都要访问 → 必须加锁</text>
<text x="696" y="222" font-size="12" fill="#7f1d1d">本地队列满 256 时，一半溢出到这里</text>

<rect x="680" y="262" width="280" height="100" rx="8" fill="#ffedd5" stroke="#ea580c"/>
<text x="820" y="292" font-size="13" text-anchor="middle" fill="#7c2d12">work stealing</text>
<text x="820" y="316" font-size="12" text-anchor="middle" fill="#7c2d12">从其他 P 的本地队列偷走一半（1/2）</text>
<line x1="676" y1="312" x2="624" y2="312" stroke="#334155" stroke-width="1.5" marker-end="url(#ar1)"/>

<text x="500" y="424" font-size="13" text-anchor="middle" fill="#0f172a">GOMAXPROCS 决定 P 的数量；G 是任务、P 是调度器、M 才是真正干活的线程</text>
</svg>
