<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>
  <defs>
    <marker id="t3a" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="t3b" viewBox="0 0 7 6" refX="0" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="40" y="36" font-size="20" font-weight="bold" fill="#0f172a">误差从哪来：到期时刻到下一个检查点的距离</text>
  <text x="40" y="60" font-size="13" fill="#64748b">下面三行各用各的比例尺，只对齐「when 之后」这一段；读数取自本篇第 4 节的实测。</text>

  <rect x="40" y="96" width="200" height="84" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="56" y="124" font-size="13" font-weight="bold" fill="#1e3a8a">空闲，4 个 P</text>
  <text x="56" y="148" font-size="12" fill="#334155">设定 1ms</text>
  <text x="56" y="168" font-size="12" fill="#475569">过冲 p50 0.13~0.17ms</text>

  <line x1="256" y1="148" x2="952" y2="148" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="136" x2="320" y2="160" stroke="#2563eb" stroke-width="3"/>
  <rect x="292" y="104" width="56" height="24" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="320" y="121" font-size="12" text-anchor="middle" fill="#1e3a8a">when</text>
  <line x1="400" y1="136" x2="400" y2="160" stroke="#dc2626" stroke-width="3"/>
  <rect x="360" y="104" width="80" height="24" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="400" y="121" font-size="12" text-anchor="middle" fill="#b91c1c">实际触发</text>
  <line x1="320" y1="170" x2="400" y2="170" stroke="#dc2626" stroke-width="2" marker-start="url(#t3b)" marker-end="url(#t3a)"/>
  <rect x="303" y="178" width="114" height="26" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="360" y="196" font-size="12" text-anchor="middle" fill="#b91c1c">0.13~0.17ms</text>

  <rect x="40" y="196" width="200" height="84" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="56" y="224" font-size="13" font-weight="bold" fill="#9a3412">P 被占住，1 个 P</text>
  <text x="56" y="248" font-size="12" fill="#334155">设定 1ms</text>
  <text x="56" y="268" font-size="12" fill="#475569">过冲 p50 19.28~19.30ms</text>

  <line x1="256" y1="248" x2="952" y2="248" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="236" x2="320" y2="260" stroke="#2563eb" stroke-width="3"/>
  <rect x="292" y="204" width="56" height="24" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="320" y="221" font-size="12" text-anchor="middle" fill="#1e3a8a">when</text>
  <line x1="620" y1="236" x2="620" y2="260" stroke="#dc2626" stroke-width="3"/>
  <rect x="580" y="204" width="80" height="24" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="620" y="221" font-size="12" text-anchor="middle" fill="#b91c1c">实际触发</text>
  <line x1="320" y1="270" x2="620" y2="270" stroke="#dc2626" stroke-width="2" marker-start="url(#t3b)" marker-end="url(#t3a)"/>
  <rect x="374" y="278" width="192" height="26" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="470" y="296" font-size="12" text-anchor="middle" fill="#b91c1c">19.28~19.30ms，约两个抢占周期</text>

  <rect x="40" y="296" width="200" height="84" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="56" y="324" font-size="13" font-weight="bold" fill="#92400e">5 万颗同一刻到期</text>
  <text x="56" y="348" font-size="12" fill="#334155">设定 50ms</text>
  <text x="56" y="368" font-size="12" fill="#475569">最后一颗晚 175~334ms</text>

  <line x1="256" y1="348" x2="952" y2="348" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="336" x2="320" y2="360" stroke="#2563eb" stroke-width="3"/>
  <rect x="292" y="304" width="56" height="24" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="320" y="321" font-size="12" text-anchor="middle" fill="#1e3a8a">when</text>
  <line x1="800" y1="336" x2="800" y2="360" stroke="#dc2626" stroke-width="3"/>
  <rect x="752" y="304" width="96" height="24" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="800" y="321" font-size="12" text-anchor="middle" fill="#b91c1c">最后一颗</text>
  <line x1="320" y1="370" x2="800" y2="370" stroke="#dc2626" stroke-width="2" marker-start="url(#t3b)" marker-end="url(#t3a)"/>
  <rect x="428" y="378" width="264" height="26" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="560" y="396" font-size="12" text-anchor="middle" fill="#b91c1c">4 个 P 用 175ms，1 个 P 用 334ms</text>

  <rect x="40" y="416" width="920" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="60" y="444" font-size="13" fill="#0f172a">读法：定时器只保证「不早于 when」；晚多少 = 到下一个检查点的距离，亚毫秒档还要再加约 1ms 的时钟粒度。</text>
</svg>
