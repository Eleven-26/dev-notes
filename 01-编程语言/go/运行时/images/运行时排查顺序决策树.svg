<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
<defs>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
</defs>

<text x="500" y="34" font-size="17" text-anchor="middle" font-weight="700" fill="#0f172a">排查顺序：先常驻指标，再窗口采样，最后才刷屏</text>

<text x="125" y="72" font-size="12" text-anchor="middle" fill="#475569">现象</text>
<text x="365" y="72" font-size="12" text-anchor="middle" fill="#475569">第一步：常驻可开</text>
<text x="625" y="72" font-size="12" text-anchor="middle" fill="#475569">第二步：窗口制</text>
<text x="880" y="72" font-size="12" text-anchor="middle" fill="#475569">兜底：复现环境</text>

<rect x="30" y="90" width="190" height="76" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="125" y="122" font-size="13" text-anchor="middle" fill="#7f1d1d" font-weight="700">P99 延迟抖</text>
<text x="125" y="146" font-size="12" text-anchor="middle" fill="#7f1d1d">怀疑停顿</text>

<rect x="260" y="90" width="210" height="76" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text x="365" y="122" font-size="12" text-anchor="middle" fill="#78350f" font-weight="700">gctrace=1</text>
<text x="365" y="146" font-size="12" text-anchor="middle" fill="#78350f">看 clock 第 1、3 段</text>

<rect x="520" y="90" width="210" height="76" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
<text x="625" y="122" font-size="12" text-anchor="middle" fill="#78350f" font-weight="700">trace 抓 1~3 秒</text>
<text x="625" y="146" font-size="12" text-anchor="middle" fill="#78350f">看 STWBegin 落在哪段</text>

<rect x="780" y="90" width="200" height="76" rx="8" fill="#f1f5f9" stroke="#64748b"/>
<text x="880" y="122" font-size="12" text-anchor="middle" fill="#334155" font-weight="700">scheddetail=1</text>
<text x="880" y="146" font-size="12" text-anchor="middle" fill="#334155">找 status=4(原因)</text>

<line x1="222" y1="128" x2="256" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="472" y1="128" x2="516" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="732" y1="128" x2="776" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="30" y="200" width="190" height="76" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="125" y="232" font-size="13" text-anchor="middle" fill="#7f1d1d" font-weight="700">协程数单调上涨</text>
<text x="125" y="256" font-size="12" text-anchor="middle" fill="#7f1d1d">怀疑泄漏</text>

<rect x="260" y="200" width="210" height="76" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="365" y="232" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="700">NumGoroutine 看趋势</text>
<text x="365" y="256" font-size="12" text-anchor="middle" fill="#1e3a8a">并与 metrics 并排打</text>

<rect x="520" y="200" width="210" height="76" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="625" y="232" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="700">pprof goroutine</text>
<text x="625" y="256" font-size="12" text-anchor="middle" fill="#1e3a8a">按栈聚类，成簇的才可疑</text>

<rect x="780" y="200" width="200" height="76" rx="8" fill="#f1f5f9" stroke="#64748b"/>
<text x="880" y="232" font-size="12" text-anchor="middle" fill="#334155" font-weight="700">runtime.Stack</text>
<text x="880" y="256" font-size="12" text-anchor="middle" fill="#334155">全量 dump（按 2KB 估）</text>

<line x1="222" y1="238" x2="256" y2="238" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="472" y1="238" x2="516" y2="238" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="732" y1="238" x2="776" y2="238" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="30" y="310" width="190" height="76" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="125" y="342" font-size="13" text-anchor="middle" fill="#7f1d1d" font-weight="700">内存 RSS 一路涨</text>
<text x="125" y="366" font-size="12" text-anchor="middle" fill="#7f1d1d">怀疑泄漏或碎片</text>

<rect x="260" y="310" width="210" height="76" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="365" y="342" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="700">MemStats 三件套</text>
<text x="365" y="366" font-size="12" text-anchor="middle" fill="#1e3a8a">Inuse-Alloc / GCSys / StackInuse</text>

<rect x="520" y="310" width="210" height="76" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="625" y="342" font-size="12" text-anchor="middle" fill="#14532d" font-weight="700">scavtrace 的 util</text>
<text x="625" y="366" font-size="12" text-anchor="middle" fill="#14532d">util 高 = 真存活不是碎片</text>

<rect x="780" y="310" width="200" height="76" rx="8" fill="#f1f5f9" stroke="#64748b"/>
<text x="880" y="342" font-size="12" text-anchor="middle" fill="#334155" font-weight="700">/proc/pid/smaps</text>
<text x="880" y="366" font-size="12" text-anchor="middle" fill="#334155">cgo 与 mmap 只能在这看</text>

<line x1="222" y1="348" x2="256" y2="348" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="472" y1="348" x2="516" y2="348" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="732" y1="348" x2="776" y2="348" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="30" y="418" width="950" height="92" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="505" y="444" font-size="12" text-anchor="middle" fill="#334155" font-weight="700">代价档位（越往右越贵，只有前一步没结论时才往右走）</text>
<text x="505" y="470" font-size="12" text-anchor="middle" fill="#334155">常驻可开：metrics / pprof 默认档 / NumGoroutine　　窗口制：trace、CPU profile（几十秒内必须关）</text>
<text x="505" y="492" font-size="12" text-anchor="middle" fill="#334155">复现环境：scheddetail、gcstoptheworld、GOTRACEBACK=crash</text>
</svg>
