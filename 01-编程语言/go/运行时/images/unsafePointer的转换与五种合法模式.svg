<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<defs>
<marker id="arP1" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
<marker id="arP2" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
</defs>

<text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">unsafe.Pointer 的四条特殊操作与五种合法模式</text>
<text x="40" y="58" font-size="13" fill="#64748b">特殊操作是「能力」：能在三个位置之间转；五种模式是「许可」：只有这五处转法今天合法、明天也合法</text>

<rect x="60" y="100" width="200" height="70" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="160" y="124" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d4ed8">*T 任意类型指针</text>
<text x="160" y="146" font-size="11" text-anchor="middle" fill="#0f172a">&amp;v、字段地址、元素地址</text>

<rect x="400" y="100" width="200" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="500" y="124" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">unsafe.Pointer</text>
<text x="500" y="146" font-size="11" text-anchor="middle" fill="#0f172a">类型系统的唯一例外口</text>

<rect x="740" y="100" width="200" height="70" rx="8" fill="#f1f5f9" stroke="#64748b"/>
<text x="840" y="124" font-size="13" font-weight="bold" text-anchor="middle" fill="#334155">uintptr</text>
<text x="840" y="146" font-size="11" text-anchor="middle" fill="#334155">整数，没有指针语义</text>

<line x1="260" y1="122" x2="396" y2="122" stroke="#334155" stroke-width="1.5" marker-end="url(#arP1)"/>
<line x1="400" y1="150" x2="264" y2="150" stroke="#334155" stroke-width="1.5" marker-end="url(#arP1)"/>
<text x="330" y="114" font-size="11" text-anchor="middle" fill="#334155">① 任意指针 → Pointer</text>
<text x="330" y="168" font-size="11" text-anchor="middle" fill="#334155">② Pointer → 任意指针</text>

<line x1="600" y1="122" x2="736" y2="122" stroke="#334155" stroke-width="1.5" marker-end="url(#arP1)"/>
<line x1="740" y1="150" x2="604" y2="150" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arP2)"/>
<text x="670" y="114" font-size="11" text-anchor="middle" fill="#334155">③ Pointer → uintptr</text>
<text x="670" y="168" font-size="11" text-anchor="middle" fill="#dc2626">④ uintptr → Pointer：仅模式 (3)(4)(5)</text>

<rect x="40" y="192" width="920" height="66" rx="8" fill="#fef2f2" stroke="#dc2626"/>
<text x="60" y="216" font-size="13" font-weight="bold" fill="#991b1b">红线：uintptr 一旦落进变量，就不再是引用</text>
<text x="60" y="240" font-size="12" fill="#7f1d1d">官方原文「A uintptr is an integer, not a reference」——GC 不追它、不搬它指向的对象、也不保活，读回来的可能是别人的数据</text>

<rect x="40" y="276" width="920" height="256" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="60" y="300" font-size="13" font-weight="bold" fill="#0f172a">五种合法模式（右侧一列写的是各自的边界）</text>
<line x1="60" y1="310" x2="940" y2="310" stroke="#cbd5e1"/>
<text x="60" y="330" font-size="11" font-weight="bold" fill="#475569">模式</text>
<text x="330" y="330" font-size="11" font-weight="bold" fill="#475569">合法写法（摘要）</text>
<text x="700" y="330" font-size="11" font-weight="bold" fill="#475569">边界</text>

<text x="60" y="358" font-size="12" fill="#0f172a">(1) *T1 → Pointer → *T2</text>
<text x="330" y="358" font-size="11" fill="#334155">两边大小与内存布局等价才能重解释</text>
<text x="700" y="358" font-size="11" fill="#334155">math.Float64bits 是范例</text>

<text x="60" y="388" font-size="12" fill="#0f172a">(2) Pointer → uintptr</text>
<text x="330" y="388" font-size="11" fill="#334155">转出来只为打印、比较地址数值</text>
<text x="700" y="388" font-size="11" fill="#dc2626">不许转回去</text>

<text x="60" y="418" font-size="12" fill="#0f172a">(3) 来回转 + 算术</text>
<text x="330" y="418" font-size="11" fill="#334155">同一个表达式内完成，只允许加、减、&amp;^ 对齐</text>
<text x="700" y="418" font-size="11" fill="#dc2626">结果必须仍在原对象内</text>

<text x="60" y="448" font-size="12" fill="#0f172a">(4) 传给汇编实现的函数</text>
<text x="330" y="448" font-size="11" fill="#334155">转换必须写在实参列表里，如 Syscall</text>
<text x="700" y="448" font-size="11" fill="#dc2626">先存变量再传就失效</text>

<text x="60" y="478" font-size="12" fill="#0f172a">(5) reflect.Value 的 uintptr</text>
<text x="330" y="478" font-size="11" fill="#334155">Pointer / UnsafeAddr 返回值立刻同一表达式转回</text>
<text x="700" y="478" font-size="11" fill="#334155">反射侧接口见反射篇</text>
<text x="60" y="514" font-size="11" fill="#64748b">越界示例（官方注释列为 INVALID）：把偏移写到对象末尾之外、nil 指针做算术、uintptr 先存变量再转回</text>

<rect x="40" y="550" width="920" height="120" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="60" y="576" font-size="13" font-weight="bold" fill="#1e40af">怎么记：能力三种、许可五种</text>
<text x="60" y="600" font-size="12" fill="#1e3a8a">写 unsafe 之前先问一句「这段代码属于哪种模式」——答不上来就不是「写法丑」，而是越权。</text>
<text x="60" y="624" font-size="12" fill="#1e3a8a">go vet 的 unsafeptr 分析器只覆盖其中一部分；官方原文：silence from go vet is not a guarantee。</text>
<text x="60" y="648" font-size="12" fill="#1e3a8a">所以还要靠 checkptr=2 与自己的断言兜底，两道闸门的分工见正文第六节。</text>
</svg>
