<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
<defs>
<marker id="ar1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
</defs>

<text x="60" y="40" font-size="15" font-weight="700" fill="#0f172a">P 找 G 跑起来的优先级</text>

<rect x="60" y="54" width="880" height="54" rx="8" fill="#ffedd5" stroke="#ea580c"/>
<text x="90" y="87" font-size="13" fill="#7c2d12">① runnext（插队位）—— 刚被唤醒的 G 优先跑</text>

<line x1="500" y1="108" x2="500" y2="120" stroke="#334155" stroke-width="1.5" marker-end="url(#ar1)"/>

<rect x="60" y="124" width="880" height="54" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="90" y="157" font-size="13" fill="#14532d">② 本地队列 runq（无锁，容量 256）</text>

<line x1="500" y1="178" x2="500" y2="190" stroke="#334155" stroke-width="1.5" marker-end="url(#ar1)"/>

<rect x="60" y="194" width="880" height="54" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="90" y="227" font-size="13" fill="#1e3a8a">③ 全局队列 sched.runq（带锁）—— 一次取一批 globrunqgetbatch</text>

<line x1="500" y1="248" x2="500" y2="260" stroke="#334155" stroke-width="1.5" marker-end="url(#ar1)"/>

<rect x="60" y="264" width="880" height="54" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
<text x="90" y="297" font-size="13" fill="#075985">④ netpoll(0) —— 非阻塞看一眼已就绪的网络 fd</text>

<line x1="500" y1="318" x2="500" y2="330" stroke="#334155" stroke-width="1.5" marker-end="url(#ar1)"/>

<rect x="60" y="334" width="880" height="54" rx="8" fill="#ffedd5" stroke="#ea580c"/>
<text x="90" y="367" font-size="13" fill="#7c2d12">⑤ work stealing —— 随机挑 P，偷走它本地队列的一半</text>

<line x1="500" y1="388" x2="500" y2="400" stroke="#334155" stroke-width="1.5" marker-end="url(#ar1)"/>

<rect x="60" y="404" width="880" height="54" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="90" y="437" font-size="13" fill="#334155">⑥ 都没有 → M 自旋一段时间，再没有就休眠</text>

<text x="500" y="496" font-size="13" text-anchor="middle" fill="#0f172a">顺序的精髓：先用无锁的、再用带锁的、最后才跨 P 偷取</text>
<text x="500" y="522" font-size="12" text-anchor="middle" fill="#64748b">偷取一轮最多试 4 个 P（stealTries = 4），偷到的是对方较老的那一半</text>
</svg>
