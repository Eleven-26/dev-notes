<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>

  <rect x="40" y="16" width="900" height="26" fill="#ffffff"/>
  <text x="40" y="35" font-size="17" font-weight="700" fill="#0f172a">2.4 MB 里，行号表比代码还大</text>
  <rect x="40" y="42" width="920" height="22" fill="#ffffff"/>
  <text x="40" y="58" font-size="12.5" fill="#64748b">同一份 hello_go_static，段表能数的内容 1.53 MB，另有 0.86 MB 是 ELF 符号表</text>

  <rect x="40" y="82" width="420" height="24" fill="#ffffff"/>
  <text x="40" y="99" font-size="12" font-weight="700" fill="#0f172a">段表内的内容（合计 1,533,725 字节）</text>

  <rect x="40" y="116" width="130" height="22" fill="#ffffff"/>
  <text x="40" y="132" font-size="11.5" fill="#334155">.gopclntab</text>
  <rect x="180" y="116" width="478" height="22" fill="#f59e0b"/>
  <rect x="664" y="116" width="180" height="22" fill="#ffffff"/>
  <text x="670" y="132" font-size="11.5" font-weight="700" fill="#92400e">665,474　43.4%</text>

  <rect x="40" y="146" width="130" height="22" fill="#ffffff"/>
  <text x="40" y="162" font-size="11.5" fill="#334155">.text</text>
  <rect x="180" y="146" width="462" height="22" fill="#3b82f6"/>
  <rect x="648" y="146" width="196" height="22" fill="#ffffff"/>
  <text x="654" y="162" font-size="11.5" font-weight="700" fill="#1e40af">643,537　42.0%</text>

  <rect x="40" y="176" width="130" height="22" fill="#ffffff"/>
  <text x="40" y="192" font-size="11.5" fill="#334155">.rodata</text>
  <rect x="180" y="176" width="159" height="22" fill="#22c55e"/>
  <rect x="345" y="176" width="200" height="22" fill="#ffffff"/>
  <text x="351" y="192" font-size="11.5" font-weight="700" fill="#166534">222,018　14.5%</text>

  <rect x="40" y="206" width="130" height="22" fill="#ffffff"/>
  <text x="40" y="222" font-size="11.5" fill="#334155">.typelink</text>
  <rect x="180" y="206" width="2" height="22" fill="#8b5cf6"/>
  <rect x="188" y="206" width="200" height="22" fill="#ffffff"/>
  <text x="188" y="222" font-size="11.5" fill="#6d28d9">2,056　0.1%</text>

  <rect x="40" y="236" width="130" height="22" fill="#ffffff"/>
  <text x="40" y="252" font-size="11.5" fill="#334155">.itablink / buildinfo</text>
  <rect x="180" y="236" width="2" height="22" fill="#8b5cf6"/>
  <rect x="188" y="236" width="260" height="22" fill="#ffffff"/>
  <text x="188" y="252" font-size="11.5" fill="#6d28d9">136 + 224，可以忽略</text>

  <rect x="40" y="274" width="420" height="24" fill="#ffffff"/>
  <text x="40" y="291" font-size="12" font-weight="700" fill="#0f172a">段表之外（合计 863,481 字节）</text>

  <rect x="40" y="308" width="130" height="22" fill="#ffffff"/>
  <text x="40" y="324" font-size="11.5" fill="#334155">.symtab / .strtab</text>
  <rect x="180" y="308" width="620" height="22" fill="#94a3b8"/>
  <rect x="806" y="308" width="180" height="22" fill="#ffffff"/>
  <text x="812" y="324" font-size="11.5" font-weight="700" fill="#475569">863,481　36.0%</text>

  <rect x="40" y="338" width="150" height="20" fill="#ffffff"/>
  <text x="40" y="352" font-size="10.5" fill="#64748b">（占整个文件的比例）</text>

  <rect x="40" y="366" width="920" height="22" fill="#fffbeb"/>
  <text x="40" y="381" font-size="11.5" fill="#78350f">-s -w 裁掉的是灰色这一条（0.86 MB），橙色那条纹丝不动：裁前裁后 .gopclntab 都是 0xa2782 = 665,474 字节</text>
  <rect x="40" y="392" width="920" height="22" fill="#ffffff"/>
  <text x="40" y="407" font-size="11.5" fill="#334155">所以「裁了符号，panic 栈为什么还有函数名和行号」的答案在这一行：那张表在 PT_LOAD 里，不在符号表里</text>
</svg>
