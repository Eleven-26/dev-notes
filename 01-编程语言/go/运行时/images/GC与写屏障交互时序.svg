<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="604" viewBox="0 0 1000 604" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="604" fill="#ffffff"/>
<defs>
<marker id="arRA3" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
</defs>

<text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">GC 与混合写屏障的交互时序</text>
<text x="40" y="58" font-size="13" fill="#64748b">用户协程、写屏障、GC 三方逐阶段配合 —— 屏障只在 ① 开启、④ 关闭，「分配太快」的账由分配者自己付</text>

<rect x="110" y="76" width="180" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="200" y="104" font-size="13" text-anchor="middle" fill="#0f172a">用户 goroutine</text>
<rect x="410" y="76" width="180" height="44" rx="8" fill="#ffedd5" stroke="#ea580c"/>
<text x="500" y="104" font-size="13" text-anchor="middle" fill="#0f172a">写屏障（混合）</text>
<rect x="710" y="76" width="180" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="800" y="104" font-size="13" text-anchor="middle" fill="#0f172a">GC（标记方）</text>

<line x1="200" y1="120" x2="200" y2="452" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="500" y1="120" x2="500" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="800" y1="120" x2="800" y2="560" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>

<line x1="800" y1="170" x2="508" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arRA3)"/>
<text x="654" y="162" font-size="12" text-anchor="middle" fill="#0f172a">① STW mark setup：开启写屏障</text>
<text x="654" y="190" font-size="11" text-anchor="middle" fill="#64748b">现有栈全部标黑</text>

<line x1="200" y1="236" x2="492" y2="236" stroke="#334155" stroke-width="1.5" marker-end="url(#arRA3)"/>
<text x="346" y="228" font-size="12" text-anchor="middle" fill="#0f172a">② 并发标记：改掉指针关系</text>
<text x="346" y="258" font-size="11" text-anchor="middle" fill="#64748b">黑对象指向白对象会丢失标记</text>

<line x1="508" y1="296" x2="792" y2="296" stroke="#334155" stroke-width="1.5" marker-end="url(#arRA3)"/>
<text x="650" y="288" font-size="12" text-anchor="middle" fill="#0f172a">屏障补记新产生的指针</text>

<rect x="90" y="330" width="220" height="56" rx="8" fill="#ffedd5" stroke="#ea580c"/>
<text x="200" y="352" font-size="12" text-anchor="middle" fill="#0f172a">③ 分配得太快</text>
<text x="200" y="374" font-size="11" text-anchor="middle" fill="#0f172a">堆增长快于后台标记进度</text>

<line x1="800" y1="420" x2="208" y2="420" stroke="#334155" stroke-width="1.5" marker-end="url(#arRA3)"/>
<text x="504" y="412" font-size="12" text-anchor="middle" fill="#0f172a">mutator assist：让分配者停下帮忙标记</text>
<text x="504" y="442" font-size="11" text-anchor="middle" fill="#64748b">谁分配谁付账 —— 按分配的字节数折算工作量</text>

<rect x="690" y="460" width="220" height="48" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="800" y="480" font-size="11" text-anchor="middle" fill="#0f172a">④ STW mark termination</text>
<text x="800" y="498" font-size="11" text-anchor="middle" fill="#0f172a">关闭屏障 · 收尾</text>

<rect x="690" y="518" width="220" height="48" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="800" y="538" font-size="11" text-anchor="middle" fill="#0f172a">⑤ 并发清扫（无 STW）</text>
<text x="800" y="556" font-size="11" text-anchor="middle" fill="#0f172a">死对象内存分批还给分配器</text>

<text x="40" y="588" font-size="11" fill="#64748b">小结：代价是「可能多留一轮垃圾」（浮动垃圾）；换来的是 STW 与栈大小解耦 —— 这才是「没有大停顿」的根本原因。</text>
</svg>
