<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

<text x="500" y="34" font-size="17" text-anchor="middle" font-weight="700" fill="#0f172a">同一个进程的三层内存口径：逐层向内收窄</text>

<rect x="40" y="56" width="920" height="356" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="60" y="86" font-size="14" font-weight="700" fill="#334155">RSS：内核视角的物理内存（ps -o rss）</text>

<rect x="70" y="100" width="600" height="292" rx="9" fill="#dbeafe" stroke="#2563eb"/>
<text x="88" y="128" font-size="14" font-weight="700" fill="#1e3a8a">MemStats.Sys：运行时累计向 OS 申请</text>
<text x="88" y="150" font-size="12" fill="#1e3a8a">含堆 + 栈 + mspan + GC 元数据</text>

<rect x="96" y="168" width="546" height="160" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
<text x="112" y="194" font-size="13" font-weight="700" fill="#312e81">HeapSys：堆申请过的历史峰值</text>
<text x="112" y="214" font-size="12" fill="#312e81">归还后不回落，不能当 RSS 用</text>

<rect x="122" y="230" width="494" height="80" rx="8" fill="#c7d2fe" stroke="#4338ca"/>
<text x="140" y="258" font-size="13" font-weight="700" fill="#312e81">HeapAlloc：活着的对象</text>
<text x="140" y="280" font-size="12" fill="#312e81">业务侧「内存用量」首选；HeapInuse - HeapAlloc 约等于碎片上界</text>

<text x="88" y="352" font-size="12" fill="#1e3a8a">HeapReleased：从 Sys 里已经还给 OS 的那部分（只涨它，不动 HeapSys）</text>
<text x="88" y="376" font-size="12" fill="#1e3a8a">HeapIdle - HeapReleased：攥在手里随时能复用的量</text>

<rect x="700" y="100" width="240" height="292" rx="9" fill="#fee2e2" stroke="#dc2626"/>
<text x="820" y="130" font-size="13" text-anchor="middle" font-weight="700" fill="#7f1d1d">MemStats 看不见的部分</text>
<text x="820" y="166" font-size="12" text-anchor="middle" fill="#7f1d1d">cgo 里的 C 分配</text>
<text x="820" y="192" font-size="12" text-anchor="middle" fill="#7f1d1d">syscall.Mmap 的映射页</text>
<text x="820" y="218" font-size="12" text-anchor="middle" fill="#7f1d1d">第三方分配器的 mmap</text>
<text x="820" y="256" font-size="12" text-anchor="middle" fill="#7f1d1d">它们都进 RSS，</text>
<text x="820" y="276" font-size="12" text-anchor="middle" fill="#7f1d1d">但一个字节都不进 Go 堆</text>
<text x="820" y="316" font-size="12" text-anchor="middle" fill="#7f1d1d">排查用 /proc/pid/smaps</text>
<text x="820" y="340" font-size="12" text-anchor="middle" fill="#7f1d1d">看匿名映射段</text>

<text x="820" y="376" font-size="12" text-anchor="middle" fill="#475569">Sys 含未触达的虚拟地址，</text>
<text x="820" y="396" font-size="12" text-anchor="middle" fill="#475569">所以 Sys 也不是 RSS</text>

<text x="500" y="440" font-size="12" text-anchor="middle" fill="#334155">包含关系成立，相等不成立：RSS ⊃ Sys ⊃ HeapSys ⊃ HeapAlloc，任何两个数对不上都正常，先问「看的是哪一层」</text>
</svg>
