<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="550" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">运行时：五条读线与 14 篇分组</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#64748b">先有进程，再谈排程与内存，最后谈怎么看进去；分组与读序取自第三节</text>

  <rect x="10" y="72" width="180" height="316" rx="9" fill="#f8fafc" stroke="#2563eb" stroke-width="1.4"/>
  <text x="100" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">线 1 · 从源码到进程</text>
  <rect x="20" y="112" width="160" height="34" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="100" y="133" text-anchor="middle" font-size="11" fill="#1e3a8a">① 从源码到main</text>
  <line x1="100" y1="146" x2="100" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="20" y="160" width="160" height="34" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="100" y="181" text-anchor="middle" font-size="11" fill="#1e3a8a">② 程序启动流程</text>
  <rect x="18" y="304" width="164" height="76" rx="7" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="100" y="326" text-anchor="middle" font-size="10.5" fill="#1d4ed8">那个 2.4 MB 的二进制</text>
  <text x="100" y="346" text-anchor="middle" font-size="10.5" fill="#1d4ed8">是怎么来的，main 之前</text>
  <text x="100" y="366" text-anchor="middle" font-size="10.5" fill="#1d4ed8">谁在跑</text>

  <rect x="210" y="72" width="180" height="316" rx="9" fill="#f8fafc" stroke="#16a34a" stroke-width="1.4"/>
  <text x="300" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">线 2 · 调度与时间</text>
  <rect x="220" y="112" width="160" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="300" y="133" text-anchor="middle" font-size="11" fill="#14532d">① GMP调度</text>
  <line x1="300" y1="146" x2="300" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="220" y="160" width="160" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="300" y="181" text-anchor="middle" font-size="11" fill="#14532d">② 定时器与超时</text>
  <line x1="300" y1="194" x2="300" y2="206" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="220" y="208" width="160" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="300" y="229" text-anchor="middle" font-size="11" fill="#14532d">③ 网络IO与netpoll</text>
  <rect x="218" y="304" width="164" height="76" rx="7" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="300" y="326" text-anchor="middle" font-size="10.5" fill="#166534">协程什么时候被允许</text>
  <text x="300" y="346" text-anchor="middle" font-size="10.5" fill="#166534">跑、时间到了为什么</text>
  <text x="300" y="366" text-anchor="middle" font-size="10.5" fill="#166534">晚到</text>

  <rect x="410" y="72" width="180" height="316" rx="9" fill="#f8fafc" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">线 3 · 内存</text>
  <rect x="420" y="112" width="160" height="34" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="133" text-anchor="middle" font-size="11" fill="#7c2d12">① 内存逃逸</text>
  <line x1="500" y1="146" x2="500" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="420" y="160" width="160" height="34" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="181" text-anchor="middle" font-size="11" fill="#7c2d12">② 内存分配器</text>
  <line x1="500" y1="194" x2="500" y2="206" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="420" y="208" width="160" height="34" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="229" text-anchor="middle" font-size="11" fill="#7c2d12">③ 垃圾回收机制</text>
  <line x1="500" y1="242" x2="500" y2="254" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="420" y="256" width="160" height="34" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="277" text-anchor="middle" font-size="11" fill="#7c2d12">④ 零拷贝</text>
  <rect x="418" y="304" width="164" height="76" rx="7" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="500" y="326" text-anchor="middle" font-size="10.5" fill="#9a3412">东西从哪来、住在哪、</text>
  <text x="500" y="346" text-anchor="middle" font-size="10.5" fill="#9a3412">谁收、能不能不搬</text>
  <text x="500" y="366" text-anchor="middle" font-size="10.5" fill="#9a3412">单向链，不能倒着读</text>

  <rect x="610" y="72" width="180" height="316" rx="9" fill="#f8fafc" stroke="#0f766e" stroke-width="1.4"/>
  <text x="700" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#115e59">线 4 · 类型系统的运行时侧</text>
  <rect x="620" y="112" width="160" height="34" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <text x="700" y="133" text-anchor="middle" font-size="11" fill="#115e59">① 反射</text>
  <line x1="700" y1="146" x2="700" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="620" y="160" width="160" height="34" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <text x="700" y="181" text-anchor="middle" font-size="11" fill="#115e59">② unsafe与内存布局</text>
  <rect x="618" y="304" width="164" height="76" rx="7" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
  <text x="700" y="326" text-anchor="middle" font-size="10.5" fill="#134e4a">编译期不知道类型的</text>
  <text x="700" y="346" text-anchor="middle" font-size="10.5" fill="#134e4a">时候怎么活</text>
  <text x="700" y="366" text-anchor="middle" font-size="10.5" fill="#134e4a">这条线只有 2 篇</text>

  <rect x="810" y="72" width="180" height="316" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="900" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">线 5 · 观测与排障</text>
  <rect x="820" y="112" width="160" height="34" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="900" y="133" text-anchor="middle" font-size="11" fill="#334155">① trace与运行时指标</text>
  <line x1="900" y1="146" x2="900" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="820" y="160" width="160" height="34" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="900" y="181" text-anchor="middle" font-size="11" fill="#334155">② pprof性能分析</text>
  <line x1="900" y1="194" x2="900" y2="206" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="820" y="208" width="160" height="34" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="900" y="229" text-anchor="middle" font-size="11" fill="#334155">③ GODEBUG与运行时观测</text>
  <rect x="818" y="304" width="164" height="76" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="900" y="326" text-anchor="middle" font-size="10.5" fill="#334155">出问题当场按什么</text>
  <text x="900" y="346" text-anchor="middle" font-size="10.5" fill="#334155">顺序看</text>
  <text x="900" y="366" text-anchor="middle" font-size="10.5" fill="#334155">三篇按窗口分，不重复</text>

  <rect x="10" y="400" width="980" height="30" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="500" y="420" text-anchor="middle" font-size="12" fill="#334155">线 5 三篇的每一个字段都来自前面四条线 —— 观测篇只读机制、不产生新机制；线 2 与线 3 平行，但共享程序启动流程这个起点</text>

  <rect x="10" y="442" width="980" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="26" y="466" font-size="12" fill="#334155">线 1 与线 2 之间不能跳：程序启动流程里的 schedinit 与 mallocinit 就是线 2、线 3 的第一页，先读调度篇会把它当黑盒背下来。</text>
  <text x="26" y="490" font-size="12" fill="#334155">线 3 内部是「逃逸 → 分配 → 回收」这条单向链；反过来读会把 size class 当成 GC 的概念。五条线 2 + 3 + 4 + 2 + 3 共 14 篇。</text>
  <text x="26" y="514" font-size="12" fill="#64748b">线 5 三篇的分工按窗口区分：trace 给顺序、pprof 给量、GODEBUG 给常驻且可开的实时行为，别当成三套重复的仪表盘。</text>
</svg>
