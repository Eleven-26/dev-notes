<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="510" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">pprof 的五种 profile：各测什么，以及哪两个默认不采样</text>

  <rect x="20" y="62" width="180" height="330" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="34" y="94" font-size="15" font-weight="bold" fill="#2563eb">cpu</text>
  <line x1="34" y1="108" x2="186" y2="108" stroke="#94a3b8" stroke-width="1"/>
  <text x="34" y="134" font-size="12" font-weight="bold" fill="#334155">采样什么</text>
  <text x="34" y="156" font-size="12" fill="#334155">定时 100Hz 打断</text>
  <text x="34" y="176" font-size="12" fill="#334155">记录当前调用栈</text>
  <text x="34" y="214" font-size="12" font-weight="bold" fill="#334155">回答什么</text>
  <text x="34" y="236" font-size="12" fill="#334155">CPU 时间花在</text>
  <text x="34" y="256" font-size="12" fill="#334155">哪个函数</text>
  <text x="34" y="306" font-size="12" font-weight="bold" fill="#334155">默认开吗</text>
  <text x="34" y="328" font-size="12" fill="#ea580c">要显式 Start</text>
  <text x="34" y="348" font-size="12" fill="#ea580c">CPUProfile</text>

  <rect x="210" y="62" width="180" height="330" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="224" y="94" font-size="15" font-weight="bold" fill="#16a34a">heap</text>
  <line x1="224" y1="108" x2="376" y2="108" stroke="#94a3b8" stroke-width="1"/>
  <text x="224" y="134" font-size="12" font-weight="bold" fill="#334155">采样什么</text>
  <text x="224" y="156" font-size="12" fill="#334155">每次分配按</text>
  <text x="224" y="176" font-size="12" fill="#334155">512KB 采样</text>
  <text x="224" y="214" font-size="12" font-weight="bold" fill="#334155">回答什么</text>
  <text x="224" y="236" font-size="12" fill="#334155">谁在分配内存</text>
  <text x="224" y="256" font-size="12" fill="#dc2626">（还要分两种口径）</text>
  <text x="224" y="306" font-size="12" font-weight="bold" fill="#334155">默认开吗</text>
  <text x="224" y="328" font-size="12" fill="#16a34a">默认开</text>

  <rect x="400" y="62" width="180" height="330" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="414" y="94" font-size="15" font-weight="bold" fill="#ea580c">goroutine</text>
  <line x1="414" y1="108" x2="566" y2="108" stroke="#94a3b8" stroke-width="1"/>
  <text x="414" y="134" font-size="12" font-weight="bold" fill="#334155">采样什么</text>
  <text x="414" y="156" font-size="12" fill="#334155">抓取时刻所有</text>
  <text x="414" y="176" font-size="12" fill="#334155">协程的栈</text>
  <text x="414" y="214" font-size="12" font-weight="bold" fill="#334155">回答什么</text>
  <text x="414" y="236" font-size="12" fill="#334155">协程在干什么</text>
  <text x="414" y="256" font-size="12" fill="#334155">卡在哪（查泄漏）</text>
  <text x="414" y="306" font-size="12" font-weight="bold" fill="#334155">默认开吗</text>
  <text x="414" y="328" font-size="12" fill="#16a34a">默认开</text>

  <rect x="590" y="62" width="180" height="330" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="604" y="94" font-size="15" font-weight="bold" fill="#dc2626">block</text>
  <line x1="604" y1="108" x2="756" y2="108" stroke="#94a3b8" stroke-width="1"/>
  <text x="604" y="134" font-size="12" font-weight="bold" fill="#334155">采样什么</text>
  <text x="604" y="156" font-size="12" fill="#334155">阻塞在同步</text>
  <text x="604" y="176" font-size="12" fill="#334155">原语上的时长</text>
  <text x="604" y="214" font-size="12" font-weight="bold" fill="#334155">回答什么</text>
  <text x="604" y="236" font-size="12" fill="#334155">卡在锁 / channel</text>
  <text x="604" y="256" font-size="12" fill="#334155">上多久</text>
  <text x="604" y="306" font-size="12" font-weight="bold" fill="#334155">默认开吗</text>
  <text x="604" y="328" font-size="12" font-weight="bold" fill="#dc2626">❌ 默认不采样</text>
  <text x="604" y="348" font-size="11" fill="#dc2626">SetBlockProfileRate</text>

  <rect x="780" y="62" width="180" height="330" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="794" y="94" font-size="15" font-weight="bold" fill="#dc2626">mutex</text>
  <line x1="794" y1="108" x2="946" y2="108" stroke="#94a3b8" stroke-width="1"/>
  <text x="794" y="134" font-size="12" font-weight="bold" fill="#334155">采样什么</text>
  <text x="794" y="156" font-size="12" fill="#334155">抢锁的等待</text>
  <text x="794" y="176" font-size="12" fill="#334155">时长</text>
  <text x="794" y="214" font-size="12" font-weight="bold" fill="#334155">回答什么</text>
  <text x="794" y="236" font-size="12" fill="#334155">哪把锁在争</text>
  <text x="794" y="256" font-size="12" fill="#334155">等了多久</text>
  <text x="794" y="306" font-size="12" font-weight="bold" fill="#334155">默认开吗</text>
  <text x="794" y="328" font-size="12" font-weight="bold" fill="#dc2626">❌ 默认不采样</text>
  <text x="794" y="348" font-size="11" fill="#dc2626">SetMutexProfile</text>
  <text x="794" y="364" font-size="11" fill="#dc2626">Fraction</text>

  <rect x="20" y="408" width="940" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="436" font-size="13" font-weight="bold" fill="#0f172a">⭐ 选种类的判据：CPU 高 → cpu；内存涨 → heap；协程数涨 / 卡住 → goroutine / block / mutex</text>
  <text x="40" y="460" font-size="13" fill="#334155">⚠️ 最容易搞错的一条：查「卡住」却采了 cpu profile —— CPU 很低、什么都看不出来</text>
  <text x="40" y="482" font-size="13" fill="#dc2626">⚠️ block 与 mutex 默认不采样：不开就是一份空文件，会误判成「没问题」</text>
</svg>
