<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="490" fill="#ffffff"/>

<text x="500" y="40" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">一个函数栈帧自顶向下包含六类内容</text>

<rect x="200" y="56" width="600" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

<rect x="220" y="68" width="560" height="54" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<text x="240" y="102" font-size="13" fill="#1e3a8a">① 函数调用的相关信息（返回地址、栈帧指针等）</text>

<rect x="220" y="128" width="560" height="54" rx="6" fill="#dcfce7" stroke="#16a34a"/>
<text x="240" y="162" font-size="13" fill="#14532d">② 函数参数、返回值、局部变量</text>

<rect x="220" y="188" width="560" height="54" rx="6" fill="#ffedd5" stroke="#ea580c"/>
<text x="240" y="222" font-size="13" fill="#7c2d12">③ 寄存器状态（需要保存 / 恢复的寄存器值）</text>

<rect x="220" y="248" width="560" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="240" y="282" font-size="13" fill="#334155">④ 协程的相关信息</text>

<rect x="220" y="308" width="560" height="54" rx="6" fill="#fee2e2" stroke="#dc2626"/>
<text x="240" y="342" font-size="13" fill="#7f1d1d">⑤ 异常处理的相关信息（panic / recover）</text>

<rect x="220" y="368" width="560" height="54" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<text x="240" y="402" font-size="13" fill="#1e3a8a">⑥ Go 特有的 defer 延迟调用信息</text>

<text x="500" y="466" font-size="12" text-anchor="middle" fill="#64748b">goroutine 栈初始仅 2KB，可自动扩缩容；扩容时会扫描并调整所有指向旧栈的指针</text>
</svg>
