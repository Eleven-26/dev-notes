<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">泛型的三块语法：类型参数、类型集、方法的限制</text>

  <rect x="30" y="62" width="300" height="300" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="46" y="94" font-size="15" font-weight="bold" fill="#2563eb">① 类型参数与推断</text>
  <line x1="46" y1="108" x2="314" y2="108" stroke="#94a3b8" stroke-width="1"/>
  <text x="46" y="138" font-size="12" fill="#0f172a">func Sum[T int|int64](xs []T) T</text>
  <text x="46" y="170" font-size="12" fill="#334155">调用时不用写 [int]</text>
  <text x="46" y="192" font-size="12" fill="#334155">—— 编译器从实参推断</text>
  <line x1="46" y1="212" x2="314" y2="212" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="46" y="242" font-size="12" font-weight="bold" fill="#334155">实测</text>
  <text x="46" y="266" font-size="12" fill="#0f172a">SumGen([]int{1,2,3})  = 6</text>
  <text x="46" y="288" font-size="12" fill="#0f172a">SumGen([]int64{10,20}) = 30</text>
  <text x="46" y="322" font-size="12" fill="#64748b">同一份逻辑，两种实例化</text>

  <rect x="350" y="62" width="300" height="300" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="366" y="94" font-size="15" font-weight="bold" fill="#16a34a">② 类型集与 ~T</text>
  <line x1="366" y1="108" x2="634" y2="108" stroke="#94a3b8" stroke-width="1"/>
  <text x="366" y="138" font-size="12" fill="#0f172a">int | int64</text>
  <text x="366" y="158" font-size="12" fill="#334155">→ 只匹配这两个具体类型</text>
  <text x="366" y="190" font-size="12" font-weight="bold" fill="#16a34a">~int</text>
  <text x="366" y="210" font-size="12" fill="#334155">→ 匹配所有「底层为 int」的类型</text>
  <text x="366" y="230" font-size="12" fill="#334155">   （含 type MyInt int）</text>
  <line x1="366" y1="250" x2="634" y2="250" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="366" y="278" font-size="12" font-weight="bold" fill="#334155">实测</text>
  <text x="366" y="302" font-size="12" fill="#0f172a">SumUnderlying([]MyInt{4,5}) = 9</text>
  <text x="366" y="336" font-size="12" fill="#64748b">⚠️ ~ 只能出现在接口（约束）里</text>

  <rect x="670" y="62" width="300" height="300" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="686" y="94" font-size="15" font-weight="bold" fill="#dc2626">③ 方法只能用外层 T</text>
  <line x1="686" y1="108" x2="954" y2="108" stroke="#94a3b8" stroke-width="1"/>
  <text x="686" y="138" font-size="12" fill="#16a34a">✅ func (s *Stack[T]) Push(v T)</text>
  <text x="686" y="160" font-size="12" fill="#334155">方法可以复用外层类型的 T</text>
  <text x="686" y="196" font-size="12" fill="#dc2626">❌ func (b Box[T]) Map[U any](...)</text>
  <text x="686" y="218" font-size="12" fill="#334155">方法不能新增自己的类型参数</text>
  <line x1="686" y1="238" x2="954" y2="238" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="686" y="266" font-size="12" font-weight="bold" fill="#334155">编译错误原文</text>
  <text x="686" y="290" font-size="12" fill="#dc2626">method must have no</text>
  <text x="686" y="310" font-size="12" fill="#dc2626">type parameters</text>
  <text x="686" y="344" font-size="12" fill="#64748b">要「变换」就写顶层泛型函数</text>

  <rect x="30" y="378" width="940" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="406" font-size="14" font-weight="bold" fill="#0f172a">⭐ 约束（constraint）就是一种接口 —— 理解了这一句，泛型的语法就只剩上面这三块</text>
  <text x="50" y="432" font-size="13" fill="#334155">推论：约束里可以写方法；带类型集的接口只能当约束、不能声明变量；any 只是 interface{} 的别名</text>
</svg>
