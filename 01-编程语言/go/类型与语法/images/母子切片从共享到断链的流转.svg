<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect width="1000" height="490" fill="#ffffff"/>
<defs>
<marker id="arMS" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
</defs>

<text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">母子切片：从共享底层数组到扩容断链的五步流转</text>
<text x="40" y="58" font-size="13" fill="#64748b">每一步的读数都取自 3.2 那段程序的真实输出，只有第五步之后两者才彻底分开</text>

<rect x="40" y="92" width="172" height="256" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="40" y="92" width="172" height="30" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="126" y="112" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e3a8a">① make 并写入</text>
<text x="50" y="144" font-size="11" fill="#334155">s := make([]int, 3, 5)</text>
<text x="50" y="166" font-size="11" fill="#334155">s[i] = i + 1</text>
<text x="50" y="188" font-size="11" fill="#0f172a">len=3  cap=5</text>
<text x="50" y="210" font-size="11" fill="#0f172a">s = [1 2 3]</text>

<line x1="212" y1="220" x2="222" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arMS)"/>

<rect x="224" y="92" width="172" height="256" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="224" y="92" width="172" height="30" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="310" y="112" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e3a8a">② 切出子切片</text>
<text x="234" y="144" font-size="11" fill="#334155">sub := s[1:3]</text>
<text x="234" y="166" font-size="11" fill="#0f172a">len=2  cap=4</text>
<text x="234" y="188" font-size="11" fill="#334155">Data 偏移 1×elemsize</text>
<text x="234" y="210" font-size="11" fill="#16a34a">&amp;s[1] == &amp;sub[0]</text>
<text x="234" y="232" font-size="11" fill="#16a34a">true 同一个地址</text>

<line x1="396" y1="220" x2="406" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arMS)"/>

<rect x="408" y="92" width="172" height="256" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="408" y="92" width="172" height="30" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="494" y="112" font-size="11" font-weight="bold" text-anchor="middle" fill="#14532d">③ sub[0] = 8</text>
<text x="418" y="144" font-size="11" fill="#334155">sub[0] = 8</text>
<text x="418" y="166" font-size="11" fill="#0f172a">s = [1 8 3]</text>
<text x="418" y="188" font-size="11" fill="#334155">改子切片 = 改母切片</text>
<text x="418" y="210" font-size="11" fill="#64748b">同一块内存，</text>
<text x="418" y="232" font-size="11" fill="#64748b">谁改都算数</text>

<line x1="580" y1="220" x2="590" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arMS)"/>

<rect x="592" y="92" width="172" height="256" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="592" y="92" width="172" height="30" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="678" y="112" font-size="11" font-weight="bold" text-anchor="middle" fill="#854d0e">④ append(sub, 6, 7)</text>
<text x="602" y="144" font-size="11" fill="#0f172a">len 2→4，cap=4</text>
<text x="602" y="166" font-size="11" fill="#0f172a">刚好填满，不扩容</text>
<text x="602" y="188" font-size="11" fill="#334155">s = [1 8 3]</text>
<text x="602" y="210" font-size="11" fill="#334155">sub = [8 3 6 7]</text>
<text x="602" y="232" font-size="11" fill="#b45309">6、7 已写进 s 的底</text>
<text x="602" y="254" font-size="11" fill="#b45309">层数组，可 s 的 len</text>
<text x="602" y="276" font-size="11" fill="#b45309">还是 3，读不到</text>

<line x1="764" y1="220" x2="774" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arMS)"/>

<rect x="776" y="92" width="172" height="256" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="776" y="92" width="172" height="30" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="862" y="112" font-size="11" font-weight="bold" text-anchor="middle" fill="#7f1d1d">⑤ append(sub, 9)</text>
<text x="786" y="144" font-size="11" fill="#7f1d1d">len == cap == 4</text>
<text x="786" y="166" font-size="11" fill="#7f1d1d">触发扩容</text>
<text x="786" y="188" font-size="11" fill="#334155">sub[0] = 100 之后</text>
<text x="786" y="210" font-size="11" fill="#334155">sub = [100 3 6 7 9]</text>
<text x="786" y="232" font-size="11" fill="#dc2626">&amp;s[1] == &amp;sub[0]</text>
<text x="786" y="254" font-size="11" fill="#dc2626">false 地址已分离</text>

<rect x="40" y="364" width="724" height="66" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="52" y="388" font-size="11" fill="#14532d">①~④ 全程共用同一块底层数组：改元素互相看得见，未扩容时 append 也写进同一块</text>
<text x="52" y="410" font-size="11" fill="#14532d">但「看不见」不等于「没写入」——cap 管物理上能写到哪，len 管逻辑上能读多远</text>

<rect x="776" y="364" width="172" height="66" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="786" y="388" font-size="11" font-weight="bold" fill="#7f1d1d">⑤ 就是分水岭</text>
<text x="786" y="410" font-size="11" fill="#7f1d1d">之前同呼吸，</text>
<text x="786" y="428" font-size="11" fill="#7f1d1d">之后互不影响</text>

<text x="40" y="466" font-size="11" fill="#64748b">自查手法：打印 &amp;s[i] 与 &amp;sub[j]，地址相同即共享、不同即已分离；想隔离就用 slices.Clone 或三参数切片把 cap 卡死。</text>
</svg>
