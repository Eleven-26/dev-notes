<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect width="1000" height="440" fill="#ffffff"/>
<defs>
<marker id="arSH" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
</defs>

<text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">切片的三字段头与共享底层数组</text>
<text x="40" y="58" font-size="13" fill="#64748b">s := make([]int, 3, 5) 写入 [1 2 3]；sub := s[1:3] → Data = 首地址 + 1 × elemsize，len = 2，cap = 4</text>

<rect x="40" y="88" width="420" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="40" y="88" width="420" height="26" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="250" y="106" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a5f">切片头 s = make([]int, 3, 5)</text>
<rect x="48" y="122" width="128" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="112" y="140" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">Data</text>
<text x="112" y="158" font-size="10" text-anchor="middle" fill="#334155">数组首地址</text>
<rect x="184" y="122" width="128" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="248" y="140" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">Len</text>
<text x="248" y="158" font-size="11" text-anchor="middle" fill="#334155">3</text>
<rect x="320" y="122" width="128" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="384" y="140" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">Cap</text>
<text x="384" y="158" font-size="11" text-anchor="middle" fill="#334155">5</text>

<rect x="40" y="196" width="420" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="40" y="196" width="420" height="26" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="250" y="214" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">切片头 sub = s[1:3]</text>
<rect x="48" y="230" width="128" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="112" y="248" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">Data</text>
<text x="112" y="266" font-size="10" text-anchor="middle" fill="#334155">偏移 1 × elemsize</text>
<rect x="184" y="230" width="128" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="248" y="248" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">Len</text>
<text x="248" y="266" font-size="11" text-anchor="middle" fill="#334155">3 - 1 = 2</text>
<rect x="320" y="230" width="128" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="384" y="248" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">Cap</text>
<text x="384" y="266" font-size="11" text-anchor="middle" fill="#334155">5 - 1 = 4</text>

<text x="760" y="88" font-size="12" text-anchor="middle" fill="#0f172a">底层数组（数据只有一份）</text>
<rect x="560" y="96" width="80" height="64" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<text x="600" y="116" font-size="10" text-anchor="middle" fill="#64748b">索引 0</text>
<text x="600" y="144" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a5f">1</text>
<rect x="640" y="96" width="80" height="64" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<text x="680" y="116" font-size="10" text-anchor="middle" fill="#64748b">索引 1</text>
<text x="680" y="144" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a5f">2</text>
<rect x="720" y="96" width="80" height="64" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<text x="760" y="116" font-size="10" text-anchor="middle" fill="#64748b">索引 2</text>
<text x="760" y="144" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a5f">3</text>
<rect x="800" y="96" width="80" height="64" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="840" y="116" font-size="10" text-anchor="middle" fill="#64748b">索引 3</text>
<text x="840" y="144" font-size="12" text-anchor="middle" fill="#94a3b8">预留</text>
<rect x="880" y="96" width="80" height="64" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="920" y="116" font-size="10" text-anchor="middle" fill="#64748b">索引 4</text>
<text x="920" y="144" font-size="12" text-anchor="middle" fill="#94a3b8">预留</text>

<line x1="460" y1="128" x2="556" y2="128" stroke="#334155" stroke-width="1.5" marker-end="url(#arSH)"/>
<text x="507" y="120" font-size="10" text-anchor="middle" fill="#64748b">Data 指向</text>
<line x1="460" y1="238" x2="680" y2="238" stroke="#334155" stroke-width="1.5"/>
<line x1="680" y1="238" x2="680" y2="164" stroke="#334155" stroke-width="1.5" marker-end="url(#arSH)"/>
<text x="565" y="230" font-size="10" text-anchor="middle" fill="#64748b">Data 指向索引 1</text>

<rect x="40" y="300" width="920" height="98" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="60" y="324" font-size="12" fill="#0f172a">共享验证：&amp;s[1] == &amp;sub[0] → true；sub[0] = 8 后母切片输出 [1 8 3] —— 改子就是改母</text>
<text x="60" y="348" font-size="12" fill="#0f172a">两个范围：cap 管「物理上能写到哪」，len 管「逻辑上能读多远」——append 进 len~cap 时母切片读不到</text>
<text x="60" y="372" font-size="12" fill="#0f172a">断链分水岭：len == cap 后再 append 触发扩容，Data 换新数组，&amp;s[1] == &amp;sub[0] → false</text>

<text x="40" y="422" font-size="11" fill="#64748b">小结：三字段的算法取自 1.1 / 2.1 / 3.1，实测读数（true / false、[1 8 3]）取自 3.2 的真实输出</text>
</svg>
