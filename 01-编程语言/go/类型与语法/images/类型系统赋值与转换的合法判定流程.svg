<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect width="1000" height="620" fill="#ffffff"/>
<defs>
<marker id="arCV" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
</defs>

<text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">赋值与转换的合法判定：三个问题依次问下去</text>
<text x="40" y="58" font-size="13" fill="#64748b">向右走出的是「这一条成立时的结论」，向下走的是「继续问下一条」；最底下是编译器原话</text>

<rect x="60" y="88" width="240" height="40" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="180" y="113" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a5f">写法：b = a　或　Y(x)</text>

<rect x="60" y="148" width="240" height="40" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="180" y="173" font-size="11" text-anchor="middle" fill="#854d0e">① 两个类型完全相同？</text>

<rect x="60" y="208" width="240" height="40" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="180" y="233" font-size="11" text-anchor="middle" fill="#854d0e">② 底层类型相同？</text>

<rect x="60" y="268" width="240" height="40" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="180" y="293" font-size="11" text-anchor="middle" fill="#854d0e">③ 至少一方是未命名类型？</text>

<rect x="60" y="328" width="240" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="180" y="353" font-size="11" text-anchor="middle" fill="#334155">三条判据全不成立</text>

<line x1="180" y1="128" x2="180" y2="144" stroke="#334155" stroke-width="1.5" marker-end="url(#arCV)"/>
<line x1="180" y1="188" x2="180" y2="204" stroke="#334155" stroke-width="1.5" marker-end="url(#arCV)"/>
<line x1="180" y1="248" x2="180" y2="264" stroke="#334155" stroke-width="1.5" marker-end="url(#arCV)"/>
<line x1="180" y1="308" x2="180" y2="324" stroke="#334155" stroke-width="1.5" marker-end="url(#arCV)"/>
<text x="188" y="140" font-size="10" fill="#64748b">否</text>
<text x="188" y="200" font-size="10" fill="#64748b">否</text>
<text x="188" y="260" font-size="10" fill="#64748b">否</text>
<text x="188" y="320" font-size="10" fill="#64748b">否</text>

<rect x="340" y="148" width="320" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="356" y="165" font-size="11" font-weight="bold" fill="#14532d">赋值 ✅</text>
<text x="356" y="182" font-size="10" fill="#14532d">命名类型只有自己和自己相同</text>

<rect x="340" y="208" width="320" height="40" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="356" y="225" font-size="11" font-weight="bold" fill="#1e3a5f">转换 ✅</text>
<text x="356" y="242" font-size="10" fill="#1e3a5f">底层类型相同即可，忽略 struct tag</text>

<rect x="340" y="268" width="320" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="356" y="285" font-size="11" font-weight="bold" fill="#14532d">赋值 ✅</text>
<text x="356" y="302" font-size="10" fill="#14532d">底层类型相同 + 至少一方是未命名类型</text>

<rect x="340" y="328" width="320" height="40" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="356" y="345" font-size="11" font-weight="bold" fill="#7f1d1d">赋值、转换都不合法</text>
<text x="356" y="362" font-size="10" fill="#7f1d1d">元素类型不同的切片只能 for 循环逐个转</text>

<line x1="300" y1="168" x2="336" y2="168" stroke="#334155" stroke-width="1.5" marker-end="url(#arCV)"/>
<line x1="300" y1="228" x2="336" y2="228" stroke="#334155" stroke-width="1.5" marker-end="url(#arCV)"/>
<line x1="300" y1="288" x2="336" y2="288" stroke="#334155" stroke-width="1.5" marker-end="url(#arCV)"/>
<line x1="300" y1="348" x2="336" y2="348" stroke="#334155" stroke-width="1.5" marker-end="url(#arCV)"/>

<rect x="680" y="88" width="280" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="694" y="112" font-size="12" font-weight="bold" fill="#0f172a">转换的三条合法条件（4.1）</text>
<text x="694" y="136" font-size="11" fill="#334155">① 底层类型相同（忽略 struct tag）</text>
<text x="694" y="156" font-size="11" fill="#334155">② 都是未命名指针类型，且基类型</text>
<text x="700" y="174" font-size="11" fill="#334155">的底层类型相同（如 *A → *[]int）</text>
<text x="694" y="194" font-size="11" fill="#334155">③ 数值之间互转；整数 ↔ string</text>
<text x="700" y="212" font-size="11" fill="#334155">转的是码点；string ↔ []byte / []rune</text>
<text x="694" y="238" font-size="11" fill="#b45309">常量转换还要求值能被精确表示：</text>
<text x="700" y="256" font-size="11" fill="#b45309">int(3.99) 编译不过，先赋给变量</text>
<text x="694" y="282" font-size="11" fill="#334155">string ↔ []byte / []rune 一定拷贝：</text>
<text x="700" y="300" font-size="11" fill="#334155">两者共享底层数组吗？false</text>
<text x="694" y="326" font-size="11" fill="#64748b">转换即分配，所以热路径上 Sprintf</text>
<text x="700" y="344" font-size="11" fill="#64748b">不如 io.WriteString</text>

<rect x="40" y="392" width="920" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="60" y="416" font-size="12" font-weight="bold" fill="#0f172a">编译器原话（真实报错本身就是判据）</text>
<text x="60" y="440" font-size="11" fill="#7f1d1d">int("65") → cannot convert "65" (untyped string constant) to type int　想要字符串数字用 strconv.Itoa(65) = "65"</text>
<text x="60" y="462" font-size="11" fill="#7f1d1d">[]int([]MyInt{1,2,3}) → cannot convert a (variable of type []MyInt) to type []int　元素类型不同的切片只能逐个转</text>
<text x="60" y="484" font-size="11" fill="#7f1d1d">int(3.99) → cannot convert 3.99 (untyped float constant) to type int　改成变量后 int(fv) = 3（截断，不是四舍五入）</text>
<text x="60" y="506" font-size="11" fill="#7f1d1d">string(65) → go vet: conversion from untyped int to string yields a string of one rune, not a string of digits</text>
<text x="60" y="528" font-size="11" fill="#14532d">string(rune(65)) = "A"　string([]byte{0xE4,0xB8,0xAD}) = "中"　改了 bs[0]，已生成的 s 还是 "Abc"</text>
<text x="60" y="550" font-size="11" fill="#334155">U1 → U2 只差一个 json 标签：赋值报错、reflect 却能看到 name 与 nick；X → Y 同样只有标签不同，Y(x) 转换通过 = {A:v}</text>

<text x="40" y="598" font-size="11" fill="#64748b">小结：赋值看「类型相同」或「底层相同且一方未命名」，转换只看底层类型相同（忽略 struct tag）——读数取自第三、四节的实测</text>
</svg>
