<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">泛型 / 反射 / 代码生成：三条复用路线的取舍</text>

  <rect x="30" y="62" width="300" height="290" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="46" y="94" font-size="16" font-weight="bold" fill="#16a34a">泛型</text>
  <line x1="46" y1="110" x2="314" y2="110" stroke="#94a3b8" stroke-width="1"/>
  <text x="46" y="140" font-size="12" font-weight="bold" fill="#334155">类型何时确定</text>
  <text x="46" y="160" font-size="12" fill="#16a34a">编译期</text>
  <text x="46" y="192" font-size="12" font-weight="bold" fill="#334155">类型安全</text>
  <text x="46" y="212" font-size="12" fill="#16a34a">✅ 编译器检查</text>
  <text x="46" y="244" font-size="12" font-weight="bold" fill="#334155">分配开销</text>
  <text x="46" y="264" font-size="12" fill="#16a34a">零装箱（实测 0 allocs）</text>
  <text x="46" y="296" font-size="12" font-weight="bold" fill="#334155">表达力</text>
  <text x="46" y="316" font-size="12" fill="#dc2626">拿不到 tag、不能枚举字段</text>
  <text x="46" y="338" font-size="12" fill="#64748b">典型：容器 / 算法 / 工具函数</text>

  <rect x="350" y="62" width="300" height="290" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="366" y="94" font-size="16" font-weight="bold" fill="#dc2626">反射</text>
  <line x1="366" y1="110" x2="634" y2="110" stroke="#94a3b8" stroke-width="1"/>
  <text x="366" y="140" font-size="12" font-weight="bold" fill="#334155">类型何时确定</text>
  <text x="366" y="160" font-size="12" fill="#dc2626">运行时</text>
  <text x="366" y="192" font-size="12" font-weight="bold" fill="#334155">类型安全</text>
  <text x="366" y="212" font-size="12" fill="#dc2626">❌ 运行时才暴露</text>
  <text x="366" y="244" font-size="12" font-weight="bold" fill="#334155">分配开销</text>
  <text x="366" y="264" font-size="12" fill="#334155">代价主要在时间，不在分配</text>
  <text x="366" y="284" font-size="11" fill="#64748b">（装箱常被编译器优化掉）</text>
  <text x="366" y="312" font-size="12" font-weight="bold" fill="#334155">表达力</text>
  <text x="366" y="332" font-size="12" fill="#16a34a">最强：能拿到一切</text>
  <text x="366" y="338" font-size="12" fill="#64748b"></text>

  <rect x="670" y="62" width="300" height="290" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="686" y="94" font-size="16" font-weight="bold" fill="#2563eb">代码生成</text>
  <line x1="686" y1="110" x2="954" y2="110" stroke="#94a3b8" stroke-width="1"/>
  <text x="686" y="140" font-size="12" font-weight="bold" fill="#334155">类型何时确定</text>
  <text x="686" y="160" font-size="12" fill="#2563eb">编译前（生成时）</text>
  <text x="686" y="192" font-size="12" font-weight="bold" fill="#334155">类型安全</text>
  <text x="686" y="212" font-size="12" fill="#16a34a">✅ 生成的是普通代码</text>
  <text x="686" y="244" font-size="12" font-weight="bold" fill="#334155">分配开销</text>
  <text x="686" y="264" font-size="12" fill="#16a34a">零</text>
  <text x="686" y="296" font-size="12" font-weight="bold" fill="#334155">表达力</text>
  <text x="686" y="316" font-size="12" fill="#334155">受生成器能力限制</text>
  <text x="686" y="338" font-size="12" fill="#64748b">典型：stringer / mock / wire</text>

  <rect x="30" y="368" width="940" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="394" font-size="13" font-weight="bold" fill="#0f172a">⭐ 判据：写代码时已知类型、只想复用逻辑 → 泛型；写代码时未知（要运行时看 tag/字段）→ 反射；要给每个类型生成手写般的代码 → 代码生成</text>
  <text x="50" y="414" font-size="12" fill="#64748b">⚠️ 反射的实测数字与两个微基准陷阱见 反射与unsafe.md 第七节，本篇不重复</text>
</svg>
