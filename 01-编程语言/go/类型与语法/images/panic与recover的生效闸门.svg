<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
<defs>
<marker id="arc" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
</defs>

<text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">panic 之后：栈展开与 recover 的生效判定点</text>
<text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">两闸门：同一条 goroutine 的 defer 链，且 recover 必须被那个 deferred 函数直接调用</text>

<rect x="330" y="80" width="340" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="500" y="104" font-size="12" fill="#334155" text-anchor="middle">panic 被抛出</text>
<text x="500" y="126" font-size="12" fill="#334155" text-anchor="middle">动态类型可以是任意值，实测有 string</text>

<rect x="330" y="164" width="340" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="500" y="188" font-size="12" fill="#1e3a8a" text-anchor="middle">闸门一：只走当前 goroutine 的 defer 链</text>
<text x="500" y="210" font-size="12" fill="#1e3a8a" text-anchor="middle">跨协程无效，main 也拦不住子协程</text>

<rect x="290" y="248" width="420" height="64" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="500" y="274" font-size="12" font-weight="bold" fill="#854d0e" text-anchor="middle">闸门二：recover 由「被直接 defer 的那个函数」调用吗</text>
<text x="500" y="298" font-size="12" fill="#854d0e" text-anchor="middle">defer 的函数里再套一层普通调用，就取不到现场</text>

<rect x="60" y="344" width="360" height="100" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="240" y="370" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">是：接住，函数继续正常返回</text>
<text x="240" y="398" font-size="12" fill="#14532d" text-anchor="middle">实测 recover 到 boom，动态类型 string</text>
<text x="240" y="422" font-size="12" fill="#14532d" text-anchor="middle">命名返回值可被改写：n=-1 且 err 非空</text>

<rect x="580" y="344" width="360" height="100" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="760" y="370" font-size="13" font-weight="bold" fill="#7f1d1d" text-anchor="middle">否：recover 取到 &lt;nil&gt;，panic 继续逃</text>
<text x="760" y="398" font-size="12" fill="#7f1d1d" text-anchor="middle">实测 helper 里 recover 得 &lt;nil&gt;</text>
<text x="760" y="422" font-size="12" fill="#7f1d1d" text-anchor="middle">boom2 逃到了上层 defer 才被接住</text>

<rect x="290" y="472" width="420" height="60" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="500" y="498" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">一路没人接：整个进程退出，实测退出码 2</text>
<text x="500" y="520" font-size="12" fill="#7f1d1d" text-anchor="middle">fatal error 一类根本不给接的机会</text>

<line x1="500" y1="136" x2="500" y2="162" stroke="#334155" stroke-width="1.6" marker-end="url(#arc)"/>
<line x1="500" y1="220" x2="500" y2="246" stroke="#334155" stroke-width="1.6" marker-end="url(#arc)"/>
<line x1="400" y1="312" x2="250" y2="342" stroke="#334155" stroke-width="1.6" marker-end="url(#arc)"/>
<line x1="600" y1="312" x2="750" y2="342" stroke="#334155" stroke-width="1.6" marker-end="url(#arc)"/>
<line x1="760" y1="444" x2="620" y2="480" stroke="#334155" stroke-width="1.6" marker-end="url(#arc)"/>

<rect x="60" y="552" width="880" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="76" y="578" font-size="12" fill="#334155">工程口径：recover 是给「协程边界」和「框架出口」用的兜底，不是把 error 换成异常的手段</text>
<text x="76" y="602" font-size="12" fill="#334155">defer 里再 panic 会顶掉原现场，实测顶层只看到第二个 panic</text>
<text x="76" y="626" font-size="12" fill="#64748b">读数为容器内 go1.26.8 实跑；goroutine 编号每次运行不同，属示意</text>
</svg>
