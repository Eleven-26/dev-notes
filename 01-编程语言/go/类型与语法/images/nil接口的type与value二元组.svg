<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
<defs>
<marker id="arA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
</defs>

<text x="500" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">interface 的 nil 判定：(type, value) 二元组</text>
<text x="500" y="62" font-size="13" text-anchor="middle" fill="#64748b">i == nil 只看两个字是否全 0；类型字非 0，接口就必然不是 nil</text>

<rect x="390" y="86" width="220" height="44" rx="8" fill="#f1f5f9" stroke="#64748b"/>
<text x="500" y="113" font-size="13" text-anchor="middle" fill="#0f172a">接口变量 i（两个字）</text>

<line x1="500" y1="130" x2="500" y2="162" stroke="#334155" stroke-width="1.5" marker-end="url(#arA)"/>

<rect x="330" y="164" width="340" height="62" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="500" y="190" font-size="13" font-weight="bold" text-anchor="middle" fill="#854d0e">判定：类型字 == 0 ？</text>
<text x="500" y="212" font-size="12" text-anchor="middle" fill="#854d0e">== 这个比较读的就是这一位</text>

<line x1="330" y1="195" x2="150" y2="195" stroke="#334155" stroke-width="1.5"/>
<line x1="150" y1="195" x2="150" y2="238" stroke="#334155" stroke-width="1.5" marker-end="url(#arA)"/>
<rect x="199" y="174" width="88" height="17" fill="#ffffff"/>
<text x="243" y="186" font-size="12" text-anchor="middle" fill="#16a34a">是（两字都空）</text>

<rect x="30" y="240" width="260" height="120" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="160" y="266" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">i == nil → true（真 nil）</text>
<text x="160" y="292" font-size="12" text-anchor="middle" fill="#334155">接口从未被赋值（零值）</text>
<text x="160" y="316" font-size="12" text-anchor="middle" fill="#334155">动态类型打印为 &lt;nil&gt;</text>
<text x="160" y="340" font-size="12" text-anchor="middle" fill="#334155">此时调方法直接 panic</text>

<line x1="670" y1="195" x2="850" y2="195" stroke="#334155" stroke-width="1.5"/>
<line x1="850" y1="195" x2="850" y2="238" stroke="#334155" stroke-width="1.5" marker-end="url(#arA)"/>
<rect x="746" y="174" width="28" height="17" fill="#ffffff"/>
<text x="760" y="186" font-size="12" text-anchor="middle" fill="#dc2626">否</text>

<rect x="690" y="240" width="280" height="120" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="830" y="266" font-size="13" font-weight="bold" text-anchor="middle" fill="#7f1d1d">i == nil → false</text>
<text x="830" y="292" font-size="12" text-anchor="middle" fill="#334155">即使数据字是 nil 也一样</text>
<text x="830" y="316" font-size="12" text-anchor="middle" fill="#334155">var p *MyErr = nil</text>
<text x="830" y="340" font-size="12" text-anchor="middle" fill="#334155">var e error = p → e == nil 为 false（实测）</text>

<line x1="830" y1="360" x2="830" y2="396" stroke="#334155" stroke-width="1.5" marker-end="url(#arA)"/>

<rect x="640" y="398" width="330" height="66" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="805" y="424" font-size="12" text-anchor="middle" fill="#7f1d1d">调方法时解引用 nil 数据字</text>
<text x="805" y="448" font-size="12" text-anchor="middle" fill="#7f1d1d">panic：invalid memory address（运行时才炸）</text>

<rect x="330" y="300" width="310" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="485" y="326" font-size="12" text-anchor="middle" fill="#334155">最常见事故：函数把具体类型的</text>
<text x="485" y="348" font-size="12" text-anchor="middle" fill="#334155">nil 指针当 error 返回</text>
<text x="485" y="372" font-size="12" text-anchor="middle" fill="#334155">badErr() == nil → false（实测）</text>

<rect x="30" y="486" width="940" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
<text x="50" y="510" font-size="12" fill="#0f172a">判据①：返回 error 的函数要么返回 nil 常量，要么返回真实现了接口的值，别把可能为 nil 的具体类型指针原样 return</text>
<text x="50" y="534" font-size="12" fill="#0f172a">判据②：要甄别"装着 nil 的接口"用 reflect.ValueOf(i).IsNil() —— 实测输出 true（接口本身却 != nil）</text>
</svg>
