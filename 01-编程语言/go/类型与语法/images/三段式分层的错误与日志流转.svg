<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="464" viewBox="0 0 1000 464" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="464" fill="#ffffff"/>
<defs>
<marker id="arTG" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
</defs>

<text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">三段式分层：唯一日志点、唯一 code 映射点、栈只打一次</text>
<text x="40" y="58" font-size="13" fill="#64748b">容器内 httptest 真服务实测 6 次请求；响应体泄漏底层细节=false，链文本只进服务端日志行</text>

<path d="M870,108 L870,84 L115,84 L115,108" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arTG)"/>
<text x="430" y="78" font-size="11" fill="#64748b">err 逐层上抛，%w 续链</text>

<rect x="40" y="110" width="150" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="115" y="128" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">client</text>
<text x="115" y="148" font-size="11" fill="#334155" text-anchor="middle">6 次 http.Get</text>
<text x="115" y="166" font-size="11" fill="#64748b" text-anchor="middle">id=1 / 404 / 500…</text>

<line x1="192" y1="145" x2="218" y2="145" stroke="#334155" stroke-width="1.6" marker-end="url(#arTG)"/>

<rect x="220" y="110" width="170" height="70" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="305" y="128" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">recoverMW</text>
<text x="305" y="148" font-size="11" fill="#7f1d1d" text-anchor="middle">框架出口</text>
<text x="305" y="166" font-size="11" fill="#7f1d1d" text-anchor="middle">唯一打栈的地方</text>

<line x1="392" y1="145" x2="418" y2="145" stroke="#334155" stroke-width="1.6" marker-end="url(#arTG)"/>

<rect x="420" y="110" width="150" height="70" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="495" y="128" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">userHandler</text>
<text x="495" y="148" font-size="11" fill="#1e3a8a" text-anchor="middle">transport 层</text>
<text x="495" y="166" font-size="11" fill="#1e3a8a" text-anchor="middle">只调 writeErr</text>

<line x1="572" y1="145" x2="598" y2="145" stroke="#334155" stroke-width="1.6" marker-end="url(#arTG)"/>

<rect x="600" y="110" width="150" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="675" y="128" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">LoadUser 业务层</text>
<text x="675" y="148" font-size="11" fill="#14532d" text-anchor="middle">包装、不打日志</text>
<text x="675" y="166" font-size="11" fill="#14532d" text-anchor="middle">Is 命中就换语义</text>

<line x1="752" y1="145" x2="778" y2="145" stroke="#334155" stroke-width="1.6" marker-end="url(#arTG)"/>

<rect x="780" y="110" width="180" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="870" y="128" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">getUserRow</text>
<text x="870" y="148" font-size="11" fill="#14532d" text-anchor="middle">存储层</text>
<text x="870" y="166" font-size="11" fill="#14532d" text-anchor="middle">只描述底层事实</text>

<line x1="495" y1="182" x2="495" y2="208" stroke="#334155" stroke-width="1.6" marker-end="url(#arTG)"/>
<line x1="250" y1="182" x2="177" y2="208" stroke="#334155" stroke-width="1.6" marker-end="url(#arTG)"/>

<rect x="40" y="210" width="270" height="74" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="175" y="232" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">id=? 走到 panic</text>
<text x="175" y="254" font-size="11" fill="#7f1d1d" text-anchor="middle">recoverMW 接住 → 500</text>
<text x="175" y="274" font-size="11" fill="#7f1d1d" text-anchor="middle">进程活着，继续服务</text>

<rect x="360" y="210" width="290" height="84" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="505" y="232" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">writeErr（唯一映射点）</text>
<text x="505" y="254" font-size="12" fill="#1e3a8a" text-anchor="middle">As 取 code，取不到一律 500</text>
<text x="505" y="276" font-size="11" fill="#1e3a8a" text-anchor="middle">日志只在这一处打：带完整链文本</text>

<line x1="652" y1="238" x2="708" y2="238" stroke="#334155" stroke-width="1.6" marker-end="url(#arTG)"/>
<path d="M585,296 L585,342 L708,342" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arTG)"/>

<rect x="710" y="210" width="250" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="835" y="230" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">响应体</text>
<text x="835" y="250" font-size="11" fill="#14532d" text-anchor="middle">{"code":500,"msg":"读取用户失败"}</text>
<text x="835" y="268" font-size="11" fill="#14532d" text-anchor="middle">泄漏底层细节=false</text>

<rect x="710" y="300" width="250" height="84" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="835" y="322" font-size="12" font-weight="bold" fill="#854d0e" text-anchor="middle">服务端日志那一行</text>
<text x="835" y="344" font-size="11" fill="#854d0e" text-anchor="middle">err=...dial tcp 127.0.0.1:3306...</text>
<text x="835" y="364" font-size="11" fill="#854d0e" text-anchor="middle">3306 细节只出现在这里</text>

<text x="40" y="410" font-size="11" fill="#64748b">id=multi：errors.Join 的链里没有 *BizError → As 取不到 code → 500 + 通用文案；ACCESS 行因文本含换行劈成两行。</text>
<text x="40" y="440" font-size="11" fill="#64748b">小结：6 次请求 stderr 只有 5 行——成功 0 行、错误请求各 1 行；只有 recoverMW 打了栈（stack_has_goroutine=true）。</text>
</svg>
