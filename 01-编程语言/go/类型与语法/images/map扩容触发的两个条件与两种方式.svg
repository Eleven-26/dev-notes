<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect width="1000" height="560" fill="#ffffff"/>
<defs>
<marker id="arGW" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
</defs>

<text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">map 什么时候扩容：两个条件各通向一种扩容方式</text>
<text x="40" y="58" font-size="13" fill="#64748b">前置条件是当前不处于扩容过程中；非扩容状态下满足任一条件就触发</text>

<rect x="40" y="84" width="920" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="60" y="104" font-size="12" fill="#0f172a">写路径落位前的判断：!h.growing() &amp;&amp; ( overLoadFactor(h.count+1, h.B) || tooManyOverflowBuckets(h.noverflow, h.B) )</text>
<text x="60" y="126" font-size="11" fill="#334155">两个条件都在这一处判断里；都不满足 → 不扩容，直接写入 key / value 并 h.count++</text>

<rect x="40" y="150" width="440" height="64" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="260" y="172" font-size="13" font-weight="bold" text-anchor="middle" fill="#854d0e">条件一：负载因子超标</text>
<text x="260" y="194" font-size="11" text-anchor="middle" fill="#854d0e">负载因子 = count / 2^B &gt;= 6.5</text>

<rect x="520" y="150" width="440" height="64" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="740" y="172" font-size="13" font-weight="bold" text-anchor="middle" fill="#854d0e">条件二：溢出桶过多</text>
<text x="740" y="194" font-size="11" text-anchor="middle" fill="#854d0e">判断规则分两段（B 是桶数的对数）</text>

<line x1="260" y1="134" x2="260" y2="146" stroke="#334155" stroke-width="1.5" marker-end="url(#arGW)"/>
<line x1="740" y1="134" x2="740" y2="146" stroke="#334155" stroke-width="1.5" marker-end="url(#arGW)"/>
<line x1="260" y1="214" x2="260" y2="238" stroke="#334155" stroke-width="1.5" marker-end="url(#arGW)"/>
<line x1="740" y1="214" x2="740" y2="238" stroke="#334155" stroke-width="1.5" marker-end="url(#arGW)"/>

<rect x="40" y="242" width="440" height="96" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="60" y="264" font-size="13" font-weight="bold" fill="#14532d">双倍扩容</text>
<text x="60" y="286" font-size="11" fill="#14532d">B = B + 1，桶数 = 2^B，每次翻倍</text>
<text x="60" y="304" font-size="11" fill="#334155">目的：增加空间</text>
<text x="60" y="322" font-size="11" fill="#334155">典型场景：大量插入</text>

<rect x="520" y="242" width="440" height="96" rx="8" fill="#ffedd5" stroke="#ea580c"/>
<text x="540" y="264" font-size="13" font-weight="bold" fill="#7c2d12">等量扩容（B 不变）</text>
<text x="540" y="286" font-size="11" fill="#7c2d12">桶数不变，本质是内存整理</text>
<text x="540" y="304" font-size="11" fill="#334155">把溢出桶里的数据挪到基本桶中被删除的空位上</text>
<text x="540" y="322" font-size="11" fill="#334155">目的：整理碎片　典型场景：大量删除后又插入</text>

<line x1="260" y1="338" x2="260" y2="356" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arGW)"/>
<line x1="740" y1="338" x2="740" y2="356" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arGW)"/>

<rect x="40" y="362" width="440" height="148" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="60" y="384" font-size="12" font-weight="bold" fill="#0f172a">举例验证（B = 2 → 桶数 2^B = 4）</text>
<text x="60" y="408" font-size="11" fill="#334155">count = 20 → 20 / 4 = 5.0 → 否</text>
<text x="60" y="428" font-size="11" fill="#334155">count = 24 → 24 / 4 = 6.0 → 否</text>
<text x="60" y="448" font-size="11" font-weight="bold" fill="#16a34a">count = 26 → 26 / 4 = 6.5 → 触发</text>
<text x="60" y="474" font-size="11" fill="#64748b">每个桶最多存 8 个元素，平均 ≥ 6.5 就该扩</text>

<rect x="520" y="362" width="440" height="148" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="540" y="384" font-size="12" font-weight="bold" fill="#0f172a">溢出桶过多怎么判：分两段</text>
<text x="540" y="408" font-size="11" fill="#334155">B &lt;= 15 → 溢出桶数量 ≈ 基本桶数量 2^B</text>
<text x="540" y="428" font-size="11" fill="#334155">B &gt; 15 → 溢出桶数量 &gt;= 2^15</text>
<text x="540" y="452" font-size="11" fill="#7f1d1d">溢出多、负载却没超标 → 位置上的 key-value 被大量删除</text>
<text x="540" y="476" font-size="11" fill="#64748b">后果：大量遍历到已删除的无效位置，频繁跑到溢出桶</text>

<text x="40" y="536" font-size="11" fill="#64748b">小结：阈值 6.5、B&lt;=15 与 B&gt;15 两段、20/24/26 三组读数、双倍与等量的目的和典型场景都取自第二节原文</text>
</svg>
