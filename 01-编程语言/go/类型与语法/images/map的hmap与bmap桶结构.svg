<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect width="1000" height="570" fill="#ffffff"/>
<defs>
<marker id="arHM" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
</defs>

<text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">hmap 的九个字段与桶（bmap）在内存里的四段</text>
<text x="40" y="58" font-size="13" fill="#64748b">B 是桶数的对数，基础桶数 = 2^B（不含溢出桶）；buckets 指向桶数组，每个桶可存 8 个元素</text>

<rect x="40" y="86" width="300" height="296" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="40" y="86" width="300" height="28" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="190" y="105" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a5f">hmap（map 头）</text>

<rect x="56" y="118" width="268" height="27" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="66" y="136" font-size="11" font-weight="bold" fill="#0f172a">count</text>
<text x="150" y="136" font-size="10" fill="#334155">键值对个数，len(m) 读它</text>
<rect x="56" y="147" width="268" height="27" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="66" y="165" font-size="11" font-weight="bold" fill="#0f172a">flags</text>
<text x="150" y="165" font-size="10" fill="#334155">标志位，关键位 hashWriting</text>
<rect x="56" y="176" width="268" height="27" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="66" y="194" font-size="11" font-weight="bold" fill="#0f172a">B</text>
<text x="150" y="194" font-size="10" fill="#334155">桶数的对数，基础桶 2^B</text>
<rect x="56" y="205" width="268" height="27" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="66" y="223" font-size="11" font-weight="bold" fill="#0f172a">noverflow</text>
<text x="150" y="223" font-size="10" fill="#334155">溢出桶数量，只是近似值</text>
<rect x="56" y="234" width="268" height="27" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="66" y="252" font-size="11" font-weight="bold" fill="#0f172a">hash0</text>
<text x="150" y="252" font-size="10" fill="#334155">哈希种子，参与算哈希</text>
<rect x="56" y="263" width="268" height="27" rx="6" fill="#fef3c7" stroke="#b45309"/>
<text x="66" y="281" font-size="11" font-weight="bold" fill="#854d0e">buckets</text>
<text x="150" y="281" font-size="10" fill="#854d0e">指向桶数组，长度 2^B</text>
<rect x="56" y="292" width="268" height="27" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="66" y="310" font-size="11" font-weight="bold" fill="#0f172a">oldbuckets</text>
<text x="150" y="310" font-size="10" fill="#334155">旧桶数组，仅扩容期间非 nil</text>
<rect x="56" y="321" width="268" height="27" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="66" y="339" font-size="11" font-weight="bold" fill="#0f172a">nevacuate</text>
<text x="150" y="339" font-size="10" fill="#334155">疏散进度计数器</text>
<rect x="56" y="350" width="268" height="27" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="66" y="368" font-size="11" font-weight="bold" fill="#0f172a">extra</text>
<text x="150" y="368" font-size="10" fill="#334155">可选扩展 *mapextra</text>

<rect x="380" y="86" width="580" height="28" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="670" y="105" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a5f">buckets 指向的桶数组：B=2 → 4 个基础桶</text>

<rect x="390" y="122" width="130" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="455" y="144" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">桶 0</text>
<text x="455" y="164" font-size="10" text-anchor="middle" fill="#64748b">8 个槽位</text>
<rect x="530" y="122" width="130" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="595" y="144" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">桶 1</text>
<text x="595" y="164" font-size="10" text-anchor="middle" fill="#64748b">8 个槽位</text>
<rect x="670" y="122" width="130" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="735" y="144" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">桶 2</text>
<text x="735" y="164" font-size="10" text-anchor="middle" fill="#64748b">8 个槽位</text>
<rect x="810" y="122" width="130" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="875" y="144" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">桶 3</text>
<text x="875" y="164" font-size="10" text-anchor="middle" fill="#64748b">8 个槽位</text>

<line x1="326" y1="276" x2="356" y2="276" stroke="#334155" stroke-width="1.5"/>
<line x1="356" y1="276" x2="356" y2="148" stroke="#334155" stroke-width="1.5"/>
<line x1="356" y1="148" x2="386" y2="148" stroke="#334155" stroke-width="1.5" marker-end="url(#arHM)"/>

<text x="380" y="200" font-size="12" font-weight="bold" fill="#0f172a">展开桶 0（bmap）：源码只声明了 tophash，内存里是四段</text>
<rect x="380" y="206" width="440" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="386" y="212" width="105" height="46" rx="4" fill="#dbeafe" stroke="#2563eb"/>
<text x="438" y="230" font-size="11" text-anchor="middle" fill="#1e3a5f">tophash[8]</text>
<text x="438" y="248" font-size="10" text-anchor="middle" fill="#1e3a5f">哈希高 8 位</text>
<rect x="497" y="212" width="105" height="46" rx="4" fill="#dcfce7" stroke="#16a34a"/>
<text x="549" y="230" font-size="11" text-anchor="middle" fill="#14532d">keys[8]</text>
<text x="549" y="248" font-size="10" text-anchor="middle" fill="#14532d">键，按类型定宽</text>
<rect x="608" y="212" width="105" height="46" rx="4" fill="#dcfce7" stroke="#16a34a"/>
<text x="660" y="230" font-size="11" text-anchor="middle" fill="#14532d">elems[8]</text>
<text x="660" y="248" font-size="10" text-anchor="middle" fill="#14532d">值（value）</text>
<rect x="719" y="212" width="105" height="46" rx="4" fill="#ffedd5" stroke="#ea580c"/>
<text x="771" y="230" font-size="11" text-anchor="middle" fill="#7c2d12">overflow</text>
<text x="771" y="248" font-size="10" text-anchor="middle" fill="#7c2d12">溢出桶指针</text>
<text x="838" y="236" font-size="11" fill="#64748b">四段依次相连</text>

<text x="380" y="288" font-size="11" fill="#64748b">keys / elems / overflow 由具体 map 类型决定，编译期动态追加，runtime 靠固定地址偏移访问</text>

<rect x="380" y="302" width="120" height="44" rx="6" fill="#fee2e2" stroke="#dc2626"/>
<text x="440" y="322" font-size="11" text-anchor="middle" fill="#7f1d1d">桶 0 的 8 格全满</text>
<text x="440" y="338" font-size="11" text-anchor="middle" fill="#7f1d1d">再写就冲突</text>
<line x1="500" y1="324" x2="536" y2="324" stroke="#334155" stroke-width="1.5" marker-end="url(#arHM)"/>
<rect x="540" y="302" width="120" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="600" y="322" font-size="11" text-anchor="middle" fill="#0f172a">溢出桶 1</text>
<text x="600" y="338" font-size="11" text-anchor="middle" fill="#64748b">继续找空位</text>
<line x1="660" y1="324" x2="696" y2="324" stroke="#334155" stroke-width="1.5" marker-end="url(#arHM)"/>
<rect x="700" y="302" width="120" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="760" y="322" font-size="11" text-anchor="middle" fill="#0f172a">溢出桶 2</text>
<text x="760" y="338" font-size="11" text-anchor="middle" fill="#64748b">沿链继续挂</text>
<line x1="820" y1="324" x2="856" y2="324" stroke="#334155" stroke-width="1.5" marker-end="url(#arHM)"/>
<rect x="860" y="302" width="100" height="44" rx="6" fill="#fef3c7" stroke="#b45309"/>
<text x="910" y="322" font-size="11" text-anchor="middle" fill="#854d0e">overflow</text>
<text x="910" y="338" font-size="11" text-anchor="middle" fill="#854d0e">指回首地址</text>

<text x="380" y="368" font-size="11" fill="#64748b">哨兵：最后桶的 overflow 指向桶数组首地址，遍历到它就知道走到头，不必额外记长度</text>

<text x="48" y="406" font-size="11" fill="#334155">定位两步：先用哈希低位对桶数取模定桶（只在 2^B 个基础桶里）</text>
<text x="48" y="426" font-size="11" fill="#334155">再用高 8 位 tophash 桶内初筛 → key 精确比对 → 按同下标从 elems 取值</text>

<rect x="40" y="442" width="920" height="94" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="60" y="466" font-size="12" font-weight="bold" fill="#dc2626">hmap 里没有任何和锁相关的字段 —— 所以 map 天生不是线程安全的</text>
<text x="60" y="490" font-size="12" fill="#334155">flags 的 hashWriting 是「检测」不是「保护」：写流程先查这一位，已置起就直接 fatal，runtime 并不会加锁</text>
<text x="60" y="514" font-size="12" fill="#334155">桶数组本质是数组，并发写同一个数组的不同元素会让写入互相覆盖；len(m) 是 O(1)，因为它只读 count</text>

<text x="40" y="556" font-size="11" fill="#64748b">小结：字段名、桶数 2^B、每桶 8 个元素、四段布局和末尾桶哨兵都取自第三、四节的原文与源码片段</text>
</svg>
