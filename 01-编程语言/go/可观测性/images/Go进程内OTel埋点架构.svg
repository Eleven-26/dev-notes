<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="680" fill="#ffffff"/>
  <defs>
    <marker id="arJB" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">Go 进程内 OTel 埋点架构</text>
  <text x="40" y="58" font-size="13" fill="#64748b">对象与单例边界见第三、四节，初始化顺序见第五节；判据只看「内部有没有长活的资源：连接、协程、连接池」</text>

  <!-- Go 应用进程面板 -->
  <rect x="40" y="78" width="700" height="436" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="102" font-size="14" font-weight="bold" fill="#0f172a">Go 应用进程</text>

  <rect x="56" y="118" width="150" height="78" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="66" y="138" font-size="12" font-weight="bold" fill="#0f172a">otelgin 中间件</text>
  <text x="66" y="158" font-size="11" fill="#334155">每个请求建 entry span</text>
  <text x="66" y="176" font-size="11" fill="#334155">Extract traceparent 头</text>

  <rect x="220" y="118" width="150" height="78" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="230" y="138" font-size="12" font-weight="bold" fill="#0f172a">业务 tracer</text>
  <text x="230" y="158" font-size="11" fill="#334155">otel.Tracer：取一次</text>
  <text x="230" y="176" font-size="11" fill="#334155">子 span：tracer.Start</text>

  <rect x="384" y="118" width="150" height="78" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="394" y="138" font-size="12" font-weight="bold" fill="#0f172a">GORM OTel 插件</text>
  <text x="394" y="158" font-size="11" fill="#334155">Install 时捕获全局 tp</text>
  <text x="394" y="176" font-size="11" fill="#334155">生成 SQL client span</text>

  <rect x="548" y="118" width="150" height="78" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="558" y="138" font-size="12" font-weight="bold" fill="#0f172a">otelhttp Transport</text>
  <text x="558" y="158" font-size="11" fill="#334155">出站注入 traceparent</text>
  <text x="558" y="176" font-size="11" fill="#334155">生成 client span</text>

  <line x1="131" y1="196" x2="131" y2="254" stroke="#334155" stroke-width="1.6" marker-end="url(#arJB)"/>
  <line x1="295" y1="196" x2="295" y2="254" stroke="#334155" stroke-width="1.6" marker-end="url(#arJB)"/>
  <line x1="459" y1="196" x2="459" y2="254" stroke="#334155" stroke-width="1.6" marker-end="url(#arJB)"/>
  <line x1="623" y1="196" x2="623" y2="254" stroke="#334155" stroke-width="1.6" marker-end="url(#arJB)"/>

  <rect x="70" y="262" width="610" height="118" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="84" y="284" font-size="13" font-weight="bold" fill="#0f172a">sdktrace.TracerProvider（tp · 包级单例）</text>
  <rect x="84" y="298" width="290" height="64" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="94" y="318" font-size="11" fill="#0f172a">Sampler：ParentBased(TraceIDRatioBased(0.1))</text>
  <text x="94" y="338" font-size="11" fill="#334155">子 span 沿用父的采样决策</text>
  <rect x="390" y="298" width="276" height="64" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="400" y="318" font-size="11" fill="#0f172a">BatchSpanProcessor 队列</text>
  <text x="400" y="338" font-size="11" fill="#334155">WithBatchTimeout 5s 攒批异步导出</text>

  <line x1="528" y1="364" x2="528" y2="392" stroke="#334155" stroke-width="1.6" marker-end="url(#arJB)"/>

  <rect x="70" y="398" width="300" height="58" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="84" y="420" font-size="11" fill="#0f172a">全局 TextMapPropagator（注册一次）</text>
  <text x="84" y="440" font-size="11" fill="#334155">W3C traceparent + Baggage</text>

  <rect x="390" y="398" width="276" height="58" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="400" y="420" font-size="11" fill="#0f172a">otlptracegrpc（WithInsecure）</text>
  <text x="400" y="440" font-size="11" fill="#334155">长活：gRPC 连接 + 批处理协程</text>

  <text x="84" y="486" font-size="11" fill="#b45309">ctx / span 是请求级：tracer.Start 返回的新 ctx 才是本次链路上下文，用完即弃</text>

  <line x1="666" y1="427" x2="752" y2="427" stroke="#334155" stroke-width="1.6" marker-end="url(#arJB)"/>

  <rect x="760" y="118" width="200" height="150" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="774" y="140" font-size="12" font-weight="bold" fill="#0f172a">进程级单例</text>
  <text x="774" y="162" font-size="11" fill="#334155">tp：队列 + gRPC 连接</text>
  <text x="774" y="180" font-size="11" fill="#334155">Tracer 句柄：取一次</text>
  <text x="774" y="198" font-size="11" fill="#334155">*http.Client 内含连接池</text>
  <text x="774" y="216" font-size="11" fill="#334155">*gorm.DB（sql.DB 池）</text>
  <text x="774" y="234" font-size="11" fill="#334155">otelgin：未启用返回 nil</text>

  <rect x="760" y="286" width="200" height="64" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="774" y="308" font-size="12" font-weight="bold" fill="#0f172a">请求级：ctx / span</text>
  <text x="774" y="328" font-size="11" fill="#334155">本次请求的链路上下文，用完即弃</text>

  <rect x="760" y="398" width="200" height="58" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="860" y="421" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">jaeger :4317</text>
  <text x="860" y="441" font-size="11" text-anchor="middle" fill="#334155">OTLP gRPC 端点</text>

  <!-- 初始化顺序 -->
  <text x="40" y="548" font-size="13" font-weight="bold" fill="#0f172a">初始化顺序（第五节）：判据「谁在初始化时捕获了全局单例」</text>
  <rect x="40" y="560" width="250" height="64" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="54" y="582" font-size="12" font-weight="bold" fill="#0f172a">① InitJaeger</text>
  <text x="54" y="602" font-size="11" fill="#334155">发布全局 TracerProvider</text>
  <line x1="294" y1="592" x2="354" y2="592" stroke="#334155" stroke-width="1.6" marker-end="url(#arJB)"/>
  <rect x="360" y="560" width="250" height="64" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="374" y="582" font-size="12" font-weight="bold" fill="#0f172a">② InitMySQL</text>
  <text x="374" y="602" font-size="11" fill="#334155">GORM 插件 Install 时捕获它</text>
  <line x1="614" y1="592" x2="674" y2="592" stroke="#334155" stroke-width="1.6" marker-end="url(#arJB)"/>
  <rect x="680" y="560" width="250" height="64" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="694" y="582" font-size="12" font-weight="bold" fill="#0f172a">③ InitNATS</text>
  <text x="694" y="602" font-size="11" fill="#334155">其它 instrumentation 同理排后</text>

  <text x="40" y="654" font-size="11" fill="#dc2626">⚠️ 顺序颠倒 → GORM 插件捕获 noop provider：SQL span 永远不上报且不报错（HTTP 有、SQL 全没有）；NewTracerProvider 每建一次起一套队列和连接</text>
</svg>
