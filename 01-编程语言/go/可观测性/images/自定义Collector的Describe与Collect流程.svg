<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">自定义 Collector 的 Describe 与 Collect 两阶段</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">流程图；注册期只交 Desc，抓取期才真去读外部系统；读数与报错原文出自容器实跑</text>

  <!-- 泳道标题 -->
  <rect x="60" y="80" width="420" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="270" y="100" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">注册期（进程启动，一次）</text>
  <rect x="520" y="80" width="420" height="30" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="730" y="100" font-size="13" font-weight="bold" fill="#854d0e" text-anchor="middle">抓取期（每次 GET /metrics）</text>

  <defs>
    <marker id="farr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- 注册期节点 -->
  <g font-size="12">
    <rect x="70" y="130" width="400" height="46" rx="6" fill="#f8fafc" stroke="#64748b"/>
    <text x="270" y="149" fill="#0f172a" text-anchor="middle">NewDesc(fqName, help, variableLabels, constLabels)</text>
    <text x="270" y="167" fill="#64748b" text-anchor="middle">每个指标一条 Desc，放在结构体字段里复用</text>

    <rect x="70" y="200" width="400" height="46" rx="6" fill="#f8fafc" stroke="#64748b"/>
    <text x="270" y="219" fill="#0f172a" text-anchor="middle">Registry.Register(collector)</text>
    <text x="270" y="237" fill="#64748b" text-anchor="middle">内部起 goroutine 调 Describe() 收 Desc</text>

    <rect x="70" y="270" width="400" height="60" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="270" y="290" fill="#14532d" text-anchor="middle">一致性校验：同 fqName 的 help / 标签集合必须相同</text>
    <text x="270" y="308" fill="#14532d" text-anchor="middle">同一个 Collector 重复注册 → AlreadyRegisteredError</text>
    <text x="270" y="324" fill="#14532d" text-anchor="middle">MustRegister 直接 panic</text>
  </g>

  <!-- 抓取期节点 -->
  <g font-size="12">
    <rect x="530" y="130" width="400" height="46" rx="6" fill="#f8fafc" stroke="#64748b"/>
    <text x="730" y="149" fill="#0f172a" text-anchor="middle">promhttp 收到 GET /metrics → Gather()</text>
    <text x="730" y="167" fill="#64748b" text-anchor="middle">对所有 Collector 并发调用 Collect(ch)</text>

    <rect x="530" y="200" width="400" height="60" rx="6" fill="#f8fafc" stroke="#64748b"/>
    <text x="730" y="219" fill="#0f172a" text-anchor="middle">Collect 里现读外部系统</text>
    <text x="730" y="236" fill="#64748b" text-anchor="middle">实测两例：文件行数 619 行 / database/sql 的 DBStats()</text>
    <text x="730" y="252" fill="#64748b" text-anchor="middle">OpenConnections=1 InUse=0 Idle=1 MaxOpen=4</text>

    <rect x="530" y="285" width="190" height="60" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="625" y="308" fill="#14532d" text-anchor="middle">成功：</text>
    <text x="625" y="326" fill="#14532d" text-anchor="middle">MustNewConstMetric</text>

    <rect x="740" y="285" width="190" height="60" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="835" y="308" fill="#7f1d1d" text-anchor="middle">失败：</text>
    <text x="835" y="326" fill="#7f1d1d" text-anchor="middle">NewInvalidMetric(err)</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#334155" stroke-width="1.6">
    <line x1="270" y1="176" x2="270" y2="200" marker-end="url(#farr)"/>
    <line x1="270" y1="246" x2="270" y2="270" marker-end="url(#farr)"/>
    <line x1="730" y1="176" x2="730" y2="200" marker-end="url(#farr)"/>
    <line x1="690" y1="260" x2="640" y2="285" marker-end="url(#farr)"/>
    <line x1="770" y1="260" x2="820" y2="285" marker-end="url(#farr)"/>
    <line x1="490" y1="153" x2="530" y2="153" marker-end="url(#farr)"/>
    <line x1="625" y1="345" x2="625" y2="380" marker-end="url(#farr)"/>
    <line x1="835" y1="345" x2="835" y2="380" marker-end="url(#farr)"/>
  </g>

  <!-- 结果 -->
  <rect x="480" y="380" width="290" height="66" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="625" y="403" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">HTTP 200</text>
  <text x="625" y="421" font-size="12" fill="#14532d" text-anchor="middle"># TYPE lab_files_lines gauge</text>
  <text x="625" y="437" font-size="12" fill="#14532d" text-anchor="middle">lab_files_lines{file="./main.go"} 619</text>

  <rect x="790" y="380" width="190" height="66" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="885" y="403" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">HTTP 500</text>
  <text x="885" y="421" font-size="11" fill="#7f1d1d" text-anchor="middle">An error has occurred</text>
  <text x="885" y="437" font-size="11" fill="#7f1d1d" text-anchor="middle">while serving metrics:</text>

  <rect x="60" y="470" width="880" height="72" rx="6" fill="#f8fafc" stroke="#64748b"/>
  <text x="500" y="492" font-size="12" fill="#0f172a" text-anchor="middle">图怎么读：一个 Collector 出错会让整个 /metrics 返回 500（实测原文在右侧红框），</text>
  <text x="500" y="511" font-size="12" fill="#334155" text-anchor="middle">所以高危外部依赖要么单独放到另一个 Registry 的独立端点，要么在 Collect 里把错误降级成 up=0 的 Gauge</text>
  <text x="500" y="531" font-size="12" fill="#334155" text-anchor="middle">注册期不碰外部系统 —— 这是 Collector 与「包一层 Gauge」的第一条分水岭</text>
</svg>
