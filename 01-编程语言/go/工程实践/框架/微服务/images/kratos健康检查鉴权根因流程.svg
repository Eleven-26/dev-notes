<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arKR4" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">「身份认证失败」根因链：健康检查走的是流式请求</text>
  <text x="40" y="58" font-size="13" fill="#64748b">第 5 节排查过程：业务代码方向全对、每个请求都附加了 token，但服务端上下文 metadata 里就是没有 token</text>

  <rect x="300" y="80" width="400" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="500" y="102" font-size="13" fill="#0f172a" text-anchor="middle">客户端校验连接可用性</text>
  <text x="500" y="122" font-size="11" fill="#64748b" text-anchor="middle">先发健康检查（心跳），再发业务请求</text>

  <line x1="430" y1="132" x2="270" y2="160" stroke="#334155" stroke-width="1.6" marker-end="url(#arKR4)"/>
  <line x1="570" y1="132" x2="730" y2="160" stroke="#334155" stroke-width="1.6" marker-end="url(#arKR4)"/>

  <rect x="60" y="162" width="400" height="96" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="260" y="186" font-size="13" fill="#0f172a" text-anchor="middle">心跳：server-streaming 链路</text>
  <text x="260" y="210" font-size="11" fill="#334155" text-anchor="middle">健康检查不携带任何业务 metadata</text>
  <text x="260" y="232" font-size="11" fill="#334155" text-anchor="middle">走流式拦截器，不走一元拦截器</text>
  <text x="260" y="252" font-size="11" fill="#64748b" text-anchor="middle">Kratos gRPC Server 把中间件同时套在两条链路</text>

  <rect x="540" y="162" width="400" height="64" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="740" y="188" font-size="13" fill="#0f172a" text-anchor="middle">业务请求：unary 链路</text>
  <text x="740" y="212" font-size="11" fill="#334155" text-anchor="middle">调用方每个请求都附加了 token</text>

  <line x1="260" y1="258" x2="260" y2="284" stroke="#334155" stroke-width="1.6" marker-end="url(#arKR4)"/>

  <rect x="60" y="286" width="400" height="52" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="260" y="308" font-size="13" fill="#0f172a" text-anchor="middle">鉴权中间件拿不到 token</text>
  <text x="260" y="328" font-size="11" fill="#334155" text-anchor="middle">健康检查返回鉴权失败</text>

  <line x1="260" y1="338" x2="260" y2="364" stroke="#334155" stroke-width="1.6" marker-end="url(#arKR4)"/>

  <rect x="60" y="366" width="400" height="52" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="260" y="388" font-size="13" fill="#0f172a" text-anchor="middle">连接被判为不健康</text>
  <text x="260" y="408" font-size="11" fill="#334155" text-anchor="middle">后续正常请求也跟着失败</text>

  <line x1="260" y1="418" x2="260" y2="444" stroke="#334155" stroke-width="1.6" marker-end="url(#arKR4)"/>

  <rect x="60" y="446" width="400" height="72" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="260" y="470" font-size="13" fill="#0f172a" text-anchor="middle">修复：5.3 放行健康检查</text>
  <text x="260" y="492" font-size="11" fill="#334155" text-anchor="middle">Operation() == /grpc.health.v1.Health/Watch</text>
  <text x="260" y="512" font-size="11" fill="#334155" text-anchor="middle">心跳放行，其余请求照常校验 token</text>

  <rect x="540" y="286" width="400" height="120" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="560" y="310" font-size="13" fill="#0f172a">先入为主的假设</text>
  <text x="560" y="336" font-size="11" fill="#334155">团队此前一直用原生 gRPC 开发，</text>
  <text x="560" y="356" font-size="11" fill="#334155">习惯只关注一元调用和一元拦截器，</text>
  <text x="560" y="376" font-size="11" fill="#334155">默认「健康检查也是一元请求，</text>
  <text x="560" y="396" font-size="11" fill="#334155">会走一元拦截器」</text>

  <text x="540" y="470" font-size="11" fill="#64748b">改完重跑，请求正常返回，</text>
  <text x="540" y="490" font-size="11" fill="#64748b">附加的数据也正常传过去了</text>

  <text x="40" y="544" font-size="11" fill="#64748b">复盘：Kratos 在微服务之间建立的是流式通道，至少心跳是通过流式请求发送的；鉴权中间件必须区分心跳请求和业务请求</text>
</svg>
