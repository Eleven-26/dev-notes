<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="390" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">go-cron 重入保护：间隔 1s · 任务体 1200ms · 观察 4s 的实测时序</text>
  <text x="40" y="58" font-size="13" fill="#64748b">读数出自 1.4 节实测（5 轮完全一致，两遍逐行相同）；顶部竖刻度 = 每一次 1s tick，条块 = 任务体执行中的区间</text>

  <line x1="160" y1="86" x2="160" y2="100" stroke="#334155" stroke-width="1.4"/>
  <line x1="340" y1="86" x2="340" y2="100" stroke="#334155" stroke-width="1.4"/>
  <line x1="520" y1="86" x2="520" y2="100" stroke="#334155" stroke-width="1.4"/>
  <line x1="700" y1="86" x2="700" y2="100" stroke="#334155" stroke-width="1.4"/>
  <line x1="880" y1="86" x2="880" y2="100" stroke="#334155" stroke-width="1.4"/>
  <text x="160" y="116" font-size="11" fill="#64748b" text-anchor="middle">0s</text>
  <text x="340" y="116" font-size="11" fill="#64748b" text-anchor="middle">1s</text>
  <text x="520" y="116" font-size="11" fill="#64748b" text-anchor="middle">2s</text>
  <text x="700" y="116" font-size="11" fill="#64748b" text-anchor="middle">3s</text>
  <text x="880" y="116" font-size="11" fill="#64748b" text-anchor="middle">4s</text>

  <rect x="40" y="128" width="920" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="52" y="147" font-size="13" fill="#0f172a">无保护：4s 内执行 4 次 · 峰值并发 2</text>

  <rect x="160" y="166" width="216" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="340" y="190" width="216" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="520" y="166" width="216" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="700" y="190" width="216" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="168" y="226" font-size="11" fill="#64748b">相邻条块在 1.0~1.2s、3.0~3.2s 重叠 → 同一时刻两个任务体在跑</text>

  <rect x="40" y="244" width="920" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="52" y="263" font-size="13" fill="#0f172a">WithChain(SkipIfStillRunning)：4s 内执行 2 次 · 峰值并发 1</text>

  <rect x="160" y="282" width="216" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="520" y="282" width="216" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="295" y="312" width="90" height="24" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="340" y="328" font-size="11" fill="#7f1d1d" text-anchor="middle">跳过</text>
  <rect x="655" y="312" width="90" height="24" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="700" y="328" font-size="11" fill="#7f1d1d" text-anchor="middle">跳过</text>
  <text x="452" y="330" font-size="11" fill="#64748b">上一轮未跑完时到来的拍被跳过</text>

  <text x="40" y="376" font-size="11" fill="#64748b">小结：同样参数下，加 SkipIfStillRunning 后执行从 4 次降为 2 次、峰值并发从 2 降为 1</text>
</svg>
