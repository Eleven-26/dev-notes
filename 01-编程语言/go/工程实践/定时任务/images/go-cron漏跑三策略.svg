<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arGC1" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">go-cron 漏跑：WithMissedPolicy 的三种默认值</text>
  <text x="40" y="58" font-size="13" fill="#64748b">实测场景：启动时声明「上次运行在 09:47」，此刻 10:00，每分钟任务，区间内应触发 12 次</text>

  <rect x="310" y="86" width="380" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="500" y="112" font-size="14" fill="#0f172a" text-anchor="middle">进程启动，对比上次运行记录</text>
  <text x="500" y="134" font-size="12" fill="#64748b" text-anchor="middle">此刻 10:00，距上次运行已漏 12 拍</text>
  <line x1="500" y1="150" x2="500" y2="178" stroke="#334155" stroke-width="1.6" marker-end="url(#arGC1)"/>

  <rect x="330" y="180" width="340" height="48" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="500" y="209" font-size="14" fill="#0f172a" text-anchor="middle">按 WithMissedPolicy 分派</text>

  <line x1="500" y1="228" x2="190" y2="284" stroke="#334155" stroke-width="1.6" marker-end="url(#arGC1)"/>
  <line x1="500" y1="228" x2="500" y2="284" stroke="#334155" stroke-width="1.6" marker-end="url(#arGC1)"/>
  <line x1="500" y1="228" x2="810" y2="284" stroke="#334155" stroke-width="1.6" marker-end="url(#arGC1)"/>

  <rect x="50" y="286" width="280" height="96" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="190" y="320" font-size="14" fill="#0f172a" text-anchor="middle">MissedSkip（默认）</text>
  <text x="190" y="346" font-size="13" fill="#334155" text-anchor="middle">实际执行 0 次</text>
  <text x="190" y="368" font-size="11" fill="#64748b" text-anchor="middle">错过的一拍都不补</text>

  <rect x="360" y="286" width="280" height="96" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="500" y="320" font-size="14" fill="#0f172a" text-anchor="middle">MissedRunOnce</text>
  <text x="500" y="346" font-size="13" fill="#334155" text-anchor="middle">实际执行 1 次</text>
  <text x="500" y="368" font-size="11" fill="#64748b" text-anchor="middle">补跑一次为止</text>

  <rect x="670" y="286" width="280" height="96" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="810" y="320" font-size="14" fill="#0f172a" text-anchor="middle">MissedRunAll</text>
  <text x="810" y="346" font-size="13" fill="#334155" text-anchor="middle">实际执行 12 次</text>
  <text x="810" y="368" font-size="11" fill="#64748b" text-anchor="middle">另有安全上限 100 次</text>

  <text x="40" y="430" font-size="11" fill="#64748b">小结：默认是最保守的 Skip——换库不会悄悄帮你补跑；三种策略正好对应《标准库实现》第五节的 skip / catch-up once / burst</text>
</svg>
