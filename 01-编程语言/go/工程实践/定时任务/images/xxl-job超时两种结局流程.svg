<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arXJ3" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">xxl-job 超时（executor_timeout=3）：任务体看不看 ctx 的两种结局</text>
  <text x="40" y="58" font-size="13" fill="#64748b">实测 4.6 节：A 组 slowJobHandler 检查 ctx；B 组 stubbornJobHandler 硬睡 90 秒——两组 handle_code 都是 200</text>

  <rect x="330" y="84" width="340" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="500" y="112" font-size="14" fill="#0f172a" text-anchor="middle">中心触发：executor_timeout=3（秒）</text>
  <line x1="500" y1="128" x2="500" y2="156" stroke="#334155" stroke-width="1.6" marker-end="url(#arXJ3)"/>

  <rect x="310" y="158" width="380" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="500" y="186" font-size="13" fill="#0f172a" text-anchor="middle">客户端把 executor_timeout 转成</text>
  <text x="500" y="210" font-size="13" fill="#0f172a" text-anchor="middle">context.WithTimeout 交给任务体</text>
  <line x1="500" y1="230" x2="500" y2="256" stroke="#334155" stroke-width="1.6" marker-end="url(#arXJ3)"/>

  <rect x="370" y="258" width="260" height="48" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="500" y="287" font-size="14" fill="#0f172a" text-anchor="middle">任务体自己检查 ctx 吗？</text>

  <path d="M370,282 L200,282 L200,326" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arXJ3)"/>
  <text x="284" y="274" font-size="12" fill="#334155" text-anchor="middle">看（A 组）</text>
  <path d="M630,282 L800,282 L800,326" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arXJ3)"/>
  <text x="716" y="274" font-size="12" fill="#334155" text-anchor="middle">不看（B 组）</text>

  <rect x="60" y="328" width="320" height="132" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="220" y="354" font-size="13" fill="#0f172a" text-anchor="middle">3 秒即被取消</text>
  <text x="220" y="378" font-size="11" fill="#334155" text-anchor="middle">cost=3000 ms</text>
  <text x="220" y="400" font-size="11" fill="#334155" text-anchor="middle">msg = slow canceled:</text>
  <text x="220" y="420" font-size="11" fill="#334155" text-anchor="middle">context deadline exceeded</text>
  <text x="220" y="444" font-size="12" fill="#14532d" text-anchor="middle">handle_code=200</text>

  <rect x="620" y="328" width="320" height="132" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="780" y="354" font-size="13" fill="#0f172a" text-anchor="middle">一路跑满 90 秒</text>
  <text x="780" y="378" font-size="11" fill="#334155" text-anchor="middle">cost=90000 ms · timeout=3 形同虚设</text>
  <text x="780" y="400" font-size="11" fill="#334155" text-anchor="middle">msg = stubborn finished</text>
  <text x="780" y="420" font-size="11" fill="#334155" text-anchor="middle">(ctx ignored)</text>
  <text x="780" y="444" font-size="12" fill="#7f1d1d" text-anchor="middle">handle_code=200</text>

  <line x1="780" y1="460" x2="780" y2="486" stroke="#334155" stroke-width="1.6" marker-end="url(#arXJ3)"/>
  <rect x="620" y="488" width="320" height="92" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="780" y="514" font-size="13" fill="#0f172a" text-anchor="middle">期间下一分钟触发被拒绝</text>
  <text x="780" y="538" font-size="11" fill="#334155" text-anchor="middle">DISCARD_LATER：There are tasks running</text>
  <text x="780" y="560" font-size="12" fill="#7c2d12" text-anchor="middle">trigger_code=500 · handle_code=0</text>

  <text x="60" y="500" font-size="11" fill="#64748b">小结：超时只让调度侧的 ctx 到期——检查了就 3 秒停，</text>
  <text x="60" y="520" font-size="11" fill="#64748b">不检查就继续跑，任务体不看 ctx 时它会跑到底</text>
  <text x="60" y="552" font-size="11" fill="#b45309">⚠️ 3.4.2 实测未观察到「超时后中心标记失败并调 /kill」</text>

  <text x="60" y="616" font-size="11" fill="#64748b">小结：trigger_code=500 不等于网络不通——它同时覆盖「执行器主动拒绝」（任务未注册 / 阻塞策略）与「连不上执行器」两类</text>
</svg>
