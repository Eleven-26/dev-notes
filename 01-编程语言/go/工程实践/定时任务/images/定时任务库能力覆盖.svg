<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="30" y="38" font-size="19" font-weight="bold" fill="#0f172a">六个语义问题：两个库各自包办了什么</text>
  <text x="30" y="62" font-size="12.5" fill="#64748b">绿 = 库已包办　｜　橙 = 只给扩展点，实现要自己接　｜　红 = 库不管，必须自己写</text>

  <rect x="30" y="78" width="380" height="32" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="46" y="99" font-size="13.5" font-weight="bold" fill="#334155">本篇的语义问题</text>
  <rect x="418" y="78" width="286" height="32" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="434" y="99" font-size="13.5" font-weight="bold" fill="#334155">go-cron v0.16.1</text>
  <rect x="712" y="78" width="258" height="32" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="728" y="99" font-size="13.5" font-weight="bold" fill="#334155">go-job v1.2.3</text>

  <rect x="30" y="118" width="380" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="143" font-size="13.5" fill="#334155">丢拍还是堆积（§2）</text>
  <rect x="418" y="118" width="286" height="40" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="434" y="143" font-size="12.5" fill="#14532d">Skip / DelayIfStillRunning 包一层</text>
  <rect x="712" y="118" width="258" height="40" rx="4" fill="#ffedd5" stroke="#ea580c"/>
  <text x="728" y="143" font-size="12.5" fill="#7c2d12">无同义配置，靠队列排队</text>

  <rect x="30" y="164" width="380" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="189" font-size="13.5" fill="#334155">定时间隔漂移（§3）</text>
  <rect x="418" y="164" width="286" height="40" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="434" y="189" font-size="12.5" fill="#14532d">固定墙钟节拍，不漂</text>
  <rect x="712" y="164" width="258" height="40" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="728" y="189" font-size="12.5" fill="#14532d">同左</text>

  <rect x="30" y="210" width="380" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="235" font-size="13.5" fill="#334155">cron 表达式解析（§4）</text>
  <rect x="418" y="210" width="286" height="40" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="434" y="235" font-size="12.5" fill="#14532d">5 段（可带秒）；dom/dow = AND</text>
  <rect x="712" y="210" width="258" height="40" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="728" y="235" font-size="12.5" fill="#14532d">WithCrontabSpec，细节由库定</text>

  <rect x="30" y="256" width="380" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="281" font-size="13.5" fill="#334155">漏跑补跑（§5）</text>
  <rect x="418" y="256" width="286" height="40" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="434" y="281" font-size="12.5" fill="#14532d">MissedPolicy 三档 + 宽限期</text>
  <rect x="712" y="256" width="258" height="40" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="728" y="281" font-size="12.5" fill="#7f1d1d">默认不补：错过的就错过</text>

  <rect x="30" y="302" width="380" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="327" font-size="13.5" fill="#334155">取消粒度（§6）</text>
  <rect x="418" y="302" width="286" height="40" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="434" y="327" font-size="12.5" fill="#14532d">per-entry context；Stop 等收尾</text>
  <rect x="712" y="302" width="258" height="40" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="728" y="327" font-size="12.5" fill="#14532d">WithTimeout / CancelInstances</text>

  <rect x="30" y="348" width="380" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="373" font-size="13.5" fill="#334155">多副本重复（§7）</text>
  <rect x="418" y="348" width="286" height="40" rx="4" fill="#ffedd5" stroke="#ea580c"/>
  <text x="434" y="373" font-size="12.5" fill="#7c2d12">Locker / Elector 扩展点</text>
  <rect x="712" y="348" width="258" height="40" rx="4" fill="#ffedd5" stroke="#ea580c"/>
  <text x="728" y="373" font-size="12.5" fill="#7c2d12">可插拔 Store 扩展点</text>

  <rect x="30" y="394" width="380" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="419" font-size="13.5" fill="#334155">可观测（§8）</text>
  <rect x="418" y="394" width="286" height="40" rx="4" fill="#ffedd5" stroke="#ea580c"/>
  <text x="434" y="419" font-size="12.5" fill="#7c2d12">Observability 钩子，自己转指标</text>
  <rect x="712" y="394" width="258" height="40" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="728" y="419" font-size="12.5" fill="#14532d">内建状态历史 + 日志历史</text>

  <rect x="30" y="452" width="940" height="48" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="472" font-size="13" font-weight="bold" fill="#0f172a">库包办的是「怎么触发」；「重入语义选哪种」和「多副本怎么互斥」仍然由你拍。</text>
  <text x="46" y="491" font-size="12.5" fill="#64748b">第七节的互斥与第六节的幂等，换哪个库都要自己交代清楚 —— 库只给扩展点，不给实现。</text>
</svg>
