<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="630" fill="#ffffff"/>
  <defs>
    <marker id="arRqP" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">rocketmq-client-go v2 生产端：单例初始化与发送选队</text>
  <text x="40" y="58" font-size="13" fill="#64748b">NewProducer → Start（真建 TCP / 注册路由 / 心跳协程）→ SendSync 按场景选队列</text>

  <rect x="300" y="76" width="400" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="98" font-size="13" text-anchor="middle" fill="#0f172a">1. OrderProducer() 用 sync.Once 兜底</text>
  <text x="500" y="116" font-size="12" text-anchor="middle" fill="#334155">包级变量 orderProducer</text>
  <text x="500" y="134" font-size="12" text-anchor="middle" fill="#334155">rocketmq.Producer 进程级单例</text>

  <rect x="40" y="76" width="236" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="158" y="98" font-size="12" text-anchor="middle" fill="#334155">别在 handler 里每次 NewProducer</text>
  <text x="158" y="118" font-size="11" text-anchor="middle" fill="#64748b">反复新建 = 连接数线性膨胀</text>
  <line x1="276" y1="104" x2="300" y2="104" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arRqP)"/>

  <line x1="500" y1="140" x2="500" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#arRqP)"/>

  <rect x="300" y="160" width="400" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="182" font-size="13" text-anchor="middle" fill="#0f172a">2. NewProducer 传三个选项</text>
  <text x="500" y="200" font-size="12" text-anchor="middle" fill="#334155">WithNameServer 192.168.48.2:9876</text>
  <text x="500" y="218" font-size="12" text-anchor="middle" fill="#334155">WithGroupName · WithRetry(2)</text>

  <rect x="744" y="160" width="216" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="852" y="182" font-size="12" text-anchor="middle" fill="#7f1d1d">写主机名直接 panic</text>
  <text x="852" y="202" font-size="11" text-anchor="middle" fill="#7f1d1d">new Namesrv failed.:</text>
  <text x="852" y="218" font-size="11" text-anchor="middle" fill="#7f1d1d">IP addr error</text>
  <line x1="700" y1="192" x2="744" y2="192" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arRqP)"/>

  <line x1="500" y1="224" x2="500" y2="244" stroke="#334155" stroke-width="1.5" marker-end="url(#arRqP)"/>

  <rect x="300" y="244" width="400" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="266" font-size="13" text-anchor="middle" fill="#0f172a">3. p.Start() 真建 TCP、注册路由、起心跳协程</text>
  <text x="500" y="286" font-size="12" text-anchor="middle" fill="#334155">整个进程只做一次</text>

  <line x1="500" y1="296" x2="500" y2="316" stroke="#334155" stroke-width="1.5" marker-end="url(#arRqP)"/>

  <rect x="300" y="316" width="400" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="338" font-size="13" text-anchor="middle" fill="#0f172a">4. 请求内构造消息（请求级）</text>
  <text x="500" y="356" font-size="12" text-anchor="middle" fill="#334155">WithTag TagA · WithKeys ORDER_GO_1001</text>
  <text x="500" y="374" font-size="12" text-anchor="middle" fill="#334155">WithProperty x-biz-id / x-trace-id</text>

  <line x1="500" y1="380" x2="500" y2="400" stroke="#334155" stroke-width="1.5" marker-end="url(#arRqP)"/>

  <rect x="300" y="400" width="400" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="422" font-size="13" text-anchor="middle" fill="#0f172a">5. SendSync(ctx, msg) 同步发送</text>
  <text x="500" y="442" font-size="12" text-anchor="middle" fill="#334155">ctx 控发送超时，别存进单例字段</text>

  <path d="M440,452 L440,462 L178,462 L178,472" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arRqP)"/>
  <line x1="500" y1="452" x2="500" y2="472" stroke="#334155" stroke-width="1.5" marker-end="url(#arRqP)"/>
  <path d="M560,452 L560,462 L822,462 L822,472" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arRqP)"/>

  <rect x="30" y="472" width="296" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="178" y="494" font-size="13" text-anchor="middle" fill="#0f172a">普通：默认轮询</text>
  <text x="178" y="514" font-size="11" text-anchor="middle" fill="#334155">queueId 1 / 2 / 3 打散</text>
  <text x="178" y="530" font-size="11" text-anchor="middle" fill="#334155">status=0 即 SEND_OK</text>

  <rect x="352" y="472" width="296" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="500" y="494" font-size="13" text-anchor="middle" fill="#0f172a">顺序：NewHashQueueSelector()</text>
  <text x="500" y="514" font-size="11" text-anchor="middle" fill="#334155">4 条全落 queueId=2</text>
  <text x="500" y="530" font-size="11" text-anchor="middle" fill="#334155">key = ORDER_GO_SEQ_777</text>

  <rect x="674" y="472" width="296" height="64" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="822" y="494" font-size="13" text-anchor="middle" fill="#7c2d12">延迟：WithDelayTimeLevel(3)</text>
  <text x="822" y="514" font-size="11" text-anchor="middle" fill="#7c2d12">level 3 = 10s</text>
  <text x="822" y="530" font-size="11" text-anchor="middle" fill="#7c2d12">仍是 4.x 的 18 个档位</text>

  <text x="40" y="564" font-size="11" fill="#64748b">重试：WithRetry(2) 是发送失败后换队列重发，会放大重复，消费端幂等不能省。</text>
  <text x="40" y="584" font-size="11" fill="#64748b">打印：primitive.SendStatus 是 int 命名类型且没有 String()，%v 打出的是数字 0，不是字符串 SEND_OK。</text>
  <text x="40" y="604" font-size="11" fill="#64748b">退出：p.Shutdown() flush 缓冲、关连接、停心跳协程；不 Shutdown 则缓冲中未发出的消息可能丢、协程泄漏。</text>
</svg>
