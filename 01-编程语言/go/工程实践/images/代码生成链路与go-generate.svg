<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>
  <defs>
    <marker id="cg1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">代码生成的链路：go generate 只是「扫注释然后执行命令」</text>

  <rect x="30" y="90" width="160" height="96" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="110" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">① 源文件</text>
  <text x="110" y="142" text-anchor="middle" font-size="12" fill="#64748b">.go / .proto /</text>
  <text x="110" y="162" text-anchor="middle" font-size="12" fill="#64748b">SQL DDL</text>

  <line x1="190" y1="138" x2="218" y2="138" stroke="#334155" stroke-width="1.6" marker-end="url(#cg1)"/>

  <rect x="220" y="90" width="160" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">② go generate</text>
  <text x="300" y="142" text-anchor="middle" font-size="12" fill="#334155">扫描 //go:generate</text>
  <text x="300" y="162" text-anchor="middle" font-size="12" fill="#334155">注释（顶层、行首）</text>

  <line x1="380" y1="138" x2="408" y2="138" stroke="#334155" stroke-width="1.6" marker-end="url(#cg1)"/>

  <rect x="410" y="90" width="160" height="96" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="490" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#ea580c">③ 执行命令</text>
  <text x="490" y="142" text-anchor="middle" font-size="12" fill="#334155">go run ./gen</text>
  <text x="490" y="162" text-anchor="middle" font-size="12" fill="#334155">stringer / mockgen …</text>

  <line x1="570" y1="138" x2="598" y2="138" stroke="#334155" stroke-width="1.6" marker-end="url(#cg1)"/>

  <rect x="600" y="90" width="160" height="96" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="680" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">④ 产出 *_gen.go</text>
  <text x="680" y="142" text-anchor="middle" font-size="12" fill="#334155">带 DO NOT EDIT 头</text>
  <text x="680" y="162" text-anchor="middle" font-size="12" fill="#334155">（实测 278 字节）</text>

  <line x1="760" y1="138" x2="788" y2="138" stroke="#334155" stroke-width="1.6" marker-end="url(#cg1)"/>

  <rect x="790" y="90" width="160" height="96" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="870" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">⑤ 回到 go build</text>
  <text x="870" y="142" text-anchor="middle" font-size="12" fill="#64748b">产物入库后，</text>
  <text x="870" y="162" text-anchor="middle" font-size="12" fill="#64748b">编译不依赖工具链</text>

  <rect x="30" y="216" width="920" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="50" y="244" font-size="13" font-weight="bold" fill="#dc2626">⚠️ //go:generate 只是注释 —— go build 完全忽略它，必须显式跑 go generate ./...</text>
  <text x="50" y="266" font-size="12" fill="#334155">生成器自身加 //go:build ignore 不进正常构建；go run 对命令行显式列出的文件会忽略这个约束，所以仍能被调起</text>

  <rect x="30" y="292" width="920" height="108" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="320" font-size="13" font-weight="bold" fill="#0f172a">⭐ CI 校验式：跑一遍 generate，再要求工作区无变化</text>
  <text x="50" y="346" font-size="12" fill="#334155">go generate ./...</text>
  <text x="50" y="368" font-size="12" fill="#334155">git diff --exit-code -- '*_gen.go' '*.pb.go'   ← 有差异就退出码非 0，说明有人改了源没重新生成</text>
  <text x="50" y="390" font-size="12" fill="#64748b">产物建议入库：拉代码的人不必装生成工具链、评审能看到产物 diff、CI 不需要额外环境</text>
</svg>
