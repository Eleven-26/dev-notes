<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Pulsar Go 生产端：NewClient 不连网，lookup 与 SendReceipt 都在 CreateProducer 之后</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">本机 pulsar-client-go v0.21.0 连 apachepulsar/pulsar:4.0.5 standalone（宿主 16650 → 容器 6650），E/W/Q = 1/1/1</text>

  <text x="640" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Go 进程</text>
  <text x="790" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Broker</text>
  <text x="940" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">BookKeeper</text>
  <line x1="640" y1="96" x2="640" y2="500" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="790" y1="96" x2="790" y2="500" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="940" y1="96" x2="940" y2="500" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>

  <circle cx="34" cy="170" r="11" fill="#2563eb"/>
  <text x="34" y="175" text-anchor="middle" font-size="12" fill="#ffffff">1</text>
  <text x="56" y="175" font-size="12.5" fill="#1e293b">NewClient(URL)：只构造对象，不建立连接</text>
  <path d="M640 170 L700 170 L700 184 L640 184" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="640,184 652,178 652,190" fill="#2563eb"/>

  <circle cx="34" cy="214" r="11" fill="#2563eb"/>
  <text x="34" y="219" text-anchor="middle" font-size="12" fill="#ffffff">2</text>
  <text x="56" y="219" font-size="12.5" fill="#1e293b">CreateProducer → LOOKUP：发消息前先问 topic 归谁</text>
  <line x1="640" y1="214" x2="782" y2="214" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="790,214 778,208 778,220" fill="#2563eb"/>

  <circle cx="34" cy="258" r="11" fill="#16a34a"/>
  <text x="34" y="263" text-anchor="middle" font-size="12" fill="#ffffff">3</text>
  <text x="56" y="263" font-size="12.5" fill="#1e293b">← Connect（归我）或 Redirect（去连自报地址）</text>
  <line x1="790" y1="258" x2="648" y2="258" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6 4"/>
  <polygon points="640,258 652,252 652,264" fill="#16a34a"/>

  <circle cx="34" cy="302" r="11" fill="#2563eb"/>
  <text x="34" y="307" text-anchor="middle" font-size="12" fill="#ffffff">4</text>
  <text x="56" y="307" font-size="12.5" fill="#1e293b">建 producer：producer_name=standalone-0-31</text>
  <line x1="640" y1="302" x2="782" y2="302" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="790,302 778,296 778,308" fill="#2563eb"/>

  <circle cx="34" cy="346" r="11" fill="#2563eb"/>
  <text x="34" y="351" text-anchor="middle" font-size="12" fill="#ffffff">5</text>
  <text x="56" y="351" font-size="12.5" fill="#1e293b">Send(ctx, msg, Key)：先进入本地批次缓冲</text>
  <rect x="600" y="330" width="128" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="664" y="350" text-anchor="middle" font-size="11.5" fill="#1e3a8a">10ms / 500 条成批</text>
  <path d="M640 358 L700 358" stroke="#2563eb" stroke-width="1.2"/>
  <path d="M700 358 L700 372 L640 372" fill="none" stroke="#2563eb" stroke-width="1.2"/>
  <polygon points="640,372 652,366 652,378" fill="#2563eb"/>

  <circle cx="34" cy="402" r="11" fill="#2563eb"/>
  <text x="34" y="407" text-anchor="middle" font-size="12" fill="#ffffff">6</text>
  <text x="56" y="407" font-size="12.5" fill="#1e293b">批次提交：写 ledger，按 ensemble 复制后等确认</text>
  <line x1="640" y1="402" x2="782" y2="402" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="790,402 778,396 778,408" fill="#2563eb"/>
  <line x1="790" y1="414" x2="932" y2="414" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="940,414 928,408 928,420" fill="#2563eb"/>
  <text x="800" y="408" font-size="10.5" fill="#64748b">W=1 Q=1</text>

  <circle cx="34" cy="452" r="11" fill="#16a34a"/>
  <text x="34" y="457" text-anchor="middle" font-size="12" fill="#ffffff">7</text>
  <text x="56" y="457" font-size="12.5" fill="#1e293b">← SendReceipt：ledger=103 entry=0（本机实测）</text>
  <line x1="940" y1="452" x2="798" y2="452" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6 4"/>
  <polygon points="790,452 802,446 802,458" fill="#16a34a"/>
  <line x1="790" y1="464" x2="648" y2="464" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6 4"/>
  <polygon points="640,464 652,458 652,470" fill="#16a34a"/>

  <circle cx="34" cy="496" r="11" fill="#2563eb"/>
  <text x="34" y="501" text-anchor="middle" font-size="12" fill="#ffffff">8</text>
  <text x="56" y="501" font-size="12.5" fill="#1e293b">Send 返回 MessageID：业务拿到的是位置，不是 offset</text>
  <path d="M640 496 L700 496 L700 510 L640 510" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="640,510 652,504 652,516" fill="#2563eb"/>

  <rect x="24" y="532" width="952" height="72" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="40" y="556" font-size="12.5" font-weight="bold" fill="#78350f">本机读数：SYNC ok ledger=103 entry=0/1/2 partition=0；ASYNC ok key=ORDER_GO_1002 entry=3；PRODUCE DONE</text>
  <text x="40" y="580" font-size="12" fill="#78350f">要点：日志里第一条 Connecting to broker 出现在 CreateProducer 之后；连不上时业务侧只看到 create producer: context deadline exceeded。</text>
</svg>
