<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="610" fill="#ffffff"/>
  <defs>
    <marker id="arDtm1" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">子事务屏障在业务进程内的执行链路</text>
  <text x="40" y="58" font-size="13" fill="#64748b">BarrierFromQuery → CallWithDB → 屏障键与业务更新同事务 → 按结果映射 HTTP 状态码</text>

  <rect x="300" y="76" width="400" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="98" font-size="13" text-anchor="middle" fill="#0f172a">1. 请求进入分支处理器</text>
  <text x="500" y="118" font-size="12" text-anchor="middle" fill="#334155">query 带 trans_type / gid / branch_id / op</text>

  <line x1="500" y1="128" x2="500" y2="150" stroke="#334155" stroke-width="1.5" marker-end="url(#arDtm1)"/>

  <rect x="300" y="154" width="400" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="176" font-size="13" text-anchor="middle" fill="#0f172a">2. BarrierFromQuery 构造 BranchBarrier</text>
  <text x="500" y="196" font-size="12" text-anchor="middle" fill="#334155">Gin / net/http / Echo 都能直接用</text>

  <rect x="40" y="154" width="228" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="154" y="176" font-size="13" text-anchor="middle" fill="#334155">构造失败 err != nil</text>
  <text x="154" y="196" font-size="12" text-anchor="middle" fill="#64748b">400 StatusBadRequest</text>
  <line x1="300" y1="180" x2="272" y2="180" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arDtm1)"/>

  <line x1="500" y1="206" x2="500" y2="228" stroke="#334155" stroke-width="1.5" marker-end="url(#arDtm1)"/>

  <rect x="300" y="232" width="400" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="254" font-size="13" text-anchor="middle" fill="#0f172a">3. bar.CallWithDB(db, fn)</text>
  <text x="500" y="274" font-size="12" text-anchor="middle" fill="#334155">自己开事务，业务逻辑写在回调里</text>

  <rect x="744" y="232" width="216" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="852" y="254" font-size="12" text-anchor="middle" fill="#334155">已有 *sql.Tx 时</text>
  <text x="852" y="274" font-size="12" text-anchor="middle" fill="#64748b">用 bar.Call(tx, fn)</text>
  <line x1="700" y1="258" x2="740" y2="258" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arDtm1)"/>

  <line x1="500" y1="284" x2="500" y2="306" stroke="#334155" stroke-width="1.5" marker-end="url(#arDtm1)"/>

  <rect x="260" y="310" width="480" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="332" font-size="13" text-anchor="middle" fill="#0f172a">4. 屏障键与业务更新落在同一个本地事务</text>
  <rect x="284" y="344" width="214" height="84" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="391" y="366" font-size="13" text-anchor="middle" fill="#0f172a">屏障行插入</text>
  <text x="391" y="388" font-size="12" text-anchor="middle" fill="#334155">唯一键四列</text>
  <text x="391" y="408" font-size="12" text-anchor="middle" fill="#334155">(gid, branch_id,</text>
  <text x="391" y="424" font-size="12" text-anchor="middle" fill="#334155">op, barrier_id)</text>
  <rect x="520" y="344" width="204" height="84" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="622" y="366" font-size="13" text-anchor="middle" fill="#0f172a">业务 UPDATE</text>
  <text x="622" y="388" font-size="12" text-anchor="middle" fill="#334155">balance + ?</text>
  <text x="622" y="408" font-size="12" text-anchor="middle" fill="#334155">WHERE user_id = ?</text>

  <line x1="270" y1="442" x2="270" y2="466" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arDtm1)"/>
  <text x="278" y="458" font-size="11" fill="#16a34a">err == nil</text>
  <line x1="730" y1="442" x2="730" y2="466" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arDtm1)"/>
  <text x="738" y="458" font-size="11" fill="#dc2626">err != nil</text>

  <rect x="120" y="470" width="300" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="270" y="492" font-size="13" text-anchor="middle" fill="#14532d">写回成功字符串</text>
  <text x="270" y="512" font-size="11" text-anchor="middle" fill="#14532d">w.Write(dtmcli.ResultSuccess)</text>

  <rect x="580" y="470" width="300" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="730" y="492" font-size="13" text-anchor="middle" fill="#7f1d1d">409 StatusConflict</text>
  <text x="730" y="512" font-size="12" text-anchor="middle" fill="#7f1d1d">确定的失败，不再重试</text>

  <text x="40" y="556" font-size="11" fill="#64748b">小结：重复请求返回 200 但不重复生效——6.3 实测第二次被 [barrier] 幂等拦截，余额只减一次、屏障只多 1 行。</text>
  <text x="40" y="578" font-size="11" fill="#64748b">超时与 500 要让 DTM 重试；ORM 取 *sql.Tx：GORM 走 tx.Statement.ConnPool，go-zero（≥ v1.2.0）走 conn.RawDB()。</text>
</svg>
