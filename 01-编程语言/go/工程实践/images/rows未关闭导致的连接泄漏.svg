<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <defs>
    <marker id="sq2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="sq3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="sq4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">rows 忘了 Close()：连接不归还，池子被一点点占满</text>

  <rect x="30" y="60" width="460" height="400" rx="8" fill="#f8fafc" stroke="#dc2626" stroke-width="1.5"/>
  <text x="50" y="92" font-size="15" font-weight="bold" fill="#dc2626">❌ 没写 defer rows.Close()</text>

  <rect x="50" y="120" width="130" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="115" y="146" text-anchor="middle" font-size="13" fill="#0f172a">池内连接</text>
  <text x="115" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">InUse = 1</text>
  <text x="115" y="189" text-anchor="middle" font-size="12" fill="#334155">Idle = 0</text>

  <line x1="180" y1="160" x2="212" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#sq2)"/>
  <rect x="212" y="132" width="148" height="56" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="286" y="156" text-anchor="middle" font-size="13" fill="#0f172a">请求 A 的 rows</text>
  <text x="286" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">没调用 Close()</text>

  <rect x="212" y="252" width="148" height="56" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="286" y="276" text-anchor="middle" font-size="13" fill="#0f172a">请求 B 想借连接</text>
  <text x="286" y="297" text-anchor="middle" font-size="12" fill="#334155">池里一条都拿不到</text>

  <line x1="212" y1="280" x2="182" y2="280" stroke="#dc2626" stroke-width="1.8" marker-end="url(#sq3)"/>
  <text x="180" y="300" text-anchor="end" font-size="12" font-weight="bold" fill="#dc2626">✕ 无可借连接</text>

  <text x="50" y="352" font-size="12" fill="#334155">请求 B 只能排队；等满超时时间后放弃</text>
  <text x="50" y="372" font-size="12" fill="#334155">→ err = context deadline exceeded</text>
  <text x="50" y="404" font-size="13" font-weight="bold" fill="#0f172a">Stats: InUse=1  Idle=0  WaitCount=1</text>
  <text x="50" y="428" font-size="12" fill="#dc2626">这就是连接泄漏的指纹 —— 数在涨，却没有任何报错</text>

  <line x1="500" y1="72" x2="500" y2="448" stroke="#e2e8f0" stroke-width="1.5"/>

  <rect x="510" y="60" width="460" height="400" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
  <text x="530" y="92" font-size="15" font-weight="bold" fill="#16a34a">✅ 读完并 Close()</text>

  <rect x="530" y="120" width="130" height="80" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="595" y="146" text-anchor="middle" font-size="13" fill="#0f172a">池内连接</text>
  <text x="595" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">InUse = 0</text>
  <text x="595" y="189" text-anchor="middle" font-size="12" fill="#334155">Idle = 1</text>

  <line x1="660" y1="160" x2="692" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#sq2)"/>
  <rect x="692" y="132" width="148" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="766" y="156" text-anchor="middle" font-size="13" fill="#0f172a">请求 A 的 rows</text>
  <text x="766" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">读完并 Close()</text>

  <rect x="692" y="252" width="148" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="766" y="276" text-anchor="middle" font-size="13" fill="#0f172a">请求 B 想借连接</text>
  <text x="766" y="297" text-anchor="middle" font-size="12" fill="#334155">立刻拿到空闲连接</text>

  <line x1="692" y1="280" x2="662" y2="280" stroke="#16a34a" stroke-width="1.8" marker-end="url(#sq4)"/>
  <text x="660" y="300" text-anchor="end" font-size="12" font-weight="bold" fill="#16a34a">✓ 直接复用</text>

  <text x="530" y="352" font-size="12" fill="#334155">连接在 Close 的瞬间归还到 Idle，重新可借</text>
  <text x="530" y="372" font-size="12" fill="#334155">→ err = nil，没有任何等待</text>
  <text x="530" y="404" font-size="13" font-weight="bold" fill="#0f172a">Stats: InUse=1  Idle=0  WaitCount=0</text>
  <text x="530" y="428" font-size="12" fill="#16a34a">对照组的 WaitCount 始终是 0</text>

  <rect x="30" y="478" width="940" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="54" y="504" font-size="13" font-weight="bold" fill="#0f172a">纪律：Query 之后立刻 defer rows.Close()；rows 在循环里创建时要包进独立函数，否则 defer 会堆到函数结束</text>
  <text x="54" y="526" font-size="13" fill="#334155">QueryRow 不需要 Close（Scan 时收尾）—— 两者签名像，这是「忘了关」最大的来源</text>
</svg>
