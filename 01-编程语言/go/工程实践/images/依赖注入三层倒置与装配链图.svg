<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect width="1000" height="560" fill="#ffffff"/>
<defs><marker id="arDIa" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker></defs>
<text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">依赖倒置与手动装配链路（不用框架）</text>
<text x="40" y="58" font-size="13" fill="#64748b">接口定义在使用方 biz，实现在 data；装配发生在 cmd/app/main.go，只此一处</text>

<rect x="480" y="90" width="300" height="92" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="630" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">biz 包 · 使用方定义契约</text>
<rect x="500" y="130" width="130" height="40" rx="6" fill="#ffffff" stroke="#16a34a"/>
<text x="565" y="155" text-anchor="middle" font-size="12" fill="#14532d">UserRepo 接口</text>
<rect x="670" y="130" width="90" height="40" rx="6" fill="#ffffff" stroke="#16a34a"/>
<text x="715" y="155" text-anchor="middle" font-size="12" fill="#14532d">UserBiz</text>

<line x1="670" y1="150" x2="638" y2="150" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arDIa)"/>
<text x="654" y="128" text-anchor="middle" font-size="11" fill="#ea580c">只持有接口</text>

<rect x="480" y="240" width="300" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="630" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">data 包 · userRepo 实现</text>
<text x="630" y="284" text-anchor="middle" font-size="12" fill="#1e3a8a">struct{ data *Data } · GetUser 查库</text>

<path d="M705 234 L705 206 L604 180" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arDIa)"/>
<text x="714" y="216" font-size="11" fill="#64748b">隐式实现（不必 import 接口声明）</text>

<text x="60" y="150" font-size="12" fill="#334155">NewBiz(data *Data) 把 biz 焊死在 data 上</text>
<text x="60" y="170" font-size="12" fill="#64748b">换实现 / 加缓存 / 写单测都要动源码（1.1）</text>
<text x="60" y="262" font-size="12" fill="#334155">测试换个装配点：biz.NewUserBiz(fakeRepo{})</text>
<text x="60" y="282" font-size="12" fill="#64748b">不连库、不起容器，单测毫秒级跑完（2.2）</text>

<text x="60" y="380" font-size="12" font-weight="bold" fill="#334155">cmd/app/main.go 装配顺序：d → repo → uc → ctrl → api</text>

<rect x="60" y="400" width="150" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="135" y="422" text-anchor="middle" font-size="12" fill="#334155">data.NewData()</text>
<text x="135" y="442" text-anchor="middle" font-size="11" fill="#64748b">d</text>

<rect x="250" y="400" width="160" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="330" y="422" text-anchor="middle" font-size="12" fill="#334155">data.NewUserRepo(d)</text>
<text x="330" y="442" text-anchor="middle" font-size="11" fill="#64748b">repo</text>

<rect x="460" y="400" width="160" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="540" y="422" text-anchor="middle" font-size="12" fill="#334155">biz.NewUserBiz(repo)</text>
<text x="540" y="442" text-anchor="middle" font-size="11" fill="#64748b">uc</text>

<rect x="670" y="400" width="250" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="795" y="422" text-anchor="middle" font-size="12" fill="#334155">NewUserController(uc) → NewAPI</text>
<text x="795" y="442" text-anchor="middle" font-size="11" fill="#64748b">ctrl → api.Handle()</text>

<line x1="210" y1="428" x2="242" y2="428" stroke="#334155" stroke-width="1.5" marker-end="url(#arDIa)"/>
<line x1="410" y1="428" x2="452" y2="428" stroke="#334155" stroke-width="1.5" marker-end="url(#arDIa)"/>
<line x1="620" y1="428" x2="662" y2="428" stroke="#334155" stroke-width="1.5" marker-end="url(#arDIa)"/>

<path d="M486 394 L486 360 L540 360 L540 302" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arDIa)"/>
<text x="426" y="352" font-size="11" fill="#2563eb">具体实现喂给接口参数</text>

<text x="60" y="500" font-size="11" fill="#64748b">小结：手写装配零依赖零开销、断点可一路单步；代价是样板代码随组件数线性增长，改签名要顺着改一串装配点（2.3）</text>
<text x="60" y="522" font-size="11" fill="#64748b">判据：参数缺失会让逻辑跑错 → 业务参数显式入参；只是可观测性变差 → 才走 context 元数据</text>
</svg>
