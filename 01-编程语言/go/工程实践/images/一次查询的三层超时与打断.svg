<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arDb" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">database/sql：一次查询的三段超时各管哪一段</text>
  <text x="40" y="58" font-size="13" fill="#64748b">db.QueryContext 从借连接到读结果共四段 —— context 管全程，DSN 的两个超时只管其中两段</text>

  <rect x="40" y="100" width="250" height="300" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="126" font-size="13" font-weight="bold" fill="#0f172a">context.WithTimeout</text>
  <text x="56" y="150" font-size="12" fill="#334155">设在哪：调用点</text>
  <text x="56" y="170" font-size="12" fill="#334155">管什么：整个操作</text>
  <text x="56" y="196" font-size="11" fill="#64748b">含 ① 排队等连接</text>
  <text x="56" y="216" font-size="11" fill="#64748b">含 ② 建连 ③ 执行</text>
  <text x="56" y="236" font-size="11" fill="#64748b">含 ④ 读取结果</text>
  <text x="56" y="262" font-size="11" fill="#64748b">排队时间 DSN 管不到</text>
  <text x="56" y="282" font-size="11" fill="#64748b">所以业务超时用它控</text>

  <rect x="330" y="100" width="380" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="520" y="124" font-size="13" text-anchor="middle" fill="#0f172a">① 向池借连接，池满则排队</text>
  <text x="520" y="146" font-size="12" text-anchor="middle" fill="#334155">等待不受 context 以外机制控制</text>

  <rect x="330" y="180" width="380" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="520" y="204" font-size="13" text-anchor="middle" fill="#0f172a">② 建立 TCP 连接</text>
  <text x="520" y="226" font-size="12" text-anchor="middle" fill="#334155">sql.Open 惰性，这一段到这里才发生</text>

  <rect x="330" y="260" width="380" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="520" y="284" font-size="13" text-anchor="middle" fill="#0f172a">③ 发语句与收发网络包</text>
  <text x="520" y="306" font-size="12" text-anchor="middle" fill="#334155">单次读 / 写各算一次超时</text>

  <rect x="330" y="340" width="380" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="520" y="364" font-size="13" text-anchor="middle" fill="#0f172a">④ 读取结果 rows.Next</text>
  <text x="520" y="386" font-size="12" text-anchor="middle" fill="#334155">ctx 管这段全程：排队 + 执行 + 读取</text>

  <line x1="290" y1="130" x2="330" y2="130" stroke="#2563eb" stroke-width="1.2"/>
  <line x1="290" y1="210" x2="330" y2="210" stroke="#2563eb" stroke-width="1.2"/>
  <line x1="290" y1="290" x2="330" y2="290" stroke="#2563eb" stroke-width="1.2"/>
  <line x1="290" y1="370" x2="330" y2="370" stroke="#2563eb" stroke-width="1.2"/>

  <line x1="520" y1="160" x2="520" y2="180" stroke="#334155" stroke-width="1.5" marker-end="url(#arDb)"/>
  <line x1="520" y1="240" x2="520" y2="260" stroke="#334155" stroke-width="1.5" marker-end="url(#arDb)"/>
  <line x1="520" y1="320" x2="520" y2="340" stroke="#334155" stroke-width="1.5" marker-end="url(#arDb)"/>

  <rect x="744" y="100" width="216" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="852" y="122" font-size="12" text-anchor="middle" fill="#334155">排队时请求是阻塞的</text>
  <text x="852" y="142" font-size="11" text-anchor="middle" fill="#64748b">表现：整体变慢、错误率 0</text>
  <line x1="710" y1="130" x2="744" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arDb)"/>

  <rect x="744" y="180" width="216" height="140" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="852" y="204" font-size="12" text-anchor="middle" fill="#78350f">DSN 侧只覆盖这两段</text>
  <text x="852" y="228" font-size="11" text-anchor="middle" fill="#78350f">?timeout=5s 只管建连</text>
  <text x="852" y="252" font-size="11" text-anchor="middle" fill="#78350f">readTimeout / writeTimeout</text>
  <text x="852" y="276" font-size="11" text-anchor="middle" fill="#78350f">单次读 / 写的网络层超时</text>
  <text x="852" y="300" font-size="11" text-anchor="middle" fill="#78350f">连不上时别卡死的兜底</text>
  <line x1="710" y1="250" x2="744" y2="250" stroke="#b45309" stroke-width="1.5" marker-end="url(#arDb)"/>

  <path d="M460,400 L460,420 L260,420 L260,440" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arDb)"/>
  <path d="M580,400 L580,420 L740,420 L740,440" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arDb)"/>

  <rect x="40" y="440" width="440" height="76" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="260" y="464" font-size="13" text-anchor="middle" fill="#7f1d1d">实测：SELECT SLEEP(2) 配 200ms 超时</text>
  <text x="260" y="486" font-size="12" text-anchor="middle" fill="#7f1d1d">err = context deadline exceeded</text>
  <text x="260" y="506" font-size="12" text-anchor="middle" fill="#7f1d1d">errors.Is = true · 实际用时 &lt; 1s</text>

  <rect x="520" y="440" width="440" height="76" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="740" y="464" font-size="13" text-anchor="middle" fill="#7c2d12">超时之后：那条连接不再复用</text>
  <text x="740" y="486" font-size="12" text-anchor="middle" fill="#7c2d12">客户端发 KILL 停掉查询</text>
  <text x="740" y="506" font-size="12" text-anchor="middle" fill="#7c2d12">直接关闭，不放回池</text>

  <text x="40" y="548" font-size="11" fill="#64748b">判据：用 context 控制业务超时（它覆盖排队时间，这是 DSN 超时做不到的），DSN 的 timeout 只作「连不上时别卡死」的兜底。</text>
  <text x="40" y="570" font-size="11" fill="#64748b">错误文本是 context deadline exceeded 而不是 sql: ...，所以判超时用 errors.Is(err, context.DeadlineExceeded)。</text>
  <text x="40" y="592" font-size="11" fill="#64748b">后果：大量超时 = 连接被大量重建，池会更频繁触顶 —— 超时率高的服务要给 MaxOpenConns 留余量。</text>
</svg>
