<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect width="1000" height="520" fill="#ffffff"/>
<defs><marker id="arCFa" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker></defs>
<text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">快照模型：请求只读不可变快照，重载时一次性换指针</text>
<text x="40" y="58" font-size="13" fill="#64748b">不要在请求路径上读配置 —— 重载时把配置「编译」成不可变快照；判据：这个字段是配置的产物，还是运行时的累积</text>

<rect x="40" y="80" width="440" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="60" y="106" font-size="13" font-weight="bold" fill="#334155">Gateway 实例</text>

<rect x="70" y="126" width="230" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="185" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">st atomic.Value</text>
<text x="185" y="174" text-anchor="middle" font-size="11" fill="#1e3a8a">snapshot()：st.Load()</text>

<rect x="70" y="230" width="230" height="140" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="185" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">运行时累积 · 重载时不动</text>
<text x="185" y="280" text-anchor="middle" font-size="11" fill="#334155">g.mu（复用/重建逻辑用）</text>
<text x="185" y="300" text-anchor="middle" font-size="11" fill="#334155">连接池 / 限流桶</text>
<text x="185" y="320" text-anchor="middle" font-size="11" fill="#334155">指标 / 访问日志</text>
<text x="185" y="344" text-anchor="middle" font-size="11" fill="#64748b">重建 = 泄漏 / 断线 / 曲线断裂</text>

<rect x="540" y="90" width="300" height="130" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="690" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">*state 不可变快照</text>
<text x="690" y="138" text-anchor="middle" font-size="11" fill="#1e3a8a">cfg + router：正则已编译、排好序</text>
<text x="690" y="158" text-anchor="middle" font-size="11" fill="#1e3a8a">trustedProxies：CIDR → 前缀集合</text>
<text x="690" y="178" text-anchor="middle" font-size="11" fill="#1e3a8a">authn = New(JWTSecret, APIKey)</text>
<text x="690" y="202" text-anchor="middle" font-size="11" fill="#64748b">三件事只在重载时做一次</text>

<line x1="300" y1="156" x2="532" y2="156" stroke="#334155" stroke-width="1.5" marker-end="url(#arCFa)"/>
<text x="416" y="146" text-anchor="middle" font-size="11" fill="#334155">Load() 取当前快照引用</text>

<rect x="540" y="270" width="300" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="690" y="288" text-anchor="middle" font-size="12" fill="#14532d">newState(cfg)：编译快照</text>
<text x="690" y="308" text-anchor="middle" font-size="11" fill="#14532d">Validate → 解析 CIDR → 编译路由</text>
<text x="690" y="326" text-anchor="middle" font-size="11" fill="#14532d">在 g.mu.Lock() 之前完成（锁外）</text>

<line x1="690" y1="264" x2="690" y2="226" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arCFa)"/>
<text x="700" y="250" text-anchor="start" font-size="11" fill="#16a34a">编译成功后 Store 一次性切换</text>

<rect x="70" y="440" width="770" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="455" y="462" text-anchor="middle" font-size="12" fill="#854d0e">若新建实例 g2 := New(cfg2)：gRPC 连接池重建 = 已建连接泄漏；限流桶重建 = 额度被重置；指标重置 = 曲线断裂</text>
<text x="455" y="484" text-anchor="middle" font-size="11" fill="#854d0e">确实要新建实例，必须先 Close 旧实例；不一致窗口只有一次 Store 的时间</text>

<text x="560" y="380" font-size="12" fill="#334155">请求路径：一次无锁读</text>
<text x="560" y="402" font-size="11" fill="#64748b">配置变更不带来锁竞争</text>
<text x="40" y="516" font-size="11" fill="#64748b">正则在每请求现编是毫秒级操作（本项目实测正则预编译收益约 39×）；错误配置在启动期暴露，而不是等请求打进来变 500</text>
</svg>
