<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">接入 ActiveMQ 先选协议：Go 只用到 61613 与 8161</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">本机 apache/activemq-classic:6.1.4 单机；四个 transportConnector 同时监听，选错端口得到的是协议错误</text>

  <rect x="50" y="96" width="250" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="175" y="122" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">Go 服务</text>
  <text x="175" y="146" text-anchor="middle" font-size="11.5" fill="#334155">go-stomp/v3 v3.1.5</text>
  <text x="175" y="168" text-anchor="middle" font-size="11.5" fill="#334155">*stomp.Conn 单例</text>
  <text x="175" y="190" text-anchor="middle" font-size="11.5" fill="#334155">Subscribe + AckClientIndividual</text>
  <text x="175" y="214" text-anchor="middle" font-size="11.5" fill="#475569">Send / 事务 / 延迟头</text>

  <rect x="375" y="96" width="250" height="150" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="500" y="122" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c2d12">Java 服务</text>
  <text x="500" y="146" text-anchor="middle" font-size="11.5" fill="#334155">activemq-client 6.1.4</text>
  <text x="500" y="168" text-anchor="middle" font-size="11.5" fill="#334155">ConnectionFactory / Session</text>
  <text x="500" y="190" text-anchor="middle" font-size="11.5" fill="#334155">JMS 1.1 语义（jakarta.jms）</text>
  <text x="500" y="214" text-anchor="middle" font-size="11.5" fill="#475569">openwire 协议</text>

  <rect x="700" y="86" width="250" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="825" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">broker（单机）</text>

  <rect x="720" y="128" width="210" height="54" rx="7" fill="#ffffff" stroke="#94a3b8"/>
  <text x="825" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">61613 STOMP</text>
  <text x="825" y="170" text-anchor="middle" font-size="11" fill="#475569">Go 的唯一入口</text>

  <rect x="720" y="196" width="210" height="54" rx="7" fill="#ffffff" stroke="#94a3b8"/>
  <text x="825" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">61616 OpenWire</text>
  <text x="825" y="238" text-anchor="middle" font-size="11" fill="#475569">Java 的默认入口</text>

  <rect x="720" y="264" width="210" height="54" rx="7" fill="#ffffff" stroke="#94a3b8"/>
  <text x="825" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">5672 AMQP 1.0 / 1883 MQTT</text>
  <text x="825" y="306" text-anchor="middle" font-size="11" fill="#475569">amqp091-go 不通用</text>

  <rect x="720" y="332" width="210" height="54" rx="7" fill="#ffffff" stroke="#94a3b8"/>
  <text x="825" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">61614 WebSocket</text>
  <text x="825" y="374" text-anchor="middle" font-size="11" fill="#475569">当 STOMP 端口连会报 invalid command</text>

  <rect x="720" y="400" width="210" height="80" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.3"/>
  <text x="825" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#713f12">8161 控制台 / Jolokia</text>
  <text x="825" y="444" text-anchor="middle" font-size="11" fill="#475569">admin/admin</text>
  <text x="825" y="464" text-anchor="middle" font-size="11" fill="#475569">Jolokia 需带 Origin 头</text>

  <line x1="300" y1="171" x2="712" y2="155" stroke="#2563eb" stroke-width="2"/>
  <polygon points="720,153 708,147 708,159" fill="#2563eb"/>
  <text x="500" y="140" text-anchor="middle" font-size="11.5" fill="#1d4ed8">tcp://host:61613</text>

  <line x1="625" y1="171" x2="712" y2="223" stroke="#ea580c" stroke-width="2"/>
  <polygon points="720,225 708,217 710,230" fill="#ea580c"/>
  <text x="690" y="205" text-anchor="middle" font-size="11" fill="#c2410c">61616</text>

  <line x1="300" y1="200" x2="712" y2="440" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="6 4"/>
  <polygon points="720,442 708,434 710,447" fill="#2563eb"/>
  <text x="500" y="330" text-anchor="middle" font-size="11.5" fill="#1d4ed8">队列计数 / 死信复核</text>

  <rect x="50" y="286" width="575" height="220" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="337" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">目的地语义（STOMP 前缀决定）</text>
  <text x="70" y="340" font-size="12" fill="#334155">/queue/xxx：点对点，一条消息只给一个消费者</text>
  <text x="70" y="364" font-size="12" fill="#334155">/topic/xxx：发布订阅，每个订阅者各收一份</text>
  <text x="70" y="388" font-size="12" fill="#334155">选择器：订阅时带 activemq.selector，broker 侧过滤</text>
  <text x="70" y="412" font-size="12" fill="#334155">延迟：发送时带 AMQ_SCHEDULED_DELAY（毫秒）</text>
  <text x="70" y="436" font-size="12" fill="#7f1d1d">鉴权：本机未配 simpleAuthenticationPlugin，任意账号可连</text>
  <text x="70" y="460" font-size="12" fill="#475569">死信：默认队列 ActiveMQ.DLQ，前提是 broker 侧重投策略到位</text>
  <text x="70" y="484" font-size="12" fill="#475569">心跳：ConnOpt.HeartBeat(10s, 10s)，双向保活并发现半开连接</text>

  <rect x="50" y="530" width="900" height="32" rx="6" fill="#ffffff"/>
  <text x="500" y="551" text-anchor="middle" font-size="12" fill="#64748b">一句话：协议选 STOMP、端口认 61613、目的地前缀决定语义、鉴权在 broker 侧补。</text>
</svg>
