<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="610" fill="#ffffff"/>
  <defs>
    <marker id="arDtmS" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="arDtmO" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/></marker>
  </defs>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">Saga 失败回滚：应用侧的调用时序（6.2 实测）</text>
  <text x="40" y="58" font-size="13" fill="#64748b">TransIn 分支返回 409 后，DTM 按反向顺序推进 compensate，屏障表把空补偿拦下</text>

  <line x1="110" y1="128" x2="110" y2="490" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="310" y1="128" x2="310" y2="490" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="530" y1="128" x2="530" y2="490" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="730" y1="128" x2="730" y2="490" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>

  <rect x="30" y="76" width="160" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="96" font-size="13" text-anchor="middle" fill="#0f172a">发起方业务代码</text>
  <text x="110" y="116" font-size="12" text-anchor="middle" fill="#334155">saga.Submit()</text>

  <rect x="230" y="76" width="160" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="310" y="96" font-size="13" text-anchor="middle" fill="#0f172a">DTM 服务</text>
  <text x="310" y="116" font-size="12" text-anchor="middle" fill="#334155">api/dtmsvr</text>

  <rect x="440" y="76" width="180" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="530" y="96" font-size="13" text-anchor="middle" fill="#0f172a">业务服务 app:8081</text>
  <text x="530" y="116" font-size="12" text-anchor="middle" fill="#334155">BranchBarrier 回调</text>

  <rect x="640" y="76" width="180" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="730" y="96" font-size="12" text-anchor="middle" fill="#0f172a">dtm_barrier.barrier</text>
  <text x="730" y="116" font-size="12" text-anchor="middle" fill="#334155">屏障唯一键</text>

  <line x1="110" y1="150" x2="306" y2="150" stroke="#334155" stroke-width="1.5" marker-end="url(#arDtmS)"/>
  <text x="210" y="142" font-size="11" text-anchor="middle" fill="#0f172a">Submit() 同步等待</text>

  <line x1="310" y1="186" x2="526" y2="186" stroke="#334155" stroke-width="1.5" marker-end="url(#arDtmS)"/>
  <text x="418" y="178" font-size="11" text-anchor="middle" fill="#0f172a">POST /api/TransOut 01/action</text>

  <line x1="530" y1="222" x2="726" y2="222" stroke="#334155" stroke-width="1.5" marker-end="url(#arDtmS)"/>
  <text x="628" y="214" font-size="11" text-anchor="middle" fill="#0f172a">屏障键 + UPDATE 同事务</text>

  <line x1="310" y1="258" x2="526" y2="258" stroke="#334155" stroke-width="1.5" marker-end="url(#arDtmS)"/>
  <text x="418" y="250" font-size="11" text-anchor="middle" fill="#0f172a">POST /api/TransIn 02/action</text>

  <line x1="530" y1="294" x2="726" y2="294" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arDtmS)"/>
  <text x="628" y="286" font-size="11" text-anchor="middle" fill="#7f1d1d">正向失败，键一起回滚</text>

  <line x1="530" y1="330" x2="314" y2="330" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arDtmS)"/>
  <text x="420" y="322" font-size="11" text-anchor="middle" fill="#7f1d1d">409 注入失败：转出账号被冻结</text>

  <line x1="310" y1="366" x2="526" y2="366" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arDtmO)"/>
  <text x="418" y="358" font-size="11" text-anchor="middle" fill="#7c2d12">TransInCompensate 02/compensate</text>

  <line x1="530" y1="402" x2="726" y2="402" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arDtmO)"/>
  <text x="628" y="394" font-size="11" text-anchor="middle" fill="#7c2d12">无正向键，空补偿拦截</text>

  <line x1="310" y1="438" x2="526" y2="438" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arDtmO)"/>
  <text x="418" y="430" font-size="11" text-anchor="middle" fill="#7c2d12">TransOutCompensate 01/compensate</text>

  <line x1="530" y1="474" x2="314" y2="474" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arDtmS)"/>
  <text x="420" y="466" font-size="11" text-anchor="middle" fill="#14532d">两分支补偿完成</text>

  <line x1="310" y1="490" x2="114" y2="490" stroke="#334155" stroke-width="1.5" marker-end="url(#arDtmS)"/>
  <text x="210" y="506" font-size="11" text-anchor="middle" fill="#7f1d1d">全局事务判定为失败</text>

  <text x="40" y="352" font-size="11" fill="#ea580c">反向顺序推进补偿</text>

  <path d="M310,496 L310,524 L656,524" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arDtmS)"/>
  <rect x="660" y="492" width="300" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="810" y="516" font-size="12" text-anchor="middle" fill="#7f1d1d">status = failed</text>
  <text x="810" y="538" font-size="12" text-anchor="middle" fill="#7f1d1d">全局事务表落库</text>

  <text x="40" y="578" font-size="11" fill="#64748b">小结：rollback_reason = url:http://app:8081/api/TransIn return failed；空补偿被拦下，TransIn 从未生效。</text>
  <text x="40" y="598" font-size="11" fill="#64748b">成功路径对照：01/action 与 02/action 全部 [ok]，屏障 2 行，trans_global 中 status = succeed。</text>
</svg>
