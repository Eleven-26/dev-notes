<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arKfC" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">kafka-go 消费端：取消息、提交位点与优雅退出</text>
  <text x="40" y="58" font-size="13" fill="#64748b">CommitInterval: 0 关掉自动提交，FetchMessage 只取不提交，处理成功后再 CommitMessages</text>

  <rect x="300" y="76" width="400" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="98" font-size="13" text-anchor="middle" fill="#0f172a">每个消费组 / 订阅建一个 Reader</text>
  <text x="500" y="118" font-size="12" text-anchor="middle" fill="#334155">GroupID: golang-lab-group，Topic: go-lab</text>

  <rect x="40" y="76" width="236" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="158" y="98" font-size="12" text-anchor="middle" fill="#334155">非单例：一个订阅一份状态</text>
  <text x="158" y="118" font-size="12" text-anchor="middle" fill="#64748b">Reader 不是并发安全的</text>
  <line x1="276" y1="104" x2="300" y2="104" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arKfC)"/>

  <rect x="744" y="76" width="216" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="852" y="98" font-size="12" text-anchor="middle" fill="#334155">StartOffset 仅组内无位点</text>
  <text x="852" y="118" font-size="11" text-anchor="middle" fill="#64748b">已有位点改它无效，换 GroupID</text>
  <line x1="700" y1="104" x2="744" y2="104" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arKfC)"/>

  <line x1="500" y1="132" x2="500" y2="152" stroke="#334155" stroke-width="1.5" marker-end="url(#arKfC)"/>

  <rect x="300" y="152" width="400" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="174" font-size="13" text-anchor="middle" fill="#0f172a">FetchMessage(ctx) —— 只取不提交</text>
  <text x="500" y="194" font-size="12" text-anchor="middle" fill="#334155">MaxWait: 500ms · CommitInterval: 0</text>

  <line x1="500" y1="204" x2="500" y2="222" stroke="#334155" stroke-width="1.5" marker-end="url(#arKfC)"/>

  <rect x="300" y="222" width="400" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="244" font-size="13" text-anchor="middle" fill="#0f172a">处理业务，打印 partition / offset / key</text>
  <text x="500" y="264" font-size="12" text-anchor="middle" fill="#334155">重平衡与失败重试都会重复 → 必须幂等</text>

  <rect x="40" y="222" width="236" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="158" y="244" font-size="12" text-anchor="middle" fill="#7c2d12">失败 continue：不提交</text>
  <text x="158" y="262" font-size="11" text-anchor="middle" fill="#7c2d12">重启后重复消费，靠幂等兜底</text>
  <line x1="300" y1="248" x2="276" y2="248" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arKfC)"/>

  <line x1="500" y1="274" x2="500" y2="292" stroke="#334155" stroke-width="1.5" marker-end="url(#arKfC)"/>

  <rect x="300" y="292" width="400" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="500" y="314" font-size="13" text-anchor="middle" fill="#14532d">CommitMessages(ctx, m)：处理成功后提交</text>
  <text x="500" y="334" font-size="12" text-anchor="middle" fill="#14532d">实测 CURRENT-OFFSET=3，LAG=0</text>

  <path d="M700,318 L800,318 L800,178 L700,178" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arKfC)"/>

  <line x1="500" y1="344" x2="500" y2="364" stroke="#334155" stroke-width="1.5" marker-end="url(#arKfC)"/>

  <rect x="300" y="364" width="400" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="386" font-size="13" text-anchor="middle" fill="#0f172a">SIGTERM / SIGINT → r.Close()</text>
  <text x="500" y="406" font-size="12" text-anchor="middle" fill="#334155">先停止拉取 → 处理完在途消息 → 最后 Close</text>
  <text x="500" y="424" font-size="12" text-anchor="middle" fill="#334155">Close 提交一次位点，不调用则本次进度丢失</text>

  <text x="40" y="456" font-size="11" fill="#64748b">小结：GroupID 留空会退化成独立消费者——不参与消费组、不自动分配分区，「加了实例但消费不动」通常是这一条漏了。</text>
  <text x="40" y="476" font-size="11" fill="#64748b">分区数要 ≥ 想要达到的消费并发度，否则多出的实例分不到分区、空转（LAG 不动）。</text>
</svg>
