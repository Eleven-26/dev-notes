<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="580" fill="#ffffff"/>
  <defs>
    <marker id="arFz" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">fuzz 语料的一生：从种子到回归用例</text>
  <text x="40" y="58" font-size="13" fill="#64748b">左列是容器里真跑出来的一条链（5 秒预算、0.05 秒命中）；右列是三层语料各归谁写、谁读、要不要提交</text>

  <rect x="60" y="80" width="420" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="102" font-size="13" text-anchor="middle" fill="#0f172a">① 种子只是起点</text>
  <text x="270" y="122" font-size="12" text-anchor="middle" fill="#334155">f.Add("order-id=1001", "=") · f.Add("a,b,c", ",")</text>
  <text x="270" y="138" font-size="11" text-anchor="middle" fill="#64748b">不带 -fuzz 时种子被逐个执行：seed#0 / seed#1 都 PASS</text>

  <rect x="60" y="164" width="420" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="186" font-size="13" text-anchor="middle" fill="#0f172a">② 覆盖率引导的变异</text>
  <text x="270" y="206" font-size="11" text-anchor="middle" fill="#334155">gathering baseline coverage: 2/2 completed</text>
  <text x="270" y="222" font-size="11" text-anchor="middle" fill="#334155">now fuzzing with 4 workers（= GOMAXPROCS）</text>

  <rect x="60" y="248" width="420" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="270" font-size="13" text-anchor="middle" fill="#0f172a">③ execs: 11 (231/sec)</text>
  <text x="270" y="290" font-size="11" text-anchor="middle" fill="#334155">new interesting: 0 (total: 2)</text>
  <text x="270" y="306" font-size="11" text-anchor="middle" fill="#64748b">能走到新代码路径的输入才算数</text>

  <rect x="60" y="332" width="420" height="76" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="270" y="356" font-size="13" text-anchor="middle" fill="#7f1d1d">④ 给了 5 秒预算，0.05 秒命中</text>
  <text x="270" y="378" font-size="11" text-anchor="middle" fill="#7f1d1d">panic: runtime error: index out of range [0] with length 0</text>
  <text x="270" y="398" font-size="11" text-anchor="middle" fill="#7f1d1d">fuzz_test.go:16 → return head, tail[0]，实参长度 1</text>

  <rect x="60" y="428" width="420" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="270" y="452" font-size="13" text-anchor="middle" fill="#14532d">⑤ 最小化后落盘 = 一条普通回归用例</text>
  <text x="270" y="474" font-size="11" text-anchor="middle" fill="#14532d">go test fuzz v1 / string("0") / string("0")</text>
  <text x="270" y="494" font-size="11" text-anchor="middle" fill="#14532d">不带 -fuzz 也红；再开 -fuzz 先回放语料就停</text>

  <line x1="270" y1="144" x2="270" y2="164" stroke="#334155" stroke-width="1.5" marker-end="url(#arFz)"/>
  <line x1="270" y1="228" x2="270" y2="248" stroke="#334155" stroke-width="1.5" marker-end="url(#arFz)"/>
  <line x1="270" y1="312" x2="270" y2="332" stroke="#334155" stroke-width="1.5" marker-end="url(#arFz)"/>
  <line x1="270" y1="408" x2="270" y2="428" stroke="#334155" stroke-width="1.5" marker-end="url(#arFz)"/>

  <rect x="520" y="80" width="440" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="740" y="102" font-size="12" text-anchor="middle" fill="#0f172a">语料① f.Add(...) 写在代码里</text>
  <text x="740" y="122" font-size="11" text-anchor="middle" fill="#334155">种子语料：你写</text>
  <text x="740" y="140" font-size="11" text-anchor="middle" fill="#64748b">go test 不带 -fuzz 时也会逐个执行</text>

  <rect x="520" y="168" width="440" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="740" y="190" font-size="12" text-anchor="middle" fill="#14532d">语料② testdata/fuzz/FuzzXxx/*</text>
  <text x="740" y="210" font-size="11" text-anchor="middle" fill="#14532d">用例语料，含 crasher：框架写、你审</text>
  <text x="740" y="228" font-size="11" text-anchor="middle" fill="#14532d">要提交进版本库</text>

  <rect x="520" y="256" width="440" height="72" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="740" y="278" font-size="12" text-anchor="middle" fill="#334155">语料③ $GOCACHE/fuzz/&lt;模块&gt;/&lt;目标&gt;</text>
  <text x="740" y="298" font-size="11" text-anchor="middle" fill="#64748b">覆盖语料缓存：框架自用</text>
  <text x="740" y="316" font-size="11" text-anchor="middle" fill="#64748b">跨机器不共享，别提交</text>

  <rect x="520" y="344" width="440" height="72" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="740" y="366" font-size="12" text-anchor="middle" fill="#334155">两种坏写法在 vet 阶段就 [build failed]</text>
  <text x="740" y="386" font-size="11" text-anchor="middle" fill="#64748b">fuzzing arguments can only have the following types</text>
  <text x="740" y="404" font-size="11" text-anchor="middle" fill="#64748b">mismatched type in call to (*testing.F).Add</text>

  <rect x="520" y="432" width="440" height="72" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="740" y="454" font-size="12" text-anchor="middle" fill="#7c2d12">修复顺序：先修被测函数</text>
  <text x="740" y="474" font-size="11" text-anchor="middle" fill="#7c2d12">再删语料文件，最后重跑 fuzz 确认没有新 crasher</text>
  <text x="740" y="492" font-size="11" text-anchor="middle" fill="#7c2d12">最小化预算：-fuzzminimizetime 默认 60s，可压到 1s</text>

  <text x="40" y="536" font-size="11" fill="#64748b">种子全绿不代表函数安全——种子只是「你想得到的输入」；别把 CI 变红当成 fuzz 的副作用，它正是 fuzz 唯一有价值的产出。</text>
  <text x="40" y="558" font-size="11" fill="#64748b">最小反例 ("0", "0")：strings.Cut("0","0") 命中分隔符、后半段空串，tail[0] 越界；支持的参数类型只有那 14 种。</text>
</svg>
