<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect width="1000" height="560" fill="#ffffff"/>
<defs><marker id="arI18n" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker></defs>
<text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">gotext 三步工作流：extract → 翻译 → generate</text>
<text x="40" y="58" font-size="13" fill="#64748b">update = extract + import + merge + export（+ 生成）；开发期一条 update，CI 里常拆成两步</text>

<text x="60" y="92" font-size="13" font-weight="bold" fill="#334155">编译期管线</text>

<rect x="60" y="104" width="150" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="135" y="130" text-anchor="middle" font-size="12" fill="#1e3a8a">业务源码</text>
<text x="135" y="152" text-anchor="middle" font-size="11" fill="#1e3a8a">p.Printf 等三方法</text>

<rect x="240" y="104" width="150" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="315" y="130" text-anchor="middle" font-size="12" fill="#334155">gotext extract</text>
<text x="315" y="152" text-anchor="middle" font-size="11" fill="#64748b">go generate 驱动</text>

<rect x="420" y="104" width="150" height="64" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="495" y="130" text-anchor="middle" font-size="12" fill="#854d0e">out.gotext.json</text>
<text x="495" y="152" text-anchor="middle" font-size="11" fill="#854d0e">发出去的待翻译清单</text>

<rect x="600" y="104" width="150" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="675" y="130" text-anchor="middle" font-size="12" fill="#14532d">messages.gotext.json</text>
<text x="675" y="152" text-anchor="middle" font-size="11" fill="#14532d">翻译成果另存</text>

<rect x="780" y="104" width="160" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="860" y="130" text-anchor="middle" font-size="12" fill="#1e3a8a">catalog.go（生成物）</text>
<text x="860" y="152" text-anchor="middle" font-size="11" fill="#1e3a8a">gotext -out 生成</text>

<line x1="210" y1="136" x2="232" y2="136" stroke="#334155" stroke-width="1.5" marker-end="url(#arI18n)"/>
<line x1="390" y1="136" x2="412" y2="136" stroke="#334155" stroke-width="1.5" marker-end="url(#arI18n)"/>
<line x1="570" y1="136" x2="592" y2="136" stroke="#334155" stroke-width="1.5" marker-end="url(#arI18n)"/>
<line x1="750" y1="136" x2="772" y2="136" stroke="#334155" stroke-width="1.5" marker-end="url(#arI18n)"/>
<text x="495" y="94" text-anchor="middle" font-size="11" fill="#b45309">① 抽取 · 重新 extract 整份覆盖</text>
<text x="675" y="94" text-anchor="middle" font-size="11" fill="#16a34a">② 人工填 translation 后另存</text>
<text x="860" y="94" text-anchor="middle" font-size="11" fill="#2563eb">③ generate</text>

<line x1="860" y1="168" x2="860" y2="242" stroke="#334155" stroke-width="1.5" marker-end="url(#arI18n)"/>

<rect x="690" y="248" width="290" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="850" y="270" text-anchor="middle" font-size="12" fill="#334155">init()：message.DefaultCatalog = cat</text>
<text x="850" y="292" text-anchor="middle" font-size="11" fill="#64748b">fallback = MustParse("en-US")</text>

<line x1="850" y1="304" x2="850" y2="393" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arI18n)"/>
<text x="842" y="352" text-anchor="end" font-size="11" fill="#ea580c">blank import 触发 init 完成注册</text>

<text x="60" y="386" font-size="13" font-weight="bold" fill="#334155">运行时链路</text>

<rect x="60" y="400" width="220" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="170" y="426" text-anchor="middle" font-size="12" fill="#334155">Cookie lang + Accept-Language</text>
<text x="170" y="448" text-anchor="middle" font-size="11" fill="#64748b">extract_http 示例写法</text>

<rect x="340" y="400" width="240" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="460" y="426" text-anchor="middle" font-size="12" fill="#1e3a8a">message.MatchLanguage 挑最匹配</text>
<text x="460" y="448" text-anchor="middle" font-size="11" fill="#1e3a8a">language.NewMatcher(所有语种)</text>

<rect x="640" y="400" width="220" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="750" y="426" text-anchor="middle" font-size="12" fill="#1e3a8a">message.NewPrinter(tag)</text>
<text x="750" y="448" text-anchor="middle" font-size="11" fill="#1e3a8a">查不到 → Fallback 落源语种</text>

<line x1="280" y1="432" x2="332" y2="432" stroke="#334155" stroke-width="1.5" marker-end="url(#arI18n)"/>
<line x1="580" y1="432" x2="632" y2="432" stroke="#334155" stroke-width="1.5" marker-end="url(#arI18n)"/>

<text x="40" y="510" font-size="11" fill="#64748b">抽取器硬限制：只认 Printf / Sprintf / Fprintf（seedEndpoints 硬编码），Print/Println 与 fmt.Printf 一个字都抽不到且不报错；包里必须 import x/text/message</text>
<text x="40" y="532" font-size="11" fill="#64748b">id 是翻译表主键：改源码格式串 = 换了一条新消息，旧翻译失效；没有 catalog 时两边都输出源文</text>
</svg>
