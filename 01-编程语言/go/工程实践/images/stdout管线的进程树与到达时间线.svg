<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="610" fill="#ffffff"/>

  <text x="20" y="28" font-size="20" font-weight="bold" fill="#0f172a">stdout 管线的两个卡点：杀父不杀子（超时）与等进程退出才拿全（读取）</text>

  <defs>
    <marker id="arrDark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#475569"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="14" y="42" width="972" height="292" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="28" y="64" font-size="14" font-weight="bold" fill="#334155">面板 A：超时的三个场景（ctx 都在 300 ms 到点；命令含 sleep 5）</text>

  <text x="34" y="106" font-size="12" font-weight="bold" fill="#475569">场景 1</text>
  <text x="34" y="124" font-size="11" fill="#64748b">exec sleep 5</text>
  <text x="34" y="140" font-size="11" fill="#64748b">无中间层</text>
  <rect x="190" y="92" width="120" height="44" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="250" y="110" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">sleep</text>
  <text x="250" y="127" font-size="10" text-anchor="middle" fill="#991b1b">300ms 被 SIGKILL</text>
  <path d="M150 114 L 186 114" stroke="#475569" stroke-width="1.5" marker-end="url(#arrDark)"/>
  <text x="152" y="104" font-size="10" fill="#64748b">直接子进程</text>
  <rect x="360" y="92" width="250" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="372" y="110" font-size="12" fill="#14532d">300 ms 返回，TimedOut=true</text>
  <text x="372" y="127" font-size="11" fill="#15803d">CommandContext 正常工作</text>
  <path d="M310 114 L 356 114" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrDark)"/>

  <text x="34" y="192" font-size="12" font-weight="bold" fill="#475569">场景 2</text>
  <text x="34" y="210" font-size="11" fill="#64748b">bash -c "sleep 5"</text>
  <text x="34" y="226" font-size="11" fill="#64748b">套了一层 shell</text>
  <rect x="190" y="160" width="120" height="44" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="250" y="178" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">bash ✕</text>
  <text x="250" y="195" font-size="10" text-anchor="middle" fill="#991b1b">300ms 只杀了它</text>
  <rect x="360" y="160" width="130" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="425" y="178" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">sleep（孙子）</text>
  <text x="425" y="195" font-size="10" text-anchor="middle" fill="#64748b">还活着</text>
  <rect x="540" y="160" width="170" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="625" y="178" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a5f">CombinedOutput</text>
  <text x="625" y="195" font-size="10" text-anchor="middle" fill="#1e3a5f">读不到 EOF</text>
  <path d="M310 182 L 356 182" stroke="#475569" stroke-width="1.5" marker-end="url(#arrDark)"/>
  <text x="314" y="172" font-size="10" fill="#94a3b8">fork 子→孙</text>
  <path d="M490 182 L 536 182" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <text x="494" y="170" font-size="10" fill="#dc2626">握着管道写端</text>
  <rect x="740" y="160" width="234" height="44" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="752" y="178" font-size="12" fill="#991b1b">实测 5.08 s 才返回</text>
  <text x="752" y="195" font-size="11" fill="#dc2626">超时形同虚设（Java 同坑 5083 ms）</text>
  <path d="M710 182 L 736 182" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrRed)"/>

  <text x="34" y="286" font-size="12" font-weight="bold" fill="#475569">场景 3</text>
  <text x="34" y="304" font-size="11" fill="#64748b">场景 2 + WaitDelay</text>
  <text x="34" y="320" font-size="11" fill="#64748b">= 500 ms 兜底</text>
  <rect x="190" y="254" width="120" height="44" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="250" y="272" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">bash ✕</text>
  <text x="250" y="289" font-size="10" text-anchor="middle" fill="#991b1b">300ms 被杀</text>
  <rect x="360" y="254" width="130" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="425" y="272" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">sleep</text>
  <text x="425" y="289" font-size="10" text-anchor="middle" fill="#94a3b8">仍在后台跑 ⚠️</text>
  <rect x="540" y="254" width="170" height="44" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="625" y="272" font-size="12" font-weight="bold" text-anchor="middle" fill="#b45309">800 ms 拆掉管道</text>
  <text x="625" y="289" font-size="10" text-anchor="middle" fill="#b45309">err = exec.ErrWaitDelay</text>
  <path d="M310 276 L 356 276" stroke="#475569" stroke-width="1.5" marker-end="url(#arrDark)"/>
  <path d="M490 276 L 536 276" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrDark)"/>
  <text x="498" y="264" font-size="10" fill="#b45309">到点强拆</text>
  <rect x="740" y="254" width="234" height="44" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="752" y="272" font-size="12" fill="#b45309">800 ms 返回：我不再等了</text>
  <text x="752" y="289" font-size="11" fill="#b45309">⚠️ 不等于孙子被杀（未 Linux 实测）</text>
  <path d="M710 276 L 736 276" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrDark)"/>

  <rect x="14" y="346" width="972" height="220" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="28" y="368" font-size="14" font-weight="bold" fill="#334155">面板 B：同一条 stdout 管道，两种读法的行到达时间线</text>
  <text x="28" y="388" font-size="11" fill="#64748b">命令：bash -c "echo 1; sleep 1; echo 2; echo 3"（横轴 0 → 1.1 s，刻度 0 / 500 ms / 1000 ms）</text>

  <line x1="120" y1="520" x2="950" y2="520" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="514" x2="120" y2="526" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="497" y1="514" x2="497" y2="526" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="875" y1="514" x2="875" y2="526" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="106" y="540" font-size="10" fill="#64748b">0</text>
  <text x="480" y="540" font-size="10" fill="#64748b">500 ms</text>
  <text x="858" y="540" font-size="10" fill="#64748b">1000 ms</text>
  <text x="893" y="524" font-size="10" fill="#94a3b8">echo 2/3 在 1.0 s</text>

  <text x="30" y="424" font-size="12" font-weight="bold" fill="#15803d">Stream()</text>
  <text x="30" y="440" font-size="10" fill="#64748b">StdoutPipe</text>
  <text x="30" y="454" font-size="10" fill="#64748b">逐行 Scan</text>
  <circle cx="150" cy="428" r="6" fill="#16a34a"/>
  <text x="162" y="432" font-size="11" fill="#14532d">第 1 行到达：40 ~ 50 ms</text>
  <circle cx="900" cy="428" r="6" fill="#16a34a"/>
  <text x="770" y="410" font-size="11" fill="#14532d">第 2 行：1.09 ~ 1.10 s</text>
  <line x1="156" y1="428" x2="894" y2="428" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="30" y="486" font-size="12" font-weight="bold" fill="#b45309">CombinedOutput</text>
  <text x="30" y="502" font-size="10" fill="#64748b">等进程退出</text>
  <rect x="120" y="478" width="800" height="16" rx="4" fill="#ffedd5" stroke="#ea580c"/>
  <text x="132" y="490" font-size="10" fill="#9a3412">输出一直在缓冲区里积着，人不拿到</text>
  <circle cx="905" cy="486" r="6" fill="#ea580c"/>
  <text x="640" y="470" font-size="11" fill="#9a3412">1.08 ~ 1.10 s：三行一次性拿全</text>

  <text x="28" y="558" font-size="11" fill="#dc2626">tail -f 永不退出 → CombinedOutput 就是挂死 + 整份日志撑爆内存（实测七）</text>

  <text x="20" y="594" font-size="11" fill="#94a3b8">数字出处：正文实测二（300 ms / 5.08 s / 800 ms；Java 5083 → 362 ms 见使用二第 2 节）与实测七（40~50 ms / 1.08~1.10 s），未新增读数</text>
</svg>
