<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Go 项目目录布局的三档形态</text>
  <text x="500" y="56" font-size="13" fill="#64748b" text-anchor="middle">按入口数量 / 包数量 / 协作人数升档 —— 三列均为容器实测的实验目录形态（go 1.26.8）</text>

  <!-- 档一 -->
  <rect x="30" y="80" width="290" height="420" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="110" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">档一：单文件 / 小工具</text>
  <text x="175" y="132" font-size="12" fill="#1e3a8a" text-anchor="middle">1 个入口 · ≤5 文件 · 1 人</text>
  <rect x="55" y="150" width="240" height="330" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="70" y="176" font-size="13" fill="#0f172a">buildtag/</text>
  <text x="86" y="202" font-size="13" fill="#334155">├── go.mod</text>
  <text x="86" y="226" font-size="13" fill="#334155">├── main.go</text>
  <text x="86" y="250" font-size="13" fill="#334155">├── plain.go　//go:build !extra</text>
  <text x="86" y="274" font-size="13" fill="#334155">└── extra.go　//go:build extra</text>
  <text x="70" y="312" font-size="12" fill="#64748b">全部 package main 平铺在模块根，</text>
  <text x="70" y="332" font-size="12" fill="#64748b">文件按职责片段切，</text>
  <text x="70" y="352" font-size="12" fill="#64748b">不建 cmd/ internal/ 空壳</text>
  <text x="70" y="452" font-size="12" font-weight="bold" fill="#1e3a8a">go run . 即全部构建</text>

  <!-- 升级箭头 1 -->
  <line x1="320" y1="290" x2="356" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="338" y="278" font-size="11" fill="#64748b" text-anchor="middle">入口变多</text>

  <!-- 档二 -->
  <rect x="355" y="80" width="290" height="420" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="110" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">档二：中型服务</text>
  <text x="500" y="132" font-size="12" fill="#14532d" text-anchor="middle">多入口 · 分层 · 2~5 人</text>
  <rect x="380" y="150" width="240" height="330" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="394" y="176" font-size="13" fill="#0f172a">grow/</text>
  <text x="410" y="200" font-size="13" fill="#334155">├── go.mod · doc.go</text>
  <text x="410" y="224" font-size="13" fill="#334155">├── cmd/grow/main.go</text>
  <text x="410" y="248" font-size="13" fill="#334155">└── internal/</text>
  <text x="426" y="272" font-size="13" fill="#334155">├── handler/</text>
  <text x="426" y="296" font-size="13" fill="#334155">├── service/</text>
  <text x="426" y="320" font-size="13" fill="#334155">└── storage/</text>
  <rect x="404" y="238" width="200" height="92" rx="6" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="608" y="256" font-size="11" fill="#14532d" text-anchor="end">internal = 编译器级边界</text>
  <text x="394" y="360" font-size="12" fill="#64748b">入口只做装配；业务全在</text>
  <text x="394" y="380" font-size="12" fill="#64748b">internal，对外契约放 api/</text>
  <text x="394" y="452" font-size="12" font-weight="bold" fill="#14532d">go build ./cmd/xxx 逐入口构建</text>

  <!-- 升级箭头 2 -->
  <line x1="645" y1="290" x2="681" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="663" y="278" font-size="11" fill="#64748b" text-anchor="middle">独立发版</text>

  <!-- 档三 -->
  <rect x="680" y="80" width="290" height="420" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="825" y="110" font-size="16" font-weight="bold" fill="#854d0e" text-anchor="middle">档三：多组件仓库</text>
  <text x="825" y="132" font-size="12" fill="#854d0e" text-anchor="middle">多 go.mod + go.work 联调</text>
  <rect x="705" y="150" width="240" height="330" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="719" y="176" font-size="13" fill="#0f172a">ws/</text>
  <text x="735" y="200" font-size="13" fill="#334155">├── go.work（不提交）</text>
  <text x="735" y="224" font-size="13" fill="#334155">├── wapp/ go.mod+main.go</text>
  <text x="735" y="248" font-size="13" fill="#334155">└── wlib/ go.mod+wlib.go</text>
  <rect x="729" y="212" width="200" height="48" rx="6" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="719" y="292" font-size="12" fill="#64748b">go work use 把两个本地模块</text>
  <text x="719" y="312" font-size="12" fill="#64748b">并进同一构建图：wlib 不发 tag</text>
  <text x="719" y="332" font-size="12" fill="#64748b">即可被 wapp import（实测）</text>
  <text x="719" y="452" font-size="12" font-weight="bold" fill="#854d0e">GOWORK=off 即退回普通模块解析</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="500" y="546" font-size="13" fill="#0f172a" text-anchor="middle">升级触发条件：入口变多 / 出现分层 → 档二；组件要独立 go get、独立打 tag → 档三</text>
  <text x="500" y="570" font-size="12" fill="#64748b" text-anchor="middle">目录树来自实验目录 buildtag/、grow/、ws/ 的真实文件布局（golang:1.26-alpine 实测构建通过）</text>
  <text x="500" y="606" font-size="12" fill="#64748b" text-anchor="middle">编译器只对 internal 边界与 import cycle 强制；cmd/、api/、pkg/ 全是社区约定</text>
</svg>
