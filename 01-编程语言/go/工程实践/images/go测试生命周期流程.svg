<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">go test 一次运行的完整生命周期</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">编译期收 _test.go 生成 main → 运行期 TestMain 前置 + m.Run 逐个跑用例 → 收尾逆序 Cleanup 再 os.Exit</text>

  <rect x="24" y="80" width="300" height="560" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="174" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">① 编译期</text>

  <rect x="44" y="118" width="260" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="174" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">收集 _test.go 与外部测试包</text>
  <text x="174" y="158" text-anchor="middle" font-size="11.5" fill="#1d4ed8">pkg 与 pkg_test 两个包一起编</text>

  <line x1="174" y1="180" x2="174" y2="202" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="44" y="206" width="260" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="174" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">生成测试专用 main</text>
  <text x="174" y="246" text-anchor="middle" font-size="11.5" fill="#1d4ed8">testing.MainStart 收四类函数</text>
  <text x="174" y="264" text-anchor="middle" font-size="11.5" fill="#1d4ed8">有 TestMain 就交给它一个 m</text>

  <line x1="174" y1="282" x2="174" y2="304" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="44" y="308" width="260" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="174" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">译成 -test.* 旗标</text>
  <text x="174" y="348" text-anchor="middle" font-size="11.5" fill="#1d4ed8">-test.timeout=10m0s</text>
  <text x="174" y="366" text-anchor="middle" font-size="11.5" fill="#1d4ed8">-test.v -test.paniconexit0</text>

  <line x1="174" y1="384" x2="174" y2="406" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="44" y="410" width="260" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="174" y="432" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">工作目录 = 包目录</text>
  <text x="174" y="450" text-anchor="middle" font-size="11.5" fill="#1d4ed8">所以 testdata 用相对路径就行</text>
  <text x="174" y="468" text-anchor="middle" font-size="11.5" fill="#1d4ed8">go test -c 可得同名二进制</text>

  <text x="174" y="524" text-anchor="middle" font-size="11.5" fill="#334155">4.2M 的测试二进制能脱离 go test</text>
  <text x="174" y="544" text-anchor="middle" font-size="11.5" fill="#334155">直接跑，旗标全带 -test. 前缀</text>

  <text x="174" y="592" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7f1d1d">签名写错编不过</text>
  <text x="174" y="612" text-anchor="middle" font-size="11.5" fill="#991b1b">must be: func TestX(t *testing.T)</text>

  <line x1="324" y1="150" x2="366" y2="150" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2)"/>

  <rect x="370" y="80" width="300" height="560" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="520" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">② 运行期</text>

  <rect x="390" y="118" width="260" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="520" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">TestMain 前置</text>
  <text x="520" y="158" text-anchor="middle" font-size="11.5" fill="#166534">此刻没有 *testing.T，只能写 stderr</text>
  <text x="520" y="176" text-anchor="middle" font-size="11.5" fill="#166534">自定义旗标尚未 Parse</text>

  <line x1="520" y1="194" x2="520" y2="216" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="390" y="220" width="260" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="520" y="242" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">m.Run()：逐个跑 Test</text>
  <text x="520" y="260" text-anchor="middle" font-size="11.5" fill="#166534">-shuffle=on 时按种子打乱顺序</text>

  <line x1="520" y1="282" x2="520" y2="304" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="390" y="308" width="260" height="92" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="520" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">t.Run 派生子测试</text>
  <text x="520" y="350" text-anchor="middle" font-size="11.5" fill="#166534">串行：=== RUN 父子名用斜杠拼</text>
  <text x="520" y="368" text-anchor="middle" font-size="11.5" fill="#166534">调 t.Parallel：--- PAUSE 挂起</text>
  <text x="520" y="386" text-anchor="middle" font-size="11.5" fill="#166534">父测试返回后 --- CONT 一起跑</text>

  <line x1="520" y1="400" x2="520" y2="422" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="390" y="426" width="260" height="62" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="520" y="448" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#854d0e">并行度上限 -parallel</text>
  <text x="520" y="466" text-anchor="middle" font-size="11.5" fill="#b45309">默认 GOMAXPROCS，本机实测 4</text>

  <line x1="520" y1="488" x2="520" y2="510" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="390" y="514" width="260" height="92" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="520" y="536" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">用例返回后的清理</text>
  <text x="520" y="556" text-anchor="middle" font-size="11.5" fill="#166534">函数内 defer 先走</text>
  <text x="520" y="574" text-anchor="middle" font-size="11.5" fill="#166534">再 t.Cleanup，注册顺序 LIFO</text>
  <text x="520" y="592" text-anchor="middle" font-size="11.5" fill="#166534">子测试的 Cleanup 早于父测试</text>

  <line x1="674" y1="150" x2="716" y2="150" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2)"/>

  <rect x="720" y="80" width="256" height="560" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="848" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">③ 收尾</text>

  <rect x="740" y="118" width="216" height="76" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="848" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">TestMain 后置</text>
  <text x="848" y="158" text-anchor="middle" font-size="11.5" fill="#475569">拿到 m.Run 的 code</text>
  <text x="848" y="176" text-anchor="middle" font-size="11.5" fill="#475569">显式 os.Exit(code)</text>

  <line x1="848" y1="194" x2="848" y2="216" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="740" y="220" width="216" height="76" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="848" y="242" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">汇总 PASS / FAIL</text>
  <text x="848" y="260" text-anchor="middle" font-size="11.5" fill="#475569">写覆盖率 profile</text>
  <text x="848" y="278" text-anchor="middle" font-size="11.5" fill="#475569">退出码交给 go test</text>

  <line x1="848" y1="296" x2="848" y2="318" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="740" y="322" width="216" height="92" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="848" y="344" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">两条假绿路径</text>
  <text x="848" y="364" text-anchor="middle" font-size="11.5" fill="#991b1b">TestMain 漏 m.Run</text>
  <text x="848" y="382" text-anchor="middle" font-size="11.5" fill="#991b1b">ok 且 EXIT=0，一个没跑</text>
  <text x="848" y="400" text-anchor="middle" font-size="11.5" fill="#991b1b">恒真断言 + 100% 覆盖</text>

  <rect x="740" y="430" width="216" height="92" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="848" y="452" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#854d0e">闹钟 goroutine</text>
  <text x="848" y="472" text-anchor="middle" font-size="11.5" fill="#b45309">-timeout 到点不是失败而是 panic</text>
  <text x="848" y="490" text-anchor="middle" font-size="11.5" fill="#b45309">panic: test timed out after 2s</text>
  <text x="848" y="508" text-anchor="middle" font-size="11.5" fill="#b45309">goroutine 全量倒出来</text>

  <text x="848" y="556" text-anchor="middle" font-size="11.5" fill="#334155">crash 语料落 testdata/fuzz 后</text>
  <text x="848" y="576" text-anchor="middle" font-size="11.5" fill="#334155">普通 go test 会持续常红</text>
  <text x="848" y="608" text-anchor="middle" font-size="11.5" fill="#475569">这正是想要的效果</text>

  <text x="26" y="676" font-size="12.5" fill="#334155">⭐ 读图口诀：编译期决定「谁能被当作用例」，运行期决定「谁先跑、能不能并行」，收尾决定「这次到底是绿是红」</text>
  <text x="26" y="700" font-size="12.5" fill="#334155">⭐ 图内数值全部来自容器实测：go1.26.8、GOMAXPROCS=4、-test.timeout=10m0s、Cleanup 逆序、漏 m.Run 时 EXIT=0</text>
  <text x="26" y="726" font-size="12.5" fill="#64748b">⚠️ 单个用例里的 defer 与 t.Cleanup 顺序、goroutine 里调 Fatal 的后果，见第四节的四组原文</text>
</svg>
