<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect width="1000" height="540" fill="#ffffff"/>
<defs><marker id="arCTXd" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker></defs>
<text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">case 2 超时处理时序：非阻塞探测 + 阻塞 select</text>
<text x="40" y="58" font-size="13" fill="#64748b">WithTimeout(r.Context(), 3*time.Second)；后台协程跑完才写 channel，ctx 超时不会强杀它</text>

<rect x="38" y="88" width="164" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="120" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">handler 主流程</text>
<rect x="251" y="88" width="118" height="44" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="310" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">ctx.Done()</text>
<rect x="446" y="88" width="128" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="510" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">longTask 协程</text>
<rect x="659" y="88" width="122" height="44" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="720" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">resultCh</text>
<rect x="848" y="88" width="144" height="44" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="920" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">ResponseWriter</text>

<rect x="119.25" y="132" width="1.5" height="356" fill="#cbd5e1"/>
<rect x="309.25" y="132" width="1.5" height="356" fill="#cbd5e1"/>
<rect x="509.25" y="132" width="1.5" height="356" fill="#cbd5e1"/>
<rect x="719.25" y="132" width="1.5" height="356" fill="#cbd5e1"/>
<rect x="919.25" y="132" width="1.5" height="356" fill="#cbd5e1"/>

<line x1="120" y1="160" x2="302" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#arCTXd)"/>
<text x="211" y="150" text-anchor="middle" font-size="11" fill="#334155">① select 带 default 的非阻塞探测</text>

<line x1="310" y1="192" x2="128" y2="192" stroke="#334155" stroke-width="1.5" marker-end="url(#arCTXd)"/>
<text x="211" y="182" text-anchor="middle" font-size="11" fill="#334155">未就绪：default 立即返回</text>

<line x1="120" y1="224" x2="502" y2="224" stroke="#334155" stroke-width="1.5" marker-end="url(#arCTXd)"/>
<text x="311" y="214" text-anchor="middle" font-size="11" fill="#334155">② go func() { resultCh &lt;- longTask(ctx) }()</text>

<line x1="120" y1="256" x2="302" y2="256" stroke="#334155" stroke-width="1.5" marker-end="url(#arCTXd)"/>
<text x="211" y="246" text-anchor="middle" font-size="11" fill="#334155">③ 阻塞 select：两个出口谁先到走谁</text>

<line x1="310" y1="288" x2="128" y2="288" stroke="#334155" stroke-width="1.5" marker-end="url(#arCTXd)"/>
<text x="211" y="278" text-anchor="middle" font-size="11" fill="#334155">④ 3s 到：close(Done) 广播唤醒</text>

<line x1="120" y1="320" x2="912" y2="320" stroke="#334155" stroke-width="1.5" marker-end="url(#arCTXd)"/>
<text x="511" y="310" text-anchor="middle" font-size="11" fill="#dc2626">⑤ http.Error(w, "request timeout", StatusGatewayTimeout)</text>

<line x1="510" y1="352" x2="712" y2="352" stroke="#334155" stroke-width="1.5" marker-end="url(#arCTXd)"/>
<text x="611" y="342" text-anchor="middle" font-size="11" fill="#334155">⑥ longTask 跑完才写结果</text>

<rect x="642" y="376" width="156" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="720" y="401" text-anchor="middle" font-size="12" fill="#991b1b">缓冲 1：无人读也不阻塞</text>

<text x="40" y="462" font-size="11" fill="#64748b">小结：正常路径是 select 命中 case res := &lt;-resultCh 直接回包；两条出口只会命中一次就往下走，要持续等待必须外面套 for</text>
<text x="40" y="484" font-size="11" fill="#64748b">resultCh 若不带缓冲（或无人接收），超时路径下这个 goroutine 会永久阻塞在发送上 —— 这就是协程泄漏</text>
<text x="40" y="506" font-size="11" fill="#64748b">ctx.Done() 能作为 case 时，不要用 time.After 单独做超时：每次循环新建的 Timer 在触发前无法被 GC 回收</text>
</svg>
