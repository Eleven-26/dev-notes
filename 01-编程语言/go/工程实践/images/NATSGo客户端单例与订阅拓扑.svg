<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">NATS Go 客户端：连接可共享，订阅与游标不能共享</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">nats.go v1.53.1 连 nats-server 2.10.29；连接 1 条常驻，Subscription / Consumer 按业务各建一份</text>

  <rect x="40" y="88" width="520" height="440" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="300" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">业务进程（进程级单例）</text>

  <rect x="90" y="130" width="420" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="300" y="153" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">*nats.Conn（sync.Once 建一次）</text>
  <text x="300" y="174" text-anchor="middle" font-size="12" fill="#334155">1 条 TCP + 读写协程 + 重连循环 + pending 缓冲</text>

  <rect x="60" y="238" width="220" height="82" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="170" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">订阅 A：广播</text>
  <text x="170" y="283" text-anchor="middle" font-size="11.5" fill="#334155">Subscribe("labg.core")</text>
  <text x="170" y="303" text-anchor="middle" font-size="11.5" fill="#334155">每个订阅者各收一份</text>

  <rect x="320" y="238" width="220" height="82" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="430" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">订阅 B：队列组</text>
  <text x="430" y="283" text-anchor="middle" font-size="11.5" fill="#334155">QueueSubscribe(..., "workers")</text>
  <text x="430" y="303" text-anchor="middle" font-size="11.5" fill="#334155">组内竞争，一条只给一人</text>

  <rect x="60" y="356" width="480" height="104" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="300" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4c1d95">JetStream Consumer（按业务各建一份）</text>
  <text x="300" y="401" text-anchor="middle" font-size="11.5" fill="#334155">Durable="order-pull"  AckExplicit  MaxDeliver=5</text>
  <text x="300" y="422" text-anchor="middle" font-size="11.5" fill="#334155">游标挂在 durable 名上：换名字 = 从头重新消费</text>
  <text x="300" y="443" text-anchor="middle" font-size="11.5" fill="#475569">两个业务共用一个 durable，会互相抢走对方的游标</text>

  <line x1="300" y1="188" x2="170" y2="238" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="300" y1="188" x2="430" y2="238" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="300" y1="188" x2="300" y2="356" stroke="#94a3b8" stroke-width="1.4"/>

  <rect x="620" y="88" width="340" height="440" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="790" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">nats-server 2.10.29</text>

  <rect x="650" y="132" width="280" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="790" y="156" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">Subject 路由表</text>
  <text x="790" y="177" text-anchor="middle" font-size="11.5" fill="#334155">labg.core / labg.queue</text>
  <text x="790" y="195" text-anchor="middle" font-size="11.5" fill="#475569">Core 语义：转发完即丢</text>

  <rect x="650" y="232" width="280" height="86" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="790" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4c1d95">Stream ORDERS（labg.&gt;）</text>
  <text x="790" y="277" text-anchor="middle" font-size="11.5" fill="#334155">File 存储，replicas=1</text>
  <text x="790" y="298" text-anchor="middle" font-size="11.5" fill="#334155">单机副本 &gt;1 直接报错</text>

  <rect x="650" y="348" width="280" height="86" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="790" y="372" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">Consumer 状态</text>
  <text x="790" y="393" text-anchor="middle" font-size="11.5" fill="#334155">durable 游标 + ack pending</text>
  <text x="790" y="414" text-anchor="middle" font-size="11.5" fill="#475569">AckWait 30s，MaxDeliver 5</text>

  <line x1="510" y1="159" x2="612" y2="159" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="620,159 608,153 608,165" fill="#2563eb"/>
  <text x="566" y="150" text-anchor="middle" font-size="11" fill="#2563eb">Publish</text>

  <line x1="620" y1="275" x2="518" y2="275" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6 4"/>
  <polygon points="510,275 522,269 522,281" fill="#16a34a"/>
  <text x="566" y="266" text-anchor="middle" font-size="11" fill="#16a34a">投递</text>

  <line x1="612" y1="380" x2="504" y2="408" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4"/>
  <polygon points="496,411 509,405 507,417" fill="#7c3aed"/>
  <text x="566" y="390" text-anchor="middle" font-size="11" fill="#7c3aed">Fetch / Ack</text>

  <rect x="40" y="548" width="920" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="500" y="570" text-anchor="middle" font-size="12.5" fill="#713f12">要点：连接单例省 TCP 与协程；Subscription 的 sid、Consumer 的 durable 游标都按业务各建一份，不能共享。</text>
  <text x="500" y="589" text-anchor="middle" font-size="12" fill="#713f12">本机实测：300 条消息在 3 个队列组成员间分配为 92 / 104 / 104，每轮比例都会变。</text>
</svg>
