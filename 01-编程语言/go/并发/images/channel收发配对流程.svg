<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">channel 收发：直接配对，还是走缓冲区</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">核心思路：优先「直接从对方等待队列里取出、当场配对交接」，数据不落地</text>

  <rect x="20" y="84" width="470" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="36" y="112" font-size="13.5" font-weight="bold" fill="#1e3a8a">发送方：ch &lt;- v</text>
  <rect x="40" y="128" width="430" height="46" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="255" y="156" text-anchor="middle" font-size="12" fill="#7c2d12">recvq 非空？（有接收协程正等着）</text>
  <text x="255" y="180" text-anchor="middle" font-size="12" fill="#64748b">↓ 有</text>
  <rect x="40" y="186" width="430" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="255" y="209" text-anchor="middle" font-size="11.5" fill="#14532d">有 → 直接配对：取出 sudog，把数据复制给它（不经缓冲区）</text>
  <text x="255" y="231" text-anchor="middle" font-size="11.5" fill="#166534">双方协程都可以继续往下执行</text>
  <text x="255" y="252" text-anchor="middle" font-size="12" fill="#64748b">↓ 否</text>
  <rect x="40" y="256" width="430" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="255" y="279" text-anchor="middle" font-size="11.5" fill="#7f1d1d">否 → 当前协程封装成 sudog，推入 sendq 并阻塞</text>
  <text x="255" y="301" text-anchor="middle" font-size="11.5" fill="#b91c1c">★ 阻塞后不占 CPU，只有接收流程来激活它才继续</text>
  <text x="255" y="322" text-anchor="middle" font-size="12" fill="#64748b">↓ 补充：有缓冲时</text>
  <rect x="40" y="326" width="430" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="255" y="349" text-anchor="middle" font-size="11.5" fill="#1e3a8a">有缓冲时：先看 buf 有没有空位，有空位就写入并直接返回</text>
  <text x="255" y="371" text-anchor="middle" font-size="11.5" fill="#1d4ed8">只有「缓冲区满 + 没有接收方」才落到上面那条阻塞路径</text>
  <text x="40" y="410" font-size="11.5" fill="#64748b">有缓冲 channel（dataqsiz &gt; 0）要求收发同时就绪；无缓冲（dataqsiz = 0）则必须同步交接。</text>

  <rect x="510" y="84" width="470" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="526" y="112" font-size="13.5" font-weight="bold" fill="#14532d">接收方：&lt;-ch</text>
  <rect x="530" y="128" width="430" height="46" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="745" y="156" text-anchor="middle" font-size="12" fill="#7c2d12">sendq 非空？（有协程正等着发）</text>
  <text x="745" y="180" text-anchor="middle" font-size="12" fill="#64748b">↓ 有</text>
  <rect x="530" y="186" width="430" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="745" y="209" text-anchor="middle" font-size="11.5" fill="#14532d">有 → 直接配对：取出 sudog，把数据接收过来</text>
  <text x="745" y="231" text-anchor="middle" font-size="11.5" fill="#166534">同时激活那个被阻塞的发送协程</text>
  <text x="745" y="252" text-anchor="middle" font-size="12" fill="#64748b">↓ 否</text>
  <rect x="530" y="256" width="430" height="46" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="745" y="284" text-anchor="middle" font-size="12" fill="#7c2d12">否 → 缓冲区有数据吗？（qcount &gt; 0）</text>
  <text x="745" y="310" text-anchor="middle" font-size="12" fill="#64748b">↓ 有</text>
  <rect x="530" y="314" width="430" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="745" y="337" text-anchor="middle" font-size="11.5" fill="#1e3a8a">有 → 从 buf 取走一格，再立刻从 sendq 取一个补位</text>
  <text x="745" y="359" text-anchor="middle" font-size="11.5" fill="#1d4ed8">这就是「缓冲区里的数据不会一直不动」的原因</text>
  <text x="745" y="384" text-anchor="middle" font-size="12" fill="#64748b">↓ 否</text>
  <rect x="530" y="388" width="430" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="745" y="411" text-anchor="middle" font-size="11.5" fill="#7f1d1d">无 → 把自己封装成 sudog 放入 recvq，阻塞等待</text>
  <text x="745" y="433" text-anchor="middle" font-size="11.5" fill="#b91c1c">唤醒由对端（send / close）推动，同样不占 CPU</text>
  <text x="526" y="470" font-size="11.5" fill="#64748b">⭐ 关闭 channel 会让 recvq 里所有等待者同时被唤醒（广播），而不是只唤醒一个。</text>

  <rect x="20" y="524" width="960" height="64" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="36" y="550" font-size="12" fill="#0f172a">⭐ 顺序清楚了就不会绕进「缓冲区会不会一直空着」的疑问：空出来的位置马上被 sendq 里的等待者补上。</text>
  <text x="36" y="574" font-size="12" fill="#0f172a">⚠️ 阻塞点全在 sendq / recvq 上 —— 排查泄漏时看哪条队列最长，就知道「谁在等谁」。</text>
</svg>
