<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="410" fill="#ffffff"/>
<defs>
<marker id="ar1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
</defs>

<text x="250" y="52" font-size="13" text-anchor="middle" fill="#1e3a8a">按 limit 的速率滴入令牌</text>
<line x1="200" y1="62" x2="200" y2="98" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar1)"/>
<line x1="250" y1="62" x2="250" y2="98" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar1)"/>
<line x1="300" y1="62" x2="300" y2="98" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar1)"/>

<rect x="110" y="100" width="280" height="230" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
<line x1="110" y1="130" x2="390" y2="130" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="122" y="124" font-size="12" fill="#1e3a8a">burst（桶容量 / 上限）</text>

<circle cx="150" cy="170" r="13" fill="#dbeafe" stroke="#2563eb"/>
<circle cx="200" cy="170" r="13" fill="#dbeafe" stroke="#2563eb"/>
<circle cx="250" cy="170" r="13" fill="#dbeafe" stroke="#2563eb"/>
<circle cx="300" cy="170" r="13" fill="#dbeafe" stroke="#2563eb"/>
<circle cx="350" cy="170" r="13" fill="#dbeafe" stroke="#2563eb"/>
<circle cx="150" cy="215" r="13" fill="#dbeafe" stroke="#2563eb"/>
<circle cx="200" cy="215" r="13" fill="#dbeafe" stroke="#2563eb"/>
<circle cx="250" cy="215" r="13" fill="#dbeafe" stroke="#2563eb"/>
<circle cx="300" cy="215" r="13" fill="#dbeafe" stroke="#2563eb"/>
<circle cx="350" cy="215" r="13" fill="#dbeafe" stroke="#2563eb"/>
<circle cx="150" cy="260" r="13" fill="#dbeafe" stroke="#2563eb"/>
<circle cx="200" cy="260" r="13" fill="#dbeafe" stroke="#2563eb"/>
<circle cx="250" cy="260" r="13" fill="#dbeafe" stroke="#2563eb"/>

<text x="250" y="316" font-size="12" text-anchor="middle" fill="#334155">tokens（当前令牌数）</text>
<text x="250" y="356" font-size="12" text-anchor="middle" fill="#7c2d12">取令牌要访问共享的桶 → 用互斥锁保护</text>

<rect x="520" y="90" width="450" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="540" y="118" font-size="13" fill="#1e3a8a">limit　每秒恢复速率</text>
<text x="540" y="140" font-size="12" fill="#64748b">决定桶里每秒能冒出多少个令牌</text>

<rect x="520" y="166" width="450" height="64" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="540" y="194" font-size="13" fill="#14532d">burst　桶容量（处理能力上限）</text>
<text x="540" y="216" font-size="12" fill="#64748b">tokens 永远满足 tokens ≤ burst</text>

<rect x="520" y="242" width="450" height="64" rx="8" fill="#ffedd5" stroke="#ea580c"/>
<text x="540" y="270" font-size="13" fill="#7c2d12">tokens　当前令牌数量</text>
<text x="540" y="292" font-size="12" fill="#64748b">取一个减一，用完为 0 就拒绝或排队</text>

<rect x="520" y="318" width="450" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="540" y="346" font-size="13" fill="#334155">最后一次限流事件的时间</text>
<text x="540" y="368" font-size="12" fill="#64748b">按「现在 − 它」的时间差补出应恢复的令牌</text>
</svg>
