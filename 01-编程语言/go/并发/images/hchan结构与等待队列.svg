<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="c1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">hchan：字段、缓冲区与两个等待队列</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">buf 是普通数组，靠 sendx / recvx 回绕「用成环」；阻塞的协程挂进 recvq / sendq</text>

  <rect x="20" y="84" width="470" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="110" font-size="12.5" font-weight="bold" fill="#0f172a">hchan 关键字段（runtime 里的 channel 结构）</text>
  <text x="36" y="140" font-size="11.5" fill="#1e3a8a">lock　—— 互斥锁：channel 并发安全的根本原因</text>
  <text x="36" y="176" font-size="11.5" fill="#1e3a8a">qcount　—— 缓冲区里当前已缓冲的数据个数</text>
  <text x="36" y="212" font-size="11.5" fill="#1e3a8a">dataqsiz　—— 缓冲区容量（make(chan T, n) 的 n）</text>
  <text x="36" y="248" font-size="11.5" fill="#1e3a8a">buf　—— 指向存储数据的数组</text>
  <text x="36" y="284" font-size="11.5" fill="#7c2d12">sendx　—— 下一次发送要写入的下标</text>
  <text x="36" y="320" font-size="11.5" fill="#7c2d12">recvx　—— 下一次接收要读取的下标</text>
  <text x="36" y="356" font-size="11.5" fill="#14532d">recvq / sendq —— 接收 / 发送等待队列（sudog 链表）</text>
  <text x="36" y="392" font-size="11" fill="#64748b">⚠️ recvq / sendq 是所有 channel 通用的；其它字段只服务于有缓冲</text>

  <rect x="510" y="84" width="470" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="526" y="110" font-size="12.5" font-weight="bold" fill="#0f172a">buf：普通数组，靠 sendx / recvx 回绕成「环」</text>
  <rect x="530" y="128" width="60" height="46" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="560" y="157" text-anchor="middle" font-size="12" fill="#1e3a8a">0</text>
  <rect x="594" y="128" width="60" height="46" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="624" y="157" text-anchor="middle" font-size="12" fill="#334155">1</text>
  <rect x="658" y="128" width="60" height="46" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="688" y="157" text-anchor="middle" font-size="12" fill="#334155">2</text>
  <rect x="722" y="128" width="60" height="46" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="752" y="157" text-anchor="middle" font-size="12" fill="#334155">3</text>
  <rect x="786" y="128" width="60" height="46" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="816" y="157" text-anchor="middle" font-size="12" fill="#7c2d12">4</text>
  <rect x="850" y="128" width="60" height="46" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="880" y="157" text-anchor="middle" font-size="12" fill="#334155">5</text>
  <line x1="560" y1="196" x2="560" y2="178" stroke="#2563eb" stroke-width="1.5" marker-end="url(#c1)"/>
  <text x="560" y="212" text-anchor="middle" font-size="11.5" fill="#1d4ed8">recvx（下一个读）</text>
  <line x1="816" y1="196" x2="816" y2="178" stroke="#ea580c" stroke-width="1.5" marker-end="url(#c1)"/>
  <text x="816" y="212" text-anchor="middle" font-size="11.5" fill="#9a3412">sendx（下一个写）</text>
  <text x="526" y="244" font-size="11" fill="#64748b">下标到末尾后回到 0 —— 「用起来像环」，结构上是数组不是链表</text>

  <rect x="510" y="290" width="470" height="58" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.2"/>
  <text x="526" y="314" font-size="12" font-weight="bold" fill="#14532d">recvq（接收等待队列）</text>
  <text x="526" y="336" font-size="11" fill="#334155">阻塞的接收协程 → 封装成 sudog → 入队（链表 first / last）</text>

  <rect x="510" y="362" width="470" height="58" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="526" y="386" font-size="12" font-weight="bold" fill="#7f1d1d">sendq（发送等待队列）</text>
  <text x="526" y="408" font-size="11" fill="#334155">阻塞的发送协程 → 封装成 sudog → 入队（链表 first / last）</text>

  <rect x="20" y="434" width="960" height="72" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="36" y="458" font-size="12" fill="#0f172a">⭐ 优先「直接配对交接」，其次才走缓冲区：recvq 有人时，数据直接给对方，不经过 buf。</text>
  <text x="36" y="482" font-size="12" fill="#0f172a">⚠️ 只发不收 / 只收不发都会永久阻塞 —— 阻塞的 G 挂在 sendq / recvq 上，等对端来激活。</text>
</svg>
