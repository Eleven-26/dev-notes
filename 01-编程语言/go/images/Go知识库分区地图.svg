<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="530" fill="#ffffff"/>
  <defs>
    <marker id="arMap" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">Go 知识库分区地图</text>
  <text x="40" y="58" font-size="13" fill="#64748b">六个二级目录一览；每篇完整清单见第二节，阅读顺序（①~⑲）见第一节</text>

  <!-- 第一行：语言机制三目录 -->
  <rect x="40" y="80" width="292" height="148" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="54" y="106" font-size="15" font-weight="bold" fill="#0f172a">类型与语法/ · 11 篇</text>
  <text x="54" y="132" font-size="12" fill="#334155">类型系统 · 接口 · 基础类型与零值</text>
  <text x="54" y="152" font-size="12" fill="#334155">切片 · map · struct与tag · 指针与引用</text>
  <text x="54" y="172" font-size="12" fill="#334155">defer · for-range · 错误处理</text>
  <text x="54" y="192" font-size="12" fill="#64748b">函数调用与栈：属语言机制，不归运行时</text>

  <rect x="354" y="80" width="292" height="148" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="368" y="106" font-size="15" font-weight="bold" fill="#0f172a">并发编程/ · 17 篇</text>
  <text x="368" y="132" font-size="12" fill="#334155">goroutine · channel · sync.Map</text>
  <text x="368" y="152" font-size="12" fill="#334155">atomic · sync.Pool · 限流器</text>
  <text x="368" y="172" font-size="12" fill="#334155">并发同步原语 · 协程泄漏与死锁</text>
  <text x="368" y="192" font-size="12" fill="#64748b">Go内存模型 · 共享内存与CSP 各成一篇</text>

  <rect x="668" y="80" width="292" height="148" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="682" y="106" font-size="15" font-weight="bold" fill="#0f172a">运行时/ · 10 篇</text>
  <text x="682" y="132" font-size="12" fill="#334155">GMP调度 · 内存分配器 · 内存逃逸</text>
  <text x="682" y="152" font-size="12" fill="#334155">垃圾回收机制 · 程序启动流程</text>
  <text x="682" y="172" font-size="12" fill="#334155">零拷贝 · 反射与unsafe</text>
  <text x="682" y="192" font-size="12" fill="#334155">pprof性能分析 · runtime调试与trace</text>

  <!-- 第二行：实践与接入三目录 -->
  <rect x="40" y="244" width="292" height="148" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="54" y="270" font-size="15" font-weight="bold" fill="#0f172a">工程实践/ · 16+2+4 篇</text>
  <text x="54" y="296" font-size="12" fill="#334155">context · 依赖注入 · 项目结构</text>
  <text x="54" y="316" font-size="12" fill="#334155">日志与错误规范 · 测试与Mock</text>
  <text x="54" y="336" font-size="12" fill="#334155">数据访问与连接池 · 接入DTM · 接入Kafka</text>
  <text x="54" y="356" font-size="12" fill="#ea580c">⭐ 唯一下面还有二级目录：框架/ · 定时任务/</text>

  <rect x="354" y="244" width="292" height="148" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="368" y="270" font-size="15" font-weight="bold" fill="#0f172a">网络编程/ · 6 篇</text>
  <text x="368" y="296" font-size="12" fill="#334155">net 包与 TCP/UDP 编程</text>
  <text x="368" y="316" font-size="12" fill="#334155">HTTP 客户端与连接池</text>
  <text x="368" y="336" font-size="12" fill="#334155">HTTP 服务端与优雅关停 · 网关路由匹配</text>
  <text x="368" y="356" font-size="12" fill="#334155">从零实现网关 · 不使用 protoc 的 gRPC</text>

  <rect x="668" y="244" width="292" height="148" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="682" y="270" font-size="15" font-weight="bold" fill="#0f172a">可观测性/ · 3 篇</text>
  <text x="682" y="296" font-size="12" fill="#334155">接入Jaeger · 接入Skywalking</text>
  <text x="682" y="316" font-size="12" fill="#334155">手写Prometheus导出器</text>
  <text x="682" y="336" font-size="12" fill="#64748b">只讲 Go 侧埋点接入；组件原理与架构</text>
  <text x="682" y="356" font-size="12" fill="#64748b">见 03-数据与中间件/中间件/可观测性/</text>

  <!-- 阅读主线 -->
  <text x="40" y="424" font-size="13" font-weight="bold" fill="#0f172a">阅读主线（第一节 ①→⑲ 的前置关系）</text>
  <rect x="40" y="438" width="136" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="108" y="459" font-size="13" text-anchor="middle" fill="#0f172a">类型与语法</text>
  <line x1="180" y1="455" x2="190" y2="455" stroke="#334155" stroke-width="1.6" marker-end="url(#arMap)"/>
  <rect x="196" y="438" width="136" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="264" y="459" font-size="13" text-anchor="middle" fill="#0f172a">并发编程</text>
  <line x1="336" y1="455" x2="346" y2="455" stroke="#334155" stroke-width="1.6" marker-end="url(#arMap)"/>
  <rect x="352" y="438" width="136" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="420" y="459" font-size="13" text-anchor="middle" fill="#0f172a">运行时</text>
  <line x1="492" y1="455" x2="502" y2="455" stroke="#334155" stroke-width="1.6" marker-end="url(#arMap)"/>
  <rect x="508" y="438" width="136" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="576" y="459" font-size="13" text-anchor="middle" fill="#0f172a">工程实践</text>
  <line x1="648" y1="455" x2="658" y2="455" stroke="#334155" stroke-width="1.6" marker-end="url(#arMap)"/>
  <rect x="664" y="438" width="136" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="732" y="459" font-size="13" text-anchor="middle" fill="#0f172a">网络编程</text>
  <line x1="804" y1="455" x2="814" y2="455" stroke="#334155" stroke-width="1.6" marker-end="url(#arMap)"/>
  <rect x="820" y="438" width="136" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="888" y="459" font-size="13" text-anchor="middle" fill="#0f172a">可观测性</text>

  <text x="40" y="504" font-size="11" fill="#64748b">小结：①~⑲ 按「语言机制 → 并发 → 运行时 → 工程 → 网络 → 观测接入」递进；GC、哈希表等语言无关原理在 02-计算机基础，组件原理在 03-数据与中间件</text>
</svg>
