<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="570" fill="#ffffff" rx="0"/>
  <rect x="0" y="0" width="1000" height="78" fill="#ffffff" rx="0"/>
  <text x="500" y="34" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">漏掉「排空请求体」这一步，错位是静默的</text>
  <text x="500" y="60" font-size="12" fill="#64748b" text-anchor="middle">同一份字节、同一个连接：排空时第二个请求解析正常；不排空时方法名变成 helloGET，而客户端收到的仍是 200</text>
  <rect x="24" y="92" width="952" height="186" fill="#f0fdf4" rx="8" stroke="#86efac" stroke-width="1"/>
  <text x="44" y="120" font-size="14" fill="#15803d" text-anchor="start" font-weight="bold">排空（io.Copy(io.Discard, req.Body) 或直接读完）</text>
  <rect x="44" y="134" width="904" height="40" fill="#ffffff" rx="6" stroke="#86efac" stroke-width="1"/>
  <text x="56" y="159" font-size="11" fill="#334155" text-anchor="start" font-family="Consolas, 'Courier New', monospace">字节流：POST /hello + Content-Length: 5 + CRLF CRLF + "hello" + GET /hello …</text>
  <rect x="44" y="184" width="420" height="36" fill="#ffffff" rx="6" stroke="#86efac" stroke-width="1"/>
  <text x="56" y="207" font-size="11" fill="#15803d" text-anchor="start" font-family="Consolas, 'Courier New', monospace">req#1  POST /hello   cl=5  读完 5 字节</text>
  <rect x="476" y="184" width="472" height="36" fill="#ffffff" rx="6" stroke="#86efac" stroke-width="1"/>
  <text x="488" y="207" font-size="11" fill="#15803d" text-anchor="start" font-family="Consolas, 'Courier New', monospace">req#2  GET /hello    hdrBytes=36  ✓</text>
  <text x="44" y="244" font-size="11" fill="#166534" text-anchor="start">body 的 5 个字节被消费掉，下一个请求从 GET 的 G 开始 —— 解析器看到的正好是一个干净的请求行。</text>
  <text x="44" y="264" font-size="10" fill="#15803d" text-anchor="start" font-family="Consolas, 'Courier New', monospace">实测日志：conn#21 req#2 GET /hello HTTP/1.1 cl=0 chunked=false close=false hdrBytes=36</text>
  <rect x="24" y="292" width="952" height="186" fill="#fef2f2" rx="8" stroke="#fca5a5" stroke-width="1"/>
  <text x="44" y="320" font-size="14" fill="#b91c1c" text-anchor="start" font-weight="bold">不排空（handler 不读 body，也没有 discard）</text>
  <rect x="44" y="334" width="904" height="40" fill="#ffffff" rx="6" stroke="#fca5a5" stroke-width="1"/>
  <text x="56" y="359" font-size="11" fill="#334155" text-anchor="start" font-family="Consolas, 'Courier New', monospace">字节流：POST /hello + Content-Length: 5 + CRLF CRLF + "hello" + GET /hello …</text>
  <rect x="44" y="384" width="420" height="36" fill="#ffffff" rx="6" stroke="#fca5a5" stroke-width="1"/>
  <text x="56" y="407" font-size="11" fill="#b91c1c" text-anchor="start" font-family="Consolas, 'Courier New', monospace">req#1  POST /hello   cl=5  一个字节都没读</text>
  <rect x="476" y="384" width="472" height="36" fill="#ffffff" rx="6" stroke="#fca5a5" stroke-width="1"/>
  <text x="488" y="407" font-size="11" fill="#b91c1c" text-anchor="start" font-family="Consolas, 'Courier New', monospace">req#2  helloGET /hello   hdrBytes=41  ✗</text>
  <text x="44" y="444" font-size="11" fill="#991b1b" text-anchor="start">「hello」5 个字节残留，和后面的 GET 粘成一行；helloGET 恰好是合法 token，于是解析成功了。</text>
  <text x="44" y="464" font-size="10" fill="#b91c1c" text-anchor="start" font-family="Consolas, 'Courier New', monospace">实测日志：conn#1 req#2 helloGET /hello HTTP/1.1 cl=0 chunked=false close=false hdrBytes=41</text>
  <rect x="24" y="494" width="952" height="56" fill="#fffbeb" rx="8" stroke="#fbbf24" stroke-width="1"/>
  <text x="44" y="518" font-size="12" fill="#92400e" text-anchor="start" font-weight="bold">两边客户端都收到 HTTP/1.1 200 OK + hello：错误既不报状态码，也不进日志，只在下游路由或鉴权处才炸。</text>
  <text x="44" y="538" font-size="11" fill="#92400e" text-anchor="start">判据：解析出来的 hdrBytes 从 36 涨到 41 —— 多出来的正是上一个请求体的长度。</text>
</svg>
