<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="512" viewBox="0 0 1000 512" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="512" fill="#ffffff"/>
  <defs>
    <marker id="arFb" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="arFg" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>

  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">手写 gRPC 一元调用时序（无 protoc）</text>
  <text x="40" y="58" font-size="13" fill="#64748b">方法名只是字符串，Invoke 才是本体；换 JSON codec 后 HTTP/2 帧、超时、status、metadata 一个都没换</text>

  <!-- headers -->
  <rect x="60" y="72" width="160" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">客户端 conn.Invoke</text>
  <rect x="300" y="72" width="160" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="380" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">jsonCodec</text>
  <rect x="540" y="72" width="160" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="620" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">HTTP/2 帧 · 协议层</text>
  <rect x="780" y="72" width="160" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="860" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">服务端 handler</text>

  <!-- lifelines -->
  <g stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="140" y1="112" x2="140" y2="360"/>
    <line x1="380" y1="112" x2="380" y2="360"/>
    <line x1="620" y1="112" x2="620" y2="360"/>
    <line x1="860" y1="112" x2="860" y2="360"/>
  </g>

  <!-- R1 P1->P2 -->
  <line x1="140" y1="140" x2="380" y2="140" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arFb)"/>
  <text x="260" y="134" text-anchor="middle" font-size="10.5" fill="#1e3a8a">① Invoke(ctx, "/…/CreateOrder", &amp;req, &amp;out)</text>
  <!-- R2 P2->P3 -->
  <line x1="380" y1="172" x2="620" y2="172" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arFb)"/>
  <text x="500" y="166" text-anchor="middle" font-size="10.5" fill="#1e3a8a">② codec.Marshal(&amp;req) → {"qty":2,"sku":"A-1"}</text>
  <!-- R3 P3->P4 -->
  <line x1="620" y1="204" x2="860" y2="204" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arFb)"/>
  <text x="740" y="198" text-anchor="middle" font-size="10.5" fill="#1e3a8a">③ 帧=1B 压缩标志+4B 大端长度+体</text>
  <text x="740" y="222" text-anchor="middle" font-size="10" fill="#64748b">content-type: application/grpc+json</text>
  <!-- server processing note -->
  <text x="860" y="244" text-anchor="middle" font-size="10.5" fill="#14532d">dec(&amp;in) 解到 map</text>
  <text x="860" y="262" text-anchor="middle" font-size="10.5" fill="#14532d">取 x-trace-id（小写）</text>
  <!-- R4 P4->P3 -->
  <line x1="860" y1="284" x2="620" y2="284" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arFg)"/>
  <text x="740" y="278" text-anchor="middle" font-size="10.5" fill="#14532d">④ 回包 {echo,trace} 经 codec.Marshal</text>
  <!-- R5 P3->P2 -->
  <line x1="620" y1="316" x2="380" y2="316" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arFg)"/>
  <text x="500" y="310" text-anchor="middle" font-size="10.5" fill="#14532d">⑤ HTTP/2 帧（协议层不变）</text>
  <!-- R6 P2->P1 -->
  <line x1="380" y1="348" x2="140" y2="348" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arFg)"/>
  <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#14532d">⑥ Unmarshal 写回 &amp;out，客户端收到</text>

  <text x="40" y="392" font-size="11" fill="#64748b">换 codec 只换「内容怎么装」：content-type 仍是 application/grpc+json；HTTP/2 帧、多路复用、stream、超时/取消传播、status code、metadata 一个都没换。</text>
  <text x="40" y="416" font-size="11" fill="#64748b">实测回包 = {"echo":{"qty":2,"sku":"A-1"},"trace":["trace-abc"]}（encoding/json 按键排序）；客户端声明 X-Trace-Id 大写，服务端按小写 x-trace-id 取到。</text>
  <text x="40" y="440" font-size="11" fill="#64748b">多路复用实测：同一 conn 并发 8 条，服务端 11 次调用全部来自 1 个客户端地址 → 复用同一条 TCP/HTTP2 连接。</text>
  <text x="40" y="470" font-size="11" fill="#334155">小结：请求 ①→③ 逐层向下，响应 ④→⑥ 逐层向上；唯一被换掉的是编解码这一层，传输与语义仍是真正的 gRPC over HTTP/2。</text>
</svg>
