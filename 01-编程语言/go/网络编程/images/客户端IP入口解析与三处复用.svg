<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="1040" height="440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1040" height="440" fill="#ffffff"/>
  <text x="520" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">入口解析一次，三处复用同一个客户端 IP</text>
  <text x="520" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">对端不可信直接短路；可信才从 XFF 右端往左扫；结果挂进 context，下游不再重新解析</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <rect x="20" y="84" width="168" height="62" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="104" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">入站请求</text>
  <text x="104" y="127" text-anchor="middle" font-size="10.5" fill="#64748b">RemoteAddr + Header</text>

  <line x1="188" y1="115" x2="226" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <polygon points="228,84 328,84 348,115 328,146 228,146 208,115" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="278" y="111" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">对端可信？</text>
  <text x="278" y="129" text-anchor="middle" font-size="10" fill="#92400e">trusted.Contains</text>

  <line x1="278" y1="146" x2="278" y2="190" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="288" y="172" font-size="10.5" fill="#b91c1c">否（安全底线）</text>
  <rect x="196" y="192" width="164" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="278" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">直接返回对端地址</text>
  <text x="278" y="228" text-anchor="middle" font-size="10" fill="#991b1b">XFF / X-Real-IP 一个字节不看</text>

  <line x1="348" y1="115" x2="396" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="372" y="105" text-anchor="middle" font-size="10.5" fill="#64748b">是</text>

  <rect x="398" y="84" width="180" height="62" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="488" y="107" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">h.Values("X-Forwarded-For")</text>
  <text x="488" y="125" text-anchor="middle" font-size="10" fill="#1e40af">多个同名头先拼接，再按逗号拆</text>

  <line x1="578" y1="115" x2="616" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="618" y="84" width="200" height="62" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="718" y="107" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">从右往左扫</text>
  <text x="718" y="125" text-anchor="middle" font-size="10" fill="#14532d">第一个不可信地址 = 客户端</text>

  <line x1="818" y1="115" x2="856" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="858" y="84" width="162" height="62" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="939" y="107" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5b21b6">clientIP</text>
  <text x="939" y="125" text-anchor="middle" font-size="10" fill="#5b21b6">netip 规范形态</text>

  <line x1="718" y1="146" x2="718" y2="178" stroke="#64748b" stroke-width="1.4"/>
  <text x="712" y="168" font-size="10" text-anchor="end" fill="#64748b">整条链都可信 → 取最左；无 XFF → 回落 X-Real-IP；再不行 → 对端</text>

  <line x1="939" y1="146" x2="939" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="278" y1="238" x2="278" y2="262" stroke="#64748b" stroke-width="1.4"/>
  <line x1="278" y1="262" x2="939" y2="262" stroke="#64748b" stroke-width="1.4"/>

  <rect x="740" y="196" width="398" height="46" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.3"/>
  <text x="939" y="215" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">WithClient(ctx, ip)</text>
  <text x="939" y="232" text-anchor="middle" font-size="10" fill="#166534">入口中间件只解析这一次</text>

  <line x1="939" y1="262" x2="939" y2="286" stroke="#0ea5e9" stroke-width="1.6" marker-end="url(#ab)"/>

  <rect x="60" y="288" width="920" height="118" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="80" y="312" font-size="12.5" font-weight="bold" fill="#334155">请求级消费方：只读 ctx，不再解析 XFF</text>

  <rect x="90" y="326" width="250" height="60" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="215" y="349" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">审计日志</text>
  <text x="215" y="368" text-anchor="middle" font-size="10.5" fill="#1e40af">client 字段 = 解析结果</text>

  <rect x="380" y="326" width="250" height="60" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="505" y="349" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">限流桶 key</text>
  <text x="505" y="368" text-anchor="middle" font-size="10.5" fill="#14532d">登录按用户，匿名才按 IP</text>

  <rect x="670" y="326" width="280" height="60" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="810" y="349" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5b21b6">出口复用</text>
  <text x="810" y="368" text-anchor="middle" font-size="10.5" fill="#5b21b6">HTTP: X-Real-IP　gRPC: metadata x-real-ip</text>

  <line x1="215" y1="262" x2="215" y2="326" stroke="#0ea5e9" stroke-width="1.4" marker-end="url(#ab)"/>
  <line x1="505" y1="262" x2="505" y2="326" stroke="#0ea5e9" stroke-width="1.4" marker-end="url(#ab)"/>
  <line x1="810" y1="262" x2="810" y2="326" stroke="#0ea5e9" stroke-width="1.4" marker-end="url(#ab)"/>

  <text x="520" y="428" text-anchor="middle" font-size="11" fill="#b45309">⚠️ 内部服务与新增入口必须复用入口规范化结果；各自再解析一次 = 把伪造口子复制 N 份</text>
</svg>
