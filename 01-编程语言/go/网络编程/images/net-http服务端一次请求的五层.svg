<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 644" width="1000" height="644" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="644" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">一次请求在 net/http 里走过的五层</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">前四层是标准库写死的默认值，只有第五层是你的代码</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <text x="26" y="106" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="bold">监听</text>
  <rect x="196" y="76" width="520" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="214" y="104" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold">① (*Server).Serve(l)</text>
  <text x="214" y="126" font-size="11" fill="#0f172a" text-anchor="start">Accept 循环；临时错误退避重试（上限 1 s）；每条连接 go c.serve</text>
  <text x="736" y="108" font-size="11" fill="#64748b" text-anchor="start">server.go:3404</text>
  <line x1="456" y1="154" x2="456" y2="172" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="26" y="202" font-size="11.5" fill="#0e7490" text-anchor="start" font-weight="bold">每连接一个协程</text>
  <rect x="196" y="172" width="520" height="78" rx="10" fill="#cffafe" stroke="#0e7490" stroke-width="1.2"/>
  <text x="214" y="200" font-size="13" fill="#0e7490" text-anchor="start" font-weight="bold">② (*conn).serve(ctx)</text>
  <text x="214" y="222" font-size="11" fill="#0f172a" text-anchor="start">一条连接一个 goroutine；keep-alive 的“循环”就在这一层；读写各 4 KB bufio</text>
  <text x="736" y="204" font-size="11" fill="#64748b" text-anchor="start">server.go:1887</text>
  <line x1="456" y1="250" x2="456" y2="268" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="26" y="298" font-size="11.5" fill="#7e22ce" text-anchor="start" font-weight="bold">解析</text>
  <rect x="196" y="268" width="520" height="78" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.2"/>
  <text x="214" y="296" font-size="13" fill="#7e22ce" text-anchor="start" font-weight="bold">③ (*conn).readRequest(ctx)</text>
  <text x="214" y="318" font-size="11" fill="#0f172a" text-anchor="start">解析请求行与首部 → 产出 *http.Request 与 *response（ResponseWriter 的实现）</text>
  <text x="736" y="300" font-size="11" fill="#64748b" text-anchor="start">server.go:976</text>
  <line x1="456" y1="346" x2="456" y2="364" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="26" y="394" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="bold">选路</text>
  <rect x="196" y="364" width="520" height="78" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="214" y="392" font-size="13" fill="#b45309" text-anchor="start" font-weight="bold">④ serverHandler.ServeHTTP</text>
  <text x="214" y="414" font-size="11" fill="#0f172a" text-anchor="start">选 handler：srv.Handler 为 nil 就换成 DefaultServeMux</text>
  <text x="736" y="396" font-size="11" fill="#64748b" text-anchor="start">server.go:3302</text>
  <line x1="456" y1="442" x2="456" y2="460" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="26" y="490" font-size="11.5" fill="#15803d" text-anchor="start" font-weight="bold">业务</text>
  <rect x="196" y="460" width="520" height="78" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="214" y="488" font-size="13" fill="#15803d" text-anchor="start" font-weight="bold">⑤ 你的 ServeHTTP</text>
  <text x="214" y="510" font-size="11" fill="#0f172a" text-anchor="start">中间件洋葱 → ServeMux 匹配 → 真正的业务逻辑</text>
  <text x="736" y="492" font-size="11" fill="#64748b" text-anchor="start">你的代码</text>
  <rect x="24" y="556" width="952" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="578" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">四层里只有第 ⑤ 层是你的。</text>
  <text x="200" y="578" font-size="11.5" fill="#0f172a" text-anchor="start">前面每一层的决定都是写死的默认值，没有配置项可改：</text>
  <text x="40" y="598" font-size="11.5" fill="#64748b" text-anchor="start">一条连接一个 goroutine、读写各 4 KB 缓冲、Request 与 ResponseWriter 在哪里分配。</text>
  <text x="40" y="618" font-size="11.5" fill="#64748b" text-anchor="start">要换掉其中任何一层，只能绕开 net/http 自己接 net.Conn（见同目录《从零实现HTTP服务端》）。</text>
</svg>
