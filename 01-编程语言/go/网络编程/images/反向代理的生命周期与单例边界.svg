<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1040" height="470" fill="#ffffff"/>
  <text x="520" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">反向代理的单例边界与生命周期</text>
  <text x="520" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">启动时按上游各建一份 Transport + ReverseProxy；运行期所有请求共享连接池；退出时先排空请求再关空闲连接</text>

  <text x="20" y="84" font-size="13" font-weight="bold" fill="#334155">启动：显式构造，顺序可见</text>
  <rect x="20" y="96" width="150" height="54" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="95" y="119" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">① 读配置</text>
  <text x="95" y="137" text-anchor="middle" font-size="10.5" fill="#64748b">上游 / 可信网段 / 超时</text>

  <rect x="190" y="96" width="160" height="54" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="270" y="119" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">② 可信代理解析器</text>
  <text x="270" y="137" text-anchor="middle" font-size="10.5" fill="#075985">trusted prefixes</text>

  <rect x="370" y="96" width="190" height="54" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="465" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">③ 每个上游一份</text>
  <text x="465" y="136" text-anchor="middle" font-size="10.5" fill="#14532d">Transport + ReverseProxy</text>

  <rect x="580" y="96" width="150" height="54" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="655" y="119" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">④ 路由表</text>
  <text x="655" y="137" text-anchor="middle" font-size="10.5" fill="#92400e">捕获 *Proxy 指针</text>

  <rect x="750" y="96" width="130" height="54" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="815" y="119" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">⑤ 中间件</text>
  <text x="815" y="137" text-anchor="middle" font-size="10.5" fill="#5b21b6">鉴权 / 限流 / trace</text>

  <rect x="900" y="96" width="120" height="54" rx="9" fill="#fce7f3" stroke="#db2777" stroke-width="1.2"/>
  <text x="960" y="119" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">⑥ 启动服务</text>
  <text x="960" y="137" text-anchor="middle" font-size="10.5" fill="#9d174d">http.Server</text>

  <line x1="170" y1="123" x2="188" y2="123" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="350" y1="123" x2="368" y2="123" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="560" y1="123" x2="578" y2="123" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="730" y1="123" x2="748" y2="123" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="880" y1="123" x2="898" y2="123" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <line x1="520" y1="172" x2="520" y2="196" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="532" y="190" font-size="11" fill="#94a3b8">运行期</text>

  <rect x="20" y="200" width="1000" height="170" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="226" font-size="13" font-weight="bold" fill="#334155">运行：请求级对象 vs 进程级对象</text>

  <rect x="40" y="242" width="120" height="38" rx="7" fill="#fff" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="100" y="266" text-anchor="middle" font-size="11.5" fill="#334155">请求 R1</text>
  <rect x="40" y="290" width="120" height="38" rx="7" fill="#fff" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="100" y="314" text-anchor="middle" font-size="11.5" fill="#334155">请求 R2</text>
  <rect x="40" y="338" width="120" height="28" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="100" y="356" text-anchor="middle" font-size="11" fill="#64748b">请求 R3 …</text>

  <line x1="160" y1="261" x2="318" y2="261" stroke="#0ea5e9" stroke-width="1.6" marker-end="url(#b)"/>
  <line x1="160" y1="309" x2="318" y2="309" stroke="#0ea5e9" stroke-width="1.6" marker-end="url(#b)"/>
  <line x1="160" y1="352" x2="318" y2="330" stroke="#0ea5e9" stroke-width="1.6" marker-end="url(#b)"/>

  <rect x="320" y="242" width="240" height="124" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="440" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">进程级：*Proxy（按上游一份）</text>
  <text x="440" y="290" text-anchor="middle" font-size="11.5" fill="#14532d">Director / ModifyResponse / ErrorHandler</text>
  <text x="440" y="312" text-anchor="middle" font-size="11.5" fill="#14532d">共享同一个 *http.Transport</text>
  <text x="440" y="334" text-anchor="middle" font-size="11.5" fill="#14532d">连接池：MaxIdleConnsPerHost = 50</text>
  <text x="440" y="356" text-anchor="middle" font-size="10.5" fill="#166534">并发安全，不随请求创建</text>

  <line x1="560" y1="304" x2="628" y2="304" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="594" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">复用</text>

  <rect x="630" y="242" width="180" height="124" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="720" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">连接池</text>
  <text x="720" y="290" text-anchor="middle" font-size="11" fill="#1e40af">Keep-Alive 连接</text>
  <text x="720" y="312" text-anchor="middle" font-size="11" fill="#1e40af">第二轮起复用</text>
  <text x="720" y="334" text-anchor="middle" font-size="11" fill="#1e40af">每上游独立</text>
  <text x="720" y="356" text-anchor="middle" font-size="10.5" fill="#1d4ed8">TLS 参数不串味</text>

  <line x1="810" y1="304" x2="858" y2="304" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="860" y="242" width="140" height="124" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.3"/>
  <text x="930" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#854d0e">上游</text>
  <text x="930" y="290" text-anchor="middle" font-size="11" fill="#854d0e">HTTP / HTTPS</text>
  <text x="930" y="312" text-anchor="middle" font-size="11" fill="#854d0e">原始 Host</text>
  <text x="930" y="334" text-anchor="middle" font-size="11" fill="#854d0e">由 X-Forwarded-Host</text>
  <text x="930" y="352" text-anchor="middle" font-size="11" fill="#854d0e">保留</text>

  <rect x="40" y="376" width="960" height="30" rx="7" fill="#fff7ed" stroke="#fb923c" stroke-width="1.1"/>
  <text x="520" y="396" text-anchor="middle" font-size="11.5" fill="#9a3412">请求级对象：*http.Request（含 body 与 ctx）、ErrHolder（本次转发的错误）—— 不能跨请求复用</text>

  <text x="20" y="440" font-size="13" font-weight="bold" fill="#334155">退出：先停止接客，再关空闲连接</text>
  <rect x="330" y="420" width="250" height="30" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="455" y="440" text-anchor="middle" font-size="11.5" fill="#5b21b6">① srv.Shutdown：等待在途请求</text>
  <line x1="580" y1="435" x2="628" y2="435" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="630" y="420" width="330" height="30" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="795" y="440" text-anchor="middle" font-size="11.5" fill="#334155">② CloseIdleConnections：释放上游 fd</text>
</svg>
