<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="760" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一次 client.Get 的调用时序与各段超时覆盖范围</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#64748b">响应头拿到时请求还没结束：Body 是流，读尽才会把连接还回池子</text>

  <!-- 生命线头部 -->
  <g font-size="12.5" font-weight="bold" text-anchor="middle">
    <rect x="52" y="72" width="130" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="117" y="97" fill="#0f172a">业务代码</text>
    <rect x="222" y="72" width="130" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="287" y="97" fill="#1e3a8a">http.Client</text>
    <rect x="392" y="72" width="130" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="457" y="97" fill="#14532d">http.Transport</text>
    <rect x="562" y="72" width="130" height="40" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="627" y="97" fill="#0f172a">persistConn</text>
    <rect x="732" y="72" width="130" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="797" y="97" fill="#7f1d1d">对端服务</text>
  </g>

  <!-- 生命线 -->
  <g stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="117" y1="112" x2="117" y2="700"/>
    <line x1="287" y1="112" x2="287" y2="700"/>
    <line x1="457" y1="112" x2="457" y2="700"/>
    <line x1="627" y1="112" x2="627" y2="700"/>
    <line x1="797" y1="112" x2="797" y2="700"/>
  </g>

  <!-- 1 -->
  <path d="M117 138 L287 138" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="200" y="132" text-anchor="middle" font-size="11.5" fill="#1e3a8a">1. Get(url)</text>
  <!-- 2 -->
  <path d="M287 168 L347 168 L347 184 L291 184" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  <text x="352" y="178" font-size="11.5" fill="#1e3a8a">2. setRequestCancel：起整次调用的定时器</text>
  <!-- 3 -->
  <path d="M287 212 L457 212" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="372" y="206" text-anchor="middle" font-size="11.5" fill="#1e3a8a">3. RoundTrip(req)</text>
  <!-- 4 -->
  <path d="M457 242 L517 242 L517 258 L461 258" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <text x="522" y="252" font-size="11.5" fill="#14532d">4. tryTakeConn：命中空闲连接 GotConn(Reused=true)</text>
  <text x="522" y="270" font-size="11.5" fill="#14532d">　没有就 DialContext 建连（Reused=false），此时才付 TCP 与 TLS 成本</text>
  <!-- 5 -->
  <path d="M457 296 L627 296" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="542" y="290" text-anchor="middle" font-size="11.5" fill="#14532d">5. persistConn.roundTrip 入队</text>
  <!-- 6 -->
  <path d="M627 326 L687 326 L687 342 L631 342" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#an)"/>
  <text x="692" y="336" font-size="11.5" fill="#334155">6. writeLoop 写请求头与 Body</text>
  <!-- 7 -->
  <path d="M627 366 L797 366" stroke="#334155" stroke-width="1.6" marker-end="url(#an)"/>
  <text x="712" y="360" text-anchor="middle" font-size="11.5" fill="#334155">7. 一条连接上的第 N 个请求</text>
  <!-- 8 -->
  <path d="M797 396 L627 396" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ar2)"/>
  <text x="712" y="390" text-anchor="middle" font-size="11.5" fill="#7f1d1d">8. 响应头（服务端先关则这里拿到 EOF）</text>
  <!-- 9 -->
  <path d="M627 426 L287 426" stroke="#334155" stroke-width="1.6" marker-end="url(#an)"/>
  <text x="457" y="420" text-anchor="middle" font-size="11.5" fill="#334155">9. resp 返回，Body 是一个还没读的流</text>
  <!-- 10 -->
  <path d="M287 456 L117 456" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="202" y="450" text-anchor="middle" font-size="11.5" fill="#1e3a8a">10. err 为 nil，返回给调用方</text>
  <!-- 11 -->
  <path d="M117 490 L627 490" stroke="#b45309" stroke-width="1.6" marker-end="url(#ay)"/>
  <text x="372" y="484" text-anchor="middle" font-size="11.5" fill="#854d0e">11. io.ReadAll(resp.Body)　读多少算多少，超时也算在这一段</text>
  <!-- 12 -->
  <path d="M627 520 L797 520" stroke="#b45309" stroke-width="1.4" marker-end="url(#ay)"/>
  <text x="712" y="514" text-anchor="middle" font-size="11.5" fill="#854d0e">12. 剩下的字节还在对端发</text>
  <path d="M797 548 L627 548" stroke="#b45309" stroke-width="1.4" marker-end="url(#ay)"/>
  <text x="712" y="542" text-anchor="middle" font-size="11.5" fill="#854d0e">13. 直到读完（或读到 EOF）</text>
  <!-- 14 -->
  <path d="M627 580 L457 580" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="542" y="574" text-anchor="middle" font-size="11.5" fill="#14532d">14. Body.Close 后 tryPutIdleConn 归还</text>
  <text x="542" y="600" font-size="11.5" fill="#14532d">　没读尽就 Close：连接被直接丢弃，实测复用率掉到 0</text>
  <!-- 15 -->
  <path d="M457 630 L287 630" stroke="#16a34a" stroke-width="1.4" marker-end="url(#ag)"/>
  <text x="372" y="624" text-anchor="middle" font-size="11.5" fill="#14532d">15. 下一个请求直接复用这条连接</text>
  <!-- 16 -->
  <path d="M287 664 L347 664 L347 680 L291 680" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  <text x="352" y="674" font-size="11.5" fill="#1e3a8a">16. stopTimer：整次调用结束</text>

  <!-- 超时覆盖条 -->
  <rect x="52" y="700" width="820" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="66" y="718" font-size="11.5" fill="#0f172a">覆盖范围：Client.Timeout 管 1 到 16 全程（含重定向链与读 Body）；context 的 deadline 同样管到读完 Body；</text>
  <text x="66" y="736" font-size="11.5" fill="#0f172a">Transport 的 ResponseHeaderTimeout 只管 7 到 8，TLSHandshakeTimeout 只管第 4 步的握手，Dialer.Timeout 只管建连。</text>

  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
