<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
  <defs>
    <marker id="h2a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Shutdown 的排空：关入口之后，等在途请求自己跑完</text>

  <text x="40" y="86" font-size="13" fill="#64748b">时间 →</text>
  <line x1="90" y1="82" x2="960" y2="82" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#h2a)"/>

  <rect x="60" y="110" width="260" height="76" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="190" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">① 关掉 listener</text>
  <text x="190" y="162" text-anchor="middle" font-size="12" fill="#334155">不再接受任何新连接</text>
  <line x1="320" y1="110" x2="320" y2="330" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="700" y1="110" x2="700" y2="330" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>

  <rect x="330" y="110" width="370" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="515" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">② 等在途请求跑完</text>
  <text x="515" y="162" text-anchor="middle" font-size="12" fill="#334155">不打断、不掐断，直到它们自己返回</text>

  <rect x="710" y="110" width="250" height="76" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="835" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">③ 返回</text>
  <text x="835" y="162" text-anchor="middle" font-size="12" fill="#334155">Serve 得到 ErrServerClosed</text>

  <rect x="60" y="212" width="640" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="80" y="243" font-size="13" fill="#0f172a">在途请求：照常跑完 —— 实测客户端仍拿到完整 body（slow-done）</text>

  <rect x="60" y="280" width="240" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="180" y="309" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">✕ 新请求：连接被拒</text>

  <rect x="40" y="356" width="920" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="64" y="380" font-size="13" font-weight="bold" fill="#0f172a">两段式：先 Shutdown(带 ctx 超时) 尽力排空 → 超时了再 Close() 强关</text>
  <text x="64" y="400" font-size="12" fill="#dc2626">⚠️ Shutdown 的 ctx 超时只意味着「不再等」，在途请求仍在跑；别把 http.ErrServerClosed 当错误</text>

  <rect x="40" y="424" width="920" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="64" y="448" font-size="13" fill="#334155">Shutdown 与 Close 的分工：两者都关 listener 与空闲连接，差别只在「是否等在途请求跑完」</text>
  <text x="64" y="470" font-size="13" fill="#334155">所以关停用 Shutdown，Close 只作为「排空超时之后」的兜底手段</text>
</svg>
