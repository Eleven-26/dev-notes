<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">工厂与 Connection 进程级单例，Session 跟着线程走</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">activemq-client 6.1.4 + JDK 17；OpenWire 61616，默认 queuePrefetch=1000</text>

  <rect x="40" y="88" width="560" height="450" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="320" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">业务进程（JVM）</text>

  <rect x="105" y="126" width="430" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="320" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">ActiveMQConnectionFactory（进程级，线程安全）</text>
  <text x="320" y="170" text-anchor="middle" font-size="11.5" fill="#334155">RedeliveryPolicy / PrefetchPolicy 在 createConnection 之前设定</text>

  <rect x="105" y="204" width="430" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="320" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Connection（进程级单例）</text>
  <text x="320" y="248" text-anchor="middle" font-size="11.5" fill="#334155">1 条 TCP 长连接；conn.start() 之后才收消息</text>

  <line x1="320" y1="182" x2="320" y2="200" stroke="#2563eb" stroke-width="1.6"/>
  <polygon points="320,204 315,193 325,193" fill="#2563eb"/>

  <rect x="70" y="292" width="150" height="104" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="145" y="316" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">Session A</text>
  <text x="145" y="337" text-anchor="middle" font-size="11.5" fill="#334155">线程 1 私有</text>
  <text x="145" y="357" text-anchor="middle" font-size="11" fill="#334155">Producer + Consumer</text>
  <text x="145" y="377" text-anchor="middle" font-size="11" fill="#475569">确认状态归本条</text>

  <rect x="240" y="292" width="150" height="104" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="315" y="316" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">Session B</text>
  <text x="315" y="337" text-anchor="middle" font-size="11.5" fill="#334155">线程 2 私有</text>
  <text x="315" y="357" text-anchor="middle" font-size="11" fill="#334155">CLIENT_ACK</text>
  <text x="315" y="377" text-anchor="middle" font-size="11" fill="#475569">acknowledge() 显式确认</text>

  <rect x="410" y="292" width="150" height="104" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="485" y="316" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">Session C</text>
  <text x="485" y="337" text-anchor="middle" font-size="11.5" fill="#334155">监听器线程私有</text>
  <text x="485" y="357" text-anchor="middle" font-size="11" fill="#334155">SESSION_TRANSACTED</text>
  <text x="485" y="377" text-anchor="middle" font-size="11" fill="#475569">commit() 才算确认</text>

  <line x1="320" y1="260" x2="145" y2="292" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="320" y1="260" x2="315" y2="292" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="320" y1="260" x2="485" y2="292" stroke="#94a3b8" stroke-width="1.4"/>

  <rect x="70" y="418" width="490" height="100" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4"/>
  <text x="315" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#713f12">Session 不是线程安全的（JMS 规范）</text>
  <text x="315" y="463" text-anchor="middle" font-size="11.5" fill="#334155">一个线程一个 Session；Producer / Consumer 跟随 Session</text>
  <text x="315" y="484" text-anchor="middle" font-size="11.5" fill="#334155">跨线程共用 → 确认与事务状态互相覆盖，表现为偶发丢消息</text>
  <text x="315" y="505" text-anchor="middle" font-size="11.5" fill="#475569">默认 queuePrefetch=1000：慢消费时这批消息全在 in-flight</text>

  <rect x="660" y="88" width="300" height="450" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="810" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Broker：ActiveMQ Classic 6.1.4</text>

  <rect x="690" y="132" width="240" height="72" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="810" y="157" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">OpenWire 61616</text>
  <text x="810" y="178" text-anchor="middle" font-size="11.5" fill="#334155">lab.orders / lab.poison</text>
  <text x="810" y="196" text-anchor="middle" font-size="11" fill="#475569">JMS 客户端不走 STOMP 61613</text>

  <rect x="690" y="224" width="240" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="810" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4c1d95">KahaDB 持久化</text>
  <text x="810" y="269" text-anchor="middle" font-size="11.5" fill="#334155">PERSISTENT 落盘后才确认</text>

  <rect x="690" y="308" width="240" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="810" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">ActiveMQ.DLQ</text>
  <text x="810" y="353" text-anchor="middle" font-size="11.5" fill="#334155">重投超上限后转入</text>

  <rect x="690" y="392" width="240" height="64" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.3"/>
  <text x="810" y="416" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#713f12">Scheduler</text>
  <text x="810" y="437" text-anchor="middle" font-size="11.5" fill="#334155">AMQ_SCHEDULED_DELAY 毫秒</text>

  <line x1="535" y1="232" x2="686" y2="170" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="690,168 677,163 681,175" fill="#2563eb"/>
  <text x="600" y="190" text-anchor="middle" font-size="11" fill="#1e3a8a">TCP 长连接</text>

  <rect x="40" y="558" width="920" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="500" y="586" text-anchor="middle" font-size="12.5" fill="#334155">要点：工厂与 Connection 单例，Session 跟线程走；默认 queuePrefetch=1000，进程崩溃后这批 in-flight 消息要等连接超时才重投。</text>
</svg>
