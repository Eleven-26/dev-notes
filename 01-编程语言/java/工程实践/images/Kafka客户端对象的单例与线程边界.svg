<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Kafka 客户端对象：进程级共享 vs 线程级独占</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">数据结构形态图；归属划分出自第四节单例边界表</text>

  <defs>
    <marker id="n1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="n2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 左：进程级 -->
  <rect x="40" y="86" width="440" height="290" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="260" y="112" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">进程级单例</text>

  <rect x="70" y="130" width="380" height="66" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="260" y="153" font-size="12" fill="#1e3a8a" text-anchor="middle">KafkaProducer（线程安全）</text>
  <text x="260" y="172" font-size="12" fill="#1e3a8a" text-anchor="middle">内部：连接池 + 后台 I/O 线程</text>
  <text x="260" y="190" font-size="12" fill="#64748b" text-anchor="middle">每次 new 都新建一套连接池与线程</text>

  <rect x="70" y="222" width="380" height="56" rx="6" fill="#f8fafc" stroke="#2563eb"/>
  <text x="260" y="245" font-size="12" fill="#0f172a" text-anchor="middle">KafkaTemplate（Spring 单例 Bean）</text>
  <text x="260" y="264" font-size="12" fill="#64748b" text-anchor="middle">内部持有一个 ProducerFactory</text>

  <rect x="70" y="302" width="380" height="46" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="260" y="330" font-size="12" fill="#7f1d1d" text-anchor="middle">别把请求级数据存进它的字段——多线程共享立刻串数据</text>

  <!-- 右：线程级 -->
  <rect x="520" y="86" width="440" height="290" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="740" y="112" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">线程级：一个消费线程一份</text>

  <rect x="550" y="130" width="120" height="72" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="610" y="158" font-size="12" fill="#14532d" text-anchor="middle">KafkaConsumer</text>
  <text x="610" y="178" font-size="12" fill="#14532d" text-anchor="middle">poll 循环</text>

  <rect x="690" y="130" width="120" height="72" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="750" y="158" font-size="12" fill="#14532d" text-anchor="middle">KafkaConsumer</text>
  <text x="750" y="178" font-size="12" fill="#14532d" text-anchor="middle">poll 循环</text>

  <rect x="830" y="130" width="120" height="72" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="890" y="158" font-size="12" fill="#14532d" text-anchor="middle">KafkaConsumer</text>
  <text x="890" y="178" font-size="12" fill="#14532d" text-anchor="middle">poll 循环</text>

  <g font-size="12">
    <rect x="550" y="228" width="380" height="52" rx="6" fill="#fef3c7" stroke="#b45309"/>
    <text x="740" y="249" fill="#854d0e" text-anchor="middle">非单例且线程不安全：commitSync / wakeup / close</text>
    <text x="740" y="268" fill="#854d0e" text-anchor="middle">都只作用于单个实例</text>

    <rect x="550" y="302" width="380" height="46" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="740" y="330" font-size="12" fill="#7f1d1d" text-anchor="middle">跨线程共享 → ConcurrentModificationException</text>
  </g>

  <!-- 底部：请求级 -->
  <rect x="40" y="400" width="920" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="500" y="426" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">请求级（每条 / 每批独立，用完即弃）</text>
  <text x="500" y="450" font-size="12" fill="#334155" text-anchor="middle">ProducerRecord · ConsumerRecord · Acknowledgment（绑定本次 poll 的那批记录）</text>

  <line x1="260" y1="196" x2="260" y2="222" stroke="#334155" stroke-width="1.6" marker-end="url(#n1)"/>

  <text x="500" y="506" font-size="12" fill="#334155" text-anchor="middle">一句话：生产者单例（线程安全、省连接），消费者非单例（一个订阅 / 线程一份独立状态）</text>
  <text x="500" y="540" font-size="12" fill="#64748b" text-anchor="middle">要并发就多实例（每线程一个消费者），或交给容器：listener.concurrency=3 按分区建线程，不要超过分区数</text>
</svg>
