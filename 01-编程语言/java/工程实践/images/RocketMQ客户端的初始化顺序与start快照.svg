<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">RocketMQ 客户端的初始化顺序：三件事都要赶在 start() 之前</text>
  <text x="40" y="58" font-size="13" fill="#64748b">应用进程内的流程图（第五节三条实序）；start() 是「快照」时刻，晚设等于没设</text>

  <defs>
    <marker id="arRinit" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="40" y="84" width="290" height="76" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="52" y="106" font-size="12" font-weight="bold" fill="#0f172a">① setNamesrvAddr 先于 start()</text>
  <text x="52" y="126" font-size="11" fill="#334155">start() 时才去解析 NameServer 与拉取路由</text>
  <text x="52" y="146" font-size="11" fill="#b45309">晚设等于没设</text>

  <rect x="40" y="196" width="290" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="218" font-size="12" font-weight="bold" fill="#0f172a">② subscribe 先于 start()（消费者）</text>
  <text x="52" y="238" font-size="11" fill="#334155">DefaultMQPushConsumer 在 start() 时</text>
  <text x="52" y="258" font-size="11" fill="#b45309">快照订阅关系：先 start 订阅不生效</text>

  <rect x="370" y="84" width="290" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="382" y="106" font-size="12" font-weight="bold" fill="#0f172a">producer.start() / consumer.start()</text>
  <text x="382" y="126" font-size="11" fill="#334155">建 TCP 连接、起心跳线程、拉路由</text>
  <text x="382" y="146" font-size="11" fill="#334155">此后持有 TCP 连接与心跳线程（第四节）</text>

  <rect x="370" y="196" width="290" height="76" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="382" y="218" font-size="12" font-weight="bold" fill="#7f1d1d">③ 组名全局唯一且语义稳定</text>
  <text x="382" y="238" font-size="11" fill="#7f1d1d">ProducerGroup / ConsumerGroup 同名不同参</text>
  <text x="382" y="258" font-size="11" fill="#7f1d1d">→ 启动报错或行为异常</text>

  <rect x="700" y="84" width="260" height="76" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="712" y="106" font-size="12" font-weight="bold" fill="#0f172a">注册回调 / 监听器</text>
  <text x="712" y="126" font-size="11" fill="#334155">setTransactionListener 等</text>
  <text x="712" y="146" font-size="11" fill="#334155">也在 start() 之前配好</text>

  <rect x="700" y="196" width="260" height="76" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="712" y="218" font-size="12" font-weight="bold" fill="#7c2d12">事务组的额外限制（7.5）</text>
  <text x="712" y="238" font-size="11" fill="#7c2d12">事务消息不能与延迟 / 批量混用</text>
  <text x="712" y="258" font-size="11" fill="#7c2d12">回查线程池勿与发送共用</text>

  <g stroke="#334155" stroke-width="1.6">
    <line x1="330" y1="122" x2="370" y2="122" marker-end="url(#arRinit)"/>
    <line x1="660" y1="122" x2="700" y2="122" marker-end="url(#arRinit)"/>
    <line x1="185" y1="160" x2="185" y2="196" marker-end="url(#arRinit)"/>
    <line x1="515" y1="160" x2="515" y2="196" stroke-dasharray="5 4" marker-end="url(#arRinit)"/>
    <line x1="830" y1="160" x2="830" y2="196" stroke-dasharray="5 4" marker-end="url(#arRinit)"/>
  </g>

  <rect x="40" y="304" width="920" height="72" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="52" y="326" font-size="12" font-weight="bold" fill="#7f1d1d">⭐ 同一条判据（本节原话）</text>
  <text x="52" y="347" font-size="11" fill="#7f1d1d">凡是在初始化时捕获全局单例的下游组件，都必须排在被捕获者之后初始化，否则它拿到的是初始化那一刻的旧值（常常是 noop），且不报错。</text>
  <text x="52" y="366" font-size="11" fill="#7f1d1d">链路追踪栈的例子见 接入Jaeger.md 第五节。</text>

  <text x="40" y="404" font-size="11" fill="#64748b">小结：三条实序都卡在同一个时刻——start()：路由、订阅关系、组名都在那一刻被读走，之后再改只影响下一个实例。</text>
</svg>
