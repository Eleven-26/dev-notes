<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="720" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">K8s 里一次调用的分层：谁在哪一层做负载均衡</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#64748b">分层与坑全部取自本篇第五节表格（CoreDNS / kube-proxy / Ingress / Headless / ReadinessProbe）</text>

  <!-- 第一层：请求路径上的组件 -->
  <rect x="20" y="100" width="140" height="72" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90" y="130" text-anchor="middle" font-size="12" fill="#334155">① 流量来源</text>
  <text x="90" y="152" text-anchor="middle" font-size="10.5" fill="#64748b">外部请求</text>

  <rect x="180" y="100" width="140" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="126" text-anchor="middle" font-size="12" fill="#1e40af">② Ingress</text>
  <text x="250" y="146" text-anchor="middle" font-size="10.5" fill="#334155">L7 请求级</text>
  <text x="250" y="164" text-anchor="middle" font-size="10.5" fill="#64748b">按 path/host 分流</text>

  <rect x="340" y="100" width="140" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="126" text-anchor="middle" font-size="12" fill="#1e40af">③ CoreDNS</text>
  <text x="410" y="146" text-anchor="middle" font-size="10.5" fill="#334155">服务名解析</text>
  <text x="410" y="164" text-anchor="middle" font-size="10.5" fill="#64748b">域名 → ClusterIP</text>

  <rect x="500" y="100" width="140" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="570" y="126" text-anchor="middle" font-size="12" fill="#1e40af">④ Service</text>
  <text x="570" y="146" text-anchor="middle" font-size="10.5" fill="#334155">ClusterIP / 虚拟 IP</text>
  <text x="570" y="164" text-anchor="middle" font-size="10.5" fill="#64748b">两种形态二选一</text>

  <rect x="660" y="100" width="140" height="72" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="730" y="126" text-anchor="middle" font-size="12" fill="#b45309">⑤ kube-proxy</text>
  <text x="730" y="146" text-anchor="middle" font-size="10.5" fill="#334155">L4 连接级</text>
  <text x="730" y="164" text-anchor="middle" font-size="10.5" fill="#64748b">iptables / IPVS</text>

  <rect x="820" y="100" width="140" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="890" y="126" text-anchor="middle" font-size="12" fill="#15803d">⑥ 后端 Pod 组</text>
  <text x="890" y="146" text-anchor="middle" font-size="10.5" fill="#334155">Endpoints 成员</text>
  <text x="890" y="164" text-anchor="middle" font-size="10.5" fill="#64748b">探针决定是否在内</text>

  <line x1="160" y1="136" x2="180" y2="136" stroke="#94a3b8" stroke-width="2" marker-end="url(#arS)"/>
  <line x1="320" y1="136" x2="340" y2="136" stroke="#94a3b8" stroke-width="2" marker-end="url(#arS)"/>
  <line x1="480" y1="136" x2="500" y2="136" stroke="#94a3b8" stroke-width="2" marker-end="url(#arS)"/>
  <line x1="640" y1="136" x2="660" y2="136" stroke="#94a3b8" stroke-width="2" marker-end="url(#arS)"/>
  <line x1="800" y1="136" x2="820" y2="136" stroke="#94a3b8" stroke-width="2" marker-end="url(#arS)"/>

  <text x="20" y="196" font-size="11.5" fill="#475569">② 只处理入口流量，service→service 内部调用不经过它；集群内调用从 ③ 进；④ 有 ClusterIP 与 Headless 两种形态，走的是下面两条不同分支。</text>

  <!-- 分支一：ClusterIP -->
  <rect x="20" y="214" width="620" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="240" font-size="12.5" font-weight="bold" fill="#334155">分支一：ClusterIP + kube-proxy（对长连接等效于没做 LB）</text>
  <text x="40" y="266" font-size="12" fill="#475569">· CoreDNS 的坑：ndots:5 让每个域名多次查询，且 DNS 结果有缓存，扩缩容后不是立刻生效；</text>
  <text x="40" y="288" font-size="12" fill="#475569">· kube-proxy 在节点内核层按连接转发，长连接（gRPC / HTTP2 / 连接池）一条连接跑到底，</text>
  <text x="40" y="310" font-size="12" fill="#b91c1c">  于是流量一直打到同一台 Pod，新 Pod 分不到 —— 短连接 HTTP 够用，长连接要另想办法。</text>

  <!-- 分支二：Headless -->
  <rect x="20" y="354" width="620" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="380" font-size="12.5" font-weight="bold" fill="#334155">分支二：Headless Service（clusterIP: None），把 LB 交回客户端</text>
  <text x="40" y="406" font-size="12" fill="#475569">· DNS 直接返回所有 Pod IP，客户端自己拿列表、自己挑，对应本篇第三节与 Go 侧那套；</text>
  <text x="40" y="428" font-size="12" fill="#475569">· gRPC 官方推荐这条，配合 round_robin LB policy；</text>
  <text x="40" y="450" font-size="12" fill="#475569">· 两条解法二选一：客户端轮询并定期重建连接，或 Headless + 客户端负载均衡。</text>

  <line x1="570" y1="172" x2="330" y2="214" stroke="#2563eb" stroke-width="2" marker-end="url(#arB)"/>

  <!-- ReadinessProbe -->
  <rect x="700" y="354" width="250" height="112" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="825" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">ReadinessProbe</text>
  <text x="825" y="406" text-anchor="middle" font-size="11" fill="#334155">控制 Pod 是否进 Endpoints</text>
  <text x="825" y="428" text-anchor="middle" font-size="10.5" fill="#475569">没配 = 容器一起来就接满流量</text>
  <text x="825" y="450" text-anchor="middle" font-size="10.5" fill="#475569">JVM 预热期超时 → 上线抖一下</text>

  <line x1="825" y1="354" x2="825" y2="176" stroke="#dc2626" stroke-width="2" marker-end="url(#arR)"/>

  <!-- 底部：谁还剩下要做 -->
  <rect x="40" y="486" width="920" height="216" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="512" font-size="12.5" font-weight="bold" fill="#334155">用了 K8s 还要不要 Nacos？（第五节结论）</text>
  <text x="60" y="538" font-size="12" fill="#475569">· 实例地址同步、扩缩容：K8s Service + Endpoints 足够，不用再注册一遍；</text>
  <text x="60" y="560" font-size="12" fill="#475569">· 配置中心：K8s 有 ConfigMap，但热更新要 Reloader / 重新挂载，灰度和监听推送还是 Nacos / Apollo 顺手；</text>
  <text x="60" y="582" font-size="12" fill="#475569">· 跨集群 / 混合云（服务在 K8s 外）：K8s Service 出不了集群，这时需要 Nacos / Consul 做统一注册；</text>
  <text x="60" y="604" font-size="12" fill="#475569">· 权重灰度、按 zone 路由：K8s 原生没有，需要 Istio VirtualService 或 Nacos 权重。</text>
  <text x="60" y="630" font-size="12" font-weight="bold" fill="#15803d">一句话：同集群内的东西交给 K8s；跨环境、需要流量治理时才引入注册中心。</text>
  <text x="60" y="654" font-size="12" fill="#b91c1c">注意：两套并存时必须以一边为唯一事实来源，否则两边的实例列表会互相打架。</text>
  <text x="60" y="678" font-size="12" fill="#64748b">分层口径：Service 是 L4（内核转发，连接级），Ingress 是 L7（七层路由，请求级），Ingress 不是 Service 的替代品而是它前面的一层。</text>

  <defs>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
