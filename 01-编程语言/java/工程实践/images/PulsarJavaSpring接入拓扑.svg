<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Spring Pulsar 的接入拓扑：生产走 PulsarTemplate，消费走监听容器，共用同一个 Client Bean</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">本篇 Spring 段未编译未运行；图中对象与属性仅按官方 API 名称绘制，接入前先对版本</text>

  <rect x="24" y="80" width="620" height="410" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="104" font-size="13" font-weight="bold" fill="#0f172a">Spring Boot 应用</text>

  <rect x="56" y="122" width="176" height="66" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
  <text x="144" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">Controller / Service</text>
  <text x="144" y="168" text-anchor="middle" font-size="11" fill="#334155">业务入口</text>

  <rect x="56" y="222" width="176" height="78" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="72" y="246" font-size="12.5" font-weight="bold" fill="#14532d">PulsarTemplate</text>
  <text x="72" y="268" font-size="11" fill="#166534">newMessage().send()</text>
  <text x="72" y="288" font-size="11" fill="#166534">内部复用 Producer 缓存</text>

  <line x1="144" y1="188" x2="144" y2="216" stroke="#16a34a" stroke-width="1.6"/>
  <polygon points="144,220 138,208 150,208" fill="#16a34a"/>

  <rect x="56" y="342" width="176" height="78" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="72" y="366" font-size="12.5" font-weight="bold" fill="#7c2d12">@PulsarListener</text>
  <text x="72" y="388" font-size="11" fill="#9a3412">ack-mode: manual</text>
  <text x="72" y="408" font-size="11" fill="#9a3412">方法内显式 acknowledge</text>

  <rect x="292" y="300" width="180" height="72" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="382" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">监听容器</text>
  <text x="382" y="344" text-anchor="middle" font-size="11" fill="#991b1b">concurrency=N</text>
  <text x="382" y="362" text-anchor="middle" font-size="11" fill="#991b1b">创建 N 个 Consumer</text>

  <line x1="248" y1="382" x2="284" y2="356" stroke="#ea580c" stroke-width="1.5"/>
  <polygon points="290,352 282,362 276,352" fill="#ea580c"/>

  <rect x="292" y="222" width="180" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="382" y="258" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">PulsarClient Bean</text>
  <text x="382" y="276" text-anchor="middle" font-size="10.5" fill="#1d4ed8">starter 自动配置的单例</text>

  <line x1="248" y1="252" x2="284" y2="250" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="292,250 280,244 280,256" fill="#16a34a"/>
  <line x1="382" y1="300" x2="382" y2="290" stroke="#dc2626" stroke-width="1.5"/>
  <polygon points="382,286 376,296 388,296" fill="#dc2626"/>

  <rect x="512" y="222" width="112" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="568" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">配置</text>
  <text x="568" y="268" text-anchor="middle" font-size="10.5" fill="#0369a1">service-url / ack-mode</text>
  <line x1="472" y1="252" x2="504" y2="252" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="5 4"/>
  <polygon points="512,252 500,246 500,258" fill="#0284c7"/>

  <rect x="760" y="140" width="216" height="180" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="868" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Pulsar Broker</text>
  <text x="868" y="192" text-anchor="middle" font-size="11.5" fill="#1d4ed8">6650 二进制协议</text>
  <text x="868" y="214" text-anchor="middle" font-size="11.5" fill="#1d4ed8">订阅游标与重投</text>
  <text x="868" y="236" text-anchor="middle" font-size="11.5" fill="#1d4ed8">死信主题转投</text>
  <text x="868" y="260" text-anchor="middle" font-size="11.5" fill="#64748b">standalone 单机</text>
  <text x="868" y="282" text-anchor="middle" font-size="11.5" fill="#64748b">E/W/Q = 1/1/1</text>

  <line x1="644" y1="240" x2="752" y2="220" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="760,216 748,216 751,228" fill="#2563eb"/>
  <text x="654" y="212" font-size="10.5" fill="#64748b">lookup + 收发</text>

  <rect x="24" y="504" width="952" height="28" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="40" y="523" font-size="11.5" fill="#78350f">要点：生产与消费共用 PulsarClient Bean；ack-mode 为 manual 时监听方法不 ack，消息会按 ackTimeout 反复重投。</text>
</svg>
