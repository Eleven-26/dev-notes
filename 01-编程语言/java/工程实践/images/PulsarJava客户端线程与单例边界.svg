<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Java 客户端的进程内结构：连接与线程归 PulsarClient，批次队列与预取队列各自独立</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">本机 pulsar-client 4.0.5（JDK 21）连 standalone；ioThreads=4，memoryLimit=64 MB</text>

  <rect x="24" y="78" width="650" height="400" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="102" font-size="13" font-weight="bold" fill="#0f172a">JVM 进程</text>

  <rect x="56" y="116" width="586" height="104" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="72" y="140" font-size="13" font-weight="bold" fill="#1e3a8a">PulsarClient（进程级单例）</text>
  <rect x="72" y="152" width="168" height="50" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="156" y="173" text-anchor="middle" font-size="11.5" fill="#1d4ed8">lookup 缓存</text>
  <text x="156" y="191" text-anchor="middle" font-size="11" fill="#64748b">topic 归哪个 Broker</text>
  <rect x="256" y="152" width="176" height="50" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="344" y="173" text-anchor="middle" font-size="11.5" fill="#1d4ed8">IO 线程 ioThreads=4</text>
  <text x="344" y="191" text-anchor="middle" font-size="11" fill="#64748b">收发帧与心跳</text>
  <rect x="448" y="152" width="176" height="50" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="536" y="173" text-anchor="middle" font-size="11.5" fill="#1d4ed8">连接池 / 缓冲上限</text>
  <text x="536" y="191" text-anchor="middle" font-size="11" fill="#64748b">memoryLimit=64 MB</text>

  <rect x="56" y="252" width="270" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="72" y="276" font-size="12.5" font-weight="bold" fill="#14532d">Producer&lt;String&gt;（按 topic 单例）</text>
  <text x="72" y="298" font-size="11.5" fill="#166534">批次队列 10ms / 500 条；在途上限 1000</text>
  <text x="72" y="318" font-size="11.5" fill="#166534">sendAsync 未 flush 时消息还在这里</text>

  <rect x="352" y="252" width="290" height="76" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="368" y="276" font-size="12.5" font-weight="bold" fill="#7c2d12">Consumer（按订阅新建）</text>
  <text x="368" y="298" font-size="11.5" fill="#9a3412">sub-java-ks 的 c1 与 c2；各带预取队列</text>
  <text x="368" y="318" font-size="11.5" fill="#9a3412">要提并发就多建实例，不共享一个对象</text>

  <rect x="56" y="362" width="270" height="70" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.3"/>
  <text x="72" y="386" font-size="12.5" font-weight="bold" fill="#1e293b">Reader（按重放任务）</text>
  <text x="72" y="408" font-size="11.5" fill="#334155">自管游标，不建订阅；用完即关</text>

  <line x1="190" y1="252" x2="190" y2="222" stroke="#16a34a" stroke-width="1.6"/>
  <polygon points="190,220 184,232 196,232" fill="#16a34a"/>
  <line x1="500" y1="252" x2="500" y2="222" stroke="#ea580c" stroke-width="1.6"/>
  <polygon points="500,220 494,232 506,232" fill="#ea580c"/>
  <line x1="190" y1="362" x2="190" y2="330" stroke="#475569" stroke-width="1.3"/>
  <polygon points="190,326 184,338 196,338" fill="#475569"/>

  <rect x="760" y="140" width="200" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="860" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Broker</text>
  <text x="860" y="192" text-anchor="middle" font-size="11.5" fill="#1d4ed8">standalone 6650</text>
  <text x="860" y="214" text-anchor="middle" font-size="11.5" fill="#1d4ed8">订阅游标在 Broker 侧</text>
  <text x="860" y="236" text-anchor="middle" font-size="11.5" fill="#1d4ed8">消息落 BookKeeper</text>
  <text x="860" y="258" text-anchor="middle" font-size="11.5" fill="#64748b">E/W/Q = 1/1/1</text>

  <line x1="642" y1="168" x2="752" y2="168" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="760,168 748,162 748,174" fill="#2563eb"/>
  <text x="652" y="160" font-size="11" fill="#64748b">一条连接复用</text>

  <rect x="24" y="494" width="952" height="46" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="40" y="522" font-size="12.5" fill="#78350f">要点：反复 build() 会让连接池与 IO 线程成倍增长；反复 newConsumer 只是多一份预取队列与订阅实例，二者代价不同。</text>
</svg>
