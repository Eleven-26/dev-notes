<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="530" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">优雅退出：先停入口 → 再消费者 → 最后生产者</text>
  <text x="40" y="58" font-size="13" fill="#64748b">客户端侧流程图（第九节）；顺序与「漏了会丢什么」全部取自本篇原表</text>

  <defs>
    <marker id="arRmqExit" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="40" y="80" width="280" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="52" y="103" font-size="12" font-weight="bold" fill="#0f172a">① 先停入口</text>
  <text x="52" y="124" font-size="11" fill="#334155">避免退出过程中还在产生新消息</text>

  <rect x="40" y="176" width="280" height="76" rx="8" fill="#f8fafc" stroke="#2563eb"/>
  <text x="52" y="199" font-size="12" font-weight="bold" fill="#0f172a">② consumer.shutdown()</text>
  <text x="52" y="220" font-size="11" fill="#334155">停止长轮询与消费线程池</text>
  <text x="52" y="241" font-size="11" fill="#334155">并让在途消费提交位点</text>

  <rect x="40" y="286" width="280" height="76" rx="8" fill="#f8fafc" stroke="#2563eb"/>
  <text x="52" y="309" font-size="12" font-weight="bold" fill="#0f172a">③ producer.shutdown()</text>
  <text x="52" y="330" font-size="11" fill="#334155">flush 缓冲、关 TCP 连接</text>
  <text x="52" y="351" font-size="11" fill="#334155">停心跳线程</text>

  <g stroke="#334155" stroke-width="1.6">
    <line x1="180" y1="144" x2="180" y2="176" marker-end="url(#arRmqExit)"/>
    <line x1="180" y1="252" x2="180" y2="286" marker-end="url(#arRmqExit)"/>
  </g>

  <rect x="380" y="176" width="300" height="76" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="392" y="199" font-size="12" font-weight="bold" fill="#7f1d1d">消费者不 shutdown</text>
  <text x="392" y="220" font-size="11" fill="#7f1d1d">组内成员不退出，重平衡要等会话超时</text>
  <text x="392" y="241" font-size="11" fill="#7f1d1d">位点没提交 → 重启后重复消费</text>

  <rect x="380" y="286" width="300" height="76" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="392" y="309" font-size="12" font-weight="bold" fill="#7f1d1d">生产者不 shutdown</text>
  <text x="392" y="330" font-size="11" fill="#7f1d1d">心跳线程与连接泄漏</text>
  <text x="392" y="351" font-size="11" fill="#7f1d1d">缓冲不 flush（顺序表「最后」那一步）</text>

  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="320" y1="214" x2="380" y2="214" marker-end="url(#arRmqExit)"/>
    <line x1="320" y1="324" x2="380" y2="324" marker-end="url(#arRmqExit)"/>
  </g>

  <rect x="700" y="176" width="260" height="186" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="712" y="199" font-size="12" font-weight="bold" fill="#0f172a">对照：源码片段</text>
  <text x="712" y="222" font-size="11" fill="#334155">consumer.shutdown();</text>
  <text x="712" y="243" font-size="11" fill="#64748b">// 停长轮询与消费线程池、提交位点</text>
  <text x="712" y="266" font-size="11" fill="#334155">producer.shutdown();</text>
  <text x="712" y="287" font-size="11" fill="#64748b">// 停心跳线程、关 TCP 连接</text>
  <text x="712" y="314" font-size="11" fill="#b45309">退出顺序 = 反初始化顺序</text>
  <text x="712" y="335" font-size="11" fill="#b45309">本篇第九节标注：该片段仅整理</text>
  <text x="712" y="356" font-size="11" fill="#b45309">自官方写法，未编译验证</text>

  <rect x="40" y="396" width="920" height="88" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="52" y="419" font-size="12" font-weight="bold" fill="#7f1d1d">⚠️ 客户端 JVM 不退出（本机实测脚本会一直挂着）</text>
  <text x="52" y="441" font-size="11" fill="#7f1d1d">RocketMQ 客户端会留下非守护线程，shutdown() 之后 JVM 仍不退出；</text>
  <text x="52" y="462" font-size="11" fill="#7f1d1d">写一次性工具（命令行跑完就结束）时末尾加 System.exit(0)。</text>

  <text x="40" y="510" font-size="11" fill="#64748b">小结：两句 shutdown 的顺序不能颠倒——入口先关才不会边退边产，消费者先关才能把位点提交出去，生产者最后关才来得及 flush。</text>
</svg>
