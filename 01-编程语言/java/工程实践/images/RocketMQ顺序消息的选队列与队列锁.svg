<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">顺序消息：同一个 orderId 怎么选队列、失败怎么挂起</text>
  <text x="40" y="58" font-size="13" fill="#64748b">流程图；写法出自 7.3，读数是本机实测（4 队列，同 orderId 连发 4 条），失败分支的约束见 7.3 与第四节</text>

  <defs>
    <marker id="arR2" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arR2g" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arR2o" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect x="60" y="86" width="380" height="56" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="72" y="106" font-size="10.5" fill="#0f172a">orderId = ORDER_SEQ_9001</text>
  <text x="72" y="124" font-size="10" fill="#64748b">同时作为 Message 的 keys，消费端 getKeys() 读得回</text>

  <rect x="60" y="166" width="380" height="66" rx="6" fill="#f8fafc" stroke="#2563eb"/>
  <text x="72" y="186" font-size="10.5" fill="#0f172a">MessageQueueSelector selector = (mqs, m, arg) -&gt;</text>
  <text x="72" y="204" font-size="10" fill="#334155">mqs.get(Math.abs(arg.hashCode()) % mqs.size())</text>
  <text x="72" y="222" font-size="10" fill="#64748b">进程级无状态策略对象，配一次就复用</text>

  <rect x="60" y="258" width="380" height="56" rx="6" fill="#f8fafc" stroke="#2563eb"/>
  <text x="72" y="278" font-size="10.5" fill="#0f172a">producer.send(msg, selector, orderId)</text>
  <text x="72" y="296" font-size="10" fill="#7c2d12">⚠️ 必须用带 selector 的这个重载</text>

  <rect x="60" y="338" width="380" height="66" rx="6" fill="#f8fafc" stroke="#2563eb"/>
  <text x="72" y="358" font-size="10.5" fill="#0f172a">同一 hashCode 恒定命中同一队列</text>
  <text x="72" y="376" font-size="10" fill="#334155">四次都选中 queueId=1，offset 依次 0、1、2、3</text>
  <text x="72" y="394" font-size="10" fill="#64748b">想有序就靠这一步把实体的事件聚到一个队列</text>

  <rect x="60" y="430" width="380" height="66" rx="6" fill="#f8fafc" stroke="#16a34a"/>
  <text x="72" y="450" font-size="10.5" fill="#0f172a">registerMessageListener(MessageListenerOrderly)</text>
  <text x="72" y="468" font-size="10" fill="#334155">一个队列同一时刻只分给一个消费线程</text>
  <text x="72" y="486" font-size="10" fill="#7c2d12">做成共享的全局单例 Consumer，队列锁被跨订阅共享</text>

  <rect x="60" y="530" width="380" height="60" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="72" y="550" font-size="10.5" font-weight="bold" fill="#14532d">成功：return ConsumeOrderlyStatus.SUCCESS</text>
  <text x="72" y="568" font-size="10" fill="#14532d">这批处理完，继续拉同一队列的下一批</text>

  <rect x="520" y="530" width="400" height="60" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="532" y="550" font-size="10.5" font-weight="bold" fill="#7c2d12">失败：SUSPEND_CURRENT_QUEUE_A_MOMENT</text>
  <text x="532" y="568" font-size="10" fill="#7c2d12">挂起队列不跳号，默认无限重试（映射成 Integer.MAX_VALUE）</text>

  <rect x="520" y="86" width="400" height="132" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="532" y="106" font-size="10.5" font-weight="bold" fill="#0f172a">本机实测</text>
  <text x="532" y="128" font-size="10" fill="#334155">ORDER seq=1 queueId=1 offset=0 sameQueue=true</text>
  <text x="532" y="148" font-size="10" fill="#334155">ORDER seq=2 queueId=1 offset=1 sameQueue=true</text>
  <text x="532" y="168" font-size="10" fill="#334155">ORDER seq=3 queueId=1 offset=2 sameQueue=true</text>
  <text x="532" y="188" font-size="10" fill="#334155">ORDER seq=4 queueId=1 offset=3 sameQueue=true</text>
  <text x="532" y="208" font-size="10" fill="#64748b">4 队列的 TopicOrder，同 orderId 连发 4 条</text>

  <rect x="520" y="240" width="400" height="110" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="532" y="260" font-size="10.5" font-weight="bold" fill="#92400e">对照：不带 selector 的默认选队列策略</text>
  <text x="532" y="282" font-size="10" fill="#92400e">SYNC seq=1 queueId=1、seq=2 queueId=2、</text>
  <text x="532" y="300" font-size="10" fill="#92400e">seq=3 queueId=3 —— 三条被轮询打散</text>
  <text x="532" y="322" font-size="10" fill="#92400e">普通消息因此没有顺序保证（7.1）</text>

  <rect x="520" y="372" width="400" height="124" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="532" y="392" font-size="10.5" font-weight="bold" fill="#7f1d1d">脏数据怎么办</text>
  <text x="532" y="414" font-size="10" fill="#7f1d1d">无限重试会一直占着这个队列，</text>
  <text x="532" y="432" font-size="10" fill="#7f1d1d">必须在有限次后落库告警，</text>
  <text x="532" y="450" font-size="10" fill="#7f1d1d">否则一条脏数据卡死整个队列；</text>
  <text x="532" y="472" font-size="10" fill="#7f1d1d">并发消费才有 %RETRY% / %DLQ% 那条路。</text>

  <line x1="250" y1="142" x2="250" y2="166" stroke="#334155" stroke-width="1.5" marker-end="url(#arR2)"/>
  <line x1="250" y1="232" x2="250" y2="258" stroke="#334155" stroke-width="1.5" marker-end="url(#arR2)"/>
  <line x1="250" y1="314" x2="250" y2="338" stroke="#334155" stroke-width="1.5" marker-end="url(#arR2)"/>
  <line x1="250" y1="404" x2="250" y2="430" stroke="#334155" stroke-width="1.5" marker-end="url(#arR2)"/>
  <line x1="250" y1="496" x2="250" y2="530" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arR2g)"/>
  <line x1="250" y1="496" x2="700" y2="530" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arR2o)"/>

  <text x="40" y="618" font-size="11" fill="#64748b">小结：顺序 = 生产端按 key 固定队列 + 消费端队列锁两者一起成立；换枚举不通用，并发回调是 ConsumeConcurrentlyStatus，顺序回调是 ConsumeOrderlyStatus。</text>
  <text x="40" y="642" font-size="11" fill="#64748b">consumeThreadMin / Max 本机 5.3.1 实测默认都是 20，调大不会提吞吐 —— 真正的上限是队列数。</text>
</svg>
