<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">Java 侧三条实序：谁先装配、位点配置什么时候才生效</text>
  <text x="40" y="58" font-size="13" fill="#64748b">应用进程内的初始化顺序流程图（第五节）；判据是「谁在初始化时捕获了全局单例」</text>

  <defs>
    <marker id="arKinit" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="40" y="84" width="290" height="76" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="52" y="106" font-size="12" font-weight="bold" fill="#0f172a">① ProducerFactory → KafkaTemplate</text>
  <text x="52" y="126" font-size="11" fill="#334155">由容器按依赖顺序装配为单例 Bean</text>
  <text x="52" y="146" font-size="11" fill="#334155">别每次 new DefaultProducerFactory</text>

  <rect x="40" y="196" width="290" height="76" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="52" y="218" font-size="12" font-weight="bold" fill="#7f1d1d">写错：业务类自己 new KafkaTemplate(…)</text>
  <text x="52" y="238" font-size="11" fill="#7f1d1d">绕开容器的单例与观测 / 事务基础设施</text>
  <text x="52" y="258" font-size="11" fill="#7f1d1d">连接池与 I/O 线程随 QPS 线性膨胀（第四节）</text>

  <rect x="370" y="84" width="290" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="382" y="106" font-size="12" font-weight="bold" fill="#0f172a">② @KafkaListener 容器晚起步</text>
  <text x="382" y="126" font-size="11" fill="#334155">监听容器在启动时会 subscribe 并触发重平衡</text>
  <text x="382" y="146" font-size="11" fill="#334155">此时生产侧的基础设施应已就绪</text>

  <rect x="370" y="196" width="290" height="76" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="382" y="218" font-size="12" font-weight="bold" fill="#7c2d12">③ 位点配置只在一种情况下生效</text>
  <text x="382" y="238" font-size="11" fill="#7c2d12">auto.offset.reset=earliest 只作用于</text>
  <text x="382" y="258" font-size="11" fill="#7c2d12">消费组「没有已提交位点」时</text>

  <rect x="700" y="84" width="260" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="712" y="106" font-size="12" font-weight="bold" fill="#0f172a">后果分支（两条）</text>
  <text x="712" y="126" font-size="11" fill="#334155">无位点 → 按 earliest 从头开始</text>
  <text x="712" y="146" font-size="11" fill="#b45309">已有位点 → 从位点继续，改它无效</text>

  <rect x="700" y="196" width="260" height="76" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="712" y="218" font-size="12" font-weight="bold" fill="#0f172a">同一条判据（⭐）</text>
  <text x="712" y="238" font-size="11" fill="#334155">在初始化时取一次全局实例的组件</text>
  <text x="712" y="258" font-size="11" fill="#334155">必须排在被捕获者之后初始化</text>

  <g stroke="#334155" stroke-width="1.6">
    <line x1="185" y1="160" x2="185" y2="196" stroke-dasharray="5 4" marker-end="url(#arKinit)"/>
    <line x1="330" y1="122" x2="370" y2="122" marker-end="url(#arKinit)"/>
    <line x1="515" y1="160" x2="515" y2="196" marker-end="url(#arKinit)"/>
    <line x1="660" y1="122" x2="700" y2="122" marker-end="url(#arKinit)"/>
    <line x1="830" y1="160" x2="830" y2="196" stroke-dasharray="5 4" marker-end="url(#arKinit)"/>
  </g>

  <rect x="40" y="304" width="920" height="72" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="52" y="326" font-size="12" font-weight="bold" fill="#7f1d1d">⭐ 判据的经典例子在链路追踪栈（本节原话）</text>
  <text x="52" y="347" font-size="11" fill="#7f1d1d">instrumentation 在初始化时取一次全局实例——若它在全局 Tracer 注册之前完成初始化，span 就走 noop provider，永远不上报且不报错。</text>
  <text x="52" y="366" font-size="11" fill="#7f1d1d">详见 接入Jaeger.md 第五节（同样的特征也在日志器、配置、指标注册表上）。</text>

  <text x="40" y="404" font-size="11" fill="#64748b">小结：三条实序里没有一条会报错——装配绕开容器、订阅早于基础设施、位点配置改了不生效，症状都要靠读数才看得见。</text>
</svg>
