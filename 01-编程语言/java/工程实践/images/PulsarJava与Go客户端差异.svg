<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">同一个 Pulsar 动作，Java 与 Go 客户端差在哪</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">两侧都对本机 pulsar 4.0.5 standalone 实测；差异来自客户端实现，不是 Broker 行为</text>

  <rect x="24" y="82" width="250" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="149" y="109" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">动作</text>
  <rect x="286" y="82" width="330" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="451" y="109" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">Java pulsar-client 4.0.5</text>
  <rect x="628" y="82" width="348" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="802" y="109" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">Go pulsar-client-go v0.21.0</text>

  <rect x="24" y="136" width="250" height="58" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="40" y="160" font-size="11.5" font-weight="bold" fill="#334155">非分区 topic 的 MessageId</text>
  <text x="40" y="180" font-size="11" fill="#64748b">发送 3 条后打印</text>
  <rect x="286" y="136" width="330" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="451" y="172" text-anchor="middle" font-size="12.5" fill="#1e3a8a">129:0:-1（分区位 -1）</text>
  <rect x="628" y="136" width="348" height="58" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="802" y="172" text-anchor="middle" font-size="12.5" fill="#14532d">103:0:0:0（分区位补 0）</text>

  <rect x="24" y="204" width="250" height="58" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="40" y="228" font-size="11.5" font-weight="bold" fill="#334155">Seek 回拨游标</text>
  <text x="40" y="248" font-size="11" fill="#64748b">非分区 topic 上</text>
  <rect x="286" y="204" width="330" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="451" y="240" text-anchor="middle" font-size="12.5" fill="#1e3a8a">SEEK ok → 129:0:-1</text>
  <rect x="628" y="204" width="348" height="58" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="802" y="233" text-anchor="middle" font-size="11.5" fill="#991b1b">invalid partition index -1</text>
  <text x="802" y="251" text-anchor="middle" font-size="11" fill="#991b1b">expected a partition between [0-0]</text>

  <rect x="24" y="272" width="250" height="58" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="40" y="296" font-size="11.5" font-weight="bold" fill="#334155">maxRedeliverCount=3 后</text>
  <text x="40" y="316" font-size="11" fill="#64748b">一直 Nack 到进死信</text>
  <rect x="286" y="272" width="330" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="451" y="308" text-anchor="middle" font-size="12.5" fill="#1e3a8a">投递 4 次：0 / 1 / 2 / 3</text>
  <rect x="628" y="272" width="348" height="58" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="802" y="308" text-anchor="middle" font-size="12.5" fill="#14532d">投递 3 次：0 / 1 / 2</text>

  <rect x="24" y="340" width="250" height="58" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="40" y="364" font-size="11.5" font-weight="bold" fill="#334155">给消息带业务上下文</text>
  <text x="40" y="384" font-size="11" fill="#64748b">trace_id 等</text>
  <rect x="286" y="340" width="330" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="451" y="376" text-anchor="middle" font-size="12.5" fill="#1e3a8a">property(k, v) / getProperties()</text>
  <rect x="628" y="340" width="348" height="58" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="802" y="376" text-anchor="middle" font-size="12.5" fill="#14532d">Properties map / msg.Properties()</text>

  <rect x="24" y="414" width="952" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="40" y="439" font-size="12" fill="#78350f">要点：日志对不上时先查本表；「Seek 用不了」与「死信少一次」都可能是客户端差异，不是 Broker 故障。</text>
</svg>
