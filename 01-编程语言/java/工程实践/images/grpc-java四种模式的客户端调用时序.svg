<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="820" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">四种通信模式在 Java 客户端的调用时序</text>
  <text x="40" y="58" font-size="13" fill="#64748b">调用时序图；方法名取自第三节，读数出自 3.5 实测（java=17.0.20.1、grpc-java=1.60.0，run 1）</text>

  <defs>
    <marker id="arG3" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arG3g" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="60" y="84" width="180" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="150" y="106" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">客户端业务线程</text>
  <rect x="400" y="84" width="200" height="34" rx="6" fill="#f8fafc" stroke="#64748b"/>
  <text x="500" y="106" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">ClientCalls + Channel</text>
  <rect x="760" y="84" width="180" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="850" y="106" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">服务端 handler</text>

  <line x1="150" y1="118" x2="150" y2="700" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="500" y1="118" x2="500" y2="700" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="850" y1="118" x2="850" y2="700" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5"/>

  <text x="40" y="150" font-size="12" font-weight="bold" fill="#2563eb">一、一元：两个 blocking* 才是「channel + method + options + request」四件套</text>
  <line x1="150" y1="172" x2="496" y2="172" stroke="#334155" stroke-width="1.6" marker-end="url(#arG3)"/>
  <text x="323" y="164" font-size="10.5" fill="#0f172a" text-anchor="middle">blockingUnaryCall(channel, UNARY, DEFAULT, req)</text>
  <line x1="500" y1="198" x2="846" y2="198" stroke="#334155" stroke-width="1.6" marker-end="url(#arG3)"/>
  <text x="673" y="190" font-size="10.5" fill="#0f172a" text-anchor="middle">:path demo.Echo/Unary 上的 JSON 文本</text>
  <line x1="850" y1="224" x2="504" y2="224" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arG3g)"/>
  <text x="677" y="216" font-size="10.5" fill="#15803d" text-anchor="middle">onNext 一条后 onCompleted()</text>
  <line x1="500" y1="250" x2="154" y2="250" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arG3g)"/>
  <text x="327" y="242" font-size="10.5" fill="#15803d" text-anchor="middle">resp=echo:{...} cost=874ms（首调）</text>

  <text x="40" y="292" font-size="12" font-weight="bold" fill="#2563eb">二、服务端流：返回 Iterator，hasNext() 阻塞到收齐，拿到 EOF 不抛异常</text>
  <line x1="150" y1="314" x2="496" y2="314" stroke="#334155" stroke-width="1.6" marker-end="url(#arG3)"/>
  <text x="323" y="306" font-size="10.5" fill="#0f172a" text-anchor="middle">blockingServerStreamingCall(..., {"n":5})</text>
  <line x1="500" y1="340" x2="846" y2="340" stroke="#334155" stroke-width="1.6" marker-end="url(#arG3)"/>
  <text x="673" y="332" font-size="10.5" fill="#0f172a" text-anchor="middle">for 循环发 5 条，每条之间 sleep(15)</text>
  <line x1="850" y1="366" x2="504" y2="366" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arG3g)"/>
  <text x="677" y="358" font-size="10.5" fill="#15803d" text-anchor="middle">srv-1 … srv-5 逐条 onNext</text>
  <line x1="500" y1="392" x2="154" y2="392" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arG3g)"/>
  <text x="327" y="384" font-size="10.5" fill="#15803d" text-anchor="middle">recv=5 firstByte=60ms total=108ms</text>

  <text x="40" y="434" font-size="12" font-weight="bold" fill="#ea580c">三、客户端流：第一个参数是 ClientCall，不是四件套</text>
  <line x1="150" y1="456" x2="496" y2="456" stroke="#334155" stroke-width="1.6" marker-end="url(#arG3)"/>
  <text x="323" y="448" font-size="10.5" fill="#0f172a" text-anchor="middle">asyncClientStreamingCall(newCall(CLIENT_STREAM))</text>
  <line x1="500" y1="482" x2="846" y2="482" stroke="#334155" stroke-width="1.6" marker-end="url(#arG3)"/>
  <text x="673" y="474" font-size="10.5" fill="#0f172a" text-anchor="middle">reqObs.onNext ×5，再 onCompleted()</text>
  <line x1="850" y1="508" x2="504" y2="508" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arG3g)"/>
  <text x="677" y="500" font-size="10.5" fill="#15803d" text-anchor="middle">onCompleted 里回一条汇总</text>
  <line x1="500" y1="534" x2="154" y2="534" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arG3g)"/>
  <text x="327" y="526" font-size="10.5" fill="#15803d" text-anchor="middle">sent=5 resp=server got 5 msgs</text>

  <text x="40" y="576" font-size="12" font-weight="bold" fill="#ea580c">四、双向流：invoke 签名与客户端流一致，只是写成匿名类</text>
  <line x1="150" y1="598" x2="496" y2="598" stroke="#334155" stroke-width="1.6" marker-end="url(#arG3)"/>
  <text x="323" y="590" font-size="10.5" fill="#0f172a" text-anchor="middle">asyncBidiStreamingCall(newCall(BIDI))</text>
  <line x1="500" y1="624" x2="846" y2="624" stroke="#334155" stroke-width="1.6" marker-end="url(#arG3)"/>
  <text x="673" y="616" font-size="10.5" fill="#0f172a" text-anchor="middle">bidiReq.onNext ×3（m1 m2 m3）</text>
  <line x1="850" y1="650" x2="504" y2="650" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arG3g)"/>
  <text x="677" y="642" font-size="10.5" fill="#15803d" text-anchor="middle">每条即时回 ack:m1 … ack:m3</text>
  <line x1="500" y1="676" x2="154" y2="676" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arG3g)"/>
  <text x="327" y="668" font-size="10.5" fill="#15803d" text-anchor="middle">sent=3 recv=3 firstAck=ack:m1</text>

  <text x="40" y="724" font-size="10" fill="#64748b">回调往里塞结果（sum[] / acks），结束时机只在 onCompleted / onError，所以配 CountDownLatch，本实验 await 给 10 秒上限</text>

  <text x="40" y="760" font-size="11" fill="#64748b">小结：服务端统计 streams=3 msgsIn=8 msgsOut=9 unaryCalls=1，Go 与 Java 逐字节一致 —— 收 8 = 双向 3 + 客户端流 5，发 9 = 服务端流 5 + 客户端流 1 + 双向 3。</text>
  <text x="40" y="786" font-size="11" fill="#64748b">一元首调 827~1433ms 是 JIT 预热 + Netty 建连的一次性成本，与稳态服务端流的 firstByte 44~60ms 不能混用（见 5.3 与第六节 ⑥）。</text>
</svg>
