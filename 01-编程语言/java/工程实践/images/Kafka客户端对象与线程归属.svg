<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">Kafka 客户端对象的进程级与请求级归属</text>
  <text x="40" y="58" font-size="13" fill="#64748b">架构图；对象与结论出自第四节表、第三节「构造时就连 Broker」与第六节的两种持有写法（kafka-clients 3.9.0）</text>

  <rect x="40" y="76" width="460" height="330" rx="10" fill="#f8fafc" stroke="#2563eb"/>
  <text x="60" y="98" font-size="13" font-weight="bold" fill="#1e3a8a">进程级：整个应用建一次</text>

  <rect x="60" y="108" width="420" height="76" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="72" y="128" font-size="10.5" font-weight="bold" fill="#0f172a">KafkaProducer ✅ 线程安全</text>
  <text x="72" y="146" font-size="10" fill="#334155">内部维护连接池与后台 I/O 线程，每次 new 都新建一套</text>
  <text x="72" y="162" font-size="10" fill="#334155">构造时就会连 Broker 拉元数据，不是 Go 那种惰性连接</text>
  <text x="72" y="178" font-size="10" fill="#7c2d12">Broker 不可达时，new 这一步就卡住</text>

  <rect x="60" y="196" width="420" height="56" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="72" y="216" font-size="10.5" font-weight="bold" fill="#0f172a">KafkaTemplate（Spring 单例 Bean）✅</text>
  <text x="72" y="234" font-size="10" fill="#334155">内部持有一个 ProducerFactory，由容器按依赖顺序装配</text>

  <rect x="60" y="264" width="420" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="72" y="284" font-size="10.5" fill="#0f172a">两种持有写法</text>
  <text x="72" y="302" font-size="10" fill="#334155">静态 final PRODUCER（main / 静态持有）或容器注入</text>

  <rect x="60" y="332" width="420" height="56" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="72" y="352" font-size="10.5" fill="#7f1d1d">别自己 new DefaultProducerFactory / new KafkaTemplate</text>
  <text x="72" y="370" font-size="10" fill="#7f1d1d">那等于绕开容器的单例与观测、事务基础设施</text>

  <rect x="520" y="76" width="440" height="330" rx="10" fill="#f8fafc" stroke="#ea580c"/>
  <text x="540" y="98" font-size="13" font-weight="bold" fill="#7c2d12">非单例与请求级：一个订阅 / 一次调用一份</text>

  <rect x="540" y="108" width="400" height="96" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="552" y="128" font-size="10.5" font-weight="bold" fill="#7c2d12">KafkaConsumer ❌ 非单例，且线程不安全</text>
  <text x="552" y="146" font-size="10" fill="#7c2d12">绑定「消费组 + 订阅」，每个消费线程各持一个</text>
  <text x="552" y="162" font-size="10" fill="#7c2d12">由自己的 poll 循环驱动</text>
  <text x="552" y="178" font-size="10" fill="#7c2d12">commitSync / wakeup / close 都作用于单个实例</text>
  <text x="552" y="194" font-size="10" fill="#7f1d1d">跨线程使用会抛 ConcurrentModificationException</text>

  <rect x="540" y="216" width="400" height="56" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="552" y="236" font-size="10.5" fill="#14532d">ProducerRecord / ConsumerRecord ❌ 请求级</text>
  <text x="552" y="254" font-size="10" fill="#14532d">每条独立，跨请求复用会串内容</text>

  <rect x="540" y="284" width="400" height="56" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="552" y="304" font-size="10.5" fill="#14532d">Acknowledgment（手动 ack）❌ 请求级</text>
  <text x="552" y="322" font-size="10" fill="#14532d">绑定本次 poll 的那批记录</text>

  <text x="540" y="374" font-size="10" fill="#64748b">上下文要随消息走（headers），不能随对象走</text>
  <text x="540" y="392" font-size="10" fill="#64748b">别把请求级数据存进单例 Producer / Template 的字段</text>

  <rect x="40" y="424" width="920" height="86" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="56" y="448" font-size="11" fill="#7f1d1d">生产者每次请求 new → 连接池与 I/O 线程随 QPS 线性膨胀；消费者做成全局单例或跨线程共享 → 并发模型直接失效。</text>
  <text x="56" y="472" font-size="11" fill="#7f1d1d">一句话：生产者单例（线程安全、省连接），消费者非单例（一个订阅 / 线程一份独立状态）。</text>
  <text x="56" y="494" font-size="11" fill="#7f1d1d">判据只看一件事：对象内部有没有长活的资源（连接池、后台 I/O 线程）—— 有就是进程级，没有且绑定一次操作的才是请求级。</text>

  <text x="40" y="536" font-size="11" fill="#64748b">写一次性工具时用 try-with-resources，随用随关；生产代码在进程启动阶段建一次并复用，不要放在请求处理里。</text>
</svg>
