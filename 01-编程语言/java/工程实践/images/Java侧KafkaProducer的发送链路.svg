<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Java 进程内：KafkaProducer 的发送链路</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">数据流转图；实测：ORDER_2001 三条全落 partition=0，ORDER_2002 三条全落 partition=1（offset 0,1,2）</text>

  <defs>
    <marker id="k1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="k2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="k3" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="330" y="88" width="340" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="500" y="108" font-size="12" fill="#1e3a8a" text-anchor="middle">send(ProducerRecord)</text>
  <text x="500" y="127" font-size="12" fill="#1e3a8a" text-anchor="middle">topic + key=ORDER_2001 + value</text>

  <rect x="330" y="160" width="340" height="50" rx="6" fill="#f8fafc" stroke="#64748b"/>
  <text x="500" y="180" font-size="12" fill="#0f172a" text-anchor="middle">序列化（key / value Serializer）</text>
  <text x="500" y="199" font-size="12" fill="#64748b" text-anchor="middle">headers 注入点：Inject 业务头</text>

  <rect x="330" y="232" width="340" height="50" rx="6" fill="#f8fafc" stroke="#64748b"/>
  <text x="500" y="252" font-size="12" fill="#0f172a" text-anchor="middle">分区路由（partitioner）</text>
  <text x="500" y="271" font-size="12" fill="#64748b" text-anchor="middle">同 key 同分区 ⇒ 分区内有序</text>

  <rect x="330" y="304" width="340" height="50" rx="6" fill="#f8fafc" stroke="#64748b"/>
  <text x="500" y="324" font-size="12" fill="#0f172a" text-anchor="middle">RecordAccumulator 按分区攒批</text>
  <text x="500" y="343" font-size="12" fill="#64748b" text-anchor="middle">send() 是异步的，不阻塞主线程</text>

  <rect x="330" y="376" width="340" height="50" rx="6" fill="#f8fafc" stroke="#64748b"/>
  <text x="500" y="396" font-size="12" fill="#0f172a" text-anchor="middle">后台 I/O 线程（Sender）发请求</text>
  <text x="500" y="415" font-size="12" fill="#64748b" text-anchor="middle">acks=all · idempotence · retries</text>

  <g font-size="12">
    <rect x="220" y="452" width="560" height="56" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="500" y="474" fill="#14532d" text-anchor="middle">Broker 确认 → 回调 (metadata, ex)</text>
    <text x="500" y="494" fill="#14532d" text-anchor="middle">实测 PRODUCE partition=0 offset=0 key=ORDER_2001</text>
  </g>

  <rect x="820" y="292" width="150" height="74" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="895" y="315" font-size="12" fill="#854d0e" text-anchor="middle">flush()</text>
  <text x="895" y="336" font-size="12" fill="#854d0e" text-anchor="middle">退出前把累加</text>
  <text x="895" y="356" font-size="12" fill="#854d0e" text-anchor="middle">器里的批发完</text>

  <rect x="30" y="292" width="150" height="74" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="105" y="315" font-size="12" fill="#7f1d1d" text-anchor="middle">不注册回调</text>
  <text x="105" y="336" font-size="12" fill="#7f1d1d" text-anchor="middle">也不 flush：</text>
  <text x="105" y="356" font-size="12" fill="#7f1d1d" text-anchor="middle">退出即丢未发的批</text>

  <g stroke="#334155" stroke-width="1.6">
    <line x1="500" y1="138" x2="500" y2="160" marker-end="url(#k1)"/>
    <line x1="500" y1="210" x2="500" y2="232" marker-end="url(#k1)"/>
    <line x1="500" y1="282" x2="500" y2="304" marker-end="url(#k1)"/>
    <line x1="500" y1="354" x2="500" y2="376" marker-end="url(#k1)"/>
  </g>
  <g stroke="#16a34a" stroke-width="1.7">
    <line x1="440" y1="426" x2="440" y2="452" marker-end="url(#k2)"/>
  </g>
  <line x1="560" y1="452" x2="560" y2="426" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#k3)"/>
  <text x="590" y="444" font-size="11" fill="#b45309" text-anchor="start">回调</text>
  <line x1="670" y1="328" x2="820" y2="328" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#k3)"/>
  <line x1="330" y1="329" x2="180" y2="329" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#k1)"/>

  <text x="500" y="550" font-size="12" fill="#64748b" text-anchor="middle">构造 KafkaProducer 时就连 Broker 拉元数据 —— 与 Go 的惰性连接不同，Broker 不可达在 new 这一步就卡住（第三节）</text>
  <text x="500" y="576" font-size="12" fill="#334155" text-anchor="middle">enable.idempotence=true 会把 acks 拉成 all，并强制 retries>0、max.in.flight≤5；flush() 只保证「已进累加器的都发出去」，不是事务提交</text>
</svg>
