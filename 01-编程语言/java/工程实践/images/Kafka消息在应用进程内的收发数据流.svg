<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">一条消息在应用进程内的收发路径与位点提交</text>
  <text x="40" y="58" font-size="13" fill="#64748b">数据流转图；写法出自 7.1、7.2 与第八节，读数出自 10.1 实测（Topic java-lab，3 分区 3 副本，6 条消息）</text>

  <defs>
    <marker id="arK2" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arK2g" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="40" y="94" font-size="12" font-weight="bold" fill="#2563eb">生产侧：send 是异步的，不注册回调也不 flush，进程退出时未发出的批会直接丢</text>

  <rect x="40" y="106" width="170" height="86" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="50" y="124" font-size="9.5" fill="#0f172a">业务线程</text>
  <text x="50" y="140" font-size="9.5" fill="#334155">send(record, 回调)</text>
  <text x="50" y="156" font-size="9.5" fill="#334155">key=ORDER_2001</text>
  <text x="50" y="172" font-size="9.5" fill="#64748b">同 key 同分区</text>
  <text x="50" y="186" font-size="9.5" fill="#64748b">该实体事件有序</text>

  <rect x="270" y="106" width="170" height="86" rx="6" fill="#f8fafc" stroke="#2563eb"/>
  <text x="280" y="124" font-size="9.5" fill="#0f172a">累加器</text>
  <text x="280" y="140" font-size="9.5" fill="#334155">acks=all</text>
  <text x="280" y="156" font-size="9.5" fill="#334155">enable.idempotence</text>
  <text x="280" y="172" font-size="9.5" fill="#334155">=true 自动把 acks</text>
  <text x="280" y="186" font-size="9.5" fill="#64748b">拉成 all、retries&gt;0</text>

  <rect x="500" y="106" width="170" height="86" rx="6" fill="#f8fafc" stroke="#2563eb"/>
  <text x="510" y="124" font-size="9.5" fill="#0f172a">后台 I/O 线程</text>
  <text x="510" y="140" font-size="9.5" fill="#334155">flush() 只保证</text>
  <text x="510" y="156" font-size="9.5" fill="#334155">已进入累加器的</text>
  <text x="510" y="172" font-size="9.5" fill="#334155">数据都发出去</text>
  <text x="510" y="186" font-size="9.5" fill="#7c2d12">不是事务提交</text>

  <rect x="730" y="106" width="170" height="86" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="740" y="124" font-size="9.5" fill="#14532d">回调（metadata, ex）</text>
  <text x="740" y="140" font-size="9.5" fill="#14532d">ex != null 打失败</text>
  <text x="740" y="156" font-size="9.5" fill="#14532d">否则打印分区与位点</text>
  <text x="740" y="172" font-size="9.5" fill="#15803d">PRODUCE partition=0</text>
  <text x="740" y="186" font-size="9.5" fill="#15803d">offset=0 key=ORDER_2001</text>

  <line x1="210" y1="149" x2="266" y2="149" stroke="#334155" stroke-width="1.5" marker-end="url(#arK2)"/>
  <line x1="440" y1="149" x2="496" y2="149" stroke="#334155" stroke-width="1.5" marker-end="url(#arK2)"/>
  <line x1="670" y1="149" x2="726" y2="149" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arK2g)"/>

  <text x="40" y="234" font-size="12" font-weight="bold" fill="#2563eb">消费侧：先逐条处理（含幂等校验），整批成功后才手动提交位点</text>

  <rect x="40" y="246" width="200" height="76" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="52" y="266" font-size="10" fill="#0f172a">consumer.poll(500ms)</text>
  <text x="52" y="284" font-size="10" fill="#334155">每线程一个 consumer</text>
  <text x="52" y="300" font-size="10" fill="#334155">subscribe(order-events)</text>
  <text x="52" y="316" font-size="10" fill="#64748b">组内自动分配分区</text>

  <rect x="300" y="246" width="200" height="76" rx="6" fill="#f8fafc" stroke="#2563eb"/>
  <text x="312" y="266" font-size="10" fill="#0f172a">for 逐条 handle(r)</text>
  <text x="312" y="284" font-size="10" fill="#334155">业务处理 + 幂等校验</text>
  <text x="312" y="300" font-size="10" fill="#334155">!records.isEmpty()</text>
  <text x="312" y="316" font-size="10" fill="#64748b">才进入提交那一步</text>

  <rect x="560" y="246" width="200" height="76" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="572" y="266" font-size="10" fill="#14532d">consumer.commitSync()</text>
  <text x="572" y="284" font-size="10" fill="#14532d">提交的是下次要读的位点</text>
  <text x="572" y="300" font-size="10" fill="#14532d">= 本批最大 offset + 1</text>
  <text x="572" y="316" font-size="10" fill="#64748b">阻塞且失败自动重试</text>

  <rect x="820" y="246" width="120" height="76" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="830" y="266" font-size="9.5" fill="#334155">位点表读数</text>
  <text x="830" y="284" font-size="9.5" fill="#334155">CURRENT=3</text>
  <text x="830" y="300" font-size="9.5" fill="#334155">LOG-END=3</text>
  <text x="830" y="316" font-size="9.5" fill="#15803d">LAG=0</text>

  <line x1="240" y1="284" x2="296" y2="284" stroke="#334155" stroke-width="1.5" marker-end="url(#arK2)"/>
  <line x1="500" y1="284" x2="556" y2="284" stroke="#334155" stroke-width="1.5" marker-end="url(#arK2)"/>
  <line x1="760" y1="284" x2="816" y2="284" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arK2g)"/>

  <text x="40" y="354" font-size="12" font-weight="bold" fill="#2563eb">跨进程传播：Inject / Extract 走 record headers，不是消息体</text>

  <rect x="40" y="366" width="400" height="66" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="54" y="386" font-size="10.5" fill="#7c2d12">生产端 Inject：record.headers().add(k, v)</text>
  <text x="54" y="404" font-size="10" fill="#7c2d12">x-biz-id=ORDER_JAVA_9001、x-trace-id=trace-java-abc123</text>
  <text x="54" y="422" font-size="10" fill="#7c2d12">producer.send(rec).get()</text>

  <rect x="560" y="366" width="400" height="66" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="574" y="386" font-size="10.5" fill="#7c2d12">消费端 Extract：r.headers().lastHeader(k)</text>
  <text x="574" y="404" font-size="10" fill="#7c2d12">JAVA-PROPS-CONSUME partition=1 offset=0</text>
  <text x="574" y="422" font-size="10" fill="#7c2d12">biz=ORDER_JAVA_9001 trace=trace-java-abc123</text>

  <line x1="440" y1="399" x2="556" y2="399" stroke="#334155" stroke-width="1.5" marker-end="url(#arK2)"/>

  <text x="40" y="470" font-size="11" fill="#64748b">小结：6 条消息按 key 落成 ORDER_2001 三条全在 partition=0、ORDER_2002 三条全在 partition=1，offset 依次 0、1、2，与 seq 一致。</text>
  <text x="40" y="496" font-size="11" fill="#64748b">commitSync 阻塞且失败自动重试、commitAsync 不阻塞但不重试 —— 常见做法是循环内 commitAsync、关闭前 commitSync 兜底。</text>
  <text x="40" y="522" font-size="11" fill="#64748b">想按分区精确提交可传 Map&lt;TopicPartition, OffsetAndMetadata&gt;；分区数要 ≥ listener.concurrency，多出的线程分不到分区只会空转。</text>
</svg>
