<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="490" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">trace_id 从当前 span 流向日志与响应头</text>
  <text x="40" y="58" font-size="13" fill="#64748b">应用进程内的数据流转（第六节）；三处出口取的都是同一个 tracer.currentSpan()</text>

  <defs>
    <marker id="arTid" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="40" y="90" width="250" height="76" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="52" y="112" font-size="12" font-weight="bold" fill="#0f172a">tracer.currentSpan()</text>
  <text x="52" y="131" font-size="11" fill="#334155">Tracer 是容器注入的单例 Bean</text>
  <text x="52" y="150" font-size="11" fill="#b45309">null → 三元表达式回退成 ""</text>

  <rect x="340" y="90" width="230" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="352" y="112" font-size="12" font-weight="bold" fill="#0f172a">span.context().traceId()</text>
  <text x="352" y="131" font-size="11" fill="#334155">同一条链路的 traceId</text>
  <text x="352" y="150" font-size="11" fill="#334155">先 setHeader，再 chain.doFilter</text>

  <line x1="290" y1="128" x2="340" y2="128" stroke="#334155" stroke-width="1.6" marker-end="url(#arTid)"/>

  <rect x="620" y="64" width="340" height="64" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="632" y="86" font-size="12" font-weight="bold" fill="#14532d">出口① MDC → Logback pattern</text>
  <text x="632" y="107" font-size="11" fill="#166534">[traceId=%X{traceId},spanId=%X{spanId}]，Boot 3 自动放</text>

  <rect x="620" y="150" width="340" height="64" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="632" y="172" font-size="12" font-weight="bold" fill="#14532d">出口② 响应头 X-Trace-Id</text>
  <text x="632" y="193" font-size="11" fill="#166534">TraceIdFilter 里 response.setHeader("X-Trace-Id", …)</text>

  <rect x="620" y="236" width="340" height="64" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="632" y="258" font-size="12" font-weight="bold" fill="#14532d">出口③ span 自身的 tag 与 error</text>
  <text x="632" y="279" font-size="11" fill="#166534">span.tag("order.store_id", …) / span.error(e) 标红</text>

  <g stroke="#334155" stroke-width="1.6">
    <line x1="570" y1="104" x2="620" y2="96" marker-end="url(#arTid)"/>
    <line x1="570" y1="128" x2="620" y2="182" marker-end="url(#arTid)"/>
    <line x1="570" y1="152" x2="620" y2="268" marker-end="url(#arTid)"/>
  </g>

  <rect x="40" y="330" width="440" height="76" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="52" y="352" font-size="12" font-weight="bold" fill="#7f1d1d">⚠️ 异常堆栈要写进 span</text>
  <text x="52" y="371" font-size="11" fill="#7f1d1d">span.error(e)（Micrometer）或 recordException(e)</text>
  <text x="52" y="390" font-size="11" fill="#7f1d1d">+ setStatus(ERROR, …)（OTel API），否则只知红不知因为什么红</text>

  <rect x="520" y="330" width="440" height="76" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="532" y="352" font-size="12" font-weight="bold" fill="#7c2d12">⚠️ 别把请求体整体塞进 attribute</text>
  <text x="532" y="371" font-size="11" fill="#7c2d12">span 体积暴涨，ClickHouse 存储成本与查询延迟都涨</text>
  <text x="532" y="390" font-size="11" fill="#7c2d12">还可能带出敏感字段；要记就截断 + 脱敏</text>

  <text x="40" y="434" font-size="11" fill="#64748b">小结：链路数据只有能「从日志 / 工单一键跳回 UI」才有排障价值，所以同一个 traceId 要同时出现在日志、响应头和 span 上。</text>
  <text x="40" y="458" font-size="11" fill="#64748b">图怎么读：logging.pattern.level 也能把 [%5p [traceId=%X{traceId},…]] 塞进 level 字段位置，两处引用的是同一个 MDC 键。</text>
</svg>
