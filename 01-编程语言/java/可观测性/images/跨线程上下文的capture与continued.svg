<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">SkyWalking 跨线程：上下文默认跟线程走</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">数据流转图；判据：异步部分日志 %tid 为 N/A，就是链路断在提交点（第十一节）</text>

  <defs>
    <marker id="t1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="t2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="50" y="86" width="420" height="330" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="260" y="112" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">请求线程（主线程）</text>

  <g font-size="12">
    <rect x="80" y="130" width="360" height="56" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="260" y="153" fill="#1e3a8a" text-anchor="middle">ThreadLocal 中持有当前 trace 上下文</text>
    <text x="260" y="172" fill="#1e3a8a" text-anchor="middle">TraceContext.traceId() 有值</text>

    <rect x="80" y="206" width="360" height="52" rx="6" fill="#f8fafc" stroke="#2563eb"/>
    <text x="260" y="227" fill="#0f172a" text-anchor="middle">ContextManager.capture()</text>
    <text x="260" y="246" fill="#64748b" text-anchor="middle">对当前上下文取一份快照</text>

    <rect x="80" y="278" width="360" height="70" rx="6" fill="#fef3c7" stroke="#b45309"/>
    <text x="260" y="300" fill="#854d0e" text-anchor="middle">提交任务：RunnableWrapper /</text>
    <text x="260" y="320" fill="#854d0e" text-anchor="middle">@TraceCrossThread / @Async 插件 /</text>
    <text x="260" y="340" fill="#854d0e" text-anchor="middle">线程池插件（增强 ThreadPoolExecutor）</text>

    <rect x="80" y="372" width="360" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="260" y="391" fill="#334155" text-anchor="middle">快照随任务对象一起进入线程池队列</text>
  </g>

  <rect x="530" y="86" width="430" height="330" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="745" y="112" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">线程池 worker</text>

  <g font-size="12">
    <rect x="560" y="130" width="370" height="56" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="745" y="153" fill="#14532d" text-anchor="middle">ContextManager.continued(snapshot)</text>
    <text x="745" y="172" fill="#14532d" text-anchor="middle">恢复到本线程 ThreadLocal</text>

    <rect x="560" y="206" width="370" height="52" rx="6" fill="#f8fafc" stroke="#16a34a"/>
    <text x="745" y="227" fill="#14532d" text-anchor="middle">块内 SQL / HTTP 的 span</text>
    <text x="745" y="246" fill="#14532d" text-anchor="middle">继续挂在提交任务那条链路上</text>

    <rect x="560" y="278" width="370" height="56" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="745" y="301" fill="#14532d" text-anchor="middle">UI 可查 · 日志 %tid 有值</text>
    <text x="745" y="320" fill="#14532d" text-anchor="middle">链路完整</text>

    <rect x="560" y="372" width="370" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="745" y="391" fill="#7f1d1d" text-anchor="middle">worker 复用：每轮重新 capture / continued 并清理</text>
  </g>

  <g stroke="#334155" stroke-width="1.6">
    <line x1="260" y1="186" x2="260" y2="206" marker-end="url(#t1)"/>
    <line x1="260" y1="258" x2="260" y2="278" marker-end="url(#t1)"/>
    <line x1="260" y1="348" x2="260" y2="372" marker-end="url(#t1)"/>
    <line x1="745" y1="186" x2="745" y2="206" marker-end="url(#t1)"/>
    <line x1="745" y1="258" x2="745" y2="278" marker-end="url(#t1)"/>
  </g>
  <line x1="470" y1="387" x2="560" y2="158" stroke="#334155" stroke-width="1.7" marker-end="url(#t1)"/>

  <rect x="50" y="452" width="910" height="62" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="505" y="478" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">反例：没做上下文传播</text>
  <text x="505" y="500" font-size="12" fill="#7f1d1d" text-anchor="middle">worker 的 ThreadLocal 为空 → 异步那部分 span 查不到、%tid 输出 TID: N/A → 链路断在提交点（接入后最常见故障）</text>

  <text x="500" y="546" font-size="12" fill="#64748b" text-anchor="middle">手动写法两条约束：ContextManager.capture() 的快照绑定一次调用；Reactor / 虚拟线程要先查 Support-Version-Matrix</text>
</svg>
