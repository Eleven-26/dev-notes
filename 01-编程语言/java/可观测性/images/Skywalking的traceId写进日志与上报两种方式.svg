<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="390" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">日志与链路是两套数据：靠 traceId 串起来的两种做法</text>
  <text x="40" y="58" font-size="13" fill="#64748b">Java 进程内的数据流转（第十节）；方式一零依赖，方式二要拷日志上报插件</text>

  <defs>
    <marker id="arSwLog" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="40" y="88" width="290" height="86" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="52" y="110" font-size="11.5" font-weight="bold" fill="#0f172a">上下文来源：TraceContext.traceId()</text>
  <text x="52" y="131" font-size="10.5" fill="#334155">toolkit 提供的只读 API，按当前线程取</text>
  <text x="52" y="150" font-size="10.5" fill="#b45309">未接入 agent 时返回 ""</text>
  <text x="52" y="169" font-size="10.5" fill="#334155">代码里可直接取</text>

  <rect x="370" y="88" width="290" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="382" y="110" font-size="11.5" font-weight="bold" fill="#0f172a">方式一：把 traceId 写进日志字段</text>
  <text x="382" y="131" font-size="10.5" fill="#334155">LayoutWrappingEncoder + TraceIdPattern…Layout</text>
  <text x="382" y="150" font-size="10.5" fill="#334155">Pattern 里用 [%tid]</text>
  <text x="382" y="169" font-size="10.5" fill="#16a34a">最常用，零依赖</text>

  <rect x="700" y="88" width="260" height="86" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="712" y="110" font-size="11.5" font-weight="bold" fill="#7c2d12">探针自证判据</text>
  <text x="712" y="131" font-size="10.5" fill="#7c2d12">agent 没挂上时 %tid 输出</text>
  <text x="712" y="150" font-size="10.5" fill="#7c2d12">TID: N/A</text>
  <text x="712" y="169" font-size="10.5" fill="#7c2d12">这本身就是「探针是否生效」</text>

  <rect x="40" y="210" width="440" height="86" rx="8" fill="#f8fafc" stroke="#2563eb"/>
  <text x="52" y="232" font-size="11.5" font-weight="bold" fill="#0f172a">方式二：日志直接上报到 OAP</text>
  <text x="52" y="253" font-size="10.5" fill="#334155">从 optional-plugins/ 拷日志上报插件到 plugins/</text>
  <text x="52" y="272" font-size="10.5" fill="#334155">再加 apm-toolkit-logback-1.x 的 LogbackAppender</text>
  <text x="52" y="290" font-size="10.5" fill="#334155">上报后在 UI 的日志面板按 Trace ID 查询</text>

  <rect x="520" y="210" width="440" height="86" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="532" y="232" font-size="11.5" font-weight="bold" fill="#14532d">标准排查姿势（本节原话）</text>
  <text x="532" y="253" font-size="10.5" fill="#166534">Trace 找慢 / 失败的 span → 用 traceId 查日志</text>
  <text x="532" y="272" font-size="10.5" fill="#166534">→ 看业务日志里当时在做什么</text>
  <text x="532" y="290" font-size="10.5" fill="#166534">能直接捞出这一次请求的所有日志</text>

  <g stroke="#334155" stroke-width="1.6">
    <line x1="330" y1="131" x2="370" y2="131" marker-end="url(#arSwLog)"/>
    <line x1="660" y1="131" x2="700" y2="131" marker-end="url(#arSwLog)"/>
    <line x1="260" y1="174" x2="260" y2="210" stroke-dasharray="5 4" marker-end="url(#arSwLog)"/>
    <line x1="480" y1="253" x2="520" y2="253" marker-end="url(#arSwLog)"/>
  </g>

  <text x="40" y="330" font-size="11" fill="#64748b">小结：两种做法的差别只在数据落到哪里——方式一 traceId 进日志行（自己去 grep），方式二日志进 OAP（在 UI 里按 Trace ID 反查）。</text>
  <text x="40" y="356" font-size="11" fill="#64748b">图怎么读：跨线程没处理时 %tid 也是 N/A，那是断链症状而不是没挂 agent，判据见第十一节。</text>
</svg>
