<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">Java 侧只有两条路，终点都是 OTel SDK → OTLP</text>
  <text x="40" y="58" font-size="13" fill="#64748b">应用进程内的架构图（第一节对照表）；Jaeger 后端的部署方式两条路完全一致，归 03-数据与中间件</text>

  <defs>
    <marker id="arRoute" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="40" y="88" width="300" height="126" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="52" y="108" font-size="11.5" font-weight="bold" fill="#0f172a">路线 A：OTel Java Agent</text>
  <text x="52" y="127" font-size="10.5" fill="#334155">形态：-javaagent 挂字节码增强 agent</text>
  <text x="52" y="145" font-size="10.5" fill="#334155">改码量：零</text>
  <text x="52" y="163" font-size="10.5" fill="#334155">覆盖最广：MVC / JDBC / Redis / Kafka</text>
  <text x="52" y="181" font-size="10.5" fill="#334155">HTTP Client / 线程池… 都自动出 span</text>
  <text x="52" y="199" font-size="10.5" fill="#334155">前提无；适合存量系统与多框架混用</text>

  <rect x="660" y="88" width="300" height="126" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="672" y="108" font-size="11.5" font-weight="bold" fill="#14532d">路线 B：Micrometer Tracing</text>
  <text x="672" y="127" font-size="10.5" fill="#166534">形态：Spring Boot 3 起步器 + 依赖</text>
  <text x="672" y="145" font-size="10.5" fill="#166534">自动埋点基本零改码，手动要注入 Tracer</text>
  <text x="672" y="163" font-size="10.5" fill="#166534">Spring 生态内最贴合，非 Spring 自己写</text>
  <text x="672" y="181" font-size="10.5" fill="#166534">前提：Boot 3.x（2.x 的 Sleuth 已停更）</text>
  <text x="672" y="199" font-size="10.5" fill="#166534">适合新项目、要与 Micrometer 指标统一</text>

  <rect x="370" y="250" width="260" height="66" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="382" y="272" font-size="11.5" font-weight="bold" fill="#7c2d12">共同终点：OTel SDK → OTLP</text>
  <text x="382" y="292" font-size="10.5" fill="#7c2d12">后端与部署方式完全一致（见 03）</text>
  <text x="382" y="310" font-size="10.5" fill="#7c2d12">路线 A 还自动注入 / 提取 W3C traceparent</text>

  <g stroke="#334155" stroke-width="1.6">
    <line x1="190" y1="214" x2="430" y2="250" marker-end="url(#arRoute)"/>
    <line x1="810" y1="214" x2="570" y2="250" marker-end="url(#arRoute)"/>
  </g>

  <rect x="40" y="340" width="520" height="76" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="52" y="362" font-size="11.5" font-weight="bold" fill="#7f1d1d">⚠️ 两个 agent 不能同时挂</text>
  <text x="52" y="382" font-size="10.5" fill="#7f1d1d">OTel Java Agent 与 SkyWalking agent 同挂 = 同一入口两份 span</text>
  <text x="52" y="402" font-size="10.5" fill="#7f1d1d">两侧各收到一条链路，指标翻倍，trace_id 还不一致 → 选一条主线</text>

  <rect x="580" y="340" width="380" height="76" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="592" y="362" font-size="11.5" font-weight="bold" fill="#0f172a">新项目不要再用的旧写法</text>
  <text x="592" y="382" font-size="10.5" fill="#334155">jaeger-client-java 已归档</text>
  <text x="592" y="402" font-size="10.5" fill="#334155">io.jaegertracing:jaeger-client（迁移表见第九节）</text>

  <text x="40" y="440" font-size="11" fill="#64748b">小结：两条路的差别只在「谁去埋」——agent 在类加载期织入，Micrometer 靠框架内注入；上报出口同一个，所以后端侧无需区分。</text>
</svg>
