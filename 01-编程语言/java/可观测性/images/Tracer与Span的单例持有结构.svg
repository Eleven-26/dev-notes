<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Java 进程内：链路对象的单例边界与持有结构</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">数据结构形态图；对象与归属取自第四节单例边界表</text>

  <defs>
    <marker id="b1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="b2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 左：进程级面板 -->
  <rect x="40" y="86" width="540" height="330" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="310" y="112" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">进程级：容器启动时建一次</text>

  <g font-size="12">
    <rect x="70" y="130" width="480" height="56" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="310" y="153" fill="#1e3a8a" text-anchor="middle">Tracer（Micrometer / OTel）· SdkTracerProvider</text>
    <text x="310" y="172" fill="#1e3a8a" text-anchor="middle">GlobalOpenTelemetry 注册一次即可</text>

    <rect x="70" y="210" width="480" height="52" rx="6" fill="#f8fafc" stroke="#64748b"/>
    <text x="310" y="231" fill="#0f172a" text-anchor="middle">持有 ① BatchSpanProcessor</text>
    <text x="310" y="250" fill="#64748b" text-anchor="middle">批处理线程 + 内存导出队列</text>

    <rect x="70" y="284" width="480" height="52" rx="6" fill="#f8fafc" stroke="#64748b"/>
    <text x="310" y="305" fill="#0f172a" text-anchor="middle">持有 ② OTLP exporter</text>
    <text x="310" y="324" fill="#64748b" text-anchor="middle">到 jaeger:4317 的 gRPC 长连接</text>

    <rect x="70" y="358" width="480" height="44" rx="6" fill="#ffedd5" stroke="#ea580c"/>
    <text x="310" y="376" fill="#7c2d12" text-anchor="middle">同层还有：HikariCP · RestClient/WebClient 连接池</text>
    <text x="310" y="394" fill="#7c2d12" text-anchor="middle">agent 只增强 Spring 托管的这一个实例</text>
  </g>

  <!-- 右：请求级面板 -->
  <rect x="610" y="86" width="350" height="330" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="785" y="112" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">请求级：绑定单次调用</text>

  <g font-size="12">
    <rect x="630" y="130" width="310" height="56" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="785" y="153" fill="#14532d" text-anchor="middle">Span = tracer.nextSpan().start()</text>
    <text x="785" y="172" fill="#14532d" text-anchor="middle">只创建，不进上下文</text>

    <rect x="630" y="210" width="310" height="56" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="785" y="233" fill="#14532d" text-anchor="middle">SpanInScope（withSpan）</text>
    <text x="785" y="252" fill="#14532d" text-anchor="middle">放进当前线程上下文，子 span 才挂对父</text>

    <rect x="630" y="290" width="310" height="62" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="785" y="313" fill="#7f1d1d" text-anchor="middle">finally 中 span.end()</text>
    <text x="785" y="333" fill="#7f1d1d" text-anchor="middle">忘 end → 永不上报且不报错</text>

    <rect x="630" y="374" width="310" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="785" y="393" fill="#334155" text-anchor="middle">end() 后即失效，用完即弃</text>
  </g>

  <g stroke="#334155" stroke-width="1.6">
    <line x1="310" y1="186" x2="310" y2="210" marker-end="url(#b1)"/>
    <line x1="310" y1="262" x2="310" y2="284" marker-end="url(#b1)"/>
    <line x1="785" y1="186" x2="785" y2="210" marker-end="url(#b1)"/>
    <line x1="785" y1="266" x2="785" y2="290" marker-end="url(#b1)"/>
  </g>
  <line x1="610" y1="158" x2="556" y2="158" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#b2)"/>
  <text x="583" y="148" font-size="10" fill="#64748b" text-anchor="middle">由单例创建</text>

  <!-- 结论 -->
  <rect x="40" y="440" width="920" height="76" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="500" y="466" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">判据只看一件事：对象内部有没有长活资源（连接、线程池、导出线程）</text>
  <text x="500" y="488" font-size="12" fill="#334155" text-anchor="middle">有 → 进程级 Bean；没有、且绑定单次调用的 → 请求级</text>
  <text x="500" y="508" font-size="12" fill="#7f1d1d" text-anchor="middle">在请求路径里 new Tracer / 每请求重建 Provider = 每次起一套批处理线程与导出连接 → 线程泄漏 + 连接爆炸</text>

  <text x="500" y="556" font-size="12" fill="#64748b" text-anchor="middle">ContextPropagatingTaskDecorator 是无状态装饰器，配到线程池后进程级复用（corePoolSize=8）</text>
  <text x="500" y="580" font-size="12" fill="#64748b" text-anchor="middle">路线 A 的 agent 由 JVM 在 premain 建好，业务代码不感知、也不需要手管生命周期</text>
</svg>
