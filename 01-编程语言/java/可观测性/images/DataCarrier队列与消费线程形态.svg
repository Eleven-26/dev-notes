<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">DataCarrier：Channel + 多 Buffer、每 Buffer 绑一个消费线程</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">数据结构形态图；队列满走 IF_POSSIBLE——宁可丢数据，不阻塞业务线程（第十二节、延伸追问）</text>

  <defs>
    <marker id="q1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="q2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="30" y="200" width="180" height="92" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="120" y="226" font-size="12" fill="#1e3a8a" text-anchor="middle">业务线程（拦截器）</text>
  <text x="120" y="248" font-size="12" fill="#1e3a8a" text-anchor="middle">产生 Entry / Exit /</text>
  <text x="120" y="268" font-size="12" fill="#1e3a8a" text-anchor="middle">Local span</text>

  <rect x="230" y="100" width="460" height="270" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="460" y="126" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">DataCarrier（无锁环形队列）</text>

  <rect x="260" y="146" width="400" height="46" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="460" y="174" font-size="12" fill="#334155" text-anchor="middle">Channel：接收 span 写入</text>

  <rect x="260" y="222" width="110" height="66" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="315" y="250" font-size="12" fill="#14532d" text-anchor="middle">Buffer 0</text>
  <text x="315" y="272" font-size="12" fill="#14532d" text-anchor="middle">线程 a</text>

  <rect x="405" y="222" width="110" height="66" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="460" y="250" font-size="12" fill="#14532d" text-anchor="middle">Buffer 1</text>
  <text x="460" y="272" font-size="12" fill="#14532d" text-anchor="middle">线程 b</text>

  <rect x="550" y="222" width="110" height="66" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="605" y="250" font-size="12" fill="#14532d" text-anchor="middle">Buffer 2</text>
  <text x="605" y="272" font-size="12" fill="#14532d" text-anchor="middle">线程 c</text>

  <text x="460" y="330" font-size="12" fill="#64748b" text-anchor="middle">每个 Buffer 绑一个消费线程</text>

  <rect x="740" y="120" width="200" height="200" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="840" y="152" font-size="12" fill="#7c2d12" text-anchor="middle">消费线程按批</text>
  <text x="840" y="174" font-size="12" fill="#7c2d12" text-anchor="middle">gRPC 上报 OAP</text>
  <text x="840" y="202" font-size="12" fill="#7c2d12" text-anchor="middle">collector.backend</text>
  <text x="840" y="222" font-size="12" fill="#7c2d12" text-anchor="middle">_service：11800</text>
  <text x="840" y="252" font-size="12" fill="#7c2d12" text-anchor="middle">日志上报插件走</text>
  <text x="840" y="272" font-size="12" fill="#7c2d12" text-anchor="middle">同一条通道</text>

  <rect x="230" y="410" width="460" height="62" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="460" y="436" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">队列满时 IF_POSSIBLE：直接丢弃</text>
  <text x="460" y="458" font-size="12" fill="#7f1d1d" text-anchor="middle">不阻塞业务线程 —— 高 QPS 偶发缺链路是取舍</text>

  <g stroke="#334155" stroke-width="1.6">
    <line x1="210" y1="246" x2="260" y2="169" marker-end="url(#q1)"/>
    <line x1="460" y1="192" x2="315" y2="222" marker-end="url(#q1)"/>
    <line x1="460" y1="192" x2="460" y2="222" marker-end="url(#q1)"/>
    <line x1="460" y1="192" x2="605" y2="222" marker-end="url(#q1)"/>
    <line x1="370" y1="255" x2="405" y2="255" marker-end="url(#q1)"/>
    <line x1="515" y1="255" x2="550" y2="255" marker-end="url(#q1)"/>
    <line x1="660" y1="255" x2="740" y2="230" marker-end="url(#q1)"/>
  </g>
  <line x1="460" y1="370" x2="460" y2="410" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#q2)"/>

  <rect x="730" y="400" width="230" height="72" rx="6" fill="#f8fafc" stroke="#64748b"/>
  <text x="845" y="424" font-size="12" fill="#0f172a" text-anchor="middle">SIGTERM 退出：</text>
  <text x="845" y="444" font-size="12" fill="#0f172a" text-anchor="middle">ShutdownHook 先停消费线程</text>
  <text x="845" y="464" font-size="12" fill="#0f172a" text-anchor="middle">flush 队列，再关 gRPC</text>

  <text x="500" y="510" font-size="12" fill="#64748b" text-anchor="middle">要提高完整度：调大队列并评估 OAP 写入能力；kill -9 / OOMKilled 不触发 hook，队列里那一批直接丢</text>
  <text x="500" y="548" font-size="12" fill="#334155" text-anchor="middle">这条队列的存在，是「上报不会阻塞业务线程」与「强杀必丢最后一批」两个结论的共同根源</text>
</svg>
