<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">跨线程与异步：上下文一换线程就断，四个场景各自怎么接</text>
  <text x="40" y="58" font-size="13" fill="#64748b">Java 进程内的数据流转（第七节原表）；左列是断链过程，右侧四格是四种场景的处理方式</text>

  <defs>
    <marker id="arAsync" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="40" y="88" width="250" height="80" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="52" y="110" font-size="11.5" font-weight="bold" fill="#0f172a">主线程：请求进来</text>
  <text x="52" y="131" font-size="10.5" fill="#334155">tracer.currentSpan() 有值</text>
  <text x="52" y="149" font-size="10.5" fill="#334155">路线 A 由 agent 自动增强</text>

  <rect x="40" y="200" width="250" height="80" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="52" y="222" font-size="11.5" font-weight="bold" fill="#7f1d1d">❌ 任务换线程后断链</text>
  <text x="52" y="243" font-size="10.5" fill="#7f1d1d">日志里 %X{traceId} 是空</text>
  <text x="52" y="261" font-size="10.5" fill="#7f1d1d">「异步那部分查不到」</text>

  <rect x="340" y="88" width="290" height="80" rx="8" fill="#f8fafc" stroke="#2563eb"/>
  <text x="352" y="110" font-size="11.5" font-weight="bold" fill="#0f172a">ExecutorService / 线程池</text>
  <text x="352" y="131" font-size="10.5" fill="#334155">A：agent 自动增强，无需处理</text>
  <text x="352" y="149" font-size="10.5" fill="#334155">B：TaskDecorator 或容器的那个装饰器</text>

  <rect x="670" y="88" width="290" height="80" rx="8" fill="#f8fafc" stroke="#2563eb"/>
  <text x="682" y="110" font-size="11.5" font-weight="bold" fill="#0f172a">Spring @Async</text>
  <text x="682" y="131" font-size="10.5" fill="#334155">A：自动</text>
  <text x="682" y="149" font-size="10.5" fill="#334155">B：自动（Spring Boot 3 已内置传播）</text>

  <rect x="340" y="200" width="290" height="80" rx="8" fill="#f8fafc" stroke="#2563eb"/>
  <text x="352" y="222" font-size="11.5" font-weight="bold" fill="#0f172a">CompletableFuture</text>
  <text x="352" y="243" font-size="10.5" fill="#334155">A：自动</text>
  <text x="352" y="261" font-size="10.5" fill="#334155">B：需要显式传 Context，或用 @Async 替代</text>

  <rect x="670" y="200" width="290" height="80" rx="8" fill="#f8fafc" stroke="#2563eb"/>
  <text x="682" y="222" font-size="11.5" font-weight="bold" fill="#0f172a">Reactor / WebFlux</text>
  <text x="682" y="243" font-size="10.5" fill="#334155">A：自动（需 io.micrometer:context-propagation）</text>
  <text x="682" y="261" font-size="10.5" fill="#334155">B：加依赖并开 Hooks.enableAutomatic…()</text>

  <g stroke="#334155" stroke-width="1.6">
    <line x1="165" y1="168" x2="165" y2="200" marker-end="url(#arAsync)"/>
    <line x1="290" y1="240" x2="340" y2="240" marker-end="url(#arAsync)"/>
  </g>

  <rect x="40" y="304" width="440" height="76" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="52" y="326" font-size="11.5" font-weight="bold" fill="#7c2d12">配到线程池的写法（本节代码）</text>
  <text x="52" y="347" font-size="10.5" fill="#7c2d12">executor.setCorePoolSize(8); executor.setTaskDecorator(decorator);</text>
  <text x="52" y="366" font-size="10.5" fill="#7c2d12">executor.initialize(); —— 装饰器无状态，进程级配一次即可复用</text>

  <rect x="520" y="304" width="440" height="76" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="532" y="326" font-size="11.5" font-weight="bold" fill="#7c2d12">⚠️ 症状与判据（本节原话）</text>
  <text x="532" y="347" font-size="10.5" fill="#7c2d12">「HTTP 请求有 trace，但异步那部分查不到」或 %X{traceId} 为空</text>
  <text x="532" y="366" font-size="10.5" fill="#7c2d12">十有八九是线程池没做上下文传播；与 SkyWalking 的 @TraceCrossThread 同类</text>

  <text x="40" y="410" font-size="11" fill="#64748b">小结：路线 A 把四个场景都在类加载期增强掉了；路线 B 只有 @Async 是内置的，其余三种都要自己把上下文交出去。</text>
</svg>
