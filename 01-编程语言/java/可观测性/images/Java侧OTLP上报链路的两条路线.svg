<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="650" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Java 进程内：两条埋点路线汇合到 OTLP</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">数据流转图；配置值取自本篇 2.1、3.2 与第十二节解析版本表（agent 2.11.0 / bridge 1.2.5 / exporter 1.31.0）</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- 泳道标题 -->
  <rect x="60" y="80" width="380" height="32" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="250" y="101" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">路线 A：OTel Java Agent（零改码）</text>
  <rect x="560" y="80" width="380" height="32" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="750" y="101" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">路线 B：Micrometer Tracing（Boot 3）</text>

  <g font-size="12">
    <!-- A 列 -->
    <rect x="60" y="128" width="380" height="56" rx="6" fill="#f8fafc" stroke="#2563eb"/>
    <text x="250" y="151" fill="#0f172a" text-anchor="middle">-javaagent 挂 agent 2.11.0</text>
    <text x="250" y="170" fill="#64748b" text-anchor="middle">premain 装增强器，必须先于 -jar</text>

    <rect x="60" y="206" width="380" height="56" rx="6" fill="#f8fafc" stroke="#2563eb"/>
    <text x="250" y="229" fill="#0f172a" text-anchor="middle">类加载期字节码织入拦截器</text>
    <text x="250" y="248" fill="#64748b" text-anchor="middle">Spring MVC / JDBC / Redis / Kafka / HTTP</text>

    <rect x="60" y="284" width="380" height="56" rx="6" fill="#f8fafc" stroke="#2563eb"/>
    <text x="250" y="307" fill="#0f172a" text-anchor="middle">自动生成 span + W3C traceparent 注入</text>
    <text x="250" y="326" fill="#64748b" text-anchor="middle">sampler：parentbased_traceidratio 0.1</text>

    <!-- B 列 -->
    <rect x="560" y="128" width="380" height="56" rx="6" fill="#f8fafc" stroke="#16a34a"/>
    <text x="750" y="151" fill="#0f172a" text-anchor="middle">micrometer-tracing-bridge-otel 1.2.5</text>
    <text x="750" y="170" fill="#64748b" text-anchor="middle">只引 OTel 桥，与 brave 桥互斥</text>

    <rect x="560" y="206" width="380" height="56" rx="6" fill="#f8fafc" stroke="#16a34a"/>
    <text x="750" y="229" fill="#0f172a" text-anchor="middle">容器注入单例 Tracer Bean</text>
    <text x="750" y="248" fill="#64748b" text-anchor="middle">nextSpan → withSpan → finally end()</text>

    <rect x="560" y="284" width="380" height="56" rx="6" fill="#f8fafc" stroke="#16a34a"/>
    <text x="750" y="307" fill="#0f172a" text-anchor="middle">自动 span：MVC / RestClient / @Scheduled / SQL</text>
    <text x="750" y="326" fill="#64748b" text-anchor="middle">sampling.probability = 0.1（头部采样）</text>
  </g>

  <!-- 汇合 -->
  <rect x="330" y="390" width="340" height="58" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="500" y="413" font-size="13" font-weight="bold" fill="#7c2d12" text-anchor="middle">OTel SDK 1.31.0（TracerProvider）</text>
  <text x="500" y="433" font-size="12" fill="#7c2d12" text-anchor="middle">BatchSpanProcessor 攒批入内存队列</text>

  <rect x="330" y="478" width="340" height="58" rx="6" fill="#f8fafc" stroke="#64748b"/>
  <text x="500" y="501" font-size="12" fill="#0f172a" text-anchor="middle">OTLP exporter</text>
  <text x="500" y="521" font-size="12" fill="#334155" text-anchor="middle">gRPC 4317 · HTTP 4318 且带 /v1/traces</text>

  <rect x="330" y="566" width="340" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="500" y="586" font-size="12" fill="#1e3a8a" text-anchor="middle">Jaeger 后端接收 OTLP</text>
  <text x="500" y="605" font-size="12" fill="#1e3a8a" text-anchor="middle">UI 端口 16686（别把它填成 endpoint）</text>

  <g stroke="#334155" stroke-width="1.6">
    <line x1="250" y1="184" x2="250" y2="206" marker-end="url(#a1)"/>
    <line x1="250" y1="262" x2="250" y2="284" marker-end="url(#a1)"/>
    <line x1="750" y1="184" x2="750" y2="206" marker-end="url(#a1)"/>
    <line x1="750" y1="262" x2="750" y2="284" marker-end="url(#a1)"/>
  </g>
  <line x1="250" y1="340" x2="430" y2="390" stroke="#2563eb" stroke-width="1.7" marker-end="url(#a2)"/>
  <line x1="750" y1="340" x2="570" y2="390" stroke="#16a34a" stroke-width="1.7" marker-end="url(#a3)"/>
  <g stroke="#334155" stroke-width="1.6">
    <line x1="500" y1="448" x2="500" y2="478" marker-end="url(#a1)"/>
    <line x1="500" y1="536" x2="500" y2="566" marker-end="url(#a1)"/>
  </g>

  <rect x="60" y="418" width="240" height="88" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="180" y="441" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">两个 agent 不能同挂</text>
  <text x="180" y="462" font-size="12" fill="#7f1d1d" text-anchor="middle">OTel 与 SkyWalking 同挂 =</text>
  <text x="180" y="482" font-size="12" fill="#7f1d1d" text-anchor="middle">双份 span · 指标翻倍 · id 不一致</text>

  <text x="500" y="640" font-size="12" fill="#64748b" text-anchor="middle">后端可换而埋点不动：endpoint 从 Jaeger 换成 SkyWalking OAP 或 Tempo，业务代码一行不改（见 2.1、3.2、第一节）</text>
</svg>
