<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">单例边界：谁持有连接与批处理线程，谁绑定单次调用</text>
  <text x="40" y="58" font-size="13" fill="#64748b">Java 进程内的对象持有形态（第四节）；判据只看「内部有没有长活的资源」</text>

  <defs>
    <marker id="arSingleton" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="40" y="90" width="300" height="72" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="52" y="112" font-size="12" font-weight="bold" fill="#0f172a">Spring 容器：进程级（✅ Bean）</text>
  <text x="52" y="132" font-size="11" fill="#334155">注入单例 Tracer，不要在方法里 new</text>
  <text x="52" y="152" font-size="11" fill="#334155">路线 A 由 -javaagent 建，业务代码不感知</text>

  <rect x="380" y="90" width="280" height="72" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="392" y="112" font-size="12" font-weight="bold" fill="#0f172a">OTelTracerProvider（进程级）</text>
  <text x="392" y="132" font-size="11" fill="#334155">Tracer 背后就是它</text>
  <text x="392" y="152" font-size="11" fill="#334155">GlobalOpenTelemetry 注册一次即可</text>

  <rect x="700" y="90" width="260" height="72" rx="8" fill="#dbeafe" stroke="#16a34a"/>
  <text x="712" y="112" font-size="12" font-weight="bold" fill="#0f172a">长活资源（进程退出前才 close()）</text>
  <text x="712" y="132" font-size="11" fill="#334155">导出器 + 批处理线程</text>
  <text x="712" y="152" font-size="11" fill="#334155">SdkTracerProvider 自己持有时同理</text>

  <g stroke="#334155" stroke-width="1.6">
    <line x1="340" y1="126" x2="380" y2="126" marker-end="url(#arSingleton)"/>
    <line x1="660" y1="126" x2="700" y2="126" marker-end="url(#arSingleton)"/>
  </g>

  <rect x="40" y="196" width="300" height="86" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="52" y="218" font-size="12" font-weight="bold" fill="#0f172a">其余进程级对象（内部都是池）</text>
  <text x="52" y="238" font-size="11" fill="#334155">DataSource / HikariCP：连接池</text>
  <text x="52" y="258" font-size="11" fill="#334155">RestClient / WebClient / OkHttpClient</text>
  <text x="52" y="278" font-size="11" fill="#334155">ContextPropagatingTaskDecorator：无状态</text>

  <rect x="380" y="196" width="280" height="86" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="392" y="218" font-size="12" font-weight="bold" fill="#7c2d12">Span / SpanInScope：❌ 请求级</text>
  <text x="392" y="238" font-size="11" fill="#7c2d12">绑定单次调用，end() 后即失效</text>
  <text x="392" y="258" font-size="11" fill="#7c2d12">nextSpan() 只创建，withSpan 才入上下文</text>
  <text x="392" y="278" font-size="11" fill="#7c2d12">漏了 withSpan → 子 span 挂到上一层</text>

  <rect x="700" y="196" width="260" height="96" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="712" y="218" font-size="12" font-weight="bold" fill="#7f1d1d">⚠️ 写错的后果</text>
  <text x="712" y="240" font-size="11" fill="#7f1d1d">请求路径里 new Tracer、</text>
  <text x="712" y="262" font-size="11" fill="#7f1d1d">每请求重建 SdkTracerProvider</text>
  <text x="712" y="284" font-size="11" fill="#7f1d1d">→ 线程泄漏 + 连接爆炸</text>

  <line x1="660" y1="240" x2="700" y2="240" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arSingleton)"/>

  <rect x="40" y="320" width="920" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="342" font-size="12" font-weight="bold" fill="#0f172a">两条路线都不需要手管 agent 生命周期</text>
  <text x="52" y="362" font-size="11" fill="#334155">路线 A 由 -javaagent 管理，路线 B 由 Spring 容器的 Tracer Bean 管理。</text>
  <text x="52" y="382" font-size="11" fill="#7f1d1d">⚠️ 自己 new DataSource 绕过 Spring 托管：连接池失控、事务与观测全断，agent 也增强不到那个池。</text>

  <text x="40" y="424" font-size="11" fill="#64748b">小结：判「要不要单例」只看一件事——对象内部有没有长活的资源（连接、线程池、导出线程）：有 → 进程级；没有且绑定单次调用的 → 请求级。</text>
</svg>
