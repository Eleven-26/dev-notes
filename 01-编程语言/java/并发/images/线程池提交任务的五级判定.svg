<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="512" viewBox="0 0 1000 512" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="512" fill="#ffffff"/>
  <defs>
    <marker id="arTP" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="arTPR" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">ThreadPoolExecutor 提交任务的五级判定</text>
  <text x="40" y="58" font-size="13" fill="#64748b">顺序是「核心线程 → 队列 → 扩到 max → 拒绝」；maximumPoolSize 只有在队列满之后才会被用上</text>

  <rect x="60" y="84" width="170" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="145" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">核心线程未满？</text>
  <text x="145" y="132" text-anchor="middle" font-size="10.5" fill="#1d4ed8">poolSize &lt; core</text>
  <rect x="305" y="84" width="150" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="380" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">队列未满？</text>
  <text x="380" y="132" text-anchor="middle" font-size="10.5" fill="#1d4ed8">queue 有位置</text>
  <rect x="525" y="84" width="160" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="605" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">线程数到顶？</text>
  <text x="605" y="132" text-anchor="middle" font-size="10.5" fill="#1d4ed8">poolSize &lt; max</text>
  <rect x="740" y="84" width="170" height="62" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="825" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">触发拒绝策略</text>
  <text x="825" y="132" text-anchor="middle" font-size="10.5" fill="#b91c1c">AbortPolicy 抛异常</text>

  <line x1="230" y1="115" x2="305" y2="115" stroke="#334155" stroke-width="1.5" marker-end="url(#arTP)"/>
  <text x="253" y="107" font-size="10.5" fill="#64748b">否</text>
  <line x1="455" y1="115" x2="525" y2="115" stroke="#334155" stroke-width="1.5" marker-end="url(#arTP)"/>
  <text x="478" y="107" font-size="10.5" fill="#64748b">否</text>
  <line x1="685" y1="115" x2="740" y2="115" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arTPR)"/>
  <text x="702" y="107" font-size="10.5" fill="#b91c1c">已满</text>

  <rect x="60" y="188" width="170" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="145" y="217" text-anchor="middle" font-size="11.5" fill="#14532d">新建核心线程执行</text>
  <rect x="305" y="188" width="150" height="48" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="380" y="217" text-anchor="middle" font-size="11.5" fill="#7c2d12">任务进队列等待</text>
  <rect x="525" y="188" width="160" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="605" y="217" text-anchor="middle" font-size="11.5" fill="#14532d">建非核心线程执行</text>

  <line x1="145" y1="146" x2="145" y2="188" stroke="#334155" stroke-width="1.5" marker-end="url(#arTP)"/>
  <text x="152" y="170" font-size="10.5" fill="#15803d">是</text>
  <line x1="380" y1="146" x2="380" y2="188" stroke="#334155" stroke-width="1.5" marker-end="url(#arTP)"/>
  <text x="387" y="170" font-size="10.5" fill="#9a3412">是</text>
  <line x1="605" y1="146" x2="605" y2="188" stroke="#334155" stroke-width="1.5" marker-end="url(#arTP)"/>
  <text x="612" y="170" font-size="10.5" fill="#15803d">是</text>

  <rect x="40" y="262" width="920" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="56" y="286" font-size="12.5" font-weight="bold" fill="#0f172a">实测（corePoolSize=2 / queue=2 / maxPoolSize=4）：逐次提交、每个任务都卡住不放时冻结的池状态</text>

  <rect x="52" y="304" width="118" height="78" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="111" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">第 1 个</text>
  <text x="111" y="350" text-anchor="middle" font-size="10.5" fill="#1d4ed8">pool=1</text>
  <text x="111" y="370" text-anchor="middle" font-size="10.5" fill="#1d4ed8">queue=0</text>
  <line x1="170" y1="343" x2="180" y2="343" stroke="#334155" stroke-width="1.4" marker-end="url(#arTP)"/>
  <rect x="180" y="304" width="118" height="78" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="239" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">第 2 个</text>
  <text x="239" y="350" text-anchor="middle" font-size="10.5" fill="#1d4ed8">pool=2</text>
  <text x="239" y="370" text-anchor="middle" font-size="10.5" fill="#1d4ed8">queue=0</text>
  <line x1="298" y1="343" x2="308" y2="343" stroke="#334155" stroke-width="1.4" marker-end="url(#arTP)"/>
  <rect x="308" y="304" width="118" height="78" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="367" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">第 3 个</text>
  <text x="367" y="350" text-anchor="middle" font-size="10.5" fill="#9a3412">pool=2</text>
  <text x="367" y="370" text-anchor="middle" font-size="10.5" fill="#9a3412">queue=1</text>
  <line x1="426" y1="343" x2="436" y2="343" stroke="#334155" stroke-width="1.4" marker-end="url(#arTP)"/>
  <rect x="436" y="304" width="118" height="78" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="495" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">第 4 个</text>
  <text x="495" y="350" text-anchor="middle" font-size="10.5" fill="#9a3412">pool=2</text>
  <text x="495" y="370" text-anchor="middle" font-size="10.5" fill="#9a3412">queue=2 满</text>
  <line x1="554" y1="343" x2="564" y2="343" stroke="#334155" stroke-width="1.4" marker-end="url(#arTP)"/>
  <rect x="564" y="304" width="118" height="78" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="623" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">第 5 个</text>
  <text x="623" y="350" text-anchor="middle" font-size="10.5" fill="#166534">pool=3</text>
  <text x="623" y="370" text-anchor="middle" font-size="10.5" fill="#166534">queue=2</text>
  <line x1="682" y1="343" x2="692" y2="343" stroke="#334155" stroke-width="1.4" marker-end="url(#arTP)"/>
  <rect x="692" y="304" width="118" height="78" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="751" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">第 6 个</text>
  <text x="751" y="350" text-anchor="middle" font-size="10.5" fill="#166534">pool=4</text>
  <text x="751" y="370" text-anchor="middle" font-size="10.5" fill="#166534">到 max</text>
  <line x1="810" y1="343" x2="820" y2="343" stroke="#334155" stroke-width="1.4" marker-end="url(#arTPR)"/>
  <rect x="820" y="304" width="118" height="78" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="879" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">第 7 个</text>
  <text x="879" y="350" text-anchor="middle" font-size="10.5" fill="#b91c1c">被拒绝</text>
  <text x="879" y="370" text-anchor="middle" font-size="10.5" fill="#b91c1c">RejectedExecution</text>

  <text x="56" y="414" font-size="11.5" fill="#334155">第 1、2 个走「建核心线程」；第 3、4 个先入队（队列优先，此时线程仍停在 core=2）；第 5、6 个队列已满才把线程扩到 max=4。</text>
  <text x="56" y="438" font-size="11.5" fill="#334155">第 7 个：核心满 + 队列满 + 线程到顶，三步都过不去 → 交给 handler 执行拒绝策略。</text>
  <text x="56" y="462" font-size="11.5" fill="#64748b">⚠️ 换成无界队列（LinkedBlockingQueue 默认 Integer.MAX_VALUE），队列永远填不满 → 线程数停在 corePoolSize，max 形同虚设。</text>
</svg>
