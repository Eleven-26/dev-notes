<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arOm" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">重量级锁背后的 ObjectMonitor 与它的三个队列</text>
  <text x="40" y="58" font-size="13" fill="#64748b">Mark Word 末位 10 指向 ObjectMonitor；wait()/notify() 操作的是同一个 monitor 的 _EntryList 与 _WaitSet</text>

  <rect x="100" y="98" width="180" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="190" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">线程申请锁</text>
  <text x="190" y="142" text-anchor="middle" font-size="10.5" fill="#475569">synchronized (obj)</text>

  <rect x="60" y="250" width="200" height="70" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="160" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">_EntryList</text>
  <text x="160" y="302" text-anchor="middle" font-size="10.5" fill="#9a3412">等待竞争锁的线程（阻塞）</text>

  <rect x="400" y="250" width="200" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="500" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">_owner</text>
  <text x="500" y="302" text-anchor="middle" font-size="10.5" fill="#1d4ed8">当前持有锁的线程（谁拿到写谁）</text>

  <rect x="740" y="250" width="200" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="840" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">_WaitSet</text>
  <text x="840" y="302" text-anchor="middle" font-size="10.5" fill="#b91c1c">调用过 wait() 的线程</text>

  <line x1="180" y1="154" x2="180" y2="250" stroke="#334155" stroke-width="1.5" marker-end="url(#arOm)"/>
  <text x="192" y="205" font-size="11" fill="#64748b">抢不到锁 → 阻塞入队</text>
  <line x1="260" y1="270" x2="400" y2="270" stroke="#334155" stroke-width="1.5" marker-end="url(#arOm)"/>
  <text x="278" y="262" font-size="11" fill="#334155">获得锁</text>
  <line x1="600" y1="290" x2="740" y2="290" stroke="#334155" stroke-width="1.5" marker-end="url(#arOm)"/>
  <text x="600" y="282" font-size="11" fill="#b91c1c">wait()：释放锁 + 挪入</text>

  <path d="M840,320 L840,410 L160,410 L160,320" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arOm)"/>
  <text x="410" y="402" font-size="11" fill="#334155">notify()：挪回 _EntryList 重新竞争</text>

  <text x="440" y="130" font-size="11" fill="#1d4ed8">_owner 空时，_EntryList 里的线程可直接竞争</text>

  <rect x="40" y="452" width="920" height="118" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="56" y="478" font-size="12" fill="#0f172a">⭐ 这解释了 wait/notify 与 synchronized 的关系：wait() 把线程从 _EntryList 挪到 _WaitSet 并释放锁；notify() 把它挪回 _EntryList 重新竞争。</text>
  <text x="56" y="504" font-size="12" fill="#0f172a">所以 wait/notify 必须在 synchronized 块里调用（否则抛 IllegalMonitorStateException）—— 它们操作的是同一个 monitor。</text>
  <text x="56" y="530" font-size="12" fill="#dc2626">⚠️ synchronized 只有一个 wait set，notifyAll 会把所有等待者一起唤醒再重新竞争；ReentrantLock 可 newCondition() 定向唤醒。</text>
  <text x="56" y="556" font-size="11.5" fill="#64748b">对象头 12 字节 = Mark Word 8 + Klass Pointer 4；Mark Word 末两位区分锁状态，与 GC 分代年龄共用同一段空间。</text>
</svg>
