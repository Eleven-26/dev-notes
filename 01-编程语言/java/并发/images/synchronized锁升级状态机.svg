<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arLk" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">synchronized 的锁升级状态机</text>
  <text x="40" y="58" font-size="13" fill="#64748b">按竞争程度逐级升价；JDK 8 实现里这条路径单向不可逆，状态由对象头 Mark Word 末两位区分</text>

  <rect x="60" y="100" width="300" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="210" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">① 无锁</text>
  <text x="210" y="150" text-anchor="middle" font-size="11" fill="#475569">Mark Word 末位 01</text>

  <rect x="60" y="210" width="300" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">② 偏向锁</text>
  <text x="210" y="260" text-anchor="middle" font-size="11" fill="#1d4ed8">末位 01（后三位 101）</text>

  <rect x="60" y="320" width="300" height="64" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="210" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">③ 轻量级锁</text>
  <text x="210" y="370" text-anchor="middle" font-size="11" fill="#9a3412">末位 00 · 指向栈上锁记录</text>

  <rect x="60" y="430" width="300" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="210" y="456" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">④ 重量级锁</text>
  <text x="210" y="480" text-anchor="middle" font-size="11" fill="#b91c1c">末位 10 · 指向 ObjectMonitor</text>

  <line x1="210" y1="164" x2="210" y2="210" stroke="#334155" stroke-width="1.6" marker-end="url(#arLk)"/>
  <text x="232" y="184" font-size="12" fill="#334155">首次加锁 · CAS 记线程 ID</text>
  <line x1="210" y1="274" x2="210" y2="320" stroke="#334155" stroke-width="1.6" marker-end="url(#arLk)"/>
  <text x="232" y="294" font-size="12" fill="#334155">第二线程竞争 · CAS 抢栈上锁记录</text>
  <line x1="210" y1="384" x2="210" y2="430" stroke="#334155" stroke-width="1.6" marker-end="url(#arLk)"/>
  <text x="232" y="404" font-size="12" fill="#334155">自旋失败 / 竞争加剧</text>

  <text x="520" y="118" font-size="12.5" font-weight="bold" fill="#0f172a">各阶段的适用与代价</text>
  <text x="520" y="146" font-size="12" fill="#2563eb">偏向锁：同一线程反复加锁，之后进出零 CAS</text>
  <text x="520" y="172" font-size="12" fill="#b45309">轻量级锁：竞争轻微、临界区极短，加解锁各一次 CAS + 自旋</text>
  <text x="520" y="198" font-size="12" fill="#dc2626">重量级锁：竞争激烈，用户态→内核态，进 _EntryList 阻塞</text>
  <text x="520" y="224" font-size="12" fill="#64748b">末位 11 是 GC 标记，不参与升级</text>

  <text x="520" y="272" font-size="12" fill="#0f172a">默认参数（-XX:+PrintFlagsFinal 本机实测）：</text>
  <text x="520" y="298" font-size="11.5" fill="#334155">UseBiasedLocking = true（JDK 8 默认开偏向）</text>
  <text x="520" y="322" font-size="11.5" fill="#334155">BiasedLockingStartupDelay = 4000（启动后延迟 4 秒启用）</text>
  <text x="520" y="346" font-size="11.5" fill="#334155">BulkRebiasThreshold = 20 / BulkRevokeThreshold = 40</text>
  <text x="520" y="372" font-size="11" fill="#64748b">同类对象撤销偏向超 20 次批量重偏向、超 40 次批量撤销</text>

  <rect x="40" y="520" width="920" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="56" y="544" font-size="12" fill="#7f1d1d">⚠️ 锁升级不可逆（JDK 8 实现）：一旦升到重量级就不会降回去，偶发一次高竞争让这个对象之后一直付重量级代价。</text>
  <text x="56" y="568" font-size="12" fill="#7f1d1d">版本演进：JDK 15 起 UseBiasedLocking 默认改 false（JEP 374 废弃），JDK 18 正式移除 —— 只有 JDK 8 用户才需考虑偏向锁。</text>
</svg>
