<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="e1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="e2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">任务抛异常时 execute 与 submit 的两条流转</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">同一个「卡住 + 抛 RuntimeException」的任务，交给线程池后异常走的是两条完全不同的路（JDK 1.8.0_321 实测）</text>

  <text x="40" y="90" font-size="13" font-weight="bold" fill="#b91c1c">execute(Runnable) 路径</text>
  <rect x="40" y="98" width="160" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="120" y="120" text-anchor="middle" font-size="11.5" fill="#1e3a8a">提交线程</text>
  <text x="120" y="141" text-anchor="middle" font-size="11.5" fill="#1d4ed8">execute(task)</text>
  <rect x="230" y="98" width="160" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="310" y="120" text-anchor="middle" font-size="11.5" fill="#0f172a">任务入队</text>
  <text x="310" y="141" text-anchor="middle" font-size="11.5" fill="#64748b">workQueue</text>
  <rect x="420" y="98" width="160" height="62" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="120" text-anchor="middle" font-size="11.5" fill="#7c2d12">worker 执行</text>
  <text x="500" y="141" text-anchor="middle" font-size="11.5" fill="#9a3412">runWorker 抛出</text>
  <rect x="610" y="98" width="160" height="62" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="690" y="120" text-anchor="middle" font-size="11.5" fill="#7f1d1d">异常冒到</text>
  <text x="690" y="141" text-anchor="middle" font-size="10" fill="#b91c1c">UncaughtExceptionHandler</text>
  <rect x="800" y="98" width="160" height="62" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="880" y="120" text-anchor="middle" font-size="11.5" fill="#7f1d1d">线程死亡</text>
  <text x="880" y="141" text-anchor="middle" font-size="11.5" fill="#b91c1c">被新线程替换</text>

  <line x1="200" y1="129" x2="230" y2="129" stroke="#334155" stroke-width="1.5" marker-end="url(#e1)"/>
  <line x1="390" y1="129" x2="420" y2="129" stroke="#334155" stroke-width="1.5" marker-end="url(#e1)"/>
  <line x1="580" y1="129" x2="610" y2="129" stroke="#dc2626" stroke-width="1.5" marker-end="url(#e2)"/>
  <line x1="770" y1="129" x2="800" y2="129" stroke="#dc2626" stroke-width="1.5" marker-end="url(#e2)"/>

  <text x="40" y="196" font-size="13" font-weight="bold" fill="#15803d">submit(...) 路径</text>
  <rect x="40" y="204" width="160" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="120" y="226" text-anchor="middle" font-size="11.5" fill="#1e3a8a">提交线程</text>
  <text x="120" y="247" text-anchor="middle" font-size="11.5" fill="#1d4ed8">submit→Future</text>
  <rect x="230" y="204" width="160" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="310" y="226" text-anchor="middle" font-size="11.5" fill="#0f172a">包成 FutureTask</text>
  <text x="310" y="247" text-anchor="middle" font-size="11.5" fill="#64748b">入队执行</text>
  <rect x="420" y="204" width="160" height="62" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="226" text-anchor="middle" font-size="11.5" fill="#7c2d12">异常被捕获</text>
  <text x="500" y="247" text-anchor="middle" font-size="11.5" fill="#9a3412">存进 outcome</text>
  <rect x="610" y="204" width="160" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="690" y="226" text-anchor="middle" font-size="11.5" fill="#14532d">什么都不打印</text>
  <text x="690" y="247" text-anchor="middle" font-size="11.5" fill="#166534">线程正常复用</text>
  <rect x="800" y="204" width="160" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="880" y="226" text-anchor="middle" font-size="11.5" fill="#14532d">只有 get()</text>
  <text x="880" y="247" text-anchor="middle" font-size="11.5" fill="#166534">才抛出异常</text>

  <line x1="200" y1="235" x2="230" y2="235" stroke="#334155" stroke-width="1.5" marker-end="url(#e1)"/>
  <line x1="390" y1="235" x2="420" y2="235" stroke="#334155" stroke-width="1.5" marker-end="url(#e1)"/>
  <line x1="580" y1="235" x2="610" y2="235" stroke="#16a34a" stroke-width="1.5" marker-end="url(#e1)"/>
  <line x1="770" y1="235" x2="800" y2="235" stroke="#16a34a" stroke-width="1.5" marker-end="url(#e1)"/>

  <rect x="20" y="286" width="960" height="166" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="312" font-size="12.5" font-weight="bold" fill="#0f172a">实测读数与判据</text>
  <text x="36" y="338" font-size="11.5" fill="#334155">execute：stderr 打出 "Exception in thread w-0"，堆栈走到 runWorker(ThreadPoolExecutor.java:1149)；执行后 poolSize=1（线程死掉又被补上，线程名会变）。</text>
  <text x="36" y="362" font-size="11.5" fill="#334155">submit：future.isDone=true、poolSize=1（线程没死，照常复用）；异常静静躺在 outcome 里，只有 f.get() 才抛出，真正的异常在 getCause()。</text>
  <text x="36" y="392" font-size="12" fill="#0f172a">⭐ 判据：不关心结果、只要日志看得见异常 → execute；要拿返回值 → submit，但用了 submit 就必须处理 Future（get 或 catch）。</text>
  <text x="36" y="418" font-size="12" fill="#0f172a">⚠️ 「用了 submit 却从不 get」＝异常静默消失，这是线程池最难查的一类线上问题。</text>
  <text x="36" y="442" font-size="11.5" fill="#64748b">Error（如 OutOfMemoryError）该让线程死掉；InterruptedException 应恢复中断标志后干净退出，别在 catch 里吞掉。</text>
</svg>
