<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 476" width="1000" height="476" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="j1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="j2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="476" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">JMM 抽象模型：主内存 / 工作内存快照与屏障插入点</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">JMM 不描述硬件，而是「划底线」—— 无同步措施时，一个线程的写不保证何时被另一个线程看到</text>

  <rect x="30" y="126" width="270" height="118" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="46" y="150" font-size="12" font-weight="bold" fill="#0f172a">线程 A 的工作内存</text>
  <text x="46" y="176" font-size="10.5" fill="#334155">寄存器 / L1、L2 缓存</text>
  <text x="46" y="200" font-size="10.5" fill="#334155">Store Buffer（写先落这里）</text>
  <text x="46" y="224" font-size="10.5" fill="#64748b">写不保证立刻刷到主内存</text>

  <rect x="390" y="160" width="200" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="490" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">主内存</text>
  <text x="490" y="200" text-anchor="middle" font-size="10.5" fill="#1d4ed8">（对应堆内存）</text>

  <rect x="690" y="126" width="280" height="118" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="706" y="150" font-size="12" font-weight="bold" fill="#0f172a">线程 B 的工作内存</text>
  <text x="706" y="176" font-size="10.5" fill="#334155">Invalidate Queue（失效先排队）</text>
  <text x="706" y="200" font-size="10.5" fill="#334155">volatile 读：每次从主内存读</text>
  <text x="706" y="224" font-size="10.5" fill="#64748b">不吃寄存器里的旧值</text>

  <line x1="300" y1="185" x2="390" y2="185" stroke="#334155" stroke-width="1.6" marker-end="url(#j1)"/>
  <text x="345" y="177" text-anchor="middle" font-size="10.5" fill="#0f172a">volatile 写</text>
  <text x="345" y="210" text-anchor="middle" font-size="9.5" fill="#1d4ed8">StoreStore·StoreLoad</text>
  <line x1="590" y1="185" x2="690" y2="185" stroke="#dc2626" stroke-width="1.6" marker-end="url(#j2)"/>
  <text x="640" y="177" text-anchor="middle" font-size="10.5" fill="#b91c1c">缓存行失效</text>

  <text x="30" y="272" font-size="11" fill="#334155">真正的硬件比模型复杂：Store Buffer + Invalidate Queue + 编译器重排，三者叠加就是「代码写在前面、别的线程却看不到」的根源。</text>

  <text x="30" y="298" font-size="12" font-weight="bold" fill="#0f172a">volatile 在字节码层用四种内存屏障实现：</text>
  <rect x="30" y="308" width="225" height="78" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="142" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">StoreStore</text>
  <text x="142" y="354" text-anchor="middle" font-size="10.5" fill="#166534">前面的写先于后面的写</text>
  <text x="142" y="374" text-anchor="middle" font-size="10.5" fill="#166534">插在 volatile 写之前</text>
  <rect x="265" y="308" width="225" height="78" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="377" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">StoreLoad（最贵）</text>
  <text x="377" y="354" text-anchor="middle" font-size="10.5" fill="#b91c1c">前面的写先于后面的读</text>
  <text x="377" y="374" text-anchor="middle" font-size="10.5" fill="#b91c1c">插在 volatile 写之后</text>
  <rect x="500" y="308" width="225" height="78" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="612" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">LoadLoad</text>
  <text x="612" y="354" text-anchor="middle" font-size="10.5" fill="#166534">前面的读先于后面的读</text>
  <text x="612" y="374" text-anchor="middle" font-size="10.5" fill="#166534">插在 volatile 读之后</text>
  <rect x="735" y="308" width="225" height="78" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="847" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">LoadStore</text>
  <text x="847" y="354" text-anchor="middle" font-size="10.5" fill="#334155">前面的读先于后面的写</text>
  <text x="847" y="374" text-anchor="middle" font-size="10.5" fill="#64748b">表中未指定插入点</text>

  <rect x="20" y="400" width="960" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="424" font-size="11.5" fill="#334155">x86 是强内存模型（只允许 StoreLoad 重排），StoreLoad 靠 lock addl 清空 Store Buffer 实现 —— 所以 volatile 写比读更贵。</text>
  <text x="36" y="448" font-size="11.5" fill="#64748b">ARM 是弱内存模型（四种都可能重排），同一份代码往往需要更多屏障，volatile 在 ARM 上开销比 x86 明显。</text>
</svg>
