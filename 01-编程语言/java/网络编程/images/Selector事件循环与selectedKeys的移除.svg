<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="376" viewBox="0 0 1000 376" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="1000" height="376" fill="#ffffff"/>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#0f172a">Selector 的事件循环：处理完必须把 key 移除</text>
  <text x="40" y="58" font-size="12" fill="#64748b">selectedKeys() 返回的是内部集合的引用，Selector 只往里加，不会替你清</text>

  <rect x="40" y="76" width="920" height="200" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- 步骤 1 -->
  <rect x="62" y="100" width="150" height="58" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="137" y="122" text-anchor="middle" font-size="10" fill="#64748b">① Channel</text>
  <text x="137" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">注册关注事件</text>

  <!-- 步骤 2 -->
  <rect x="232" y="100" width="150" height="58" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="307" y="122" text-anchor="middle" font-size="10" fill="#64748b">② Selector</text>
  <text x="307" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">select() 阻塞等待</text>

  <!-- 步骤 3 -->
  <rect x="402" y="100" width="150" height="58" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="477" y="122" text-anchor="middle" font-size="10" fill="#64748b">③ 就绪集合</text>
  <text x="477" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">selectedKeys()</text>

  <!-- 步骤 4 -->
  <rect x="572" y="100" width="150" height="58" rx="6" fill="#1e40af" stroke="#1e3a8a"/>
  <text x="647" y="122" text-anchor="middle" font-size="10" fill="#bfdbfe">④ 逐个处理</text>
  <text x="647" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">accept / read / write</text>

  <!-- 步骤 5 -->
  <rect x="742" y="100" width="150" height="58" rx="6" fill="#0f766e" stroke="#115e59"/>
  <text x="817" y="122" text-anchor="middle" font-size="10" fill="#a7f3d0">⑤ 必须做</text>
  <text x="817" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">it.remove()</text>

  <!-- 正向箭头 -->
  <path d="M 212 129 L 232 129" stroke="#94a3b8" stroke-width="1.6"/>
  <path d="M 228 129 l -7 -4 l 0 8 z" fill="#94a3b8"/>
  <path d="M 382 129 L 402 129" stroke="#94a3b8" stroke-width="1.6"/>
  <path d="M 398 129 l -7 -4 l 0 8 z" fill="#94a3b8"/>
  <path d="M 552 129 L 572 129" stroke="#94a3b8" stroke-width="1.6"/>
  <path d="M 568 129 l -7 -4 l 0 8 z" fill="#94a3b8"/>
  <path d="M 722 129 L 742 129" stroke="#94a3b8" stroke-width="1.6"/>
  <path d="M 738 129 l -7 -4 l 0 8 z" fill="#94a3b8"/>

  <!-- 回路：⑤ -> ② -->
  <path d="M 817 158 L 817 196 L 307 196 L 307 158" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M 307 158 l -5 8 l 10 0 z" fill="#94a3b8"/>
  <text x="562" y="190" text-anchor="middle" font-size="11" fill="#64748b">下一轮：同一个 Selector 继续等</text>

  <!-- 警示 -->
  <rect x="40" y="296" width="920" height="56" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="60" y="320" font-size="12" font-weight="700" fill="#b91c1c">漏掉 it.remove()：同一个 key 每轮被重复处理</text>
  <text x="60" y="340" font-size="11" fill="#991b1b">表现为 CPU 空转、日志重复，而且不抛异常 —— 是 NIO 里最难发现的一类 bug</text>
</svg>
