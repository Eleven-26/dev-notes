<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arFJ" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arFJs" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">工作窃取：每个 worker 一个双端队列，空闲者去别人队尾偷</text>
  <text x="40" y="56" font-size="13" fill="#64748b">自己 fork 出的子任务压在自己队首；join 等的过程中先帮别人干活，再回来收结果</text>

  <rect x="32" y="84" width="936" height="316" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="110" font-size="11" fill="#64748b">队首（自己取 / 压）</text>
  <text x="720" y="110" font-size="11" fill="#64748b">队尾（别人偷）</text>

  <rect x="52" y="122" width="96" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="100" y="147" font-size="11.5" text-anchor="middle" fill="#1e3a8a">worker-1</text>
  <rect x="160" y="122" width="120" height="40" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="220" y="147" font-size="10.5" text-anchor="middle" fill="#1e40af">task A</text>
  <rect x="286" y="122" width="120" height="40" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="346" y="147" font-size="10.5" text-anchor="middle" fill="#1e40af">task B</text>
  <rect x="412" y="122" width="120" height="40" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="472" y="147" font-size="10.5" text-anchor="middle" fill="#1e40af">task C</text>
  <rect x="538" y="122" width="150" height="40" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="613" y="147" font-size="10" text-anchor="middle" fill="#64748b">队尾空位</text>

  <rect x="52" y="182" width="96" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="100" y="207" font-size="11.5" text-anchor="middle" fill="#1e3a8a">worker-2</text>
  <rect x="160" y="182" width="120" height="40" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="220" y="207" font-size="10.5" text-anchor="middle" fill="#1e40af">task D</text>
  <rect x="286" y="182" width="150" height="40" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="361" y="207" font-size="10" text-anchor="middle" fill="#64748b">队尾空位</text>

  <rect x="52" y="262" width="96" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="100" y="287" font-size="11.5" text-anchor="middle" fill="#14532d">worker-3</text>
  <rect x="160" y="262" width="300" height="40" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="310" y="287" font-size="10" text-anchor="middle" fill="#15803d">自己的队列空了 → 去找别人偷</text>

  <rect x="52" y="322" width="96" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="100" y="347" font-size="11.5" text-anchor="middle" fill="#14532d">worker-4</text>
  <rect x="160" y="322" width="300" height="40" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="310" y="347" font-size="10" text-anchor="middle" fill="#15803d">同上：偷的是队尾那个「最老」的任务</text>

  <polyline points="160,282 120,282 120,166 534,166" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arFJ)"/>
  <text x="150" y="240" font-size="10" fill="#b91c1c">偷 task C</text>
  <polyline points="460,282 460,226 286,226" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arFJ)"/>
  <text x="466" y="252" font-size="10" fill="#b91c1c">偷 task D</text>

  <line x1="160" y1="374" x2="700" y2="374" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="52" y="392" font-size="10.5" fill="#475569">join 的语义：任务没完成时，worker 不会干等 —— 它会转去执行别人队列里的任务，等目标完成再回来</text>

  <rect x="32" y="412" width="936" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="438" font-size="11.5" font-weight="bold" fill="#0f172a">要点：切分（fork）与偷取（steal）是两件事</text>
  <text x="52" y="462" font-size="10.5" fill="#334155">fork 决定「任务切成几块、压在哪」；偷取决定「块分得不均匀时，空闲线程能不能补位」</text>
  <text x="52" y="486" font-size="10.5" fill="#b91c1c">所以 ForkJoin 适合「能递归切分、且切完大小不均」的计算；均衡的独立任务用普通线程池就能干</text>
</svg>
