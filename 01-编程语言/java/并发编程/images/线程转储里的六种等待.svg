<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">线程转储里六种等待：首行、状态、样本</text>
  <text x="40" y="56" font-size="13" fill="#64748b">前五列全部取自本篇 JDK 24 实测的同一批转储；首行相同不代表原因相同</text>

  <rect x="32" y="84" width="936" height="32" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="48" y="105" font-size="11" font-weight="bold" fill="#0f172a">转储首行</text>
  <text x="280" y="105" font-size="11" font-weight="bold" fill="#0f172a">Thread.State</text>
  <text x="478" y="105" font-size="11" font-weight="bold" fill="#0f172a">实测样本（JDK 24.0.2）</text>
  <text x="812" y="105" font-size="11" font-weight="bold" fill="#0f172a">该怀疑什么</text>

  <rect x="32" y="120" width="936" height="50" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="48" y="150" font-size="10" fill="#7f1d1d">waiting for monitor entry</text>
  <text x="280" y="150" font-size="10" fill="#334155">BLOCKED (on object monitor)</text>
  <text x="478" y="150" font-size="9.5" fill="#334155">- waiting to lock &lt;0x…&gt; (a java.lang.Object)</text>
  <text x="812" y="150" font-size="10" fill="#b91c1c">死锁或临界区过长</text>

  <rect x="32" y="176" width="936" height="50" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="48" y="206" font-size="10" fill="#7c2d12">waiting on condition</text>
  <text x="280" y="206" font-size="10" fill="#334155">WAITING (parking)</text>
  <text x="478" y="206" font-size="9.5" fill="#334155">parking to wait for &lt;0x…&gt; (a FutureTask)</text>
  <text x="812" y="206" font-size="10" fill="#b91c1c">在等排在自己后面的任务</text>

  <rect x="32" y="232" width="936" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="48" y="262" font-size="10" fill="#334155">in Object.wait()</text>
  <text x="280" y="262" font-size="10" fill="#334155">WAITING (on object monitor)</text>
  <text x="478" y="262" font-size="9.5" fill="#334155">at java.lang.Object.wait0(Native Method)</text>
  <text x="812" y="262" font-size="10" fill="#b45309">等 notify，可能永远等不到</text>

  <rect x="32" y="288" width="936" height="50" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="48" y="318" font-size="10" fill="#14532d">sleeping</text>
  <text x="280" y="318" font-size="10" fill="#334155">TIMED_WAITING (sleeping)</text>
  <text x="478" y="318" font-size="9.5" fill="#334155">at java.lang.Thread.sleepNanos0(Native Method)</text>
  <text x="812" y="318" font-size="10" fill="#15803d">正常；请求路径里就要问为什么</text>

  <rect x="32" y="344" width="936" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="48" y="374" font-size="10" fill="#334155">runnable</text>
  <text x="280" y="374" font-size="10" fill="#334155">RUNNABLE</text>
  <text x="478" y="374" font-size="9.5" fill="#334155">at java.lang.ref.Reference.waitForReferencePendingList</text>
  <text x="812" y="374" font-size="10" fill="#b45309">看 cpu= 累计值涨不涨</text>

  <rect x="32" y="400" width="936" height="50" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="48" y="430" font-size="10" fill="#7c2d12">waiting on condition</text>
  <text x="280" y="430" font-size="10" fill="#334155">WAITING (parking)</text>
  <text x="478" y="430" font-size="9.5" fill="#334155">parking to wait for &lt;0x…&gt; (a ReentrantLock$NonfairSync)</text>
  <text x="812" y="430" font-size="10" fill="#b91c1c">在等一把 ReentrantLock</text>

  <rect x="32" y="462" width="936" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="486" font-size="11.5" font-weight="bold" fill="#0f172a">要点：第 2 行与第 6 行的首行与状态完全一样，区别只在「在等什么东西」</text>
  <text x="52" y="510" font-size="10.5" fill="#334155">所以扫转储不能只按状态分组，要顺着 waiting to lock / parking to wait for 后面的对象类型往下看</text>
  <text x="52" y="530" font-size="10.5" fill="#b91c1c">BLOCKED 与 WAITING 的分界：等 monitor 是 BLOCKED，等同步器（AQS）是 WAITING</text>
</svg>
