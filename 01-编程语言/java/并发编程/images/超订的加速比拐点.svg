<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">超订加速比：拐点在核数处，之后是一条平线</text>
  <text x="40" y="56" font-size="13" fill="#64748b">8 核机器上跑纯 CPU 任务，worker 从 1 加到 64，加速比停在 7.4~7.6 倍</text>

  <rect x="32" y="84" width="936" height="360" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <line x1="120" y1="400" x2="900" y2="400" stroke="#94a3b8" stroke-width="1"/>
  <line x1="120" y1="120" x2="120" y2="400" stroke="#94a3b8" stroke-width="1"/>

  <line x1="120" y1="330" x2="900" y2="330" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="120" y1="260" x2="900" y2="260" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="120" y1="190" x2="900" y2="190" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="120" y1="120" x2="900" y2="120" stroke="#e2e8f0" stroke-width="1"/>

  <text x="110" y="404" font-size="9.5" text-anchor="end" fill="#64748b">0</text>
  <text x="110" y="334" font-size="9.5" text-anchor="end" fill="#64748b">2x</text>
  <text x="110" y="264" font-size="9.5" text-anchor="end" fill="#64748b">4x</text>
  <text x="110" y="194" font-size="9.5" text-anchor="end" fill="#64748b">6x</text>
  <text x="110" y="124" font-size="9.5" text-anchor="end" fill="#64748b">8x</text>

  <line x1="380" y1="120" x2="380" y2="400" stroke="#b91c1c" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="386" y="140" font-size="10" fill="#b91c1c">核数 = 8，拐点在这</text>

  <polyline points="120,365 250,323 380,141 510,141 640,141 770,134" fill="none" stroke="#2563eb" stroke-width="2.2"/>

  <circle cx="120" cy="365" r="4.5" fill="#2563eb"/>
  <circle cx="250" cy="323" r="4.5" fill="#2563eb"/>
  <circle cx="380" cy="141" r="4.5" fill="#2563eb"/>
  <circle cx="510" cy="141" r="4.5" fill="#2563eb"/>
  <circle cx="640" cy="141" r="4.5" fill="#2563eb"/>
  <circle cx="770" cy="134" r="4.5" fill="#2563eb"/>

  <text x="120" y="388" font-size="10" text-anchor="middle" fill="#1e3a8a">1.0x</text>
  <text x="250" y="346" font-size="10" text-anchor="middle" fill="#1e3a8a">2.2x</text>
  <text x="380" y="164" font-size="10" text-anchor="middle" fill="#1e3a8a">7.4x</text>
  <text x="510" y="164" font-size="10" text-anchor="middle" fill="#1e3a8a">7.4x</text>
  <text x="640" y="164" font-size="10" text-anchor="middle" fill="#1e3a8a">7.4x</text>
  <text x="770" y="157" font-size="10" text-anchor="middle" fill="#1e3a8a">7.6x</text>

  <text x="120" y="424" font-size="10" text-anchor="middle" fill="#64748b">1 worker</text>
  <text x="250" y="424" font-size="10" text-anchor="middle" fill="#64748b">2</text>
  <text x="380" y="424" font-size="10" text-anchor="middle" fill="#64748b">8（核数）</text>
  <text x="510" y="424" font-size="10" text-anchor="middle" fill="#64748b">16</text>
  <text x="640" y="424" font-size="10" text-anchor="middle" fill="#64748b">32</text>
  <text x="770" y="424" font-size="10" text-anchor="middle" fill="#64748b">64</text>

  <text x="500" y="96" font-size="10.5" fill="#475569">两轮读数：2697~2703 / 1224~1226 / 364~365 / 353~398 / 357~382 / 356~360 ms</text>

  <rect x="32" y="456" width="936" height="88" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="482" font-size="11" font-weight="bold" fill="#0f172a">要点：CPU 密集型任务的线程数定在核数就够，超过既不加速也不明显变慢</text>
  <text x="52" y="508" font-size="10" fill="#334155">平线说明这段时间在切换与排队上白花力气；只有 IO 密集型（线程在等）才需要远超核数的线程数</text>
</svg>
