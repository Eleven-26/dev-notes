<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arVT" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">虚拟线程是任务，载体线程才是执行者</text>
  <text x="40" y="58" font-size="13" fill="#64748b">N 个虚拟线程在 M 个载体上轮流挂载；本机 M = 4（CPU 数），N 可以到十万</text>

  <rect x="40" y="84" width="920" height="116" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="56" y="108" font-size="12" font-weight="bold" fill="#1e3a8a">虚拟线程（用户态任务）：数量可以很大</text>
  <rect x="56" y="122" width="110" height="60" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="111" y="158" text-anchor="middle" font-size="11" fill="#1e3a8a">VT-1</text>
  <rect x="182" y="122" width="110" height="60" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="237" y="158" text-anchor="middle" font-size="11" fill="#1e3a8a">VT-2</text>
  <rect x="308" y="122" width="110" height="60" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="363" y="158" text-anchor="middle" font-size="11" fill="#1e3a8a">VT-3</text>
  <rect x="434" y="122" width="110" height="60" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="489" y="158" text-anchor="middle" font-size="11" fill="#1e3a8a">VT-4</text>
  <rect x="560" y="122" width="110" height="60" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="615" y="158" text-anchor="middle" font-size="11" fill="#1e3a8a">VT-5</text>
  <rect x="686" y="122" width="110" height="60" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="741" y="158" text-anchor="middle" font-size="11" fill="#1e3a8a">VT-6</text>
  <rect x="812" y="122" width="132" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="878" y="158" text-anchor="middle" font-size="10.5" fill="#1e3a8a">… 共十万个</text>

  <line x1="500" y1="200" x2="500" y2="236" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arVT)"/>

  <rect x="240" y="238" width="520" height="80" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="256" y="264" font-size="12" font-weight="bold" fill="#7c2d12">虚拟线程调度器（ForkJoinPool）</text>
  <text x="256" y="288" font-size="10.5" fill="#9a3412">parallelism 默认 = CPU 数（本机 4）；提交或唤醒的虚拟线程在这里排队</text>

  <line x1="300" y1="318" x2="160" y2="370" stroke="#334155" stroke-width="1.5" marker-end="url(#arVT)"/>
  <line x1="433" y1="318" x2="384" y2="370" stroke="#334155" stroke-width="1.5" marker-end="url(#arVT)"/>
  <line x1="567" y1="318" x2="608" y2="370" stroke="#334155" stroke-width="1.5" marker-end="url(#arVT)"/>
  <line x1="700" y1="318" x2="832" y2="370" stroke="#334155" stroke-width="1.5" marker-end="url(#arVT)"/>

  <rect x="60" y="372" width="200" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="160" y="398" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">载体线程 1</text>
  <text x="160" y="420" text-anchor="middle" font-size="10" fill="#166534">平台线程 / 内核 task</text>
  <rect x="284" y="372" width="200" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="384" y="398" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">载体线程 2</text>
  <text x="384" y="420" text-anchor="middle" font-size="10" fill="#166534">平台线程 / 内核 task</text>
  <rect x="508" y="372" width="200" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="608" y="398" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">载体线程 3</text>
  <text x="608" y="420" text-anchor="middle" font-size="10" fill="#166534">平台线程 / 内核 task</text>
  <rect x="732" y="372" width="200" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="832" y="398" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">载体线程 4</text>
  <text x="832" y="420" text-anchor="middle" font-size="10" fill="#166534">平台线程 / 内核 task</text>

  <line x1="160" y1="436" x2="160" y2="466" stroke="#334155" stroke-width="1.5" marker-end="url(#arVT)"/>
  <line x1="384" y1="436" x2="384" y2="466" stroke="#334155" stroke-width="1.5" marker-end="url(#arVT)"/>
  <line x1="608" y1="436" x2="608" y2="466" stroke="#334155" stroke-width="1.5" marker-end="url(#arVT)"/>
  <line x1="832" y1="436" x2="832" y2="466" stroke="#334155" stroke-width="1.5" marker-end="url(#arVT)"/>

  <rect x="40" y="468" width="920" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="56" y="502" font-size="11" font-weight="bold" fill="#0f172a">内核侧只有 4 个 task：M:N 映射里的 N 就是载体数，十万个虚拟线程不会创建十万个内核线程</text>
</svg>
