<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arTree" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">一次 trySplit 只切出一半，树长到叶子才轮到计算</text>
  <text x="40" y="56" font-size="13" fill="#64748b">左：10 000 000 个 int 的求和任务被逐层对半切开；右：切出来的块由 3 个 worker 加调用线程一起吃掉</text>

  <rect x="32" y="84" width="520" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="108" font-size="12" font-weight="bold" fill="#0f172a">切分：每层一分为二，块大小减半</text>

  <rect x="217" y="122" width="150" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="292" y="143" font-size="10.5" text-anchor="middle" fill="#1e3a8a">10 000 000</text>

  <rect x="112" y="184" width="140" height="32" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="182" y="205" font-size="10.5" text-anchor="middle" fill="#1e40af">5 000 000</text>
  <rect x="332" y="184" width="140" height="32" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="402" y="205" font-size="10.5" text-anchor="middle" fill="#1e40af">5 000 000</text>

  <rect x="36" y="246" width="74" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="73" y="266" font-size="10" text-anchor="middle" fill="#1e40af">2 500 000</text>
  <rect x="182" y="246" width="74" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="219" y="266" font-size="10" text-anchor="middle" fill="#1e40af">2 500 000</text>
  <rect x="328" y="246" width="74" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="365" y="266" font-size="10" text-anchor="middle" fill="#1e40af">2 500 000</text>
  <rect x="474" y="246" width="74" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="511" y="266" font-size="10" text-anchor="middle" fill="#1e40af">2 500 000</text>

  <rect x="38" y="308" width="60" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="68" y="328" font-size="9.5" text-anchor="middle" fill="#1e40af">1 250 000</text>
  <rect x="102" y="308" width="60" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="132" y="328" font-size="9.5" text-anchor="middle" fill="#1e40af">1 250 000</text>
  <rect x="166" y="308" width="60" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="196" y="328" font-size="9.5" text-anchor="middle" fill="#1e40af">1 250 000</text>
  <rect x="230" y="308" width="60" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="260" y="328" font-size="9.5" text-anchor="middle" fill="#1e40af">1 250 000</text>
  <rect x="294" y="308" width="60" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="324" y="328" font-size="9.5" text-anchor="middle" fill="#1e40af">1 250 000</text>
  <rect x="358" y="308" width="60" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="388" y="328" font-size="9.5" text-anchor="middle" fill="#1e40af">1 250 000</text>
  <rect x="422" y="308" width="60" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="452" y="328" font-size="9.5" text-anchor="middle" fill="#1e40af">1 250 000</text>
  <rect x="486" y="308" width="60" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="516" y="328" font-size="9.5" text-anchor="middle" fill="#1e40af">1 250 000</text>

  <rect x="40" y="370" width="504" height="30" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="292" y="390" font-size="10.5" text-anchor="middle" fill="#1e40af">625 000 × 16（16 块不再逐个画）</text>

  <line x1="292" y1="154" x2="182" y2="184" stroke="#64748b" stroke-width="1"/>
  <line x1="292" y1="154" x2="402" y2="184" stroke="#64748b" stroke-width="1"/>
  <line x1="182" y1="216" x2="73" y2="246" stroke="#64748b" stroke-width="1"/>
  <line x1="182" y1="216" x2="219" y2="246" stroke="#64748b" stroke-width="1"/>
  <line x1="402" y1="216" x2="365" y2="246" stroke="#64748b" stroke-width="1"/>
  <line x1="402" y1="216" x2="511" y2="246" stroke="#64748b" stroke-width="1"/>
  <line x1="73" y1="276" x2="68" y2="308" stroke="#64748b" stroke-width="1"/>
  <line x1="73" y1="276" x2="132" y2="308" stroke="#64748b" stroke-width="1"/>
  <line x1="219" y1="276" x2="196" y2="308" stroke="#64748b" stroke-width="1"/>
  <line x1="219" y1="276" x2="260" y2="308" stroke="#64748b" stroke-width="1"/>
  <line x1="365" y1="276" x2="324" y2="308" stroke="#64748b" stroke-width="1"/>
  <line x1="365" y1="276" x2="388" y2="308" stroke="#64748b" stroke-width="1"/>
  <line x1="511" y1="276" x2="452" y2="308" stroke="#64748b" stroke-width="1"/>
  <line x1="511" y1="276" x2="516" y2="308" stroke="#64748b" stroke-width="1"/>
  <line x1="68" y1="338" x2="68" y2="370" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="132" y1="338" x2="132" y2="370" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="196" y1="338" x2="196" y2="370" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="260" y1="338" x2="260" y2="370" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="324" y1="338" x2="324" y2="370" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="388" y1="338" x2="388" y2="370" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="452" y1="338" x2="452" y2="370" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="516" y1="338" x2="516" y2="370" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="52" y="426" font-size="10.5" fill="#475569">实测打印到第 4 层：10 000 000 → 5 000 000 → 2 500 000 → 1 250 000 → 625 000</text>
  <text x="52" y="448" font-size="10.5" fill="#b91c1c">阈值在哪一层被满足，树就停在哪一层；625 000 这一层再切还是 312 500，块仍远大于阈值</text>
  <text x="52" y="470" font-size="10.5" fill="#475569">切出来的叶子各自 compute()，父节点只做 fork 与 join，自己不迭代任何元素</text>

  <rect x="568" y="84" width="400" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="588" y="108" font-size="12" font-weight="bold" fill="#0f172a">谁在跑：3 个 worker 加调用线程</text>

  <rect x="588" y="150" width="82" height="34" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="629" y="171" font-size="10.5" text-anchor="middle" fill="#1e3a8a">worker-1</text>
  <rect x="676" y="150" width="128" height="34" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="740" y="171" font-size="10" text-anchor="middle" fill="#1e40af">任务 1（100 ms）</text>
  <rect x="810" y="150" width="128" height="34" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="874" y="171" font-size="10" text-anchor="middle" fill="#1e40af">任务 5（100 ms）</text>

  <rect x="588" y="200" width="82" height="34" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="629" y="221" font-size="10.5" text-anchor="middle" fill="#1e3a8a">worker-2</text>
  <rect x="676" y="200" width="128" height="34" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="740" y="221" font-size="10" text-anchor="middle" fill="#1e40af">任务 2（100 ms）</text>
  <rect x="810" y="200" width="128" height="34" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="874" y="221" font-size="10" text-anchor="middle" fill="#1e40af">任务 6（100 ms）</text>

  <rect x="588" y="250" width="82" height="34" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="629" y="271" font-size="10.5" text-anchor="middle" fill="#1e3a8a">worker-3</text>
  <rect x="676" y="250" width="128" height="34" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="740" y="271" font-size="10" text-anchor="middle" fill="#1e40af">任务 3（100 ms）</text>
  <rect x="810" y="250" width="128" height="34" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="874" y="271" font-size="10" text-anchor="middle" fill="#1e40af">任务 7（100 ms）</text>

  <rect x="588" y="300" width="82" height="34" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.1"/>
  <text x="629" y="321" font-size="10.5" text-anchor="middle" fill="#92400e">main</text>
  <rect x="676" y="300" width="128" height="34" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="740" y="321" font-size="10" text-anchor="middle" fill="#92400e">任务 4（100 ms）</text>
  <rect x="810" y="300" width="128" height="34" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="874" y="321" font-size="10" text-anchor="middle" fill="#92400e">任务 8（100 ms）</text>

  <line x1="676" y1="352" x2="938" y2="352" stroke="#94a3b8" stroke-width="1" marker-end="url(#arTree)"/>
  <line x1="676" y1="346" x2="676" y2="358" stroke="#94a3b8" stroke-width="1"/>
  <line x1="807" y1="346" x2="807" y2="358" stroke="#94a3b8" stroke-width="1"/>
  <line x1="938" y1="346" x2="938" y2="358" stroke="#94a3b8" stroke-width="1"/>
  <text x="676" y="374" font-size="9.5" text-anchor="middle" fill="#64748b">0 ms</text>
  <text x="807" y="374" font-size="9.5" text-anchor="middle" fill="#64748b">100 ms</text>
  <text x="934" y="374" font-size="9.5" text-anchor="middle" fill="#64748b">200 ms</text>

  <text x="588" y="404" font-size="10.5" fill="#475569">8 个 sleep(100) 任务、4 条执行流，两轮跑完约 200 ms</text>
  <text x="588" y="426" font-size="10.5" fill="#b91c1c">实测 211~223 ms（3 次），与 4 路并行吻合，不是 8÷3×100 的 300 ms</text>
  <text x="588" y="448" font-size="10.5" fill="#475569">换 8 线程的普通池：108~131 ms，因为 8 个任务能同时睡</text>
  <text x="588" y="470" font-size="10.5" fill="#475569">调用线程会参与计算，是 parallelStream 比「只看并行度」快一轮的原因</text>

  <rect x="32" y="528" width="936" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="554" font-size="11.5" font-weight="bold" fill="#0f172a">要点：切分决定「块够不够小」，调度决定「线程闲不闲」</text>
  <text x="52" y="580" font-size="10.5" fill="#b91c1c">阈值太小 → 任务数爆炸，fork / join 的开销盖过计算：threshold=10 实测 182~315 ms</text>
  <text x="52" y="606" font-size="10.5" fill="#334155">阈值合适 → 每块算到毫秒级，切分成本才摊得薄：threshold=1000 实测 6~12 ms</text>
</svg>
