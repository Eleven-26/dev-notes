<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="450" fill="#ffffff"/>

  <text x="40" y="38" font-size="20" font-weight="bold" fill="#0f172a">每对象省 16 字节，代价是四条只在运行期报错的门槛</text>
  <rect x="32" y="50" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="66" font-size="13" fill="#64748b">100 万个对象的实测：每对象 36 B 对 20 B，共差 15.6 MB，三轮读数逐字节相同。</text>

  <rect x="32" y="88" width="452" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="112" font-size="13" font-weight="bold" fill="#1d4ed8">A：每对象一个 AtomicInteger</text>

  <text x="56" y="140" font-size="11" fill="#475569">数组引用</text>
  <rect x="130" y="128" width="44" height="18" rx="3" fill="#e2e8f0"/>
  <text x="182" y="141" font-size="11" fill="#475569">4 B</text>

  <text x="56" y="170" font-size="11" fill="#475569">外层对象</text>
  <rect x="130" y="158" width="132" height="18" rx="3" fill="#94a3b8"/>
  <text x="140" y="171" font-size="10" fill="#ffffff">对象头 12 B</text>
  <rect x="262" y="158" width="44" height="18" rx="3" fill="#bfdbfe"/>
  <text x="314" y="171" font-size="11" fill="#475569">16 B</text>

  <text x="56" y="200" font-size="11" fill="#475569">计数器本体</text>
  <rect x="130" y="188" width="132" height="18" rx="3" fill="#94a3b8"/>
  <text x="140" y="201" font-size="10" fill="#ffffff">对象头 12 B</text>
  <rect x="262" y="188" width="44" height="18" rx="3" fill="#bfdbfe"/>
  <text x="284" y="201" font-size="10" fill="#1e40af">4 B</text>
  <text x="314" y="201" font-size="11" fill="#991b1b">16 B 多出来的</text>

  <text x="56" y="226" font-size="12" font-weight="bold" fill="#1d4ed8">合计 36 B/对象</text>

  <rect x="516" y="88" width="452" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="540" y="112" font-size="13" font-weight="bold" fill="#15803d">B：volatile int + 共享 updater</text>

  <text x="540" y="140" font-size="11" fill="#475569">数组引用</text>
  <rect x="614" y="128" width="44" height="18" rx="3" fill="#e2e8f0"/>
  <text x="666" y="141" font-size="11" fill="#475569">4 B</text>

  <text x="540" y="170" font-size="11" fill="#475569">外层对象</text>
  <rect x="614" y="158" width="132" height="18" rx="3" fill="#94a3b8"/>
  <text x="624" y="171" font-size="10" fill="#ffffff">对象头 12 B</text>
  <rect x="746" y="158" width="44" height="18" rx="3" fill="#bbf7d0"/>
  <text x="768" y="171" font-size="10" fill="#15803d">4 B</text>
  <text x="798" y="171" font-size="11" fill="#475569">16 B</text>

  <text x="540" y="200" font-size="11" fill="#475569">计数器本体</text>
  <text x="614" y="201" font-size="11" fill="#15803d">字段已在上面的对象里，不再单独成形</text>

  <text x="540" y="226" font-size="12" font-weight="bold" fill="#15803d">合计 20 B/对象</text>

  <rect x="32" y="248" width="936" height="146" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="272" font-size="13" font-weight="bold" fill="#0f172a">四条门槛与报错形态（全部发生在 newUpdater 那一刻）</text>

  <rect x="56" y="284" width="276" height="24" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="68" y="301" font-size="11" fill="#15803d">private volatile int，同类内创建 → 通过</text>
  <rect x="344" y="284" width="180" height="24" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="356" y="301" font-size="11" fill="#991b1b">非 volatile → 报错</text>
  <rect x="536" y="284" width="180" height="24" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="548" y="301" font-size="11" fill="#991b1b">static → 报错</text>
  <rect x="728" y="284" width="216" height="24" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="740" y="301" font-size="11" fill="#991b1b">类型不符 → 报错</text>

  <text x="56" y="330" font-size="11" fill="#475569">Must be volatile type</text>
  <text x="344" y="330" font-size="11" fill="#991b1b">消息为 null，日志里看不出原因</text>
  <text x="536" y="330" font-size="11" fill="#991b1b">这一点最坑：异常类对了、消息是空的</text>

  <text x="56" y="352" font-size="11" fill="#475569">Must be integer type</text>
  <text x="344" y="352" font-size="11" fill="#475569">private 跨顶层类 → IllegalAccess 被包成 RuntimeException</text>
  <text x="56" y="374" font-size="11" fill="#475569">compareAndSet(null, …) → ClassCastException，消息也是 null</text>

  <rect x="32" y="406" width="936" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="48" y="426" font-size="12" fill="#15803d">省字节只在对象数上百万时值得；几百个对象就别为 16 字节换一套只在运行期报错的 API。</text>
</svg>
