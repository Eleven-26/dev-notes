<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">wait / notify 的四条契约，破一条就静默失效</text>
  <rect x="32" y="52" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="68" font-size="13" fill="#64748b">方法签名上看不出任何约束，四条全靠约定；只有第一条会在运行时报错，其余三条只表现为卡死或跑错。</text>

  <rect x="32" y="92" width="936" height="372" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="56" y="112" width="440" height="72" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="72" y="136" font-size="13" font-weight="bold" fill="#991b1b">一、必须在 synchronized 内调用</text>
  <text x="72" y="158" font-size="12" fill="#7f1d1d">wait / notify / notifyAll 都要求持有同一对象</text>
  <text x="72" y="176" font-size="11" fill="#7f1d1d">抛点：Object.wait0(Native Method)</text>

  <rect x="512" y="112" width="432" height="72" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="528" y="136" font-size="13" font-weight="bold" fill="#15803d">破约的后果：运行期异常</text>
  <text x="528" y="158" font-size="12" fill="#166534">IllegalMonitorStateException: current thread is not owner</text>
  <text x="528" y="176" font-size="11" fill="#166534">编译期完全不拦，只有跑到才炸</text>

  <rect x="56" y="196" width="440" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="72" y="220" font-size="13" font-weight="bold" fill="#1e40af">二、wait 会释放监视器锁</text>
  <text x="72" y="242" font-size="12" fill="#1e3a8a">对方持锁等待时，本线程能进同一同步块</text>
  <text x="72" y="260" font-size="11" fill="#1e3a8a">实测进入耗时 0.004 ~ 0.006 ms</text>

  <rect x="512" y="196" width="432" height="72" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="528" y="220" font-size="13" font-weight="bold" fill="#15803d">破约的后果：以为锁一直没放</text>
  <text x="528" y="242" font-size="12" fill="#166534">别的线程能插进临界区，读到中间状态</text>
  <text x="528" y="260" font-size="11" fill="#166534">静默，不做断言查不出来</text>

  <rect x="56" y="280" width="440" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="72" y="304" font-size="13" font-weight="bold" fill="#1e40af">三、notify 不放锁，只改标记</text>
  <text x="72" y="326" font-size="12" fill="#1e3a8a">被唤醒者要等调用方 monitorexit 才真正返回</text>
  <text x="72" y="344" font-size="11" fill="#1e3a8a">实测：notify 后 300.3 ms 返回，退出临界区后 0.0 ms</text>

  <rect x="512" y="280" width="432" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="528" y="304" font-size="13" font-weight="bold" fill="#92400e">破约的后果：唤醒延迟</text>
  <text x="528" y="326" font-size="12" fill="#78350f">把 notify 后面的耗时活留在临界区里</text>
  <text x="528" y="344" font-size="11" fill="#78350f">对方醒了却拿不到锁，白等整段临界区</text>

  <rect x="56" y="364" width="440" height="72" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="72" y="388" font-size="13" font-weight="bold" fill="#991b1b">四、唤醒后必须 while 重新检查谓词</text>
  <text x="72" y="410" font-size="12" fill="#7f1d1d">被唤醒 ≠ 条件成立；规范还允许虚假唤醒</text>
  <text x="72" y="428" font-size="11" fill="#7f1d1d">实测：while 版本空转重等 2 次，if 版本直接跑错</text>

  <rect x="512" y="364" width="432" height="72" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="528" y="388" font-size="13" font-weight="bold" fill="#991b1b">破约的后果：最难查的一种</text>
  <text x="528" y="410" font-size="12" fill="#7f1d1d">notifyAll 叫醒所有人，多数人谓词不成立</text>
  <text x="528" y="428" font-size="11" fill="#7f1d1d">if 写法带着 false 状态继续往下执行</text>
</svg>
