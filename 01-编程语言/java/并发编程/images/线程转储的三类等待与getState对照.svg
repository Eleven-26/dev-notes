<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">转储给的是「等待方式」，枚举只给六个值</text>
  <rect x="32" y="52" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="68" font-size="13" fill="#64748b">真正与 getState() 一一对应的是正文里 java.lang.Thread.State: 那一行，不是线程头那行。</text>

  <rect x="32" y="92" width="936" height="240" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="116" font-size="12" font-weight="bold" fill="#64748b">转储里那行</text>
  <text x="400" y="116" font-size="12" font-weight="bold" fill="#64748b">对应 getState()</text>
  <text x="560" y="116" font-size="12" font-weight="bold" fill="#64748b">地址标记的含义</text>
  <line x1="52" y1="126" x2="948" y2="126" stroke="#e2e8f0"/>

  <rect x="52" y="140" width="880" height="54" rx="6" fill="#fee2e2"/>
  <text x="64" y="162" font-size="12" font-family="Consolas, monospace" fill="#991b1b">waiting for monitor entry</text>
  <text x="400" y="162" font-size="12" font-weight="bold" fill="#991b1b">BLOCKED</text>
  <text x="560" y="162" font-size="12" fill="#7f1d1d">waiting to lock 后面那个地址</text>
  <text x="560" y="182" font-size="12" fill="#7f1d1d">是它排队的 monitor 入口队列</text>

  <rect x="52" y="204" width="880" height="54" rx="6" fill="#fef3c7"/>
  <text x="64" y="226" font-size="12" font-family="Consolas, monospace" fill="#92400e">in Object.wait()</text>
  <text x="400" y="226" font-size="12" font-weight="bold" fill="#92400e">WAITING 或 TIMED_WAITING</text>
  <text x="560" y="226" font-size="12" fill="#78350f">waiting on 与 locked 指向同一个地址</text>
  <text x="560" y="246" font-size="12" fill="#78350f">线程在条件队列里，逻辑上仍持有 monitor</text>

  <rect x="52" y="268" width="880" height="54" rx="6" fill="#e0e7ff"/>
  <text x="64" y="290" font-size="12" font-family="Consolas, monospace" fill="#3730a3">waiting on condition</text>
  <text x="400" y="290" font-size="12" font-weight="bold" fill="#3730a3">多为 TIMED_WAITING</text>
  <text x="560" y="290" font-size="12" fill="#312e81">走的是 park，没有 monitor 可以标</text>
  <text x="560" y="310" font-size="12" fill="#312e81">sleep / parkNanos / JUC 都落在这里</text>

  <rect x="32" y="348" width="936" height="34" rx="6" fill="#f1f5f9"/>
  <text x="48" y="370" font-size="12" fill="#334155">Reference Handler 卡在 native 方法 waitForReferencePendingList 里，转储照样写 RUNNABLE —— 六个值里没有「内核态阻塞」这一格。</text>

  <rect x="32" y="390" width="936" height="34" rx="6" fill="#fee2e2"/>
  <text x="48" y="412" font-size="12" fill="#991b1b">所以「转储里 RUNNABLE 很多」不等于 CPU 打满，要配 top -H 或 JFR 的 CPU 采样才能定案。</text>
</svg>
