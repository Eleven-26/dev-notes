<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <text x="40" y="38" font-size="20" font-weight="bold" fill="#0f172a">同样 800 万次自增，三条路径的吞吐方向完全相反</text>
  <rect x="32" y="50" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="66" font-size="13" fill="#64748b">4 核容器，每个配置独立进程跑 3 轮取中位数；纵轴为百万次每秒，横轴为写线程数。</text>

  <rect x="32" y="88" width="936" height="356" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="56" y="112" font-size="12" fill="#64748b">Mops/s</text>

  <line x1="130" y1="400" x2="936" y2="400" stroke="#cbd5e1"/>
  <line x1="130" y1="127" x2="936" y2="127" stroke="#e2e8f0" stroke-dasharray="3 4"/>
  <line x1="130" y1="195" x2="936" y2="195" stroke="#e2e8f0" stroke-dasharray="3 4"/>
  <line x1="130" y1="264" x2="936" y2="264" stroke="#e2e8f0" stroke-dasharray="3 4"/>
  <line x1="130" y1="332" x2="936" y2="332" stroke="#e2e8f0" stroke-dasharray="3 4"/>
  <line x1="130" y1="400" x2="130" y2="127" stroke="#cbd5e1"/>

  <text x="112" y="131" font-size="11" fill="#94a3b8" text-anchor="end">160</text>
  <text x="112" y="199" font-size="11" fill="#94a3b8" text-anchor="end">120</text>
  <text x="112" y="268" font-size="11" fill="#94a3b8" text-anchor="end">80</text>
  <text x="112" y="336" font-size="11" fill="#94a3b8" text-anchor="end">40</text>
  <text x="112" y="404" font-size="11" fill="#94a3b8" text-anchor="end">0</text>

  <text x="175" y="424" font-size="12" fill="#475569" text-anchor="middle">1 线程</text>
  <text x="375" y="424" font-size="12" fill="#475569" text-anchor="middle">2 线程</text>
  <text x="575" y="424" font-size="12" fill="#475569" text-anchor="middle">4 线程</text>
  <text x="800" y="424" font-size="12" fill="#475569" text-anchor="middle">8 线程</text>

  <polyline points="175,281.4 375,237.9 575,199.9 800,135.9" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <polyline points="175,273.2 375,323.6 575,332.1 800,331.6" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <polyline points="175,339.8 375,375.6 575,342.2 800,335.7" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="6 3"/>

  <circle cx="175" cy="281.4" r="4" fill="#16a34a"/>
  <circle cx="375" cy="237.9" r="4" fill="#16a34a"/>
  <circle cx="575" cy="199.9" r="4" fill="#16a34a"/>
  <circle cx="800" cy="135.9" r="5" fill="#16a34a"/>
  <circle cx="175" cy="273.2" r="4" fill="#2563eb"/>
  <circle cx="375" cy="323.6" r="4" fill="#2563eb"/>
  <circle cx="575" cy="332.1" r="4" fill="#2563eb"/>
  <circle cx="800" cy="331.6" r="5" fill="#2563eb"/>
  <circle cx="175" cy="339.8" r="4" fill="#b45309"/>
  <circle cx="375" cy="375.6" r="5" fill="#b45309"/>
  <circle cx="575" cy="342.2" r="4" fill="#b45309"/>
  <circle cx="800" cy="335.7" r="4" fill="#b45309"/>

  <text x="812" y="130" font-size="12" font-weight="bold" fill="#15803d">154.8</text>
  <text x="820" y="352" font-size="12" font-weight="bold" fill="#92400e">37.7</text>

  <rect x="686" y="296" width="132" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="696" y="311" font-size="12" fill="#1d4ed8">74.3 → 40.1</text>
  <text x="686" y="336" font-size="11" fill="#1d4ed8">8 线程只有单线程 54%</text>

  <rect x="138" y="366" width="176" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="148" y="381" font-size="11" fill="#92400e">2 线程是最差的一档</text>

  <rect x="146" y="96" width="272" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="162" y1="116" x2="194" y2="116" stroke="#16a34a" stroke-width="2.5"/>
  <text x="202" y="120" font-size="12" fill="#15803d">LongAdder 69.5 → 154.8</text>
  <line x1="162" y1="138" x2="194" y2="138" stroke="#2563eb" stroke-width="2.5"/>
  <text x="202" y="142" font-size="12" fill="#1d4ed8">AtomicLong 74.3 → 40.1</text>
  <line x1="162" y1="160" x2="194" y2="160" stroke="#b45309" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="202" y="164" font-size="12" fill="#92400e">synchronized 35.3 → 37.7</text>

  <rect x="32" y="458" width="936" height="32" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="48" y="479" font-size="12" fill="#15803d">判据不是谁更快，是曲线的方向：单点竞争让加线程变成负收益，分段才能把核用起来。</text>
</svg>
