<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>

  <text x="40" y="38" font-size="20" font-weight="bold" fill="#0f172a">LongAdder 把一处竞争拆成四处，求和时再拼回来</text>
  <rect x="32" y="50" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="66" font-size="13" fill="#64748b">4 核容器实测：起始 cells 为 null，4 个写线程后长到 4 个，8 个写线程仍是 4 个（等于核数）。</text>

  <rect x="32" y="88" width="470" height="266" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="114" font-size="13" font-weight="bold" fill="#1d4ed8">写侧：线程各写各的 cell</text>

  <rect x="56" y="128" width="96" height="26" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="66" y="145" font-size="12" fill="#1e40af">线程 t0</text>
  <rect x="56" y="166" width="96" height="26" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="66" y="183" font-size="12" fill="#1e40af">线程 t1</text>
  <rect x="56" y="204" width="96" height="26" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="66" y="221" font-size="12" fill="#1e40af">线程 t2</text>
  <rect x="56" y="242" width="96" height="26" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="66" y="259" font-size="12" fill="#1e40af">线程 t3</text>

  <line x1="152" y1="141" x2="286" y2="141" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="152" y1="179" x2="286" y2="179" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="152" y1="217" x2="286" y2="217" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="152" y1="255" x2="286" y2="255" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="136" font-size="10" fill="#64748b">probe → 下标</text>

  <rect x="286" y="128" width="192" height="26" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="296" y="145" font-size="12" fill="#15803d">Cell[0] = 160</text>
  <rect x="286" y="166" width="192" height="26" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="296" y="183" font-size="12" fill="#15803d">Cell[1] = 40</text>
  <rect x="286" y="204" width="192" height="26" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="296" y="221" font-size="12" fill="#15803d">Cell[2] = 67</text>
  <rect x="286" y="242" width="192" height="26" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="296" y="259" font-size="12" fill="#15803d">Cell[3] = 28</text>

  <text x="56" y="296" font-size="11" fill="#475569">每个 Cell 带 @Contended，独占一条缓存行</text>
  <text x="56" y="316" font-size="11" fill="#475569">无竞争时只写 base，cells 保持 null</text>
  <text x="56" y="336" font-size="11" fill="#991b1b">8 线程时平均每格仍有 2 个线程在抢</text>

  <rect x="518" y="88" width="450" height="266" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="542" y="114" font-size="13" font-weight="bold" fill="#b45309">读侧：sum() 依次读，跨了好几个时刻</text>

  <rect x="542" y="126" width="402" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="552" y="143" font-size="12" fill="#475569">① 读 base = 0</text>
  <rect x="542" y="160" width="402" height="24" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="552" y="177" font-size="12" fill="#15803d">② 读 Cell[0] = 160</text>
  <rect x="542" y="194" width="402" height="24" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="552" y="211" font-size="12" fill="#15803d">③ 读 Cell[1] = 40（此刻 Cell[0] 已涨到 166）</text>
  <rect x="542" y="228" width="402" height="24" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="552" y="245" font-size="12" fill="#15803d">④ 读 Cell[2] = 67、Cell[3] = 28</text>
  <rect x="542" y="262" width="402" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="552" y="279" font-size="12" fill="#92400e">返回 295，真值 301 → 98.0%</text>

  <text x="542" y="308" font-size="11" fill="#475569">并发期读到的最大值只有真值的 97.4% ~ 99.8%</text>
  <text x="542" y="328" font-size="11" fill="#475569">停写后连续 1000 次 sum() 完全一致</text>
  <text x="542" y="348" font-size="11" fill="#991b1b">误差单方向偏小：做阈值判断会迟，做进度展示没事</text>

  <rect x="32" y="368" width="936" height="32" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="48" y="389" font-size="12" fill="#1d4ed8">用「读不准」换「写得开」：写侧 8 线程 154.8 Mops/s，读侧 sum() 是 AtomicLong.get() 的 5.4 倍。</text>
</svg>
