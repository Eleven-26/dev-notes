<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="du" markerWidth="9" markerHeight="9" refX="2" refY="3" orient="auto">
      <path d="M7,0 L0,3 L7,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="490" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">并发编程：主线读序 ①–⑬ 与五组分工</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#64748b">13 篇自原理到工具；折线连接组与组之间的位次，组内竖箭头是篇内前置</text>

  <rect x="10" y="72" width="180" height="264" rx="9" fill="#f8fafc" stroke="#2563eb" stroke-width="1.4"/>
  <text x="100" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">地基 · ①②</text>
  <rect x="20" y="112" width="160" height="34" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="100" y="133" text-anchor="middle" font-size="10.5" fill="#1e3a8a">① 线程基础与生命周期</text>
  <line x1="100" y1="146" x2="100" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="20" y="160" width="160" height="34" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="100" y="181" text-anchor="middle" font-size="10.5" fill="#1e3a8a">② JMM 与内存屏障</text>
  <rect x="18" y="256" width="164" height="70" rx="7" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="100" y="280" text-anchor="middle" font-size="10.5" fill="#1d4ed8">线程是什么、</text>
  <text x="100" y="302" text-anchor="middle" font-size="10.5" fill="#1d4ed8">为什么互相看不见</text>

  <polyline points="180,177 200,177 200,129 218,129" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#d)"/>

  <rect x="210" y="72" width="180" height="264" rx="9" fill="#f8fafc" stroke="#16a34a" stroke-width="1.4"/>
  <text x="300" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">排队与不排队 · ③④⑤</text>
  <rect x="220" y="112" width="160" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="300" y="133" text-anchor="middle" font-size="10.5" fill="#14532d">③ 锁与 AQS</text>
  <line x1="300" y1="146" x2="300" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="220" y="160" width="160" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="300" y="181" text-anchor="middle" font-size="10.5" fill="#14532d">④ 线程间协作与并发工具类</text>
  <line x1="300" y1="194" x2="300" y2="206" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,4" marker-start="url(#du)" marker-end="url(#d)"/>
  <rect x="220" y="208" width="160" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="300" y="229" text-anchor="middle" font-size="10.5" fill="#14532d">⑤ 原子类与无锁</text>
  <rect x="218" y="256" width="164" height="70" rx="7" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="300" y="280" text-anchor="middle" font-size="10.5" fill="#166534">同一个冲突，</text>
  <text x="300" y="302" text-anchor="middle" font-size="10.5" fill="#166534">两条解法各自的代价</text>

  <polyline points="380,225 400,225 400,129 418,129" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#d)"/>

  <rect x="410" y="72" width="180" height="264" rx="9" fill="#f8fafc" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">池与容器 · ⑥⑦⑧</text>
  <rect x="420" y="112" width="160" height="34" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="133" text-anchor="middle" font-size="10.5" fill="#7c2d12">⑥ 线程池</text>
  <line x1="500" y1="146" x2="500" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="420" y="160" width="160" height="34" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="181" text-anchor="middle" font-size="10.5" fill="#7c2d12">⑦ 并发容器</text>
  <line x1="500" y1="194" x2="500" y2="206" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="420" y="208" width="160" height="34" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="229" text-anchor="middle" font-size="10.5" fill="#7c2d12">⑧ ThreadLocal 与上下文传递</text>
  <rect x="418" y="256" width="164" height="70" rx="7" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="500" y="280" text-anchor="middle" font-size="10.5" fill="#9a3412">线程与数据</text>
  <text x="500" y="302" text-anchor="middle" font-size="10.5" fill="#9a3412">怎么被装起来管</text>

  <polyline points="580,225 600,225 600,129 618,129" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#d)"/>

  <rect x="610" y="72" width="180" height="264" rx="9" fill="#f8fafc" stroke="#0f766e" stroke-width="1.4"/>
  <text x="700" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#115e59">异步与并行 · ⑨⑩⑪</text>
  <rect x="620" y="112" width="160" height="34" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <text x="700" y="133" text-anchor="middle" font-size="10.5" fill="#115e59">⑨ CompletableFuture 与异步编排</text>
  <line x1="700" y1="146" x2="700" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="620" y="160" width="160" height="34" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <text x="700" y="181" text-anchor="middle" font-size="10.5" fill="#115e59">⑩ ForkJoin 与并行流</text>
  <line x1="700" y1="194" x2="700" y2="206" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="620" y="208" width="160" height="34" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <text x="700" y="229" text-anchor="middle" font-size="10.5" fill="#115e59">⑪ 虚拟线程</text>
  <rect x="618" y="256" width="164" height="70" rx="7" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
  <text x="700" y="280" text-anchor="middle" font-size="10.5" fill="#134e4a">回调跑在哪、</text>
  <text x="700" y="302" text-anchor="middle" font-size="10.5" fill="#134e4a">并行度从哪来</text>

  <polyline points="780,225 800,225 800,129 818,129" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#d)"/>

  <rect x="810" y="72" width="180" height="264" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="900" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">成本与缺陷 · ⑫⑬</text>
  <rect x="820" y="112" width="160" height="34" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="900" y="133" text-anchor="middle" font-size="10.5" fill="#334155">⑫ 线程与进程开销</text>
  <line x1="900" y1="146" x2="900" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="820" y="160" width="160" height="34" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="900" y="181" text-anchor="middle" font-size="10.5" fill="#334155">⑬ 死锁与并发缺陷诊断</text>
  <rect x="818" y="256" width="164" height="70" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="900" y="280" text-anchor="middle" font-size="10.5" fill="#334155">到底多贵、</text>
  <text x="900" y="302" text-anchor="middle" font-size="10.5" fill="#334155">卡住了怎么看</text>

  <rect x="10" y="348" width="980" height="30" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="500" y="368" text-anchor="middle" font-size="12" fill="#334155">⑫ 与 ⑬ 的输入来自前面全部 —— 它们只汇总与诊断，不引入新原语；编号才是位次，列只是分组</text>

  <rect x="10" y="390" width="980" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="26" y="412" font-size="12" fill="#334155">② 与 ③ 互相印证：JMM 讲「为什么 volatile 保不住原子性」，锁与 AQS 给出「volatile++ 实测丢 2/3 更新」的直接证据。</text>
  <text x="26" y="436" font-size="12" fill="#334155">④ 让线程排队、⑤ 拆掉共享点，两条并行路线（图上那条双向虚线）—— 同一个问题两边都能解，选哪边看冲突有多密。</text>
  <text x="26" y="460" font-size="12" fill="#64748b">⑬ 的读法和前十二篇不同：按现场症状检索（BLOCKED 环、ownable synchronizer 环、吞吐被钉在 1 除以临界区时长）。</text>
</svg>
