<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">上下文跨线程传递的四条路线与各自的失效点</text>
  <text x="40" y="58" font-size="13" fill="#64748b">前两条靠线程关系，后两条靠提交时的快照——判据是它依赖的到底是什么</text>

  <rect x="40" y="84" width="920" height="36" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="108" font-size="11.5" font-weight="bold" fill="#0f172a">路线</text>
  <text x="260" y="108" font-size="11.5" font-weight="bold" fill="#0f172a">机制</text>
  <text x="556" y="108" font-size="11.5" font-weight="bold" fill="#0f172a">断在哪里</text>
  <text x="806" y="108" font-size="11.5" font-weight="bold" fill="#0f172a">适用</text>

  <rect x="40" y="124" width="920" height="74" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="52" y="152" font-size="11" font-weight="bold" fill="#1e3a8a">ThreadLocal + remove</text>
  <text x="52" y="174" font-size="9.5" fill="#64748b">靠线程关系</text>
  <text x="260" y="152" font-size="10" fill="#334155">同线程读写同一份 map</text>
  <text x="260" y="174" font-size="10" fill="#334155">跨线程看不到</text>
  <text x="556" y="152" font-size="10" fill="#b91c1c">跨线程直接失效</text>
  <text x="556" y="174" font-size="10" fill="#b91c1c">子线程读到 null</text>
  <text x="806" y="152" font-size="10" fill="#334155">单线程任务</text>

  <rect x="40" y="202" width="920" height="74" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="52" y="230" font-size="11" font-weight="bold" fill="#1e3a8a">InheritableThreadLocal</text>
  <text x="52" y="252" font-size="9.5" fill="#64748b">靠线程关系</text>
  <text x="260" y="230" font-size="10" fill="#334155">new Thread 时复制 Entry[]</text>
  <text x="260" y="252" font-size="10" fill="#334155">拷贝的是创建那一刻</text>
  <text x="556" y="230" font-size="10" fill="#b91c1c">池化线程复用后停在旧值</text>
  <text x="556" y="252" font-size="10" fill="#b91c1c">实测 set(v2) 后仍读 v1</text>
  <text x="806" y="230" font-size="10" fill="#334155">一次性 new Thread</text>

  <rect x="40" y="280" width="920" height="74" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="52" y="308" font-size="11" font-weight="bold" fill="#7c2d12">装饰器（提交时捕获）</text>
  <text x="52" y="330" font-size="9.5" fill="#64748b">靠提交快照</text>
  <text x="260" y="308" font-size="10" fill="#334155">包装 Runnable：run 前 set</text>
  <text x="260" y="330" font-size="10" fill="#334155">finally 还原执行线程原值</text>
  <text x="556" y="308" font-size="10" fill="#b91c1c">忘了包就没有上下文</text>
  <text x="556" y="330" font-size="10" fill="#b91c1c">每个提交点都要包一次</text>
  <text x="806" y="308" font-size="9.5" fill="#334155">线程池与 CompletableFuture</text>

  <rect x="40" y="358" width="920" height="74" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="52" y="386" font-size="11" font-weight="bold" fill="#7c2d12">TransmittableThreadLocal</text>
  <text x="52" y="408" font-size="9.5" fill="#64748b">靠提交快照</text>
  <text x="260" y="386" font-size="10" fill="#334155">装饰器 + 快照接管引用</text>
  <text x="260" y="408" font-size="10" fill="#334155">库把第三种的细节封好了</text>
  <text x="556" y="386" font-size="10" fill="#b91c1c">需额外依赖</text>
  <text x="556" y="408" font-size="10" fill="#b91c1c">本篇未实测（无 Maven）</text>
  <text x="806" y="386" font-size="9.5" fill="#334155">已引入 TTL 的工程</text>

  <rect x="40" y="452" width="920" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="56" y="480" font-size="12" font-weight="bold" fill="#0f172a">结论：跨线程要的是「提交那一刻的上下文」，不是「创建那一刻的线程血缘」</text>
  <text x="56" y="508" font-size="10.5" fill="#334155">两处断点——路线 2 断在「复用」，路线 3 断在「忘了包」；路线 4 只是把路线 3 封装成库</text>
  <text x="56" y="532" font-size="10.5" fill="#b91c1c">所以「换一种 ThreadLocal 就好了」是错的：换的必须是「谁在什么时候取快照」</text>
</svg>
