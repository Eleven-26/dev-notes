<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="m1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="m2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ConcurrentHashMap：JDK 7 分段锁 → JDK 8 桶级结构</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">思路只有一句「把一把大锁拆小」，但两代拆的方式完全不同，且 JDK 8 的读路径完全无锁</text>

  <rect x="20" y="80" width="460" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="36" y="104" font-size="12" font-weight="bold" fill="#1e3a8a">JDK 7：Segment[]，每段一把 ReentrantLock</text>
  <rect x="36" y="116" width="98" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="85" y="141" text-anchor="middle" font-size="11" fill="#1e3a8a">Seg 0</text>
  <rect x="146" y="116" width="98" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="195" y="141" text-anchor="middle" font-size="11" fill="#1e3a8a">Seg 1</text>
  <rect x="256" y="116" width="98" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="305" y="141" text-anchor="middle" font-size="11" fill="#64748b">…</text>
  <rect x="366" y="116" width="98" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="415" y="141" text-anchor="middle" font-size="11" fill="#1e3a8a">Seg 15</text>

  <text x="36" y="184" font-size="11" fill="#334155">每个 Segment 内一个 HashEntry[]，冲突就顺着链下去：</text>
  <rect x="48" y="196" width="80" height="36" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="88" y="219" text-anchor="middle" font-size="10.5" fill="#7c2d12">Entry</text>
  <line x1="128" y1="214" x2="150" y2="214" stroke="#334155" stroke-width="1.3" marker-end="url(#m1)"/>
  <rect x="150" y="196" width="80" height="36" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="190" y="219" text-anchor="middle" font-size="10.5" fill="#7c2d12">Entry</text>
  <line x1="230" y1="214" x2="252" y2="214" stroke="#334155" stroke-width="1.3" marker-end="url(#m1)"/>
  <rect x="252" y="196" width="80" height="36" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="292" y="219" text-anchor="middle" font-size="10.5" fill="#7c2d12">Entry</text>
  <text x="342" y="219" font-size="11" fill="#9a3412">一直链下去</text>

  <text x="36" y="264" font-size="11" fill="#334155">并发度 = Segment 个数（默认 16）→ 16 线程以上开始互相等锁。</text>
  <text x="36" y="290" font-size="11" fill="#64748b">读也要先定位 Segment、再读；扩容在段内单独进行。</text>

  <rect x="500" y="80" width="480" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="516" y="104" font-size="12" font-weight="bold" fill="#14532d">JDK 8：一个 Node[]，锁下沉到「桶」</text>
  <rect x="516" y="116" width="70" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="551" y="140" text-anchor="middle" font-size="11" fill="#14532d">桶 0</text>
  <rect x="594" y="116" width="70" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="629" y="140" text-anchor="middle" font-size="11" fill="#14532d">桶 1</text>
  <rect x="672" y="116" width="70" height="38" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="707" y="140" text-anchor="middle" font-size="11" fill="#7c2d12">桶 2</text>
  <rect x="750" y="116" width="70" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="785" y="140" text-anchor="middle" font-size="11" fill="#14532d">桶 3</text>
  <rect x="828" y="116" width="70" height="38" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="863" y="140" text-anchor="middle" font-size="11" fill="#64748b">…</text>
  <rect x="906" y="116" width="64" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="938" y="140" text-anchor="middle" font-size="10.5" fill="#14532d">桶 n-1</text>

  <line x1="707" y1="154" x2="707" y2="168" stroke="#b45309" stroke-width="1.2"/>
  <rect x="516" y="172" width="60" height="32" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="546" y="193" text-anchor="middle" font-size="10" fill="#7c2d12">Node</text>
  <line x1="576" y1="188" x2="596" y2="188" stroke="#334155" stroke-width="1.2" marker-end="url(#m1)"/>
  <rect x="596" y="172" width="60" height="32" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="626" y="193" text-anchor="middle" font-size="10" fill="#7c2d12">Node</text>
  <line x1="656" y1="188" x2="676" y2="188" stroke="#dc2626" stroke-width="1.2" marker-end="url(#m2)"/>
  <text x="676" y="182" font-size="10" fill="#dc2626">≥8 且表≥64</text>
  <circle cx="760" cy="178" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <circle cx="726" cy="206" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <circle cx="794" cy="206" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <line x1="760" y1="187" x2="729" y2="198" stroke="#dc2626" stroke-width="1.2"/>
  <line x1="760" y1="187" x2="791" y2="198" stroke="#dc2626" stroke-width="1.2"/>
  <text x="812" y="196" font-size="10.5" fill="#b91c1c">红黑树</text>

  <text x="516" y="240" font-size="11" fill="#334155">空桶：CAS 放新节点（无锁）；桶非空：只 synchronized 锁住那一个桶的首节点。</text>
  <text x="516" y="264" font-size="11" fill="#166534">读：数组元素是 volatile Node，完全无锁、不 CAS。</text>
  <text x="516" y="288" font-size="11" fill="#334155">并发度 ≈ 数组长度（随扩容增长）；扩容由多线程协同 transfer。</text>

  <rect x="20" y="346" width="960" height="224" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="36" y="370" font-size="12" font-weight="bold" fill="#0f172a">JDK 8 一次 put 的判定链</text>

  <rect x="36" y="384" width="180" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="126" y="408" text-anchor="middle" font-size="11" fill="#1e3a8a">① table 为空</text>
  <text x="126" y="430" text-anchor="middle" font-size="10" fill="#1d4ed8">initTable：CAS 抢 SIZECTL</text>
  <line x1="216" y1="416" x2="226" y2="416" stroke="#334155" stroke-width="1.4" marker-end="url(#m1)"/>
  <rect x="226" y="384" width="180" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="316" y="408" text-anchor="middle" font-size="11" fill="#1e3a8a">② 计算 hash</text>
  <text x="316" y="430" text-anchor="middle" font-size="10" fill="#1d4ed8">定位桶 (n-1) &amp; hash</text>
  <line x1="406" y1="416" x2="416" y2="416" stroke="#334155" stroke-width="1.4" marker-end="url(#m1)"/>
  <rect x="416" y="384" width="180" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="506" y="408" text-anchor="middle" font-size="11" fill="#14532d">③ 桶空？CAS 放节点</text>
  <text x="506" y="430" text-anchor="middle" font-size="10" fill="#166534">无锁（最常见路径）</text>
  <line x1="596" y1="416" x2="606" y2="416" stroke="#334155" stroke-width="1.4" marker-end="url(#m1)"/>
  <rect x="606" y="384" width="180" height="64" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="696" y="408" text-anchor="middle" font-size="11" fill="#7c2d12">④ 桶非空？加锁</text>
  <text x="696" y="430" text-anchor="middle" font-size="10" fill="#9a3412">synchronized(首节点)</text>
  <line x1="786" y1="416" x2="796" y2="416" stroke="#334155" stroke-width="1.4" marker-end="url(#m1)"/>
  <rect x="796" y="384" width="180" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="886" y="408" text-anchor="middle" font-size="11" fill="#7f1d1d">⑤ 链≥8 且表≥64</text>
  <text x="886" y="430" text-anchor="middle" font-size="10" fill="#b91c1c">treeifyBin 转红黑树</text>

  <text x="36" y="478" font-size="11.5" fill="#334155">⭐ 关键改进：并发度从「固定 16」变成「随容量增长」—— 16 个 Segment 在高并发下会成为新瓶颈。</text>
  <text x="36" y="504" font-size="11.5" fill="#dc2626">⚠️ 若所有线程抢同一个 key（都撞同一个桶）优势大幅缩水；无竞争（空桶）才走 CAS 无锁快路径。</text>
  <text x="36" y="530" font-size="11.5" fill="#334155">size() 用 CounterCell[]（同 LongAdder 思路）分散计数，并发写时只是估算值，别当业务判据。</text>
  <text x="36" y="556" font-size="11.5" fill="#64748b">实测（4 线程各写 5 万不同 key）：ConcurrentHashMap 6.9 ms，synchronizedMap 26.7 ms，Hashtable 33.9 ms。</text>
</svg>
