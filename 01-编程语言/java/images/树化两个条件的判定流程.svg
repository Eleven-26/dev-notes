<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">树化的两个条件与实测触发流程</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">链长超过 TREEIFY_THRESHOLD（8）且数组长度 ≥ MIN_TREEIFY_CAPACITY（64）才树化；容量不足先 resize</text>

  <rect x="340" y="100" width="340" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="510" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">连续插入 hashCode 全相同的 key</text>
  <text x="510" y="142" text-anchor="middle" font-size="10.5" fill="#475569">本机实验：冲突全部落在同一个桶</text>

  <line x1="510" y1="160" x2="510" y2="186" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="340" y="190" width="340" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="510" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#854d0e">链长超过 8 了？</text>
  <text x="510" y="232" text-anchor="middle" font-size="10.5" fill="#b45309">第 1~8 个：正常挂到链表尾</text>

  <line x1="338" y1="220" x2="294" y2="220" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="40" y="190" width="250" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="165" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">否：继续尾插</text>
  <text x="165" y="232" text-anchor="middle" font-size="10.5" fill="#166534">容量与节点类型都不变</text>

  <line x1="510" y1="250" x2="510" y2="282" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="340" y="286" width="340" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="510" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#854d0e">数组长度 ≥ 64？</text>
  <text x="510" y="328" text-anchor="middle" font-size="10.5" fill="#b45309">MIN_TREEIFY_CAPACITY = 64</text>

  <line x1="338" y1="316" x2="294" y2="316" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="40" y="286" width="250" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="165" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">否：先 resize 扩容</text>
  <text x="165" y="328" text-anchor="middle" font-size="10.5" fill="#1d4ed8">第 9 个：16 → 32，仍是 Node</text>

  <line x1="682" y1="316" x2="722" y2="316" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="726" y="286" width="250" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="851" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">是：桶转红黑树</text>
  <text x="851" y="328" text-anchor="middle" font-size="10.5" fill="#991b1b">节点变 TreeNode（实测第 11 个）</text>

  <rect x="24" y="376" width="460" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="254" y="400" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">本机实测触发点（容量 16 起步）</text>
  <text x="254" y="422" text-anchor="middle" font-size="11" fill="#334155">第 9 个：容量 16 → 32，桶下标仍 10，Node</text>
  <text x="254" y="442" text-anchor="middle" font-size="11" fill="#334155">第 10 个：容量 32 → 64，桶下标 10 变 42，Node</text>
  <text x="254" y="462" text-anchor="middle" font-size="11" fill="#334155">第 11 个：容量 64 达标 → TreeNode</text>

  <rect x="516" y="376" width="460" height="110" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="746" y="400" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#854d0e">为什么优先扩容而不是先树化？</text>
  <text x="746" y="422" text-anchor="middle" font-size="11" fill="#b45309">设计意图：先试图靠扩容把冲突打散</text>
  <text x="746" y="442" text-anchor="middle" font-size="11" fill="#b45309">扩容比维护红黑树便宜</text>
  <text x="746" y="462" text-anchor="middle" font-size="11" fill="#b45309">桶长到 8 的概率约 0.00000006</text>

  <text x="26" y="524" font-size="12.5" fill="#334155">⭐ 常见说法「链长到 8 就转红黑树」不完整——两个条件必须同时满足，所以本机树化点是第 11 个冲突元素</text>
  <text x="26" y="552" font-size="12.5" fill="#64748b">⚠️ 桶下标 10 → 42：42 &amp; 15 = 10，42 &amp; 63 = 42——扩容后新位置只取决于一个 bit，无需重算 hash</text>
</svg>
