<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arAUTO" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="810" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">自动装配的三段结构与条件过滤</text>
  <text x="40" y="58" font-size="13" fill="#64748b">一个注解启动应用 = 三个注解 + 一个选择器 + 一堆条件判断（本机 Boot 3.2.5 实测）</text>

  <rect x="40" y="76" width="920" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">@SpringBootApplication（实测拆出 3 个注解）</text>

  <line x1="185" y1="132" x2="185" y2="176" stroke="#334155" stroke-width="1.5" marker-end="url(#arAUTO)"/>
  <line x1="495" y1="132" x2="495" y2="176" stroke="#334155" stroke-width="1.5" marker-end="url(#arAUTO)"/>
  <line x1="805" y1="132" x2="805" y2="176" stroke="#334155" stroke-width="1.5" marker-end="url(#arAUTO)"/>

  <rect x="40" y="176" width="290" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="185" y="202" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">@ComponentScan</text>
  <text x="185" y="224" text-anchor="middle" font-size="11" fill="#334155">扫当前包及子包</text>

  <rect x="350" y="176" width="290" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="495" y="202" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">@EnableAutoConfiguration</text>
  <text x="495" y="224" text-anchor="middle" font-size="11" fill="#334155">自己不干活，只 @Import 选择器</text>

  <rect x="660" y="176" width="290" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="805" y="202" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">@SpringBootConfiguration</text>
  <text x="805" y="224" text-anchor="middle" font-size="11" fill="#334155">本质是 @Configuration</text>

  <line x1="185" y1="240" x2="185" y2="280" stroke="#334155" stroke-width="1.5" marker-end="url(#arAUTO)"/>
  <line x1="495" y1="240" x2="495" y2="280" stroke="#334155" stroke-width="1.5" marker-end="url(#arAUTO)"/>

  <rect x="40" y="280" width="290" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="185" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">扫到同包下的注解</text>
  <text x="185" y="324" text-anchor="middle" font-size="10" fill="#334155">@Service / @Component</text>
  <text x="185" y="338" text-anchor="middle" font-size="10" fill="#334155">@Repository / @Controller</text>

  <rect x="350" y="280" width="290" height="64" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="495" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">AutoConfigurationImportSelector</text>
  <text x="495" y="326" text-anchor="middle" font-size="11" fill="#334155">读 classpath 上所有 jar 的清单文件</text>

  <line x1="185" y1="344" x2="185" y2="380" stroke="#334155" stroke-width="1.5" marker-end="url(#arAUTO)"/>
  <line x1="495" y1="344" x2="495" y2="380" stroke="#334155" stroke-width="1.5" marker-end="url(#arAUTO)"/>

  <rect x="40" y="380" width="290" height="110" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="185" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">⚠️ 启动类不能放默认包</text>
  <text x="185" y="428" text-anchor="middle" font-size="10" fill="#334155">扫整个 classpath 包括所有 jar</text>
  <text x="185" y="448" text-anchor="middle" font-size="10" fill="#334155">BeanDefinitionStoreException</text>
  <text x="185" y="468" text-anchor="middle" font-size="10" fill="#334155">unlikely to start</text>
  <text x="185" y="484" text-anchor="middle" font-size="10" fill="#334155">启动类要放最外层具名包</text>

  <rect x="350" y="380" width="290" height="140" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="495" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">清单文件（本机实测）</text>
  <text x="495" y="428" text-anchor="middle" font-size="10" fill="#334155">META-INF/spring/org.springframework.boot.</text>
  <text x="495" y="446" text-anchor="middle" font-size="10" fill="#334155">autoconfigure.AutoConfiguration.imports</text>
  <text x="495" y="468" text-anchor="middle" font-size="11" fill="#0f172a">= 152 行自动配置类</text>
  <text x="495" y="490" text-anchor="middle" font-size="10" fill="#334155">spring.factories 仍在（长度 3211）</text>
  <text x="495" y="508" text-anchor="middle" font-size="10" fill="#334155">含 EnableAutoConfiguration = False</text>

  <rect x="660" y="380" width="290" height="110" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="805" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">清单机制的两代变化</text>
  <text x="805" y="428" text-anchor="middle" font-size="10" fill="#334155">Boot 2.6 及以前：spring.factories 键</text>
  <text x="805" y="448" text-anchor="middle" font-size="10" fill="#334155">Boot 2.7 ~：新增 imports 文件</text>
  <text x="805" y="468" text-anchor="middle" font-size="10" fill="#334155">Boot 3.0 起：只支持 imports</text>
  <text x="805" y="484" text-anchor="middle" font-size="10" fill="#64748b">「没有 spring.factories」是错的</text>

  <line x1="495" y1="520" x2="495" y2="550" stroke="#334155" stroke-width="1.5" marker-end="url(#arAUTO)"/>

  <rect x="40" y="550" width="290" height="104" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="185" y="574" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">覆盖默认行为的钥匙</text>
  <text x="185" y="598" text-anchor="middle" font-size="10" fill="#334155">@ConditionalOnMissingBean</text>
  <text x="185" y="618" text-anchor="middle" font-size="10.5" fill="#334155">默认配置类只在</text>
  <text x="185" y="636" text-anchor="middle" font-size="10.5" fill="#334155">「你没提供」时才生效</text>

  <rect x="350" y="550" width="290" height="104" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="495" y="574" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">条件装配：逐个判定是否生效</text>
  <text x="495" y="598" text-anchor="middle" font-size="10" fill="#334155">@ConditionalOnClass /</text>
  <text x="495" y="614" text-anchor="middle" font-size="10" fill="#334155">@ConditionalOnMissingBean</text>
  <text x="495" y="634" text-anchor="middle" font-size="10" fill="#334155">@ConditionalOnProperty /</text>
  <text x="495" y="650" text-anchor="middle" font-size="10" fill="#334155">@ConditionalOnWebApplication</text>

  <line x1="640" y1="602" x2="660" y2="602" stroke="#334155" stroke-width="1.5" marker-end="url(#arAUTO)"/>

  <rect x="660" y="550" width="290" height="104" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="805" y="576" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">最小启动 Bean 总数 = 53</text>
  <text x="805" y="600" text-anchor="middle" font-size="10.5" fill="#334155">WebApplicationType.NONE（不起 tomcat）</text>
  <text x="805" y="620" text-anchor="middle" font-size="10.5" fill="#334155">152 个候选，条件不满足都被跳过</text>
  <text x="805" y="640" text-anchor="middle" font-size="10.5" fill="#334155">hello() = 来自 @Service 的定义</text>

  <rect x="40" y="690" width="920" height="72" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="714" font-size="12" font-weight="bold" fill="#0f172a">排查手段</text>
  <text x="60" y="738" font-size="11" fill="#334155">加 --debug（或 debug=true）打印 condition evaluation report：逐条告诉你每个自动配置类「生效了 / 因为什么没生效」</text>
  <text x="60" y="756" font-size="11" fill="#334155">spring.autoconfigure.exclude 可以显式排除某个自动配置类</text>

  <text x="40" y="792" font-size="11" fill="#64748b">小结：那个「一个注解启动应用」的魔法，拆开就是三个注解 + 一个选择器 + 一堆条件判断。</text>
</svg>
