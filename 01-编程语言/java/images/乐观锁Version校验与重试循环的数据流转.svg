<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">乐观锁 @Version 校验与重试循环的数据流转</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">Hibernate 把 version 拼进 UPDATE 的 WHERE；影响行数 = 0 就抛异常，由事务边界之外的 @Retryable 重开一轮</text>

  <rect x="340" y="96" width="340" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="510" y="118" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">① 外层 deduct()：@Retryable 圈住事务</text>
  <text x="510" y="140" text-anchor="middle" font-size="10.5" fill="#1d4ed8">maxAttempts = 5，退避 5~100ms 随机</text>

  <line x1="510" y1="160" x2="510" y2="196" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="340" y="200" width="340" height="64" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="510" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">② 事务内 findById 读出实体（带 version）</text>
  <text x="510" y="244" text-anchor="middle" font-size="10.5" fill="#475569">内存里改 stock，version 暂时不动</text>

  <line x1="510" y1="264" x2="510" y2="300" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="340" y="304" width="340" height="72" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="510" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">③ 提交：UPDATE item SET stock = ?, version = ?</text>
  <text x="510" y="346" text-anchor="middle" font-size="11" fill="#475569">WHERE id = ? AND version = ?</text>
  <text x="510" y="366" text-anchor="middle" font-size="10.5" fill="#475569">MyBatis 手写同一条 SQL，判断返回值</text>

  <line x1="510" y1="376" x2="510" y2="408" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="340" y="412" width="340" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="510" y="436" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#854d0e">④ 判定影响行数</text>
  <text x="510" y="456" text-anchor="middle" font-size="10.5" fill="#b45309">version 已被别人 +1 就匹配不到行</text>

  <line x1="338" y1="442" x2="296" y2="442" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="40" y="412" width="250" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="165" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">affected = 1：提交成功</text>
  <text x="165" y="456" text-anchor="middle" font-size="10.5" fill="#166534">这一轮结束，不再重试</text>

  <line x1="682" y1="442" x2="722" y2="442" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a3)"/>

  <rect x="726" y="408" width="234" height="68" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="843" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">affected = 0：版本已变</text>
  <text x="843" y="450" text-anchor="middle" font-size="10.5" fill="#991b1b">抛 OptimisticLockException</text>
  <text x="843" y="468" text-anchor="middle" font-size="10.5" fill="#991b1b">交给上层重试，别在 mapper 层循环</text>

  <path d="M843,406 L843,232 L686,232" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#a2)"/>
  <text x="858" y="310" font-size="11" fill="#334155">重开一轮完整事务</text>
  <text x="858" y="330" font-size="11" fill="#334155">最多 5 次</text>

  <rect x="24" y="520" width="460" height="96" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="254" y="544" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">❌ 在 @Transactional 里 catch 掉异常是无效的</text>
  <text x="254" y="566" text-anchor="middle" font-size="11" fill="#991b1b">事务已被标记 rollback-only</text>
  <text x="254" y="586" text-anchor="middle" font-size="11" fill="#991b1b">提交时抛 UnexpectedRollbackException</text>

  <rect x="516" y="520" width="460" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="746" y="544" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">✅ 重试必须在事务边界之外</text>
  <text x="746" y="566" text-anchor="middle" font-size="11" fill="#1d4ed8">重试发生在事务内，PersistenceContext 里还是那个旧实体</text>
  <text x="746" y="586" text-anchor="middle" font-size="11" fill="#1d4ed8">与 Go 侧「外层重试而不是事务回调里重试」是同一件事</text>

  <text x="26" y="644" font-size="12.5" fill="#334155">⭐ 重试后再 findById，读到的是新 version——这就是概念侧「比对版本 + 自增版本」在 Java 客户端进程里的落点</text>
</svg>
