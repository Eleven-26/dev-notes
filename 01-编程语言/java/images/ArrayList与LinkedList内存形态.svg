<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ArrayList 与 LinkedList 的内存形态</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">形态差异来自 1.1 五组对照实测：头部插入差 747~1110 倍，下标访问差 685~1500 倍，10 万元素内存差一个数量级</text>

  <rect x="24" y="92" width="952" height="176" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="500" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">ArrayList：一整块连续数组 + 引用槽位</text>

  <rect x="60" y="136" width="72" height="48" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="96" y="164" text-anchor="middle" font-size="10" fill="#1d4ed8">引用</text>
  <rect x="136" y="136" width="72" height="48" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="172" y="164" text-anchor="middle" font-size="10" fill="#1d4ed8">引用</text>
  <rect x="212" y="136" width="72" height="48" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="248" y="164" text-anchor="middle" font-size="10" fill="#1d4ed8">引用</text>
  <rect x="288" y="136" width="72" height="48" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="324" y="164" text-anchor="middle" font-size="10" fill="#1d4ed8">引用</text>
  <rect x="364" y="136" width="72" height="48" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="400" y="164" text-anchor="middle" font-size="10" fill="#1d4ed8">引用</text>
  <rect x="440" y="136" width="72" height="48" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="476" y="164" text-anchor="middle" font-size="10" fill="#1d4ed8">引用</text>
  <rect x="516" y="136" width="72" height="48" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="552" y="164" text-anchor="middle" font-size="10" fill="#1d4ed8">引用</text>
  <rect x="592" y="136" width="72" height="48" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="628" y="164" text-anchor="middle" font-size="10" fill="#1d4ed8">引用</text>
  <text x="690" y="166" text-anchor="middle" font-size="14" fill="#64748b">……</text>
  <text x="810" y="156" text-anchor="middle" font-size="10.5" fill="#334155">容量 = elementData.length</text>
  <text x="810" y="174" text-anchor="middle" font-size="10.5" fill="#334155">10 → 15 → 22 …（1.5 倍）</text>

  <text x="500" y="212" text-anchor="middle" font-size="11" fill="#334155">对象头 16 + 8 + 100000 × 4（压缩指针）≈ 400 KB</text>
  <text x="500" y="240" text-anchor="middle" font-size="11" fill="#991b1b">add(0, x)：System.arraycopy 每次搬动全部已有元素 —— O(n)；get(i)：按地址直接取 —— O(1)</text>

  <rect x="24" y="288" width="952" height="200" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/>
  <text x="500" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">LinkedList：散落在堆上的 Node 对象，用 prev / next 指针串起来</text>

  <rect x="60" y="336" width="150" height="56" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="135" y="368" text-anchor="middle" font-size="10" fill="#c2410c">prev ⇄ item ⇄ next</text>
  <line x1="212" y1="348" x2="266" y2="348" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="268" y1="380" x2="214" y2="380" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="270" y="336" width="150" height="56" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="345" y="368" text-anchor="middle" font-size="10" fill="#c2410c">prev ⇄ item ⇄ next</text>
  <line x1="422" y1="348" x2="476" y2="348" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="478" y1="380" x2="424" y2="380" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="480" y="336" width="150" height="56" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="555" y="368" text-anchor="middle" font-size="10" fill="#c2410c">prev ⇄ item ⇄ next</text>
  <line x1="632" y1="348" x2="686" y2="348" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="688" y1="380" x2="634" y2="380" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="690" y="336" width="150" height="56" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="765" y="368" text-anchor="middle" font-size="10" fill="#c2410c">prev ⇄ item ⇄ next</text>
  <text x="900" y="368" text-anchor="middle" font-size="11" fill="#9a3412">……</text>

  <text x="500" y="424" text-anchor="middle" font-size="11" fill="#334155">每个 Node ≈ 40 字节：对象头 16 + prev 8 + next 8 + 引用 4 + 填充 4 → 10 万个 ≈ 4 MB</text>
  <text x="500" y="452" text-anchor="middle" font-size="11" fill="#991b1b">addFirst：只改两个指针 —— O(1)；get(i)：从表头一步步走 i 步 —— O(n)，慢 685~1500 倍</text>
  <text x="500" y="476" text-anchor="middle" font-size="10.5" fill="#475569">元素分散在堆上，GC 扫描要逐个追踪，代价比连续数组高</text>

  <text x="26" y="516" font-size="12.5" fill="#334155">⭐ 判据：按下标访问多 → ArrayList；只在头部/中间高频插删且几乎不按下标 → 才是 LinkedList 的窄场景</text>
  <text x="26" y="540" font-size="12.5" fill="#64748b">⚠️ 需要栈/队列时用 ArrayDeque（循环数组）；遍历也不是必然慢：20 万规模实测 LinkedList 反而略快 0.7~0.9×</text>
</svg>
