<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arLOCK" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">悲观锁的锁提示与唯一索引幂等闸门</text>
  <text x="40" y="58" font-size="13" fill="#64748b">JPA 用锁提示表达 FOR UPDATE / SKIP_LOCKED；幂等直接依赖唯一索引，别写「先查再插」</text>

  <rect x="40" y="80" width="440" height="380" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="106" font-size="13" font-weight="bold" fill="#0f172a">悲观锁：JPA 锁提示怎么落到 SQL</text>

  <rect x="60" y="122" width="380" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="146" text-anchor="middle" font-size="11.5" fill="#0f172a">@Lock(LockModeType.PESSIMISTIC_WRITE)</text>
  <text x="250" y="166" text-anchor="middle" font-size="10.5" fill="#334155">与原生 SQL 的 FOR UPDATE 同一语义</text>

  <line x1="250" y1="180" x2="250" y2="196" stroke="#334155" stroke-width="1.5" marker-end="url(#arLOCK)"/>

  <rect x="60" y="196" width="380" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="250" y="216" text-anchor="middle" font-size="10.5" fill="#0f172a">SELECT * FROM item WHERE id = ?1 FOR UPDATE</text>
  <text x="250" y="234" text-anchor="middle" font-size="10" fill="#334155">@Query(nativeQuery = true)</text>

  <line x1="250" y1="244" x2="250" y2="262" stroke="#334155" stroke-width="1.5" marker-end="url(#arLOCK)"/>

  <rect x="60" y="262" width="380" height="76" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="250" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">队列型取任务（对应 Go 侧 ScanAndReserve）</text>
  <text x="250" y="304" text-anchor="middle" font-size="10" fill="#334155">findTop10ByStockGreaterThanOrderByIdAsc</text>
  <text x="250" y="322" text-anchor="middle" font-size="10" fill="#334155">@QueryHint lock.timeout = "-2" → -2 = SKIP_LOCKED</text>

  <rect x="60" y="356" width="380" height="88" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="250" y="378" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">悲观锁的三条硬规矩（Java 里一条都不能少）</text>
  <text x="250" y="400" text-anchor="middle" font-size="10.5" fill="#334155">必须在事务里 / 条件必须走索引 / 持锁区间要短</text>
  <text x="250" y="420" text-anchor="middle" font-size="10.5" fill="#334155">@Transactional 只保证「有事务」，不保证走索引</text>

  <rect x="520" y="80" width="440" height="380" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="540" y="106" font-size="13" font-weight="bold" fill="#0f172a">幂等：唯一索引当闸门</text>

  <rect x="560" y="122" width="360" height="76" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="740" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">❌ 先 findById 再 save</text>
  <text x="740" y="166" text-anchor="middle" font-size="10.5" fill="#334155">查与写之间有窗口 → 并发下必然重复</text>
  <text x="740" y="186" text-anchor="middle" font-size="10" fill="#334155">save() 不会自动重试，它只是 merge</text>

  <line x1="740" y1="198" x2="740" y2="216" stroke="#334155" stroke-width="1.5" marker-end="url(#arLOCK)"/>

  <rect x="560" y="216" width="360" height="58" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="740" y="240" text-anchor="middle" font-size="11" fill="#0f172a">INSERT ... ON DUPLICATE KEY UPDATE</text>
  <text x="740" y="260" text-anchor="middle" font-size="10.5" fill="#334155">cnt = cnt + :delta（accumulate）</text>

  <line x1="740" y1="274" x2="740" y2="292" stroke="#334155" stroke-width="1.5" marker-end="url(#arLOCK)"/>

  <rect x="560" y="292" width="360" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="740" y="320" text-anchor="middle" font-size="9.5" fill="#0f172a">doneRepo.insert(new MsgDone(key, LocalDateTime.now()))</text>

  <line x1="740" y1="336" x2="740" y2="352" stroke="#334155" stroke-width="1.5" marker-end="url(#arLOCK)"/>

  <rect x="560" y="352" width="360" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="740" y="380" text-anchor="middle" font-size="10.5" fill="#0f172a">唯一索引冲突 → DuplicateKeyException</text>

  <line x1="740" y1="396" x2="740" y2="412" stroke="#334155" stroke-width="1.5" marker-end="url(#arLOCK)"/>

  <rect x="560" y="412" width="360" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="740" y="437" text-anchor="middle" font-size="10.5" fill="#0f172a">catch → return Ack.DUPLICATE（已处理过）</text>

  <text x="40" y="488" font-size="11" fill="#64748b">小结：闸门靠「唯一索引 + 捕获 DuplicateKeyException」才原子；用 nativeQuery 时锁提示与 SQL 要一致，否则容易只生效一半。</text>
  <text x="40" y="510" font-size="11" fill="#64748b">本图只画 Java 客户端进程内的注解与 SQL 生效路径；行锁本身怎么加、锁在数据库侧怎么释放见并发控制目录。</text>
</svg>
