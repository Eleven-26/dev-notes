<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Java 目录：两条主线各五组，加横切六类</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#64748b">本图只画组级划分；每篇讲什么、位次与前置在两个目录的 README 总纲里各维护一份</text>

  <rect x="15" y="72" width="320" height="320" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.4"/>
  <text x="175" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">主线 A：运行时 12 篇（自下而上）</text>
  <rect x="29" y="104" width="292" height="40" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="175" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">输入与装载 ①–②</text>
  <text x="175" y="136" text-anchor="middle" font-size="10.5" fill="#1d4ed8">类文件与字节码 → 类加载机制</text>
  <line x1="175" y1="144" x2="175" y2="154" stroke="#475569" stroke-width="1.4" marker-end="url(#d)"/>
  <rect x="29" y="156" width="292" height="40" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="175" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">内存布局 ③–④　＋旁支 Unsafe</text>
  <text x="175" y="188" text-anchor="middle" font-size="10.5" fill="#1d4ed8">数据区与栈帧 → 对象布局与引用</text>
  <line x1="175" y1="196" x2="175" y2="206" stroke="#475569" stroke-width="1.4" marker-end="url(#d)"/>
  <rect x="29" y="208" width="292" height="40" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="175" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">执行与控制 ⑤–⑥</text>
  <text x="175" y="240" text-anchor="middle" font-size="10.5" fill="#1d4ed8">JIT 与执行引擎 → 启动与参数体系</text>
  <line x1="175" y1="248" x2="175" y2="258" stroke="#475569" stroke-width="1.4" marker-end="url(#d)"/>
  <rect x="29" y="260" width="292" height="40" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="175" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">回收与调优 ⑦–⑧　＋旁支 堆外内存</text>
  <text x="175" y="292" text-anchor="middle" font-size="10.5" fill="#1d4ed8">回收原理与收集器 → GC 调优与日志</text>
  <line x1="175" y1="300" x2="175" y2="310" stroke="#475569" stroke-width="1.4" marker-end="url(#d)"/>
  <rect x="29" y="312" width="292" height="40" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="175" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">观测与现场 ⑨–⑩</text>
  <text x="175" y="344" text-anchor="middle" font-size="10.5" fill="#1d4ed8">JFR 与诊断工具 → 线上问题排查</text>
  <text x="175" y="378" text-anchor="middle" font-size="11" fill="#334155">分工表与逐篇读序见 运行时/README.md</text>

  <rect x="355" y="72" width="320" height="320" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="1.4"/>
  <text x="515" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">主线 B：并发编程 13 篇（原理到工具）</text>
  <rect x="369" y="104" width="292" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="515" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">地基 ①–②</text>
  <text x="515" y="136" text-anchor="middle" font-size="10.5" fill="#166534">线程基础与生命周期 → JMM 与内存屏障</text>
  <line x1="515" y1="144" x2="515" y2="154" stroke="#475569" stroke-width="1.4" marker-end="url(#d)"/>
  <rect x="369" y="156" width="292" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="515" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">排队与不排队 ③–⑤</text>
  <text x="515" y="188" text-anchor="middle" font-size="10.5" fill="#166534">锁与 AQS → 协作工具类 → 原子类与无锁</text>
  <line x1="515" y1="196" x2="515" y2="206" stroke="#475569" stroke-width="1.4" marker-end="url(#d)"/>
  <rect x="369" y="208" width="292" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="515" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">池与容器 ⑥–⑧</text>
  <text x="515" y="240" text-anchor="middle" font-size="10.5" fill="#166534">线程池 → 并发容器 → ThreadLocal</text>
  <line x1="515" y1="248" x2="515" y2="258" stroke="#475569" stroke-width="1.4" marker-end="url(#d)"/>
  <rect x="369" y="260" width="292" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="515" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">异步与并行 ⑨–⑪</text>
  <text x="515" y="292" text-anchor="middle" font-size="10.5" fill="#166534">异步编排 → ForkJoin → 虚拟线程</text>
  <line x1="515" y1="300" x2="515" y2="310" stroke="#475569" stroke-width="1.4" marker-end="url(#d)"/>
  <rect x="369" y="312" width="292" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="515" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">成本与缺陷 ⑫–⑬</text>
  <text x="515" y="344" text-anchor="middle" font-size="10.5" fill="#166534">线程与进程开销 → 死锁与并发缺陷诊断</text>
  <text x="515" y="378" text-anchor="middle" font-size="11" fill="#334155">分工表与逐篇读序见 并发编程/README.md</text>

  <rect x="695" y="72" width="290" height="320" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/>
  <text x="840" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">横切六类：按需要插读</text>
  <rect x="709" y="104" width="262" height="34" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="840" y="125" text-anchor="middle" font-size="10.5" fill="#854d0e">集合容器（无前置）</text>
  <rect x="709" y="146" width="262" height="34" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="840" y="167" text-anchor="middle" font-size="10.5" fill="#854d0e">Stream 流实战（前置集合容器）</text>
  <rect x="709" y="188" width="262" height="34" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="840" y="209" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Spring-boot 核心（建议先读锁与 AQS）</text>
  <rect x="709" y="230" width="262" height="34" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="840" y="251" text-anchor="middle" font-size="10.5" fill="#854d0e">写冲突控制的 Java 落地</text>
  <rect x="709" y="272" width="262" height="34" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="840" y="293" text-anchor="middle" font-size="10.5" fill="#0f172a">可观测性接入：Jaeger、Skywalking</text>
  <rect x="709" y="314" width="262" height="34" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="840" y="335" text-anchor="middle" font-size="10.5" fill="#0f172a">工程实践接入手册：MQ、RPC、HTTP…</text>
  <text x="840" y="378" text-anchor="middle" font-size="11" fill="#334155">明细表留在 java/README.md 第二节</text>

  <rect x="15" y="404" width="970" height="32" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="500" y="425" text-anchor="middle" font-size="12" fill="#334155">两刀判据：写「这个 API / 原语怎么用」进 并发编程/，写「JVM 怎么执行、怎么存」进 运行时/ —— 与 Go 侧用同一把尺子</text>

  <rect x="15" y="446" width="970" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="30" y="470" font-size="12" fill="#334155">主线位次基本不能倒：GC 回收的是运行时数据区里的东西，而数据区的前提是类已经被加载；并发线的 ③ 锁与 AQS 是线程池与并发容器的地基。</text>
  <text x="30" y="494" font-size="12" fill="#64748b">横切六类不吃主线位次，按当前任务挑一篇插读即可；虚线框外的两篇旁支（Unsafe、堆外内存）只挂在运行时的 ④ 与 ⑦ 之后。</text>
</svg>
