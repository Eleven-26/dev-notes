<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Java 目录导读：两条主线与横切篇目</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">主线 A 自下而上、主线 B 自原理到工具、横切篇按场景插读（顺序与前置关系来自第二节）</text>

  <rect x="24" y="76" width="300" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="174" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">主线 A：运行时（自下而上）</text>

  <rect x="44" y="118" width="260" height="68" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="174" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">类加载机制</text>
  <text x="174" y="158" text-anchor="middle" font-size="11" fill="#1d4ed8">① 装上：类怎么被找到</text>
  <text x="174" y="176" text-anchor="middle" font-size="11" fill="#1d4ed8">验证、准备、解析、初始化</text>

  <line x1="174" y1="186" x2="174" y2="206" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="44" y="210" width="260" height="68" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="174" y="232" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">运行时数据区与栈帧</text>
  <text x="174" y="250" text-anchor="middle" font-size="11" fill="#1d4ed8">② 住在哪：内存怎么分</text>
  <text x="174" y="268" text-anchor="middle" font-size="11" fill="#1d4ed8">局部变量表是 GC Roots 之一</text>

  <line x1="174" y1="278" x2="174" y2="298" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="44" y="302" width="260" height="68" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="174" y="324" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">JVM 与垃圾回收</text>
  <text x="174" y="342" text-anchor="middle" font-size="11" fill="#1d4ed8">③ 怎么清：回收与调优</text>
  <text x="174" y="360" text-anchor="middle" font-size="11" fill="#1d4ed8">收集器演进、GC 日志怎么读</text>

  <text x="174" y="404" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">⭐ 顺序不能倒</text>
  <text x="174" y="424" text-anchor="middle" font-size="11" fill="#334155">回收的是数据区里的东西</text>
  <text x="174" y="442" text-anchor="middle" font-size="11" fill="#334155">而数据区前提是类已加载</text>

  <rect x="344" y="76" width="300" height="380" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="494" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">主线 B：并发（原理到工具）</text>

  <rect x="364" y="118" width="260" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="494" y="138" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">JMM 与内存屏障</text>
  <text x="494" y="156" text-anchor="middle" font-size="11" fill="#166534">① 物理层：可见性问题</text>
  <text x="494" y="174" text-anchor="middle" font-size="10.5" fill="#166534">happens-before 是判据</text>

  <line x1="494" y1="182" x2="494" y2="202" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="364" y="206" width="260" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="494" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">锁与 AQS</text>
  <text x="494" y="246" text-anchor="middle" font-size="11" fill="#166534">② 锁、CAS、AQS 同步器</text>
  <text x="494" y="264" text-anchor="middle" font-size="10.5" fill="#166534">volatile++ 实测丢 2/3 更新</text>

  <line x1="494" y1="270" x2="429" y2="294" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="494" y1="270" x2="559" y2="294" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="364" y="298" width="126" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="427" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">线程池</text>
  <text x="427" y="338" text-anchor="middle" font-size="10.5" fill="#166534">③ 线程怎么管</text>
  <text x="427" y="355" text-anchor="middle" font-size="10" fill="#166534">排队与拒绝</text>

  <rect x="498" y="298" width="126" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="561" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">并发容器</text>
  <text x="561" y="338" text-anchor="middle" font-size="10.5" fill="#166534">④ 共享数据怎么装</text>

  <text x="494" y="396" text-anchor="middle" font-size="11" fill="#334155">JMM 与锁与 AQS 互相印证</text>
  <text x="494" y="416" text-anchor="middle" font-size="11" fill="#334155">「为什么」与「证据」连着读</text>

  <rect x="664" y="76" width="312" height="380" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/>
  <text x="820" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">横切：按需要读</text>

  <rect x="684" y="116" width="272" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="820" y="138" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#854d0e">集合容器</text>
  <text x="820" y="158" text-anchor="middle" font-size="11" fill="#b45309">无前置，选 List / Map 时读</text>

  <line x1="820" y1="176" x2="820" y2="196" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="684" y="200" width="272" height="58" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="820" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#854d0e">Stream 流实战</text>
  <text x="820" y="242" text-anchor="middle" font-size="11" fill="#b45309">前置：集合容器</text>

  <rect x="684" y="286" width="272" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="820" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">Spring-boot 核心</text>
  <text x="820" y="326" text-anchor="middle" font-size="11" fill="#1d4ed8">排查「注解为什么不生效」先读</text>
  <text x="820" y="344" text-anchor="middle" font-size="10.5" fill="#1d4ed8">建议前置：锁与AQS（单例线程安全）</text>

  <line x1="624" y1="238" x2="682" y2="312" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#a2)"/>

  <rect x="684" y="386" width="272" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="820" y="406" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">写冲突控制的 Java 落地</text>
  <text x="820" y="426" text-anchor="middle" font-size="11" fill="#475569">概念侧在 03 并发控制目录</text>

  <text x="26" y="486" font-size="12.5" fill="#334155">⭐ 接入手册（Jaeger / SkyWalking / Kafka / RocketMQ / gRPC）用时再查——组件本体与选型在 03-数据与中间件</text>
  <text x="26" y="510" font-size="12.5" fill="#64748b">分工：GC 算法层在 02-计算机基础/垃圾回收，模式本体在 05-设计模式，本目录只讲 Java 侧机制与实现</text>
</svg>
