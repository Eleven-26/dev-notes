<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arMF" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">map 一对一与 flatMap 拍平的形态对照</text>
  <text x="40" y="58" font-size="13" fill="#64748b">第一节的两条链：单层 list 用 map 取字段；双层 list 用 flatMap 先把嵌套结构拍平</text>

  <rect x="40" y="80" width="440" height="250" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="106" font-size="13" font-weight="bold" fill="#0f172a">map：一对一转换</text>
  <text x="60" y="126" font-size="11" fill="#64748b">List&lt;Item&gt; list = new ArrayList&lt;&gt;()</text>

  <rect x="70" y="146" width="70" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="105" y="171" text-anchor="middle" font-size="11" fill="#0f172a">Item</text>
  <rect x="150" y="146" width="70" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="185" y="171" text-anchor="middle" font-size="11" fill="#0f172a">Item</text>
  <rect x="230" y="146" width="70" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="265" y="171" text-anchor="middle" font-size="11" fill="#0f172a">Item</text>

  <line x1="105" y1="186" x2="105" y2="236" stroke="#334155" stroke-width="1.5" marker-end="url(#arMF)"/>
  <line x1="185" y1="186" x2="185" y2="236" stroke="#334155" stroke-width="1.5" marker-end="url(#arMF)"/>
  <line x1="265" y1="186" x2="265" y2="236" stroke="#334155" stroke-width="1.5" marker-end="url(#arMF)"/>
  <text x="300" y="215" font-size="10" fill="#334155">map(Item::getId)</text>

  <rect x="70" y="236" width="70" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="105" y="261" text-anchor="middle" font-size="11" fill="#0f172a">id</text>
  <rect x="150" y="236" width="70" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="185" y="261" text-anchor="middle" font-size="11" fill="#0f172a">id</text>
  <rect x="230" y="236" width="70" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="265" y="261" text-anchor="middle" font-size="11" fill="#0f172a">id</text>
  <text x="70" y="300" font-size="10" fill="#64748b">结果仍是单层 List&lt;String&gt; ids</text>

  <rect x="520" y="80" width="440" height="250" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="540" y="106" font-size="13" font-weight="bold" fill="#0f172a">flatMap：一对多后拍平</text>
  <text x="540" y="126" font-size="11" fill="#64748b">List&lt;List&lt;Item&gt;&gt; nestedItemList</text>

  <rect x="550" y="146" width="180" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="558" y="153" width="76" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="596" y="173" text-anchor="middle" font-size="11" fill="#0f172a">Item</text>
  <rect x="646" y="153" width="76" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="684" y="173" text-anchor="middle" font-size="11" fill="#0f172a">Item</text>

  <rect x="550" y="206" width="180" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="558" y="213" width="76" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="596" y="233" text-anchor="middle" font-size="11" fill="#0f172a">Item</text>
  <text x="550" y="272" font-size="10" fill="#64748b">外层里的两个 innerList</text>
  <line x1="730" y1="168" x2="774" y2="194" stroke="#334155" stroke-width="1.5" marker-end="url(#arMF)"/>
  <line x1="730" y1="228" x2="774" y2="212" stroke="#334155" stroke-width="1.5" marker-end="url(#arMF)"/>

  <rect x="780" y="168" width="170" height="64" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="792" y="178" width="44" height="26" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="814" y="196" text-anchor="middle" font-size="10" fill="#0f172a">id</text>
  <rect x="842" y="178" width="44" height="26" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="864" y="196" text-anchor="middle" font-size="10" fill="#0f172a">id</text>
  <rect x="892" y="178" width="44" height="26" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="914" y="196" text-anchor="middle" font-size="10" fill="#0f172a">id</text>
  <text x="865" y="222" text-anchor="middle" font-size="9.5" fill="#334155">collect(Collectors.toList())</text>

  <text x="540" y="282" font-size="10" fill="#334155">flatMap(innerList -&gt;</text>
  <text x="540" y="300" font-size="10" fill="#334155">innerList.stream().map(Item::getId))</text>

  <text x="40" y="358" font-size="12" fill="#334155">⭐ map 是一对一转换，flatMap 是一对多后拍平 —— 处理嵌套集合必须用 flatMap</text>
  <text x="40" y="382" font-size="11" fill="#64748b">小结：外层是 List&lt;List&lt;Item&gt;&gt;，拍平并取字段后仍是单层 List&lt;String&gt;；两个 innerList 的元素都并进同一个结果列表</text>
</svg>
