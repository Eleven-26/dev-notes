<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arGROW" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">ArrayList 的扩容轨迹与一次复制的数据流转</text>
  <text x="40" y="58" font-size="13" fill="#64748b">反射读 elementData.length 的真实轨迹；三个数字：懒初始化、默认 10、1.5 倍</text>

  <rect x="40" y="84" width="60" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="70" y="108" text-anchor="middle" font-size="12" fill="#0f172a">0</text>
  <text x="70" y="136" text-anchor="middle" font-size="9.5" fill="#64748b">容量 0</text>

  <line x1="100" y1="102" x2="116" y2="102" stroke="#334155" stroke-width="1.5" marker-end="url(#arGROW)"/>
  <rect x="116" y="84" width="60" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="146" y="108" text-anchor="middle" font-size="12" fill="#0f172a">10</text>
  <text x="146" y="136" text-anchor="middle" font-size="9.5" fill="#64748b">首次 add</text>

  <line x1="176" y1="102" x2="192" y2="102" stroke="#334155" stroke-width="1.5" marker-end="url(#arGROW)"/>
  <rect x="192" y="84" width="60" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="222" y="108" text-anchor="middle" font-size="12" fill="#0f172a">15</text>
  <text x="222" y="136" text-anchor="middle" font-size="9.5" fill="#64748b">第11个</text>

  <line x1="252" y1="102" x2="268" y2="102" stroke="#334155" stroke-width="1.5" marker-end="url(#arGROW)"/>
  <rect x="268" y="84" width="60" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="298" y="108" text-anchor="middle" font-size="12" fill="#0f172a">22</text>
  <text x="298" y="136" text-anchor="middle" font-size="9.5" fill="#64748b">第16个</text>

  <line x1="328" y1="102" x2="344" y2="102" stroke="#334155" stroke-width="1.5" marker-end="url(#arGROW)"/>
  <rect x="344" y="84" width="60" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="374" y="108" text-anchor="middle" font-size="12" fill="#0f172a">33</text>
  <text x="374" y="136" text-anchor="middle" font-size="9.5" fill="#64748b">第23个</text>

  <line x1="404" y1="102" x2="420" y2="102" stroke="#334155" stroke-width="1.5" marker-end="url(#arGROW)"/>
  <rect x="420" y="84" width="60" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="108" text-anchor="middle" font-size="12" fill="#0f172a">49</text>
  <text x="450" y="136" text-anchor="middle" font-size="9.5" fill="#64748b">第34个</text>

  <line x1="480" y1="102" x2="496" y2="102" stroke="#334155" stroke-width="1.5" marker-end="url(#arGROW)"/>
  <rect x="496" y="84" width="60" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="526" y="108" text-anchor="middle" font-size="12" fill="#0f172a">73</text>
  <text x="526" y="136" text-anchor="middle" font-size="9.5" fill="#64748b">第50个</text>

  <line x1="556" y1="102" x2="572" y2="102" stroke="#334155" stroke-width="1.5" marker-end="url(#arGROW)"/>
  <rect x="572" y="84" width="60" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="602" y="108" text-anchor="middle" font-size="12" fill="#0f172a">109</text>
  <text x="602" y="136" text-anchor="middle" font-size="9.5" fill="#64748b">第74个</text>

  <line x1="632" y1="102" x2="648" y2="102" stroke="#334155" stroke-width="1.5" marker-end="url(#arGROW)"/>
  <rect x="648" y="84" width="60" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="678" y="108" text-anchor="middle" font-size="12" fill="#0f172a">163</text>
  <text x="678" y="136" text-anchor="middle" font-size="9.5" fill="#64748b">第110个</text>

  <line x1="708" y1="102" x2="724" y2="102" stroke="#334155" stroke-width="1.5" marker-end="url(#arGROW)"/>
  <rect x="724" y="84" width="60" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="754" y="108" text-anchor="middle" font-size="12" fill="#0f172a">244</text>
  <text x="754" y="136" text-anchor="middle" font-size="9.5" fill="#64748b">第164个</text>

  <line x1="784" y1="102" x2="800" y2="102" stroke="#334155" stroke-width="1.5" marker-end="url(#arGROW)"/>
  <rect x="800" y="84" width="60" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="830" y="108" text-anchor="middle" font-size="12" fill="#0f172a">366</text>
  <text x="830" y="136" text-anchor="middle" font-size="9.5" fill="#64748b">第245个</text>

  <line x1="860" y1="102" x2="876" y2="102" stroke="#334155" stroke-width="1.5" marker-end="url(#arGROW)"/>
  <rect x="876" y="84" width="60" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="906" y="108" text-anchor="middle" font-size="12" fill="#0f172a">549</text>
  <text x="906" y="136" text-anchor="middle" font-size="9.5" fill="#64748b">第367个</text>

  <rect x="40" y="152" width="440" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="260" y="178" text-anchor="middle" font-size="11" fill="#0f172a">扩容公式 oldCap + (oldCap >> 1) → 恰好 1.5 倍（向下取整）</text>

  <rect x="520" y="152" width="440" height="44" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="740" y="178" text-anchor="middle" font-size="11" fill="#0f172a">2× 的峰值内存要能容纳「旧 + 新」两份；1.1× 则扩容次数多</text>

  <rect x="60" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="82" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="104" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="126" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="148" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="170" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="192" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="214" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="236" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="258" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="60" y="294" font-size="10" fill="#334155">旧数组：elementData.length = 10，已放满</text>

  <line x1="282" y1="252" x2="358" y2="252" stroke="#334155" stroke-width="1.5" marker-end="url(#arGROW)"/>
  <text x="320" y="242" text-anchor="middle" font-size="10" fill="#0f172a">Arrays.copyOf</text>

  <rect x="360" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="382" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="404" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="426" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="448" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="470" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="492" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="514" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="536" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="558" y="230" width="22" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="580" y="230" width="22" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="602" y="230" width="22" height="44" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="624" y="230" width="22" height="44" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="646" y="230" width="22" height="44" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="668" y="230" width="22" height="44" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="360" y="294" font-size="10" fill="#334155">新数组：容量 15，复制前 10 个，第 11 个是本次 add 的元素</text>

  <text x="60" y="316" font-size="10" fill="#64748b">旧数组被整个换下 → 扩容产生的旧数组是分配速率与 GC 压力的显著来源</text>

  <rect x="40" y="336" width="440" height="76" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="260" y="358" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">懒初始化：存的是共享的空数组</text>
  <text x="260" y="378" text-anchor="middle" font-size="10" fill="#334155">DEFAULTCAPACITY_EMPTY_ELEMENTDATA</text>
  <text x="260" y="398" text-anchor="middle" font-size="10.5" fill="#334155">第一次 add 才分配 10，避免空列表各占一个数组</text>

  <rect x="520" y="336" width="440" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="740" y="358" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">规模已知就预分配</text>
  <text x="740" y="378" text-anchor="middle" font-size="10" fill="#334155">new ArrayList&lt;&gt;(expectedSize)</text>
  <text x="740" y="398" text-anchor="middle" font-size="10" fill="#334155">new ArrayList&lt;&gt;(200000) 初始容量 = 200000，一次扩容都不用</text>

  <rect x="40" y="428" width="920" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="454" text-anchor="middle" font-size="11" fill="#0f172a">对照 HashMap：容量必须翻倍（16 → 32 → 64 → 128），因为定位要用 (n-1) &amp; hash；ArrayList 没有这个约束，所以可以取 1.5</text>

  <text x="40" y="502" font-size="11" fill="#64748b">小结：容量轨迹 10 → 15 → 22 → 33 → 49 → 73 → 109 → 163 → 244 → 366 → 549 全部由反射读出，公式是 oldCap + (oldCap >> 1)。</text>
</svg>
