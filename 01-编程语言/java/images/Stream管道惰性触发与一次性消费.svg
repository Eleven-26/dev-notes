<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="530" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Stream 管道：中间操作只记账，终端操作才触发</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">对应第一节链式写法与第七节坑表：中间操作只登记，终端操作一次性遍历整条链；流是一次性的</text>

  <rect x="24" y="100" width="170" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="109" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">数据源</text>
  <text x="109" y="148" text-anchor="middle" font-size="10.5" fill="#1d4ed8">List / 嵌套 List</text>
  <text x="109" y="166" text-anchor="middle" font-size="10.5" fill="#1d4ed8">list.stream()</text>

  <line x1="196" y1="148" x2="226" y2="148" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="230" y="96" width="470" height="104" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="465" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#854d0e">中间操作 —— 只记账，不遍历</text>

  <rect x="250" y="136" width="90" height="48" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="295" y="156" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#854d0e">map</text>
  <text x="295" y="174" text-anchor="middle" font-size="10" fill="#b45309">一对一</text>

  <line x1="342" y1="160" x2="361" y2="160" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="365" y="136" width="90" height="48" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="410" y="156" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#854d0e">flatMap</text>
  <text x="410" y="174" text-anchor="middle" font-size="10" fill="#b45309">一对多拍平</text>

  <line x1="457" y1="160" x2="476" y2="160" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="480" y="136" width="90" height="48" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="525" y="156" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#854d0e">filter</text>
  <text x="525" y="174" text-anchor="middle" font-size="10" fill="#b45309">过滤空值</text>

  <line x1="572" y1="160" x2="591" y2="160" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="595" y="136" width="90" height="48" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="640" y="156" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#854d0e">distinct</text>
  <text x="640" y="174" text-anchor="middle" font-size="10" fill="#b45309">去重</text>

  <line x1="704" y1="148" x2="736" y2="148" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="740" y="96" width="236" height="104" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="858" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">终端操作 —— 才触发</text>
  <text x="858" y="142" text-anchor="middle" font-size="10.5" fill="#166534">collect / sum / forEach</text>
  <text x="858" y="162" text-anchor="middle" font-size="10.5" fill="#166534">此刻整条链遍历一次</text>
  <text x="858" y="182" text-anchor="middle" font-size="10.5" fill="#166534">消费后流即作废</text>

  <rect x="24" y="240" width="300" height="108" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="174" y="264" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">流不能复用</text>
  <text x="174" y="286" text-anchor="middle" font-size="11" fill="#991b1b">被消费后再次操作直接抛</text>
  <text x="174" y="306" text-anchor="middle" font-size="10.5" fill="#991b1b">stream has already been</text>
  <text x="174" y="324" text-anchor="middle" font-size="10.5" fill="#991b1b">operated upon or closed</text>

  <rect x="344" y="240" width="300" height="108" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="494" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#854d0e">sorted() 后忘 collect = 没执行</text>
  <text x="494" y="286" text-anchor="middle" font-size="11" fill="#b45309">中间操作只登记不执行</text>
  <text x="494" y="306" text-anchor="middle" font-size="11" fill="#b45309">不接终端操作什么都不跑</text>
  <text x="494" y="324" text-anchor="middle" font-size="11" fill="#b45309">链很长 ≠ 遍历很多次</text>

  <rect x="676" y="240" width="300" height="108" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="826" y="264" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#854d0e">其余两条边界</text>
  <text x="826" y="286" text-anchor="middle" font-size="10.5" fill="#b45309">流中改源集合抛 ConcurrentModification</text>
  <text x="826" y="306" text-anchor="middle" font-size="10.5" fill="#b45309">Exception（先收集再动原集合）</text>
  <text x="826" y="324" text-anchor="middle" font-size="10.5" fill="#b45309">parallelStream 小数据反而更慢</text>

  <text x="500" y="378" text-anchor="middle" font-size="11.5" fill="#334155">第一节的真实链路：前面四步都只记账，最后一步才把所有动作一口气跑完</text>

  <rect x="40" y="390" width="160" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="120" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">list.stream()</text>
  <text x="120" y="434" text-anchor="middle" font-size="10" fill="#1d4ed8">数据源</text>

  <line x1="200" y1="420" x2="218" y2="420" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="220" y="390" width="160" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="300" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#854d0e">map(Item::getId)</text>
  <text x="300" y="434" text-anchor="middle" font-size="10" fill="#b45309">取一列</text>

  <line x1="380" y1="420" x2="398" y2="420" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="400" y="390" width="160" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="480" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#854d0e">filter(id -&gt; 非空)</text>
  <text x="480" y="434" text-anchor="middle" font-size="10" fill="#b45309">过滤空值</text>

  <line x1="560" y1="420" x2="578" y2="420" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="580" y="390" width="160" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="660" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#854d0e">distinct()</text>
  <text x="660" y="434" text-anchor="middle" font-size="10" fill="#b45309">去重</text>

  <line x1="740" y1="420" x2="758" y2="420" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="760" y="390" width="160" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="840" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">collect(toList())</text>
  <text x="840" y="434" text-anchor="middle" font-size="10" fill="#166534">终端：这步才真跑</text>

  <text x="26" y="486" font-size="12.5" fill="#334155">⭐ 调试判据：惰性求值让断点位置与直觉不同——先确认是哪个终端操作触发了遍历（延伸追问「惰性求值意味着什么」）</text>
  <text x="26" y="510" font-size="12.5" fill="#64748b">⚠️ 想「复用」就重新 list.stream()；嵌套 List&lt;List&gt; 必须先 flatMap 拍平，map 只能一对一</text>
</svg>
