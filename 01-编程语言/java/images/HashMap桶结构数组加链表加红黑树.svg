<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="1000" height="630" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="630" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">HashMap 桶的形态：数组 + 链表 + 红黑树</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">JDK 8：table 懒分配（第 1 次 put 才建 16 长度）；桶下标 = (n-1) &amp; hash；链长超 8 且容量 ≥ 64 才树化</text>

  <rect x="40" y="110" width="72" height="56" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="76" y="142" text-anchor="middle" font-size="10" fill="#1d4ed8">空</text>
  <rect x="130" y="110" width="72" height="56" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="166" y="142" text-anchor="middle" font-size="10" fill="#1d4ed8">空</text>
  <rect x="220" y="110" width="72" height="56" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="256" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#9a3412">链表桶</text>
  <text x="256" y="154" text-anchor="middle" font-size="9" fill="#c2410c">Node 头</text>
  <rect x="310" y="110" width="72" height="56" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="346" y="142" text-anchor="middle" font-size="10" fill="#1d4ed8">空</text>
  <rect x="400" y="110" width="72" height="56" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="436" y="142" text-anchor="middle" font-size="10" fill="#1d4ed8">空</text>
  <rect x="490" y="110" width="72" height="56" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="526" y="142" text-anchor="middle" font-size="10" fill="#1d4ed8">空</text>
  <rect x="580" y="110" width="72" height="56" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="616" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">树桶</text>
  <text x="616" y="154" text-anchor="middle" font-size="9" fill="#166534">TreeNode 根</text>
  <rect x="670" y="110" width="72" height="56" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="706" y="142" text-anchor="middle" font-size="10" fill="#1d4ed8">空</text>
  <rect x="760" y="110" width="72" height="56" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="796" y="142" text-anchor="middle" font-size="10" fill="#1d4ed8">空</text>
  <rect x="850" y="110" width="72" height="56" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="886" y="142" text-anchor="middle" font-size="10" fill="#1d4ed8">空</text>

  <text x="500" y="204" text-anchor="middle" font-size="11" fill="#334155">Node&lt;K,V&gt;[] table —— 每个桶是一条链表（或一棵红黑树）</text>

  <rect x="156" y="232" width="200" height="56" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="256" y="254" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#9a3412">Node { hash, key, value, next }</text>
  <text x="256" y="274" text-anchor="middle" font-size="10" fill="#c2410c">key 相同则覆盖</text>

  <line x1="256" y1="288" x2="256" y2="302" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="156" y="304" width="200" height="56" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="256" y="326" text-anchor="middle" font-size="10" font-weight="bold" fill="#9a3412">Node（第 2 个）</text>
  <text x="256" y="346" text-anchor="middle" font-size="10" fill="#c2410c">JDK 8 尾插（7 是头插）</text>

  <line x1="256" y1="360" x2="256" y2="374" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="156" y="376" width="200" height="56" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="256" y="398" text-anchor="middle" font-size="10" font-weight="bold" fill="#9a3412">Node（链尾）</text>
  <text x="256" y="418" text-anchor="middle" font-size="10" fill="#c2410c">长度超过 8？再看容量</text>

  <rect x="571" y="232" width="90" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="616" y="256" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#14532d">TreeNode</text>

  <line x1="601" y1="272" x2="561" y2="316" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="631" y1="272" x2="671" y2="316" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="501" y="316" width="80" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="541" y="338" text-anchor="middle" font-size="9.5" fill="#14532d">左孩子</text>
  <rect x="651" y="316" width="80" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="691" y="338" text-anchor="middle" font-size="9.5" fill="#14532d">右孩子</text>

  <text x="616" y="390" text-anchor="middle" font-size="10.5" fill="#14532d">按 hash 与 key 比较后插入 / 覆盖</text>
  <text x="616" y="414" text-anchor="middle" font-size="10" fill="#475569">多 parent / left / right / prev / red</text>

  <rect x="24" y="466" width="300" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="174" y="490" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">桶为空</text>
  <text x="174" y="512" text-anchor="middle" font-size="11" fill="#1d4ed8">直接放一个新 Node</text>
  <text x="174" y="532" text-anchor="middle" font-size="11" fill="#1d4ed8">无需比较链表</text>

  <rect x="344" y="466" width="312" height="86" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="500" y="488" text-anchor="middle" font-size="12" font-weight="bold" fill="#854d0e">桶是链表</text>
  <text x="500" y="508" text-anchor="middle" font-size="10.5" fill="#b45309">遍历：key 相同覆盖，否则尾插</text>
  <text x="500" y="526" text-anchor="middle" font-size="10.5" fill="#b45309">链长 &gt; 8 且容量 ≥ 64 → 树化</text>
  <text x="500" y="544" text-anchor="middle" font-size="10.5" fill="#b45309">容量不足 64 时优先 resize 打散</text>

  <rect x="676" y="466" width="300" height="86" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="826" y="490" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">桶是红黑树</text>
  <text x="826" y="512" text-anchor="middle" font-size="11" fill="#166534">按 hash 与 key 比较插入 / 覆盖</text>
  <text x="826" y="532" text-anchor="middle" font-size="10.5" fill="#166534">TreeNode extends Node</text>

  <text x="26" y="586" font-size="12.5" fill="#334155">⭐ 扰动 h ^ (h &gt;&gt;&gt; 16) 把高 16 位折进低位参与定位——容量 16 时不扰动的一批 key 会全撞进同一个桶（实测 4 个 key 分散到 1~4 号桶）</text>
  <text x="26" y="612" font-size="12.5" fill="#64748b">⚠️ 树不是常态：理想散列下桶内节点数到 8 的概率约 0.00000006，一旦树化说明 hashCode 实现有问题</text>
</svg>
