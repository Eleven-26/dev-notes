<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Bean 生命周期：八个阶段的回调顺序（实测）</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">实验 2：构造器 → 依赖注入 → @PostConstruct → afterPropertiesSet → initMethod → 使用中 → close 后 @PreDestroy → destroyMethod</text>

  <rect x="40" y="104" width="200" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="140" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">① 实例化（构造器）</text>
  <text x="140" y="148" text-anchor="middle" font-size="10.5" fill="#1d4ed8">singleton 启动时就建好</text>
  <text x="140" y="166" text-anchor="middle" font-size="10.5" fill="#1d4ed8">@Lazy 则首次访问才建</text>

  <line x1="240" y1="142" x2="278" y2="142" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="280" y="104" width="200" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="380" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">② 属性填充</text>
  <text x="380" y="148" text-anchor="middle" font-size="10.5" fill="#1d4ed8">依赖注入（setter / 字段）</text>
  <text x="380" y="166" text-anchor="middle" font-size="10.5" fill="#1d4ed8">prototype 每次 getBean 新建</text>

  <line x1="480" y1="142" x2="518" y2="142" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="520" y="104" width="200" height="76" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="620" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">③ @PostConstruct</text>
  <text x="620" y="148" text-anchor="middle" font-size="10.5" fill="#c2410c">jakarta 标准注解</text>
  <text x="620" y="166" text-anchor="middle" font-size="10.5" fill="#c2410c">不用实现 Spring 接口</text>

  <line x1="720" y1="142" x2="758" y2="142" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="760" y="104" width="200" height="76" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="860" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">④ afterPropertiesSet</text>
  <text x="860" y="148" text-anchor="middle" font-size="10.5" fill="#c2410c">实现 InitializingBean</text>
  <text x="860" y="166" text-anchor="middle" font-size="10.5" fill="#c2410c">接口回调</text>

  <line x1="860" y1="180" x2="860" y2="212" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="760" y="216" width="200" height="76" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="860" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">⑤ initMethod</text>
  <text x="860" y="262" text-anchor="middle" font-size="10.5" fill="#c2410c">@Bean(initMethod = "xxx")</text>
  <text x="860" y="280" text-anchor="middle" font-size="10.5" fill="#c2410c">写在配置类上</text>

  <line x1="758" y1="254" x2="722" y2="254" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="520" y="216" width="200" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="620" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">⑥ 使用中</text>
  <text x="620" y="260" text-anchor="middle" font-size="10.5" fill="#166534">就绪，对外服务</text>
  <text x="620" y="278" text-anchor="middle" font-size="10.5" fill="#166534">容器 close 后进入销毁</text>

  <line x1="518" y1="254" x2="482" y2="254" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="280" y="216" width="200" height="76" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="380" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">⑦ @PreDestroy</text>
  <text x="380" y="260" text-anchor="middle" font-size="10.5" fill="#991b1b">仅容器管理的单例执行</text>
  <text x="380" y="278" text-anchor="middle" font-size="10.5" fill="#991b1b">prototype 不会执行</text>

  <line x1="278" y1="254" x2="242" y2="254" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="40" y="216" width="200" height="76" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="140" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">⑧ destroyMethod</text>
  <text x="140" y="262" text-anchor="middle" font-size="10.5" fill="#991b1b">@Bean(destroyMethod = "xxx")</text>

  <rect x="40" y="340" width="440" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="260" y="364" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">三种初始化写法语义等价</text>
  <text x="260" y="386" text-anchor="middle" font-size="11" fill="#334155">③④⑤ 都会执行，顺序是确定性的</text>
  <text x="260" y="406" text-anchor="middle" font-size="11" fill="#334155">推荐 @PostConstruct：类不实现 Spring 接口，解耦更好</text>

  <rect x="520" y="340" width="440" height="96" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="740" y="364" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#854d0e">销毁回调的执行条件</text>
  <text x="740" y="386" text-anchor="middle" font-size="11" fill="#b45309">Bean 必须是容器管理的单例</text>
  <text x="740" y="406" text-anchor="middle" font-size="11" fill="#b45309">且容器要正常 close()（try-with-resources 或 shutdown hook）</text>

  <text x="26" y="464" font-size="12.5" fill="#334155">⚠️ prototype 注入 singleton 的坑：单例创建时只注入一次，之后持有的永远是同一个 prototype 实例——解法是注入 ObjectProvider，每次用时 getObject() 取新的</text>
</svg>
