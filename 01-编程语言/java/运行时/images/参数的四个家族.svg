<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">四类参数，四个层次：只有第二类进得了 VM 的标志表</text>
  <rect x="32" y="52" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="68" font-size="13" fill="#64748b">四个框按「谁读它」排列；底部一行标的是它在 PrintFlagsFinal 里出不出现。</text>

  <rect x="32" y="92" width="222" height="290" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="118" font-size="15" font-weight="bold" fill="#334155">-XX　真实标志</text>
  <text x="48" y="140" font-size="12" fill="#64748b">HotSpot 内部的 Flag 表</text>
  <rect x="48" y="152" width="190" height="52" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="58" y="172" font-size="12" font-family="Consolas, monospace" fill="#1e40af">-XX:MaxHeapSize=1g</text>
  <text x="58" y="192" font-size="12" font-family="Consolas, monospace" fill="#1e40af">-XX:+UseG1GC</text>
  <text x="48" y="228" font-size="12" fill="#475569">514 条默认可见</text>
  <text x="48" y="248" font-size="12" fill="#475569">再加解锁到 912 条</text>
  <rect x="48" y="264" width="190" height="46" rx="5" fill="#dbeafe"/>
  <text x="58" y="283" font-size="12" font-weight="bold" fill="#1e3a8a">PrintFlagsFinal</text>
  <text x="58" y="301" font-size="12" font-weight="bold" fill="#1e3a8a">里看得见</text>

  <rect x="266" y="92" width="222" height="290" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="282" y="118" font-size="15" font-weight="bold" fill="#334155">-X　别名</text>
  <text x="282" y="140" font-size="12" fill="#64748b">启动器翻译后再交给 VM</text>
  <rect x="282" y="152" width="190" height="52" rx="5" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="292" y="172" font-size="12" font-family="Consolas, monospace" fill="#6d28d9">-Xmx -Xss -Xmn -Xint</text>
  <text x="292" y="192" font-size="12" font-family="Consolas, monospace" fill="#6d28d9">-Xshare:off</text>
  <text x="282" y="228" font-size="12" fill="#475569">一条可能变两条：</text>
  <text x="282" y="248" font-size="12" fill="#475569">-Xint = 关分层 + 关 profile</text>
  <rect x="282" y="264" width="190" height="46" rx="5" fill="#ede9fe"/>
  <text x="292" y="283" font-size="12" font-weight="bold" fill="#4c1d95">看不见（已翻译）</text>
  <text x="292" y="301" font-size="12" fill="#4c1d95">但要小心 -Xshare 无对应</text>

  <rect x="500" y="92" width="222" height="290" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="516" y="118" font-size="15" font-weight="bold" fill="#334155">-D　系统属性</text>
  <text x="516" y="140" font-size="12" fill="#64748b">启动器拆出来，别处消费</text>
  <rect x="516" y="152" width="190" height="52" rx="5" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="526" y="172" font-size="12" font-family="Consolas, monospace" fill="#047857">-Dfoo=bar</text>
  <text x="526" y="192" font-size="12" font-family="Consolas, monospace" fill="#047857">-Dspring.profiles=prod</text>
  <text x="516" y="228" font-size="12" fill="#475569">进 Properties</text>
  <text x="516" y="248" font-size="12" fill="#475569">本机实测 49 个属性</text>
  <rect x="516" y="264" width="190" height="46" rx="5" fill="#d1fae5"/>
  <text x="526" y="283" font-size="12" font-weight="bold" fill="#065f46">看不见（grep 计数 0）</text>
  <text x="526" y="301" font-size="12" fill="#065f46">用 jcmd VM.system_properties</text>

  <rect x="734" y="92" width="234" height="290" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="750" y="118" font-size="15" font-weight="bold" fill="#334155">启动器参数</text>
  <text x="750" y="140" font-size="12" fill="#64748b">java 命令自己处理</text>
  <rect x="750" y="152" width="202" height="52" rx="5" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="760" y="172" font-size="12" font-family="Consolas, monospace" fill="#c2410c">-cp -jar @argfile</text>
  <text x="760" y="192" font-size="12" font-family="Consolas, monospace" fill="#c2410c">--add-opens</text>
  <text x="750" y="228" font-size="12" fill="#475569">VM 完全不知道</text>
  <text x="750" y="248" font-size="12" fill="#475569">--add-opens 属 module 层</text>
  <rect x="750" y="264" width="202" height="46" rx="5" fill="#ffedd5"/>
  <text x="760" y="283" font-size="12" font-weight="bold" fill="#9a3412">看不见</text>
  <text x="760" y="301" font-size="12" fill="#9a3412">失效时先看位置对不对</text>

  <rect x="32" y="398" width="936" height="52" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="48" y="420" font-size="13" font-weight="bold" fill="#991b1b">最常踩的坑：写在了类名或 -jar 之后</text>
  <text x="48" y="440" font-size="13" fill="#7f1d1d">java After -Xmx64m → maxHeap 仍是 1484 MiB，-Xmx64m 原封不动进了 args（本机实测）</text>
</svg>
