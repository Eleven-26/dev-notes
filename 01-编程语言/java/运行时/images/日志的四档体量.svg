<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">同一份 640 ms 的负载，四档开关差 120 倍</text>
  <rect x="32" y="52" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="68" font-size="13" fill="#64748b">-Xmx256m / G1 / 512 MB 分配 / 32 MB 存活，行数为实测值。</text>

  <rect x="32" y="92" width="936" height="266" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="116" font-size="12" font-weight="bold" fill="#64748b">开关</text>
  <text x="330" y="116" font-size="12" font-weight="bold" fill="#64748b">能回答什么</text>
  <text x="720" y="116" font-size="12" font-weight="bold" fill="#64748b">行数</text>
  <line x1="52" y1="126" x2="948" y2="126" stroke="#e2e8f0"/>

  <rect x="52" y="138" width="250" height="26" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="64" y="156" font-size="12" font-family="Consolas, monospace" fill="#166534">-Xlog:gc</text>
  <text x="330" y="156" font-size="12" fill="#334155">类型、原因、整堆前后、停顿</text>
  <text x="720" y="156" font-size="12" font-family="Consolas, monospace" fill="#166534">12</text>

  <rect x="52" y="186" width="250" height="26" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="64" y="204" font-size="12" font-family="Consolas, monospace" fill="#1e3a8a">-Xlog:gc+heap=info</text>
  <text x="330" y="204" font-size="12" fill="#334155">加上 Eden / Old / Humongous 的 region 数</text>
  <text x="720" y="204" font-size="12" font-family="Consolas, monospace" fill="#1e3a8a">约 50</text>

  <rect x="52" y="234" width="250" height="26" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="64" y="252" font-size="12" font-family="Consolas, monospace" fill="#92400e">-Xlog:gc+age=trace</text>
  <text x="330" y="252" font-size="12" fill="#334155">晋升年龄分布、动态阈值</text>
  <text x="720" y="252" font-size="12" font-family="Consolas, monospace" fill="#92400e">每次 +2~20</text>

  <rect x="52" y="282" width="250" height="26" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="64" y="300" font-size="12" font-family="Consolas, monospace" fill="#991b1b">-Xlog:gc+phases=debug</text>
  <text x="330" y="300" font-size="12" fill="#334155">一次停顿的 Pre / Evacuate / Post 三段</text>
  <text x="720" y="300" font-size="12" font-family="Consolas, monospace" fill="#991b1b">1495</text>

  <text x="52" y="336" font-size="12" fill="#64748b">默认行数：JDK 8 的 Parallel 是 8 行、G1 是 232 行；JDK 24 的 G1 在 -Xlog:gc 下是 12 行。</text>

  <rect x="32" y="372" width="936" height="34" rx="6" fill="#dbeafe"/>
  <text x="48" y="394" font-size="12" fill="#1e3a8a">线上常驻开前两档：phases=debug 在几分钟内能吃掉几十 MB 磁盘，排障完必须记得关。</text>

  <rect x="32" y="414" width="936" height="34" rx="6" fill="#f1f5f9"/>
  <text x="48" y="436" font-size="12" fill="#334155">写文件一律带滚动：-Xlog:gc:file=gc.log:time,uptime:filecount=5,filesize=50M。</text>
</svg>
