<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">JFR 是一条流水线：事件在 JVM 里产生，jfr 工具在文件那头读</text>
  <rect x="32" y="52" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="68" font-size="13" fill="#64748b">五段从左到右，前四段在目标 JVM 里，最后一段是你在命令行敲的 jfr。</text>

  <rect x="36" y="104" width="170" height="120" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="50" y="128" font-size="13" font-weight="bold" fill="#1e3a8a">事件埋点</text>
  <text x="50" y="152" font-size="22" font-weight="bold" fill="#1d4ed8">276</text>
  <text x="50" y="172" font-size="11" fill="#1e40af">个事件类型，每个</text>
  <text x="50" y="190" font-size="11" fill="#1e40af">都有 @Name 与</text>
  <text x="50" y="208" font-size="11" fill="#1e40af">@Category 定义</text>

  <path d="M210 164 H222 M216 158 L223 164 L216 170" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="224" y="104" width="170" height="120" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="238" y="128" font-size="13" font-weight="bold" fill="#1e3a8a">线程本地缓冲</text>
  <text x="238" y="152" font-size="22" font-weight="bold" fill="#1d4ed8">8 kB</text>
  <text x="238" y="172" font-size="11" fill="#1e40af">每个线程一块，</text>
  <text x="238" y="190" font-size="11" fill="#1e40af">线程多就是乘出来</text>
  <text x="238" y="208" font-size="11" fill="#1e40af">（JFR.configure）</text>

  <path d="M398 164 H410 M404 158 L411 164 L404 170" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="412" y="104" width="170" height="120" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="426" y="128" font-size="13" font-weight="bold" fill="#1e3a8a">全局缓冲</text>
  <text x="426" y="152" font-size="22" font-weight="bold" fill="#1d4ed8">20×512 kB</text>
  <text x="426" y="172" font-size="11" fill="#1e40af">攒满刷一次，</text>
  <text x="426" y="190" font-size="11" fill="#1e40af">异步写盘，所以</text>
  <text x="426" y="208" font-size="11" fill="#1e40af">对业务几乎无感</text>

  <path d="M586 164 H598 M592 158 L599 164 L592 170" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="600" y="104" width="170" height="120" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="614" y="128" font-size="13" font-weight="bold" fill="#9a3412">chunk 文件</text>
  <text x="614" y="152" font-size="22" font-weight="bold" fill="#c2410c">275 kB</text>
  <text x="614" y="172" font-size="11" fill="#c2410c">12 秒的 default</text>
  <text x="614" y="190" font-size="11" fill="#c2410c">录制，4240 条</text>
  <text x="614" y="208" font-size="11" fill="#c2410c">事件、190 个类型</text>

  <path d="M774 164 H786 M780 158 L787 164 L780 170" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="788" y="104" width="162" height="120" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="802" y="128" font-size="13" font-weight="bold" fill="#115e59">jfr 工具</text>
  <text x="802" y="152" font-size="11" font-family="Consolas, monospace" fill="#0f766e">jfr summary</text>
  <text x="802" y="172" font-size="11" font-family="Consolas, monospace" fill="#0f766e">jfr print</text>
  <text x="802" y="192" font-size="11" font-family="Consolas, monospace" fill="#0f766e">jfr view</text>
  <text x="802" y="212" font-size="11" fill="#0f766e">75 个视图</text>

  <rect x="36" y="252" width="450" height="152" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="52" y="278" font-size="14" font-weight="bold" fill="#991b1b">短录制为什么体积下不去</text>
  <text x="52" y="302" font-size="12" fill="#7f1d1d">开头要抄一遍全部设置：ActiveSetting 708 条、</text>
  <text x="52" y="322" font-size="12" fill="#7f1d1d">BooleanFlag 490 条、ModuleExport 509 条。</text>
  <text x="52" y="342" font-size="12" fill="#7f1d1d">12 秒 275 kB 里，跟业务有关的不到两成。</text>
  <text x="52" y="366" font-size="12" fill="#7f1d1d">0.15 秒的空白工作负载也要 183~202 kB，</text>
  <text x="52" y="386" font-size="12" fill="#7f1d1d">这就是 chunk 头的固定成本。</text>

  <rect x="514" y="252" width="436" height="152" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="530" y="278" font-size="14" font-weight="bold" fill="#065f46">稳态速率才代表长期成本</text>
  <text x="530" y="302" font-size="12" fill="#047857">同一个进程录 61 秒：406 781 B、10 573 条事件。</text>
  <text x="530" y="322" font-size="12" fill="#047857">折算 6.7 kB/s、173 条/秒。</text>
  <text x="530" y="342" font-size="12" fill="#047857">按这个速率，250 MB 默认上限能装约 10 小时；</text>
  <text x="530" y="362" font-size="12" fill="#047857">用 12 秒那个 23 kB/s 去算会低估到 3 小时。</text>
  <text x="530" y="386" font-size="12" fill="#047857">做容量规划要用下面这个数，不是上面那个。</text>
</svg>
