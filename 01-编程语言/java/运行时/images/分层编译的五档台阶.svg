<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">五档质量，12.7 倍差距：默认走 0 → 3 → 4</text>
  <rect x="32" y="52" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="68" font-size="13" fill="#64748b">同一段 work(20000)，每档连跑 5 轮取中位；右侧横轴是相对默认模式的倍数，不是绝对耗时。</text>

  <rect x="32" y="92" width="380" height="356" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="118" font-size="13" font-weight="bold" fill="#334155">五档分别是什么</text>

  <rect x="48" y="132" width="348" height="54" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="60" y="155" font-size="13" font-weight="bold" fill="#991b1b">0　解释执行</text>
  <text x="60" y="174" font-size="12" fill="#475569">逐条读字节码 · 365 109 ns/次</text>

  <rect x="48" y="194" width="348" height="54" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="60" y="217" font-size="13" font-weight="bold" fill="#1e40af">1　C1 无 profile</text>
  <text x="60" y="236" font-size="12" fill="#475569">编得快，代码一般 · 82 264 ns/次</text>

  <rect x="48" y="256" width="348" height="54" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="60" y="279" font-size="13" font-weight="bold" fill="#1e40af">2　C1 少量 profile</text>
  <text x="60" y="298" font-size="12" fill="#475569">夹在 1 与 3 中间 · 98 584 ns/次</text>

  <rect x="48" y="318" width="348" height="54" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="60" y="341" font-size="13" font-weight="bold" fill="#78350f">3　C1 完整 profile</text>
  <text x="60" y="360" font-size="12" fill="#475569">每分支都计数 · 127 413 ns/次</text>

  <rect x="48" y="380" width="348" height="54" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="60" y="403" font-size="13" font-weight="bold" fill="#065f46">4　C2 激进优化</text>
  <text x="60" y="422" font-size="12" fill="#475569">编得慢，代码最好 · 28 734 ns/次</text>

  <rect x="432" y="92" width="536" height="356" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="448" y="118" font-size="13" font-weight="bold" fill="#334155">相对默认模式的耗时倍数（越短越好）</text>

  <text x="448" y="152" font-size="12" fill="#334155">-Xint</text>
  <rect x="530" y="138" width="380" height="20" rx="3" fill="#ef4444"/>
  <text x="918" y="152" font-size="12" font-weight="bold" fill="#991b1b">12.7×</text>

  <text x="448" y="196" font-size="12" fill="#334155">StopAtLevel=3</text>
  <rect x="530" y="182" width="133" height="20" rx="3" fill="#f59e0b"/>
  <text x="671" y="196" font-size="12" font-weight="bold" fill="#92400e">4.43×</text>

  <text x="448" y="240" font-size="12" fill="#334155">StopAtLevel=2</text>
  <rect x="530" y="226" width="103" height="20" rx="3" fill="#f59e0b"/>
  <text x="641" y="240" font-size="12" font-weight="bold" fill="#92400e">3.43×</text>

  <text x="448" y="284" font-size="12" fill="#334155">StopAtLevel=1</text>
  <rect x="530" y="270" width="86" height="20" rx="3" fill="#60a5fa"/>
  <text x="624" y="284" font-size="12" font-weight="bold" fill="#1e40af">2.86×</text>

  <text x="448" y="328" font-size="12" fill="#334155">默认 0→3→4</text>
  <rect x="530" y="314" width="30" height="20" rx="3" fill="#10b981"/>
  <text x="568" y="328" font-size="12" font-weight="bold" fill="#065f46">1.00×</text>

  <text x="448" y="372" font-size="12" fill="#334155">只 C2</text>
  <rect x="530" y="358" width="30" height="20" rx="3" fill="#10b981"/>
  <text x="568" y="372" font-size="12" font-weight="bold" fill="#065f46">1.00×</text>

  <text x="448" y="410" font-size="12" fill="#64748b">两条绿柱一样长：分层的收益不在峰值，在峰值到来的时刻。</text>
  <text x="448" y="430" font-size="12" fill="#64748b">纯 C2 在 C2 就绪前只能干等，分层先用 C1 顶住。</text>
</svg>
