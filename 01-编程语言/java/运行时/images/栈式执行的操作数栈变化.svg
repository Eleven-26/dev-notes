<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <defs>
    <marker id="a3" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">inc() 的八条指令：操作数栈每一步长什么样</text>
  <rect x="32" y="50" width="930" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="66" font-size="13" fill="#64748b">源码是 return ++x；栈从下往上画，右侧为栈顶。max_stack = 3 正好对应第 4 步与第 6 步。</text>

  <rect x="40" y="96" width="210" height="204" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="120" font-size="13" font-weight="bold" fill="#1e3a8a">1. aload_0</text>
  <rect x="100" y="238" width="120" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="132" y="258" font-size="13" fill="#1e3a8a">this</text>

  <rect x="280" y="96" width="210" height="204" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="296" y="120" font-size="13" font-weight="bold" fill="#1e3a8a">2. dup</text>
  <rect x="340" y="238" width="120" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="372" y="258" font-size="13" fill="#1e3a8a">this</text>
  <rect x="340" y="202" width="120" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="372" y="222" font-size="13" fill="#1e3a8a">this</text>

  <rect x="520" y="96" width="210" height="204" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="536" y="120" font-size="13" font-weight="bold" fill="#1e3a8a">3. getfield #7</text>
  <rect x="580" y="238" width="120" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="612" y="258" font-size="13" fill="#1e3a8a">this</text>
  <rect x="580" y="202" width="120" height="30" rx="4" fill="#fef3c7" stroke="#b45309"/>
  <text x="606" y="222" font-size="13" fill="#b45309">x = 1</text>

  <rect x="760" y="96" width="210" height="204" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="776" y="120" font-size="13" font-weight="bold" fill="#1e3a8a">4. iconst_1</text>
  <rect x="820" y="238" width="120" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="852" y="258" font-size="13" fill="#1e3a8a">this</text>
  <rect x="820" y="202" width="120" height="30" rx="4" fill="#fef3c7" stroke="#b45309"/>
  <text x="852" y="222" font-size="13" fill="#b45309">x = 1</text>
  <rect x="820" y="166" width="120" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="858" y="186" font-size="13" fill="#15803d">1</text>

  <rect x="40" y="360" width="210" height="204" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="384" font-size="13" font-weight="bold" fill="#1e3a8a">5. iadd</text>
  <rect x="100" y="502" width="120" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="132" y="522" font-size="13" fill="#1e3a8a">this</text>
  <rect x="100" y="466" width="120" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="138" y="486" font-size="13" fill="#15803d">2</text>

  <rect x="280" y="360" width="210" height="204" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="296" y="384" font-size="13" font-weight="bold" fill="#1e3a8a">6. dup_x1</text>
  <rect x="340" y="502" width="120" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="378" y="522" font-size="13" fill="#15803d">2</text>
  <rect x="340" y="466" width="120" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="372" y="486" font-size="13" fill="#1e3a8a">this</text>
  <rect x="340" y="430" width="120" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="378" y="450" font-size="13" fill="#15803d">2</text>

  <rect x="520" y="360" width="210" height="204" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="536" y="384" font-size="13" font-weight="bold" fill="#1e3a8a">7. putfield #7</text>
  <rect x="580" y="502" width="120" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="618" y="522" font-size="13" fill="#15803d">2</text>

  <rect x="760" y="360" width="210" height="204" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="776" y="384" font-size="13" font-weight="bold" fill="#1e3a8a">8. ireturn</text>
  <text x="790" y="440" font-size="13" fill="#334155">返回值 2</text>
  <text x="790" y="464" font-size="12" fill="#64748b">栈被清空</text>

  <line x1="250" y1="198" x2="272" y2="198" stroke="#2563eb" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="490" y1="198" x2="512" y2="198" stroke="#2563eb" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="730" y1="198" x2="752" y2="198" stroke="#2563eb" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="250" y1="462" x2="272" y2="462" stroke="#2563eb" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="490" y1="462" x2="512" y2="462" stroke="#2563eb" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="730" y1="462" x2="752" y2="462" stroke="#2563eb" stroke-width="2" marker-end="url(#a3)"/>

  <rect x="40" y="580" width="910" height="26" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="56" y="598" font-size="12" fill="#b45309">要点：putfield 会同时吞掉「对象引用 + 值」，所以第 6 步必须先把结果复制一份插到 this 下面。</text>
</svg>
