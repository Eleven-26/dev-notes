<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">内联的两道闸门：35 管冷不冷，325 管热不热</text>
  <rect x="32" y="52" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="68" font-size="13" fill="#64748b">同一个方法可以在一处被拒、在另一处被接受——判据不是方法本身，是「方法尺寸 + 这个调用点的热度」。</text>

  <rect x="32" y="92" width="470" height="296" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="118" font-size="13" font-weight="bold" fill="#334155">C2 的判定顺序</text>

  <rect x="48" y="132" width="438" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="62" y="154" font-size="13" font-weight="bold" fill="#1e40af">① 字节码长度 ≤ 35 字节？</text>
  <text x="62" y="176" font-size="12" fill="#475569">是 → 直接内联，不问热度（MaxInlineSize = 35）</text>

  <rect x="48" y="202" width="438" height="58" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="62" y="224" font-size="13" font-weight="bold" fill="#78350f">② 长度 ≤ 325 字节，且调用点够热？</text>
  <text x="62" y="246" font-size="12" fill="#475569">是 → 内联（FreqInlineSize = 325，管热路径）</text>

  <rect x="48" y="272" width="438" height="58" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="62" y="294" font-size="13" font-weight="bold" fill="#991b1b">③ 两条都不满足</text>
  <text x="62" y="316" font-size="12" fill="#475569">拒绝，日志给两种措辞（见右侧最后一行）</text>

  <rect x="48" y="342" width="438" height="34" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="62" y="364" font-size="12" fill="#065f46">被内联之后，跨方法的分支剪枝与常量传播才有可能</text>

  <rect x="518" y="92" width="450" height="296" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="534" y="118" font-size="13" font-weight="bold" fill="#334155">三个方法，六种去向（实测）</text>

  <rect x="534" y="132" width="418" height="58" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="548" y="154" font-size="13" font-weight="bold" fill="#065f46">small　6 字节</text>
  <text x="548" y="176" font-size="12" fill="#475569">冷调用点也 inline，热调用点 inline (hot)</text>

  <rect x="534" y="202" width="418" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="548" y="224" font-size="13" font-weight="bold" fill="#1e40af">big　50 字节</text>
  <text x="548" y="246" font-size="12" fill="#475569">冷 → callee is too large　热 → inline (hot)</text>

  <rect x="534" y="272" width="418" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="548" y="294" font-size="13" font-weight="bold" fill="#1e40af">huge　210 字节</text>
  <text x="548" y="316" font-size="12" fill="#475569">冷 → callee is too large　热 → inline (hot)</text>

  <rect x="534" y="342" width="418" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="548" y="364" font-size="12" fill="#475569">FreqInlineSize 调到 100：huge 变 hot method too big</text>

  <rect x="32" y="404" width="936" height="140" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="428" font-size="13" font-weight="bold" fill="#334155">内联值多少钱（ns/次，5 轮区间，iters = 3 千万）</text>

  <text x="48" y="456" font-size="12" font-weight="bold" fill="#64748b">方法</text>
  <text x="200" y="456" font-size="12" font-weight="bold" fill="#64748b">默认</text>
  <text x="400" y="456" font-size="12" font-weight="bold" fill="#64748b">-XX:-Inline</text>
  <text x="660" y="456" font-size="12" font-weight="bold" fill="#64748b">FreqInlineSize=40</text>

  <text x="48" y="480" font-size="12" fill="#334155">small 6 B</text>
  <text x="200" y="480" font-size="12" fill="#065f46">0.432 ~ 0.523</text>
  <text x="400" y="480" font-size="12" fill="#991b1b">2.846 ~ 3.611</text>
  <text x="660" y="480" font-size="12" fill="#065f46">0.431 ~ 0.441</text>

  <text x="48" y="504" font-size="12" fill="#334155">big 50 B</text>
  <text x="200" y="504" font-size="12" fill="#065f46">2.398 ~ 2.842</text>
  <text x="400" y="504" font-size="12" fill="#991b1b">4.259 ~ 4.986</text>
  <text x="660" y="504" font-size="12" fill="#991b1b">4.229 ~ 4.438</text>

  <text x="48" y="528" font-size="12" fill="#334155">huge 210 B</text>
  <text x="200" y="528" font-size="12" fill="#065f46">15.224 ~ 17.355</text>
  <text x="400" y="528" font-size="12" fill="#065f46">15.205 ~ 16.770</text>
  <text x="660" y="528" font-size="12" fill="#065f46">15.049 ~ 16.208</text>
</svg>
