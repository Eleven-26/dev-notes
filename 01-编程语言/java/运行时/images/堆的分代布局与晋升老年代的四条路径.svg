<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

<text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">堆的分代布局与对象进入老年代的四条路径</text>
<text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">默认值来自本机 JDK 1.8.0_321 实测（server class / 8 核，ergonomics 选了 Parallel）</text>

<rect x="60" y="96" width="560" height="190" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="340" y="120" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">新生代（Young，默认占堆 1/3）</text>

<rect x="80" y="140" width="340" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="250" y="168" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">Eden　占 8 份</text>
<text x="250" y="196" font-size="12" text-anchor="middle" fill="#334155">新对象分配处（走 TLAB）</text>
<text x="250" y="222" font-size="11" text-anchor="middle" fill="#334155">TLAB desired_size 实测 1310KB</text>
<text x="250" y="246" font-size="11" text-anchor="middle" fill="#7c2d12">慢路径 63 次：对象比剩余 TLAB 大</text>

<rect x="440" y="140" width="80" height="120" rx="6" fill="#dcfce7" stroke="#16a34a"/>
<text x="480" y="196" font-size="12" font-weight="700" text-anchor="middle" fill="#14532d">from</text>
<text x="480" y="220" font-size="11" text-anchor="middle" fill="#14532d">1 份</text>

<rect x="530" y="140" width="80" height="120" rx="6" fill="#dcfce7" stroke="#16a34a"/>
<text x="570" y="196" font-size="12" font-weight="700" text-anchor="middle" fill="#14532d">to</text>
<text x="570" y="220" font-size="11" text-anchor="middle" fill="#14532d">1 份</text>

<rect x="660" y="96" width="280" height="190" rx="10" fill="#ffedd5" stroke="#ea580c"/>
<text x="800" y="124" font-size="13" font-weight="700" text-anchor="middle" fill="#7c2d12">老年代（Old，2/3）</text>
<text x="800" y="154" font-size="12" text-anchor="middle" fill="#7c2d12">标记-压缩 / 标记-清除</text>
<text x="800" y="180" font-size="12" text-anchor="middle" fill="#334155">会移动对象 → 无外部碎片</text>
<text x="800" y="206" font-size="12" text-anchor="middle" fill="#334155">Full GC 收集整堆，停顿最贵</text>
<text x="800" y="232" font-size="11" text-anchor="middle" fill="#334155">判据：回收前后差值接近 0 就是堆不够</text>

<rect x="60" y="310" width="880" height="90" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="80" y="340" font-size="12" fill="#334155">NewRatio = 2 → 新生代 : 老年代 = 1 : 2　　SurvivorRatio = 8 → Eden : 单块 Survivor = 8 : 1（于是 8:1:1）</text>
<text x="80" y="368" font-size="12" fill="#334155">TargetSurvivorRatio = 50　MaxTenuringThreshold = 15　PretenureSizeThreshold = 0　ParallelGCThreads = 8</text>
<text x="80" y="392" font-size="12" fill="#7f1d1d">⚠️ UseAdaptiveSizePolicy = true 会偷偷改掉 8:1:1（实测 Eden : Survivor 压到约 4.3 : 1）</text>

<rect x="60" y="420" width="880" height="170" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="80" y="450" font-size="13" font-weight="700" fill="#0f172a">对象进入老年代的四条路径</text>
<text x="80" y="478" font-size="12" fill="#334155">① 年龄达标：每熬过一次 Minor GC 年龄 +1，到 MaxTenuringThreshold（默认 15）后晋升</text>
<text x="80" y="502" font-size="12" fill="#334155">② 动态年龄判定：survivor 中「年龄 ≤ N 的对象总和」超过空间的 50% → 实测阈值被提前到 6~7</text>
<text x="80" y="526" font-size="12" fill="#334155">③ 大对象直接进老年代：-XX:PretenureSizeThreshold（⚠️ 只认可 Serial / ParNew，Parallel 下实测老年代增量为 0）</text>
<text x="80" y="550" font-size="12" fill="#334155">④ 空间分配担保失败 → 走 Full GC（日志里的 promotion failed / to-space exhausted）</text>
<text x="80" y="578" font-size="12" fill="#64748b">另有一条不算晋升的路：TLAB 装不下的大数组走慢路径，仍然在 Eden（新生代）里</text>
</svg>
