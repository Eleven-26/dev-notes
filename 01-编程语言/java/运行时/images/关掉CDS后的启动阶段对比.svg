<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="400" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">关掉 CDS，慢的不是加载类，是模块系统</text>
  <rect x="32" y="52" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="68" font-size="13" fill="#64748b">5 轮取中位，单位毫秒；蓝 = 默认，橙 = -Xshare:off。横轴 5.3 像素 / 毫秒。</text>

  <rect x="32" y="92" width="936" height="212" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="48" y="120" font-size="13" fill="#334155">Genesis</text>
  <rect x="240" y="106" width="97" height="12" rx="2" fill="#1d4ed8"/>
  <rect x="240" y="122" width="49" height="12" rx="2" fill="#ea580c"/>
  <text x="348" y="118" font-size="12" font-family="Consolas, monospace" fill="#1e3a8a">18.3</text>
  <text x="296" y="134" font-size="12" font-family="Consolas, monospace" fill="#9a3412">9.3</text>
  <text x="596" y="122" font-size="12" fill="#64748b">关掉 CDS 反而更快（不再 map 归档）</text>

  <text x="48" y="170" font-size="13" fill="#334155">java.lang 类初始化</text>
  <rect x="240" y="156" width="28" height="12" rx="2" fill="#1d4ed8"/>
  <rect x="240" y="172" width="121" height="12" rx="2" fill="#ea580c"/>
  <text x="276" y="168" font-size="12" font-family="Consolas, monospace" fill="#1e3a8a">5.31</text>
  <text x="370" y="184" font-size="12" font-family="Consolas, monospace" fill="#9a3412">22.8</text>
  <text x="596" y="172" font-size="12" fill="#64748b">4.3 倍</text>

  <text x="48" y="220" font-size="13" fill="#334155">module system</text>
  <rect x="240" y="206" width="19" height="12" rx="2" fill="#1d4ed8"/>
  <rect x="240" y="222" width="223" height="12" rx="2" fill="#ea580c"/>
  <text x="268" y="218" font-size="12" font-family="Consolas, monospace" fill="#1e3a8a">3.64</text>
  <text x="472" y="234" font-size="12" font-family="Consolas, monospace" fill="#9a3412">42.0</text>
  <text x="596" y="222" font-size="12" font-weight="bold" fill="#9a3412">11.5 倍</text>

  <text x="48" y="272" font-size="13" fill="#334155">Create VM（总计）</text>
  <rect x="240" y="258" width="216" height="12" rx="2" fill="#1d4ed8"/>
  <rect x="240" y="274" width="592" height="12" rx="2" fill="#ea580c"/>
  <text x="464" y="270" font-size="12" font-family="Consolas, monospace" fill="#1e3a8a">40.8</text>
  <text x="840" y="286" font-size="12" font-family="Consolas, monospace" fill="#9a3412">111.7</text>

  <rect x="32" y="320" width="454" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="48" y="344" font-size="13" font-weight="bold" fill="#1e40af">CDS 省的是什么</text>
  <text x="48" y="366" font-size="12" fill="#1e3a8a">不是 IO，是「解析模块描述符 + 链接核心类」</text>

  <rect x="514" y="320" width="454" height="60" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="530" y="344" font-size="13" font-weight="bold" fill="#991b1b">双关压缩指针才会掉 CDS</text>
  <text x="530" y="366" font-size="12" fill="#7f1d1d">单关 oops 会切到 classes_nocoops.jsa，照用不误</text>
</svg>
