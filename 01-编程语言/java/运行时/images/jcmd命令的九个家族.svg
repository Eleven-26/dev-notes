<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">57 条命令，9 个家族：VM 一家占了三分之一</text>
  <rect x="32" y="52" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="68" font-size="13" fill="#64748b">方格里的数字是条数，来自 jcmd &lt;pid&gt; help 的原始输出；九个家族加起来正好 57。</text>

  <rect x="32" y="92" width="300" height="104" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="48" y="120" font-size="15" font-weight="bold" fill="#1e3a8a">VM</text>
  <text x="48" y="150" font-size="26" font-weight="bold" fill="#1d4ed8">20</text>
  <text x="48" y="176" font-size="11" font-family="Consolas, monospace" fill="#1e40af">VM.flags VM.log VM.native_memory</text>

  <rect x="350" y="92" width="300" height="104" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="366" y="120" font-size="15" font-weight="bold" fill="#4c1d95">Compiler</text>
  <text x="366" y="150" font-size="26" font-weight="bold" fill="#6d28d9">10</text>
  <text x="366" y="176" font-size="11" font-family="Consolas, monospace" fill="#5b21b6">Compiler.queue Compiler.codelist</text>

  <rect x="668" y="92" width="300" height="104" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="684" y="120" font-size="15" font-weight="bold" fill="#065f46">GC</text>
  <text x="684" y="150" font-size="26" font-weight="bold" fill="#047857">6</text>
  <text x="684" y="176" font-size="11" font-family="Consolas, monospace" fill="#047857">GC.heap_info GC.heap_dump</text>

  <rect x="32" y="208" width="300" height="104" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="48" y="236" font-size="15" font-weight="bold" fill="#9a3412">JFR</text>
  <text x="48" y="266" font-size="26" font-weight="bold" fill="#c2410c">6</text>
  <text x="48" y="292" font-size="11" font-family="Consolas, monospace" fill="#c2410c">JFR.start JFR.dump JFR.view</text>

  <rect x="350" y="208" width="300" height="104" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="366" y="236" font-size="15" font-weight="bold" fill="#115e59">Thread</text>
  <text x="366" y="266" font-size="26" font-weight="bold" fill="#0f766e">4</text>
  <text x="366" y="292" font-size="11" font-family="Consolas, monospace" fill="#0f766e">Thread.print Thread.dump_to_file</text>

  <rect x="668" y="208" width="300" height="104" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="684" y="236" font-size="15" font-weight="bold" fill="#334155">System</text>
  <text x="684" y="266" font-size="26" font-weight="bold" fill="#475569">4</text>
  <text x="684" y="292" font-size="11" font-family="Consolas, monospace" fill="#475569">System.map System.native_heap_info</text>

  <rect x="32" y="324" width="300" height="104" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="48" y="352" font-size="15" font-weight="bold" fill="#92400e">ManagementAgent</text>
  <text x="48" y="382" font-size="26" font-weight="bold" fill="#b45309">4</text>
  <text x="48" y="408" font-size="11" font-family="Consolas, monospace" fill="#b45309">ManagementAgent.start_local</text>

  <rect x="350" y="324" width="300" height="104" rx="8" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="366" y="352" font-size="15" font-weight="bold" fill="#9f1239">JVMTI</text>
  <text x="366" y="382" font-size="26" font-weight="bold" fill="#be123c">2</text>
  <text x="366" y="408" font-size="11" font-family="Consolas, monospace" fill="#be123c">JVMTI.agent_load JVMTI.data_dump</text>

  <rect x="668" y="324" width="300" height="104" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="684" y="352" font-size="15" font-weight="bold" fill="#334155">help（无前缀）</text>
  <text x="684" y="382" font-size="26" font-weight="bold" fill="#0f172a">1</text>
  <text x="684" y="408" font-size="11" font-family="Consolas, monospace" fill="#475569">help GC.heap_info</text>

  <rect x="32" y="442" width="936" height="26" rx="4" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="460" font-size="13" fill="#991b1b">help 输出 61 行 = 1 行 pid + 1 行表头 + 57 条命令 + 1 行空行 + 1 行提示，别把 61 当成命令数。</text>
</svg>
