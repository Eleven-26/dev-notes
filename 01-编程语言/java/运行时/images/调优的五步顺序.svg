<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">调参之前先算三个量，顺序错了全是白工</text>
  <rect x="32" y="52" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="68" font-size="13" fill="#64748b">五步是串行的：第 ② 步欠的账，第 ⑤ 步再换收集器也还不回来。</text>

  <rect x="32" y="92" width="936" height="52" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="48" y="114" font-size="13" font-weight="bold" fill="#1e3a8a">① 先算三个量</text>
  <text x="48" y="134" font-size="12" fill="#1e3a8a">分配速率（两次 GC 间分配量 / 间隔）、晋升速率（每次 Minor 后老年代增量）、暂停分布（次数 / 单次最长 / 占比）</text>

  <rect x="32" y="156" width="936" height="52" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="48" y="178" font-size="13" font-weight="bold" fill="#92400e">② 分配速率高 → 先改代码</text>
  <text x="48" y="198" font-size="12" fill="#92400e">热路径去掉隐式装箱、临时字符串拼接、循环里建集合；对象复用 / 缩短生命周期（Go 侧对应逃逸分析）</text>

  <rect x="32" y="220" width="936" height="52" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="48" y="242" font-size="13" font-weight="bold" fill="#166534">③ 再看代比例</text>
  <text x="48" y="262" font-size="12" fill="#166534">让「对象死在新生代」这条假说成立：G1 下别动 SurvivorRatio（实测无效），动 -Xmn 或 NewRatio</text>

  <rect x="32" y="284" width="936" height="52" rx="6" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="48" y="306" font-size="13" font-weight="bold" fill="#3730a3">④ 然后是堆上限与收集器</text>
  <text x="48" y="326" font-size="12" fill="#3730a3">容器里必须显式 -Xmx；小堆 + 大对象先换 Parallel / Serial（G1 会 OOM）；确认停顿真超目标才调 MaxGCPauseMillis</text>

  <rect x="32" y="348" width="936" height="52" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="48" y="370" font-size="13" font-weight="bold" fill="#991b1b">⑤ 最后才换收集器</text>
  <text x="48" y="390" font-size="12" fill="#991b1b">换的收益上限，由第 ② 步欠的账决定：分配速率不降，换 ZGC 也只是把墙钟换成了 CPU</text>

  <rect x="32" y="416" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="48" y="432" font-size="12" fill="#64748b">反例：先把 MaxGCPauseMillis 从 200 调到 20 —— 实测 14 次 / 68 ms 变成 16 次 / 73 ms，白改。</text>
  <rect x="32" y="448" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="48" y="464" font-size="12" fill="#64748b">反例：先加 -Xmx —— 实测 64 MB 到 1024 MB，次数 37 降到 4，单次停顿却从 2.9 ms 涨到 10.8 ms。</text>
</svg>
