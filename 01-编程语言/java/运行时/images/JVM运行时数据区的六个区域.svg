<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="650" fill="#ffffff"/>

<text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">JVM 运行时数据区：线程私有三块与线程共享三块</text>
<text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">栈帧是虚拟机栈里的一个元素；线程私有的区域随线程生灭，不参与 GC</text>

<rect x="60" y="90" width="430" height="360" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="275" y="120" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">线程私有（每个线程各一份，不需要 GC）</text>

<rect x="90" y="140" width="370" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="275" y="164" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">程序计数器（PC）</text>
<text x="275" y="188" font-size="11" text-anchor="middle" fill="#334155">当前线程执行的字节码行号 / 偏移</text>
<text x="275" y="208" font-size="11" text-anchor="middle" fill="#7c2d12">⭐ 唯一不会抛 OOM 的区域</text>

<rect x="90" y="244" width="370" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="275" y="268" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">虚拟机栈</text>
<text x="275" y="292" font-size="11" text-anchor="middle" fill="#334155">每次方法调用压入一个栈帧</text>
<text x="275" y="312" font-size="11" text-anchor="middle" fill="#7f1d1d">StackOverflowError / OOM</text>

<rect x="90" y="348" width="370" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="275" y="372" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">本地方法栈</text>
<text x="275" y="396" font-size="11" text-anchor="middle" fill="#334155">native 方法的栈帧</text>
<text x="275" y="416" font-size="11" text-anchor="middle" fill="#64748b">HotSpot 中与虚拟机栈合并实现</text>

<line x1="462" y1="300" x2="554" y2="200" stroke="#334155" stroke-width="1.5"/>
<rect x="476" y="228" width="64" height="24" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="508" y="245" font-size="11" text-anchor="middle" fill="#334155">引用</text>

<rect x="530" y="90" width="410" height="360" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="735" y="120" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">线程共享（随 JVM 生灭，才是 GC 的战场）</text>

<rect x="560" y="140" width="350" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="735" y="164" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">堆</text>
<text x="735" y="188" font-size="11" text-anchor="middle" fill="#334155">对象实例、数组（几乎所有对象）</text>
<text x="735" y="208" font-size="11" text-anchor="middle" fill="#7f1d1d">OOM: Java heap space</text>

<rect x="560" y="244" width="350" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="735" y="268" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">方法区（1.8+ 元空间）</text>
<text x="735" y="292" font-size="11" text-anchor="middle" fill="#334155">类元信息、运行时常量池、静态变量、JIT 产物</text>
<text x="735" y="312" font-size="11" text-anchor="middle" fill="#7f1d1d">OOM: Metaspace</text>

<rect x="560" y="348" width="350" height="88" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="735" y="372" font-size="13" font-weight="700" text-anchor="middle" fill="#7c2d12">直接内存（堆外）</text>
<text x="735" y="396" font-size="11" text-anchor="middle" fill="#334155">DirectByteBuffer（NIO / Netty）</text>
<text x="735" y="416" font-size="11" text-anchor="middle" fill="#7c2d12">规范之外，OOM: Direct buffer memory</text>

<rect x="60" y="470" width="880" height="160" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="80" y="502" font-size="12" fill="#0f172a">⭐ 线程私有 = 不需要 GC：PC、虚拟机栈、本地方法栈随线程创建销毁；只有堆和方法区要回收</text>
<text x="80" y="532" font-size="12" fill="#334155">方法区的实现迁移：JDK 7 永久代（PermGen）→ JDK 8 元空间（Metaspace）</text>
<text x="80" y="562" font-size="12" fill="#334155">元空间用本地内存，上限参数由 -XX:MaxPermSize 换成 -XX:MaxMetaspaceSize</text>
<text x="80" y="592" font-size="12" fill="#7f1d1d">直接内存是 NIO 通过 Unsafe 申请的堆外内存，规范没有定义 → 「-Xmx 调了还是 OOM」常出在这里</text>
</svg>
