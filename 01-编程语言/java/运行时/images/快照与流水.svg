<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="400" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">一次快照只能看到「此刻」，一条事件流能看到「多久、几次」</text>
  <rect x="32" y="52" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="68" font-size="13" fill="#64748b">左右两侧量的是同一段 12 秒里同一个 waiter 线程的处境。</text>

  <rect x="32" y="92" width="440" height="240" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="118" font-size="15" font-weight="bold" fill="#334155">jstack：三个孤立的瞬间</text>
  <text x="48" y="140" font-size="12" fill="#64748b">每条竖线是一次抓栈，只能看到一个点的状态</text>

  <path d="M56 220 H448" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M120 208 V232" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <path d="M240 208 V232" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <path d="M360 208 V232" fill="none" stroke="#1d4ed8" stroke-width="3"/>

  <rect x="80" y="160" width="80" height="34" rx="5" fill="#dbeafe"/>
  <text x="88" y="182" font-size="11" fill="#1e3a8a">BLOCKED</text>
  <rect x="200" y="160" width="80" height="34" rx="5" fill="#dbeafe"/>
  <text x="208" y="182" font-size="11" fill="#1e3a8a">BLOCKED</text>
  <rect x="320" y="160" width="80" height="34" rx="5" fill="#dbeafe"/>
  <text x="328" y="182" font-size="11" fill="#1e3a8a">BLOCKED</text>

  <text x="112" y="252" font-size="11" fill="#475569">t1</text>
  <text x="232" y="252" font-size="11" fill="#475569">t2</text>
  <text x="352" y="252" font-size="11" fill="#475569">t3</text>

  <rect x="48" y="272" width="408" height="46" rx="5" fill="#fef2f2"/>
  <text x="60" y="292" font-size="12" fill="#991b1b">三次之间发生了什么？等了多久？一共几次？</text>
  <text x="60" y="310" font-size="12" fill="#991b1b">这张图一个字也答不了，因为它只有三帧。</text>

  <rect x="510" y="92" width="458" height="240" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="526" y="118" font-size="15" font-weight="bold" fill="#334155">JFR：每条竞争都有自己的长度</text>
  <text x="526" y="140" font-size="12" fill="#64748b">JavaMonitorEnter 事件记录持续时长，聚合成次数与分位</text>

  <rect x="560" y="176" width="170" height="12" rx="3" fill="#fdba74"/>
  <rect x="560" y="198" width="192" height="12" rx="3" fill="#fdba74"/>
  <rect x="560" y="220" width="164" height="12" rx="3" fill="#fdba74"/>
  <rect x="560" y="242" width="188" height="12" rx="3" fill="#fdba74"/>
  <rect x="560" y="264" width="176" height="12" rx="3" fill="#fdba74"/>

  <rect x="748" y="166" width="204" height="120" rx="6" fill="#ffedd5"/>
  <text x="762" y="190" font-size="12" fill="#9a3412">Count 53</text>
  <text x="762" y="212" font-size="12" fill="#9a3412">Avg. 199 ms</text>
  <text x="762" y="234" font-size="12" fill="#9a3412">Max. 206 ms</text>
  <text x="762" y="256" font-size="12" fill="#9a3412">合计约 10.5 秒</text>
  <text x="762" y="278" font-size="12" fill="#9a3412">占 12 秒的 88%</text>

  <rect x="32" y="344" width="936" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="48" y="368" font-size="13" fill="#1e3a8a">判据：问「此刻在干什么」用 jstack，问「这件事发生了多久、几次、最长多长」只能靠事件流。</text>
</svg>
