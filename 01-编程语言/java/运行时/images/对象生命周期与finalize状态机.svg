<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="572" viewBox="0 0 1000 572" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect width="1000" height="572" fill="#ffffff"/>
<defs>
<marker id="arFZ" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
</defs>

<text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">对象生命周期与 finalize 状态机</text>
<text x="40" y="58" font-size="13" fill="#64748b">重写 finalize() 的对象第一次不可达时不会被立刻回收 —— 对象「死亡」要两次标记</text>

<rect x="40" y="96" width="180" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="130" y="120" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">强可达对象</text>
<text x="52" y="144" font-size="10.5" fill="#334155">从 GC Roots 沿引用链可达</text>

<line x1="220" y1="128" x2="274" y2="128" stroke="#334155" stroke-width="1.5" marker-end="url(#arFZ)"/>
<text x="222" y="118" font-size="10" fill="#64748b">引用链断开</text>

<rect x="280" y="96" width="180" height="64" rx="8" fill="#ffedd5" stroke="#ea580c"/>
<text x="370" y="120" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c2d12">第一次不可达</text>
<text x="292" y="144" font-size="10.5" fill="#334155">持有它的强引用都被置空</text>

<line x1="460" y1="128" x2="514" y2="128" stroke="#334155" stroke-width="1.5" marker-end="url(#arFZ)"/>

<rect x="520" y="96" width="200" height="64" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="620" y="133" font-size="13" font-weight="bold" text-anchor="middle" fill="#b45309">重写了 finalize()？</text>

<line x1="720" y1="128" x2="774" y2="128" stroke="#334155" stroke-width="1.5" marker-end="url(#arFZ)"/>
<text x="742" y="118" font-size="11" fill="#64748b">是</text>

<rect x="780" y="96" width="180" height="64" rx="8" fill="#ffedd5" stroke="#ea580c"/>
<text x="792" y="122" font-size="12" fill="#7c2d12">进 F-Queue 等一次执行</text>
<text x="792" y="144" font-size="10.5" fill="#334155">不会立刻被回收</text>

<line x1="620" y1="160" x2="620" y2="204" stroke="#334155" stroke-width="1.5" marker-end="url(#arFZ)"/>
<text x="628" y="188" font-size="11" fill="#64748b">否</text>

<rect x="520" y="210" width="200" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="620" y="245" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">否：第二次标记 → 直接回收</text>

<line x1="870" y1="160" x2="870" y2="204" stroke="#334155" stroke-width="1.5" marker-end="url(#arFZ)"/>

<rect x="780" y="210" width="180" height="66" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="870" y="238" font-size="12" text-anchor="middle" fill="#1e3a8a">终结线程串行执行</text>
<text x="870" y="260" font-size="11" text-anchor="middle" fill="#334155">时机不确定</text>

<line x1="870" y1="276" x2="870" y2="314" stroke="#334155" stroke-width="1.5" marker-end="url(#arFZ)"/>

<rect x="780" y="320" width="180" height="64" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="870" y="344" font-size="12" font-weight="bold" text-anchor="middle" fill="#b45309">在 finalize() 里</text>
<text x="870" y="368" font-size="12" font-weight="bold" text-anchor="middle" fill="#b45309">重新挂回强引用？</text>

<line x1="780" y1="352" x2="686" y2="352" stroke="#334155" stroke-width="1.5" marker-end="url(#arFZ)"/>
<text x="712" y="344" font-size="11" fill="#64748b">是</text>

<rect x="460" y="320" width="220" height="64" rx="8" fill="#ffedd5" stroke="#ea580c"/>
<text x="570" y="344" font-size="12" font-weight="bold" text-anchor="middle" fill="#7c2d12">复活：saved=this 重新可达</text>
<text x="570" y="368" font-size="10.5" text-anchor="middle" fill="#334155">重新进入正常生命周期</text>

<line x1="570" y1="384" x2="570" y2="424" stroke="#334155" stroke-width="1.5" marker-end="url(#arFZ)"/>
<text x="582" y="408" font-size="10" fill="#64748b">把 saved 再置空、再 GC</text>

<line x1="870" y1="384" x2="870" y2="424" stroke="#334155" stroke-width="1.5" marker-end="url(#arFZ)"/>
<text x="878" y="408" font-size="10" fill="#64748b">否：未复活</text>

<rect x="460" y="430" width="220" height="72" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="570" y="454" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">复活后再不可达</text>
<text x="570" y="474" font-size="10.5" text-anchor="middle" fill="#334155">第二次标记后回收，finalize</text>
<text x="570" y="492" font-size="10.5" text-anchor="middle" fill="#334155">最多只跑过一次</text>

<rect x="780" y="430" width="180" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="870" y="454" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">回收（终态）</text>
<text x="870" y="476" font-size="10.5" text-anchor="middle" fill="#334155">finalize 不会再跑</text>

<text x="40" y="532" font-size="11" fill="#64748b">⭐ 声明了 finalize() 的对象至少多活一轮 GC；清理要用 try-with-resources 或 Cleaner（JDK 9+），finalize() 自 Java 9 起已废弃。</text>
<text x="40" y="556" font-size="11" fill="#64748b">图例：蓝＝可达/执行　橙＝不可达·中间态　黄＝判定　绿＝回收（终态）</text>
</svg>
