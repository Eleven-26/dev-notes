<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">G1 把停顿切碎，ZGC 把停顿抹掉</text>
  <rect x="32" y="52" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="68" font-size="13" fill="#64748b">同一份负载（512 MB 分配 / 32 MB 存活 / 每块 1 MB），-Xmx256m，各跑 3 轮取区间。</text>

  <rect x="32" y="92" width="936" height="286" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="116" font-size="12" font-weight="bold" fill="#64748b">收集器</text>
  <text x="200" y="116" font-size="12" font-weight="bold" fill="#64748b">停顿次数</text>
  <text x="400" y="116" font-size="12" font-weight="bold" fill="#64748b">单次最长</text>
  <text x="620" y="116" font-size="12" font-weight="bold" fill="#64748b">总停顿</text>
  <text x="800" y="116" font-size="12" font-weight="bold" fill="#64748b">墙钟 3 轮</text>
  <line x1="52" y1="126" x2="948" y2="126" stroke="#e2e8f0"/>

  <rect x="52" y="138" width="130" height="26" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="64" y="156" font-size="12" fill="#334155">Serial</text>
  <text x="200" y="156" font-size="12" font-family="Consolas, monospace" fill="#334155">21</text>
  <text x="400" y="156" font-size="12" fill="#94a3b8">未逐条统计</text>
  <text x="620" y="156" font-size="12" font-family="Consolas, monospace" fill="#334155">72.5 ms</text>
  <text x="800" y="156" font-size="12" font-family="Consolas, monospace" fill="#475569">152 / 158 / 122 ms</text>

  <rect x="52" y="186" width="130" height="26" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="64" y="204" font-size="12" fill="#334155">Parallel</text>
  <text x="200" y="204" font-size="12" font-family="Consolas, monospace" fill="#334155">8 / 8 / 8</text>
  <text x="400" y="204" font-size="12" font-family="Consolas, monospace" fill="#334155">7.7 / 7.1 / 7.2 ms</text>
  <text x="620" y="204" font-size="12" font-family="Consolas, monospace" fill="#334155">33.7 / 33.4 / 32.7 ms</text>
  <text x="800" y="204" font-size="12" font-family="Consolas, monospace" fill="#475569">213 / 264 / 245 ms</text>

  <rect x="52" y="234" width="130" height="26" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="64" y="252" font-size="12" fill="#1e3a8a">G1（默认）</text>
  <text x="200" y="252" font-size="12" font-family="Consolas, monospace" fill="#1e3a8a">16 / 17 / 17</text>
  <text x="400" y="252" font-size="12" font-family="Consolas, monospace" fill="#1e3a8a">4.1 / 2.7 / 6.0 ms</text>
  <text x="620" y="252" font-size="12" font-family="Consolas, monospace" fill="#1e3a8a">29.0 / 31.2 / 39.3 ms</text>
  <text x="800" y="252" font-size="12" font-family="Consolas, monospace" fill="#475569">315 / 295 / 320 ms</text>

  <rect x="52" y="282" width="130" height="26" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="64" y="300" font-size="12" fill="#334155">Shenandoah</text>
  <text x="200" y="300" font-size="12" font-family="Consolas, monospace" fill="#334155">70</text>
  <text x="400" y="300" font-size="12" fill="#94a3b8">未逐条统计</text>
  <text x="620" y="300" font-size="12" font-family="Consolas, monospace" fill="#334155">114.6 ms</text>
  <text x="800" y="300" font-size="12" font-family="Consolas, monospace" fill="#475569">374 / 317 / 294 ms</text>

  <rect x="52" y="330" width="130" height="26" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="64" y="348" font-size="12" fill="#166534">ZGC</text>
  <text x="200" y="348" font-size="12" font-family="Consolas, monospace" fill="#166534">45 / 48 / 39</text>
  <text x="400" y="348" font-size="12" font-family="Consolas, monospace" fill="#166534">0.078 / 0.062 / 0.034 ms</text>
  <text x="620" y="348" font-size="12" font-family="Consolas, monospace" fill="#166534">0.78 / 0.83 / 0.58 ms</text>
  <text x="800" y="348" font-size="12" font-family="Consolas, monospace" fill="#475569">441 / 399 / 503 ms</text>

  <rect x="32" y="392" width="936" height="34" rx="6" fill="#dbeafe"/>
  <text x="48" y="414" font-size="12" fill="#1e3a8a">G1 的停顿次数是 Parallel 的两倍，换来单次最长从 7.2 ms 降到 2.7~6.0 ms——这就是「可预测」的实际形态。</text>

  <rect x="32" y="434" width="936" height="34" rx="6" fill="#dcfce7"/>
  <text x="48" y="456" font-size="12" fill="#166534">ZGC 几十次停顿加起来不到 1 ms：它买到的是停顿，付的是墙钟（441 ms 对 315 ms）与 CPU。</text>
</svg>
