<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a2" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">常量池的四层引用：两条指令共用一个 Fieldref</text>
  <rect x="32" y="50" width="930" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="66" font-size="13" fill="#64748b">Fieldref 不直接存名字，而是拆成「类 + 名字与类型」，再由两者各自指向 Utf8；指令只认最外层的下标。</text>

  <rect x="40" y="120" width="250" height="160" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="56" y="146" font-size="13" font-weight="bold" fill="#15803d">inc() 的字节码</text>
  <text x="56" y="174" font-size="13" fill="#334155">getfield  #7</text>
  <text x="56" y="198" font-size="13" fill="#334155">putfield  #7</text>
  <text x="56" y="232" font-size="12" fill="#475569">两条指令都只花 2 字节</text>
  <text x="56" y="254" font-size="12" fill="#475569">下标，指向同一个 #7</text>

  <rect x="380" y="120" width="220" height="56" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="396" y="144" font-size="13" font-weight="bold" fill="#b45309">#7 Fieldref</text>
  <text x="396" y="164" font-size="12" fill="#334155">#8.#9（类 + 名字与类型）</text>

  <rect x="380" y="230" width="220" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="396" y="254" font-size="13" font-weight="bold" fill="#1e3a8a">#8 Class</text>
  <text x="396" y="274" font-size="12" fill="#334155">#10（指向类名）</text>

  <rect x="380" y="340" width="220" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="396" y="364" font-size="13" font-weight="bold" fill="#1e3a8a">#9 NameAndType</text>
  <text x="396" y="384" font-size="12" fill="#334155">#11:#12（名字 : 描述符）</text>

  <rect x="680" y="196" width="260" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="696" y="223" font-size="13" fill="#334155">#10 Utf8  "Minimal"</text>

  <rect x="680" y="268" width="260" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="696" y="295" font-size="13" fill="#334155">#11 Utf8  "x"</text>

  <rect x="680" y="340" width="260" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="696" y="367" font-size="13" fill="#334155">#12 Utf8  "I"</text>

  <line x1="290" y1="160" x2="372" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="290" y1="200" x2="372" y2="162" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="490" y1="176" x2="490" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="600" y1="176" x2="640" y2="176" stroke="#64748b" stroke-width="2"/>
  <line x1="640" y1="176" x2="640" y2="368" stroke="#64748b" stroke-width="2"/>
  <line x1="640" y1="368" x2="372" y2="368" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="600" y1="258" x2="672" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="600" y1="358" x2="672" y2="295" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="600" y1="372" x2="672" y2="362" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="40" y="424" width="910" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="448" font-size="13" font-weight="bold" fill="#0f172a">这条链的两个后果：</text>
  <text x="56" y="470" font-size="13" fill="#334155">一是同一字段在文件里只存一份签名；二是改一个名字会影响所有引用者，所以字节码增强不能随意改常量池字符串的长度。</text>

  <rect x="32" y="494" width="480" height="20" rx="4" fill="#f8fafc"/>
  <text x="40" y="508" font-size="11" fill="#94a3b8">编号与内容均取自 Minimal.class 的 javap -v 输出。</text>
</svg>
