<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">堆上限 = cgroup 限额 × 25%，四档严丝合缝</text>
  <rect x="32" y="52" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="68" font-size="13" fill="#64748b">四个短命容器各跑一次 PrintFlagsFinal；浅色条是 memory.max，深色段是 MaxHeapSize。</text>

  <rect x="32" y="92" width="936" height="222" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="116" font-size="13" font-weight="bold" fill="#334155">--memory 参数与结果</text>

  <text x="48" y="145" font-size="12" fill="#64748b">512m</text>
  <rect x="112" y="132" width="400" height="18" rx="3" fill="#e2e8f0"/>
  <rect x="112" y="132" width="100" height="18" rx="3" fill="#1d4ed8"/>
  <text x="524" y="146" font-size="12" font-family="Consolas, monospace" fill="#1e3a8a">MaxHeapSize = 134217728 = 128 MiB</text>
  <text x="836" y="146" font-size="12" fill="#475569">1/4 整</text>

  <text x="48" y="180" font-size="12" fill="#64748b">1g</text>
  <rect x="112" y="167" width="400" height="18" rx="3" fill="#e2e8f0"/>
  <rect x="112" y="167" width="200" height="18" rx="3" fill="#1d4ed8"/>
  <text x="524" y="181" font-size="12" font-family="Consolas, monospace" fill="#1e3a8a">MaxHeapSize = 268435456 = 256 MiB</text>
  <text x="836" y="181" font-size="12" fill="#475569">1/4 整</text>

  <text x="48" y="215" font-size="12" fill="#64748b">2g</text>
  <rect x="112" y="202" width="400" height="18" rx="3" fill="#e2e8f0"/>
  <rect x="112" y="202" width="200" height="18" rx="3" fill="#1d4ed8"/>
  <text x="524" y="216" font-size="12" font-family="Consolas, monospace" fill="#1e3a8a">MaxHeapSize = 536870912 = 512 MiB</text>
  <text x="836" y="216" font-size="12" fill="#475569">1/4 整</text>

  <text x="48" y="250" font-size="12" fill="#64748b">4g</text>
  <rect x="112" y="237" width="400" height="18" rx="3" fill="#e2e8f0"/>
  <rect x="112" y="237" width="200" height="18" rx="3" fill="#1d4ed8"/>
  <text x="524" y="251" font-size="12" font-family="Consolas, monospace" fill="#1e3a8a">MaxHeapSize = 1073741824 = 1024 MiB</text>
  <text x="836" y="251" font-size="12" fill="#475569">1/4 整</text>

  <rect x="48" y="268" width="904" height="34" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="60" y="289" font-size="12" fill="#1e40af">初始堆另按 InitialRAMPercentage = 1.5625%（1/64）算：512m → 8 MiB、1g → 16 MiB、2g → 32 MiB、4g → 64 MiB，四档也都对得上。</text>

  <rect x="32" y="328" width="454" height="84" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="48" y="352" font-size="13" font-weight="bold" fill="#166534">默认：认 cgroup</text>
  <text x="48" y="374" font-size="12" fill="#14532d">UseContainerSupport = true（默认）</text>
  <text x="48" y="396" font-size="12" fill="#14532d">读 /sys/fs/cgroup/memory.max</text>

  <rect x="514" y="328" width="454" height="84" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="530" y="352" font-size="13" font-weight="bold" fill="#991b1b">加 -XX:-UseContainerSupport</text>
  <text x="530" y="374" font-size="12" fill="#7f1d1d">512m 容器里堆变 1484 MiB（宿主 5.79 GiB 的 1/4）</text>
  <text x="530" y="396" font-size="12" fill="#7f1d1d">这就是「本地好好的、上容器就被杀」的根因</text>
</svg>
