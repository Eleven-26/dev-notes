<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">两种 made not entrant：一个是升级，一个是事故</text>
  <rect x="32" y="52" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="68" font-size="13" fill="#64748b">日志里长得一样，靠「前后有没有更高层版本上线」与「有没有 deoptimization 日志」区分。</text>

  <rect x="32" y="92" width="600" height="176" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="48" y="118" font-size="13" font-weight="bold" fill="#065f46">① 正常退休：新版本更好，旧版本让位</text>

  <rect x="48" y="132" width="120" height="40" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="108" y="157" font-size="12" fill="#1e40af" text-anchor="middle">C1 版本</text>

  <line x1="172" y1="152" x2="216" y2="152" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="194" y="144" font-size="11" fill="#64748b" text-anchor="middle">C2 好了</text>

  <rect x="220" y="132" width="120" height="40" rx="6" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="280" y="157" font-size="12" fill="#065f46" text-anchor="middle">C2 版本</text>

  <line x1="344" y1="152" x2="388" y2="152" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="366" y="144" font-size="11" fill="#64748b" text-anchor="middle">顶替</text>

  <rect x="392" y="132" width="120" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="452" y="157" font-size="12" fill="#475569" text-anchor="middle">旧版标 MNE</text>

  <text x="48" y="200" font-size="12" fill="#475569">栈上正在跑的旧帧继续跑完，跑完就没有任何线程再进入它；空间由 Sweeper 线程异步回收。</text>
  <text x="48" y="222" font-size="12" fill="#475569">日志：65 ms 时 id=10 的 OSR 版被标 made not entrant，而 63 ms 已有同一方法的 level 4 版本。</text>
  <text x="48" y="244" font-size="12" fill="#065f46">代价：一次跳转失效，没有停顿。</text>

  <rect x="32" y="284" width="600" height="176" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="48" y="310" font-size="13" font-weight="bold" fill="#991b1b">② 假设失效：赌错了，立刻作废</text>

  <rect x="48" y="324" width="112" height="40" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="104" y="349" font-size="12" fill="#78350f" text-anchor="middle">单态内联版</text>

  <line x1="164" y1="344" x2="204" y2="344" stroke="#dc2626" stroke-width="1.5"/>
  <text x="184" y="336" font-size="11" fill="#dc2626" text-anchor="middle">加载实现</text>

  <rect x="208" y="324" width="140" height="40" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="278" y="343" font-size="11" fill="#991b1b" text-anchor="middle">profile_predicate</text>
  <text x="278" y="358" font-size="11" fill="#991b1b" text-anchor="middle">断言失败</text>

  <line x1="352" y1="344" x2="392" y2="344" stroke="#dc2626" stroke-width="1.5"/>
  <text x="372" y="336" font-size="11" fill="#dc2626" text-anchor="middle">trap</text>

  <rect x="396" y="324" width="100" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="446" y="349" font-size="12" fill="#475569" text-anchor="middle">回解释器</text>

  <text x="48" y="392" font-size="12" fill="#475569">日志：trap_bci=5（正是接口调用点）· profile_predicate · maybe_recompile。</text>
  <text x="48" y="414" font-size="12" fill="#475569">随后重新收集 profile，编出「双态」版本——从此每次调用先比类型再分派。</text>
  <text x="48" y="436" font-size="12" fill="#991b1b">代价：8.4 倍的一次性停顿 + 1.58 倍的永久开销。</text>

  <rect x="652" y="92" width="316" height="368" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="668" y="118" font-size="13" font-weight="bold" fill="#334155">三段实测（ns/次，5 轮中位）</text>

  <text x="668" y="152" font-size="12" fill="#334155">单态</text>
  <rect x="760" y="139" width="17" height="18" rx="3" fill="#10b981"/>
  <text x="786" y="152" font-size="12" font-weight="bold" fill="#065f46">0.413</text>

  <text x="668" y="202" font-size="12" fill="#334155">刚失配</text>
  <rect x="760" y="189" width="140" height="18" rx="3" fill="#ef4444"/>
  <text x="908" y="202" font-size="12" font-weight="bold" fill="#991b1b">3.460</text>

  <text x="668" y="252" font-size="12" fill="#334155">双态恢复</text>
  <rect x="760" y="239" width="26" height="18" rx="3" fill="#f59e0b"/>
  <text x="794" y="252" font-size="12" font-weight="bold" fill="#92400e">0.652</text>

  <line x1="668" y1="282" x2="952" y2="282" stroke="#e2e8f0"/>

  <text x="668" y="306" font-size="12" fill="#475569">「刚失配」那一格同时包含三件事：</text>
  <text x="668" y="328" font-size="12" fill="#475569">去优化、重收 profile、重新编译。</text>
  <text x="668" y="356" font-size="12" fill="#475569">「双态恢复」比原始单态慢 58%，</text>
  <text x="668" y="378" font-size="12" fill="#475569">这部分是永久成本：调用点从此要做</text>
  <text x="668" y="400" font-size="12" fill="#475569">类型比较，不能直接内联展开。</text>
  <text x="668" y="430" font-size="12" fill="#991b1b">实现类超过两个（megamorphic）时，</text>
  <text x="668" y="450" font-size="12" fill="#991b1b">JIT 彻底放弃内联，性能永久变差。</text>
</svg>
