<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
<defs>
<marker id="arstage" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
</defs>

<text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">类加载的五个阶段与静态变量的赋值时机</text>
<text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">加载 → 验证 → 准备 → 解析 → 初始化，只有走到初始化阶段才执行 &lt;clinit&gt;() 赋真实值</text>

<rect x="60" y="110" width="152" height="112" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="136" y="136" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">一、加载</text>
<text x="136" y="156" font-size="10" text-anchor="middle" fill="#1e3a8a">Loading</text>
<text x="136" y="180" font-size="11" text-anchor="middle" fill="#334155">读入字节码</text>
<text x="136" y="200" font-size="11" text-anchor="middle" fill="#334155">生成 Class 对象</text>

<rect x="242" y="110" width="152" height="112" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="318" y="136" font-size="13" font-weight="700" text-anchor="middle" fill="#334155">二、验证</text>
<text x="318" y="156" font-size="10" text-anchor="middle" fill="#64748b">Verification</text>
<text x="318" y="180" font-size="11" text-anchor="middle" fill="#334155">文件格式 → 元数据</text>
<text x="318" y="200" font-size="11" text-anchor="middle" fill="#334155">→ 字节码 → 符号引用</text>

<rect x="424" y="110" width="152" height="112" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="500" y="136" font-size="13" font-weight="700" text-anchor="middle" fill="#7c2d12">三、准备</text>
<text x="500" y="156" font-size="10" text-anchor="middle" fill="#7c2d12">Preparation</text>
<text x="500" y="180" font-size="11" text-anchor="middle" fill="#334155">静态变量分配内存</text>
<text x="500" y="200" font-size="11" text-anchor="middle" fill="#7c2d12">并设零值</text>

<rect x="606" y="110" width="152" height="112" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="682" y="136" font-size="13" font-weight="700" text-anchor="middle" fill="#334155">四、解析</text>
<text x="682" y="156" font-size="10" text-anchor="middle" fill="#64748b">Resolution</text>
<text x="682" y="180" font-size="11" text-anchor="middle" fill="#334155">符号引用换直接引用</text>
<text x="682" y="200" font-size="11" text-anchor="middle" fill="#334155">时机灵活，可懒解析</text>

<rect x="788" y="110" width="152" height="112" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="864" y="136" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">五、初始化</text>
<text x="864" y="156" font-size="10" text-anchor="middle" fill="#14532d">Initialization</text>
<text x="864" y="180" font-size="11" text-anchor="middle" fill="#334155">执行 &lt;clinit&gt;()</text>
<text x="864" y="200" font-size="11" text-anchor="middle" fill="#14532d">赋真实值</text>

<line x1="212" y1="166" x2="240" y2="166" stroke="#334155" stroke-width="1.5" marker-end="url(#arstage)"/>
<line x1="394" y1="166" x2="422" y2="166" stroke="#334155" stroke-width="1.5" marker-end="url(#arstage)"/>
<line x1="576" y1="166" x2="604" y2="166" stroke="#334155" stroke-width="1.5" marker-end="url(#arstage)"/>
<line x1="758" y1="166" x2="786" y2="166" stroke="#334155" stroke-width="1.5" marker-end="url(#arstage)"/>

<rect x="60" y="234" width="152" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="136" y="262" font-size="11" text-anchor="middle" fill="#64748b">还没有 a</text>
<rect x="242" y="234" width="152" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="318" y="262" font-size="11" text-anchor="middle" fill="#64748b">还没有 a</text>
<rect x="424" y="234" width="152" height="44" rx="6" fill="#fef3c7" stroke="#b45309"/>
<text x="500" y="262" font-size="11" text-anchor="middle" fill="#7c2d12">a = 0（零值）</text>
<rect x="606" y="234" width="152" height="44" rx="6" fill="#fef3c7" stroke="#b45309"/>
<text x="682" y="262" font-size="11" text-anchor="middle" fill="#7c2d12">仍是 0</text>
<rect x="788" y="234" width="152" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
<text x="864" y="262" font-size="11" text-anchor="middle" fill="#14532d">a = 10（真实值）</text>

<rect x="60" y="300" width="880" height="170" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="80" y="330" font-size="12" font-weight="700" fill="#0f172a">⭐ 最容易答错的一点：static int a = 10 在准备阶段是 0，到初始化阶段才是 10（static final 常量在准备阶段就位）</text>
<text x="80" y="358" font-size="12" fill="#334155">&lt;clinit&gt;() 是类级初始化，不是构造器（实例级是 &lt;init&gt;()），由编译器按源码顺序收集静态赋值与 static {} 块生成</text>
<text x="80" y="386" font-size="12" fill="#334155">JVM 保证 &lt;clinit&gt; 线程安全：同一个类只有一个线程执行，其余阻塞等待（两个类互相引用会静态初始化死锁）</text>
<text x="80" y="414" font-size="12" fill="#334155">接口的 &lt;clinit&gt; 特殊：初始化接口不要求父接口先初始化，只有真正用到父接口的变量时才初始化它</text>
<text x="80" y="442" font-size="12" fill="#64748b">下面一排小格是 static int a = 10 这个变量在各阶段的取值：0 与 10 的分界，正是「准备」与「初始化」的分界</text>
</svg>
