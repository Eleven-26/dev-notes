<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">五个来源自上而下应用，越靠后越算数</text>
  <rect x="32" y="52" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="68" font-size="13" fill="#64748b">本机实测：四处各写一个 -Xmx，最终生效的是最下面那行 —— _JAVA_OPTIONS 盖掉了命令行。</text>

  <rect x="32" y="92" width="620" height="248" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="116" font-size="13" font-weight="bold" fill="#334155">应用顺序（从上往下，最后的赢）</text>

  <rect x="48" y="128" width="420" height="36" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="151" font-size="13" fill="#334155">① JVM 内置默认值</text>
  <text x="300" y="151" font-size="12" fill="#64748b">origin = {default}</text>

  <rect x="62" y="172" width="420" height="36" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="74" y="195" font-size="13" fill="#1e3a8a">② JAVA_TOOL_OPTIONS=-Xmx300m</text>
  <text x="392" y="195" font-size="12" fill="#475569">命令行之前</text>

  <rect x="76" y="216" width="420" height="36" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="88" y="239" font-size="13" fill="#1e3a8a">③ JDK_JAVA_OPTIONS=-Xmx500m</text>
  <text x="378" y="239" font-size="12" fill="#475569">被前置到命令行</text>

  <rect x="90" y="260" width="420" height="36" rx="5" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="102" y="283" font-size="13" fill="#4c1d95">④ 命令行 / @argfile  -Xmx600m</text>
  <text x="382" y="283" font-size="12" fill="#6d28d9">位置决定</text>

  <rect x="104" y="304" width="420" height="36" rx="5" fill="#fef2f2" stroke="#fecaca"/>
  <text x="116" y="327" font-size="13" font-weight="bold" fill="#991b1b">⑤ _JAVA_OPTIONS=-Xmx400m</text>
  <text x="386" y="327" font-size="12" font-weight="bold" fill="#991b1b">最后应用</text>

  <rect x="668" y="92" width="300" height="248" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="684" y="116" font-size="13" font-weight="bold" fill="#334155">叠加后 MaxHeapSize</text>

  <rect x="684" y="128" width="268" height="30" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="696" y="148" font-size="12" fill="#475569">① 之后　1484 MiB</text>

  <rect x="684" y="164" width="268" height="30" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="696" y="184" font-size="12" fill="#475569">② 之后　300 MiB</text>

  <rect x="684" y="200" width="268" height="30" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="696" y="220" font-size="12" fill="#475569">③ 之后　500 MiB</text>

  <rect x="684" y="236" width="268" height="30" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="696" y="256" font-size="12" fill="#475569">④ 之后　600 MiB</text>

  <rect x="684" y="272" width="268" height="30" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="696" y="292" font-size="13" font-weight="bold" fill="#991b1b">⑤ 之后　400 MiB ← 最终</text>

  <rect x="684" y="308" width="268" height="24" rx="4" fill="#fef9c3" stroke="#fde68a"/>
  <text x="696" y="325" font-size="12" fill="#854d0e">三行 origin 全标 {command line}</text>

  <rect x="32" y="356" width="936" height="62" rx="6" fill="#fef9c3" stroke="#fde68a"/>
  <text x="48" y="378" font-size="13" font-weight="bold" fill="#854d0e">origin 列只分四种值：{default} / {ergonomic} / {command line} / {config file}</text>
  <text x="48" y="402" font-size="13" fill="#78350f">前三种追得到大类，第四种追得到文件；而「命令行那一档」把五个来源全合并了，指不出是哪一行</text>
</svg>
