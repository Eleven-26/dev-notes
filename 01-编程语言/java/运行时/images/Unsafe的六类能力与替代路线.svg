<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="492" viewBox="0 0 1000 492" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="492" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">六类能力里，只有前三类有正经替代</text>
  <rect x="32" y="52" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="68" font-size="13" fill="#64748b">字段、内存序、CAS 能换成 VarHandle；堆外能换成 MemorySegment；数组寻址与绕过构造器没有出口。</text>

  <rect x="32" y="92" width="936" height="312" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="118" font-size="12" font-weight="bold" fill="#64748b">能力</text>
  <text x="170" y="118" font-size="12" font-weight="bold" fill="#64748b">Unsafe 上的入口</text>
  <text x="470" y="118" font-size="12" font-weight="bold" fill="#64748b">替代写法</text>
  <text x="800" y="118" font-size="12" font-weight="bold" fill="#64748b">能不能替</text>
  <line x1="52" y1="128" x2="948" y2="128" stroke="#e2e8f0"/>

  <text x="52" y="152" font-size="13" font-weight="bold" fill="#0f172a">字段读写</text>
  <text x="170" y="152" font-size="12" font-family="Consolas, monospace" fill="#334155">objectFieldOffset + getInt / putInt</text>
  <text x="470" y="152" font-size="12" font-family="Consolas, monospace" fill="#1e40af">VarHandle.findVarHandle</text>
  <rect x="800" y="135" width="140" height="26" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="812" y="153" font-size="12" fill="#166534">可替</text>

  <text x="52" y="194" font-size="13" font-weight="bold" fill="#0f172a">内存序</text>
  <text x="170" y="194" font-size="12" font-family="Consolas, monospace" fill="#334155">putIntVolatile / putOrderedInt</text>
  <text x="470" y="194" font-size="12" font-family="Consolas, monospace" fill="#1e40af">setVolatile / setRelease</text>
  <rect x="800" y="177" width="140" height="26" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="812" y="195" font-size="12" fill="#166534">可替</text>

  <text x="52" y="236" font-size="13" font-weight="bold" fill="#0f172a">CAS</text>
  <text x="170" y="236" font-size="12" font-family="Consolas, monospace" fill="#334155">compareAndSwapInt</text>
  <text x="470" y="236" font-size="12" font-family="Consolas, monospace" fill="#1e40af">VarHandle.compareAndSet</text>
  <rect x="800" y="219" width="140" height="26" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="812" y="237" font-size="12" fill="#166534">可替</text>

  <text x="52" y="278" font-size="13" font-weight="bold" fill="#0f172a">堆外内存</text>
  <text x="170" y="278" font-size="12" font-family="Consolas, monospace" fill="#334155">allocateMemory / freeMemory</text>
  <text x="470" y="278" font-size="12" font-family="Consolas, monospace" fill="#1e40af">Arena.allocate + MemorySegment</text>
  <rect x="800" y="261" width="140" height="26" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="812" y="279" font-size="12" fill="#92400e">可替，代价变了</text>

  <text x="52" y="320" font-size="13" font-weight="bold" fill="#0f172a">数组寻址</text>
  <text x="170" y="320" font-size="12" font-family="Consolas, monospace" fill="#334155">arrayBaseOffset + arrayIndexScale</text>
  <text x="470" y="320" font-size="12" fill="#475569">无，替代品都会拦越界</text>
  <rect x="800" y="303" width="140" height="26" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="812" y="321" font-size="12" fill="#991b1b">不可替</text>

  <text x="52" y="362" font-size="13" font-weight="bold" fill="#0f172a">绕过构造器</text>
  <text x="170" y="362" font-size="12" font-family="Consolas, monospace" fill="#334155">allocateInstance</text>
  <text x="470" y="362" font-size="12" fill="#475569">无，不跑构造器造对象</text>
  <rect x="800" y="345" width="140" height="26" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="812" y="363" font-size="12" fill="#991b1b">不可替</text>
  <line x1="52" y1="378" x2="948" y2="378" stroke="#e2e8f0"/>
  <text x="52" y="394" font-size="12" fill="#64748b">前三行的替代实测成本与直接访问同级（0.82 对 0.75 ns/op，见 4.4）</text>

  <rect x="32" y="416" width="936" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="48" y="440" font-size="12" fill="#1e3a8a">左边三行之所以能替，是因为 JDK 9 把它们做成了 VarHandle 的一等能力，不再需要「按偏移摸内存」这个模型。</text>
  <text x="48" y="462" font-size="12" fill="#1e3a8a">堆外那行虽然可替，但语义变了：MemorySegment 申请时就写零，256 MiB 一申请 RSS 立刻涨 256 MiB（第 5.4 节）。</text>
</svg>
