<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">class 文件十段结构：696 字节里，常量池占 425 字节</text>
  <rect x="32" y="50" width="930" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="66" font-size="13" fill="#64748b">读数来自 Minimal.class（JDK 24，javac -g）；段间没有任何对齐填充，下一段的起点全靠上一段的计数算出来。</text>

  <rect x="28" y="84" width="944" height="432" rx="8" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="40" y="104" font-size="12" font-weight="bold" fill="#475569">段</text>
  <text x="330" y="104" font-size="12" font-weight="bold" fill="#475569">字节偏移</text>
  <text x="470" y="104" font-size="12" font-weight="bold" fill="#475569">长度</text>
  <text x="560" y="104" font-size="12" font-weight="bold" fill="#475569">占比（横条长度与字节数成正比）</text>
  <line x1="40" y1="114" x2="950" y2="114" stroke="#cbd5e1"/>

  <text x="40" y="143" font-size="13" fill="#334155">magic</text>
  <text x="330" y="143" font-size="13" fill="#64748b">0..3</text>
  <text x="470" y="143" font-size="13" fill="#64748b">4</text>
  <rect x="560" y="131" width="4" height="16" fill="#cbd5e1"/>

  <text x="40" y="183" font-size="13" fill="#334155">version</text>
  <text x="330" y="183" font-size="13" fill="#64748b">4..7</text>
  <text x="470" y="183" font-size="13" fill="#64748b">4</text>
  <rect x="560" y="171" width="4" height="16" fill="#cbd5e1"/>

  <text x="40" y="223" font-size="13" fill="#334155">constant_pool_count</text>
  <text x="330" y="223" font-size="13" fill="#64748b">8..9</text>
  <text x="470" y="223" font-size="13" fill="#64748b">2</text>
  <rect x="560" y="211" width="3" height="16" fill="#cbd5e1"/>

  <text x="40" y="263" font-size="13" font-weight="bold" fill="#b45309">constant_pool</text>
  <text x="330" y="263" font-size="13" fill="#b45309">10..434</text>
  <text x="470" y="263" font-size="13" font-weight="bold" fill="#b45309">425</text>
  <rect x="560" y="251" width="380" height="16" fill="#fef3c7" stroke="#b45309"/>
  <text x="800" y="264" font-size="12" font-weight="bold" fill="#b45309">61%</text>

  <text x="40" y="303" font-size="13" fill="#334155">access_flags</text>
  <text x="330" y="303" font-size="13" fill="#64748b">435..436</text>
  <text x="470" y="303" font-size="13" fill="#64748b">2</text>
  <rect x="560" y="291" width="3" height="16" fill="#cbd5e1"/>

  <text x="40" y="343" font-size="13" fill="#334155">this_class / super_class</text>
  <text x="330" y="343" font-size="13" fill="#64748b">437..440</text>
  <text x="470" y="343" font-size="13" fill="#64748b">4</text>
  <rect x="560" y="331" width="4" height="16" fill="#cbd5e1"/>

  <text x="40" y="383" font-size="13" fill="#334155">interfaces</text>
  <text x="330" y="383" font-size="13" fill="#64748b">441..442</text>
  <text x="470" y="383" font-size="13" fill="#64748b">2</text>
  <rect x="560" y="371" width="3" height="16" fill="#cbd5e1"/>

  <text x="40" y="423" font-size="13" fill="#334155">fields（含计数）</text>
  <text x="330" y="423" font-size="13" fill="#64748b">443..468</text>
  <text x="470" y="423" font-size="13" fill="#64748b">26</text>
  <rect x="560" y="411" width="23" height="16" fill="#dbeafe" stroke="#2563eb"/>

  <text x="40" y="463" font-size="13" font-weight="bold" fill="#15803d">methods（含计数）</text>
  <text x="330" y="463" font-size="13" fill="#15803d">469..685</text>
  <text x="470" y="463" font-size="13" font-weight="bold" fill="#15803d">217</text>
  <rect x="560" y="451" width="194" height="16" fill="#dcfce7" stroke="#16a34a"/>
  <text x="764" y="464" font-size="12" font-weight="bold" fill="#16a34a">31%</text>

  <text x="40" y="503" font-size="13" fill="#334155">attributes（含计数）</text>
  <text x="330" y="503" font-size="13" fill="#64748b">686..695</text>
  <text x="470" y="503" font-size="13" fill="#64748b">10</text>
  <rect x="560" y="491" width="9" height="16" fill="#f1f5f9" stroke="#94a3b8"/>

  <rect x="40" y="532" width="910" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="556" font-size="13" font-weight="bold" fill="#0f172a">读法：名字比代码贵。</text>
  <text x="56" y="577" font-size="13" fill="#334155">同一个字段签名在文件里只存一份（常量池去重），所有指令只花 2 字节下标引用它——这就是 61% 花在常量池上的原因。</text>

  <rect x="32" y="594" width="830" height="20" rx="4" fill="#f8fafc"/>
  <text x="40" y="610" font-size="11" fill="#94a3b8">注：version 段含 minor(2) 与 major(2)，实测 0.68；fields / methods / attributes 三行都把各自的 2 字节计数算在内。</text>
</svg>
