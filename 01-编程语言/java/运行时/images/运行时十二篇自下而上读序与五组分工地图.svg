<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">运行时：十二篇自下而上读序与五组分工</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#64748b">12 篇 = 主线 ①–⑩ 加两篇旁支；折线连接组与组之间的位次，虚线框不吃主线位次</text>

  <rect x="10" y="72" width="180" height="264" rx="9" fill="#f8fafc" stroke="#2563eb" stroke-width="1.4"/>
  <text x="100" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">输入与装载 · ①②</text>
  <rect x="20" y="112" width="160" height="34" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="100" y="133" text-anchor="middle" font-size="10.5" fill="#1e3a8a">① 类文件与字节码</text>
  <line x1="100" y1="146" x2="100" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="20" y="160" width="160" height="34" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="100" y="181" text-anchor="middle" font-size="10.5" fill="#1e3a8a">② 类加载机制</text>
  <rect x="18" y="250" width="164" height="76" rx="7" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="100" y="276" text-anchor="middle" font-size="10.5" fill="#1d4ed8">.class 长什么样、</text>
  <text x="100" y="300" text-anchor="middle" font-size="10.5" fill="#1d4ed8">怎么进到方法区</text>

  <polyline points="180,177 200,177 200,129 218,129" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#d)"/>

  <rect x="210" y="72" width="180" height="264" rx="9" fill="#f8fafc" stroke="#16a34a" stroke-width="1.4"/>
  <text x="300" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">内存布局 · ③④</text>
  <rect x="220" y="112" width="160" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="300" y="133" text-anchor="middle" font-size="10.5" fill="#14532d">③ 运行时数据区与栈帧</text>
  <line x1="300" y1="146" x2="300" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="220" y="160" width="160" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="300" y="181" text-anchor="middle" font-size="10.5" fill="#14532d">④ 对象布局与引用类型</text>
  <line x1="300" y1="206" x2="300" y2="196" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#d)"/>
  <rect x="220" y="208" width="160" height="34" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="300" y="229" text-anchor="middle" font-size="10" fill="#14532d">旁支 · 接④：Unsafe 与内存布局</text>
  <rect x="218" y="250" width="164" height="76" rx="7" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="300" y="276" text-anchor="middle" font-size="10.5" fill="#166534">运行时怎么分区、</text>
  <text x="300" y="300" text-anchor="middle" font-size="10.5" fill="#166534">一个对象占多少字节</text>

  <polyline points="380,177 400,177 400,129 418,129" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#d)"/>

  <rect x="410" y="72" width="180" height="264" rx="9" fill="#f8fafc" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">执行与控制 · ⑤⑥</text>
  <rect x="420" y="112" width="160" height="34" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="133" text-anchor="middle" font-size="10.5" fill="#7c2d12">⑤ JIT 与执行引擎</text>
  <line x1="500" y1="146" x2="500" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="420" y="160" width="160" height="34" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="181" text-anchor="middle" font-size="10.5" fill="#7c2d12">⑥ JVM 启动与参数体系</text>
  <rect x="418" y="250" width="164" height="76" rx="7" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="500" y="276" text-anchor="middle" font-size="10.5" fill="#9a3412">字节码怎么变快、</text>
  <text x="500" y="300" text-anchor="middle" font-size="10.5" fill="#9a3412">参数从哪来谁盖住谁</text>

  <polyline points="580,177 600,177 600,129 618,129" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#d)"/>

  <rect x="610" y="72" width="180" height="264" rx="9" fill="#f8fafc" stroke="#0f766e" stroke-width="1.4"/>
  <text x="700" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#115e59">回收与调优 · ⑦⑧</text>
  <rect x="620" y="112" width="160" height="34" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <text x="700" y="133" text-anchor="middle" font-size="10.5" fill="#115e59">⑦ 垃圾回收原理与收集器</text>
  <line x1="700" y1="146" x2="700" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="620" y="160" width="160" height="34" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <text x="700" y="181" text-anchor="middle" font-size="10.5" fill="#115e59">⑧ GC 调优与日志</text>
  <line x1="700" y1="206" x2="700" y2="196" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#d)"/>
  <rect x="620" y="208" width="160" height="34" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="700" y="229" text-anchor="middle" font-size="10" fill="#115e59">旁支 · 接⑦：堆外内存与内存映射</text>
  <rect x="618" y="250" width="164" height="76" rx="7" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
  <text x="700" y="276" text-anchor="middle" font-size="10.5" fill="#134e4a">怎么清、</text>
  <text x="700" y="300" text-anchor="middle" font-size="10.5" fill="#134e4a">怎么量</text>

  <polyline points="780,177 800,177 800,129 818,129" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#d)"/>

  <rect x="810" y="72" width="180" height="264" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="900" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">观测与现场 · ⑨⑩</text>
  <rect x="820" y="112" width="160" height="34" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="900" y="133" text-anchor="middle" font-size="10.5" fill="#334155">⑨ JFR 与诊断工具</text>
  <line x1="900" y1="146" x2="900" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="820" y="160" width="160" height="34" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="900" y="181" text-anchor="middle" font-size="10.5" fill="#334155">⑩ 线上问题排查</text>
  <rect x="818" y="250" width="164" height="76" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="900" y="276" text-anchor="middle" font-size="10.5" fill="#334155">能看见什么、</text>
  <text x="900" y="300" text-anchor="middle" font-size="10.5" fill="#334155">出事按什么顺序查</text>

  <rect x="10" y="348" width="980" height="30" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="500" y="368" text-anchor="middle" font-size="12" fill="#334155">⑧⑨⑩ 是同一套现场动作的三种工具：⑧ 只看 GC 日志、⑨ 只看工具与事件流本身、⑩ 才把两者串成流程</text>

  <rect x="10" y="390" width="980" height="98" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="26" y="414" font-size="12" fill="#334155">顺序不能倒：GC 回收的是运行时数据区里的东西（局部变量表是 GC Roots 的第一类），而数据区的前提是类已经被加载。</text>
  <text x="26" y="438" font-size="12" fill="#334155">①② 是同一份文件的两侧：① 讲它在磁盘上长什么样，② 讲它怎么被验证与初始化 —— 先读 ①，② 里的验证才有对象。</text>
  <text x="26" y="462" font-size="12" fill="#64748b">参数体系排在 JIT 之后：-Xint、-XX:-Inline、-Xlog:deoptimization 这些用来验证机制的开关，得先知道机制才看得懂。</text>
</svg>
