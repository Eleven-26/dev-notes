<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">一行统一日志，五段各管一件事</text>
  <rect x="32" y="52" width="936" height="24" rx="4" fill="#f8fafc"/>
  <text x="40" y="68" font-size="13" fill="#64748b">G1 的整堆只有一个数，「老年代动没动」必须另开 gc+heap 才看得到。</text>

  <rect x="32" y="92" width="936" height="60" rx="6" fill="#0f172a"/>
  <text x="48" y="128" font-size="15" font-family="Consolas, monospace" fill="#e2e8f0">[0.658s][info][gc] GC(4) Pause Young (Prepare Mixed) (G1 Humongous Allocation) 253M-&gt;65M(256M) 5.405ms</text>

  <rect x="32" y="168" width="936" height="248" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="192" font-size="12" font-weight="bold" fill="#64748b">片段</text>
  <text x="300" y="192" font-size="12" font-weight="bold" fill="#64748b">含义</text>
  <text x="620" y="192" font-size="12" font-weight="bold" fill="#64748b">读它回答什么</text>
  <line x1="52" y1="202" x2="948" y2="202" stroke="#e2e8f0"/>

  <rect x="52" y="214" width="160" height="26" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="64" y="232" font-size="12" font-family="Consolas, monospace" fill="#1e3a8a">[0.658s][info][gc]</text>
  <text x="300" y="232" font-size="12" fill="#334155">启动后秒数 / 级别 / tag</text>
  <text x="620" y="232" font-size="12" fill="#475569">这行归哪个 -Xlog: 开关管</text>

  <rect x="52" y="254" width="160" height="26" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="64" y="272" font-size="12" font-family="Consolas, monospace" fill="#92400e">GC(4)</text>
  <text x="300" y="272" font-size="12" fill="#334155">第 5 次收集的编号</text>
  <text x="620" y="272" font-size="12" fill="#475569">把并发行与它的 Pause 串起来</text>

  <rect x="52" y="294" width="160" height="26" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="64" y="312" font-size="12" font-family="Consolas, monospace" fill="#166534">Pause Young (Prepare Mixed)</text>
  <text x="300" y="312" font-size="12" fill="#334155">类型：Young / Mixed / Full</text>
  <text x="620" y="312" font-size="12" fill="#475569">这次动没动老年代 region</text>

  <rect x="52" y="334" width="160" height="26" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="64" y="352" font-size="12" font-family="Consolas, monospace" fill="#991b1b">(G1 Humongous Allocation)</text>
  <text x="300" y="352" font-size="12" fill="#334155">触发原因</text>
  <text x="620" y="352" font-size="12" fill="#475569">是分配失败、还是显式 System.gc()</text>

  <rect x="52" y="374" width="160" height="26" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="64" y="392" font-size="12" font-family="Consolas, monospace" fill="#334155">253M-&gt;65M(256M)</text>
  <text x="300" y="392" font-size="12" fill="#334155">整堆前后 (容量)</text>
  <text x="620" y="392" font-size="12" fill="#991b1b">不能单独判断老年代回收量</text>

  <rect x="32" y="432" width="936" height="34" rx="6" fill="#fee2e2"/>
  <text x="48" y="454" font-size="12" fill="#991b1b">253M-&gt;65M 看着回收了 188 MB，其实是「新生代被清空 + 老年代几乎没动」，分代要看 Old regions: 2-&gt;2。</text>

  <rect x="32" y="474" width="936" height="20" rx="4" fill="#ffffff"/>
  <text x="48" y="489" font-size="12" fill="#64748b">停顿时长永远是行末那个 ms；JDK 8 是行末的 secs（第 2.1 节）。</text>
</svg>
