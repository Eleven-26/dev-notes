<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
<defs>
<marker id="armin" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
</defs>

<text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一次 Minor GC：复制、年龄与晋升</text>
<text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">新生代 = 1 个 Eden + 2 个 Survivor，同一时刻只有一块 Survivor 在用（from）</text>

<rect x="60" y="120" width="240" height="130" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="180" y="150" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a">Eden</text>
<text x="180" y="178" font-size="12" text-anchor="middle" fill="#334155">① 新对象在此分配（走 TLAB）</text>
<text x="180" y="204" font-size="12" text-anchor="middle" fill="#7f1d1d">② Eden 满 → 触发 Minor GC</text>
<text x="180" y="228" font-size="12" text-anchor="middle" fill="#7f1d1d">日志写 Allocation Failure</text>

<line x1="300" y1="185" x2="336" y2="185" stroke="#334155" stroke-width="1.5" marker-end="url(#armin)"/>

<rect x="340" y="120" width="250" height="130" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="465" y="148" font-size="13" font-weight="700" text-anchor="middle" fill="#7f1d1d">STW：全场到达安全点</text>
<text x="465" y="176" font-size="12" text-anchor="middle" fill="#7f1d1d">③ 从根出发标记存活对象</text>
<text x="465" y="202" font-size="11" text-anchor="middle" fill="#334155">GC Roots ＋ 老年代 → 新生代的卡表引用</text>
<text x="465" y="228" font-size="11" text-anchor="middle" fill="#334155">停顿与存活集成正比</text>

<line x1="590" y1="185" x2="626" y2="185" stroke="#334155" stroke-width="1.5" marker-end="url(#armin)"/>

<rect x="630" y="120" width="150" height="130" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="705" y="150" font-size="14" font-weight="700" text-anchor="middle" fill="#14532d">to</text>
<text x="705" y="180" font-size="12" text-anchor="middle" fill="#14532d">④ 存活复制到这里</text>
<text x="705" y="206" font-size="12" text-anchor="middle" fill="#14532d">年龄 +1</text>

<rect x="810" y="120" width="150" height="130" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="885" y="150" font-size="14" font-weight="700" text-anchor="middle" fill="#334155">from</text>
<text x="885" y="180" font-size="12" text-anchor="middle" fill="#334155">⑤ 清空 Eden 与 from</text>
<text x="885" y="206" font-size="12" text-anchor="middle" fill="#334155">from / to 互换</text>

<line x1="705" y1="250" x2="705" y2="396" stroke="#334155" stroke-width="1.5" marker-end="url(#armin)"/>

<rect x="60" y="400" width="330" height="130" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="225" y="428" font-size="13" font-weight="700" text-anchor="middle" fill="#7c2d12">⑥ 复制前先确认老年代装得下</text>
<text x="225" y="456" font-size="11" text-anchor="middle" fill="#334155">JDK 8：HandlePromotionFailure 已移除</text>
<text x="225" y="480" font-size="11" text-anchor="middle" fill="#334155">改为按历次晋升的平均大小预估</text>
<text x="225" y="508" font-size="12" text-anchor="middle" fill="#7f1d1d">装不下 → 直接 Full GC</text>

<rect x="630" y="400" width="330" height="130" rx="8" fill="#ffedd5" stroke="#ea580c"/>
<text x="795" y="428" font-size="14" font-weight="700" text-anchor="middle" fill="#7c2d12">老年代（Old）</text>
<text x="795" y="456" font-size="12" text-anchor="middle" fill="#7c2d12">年龄达阈值 → 晋升</text>
<text x="795" y="480" font-size="12" text-anchor="middle" fill="#7c2d12">动态年龄判定：实测常提前到 6~7</text>
<text x="795" y="508" font-size="11" text-anchor="middle" fill="#334155">PretenureSizeThreshold 大对象直入</text>

<text x="500" y="580" font-size="13" text-anchor="middle" fill="#0f172a">新生代用复制而不是标记-清除 → 存活对象少时极快；⑥ 解除 STW，用户线程继续</text>
<text x="500" y="608" font-size="12" text-anchor="middle" fill="#64748b">但复制前必须确认老年代装得下，否则要走空间分配担保</text>
</svg>
