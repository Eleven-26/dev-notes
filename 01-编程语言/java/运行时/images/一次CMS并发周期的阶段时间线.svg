<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

<text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一次 CMS 并发周期的七个阶段</text>
<text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">两处 STW 合计 2.38 ms，整个周期墙钟跨度 410 ms（-XX:+UseConcMarkSweepGC，JDK 1.8.0_321）</text>

<text x="90" y="140" font-size="11" text-anchor="middle" fill="#64748b">3.501</text>
<text x="185" y="140" font-size="11" text-anchor="middle" fill="#64748b">3.502</text>
<text x="305" y="140" font-size="11" text-anchor="middle" fill="#64748b">3.504</text>
<text x="485" y="140" font-size="11" text-anchor="middle" fill="#64748b">3.504 → 3.907</text>
<text x="640" y="140" font-size="11" text-anchor="middle" fill="#64748b">3.907</text>
<text x="735" y="140" font-size="11" text-anchor="middle" fill="#64748b">3.909</text>
<text x="870" y="140" font-size="11" text-anchor="middle" fill="#64748b">3.909 → 3.911</text>

<rect x="60" y="150" width="60" height="64" fill="#fee2e2" stroke="#dc2626"/>
<rect x="120" y="150" width="130" height="64" fill="#dcfce7" stroke="#16a34a"/>
<rect x="250" y="150" width="110" height="64" fill="#dcfce7" stroke="#16a34a"/>
<rect x="360" y="150" width="250" height="64" fill="#dbeafe" stroke="#2563eb"/>
<rect x="610" y="150" width="60" height="64" fill="#fee2e2" stroke="#dc2626"/>
<rect x="670" y="150" width="130" height="64" fill="#dcfce7" stroke="#16a34a"/>
<rect x="800" y="150" width="140" height="64" fill="#f1f5f9" stroke="#94a3b8"/>

<text x="90" y="188" font-size="14" text-anchor="middle" fill="#7f1d1d">①</text>
<text x="185" y="178" font-size="14" text-anchor="middle" fill="#14532d">②</text>
<text x="185" y="200" font-size="10" text-anchor="middle" fill="#14532d">concurrent mark</text>
<text x="305" y="178" font-size="14" text-anchor="middle" fill="#14532d">③</text>
<text x="305" y="200" font-size="10" text-anchor="middle" fill="#14532d">preclean</text>
<text x="485" y="178" font-size="14" text-anchor="middle" fill="#1e3a8a">④</text>
<text x="485" y="200" font-size="10" text-anchor="middle" fill="#1e3a8a">abortable preclean</text>
<text x="640" y="188" font-size="14" text-anchor="middle" fill="#7f1d1d">⑤</text>
<text x="735" y="178" font-size="14" text-anchor="middle" fill="#14532d">⑥</text>
<text x="735" y="200" font-size="10" text-anchor="middle" fill="#14532d">sweep</text>
<text x="870" y="178" font-size="14" text-anchor="middle" fill="#334155">⑦</text>
<text x="870" y="200" font-size="10" text-anchor="middle" fill="#334155">reset</text>

<text x="500" y="248" font-size="12" text-anchor="middle" fill="#0f172a">红块是 STW，蓝绿块与用户线程并发；块宽只表示先后与相对占比（④ 占 0.402 s），两个红块实际不到 2 ms，已放大显示</text>

<rect x="60" y="270" width="880" height="220" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="80" y="296" font-size="12" fill="#7f1d1d">① Initial Mark —— STW，3.501，0.0008613 secs（即 0.86 ms）</text>
<text x="80" y="320" font-size="12" fill="#14532d">② concurrent mark —— 并发，0.001/0.001 secs（CPU/墙钟双数格式，别看成两个阶段）</text>
<text x="80" y="344" font-size="12" fill="#14532d">③ concurrent preclean —— 并发，0.000/0.000 secs</text>
<text x="80" y="368" font-size="12" fill="#1e3a8a">④ abortable-preclean —— 并发，0.002/0.402 secs → 410 ms 的跨度基本都花在这里</text>
<text x="80" y="392" font-size="12" fill="#7f1d1d">⑤ Final Remark —— STW，0.0015155 secs，含 Rescan (parallel)（增量更新要付的账）＋弱引用处理、类卸载、符号表 / 字符串表清理</text>
<text x="80" y="416" font-size="12" fill="#14532d">⑥ concurrent sweep —— 并发，标记-清除不压缩，0.000/0.000 secs</text>
<text x="80" y="440" font-size="12" fill="#334155">⑦ concurrent reset —— 并发，0.002/0.002 secs</text>
<text x="80" y="468" font-size="12" font-weight="700" fill="#0f172a">⭐ 日志里没有 [GC 前缀的行都是并发的：停顿只有 0.86 ms ＋ 1.52 ms ＝ 2.38 ms，这就是「停顿优先」的含义</text>
</svg>
