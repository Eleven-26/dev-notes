<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <rect x="40" y="16" width="900" height="26" fill="#ffffff"/>
  <text x="40" y="35" font-size="17" font-weight="700" fill="#0f172a">同一个请求，PHP 要走四段，Go 只走两段</text>
  <rect x="40" y="42" width="920" height="22" fill="#ffffff"/>
  <text x="40" y="58" font-size="12.5" fill="#64748b">差别只在第二段：PHP 的编译发生在每一个请求里，Go 的编译在 go build 那一刻就结束了</text>

  <rect x="40" y="88" width="320" height="24" fill="#ffffff"/>
  <text x="40" y="105" font-size="13" font-weight="700" fill="#0f172a">PHP（php-fpm）：每请求四段</text>

  <rect x="40" y="118" width="160" height="76" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="120" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">① request</text>
  <text x="120" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">_startup</text>
  <text x="120" y="182" text-anchor="middle" font-size="11" fill="#475569">重置超全局 / 内存池</text>

  <rect x="210" y="118" width="250" height="76" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="335" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">② compile</text>
  <text x="335" y="163" text-anchor="middle" font-size="11" fill="#92400e">词法 → 语法 → AST → opcode</text>
  <text x="335" y="181" text-anchor="middle" font-size="11" fill="#92400e">命中 opcache 时整段跳过</text>

  <rect x="470" y="118" width="250" height="76" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="595" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">③ execute</text>
  <text x="595" y="163" text-anchor="middle" font-size="11" fill="#1e40af">Zend VM 逐条解释 opcode</text>
  <text x="595" y="181" text-anchor="middle" font-size="11" fill="#1e40af">31 条指令跑一次业务逻辑</text>

  <rect x="730" y="118" width="190" height="76" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="825" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">④ request</text>
  <text x="825" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">_shutdown</text>
  <text x="825" y="182" text-anchor="middle" font-size="11" fill="#475569">析构 / 写 session / 回收</text>

  <rect x="40" y="200" width="160" height="20" fill="#ffffff"/>
  <text x="40" y="214" font-size="11" fill="#64748b">约 0.4 ms（固定）</text>
  <rect x="210" y="200" width="250" height="20" fill="#ffffff"/>
  <text x="210" y="214" font-size="11" font-weight="700" fill="#b45309">0.6 ms（11 行）～ 1.3 ms（333 行）</text>
  <rect x="470" y="200" width="250" height="20" fill="#ffffff"/>
  <text x="470" y="214" font-size="11" fill="#64748b">由业务决定</text>

  <rect x="40" y="240" width="320" height="24" fill="#ffffff"/>
  <text x="40" y="257" font-size="13" font-weight="700" fill="#0f172a">Go（静态二进制）：编译不在运行期</text>

  <rect x="40" y="270" width="160" height="76" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="120" y="297" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">① 进程启动</text>
  <text x="120" y="315" text-anchor="middle" font-size="11" fill="#475569">装载 + runtime 初始化</text>
  <text x="120" y="334" text-anchor="middle" font-size="11" fill="#475569">4.5 ～ 7.0 ms</text>

  <rect x="210" y="270" width="250" height="76" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="335" y="301" text-anchor="middle" font-size="12" fill="#94a3b8">这一段在这里不存在</text>
  <text x="335" y="320" text-anchor="middle" font-size="11" fill="#94a3b8">编译已由 go build 完成</text>

  <rect x="470" y="270" width="250" height="76" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="595" y="297" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">③ 执行</text>
  <text x="595" y="315" text-anchor="middle" font-size="11" fill="#1e40af">CPU 直接跑机器码</text>
  <text x="595" y="334" text-anchor="middle" font-size="11" fill="#1e40af">无解释器、无编译</text>

  <rect x="730" y="270" width="190" height="76" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="825" y="297" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">④ 进程退出</text>
  <text x="825" y="315" text-anchor="middle" font-size="11" fill="#475569">main 返回即结束</text>

  <rect x="40" y="366" width="900" height="22" fill="#fffbeb"/>
  <text x="40" y="381" font-size="11.5" fill="#78350f">opcache 的全部作用就是把第 ② 段从「重新编译」换成「查一次哈希」；它不碰第 ①③④ 段，也不缓存任何变量值</text>
  <rect x="40" y="394" width="900" height="22" fill="#ffffff"/>
  <text x="40" y="409" font-size="11.5" fill="#334155">第 ② 段的宽度来自实测：11 行脚本约 600 µs、333 行脚本约 1.3 ms，成本不随行数线性增长</text>
  <rect x="40" y="422" width="900" height="22" fill="#ffffff"/>
  <text x="40" y="437" font-size="11.5" fill="#334155">第 ① 段的 0.4 ms 是把 index.php 与 big.php 都开 opcache 后相减得到的，属于请求本身的固定开销</text>
</svg>
