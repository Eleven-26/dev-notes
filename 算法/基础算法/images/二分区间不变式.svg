<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="1000" height="520" fill="#f7f9fc"/><rect x="0" y="0" width="1000" height="56" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="1.5"/><text x="500.0" y="30" font-size="22" fill="#1f3a5f" text-anchor="middle" font-weight="bold">二分的两种区间写法与不变式</text><text x="500.0" y="50" font-size="13" fill="#5a6b7c" text-anchor="middle" font-weight="normal">arr = [1 3 3 5 7 9]，查找 x = 5</text><rect x="250" y="110" width="72" height="46" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="286.0" y="140" font-size="17" fill="#22303f" text-anchor="middle" font-weight="normal">1</text><text x="286.0" y="98" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">[0]</text><rect x="330" y="110" width="72" height="46" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="366.0" y="140" font-size="17" fill="#22303f" text-anchor="middle" font-weight="normal">3</text><text x="366.0" y="98" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">[1]</text><rect x="410" y="110" width="72" height="46" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="446.0" y="140" font-size="17" fill="#22303f" text-anchor="middle" font-weight="normal">3</text><text x="446.0" y="98" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">[2]</text><rect x="490" y="110" width="72" height="46" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="526.0" y="140" font-size="17" fill="#22303f" text-anchor="middle" font-weight="normal">5</text><text x="526.0" y="98" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">[3]</text><rect x="570" y="110" width="72" height="46" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="606.0" y="140" font-size="17" fill="#22303f" text-anchor="middle" font-weight="normal">7</text><text x="606.0" y="98" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">[4]</text><rect x="650" y="110" width="72" height="46" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="686.0" y="140" font-size="17" fill="#22303f" text-anchor="middle" font-weight="normal">9</text><text x="686.0" y="98" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">[5]</text><text x="120" y="140" font-size="15" fill="#1f3a5f" text-anchor="middle" font-weight="bold">下标</text><text x="60" y="210" font-size="15" fill="#1f3a5f" text-anchor="start" font-weight="bold">① 闭区间 [lo, hi]：每次必看 mid，命中就返回</text><text x="80" y="240" font-size="13" fill="#5a6b7c" text-anchor="start" font-weight="normal">不变式：答案一定落在 [lo, hi] 内（两端都可能是答案）</text><text x="80" y="262" font-size="13" fill="#2e7d32" text-anchor="start" font-weight="normal">终止条件：lo &gt; hi；收缩：lo = mid+1 或 hi = mid-1</text><text x="60" y="300" font-size="15" fill="#1f3a5f" text-anchor="start" font-weight="bold">② 半开区间 [lo, hi)：hi 是「哨兵」，不指向元素</text><text x="80" y="330" font-size="13" fill="#5a6b7c" text-anchor="start" font-weight="normal">不变式：答案一定落在 [lo, hi) 内（hi 本身排除在外）</text><text x="80" y="352" font-size="13" fill="#2e7d32" text-anchor="start" font-weight="normal">终止条件：lo == hi；收缩：lo = mid+1 或 hi = mid</text><rect x="250" y="400" width="480" height="46" rx="8" fill="none" stroke="#9db4d0" stroke-width="1.5"/><text x="526" y="480" font-size="13" fill="#5a6b7c" text-anchor="middle" font-weight="normal">hi = n = 6（越界哨兵）</text><line x1="730" y1="446" x2="730" y2="466" stroke="#5a6b7c" stroke-width="1.5"/><line x1="250" y1="446" x2="250" y2="466" stroke="#5a6b7c" stroke-width="1.5"/><text x="270" y="480" font-size="13" fill="#5a6b7c" text-anchor="start" font-weight="normal">lo = 0</text><rect x="50" y="460" width="900" height="46" rx="8" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/><text x="500" y="488" font-size="14" fill="#6a1b9a" text-anchor="middle" font-weight="normal">★ 两种写法都能对，但不变式必须自洽：改一处收缩规则，就要同步改边界与终止条件</text></svg>