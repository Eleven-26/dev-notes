<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">定长窗口：滑动一次 = 右端进一个、左端出一个</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">以「找到字符串中所有字母异位词」为例：s = "cbaebabacd"，p = "abc"（窗口长度恒为 |p| = 3）</text>

  <text x="40" y="96" font-size="13" fill="#475569">s 的索引</text>
  <g font-size="14">
    <rect x="150" y="76" width="76" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="188" y="97" text-anchor="middle" fill="#334155">0</text>
    <rect x="230" y="76" width="76" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="268" y="97" text-anchor="middle" fill="#334155">1</text>
    <rect x="310" y="76" width="76" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="348" y="97" text-anchor="middle" fill="#334155">2</text>
    <rect x="390" y="76" width="76" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="428" y="97" text-anchor="middle" fill="#334155">3</text>
    <rect x="470" y="76" width="76" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="508" y="97" text-anchor="middle" fill="#334155">4</text>
    <rect x="550" y="76" width="76" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="588" y="97" text-anchor="middle" fill="#334155">5</text>
    <rect x="630" y="76" width="76" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="668" y="97" text-anchor="middle" fill="#334155">6</text>
    <rect x="710" y="76" width="76" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="748" y="97" text-anchor="middle" fill="#334155">7</text>
    <rect x="790" y="76" width="76" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="828" y="97" text-anchor="middle" fill="#334155">8</text>
    <rect x="870" y="76" width="76" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="908" y="97" text-anchor="middle" fill="#334155">9</text>
  </g>
  <g font-size="15">
    <text x="188" y="122" text-anchor="middle" fill="#0f172a">c</text>
    <text x="268" y="122" text-anchor="middle" fill="#0f172a">b</text>
    <text x="348" y="122" text-anchor="middle" fill="#0f172a">a</text>
    <text x="428" y="122" text-anchor="middle" fill="#0f172a">e</text>
    <text x="508" y="122" text-anchor="middle" fill="#0f172a">b</text>
    <text x="588" y="122" text-anchor="middle" fill="#0f172a">a</text>
    <text x="668" y="122" text-anchor="middle" fill="#0f172a">b</text>
    <text x="748" y="122" text-anchor="middle" fill="#0f172a">a</text>
    <text x="828" y="122" text-anchor="middle" fill="#0f172a">c</text>
    <text x="908" y="122" text-anchor="middle" fill="#0f172a">d</text>
  </g>

  <rect x="40" y="146" width="900" height="30" rx="5" fill="#e2e8f0"/>
  <text x="60" y="166" font-size="13" font-weight="bold" fill="#334155">起点</text>
  <text x="160" y="166" font-size="13" font-weight="bold" fill="#334155">窗口内容</text>
  <text x="330" y="166" font-size="13" font-weight="bold" fill="#334155">窗口内字母计数</text>
  <text x="700" y="166" font-size="13" font-weight="bold" fill="#334155">与 p 的计数 {a:1 b:1 c:1} 比较</text>

  <g font-size="13">
    <rect x="40" y="176" width="900" height="38" rx="0" fill="#dcfce7"/>
    <text x="60" y="200" fill="#14532d">0</text>
    <text x="160" y="200" fill="#14532d">cba</text>
    <text x="330" y="200" fill="#14532d">{a:1 b:1 c:1}</text>
    <text x="700" y="200" font-weight="bold" fill="#16a34a">命中（起点 0）</text>

    <text x="60" y="238" fill="#475569">1</text>
    <text x="160" y="238" fill="#334155">bae</text>
    <text x="330" y="238" fill="#334155">{a:1 b:1 e:1}</text>
    <text x="700" y="238" fill="#b91c1c">否（e 不在 p 中）</text>

    <text x="60" y="276" fill="#475569">2</text>
    <text x="160" y="276" fill="#334155">aeb</text>
    <text x="330" y="276" fill="#334155">{a:1 b:1 e:1}</text>
    <text x="700" y="276" fill="#b91c1c">否</text>

    <text x="60" y="314" fill="#475569">3</text>
    <text x="160" y="314" fill="#334155">eba</text>
    <text x="330" y="314" fill="#334155">{a:1 b:1 e:1}</text>
    <text x="700" y="314" fill="#b91c1c">否</text>

    <text x="60" y="352" fill="#475569">4</text>
    <text x="160" y="352" fill="#334155">bab</text>
    <text x="330" y="352" fill="#334155">{a:1 b:2}</text>
    <text x="700" y="352" fill="#b91c1c">否（b 重复、缺 c）</text>

    <text x="60" y="390" fill="#475569">5</text>
    <text x="160" y="390" fill="#334155">aba</text>
    <text x="330" y="390" fill="#334155">{a:2 b:1}</text>
    <text x="700" y="390" fill="#b91c1c">否（a 重复、缺 c）</text>

    <rect x="40" y="404" width="900" height="38" rx="0" fill="#dcfce7"/>
    <text x="60" y="428" fill="#14532d">6</text>
    <text x="160" y="428" fill="#14532d">bac</text>
    <text x="330" y="428" fill="#14532d">{a:1 b:1 c:1}</text>
    <text x="700" y="428" font-weight="bold" fill="#16a34a">命中（起点 6）</text>

    <text x="60" y="466" fill="#475569">7</text>
    <text x="160" y="466" fill="#334155">acd</text>
    <text x="330" y="466" fill="#334155">{a:1 c:1 d:1}</text>
    <text x="700" y="466" fill="#b91c1c">否（d 不在 p 中）</text>
  </g>

  <line x1="40" y1="492" x2="940" y2="492" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="518" font-size="13" fill="#334155">定长窗口的写法与可变长不同：窗口长度固定，所以「进一个」的同时必须「出一个」，不需要 while 收缩。</text>
  <text x="40" y="542" font-size="13" fill="#334155">比较的是两个定长数组（26 个字母的计数），而不是两个串 —— 这样每次滑动是 O(1)，整体 O(n)。</text>
  <text x="40" y="566" font-size="13" fill="#b45309">⚠️ 命中判定的时机：只有在 hi 已经走过 |p| - 1 之后，窗口长度才够，之前不能比。本机实测命中起点为 [0 6]。</text>
  <text x="40" y="596" font-size="12" fill="#94a3b8">本图对应正文第四节，数值与 .workbuddy/tmp/basic_lab 的实测输出逐行一致。⚠️ 本机无法栅格化 SVG，需要 PNG 时请自行导出。</text>
</svg>
