<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="1000" height="390" fill="#f7f9fc"/><rect x="0" y="0" width="1000" height="56" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="1.5"/><text x="500.0" y="30" font-size="22" fill="#1f3a5f" text-anchor="middle" font-weight="bold">递归调用栈 vs 显式栈</text><text x="500.0" y="50" font-size="13" fill="#5a6b7c" text-anchor="middle" font-weight="normal">factorial(3)：系统用调用栈保存返回地址，也可以自己用一个栈模拟</text><text x="210" y="96" font-size="15" fill="#1f3a5f" text-anchor="middle" font-weight="bold">递归：系统调用栈（后进先出）</text><rect x="60" y="120" width="300" height="42" rx="8" fill="#e8f0fb" stroke="#9db4d0" stroke-width="1.5"/><text x="210" y="147" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">factorial(3)  → 3 * [等 factorial(2)]</text><rect x="60" y="172" width="300" height="42" rx="8" fill="#e8f0fb" stroke="#9db4d0" stroke-width="1.5"/><text x="210" y="199" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">factorial(2)  → 2 * [等 factorial(1)]</text><rect x="60" y="224" width="300" height="42" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="210" y="251" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">factorial(1)  → 返回 1（基准情形）</text><text x="60" y="296" font-size="12" fill="#5a6b7c" text-anchor="start" font-weight="normal">↑ 栈顶在最后一行；返回时从栈顶弹出</text><text x="700" y="96" font-size="15" fill="#1f3a5f" text-anchor="middle" font-weight="bold">显式栈：自己压/弹</text><rect x="560" y="120" width="300" height="32" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="710" y="142" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">push 3 的现场</text><rect x="560" y="160" width="300" height="32" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="710" y="182" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">push 2 的现场</text><rect x="560" y="200" width="300" height="32" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="710" y="222" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">push 1 的现场</text><rect x="560" y="240" width="300" height="32" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="710" y="262" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">pop 1 → 得 1</text><rect x="560" y="280" width="300" height="32" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="710" y="302" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">pop 2 → 得 2</text><rect x="560" y="320" width="300" height="32" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="710" y="342" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">pop 3 → 得 6</text><rect x="50" y="324" width="900" height="52" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="500" y="348" font-size="14" fill="#c62828" text-anchor="middle" font-weight="normal">⚠️ 判据：递归深度大、或用系统栈会溢出时，改显式栈</text><text x="500" y="368" font-size="13" fill="#5a6b7c" text-anchor="middle" font-weight="normal">但显式栈要自己维护「执行到哪一步」的状态</text></svg>