<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">双指针的三种形态：对撞 / 快慢 / 同向</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">三种形态的判据是同一条 —— 移动指针必须有单调性依据，且每步都不破坏不变式</text>

  <rect x="30" y="80" width="940" height="200" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="108" font-size="15" font-weight="bold" fill="#1e3a8a">① 对撞指针（有序数组的两数之和 / 回文 / 盛水容器）</text>
  <text x="50" y="130" font-size="13" fill="#475569">两个指针从两端相向而行；靠"有序"提供的单调性决定该动哪一侧</text>

  <g>
    <rect x="60" y="146" width="62" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="91" y="171" text-anchor="middle" font-size="15" fill="#1e3a8a">1</text>
    <rect x="122" y="146" width="62" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="153" y="171" text-anchor="middle" font-size="15" fill="#334155">3</text>
    <rect x="184" y="146" width="62" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="215" y="171" text-anchor="middle" font-size="15" fill="#334155">4</text>
    <rect x="246" y="146" width="62" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="277" y="171" text-anchor="middle" font-size="15" fill="#334155">6</text>
    <rect x="308" y="146" width="62" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="339" y="171" text-anchor="middle" font-size="15" fill="#334155">8</text>
    <rect x="370" y="146" width="62" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="401" y="171" text-anchor="middle" font-size="15" fill="#334155">11</text>
    <rect x="432" y="146" width="62" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="463" y="171" text-anchor="middle" font-size="15" fill="#334155">15</text>
    <rect x="494" y="146" width="62" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="525" y="171" text-anchor="middle" font-size="15" fill="#334155">20</text>
    <rect x="556" y="146" width="62" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="587" y="171" text-anchor="middle" font-size="15" fill="#334155">22</text>
    <rect x="618" y="146" width="62" height="36" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="649" y="171" text-anchor="middle" font-size="15" fill="#7f1d1d">27</text>

    <text x="91" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">lo</text>
    <text x="649" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">hi</text>
    <line x1="91" y1="188" x2="649" y2="188" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <polygon points="91,196 85,186 97,186" fill="#2563eb"/>
    <polygon points="649,196 643,186 655,186" fill="#dc2626"/>
  </g>

  <text x="700" y="160" font-size="13" fill="#334155">目标 target = 26</text>
  <text x="700" y="182" font-size="13" fill="#334155">a[lo]+a[hi] = 1+27 = 28 &gt; 26</text>
  <text x="700" y="202" font-size="13" fill="#dc2626">→ 只能 hi--（27 太大了）</text>

  <text x="50" y="234" font-size="13" fill="#475569">移动依据：a[lo]+a[hi] &lt; target → lo++；&gt; target → hi--；相等即命中。每次移动都排除掉一整行 / 一整列，所以 O(n)</text>
  <text x="50" y="258" font-size="13" fill="#b91c1c">⚠️ 只有排序之后才有这个单调性；无序数组上"随便动一个"会漏解</text>

  <rect x="30" y="294" width="940" height="252" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="322" font-size="15" font-weight="bold" fill="#1e3a8a">② 快慢指针（链表判环 Floyd / 找中点 / 删倒数第 N 个）</text>
  <text x="50" y="344" font-size="13" fill="#475569">同向出发，速度比 2:1；有环时相对速度为 1，二者必然在环内相遇</text>

  <g>
    <circle cx="60" cy="410" r="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="60" y="416" text-anchor="middle" font-size="14" fill="#334155">0</text>
    <circle cx="138" cy="410" r="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="138" y="416" text-anchor="middle" font-size="14" fill="#334155">1</text>
    <circle cx="216" cy="410" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="216" y="416" text-anchor="middle" font-size="14" fill="#14532d">2</text>
    <circle cx="294" cy="410" r="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="294" y="416" text-anchor="middle" font-size="14" fill="#334155">3</text>
    <circle cx="372" cy="410" r="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="372" y="416" text-anchor="middle" font-size="14" fill="#334155">4</text>
    <circle cx="450" cy="410" r="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="450" y="416" text-anchor="middle" font-size="14" fill="#334155">5</text>
    <circle cx="528" cy="410" r="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="528" y="416" text-anchor="middle" font-size="14" fill="#334155">6</text>
    <circle cx="606" cy="410" r="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="606" y="416" text-anchor="middle" font-size="14" fill="#78350f">7</text>
    <circle cx="684" cy="410" r="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="684" y="416" text-anchor="middle" font-size="14" fill="#334155">8</text>

    <line x1="78" y1="410" x2="120" y2="410" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="156" y1="410" x2="198" y2="410" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="234" y1="410" x2="276" y2="410" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="312" y1="410" x2="354" y2="410" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="390" y1="410" x2="432" y2="410" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="468" y1="410" x2="510" y2="410" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="546" y1="410" x2="588" y2="410" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="624" y1="410" x2="666" y2="410" stroke="#94a3b8" stroke-width="1.5"/>

    <path d="M 684 428 Q 684 500 450 500 Q 216 500 216 428" fill="none" stroke="#d97706" stroke-width="2"/>
    <polygon points="216,428 210,444 222,444" fill="#d97706"/>
    <text x="450" y="522" text-anchor="middle" font-size="13" fill="#b45309">环：8 → 2（环长 L = 7）</text>

    <text x="216" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">入口</text>
    <text x="606" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">相遇点</text>
    <text x="60" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">head</text>
  </g>

  <text x="50" y="486" font-size="13" fill="#1e3a8a">a（head → 入口）= 2 步　　b（入口 → 相遇）= 5 步　　c（相遇 → 入口）= 2 步　　L = b + c = 7</text>
  <text x="50" y="510" font-size="13" fill="#334155">设 fast 多走了 n 圈：2(a+b) = a+b+nL → a = (n-1)L + c。本机实测 n=1，2 = 0×7 + 2 ✓</text>
  <text x="50" y="534" font-size="13" fill="#b91c1c">所以"一个从 head 走、一个从相遇点走，每次各走一格"必然在入口相遇；本机第 7 步相遇于节点 7</text>

  <rect x="30" y="560" width="940" height="172" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="588" font-size="15" font-weight="bold" fill="#1e3a8a">③ 同向指针（原地删除重复元素 / 荷兰国旗三路分区）</text>
  <text x="50" y="610" font-size="13" fill="#475569">读写指针同向推进：读指针负责"看"，写指针负责"收"；三路分区再加一个从右往左的 hi</text>

  <g>
    <rect x="60" y="628" width="62" height="36" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="91" y="653" text-anchor="middle" font-size="15" fill="#7f1d1d">2</text>
    <rect x="122" y="628" width="62" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="153" y="653" text-anchor="middle" font-size="15" fill="#14532d">0</text>
    <rect x="184" y="628" width="62" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="215" y="653" text-anchor="middle" font-size="15" fill="#334155">1</text>
    <rect x="246" y="628" width="62" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="277" y="653" text-anchor="middle" font-size="15" fill="#334155">2</text>
    <rect x="308" y="628" width="62" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="339" y="653" text-anchor="middle" font-size="15" fill="#334155">1</text>
    <rect x="370" y="628" width="62" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="401" y="653" text-anchor="middle" font-size="15" fill="#334155">0</text>
    <rect x="432" y="628" width="62" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="463" y="653" text-anchor="middle" font-size="15" fill="#334155">0</text>
    <rect x="494" y="628" width="62" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="525" y="653" text-anchor="middle" font-size="15" fill="#334155">2</text>
    <rect x="556" y="628" width="62" height="36" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="587" y="653" text-anchor="middle" font-size="15" fill="#312e81">1</text>

    <text x="91" y="622" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">lo</text>
    <text x="153" y="680" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">mid</text>
    <text x="587" y="622" text-anchor="middle" font-size="12" font-weight="bold" fill="#4f46e5">hi</text>
  </g>

  <text x="650" y="640" font-size="13" fill="#334155">a[mid] == 0 → 与 lo 交换，lo++、mid++</text>
  <text x="650" y="660" font-size="13" fill="#334155">a[mid] == 1 → mid++（已在正确位置）</text>
  <text x="650" y="680" font-size="13" fill="#b91c1c">a[mid] == 2 → 与 hi 交换，hi--、mid 不动</text>
  <text x="650" y="700" font-size="13" fill="#b91c1c">（换过来的数还没看过，不能 mid++）</text>

  <text x="40" y="752" font-size="12" fill="#94a3b8">本图对应正文第一至第四节，数字与 .workbuddy/tmp/basic_lab 的实测输出逐项一致。⚠️ 本机无法栅格化 SVG，需要 PNG 时请自行导出。</text>
</svg>
