<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">最终的霍夫曼树与编码表（ABRACADABRA）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">约定：左分支 = 0，右分支 = 1。从根走到叶，路上的 0/1 拼起来就是这个字符的码</text>

  <line x1="460" y1="94" x2="200" y2="181" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="460" y1="94" x2="720" y2="176" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="720" y1="224" x2="560" y2="316" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="720" y1="224" x2="880" y2="316" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="560" y1="364" x2="480" y2="461" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="560" y1="364" x2="640" y2="461" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="880" y1="364" x2="800" y2="461" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="880" y1="364" x2="940" y2="461" stroke="#94a3b8" stroke-width="1.5"/>

  <circle cx="460" cy="70" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="460" y="70" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#78350f">11</text>

  <rect x="157" y="181" width="86" height="38" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="200" y="201" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#7f1d1d">A : 5</text>

  <circle cx="720" cy="200" r="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="720" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">6</text>
  <circle cx="560" cy="340" r="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="560" y="340" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">2</text>
  <circle cx="880" cy="340" r="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="880" y="340" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">4</text>

  <rect x="437" y="461" width="86" height="38" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="480" y="481" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#7f1d1d">C : 1</text>
  <rect x="597" y="461" width="86" height="38" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="640" y="481" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#7f1d1d">D : 1</text>
  <rect x="757" y="461" width="86" height="38" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="800" y="481" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#7f1d1d">B : 2</text>
  <rect x="897" y="461" width="86" height="38" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="940" y="481" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#7f1d1d">R : 2</text>

  <text x="352" y="130" font-size="14" font-weight="bold" fill="#2563eb">0</text>
  <text x="602" y="130" font-size="14" font-weight="bold" fill="#2563eb">1</text>
  <text x="622" y="264" font-size="14" font-weight="bold" fill="#2563eb">0</text>
  <text x="818" y="264" font-size="14" font-weight="bold" fill="#2563eb">1</text>
  <text x="500" y="410" font-size="14" font-weight="bold" fill="#2563eb">0</text>
  <text x="612" y="410" font-size="14" font-weight="bold" fill="#2563eb">1</text>
  <text x="818" y="410" font-size="14" font-weight="bold" fill="#2563eb">0</text>
  <text x="926" y="410" font-size="14" font-weight="bold" fill="#2563eb">1</text>

  <text x="480" y="524" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">100</text>
  <text x="640" y="524" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">101</text>
  <text x="800" y="524" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">110</text>
  <text x="940" y="524" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">111</text>
  <text x="200" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">0</text>

  <line x1="40" y1="556" x2="960" y2="556" stroke="#cbd5e1" stroke-width="1"/>

  <text x="40" y="588" font-size="13" font-weight="bold" fill="#0f172a">两条性质一眼可见</text>
  <text x="40" y="612" font-size="13" fill="#334155">① 频率越高，离根越近、码越短：A(5) 只占 1 位，而频率 1 的 C/D 占了 3 位。</text>
  <text x="40" y="634" font-size="13" fill="#334155">② 所有字符都只在**叶子**上：任何一条码都不是另一条的前缀，所以解码不需要分隔符。</text>
</svg>
