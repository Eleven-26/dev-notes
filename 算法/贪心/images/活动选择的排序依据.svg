<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" rx="12" fill="#f7f9fc"/>
  <text x="40" y="46" font-size="24" font-weight="bold" fill="#1f2937">活动选择：同一组输入，只有「按结束时间」选出最优</text>
  <text x="40" y="78" font-size="15" fill="#4b5563">5 个活动，精确最优 = 3 个；下方三条结果轨道与输入画在同一条时间轴上</text>

  <!-- 时间轴 -->
  <line x1="250" y1="425" x2="930" y2="425" stroke="#9ca3af" stroke-width="1.5"/>
  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <line x1="250" y1="425" x2="250" y2="432" stroke="#9ca3af"/>
    <text x="250" y="450">0</text>
    <line x1="302.3" y1="425" x2="302.3" y2="432" stroke="#9ca3af"/>
    <text x="302.3" y="450">1</text>
    <line x1="406.9" y1="425" x2="406.9" y2="432" stroke="#9ca3af"/>
    <text x="406.9" y="450">3</text>
    <line x1="459.2" y1="425" x2="459.2" y2="432" stroke="#9ca3af"/>
    <text x="459.2" y="450">4</text>
    <line x1="511.5" y1="425" x2="511.5" y2="432" stroke="#9ca3af"/>
    <text x="511.5" y="450">5</text>
    <line x1="668.5" y1="425" x2="668.5" y2="432" stroke="#9ca3af"/>
    <text x="668.5" y="450">8</text>
    <line x1="877.7" y1="425" x2="877.7" y2="432" stroke="#9ca3af"/>
    <text x="877.7" y="450">12</text>
    <line x1="930" y1="425" x2="930" y2="432" stroke="#9ca3af"/>
    <text x="930" y="450">13</text>
  </g>
  <text x="590" y="470" font-size="12" fill="#6b7280" text-anchor="middle">时间</text>

  <!-- 输入：5 个活动 -->
  <g>
    <text x="238" y="122" font-size="13" fill="#374151" text-anchor="end">活动 1</text>
    <rect x="250" y="106" width="680" height="22" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="240" y="152" font-size="13" fill="#374151" text-anchor="end">活动 2</text>
    <rect x="302.3" y="136" width="156.9" height="22" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="240" y="182" font-size="13" fill="#374151" text-anchor="end">活动 3</text>
    <rect x="459.2" y="166" width="209.2" height="22" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="240" y="212" font-size="13" fill="#374151" text-anchor="end">活动 4</text>
    <rect x="668.5" y="196" width="209.2" height="22" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="240" y="242" font-size="13" fill="#374151" text-anchor="end">活动 5</text>
    <rect x="406.9" y="226" width="104.6" height="22" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  </g>

  <!-- 结果 A：按结束时间 -->
  <text x="238" y="286" font-size="14" font-weight="bold" fill="#166534" text-anchor="end">按结束时间</text>
  <rect x="302.3" y="266" width="156.9" height="26" rx="5" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="459.2" y="266" width="209.2" height="26" rx="5" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="668.5" y="266" width="209.2" height="26" rx="5" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
  <text x="940" y="284" font-size="14" font-weight="bold" fill="#166534">3 个（最优）</text>

  <!-- 结果 B：按开始时间 -->
  <text x="238" y="336" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="end">按开始时间</text>
  <rect x="250" y="316" width="680" height="26" rx="5" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5"/>
  <text x="940" y="334" font-size="14" font-weight="bold" fill="#991b1b">1 个（次优）</text>

  <!-- 结果 C：按持续时长 -->
  <text x="238" y="386" font-size="14" font-weight="bold" fill="#9a3412" text-anchor="end">按持续时长</text>
  <rect x="406.9" y="366" width="104.6" height="26" rx="5" fill="#fdba74" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="668.5" y="366" width="209.2" height="26" rx="5" fill="#fdba74" stroke="#ea580c" stroke-width="1.5"/>
  <text x="940" y="384" font-size="14" font-weight="bold" fill="#9a3412">2 个（次优）</text>

  <!-- 说明 -->
  <text x="40" y="98" font-size="13" fill="#6b7280">输入</text>
  <text x="40" y="284" font-size="13" fill="#6b7280">贪心结果</text>
  <text x="40" y="450" font-size="13" fill="#374151">活动 1 独占 [0,13)，按开始时间排序会先抓它；活动 5 时长最短，按持续时长排序会先抓它</text>
  <text x="40" y="490" font-size="13" fill="#374151">两者都把「2、3、4 三个互不冲突的活动」挡在门外 —— 只有按结束时间能保住它们</text>
</svg>
