<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">tails 里存的不是答案序列 —— LIS 最常见的误读</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">输入 a = [3, 4, 5, 1]：tails 的长度是对的（3），但 tails 本身拼不回真正的子序列</text>
  <text x="60" y="106" font-size="14" font-weight="bold" fill="#0f172a">原序列（框下是下标）</text>
  <rect x="60" y="120" width="66" height="46" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="93" y="143" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#1e293b">3</text>
  <text x="93" y="186" text-anchor="middle" font-size="11.5" fill="#64748b">下标 0</text>
  <rect x="142" y="120" width="66" height="46" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="175" y="143" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#1e293b">4</text>
  <text x="175" y="186" text-anchor="middle" font-size="11.5" fill="#64748b">下标 1</text>
  <rect x="224" y="120" width="66" height="46" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="257" y="143" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#1e293b">5</text>
  <text x="257" y="186" text-anchor="middle" font-size="11.5" fill="#64748b">下标 2</text>
  <rect x="306" y="120" width="66" height="46" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
  <text x="339" y="143" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#7f1d1d">1</text>
  <text x="339" y="186" text-anchor="middle" font-size="11.5" fill="#64748b">下标 3</text>
  <text x="500" y="106" font-size="14" font-weight="bold" fill="#0f172a">每读一个元素，tails 的变化</text>
  <text x="500" y="138" font-size="13" fill="#334155">a=3 →</text>
  <rect x="570" y="122" width="46" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="593" y="135" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">3</text>
  <text x="634" y="139" font-size="12" fill="#64748b">追加</text>
  <text x="500" y="178" font-size="13" fill="#334155">a=4 →</text>
  <rect x="570" y="162" width="46" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="593" y="175" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">3</text>
  <rect x="622" y="162" width="46" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="645" y="175" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">4</text>
  <text x="686" y="179" font-size="12" fill="#64748b">追加</text>
  <text x="500" y="218" font-size="13" fill="#334155">a=5 →</text>
  <rect x="570" y="202" width="46" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="593" y="215" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">3</text>
  <rect x="622" y="202" width="46" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="645" y="215" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">4</text>
  <rect x="674" y="202" width="46" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="697" y="215" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">5</text>
  <text x="738" y="219" font-size="12" fill="#64748b">追加</text>
  <text x="500" y="258" font-size="13" fill="#334155">a=1 →</text>
  <rect x="570" y="242" width="46" height="26" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="593" y="255" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#7f1d1d">1</text>
  <rect x="622" y="242" width="46" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="645" y="255" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">4</text>
  <rect x="674" y="242" width="46" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="697" y="255" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">5</text>
  <text x="738" y="259" font-size="12" fill="#64748b">替换 3</text>
  <rect x="60" y="300" width="440" height="200" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="80" y="330" font-size="15" font-weight="bold" fill="#7f1d1d">tails 终值 = [1, 4, 5]</text>
  <g font-size="12.5" fill="#1e293b">
    <text x="80" y="358">长度 3 与真正的 LIS 长度一样，</text>
    <text x="80" y="380">但把它当答案就错了：</text>
    <text x="80" y="410" font-weight="bold" fill="#dc2626">在原序列里，1 排在 4 和 5 的后面。</text>
    <text x="80" y="432">而 [1, 4, 5] 却要求 1 在最前面 ——</text>
    <text x="80" y="454">顺序对不上，所以它根本不是子序列。</text>
    <text x="80" y="482" fill="#475569">实测：isSubsequence([1,4,5], a) = false</text>
  </g>
  <rect x="520" y="300" width="420" height="200" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="540" y="330" font-size="15" font-weight="bold" fill="#14532d">真正的 LIS = [3, 4, 5]</text>
  <g font-size="12.5" fill="#1e293b">
    <text x="540" y="358">在原序列里的位置是 0、1、2，</text>
    <text x="540" y="380">严格递增，值也严格递增。</text>
    <text x="540" y="410" font-weight="bold" fill="#15803d">要还原它，得额外记一列「前驱下标」：</text>
    <text x="540" y="432">替换 tails[pos] 时，把 tailsIdx[pos]</text>
    <text x="540" y="454">一起改掉；最后从末尾下标沿前驱回走。</text>
    <text x="540" y="482" fill="#475569">实测：按前驱回溯确实得到 [3 4 5]</text>
  </g>
  <line x1="30" y1="530" x2="970" y2="530" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="556" font-size="13" fill="#334155">tails[k] 的含义是「长度为 k+1 的递增子序列，末尾元素最小能是多少」—— 它只压低下界，不记录这些元素长在哪儿。</text>
  <text x="30" y="582" font-size="13" fill="#334155">所以 tails 只能回答「最长有多长」；要回答「最长的那条是谁」，必须另存前驱下标（或改用 O(n^2) 的 dp 表回溯）。</text>
  <text x="30" y="606" font-size="12" fill="#94a3b8">（图：本机无法栅格化 SVG，需要 PNG 请自行导出，建议浅色底）</text>
</svg>
