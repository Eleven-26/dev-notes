  <text x="60" y="128" font-size="12" fill="#64748b">行 = s 的前缀</text>
  <text x="153" y="128" font-size="12" fill="#64748b">列 = t 的前缀（ε 表示空前缀）</text>
  <polyline points="525,455 525,413 463,371 463,329 401,287 339,287 277,245 215,245 153,203" fill="none" stroke="#ea580c" stroke-width="4" stroke-opacity="0.75" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="587" cy="413" r="5" fill="#ea580c"/>
  <circle cx="153" cy="203" r="5" fill="#16a34a"/>
  <rect x="600" y="110" width="370" height="330" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="620" y="142" font-size="15" font-weight="bold" fill="#7c2d12">回溯规则（从右下角出发）</text>
  <g font-size="12.5" fill="#1e293b">
    <text x="620" y="172">s[i] == t[j] → 取走该字符</text>
    <text x="636" y="192">斜着退到 (i-1, j-1)</text>
    <text x="620" y="220">否则 → 往 dp[i-1][j] 与</text>
    <text x="636" y="240">dp[i][j-1] 里大的方向退一格</text>
    <text x="636" y="260" fill="#dc2626">（相等时向上，这是一条约定）</text>
    <text x="620" y="292" font-weight="bold">本例走过的 9 步：</text>
    <text x="620" y="314">(7,6) 上一格 → (6,6) 取 A</text>
    <text x="620" y="334">(5,5) 上一格 → (4,5) 取 B</text>
    <text x="620" y="354">(3,4) 左一格 → (3,3) 取 C</text>
    <text x="620" y="374">(2,2) 左一格 → (2,1) 取 B</text>
    <text x="620" y="394">(1,0) 收工（j 到 0）</text>
    <text x="620" y="424" font-weight="bold" fill="#166534">倒着记下 ABCB，反转得 BCBA</text>
  </g>
  <rect x="600" y="456" width="370" height="150" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="620" y="486" font-size="15" font-weight="bold" fill="#14532d">右下角那格就是答案</text>
  <g font-size="12.5" fill="#1e293b">
    <text x="620" y="514">dp[7][6] = 4 → LCS 长度 = 4</text>
    <text x="620" y="536">回溯得到的串 = BCBA</text>
    <text x="620" y="558">它在 s 里的位置：2 3 4 6</text>
    <text x="620" y="580">它在 t 里的位置：1 3 5 6</text>
    <text x="620" y="600" fill="#475569">两组位置都严格递增 → 确实是公共子序列</text>
  </g>
  <line x1="30" y1="620" x2="970" y2="620" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="644" font-size="13" fill="#334155">橙色格子 = 命中的 4 次转移，橙色折线 = 回溯路径；绿点 = 走到底的终点。表里数字只增不减，正是「无后效性」的样子。</text>
</svg>
