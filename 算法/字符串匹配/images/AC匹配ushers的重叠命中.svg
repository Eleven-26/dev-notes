<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">AC 自动机匹配 ushers：一次扫描，三处命中</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">模式集 {he, she, his, hers}；she 与 he、he 与 hers 在文本上彼此重叠</text>

  <!-- 文本 -->
  <text x="278" y="102" text-anchor="end" font-size="13" font-weight="bold" fill="#0f172a">文本</text>
  <g font-family="Consolas, Courier New, monospace" font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="325" y="102">0</text>
    <text x="395" y="102">1</text>
    <text x="465" y="102">2</text>
    <text x="535" y="102">3</text>
    <text x="605" y="102">4</text>
    <text x="675" y="102">5</text>
  </g>
  <g>
    <rect x="290" y="110" width="70" height="48" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="360" y="110" width="70" height="48" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="430" y="110" width="70" height="48" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="500" y="110" width="70" height="48" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="570" y="110" width="70" height="48" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="640" y="110" width="70" height="48" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <g font-family="Consolas, Courier New, monospace" font-size="26" font-weight="bold" fill="#1e293b" text-anchor="middle">
    <text x="325" y="145">u</text>
    <text x="395" y="145">s</text>
    <text x="465" y="145">h</text>
    <text x="535" y="145">e</text>
    <text x="605" y="145">r</text>
    <text x="675" y="145">s</text>
  </g>

  <!-- she -->
  <text x="278" y="232" text-anchor="end" font-size="13" font-weight="bold" fill="#1d4ed8">she</text>
  <rect x="360" y="204" width="210" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="465" y="232" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a" font-family="Consolas, Courier New, monospace">s h e</text>
  <text x="590" y="232" font-size="12.5" fill="#1d4ed8">@1　扫描到 i=3 时在节点 5 输出</text>

  <!-- he -->
  <text x="278" y="302" text-anchor="end" font-size="13" font-weight="bold" fill="#7c3aed">he</text>
  <rect x="430" y="274" width="140" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="302" text-anchor="middle" font-size="18" font-weight="bold" fill="#5b21b6" font-family="Consolas, Courier New, monospace">h e</text>
  <text x="590" y="302" font-size="12.5" fill="#7c3aed">@2　由 fail[5] = 2 顺带输出（重叠命中）</text>

  <!-- hers -->
  <text x="278" y="372" text-anchor="end" font-size="13" font-weight="bold" fill="#15803d">hers</text>
  <rect x="430" y="344" width="280" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="570" y="372" text-anchor="middle" font-size="18" font-weight="bold" fill="#166534" font-family="Consolas, Courier New, monospace">h e r s</text>
  <text x="730" y="372" font-size="12.5" fill="#15803d">@2　扫描到 i=5 时在节点 9 输出</text>

  <!-- 结论 -->
  <rect x="60" y="410" width="880" height="128" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="84" y="442" font-size="14" font-weight="bold" fill="#0f172a">共 3 处命中，其中 3 处彼此重叠</text>
  <text x="84" y="472" font-size="13" fill="#334155">she 覆盖 [1,3]，he 覆盖 [2,3]（完全落在 she 内部），hers 覆盖 [2,5]（与 he 共用起点 2）</text>
  <text x="84" y="500" font-size="13" fill="#334155">输出不止来自当前节点：到达节点后还要沿 fail 链回溯，把链上所有词尾一并报出</text>
  <text x="84" y="526" font-size="13" fill="#64748b">本机实测：转移 6 次、goto 时 fail 跳转 1 次、输出链检查 8 次，命中 3 处（she@1、he@2、hers@2）</text>
</svg>
