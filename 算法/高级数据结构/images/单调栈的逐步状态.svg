<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">单调栈的逐步状态（每日温度，输入 73 74 75 71 69 72 76 73）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">栈里存「还没找到答案的下标」，从栈底到栈顶温度单调递减；新一天上来时把所有更冷的栈顶弹出并结算</text>

  <g font-family="Consolas, Courier New, monospace" font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="95" y="98">0</text>
    <text x="190" y="98">1</text>
    <text x="285" y="98">2</text>
    <text x="380" y="98">3</text>
    <text x="475" y="98">4</text>
    <text x="570" y="98">5</text>
    <text x="665" y="98">6</text>
    <text x="760" y="98">7</text>
  </g>
  <g fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5">
    <rect x="64" y="106" width="62" height="42"/>
    <rect x="159" y="106" width="62" height="42"/>
    <rect x="254" y="106" width="62" height="42"/>
    <rect x="349" y="106" width="62" height="42"/>
    <rect x="444" y="106" width="62" height="42"/>
    <rect x="539" y="106" width="62" height="42"/>
    <rect x="634" y="106" width="62" height="42"/>
    <rect x="729" y="106" width="62" height="42"/>
  </g>
  <g font-family="Consolas, Courier New, monospace" font-size="15" fill="#1e3a8a" text-anchor="middle">
    <text x="95" y="133">73</text>
    <text x="190" y="133">74</text>
    <text x="285" y="133">75</text>
    <text x="380" y="133">71</text>
    <text x="475" y="133">69</text>
    <text x="570" y="133">72</text>
    <text x="665" y="133">76</text>
    <text x="760" y="133">73</text>
  </g>
  <text x="820" y="133" font-size="12" fill="#94a3b8">温度序列</text>

  <line x1="40" y1="168" x2="960" y2="168" stroke="#cbd5e1" stroke-width="1"/>

  <g font-family="Consolas, Courier New, monospace" font-size="13">
    <text x="40" y="196" fill="#64748b">下标</text>
    <text x="100" y="196" fill="#64748b">温度</text>
    <text x="172" y="196" fill="#64748b">入栈前栈（下标:温度）</text>
    <text x="470" y="196" fill="#64748b">本步结算的下标 -&gt; 答案</text>
    <text x="720" y="196" fill="#64748b">入栈后栈</text>
    <line x1="40" y1="208" x2="960" y2="208" stroke="#e2e8f0" stroke-width="1"/>

    <text x="40" y="238" fill="#334155">0</text>
    <text x="100" y="238" fill="#334155">73</text>
    <text x="172" y="238" fill="#64748b">[]</text>
    <text x="470" y="238" fill="#94a3b8">-</text>
    <text x="720" y="238" fill="#334155">[0:73]</text>

    <text x="40" y="268" fill="#334155">1</text>
    <text x="100" y="268" fill="#334155">74</text>
    <text x="172" y="268" fill="#64748b">[0:73]</text>
    <text x="470" y="268" fill="#b45309">0 -&gt; 1</text>
    <text x="720" y="268" fill="#334155">[1:74]</text>

    <text x="40" y="298" fill="#334155">2</text>
    <text x="100" y="298" fill="#334155">75</text>
    <text x="172" y="298" fill="#64748b">[1:74]</text>
    <text x="470" y="298" fill="#b45309">1 -&gt; 1</text>
    <text x="720" y="298" fill="#334155">[2:75]</text>

    <text x="40" y="328" fill="#334155">3</text>
    <text x="100" y="328" fill="#334155">71</text>
    <text x="172" y="328" fill="#64748b">[2:75]</text>
    <text x="470" y="328" fill="#94a3b8">-</text>
    <text x="720" y="328" fill="#334155">[2:75 3:71]</text>

    <text x="40" y="358" fill="#334155">4</text>
    <text x="100" y="358" fill="#334155">69</text>
    <text x="172" y="358" fill="#64748b">[2:75 3:71]</text>
    <text x="470" y="358" fill="#94a3b8">-</text>
    <text x="720" y="358" fill="#334155">[2:75 3:71 4:69]</text>

    <text x="40" y="388" fill="#dc2626" font-weight="bold">5</text>
    <text x="100" y="388" fill="#dc2626" font-weight="bold">72</text>
    <text x="172" y="388" fill="#64748b">[2:75 3:71 4:69]</text>
    <text x="470" y="388" fill="#dc2626" font-weight="bold">4 -&gt; 1 3 -&gt; 2</text>
    <text x="720" y="388" fill="#334155">[2:75 5:72]</text>

    <text x="40" y="418" fill="#dc2626" font-weight="bold">6</text>
    <text x="100" y="418" fill="#dc2626" font-weight="bold">76</text>
    <text x="172" y="418" fill="#64748b">[2:75 5:72]</text>
    <text x="470" y="418" fill="#dc2626" font-weight="bold">5 -&gt; 1 2 -&gt; 4</text>
    <text x="720" y="418" fill="#334155">[6:76]</text>

    <text x="40" y="448" fill="#334155">7</text>
    <text x="100" y="448" fill="#334155">73</text>
    <text x="172" y="448" fill="#64748b">[6:76]</text>
    <text x="470" y="448" fill="#94a3b8">-</text>
    <text x="720" y="448" fill="#334155">[6:76 7:73]</text>
  </g>

  <line x1="40" y1="470" x2="960" y2="470" stroke="#cbd5e1" stroke-width="1"/>

  <text x="40" y="500" font-size="14" fill="#334155">答案数组：1 1 4 2 1 1 0 0　（下标 6、7 的 0 表示「后面没有更暖的一天」，语义是「无」）</text>
  <text x="40" y="530" font-size="13" fill="#dc2626">第 5、6 步各一口气弹出两个下标 —— 一次结算一批，这就是 O(n) 摊还的来源。</text>
  <text x="40" y="558" font-size="13" fill="#334155">入栈 n 次、出栈 n 次，总操作数 = 2n：每个元素最多进出栈各一次。</text>
  <text x="40" y="588" font-size="13" fill="#b45309">留在栈里的下标（6:76、7:73）等不到更大的元素，循环结束后应弹空（等价于柱状图里的末尾哨兵 0）。</text>
  <text x="40" y="618" font-size="12" fill="#94a3b8">（图：本机无法栅格化 SVG，需要 PNG 请自行导出，建议浅色底）</text>
</svg>
