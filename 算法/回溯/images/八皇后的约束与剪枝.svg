<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1000" height="760" fill="#ffffff" /><text x="500" y="36" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">八皇后的三个冲突集合与剪枝强度（n = 8）</text><text x="500" y="62" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">逐行放置：每行一个皇后，只枚举「不与已放皇后冲突」的列；冲突判定只查列、主对角、副对角三个集合</text><text x="70" y="106" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">n = 8 的一个解：row → col = [0 4 7 5 2 6 1 3]</text><rect x="70" y="140" width="368" height="368" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" /><rect x="162" y="140" width="46" height="46" fill="#fecaca" opacity="0.75" /><rect x="208" y="186" width="46" height="46" fill="#fecaca" opacity="0.75" /><rect x="392" y="186" width="46" height="46" fill="#bfdbfe" opacity="0.75" /><rect x="254" y="232" width="46" height="46" fill="#fecaca" opacity="0.75" /><rect x="346" y="232" width="46" height="46" fill="#bfdbfe" opacity="0.75" /><rect x="300" y="278" width="46" height="46" fill="#fecaca" opacity="0.75" /><rect x="300" y="278" width="46" height="46" fill="#bfdbfe" opacity="0.75" /><rect x="254" y="324" width="46" height="46" fill="#bfdbfe" opacity="0.75" /><rect x="346" y="324" width="46" height="46" fill="#fecaca" opacity="0.75" /><rect x="208" y="370" width="46" height="46" fill="#bfdbfe" opacity="0.75" /><rect x="392" y="370" width="46" height="46" fill="#fecaca" opacity="0.75" /><rect x="162" y="416" width="46" height="46" fill="#bfdbfe" opacity="0.75" /><rect x="116" y="462" width="46" height="46" fill="#bfdbfe" opacity="0.75" /><line x1="70" y1="140" x2="70" y2="508" stroke="#cbd5e1" stroke-width="1" /><line x1="70" y1="140" x2="438" y2="140" stroke="#cbd5e1" stroke-width="1" /><line x1="116" y1="140" x2="116" y2="508" stroke="#cbd5e1" stroke-width="1" /><line x1="70" y1="186" x2="438" y2="186" stroke="#cbd5e1" stroke-width="1" /><line x1="162" y1="140" x2="162" y2="508" stroke="#cbd5e1" stroke-width="1" /><line x1="70" y1="232" x2="438" y2="232" stroke="#cbd5e1" stroke-width="1" /><line x1="208" y1="140" x2="208" y2="508" stroke="#cbd5e1" stroke-width="1" /><line x1="70" y1="278" x2="438" y2="278" stroke="#cbd5e1" stroke-width="1" /><line x1="254" y1="140" x2="254" y2="508" stroke="#cbd5e1" stroke-width="1" /><line x1="70" y1="324" x2="438" y2="324" stroke="#cbd5e1" stroke-width="1" /><line x1="300" y1="140" x2="300" y2="508" stroke="#cbd5e1" stroke-width="1" /><line x1="70" y1="370" x2="438" y2="370" stroke="#cbd5e1" stroke-width="1" /><line x1="346" y1="140" x2="346" y2="508" stroke="#cbd5e1" stroke-width="1" /><line x1="70" y1="416" x2="438" y2="416" stroke="#cbd5e1" stroke-width="1" /><line x1="392" y1="140" x2="392" y2="508" stroke="#cbd5e1" stroke-width="1" /><line x1="70" y1="462" x2="438" y2="462" stroke="#cbd5e1" stroke-width="1" /><line x1="438" y1="140" x2="438" y2="508" stroke="#cbd5e1" stroke-width="1" /><line x1="70" y1="508" x2="438" y2="508" stroke="#cbd5e1" stroke-width="1" /><rect x="70" y="140" width="368" height="368" fill="none" stroke="#334155" stroke-width="2" /><text x="56" y="168.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">0</text><text x="93.0" y="134" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">0</text><text x="56" y="214.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">1</text><text x="139.0" y="134" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">1</text><text x="56" y="260.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">2</text><text x="185.0" y="134" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">2</text><text x="56" y="306.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">3</text><text x="231.0" y="134" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">3</text><text x="56" y="352.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">4</text><text x="277.0" y="134" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">4</text><text x="56" y="398.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">5</text><text x="323.0" y="134" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">5</text><text x="56" y="444.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">6</text><text x="369.0" y="134" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">6</text><text x="56" y="490.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">7</text><text x="415.0" y="134" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">7</text><circle cx="93.0" cy="163.0" r="15" fill="#1e3a8a" /><text x="93.0" y="168.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Q</text><circle cx="277.0" cy="209.0" r="15" fill="#1e3a8a" /><text x="277.0" y="214.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Q</text><circle cx="415.0" cy="255.0" r="15" fill="#1e3a8a" /><text x="415.0" y="260.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Q</text><circle cx="323.0" cy="301.0" r="15" fill="#1e3a8a" /><text x="323.0" y="306.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Q</text><circle cx="185.0" cy="347.0" r="15" fill="#1e3a8a" /><text x="185.0" y="352.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Q</text><circle cx="369.0" cy="393.0" r="15" fill="#1e3a8a" /><text x="369.0" y="398.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Q</text><circle cx="139.0" cy="439.0" r="15" fill="#1e3a8a" /><text x="139.0" y="444.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Q</text><circle cx="231.0" cy="485.0" r="15" fill="#1e3a8a" /><text x="231.0" y="490.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Q</text><circle cx="323.0" cy="301.0" r="19" fill="none" stroke="#dc2626" stroke-width="2.5" /><rect x="70" y="530" width="16" height="16" fill="#fecaca" opacity="0.75" /><text x="94" y="542" font-size="12" fill="#7f1d1d" text-anchor="start" font-weight="normal">主对角：r − c 恒定（此格 r−c = −2）</text><rect x="70" y="552" width="16" height="16" fill="#bfdbfe" opacity="0.75" /><text x="94" y="564" font-size="12" fill="#1e3a8a" text-anchor="start" font-weight="normal">副对角：r + c 恒定（此格 r + c = 8）</text><text x="70" y="594" font-size="12" fill="#16a34a" text-anchor="start" font-weight="normal">两条对角线上都只有这一个皇后 → 该放置合法</text><text x="70" y="616" font-size="12" fill="#b45309" text-anchor="start" font-weight="normal">⚠️ r − c 会取到负数，必须加偏移 n−1 = 7 后再当数组下标</text><text x="500" y="106" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">n = 8 搜索节点数：剪枝强度对照（横轴取 log10 刻度）</text><text x="500" y="160" font-size="12.5" fill="#334155" text-anchor="start" font-weight="normal">① 全枚举（只在叶子校验）</text><rect x="560" y="168" width="288.0" height="24" fill="#dc2626" rx="4" opacity="0.85" /><text x="856.0" y="185" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="bold">19,173,961</text><text x="500" y="222" font-size="12.5" fill="#334155" text-anchor="start" font-weight="normal">② 只剪列（叶子再校验对角）</text><rect x="560" y="230" width="199.3030361154003" height="24" fill="#d97706" rx="4" opacity="0.85" /><text x="767.3030361154003" y="247" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="bold">109,601</text><text x="500" y="284" font-size="12.5" fill="#334155" text-anchor="start" font-weight="normal">③ 列 + 两条对角线（边放边剪）</text><rect x="560" y="292" width="131.02419771840613" height="24" fill="#16a34a" rx="4" opacity="0.85" /><text x="699.0241977184062" y="309" font-size="12.5" fill="#16a34a" text-anchor="start" font-weight="bold">2,057</text><text x="500" y="350" font-size="12.5" fill="#16a34a" text-anchor="start" font-weight="normal">三档解数都是 92：剪枝只影响「走多少路」，不影响「找到几个解」</text><text x="500" y="374" font-size="12.5" fill="#334155" text-anchor="start" font-weight="normal">节点比：①/③ = 9321 倍，②/③ = 53 倍</text><text x="500" y="398" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="normal">⚠️ 全枚举那一档横条在 log 刻度下只有 3.3/7.3 的长度，</text><text x="500" y="416" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="normal">   线性刻度下它会比另两条长几百倍，画不下 —— 所以要取对数</text><text x="40" y="714" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="normal">本图数字与本机实测逐项一致（Go 1.26.5 / JDK 1.8.0_321，.workbuddy/tmp/backtrack_lab）。</text><text x="40" y="734" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="normal">⚠️ 本机无法栅格化 SVG，需要 PNG 时请自行导出（浅色底）。</text></svg>