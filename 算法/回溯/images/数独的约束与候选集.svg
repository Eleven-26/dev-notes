anchor="middle" font-weight="bold">1</text><rect x="910" y="228" width="23" height="23" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1" rx="3" /><text x="921.5" y="245" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="bold">0</text><rect x="935" y="228" width="23" height="23" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1" rx="3" /><text x="946.5" y="245" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="bold">0</text><text x="520" y="300" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">并集 row|c|box</text><rect x="735" y="282" width="23" height="23" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="3" /><text x="746.5" y="299" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">1</text><rect x="760" y="282" width="23" height="23" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="3" /><text x="771.5" y="299" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">1</text><rect x="785" y="282" width="23" height="23" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="3" /><text x="796.5" y="299" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">1</text><rect x="810" y="282" width="23" height="23" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="3" /><text x="821.5" y="299" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">1</text><rect x="835" y="282" width="23" height="23" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="3" /><text x="846.5" y="299" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">1</text><rect x="860" y="282" width="23" height="23" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="3" /><text x="871.5" y="299" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">1</text><rect x="885" y="282" width="23" height="23" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="3" /><text x="896.5" y="299" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">1</text><rect x="910" y="282" width="23" height="23" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="3" /><text x="921.5" y="299" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="bold">0</text><rect x="935" y="282" width="23" height="23" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="3" /><text x="946.5" y="299" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="bold">0</text><text x="520" y="354" font-size="11.5" fill="#94a3b8" text-anchor="start" font-weight="normal">位序：从右往左依次是 v=1..9（bit 0..8）；红字 1 = 该数字已被占用</text><text x="520" y="390" font-size="13.5" fill="#dc2626" text-anchor="start" font-weight="bold">候选 = ~(并集) &amp; 0x1FF</text><text x="520" y="418" font-size="13.5" fill="#dc2626" text-anchor="start" font-weight="bold">= 000000011 → 候选 {1, 2}，共 2 个</text><text x="520" y="470" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">&amp; 0x1FF 是为了把高位的 1 全部截掉 ——</text><text x="520" y="490" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">只保留低 9 位（数字 1..9）。</text><text x="520" y="518" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">取值时用 v 从 1 到 9，测 bit = 1 &lt;&lt; (v-1) 是否在并集里；</text><text x="520" y="538" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">不在就是候选（不需要遍历 27 个格子）。</text><text x="40" y="674" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="normal">本图数字与本机实测逐项一致（Go 1.26.5 / JDK 1.8.0_321，.workbuddy/tmp/backtrack_lab）。</text><text x="40" y="694" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="normal">⚠️ 本机无法栅格化 SVG，需要 PNG 时请自行导出（浅色底）。</text></svg>