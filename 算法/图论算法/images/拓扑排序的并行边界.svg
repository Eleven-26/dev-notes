<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Kahn 拓扑排序：每一轮「入度为 0 的集合」就是一条并行边界</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">图（6 点 DAG）：5→{2,0}　4→{0,1}　2→{3}　3→{1}；每层内没有依赖，可并发执行，跨层必须等</text>

  <rect x="60" y="88" width="180" height="440" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <rect x="330" y="88" width="180" height="440" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="600" y="88" width="160" height="440" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="810" y="88" width="150" height="440" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>

  <text x="150" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">第 1 轮　[4 5]</text>
  <text x="420" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">第 2 轮　[2 0]</text>
  <text x="680" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">第 3 轮　[3]</text>
  <text x="885" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#a16207">第 4 轮　[1]</text>

  <path d="M 166 190 C 260 150 320 130 372 122" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ag)"/>
  <path d="M 168 200 C 420 240 700 232 800 224" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ag)"/>
  <path d="M 160 330 C 250 300 320 180 372 136" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ag)"/>
  <path d="M 166 352 C 250 356 320 340 372 330" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/>
  <path d="M 436 328 C 520 320 570 260 618 236" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/>
  <path d="M 676 222 L 826 222" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/>

  <circle cx="150" cy="190" r="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="150" y="190" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">4</text>
  <circle cx="150" cy="348" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="348" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e3a8a">5</text>

  <circle cx="400" cy="120" r="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="400" y="120" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">0</text>
  <circle cx="400" cy="330" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e3a8a">2</text>

  <circle cx="650" cy="228" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="650" y="228" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e3a8a">3</text>

  <circle cx="866" cy="222" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="866" y="222" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e3a8a">1</text>

  <line x1="40" y1="556" x2="960" y2="556" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="586" font-size="13.5" fill="#0f172a">每层宽度 = [2 2 1 1]　⇒　并行度受最宽的层限制；蓝色粗线是其中一条最长链 5→2→3→1（关键路径，4 个节点）</text>
  <text x="40" y="610" font-size="13" fill="#64748b">⚠️ 若每轮只取队首，拓扑序依然合法，但把同层的并发机会白白串行掉了 —— 前三轮恰好都只有一个点时才看不出差别</text>
</svg>
