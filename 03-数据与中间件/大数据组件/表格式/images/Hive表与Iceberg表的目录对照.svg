<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 421" width="1000" height="421" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="421" fill="#ffffff"/>
<title>Hive 表与 Iceberg 表的目录对照，元数据一个在表外一个在表内</title>
<desc>左边是 Hive 表目录，只有 _SUCCESS 与按分区摆放的 parquet 文件，元数据存放在表外的 HMS 里。右边是 Iceberg 表目录，metadata 子目录里带 v4.metadata.json、manifest list 与 manifest 三类文件，data 下才是 parquet。HMS 对 Iceberg 表只记表名到当前 metadata.json 的路径。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g transform="scale(1.470588)">

<text x="40" y="42" font-family="var(--font-sans)" font-size="12" fill="#B4B2A9" dominant-baseline="central">Hive 表目录</text>
<rect x="40" y="54" width="280" height="150" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="56" y="78" font-family="var(--font-mono)" font-size="11" fill="#F1EFE8" dominant-baseline="central">_SUCCESS</text>
<text x="56" y="102" font-family="var(--font-mono)" font-size="11" fill="#F1EFE8" dominant-baseline="central">dt=2026-10-23/</text>
<text x="72" y="120" font-family="var(--font-mono)" font-size="11" fill="#D3D1C7" dominant-baseline="central">part-00000-*.parquet</text>
<text x="56" y="144" font-family="var(--font-mono)" font-size="11" fill="#F1EFE8" dominant-baseline="central">dt=2026-10-24/</text>
<text x="72" y="162" font-family="var(--font-mono)" font-size="11" fill="#D3D1C7" dominant-baseline="central">part-00000-*.parquet</text>
<text x="56" y="188" font-family="var(--font-mono)" font-size="11" fill="#FAC775" dominant-baseline="central">没有任何元数据文件</text>

<text x="360" y="42" font-family="var(--font-sans)" font-size="12" fill="#9FE1CB" dominant-baseline="central">Iceberg 表目录</text>
<rect x="360" y="54" width="280" height="150" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="376" y="76" font-family="var(--font-mono)" font-size="11" fill="#E1F5EE" dominant-baseline="central">metadata/</text>
<text x="392" y="94" font-family="var(--font-mono)" font-size="11" fill="#9FE1CB" dominant-baseline="central">v4.metadata.json</text>
<text x="392" y="112" font-family="var(--font-mono)" font-size="11" fill="#9FE1CB" dominant-baseline="central">snap-&lt;id&gt;-*.avro  清单列表</text>
<text x="392" y="130" font-family="var(--font-mono)" font-size="11" fill="#9FE1CB" dominant-baseline="central">*-m0.avro        清单</text>
<text x="376" y="156" font-family="var(--font-mono)" font-size="11" fill="#E1F5EE" dominant-baseline="central">data/</text>
<text x="392" y="174" font-family="var(--font-mono)" font-size="11" fill="#9FE1CB" dominant-baseline="central">dt=2026-10-23/*.parquet</text>
<text x="376" y="194" font-family="var(--font-mono)" font-size="11" fill="#FAC775" dominant-baseline="central">元数据自带在表内</text>

<text x="40" y="228" font-family="var(--font-sans)" font-size="12" fill="#B4B2A9" dominant-baseline="central">HMS 里存：表名 → 目录位置 + SerDe + 分区列表</text>
<text x="360" y="228" font-family="var(--font-sans)" font-size="12" fill="#5DCAA5" dominant-baseline="central">HMS 里只存：表名 → v4.metadata.json 的路径</text>

<line x1="40" y1="248" x2="640" y2="248" stroke="#888780" stroke-width="0.5" stroke-dasharray="2 4"/>

<text x="40" y="266" font-family="var(--font-sans)" font-size="12" fill="#FAC775" dominant-baseline="central">后果：Hive 表换引擎要重新登记元数据；Iceberg 表换引擎只要给对路径</text>
</g>
</svg>
