<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <defs>
    <marker id="b1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>

  <rect x="30" y="20" width="940" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="45" font-size="17" fill="#0f172a">时间驱动与逻辑时间驱动</text>
  <text x="46" y="65" font-size="11.5" fill="#475569">编排器与定时器的分水岭不在「能不能定时」，在它记不记得「这是哪一天的数据」</text>

  <rect x="30" y="96" width="460" height="330" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="46" y="122" font-size="13" fill="#334155">时间驱动：只看墙钟</text>
  <text x="46" y="144" font-size="11" fill="#64748b">cron 到点就触发一次动作，动作没有日期属性</text>

  <rect x="44" y="160" width="180" height="64" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="58" y="186" font-size="11.5" fill="#0f172a">02:00 到点了</text>
  <text x="58" y="208" font-size="10.5" fill="#64748b">cron 0 2 星号 星号 星号</text>

  <line x1="228" y1="192" x2="250" y2="192" stroke="#475569" stroke-width="1.5" marker-end="url(#b1)"/>

  <rect x="256" y="160" width="220" height="64" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="270" y="186" font-size="11.5" fill="#0f172a">触发一个动作</text>
  <text x="270" y="208" font-size="10.5" fill="#64748b">发券 / 清缓存 / 对账通知</text>

  <rect x="44" y="250" width="432" height="60" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="58" y="276" font-size="11.5" fill="#b91c1c">重跑 = 再触发一次</text>
  <text x="58" y="298" font-size="10.5" fill="#7f1d1d">跑的单位是「一个动作」，没有「哪一天」可以选</text>

  <rect x="44" y="326" width="432" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="58" y="352" font-size="11.5" fill="#334155">代价：幂等没有地方管</text>
  <text x="58" y="374" font-size="10.5" fill="#64748b">动作重复执行会出事，但「防重复」只能写进业务代码</text>
  <text x="58" y="396" font-size="10.5" fill="#64748b">定时器只负责「调一下」，不负责「调过没」</text>

  <rect x="510" y="96" width="460" height="330" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="526" y="122" font-size="13" fill="#1e40af">逻辑时间驱动：看「哪一天」</text>
  <text x="526" y="144" font-size="11" fill="#1e3a8a">每个逻辑时间一个实例，实例里有整张 DAG</text>

  <rect x="524" y="160" width="102" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="536" y="182" font-size="10.5" fill="#0f172a">10-23</text>
  <rect x="532" y="196" width="86" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="542" y="213" font-size="10" fill="#334155">抽取</text>
  <line x1="575" y1="222" x2="575" y2="232" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="532" y="232" width="86" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="542" y="249" font-size="10" fill="#334155">清洗</text>
  <line x1="575" y1="258" x2="575" y2="268" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="532" y="268" width="86" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="542" y="285" font-size="10" fill="#334155">校验</text>
  <text x="536" y="316" font-size="10" fill="#059669">成功</text>

  <rect x="634" y="160" width="102" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="646" y="182" font-size="10.5" fill="#0f172a">10-24</text>
  <rect x="642" y="196" width="86" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="652" y="213" font-size="10" fill="#334155">抽取</text>
  <line x1="685" y1="222" x2="685" y2="232" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="642" y="232" width="86" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="652" y="249" font-size="10" fill="#334155">清洗</text>
  <line x1="685" y1="258" x2="685" y2="268" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="642" y="268" width="86" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="652" y="285" font-size="10" fill="#334155">校验</text>
  <text x="646" y="316" font-size="10" fill="#059669">成功</text>

  <rect x="744" y="160" width="102" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="756" y="182" font-size="10.5" fill="#0f172a">10-25</text>
  <rect x="752" y="196" width="86" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="762" y="213" font-size="10" fill="#334155">抽取</text>
  <line x1="795" y1="222" x2="795" y2="232" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="752" y="232" width="86" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="762" y="249" font-size="10" fill="#334155">清洗</text>
  <line x1="795" y1="258" x2="795" y2="268" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="752" y="268" width="86" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="762" y="285" font-size="10" fill="#334155">校验</text>
  <text x="756" y="316" font-size="10" fill="#059669">成功</text>

  <rect x="854" y="160" width="102" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="866" y="182" font-size="10.5" fill="#0f172a">10-26</text>
  <rect x="862" y="196" width="86" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="872" y="213" font-size="10" fill="#334155">抽取</text>
  <line x1="905" y1="222" x2="905" y2="232" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="862" y="232" width="86" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="872" y="249" font-size="10" fill="#334155">清洗</text>
  <line x1="905" y1="258" x2="905" y2="268" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="862" y="268" width="86" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="872" y="285" font-size="10" fill="#334155">校验</text>
  <text x="866" y="316" font-size="10" fill="#b45309">等待</text>

  <rect x="524" y="346" width="432" height="64" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="538" y="372" font-size="11.5" fill="#166534">补数 = 按区间批量创建实例</text>
  <text x="538" y="394" font-size="10.5" fill="#14532d">选 10-20 到 10-25，就是给那六天各建一张同样的 DAG</text>

  <rect x="30" y="446" width="940" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="46" y="474" font-size="12.5" fill="#0f172a">三种时间，别混</text>
  <text x="46" y="502" font-size="10.5" fill="#334155">触发时间（wall clock）：实际开始跑的那一刻，2026-10-26 02:00:03 —— 所有工具都有。</text>
  <text x="46" y="526" font-size="10.5" fill="#1e40af">逻辑时间（logical date / nominal time）：这批数据代表哪一段，2026-10-25 —— 只有编排器有。</text>
  <text x="46" y="550" font-size="10.5" fill="#334155">调度周期（schedule interval）：多久触发一次，0 2 星号 星号 星号 —— 两个世界都有。</text>
  <text x="46" y="580" font-size="10.5" fill="#b45309">混淆的代价：02:00 跑「今天」的数据，拿到的是残缺分区；补 20 号却读到了今天的数据。</text>
</svg>
