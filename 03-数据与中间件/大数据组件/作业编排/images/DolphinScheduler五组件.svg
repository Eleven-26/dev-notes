<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <defs>
    <marker id="c1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
    <marker id="c2" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 z" fill="#475569"/></marker>
  </defs>

  <rect x="30" y="20" width="940" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="45" font-size="17" fill="#0f172a">DolphinScheduler 五组件与两层状态</text>
  <text x="46" y="65" font-size="11.5" fill="#475569">谁生成实例、谁执行任务是分开的：左边是调度链，右边是共享设施</text>

  <rect x="56" y="72" width="200" height="18" fill="#ffffff"/>
  <text x="60" y="86" font-size="11" fill="#475569">调度链（一条作业从这里流过）</text>
  <rect x="616" y="72" width="180" height="18" fill="#ffffff"/>
  <text x="620" y="86" font-size="11" fill="#475569">共享设施（所有角色都依赖）</text>

  <rect x="60" y="96" width="320" height="70" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="76" y="124" font-size="12.5" fill="#0f172a">浏览器 / 调用方</text>
  <text x="76" y="146" font-size="11" fill="#64748b">建工作流、点补数、看历史实例</text>

  <rect x="60" y="190" width="320" height="70" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="76" y="218" font-size="12.5" fill="#0f172a">API Server　端口 12345</text>
  <text x="76" y="240" font-size="11" fill="#64748b">界面与接口，所有增删改查入库</text>

  <rect x="60" y="284" width="320" height="70" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="76" y="312" font-size="12.5" fill="#1e40af">Master Server　端口 5678</text>
  <text x="76" y="334" font-size="11" fill="#1e3a8a">按周期生成实例、按依赖分发任务</text>

  <rect x="60" y="378" width="320" height="70" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="76" y="406" font-size="12.5" fill="#166534">Worker Server　端口 1234</text>
  <text x="76" y="428" font-size="11" fill="#14532d">起子进程，或提交引擎作业</text>

  <rect x="60" y="472" width="320" height="70" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="76" y="500" font-size="12.5" fill="#0f172a">任务 = 一个子进程</text>
  <text x="76" y="522" font-size="11" fill="#64748b">Shell / SQL / spark-submit</text>

  <rect x="620" y="190" width="340" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="636" y="218" font-size="12.5" fill="#0f172a">数据库（MySQL / PostgreSQL）</text>
  <text x="636" y="240" font-size="11" fill="#64748b">定义、实例、任务实例、待分发命令</text>

  <rect x="620" y="284" width="340" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="636" y="312" font-size="12.5" fill="#0f172a">注册中心（ZooKeeper）</text>
  <text x="636" y="334" font-size="11" fill="#64748b">Master 与 Worker 注册、Master 选主</text>

  <rect x="620" y="378" width="340" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="636" y="406" font-size="12.5" fill="#0f172a">告警（Alert Server）</text>
  <text x="636" y="428" font-size="11" fill="#64748b">失败与超时通知，挂了任务照跑但没人知道</text>

  <rect x="620" y="472" width="340" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="636" y="500" font-size="12.5" fill="#0f172a">日志（Logger Server）</text>
  <text x="636" y="522" font-size="11" fill="#64748b">界面查日志靠它，日志文件在 Worker 本地</text>

  <line x1="220" y1="168" x2="220" y2="186" stroke="#475569" stroke-width="1.5" marker-end="url(#c1)"/>
  <line x1="220" y1="262" x2="220" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#c1)"/>
  <line x1="220" y1="356" x2="220" y2="374" stroke="#475569" stroke-width="1.5" marker-end="url(#c1)"/>
  <line x1="220" y1="450" x2="220" y2="468" stroke="#475569" stroke-width="1.5" marker-end="url(#c1)"/>

  <line x1="384" y1="225" x2="616" y2="225" stroke="#475569" stroke-width="1.5" marker-end="url(#c1)"/>
  <rect x="446" y="200" width="108" height="20" fill="#ffffff"/>
  <text x="454" y="215" font-size="10.5" fill="#475569">写定义、读实例</text>

  <line x1="384" y1="319" x2="616" y2="319" stroke="#475569" stroke-width="1.5" marker-end="url(#c1)"/>
  <rect x="446" y="294" width="108" height="20" fill="#ffffff"/>
  <text x="454" y="309" font-size="10.5" fill="#475569">注册与选主</text>

  <line x1="384" y1="398" x2="616" y2="410" stroke="#475569" stroke-width="1.5" marker-end="url(#c1)"/>
  <rect x="446" y="380" width="108" height="20" fill="#ffffff"/>
  <text x="454" y="395" font-size="10.5" fill="#475569">失败与超时</text>

  <line x1="384" y1="436" x2="616" y2="496" stroke="#475569" stroke-width="1.5" marker-end="url(#c1)"/>
  <rect x="446" y="456" width="108" height="20" fill="#ffffff"/>
  <text x="454" y="471" font-size="10.5" fill="#475569">写日志</text>

  <rect x="36" y="560" width="932" height="44" fill="#ffffff"/>
  <text x="40" y="578" font-size="10.5" fill="#b45309">挂了会怎样：API 挂了界面打不开，但已排期的实例照跑；Master 挂了「到点不生成实例」；Worker 挂了任务一直等待。</text>
  <text x="40" y="596" font-size="10.5" fill="#b45309">库或注册中心挂了整个集群不可用 —— 所以「工作流没跑」的第一问永远是 Master 在不在，不是 DAG 连得对不对。</text>
</svg>
