<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>
<title>HDFS 的写管道：客户端先问 NameNode，数据沿 DataNode 链逐跳复制，ACK 反向回传</title>
<desc>客户端写一个块之前先向 NameNode 询问放置位置，NameNode 按副本策略给出三个 DataNode。数据包沿 DataNode1 到 DataNode2 到 DataNode3 逐跳传输，每一跳落盘后 ACK 再反向逐跳回传给客户端。任一跳失败时，客户端改向剩余节点重试并把结果报告 NameNode。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g transform="scale(1.470588)">

<rect x="40" y="40" width="190" height="44" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/>
<text x="135" y="56" font-family="var(--font-sans)" font-size="13" fill="#FAEEDA" text-anchor="middle" dominant-baseline="central">NameNode</text>
<text x="135" y="74" font-family="var(--font-sans)" font-size="11" fill="#FAC775" text-anchor="middle" dominant-baseline="central">块 → 位置 + 副本策略</text>

<line x1="95" y1="138" x2="95" y2="88" stroke="#EF9F27" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="106" y="113" font-family="var(--font-sans)" font-size="11" fill="#B4B2A9" dominant-baseline="central">① 这个块放哪</text>

<rect x="40" y="138" width="110" height="52" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="95" y="164" font-family="var(--font-sans)" font-size="13" fill="#F1EFE8" text-anchor="middle" dominant-baseline="central">客户端</text>

<rect x="190" y="138" width="110" height="52" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="245" y="156" font-family="var(--font-sans)" font-size="12" fill="#E1F5EE" text-anchor="middle" dominant-baseline="central">DataNode 1</text>
<text x="245" y="174" font-family="var(--font-sans)" font-size="11" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">落盘后转发</text>

<rect x="340" y="138" width="110" height="52" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="395" y="156" font-family="var(--font-sans)" font-size="12" fill="#E1F5EE" text-anchor="middle" dominant-baseline="central">DataNode 2</text>
<text x="395" y="174" font-family="var(--font-sans)" font-size="11" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">落盘后转发</text>

<rect x="490" y="138" width="110" height="52" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="545" y="156" font-family="var(--font-sans)" font-size="12" fill="#E1F5EE" text-anchor="middle" dominant-baseline="central">DataNode 3</text>
<text x="545" y="174" font-family="var(--font-sans)" font-size="11" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">落盘</text>

<line x1="150" y1="164" x2="188" y2="164" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="300" y1="164" x2="338" y2="164" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="450" y1="164" x2="488" y2="164" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#ar)"/>

<polyline points="545,192 545,214 95,214 95,192" fill="none" stroke="#85B7EB" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="300" y="230" font-family="var(--font-sans)" font-size="11" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">② ACK 反向逐跳回传</text>

<line x1="40" y1="252" x2="640" y2="252" stroke="#888780" stroke-width="0.5" stroke-dasharray="2 4"/>

<text x="40" y="270" font-family="var(--font-sans)" font-size="12" fill="#B4B2A9" dominant-baseline="central">任一跳失败：客户端跳过它、改向剩余节点重试，事后报告 NameNode 补副本</text>
<text x="40" y="293" font-family="var(--font-sans)" font-size="12" fill="#FAC775" dominant-baseline="central">这是链式复制而非并行复制：末尾节点的延迟决定整次写入的完成时间</text>
</g>
</svg>
