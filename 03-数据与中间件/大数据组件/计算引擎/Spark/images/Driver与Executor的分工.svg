<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <rect x="30" y="20" width="940" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="44" font-size="18" fill="#0f172a">driver 与 executor：一个做决策，一个碰数据</text>
  <text x="46" y="62" font-size="11.5" fill="#475569">local 模式下两者在同一 JVM，所以事件日志里只有一个执行器，id 就叫 driver</text>

  <rect x="30" y="92" width="440" height="310" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="46" y="118" font-size="13" font-weight="bold" fill="#1e3a8a">Driver：切 stage、排队、下发 task</text>

  <rect x="46" y="134" width="180" height="52" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="60" y="155" font-size="12" font-weight="bold" fill="#1e293b">SparkContext</text>
  <text x="60" y="174" font-size="10.5" fill="#475569">入口：解析计划、持有 sc</text>

  <rect x="250" y="134" width="200" height="52" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="264" y="155" font-size="12" font-weight="bold" fill="#1e293b">DAGScheduler</text>
  <text x="264" y="174" font-size="10.5" fill="#475569">按 shuffle 边界切 stage</text>

  <rect x="46" y="200" width="180" height="52" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="60" y="221" font-size="12" font-weight="bold" fill="#1e293b">TaskScheduler</text>
  <text x="60" y="240" font-size="10.5" fill="#475569">按本地性与空闲核排队</text>

  <rect x="250" y="200" width="200" height="52" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="264" y="221" font-size="12" font-weight="bold" fill="#1e293b">SchedulerBackend</text>
  <text x="264" y="240" font-size="10.5" fill="#475569">local / YARN / K8s 的适配层</text>

  <text x="46" y="282" font-size="11.5" fill="#1e3a8a">要点：driver 只做决策，不读业务数据</text>
  <text x="46" y="302" font-size="11.5" fill="#b91c1c">driver 挂了，整个 application 一起挂</text>
  <text x="46" y="330" font-size="10.5" fill="#475569">stage 切分与失败重算见「血缘与DAG」</text>
  <text x="46" y="350" font-size="10.5" fill="#475569">task 的输入输出由「Shuffle 机制」接管</text>
  <text x="46" y="378" font-size="10.5" fill="#475569">集群模式（driver 在集群内）本篇未实测</text>

  <rect x="530" y="92" width="440" height="310" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="546" y="118" font-size="13" font-weight="bold" fill="#14532d">Executor：跑 task、缓存 block、上报状态</text>

  <rect x="546" y="134" width="150" height="52" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="560" y="155" font-size="12" font-weight="bold" fill="#1e293b">Task 1</text>
  <text x="560" y="174" font-size="10.5" fill="#475569">一个分区一个 task</text>

  <rect x="712" y="134" width="150" height="52" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="726" y="155" font-size="12" font-weight="bold" fill="#1e293b">Task 2</text>
  <text x="726" y="174" font-size="10.5" fill="#475569">并发上限 = 空闲核数</text>

  <rect x="546" y="200" width="150" height="52" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="560" y="221" font-size="12" font-weight="bold" fill="#1e293b">Task 3</text>
  <text x="560" y="240" font-size="10.5" fill="#475569">多出来的排队等核</text>

  <rect x="712" y="200" width="150" height="52" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="726" y="221" font-size="12" font-weight="bold" fill="#1e293b">task × N</text>
  <text x="726" y="240" font-size="10.5" fill="#475569">N = stage 末 RDD 分区数</text>

  <rect x="546" y="268" width="316" height="52" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="560" y="289" font-size="12" font-weight="bold" fill="#1e293b">BlockManager / 缓存</text>
  <text x="560" y="308" font-size="10.5" fill="#475569">cache 存在这里；它一丢，上游要按血缘重算</text>

  <text x="546" y="342" font-size="11.5" fill="#14532d">要点：挂一个 executor，只重跑它上面的 task</text>
  <text x="546" y="362" font-size="10.5" fill="#475569">本机 local 模式没有独立的 executor 进程</text>
  <text x="546" y="382" font-size="10.5" fill="#475569">实测的执行器只有一个，id = driver</text>

  <line x1="470" y1="200" x2="530" y2="200" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a1)"/>
  <line x1="530" y1="250" x2="470" y2="250" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a2)"/>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/></marker>
  </defs>

  <rect x="30" y="420" width="940" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="444" font-size="11.5" fill="#0f172a">① driver → executor：序列化后的 task（函数 + 分区号 + 依赖文件）</text>
  <text x="46" y="466" font-size="11.5" fill="#0f172a">② executor → driver：task 状态、结果、累加器与执行指标</text>
  <text x="46" y="488" font-size="10.5" fill="#475569">箭头是双向的：所以 driver 与 executor 之间必须是双向可达的网络</text>

  <rect x="30" y="516" width="940" height="76" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="46" y="540" font-size="11.5" fill="#78350f">local 模式的实测：事件日志里只有一个 executor，id = driver，Total Cores = 2（local[2]）/ 4（local[4]）</text>
  <text x="46" y="562" font-size="11" fill="#78350f">spark.executor.instances 与 spark.executor.cores 在 local 下未设置，也不参与调度</text>
  <text x="46" y="582" font-size="11" fill="#78350f">要观察真正的多 executor，需要一个集群管理器：本机没有独立集群，未实测</text>
</svg>
