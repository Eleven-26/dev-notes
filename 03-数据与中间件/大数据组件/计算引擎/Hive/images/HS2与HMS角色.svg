<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="530" fill="#ffffff"/>

  <rect x="30" y="20" width="940" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="44" font-size="17" fill="#0f172a">HS2 与 HMS 是两件事：一个挡入口，一个挡所有表解析</text>
  <text x="46" y="62" font-size="11.5" fill="#475569">客户端连 10000 提交 SQL，HS2 编译成作业；HMS 在 9083 上被 HS2 与各引擎读取</text>

  <rect x="30" y="84" width="940" height="300" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="50" y="120" width="170" height="80" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="135" y="148" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#0f172a">客户端</text>
  <text x="135" y="170" font-size="9" text-anchor="middle" fill="#475569">beeline / JDBC</text>
  <text x="135" y="190" font-size="9" text-anchor="middle" fill="#475569">Spark / Trino 也可直连 HMS</text>

  <line x1="222" y1="160" x2="274" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="280" y="116" width="210" height="88" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="385" y="142" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">HiveServer2</text>
  <text x="385" y="164" font-size="9" text-anchor="middle" fill="#1e293b">:10000 Thrift / JDBC</text>
  <text x="385" y="184" font-size="9" text-anchor="middle" fill="#1e293b">:10002 Thrift over HTTP</text>

  <line x1="492" y1="160" x2="544" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="550" y="116" width="200" height="88" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="650" y="142" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#78350f">执行引擎</text>
  <text x="650" y="164" font-size="9" text-anchor="middle" fill="#78350f">MR / Tez / Spark</text>
  <text x="650" y="184" font-size="9" text-anchor="middle" fill="#78350f">由 YARN / 会话管</text>

  <line x1="752" y1="160" x2="804" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="810" y="116" width="140" height="88" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="880" y="142" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#065f46">表与文件</text>
  <text x="880" y="164" font-size="9" text-anchor="middle" fill="#065f46">HDFS / 对象存储</text>
  <text x="880" y="184" font-size="9" text-anchor="middle" fill="#065f46">按分区分桶落</text>

  <rect x="380" y="286" width="340" height="76" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="550" y="312" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#312e81">HMS（Metastore）</text>
  <text x="550" y="334" font-size="9" text-anchor="middle" fill="#3730a3">:9083 远程模式；表名、列、分区、存储描述</text>
  <text x="550" y="354" font-size="9" text-anchor="middle" fill="#3730a3">表 = HMS 一行 + 目录 + 文件名</text>

  <line x1="385" y1="206" x2="452" y2="284" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="650" y1="206" x2="650" y2="284" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="296" y="230" width="110" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="351" y="245" font-size="8.5" text-anchor="middle" fill="#475569">编译要查 schema</text>
  <rect x="660" y="230" width="110" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="715" y="245" font-size="8.5" text-anchor="middle" fill="#475569">写入要读分区</text>

  <rect x="30" y="396" width="940" height="116" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="422" font-size="11" font-weight="bold" fill="#0f172a">影响面差一个量级：这也是 HMS 要做高可用、HS2 通常不需要的原因</text>
  <text x="46" y="448" font-size="10" fill="#1e293b">HS2 挂了：已提交作业继续跑完，Spark / Trino 直连 HMS 的查询照常；只是新 SQL 提交不了</text>
  <text x="46" y="470" font-size="10" fill="#1e293b">HMS 挂了：所有引擎的表解析、建表、分区操作全部失败——几乎什么都不能做</text>
  <text x="46" y="492" font-size="10" fill="#64748b">注意：HS2 挂了作业照跑，不等于数据安全——写回若还要读元数据仍会失败（机制推论，未实测）</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4f46e5"/></marker>
  </defs>
</svg>
