<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <rect x="30" y="20" width="940" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="44" font-size="18" fill="#0f172a">分区有两份记录：HMS 的一行 与 磁盘上的一个目录</text>
  <text x="46" y="62" font-size="11.5" fill="#475569">查询能不能读到它由元数据决定；两份不一致各有补法，Iceberg 则把分区值写进元数据</text>

  <rect x="30" y="84" width="940" height="190" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="110" font-size="12" font-weight="bold" fill="#334155">上半：Hive 的分区是「逻辑 + 物理」双份的</text>

  <rect x="50" y="126" width="250" height="130" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="64" y="150" font-size="11" font-weight="bold" fill="#1e3a8a">HMS 里的一行</text>
  <text x="64" y="174" font-size="9.5" fill="#1e293b">逻辑存在性</text>
  <text x="64" y="194" font-size="9.5" fill="#1e293b">分区列与分区值</text>
  <text x="64" y="214" font-size="9.5" fill="#1e293b">编译期裁剪的依据</text>
  <text x="64" y="240" font-size="9" fill="#64748b">权威来源</text>

  <rect x="302" y="150" width="76" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="340" y="165" font-size="9" text-anchor="middle" fill="#475569">可各自先到</text>
  <line x1="306" y1="180" x2="374" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="374" y1="204" x2="306" y2="204" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="380" y="126" width="280" height="130" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="394" y="150" font-size="11" font-weight="bold" fill="#065f46">磁盘上的一个目录</text>
  <text x="394" y="174" font-size="9.5" fill="#064e3b">dt=2026-10-25/</text>
  <text x="394" y="194" font-size="9.5" fill="#064e3b">物理存在性：文件在不在</text>
  <text x="394" y="214" font-size="9.5" fill="#064e3b">MSCK 从这里反推元数据</text>
  <text x="394" y="240" font-size="9" fill="#047857">数据本体</text>

  <line x1="664" y1="191" x2="716" y2="191" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="720" y="126" width="230" height="130" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="734" y="150" font-size="11" font-weight="bold" fill="#78350f">谁说了算</text>
  <text x="734" y="174" font-size="9.5" fill="#7c2d12">元数据行：算不算存在</text>
  <text x="734" y="194" font-size="9.5" fill="#7c2d12">目录：数据在不在</text>
  <text x="734" y="214" font-size="9.5" fill="#7c2d12">两者不报错</text>
  <text x="734" y="240" font-size="9" fill="#92400e">缺一份就是「存在但读不对」</text>

  <rect x="30" y="288" width="940" height="196" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="314" font-size="12" font-weight="bold" fill="#334155">中间：两种不一致与各自的补法</text>

  <rect x="50" y="330" width="420" height="140" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="64" y="354" font-size="10.5" font-weight="bold" fill="#991b1b">ADD PARTITION：只写 HMS</text>
  <text x="64" y="378" font-size="9.5" fill="#7f1d1d">元数据里有、磁盘上没有</text>
  <text x="64" y="400" font-size="9.5" fill="#7f1d1d">结果：查得到，但读 0 行或报文件不存在</text>
  <text x="64" y="430" font-size="9" fill="#b91c1c">用途：先登记分区，数据后到</text>

  <rect x="520" y="330" width="420" height="140" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="534" y="354" font-size="10.5" font-weight="bold" fill="#1e3a8a">MSCK REPAIR TABLE：从磁盘反推 HMS</text>
  <text x="534" y="378" font-size="9.5" fill="#1e293b">目录先有、元数据后补</text>
  <text x="534" y="400" font-size="9.5" fill="#1e293b">补完才能查；不补则这个分区不可见</text>
  <text x="534" y="430" font-size="9" fill="#1d4ed8">用途：外部写入后补齐分区</text>

  <rect x="30" y="498" width="940" height="68" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="46" y="522" font-size="10.5" fill="#0f172a">对照：Iceberg 把分区值写进 manifest，目录名只是聚类手段，改分区策略不重写文件</text>
  <text x="46" y="546" font-size="10.5" fill="#0f172a">Hive 正相反：分区策略就是目录结构本身，改策略等于重排目录、重写数据</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
</svg>
