<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <rect x="30" y="20" width="940" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="44" font-size="17" fill="#0f172a">HQL 排障分三层：三层的结论不能互相回答</text>
  <text x="46" y="62" font-size="11.5" fill="#475569">语法层看报错类型，计划层看 EXPLAIN 分区段，写入端看文件数</text>

  <rect x="30" y="88" width="940" height="110" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="46" y="104" width="120" height="32" rx="5" fill="#ffffff" stroke="#dc2626"/>
  <text x="106" y="125" font-size="10" font-weight="bold" text-anchor="middle" fill="#991b1b">第一层 语法</text>
  <text x="180" y="122" font-size="10.5" font-weight="bold" fill="#991b1b">语法层：SQL 能不能过</text>
  <text x="180" y="144" font-size="9.5" fill="#7f1d1d">信号：ParseException、表 / 列不存在、分区列没定义</text>
  <text x="180" y="166" font-size="9.5" fill="#7f1d1d">命令：beeline -e "EXPLAIN ..." 先编译一遍，不跑数据</text>
  <text x="180" y="186" font-size="9" fill="#b91c1c">这一层一定有报错原文，照原文改</text>
  <rect x="840" y="104" width="130" height="32" rx="5" fill="#ffffff" stroke="#dc2626"/>
  <text x="905" y="125" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#991b1b">有报错原文</text>

  <rect x="30" y="210" width="940" height="110" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="46" y="226" width="120" height="32" rx="5" fill="#ffffff" stroke="#f59e0b"/>
  <text x="106" y="247" font-size="10" font-weight="bold" text-anchor="middle" fill="#78350f">第二层 计划</text>
  <text x="180" y="244" font-size="10.5" font-weight="bold" fill="#78350f">计划层：分区裁剪生效了吗</text>
  <text x="180" y="266" font-size="9.5" fill="#92400e">信号：EXPLAIN 的 Partition 段列出几个分区</text>
  <text x="180" y="288" font-size="9.5" fill="#92400e">命令：EXPLAIN SELECT * FROM orders WHERE dt='2026-10-25'</text>
  <text x="180" y="308" font-size="9" fill="#92400e">不报错：只慢。分区列没被识别时，裁剪在编译期就失效</text>
  <rect x="840" y="226" width="130" height="32" rx="5" fill="#ffffff" stroke="#f59e0b"/>
  <text x="905" y="247" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#78350f">不报错，只慢</text>

  <rect x="30" y="332" width="940" height="110" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="46" y="348" width="120" height="32" rx="5" fill="#ffffff" stroke="#6366f1"/>
  <text x="106" y="369" font-size="10" font-weight="bold" text-anchor="middle" fill="#3730a3">第三层 写入</text>
  <text x="180" y="366" font-size="10.5" font-weight="bold" fill="#3730a3">写入端：文件数对不对</text>
  <text x="180" y="388" font-size="9.5" fill="#3730a3">信号：分区目录数、分桶文件数、单文件大小</text>
  <text x="180" y="410" font-size="9.5" fill="#3730a3">命令：hdfs dfs -ls /user/hive/warehouse/lab.db/bk/</text>
  <text x="180" y="430" font-size="9" fill="#4338ca">不报错：没有收益。表看着是分桶表，join 时没有 map-side 优化</text>
  <rect x="840" y="348" width="130" height="32" rx="5" fill="#ffffff" stroke="#6366f1"/>
  <text x="905" y="369" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#3730a3">不报错，无收益</text>

  <rect x="30" y="456" width="940" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="482" font-size="10.5" fill="#0f172a">不要串层：拿写入端的问题去查语法层，只会得到「SQL 没错」这个无用的结论</text>
  <text x="46" y="504" font-size="10.5" fill="#0f172a">实测支撑：3 个分区裁到 1 个文件（第二层）；4 BUCKETS 表写 5 行产出 5 个文件（第三层）</text>
  <text x="46" y="524" font-size="10" fill="#64748b">单容器无 HDFS 时，数文件改用 inputFiles() 或直接看本地 warehouse 目录</text>
</svg>
