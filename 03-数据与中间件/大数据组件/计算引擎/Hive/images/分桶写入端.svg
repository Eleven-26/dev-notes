<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <rect x="30" y="20" width="940" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="44" font-size="18" fill="#0f172a">分桶是写入端的约定：声明在表里，桶在写入时决定</text>
  <text x="46" y="62" font-size="11.5" fill="#475569">同一个 CLUSTERED BY (id) INTO 4 BUCKETS，Hive 写入端落 4 个文件，Spark 写入端不看这个声明</text>

  <rect x="30" y="84" width="940" height="74" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="110" font-size="11" font-weight="bold" fill="#334155">表声明（落在 HMS 的一行里）</text>
  <text x="46" y="134" font-size="10" fill="#1e293b">CLUSTERED BY (id) INTO 4 BUCKETS —— 只是声明，桶里放哪些行由写入端算</text>

  <rect x="30" y="172" width="455" height="240" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="46" y="198" font-size="11.5" font-weight="bold" fill="#065f46">声明生效：Hive / Tez 写入端</text>
  <text x="46" y="220" font-size="9.5" fill="#064e3b">hash(id) % 4 决定这一行落哪个文件</text>

  <rect x="46" y="238" width="90" height="64" rx="5" fill="#ffffff" stroke="#10b981"/>
  <text x="91" y="262" font-size="9" text-anchor="middle" fill="#065f46">bucket 0</text>
  <text x="91" y="282" font-size="9" text-anchor="middle" fill="#065f46">000000_0</text>
  <rect x="152" y="238" width="90" height="64" rx="5" fill="#ffffff" stroke="#10b981"/>
  <text x="197" y="262" font-size="9" text-anchor="middle" fill="#065f46">bucket 1</text>
  <text x="197" y="282" font-size="9" text-anchor="middle" fill="#065f46">000001_0</text>
  <rect x="258" y="238" width="90" height="64" rx="5" fill="#ffffff" stroke="#10b981"/>
  <text x="303" y="262" font-size="9" text-anchor="middle" fill="#065f46">bucket 2</text>
  <text x="303" y="282" font-size="9" text-anchor="middle" fill="#065f46">000002_0</text>
  <rect x="364" y="238" width="90" height="64" rx="5" fill="#ffffff" stroke="#10b981"/>
  <text x="409" y="262" font-size="9" text-anchor="middle" fill="#065f46">bucket 3</text>
  <text x="409" y="282" font-size="9" text-anchor="middle" fill="#065f46">000003_0</text>

  <text x="46" y="326" font-size="9.5" fill="#064e3b">文件数 = 桶数 = 4，文件名前段就是桶号</text>
  <text x="46" y="348" font-size="9" fill="#047857">同 key 必然同文件，读的时候不需要再验证</text>
  <text x="46" y="370" font-size="9" fill="#047857">map-side join 的前提成立</text>
  <text x="46" y="392" font-size="9" fill="#047857">采样按桶抽，分布与 key 的 hash 一致</text>

  <rect x="515" y="172" width="455" height="240" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="531" y="198" font-size="11.5" font-weight="bold" fill="#991b1b">实测：Spark 写入端</text>
  <text x="531" y="220" font-size="9.5" fill="#7f1d1d">不读 CLUSTERED BY，5 行写成 5 个文件</text>

  <rect x="531" y="238" width="64" height="56" rx="5" fill="#ffffff" stroke="#dc2626"/>
  <text x="563" y="260" font-size="8.5" text-anchor="middle" fill="#991b1b">file 1</text>
  <text x="563" y="278" font-size="8.5" text-anchor="middle" fill="#991b1b">000000_0</text>
  <rect x="603" y="238" width="64" height="56" rx="5" fill="#ffffff" stroke="#dc2626"/>
  <text x="635" y="260" font-size="8.5" text-anchor="middle" fill="#991b1b">file 2</text>
  <text x="635" y="278" font-size="8.5" text-anchor="middle" fill="#991b1b">000001_0</text>
  <rect x="675" y="238" width="64" height="56" rx="5" fill="#ffffff" stroke="#dc2626"/>
  <text x="707" y="260" font-size="8.5" text-anchor="middle" fill="#991b1b">file 3</text>
  <text x="707" y="278" font-size="8.5" text-anchor="middle" fill="#991b1b">000002_0</text>
  <rect x="747" y="238" width="64" height="56" rx="5" fill="#ffffff" stroke="#dc2626"/>
  <text x="779" y="260" font-size="8.5" text-anchor="middle" fill="#991b1b">file 4</text>
  <text x="779" y="278" font-size="8.5" text-anchor="middle" fill="#991b1b">000003_0</text>
  <rect x="819" y="238" width="64" height="56" rx="5" fill="#ffffff" stroke="#dc2626"/>
  <text x="851" y="260" font-size="8.5" text-anchor="middle" fill="#991b1b">file 5</text>
  <text x="851" y="278" font-size="8.5" text-anchor="middle" fill="#991b1b">000004_0</text>

  <text x="531" y="326" font-size="9.5" fill="#991b1b">文件数 = 行数 = 5，与桶数 4 无关</text>
  <text x="531" y="348" font-size="9" fill="#b91c1c">CLUSTERED BY 仍在元数据里，数据是散的</text>
  <text x="531" y="370" font-size="9" fill="#b91c1c">map-side join 的前提不成立</text>
  <text x="531" y="392" font-size="9" fill="#b91c1c">读的时候没有任何元数据能识别这个差别</text>

  <rect x="30" y="426" width="940" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="452" font-size="10.5" fill="#0f172a">判据：分桶的定义在写入端——读的时候没有任何元数据能证明文件里的 key 真的落在它该在的桶里</text>
  <text x="46" y="474" font-size="10.5" fill="#0f172a">所以「建表成功 + DDL 里还有 CLUSTERED BY」不等于分桶生效，要看盘上的文件数</text>
  <text x="46" y="496" font-size="10.5" fill="#0f172a">三条出路：用 Hive / Tez 写这张表；改用 Spark 的 bucketBy + saveAsTable；换表格式</text>
  <text x="46" y="518" font-size="10" fill="#64748b">注意：分桶归属两边理解不同——Hive 看作表的物理布局，Spark 看作写入策略</text>
</svg>
