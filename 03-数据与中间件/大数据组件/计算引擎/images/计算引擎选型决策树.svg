<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <rect x="30" y="20" width="940" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="44" font-size="18" fill="#0f172a">计算引擎选型决策树：四问定引擎</text>
  <text x="46" y="62" font-size="11.5" fill="#475569">四册实测版本：Hive 4.0.0 / Spark 3.5.5 / Flink 1.20.5 / Trino 475</text>

  <rect x="30" y="84" width="940" height="384" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="108" font-size="11" font-weight="bold" fill="#0f172a">从左往右依次问；每个「是」直接落到右侧引擎，四个「否」说明还没说清需求</text>

  <rect x="60" y="116" width="386" height="56" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="74" y="140" font-size="11.5" font-weight="bold" fill="#0f172a">Q1 数据持续到达，且要秒级出结果？</text>
  <text x="74" y="158" font-size="9.5" fill="#475569">一条记录就要响应；否 → 问 Q2</text>

  <rect x="60" y="202" width="386" height="56" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="74" y="226" font-size="11.5" font-weight="bold" fill="#0f172a">Q2 一条 SQL 跨多个数据源、不落库？</text>
  <text x="74" y="244" font-size="9.5" fill="#475569">不想先搬一张表；否 → 问 Q3</text>

  <rect x="60" y="288" width="386" height="56" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="74" y="312" font-size="11.5" font-weight="bold" fill="#0f172a">Q3 大批量批处理 / 回填 / 复杂 ETL？</text>
  <text x="74" y="330" font-size="9.5" fill="#475569">按批跑、算完就走；否 → 问 Q4</text>

  <rect x="60" y="374" width="386" height="56" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="74" y="398" font-size="11.5" font-weight="bold" fill="#0f172a">Q4 只有 HQL 存量与 HMS 共享？</text>
  <text x="74" y="416" font-size="9.5" fill="#475569">新作业可迁出；四问全否 → 先别选</text>

  <line x1="450" y1="144" x2="546" y2="144" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="450" y1="230" x2="546" y2="230" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="450" y1="316" x2="546" y2="316" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="450" y1="402" x2="546" y2="402" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="498" y="139" font-size="10" text-anchor="middle" fill="#475569">是</text>
  <text x="498" y="225" font-size="10" text-anchor="middle" fill="#475569">是</text>
  <text x="498" y="311" font-size="10" text-anchor="middle" fill="#475569">是</text>
  <text x="498" y="397" font-size="10" text-anchor="middle" fill="#475569">是</text>

  <rect x="560" y="106" width="390" height="76" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="574" y="128" font-size="11.5" font-weight="bold" fill="#14532d">① 是 → Flink 1.20.5</text>
  <text x="574" y="148" font-size="9.5" fill="#14532d">常驻作业；事件时间 + 有状态</text>
  <text x="574" y="166" font-size="9" fill="#166534">p=8 直接抛 NoResourceAvailableException</text>

  <rect x="560" y="192" width="390" height="76" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="574" y="214" font-size="11.5" font-weight="bold" fill="#1e3a8a">② 是 → Trino 475</text>
  <text x="574" y="234" font-size="9.5" fill="#1e3a8a">无存储，跨源即席；只搬 join 小侧</text>
  <text x="574" y="252" font-size="9" fill="#1d4ed8">联邦 join 实测广播 136 B</text>

  <rect x="560" y="278" width="390" height="76" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="574" y="300" font-size="11.5" font-weight="bold" fill="#78350f">③ 是 → Spark 3.5.5</text>
  <text x="574" y="320" font-size="9.5" fill="#78350f">批与回填主力；流是微批</text>
  <text x="574" y="338" font-size="9" fill="#92400e">8 task：local[2] 5.54 s / local[4] 4.17 s</text>

  <rect x="560" y="364" width="390" height="76" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="574" y="386" font-size="11.5" font-weight="bold" fill="#334155">④ 是 → Hive 4.0.0（只留存量）</text>
  <text x="574" y="406" font-size="9.5" fill="#334155">新作业迁到 Spark / Trino</text>
  <text x="574" y="424" font-size="9" fill="#475569">编译期分区裁剪 3 文件 → 1 文件</text>

  <rect x="30" y="480" width="940" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="504" font-size="11.5" fill="#0f172a">四问全否：说明数据形态与时效还没说清——这时不该选引擎，先回去问「结果给谁、多久要、错了重算代价多大」</text>
  <text x="46" y="528" font-size="10.5" fill="#475569">顺序不能反：先按主语言定客户端路线（4.1），再按数据形态定引擎；语言只影响客户端，不影响能力边界。</text>
  <text x="46" y="552" font-size="10.5" fill="#475569">注意：图里的读数是各自作业的实测值，只证明机制，不能横比快慢（见第五节）。</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
</svg>
