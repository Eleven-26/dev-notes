<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <rect x="30" y="20" width="940" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="44" font-size="18" fill="#0f172a">四款引擎在一条链上的分工：写路径与读路径</text>
  <text x="46" y="62" font-size="11.5" fill="#475569">Hive 4.0.0 / Spark 3.5.5 / Flink 1.20.5 / Trino 475，各自单容器实测</text>

  <rect x="30" y="84" width="940" height="392" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="50" y="120" width="150" height="96" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="64" y="146" font-size="11.5" font-weight="bold" fill="#334155">数据源</text>
  <text x="64" y="170" font-size="9" fill="#334155">业务库 CDC</text>
  <text x="64" y="190" font-size="9" fill="#334155">日志 / 埋点</text>
  <text x="64" y="208" font-size="9" fill="#475569">先入消息队列</text>

  <rect x="240" y="120" width="170" height="96" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="254" y="146" font-size="11.5" font-weight="bold" fill="#14532d">Flink 1.20.5</text>
  <text x="254" y="170" font-size="9" fill="#14532d">常驻 · 事件时间</text>
  <text x="254" y="190" font-size="9" fill="#14532d">有状态 · checkpoint</text>
  <text x="254" y="208" font-size="9" fill="#166534">slot 是硬上限</text>

  <rect x="450" y="96" width="200" height="320" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="466" y="126" font-size="12" font-weight="bold" fill="#4c1d95">湖：Iceberg 表</text>
  <text x="466" y="152" font-size="9.5" fill="#4c1d95">文件：HDFS / 对象存储</text>
  <text x="466" y="174" font-size="9.5" fill="#4c1d95">表名 / 分区：HMS</text>
  <text x="466" y="196" font-size="9.5" fill="#4c1d95">快照：决定读到哪一版</text>
  <text x="466" y="224" font-size="9.5" fill="#5b21b6">三款引擎读同一批文件</text>

  <rect x="464" y="262" width="172" height="86" rx="6" fill="#ffffff" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="478" y="282" font-size="9.5" font-weight="bold" fill="#4c1d95">两个写入者</text>
  <text x="478" y="302" font-size="9" fill="#4c1d95">Flink：追加近实时分区</text>
  <text x="478" y="320" font-size="9" fill="#4c1d95">Spark：覆盖写，要幂等</text>
  <text x="478" y="338" font-size="9" fill="#5b21b6">Trino 一般不写</text>

  <text x="466" y="392" font-size="9" fill="#4c1d95">HMS 同时被 Hive 与湖共用</text>

  <rect x="690" y="120" width="240" height="100" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="704" y="146" font-size="11.5" font-weight="bold" fill="#78350f">Spark 3.5.5</text>
  <text x="704" y="170" font-size="9" fill="#78350f">批 / 回填 / 对账</text>
  <text x="704" y="190" font-size="9" fill="#78350f">8 task：local[2] 5.54 s</text>
  <text x="704" y="210" font-size="9" fill="#92400e">local[4] 4.17 s，核数只改波数</text>

  <rect x="690" y="250" width="240" height="100" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="704" y="276" font-size="11.5" font-weight="bold" fill="#1e3a8a">Trino 475</text>
  <text x="704" y="300" font-size="9" fill="#1e3a8a">跨源即席 + 联邦查询</text>
  <text x="704" y="320" font-size="9" fill="#1e3a8a">无存储：每次现读源</text>
  <text x="704" y="340" font-size="9" fill="#1d4ed8">联邦 join 实测广播 136 B</text>

  <rect x="690" y="380" width="240" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="704" y="406" font-size="11.5" font-weight="bold" fill="#334155">BI / 排查 / 跨源 join</text>
  <text x="704" y="430" font-size="9" fill="#334155">读结果，不把数据搬进来</text>
  <text x="704" y="450" font-size="9" fill="#475569">跨源 join 只搬小侧</text>

  <rect x="240" y="380" width="170" height="90" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="254" y="406" font-size="11.5" font-weight="bold" fill="#334155">Hive 4.0.0</text>
  <text x="254" y="430" font-size="9" fill="#334155">HQL 存量任务</text>
  <text x="254" y="450" font-size="9" fill="#475569">编译期裁剪 3 → 1 文件</text>

  <line x1="202" y1="168" x2="236" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="219" y="158" font-size="8.5" text-anchor="middle" fill="#475569">变更流</text>

  <line x1="412" y1="168" x2="446" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="429" y="158" font-size="8.5" text-anchor="middle" fill="#475569">写</text>

  <line x1="652" y1="148" x2="686" y2="148" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="669" y="140" font-size="8.5" text-anchor="middle" fill="#475569">读</text>

  <line x1="686" y1="196" x2="652" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="669" y="188" font-size="8.5" text-anchor="middle" fill="#475569">写回</text>

  <line x1="652" y1="300" x2="686" y2="300" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="669" y="292" font-size="8.5" text-anchor="middle" fill="#475569">读</text>

  <line x1="810" y1="352" x2="810" y2="376" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="818" y="368" font-size="8.5" fill="#475569">结果</text>

  <line x1="414" y1="420" x2="446" y2="404" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a2)"/>

  <rect x="30" y="488" width="940" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="514" font-size="10.5" fill="#0f172a">写路径两条：Flink 常驻追加近实时分区、Spark 覆盖写（要幂等）；读路径三条：Trino 即席、Spark 回填、Hive 存量</text>
  <text x="46" y="538" font-size="10.5" fill="#475569">注意：这是职责分工，不是部署拓扑——本仓四册各自单容器起，跨机协作与多引擎并发写同一张表都未实测。</text>
  <text x="46" y="562" font-size="10.5" fill="#475569">判据是谁写、谁读、谁只留存量；Hive 那条虚线表示共用同一批文件与同一个 HMS，不是另建一套存储。</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
  </defs>
</svg>
