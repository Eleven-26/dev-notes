<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>
  <rect x="30" y="20" width="940" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="44" font-size="18" fill="#0f172a">排障决策树：先分三态，再决定看哪张表</text>
  <text x="46" y="62" font-size="11.5" fill="#475569">实测环境：Trino 475、单容器，system.runtime 四张表 + REST stage 树</text>

  <rect x="30" y="80" width="940" height="590" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="360" y="92" width="280" height="56" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="500" y="116" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#0f172a">先看 system.runtime.queries.state</text>
  <text x="500" y="136" font-size="9.5" text-anchor="middle" fill="#475569">是排队、在跑，还是已失败？</text>

  <line x1="500" y1="150" x2="195" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="500" y1="150" x2="500" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="500" y1="150" x2="805" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="60" y="200" width="270" height="62" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="195" y="224" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">排队：state 是 RUNNING</text>
  <text x="195" y="246" font-size="9.5" text-anchor="middle" fill="#475569">但一个 task 都没有</text>

  <rect x="365" y="200" width="270" height="62" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="500" y="224" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#78350f">在跑但慢：task 已经起来</text>
  <text x="500" y="246" font-size="9.5" text-anchor="middle" fill="#475569">driver 数也正常</text>

  <rect x="670" y="200" width="270" height="62" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="805" y="224" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#991b1b">已失败：state 是 FAILED</text>
  <text x="805" y="246" font-size="9.5" text-anchor="middle" fill="#475569">带着 error_code</text>

  <rect x="60" y="290" width="270" height="290" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="74" y="316" font-size="11" font-weight="bold" fill="#1e3a8a">先看资源组</text>
  <text x="74" y="346" font-size="9.5" fill="#1e293b">resource_group_id</text>
  <text x="74" y="370" font-size="9.5" fill="#1e293b">本机全是 [global]</text>
  <text x="74" y="394" font-size="9.5" fill="#1e293b">看 queued_time_ms</text>
  <text x="74" y="418" font-size="9.5" fill="#1e293b">它明显大于</text>
  <text x="74" y="442" font-size="9.5" fill="#1e293b">analysis_time_ms</text>
  <text x="74" y="466" font-size="9.5" fill="#1e293b">才值得去查配额</text>
  <text x="74" y="500" font-size="9" fill="#64748b">本机排队 0 ~ 2 ms</text>
  <text x="74" y="522" font-size="9" fill="#64748b">没有 queue 上限</text>
  <text x="74" y="544" font-size="9" fill="#64748b">看到 [global] 是正常的</text>

  <rect x="365" y="290" width="270" height="290" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="379" y="316" font-size="11" font-weight="bold" fill="#78350f">先看 stage 与 task</text>
  <text x="379" y="346" font-size="9.5" fill="#78350f">REST stage 树找最慢段</text>
  <text x="379" y="370" font-size="9.5" fill="#78350f">tasks 表看两个字段</text>
  <text x="379" y="394" font-size="9.5" fill="#78350f">split_cpu_time_ms</text>
  <text x="379" y="418" font-size="9.5" fill="#78350f">split_blocked_time_ms</text>
  <text x="379" y="442" font-size="9.5" fill="#78350f">blocked 高：等上游或等 CPU</text>
  <text x="379" y="466" font-size="9.5" fill="#78350f">单容器两种等待分不开</text>
  <text x="379" y="500" font-size="9" fill="#92400e">driver 级只有 REST 有</text>
  <text x="379" y="522" font-size="9" fill="#92400e">EXPLAIN 不给 driver 数</text>
  <text x="379" y="544" font-size="9" fill="#92400e">先确认 stage 形状对不对</text>

  <rect x="670" y="290" width="270" height="290" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="684" y="316" font-size="11" font-weight="bold" fill="#991b1b">按 error_code 分层</text>
  <text x="684" y="346" font-size="9.5" fill="#7f1d1d">SYNTAX_ERROR → 语法层</text>
  <text x="684" y="370" font-size="9.5" fill="#7f1d1d">TABLE_NOT_FOUND → 对象层</text>
  <text x="684" y="394" font-size="9.5" fill="#7f1d1d">COLUMN_NOT_FOUND → 对象层</text>
  <text x="684" y="418" font-size="9.5" fill="#7f1d1d">INSUFFICIENT_RESOURCES → 资源层</text>
  <text x="684" y="442" font-size="9.5" fill="#7f1d1d">EXCEEDED_TIME_LIMIT → 资源层</text>
  <text x="684" y="466" font-size="9.5" fill="#7f1d1d">ADMINISTRATIVELY_KILLED → 运维层</text>
  <text x="684" y="500" font-size="9" fill="#b91c1c">error_type 只分大类</text>
  <text x="684" y="522" font-size="9" fill="#b91c1c">error_code 才指到具体一层</text>
  <text x="684" y="544" font-size="9" fill="#b91c1c">运维层不是 SQL 或数据问题</text>

  <rect x="30" y="600" width="940" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="626" font-size="10.5" fill="#0f172a">先分态再选表：queries 管 query 级、tasks 管 task 级、driver 级只有 REST 的 stageStats</text>
  <text x="46" y="650" font-size="10.5" fill="#0f172a">拿失败查询的 tasks 表当性能问题分析，是最常见的错——那时已经没有 task 在跑了</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
</svg>
