<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <rect x="30" y="20" width="940" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="44" font-size="18" fill="#0f172a">Trino 册全景：一条 SQL 的一生，四段各管一层</text>
  <text x="46" y="62" font-size="11.5" fill="#475569">四篇均已落盘；上图按一条查询的流动顺序标出每段由哪一篇负责解释</text>

  <rect x="30" y="92" width="940" height="240" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="118" font-size="13" font-weight="bold" fill="#0f172a">一条 GROUP BY 查询：从提交到输出（Trino 475、单容器、tpch sf1 六百万行）</text>

  <rect x="46" y="150" width="160" height="64" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="58" y="171" font-size="12" font-weight="bold" fill="#1e3a8a">提交与排队</text>
  <text x="58" y="189" font-size="10" fill="#475569">queryId + 资源组</text>
  <text x="58" y="205" font-size="9.5" fill="#64748b">架构与生命 §四</text>

  <rect x="236" y="150" width="160" height="64" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="248" y="171" font-size="12" font-weight="bold" fill="#1e3a8a">解析与规划</text>
  <text x="248" y="189" font-size="10" fill="#475569">五层对象在这里成形</text>
  <text x="248" y="205" font-size="9.5" fill="#64748b">架构与生命 §三</text>

  <rect x="426" y="150" width="160" height="64" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="438" y="171" font-size="12" font-weight="bold" fill="#1e3a8a">切成 stage</text>
  <text x="438" y="189" font-size="10" fill="#475569">交换即边界</text>
  <text x="438" y="205" font-size="9.5" fill="#64748b">执行与调度 §二</text>

  <rect x="616" y="150" width="160" height="64" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="628" y="171" font-size="12" font-weight="bold" fill="#78350f">扫 split 与交换</text>
  <text x="628" y="189" font-size="10" fill="#475569">driver 内完成</text>
  <text x="628" y="205" font-size="9.5" fill="#92400e">连接器 §五 / 调度 §三</text>

  <rect x="806" y="150" width="160" height="64" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="818" y="171" font-size="12" font-weight="bold" fill="#14532d">输出与回收</text>
  <text x="818" y="189" font-size="10" fill="#475569">根 stage 交回客户端</text>
  <text x="818" y="205" font-size="9.5" fill="#166534">架构与生命 §三</text>

  <line x1="208" y1="182" x2="232" y2="182" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="398" y1="182" x2="422" y2="182" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="588" y1="182" x2="612" y2="182" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="778" y1="182" x2="802" y2="182" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>

  <text x="46" y="244" font-size="11" fill="#0f172a">前两段与数据量无关：排队 1.73 ms、解析 11.39 ms、规划 284.06 ms——小结果集也慢，通常慢在这几段</text>
  <text x="46" y="266" font-size="11" fill="#0f172a">中间一段是「切多细」：交换把 stage 断开，分区数决定 driver 数，单节点上分区退化成一个 task 内的并发</text>
  <text x="46" y="288" font-size="11" fill="#0f172a">后两段才是「算多久」：扫 6,001,215 行、局部聚合压到 12 行，交换只走 424 B，最终 3 行交回客户端</text>
  <text x="46" y="314" font-size="10.5" fill="#475569">注意：本册只有单节点（coordinator 也执行），跨机交换与任务分配逐篇标注未实测</text>

  <rect x="30" y="344" width="220" height="190" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="44" y="368" font-size="12.5" font-weight="bold" fill="#1e3a8a">① 架构与查询生命周期</text>
  <text x="44" y="394" font-size="10.5" fill="#1e293b">coordinator 规划、worker 执行</text>
  <text x="44" y="414" font-size="10.5" fill="#1e293b">六段：2 / 2 / 25 ms</text>
  <text x="44" y="434" font-size="10.5" fill="#1e293b">GROUP BY 规划 284.06 ms</text>
  <text x="44" y="454" font-size="10.5" fill="#1e293b">五层对象：query 到 split</text>
  <text x="44" y="474" font-size="10.5" fill="#1e293b">提交协议靠 nextUri 轮询</text>
  <text x="44" y="508" font-size="9.5" fill="#64748b">读序：第 1 读</text>

  <rect x="270" y="344" width="220" height="190" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="284" y="368" font-size="12.5" font-weight="bold" fill="#1e3a8a">② 执行与调度</text>
  <text x="284" y="394" font-size="10.5" fill="#1e293b">Fragment 号 = stage 号</text>
  <text x="284" y="414" font-size="10.5" fill="#1e293b">单节点 1 task / 4 driver</text>
  <text x="284" y="434" font-size="10.5" fill="#1e293b">聚合交换 12 行 / 424 B</text>
  <text x="284" y="454" font-size="10.5" fill="#1e293b">task_concurrency 1→2…8→16</text>
  <text x="284" y="474" font-size="10.5" fill="#1e293b">三个分区旋钮本机无效</text>
  <text x="284" y="508" font-size="9.5" fill="#64748b">读序：第 2 读</text>

  <rect x="510" y="344" width="220" height="190" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="524" y="368" font-size="12.5" font-weight="bold" fill="#14532d">③ 连接器与联邦查询</text>
  <text x="524" y="394" font-size="10.5" fill="#14532d">三件事：元数据 / split / 下推</text>
  <text x="524" y="414" font-size="10.5" fill="#14532d">filter 下推成 ScanFilter</text>
  <text x="524" y="434" font-size="10.5" fill="#14532d">limit 下推成 LimitPartial</text>
  <text x="524" y="454" font-size="10.5" fill="#14532d">聚合不下推，引擎侧局部聚合</text>
  <text x="524" y="474" font-size="10.5" fill="#14532d">广播 3 行 / 136 B</text>
  <text x="524" y="508" font-size="9.5" fill="#166534">读序：第 3 读</text>

  <rect x="750" y="344" width="220" height="190" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="764" y="368" font-size="12.5" font-weight="bold" fill="#78350f">④ 资源组与排障</text>
  <text x="764" y="394" font-size="10.5" fill="#78350f">resource_group_id [global]</text>
  <text x="764" y="414" font-size="10.5" fill="#78350f">四张系统表各答一层</text>
  <text x="764" y="434" font-size="10.5" fill="#78350f">七类错误码逐条给原文</text>
  <text x="764" y="454" font-size="10.5" fill="#78350f">kill 与超时错误码不同</text>
  <text x="764" y="474" font-size="10.5" fill="#78350f">堆上限 4.66 GiB</text>
  <text x="764" y="508" font-size="9.5" fill="#92400e">读序：第 4 读</text>

  <rect x="30" y="548" width="940" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="572" font-size="11.5" fill="#0f172a">读法：① 先弄清「一条 SQL 经过谁」，②③ 才是这些 stage 里发生的两件独立的事——怎么并行、数据从哪来</text>
  <text x="46" y="594" font-size="10.5" fill="#475569">本册与大数据选型对比篇的分工：选型篇回答「为什么用联邦引擎」，本册回答「这台引擎自己怎么跑」</text>
  <text x="46" y="612" font-size="10.5" fill="#475569">四篇都按「机制 → 实测读数 → 校验口径」写，读数只来自本机单容器，跨机行为逐条标注未实测</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
</svg>
