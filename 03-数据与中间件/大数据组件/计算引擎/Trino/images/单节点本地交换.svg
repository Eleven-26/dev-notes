<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <rect x="30" y="20" width="940" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="44" font-size="18" fill="#0f172a">单节点的本地交换：分区变成了 task 内的并发</text>
  <text x="46" y="62" font-size="11.5" fill="#475569">实测环境：Trino 475、单容器，group-by returnflag，交换总量 424 B</text>

  <rect x="30" y="84" width="940" height="250" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="110" font-size="12" font-weight="bold" fill="#0f172a">扫描侧：4 个 split 各进一个 driver，各自做完局部聚合</text>

  <rect x="46" y="124" width="120" height="36" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="106" y="147" font-size="10" text-anchor="middle" fill="#1e3a8a">split 1</text>
  <rect x="186" y="124" width="120" height="36" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="246" y="147" font-size="10" text-anchor="middle" fill="#1e3a8a">split 2</text>
  <rect x="326" y="124" width="120" height="36" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="386" y="147" font-size="10" text-anchor="middle" fill="#1e3a8a">split 3</text>
  <rect x="466" y="124" width="120" height="36" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="526" y="147" font-size="10" text-anchor="middle" fill="#1e3a8a">split 4</text>

  <line x1="106" y1="162" x2="106" y2="176" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="246" y1="162" x2="246" y2="176" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="386" y1="162" x2="386" y2="176" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="526" y1="162" x2="526" y2="176" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="46" y="180" width="120" height="78" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="106" y="202" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">driver 1</text>
  <text x="106" y="222" font-size="9.5" text-anchor="middle" fill="#1e293b">TableScan</text>
  <text x="106" y="242" font-size="9.5" text-anchor="middle" fill="#1e293b">局部聚合 → 3 行</text>

  <rect x="186" y="180" width="120" height="78" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="246" y="202" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">driver 2</text>
  <text x="246" y="222" font-size="9.5" text-anchor="middle" fill="#1e293b">TableScan</text>
  <text x="246" y="242" font-size="9.5" text-anchor="middle" fill="#1e293b">局部聚合 → 3 行</text>

  <rect x="326" y="180" width="120" height="78" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="386" y="202" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">driver 3</text>
  <text x="386" y="222" font-size="9.5" text-anchor="middle" fill="#1e293b">TableScan</text>
  <text x="386" y="242" font-size="9.5" text-anchor="middle" fill="#1e293b">局部聚合 → 3 行</text>

  <rect x="466" y="180" width="120" height="78" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="526" y="202" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">driver 4</text>
  <text x="526" y="222" font-size="9.5" text-anchor="middle" fill="#1e293b">TableScan</text>
  <text x="526" y="242" font-size="9.5" text-anchor="middle" fill="#1e293b">局部聚合 → 3 行</text>

  <rect x="620" y="124" width="320" height="134" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="634" y="148" font-size="11" font-weight="bold" fill="#0f172a">扫描侧合计</text>
  <text x="634" y="170" font-size="9.5" fill="#1e293b">6,001,215 行读入</text>
  <text x="634" y="190" font-size="9.5" fill="#1e293b">12 行输出（4 × 3 行）</text>
  <text x="634" y="212" font-size="9.5" fill="#1e293b">driver 数 = split 数 = 4</text>
  <text x="634" y="234" font-size="9.5" fill="#475569">本机 tpch.splits_per_node = 4</text>

  <text x="46" y="286" font-size="10.5" fill="#0f172a">split 是连接器切好的一段数据；driver 数不是规划器写死的，而是跟着分区与 split 来</text>
  <text x="46" y="308" font-size="10" fill="#475569">这 4 个 driver 属于同一个 task，共用同一个 JVM 的 CPU 与内存池</text>

  <rect x="516" y="340" width="450" height="36" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="530" y="363" font-size="10" fill="#78350f">哈希重分区：12 行按 returnflag 分成 4 份，仍在这个 task 内</text>
  <line x1="500" y1="338" x2="500" y2="384" stroke="#d97706" stroke-width="1.8" marker-end="url(#a2)"/>

  <rect x="30" y="390" width="940" height="220" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="416" font-size="12" font-weight="bold" fill="#0f172a">最终聚合侧：同一个 task 内 4 个 driver 各算一份</text>

  <rect x="46" y="430" width="120" height="36" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="106" y="453" font-size="10" text-anchor="middle" fill="#14532d">分区 1</text>
  <rect x="186" y="430" width="120" height="36" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="246" y="453" font-size="10" text-anchor="middle" fill="#14532d">分区 2</text>
  <rect x="326" y="430" width="120" height="36" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="386" y="453" font-size="10" text-anchor="middle" fill="#14532d">分区 3</text>
  <rect x="466" y="430" width="120" height="36" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="526" y="453" font-size="10" text-anchor="middle" fill="#14532d">分区 4</text>

  <line x1="106" y1="468" x2="106" y2="482" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="246" y1="468" x2="246" y2="482" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="386" y1="468" x2="386" y2="482" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="526" y1="468" x2="526" y2="482" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="46" y="486" width="120" height="78" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="106" y="508" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#14532d">driver 1</text>
  <text x="106" y="528" font-size="9.5" text-anchor="middle" fill="#166534">最终聚合</text>
  <text x="106" y="548" font-size="9.5" text-anchor="middle" fill="#166534">本分区结果</text>

  <rect x="186" y="486" width="120" height="78" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="246" y="508" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#14532d">driver 2</text>
  <text x="246" y="528" font-size="9.5" text-anchor="middle" fill="#166534">最终聚合</text>
  <text x="246" y="548" font-size="9.5" text-anchor="middle" fill="#166534">本分区结果</text>

  <rect x="326" y="486" width="120" height="78" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="386" y="508" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#14532d">driver 3</text>
  <text x="386" y="528" font-size="9.5" text-anchor="middle" fill="#166534">最终聚合</text>
  <text x="386" y="548" font-size="9.5" text-anchor="middle" fill="#166534">本分区结果</text>

  <rect x="466" y="486" width="120" height="78" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="526" y="508" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#14532d">driver 4</text>
  <text x="526" y="528" font-size="9.5" text-anchor="middle" fill="#166534">最终聚合</text>
  <text x="526" y="548" font-size="9.5" text-anchor="middle" fill="#166534">本分区结果</text>

  <rect x="620" y="430" width="320" height="134" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="634" y="454" font-size="11" font-weight="bold" fill="#0f172a">根 stage 输出</text>
  <text x="634" y="476" font-size="9.5" fill="#1e293b">3 行 / 45 B</text>
  <text x="634" y="496" font-size="9.5" fill="#1e293b">交换总量 12 行 / 424 B</text>
  <text x="634" y="518" font-size="9.5" fill="#1e293b">plan 里 scope: LOCAL</text>
  <text x="634" y="540" font-size="9.5" fill="#475569">不经过 HTTP，也不跨 JVM</text>

  <text x="46" y="588" font-size="10" fill="#475569">注意：4 个 driver 并行但不提速，本机只有一个节点、一份 CPU，加机器才会把分区摊出去</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d97706"/></marker>
  </defs>
</svg>
