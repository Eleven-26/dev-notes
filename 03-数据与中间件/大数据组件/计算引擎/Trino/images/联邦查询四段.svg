<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <rect x="30" y="20" width="940" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="44" font-size="18" fill="#0f172a">联邦查询四段：两个数据源各自扫，只搬 join 要的那侧</text>
  <text x="46" y="62" font-size="11.5" fill="#475569">实测：tpch.sf1.nation（25 行）join memory.default.region_note2（3 行），输出 15 行</text>

  <rect x="30" y="84" width="940" height="440" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="104" font-size="11.5" font-weight="bold" fill="#0f172a">从下往上是执行顺序：号大的 stage 先跑，号小的是下游</text>

  <rect x="46" y="110" width="620" height="70" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="58" y="134" font-size="10.5" font-weight="bold" fill="#14532d">stage 0 · 输出给客户端</text>
  <text x="58" y="158" font-size="9.5" fill="#166534">1 task / 1 driver · 15 行 / 609 B</text>

  <rect x="46" y="200" width="620" height="70" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="58" y="224" font-size="10.5" font-weight="bold" fill="#1e3a8a">stage 1 · 按输出 key 重分布（FIXED）</text>
  <text x="58" y="248" font-size="9.5" fill="#1e40af">1 task / 3 driver · 15 行 / 609 B</text>

  <rect x="46" y="290" width="620" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="58" y="314" font-size="10.5" font-weight="bold" fill="#78350f">stage 2 · join（REPLICATED）+ 动态过滤</text>
  <text x="58" y="338" font-size="9.5" fill="#92400e">1 task / 7 driver · 28 行入 → 15 行</text>

  <rect x="46" y="380" width="620" height="70" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="58" y="404" font-size="10.5" font-weight="bold" fill="#1e3a8a">stage 3 · 扫 memory.default.region_note2</text>
  <text x="58" y="428" font-size="9.5" fill="#1e40af">1 task / 4 driver · 3 行</text>

  <line x1="356" y1="378" x2="356" y2="364" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="356" y1="288" x2="356" y2="274" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="356" y1="198" x2="356" y2="184" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>

  <text x="372" y="376" font-size="9.5" fill="#475569">广播 3 行 / 136 B</text>
  <text x="372" y="286" font-size="9.5" fill="#475569">15 行 / 609 B</text>
  <text x="372" y="196" font-size="9.5" fill="#475569">15 行 / 609 B</text>

  <rect x="690" y="110" width="262" height="340" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="704" y="136" font-size="11" font-weight="bold" fill="#0f172a">两个数据源</text>
  <text x="704" y="164" font-size="9.5" fill="#1e293b">tpch.sf1.nation</text>
  <text x="704" y="184" font-size="9.5" fill="#475569">tpch 连接器 · 25 行</text>
  <text x="704" y="214" font-size="9.5" fill="#1e293b">memory.default.region_note2</text>
  <text x="704" y="234" font-size="9.5" fill="#475569">memory 连接器 · 3 行</text>
  <text x="704" y="270" font-size="9.5" fill="#1e293b">跨 catalog join</text>
  <text x="704" y="290" font-size="9.5" fill="#1e293b">不需要先落地</text>
  <text x="704" y="320" font-size="9.5" fill="#1e293b">小侧按行数判为 REPLICATED</text>
  <text x="704" y="340" font-size="9.5" fill="#475569">3 行 低于 100 万行阈值</text>
  <text x="704" y="376" font-size="9.5" fill="#1e293b">两侧各自独立扫描</text>
  <text x="704" y="396" font-size="9.5" fill="#1e293b">谁也不负责先搬数据</text>
  <text x="704" y="422" font-size="9.5" fill="#475569">实测广播只搬 136 B</text>

  <text x="46" y="478" font-size="10.5" fill="#0f172a">执行顺序从下往上：stage 3 扫内存表 → stage 2 做 join → stage 1 按 key 重分布 → stage 0 输出</text>
  <text x="46" y="502" font-size="10.5" fill="#0f172a">整条查询：4 task / 15 driver / 总 CPU 9 ms / 峰值用户内存 131,584 B / 输出 556 B</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
</svg>
