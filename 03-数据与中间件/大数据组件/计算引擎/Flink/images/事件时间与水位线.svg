<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <rect x="30" y="20" width="940" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="44" font-size="18" fill="#0f172a">事件时间与水位线：4 秒步长、300 毫秒一条、乱序容忍 10 秒</text>
  <text x="46" y="62" font-size="11.5" fill="#475569">实测 Flink 1.20.5、单并行度源、10 秒滚动窗口；横轴是墙上时间（毫秒偏移）</text>

  <rect x="30" y="88" width="940" height="296" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="112" font-size="10.5" fill="#475569">纵轴：事件时间（秒）</text>
  <text x="846" y="112" font-size="10" fill="#b45309">MAX 水位线在 +6,860 ms</text>
  <text x="200" y="134" font-size="10" fill="#2563eb">圆点 = 记录，位置由事件时间决定</text>
  <text x="200" y="152" font-size="10" fill="#dc2626">红线 = 水位线，恒为最大事件时间 − 10 s</text>
  <text x="200" y="170" font-size="10" fill="#64748b">灰虚线 = 窗口右边界 10 / 20 / 30 / 40</text>

  <line x1="90" y1="120" x2="90" y2="340" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="90" y1="340" x2="930" y2="340" stroke="#94a3b8" stroke-width="1.2"/>

  <line x1="90" y1="161" x2="930" y2="161" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="90" y1="196" x2="930" y2="196" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="90" y1="230" x2="930" y2="230" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="90" y1="264" x2="930" y2="264" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>

  <text x="68" y="157" font-size="10" fill="#64748b">40</text>
  <text x="68" y="192" font-size="10" fill="#64748b">30</text>
  <text x="68" y="226" font-size="10" fill="#64748b">20</text>
  <text x="68" y="260" font-size="10" fill="#64748b">10</text>

  <polyline points="126,333 162,319 199,306 235,292 271,278 308,264 344,251 380,237 416,223 453,209 489,196 525,182 919,182"
            fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="919" y1="182" x2="919" y2="120" stroke="#dc2626" stroke-width="1.8"/>

  <circle cx="126" cy="299" r="3.4" fill="#2563eb"/>
  <circle cx="162" cy="285" r="3.4" fill="#2563eb"/>
  <circle cx="199" cy="271" r="3.4" fill="#2563eb"/>
  <circle cx="235" cy="258" r="3.4" fill="#2563eb"/>
  <circle cx="271" cy="244" r="3.4" fill="#2563eb"/>
  <circle cx="308" cy="230" r="3.4" fill="#2563eb"/>
  <circle cx="344" cy="216" r="3.4" fill="#2563eb"/>
  <circle cx="380" cy="203" r="3.4" fill="#2563eb"/>
  <circle cx="416" cy="189" r="3.4" fill="#2563eb"/>
  <circle cx="453" cy="175" r="3.4" fill="#2563eb"/>
  <circle cx="489" cy="161" r="3.4" fill="#2563eb"/>
  <circle cx="525" cy="148" r="3.4" fill="#2563eb"/>

  <line x1="322" y1="350" x2="322" y2="264" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="444" y1="350" x2="444" y2="230" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="516" y1="350" x2="516" y2="196" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="919" y1="350" x2="919" y2="120" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="3 3"/>

  <text x="90" y="360" font-size="10" fill="#64748b" text-anchor="middle">0</text>
  <text x="211" y="360" font-size="10" fill="#64748b" text-anchor="middle">1 s</text>
  <text x="332" y="360" font-size="10" fill="#64748b" text-anchor="middle">2 s</text>
  <text x="452" y="360" font-size="10" fill="#64748b" text-anchor="middle">3 s</text>
  <text x="573" y="360" font-size="10" fill="#64748b" text-anchor="middle">4 s</text>
  <text x="694" y="360" font-size="10" fill="#64748b" text-anchor="middle">5 s</text>
  <text x="815" y="360" font-size="10" fill="#64748b" text-anchor="middle">6 s</text>
  <text x="930" y="360" font-size="10" fill="#64748b" text-anchor="middle">7 s</text>

  <rect x="30" y="398" width="940" height="76" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="46" y="412" width="212" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="58" y="432" font-size="10.5" font-weight="bold" fill="#1e3a8a">[0,10)：3 条记录</text>
  <text x="58" y="450" font-size="10" fill="#475569">+1,923 ms 触发</text>

  <rect x="270" y="412" width="212" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="282" y="432" font-size="10.5" font-weight="bold" fill="#1e3a8a">[10,20)：2 条记录</text>
  <text x="282" y="450" font-size="10" fill="#475569">+2,926 ms 触发</text>

  <rect x="494" y="412" width="212" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="506" y="432" font-size="10.5" font-weight="bold" fill="#1e3a8a">[20,30)：3 条记录</text>
  <text x="506" y="450" font-size="10" fill="#475569">+3,528 ms 触发</text>

  <rect x="718" y="412" width="236" height="48" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="730" y="432" font-size="10.5" font-weight="bold" fill="#78350f">[30,40) / [40,50)：各 2 条</text>
  <text x="730" y="450" font-size="10" fill="#92400e">+6,860 / +6,872 ms，靠 MAX</text>

  <rect x="30" y="490" width="940" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="514" font-size="11" fill="#0f172a">窗口按数据里的事件时间归属，却按水位线的推进触发：同一批数据重放两次，窗口归属完全相同</text>
  <text x="46" y="536" font-size="11" fill="#0f172a">触发条件写成「水位线 ≥ 窗口右边界 − 1 ms」——右边界是开区间，[0,10) 里最大的合法事件时间是 9,999 ms</text>

  <defs>
    <marker id="w1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#f59e0b"/></marker>
  </defs>
</svg>
