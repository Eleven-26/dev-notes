<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <rect x="30" y="20" width="940" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="44" font-size="18" fill="#0f172a">多输入取最小：一个空闲子任务就能把整个作业的水位线钉死</text>
  <text x="46" y="62" font-size="11.5" fill="#475569">实测 Flink 1.20.5 单容器：0 号每 300 ms 一条，1 号静默 8 秒后才发一条 ts=200</text>

  <rect x="30" y="88" width="940" height="160" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="46" y="112" font-size="12.5" font-weight="bold" fill="#991b1b">不加 withIdleness：9 个 key=a 窗口全堆在 +8,468 ~ +8,487 ms</text>

  <text x="40" y="148" font-size="10" fill="#1e293b">子任务 0</text>
  <text x="40" y="176" font-size="10" fill="#1e293b">子任务 1</text>
  <text x="40" y="204" font-size="10" fill="#1e293b">全局取最小</text>

  <polyline points="200,146 930,130" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <polyline points="200,172 849,172 849,130 930,130" fill="none" stroke="#16a34a" stroke-width="1.8"/>
  <polyline points="200,200 849,200 849,132 930,132" fill="none" stroke="#dc2626" stroke-width="2"/>

  <text x="200" y="232" font-size="10" fill="#7f1d1d">1 号停下时，全局水位线取两者的最小值，于是一步也走不动；直到 ts=200 到达才被抬起来</text>

  <rect x="30" y="262" width="940" height="160" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="46" y="286" font-size="12.5" font-weight="bold" fill="#14532d">withIdleness(2 s)：窗口从 +2,750 ms 起恢复推进，代价是 ts=200 被判迟到</text>

  <text x="40" y="322" font-size="10" fill="#1e293b">子任务 0</text>
  <text x="40" y="350" font-size="10" fill="#1e293b">子任务 1</text>
  <text x="40" y="378" font-size="10" fill="#1e293b">全局取最小</text>

  <polyline points="200,320 930,306" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <polyline points="200,346 362,346 362,342 849,342 849,306 930,306" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polyline points="200,374 930,308" fill="none" stroke="#dc2626" stroke-width="2"/>

  <text x="200" y="402" font-size="10" fill="#14532d">窗口前 4 个在 +2,750 ~ +2,811 ms，随后 +3,147 / +3,348 / +3,748，最后两个 +7,115 / +7,117 ms</text>

  <rect x="30" y="436" width="940" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="460" font-size="10.5" fill="#0f172a">判断：窗口迟迟不触发时，先看算子的 currentInputWatermark 是否随数据推进——不推进就是有输入空闲</text>
  <text x="46" y="482" font-size="10.5" fill="#0f172a">两种配置的作业总时长都约 28.5 s（28,449 / 28,526 ms），差别全在窗口什么时候吐出来</text>
  <text x="46" y="504" font-size="10.5" fill="#0f172a">idle 的代价：ts=200 在 +8,558 ms 进旁路，key=b 一个窗口都没触发</text>
</svg>
