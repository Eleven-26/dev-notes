<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <rect x="30" y="20" width="940" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="44" font-size="18" fill="#0f172a">一条记录跨 task 的五段路：缓冲的借与还就是流量控制</text>
  <text x="46" y="62" font-size="11.5" fill="#475569">实测 Flink 1.20.5 单容器：JM 与 TM 同进程，netty 走本机回环，networkMemory 128 MB</text>

  <rect x="30" y="88" width="940" height="176" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="114" font-size="12.5" font-weight="bold" fill="#0f172a">写出侧在左、读入侧在右，中间是本地缓冲池与 netty</text>

  <rect x="46" y="136" width="168" height="108" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="60" y="160" font-size="11" font-weight="bold" fill="#1e3a8a">RecordWriter</text>
  <text x="60" y="184" font-size="9.5" fill="#1e293b">按下游分区规则选路</text>
  <text x="60" y="206" font-size="9.5" fill="#1e293b">每个上游子任务一个</text>
  <text x="60" y="228" font-size="9.5" fill="#475569">链化时不存在</text>

  <rect x="230" y="136" width="168" height="108" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="244" y="160" font-size="11" font-weight="bold" fill="#1e3a8a">ResultPartition</text>
  <text x="244" y="184" font-size="9.5" fill="#1e293b">内部切成结果子分区</text>
  <text x="244" y="206" font-size="9.5" fill="#1e293b">子分区数 = 下游并行度</text>
  <text x="244" y="228" font-size="9.5" fill="#475569">一条记录只进其中一份</text>

  <rect x="414" y="136" width="168" height="108" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="428" y="160" font-size="11" font-weight="bold" fill="#78350f">网络缓冲池</text>
  <text x="428" y="184" font-size="9.5" fill="#78350f">段大小默认 32 KB</text>
  <text x="428" y="206" font-size="9.5" fill="#78350f">池满则写出阻塞</text>
  <text x="428" y="228" font-size="9.5" fill="#92400e">反压就发生在这里</text>

  <rect x="598" y="136" width="168" height="108" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="612" y="160" font-size="11" font-weight="bold" fill="#1e3a8a">InputGate</text>
  <text x="612" y="184" font-size="9.5" fill="#1e293b">每个上游一条通道</text>
  <text x="612" y="206" font-size="9.5" fill="#1e293b">exclusive + floating</text>
  <text x="612" y="228" font-size="9.5" fill="#475569">用完把缓冲还给上游</text>

  <rect x="782" y="136" width="168" height="108" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="796" y="160" font-size="11" font-weight="bold" fill="#14532d">RecordReader</text>
  <text x="796" y="184" font-size="9.5" fill="#14532d">字节还原成记录</text>
  <text x="796" y="206" font-size="9.5" fill="#14532d">交给下游算子</text>
  <text x="796" y="228" font-size="9.5" fill="#166534">处理不过来就占着缓冲</text>

  <line x1="216" y1="190" x2="226" y2="190" stroke="#475569" stroke-width="1.8" marker-end="url(#r1)"/>
  <line x1="400" y1="190" x2="410" y2="190" stroke="#475569" stroke-width="1.8" marker-end="url(#r1)"/>
  <line x1="584" y1="190" x2="594" y2="190" stroke="#475569" stroke-width="1.8" marker-end="url(#r1)"/>
  <line x1="768" y1="190" x2="778" y2="190" stroke="#475569" stroke-width="1.8" marker-end="url(#r1)"/>

  <rect x="30" y="278" width="940" height="210" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="304" font-size="12.5" font-weight="bold" fill="#0f172a">实测：源快、汇慢（各 2 个子任务，每条 8 KB，sink 每条 sleep 10 ms）</text>

  <rect x="50" y="320" width="430" height="152" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="64" y="342" font-size="11" font-weight="bold" fill="#1e3a8a">源顶点（2 子任务）</text>
  <text x="64" y="366" font-size="10" fill="#1e293b">outPoolUsage = 1.0（min = max）</text>
  <text x="64" y="388" font-size="10" fill="#1e293b">outputQueueSize 334,066 ~ 357,382 B</text>
  <text x="64" y="410" font-size="10" fill="#1e293b">numBuffersOut 79 ~ 81</text>
  <text x="64" y="432" font-size="10" fill="#1e293b">numBytesOut 均值 2,621,440 B</text>
  <text x="64" y="454" font-size="10" fill="#475569">= 80 × 32 KB，正好对上</text>

  <rect x="510" y="320" width="430" height="152" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="524" y="342" font-size="11" font-weight="bold" fill="#14532d">汇顶点（2 子任务）</text>
  <text x="524" y="366" font-size="10" fill="#14532d">busyTimeMsPerSecond = 1000</text>
  <text x="524" y="388" font-size="10" fill="#14532d">numRecordsIn 285 ~ 286</text>
  <text x="524" y="410" font-size="10" fill="#14532d">作业总时长 20,863 ms</text>
  <text x="524" y="432" font-size="10" fill="#14532d">约等于 2,000 × 10 ms</text>
  <text x="524" y="454" font-size="10" fill="#166534">源只发出 326 ~ 334 条就被限速</text>

  <rect x="30" y="502" width="940" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="526" font-size="10.5" fill="#0f172a">池满的判据：numBuffersOut 不再增长而 outPoolUsage 是 1.0；此时源不是「暂停」，是被限速到下游的节奏</text>
  <text x="46" y="548" font-size="10.5" fill="#0f172a">链化之后没有网络边：任务级 numRecordsOut 变成 0，作业一样慢（20,633 ms），反压信号只剩算子耗时</text>
  <text x="46" y="570" font-size="10.5" fill="#475569">两个坑：task 级指标约 10 秒才刷新一次；/backpressure 的 ratio 是缓存快照，本机与缓冲指标矛盾</text>

  <defs>
    <marker id="r1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker>
  </defs>
</svg>
