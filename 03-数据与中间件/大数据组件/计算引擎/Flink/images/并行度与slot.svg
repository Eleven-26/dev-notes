<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <rect x="30" y="20" width="940" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="44" font-size="18" fill="#0f172a">并行度与 slot：共享只发生在不同算子之间</text>
  <text x="46" y="62" font-size="11.5" fill="#475569">实测环境：Flink 1.20.5、单容器、1 个 TaskManager / 4 个 slot</text>

  <rect x="30" y="88" width="940" height="200" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="114" font-size="12.5" font-weight="bold" fill="#0f172a">并行度 2、两个算子：子任务两两共享 slot，作业 6,318 ms 跑完</text>

  <rect x="60" y="128" width="880" height="140" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="74" y="148" font-size="10.5" fill="#475569">TaskManager（4 个 slot）</text>

  <rect x="80" y="160" width="190" height="84" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="92" y="182" font-size="11" font-weight="bold" fill="#1e3a8a">slot 1</text>
  <text x="92" y="204" font-size="10" fill="#1e293b">Source#0</text>
  <text x="92" y="224" font-size="10" fill="#1e293b">Sink#0</text>

  <rect x="300" y="160" width="190" height="84" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="312" y="182" font-size="11" font-weight="bold" fill="#1e3a8a">slot 2</text>
  <text x="312" y="204" font-size="10" fill="#1e293b">Source#1</text>
  <text x="312" y="224" font-size="10" fill="#1e293b">Sink#1</text>

  <rect x="520" y="160" width="190" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="532" y="182" font-size="11" font-weight="bold" fill="#64748b">slot 3</text>
  <text x="532" y="204" font-size="10" fill="#64748b">空闲</text>

  <rect x="740" y="160" width="190" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="752" y="182" font-size="11" font-weight="bold" fill="#64748b">slot 4</text>
  <text x="752" y="204" font-size="10" fill="#64748b">空闲</text>

  <rect x="30" y="304" width="940" height="200" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="46" y="330" font-size="12.5" font-weight="bold" fill="#991b1b">并行度 8、单算子：8 个并行子任务要 8 个 slot，只有 4 个</text>

  <text x="46" y="356" font-size="10.5" fill="#991b1b">前 4 个拿得到 slot</text>
  <text x="606" y="356" font-size="10.5" fill="#991b1b">后 4 个没有 slot 可去</text>

  <rect x="46" y="370" width="100" height="60" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="58" y="394" font-size="9" fill="#14532d">Source#0</text>
  <text x="58" y="414" font-size="9" fill="#166534">有 slot</text>

  <rect x="158" y="370" width="100" height="60" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="170" y="394" font-size="9" fill="#14532d">Source#1</text>
  <text x="170" y="414" font-size="9" fill="#166534">有 slot</text>

  <rect x="270" y="370" width="100" height="60" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="282" y="394" font-size="9" fill="#14532d">Source#2</text>
  <text x="282" y="414" font-size="9" fill="#166534">有 slot</text>

  <rect x="382" y="370" width="100" height="60" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="394" y="394" font-size="9" fill="#14532d">Source#3</text>
  <text x="394" y="414" font-size="9" fill="#166534">有 slot</text>

  <rect x="494" y="370" width="100" height="60" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="506" y="394" font-size="9" fill="#991b1b">Source#4</text>
  <text x="506" y="414" font-size="9" fill="#991b1b">无 slot</text>

  <rect x="606" y="370" width="100" height="60" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="618" y="394" font-size="9" fill="#991b1b">Source#5</text>
  <text x="618" y="414" font-size="9" fill="#991b1b">无 slot</text>

  <rect x="718" y="370" width="100" height="60" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="730" y="394" font-size="9" fill="#991b1b">Source#6</text>
  <text x="730" y="414" font-size="9" fill="#991b1b">无 slot</text>

  <rect x="830" y="370" width="100" height="60" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="842" y="394" font-size="9" fill="#991b1b">Source#7</text>
  <text x="842" y="414" font-size="9" fill="#991b1b">无 slot</text>

  <text x="46" y="456" font-size="10.5" fill="#991b1b">整作业提交失败：NoResourceAvailableException（Could not acquire the minimum required resources.）</text>
  <text x="46" y="478" font-size="10.5" fill="#7f1d1d">注意：Flink 不会「先跑 4 个再跑 4 个」，同一个算子的并行子任务没有排队这一说</text>

  <rect x="30" y="516" width="940" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="540" font-size="11" fill="#0f172a">判据：同一个算子的并行子任务各占一个 slot，不同算子的子任务才能共享——关掉链化后 10 个 task 在 4 个 slot 上跑完就是证据</text>
  <text x="46" y="562" font-size="11" fill="#0f172a">并行度 1 / 2 / 4 → 12,310 / 6,318 / 3,430 ms；到 8 就撞上 slot 上限，容量规划必须一次算准</text>

  <defs>
    <marker id="b1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
</svg>
