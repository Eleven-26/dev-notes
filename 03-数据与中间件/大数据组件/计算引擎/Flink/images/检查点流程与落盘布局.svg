<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="590" fill="#ffffff"/>
  <rect x="30" y="20" width="940" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="44" font-size="18" fill="#0f172a">一次检查点：barrier 随数据流过所有算子，全部回执才算完成</text>
  <text x="46" y="62" font-size="11.5" fill="#475569">实测 Flink 1.20.5 单容器、4 slot、间隔 1,000 ms、存储 file:///w/ckpt、默认 HashMapStateBackend</text>

  <rect x="60" y="110" width="190" height="110" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="74" y="134" font-size="12.5" font-weight="bold" fill="#78350f">JobMaster</text>
  <text x="74" y="158" font-size="10" fill="#78350f">CheckpointCoordinator</text>
  <text x="74" y="180" font-size="10" fill="#78350f">按 1,000 ms 注入</text>
  <text x="74" y="202" font-size="10" fill="#78350f">barrier 到所有源</text>

  <rect x="290" y="110" width="190" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="304" y="134" font-size="12.5" font-weight="bold" fill="#1e3a8a">Source × 2</text>
  <text x="304" y="158" font-size="10" fill="#1e293b">barrier 插在记录间</text>
  <text x="304" y="180" font-size="10" fill="#1e293b">快照输入位点</text>
  <text x="304" y="202" font-size="10" fill="#1e293b">然后向下游转发</text>

  <rect x="520" y="110" width="190" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="534" y="134" font-size="12.5" font-weight="bold" fill="#1e3a8a">flatMap × 2</text>
  <text x="534" y="158" font-size="10" fill="#1e293b">收到 barrier 先快照</text>
  <text x="534" y="180" font-size="10" fill="#1e293b">ValueState 2,000 字符</text>
  <text x="534" y="202" font-size="10" fill="#1e293b">2 个子任务各一份</text>

  <rect x="750" y="110" width="190" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="764" y="134" font-size="12.5" font-weight="bold" fill="#14532d">回执汇总</text>
  <text x="764" y="158" font-size="10" fill="#14532d">28 次完成 / 0 失败</text>
  <text x="764" y="180" font-size="10" fill="#14532d">4 / 4 子任务回执</text>
  <text x="764" y="202" font-size="10" fill="#14532d">e2e 39 ~ 291 ms</text>

  <line x1="252" y1="165" x2="286" y2="165" stroke="#475569" stroke-width="1.6" marker-end="url(#c1)"/>
  <line x1="482" y1="165" x2="516" y2="165" stroke="#475569" stroke-width="1.6" marker-end="url(#c1)"/>
  <line x1="712" y1="165" x2="746" y2="165" stroke="#475569" stroke-width="1.6" marker-end="url(#c1)"/>

  <rect x="30" y="236" width="940" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="261" font-size="11" fill="#0f172a">四个环节：注入 → 对齐（EXACTLY_ONCE 下等所有通道的 barrier 到齐，先到的数据被缓存）→ 快照 → 全部回执</text>
  <text x="46" y="284" font-size="10.5" fill="#475569">任一步失败，本次检查点作废；超时（本篇配 60 s）或 1,000 ms 还没跑完就会被 minPauseBetweenCheckpoints 节流</text>

  <rect x="30" y="312" width="940" height="156" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="338" font-size="12.5" font-weight="bold" fill="#0f172a">落盘结构：file:///w/ckpt/&lt;jobId&gt;/chk-N/（实测）</text>
  <text x="46" y="366" font-size="10" font-family="monospace" fill="#1e293b">chk-N/&lt;uuid&gt;        101,361 B   子任务 0 的状态</text>
  <text x="46" y="390" font-size="10" font-family="monospace" fill="#1e293b">chk-N/&lt;uuid&gt;        101,361 B   子任务 1 的状态</text>
  <text x="46" y="414" font-size="10" font-family="monospace" fill="#1e293b">chk-N/_metadata       2,013 B   各文件的句柄与大小</text>
  <text x="46" y="444" font-size="10.5" fill="#0f172a">101,361 × 2 = 202,722 B，与 REST 返回的 state_size 完全对上——这也是判断状态落在几个子任务上最快的办法</text>

  <rect x="30" y="482" width="940" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="506" font-size="10.5" fill="#0f172a">对齐没被测到：本机 alignment_buffered 恒为 0，所有子任务同进程、barrier 几乎同时到达，不能据此说对齐机制不存在</text>
  <text x="46" y="528" font-size="10.5" fill="#0f172a">作业一结束就没了：默认 NO_EXTERNALIZED_CHECKPOINTS 在终态清理检查点，28 个 chk-N 全删，只剩 shared/ 与 taskowned/</text>
  <text x="46" y="550" font-size="10.5" fill="#475569">要看文件得在运行期看；想留着就用 RETAIN_ON_CANCELLATION，但那是运维决定，不是默认行为</text>

  <defs>
    <marker id="c1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
</svg>
