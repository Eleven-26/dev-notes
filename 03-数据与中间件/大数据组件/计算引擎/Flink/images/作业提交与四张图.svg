<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
  <rect x="30" y="20" width="940" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="44" font-size="18" fill="#0f172a">从 execute() 到真正跑起来：四张图与一次 slot 申请</text>
  <text x="46" y="62" font-size="11.5" fill="#475569">Flink 1.20.5、单容器、1 个 TaskManager / 4 个 slot</text>

  <rect x="60" y="110" width="190" height="120" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="74" y="134" font-size="12.5" font-weight="bold" fill="#1e3a8a">客户端（提交进程）</text>
  <text x="74" y="158" font-size="10.5" fill="#1e293b">StreamGraph：算子拓扑</text>
  <text x="74" y="178" font-size="10.5" fill="#1e293b">JobGraph：链化后顶点</text>
  <text x="74" y="198" font-size="10.5" fill="#1e293b">提交完即可退出</text>
  <text x="74" y="218" font-size="9.5" fill="#64748b">两张图都在这台机器上生成</text>

  <rect x="290" y="110" width="190" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="304" y="134" font-size="12.5" font-weight="bold" fill="#78350f">JobMaster</text>
  <text x="304" y="158" font-size="10.5" fill="#78350f">ExecutionGraph：展开</text>
  <text x="304" y="178" font-size="10.5" fill="#78350f">决定 task 放哪个 slot</text>
  <text x="304" y="198" font-size="10.5" fill="#78350f">触发检查点</text>
  <text x="304" y="218" font-size="9.5" fill="#92400e">一个作业一个</text>

  <rect x="520" y="110" width="190" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="534" y="134" font-size="12.5" font-weight="bold" fill="#78350f">ResourceManager</text>
  <text x="534" y="158" font-size="10.5" fill="#78350f">登记 TM 与 slot</text>
  <text x="534" y="178" font-size="10.5" fill="#78350f">按需分配 slot</text>
  <text x="534" y="198" font-size="10.5" fill="#78350f">不够就拒绝</text>
  <text x="534" y="218" font-size="9.5" fill="#92400e">slotsNumber / freeSlots</text>

  <rect x="750" y="110" width="190" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="764" y="134" font-size="12.5" font-weight="bold" fill="#14532d">TaskManager</text>
  <text x="764" y="158" font-size="10.5" fill="#14532d">每个子任务一个 task</text>
  <text x="764" y="178" font-size="10.5" fill="#14532d">task 跑在 slot 里</text>
  <text x="764" y="198" font-size="10.5" fill="#14532d">持有堆 / 托管 / 网络内存</text>
  <text x="764" y="218" font-size="9.5" fill="#166534">本机 1 个 TM、4 个 slot</text>

  <line x1="252" y1="170" x2="286" y2="170" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="482" y1="170" x2="516" y2="170" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="712" y1="170" x2="746" y2="170" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="30" y="248" width="940" height="104" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="274" font-size="12.5" font-weight="bold" fill="#0f172a">四张图里只有后两张是运行时的真身</text>
  <text x="46" y="298" font-size="11" fill="#0f172a">StreamGraph 与 JobGraph 在客户端生成，提交完客户端就可以退出；ExecutionGraph 由 JobMaster 持有，物理 task 在 TaskManager 里</text>
  <text x="46" y="320" font-size="11" fill="#0f172a">顶点数不等于算子数：默认链化把 source → map → filter → map → sink 压成 1 个顶点 / 2 个 task，关掉后是 5 个顶点 / 10 个 task</text>
  <text x="46" y="340" font-size="10.5" fill="#475569">顶点名本身就是证据：开启链化时 REST 返回一个带 -&gt; 的长名字，关掉之后是五个独立顶点</text>

  <rect x="30" y="364" width="940" height="116" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="46" y="390" font-size="12.5" font-weight="bold" fill="#1e3a8a">实测资源读数（/taskmanagers，单 TM）</text>
  <text x="46" y="416" font-size="11" fill="#1e293b">slot 数 4；每个 slot：taskHeap 383 MB、managed 512 MB、network 128 MB</text>
  <text x="46" y="438" font-size="11" fill="#1e293b">进程配置：JobManager 1600m、TaskManager 1728m（config.yaml）</text>
  <text x="46" y="460" font-size="10.5" fill="#475569">本机只有 1 个 TM：多 TM 负载均衡、跨机调度、资源不足后的排队都未实测</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
</svg>
