<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <rect x="30" y="20" width="940" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="45" font-size="17" fill="#0f172a">同一件事在三套系统里的名字</text>
  <text x="46" y="65" font-size="11.5" fill="#475569">换资源层时最贵的不是学新命令，是对不上名字：五件事，三家形状完全不同</text>

  <rect x="40" y="96" width="160" height="34" fill="#e2e8f0"/>
  <rect x="210" y="96" width="260" height="34" fill="#dbeafe" stroke="#93c5fd"/>
  <rect x="480" y="96" width="260" height="34" fill="#dcfce7" stroke="#86efac"/>
  <rect x="750" y="96" width="210" height="34" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="52" y="118" font-size="12" fill="#334155">这件事</text>
  <text x="222" y="118" font-size="12" fill="#1e40af">YARN</text>
  <text x="492" y="118" font-size="12" fill="#166534">Kubernetes</text>
  <text x="762" y="118" font-size="12" fill="#475569">Mesos（已退役）</text>

  <rect x="40" y="134" width="160" height="78" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="210" y="134" width="260" height="78" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="480" y="134" width="260" height="78" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="750" y="134" width="210" height="78" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="164" font-size="11.5" fill="#334155">谁替作业说话</text>
  <text x="52" y="186" font-size="11" fill="#64748b">谁去要资源</text>
  <text x="222" y="164" font-size="11.5" fill="#0f172a">ApplicationMaster</text>
  <text x="222" y="186" font-size="11" fill="#64748b">它自己也占一个容器</text>
  <text x="492" y="164" font-size="11.5" fill="#0f172a">没有对应物</text>
  <text x="492" y="186" font-size="11" fill="#64748b">Operator 的控制器近似</text>
  <text x="762" y="164" font-size="11.5" fill="#0f172a">framework 自己</text>
  <text x="762" y="186" font-size="11" fill="#64748b">的 scheduler</text>

  <rect x="40" y="218" width="160" height="78" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="210" y="218" width="260" height="78" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="480" y="218" width="260" height="78" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="750" y="218" width="210" height="78" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="248" font-size="11.5" fill="#334155">资源单位</text>
  <text x="52" y="270" font-size="11" fill="#64748b">规格能改吗</text>
  <text x="222" y="248" font-size="11.5" fill="#0f172a">Container</text>
  <text x="222" y="270" font-size="11" fill="#64748b">MB 与 vcore，整数，不可改</text>
  <text x="492" y="248" font-size="11.5" fill="#0f172a">Pod</text>
  <text x="492" y="270" font-size="11" fill="#64748b">requests 与 limits，毫核</text>
  <text x="762" y="248" font-size="11.5" fill="#0f172a">Task</text>
  <text x="762" y="270" font-size="11" fill="#64748b">framework 自定义</text>

  <rect x="40" y="302" width="160" height="78" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="210" y="302" width="260" height="78" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="480" y="302" width="260" height="78" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="750" y="302" width="210" height="78" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="332" font-size="11.5" fill="#334155">排队排在哪</text>
  <text x="52" y="354" font-size="11" fill="#64748b">这一层最不一样</text>
  <text x="222" y="332" font-size="11.5" fill="#0f172a">容量调度器的队列树</text>
  <text x="222" y="354" font-size="11" fill="#64748b">按百分比分池子</text>
  <text x="492" y="332" font-size="11.5" fill="#0f172a">调度器待绑定队列</text>
  <text x="492" y="354" font-size="11" fill="#64748b">没有池子，只有 Pending</text>
  <text x="762" y="332" font-size="11.5" fill="#0f172a">下放给 framework</text>
  <text x="762" y="354" font-size="11" fill="#64748b">的 offer 里</text>

  <rect x="40" y="386" width="160" height="78" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="210" y="386" width="260" height="78" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="480" y="386" width="260" height="78" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="750" y="386" width="210" height="78" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="416" font-size="11.5" fill="#334155">谁拉起进程</text>
  <text x="52" y="438" font-size="11" fill="#64748b">谁真正执行</text>
  <text x="222" y="416" font-size="11.5" fill="#0f172a">NodeManager</text>
  <text x="222" y="438" font-size="11" fill="#64748b">按 RM 的指令起</text>
  <text x="492" y="416" font-size="11.5" fill="#0f172a">kubelet</text>
  <text x="492" y="438" font-size="11" fill="#64748b">按 Pod spec 起</text>
  <text x="762" y="416" font-size="11.5" fill="#0f172a">agent 加 executor</text>
  <text x="762" y="438" font-size="11" fill="#64748b">由 framework 提交</text>

  <rect x="40" y="470" width="160" height="78" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="210" y="470" width="260" height="78" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="480" y="470" width="260" height="78" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="750" y="470" width="210" height="78" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="500" font-size="11.5" fill="#334155">失败怎么回收</text>
  <text x="52" y="522" font-size="11" fill="#64748b">谁收拾残局</text>
  <text x="222" y="500" font-size="11.5" fill="#0f172a">NM 杀容器</text>
  <text x="222" y="522" font-size="11" fill="#64748b">AM 决定要不要重试</text>
  <text x="492" y="500" font-size="11.5" fill="#0f172a">kubelet 驱逐</text>
  <text x="492" y="522" font-size="11" fill="#64748b">控制器重建 Pod</text>
  <text x="762" y="500" font-size="11.5" fill="#0f172a">executor 退出</text>
  <text x="762" y="522" font-size="11" fill="#64748b">framework 定策略</text>

  <rect x="36" y="566" width="932" height="44" fill="#ffffff"/>
  <text x="40" y="584" font-size="10.5" fill="#64748b">读这张表只要记住一行：三家的「排队」不在同一层 —— YARN 排在调度器里，K8s 排在待绑定队列里，Mesos 排在 framework 里。</text>
  <text x="40" y="602" font-size="10.5" fill="#64748b">所以「作业为什么一直在等」这个问题，在三套系统里的排查入口根本不在同一层。</text>
</svg>
