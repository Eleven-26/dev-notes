<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <defs>
    <marker id="ay" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>

  <rect x="30" y="20" width="940" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="45" font-size="17" fill="#0f172a">YARN 四对象与一次资源申请</text>
  <text x="46" y="65" font-size="11.5" fill="#475569">申请是两跳：先给 AM 一间房，AM 跑起来之后才给自己的任务要房</text>

  <rect x="40" y="90" width="230" height="100" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="56" y="118" font-size="13" fill="#0f172a">client</text>
  <text x="56" y="142" font-size="11" fill="#475569">提交 application</text>
  <text x="56" y="164" font-size="11" fill="#475569">拿回 applicationId</text>

  <rect x="320" y="90" width="280" height="100" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="336" y="118" font-size="13" fill="#0f172a">ResourceManager</text>
  <text x="336" y="142" font-size="11" fill="#475569">记账：集群多少、队列多少</text>
  <text x="336" y="164" font-size="11" fill="#475569">只发容器，不碰进程</text>

  <rect x="680" y="90" width="280" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="696" y="118" font-size="13" fill="#0f172a">NodeManager 节点 A</text>
  <text x="696" y="142" font-size="11" fill="#475569">memory 16384 MB</text>
  <text x="696" y="164" font-size="11" fill="#475569">vcores 8（与物理核数无关）</text>

  <rect x="320" y="240" width="280" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="336" y="266" font-size="11.5" fill="#0f172a">队列 default：capacity 70</text>
  <text x="336" y="288" font-size="11.5" fill="#0f172a">队列 etl：capacity 30</text>
  <text x="336" y="310" font-size="11" fill="#b45309">maximum-am-resource-percent 0.1</text>
  <text x="336" y="328" font-size="11" fill="#b45309">只有一成资源能给 AM</text>

  <rect x="680" y="240" width="280" height="100" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="696" y="268" font-size="12.5" fill="#1e40af">AM 容器（ApplicationMaster）</text>
  <text x="696" y="292" font-size="11" fill="#1e3a8a">一个作业一个，自己也是一份资源</text>
  <text x="696" y="314" font-size="11" fill="#1e3a8a">默认 1536 MB</text>

  <rect x="40" y="380" width="230" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="408" font-size="11.5" fill="#334155">算一遍这个作业要多少</text>
  <text x="56" y="436" font-size="11" fill="#0f172a">AM 1536 MB 乘 1</text>
  <text x="56" y="460" font-size="11" fill="#0f172a">任务容器 1024 MB 乘 5</text>
  <text x="56" y="490" font-size="11.5" fill="#b45309">合计 6656 MB，6 个容器</text>
  <text x="56" y="514" font-size="11" fill="#64748b">排队先算这笔账，再看日志</text>

  <rect x="320" y="380" width="640" height="160" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="336" y="406" font-size="11.5" fill="#334155">任务容器乘 5（由 NM 按 RM 批准的结果在本节点拉起）</text>

  <rect x="336" y="424" width="112" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="350" y="452" font-size="11" fill="#0f172a">容器 1</text>
  <text x="350" y="474" font-size="10.5" fill="#64748b">1024 MB</text>
  <text x="350" y="494" font-size="10.5" fill="#64748b">跑一个 map</text>

  <rect x="456" y="424" width="112" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="470" y="452" font-size="11" fill="#0f172a">容器 2</text>
  <text x="470" y="474" font-size="10.5" fill="#64748b">1024 MB</text>
  <text x="470" y="494" font-size="10.5" fill="#64748b">跑一个 map</text>

  <rect x="576" y="424" width="112" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="590" y="452" font-size="11" fill="#0f172a">容器 3</text>
  <text x="590" y="474" font-size="10.5" fill="#64748b">1024 MB</text>
  <text x="590" y="494" font-size="10.5" fill="#64748b">跑一个 map</text>

  <rect x="696" y="424" width="112" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="710" y="452" font-size="11" fill="#0f172a">容器 4</text>
  <text x="710" y="474" font-size="10.5" fill="#64748b">1024 MB</text>
  <text x="710" y="494" font-size="10.5" fill="#64748b">跑一个 map</text>

  <rect x="816" y="424" width="112" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="830" y="452" font-size="11" fill="#0f172a">容器 5</text>
  <text x="830" y="474" font-size="10.5" fill="#64748b">1024 MB</text>
  <text x="830" y="494" font-size="10.5" fill="#64748b">跑一个 map</text>

  <line x1="274" y1="140" x2="314" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#ay)"/>
  <rect x="282" y="114" width="26" height="20" fill="#ffffff"/>
  <text x="289" y="129" font-size="11" fill="#475569">1</text>

  <line x1="604" y1="140" x2="674" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#ay)"/>
  <rect x="614" y="114" width="26" height="20" fill="#ffffff"/>
  <text x="621" y="129" font-size="11" fill="#475569">2</text>

  <line x1="820" y1="194" x2="820" y2="234" stroke="#475569" stroke-width="1.5" marker-end="url(#ay)"/>
  <rect x="828" y="202" width="26" height="20" fill="#ffffff"/>
  <text x="835" y="217" font-size="11" fill="#475569">3</text>

  <line x1="674" y1="290" x2="606" y2="290" stroke="#475569" stroke-width="1.5" marker-end="url(#ay)"/>
  <rect x="614" y="264" width="26" height="20" fill="#ffffff"/>
  <text x="621" y="279" font-size="11" fill="#475569">4</text>

  <line x1="460" y1="344" x2="460" y2="374" stroke="#475569" stroke-width="1.5" marker-end="url(#ay)"/>
  <rect x="466" y="350" width="26" height="20" fill="#ffffff"/>
  <text x="473" y="365" font-size="11" fill="#475569">5</text>

  <rect x="36" y="556" width="932" height="48" fill="#ffffff"/>
  <text x="40" y="576" font-size="10.5" fill="#64748b">1 提交　2 给 AM 一个容器　3 NM 拉起 AM　4 AM 注册并申请任务容器　5 批准后 NM 起容器</text>
  <text x="40" y="596" font-size="10.5" fill="#b45309">排障先分清在哪一段等：ACCEPTED 是等 AM 容器（第 2 步），RUNNING 之后部分任务没起是等任务容器（第 5 步）。</text>
</svg>
