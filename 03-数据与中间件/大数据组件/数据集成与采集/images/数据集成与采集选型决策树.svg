<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <rect x="30" y="20" width="940" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="45" font-size="17" fill="#0f172a">数据集成与采集选型决策树</text>
  <text x="46" y="65" font-size="11.5" fill="#475569">四个问题从上往下问，任一问答「是」就落到右侧那个工具；四问全「否」说明只是搬一次表，用 DataX</text>

  <rect x="40" y="78" width="920" height="20" fill="#f8fafc"/>
  <text x="40" y="94" font-size="11" fill="#64748b">问什么</text>
  <text x="490" y="94" font-size="11" fill="#64748b">「是」落到谁</text>

  <rect x="40" y="100" width="370" height="76" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="56" y="126" font-size="12.5" fill="#0f172a">1. 源是日志 / 事件流？</text>
  <text x="56" y="148" font-size="10.5" fill="#475569">文件、端口、tail 类；按行来、没有主键</text>
  <text x="56" y="168" font-size="10" fill="#b45309">否 → 往下问第 2 问</text>

  <rect x="490" y="100" width="470" height="76" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="506" y="126" font-size="12.5" fill="#065f46">Flume 1.8.0 —— 常驻收日志</text>
  <text x="506" y="148" font-size="10.5" fill="#334155">memory channel 遇 kill -9 存 0/1400 条；file channel 1400/1400</text>
  <text x="506" y="168" font-size="10" fill="#475569">位点记在 channel 里，崩了它自己回放，不用人工兜底</text>

  <rect x="40" y="200" width="370" height="76" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="56" y="226" font-size="12.5" fill="#0f172a">2. 要秒级增量，而不是批量拉？</text>
  <text x="56" y="248" font-size="10.5" fill="#475569">业务库 binlog / WAL；下游要近实时</text>
  <text x="56" y="268" font-size="10" fill="#b45309">否 → 往下问第 3 问</text>

  <rect x="490" y="200" width="470" height="76" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="506" y="226" font-size="12.5" fill="#065f46">Canal 1.1.8 —— 抓 binlog 增量</text>
  <text x="506" y="248" font-size="10.5" fill="#334155">3 条 JSON（UPDATE / INSERT / DELETE）经 binlog 投到 Kafka</text>
  <text x="506" y="268" font-size="10" fill="#475569">位点在服务端，重启从上次确认的位置续读</text>

  <rect x="40" y="300" width="370" height="76" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="56" y="326" font-size="12.5" fill="#0f172a">3. 集群里还有 YARN 吗？</text>
  <text x="56" y="348" font-size="10.5" fill="#475569">只有 YARN 在，MapReduce 才跑得起来</text>
  <text x="56" y="368" font-size="10" fill="#b45309">否 → 往下问第 4 问</text>

  <rect x="490" y="300" width="470" height="76" rx="6" fill="#fef9c3" stroke="#fcd34d"/>
  <text x="506" y="326" font-size="12.5" fill="#78350f">Sqoop 1.4.x —— 交给 MapReduce 搬</text>
  <text x="506" y="348" font-size="10.5" fill="#334155">本机无 Hadoop 故无读数；并发单位是 map，靠 --split-by 切</text>
  <text x="506" y="368" font-size="10" fill="#475569">唯一记法 --last-value，而且它不会自己往前推进</text>

  <rect x="40" y="400" width="370" height="76" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="56" y="426" font-size="12.5" fill="#0f172a">4. 要引擎与检查点状态？</text>
  <text x="56" y="448" font-size="10.5" fill="#475569">多源、长跑、失败要能自动恢复到某个点</text>
  <text x="56" y="468" font-size="10" fill="#b45309">否 → 四问全否，见下方 DataX</text>

  <rect x="490" y="400" width="470" height="76" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="506" y="426" font-size="12.5" fill="#065f46">SeaTunnel 2.3.11 —— 要引擎与状态</text>
  <text x="506" y="448" font-size="10.5" fill="#334155">row.num 1000 × parallelism 2 = 2000 行，作业本身 3.01 s</text>
  <text x="506" y="468" font-size="10" fill="#475569">崩了回滚到最近一次完成的快照，引擎自己恢复</text>

  <defs>
    <marker id="dy" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
    <marker id="dyes" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker>
  </defs>

  <line x1="412" y1="138" x2="484" y2="138" stroke="#059669" stroke-width="1.8" marker-end="url(#dyes)"/>
  <rect x="434" y="112" width="28" height="22" rx="11" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="448" y="130" font-size="11" fill="#059669" text-anchor="middle">是</text>
  <line x1="412" y1="238" x2="484" y2="238" stroke="#059669" stroke-width="1.8" marker-end="url(#dyes)"/>
  <rect x="434" y="212" width="28" height="22" rx="11" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="448" y="230" font-size="11" fill="#059669" text-anchor="middle">是</text>
  <line x1="412" y1="338" x2="484" y2="338" stroke="#059669" stroke-width="1.8" marker-end="url(#dyes)"/>
  <rect x="434" y="312" width="28" height="22" rx="11" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="448" y="330" font-size="11" fill="#059669" text-anchor="middle">是</text>
  <line x1="412" y1="438" x2="484" y2="438" stroke="#059669" stroke-width="1.8" marker-end="url(#dyes)"/>
  <rect x="434" y="412" width="28" height="22" rx="11" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="448" y="430" font-size="11" fill="#059669" text-anchor="middle">是</text>

  <line x1="225" y1="176" x2="225" y2="196" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#dy)"/>
  <line x1="225" y1="276" x2="225" y2="296" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#dy)"/>
  <line x1="225" y1="376" x2="225" y2="396" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#dy)"/>
  <line x1="225" y1="476" x2="225" y2="510" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#dy)"/>
  <rect x="230" y="484" width="80" height="20" fill="#ffffff"/>
  <text x="236" y="498" font-size="10.5" fill="#64748b">四问全否</text>

  <rect x="40" y="512" width="920" height="88" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="58" y="538" font-size="12.5" fill="#1e3a8a">DataX 3.0 —— 只是把一次表搬过去</text>
  <text x="58" y="560" font-size="10.5" fill="#334155">5,000 行 / 161,864 B，端到端 11~27 s；channel 从 1 加到 6，task 从 1 涨到 31</text>
  <text x="58" y="580" font-size="10" fill="#475569">不记位点：增量靠外部把 where 条件传进来，所以它必须挂在调度系统上跑</text>
  <text x="58" y="596" font-size="10" fill="#b45309">固定开销比作业大：JVM 启动 2.1~3.4 s 加收尾 8.8 s，一天几次的小批不划算</text>

  <rect x="36" y="614" width="932" height="44" fill="#ffffff"/>
  <text x="40" y="628" font-size="10.5" fill="#64748b">读法：这张图定的是「源形态与时效」，与团队用什么语言无关；语言只影响配置怎么生成、由谁提交。</text>
  <text x="40" y="648" font-size="10.5" fill="#64748b">五个都不是互斥选项，同一条链上常是 Canal 抓增量、DataX 补全量、Flume 收日志、SeaTunnel 统一编排。</text>
</svg>
