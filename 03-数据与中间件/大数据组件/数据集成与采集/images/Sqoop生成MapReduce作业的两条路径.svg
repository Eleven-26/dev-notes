<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <rect x="30" y="20" width="940" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="45" font-size="17" fill="#0f172a">Sqoop 一次 import 的两条路径</text>
  <text x="46" y="65" font-size="11.5" fill="#475569">client 只做三步就退出，真正的数据搬运全在集群里跑；走哪条路由 --direct 与输出格式决定</text>

  <rect x="40" y="96" width="390" height="330" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="56" y="120" font-size="13.5" fill="#0f172a">client 端：三步，很快退出</text>

  <rect x="56" y="136" width="358" height="66" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="68" y="158" font-size="11.5" fill="#0f172a">第 1 步　取元数据</text>
  <text x="68" y="177" font-size="10" fill="#334155">连库读表结构、列类型、主键</text>
  <text x="68" y="193" font-size="10" fill="#475569">没有主键就拿不到可切分的键</text>

  <rect x="56" y="212" width="358" height="66" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="68" y="234" font-size="11.5" fill="#0f172a">第 2 步　切分区间</text>
  <text x="68" y="253" font-size="10" fill="#334155">按 --split-by（默认主键）切出 N 段</text>
  <text x="68" y="269" font-size="10" fill="#475569">键倾斜时其余 map 空跑，作业仍然成功</text>

  <rect x="56" y="288" width="358" height="66" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="68" y="310" font-size="11.5" fill="#0f172a">第 3 步　生成并提交作业</text>
  <text x="68" y="329" font-size="10" fill="#334155">拼出 MapReduce 作业，交给 YARN</text>
  <text x="68" y="345" font-size="10" fill="#475569">stdout 只到这一步，之后就不归它管</text>

  <text x="56" y="380" font-size="10.5" fill="#b45309">离开 MapReduce，Sqoop 就没有并发模型：</text>
  <text x="56" y="398" font-size="10.5" fill="#b45309">它的并发单位是 map，不是自己起的线程。</text>
  <text x="56" y="416" font-size="10.5" fill="#64748b">所以没有 YARN 的环境，第三条路也走不通。</text>

  <rect x="470" y="96" width="490" height="330" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="486" y="120" font-size="13.5" fill="#0f172a">集群端：两条数据路径</text>

  <rect x="486" y="136" width="458" height="118" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="500" y="160" font-size="12" fill="#1e3a8a">路径 A：常规 JDBC（不加 --direct 时的默认）</text>
  <text x="500" y="182" font-size="10.5" fill="#334155">map 逐个 JDBC 取行 → 序列化 → 写 HDFS</text>
  <text x="500" y="202" font-size="10.5" fill="#334155">每行都过一遍 JDBC 与序列化，代价在这里</text>
  <text x="500" y="222" font-size="10.5" fill="#334155">产物：part-m-0000N，文件数等于实际干活的 map 数</text>
  <text x="500" y="242" font-size="10" fill="#475569">文本 / Avro / Parquet / SequenceFile 都走这条</text>

  <rect x="486" y="270" width="458" height="118" rx="6" fill="#fef9c3" stroke="#fcd34d"/>
  <text x="500" y="294" font-size="12" fill="#78350f">路径 B：--direct</text>
  <text x="500" y="316" font-size="10.5" fill="#334155">map 调数据库原生导出工具（MySQL 是 mysqldump）</text>
  <text x="500" y="336" font-size="10.5" fill="#334155">快，但多数库的原生工具只吐文本</text>
  <text x="500" y="356" font-size="10.5" fill="#334155">与 --as-parquetfile 这类格式互斥</text>
  <text x="500" y="376" font-size="10" fill="#b45309">要列式格式就别加 --direct，二选一</text>

  <defs>
    <marker id="sq1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
    <marker id="sq2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
  </defs>

  <line x1="414" y1="333" x2="436" y2="333" stroke="#475569" stroke-width="1.6"/>
  <line x1="436" y1="195" x2="436" y2="333" stroke="#475569" stroke-width="1.6"/>
  <line x1="436" y1="195" x2="482" y2="195" stroke="#475569" stroke-width="1.6" marker-end="url(#sq1)"/>
  <line x1="436" y1="329" x2="482" y2="329" stroke="#475569" stroke-width="1.6" marker-end="url(#sq1)"/>
  <rect x="438" y="178" width="18" height="16" fill="#ffffff"/>
  <text x="444" y="188" font-size="9.5" fill="#475569">A</text>
  <rect x="438" y="312" width="18" height="16" fill="#ffffff"/>
  <text x="444" y="322" font-size="9.5" fill="#475569">B</text>

  <rect x="40" y="446" width="920" height="148" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="58" y="470" font-size="13" fill="#0f172a">同一件事要看两处日志：client 的 stdout 与 YARN 上的 map 计数</text>

  <text x="58" y="496" font-size="10.5" fill="#0f172a">阶段</text>
  <text x="250" y="496" font-size="10.5" fill="#0f172a">在哪跑</text>
  <text x="400" y="496" font-size="10.5" fill="#0f172a">看什么</text>
  <line x1="58" y1="502" x2="942" y2="502" stroke="#cbd5e1"/>

  <text x="58" y="520" font-size="10.5" fill="#334155">取元数据、切分区间</text>
  <text x="250" y="520" font-size="10.5" fill="#334155">client</text>
  <text x="400" y="520" font-size="10.5" fill="#334155">sqoop import 的 stdout 前几行</text>

  <text x="58" y="540" font-size="10.5" fill="#334155">生成并提交作业</text>
  <text x="250" y="540" font-size="10.5" fill="#334155">client → YARN</text>
  <text x="400" y="540" font-size="10.5" fill="#334155">application_ 开头的作业 id</text>

  <text x="58" y="560" font-size="10.5" fill="#334155">读库</text>
  <text x="250" y="560" font-size="10.5" fill="#334155">map 任务</text>
  <text x="400" y="560" font-size="10.5" fill="#334155">YARN 的 map 完成数与失败数</text>

  <text x="58" y="580" font-size="10.5" fill="#334155">写 HDFS</text>
  <text x="250" y="580" font-size="10.5" fill="#334155">map 任务</text>
  <text x="400" y="580" font-size="10.5" fill="#334155">目标目录下的 part-m-0000N 文件数</text>

  <rect x="36" y="610" width="932" height="24" fill="#ffffff"/>
  <text x="40" y="622" font-size="10.5" fill="#64748b">本篇没有任何本机读数：本机没有 Hadoop / YARN，Sqoop 起不来；图上所有内容按 1.4.x 系列参数名与官方文档陈述。</text>
</svg>
