<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <rect x="30" y="20" width="940" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="45" font-size="17" fill="#0f172a">checkpoint 落在哪、留几份、什么时候会超时</text>
  <text x="46" y="65" font-size="11.5" fill="#475569">配置写着 hdfs 但靠 file:/// 走本地；稳态留 max-retained 份，写入瞬间多一份；超时的原因是 sink 慢，不是数据多</text>

  <rect x="30" y="96" width="430" height="238" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="44" y="120" font-size="12" font-weight="bold" fill="#1e3a8a">落点：一处配置决定，别先看 type</text>

  <rect x="44" y="132" width="402" height="98" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="56" y="152" font-size="10" fill="#64748b">storage.type</text>
  <text x="160" y="152" font-size="10" fill="#1e293b">hdfs（名字而已）</text>
  <text x="56" y="174" font-size="10" fill="#64748b">fs.defaultFS</text>
  <text x="160" y="174" font-size="10" font-weight="bold" fill="#1e3a8a">file:///tmp/（真正的落点）</text>
  <text x="56" y="196" font-size="10" fill="#64748b">namespace</text>
  <text x="160" y="196" font-size="10" fill="#1e293b">/tmp/seatunnel/checkpoint_snapshot</text>
  <text x="56" y="218" font-size="10" fill="#64748b">max-retained</text>
  <text x="160" y="218" font-size="10" fill="#1e293b">3</text>

  <text x="44" y="252" font-size="10" fill="#1e293b">一次快照在磁盘上是一对文件：</text>
  <text x="44" y="272" font-size="10" fill="#1e293b">&lt;ts&gt;-&lt;rand&gt;-1-&lt;id&gt;.ser = 1342 B</text>
  <text x="44" y="292" font-size="10" fill="#1e293b">同名隐藏 .crc = 20 B</text>
  <text x="44" y="316" font-size="9.5" fill="#1d4ed8">所以「不装 HDFS 也能跑」不是 bug，是 fs.defaultFS 决定的</text>

  <rect x="476" y="96" width="494" height="238" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="490" y="120" font-size="12" font-weight="bold" fill="#78350f">保留窗口：稳态 3 份，写入瞬间 4 份</text>

  <rect x="490" y="136" width="104" height="72" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="504" y="160" font-size="10" fill="#92400e">第 1 份</text>
  <text x="504" y="180" font-size="9.5" fill="#64748b">最旧</text>
  <text x="504" y="198" font-size="9.5" fill="#64748b">下一个删它</text>

  <rect x="604" y="136" width="104" height="72" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="618" y="160" font-size="10" fill="#92400e">第 2 份</text>
  <text x="618" y="182" font-size="9.5" fill="#64748b">1342 B</text>

  <rect x="718" y="136" width="104" height="72" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="732" y="160" font-size="10" fill="#92400e">第 3 份</text>
  <text x="732" y="182" font-size="9.5" fill="#64748b">最新可用</text>

  <rect x="832" y="136" width="104" height="72" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="846" y="160" font-size="10" fill="#7f1d1d">写入中的</text>
  <text x="846" y="182" font-size="9.5" fill="#b91c1c">第 4 份</text>

  <text x="490" y="238" font-size="10.5" fill="#92400e">旧的那份要等新的写完才删，所以磁盘上</text>
  <text x="490" y="258" font-size="10.5" fill="#92400e">同时存在的最多是 max-retained + 1 份。</text>
  <text x="490" y="282" font-size="10.5" fill="#78350f">排查「为什么比算的多一份」，答案就在这。</text>
  <text x="490" y="308" font-size="9.5" fill="#b45309">恢复时找的是 id 最大的那份，不是修改时间最新的</text>

  <rect x="30" y="348" width="940" height="152" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="372" font-size="11.5" font-weight="bold" fill="#334155">时间轴：由间隔驱动，与有没有数据无关</text>

  <line x1="70" y1="416" x2="930" y2="416" stroke="#94a3b8" stroke-width="1.6"/>
  <circle cx="110" cy="416" r="5" fill="#16a34a"/>
  <circle cx="220" cy="416" r="5" fill="#16a34a"/>
  <circle cx="330" cy="416" r="5" fill="#16a34a"/>
  <circle cx="440" cy="416" r="5" fill="#16a34a"/>
  <circle cx="550" cy="416" r="5" fill="#16a34a"/>
  <circle cx="660" cy="416" r="5" fill="#16a34a"/>
  <circle cx="770" cy="416" r="5" fill="#16a34a"/>
  <circle cx="880" cy="416" r="5" fill="#16a34a"/>
  <text x="110" y="400" font-size="9.5" fill="#16a34a" text-anchor="middle">1</text>
  <text x="220" y="400" font-size="9.5" fill="#16a34a" text-anchor="middle">2</text>
  <text x="330" y="400" font-size="9.5" fill="#16a34a" text-anchor="middle">3</text>
  <text x="440" y="400" font-size="9.5" fill="#16a34a" text-anchor="middle">…</text>
  <text x="660" y="400" font-size="9.5" fill="#16a34a" text-anchor="middle">…</text>
  <text x="880" y="400" font-size="9.5" fill="#16a34a" text-anchor="middle">40</text>
  <text x="70" y="442" font-size="9.5" fill="#64748b">每 2.0 s 一轮（本机 interval 2000）</text>
  <text x="500" y="442" font-size="9.5" fill="#15803d">源只有 5 行时也照常快照：40 次全成功，无一次超时</text>
  <text x="70" y="468" font-size="10" fill="#1e293b">空转不省成本：快照开销全在协调与落盘，与数据量无关，所以 interval 越小固定成本越高</text>
  <text x="70" y="488" font-size="10" fill="#7f1d1d">慢 sink 的分支：60 s 内等不到 barrier 对齐 → Checkpoint expired → PendingCheckpoint.java:176</text>

  <rect x="30" y="514" width="460" height="86" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="44" y="538" font-size="11.5" font-weight="bold" fill="#7f1d1d">超时后会发生什么</text>
  <text x="44" y="560" font-size="10.5" fill="#1e293b">cleanPendingCheckpoint 把这轮作废</text>
  <text x="44" y="580" font-size="10.5" fill="#1e293b">release the task group resource → 作业失败</text>

  <rect x="510" y="514" width="460" height="86" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="524" y="538" font-size="11.5" font-weight="bold" fill="#14532d">批模式多一次收尾快照</text>
  <text x="524" y="560" font-size="10.5" fill="#15803d">id = 9223372036854775807（Long 最大值）</text>
  <text x="524" y="580" font-size="10.5" fill="#1e293b">见到它就说明「后面不会再有新快照」</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
</svg>
