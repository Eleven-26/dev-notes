<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <rect x="30" y="20" width="940" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="45" font-size="17" fill="#0f172a">SeaTunnel 册全景：一份 conf 拆成子任务，三道约束横向切过</text>
  <text x="46" y="65" font-size="11.5" fill="#475569">上半是 env 与 source 到 sink 的拆解路径，下半是并行度、checkpoint、连接器三块约束；三篇分别讲路径、状态、插件</text>

  <rect x="30" y="96" width="940" height="164" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="120" font-size="11.5" font-weight="bold" fill="#334155">主路径：一份 conf 走完五步，local 模式下全在同一个 JVM</text>

  <rect x="44" y="136" width="164" height="106" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="58" y="158" font-size="11" font-weight="bold" fill="#1e3a8a">① conf</text>
  <text x="58" y="180" font-size="10" fill="#1e293b">env / source</text>
  <text x="58" y="198" font-size="10" fill="#1e293b">transform / sink</text>
  <text x="58" y="220" font-size="9.5" fill="#64748b">HOCON，可注释</text>

  <rect x="240" y="136" width="164" height="106" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="254" y="158" font-size="11" font-weight="bold" fill="#1e3a8a">② 起引擎</text>
  <text x="254" y="180" font-size="10" fill="#1e293b">Hazelcast 5.1</text>
  <text x="254" y="198" font-size="10" fill="#1e293b">与 Engine 同 JVM</text>
  <text x="254" y="220" font-size="9.5" fill="#64748b">[localhost]:5801</text>

  <rect x="436" y="136" width="164" height="106" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="158" font-size="11" font-weight="bold" fill="#1e3a8a">③ 拆子任务</text>
  <text x="450" y="180" font-size="10" fill="#1e293b">切分器 1 个</text>
  <text x="450" y="198" font-size="10" fill="#1e293b">SourceTask N 个</text>
  <text x="450" y="220" font-size="9.5" fill="#64748b">parallelism 决定 N</text>

  <rect x="632" y="136" width="164" height="106" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="646" y="158" font-size="11" font-weight="bold" fill="#1e3a8a">④ 搬并快照</text>
  <text x="646" y="180" font-size="10" fill="#1e293b">子任务读、sink 写</text>
  <text x="646" y="198" font-size="10" fill="#1e293b">checkpoint 定时切</text>
  <text x="646" y="220" font-size="9.5" fill="#64748b">批：读完收尾</text>

  <rect x="828" y="136" width="128" height="106" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="842" y="158" font-size="11" font-weight="bold" fill="#1e3a8a">⑤ 结束</text>
  <text x="842" y="180" font-size="10" fill="#1e293b">批：FINISHED</text>
  <text x="842" y="198" font-size="10" fill="#1e293b">流：常驻</text>

  <line x1="208" y1="189" x2="236" y2="189" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="404" y1="189" x2="432" y2="189" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="600" y1="189" x2="628" y2="189" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="796" y1="189" x2="824" y2="189" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="30" y="280" width="300" height="204" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="44" y="304" font-size="12.5" font-weight="bold" fill="#1e3a8a">① 运行模型与 Local 模式</text>
  <text x="44" y="328" font-size="10.5" fill="#1e293b">local = Engine + Hazelcast 同 JVM</text>
  <text x="44" y="348" font-size="10.5" fill="#1e293b">四层对象：job 到 task</text>
  <text x="44" y="368" font-size="10.5" fill="#1e293b">row.num 按子任务计</text>
  <text x="44" y="388" font-size="10.5" fill="#1e293b">read-interval 是 split 间隔</text>
  <text x="44" y="412" font-size="10" font-weight="bold" fill="#1e3a8a">1000 × 2 = 2000 行</text>
  <text x="44" y="432" font-size="10" fill="#1e293b">45 s 跑完 999999 行</text>
  <text x="44" y="456" font-size="9.5" fill="#1d4ed8">作业 3.01 s，全程约 11 s</text>
  <text x="44" y="474" font-size="9.5" fill="#64748b">读序：第 1 读</text>

  <rect x="350" y="280" width="300" height="204" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="364" y="304" font-size="12.5" font-weight="bold" fill="#78350f">② 检查点与失败恢复</text>
  <text x="364" y="328" font-size="10.5" fill="#92400e">默认 hdfs，靠 file:/// 落地</text>
  <text x="364" y="348" font-size="10.5" fill="#92400e">快照 .ser 1342 B + .crc 20 B</text>
  <text x="364" y="368" font-size="10.5" fill="#92400e">max-retained 3 份</text>
  <text x="364" y="388" font-size="10.5" fill="#92400e">空转也照常快照</text>
  <text x="364" y="412" font-size="10" font-weight="bold" fill="#78350f">慢 sink 会拖到超时</text>
  <text x="364" y="432" font-size="10" fill="#92400e">40 次空转全成功</text>
  <text x="364" y="456" font-size="9.5" fill="#b45309">PendingCheckpoint.java:176</text>
  <text x="364" y="474" font-size="9.5" fill="#64748b">读序：第 2 读</text>

  <rect x="670" y="280" width="300" height="204" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="684" y="304" font-size="12.5" font-weight="bold" fill="#14532d">③ 连接器与配置排查</text>
  <text x="684" y="328" font-size="10.5" fill="#14532d">connectors 78 个条目</text>
  <text x="684" y="348" font-size="10.5" fill="#14532d">= 76 jar + 映射 + transforms</text>
  <text x="684" y="368" font-size="10.5" fill="#14532d">plugin-mapping 是名字到 jar</text>
  <text x="684" y="388" font-size="10.5" fill="#14532d">conf 四段不能互换</text>
  <text x="684" y="412" font-size="10" font-weight="bold" fill="#14532d">CDC 连接器 7 个</text>
  <text x="684" y="432" font-size="10" fill="#14532d">telemetry 默认 false</text>
  <text x="684" y="456" font-size="9.5" fill="#15803d">装 jar 不等于登记插件</text>
  <text x="684" y="474" font-size="9.5" fill="#64748b">读序：第 3 读</text>

  <rect x="30" y="504" width="940" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="528" font-size="11.5" fill="#0f172a">一句话：SeaTunnel 与 DataX 的分水岭是「谁持有运行时」——有了引擎才有子任务与 checkpoint，代价是常驻资源</text>
  <text x="46" y="550" font-size="10.5" fill="#64748b">本机读数：2.3.11 / Java 1.8.0_342 / Hazelcast 5.1，-e local，源与 sink 用镜像自带 FakeSource 与 Console</text>
  <text x="46" y="568" font-size="9.5" fill="#64748b">cluster / yarn / k8s 与真实连接器均未实测</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
</svg>
