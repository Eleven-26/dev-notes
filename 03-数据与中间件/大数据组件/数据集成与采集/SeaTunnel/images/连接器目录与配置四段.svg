<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <rect x="30" y="20" width="940" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="45" font-size="17" fill="#0f172a">连接器与配置四段：名字靠映射表变成 jar</text>
  <text x="46" y="65" font-size="11.5" fill="#475569">conf 四段各管一段；插件名 → 映射表 → connectors/ 里的 jar；78 个条目里 76 个是连接器本体</text>

  <rect x="40" y="96" width="440" height="340" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="56" y="120" font-size="13.5" fill="#0f172a">conf 的四段（HOCON）</text>

  <rect x="56" y="136" width="408" height="52" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="68" y="156" font-size="12" fill="#0f172a">env</text>
  <text x="68" y="176" font-size="10.5" fill="#334155">parallelism = 2 · job.mode = "BATCH" · checkpoint.interval = 2000</text>

  <rect x="56" y="196" width="408" height="52" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="68" y="216" font-size="12" fill="#0f172a">source</text>
  <text x="68" y="236" font-size="10.5" fill="#334155">FakeSource { plugin_output = "fake" · row.num = 1000 }</text>

  <rect x="56" y="256" width="408" height="52" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="68" y="276" font-size="12" fill="#0f172a">transform（可选）</text>
  <text x="68" y="296" font-size="10.5" fill="#334155">字段改名、过滤、SQL；要两端标签配对才接得上</text>

  <rect x="56" y="316" width="408" height="52" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="68" y="336" font-size="12" fill="#0f172a">sink</text>
  <text x="68" y="356" font-size="10.5" fill="#334155">Console {} —— 本机只跑过 Fake 与 Console 这一对</text>

  <text x="56" y="392" font-size="10.5" fill="#b45309">四段的键名不能互换：parallelism 写进 source 里，引擎不读它。</text>
  <text x="56" y="412" font-size="10.5" fill="#b45309">plugin_output 与 plugin_input 是串链路的标签，不是表名。</text>

  <rect x="520" y="96" width="440" height="340" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="536" y="120" font-size="13.5" fill="#0f172a">connectors/ 目录：78 个条目</text>

  <rect x="536" y="132" width="408" height="118" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="548" y="158" font-size="10.5" fill="#334155">connector-*.jar</text>
  <text x="932" y="158" font-size="10.5" fill="#0f172a" text-anchor="end">76 个</text>
  <text x="548" y="180" font-size="10.5" fill="#334155">plugin-mapping.properties</text>
  <text x="932" y="180" font-size="10.5" fill="#0f172a" text-anchor="end">1 个</text>
  <text x="548" y="202" font-size="10.5" fill="#334155">seatunnel-transforms-v2-*.jar</text>
  <text x="932" y="202" font-size="10.5" fill="#0f172a" text-anchor="end">1 个</text>
  <line x1="548" y1="212" x2="932" y2="212" stroke="#cbd5e1"/>
  <text x="548" y="234" font-size="10.5" fill="#0f172a">合计</text>
  <text x="932" y="234" font-size="10.5" fill="#0f172a" text-anchor="end">78 个</text>

  <rect x="536" y="262" width="408" height="112" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="548" y="284" font-size="10.5" fill="#0f172a">其中 CDC 7 个 —— 能力由 jar 给，不由引擎给</text>
  <text x="548" y="306" font-size="10" fill="#334155">MySQL · PostgreSQL · Oracle · SQL Server</text>
  <text x="548" y="326" font-size="10" fill="#334155">MongoDB · TiDB · openGauss</text>
  <text x="548" y="350" font-size="10" fill="#b45309">镜像里没有的那一类源，配多少参数也读不到</text>
  <text x="548" y="366" font-size="10" fill="#b45309">加插件要改两处：放 jar + 登记映射表</text>

  <text x="536" y="400" font-size="10.5" fill="#475569">装了 jar 却不登记映射表，是本节最容易踩的一处。</text>
  <text x="536" y="420" font-size="10.5" fill="#475569">这与 DataX 只需把插件目录放进去不同。</text>

  <rect x="30" y="452" width="940" height="150" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="46" y="476" font-size="13" fill="#0f172a">conf 里的名字怎么变成磁盘上的 jar（四步）</text>

  <rect x="46" y="492" width="190" height="72" rx="6" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="58" y="512" font-size="9.5" fill="#475569">source 段写的插件名</text>
  <text x="58" y="534" font-size="12" fill="#0f172a">FakeSource</text>
  <text x="58" y="552" font-size="9.5" fill="#475569">大小写敏感</text>

  <rect x="276" y="492" width="210" height="72" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="288" y="512" font-size="9.5" fill="#475569">查 plugin-mapping.properties</text>
  <text x="288" y="532" font-size="9" fill="#334155">FakeSource=</text>
  <text x="288" y="548" font-size="9" fill="#334155">connector-fake-2.3.11.jar</text>

  <rect x="526" y="492" width="230" height="72" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="538" y="512" font-size="9.5" fill="#475569">拼成 connectors/ 下的绝对路径</text>
  <text x="538" y="532" font-size="9" fill="#334155">/opt/seatunnel/connectors/</text>
  <text x="538" y="548" font-size="9" fill="#334155">connector-fake-2.3.11.jar</text>

  <rect x="796" y="492" width="158" height="72" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="808" y="512" font-size="9.5" fill="#475569">类加载器实例化</text>
  <text x="808" y="534" font-size="11" fill="#0f172a">FakeSource</text>
  <text x="808" y="552" font-size="9.5" fill="#475569">成为 source 插件</text>

  <defs>
    <marker id="ar1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
  <line x1="238" y1="528" x2="272" y2="528" stroke="#475569" stroke-width="1.6" marker-end="url(#ar1)"/>
  <line x1="488" y1="528" x2="522" y2="528" stroke="#475569" stroke-width="1.6" marker-end="url(#ar1)"/>
  <line x1="758" y1="528" x2="792" y2="528" stroke="#475569" stroke-width="1.6" marker-end="url(#ar1)"/>

  <text x="46" y="588" font-size="10.5" fill="#b45309">报「找不到插件」时答案在这张映射表上，不在目录里：目录扫描不是 SeaTunnel 的发现方式。</text>
</svg>
