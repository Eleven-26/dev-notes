<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="630" fill="#ffffff"/>

  <rect x="30" y="20" width="940" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="45" font-size="17" fill="#0f172a">「满」与「崩」是两个问题，四种组合各丢在不同的地方</text>
  <text x="46" y="65" font-size="11.5" fill="#475569">横向看是「channel 满了谁让路」，纵向看是「进程没了谁还记得」；同一份 1400 条数据，四种组合结果都不一样</text>

  <rect x="30" y="96" width="196" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="46" y="116" font-size="10.5" font-weight="bold" fill="#334155">按什么分</text>

  <rect x="240" y="96" width="360" height="30" rx="5" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="256" y="116" font-size="10.5" font-weight="bold" fill="#1e3a8a">情形一：channel 满了，source 还在推</text>

  <rect x="610" y="96" width="360" height="30" rx="5" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="626" y="116" font-size="10.5" font-weight="bold" fill="#1e3a8a">情形二：source 是「推」不是「拉」的那种</text>

  <rect x="30" y="132" width="196" height="182" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="44" y="160" font-size="11.5" font-weight="bold" fill="#78350f">满</text>
  <text x="44" y="184" font-size="10.5" fill="#78350f">channel 达到</text>
  <text x="44" y="202" font-size="10.5" fill="#78350f">capacity 上限</text>
  <text x="44" y="230" font-size="10.5" fill="#92400e">此时不是数据错，</text>
  <text x="44" y="248" font-size="10.5" fill="#92400e">是背压没处放</text>
  <text x="44" y="276" font-size="9.5" fill="#64748b">判据：ChannelFullException</text>
  <text x="44" y="294" font-size="9.5" fill="#64748b">或 source 侧重试日志</text>

  <rect x="240" y="132" width="360" height="182" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="254" y="156" font-size="11" font-weight="bold" fill="#14532d">spooldir：阻塞重试，一条不丢</text>
  <text x="254" y="180" font-size="10" fill="#1e293b">日志：channel is full</text>
  <text x="254" y="198" font-size="10" fill="#1e293b">will try again after 1000 milliseconds</text>
  <text x="254" y="222" font-size="10" fill="#1e293b">文件保持原名，不改成 .COMPLETED</text>
  <text x="254" y="246" font-size="10" fill="#1e293b">下一轮从头再读同一个文件</text>
  <text x="254" y="274" font-size="10" fill="#15803d">结果：不丢，但会卡住整条管道</text>
  <text x="254" y="296" font-size="9.5" fill="#64748b">代价是「吞吐掉到 0」而不是「数据少几行」</text>

  <rect x="610" y="132" width="360" height="182" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="624" y="156" font-size="11" font-weight="bold" fill="#7f1d1d">netcat：抛异常，整批丢</text>
  <text x="624" y="180" font-size="10" fill="#1e293b">ChannelFullException</text>
  <text x="624" y="198" font-size="10" fill="#1e293b">Space for commit to queue</text>
  <text x="624" y="216" font-size="10" fill="#1e293b">couldn't be acquired</text>
  <text x="624" y="240" font-size="10" fill="#1e293b">TCP 那头已经把数据发出来了，</text>
  <text x="624" y="258" font-size="10" fill="#1e293b">Flume 收下却没地方放 → 整批丢</text>
  <text x="624" y="284" font-size="10" fill="#b91c1c">结果：丢，且对端不知道</text>
  <text x="624" y="306" font-size="9.5" fill="#64748b">判据只能靠 channel 计数与日志比对</text>

  <rect x="30" y="326" width="196" height="182" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="44" y="354" font-size="11.5" font-weight="bold" fill="#7f1d1d">崩</text>
  <text x="44" y="378" font-size="10.5" fill="#7f1d1d">进程被 kill -9</text>
  <text x="44" y="396" font-size="10.5" fill="#7f1d1d">或容器被杀</text>
  <text x="44" y="424" font-size="10.5" fill="#b91c1c">此时不是事务错，</text>
  <text x="44" y="442" font-size="10.5" fill="#b91c1c">是「在途」没人记账</text>
  <text x="44" y="470" font-size="9.5" fill="#64748b">判据：重启后</text>
  <text x="44" y="488" font-size="9.5" fill="#64748b">Queue Size after replay</text>

  <rect x="240" y="326" width="360" height="182" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="254" y="350" font-size="11" font-weight="bold" fill="#7f1d1d">memory channel：全丢</text>
  <text x="254" y="374" font-size="10" fill="#1e293b">在途 1400 条全部消失</text>
  <text x="254" y="392" font-size="10" fill="#1e293b">重启后 channel 大小 0</text>
  <text x="254" y="416" font-size="10" fill="#1e293b">因为「在途」只存在内存里，</text>
  <text x="254" y="434" font-size="10" fill="#1e293b">没有任何文件记着它</text>
  <text x="254" y="462" font-size="11" font-weight="bold" fill="#b91c1c">结果：0 / 1400</text>
  <text x="254" y="484" font-size="9.5" fill="#64748b">事务在这里只保证「不半写」，不保证「不丢」</text>

  <rect x="610" y="326" width="360" height="182" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="624" y="350" font-size="11" font-weight="bold" fill="#14532d">file channel：全回放</text>
  <text x="624" y="374" font-size="10" fill="#1e293b">重启日志：</text>
  <text x="624" y="392" font-size="10" fill="#1e293b">Queue Size after replay: 1400</text>
  <text x="624" y="416" font-size="10" fill="#1e293b">inflightputs / inflighttakes 记着</text>
  <text x="624" y="434" font-size="10" fill="#1e293b">哪些「已取走但没提交」</text>
  <text x="624" y="462" font-size="11" font-weight="bold" fill="#15803d">结果：1400 / 1400</text>
  <text x="624" y="484" font-size="9.5" fill="#64748b">代价：每次写都要 fsync，落盘位置影响接近 5 倍</text>

  <rect x="30" y="520" width="460" height="94" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="544" font-size="11.5" font-weight="bold" fill="#334155">怎么选（两问定完）</text>
  <text x="44" y="566" font-size="10.5" fill="#1e293b">要「不丢」→ file channel + 可重放的 source</text>
  <text x="44" y="586" font-size="10.5" fill="#1e293b">能容忍丢一批 → memory channel 换吞吐</text>
  <text x="44" y="606" font-size="9.5" fill="#64748b">两样本机都跑过：1,400 条、kill -9 后看回放</text>

  <rect x="510" y="520" width="460" height="94" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="524" y="544" font-size="11.5" font-weight="bold" fill="#334155">四个现场数字</text>
  <text x="524" y="566" font-size="10.5" fill="#1e293b">channel 容量与当前大小</text>
  <text x="524" y="586" font-size="10.5" fill="#1e293b">source 重试次数 / sink 成功批次</text>
  <text x="524" y="606" font-size="9.5" fill="#64748b">三组数字对不上，就说明有在途事件卡在中间</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
</svg>
