<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <rect x="30" y="20" width="940" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="45" font-size="17" fill="#0f172a">Flume 册全景：三件套串一条管道，两个事务各管一段</text>
  <text x="46" y="65" font-size="11.5" fill="#475569">source 把事件放进 channel、sink 从 channel 取走并提交；两段各自成事务，所以「丢」只会丢在没提交的那一段</text>

  <rect x="30" y="96" width="940" height="196" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="120" font-size="11.5" font-weight="bold" fill="#334155">一条 agent 内的三段：中间那一段才是缓冲</text>

  <rect x="44" y="134" width="212" height="140" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="58" y="158" font-size="12" font-weight="bold" fill="#1e3a8a">source</text>
  <text x="58" y="182" font-size="10.5" fill="#1e293b">spooldir：目录文件</text>
  <text x="58" y="202" font-size="10.5" fill="#1e293b">netcat：TCP 行</text>
  <text x="58" y="222" font-size="10.5" fill="#1e293b">taildir / kafka / exec</text>
  <text x="58" y="250" font-size="9.5" fill="#64748b">判据在「能不能重放」</text>

  <rect x="394" y="134" width="212" height="140" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="408" y="158" font-size="12" font-weight="bold" fill="#78350f">channel</text>
  <text x="408" y="182" font-size="10.5" fill="#1e293b">memory：内存，快但会丢</text>
  <text x="408" y="202" font-size="10.5" fill="#1e293b">file：落盘，崩了能回放</text>
  <text x="408" y="222" font-size="10.5" fill="#1e293b">capacity 10000</text>
  <text x="408" y="242" font-size="10.5" fill="#1e293b">transactionCapacity 1000</text>
  <text x="408" y="264" font-size="9.5" fill="#92400e">事务边界就在这一层</text>

  <rect x="744" y="134" width="212" height="140" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="758" y="158" font-size="12" font-weight="bold" fill="#1e3a8a">sink</text>
  <text x="758" y="182" font-size="10.5" fill="#1e293b">avro：串下一跳 agent</text>
  <text x="758" y="202" font-size="10.5" fill="#1e293b">hdfs / kafka / file_roll</text>
  <text x="758" y="222" font-size="10.5" fill="#1e293b">batchSize 10</text>
  <text x="758" y="250" font-size="9.5" fill="#64748b">提交成功才让 channel 删事件</text>

  <line x1="256" y1="204" x2="390" y2="204" stroke="#475569" stroke-width="1.8" marker-end="url(#a1)"/>
  <line x1="606" y1="204" x2="740" y2="204" stroke="#475569" stroke-width="1.8" marker-end="url(#a1)"/>
  <text x="272" y="196" font-size="10" fill="#475569">put（事务一）</text>
  <text x="622" y="196" font-size="10" fill="#475569">take + commit（事务二）</text>

  <rect x="30" y="312" width="300" height="176" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="44" y="336" font-size="12.5" font-weight="bold" fill="#1e3a8a">① 运行模型与事务</text>
  <text x="44" y="360" font-size="10.5" fill="#1e293b">channel 是事务边界，不是队列</text>
  <text x="44" y="380" font-size="10.5" fill="#1e293b">三个容量参数谁管谁</text>
  <text x="44" y="400" font-size="10.5" fill="#1e293b">file channel 落盘结构</text>
  <text x="44" y="420" font-size="10.5" fill="#1e293b">log-1 1048576 B</text>
  <text x="44" y="440" font-size="10.5" fill="#1e293b">checkpoint 88232 B</text>
  <text x="44" y="462" font-size="9.5" fill="#1d4ed8">绑挂 43.35 s 对 volume 9.38 s</text>
  <text x="44" y="480" font-size="9.5" fill="#64748b">读序：第 1 读</text>

  <rect x="350" y="312" width="300" height="176" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="364" y="336" font-size="12.5" font-weight="bold" fill="#7f1d1d">② 通道满与崩溃</text>
  <text x="364" y="360" font-size="10.5" fill="#1e293b">「满」与「崩」是两个问题</text>
  <text x="364" y="380" font-size="10.5" fill="#1e293b">满：spooldir 阻塞重试</text>
  <text x="364" y="400" font-size="10.5" fill="#1e293b">满：netcat 抛异常丢整批</text>
  <text x="364" y="420" font-size="10.5" fill="#1e293b">崩：memory 0 / 1400</text>
  <text x="364" y="440" font-size="10.5" fill="#1e293b">崩：file 1400 / 1400</text>
  <text x="364" y="462" font-size="9.5" fill="#b91c1c">1,400 条 / kill -9 重启看回放</text>
  <text x="364" y="480" font-size="9.5" fill="#64748b">读序：第 2 读</text>

  <rect x="670" y="312" width="300" height="176" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="684" y="336" font-size="12.5" font-weight="bold" fill="#14532d">③ 采集配置与排查</text>
  <text x="684" y="360" font-size="10.5" fill="#1e293b">选 source 就是选「能不能重放」</text>
  <text x="684" y="380" font-size="10.5" fill="#1e293b">channel 与 sink 怎么配</text>
  <text x="684" y="400" font-size="10.5" fill="#1e293b">interceptor 是改事件的唯一位置</text>
  <text x="684" y="420" font-size="10.5" fill="#1e293b">本机实测用的三份 conf</text>
  <text x="684" y="440" font-size="10.5" fill="#1e293b">故障速查 6 条</text>
  <text x="684" y="462" font-size="9.5" fill="#15803d">Flume 1.8.0 单 agent</text>
  <text x="684" y="480" font-size="9.5" fill="#64748b">读序：第 3 读</text>

  <rect x="30" y="508" width="940" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="532" font-size="11.5" fill="#0f172a">一句话：Flume 保证的是「事务内不丢」，不是「端到端不丢」——没提交的那批、以及 sink 已写但未提交的那批，都可能重复</text>
  <text x="46" y="554" font-size="10.5" fill="#64748b">所以选型的第一问不是「支持哪些源」，而是「这个源丢了能不能重来」</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
</svg>
