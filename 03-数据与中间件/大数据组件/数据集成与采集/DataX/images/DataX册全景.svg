<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <rect x="30" y="20" width="940" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="45" font-size="17" fill="#0f172a">DataX 册全景：一条作业路径 + 三道横向约束</text>
  <text x="46" y="65" font-size="11.5" fill="#475569">上半是一份 job.json 到目标库的拆解路径，下半是限速、脏数据阈值、插件三块约束；三篇分别讲路径、闸门、插件</text>

  <rect x="30" y="96" width="940" height="152" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="120" font-size="11.5" font-weight="bold" fill="#334155">主路径：五步，进程跑完即退出</text>

  <rect x="44" y="134" width="160" height="94" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="58" y="156" font-size="12" font-weight="bold" fill="#1e3a8a">① job.json</text>
  <text x="58" y="180" font-size="10.5" fill="#1e293b">content.reader</text>
  <text x="58" y="198" font-size="10.5" fill="#1e293b">content.writer</text>
  <text x="58" y="216" font-size="10.5" fill="#64748b">setting.speed</text>

  <rect x="244" y="134" width="160" height="94" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="258" y="156" font-size="12" font-weight="bold" fill="#1e3a8a">② 拆解</text>
  <text x="258" y="180" font-size="10.5" fill="#1e293b">job → taskGroup</text>
  <text x="258" y="198" font-size="10.5" fill="#1e293b">→ task</text>
  <text x="258" y="216" font-size="10.5" fill="#64748b">splitPk 决定 task 数</text>

  <rect x="444" y="134" width="160" height="94" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="458" y="156" font-size="12" font-weight="bold" fill="#1e3a8a">③ task + channel</text>
  <text x="458" y="180" font-size="10.5" fill="#1e293b">channel 1/2/3/6</text>
  <text x="458" y="198" font-size="10.5" fill="#1e293b">→ task 1/11/16/31</text>
  <text x="458" y="216" font-size="10.5" fill="#64748b">不成 1:1</text>

  <rect x="644" y="134" width="160" height="94" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="658" y="156" font-size="12" font-weight="bold" fill="#1e3a8a">④ 搬数</text>
  <text x="658" y="180" font-size="10.5" fill="#1e293b">窗口 1.25~2.45 s</text>
  <text x="658" y="198" font-size="10.5" fill="#1e293b">5000 行 / 161864 B</text>
  <text x="658" y="216" font-size="10.5" fill="#64748b">收尾固定 8.8 s</text>

  <rect x="844" y="134" width="112" height="94" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="858" y="156" font-size="12" font-weight="bold" fill="#1e3a8a">⑤ 退出</text>
  <text x="858" y="180" font-size="10.5" fill="#1e293b">端到端 11~13 s</text>
  <text x="858" y="198" font-size="10.5" fill="#1e293b">不记位点</text>

  <line x1="204" y1="181" x2="240" y2="181" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="404" y1="181" x2="440" y2="181" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="604" y1="181" x2="640" y2="181" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="804" y1="181" x2="840" y2="181" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="30" y="266" width="300" height="196" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="44" y="290" font-size="12.5" font-weight="bold" fill="#1e3a8a">闸门一：speed 节流</text>
  <text x="44" y="314" font-size="10.5" fill="#1e293b">只写总 bps 就直接失败</text>
  <text x="44" y="334" font-size="10.5" fill="#1e293b">Framework-03 要求单 channel bps</text>
  <text x="44" y="354" font-size="10.5" fill="#1e293b">标称 50 KB/s → 上报 7.90 KB/s</text>
  <text x="44" y="374" font-size="10.5" fill="#1e293b">标称 100 KB/s → 上报 15.81 KB/s</text>
  <text x="44" y="394" font-size="10.5" fill="#1e293b">框架按比值反算 channel 数</text>
  <text x="44" y="424" font-size="9.5" fill="#1d4ed8">读：限速与脏数据处理.md</text>
  <text x="44" y="444" font-size="9.5" fill="#64748b">标称值不等于吞吐</text>

  <rect x="350" y="266" width="300" height="196" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="364" y="290" font-size="12.5" font-weight="bold" fill="#7f1d1d">闸门二：errorLimit 否决</text>
  <text x="364" y="314" font-size="10.5" fill="#1e293b">阈值 0：Framework-14 中止</text>
  <text x="364" y="334" font-size="10.5" fill="#1e293b">捕获 767 条脏数据，退出码 1</text>
  <text x="364" y="354" font-size="10.5" fill="#1e293b">阈值 6000：Error 5000 = Total 5000</text>
  <text x="364" y="374" font-size="10.5" fill="#1e293b">目标表零新增，但退出码 0</text>
  <text x="364" y="394" font-size="10.5" fill="#7f1d1d">成功退出不等于写成功</text>
  <text x="364" y="424" font-size="9.5" fill="#b91c1c">读：限速与脏数据处理.md</text>
  <text x="364" y="444" font-size="9.5" fill="#64748b">两个阈值：record 与 percentage</text>

  <rect x="670" y="266" width="300" height="196" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="684" y="290" font-size="12.5" font-weight="bold" fill="#14532d">横切：插件决定能力</text>
  <text x="684" y="314" font-size="10.5" fill="#1e293b">30 个 reader + 39 个 writer</text>
  <text x="684" y="334" font-size="10.5" fill="#1e293b">包体 1.65 GB，解压 1.8 GB</text>
  <text x="684" y="354" font-size="10.5" fill="#1e293b">自带 mysql 驱动 5.1.47</text>
  <text x="684" y="374" font-size="10.5" fill="#1e293b">每轮 7 条 SSLException 告警</text>
  <text x="684" y="394" font-size="10.5" fill="#1e293b">作业仍成功，不算故障</text>
  <text x="684" y="424" font-size="9.5" fill="#15803d">读：插件与配置排查.md</text>
  <text x="684" y="444" font-size="9.5" fill="#64748b">引擎只调度，读写全在插件</text>

  <rect x="30" y="486" width="940" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="510" font-size="11.5" fill="#0f172a">一句话：DataX 不记位点，所以它只适合「搬一个快照」——增量、重跑幂等、调度全部由外面补</text>
  <text x="46" y="530" font-size="10.5" fill="#64748b">三篇读序：运行模型与作业拆解 → 限速与脏数据处理 → 插件与配置排查</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
</svg>
