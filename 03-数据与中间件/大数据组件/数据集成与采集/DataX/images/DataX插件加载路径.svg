<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <rect x="30" y="20" width="940" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="45" font-size="17" fill="#0f172a">DataX 的插件加载路径：目录决定能力，驱动决定连通</text>
  <text x="46" y="65" font-size="11.5" fill="#475569">引擎只负责调度，reader 与 writer 都是目录里的插件；插件装上了还要看 lib 里的数据库驱动对不对版本</text>

  <rect x="30" y="96" width="292" height="330" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="120" font-size="11.5" font-weight="bold" fill="#334155">包解压后的五个目录</text>

  <rect x="44" y="134" width="264" height="278" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="58" y="158" font-size="10.5" font-weight="bold" fill="#1e3a8a">DATAX-OPENSOURCE-3.0</text>
  <text x="58" y="182" font-size="10.5" fill="#1e293b">├─ bin/</text>
  <text x="58" y="202" font-size="10" fill="#64748b">│   datax.py 只是拼 java 命令</text>
  <text x="58" y="226" font-size="10.5" fill="#1e293b">├─ conf/</text>
  <text x="58" y="246" font-size="10" fill="#64748b">│   core.json 单 channel bps</text>
  <text x="58" y="270" font-size="10.5" fill="#1e293b">├─ lib/</text>
  <text x="58" y="290" font-size="10" fill="#dc2626">│   数据库驱动放这里</text>
  <text x="58" y="314" font-size="10.5" font-weight="bold" fill="#15803d">├─ plugin/</text>
  <text x="58" y="334" font-size="10" fill="#15803d">│   30 个 reader + 39 个 writer</text>
  <text x="58" y="358" font-size="10.5" fill="#1e293b">└─ job/</text>
  <text x="58" y="378" font-size="10" fill="#64748b">    自己写的 job.json</text>
  <text x="58" y="400" font-size="9.5" fill="#64748b">包体 1.65 GB，解压 1.8 GB</text>

  <rect x="344" y="96" width="300" height="330" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="358" y="120" font-size="11.5" font-weight="bold" fill="#1e3a8a">加载三步：名字 → 目录 → 类路径</text>

  <rect x="358" y="136" width="272" height="76" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="370" y="158" font-size="10.5" font-weight="bold" fill="#1e3a8a">① job.json 里写名字</text>
  <text x="370" y="178" font-size="10" fill="#1e293b">reader.name = mysqlreader</text>
  <text x="370" y="196" font-size="10" fill="#64748b">writer.name = mysqlwriter</text>

  <rect x="358" y="224" width="272" height="76" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="370" y="246" font-size="10.5" font-weight="bold" fill="#1e3a8a">② 拼出插件目录</text>
  <text x="370" y="266" font-size="10" fill="#1e293b">plugin/reader/mysqlreader/</text>
  <text x="370" y="284" font-size="10" fill="#64748b">该目录下有插件主 jar 与 libs/</text>

  <rect x="358" y="312" width="272" height="76" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="370" y="334" font-size="10.5" font-weight="bold" fill="#1e3a8a">③ 目录不存在即失败</text>
  <text x="370" y="354" font-size="10" fill="#1e293b">装插件 = 建目录 + 放 jar</text>
  <text x="370" y="372" font-size="10" fill="#64748b">不是改配置，是往磁盘上放文件</text>

  <rect x="358" y="400" width="272" height="16" rx="3" fill="#eff6ff"/>

  <rect x="656" y="96" width="314" height="330" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="670" y="120" font-size="11.5" font-weight="bold" fill="#14532d">读写参数不对称（同一插件族内）</text>

  <rect x="670" y="132" width="286" height="24" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="682" y="149" font-size="10" font-weight="bold" fill="#14532d">项</text>
  <text x="792" y="149" font-size="10" font-weight="bold" fill="#14532d">reader</text>
  <text x="884" y="149" font-size="10" font-weight="bold" fill="#14532d">writer</text>

  <text x="682" y="178" font-size="10" fill="#1e293b">取行条件</text>
  <text x="792" y="178" font-size="10" fill="#1e293b">splitPk</text>
  <text x="884" y="178" font-size="10" fill="#1e293b">无</text>

  <text x="682" y="202" font-size="10" fill="#1e293b">SQL 自定义</text>
  <text x="792" y="202" font-size="10" fill="#1e293b">querySql</text>
  <text x="884" y="202" font-size="10" fill="#1e293b">无</text>

  <text x="682" y="226" font-size="10" fill="#1e293b">写入策略</text>
  <text x="792" y="226" font-size="10" fill="#1e293b">无</text>
  <text x="884" y="226" font-size="10" fill="#1e293b">writeMode</text>

  <text x="682" y="250" font-size="10" fill="#1e293b">列映射</text>
  <text x="792" y="250" font-size="10" fill="#1e293b">column</text>
  <text x="884" y="250" font-size="10" fill="#1e293b">column</text>

  <text x="670" y="286" font-size="10.5" fill="#1e293b">同一个数据库，读与写要的键不是同一批：</text>
  <text x="670" y="306" font-size="10.5" fill="#1e293b">照抄 reader 的 JSON 改成 writer，</text>
  <text x="670" y="326" font-size="10.5" fill="#7f1d1d">会静默丢掉切分与查询条件。</text>
  <text x="670" y="352" font-size="10.5" fill="#1e293b">驱动版本另算一笔：</text>
  <text x="670" y="372" font-size="10.5" fill="#1e293b">自带 mysql 驱动 5.1.47，</text>
  <text x="670" y="392" font-size="10.5" fill="#1e293b">对 MySQL 8 每轮 7 条 SSLException</text>
  <text x="670" y="412" font-size="9.5" fill="#15803d">作业仍成功，属告警不属故障</text>

  <rect x="30" y="446" width="470" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="470" font-size="11.5" font-weight="bold" fill="#334155">不起 Launcher 也能直接跑</text>
  <text x="44" y="494" font-size="10.5" fill="#1e293b">容器里没有 python 时，datax.py 用不了</text>
  <text x="44" y="514" font-size="10.5" fill="#1e293b">直接调 Engine 主类即可，参数与脚本拼的一致</text>
  <text x="44" y="534" font-size="10" fill="#64748b">-mode standalone -jobid -1 -job job.json</text>
  <text x="44" y="552" font-size="9.5" fill="#64748b">本机即用这条路跑出全部读数</text>

  <rect x="514" y="446" width="456" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="528" y="470" font-size="11.5" font-weight="bold" fill="#334155">判据：能力在插件，不在引擎</text>
  <text x="528" y="494" font-size="10.5" fill="#1e293b">换一个源 = 装一个 reader 插件，不改引擎</text>
  <text x="528" y="514" font-size="10.5" fill="#1e293b">插件没装 = 目录缺失，报错直接指向路径</text>
  <text x="528" y="534" font-size="10.5" fill="#1e293b">驱动没放 = 连得上协议、认不出库</text>
  <text x="528" y="552" font-size="9.5" fill="#64748b">两类失败长得不一样，别混成一类查</text>

  <rect x="30" y="572" width="940" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="46" y="597" font-size="11.5" fill="#0f172a">一句话：装插件是「往磁盘放目录」，配作业是「写名字」——两件事分开做，错了才分得清是哪一步</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
</svg>
