<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" width="1000" height="392" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="392" fill="#ffffff"/>
<title>同一张 Hive 表被 Hive 与 Spark 渲染成两种方言</title>
<desc>中间是 HMS 里真实存的一行元数据：库名、表名、SerDe、InputFormat、Location、表类型。左边 Hive 4.0.0 把它渲染成 CREATE EXTERNAL TABLE 加 ROW FORMAT SERDE 加 TRANSLATED_TO_EXTERNAL，右边 Spark 3.5.5 渲染成 CREATE TABLE 加 USING parquet。两侧读的是同一行记录。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g transform="scale(1.470588)">

<text x="40" y="42" font-family="var(--font-sans)" font-size="12" fill="#85B7EB" dominant-baseline="central">Hive 4.0.0 的 SHOW CREATE TABLE</text>
<rect x="40" y="54" width="190" height="136" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="54" y="72" font-family="var(--font-mono)" font-size="11" fill="#E6F1FB" dominant-baseline="central">CREATE EXTERNAL TABLE</text>
<text x="54" y="92" font-family="var(--font-mono)" font-size="11" fill="#E6F1FB" dominant-baseline="central">ROW FORMAT SERDE</text>
<text x="54" y="112" font-family="var(--font-mono)" font-size="11" fill="#B5D4F4" dominant-baseline="central">ParquetHiveSerDe</text>
<text x="54" y="132" font-family="var(--font-mono)" font-size="11" fill="#E6F1FB" dominant-baseline="central">STORED AS INPUTFORMAT</text>
<text x="54" y="152" font-family="var(--font-mono)" font-size="11" fill="#E6F1FB" dominant-baseline="central">LOCATION file:/...</text>
<text x="54" y="172" font-family="var(--font-mono)" font-size="11" fill="#FAC775" dominant-baseline="central">TRANSLATED_TO_EXTERNAL</text>

<text x="250" y="42" font-family="var(--font-sans)" font-size="12" fill="#EF9F27" dominant-baseline="central">HMS 里的那一行记录</text>
<rect x="250" y="54" width="180" height="136" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/>
<text x="262" y="72" font-family="var(--font-mono)" font-size="11" fill="#FAEEDA" dominant-baseline="central">db_name = lab</text>
<text x="262" y="92" font-family="var(--font-mono)" font-size="11" fill="#FAEEDA" dominant-baseline="central">tbl_name = orders</text>
<text x="262" y="112" font-family="var(--font-mono)" font-size="11" fill="#FAEEDA" dominant-baseline="central">serde = Parquet...</text>
<text x="262" y="132" font-family="var(--font-mono)" font-size="11" fill="#FAEEDA" dominant-baseline="central">input_format = ...</text>
<text x="262" y="152" font-family="var(--font-mono)" font-size="11" fill="#FAEEDA" dominant-baseline="central">location = file:/...</text>
<text x="262" y="172" font-family="var(--font-mono)" font-size="11" fill="#FAEEDA" dominant-baseline="central">tbl_type = EXTERNAL</text>

<text x="450" y="42" font-family="var(--font-sans)" font-size="12" fill="#85B7EB" dominant-baseline="central">Spark 3.5.5 的 SHOW CREATE TABLE</text>
<rect x="450" y="54" width="190" height="136" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="464" y="72" font-family="var(--font-mono)" font-size="11" fill="#E6F1FB" dominant-baseline="central">CREATE TABLE</text>
<text x="464" y="92" font-family="var(--font-mono)" font-size="11" fill="#E6F1FB" dominant-baseline="central">USING parquet</text>
<text x="464" y="112" font-family="var(--font-mono)" font-size="11" fill="#E6F1FB" dominant-baseline="central">PARTITIONED BY (dt)</text>
<text x="464" y="132" font-family="var(--font-mono)" font-size="11" fill="#E6F1FB" dominant-baseline="central">TBLPROPERTIES (</text>
<text x="464" y="152" font-family="var(--font-mono)" font-size="11" fill="#B5D4F4" dominant-baseline="central">transient_lastDdlTime</text>
<text x="464" y="172" font-family="var(--font-mono)" font-size="11" fill="#E6F1FB" dominant-baseline="central">)</text>

<line x1="248" y1="122" x2="234" y2="122" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="432" y1="122" x2="446" y2="122" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#ar)"/>

<line x1="40" y1="210" x2="640" y2="210" stroke="#888780" stroke-width="0.5" stroke-dasharray="2 4"/>

<text x="40" y="228" font-family="var(--font-sans)" font-size="12" fill="#B4B2A9" dominant-baseline="central">同一行元数据，两种方言：SerDe 描述一直都在，只是 Spark 的 DDL 不再展示它</text>
<text x="40" y="248" font-family="var(--font-sans)" font-size="12" fill="#FAC775" dominant-baseline="central">判断表类型与存储格式看 DESCRIBE FORMATTED，不要用 SHOW CREATE TABLE 下结论</text>
</g>
</svg>
