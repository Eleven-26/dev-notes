<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">xDS 四类资源的引用链：监听器 → 路由 → 集群 → 端点</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">箭头方向就是配置的引用方向；被引用者必须先存在，否则整份配置被拒</text>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="24" y="92" width="952" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="500" y="116" font-size="13" fill="#475569" text-anchor="middle">分四层不是为了好看：四类东西的变化频率差三个数量级，拆开才能只推变的那一层</text>
  <rect x="24" y="152" width="214" height="208" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="42" y="182" font-size="19" fill="#1d4ed8" text-anchor="start" font-weight="bold">LDS</text>
  <text x="42" y="208" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">监听器</text>
  <line x1="40" y1="220" x2="222" y2="220" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="42" y="242" font-size="10.5" fill="#94a3b8" text-anchor="start">nginx 对应</text>
  <text x="42" y="261" font-size="12" fill="#334155" text-anchor="start">listen + server</text>
  <text x="42" y="292" font-size="10.5" fill="#94a3b8" text-anchor="start">管什么</text>
  <text x="42" y="311" font-size="12" fill="#334155" text-anchor="start">端口与 filter 链</text>
  <text x="42" y="340" font-size="12.5" fill="#1d4ed8" text-anchor="start" font-weight="bold">几月改一次</text>
  <rect x="270" y="152" width="214" height="208" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="288" y="182" font-size="19" fill="#6d28d9" text-anchor="start" font-weight="bold">RDS</text>
  <text x="288" y="208" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">路由</text>
  <line x1="286" y1="220" x2="468" y2="220" stroke="#ddd6fe" stroke-width="1.2"/>
  <text x="288" y="242" font-size="10.5" fill="#94a3b8" text-anchor="start">nginx 对应</text>
  <text x="288" y="261" font-size="12" fill="#334155" text-anchor="start">location</text>
  <text x="288" y="292" font-size="10.5" fill="#94a3b8" text-anchor="start">管什么</text>
  <text x="288" y="311" font-size="12" fill="#334155" text-anchor="start">host / path → cluster</text>
  <text x="288" y="340" font-size="12.5" fill="#6d28d9" text-anchor="start" font-weight="bold">一天改几次</text>
  <rect x="516" y="152" width="214" height="208" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="534" y="182" font-size="19" fill="#c2410c" text-anchor="start" font-weight="bold">CDS</text>
  <text x="534" y="208" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">集群</text>
  <line x1="532" y1="220" x2="714" y2="220" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="534" y="242" font-size="10.5" fill="#94a3b8" text-anchor="start">nginx 对应</text>
  <text x="534" y="261" font-size="12" fill="#334155" text-anchor="start">upstream</text>
  <text x="534" y="292" font-size="10.5" fill="#94a3b8" text-anchor="start">管什么</text>
  <text x="534" y="311" font-size="12" fill="#334155" text-anchor="start">LB 策略 / 超时 / 摘除</text>
  <text x="534" y="340" font-size="12.5" fill="#c2410c" text-anchor="start" font-weight="bold">随版本变</text>
  <rect x="762" y="152" width="214" height="208" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="780" y="182" font-size="19" fill="#b91c1c" text-anchor="start" font-weight="bold">EDS</text>
  <text x="780" y="208" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">端点</text>
  <line x1="778" y1="220" x2="960" y2="220" stroke="#fecaca" stroke-width="1.2"/>
  <text x="780" y="242" font-size="10.5" fill="#94a3b8" text-anchor="start">nginx 对应</text>
  <text x="780" y="261" font-size="12" fill="#334155" text-anchor="start">upstream 的 server</text>
  <text x="780" y="292" font-size="10.5" fill="#94a3b8" text-anchor="start">管什么</text>
  <text x="780" y="311" font-size="12" fill="#334155" text-anchor="start">具体 IP:port</text>
  <text x="780" y="340" font-size="12.5" fill="#b91c1c" text-anchor="start" font-weight="bold">每秒在变</text>
  <line x1="240" y1="256" x2="268" y2="256" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="486" y1="256" x2="514" y2="256" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="732" y1="256" x2="760" y2="256" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="500" y="392" font-size="13" fill="#334155" text-anchor="middle">读法：扩缩容只推 EDS（端点变了），路由规则改动只推 RDS —— 都不需要重推整份配置</text>
  <text x="500" y="432" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">与 nginx 的三处结构性差别</text>
  <rect x="24" y="452" width="300" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="40" y="478" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">配置文件整份解析</text>
  <text x="40" y="502" font-size="12" fill="#475569" text-anchor="start">改一条路由 = 一份新文件 + reload</text>
  <rect x="350" y="452" width="300" height="74" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="366" y="478" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">按资源类型分别推送</text>
  <text x="366" y="502" font-size="12" fill="#15803d" text-anchor="start">改路由不影响已有连接</text>
  <rect x="676" y="452" width="300" height="74" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="692" y="478" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">被拒时不崩</text>
  <text x="692" y="502" font-size="12" fill="#1d4ed8" text-anchor="start">配置非法 → 保留旧配置（NACK）</text>
  <rect x="24" y="552" width="952" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="500" y="581" font-size="12.5" fill="#b45309" text-anchor="middle" font-weight="bold">注意：热更新是 xDS 的能力，不是 Envoy 的默认行为 —— 用 -c 静态启动时，改文件仍然要重启进程</text>
</svg>
