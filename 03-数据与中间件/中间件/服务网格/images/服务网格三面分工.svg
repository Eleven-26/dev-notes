<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">服务网格的三面分工：谁写配置、谁翻译、谁执行</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">本目录只写右侧「产品怎么配」；分层原理在 04，要不要上在 06</text>
  <rect x="40" y="90" width="280" height="132" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="118" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">① 配置入口</text>
  <text x="56" y="140" font-size="12" fill="#334155" text-anchor="start">人写的 CRD</text>
  <line x1="54" y1="152" x2="306" y2="152" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="174" font-size="12" fill="#475569" text-anchor="start">· VirtualService / DestinationRule</text>
  <text x="56" y="194" font-size="12" fill="#475569" text-anchor="start">· PeerAuthentication</text>
  <rect x="360" y="90" width="280" height="132" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="376" y="118" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">② 控制面 istiod</text>
  <text x="376" y="140" font-size="12" fill="#1d4ed8" text-anchor="start">把 CRD 翻译成 xDS</text>
  <line x1="374" y1="152" x2="626" y2="152" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="376" y="174" font-size="12" fill="#475569" text-anchor="start">· 监听 K8s API</text>
  <text x="376" y="194" font-size="12" fill="#475569" text-anchor="start">· 按资源类型下发</text>
  <text x="376" y="214" font-size="12" fill="#475569" text-anchor="start">· 不接触业务流量</text>
  <rect x="680" y="90" width="280" height="132" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="696" y="118" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">③ 数据面 Envoy</text>
  <text x="696" y="140" font-size="12" fill="#15803d" text-anchor="start">执行 xDS</text>
  <line x1="694" y1="152" x2="946" y2="152" stroke="#86efac" stroke-width="1.1"/>
  <text x="696" y="174" font-size="12" fill="#475569" text-anchor="start">· Sidecar 或节点级代理</text>
  <text x="696" y="194" font-size="12" fill="#475569" text-anchor="start">· mTLS / 重试 / 遥测</text>
  <text x="696" y="214" font-size="12" fill="#475569" text-anchor="start">· 真正转发请求</text>
  <line x1="324" y1="156" x2="356" y2="156" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="340" y="146" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="bold">xDS</text>
  <line x1="644" y1="156" x2="676" y2="156" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="820" y="248" font-size="11.5" fill="#15803d" text-anchor="middle">↓ 请求真正走的是这一层</text>
  <text x="500" y="292" font-size="13" fill="#334155" text-anchor="middle" font-weight="bold">同一个问题只留一处主答案 —— 本目录与三个相邻目录的分工</text>
  <rect x="40" y="316" width="280" height="150" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.4"/>
  <text x="56" y="342" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">04-架构与系统/分布式</text>
  <text x="56" y="364" font-size="12" fill="#a16207" text-anchor="start" font-weight="bold">理论设计</text>
  <text x="56" y="392" font-size="11.5" fill="#475569" text-anchor="start">· 网格在负载均衡谱系里的位置</text>
  <text x="56" y="414" font-size="11.5" fill="#475569" text-anchor="start">· 为什么 K8s Service 不够</text>
  <text x="56" y="436" font-size="11.5" fill="#475569" text-anchor="start">· 节点摘除的判据与原子性</text>
  <rect x="360" y="316" width="280" height="150" rx="8" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1.4"/>
  <text x="376" y="342" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">06-工程实践/部署</text>
  <text x="376" y="364" font-size="12" fill="#a21caf" text-anchor="start" font-weight="bold">要不要上、选哪个</text>
  <text x="376" y="392" font-size="11.5" fill="#475569" text-anchor="start">· Istio / Linkerd / Cilium</text>
  <text x="376" y="414" font-size="11.5" fill="#475569" text-anchor="start">· 收益与成本的量化</text>
  <text x="376" y="436" font-size="11.5" fill="#475569" text-anchor="start">· 三套推荐组合</text>
  <rect x="680" y="316" width="280" height="150" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.4"/>
  <text x="696" y="342" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">本目录 + 网关与代理</text>
  <text x="696" y="364" font-size="12" fill="#0369a1" text-anchor="start" font-weight="bold">产品怎么配</text>
  <text x="696" y="392" font-size="11.5" fill="#475569" text-anchor="start">· xDS 四类资源与下发</text>
  <text x="696" y="414" font-size="11.5" fill="#475569" text-anchor="start">· outlier_detection 参数</text>
  <text x="696" y="436" font-size="11.5" fill="#475569" text-anchor="start">· 南北向入口见网关篇</text>
  <text x="500" y="500" font-size="12.5" fill="#475569" text-anchor="middle">东西向（服务 ↔ 服务）归服务网格，南北向（外部 → 内部）归网关；两者不是替代关系</text>
  <text x="500" y="528" font-size="12" fill="#b45309" text-anchor="middle">注意：三处最容易分不清的 —— 网关与网格的边界、摘除归谁、mTLS 归谁，分别见网关篇第七节、04 的摘除篇、本篇第二节</text>
  <rect x="40" y="552" width="920" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="500" y="578" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">要点：网格搬走的是「每个服务都要写一遍」的横切治理，搬不走任何需要懂业务语义的判断</text>
  <text x="500" y="598" font-size="12" fill="#64748b" text-anchor="middle">所以「这个功能该不该由网格承担」的判据是：去掉业务字段之后，它还剩不剩</text>
</svg>
