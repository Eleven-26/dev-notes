<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="xl1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">XXL-JOB 整体架构：调度与任务解耦，用 HTTP 反向触发</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">调度中心只决定「何时、按什么策略、调到哪台」；执行器只负责把业务跑起来</text>

  <rect x="40" y="90" width="920" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="56" y="114" font-size="14" font-weight="bold" fill="#0f172a">调度中心集群 xxl-job-admin ×N（:8080）</text>
  <rect x="60" y="128" width="280" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="200" y="158" text-anchor="middle" font-size="12.5" fill="#1e3a8a">Web 控制台</text>
  <rect x="360" y="128" width="280" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="500" y="158" text-anchor="middle" font-size="12.5" fill="#1e3a8a">调度引擎 JobScheduleHelper</text>
  <rect x="660" y="128" width="280" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="800" y="158" text-anchor="middle" font-size="12.5" fill="#1e3a8a">注册发现 JobRegistryHelper</text>
  <rect x="60" y="188" width="880" height="42" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="214" text-anchor="middle" font-size="12.5" fill="#7c2d12">MySQL xxl_job_lock —— 集群一致性唯一凭据（SELECT ... FOR UPDATE）</text>

  <line x1="500" y1="240" x2="500" y2="258" stroke="#334155" stroke-width="1.5" marker-end="url(#xl1)"/>

  <rect x="40" y="260" width="920" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="56" y="282" font-size="13" font-weight="bold" fill="#0f172a">通信：HTTP 反向触发（不是消息队列），四个接口构成全部交互</text>
  <text x="60" y="306" font-size="12.5" fill="#334155">① 执行器 → 中心：POST /api/registry 主动注册（Go 20s / Java 30s 续约，90s 未续约剔除）</text>
  <text x="60" y="330" font-size="12.5" fill="#334155">② 中心 → 执行器：POST http://ip:9999/run 触发任务（Header 带 XXL-JOB-ACCESS-TOKEN）</text>
  <text x="60" y="354" font-size="12.5" fill="#334155">③ 执行器 → 中心：POST /api/callback 上报 handleCode（200 成功 / 500 失败）</text>
  <text x="60" y="378" font-size="12.5" fill="#334155">④ 中心 → 执行器：POST http://ip:9999/log 回拉执行器本地日志</text>

  <line x1="500" y1="380" x2="500" y2="398" stroke="#334155" stroke-width="1.5" marker-end="url(#xl1)"/>

  <rect x="40" y="400" width="920" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="56" y="424" font-size="14" font-weight="bold" fill="#0f172a">执行器集群 AppName=xxl-job-executor-sample（:9999，可多实例）</text>
  <rect x="60" y="438" width="280" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="200" y="472" text-anchor="middle" font-size="12" fill="#14532d">HTTP Server（/run /kill /log /beat）</text>
  <rect x="360" y="438" width="280" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="500" y="472" text-anchor="middle" font-size="12" fill="#14532d">线程池 / goroutine 执行任务</text>
  <rect x="660" y="438" width="280" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="800" y="472" text-anchor="middle" font-size="12" fill="#14532d">本地日志（默认保留 30 天）</text>

  <line x1="20" y1="534" x2="980" y2="534" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="560" font-size="13" fill="#0f172a">⭐ 通信方式是 HTTP 反向触发（不是消息队列）：执行器是 HTTP Server、中心是 Client。</text>
  <text x="20" y="586" font-size="13" fill="#0f172a">⚠️ 硬前提：执行器 :9999 必须对中心可达；「执行器能访问中心」≠「中心能访问执行器」。</text>
  <text x="20" y="612" font-size="13" fill="#0f172a">⭐ 中心集群靠 MySQL 行锁选主：抢到锁的实例才扫描待调度任务，无需 ZK 选主。</text>
  <text x="20" y="638" font-size="12" fill="#64748b">触发时效：每轮预读 PRE_READ_MS = 5000ms，塞进 60 槽时间轮，ring 线程按秒推进 → 秒级精度。</text>
</svg>
