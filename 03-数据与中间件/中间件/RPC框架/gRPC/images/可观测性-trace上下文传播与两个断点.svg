<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">trace 上下文跨进程传播：靠 metadata 携带，绕过插桩就断链</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">otelgrpc 客户端自动注入、服务端自动提取——前提是链路上的每一跳都装了插桩</text>

  <rect x="20" y="90" width="220" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="130" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">客户端业务代码</text>
  <rect x="270" y="90" width="220" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="380" y="117" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">客户端插桩（StatsHandler）</text>
  <rect x="520" y="90" width="220" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="630" y="117" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">服务端插桩（StatsHandler）</text>
  <rect x="770" y="90" width="220" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="880" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">服务端业务 handler</text>

  <line x1="130" y1="134" x2="130" y2="340" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <line x1="380" y1="134" x2="380" y2="340" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <line x1="630" y1="134" x2="630" y2="280" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <line x1="880" y1="134" x2="880" y2="340" stroke="#94a3b8" stroke-dasharray="4 4"/>

  <line x1="130" y1="170" x2="374" y2="170" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="252" y="162" text-anchor="middle" font-size="12" fill="#0f172a">① 发起 RPC（带 ctx）</text>
  <line x1="380" y1="215" x2="624" y2="215" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="502" y="207" text-anchor="middle" font-size="12" fill="#0f172a">② 注入 trace 上下文进 metadata 跨进程</text>
  <line x1="630" y1="260" x2="874" y2="260" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="752" y="252" text-anchor="middle" font-size="12" fill="#0f172a">③ 提取后建好 root span 再传 ctx</text>

  <rect x="520" y="280" width="220" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="630" y="298" text-anchor="middle" font-size="11.5" fill="#475569">root span 由插桩自动建立</text>
  <text x="630" y="316" text-anchor="middle" font-size="11.5" fill="#475569">业务 handler 不需要手建 span</text>

  <line x1="20" y1="345" x2="980" y2="345" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="372" font-size="14" font-weight="bold" fill="#b91c1c">断链的两个典型位置</text>

  <rect x="40" y="385" width="440" height="92" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="260" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">断链① 手写 handler / 自研网关</text>
  <text x="60" y="434" font-size="12" fill="#334155">绕过拦截器直接调 conn.Invoke，注入就没了</text>
  <text x="60" y="456" font-size="12" fill="#334155">下游 span 拿到的是自己独立的 trace_id</text>

  <rect x="520" y="385" width="440" height="92" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="740" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">断链② producer / consumer 异步边界</text>
  <text x="540" y="434" font-size="12" fill="#334155">消息从队列出来时上下文已不在 ctx 里</text>
  <text x="540" y="456" font-size="12" fill="#334155">要显式塞进消息头，消费时再取出来</text>

  <text x="40" y="512" font-size="12" fill="#64748b">判据：下游 span 有独立 trace_id → 是上下文没传过来，而不是「后端丢数据」。</text>
</svg>
