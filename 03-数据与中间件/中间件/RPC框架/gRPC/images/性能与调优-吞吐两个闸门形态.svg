<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">吞吐的两个闸门：连接数（客户端）× 每连接并发流上限（服务端）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">实测支撑：200 次一元 + 3 条并发流只拨号 1 次、服务端 accept 1 条 TCP——没有连接复用就没有多路复用的收益</text>

  <rect x="40" y="100" width="260" height="286" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="170" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">客户端</text>
  <rect x="65" y="146" width="210" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="170" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">ClientConn A</text>
  <text x="170" y="186" text-anchor="middle" font-size="11" fill="#1e3a8a">默认一个就够（多路复用）</text>
  <rect x="65" y="226" width="210" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="170" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">ClientConn B</text>
  <text x="170" y="266" text-anchor="middle" font-size="11" fill="#1e3a8a">要压多连接得显式建</text>
  <text x="60" y="310" font-size="11.5" fill="#64748b">别在请求路径上建连：</text>
  <text x="60" y="330" font-size="11.5" fill="#64748b">NewClient 背后是后台</text>
  <text x="60" y="350" font-size="11.5" fill="#64748b">goroutine 与解析器</text>

  <rect x="330" y="126" width="330" height="248" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-dasharray="6 4"/>
  <text x="495" y="146" text-anchor="middle" font-size="12" fill="#166534">一条 TCP 长连接上多条流并行（每个 RPC / 流一条 HTTP/2 stream）</text>
  <line x1="300" y1="166" x2="645" y2="166" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr4)"/>
  <line x1="300" y1="190" x2="645" y2="190" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr4)"/>
  <line x1="300" y1="214" x2="645" y2="214" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr4)"/>
  <line x1="300" y1="246" x2="645" y2="246" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr4)"/>
  <line x1="300" y1="270" x2="645" y2="270" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr4)"/>
  <text x="470" y="300" text-anchor="middle" font-size="12" fill="#166534">一元 × 200 · 流 × 3 → 全程共用拨号 1 次</text>

  <line x1="378" y1="112" x2="378" y2="392" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="378" y="412" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b91c1c">闸门① 连接数（客户端旋钮）</text>

  <line x1="622" y1="112" x2="622" y2="392" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="622" y="412" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b91c1c">闸门② MaxConcurrentStreams</text>
  <text x="622" y="430" text-anchor="middle" font-size="11.5" fill="#b91c1c">服务端旋钮 · 限的是「每条连接」</text>

  <rect x="700" y="100" width="260" height="286" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="830" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">服务端</text>
  <rect x="725" y="150" width="210" height="54" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="830" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">并发处理的流</text>
  <text x="830" y="192" text-anchor="middle" font-size="11" fill="#166534">上限内：立即分发</text>
  <rect x="725" y="230" width="210" height="54" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="830" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">超出上限的流</text>
  <text x="830" y="272" text-anchor="middle" font-size="11" fill="#b91c1c">在客户端侧排队，看起来像「卡住」</text>
  <text x="725" y="320" font-size="11.5" fill="#64748b">MaxConnectionAge 不是性能旋钮，</text>
  <text x="725" y="340" font-size="11.5" fill="#64748b">但决定流量能不能重新均衡</text>

  <rect x="40" y="452" width="920" height="42" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="500" y="478" text-anchor="middle" font-size="13.5" fill="#312e81">吞吐上限 ≈ 连接数 × 每连接并发流上限；流控窗口（HTTP/2 层）是第三个隐性约束</text>

  <text x="40" y="528" font-size="13" font-weight="bold" fill="#0f172a">⭐ 判据：加并发时吞吐不涨、P99 反而抬升 → 先怀疑触到 MaxConcurrentStreams 或流控窗口，而不是 CPU 不够。</text>
  <text x="40" y="554" font-size="12" fill="#64748b">机制细节见 HTTP2机制.md 第五节；「该看哪个指标」见可观测性.md 第三节（在途请求数、活跃流数）。</text>
</svg>
