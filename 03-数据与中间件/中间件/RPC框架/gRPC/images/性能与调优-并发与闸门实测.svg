  <text x="56" y="702" font-size="12" font-weight="bold" fill="#0f172a">纪律：先量基线（吞吐 / 并发 / 连接数 / P50·P99 / 错误率），再改一个旋钮、再复测。</text>
  <text x="56" y="726" font-size="10.5" fill="#334155">本图只报「最小~最大」区间；时序类各跑 3 次，括号里的「轮N」标明该边界出自哪一轮。</text>
  <text x="56" y="748" font-size="10.5" fill="#1d4ed8">第一条趋势：吞吐在 16~64 见顶后回落，P99 一路抬到 164.9~191.0 ms，而 P50 只到 30.6~31.3 ms。</text>
  <text x="56" y="770" font-size="10.5" fill="#b91c1c">第二条趋势：闸门是唯一区间不重叠的一组——mcs 1→100 时 RPS 从 382~487 抬到 3427~4853。</text>
