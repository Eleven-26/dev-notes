<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="d1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">gRPC 的三层：传输层不能换、载荷层能换、框架层才是「框架」卖的东</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">左侧自上而下是「一次调用穿过的层」，右侧每层给出「能不能换」与实测依据</text>

  <rect x="36" y="78" width="560" height="44" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="316" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">你的代码</text>
  <text x="316" y="114" text-anchor="middle" font-size="10.5" fill="#334155">conn.Invoke(ctx, "/demo.Echo/Unary", in, out)　/　conn.NewStream(...)</text>

  <line x1="316" y1="122" x2="316" y2="134" stroke="#64748b" stroke-width="1.5" marker-end="url(#d1)"/>

  <rect x="36" y="138" width="560" height="62" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="316" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">框架层　IDL → 存根 · 统一调用 API · deadline / metadata / 状态码</text>
  <text x="316" y="182" text-anchor="middle" font-size="10.5" fill="#1d4ed8">不用 protoc 也照样在：本实验手写 ServiceDesc + JSON codec 跑通全链路</text>

  <line x1="316" y1="200" x2="316" y2="212" stroke="#64748b" stroke-width="1.5" marker-end="url(#d1)"/>

  <rect x="36" y="216" width="560" height="62" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="316" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">载荷层　默认 Protobuf 二进制，装箱方式可换</text>
  <text x="316" y="260" text-anchor="middle" font-size="10.5" fill="#6d28d9">本实验全程 JSON：content-type = application/grpc+json，协议其它部分一个都没动</text>

  <line x1="316" y1="278" x2="316" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#d1)"/>

  <rect x="36" y="294" width="560" height="62" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
  <text x="316" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#134e4a">传输层　HTTP/2：帧 · 流 · 多路复用 · 流控 · HPACK</text>
  <text x="316" y="338" text-anchor="middle" font-size="10.5" fill="#0f766e">HEADERS / DATA / SETTINGS / PING / WINDOW_UPDATE —— 与业务语义完全无关</text>

  <line x1="316" y1="356" x2="316" y2="368" stroke="#64748b" stroke-width="1.5" marker-end="url(#d1)"/>

  <rect x="36" y="372" width="560" height="44" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="316" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">一条 TCP 连接（h2c 明文）</text>
  <text x="316" y="408" text-anchor="middle" font-size="10.5" fill="#334155">前 24 字节 = "PRI * HTTP/2.0\r\n\r\nSM\r\n\r\n"，prefaceMatches=true</text>

  <rect x="620" y="138" width="344" height="62" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="636" y="158" font-size="11.5" font-weight="bold" fill="#1e3a8a">⭐ 这一层才是「框架」真正提供的东西</text>
  <text x="636" y="176" font-size="10.5" fill="#334155">protoc 省掉的是样板（方法名拼接、ServiceDesc 登记、</text>
  <text x="636" y="192" font-size="10.5" fill="#334155">消息定义、拦截器接线），协议机制一个都没省</text>

  <rect x="620" y="216" width="344" height="62" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="636" y="236" font-size="11.5" font-weight="bold" fill="#4c1d95">✅ 能换：三行代码就换掉</text>
  <text x="636" y="254" font-size="10.5" fill="#334155">encoding.RegisterCodec(jsonCodec{}) + CallContentSubtype("json")</text>
  <text x="636" y="270" font-size="10.5" fill="#334155">+ 服务端 grpc.ForceServerCodec(...)，两端配套才稳</text>

  <rect x="620" y="294" width="344" height="62" rx="9" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.4"/>
  <text x="636" y="314" font-size="11.5" font-weight="bold" fill="#881337">⚠️ 不能换：换掉就不是 gRPC 了</text>
  <text x="636" y="332" font-size="10.5" fill="#334155">gRPC 规范就长在 HTTP/2 上；nginx 用 proxy_pass 换成 HTTP/1.1</text>
  <text x="636" y="348" font-size="10.5" fill="#334155">立刻失败：upstream sent no valid HTTP/1.0 header</text>

  <rect x="36" y="436" width="928" height="184" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="54" y="460" font-size="12.5" font-weight="bold" fill="#0f172a">证据：同一条 TCP 上的 15 个 HTTP/2 帧（自写透明代理解出，本机无 tcpdump / tshark）</text>
  <text x="54" y="484" font-size="11" fill="#334155">tcpConns=1　clientToServerBytes=437　serverToClientBytes=785　framesSeen=15　streamIDs: [1 3 5 7 9]（客户端发起的流全是奇数）</text>

  <rect x="54" y="498" width="292" height="46" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.3"/>
  <text x="200" y="516" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#134e4a">SETTINGS 成对 + PING + WINDOW_UPDATE</text>
  <text x="200" y="534" text-anchor="middle" font-size="10" fill="#0f766e">flags=0x01 是 ACK；stream=0 表示连接级流控真的在跑</text>

  <rect x="360" y="498" width="292" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="506" y="516" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e3a8a">5 条流各一组 HEADERS + DATA</text>
  <text x="506" y="534" text-anchor="middle" font-size="10" fill="#1d4ed8">flags=0x04 END_HEADERS，flags=0x01 END_STREAM（客户端半关闭）</text>

  <rect x="666" y="498" width="282" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="807" y="516" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c1d95">DATA 里不是裸消息体</text>
  <text x="807" y="534" text-anchor="middle" font-size="10" fill="#6d28d9">1 字节压缩标志 + 4 字节大端长度 + 载荷（实测三个样本都正好 +5）</text>

  <text x="54" y="568" font-size="11.5" fill="#334155">⭐ 帧类型名、流 ID、字节数全是协议层的东西 —— 与「服务叫什么名、消息是什么结构」完全无关，所以业务语义是骑在 HTTP/2 之上的</text>
  <text x="54" y="594" font-size="11.5" fill="#64748b">「gRPC 和 HTTP/2 什么关系」是承载关系（HTTP/2 在下面运）；「gRPC 和 Protobuf 什么关系」是默认搭配（装箱方式可换）—— 两个问题不是同一个问题</text>
</svg>
