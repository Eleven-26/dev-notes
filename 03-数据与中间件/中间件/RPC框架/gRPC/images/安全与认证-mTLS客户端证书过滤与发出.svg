<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arr2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">mTLS 握手：一张「CA 不对」的客户端证书是怎么被静默过滤的</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">第 3.1 节 F / G / G2 实测的机制图：服务端为 RequireAndVerifyClientCert + ClientCAs（root1），客户端配的是 root2 签的证书</text>

  <rect x="120" y="84" width="760" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="111" text-anchor="middle" font-size="13" fill="#1e3a8a">握手请求：服务端下发 CertificateRequest，附 AcceptableCAs（可接受签发者列表）</text>
  <line x1="500" y1="128" x2="500" y2="154" stroke="#475569" stroke-width="1.6" marker-end="url(#arr2)"/>

  <rect x="310" y="156" width="380" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="500" y="181" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">客户端这张证书是怎么配上去的？</text>
  <line x1="400" y1="196" x2="255" y2="228" stroke="#475569" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="600" y1="196" x2="745" y2="228" stroke="#475569" stroke-width="1.6" marker-end="url(#arr2)"/>

  <rect x="40" y="230" width="420" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="250" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">放进 tls.Config.Certificates —— G 行</text>
  <rect x="540" y="230" width="420" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="750" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">用 GetClientCertificate 返回 —— G2 行</text>

  <line x1="250" y1="276" x2="250" y2="300" stroke="#475569" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="750" y1="276" x2="750" y2="300" stroke="#475569" stroke-width="1.6" marker-end="url(#arr2)"/>

  <rect x="40" y="302" width="420" height="64" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="250" y="328" text-anchor="middle" font-size="12.5" fill="#713f12">Go 按 AcceptableCAs 过滤证书：</text>
  <text x="250" y="350" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">签发者 root2 不在列表里 → 根本不发出去</text>
  <rect x="540" y="302" width="420" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="750" y="328" text-anchor="middle" font-size="12.5" fill="#334155">回调的返回值不再过那层过滤：</text>
  <text x="750" y="350" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">这张证书真的发出去了</text>

  <line x1="250" y1="366" x2="250" y2="390" stroke="#475569" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="750" y1="366" x2="750" y2="390" stroke="#475569" stroke-width="1.6" marker-end="url(#arr2)"/>

  <rect x="40" y="392" width="420" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="250" y="420" text-anchor="middle" font-size="13" fill="#334155">服务端看到：空的证书列表</text>
  <rect x="540" y="392" width="420" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="750" y="420" text-anchor="middle" font-size="13" fill="#334155">服务端用 ClientCAs 验签发者：失败</text>

  <line x1="250" y1="438" x2="250" y2="462" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr2r)"/>
  <line x1="750" y1="438" x2="750" y2="462" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr2r)"/>

  <rect x="40" y="464" width="420" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="250" y="490" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">remote error: tls: handshake failure</text>
  <text x="250" y="512" text-anchor="middle" font-size="11.5" fill="#b91c1c">与 F 行「完全没带客户端证书」的文案一模一样</text>
  <rect x="540" y="464" width="420" height="64" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="750" y="490" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">remote error: tls: unknown certificate authority</text>
  <text x="750" y="512" text-anchor="middle" font-size="11.5" fill="#c2410c">报错变了——因为证书这次真被发出、被校验了</text>

  <rect x="40" y="546" width="920" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="500" y="572" text-anchor="middle" font-size="13" fill="#14532d">对照 H 行：客户端证书由 root1 签发 → 发出 → 链校验通过 → RPC 成功（&lt;nil&gt;）</text>

  <rect x="40" y="606" width="920" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="60" y="632" font-size="13" font-weight="bold" fill="#0f172a">⭐ 排障结论：看到 handshake failure，不能断定「客户端没配证书」——</text>
  <text x="60" y="654" font-size="13" fill="#334155">同样可能是「证书配了，但签发者不在服务端的 ClientCAs 里」。两处都要查：客户端的 Certificates 与服务端的 ClientCAs。</text>
</svg>
