<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">拦截器链的洋葱序：先注册的包在外层，进入时先跑、返回时后回</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">ChainUnaryInterceptor(a, b, c)：a → b → c → handler → c → b → a；客户端链与服务端链各走一串（实测 cli / srv 各打一行）</text>

  <defs>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="380" y="78" width="240" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">调用方 / 服务端框架入口</text>

  <rect x="380" y="162" width="240" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="189" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">拦截器 a · 最外层</text>

  <rect x="380" y="226" width="240" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">拦截器 b</text>

  <rect x="380" y="290" width="240" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">拦截器 c · 最内层</text>

  <rect x="380" y="360" width="240" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="500" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">业务 handler</text>

  <line x1="430" y1="122" x2="430" y2="158" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrD)"/>
  <line x1="430" y1="206" x2="430" y2="222" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrD)"/>
  <line x1="430" y1="270" x2="430" y2="286" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrD)"/>
  <line x1="430" y1="334" x2="430" y2="356" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrD)"/>

  <line x1="570" y1="356" x2="570" y2="338" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrU)"/>
  <line x1="570" y1="290" x2="570" y2="274" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrU)"/>
  <line x1="570" y1="226" x2="570" y2="210" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrU)"/>
  <line x1="570" y1="162" x2="570" y2="126" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrU)"/>

  <text x="418" y="145" text-anchor="end" font-size="12" fill="#2563eb">请求：由外向内</text>
  <text x="582" y="145" font-size="12" fill="#16a34a">响应：由内向外（c → b → a）</text>

  <text x="670" y="185" font-size="12" fill="#64748b">日志、鉴权、指标放最前面注册，</text>
  <text x="670" y="203" font-size="12" fill="#64748b">先于业务逻辑执行</text>
  <text x="670" y="330" font-size="12" fill="#64748b">统计最终结果（含错误码）的拦截器</text>
  <text x="670" y="348" font-size="12" fill="#64748b">拿到的是内层已处理完的结果</text>

  <line x1="20" y1="440" x2="980" y2="440" stroke="#cbd5e1" stroke-width="1"/>

  <text x="20" y="464" font-size="12.5" fill="#0f172a">⭐ 一元链（ChainUnaryInterceptor）与流链（ChainStreamInterceptor）是两串独立的链，请求按一元还是流决定走哪串，</text>
  <text x="20" y="484" font-size="12.5" fill="#0f172a">   不存在「一元链包着流链」。defer recover() 只有在服务端拦截器里才能把 panic 转成 Internal，不写就是整个进程挂掉。</text>
  <text x="20" y="510" font-size="12.5" fill="#b91c1c">⚠️ 服务端一元链会「静默失效」：框架只把 unaryInt 当参数传给 md.Handler（server.go:1284），不会替你调用；</text>
  <text x="20" y="530" font-size="12.5" fill="#b91c1c">   手写 handler 必须自己写 interceptor(ctx, in, info, handler)，否则表现为空数组、没有任何报错。流链由框架包在 ServerStream 上，不用自己调。</text>
</svg>
