<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一条 User 消息：JSON 54 字节，Protobuf 26 字节的逐字节形态</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">字段名不进报文，进报文的只有 key 字节（field number &lt;&lt; 3 | wire type）+ 长度 + 载荷</text>

  <text x="30" y="82" font-size="11.5" fill="#334155">message User { string name = 1; int32 age = 2; repeated string hobby = 3; }　→　name:"张三" age:18 hobby:["钓鱼","架设"]</text>
  <rect x="30" y="94" width="940" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="46" y="116" font-size="11" fill="#0f172a">JSON：{"name":"张三","age":18,"hobby":["钓鱼","架设"]}　=　54 字节　｜　Protobuf 二进制　=　26 字节（不到一半）　｜　序列化+反序列化 1278 ns/op → 373.1 ns/op</text>

  <rect x="31" y="170" width="32" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="47" y="190" text-anchor="middle" font-size="9.5" fill="#1e3a8a">0a</text>
  <rect x="65" y="170" width="32" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="81" y="190" text-anchor="middle" font-size="9.5" fill="#1e3a8a">06</text>
  <rect x="99" y="170" width="32" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="115" y="190" text-anchor="middle" font-size="9.5" fill="#1e3a8a">e5</text>
  <rect x="133" y="170" width="32" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="149" y="190" text-anchor="middle" font-size="9.5" fill="#1e3a8a">bc</text>
  <rect x="167" y="170" width="32" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="183" y="190" text-anchor="middle" font-size="9.5" fill="#1e3a8a">a0</text>
  <rect x="201" y="170" width="32" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="217" y="190" text-anchor="middle" font-size="9.5" fill="#1e3a8a">e4</text>
  <rect x="235" y="170" width="32" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="251" y="190" text-anchor="middle" font-size="9.5" fill="#1e3a8a">b8</text>
  <rect x="269" y="170" width="32" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="285" y="190" text-anchor="middle" font-size="9.5" fill="#1e3a8a">89</text>

  <rect x="303" y="170" width="32" height="30" fill="#ccfbf1" stroke="#0d9488" stroke-width="1"/><text x="319" y="190" text-anchor="middle" font-size="9.5" fill="#134e4a">10</text>
  <rect x="337" y="170" width="32" height="30" fill="#ccfbf1" stroke="#0d9488" stroke-width="1"/><text x="353" y="190" text-anchor="middle" font-size="9.5" fill="#134e4a">12</text>

  <rect x="371" y="170" width="32" height="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="387" y="190" text-anchor="middle" font-size="9.5" fill="#4c1d95">1a</text>
  <rect x="405" y="170" width="32" height="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="421" y="190" text-anchor="middle" font-size="9.5" fill="#4c1d95">06</text>
  <rect x="439" y="170" width="32" height="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="455" y="190" text-anchor="middle" font-size="9.5" fill="#4c1d95">e9</text>
  <rect x="473" y="170" width="32" height="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="489" y="190" text-anchor="middle" font-size="9.5" fill="#4c1d95">92</text>
  <rect x="507" y="170" width="32" height="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="523" y="190" text-anchor="middle" font-size="9.5" fill="#4c1d95">93</text>
  <rect x="541" y="170" width="32" height="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="557" y="190" text-anchor="middle" font-size="9.5" fill="#4c1d95">e9</text>
  <rect x="575" y="170" width="32" height="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="591" y="190" text-anchor="middle" font-size="9.5" fill="#4c1d95">b1</text>
  <rect x="609" y="170" width="32" height="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="625" y="190" text-anchor="middle" font-size="9.5" fill="#4c1d95">bc</text>

  <rect x="643" y="170" width="32" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="659" y="190" text-anchor="middle" font-size="9.5" fill="#7c2d12">1a</text>
  <rect x="677" y="170" width="32" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="693" y="190" text-anchor="middle" font-size="9.5" fill="#7c2d12">06</text>
  <rect x="711" y="170" width="32" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="727" y="190" text-anchor="middle" font-size="9.5" fill="#7c2d12">e6</text>
  <rect x="745" y="170" width="32" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="761" y="190" text-anchor="middle" font-size="9.5" fill="#7c2d12">9e</text>
  <rect x="779" y="170" width="32" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="795" y="190" text-anchor="middle" font-size="9.5" fill="#7c2d12">b6</text>
  <rect x="813" y="170" width="32" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="829" y="190" text-anchor="middle" font-size="9.5" fill="#7c2d12">e8</text>
  <rect x="847" y="170" width="32" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="863" y="190" text-anchor="middle" font-size="9.5" fill="#7c2d12">ae</text>
  <rect x="881" y="170" width="32" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="897" y="190" text-anchor="middle" font-size="9.5" fill="#7c2d12">be</text>

  <rect x="31" y="206" width="270" height="8" rx="4" fill="#2563eb"/>
  <rect x="303" y="206" width="66" height="8" rx="4" fill="#0d9488"/>
  <rect x="371" y="206" width="270" height="8" rx="4" fill="#7c3aed"/>
  <rect x="643" y="206" width="270" height="8" rx="4" fill="#d97706"/>

  <text x="166" y="232" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e3a8a">name（tag 1）8 字节</text>
  <text x="336" y="232" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#134e4a">age（tag 2）2 字节</text>
  <text x="506" y="232" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c1d95">hobby[0]（tag 3）8 字节</text>
  <text x="778" y="232" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7c2d12">hobby[1]（tag 3）8 字节</text>
  <text x="166" y="250" text-anchor="middle" font-size="10" fill="#334155">0a 是 key，06 是长度，6 字节 =「张三」</text>
  <text x="336" y="250" text-anchor="middle" font-size="10" fill="#334155">10 是 key，12 就是十进制 18</text>
  <text x="506" y="250" text-anchor="middle" font-size="10" fill="#334155">同一个 tag 3，每元素自带一条 1a 06</text>
  <text x="778" y="250" text-anchor="middle" font-size="10" fill="#334155">没有 [] 没有逗号，数组零开销</text>
  <text x="500" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">合计 8 + 2 + 8 + 8 = 26 字节</text>

  <text x="30" y="304" font-size="12.5" font-weight="bold" fill="#0f172a">三个 key 字节的拆位：key = (field_number &lt;&lt; 3) | wire_type</text>
  <rect x="30" y="316" width="300" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="44" y="336" font-size="11" font-weight="bold" fill="#1e3a8a">0a = 0000_1010</text>
  <text x="44" y="354" font-size="10.5" fill="#334155">高 5 位 00001 → tag 1</text>
  <text x="44" y="370" font-size="10.5" fill="#1d4ed8">低 3 位 010 → wire 2（长度定界）</text>
  <rect x="350" y="316" width="300" height="62" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/>
  <text x="364" y="336" font-size="11" font-weight="bold" fill="#134e4a">10 = 0001_0000</text>
  <text x="364" y="354" font-size="10.5" fill="#334155">高 5 位 00010 → tag 2</text>
  <text x="364" y="370" font-size="10.5" fill="#0f766e">低 3 位 000 → wire 0（varint）</text>
  <rect x="670" y="316" width="300" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="684" y="336" font-size="11" font-weight="bold" fill="#4c1d95">1a = 0001_1010</text>
  <text x="684" y="354" font-size="10.5" fill="#334155">高 5 位 00011 → tag 3</text>
  <text x="684" y="370" font-size="10.5" fill="#6d28d9">低 3 位 010 → wire 2（长度定界）</text>

  <rect x="30" y="392" width="940" height="76" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="46" y="416" font-size="12" font-weight="bold" fill="#0f172a">wire type 决定「这段载荷怎么读」，varint 决定「小值为什么只占一个字节」</text>
  <text x="46" y="438" font-size="10.5" fill="#334155">0 Varint（int32/int64/bool/enum）　1 64-bit（fixed64/double）　2 Length-delimited（string/bytes/嵌套 message/repeated string）　5 32-bit（fixed32/float）　3 / 4 group（proto3 已废弃）</text>
  <text x="46" y="458" font-size="10.5" fill="#0d9488">varint 每字节只放 7 位数据，最高位是继续标志：18 = 0x12 = 0001_0010，最高位是 0，所以一个字节写完；固定 8 字节编码要占 8 字节</text>

  <rect x="30" y="482" width="940" height="156" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="46" y="508" font-size="12.5" font-weight="bold" fill="#7c2d12">拆完得到的三个结论（每一条都能在上面那 26 个字节里指出来）</text>
  <text x="46" y="536" font-size="11" fill="#9a3412">① <tspan font-weight="bold">age=18 只花 2 字节</tspan>（10 12），JSON 的 "age":18 是 8 字节 —— 差的是字段名 + 引号 + 冒号 + 分隔符，</text>
  <text x="60" y="554" font-size="11" fill="#9a3412">所以「体积小」的本质是「不传名字」，不是「压缩算法好」。</text>
  <text x="46" y="578" font-size="11" fill="#9a3412">② <tspan font-weight="bold">repeated string 是每个元素一条 1a</tspan>（上图 hobby 两段各 8 字节），数组本身零开销；</text>
  <text x="60" y="596" font-size="11" fill="#9a3412">而 repeated int32 才会打包成一段 varint（proto3 默认 packed）—— 省不省要看元素类型，两套写法不能混着记。</text>
  <text x="46" y="620" font-size="11" fill="#9a3412">③ <tspan font-weight="bold">中文没被压缩</tspan>：张三仍是 6 字节 UTF-8（e5 bc a0 / e4 b8 89）。Protobuf 省的是协议开销，不是数据本身。</text>
</svg>
