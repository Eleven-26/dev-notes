<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="lcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="lcArrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="lcArrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="780" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">连接的五态：被推动才前进，不被推动就停在 IDLE</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">每个迁移旁边标的 true / false 全部抄自 out/lifecycle.txt（输出已抹掉临时端口，两遍逐行相同）</text>

  <rect x="40" y="96" width="180" height="66" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="130" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">IDLE</text>
  <text x="130" y="144" text-anchor="middle" font-size="10" fill="#475569">默认起点；惰性</text>

  <line x1="220" y1="129" x2="292" y2="129" stroke="#2563eb" stroke-width="1.8" marker-end="url(#lcArrow)"/>
  <text x="256" y="120" text-anchor="middle" font-size="10" fill="#1d4ed8">Connect()</text>
  <text x="256" y="146" text-anchor="middle" font-size="10" fill="#1d4ed8">或首次 RPC</text>

  <rect x="294" y="96" width="196" height="66" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="392" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">CONNECTING</text>
  <text x="392" y="144" text-anchor="middle" font-size="10" fill="#1d4ed8">拨号 + 等对端 HTTP/2 前言</text>

  <line x1="490" y1="129" x2="562" y2="129" stroke="#2563eb" stroke-width="1.8" marker-end="url(#lcArrow)"/>
  <text x="526" y="120" text-anchor="middle" font-size="10" fill="#1d4ed8">收到对端</text>
  <text x="526" y="146" text-anchor="middle" font-size="10" fill="#1d4ed8">SETTINGS</text>

  <rect x="564" y="96" width="180" height="66" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="654" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">READY</text>
  <text x="654" y="144" text-anchor="middle" font-size="10" fill="#166534">可以发 RPC</text>

  <rect x="780" y="96" width="180" height="66" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="870" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">SHUTDOWN</text>
  <text x="870" y="144" text-anchor="middle" font-size="10" fill="#475569">终点：Close() 之后</text>

  <path d="M 654 162 L 654 196 L 870 196 L 870 162" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#lcArrowGray)"/>
  <text x="762" y="190" text-anchor="middle" font-size="10" fill="#475569">Close()（实测：同一连接 / 死地址连接 / 哑连接都是 SHUTDOWN）</text>

  <line x1="392" y1="162" x2="392" y2="256" stroke="#dc2626" stroke-width="1.6" marker-end="url(#lcArrowRed)"/>
  <text x="404" y="212" font-size="10.5" fill="#b91c1c">拨号失败（对端没监听）</text>

  <rect x="294" y="258" width="196" height="66" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="392" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">TRANSIENT_FAILURE</text>
  <text x="392" y="304" text-anchor="middle" font-size="10" fill="#7f1d1d">连不上（实测会经过它）</text>

  <path d="M 294 291 L 240 291 L 240 180 L 292 180" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#lcArrowGray)"/>
  <text x="238" y="240" text-anchor="middle" font-size="10" fill="#475569">退避后重试</text>

  <rect x="30" y="352" width="940" height="120" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="46" y="376" font-size="12" font-weight="bold" fill="#0f172a">实测序列（out/lifecycle.txt，逐行抄）</text>
  <text x="46" y="398" font-size="10.5" fill="#334155">newClient 后不 Connect 也不发 RPC ：IDLE　　　｜　Connect() 后等到 CONNECTING：true　　　｜　继续等到 READY：true</text>
  <text x="46" y="418" font-size="10.5" fill="#334155">对端已停，Connect() 后是否经过 TRANSIENT_FAILURE：true　　　｜　Close() 之后（同一 / 死地址 / 哑连接）：SHUTDOWN</text>
  <text x="46" y="438" font-size="10.5" fill="#b91c1c">哑监听（接受 TCP 却不发 HTTP/2 前言）：等到 CONNECTING = true；再等 1 s 是否到 READY = false（仍是 CONNECTING）</text>
  <text x="46" y="458" font-size="10.5" fill="#475569">→ 最后一行说明：TCP 通了不等于连接可用，gRPC 要等到对端的 SETTINGS 才肯转 READY</text>

  <rect x="30" y="486" width="460" height="130" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="46" y="510" font-size="12" font-weight="bold" fill="#1d4ed8">两条容易被误当故障的路径</text>
  <text x="46" y="534" font-size="10.5" fill="#1e40af">① 退避后重试：TRANSIENT_FAILURE 不是终点，客户端会退避再连；</text>
  <text x="46" y="552" font-size="10.5" fill="#1e40af">　 把「曾经进过 TF」当成「服务不可用」会误判。</text>
  <text x="46" y="576" font-size="10.5" fill="#b91c1c">② 落回 IDLE：对端断开或 GOAWAY 之后连接可能回到 IDLE，</text>
  <text x="46" y="594" font-size="10.5" fill="#b91c1c">　 下一次 RPC 再把它推起来 —— ⚠️ 这一条未逐项实测，按 grpc-go 的 idle 设计转述。</text>

  <rect x="510" y="486" width="460" height="130" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="526" y="510" font-size="12" font-weight="bold" fill="#c2410c">与「连接不可用」相关的运行期旋钮</text>
  <text x="526" y="534" font-size="10.5" fill="#9a3412">keepalive 客户端 Time 有 10 s 下限（写更小会被夹到 10 s）</text>
  <text x="526" y="552" font-size="10.5" fill="#9a3412">服务端 ping 策略要 3 次违规才 GOAWAY(too_many_pings)</text>
  <text x="526" y="576" font-size="10.5" fill="#9a3412">idle_timeout 默认 30 分钟把空闲连接放回 IDLE（⚠️ 未调小实测）</text>
  <text x="526" y="594" font-size="10.5" fill="#9a3412">优雅退出会发 GOAWAY(NO_ERROR, "graceful_stop")，这不是故障</text>

  <rect x="30" y="628" width="940" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.3"/>
  <text x="46" y="652" font-size="11.5" font-weight="bold" fill="#0f172a">排障用的一句话判据</text>
  <text x="46" y="674" font-size="10.5" fill="#334155">状态停在 IDLE → 没人推它（缺 Connect() 或第一次 RPC）；停在 CONNECTING → 对端收了 TCP 但没完成 HTTP/2 前言；进过 TRANSIENT_FAILURE → 真连不上</text>
</svg>
