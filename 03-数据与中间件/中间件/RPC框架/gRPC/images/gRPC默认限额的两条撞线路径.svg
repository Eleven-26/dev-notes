<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="g1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">撞到默认限额的两条路径：消息超限走应用层，头表超限走传输层</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">报错码不一样，处置也就不一样 —— 前者调限额，后者减头部体积</text>

  <rect x="330" y="76" width="340" height="40" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="500" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">一次调用发出去了</text>
  <text x="500" y="110" text-anchor="middle" font-size="10.5" fill="#334155">要先分清超限的是「消息体」还是「头部」</text>

  <path d="M500,116 V130 H182 V146" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#g1)"/>
  <path d="M500,116 V130 H818 V146" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#g1)"/>

  <rect x="20" y="150" width="440" height="270" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="40" y="176" font-size="13" font-weight="bold" fill="#1e3a8a">路径 A：消息体超限（默认 4 MiB，只管「收」方向）</text>

  <rect x="40" y="190" width="400" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="52" y="208" font-size="10.5" font-weight="bold" fill="#1e3a8a">四个开关各自独立，按方向成对</text>
  <text x="52" y="226" font-size="10" fill="#1d4ed8">客户端收 MaxCallRecvMsgSize / 客户端发 MaxCallSendMsgSize / 服务端收 MaxRecvMsgSize / 服务端发 MaxSendMsgSize</text>

  <line x1="240" y1="236" x2="240" y2="248" stroke="#64748b" stroke-width="1.4" marker-end="url(#g1)"/>

  <rect x="40" y="252" width="400" height="46" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="52" y="270" font-size="10.5" font-weight="bold" fill="#1e3a8a">默认值来自源码（原样复制）</text>
  <text x="52" y="288" font-size="10" fill="#334155">clientconn.go:139 与 server.go:61 都是 1024 * 1024 * 4</text>

  <line x1="240" y1="298" x2="240" y2="310" stroke="#64748b" stroke-width="1.4" marker-end="url(#g1)"/>

  <rect x="40" y="314" width="400" height="90" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.4"/>
  <text x="52" y="334" font-size="10.5" font-weight="bold" fill="#881337">撞线读数：ResourceExhausted（只失败这一条 RPC，连接还在）</text>
  <text x="52" y="354" font-size="10" fill="#334155">resp 5MiB / 默认客户端：received message larger than max</text>
  <text x="52" y="370" font-size="10" fill="#334155">　(5242913 vs. 4194304)</text>
  <text x="52" y="390" font-size="10" fill="#881337">⚠️ 那个数字是「收到的总字节数」，含 5 字节 gRPC 头，别拿它反推载荷</text>

  <rect x="540" y="150" width="440" height="270" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="560" y="176" font-size="13" font-weight="bold" fill="#4c1d95">路径 B：头部超限（默认 16 MiB，是 HPACK 解压后的头表）</text>

  <rect x="560" y="190" width="400" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="572" y="208" font-size="10.5" font-weight="bold" fill="#4c1d95">默认值来自源码（原样复制）</text>
  <text x="572" y="226" font-size="10" fill="#334155">internal/transport/defaults.go:47-48　= uint32(16 &lt;&lt; 20)</text>

  <line x1="760" y1="236" x2="760" y2="248" stroke="#64748b" stroke-width="1.4" marker-end="url(#g1)"/>

  <rect x="560" y="252" width="400" height="46" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="572" y="270" font-size="10.5" font-weight="bold" fill="#4c1d95">metadata 三连测：撞线点可以预测</text>
  <text x="572" y="288" font-size="10" fill="#334155">1024 KiB → OK　15360 KiB → OK　16384 KiB（正好等于默认值）→ 失败</text>

  <line x1="760" y1="298" x2="760" y2="310" stroke="#64748b" stroke-width="1.4" marker-end="url(#g1)"/>

  <rect x="560" y="314" width="400" height="90" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.4"/>
  <text x="572" y="334" font-size="10.5" font-weight="bold" fill="#881337">撞线读数：Internal（传输层把流掐掉）</text>
  <text x="572" y="354" font-size="10" fill="#334155">stream terminated by RST_STREAM with error code:</text>
  <text x="572" y="370" font-size="10" fill="#334155">　FRAME_SIZE_ERROR</text>
  <text x="572" y="390" font-size="10" fill="#881337">⚠️ 不会好心提示「metadata 太大」—— 看到这个错要先想到头表，别扎进业务代码</text>

  <path d="M240,420 V436" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#g1)"/>
  <path d="M760,420 V436" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#g1)"/>

  <rect x="20" y="440" width="440" height="52" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/>
  <text x="40" y="462" font-size="11.5" font-weight="bold" fill="#134e4a">处置：调限额，两边都得改</text>
  <text x="40" y="480" font-size="10.5" fill="#0f766e">MaxCallRecvMsgSize=8MiB → code=OK recvBodyLen=5242880（回 5MiB 要放客户端，发 5MiB 要放服务端）</text>

  <rect x="540" y="440" width="440" height="52" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/>
  <text x="560" y="462" font-size="11.5" font-weight="bold" fill="#134e4a">处置：减头部体积，不是调限额</text>
  <text x="560" y="480" font-size="10.5" fill="#0f766e">metadata 只放小键值（trace id、身份、租户）；大 payload 走消息体，别当头用</text>

  <rect x="20" y="512" width="960" height="132" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="40" y="538" font-size="12.5" font-weight="bold" fill="#7c2d12">⭐ 读这三张格子的顺序：先看「超的是消息还是头部」，再看「哪一端在收」，最后才轮到「调哪个开关」</text>
  <text x="40" y="566" font-size="11" fill="#9a3412">① 4 MiB 只管收方向：发方向不吃这个限额，所以「服务端回 5 MiB」要放开客户端收，「客户端发 5 MiB」要放开服务端收。</text>
  <text x="40" y="590" font-size="11" fill="#9a3412">② 报错数字含 5 字节 gRPC 头与消息其它字段开销：5 MiB 载荷报错 5242913，只算「载荷 + 5」也已经是 5242885。</text>
  <text x="40" y="614" font-size="11" fill="#9a3412">③ ResourceExhausted 是这条 RPC 失败、连接还在；RST_STREAM 是 HTTP/2 层把这条流掐掉 —— 两者的排障入口完全不同。</text>
</svg>
