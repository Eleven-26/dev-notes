<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="n1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">schema 变更的两道门禁：reserved 管编译，历史比对管「连 reserved 一起删」</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">下面七行结果是本机逐个改坏 .proto 跑出来的真实读数，不是推测</text>

  <rect x="20" y="76" width="150" height="66" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="95" y="102" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">改了一处</text>
  <text x="95" y="120" text-anchor="middle" font-size="10.5" fill="#334155">.proto 提交上来</text>
  <line x1="170" y1="109" x2="188" y2="109" stroke="#64748b" stroke-width="1.5" marker-end="url(#n1)"/>

  <rect x="192" y="70" width="268" height="78" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="206" y="92" font-size="11.5" font-weight="bold" fill="#1e3a8a">门 1　buf build（schema 自检，最便宜）</text>
  <text x="206" y="112" font-size="10" fill="#1d4ed8">✅ 拦得住：在仍写着 reserved 的号上定义字段</text>
  <text x="206" y="128" font-size="10" fill="#1d4ed8">　 → use of reserved field number（编译直接失败）</text>
  <text x="206" y="144" font-size="10" fill="#881337">❌ 拦不住：字段和 reserved 那行一起删 → 实测通过</text>
  <line x1="460" y1="109" x2="478" y2="109" stroke="#64748b" stroke-width="1.5" marker-end="url(#n1)"/>

  <rect x="482" y="70" width="268" height="78" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="496" y="92" font-size="11.5" font-weight="bold" fill="#4c1d95">门 2　buf breaking --against '.git#ref=main'</text>
  <text x="496" y="112" font-size="10" fill="#6d28d9">✅ 跟 git 历史比对：删字段未 reserved / 改 tag / 改类型</text>
  <text x="496" y="128" font-size="10" fill="#6d28d9">WIRE 档只管字节流；FILE 档还管 json_name（改名也拦）</text>
  <text x="496" y="144" font-size="10" fill="#881337">❌ 不懂业务语义：单位元改成分、状态码重排一律放行</text>
  <line x1="750" y1="109" x2="768" y2="109" stroke="#64748b" stroke-width="1.5" marker-end="url(#n1)"/>

  <rect x="772" y="70" width="208" height="78" rx="9" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text x="786" y="92" font-size="11.5" font-weight="bold" fill="#881337">两道门都放行的一栏</text>
  <text x="786" y="112" font-size="10" fill="#334155">改语义：age 改名 months、</text>
  <text x="786" y="128" font-size="10" fill="#334155">金额元改分、状态码重排</text>
  <text x="786" y="144" font-size="10" fill="#881337">→ 只剩 review 与 PR 模板</text>

  <text x="20" y="182" font-size="12" font-weight="bold" fill="#0f172a">七组「故意改坏」的真实结果</text>

  <rect x="20" y="192" width="960" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="30" y="210" font-size="10.5" font-weight="bold" fill="#0f172a">故意做的改动</text>
  <text x="300" y="210" font-size="10.5" font-weight="bold" fill="#0f172a">buf build</text>
  <text x="404" y="210" font-size="10.5" font-weight="bold" fill="#0f172a">WIRE 档</text>
  <text x="492" y="210" font-size="10.5" font-weight="bold" fill="#0f172a">FILE 档</text>
  <text x="580" y="210" font-size="10.5" font-weight="bold" fill="#0f172a">实测输出（原文）</text>

  <rect x="20" y="222" width="960" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="248" font-size="10.5" fill="#0f172a">加一个新字段 nickname = 8</text>
  <text x="316" y="248" font-size="10.5" fill="#334155">通过</text>
  <text x="412" y="248" font-size="10.5" fill="#0d9488">放行</text>
  <text x="500" y="248" font-size="10.5" fill="#0d9488">放行</text>
  <text x="580" y="248" font-size="10.5" fill="#881337">全放行 —— 老客户端看不到它，不能当必填用，只能靠 review</text>

  <rect x="20" y="266" width="960" height="44" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="292" font-size="10.5" fill="#0f172a">删字段 hobby = 3，同时补 reserved 3</text>
  <text x="316" y="292" font-size="10.5" fill="#334155">通过</text>
  <text x="412" y="292" font-size="10.5" fill="#0d9488">放行</text>
  <text x="492" y="292" font-size="10.5" font-weight="bold" fill="#e11d48">拦下</text>
  <text x="580" y="292" font-size="10.5" fill="#334155">Previously present field "3" with name "hobby" on message "User" was deleted.</text>

  <rect x="20" y="310" width="960" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="336" font-size="10.5" fill="#0f172a">删字段 hobby = 3，没补 reserved</text>
  <text x="316" y="336" font-size="10.5" fill="#334155">通过</text>
  <text x="404" y="336" font-size="10.5" font-weight="bold" fill="#e11d48">拦下</text>
  <text x="492" y="336" font-size="10.5" font-weight="bold" fill="#e11d48">拦下</text>
  <text x="580" y="336" font-size="10.5" fill="#334155">... was deleted without reserving the number "3".　← 只有历史比对查得出</text>

  <rect x="20" y="354" width="960" height="44" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="380" font-size="10.5" fill="#0f172a">改 tag：name 从 1 改成 5</text>
  <text x="316" y="380" font-size="10.5" fill="#334155">通过</text>
  <text x="404" y="380" font-size="10.5" font-weight="bold" fill="#e11d48">拦下</text>
  <text x="492" y="380" font-size="10.5" font-weight="bold" fill="#e11d48">拦下</text>
  <text x="580" y="380" font-size="10.5" fill="#334155">field "1" with name "name" ... deleted without reserving the number "1".　数据直接错位</text>

  <rect x="20" y="398" width="960" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="424" font-size="10.5" fill="#0f172a">改类型：age 从 int64 改成 string</text>
  <text x="316" y="424" font-size="10.5" fill="#334155">通过</text>
  <text x="404" y="424" font-size="10.5" font-weight="bold" fill="#e11d48">拦下</text>
  <text x="492" y="424" font-size="10.5" font-weight="bold" fill="#e11d48">拦下</text>
  <text x="580" y="424" font-size="10.5" fill="#334155">Field "2" with name "age" ... changed type from "int64" to "string".</text>

  <rect x="20" y="442" width="960" height="44" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="468" font-size="10.5" fill="#0f172a">只改字段名 name → full_name</text>
  <text x="316" y="468" font-size="10.5" fill="#334155">通过</text>
  <text x="412" y="468" font-size="10.5" fill="#0d9488">放行</text>
  <text x="492" y="468" font-size="10.5" font-weight="bold" fill="#e11d48">拦下</text>
  <text x="580" y="468" font-size="10.5" fill="#334155">changed option "json_name" from "name" to "fullName"　← JSON 映射对前端是真实的兼容性</text>

  <rect x="20" y="486" width="960" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="512" font-size="10.5" fill="#0f172a">在仍写着 reserved 6, 7 的 message 里用 tag 6 定义字段</text>
  <text x="308" y="512" font-size="10.5" font-weight="bold" fill="#e11d48">编译直接失败</text>
  <text x="416" y="512" font-size="10.5" fill="#94a3b8">—</text>
  <text x="504" y="512" font-size="10.5" fill="#94a3b8">—</text>
  <text x="580" y="512" font-size="10.5" fill="#334155">use of reserved field number 6　← 这条纪律有一半是机器保证的</text>

  <rect x="20" y="546" width="960" height="116" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="40" y="572" font-size="12.5" font-weight="bold" fill="#134e4a">三条结论</text>
  <text x="40" y="598" font-size="11" fill="#0f766e">① reserved 由编译器强制执行，但它管不了「字段和 reserved 那行一起删」—— 所以 reserved 与 CI 历史比对缺一不可，不是重复建设。</text>
  <text x="40" y="620" font-size="11" fill="#0f766e">② FILE 连改名都拦（它管 json_name），WIRE 只管字节流（改名放行、删字段只要 reserved 就放行）。</text>
  <text x="40" y="642" font-size="11" fill="#0f766e">③ 默认用 FILE；只有确认下游全是二进制、且希望减少误报时才降到 WIRE。⚠️ buf breaking 依旧不懂业务语义，这类只能靠 review。</text>
</svg>
