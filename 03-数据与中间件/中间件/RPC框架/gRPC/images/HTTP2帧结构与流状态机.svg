<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="h2arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="h2arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">HTTP/2 帧头 9 字节与流的状态机</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">长度、类型、标志、流 ID 四段；下面两类帧与状态迁移的读数全部来自 out/wire.txt 与 out/limits.txt</text>

  <text x="30" y="86" font-size="13" font-weight="bold" fill="#0f172a">① 帧头：3 字节长度 + 1 字节类型 + 1 字节标志 + 4 字节流 ID（载荷不计入长度）</text>
  <rect x="30" y="96" width="300" height="44" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="180" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Length（24 位）</text>
  <text x="180" y="134" text-anchor="middle" font-size="10.5" fill="#1d4ed8">只算载荷，不含这 9 字节</text>
  <rect x="330" y="96" width="100" height="44" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="380" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Type</text>
  <text x="380" y="134" text-anchor="middle" font-size="10.5" fill="#15803d">1 字节</text>
  <rect x="430" y="96" width="100" height="44" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="480" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">Flags</text>
  <text x="480" y="134" text-anchor="middle" font-size="10.5" fill="#c2410c">1 字节</text>
  <rect x="530" y="96" width="400" height="44" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="730" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Stream Identifier（31 位 + 1 位保留）</text>
  <text x="730" y="134" text-anchor="middle" font-size="10.5" fill="#1d4ed8">0 = 连接级帧；客户端发起的流用奇数</text>
  <text x="30" y="160" font-size="10.5" fill="#334155">类型：DATA=0x0　HEADERS=0x1　PRIORITY=0x2　RST_STREAM=0x3　SETTINGS=0x4　PUSH_PROMISE=0x5　PING=0x6　GOAWAY=0x7　WINDOW_UPDATE=0x8　CONTINUATION=0x9</text>
  <text x="30" y="178" font-size="10.5" fill="#334155">标志：END_STREAM=0x1（HEADERS / DATA）　END_HEADERS=0x4（HEADERS / CONTINUATION）　ACK=0x1（SETTINGS / PING）</text>

  <text x="30" y="212" font-size="13" font-weight="bold" fill="#0f172a">② 一次调用真实出现过的帧（15 帧；len 与 flags 原样抄自 wire.txt）</text>
  <rect x="30" y="222" width="940" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.3"/>
  <text x="48" y="246" font-size="11" font-weight="bold" fill="#0f172a">SETTINGS(stream=0,len=0,flags=0x00)</text>
  <text x="48" y="264" font-size="11" fill="#334155">SETTINGS(stream=0,len=0,flags=0x01)　← 应答帧（ACK）：gRPC 这次没改任何默认参数，所以载荷为空</text>
  <text x="48" y="282" font-size="11" fill="#1d4ed8">HEADERS(stream=1,len=93,flags=0x04)　HEADERS(stream=3,len=15,flags=0x04)　HEADERS(stream=5,len=29,flags=0x04)</text>
  <text x="48" y="300" font-size="11" fill="#1d4ed8">HEADERS(stream=7,len=15,flags=0x04)　HEADERS(stream=9,len=15,flags=0x04)　← 0x04 即 END_HEADERS，头块一帧发完（所以没有 CONTINUATION）</text>
  <text x="48" y="318" font-size="11" fill="#c2410c">DATA(stream=1,len=12)　DATA(stream=3,len=12)　DATA(stream=5,len=25)　DATA(stream=7,len=25)　DATA(stream=9,len=17)　← 都是 0x01（END_STREAM）</text>
  <text x="48" y="336" font-size="11" fill="#334155">PING(stream=0,len=8,flags=0x01)　WINDOW_UPDATE(stream=0,len=4,flags=0x00)　PING(stream=0,len=8,flags=0x00)</text>
  <text x="48" y="358" font-size="11" font-weight="bold" fill="#0f172a">streamIDs: [1 3 5 7 9] ← 全奇数（客户端发起）；这一轮没有 RST_STREAM、也没有 GOAWAY</text>

  <text x="30" y="400" font-size="13" font-weight="bold" fill="#0f172a">③ 流的状态机：正常收尾靠 END_STREAM，异常只有两种表达</text>

  <rect x="40" y="420" width="150" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="115" y="442" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">idle</text>
  <text x="115" y="460" text-anchor="middle" font-size="10" fill="#475569">还没建流</text>

  <line x1="190" y1="446" x2="270" y2="446" stroke="#2563eb" stroke-width="1.6" marker-end="url(#h2arrow)"/>
  <text x="230" y="438" text-anchor="middle" font-size="10" fill="#1d4ed8">HEADERS</text>

  <rect x="272" y="420" width="150" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="347" y="442" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">open</text>
  <text x="347" y="460" text-anchor="middle" font-size="10" fill="#1d4ed8">两个方向都能发</text>

  <line x1="422" y1="446" x2="502" y2="446" stroke="#2563eb" stroke-width="1.6" marker-end="url(#h2arrow)"/>
  <text x="462" y="432" text-anchor="middle" font-size="10" fill="#1d4ed8">发 DATA</text>
  <text x="462" y="464" text-anchor="middle" font-size="10" fill="#1d4ed8">END_STREAM</text>

  <rect x="504" y="420" width="196" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="602" y="442" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c2410c">half-closed(local)</text>
  <text x="602" y="460" text-anchor="middle" font-size="10" fill="#c2410c">我说完了，还能收（= CloseSend）</text>

  <line x1="700" y1="446" x2="780" y2="446" stroke="#16a34a" stroke-width="1.6" marker-end="url(#h2arrow)"/>
  <text x="740" y="438" text-anchor="middle" font-size="10" fill="#15803d">收 END_STREAM</text>

  <rect x="782" y="420" width="150" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="857" y="442" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">closed</text>
  <text x="857" y="460" text-anchor="middle" font-size="10" fill="#15803d">这条流用完了</text>

  <path d="M 347 472 L 347 512 L 857 512 L 857 472" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="602" y="528" text-anchor="middle" font-size="10.5" fill="#b91c1c">任一方发 RST_STREAM → 直接进 closed（异常路径）</text>

  <rect x="30" y="546" width="460" height="96" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="46" y="570" font-size="12" font-weight="bold" fill="#991b1b">RST_STREAM：掐一条流（带 4 字节错误码）</text>
  <text x="46" y="592" font-size="10.5" fill="#7f1d1d">实测：metadata 16384 KiB → RST_STREAM + FRAME_SIZE_ERROR</text>
  <text x="46" y="610" font-size="10.5" fill="#7f1d1d">来源：grpc-go 服务端检测到头列表被截断（http2_server.go:386-393）</text>
  <text x="46" y="630" font-size="10.5" fill="#7f1d1d">常见码：PROTOCOL_ERROR=0x1　FLOW_CONTROL_ERROR=0x3　FRAME_SIZE_ERROR=0x6　CANCEL=0x8</text>

  <rect x="510" y="546" width="460" height="96" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="526" y="570" font-size="12" font-weight="bold" fill="#991b1b">GOAWAY：掐整条连接（带最后流 ID + 错误码 + debug）</text>
  <text x="526" y="592" font-size="10.5" fill="#7f1d1d">ENHANCE_YOUR_CALM + debug "too_many_pings" ← 客户端 ping 太频繁</text>
  <text x="526" y="610" font-size="10.5" fill="#7f1d1d">NO_ERROR + debug "graceful_stop" ← 服务端优雅退出，不是故障</text>
  <text x="526" y="630" font-size="10.5" fill="#7f1d1d">两者都是 stream=0 的连接级帧，载荷 4 + 4 + debugData 字节</text>

  <rect x="30" y="656" width="940" height="84" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="46" y="680" font-size="12" font-weight="bold" fill="#0f172a">⭐ 一句话记住状态机：END_STREAM 是「我在这个方向说完了」（半关闭），不是「这条流结束了」</text>
  <text x="46" y="702" font-size="11" fill="#334155">所以 io.EOF 是正常收尾——服务端 handler 只靠它退出循环；把它当错误就会让成功的流式调用走进错误分支</text>
  <text x="46" y="724" font-size="11" fill="#64748b">对照：TLS 握手发生在更下面一层；帧与流这一层完全不知道业务叫什么名、消息长什么样</text>
</svg>
