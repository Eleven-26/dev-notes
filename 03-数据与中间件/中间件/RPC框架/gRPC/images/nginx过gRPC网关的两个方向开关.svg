<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="x1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">过网关：两个方向是独立开关 —— http2 on 只管「打进来」，grpc_pass 才管「打出去」</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">两组配置只差一行，实测结果一边全通、一边三组全废（nginx 1.26.3 官方镜像 + 同一台 gRPC 后端）</text>

  <rect x="40" y="76" width="200" height="56" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="98" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">客户端</text>
  <text x="140" y="116" text-anchor="middle" font-size="10" fill="#1d4ed8">grpc-go / grpc-java，h2c 明文</text>
  <line x1="240" y1="104" x2="286" y2="104" stroke="#64748b" stroke-width="1.6" marker-end="url(#x1)"/>
  <text x="248" y="96" font-size="10" fill="#0d9488">前端方向 ✅</text>

  <rect x="290" y="72" width="420" height="64" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="500" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">nginx：listen 50051; http2 on;</text>
  <text x="500" y="112" text-anchor="middle" font-size="10" fill="#334155">这一句只决定「客户端能不能用 HTTP/2 打进来」</text>
  <text x="500" y="128" text-anchor="middle" font-size="10" fill="#881337">⚠️ 它完全不决定「nginx 用什么协议打出去」</text>

  <path d="M400,136 V152 H250 V166" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#x1)"/>
  <path d="M600,136 V152 H750 V166" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#x1)"/>

  <rect x="40" y="170" width="420" height="56" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
  <text x="54" y="192" font-size="11.5" font-weight="bold" fill="#134e4a">出口 A　grpc_pass grpc://grpclab-server:50051</text>
  <text x="54" y="212" font-size="10" fill="#0f766e">nginx 用 HTTP/2 与后端说话：请求行还原成 "POST /demo.Echo/Unary HTTP/2.0"</text>

  <rect x="540" y="170" width="420" height="56" rx="9" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.6"/>
  <text x="554" y="192" font-size="11.5" font-weight="bold" fill="#881337">出口 B　proxy_pass http://... + proxy_http_version 1.1</text>
  <text x="554" y="212" font-size="10" fill="#334155">nginx 用 HTTP/1.1 与后端说话，而后端只会回 HTTP/2 二进制帧</text>

  <line x1="250" y1="226" x2="250" y2="242" stroke="#64748b" stroke-width="1.5" marker-end="url(#x1)"/>
  <line x1="750" y1="226" x2="750" y2="242" stroke="#64748b" stroke-width="1.5" marker-end="url(#x1)"/>

  <rect x="40" y="246" width="420" height="128" rx="9" fill="#f8fafc" stroke="#0d9488" stroke-width="1.4"/>
  <text x="54" y="270" font-size="11.5" font-weight="bold" fill="#134e4a">四种调用全通（与直连逐字一致）</text>
  <text x="54" y="294" font-size="10.5" fill="#0f766e">一元：OK，x-handler=[unary] 与 x-trailer-note=[set-in-unary-handler] 两者都在</text>
  <text x="54" y="314" font-size="10.5" fill="#0f766e">服务端流：recv=5，正常收尾 EOF</text>
  <text x="54" y="334" font-size="10.5" fill="#0f766e">双向流：recv=3，正常收尾 EOF</text>
  <text x="54" y="358" font-size="10.5" font-weight="bold" fill="#134e4a">header 与 trailer 都没在半路被吃掉</text>

  <rect x="540" y="246" width="420" height="128" rx="9" fill="#f8fafc" stroke="#e11d48" stroke-width="1.4"/>
  <text x="554" y="270" font-size="11.5" font-weight="bold" fill="#881337">三组全废，而且不像「没发出去」</text>
  <text x="554" y="294" font-size="10.5" fill="#334155">一元：code=Internal，header / trailer 全空</text>
  <text x="554" y="314" font-size="10.5" fill="#334155">服务端流：recv=0，DeadlineExceeded</text>
  <text x="554" y="334" font-size="10.5" fill="#334155">双向流：recv=0，Internal</text>
  <text x="554" y="358" font-size="10" fill="#881337">nginx 错误日志：upstream sent no valid HTTP/1.0 header　→　readv() failed (104: Connection reset by peer)</text>

  <rect x="40" y="386" width="920" height="66" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="54" y="410" font-size="11.5" font-weight="bold" fill="#4c1d95">读法：proxy_pass 拿到的是 HTTP/2 的二进制帧头，被当成「非法 HTTP/1.0 响应头」直接判错，随后连接被重置</text>
  <text x="54" y="432" font-size="11" fill="#6d28d9">症状是「报文看起来发出去又没回」，而不是「协议不支持」—— 所以要先确认反向代理层没有在中间做 HTTP/1.1 降级</text>

  <rect x="40" y="464" width="920" height="156" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="56" y="488" font-size="12" font-weight="bold" fill="#0f172a">三个容易配错的点（抄配置时逐条对一遍）</text>
  <text x="56" y="514" font-size="11" fill="#334155">① 旋钮名字要成套：proxy_read_timeout / proxy_send_timeout 只作用于 proxy_pass；gRPC 走 grpc_read_timeout / grpc_send_timeout —— 配错名字等于没配。</text>
  <text x="56" y="538" font-size="11" fill="#334155">② 长流要把读超时放长：grpc_read_timeout 必须显著大于「最长的一次响应间隔」，否则代理在业务还没结束时就掐断，客户端拿到 Unavailable。</text>
  <text x="56" y="562" font-size="11" fill="#334155">③ grpc_next_upstream 只在上游还没开始返回时才换机器，不能靠它做业务级重试；透传真实身份用 grpc_set_header X-Real-IP / X-Trace-Id。</text>
  <text x="56" y="590" font-size="11.5" font-weight="bold" fill="#0d9488">⭐ 一句话判据：后端是 gRPC 就用 grpc_pass（TLS 时 grpcs://）；同一个 server 里不同 location 各用各的，普通 HTTP 接口照常 proxy_pass。</text>
  <text x="56" y="610" font-size="10.5" fill="#64748b">对照组：直连 grpclab-server:50051 三组结果与 grpc_pass 完全一致，说明差异确实只出在「中间那一跳用什么协议说话」</text>
</svg>
