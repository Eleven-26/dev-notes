<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="570" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">gRPC 十三篇的硬前置依赖地图（箭头从「前置」指向「后置」）</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">基础概念是 7 篇的硬前置；Protobuf 是唯一独立的根；右列是叠在其上的第二层零件篇</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="40" y="244" width="200" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="140" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">基础概念.md</text>
  <text x="140" y="288" text-anchor="middle" font-size="11.5" fill="#166534">① 地基 · 7 篇的硬前置</text>

  <rect x="40" y="430" width="200" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="140" y="452" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Protobuf.md</text>
  <text x="140" y="470" text-anchor="middle" font-size="11.5" fill="#64748b">独立根 · 无硬前置</text>

  <rect x="330" y="64" width="240" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="450" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">HTTP2机制.md</text>
  <rect x="330" y="116" width="240" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="450" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">四种通信模式.md</text>
  <rect x="330" y="168" width="240" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="450" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">连接与生命周期.md</text>
  <rect x="330" y="220" width="240" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="450" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">拦截器与元数据.md</text>
  <rect x="330" y="272" width="240" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="450" y="297" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">安全与认证.md</text>
  <rect x="330" y="324" width="240" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="450" y="349" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">生态与网关.md</text>
  <rect x="330" y="376" width="240" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="450" y="401" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">故障排查与调试.md</text>

  <line x1="240" y1="272" x2="330" y2="86" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="240" y1="272" x2="330" y2="137" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="240" y1="272" x2="330" y2="189" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="240" y1="272" x2="330" y2="241" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="240" y1="272" x2="330" y2="293" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="240" y1="272" x2="330" y2="345" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="240" y1="272" x2="330" y2="397" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="680" y="116" width="270" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="815" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">性能与调优.md</text>
  <rect x="680" y="220" width="270" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="815" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">可观测性.md</text>
  <rect x="680" y="296" width="270" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="815" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">gRPC-Web与Connect.md</text>
  <rect x="680" y="400" width="270" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="815" y="425" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">实战示例.md ③</text>

  <line x1="570" y1="88" x2="680" y2="130" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="570" y1="140" x2="680" y2="134" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="570" y1="240" x2="680" y2="240" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="570" y1="150" x2="680" y2="310" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr)"/>

  <line x1="640" y1="64" x2="640" y2="420" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="640" y1="420" x2="680" y2="420" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrG)"/>
  <text x="634" y="474" text-anchor="middle" font-size="11.5" fill="#64748b">前面各篇 →</text>

  <line x1="20" y1="492" x2="980" y2="492" stroke="#cbd5e1" stroke-width="1"/>

  <text x="20" y="516" font-size="12.5" fill="#0f172a">⭐ 顺序不能倒：① 基础概念 → ② 四种通信模式 → ③ 实战示例；故障排查与调试是全目录的「症状 → 篇目」索引。</text>
  <text x="20" y="540" font-size="12.5" fill="#0f172a">⚠️ 本图只画第四节表的「硬前置」列；强关联（互相引用）未画，以正文表格为准。</text>
</svg>
