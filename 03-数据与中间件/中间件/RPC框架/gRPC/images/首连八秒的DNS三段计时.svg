<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">首连慢 8 秒的唯一来源：TXT 那一段，不是 A/AAAA、也不是 SRV</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">三组探针的分段计时（out/probe-*.txt）；条宽是示意，TXT 段按对数压缩绘制，标注数字全部是实测值</text>

  <text x="30" y="88" font-size="11.5" font-weight="bold" fill="#0f172a">组 1　grpclab-server:50051（默认 dns resolver，TXT 走不通但没关掉）</text>
  <rect x="30" y="96" width="40" height="28" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <text x="78" y="115" font-size="10.5" fill="#134e4a">A/AAAA 24 ms</text>
  <rect x="196" y="96" width="120" height="28" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.4"/>
  <text x="206" y="115" font-size="10.5" fill="#881337">TXT 650 ms</text>
  <text x="326" y="115" font-size="10" fill="#881337">no such host</text>
  <rect x="424" y="96" width="60" height="28" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <text x="492" y="115" font-size="10.5" fill="#134e4a">SRV 195 ms</text>
  <text x="640" y="115" font-size="11" font-weight="bold" fill="#0d9488">READY 26 ms　｜　首次 invoke 3 ms</text>

  <text x="30" y="152" font-size="11.5" font-weight="bold" fill="#0f172a">组 2　同一目标 + GRPC_ENABLE_TXT_SERVICE_CONFIG=false（把 TXT 那次查询关掉）</text>
  <rect x="30" y="160" width="26" height="28" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <text x="64" y="179" font-size="10.5" fill="#134e4a">A/AAAA 3 ms</text>
  <rect x="176" y="160" width="34" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="218" y="179" font-size="10.5" fill="#1d4ed8">TXT 8 ms</text>
  <rect x="316" y="160" width="26" height="28" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <text x="350" y="179" font-size="10.5" fill="#134e4a">SRV 6 ms</text>
  <text x="640" y="179" font-size="11" font-weight="bold" fill="#0d9488">READY 3 ms　｜　首次 invoke 3 ms</text>

  <text x="30" y="216" font-size="11.5" font-weight="bold" fill="#0f172a">组 3　passthrough:///grpclab-server:50051（grpc 不解析，但探针自己仍查了一次 TXT）</text>
  <rect x="30" y="224" width="26" height="28" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <text x="64" y="243" font-size="10.5" fill="#134e4a">A/AAAA 4 ms</text>
  <rect x="176" y="224" width="500" height="28" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.6"/>
  <text x="186" y="243" font-size="10.5" font-weight="bold" fill="#881337">TXT 8.005 s　server misbehaving（同一个名字，一会儿 650 ms、一会儿 8 秒）</text>
  <rect x="688" y="224" width="40" height="28" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <text x="736" y="243" font-size="10.5" fill="#134e4a">SRV 55 ms</text>
  <text x="640" y="267" font-size="11" font-weight="bold" fill="#0d9488">而 grpc 建连只花：READY 6 ms　｜　首次 invoke 1 ms</text>

  <rect x="30" y="286" width="940" height="76" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="46" y="310" font-size="11.5" font-weight="bold" fill="#0f172a">源码里的四行（internal/resolver/dns/dns_resolver.go，grpc v1.84.0，原样复制）</text>
  <text x="46" y="332" font-size="10.5" fill="#334155">txtPrefix = "_grpc_config."　　state.ServiceConfig = d.lookupTXT(ctx)</text>
  <text x="46" y="352" font-size="10.5" fill="#334155">EnableTXTServiceConfig = boolFromEnv("GRPC_ENABLE_TXT_SERVICE_CONFIG", true)　　ResolvingTimeout = 30 * time.Second</text>

  <rect x="30" y="376" width="460" height="120" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="46" y="400" font-size="12" font-weight="bold" fill="#134e4a">两条修法（都实测有效）</text>
  <text x="46" y="424" font-size="10.5" fill="#0f766e">① passthrough:///host:port → READY 6 ms：地址原样交给 balancer，</text>
  <text x="46" y="442" font-size="10.5" fill="#0f766e">　 跳过 resolver，顺带省掉 TXT 那次查询</text>
  <text x="46" y="466" font-size="10.5" fill="#0f766e">② GRPC_ENABLE_TXT_SERVICE_CONFIG=false → READY 3 ms</text>
  <text x="46" y="484" font-size="10.5" fill="#881337">⚠️ 副作用：同时关掉「靠 DNS TXT 下发 retryPolicy / loadBalancingConfig」</text>

  <rect x="510" y="376" width="460" height="120" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="526" y="400" font-size="12" font-weight="bold" fill="#7c2d12">两件事别混为一谈</text>
  <text x="526" y="424" font-size="10.5" fill="#9a3412">「等不到 READY」是状态机没被推动：grpc.NewClient 是惰性的，</text>
  <text x="526" y="442" font-size="10.5" fill="#9a3412">不 Connect()、不发 RPC 就永远停在 IDLE（第一版探针等了 30 秒没动）</text>
  <text x="526" y="466" font-size="10.5" fill="#9a3412">「首连慢 8 秒」是 DNS TXT 那一跳拖住的</text>
  <text x="526" y="484" font-size="10.5" font-weight="bold" fill="#7c2d12">探针里先调 Connect()，再看 READY 耗时，两个数才都有意义</text>

  <rect x="30" y="510" width="940" height="72" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="46" y="536" font-size="12" font-weight="bold" fill="#0f172a">⭐ 把结论钉死的是组 3 那一轮：同一份输出里，探针自己的 TXT 查询花了 8.005 s，而 grpc 建连只花 6 ms</text>
  <text x="46" y="560" font-size="11" fill="#334155">两者并列 → 这 8 秒与 gRPC 的连接过程无关，只与那次独立的 DNS 查询有关；Docker 内嵌 DNS（127.0.0.11:53）对同一个名字也可能一会儿 no such host、一会儿 server misbehaving</text>
  <text x="46" y="576" font-size="11" fill="#64748b">时序类数字有波动，这里只断言趋势：A/AAAA 与 SRV 都在毫秒级，只有 TXT 会飙到秒级</text>
</svg>
