<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">浏览器侧选型判据：三问定方案</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">三问 = 前端是谁、要不要流、愿不愿意多一跳（第五节推荐表）；黄底是判定问句，绿底是结论，红底是「此路不通」</text>

  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="390" y="70" width="220" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="500" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">这个接口给谁调用？</text>

  <path d="M390,93 L155,93 L155,158" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr3)"/>
  <rect x="40" y="162" width="240" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="160" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">只服务端之间 → 直接原生 gRPC</text>
  <text x="160" y="208" text-anchor="middle" font-size="11.5" fill="#166534">本篇三个方案都不需要</text>

  <path d="M610,93 L845,93 L845,158" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr3)"/>
  <rect x="720" y="162" width="250" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="845" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">给第三方 → grpc-gateway</text>
  <text x="845" y="208" text-anchor="middle" font-size="11.5" fill="#166534">输出标准 REST/JSON + OpenAPI</text>

  <line x1="500" y1="116" x2="500" y2="152" stroke="#475569" stroke-width="1.4" marker-end="url(#arr3)"/>
  <text x="512" y="140" font-size="11.5" fill="#64748b">自家浏览器应用</text>

  <rect x="380" y="156" width="240" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="500" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">有客户端流 / 双向流？</text>

  <path d="M380,179 L175,179 L175,246" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr3)"/>
  <text x="262" y="172" font-size="11.5" fill="#b91c1c">有</text>
  <rect x="40" y="250" width="270" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="175" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">三条路都不通</text>
  <text x="175" y="296" text-anchor="middle" font-size="11.5" fill="#7f1d1d">用 WebSocket / SSE 另开通道，</text>
  <text x="175" y="312" text-anchor="middle" font-size="11.5" fill="#7f1d1d">或改成「服务端流 + 上行普通请求」</text>

  <line x1="500" y1="202" x2="500" y2="252" stroke="#475569" stroke-width="1.4" marker-end="url(#arr3)"/>
  <text x="512" y="232" font-size="11.5" fill="#64748b">没有（只剩一元 / 服务端流）</text>

  <rect x="380" y="256" width="240" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="500" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Envoy / 网格已在链路上？</text>

  <path d="M620,279 L760,279 L760,326" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr3)"/>
  <text x="672" y="272" font-size="11.5" fill="#166534">在</text>
  <rect x="640" y="330" width="250" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="765" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">gRPC-Web + Envoy 过滤器</text>
  <text x="765" y="376" text-anchor="middle" font-size="11.5" fill="#166534">加过滤器成本最低 · 方案最成熟</text>

  <line x1="500" y1="302" x2="500" y2="352" stroke="#475569" stroke-width="1.4" marker-end="url(#arr3)"/>
  <text x="512" y="332" font-size="11.5" fill="#64748b">不在，也不想加代理</text>

  <rect x="360" y="356" width="280" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="500" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Connect：浏览器直连</text>
  <text x="500" y="402" text-anchor="middle" font-size="11.5" fill="#166534">代价：服务实现要搬到 Connect 接口上</text>

  <line x1="20" y1="442" x2="980" y2="442" stroke="#cbd5e1" stroke-width="1"/>

  <text x="20" y="466" font-size="12.5" fill="#0f172a">⚠️ 反向判据：别用 gRPC-Web 做「REST 对外开放」；代理已在链路上时，加 Envoy 过滤器比迁移 Connect 便宜；</text>
  <text x="20" y="488" font-size="12.5" fill="#0f172a">⚠️ 浏览器做客户端流换什么协议都解决不了——那是 fetch 的限制。本篇四项均未实测，判据用于选型与排查方向。</text>
</svg>
