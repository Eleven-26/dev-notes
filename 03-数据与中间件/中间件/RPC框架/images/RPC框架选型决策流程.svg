<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">RPC 框架选型：先问主语言，再按「起点资产」分派</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">中间三列是三条决策线，每列自上而下读；最下面那条横带与语言无关，任何时候都要满足</text>

  <rect x="30" y="76" width="940" height="54" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="45" y="96" font-size="12" font-weight="bold" fill="#0f172a">入口三问：任一条答成「不愿意 / 不需要」，就往右移一列（越往右，schema 的成本越不值得付）</text>
  <rect x="45" y="104" width="290" height="20" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="190" y="118" text-anchor="middle" font-size="10" fill="#1e40af">① 主语言是什么？</text>
  <rect x="360" y="104" width="290" height="20" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="505" y="118" text-anchor="middle" font-size="10" fill="#1e40af">② 调用双方愿不愿意共同维护 schema？</text>
  <rect x="675" y="104" width="290" height="20" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="820" y="118" text-anchor="middle" font-size="10" fill="#1e40af">③ 要不要流式 / 服务端主动推？</text>

  <path d="M500,130 V146 H178 V166" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M500,130 V166" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M500,130 V146 H822 V166" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="30" y="170" width="296" height="286" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="352" y="170" width="296" height="286" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="674" y="170" width="296" height="286" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 3"/>

  <rect x="42" y="182" width="272" height="42" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="178" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">A · Java 为主</text>
  <text x="178" y="218" text-anchor="middle" font-size="10.5" fill="#1d4ed8">Java 团队真正的选择题：Dubbo 还是 gRPC</text>

  <rect x="42" y="234" width="272" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="52" y="250" font-size="10" font-weight="bold" fill="#1e3a8a">要路由 / 灰度 / 动态配置</text>
  <text x="52" y="266" font-size="9.5" fill="#1d4ed8">⭐ 选 Dubbo：治理在框架内，别自己拼</text>
  <line x1="178" y1="278" x2="178" y2="288" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="42" y="290" width="272" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="52" y="306" font-size="10" font-weight="bold" fill="#1e3a8a">要与 Go / PHP 互通</text>
  <text x="52" y="322" font-size="9.5" fill="#1d4ed8">Dubbo 3 的 Triple，或调用层直接换 gRPC</text>
  <line x1="178" y1="334" x2="178" y2="344" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="42" y="346" width="272" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="52" y="362" font-size="10" font-weight="bold" fill="#1e3a8a">要四种通信模式（含双向流）</text>
  <text x="52" y="378" font-size="9.5" fill="#1d4ed8">gRPC：四种模式是一等公民</text>
  <line x1="178" y1="390" x2="178" y2="400" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="42" y="402" width="272" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="52" y="418" font-size="10" font-weight="bold" fill="#1e3a8a">存量是 Spring Cloud + Feign</text>
  <text x="52" y="434" font-size="9.5" fill="#1d4ed8">只把跨进程热点换 gRPC，别整体重写</text>

  <rect x="364" y="182" width="272" height="42" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="500" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">B · Go 为主 / 语言混合</text>
  <text x="500" y="218" text-anchor="middle" font-size="10.5" fill="#166534">本仓实测全部落在这一列</text>

  <rect x="364" y="234" width="272" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="374" y="250" font-size="10" font-weight="bold" fill="#14532d">Go 服务之间互调</text>
  <text x="374" y="266" font-size="9.5" fill="#166534">⭐ gRPC：官方 grpc-go，与 net 生态贴合</text>
  <line x1="500" y1="278" x2="500" y2="288" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="364" y="290" width="272" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="374" y="306" font-size="10" font-weight="bold" fill="#14532d">Go 要调 Java 的 Dubbo 服务</text>
  <text x="374" y="322" font-size="9.5" fill="#166534">让 Java 侧暴露 gRPC / Triple，别跑 dubbo-go</text>
  <line x1="500" y1="334" x2="500" y2="344" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="364" y="346" width="272" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="374" y="362" font-size="10" font-weight="bold" fill="#14532d">多语言且契约变更频繁</text>
  <text x="374" y="378" font-size="9.5" fill="#166534">gRPC + buf 门禁：把「改坏」挡在 CI</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="364" y="402" width="272" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="374" y="418" font-size="10" font-weight="bold" fill="#14532d">调用方里有浏览器</text>
  <text x="374" y="434" font-size="9.5" fill="#166534">gRPC-Web 或 grpc-gateway，都要多一个组件</text>

  <rect x="686" y="182" width="272" height="42" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
  <text x="822" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">C · 存量就是 REST</text>
  <text x="822" y="218" text-anchor="middle" font-size="10.5" fill="#9a3412">先问「动不动」，再问「动哪条」</text>

  <rect x="686" y="234" width="272" height="42" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="696" y="250" font-size="10" font-weight="bold" fill="#7c2d12">调用量小、团队小</text>
  <text x="696" y="266" font-size="9.5" fill="#9a3412">⭐ 先不动：REST + JSON 运维成本最低</text>
  <line x1="822" y1="278" x2="822" y2="288" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="686" y="290" width="272" height="42" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="696" y="306" font-size="10" font-weight="bold" fill="#7c2d12">有明确的服务间热点</text>
  <text x="696" y="322" font-size="9.5" fill="#9a3412">只把这条链路换成 gRPC，其他不动</text>
  <line x1="822" y1="334" x2="822" y2="344" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="686" y="346" width="272" height="42" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="696" y="362" font-size="10" font-weight="bold" fill="#7c2d12">传输体积是主要成本</text>
  <text x="696" y="378" font-size="9.5" fill="#9a3412">先量一遍：序列化格式的收益有限</text>
  <line x1="822" y1="390" x2="822" y2="400" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="686" y="402" width="272" height="42" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="696" y="418" font-size="10" font-weight="bold" fill="#7c2d12">要服务端主动推</text>
  <text x="696" y="434" font-size="9.5" fill="#9a3412">先比 SSE / WebSocket / gRPC 流三条路</text>

  <rect x="30" y="474" width="940" height="190" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="45" y="496" font-size="11.5" font-weight="bold" fill="#0f172a">四条与语言无关的硬约束：任何一条不满足，前面选谁都会翻车</text>
  <rect x="45" y="506" width="222" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="156" y="524" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">① 契约要有纪律</text>
  <text x="156" y="539" text-anchor="middle" font-size="9.5" fill="#1d4ed8">字段号只增不改，删字段必须 reserved</text>
  <rect x="276" y="506" width="222" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="387" y="524" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">② 超时要显式给</text>
  <text x="387" y="539" text-anchor="middle" font-size="9.5" fill="#1d4ed8">不设 deadline 会拖死调用方</text>
  <rect x="507" y="506" width="222" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="618" y="524" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">③ 连接要复用</text>
  <text x="618" y="539" text-anchor="middle" font-size="9.5" fill="#1d4ed8">别在请求路径上建连</text>
  <rect x="738" y="506" width="222" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="849" y="524" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">④ 代理要认协议</text>
  <text x="849" y="539" text-anchor="middle" font-size="9.5" fill="#1d4ed8">必须懂 HTTP/2，HTTP/1.1 转必失败</text>

  <text x="45" y="572" font-size="11.5" fill="#334155">⭐ 三条结论：Java 为主先看 Dubbo（要跨语言一致性 / 要双向流再换 gRPC）；Go 为主直接 gRPC；PHP 与多语言混合也对齐 gRPC</text>
  <text x="45" y="594" font-size="11.5" fill="#334155">⚠️ 反面教训：别把 Spring Cloud 当 gRPC 的竞品（层次错位）；别用 Dubbo 2.x 的私有协议接异构语言；上了 gRPC 却没有 schema 纪律</text>
  <text x="45" y="616" font-size="11.5" fill="#334155">⚠️ 台阶：存量 REST 不必整体重写 —— 只换「高频、小报文、低延迟」那条链路，收益最大、风险最小；先确认瓶颈真的在这里</text>
  <text x="45" y="640" font-size="11.5" fill="#334155">📌 上图只解决「调用层用什么」；注册发现 / 网关 / 配置中心这些配套件见「中间件选型」，gRPC 的机制见本目录 gRPC/ 六篇</text>
</svg>
