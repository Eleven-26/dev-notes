<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">治理能力的三个落点：同一份能力清单，三种放法</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">三条竖列自上而下都是同一套层次；差别只在「治理层」这一格被谁包住、由谁维护</text>

  <rect x="30" y="76" width="300" height="36" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="180" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">框架内（Dubbo）</text>
  <rect x="350" y="76" width="300" height="36" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="500" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">基础设施（gRPC）</text>
  <rect x="670" y="76" width="300" height="36" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="820" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">组件集（Spring Cloud）</text>

  <rect x="24" y="116" width="312" height="184" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="36" y="110" font-size="11" fill="#1e40af">「框架」这一层：调用层与治理层一起被打包进来</text>

  <rect x="36" y="126" width="288" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="180" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">调用层：契约 + 序列化 + 传输</text>
  <text x="180" y="168" text-anchor="middle" font-size="10.5" fill="#1d4ed8">gRPC / Dubbo / Thrift 都在这一层</text>
  <rect x="356" y="126" width="288" height="54" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <text x="500" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">调用层：契约 + 序列化 + 传输</text>
  <text x="500" y="168" text-anchor="middle" font-size="10.5" fill="#166534">只做「调用」这一层，别的不碰</text>
  <rect x="676" y="126" width="288" height="54" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
  <text x="820" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">调用层：REST + Feign 声明式客户端</text>
  <text x="820" y="168" text-anchor="middle" font-size="10.5" fill="#9a3412">调用底座是 HTTP，不是一种新协议</text>

  <path d="M 180 182 L 180 194" fill="none" stroke="#2563eb" stroke-width="1.6"/>
  <path d="M 174 190 L 186 190 L 180 198 z" fill="#2563eb"/>
  <path d="M 500 182 L 500 194" fill="none" stroke="#16a34a" stroke-width="1.6"/>
  <path d="M 494 190 L 506 190 L 500 198 z" fill="#16a34a"/>
  <path d="M 820 182 L 820 194" fill="none" stroke="#ea580c" stroke-width="1.6"/>
  <path d="M 814 190 L 826 190 L 820 198 z" fill="#ea580c"/>

  <rect x="36" y="202" width="288" height="94" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="180" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">治理层：路由 / 灰度 / 权重</text>
  <text x="180" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">限流熔断 / 动态配置</text>
  <text x="180" y="272" text-anchor="middle" font-size="10.5" fill="#1d4ed8">⭐ 随框架一起来；升框架 = 全部服务一起升</text>
  <rect x="356" y="202" width="288" height="94" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="500" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">⭐ 这一格是空的</text>
  <text x="500" y="252" text-anchor="middle" font-size="10.5" fill="#166534">要自己用 Envoy / 服务网格 / K8s 补上</text>
  <text x="500" y="274" text-anchor="middle" font-size="10.5" fill="#166534">补不上就回到业务代码里手写</text>
  <rect x="676" y="202" width="288" height="94" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="820" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c2d12">治理层：由若干组件拼</text>
  <rect x="684" y="230" width="88" height="44" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
  <text x="728" y="257" text-anchor="middle" font-size="11" fill="#7c2d12">熔断</text>
  <rect x="776" y="230" width="88" height="44" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
  <text x="820" y="257" text-anchor="middle" font-size="11" fill="#7c2d12">网关</text>
  <rect x="868" y="230" width="88" height="44" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
  <text x="912" y="257" text-anchor="middle" font-size="11" fill="#7c2d12">追踪</text>
  <text x="820" y="288" text-anchor="middle" font-size="10.5" fill="#9a3412">每块都要单独选型、单独升版</text>

  <path d="M 180 296 L 180 308" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <path d="M 174 304 L 186 304 L 180 312 z" fill="#64748b"/>
  <path d="M 500 296 L 500 308" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <path d="M 494 304 L 506 304 L 500 312 z" fill="#64748b"/>
  <path d="M 820 296 L 820 308" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <path d="M 814 304 L 826 304 L 820 312 z" fill="#64748b"/>

  <rect x="36" y="312" width="288" height="54" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="180" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">基础设施层：Envoy / 服务网格 / K8s</text>
  <text x="180" y="354" text-anchor="middle" font-size="10.5" fill="#475569">这一层可以很薄</text>
  <rect x="356" y="312" width="288" height="54" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="500" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">基础设施层：路由 / 灰度 / 重试 / mTLS</text>
  <text x="500" y="354" text-anchor="middle" font-size="10.5" fill="#475569">治理的主要落点就在这里</text>
  <rect x="676" y="312" width="288" height="54" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="820" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">基础设施层：可选，也可交给网格</text>
  <text x="820" y="354" text-anchor="middle" font-size="10.5" fill="#475569">组件集不强制你补这一层</text>

  <path d="M 180 366 L 180 378" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <path d="M 174 374 L 186 374 L 180 382 z" fill="#64748b"/>
  <path d="M 500 366 L 500 378" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <path d="M 494 374 L 506 374 L 500 382 z" fill="#64748b"/>
  <path d="M 820 366 L 820 378" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <path d="M 814 374 L 826 374 L 820 382 z" fill="#64748b"/>

  <rect x="36" y="382" width="288" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="180" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">注册发现 / 配置中心</text>
  <text x="180" y="424" text-anchor="middle" font-size="10.5" fill="#64748b">框架的一等公民</text>
  <rect x="356" y="382" width="288" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="500" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">注册发现 / 配置中心</text>
  <text x="500" y="424" text-anchor="middle" font-size="10.5" fill="#64748b">resolver：dns:/// 是默认一条</text>
  <rect x="676" y="382" width="288" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="820" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">注册发现 / 配置中心</text>
  <text x="820" y="424" text-anchor="middle" font-size="10.5" fill="#64748b">由组件提供，版本要盯</text>

  <rect x="30" y="456" width="940" height="126" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="48" y="482" font-size="12.5" font-weight="bold" fill="#0f172a">三种放法共同的账：组件越多，要运维与观测的面越大</text>
  <text x="48" y="508" font-size="12" fill="#334155">⭐ 判据：治理能力不是越多越好，而是「谁来运维」—— 有平台组、已经在跑服务网格，就让治理落在基础设施层；</text>
  <text x="48" y="530" font-size="12" fill="#334155">没有这一层，就把治理收进框架（Dubbo），省掉自建的那一套；组件集这条路则是每一块都要自己挑、自己升。</text>
  <text x="48" y="556" font-size="12" fill="#b45309">⚠️ 进程内的能力基础设施层给不了：网格能补重试 / 熔断 / mTLS / 可观测，补不了编译期契约与四种通信模式。</text>

  <text x="30" y="610" font-size="12" fill="#64748b">图只回答「治理落在哪一层」；具体到每个框架的能力清单与短板，见第一节至第四节的三张对照表。</text>
</svg>
