<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">NATS 整体架构：单二进制组网，route 收敛成 mesh</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">集群靠 gossip 自动组网，路由、成员发现、共识全部内建在 Server</text>

  <rect x="20" y="82" width="960" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="106" font-size="14" font-weight="bold" fill="#0f172a">① 集群（Cluster）：节点通过 route 互联，gossip 自动收敛成全网状</text>

  <text x="500" y="132" text-anchor="middle" font-size="12" fill="#64748b">route（全员互联，无中心元数据）</text>
  <polyline points="160,170 160,140 840,140 840,170" fill="none" stroke="#94a3b8" stroke-width="1.4"/>

  <rect x="60" y="170" width="200" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="160" y="194" text-anchor="middle" font-size="12.5" fill="#1e3a8a">NATS Server</text>
  <text x="160" y="214" text-anchor="middle" font-size="11" fill="#1d4ed8">对等节点</text>
  <rect x="400" y="170" width="200" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="500" y="194" text-anchor="middle" font-size="12.5" fill="#1e3a8a">NATS Server</text>
  <text x="500" y="214" text-anchor="middle" font-size="11" fill="#1d4ed8">对等节点</text>
  <rect x="740" y="170" width="200" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="840" y="194" text-anchor="middle" font-size="12.5" fill="#1e3a8a">NATS Server</text>
  <text x="840" y="214" text-anchor="middle" font-size="11" fill="#1d4ed8">对等节点</text>

  <line x1="264" y1="198" x2="396" y2="198" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="604" y1="198" x2="736" y2="198" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="36" y="250" font-size="12" fill="#64748b">客户端连任一节点即可；成员发现与副本一致性全内建在 Server 里，无需 ZooKeeper / NameServer。</text>

  <rect x="20" y="282" width="960" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="306" font-size="14" font-weight="bold" fill="#0f172a">② Super Cluster（gateway 互联）与 Leaf Node（只同步关注的 Subject 子集）</text>

  <text x="50" y="346" font-size="12.5" font-weight="bold" fill="#334155">Super Cluster：多集群用 gateway 互联</text>
  <rect x="50" y="360" width="180" height="86" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="140" y="392" text-anchor="middle" font-size="12.5" fill="#14532d">Cluster A</text>
  <text x="140" y="416" text-anchor="middle" font-size="11" fill="#166534">多节点 mesh</text>
  <rect x="310" y="360" width="180" height="86" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="400" y="392" text-anchor="middle" font-size="12.5" fill="#14532d">Cluster B</text>
  <text x="400" y="416" text-anchor="middle" font-size="11" fill="#166534">多节点 mesh</text>
  <line x1="234" y1="403" x2="306" y2="403" stroke="#334155" stroke-width="1.5"/>
  <text x="270" y="394" text-anchor="middle" font-size="11" fill="#64748b">gateway</text>

  <text x="540" y="346" font-size="12.5" font-weight="bold" fill="#334155">Leaf Node：挂在 Hub 下只同步子集</text>
  <rect x="540" y="360" width="180" height="86" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="630" y="392" text-anchor="middle" font-size="12.5" fill="#7c2d12">Hub</text>
  <text x="630" y="416" text-anchor="middle" font-size="11" fill="#9a3412">中心集群</text>
  <rect x="790" y="360" width="170" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="875" y="392" text-anchor="middle" font-size="12.5" fill="#1e3a8a">Leaf Node</text>
  <text x="875" y="416" text-anchor="middle" font-size="11" fill="#1d4ed8">边缘 / 多租户</text>
  <line x1="786" y1="403" x2="724" y2="403" stroke="#334155" stroke-width="1.5"/>
  <text x="755" y="394" text-anchor="middle" font-size="11" fill="#64748b">只同步子集</text>

  <text x="36" y="470" font-size="12" fill="#64748b">适用：集群扛高可用与横向扩容，Super Cluster 做跨区域容灾，Leaf Node 覆盖边缘 / 多租户 / DMZ。</text>

  <line x1="20" y1="506" x2="980" y2="506" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="532" font-size="13" fill="#0f172a">⭐ NATS 把路由、成员发现、共识全部内建在 Server 里，因此没有「第二个要运维的系统」。</text>
  <text x="20" y="558" font-size="13" fill="#0f172a">⭐ 对照：Kafka 靠 ZooKeeper / KRaft，RocketMQ 靠 NameServer，NATS 只需一个二进制。</text>
  <text x="20" y="584" font-size="13" fill="#0f172a">⭐ JetStream 用内嵌 Raft 组维护 Stream 副本与 Consumer 状态，State 就在 Stream 副本里。</text>
  <text x="20" y="614" font-size="12" fill="#64748b">⚠️ StreamConfig.Replicas 只有在集群节点数 ≥ Replicas 时才有意义；单机必须写 Replicas: 1。</text>
</svg>
