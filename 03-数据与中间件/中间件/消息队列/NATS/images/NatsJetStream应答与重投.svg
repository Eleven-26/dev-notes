<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="nt2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="nt3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="nt4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="690" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">NATS JetStream 的 ACK 与重投：AckWait + MaxDeliver</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">未 ACK 或 Nak 即重投，达到上限后停止自动投递（无内建死信）</text>

  <rect x="60" y="104" width="280" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="200" y="142" text-anchor="middle" font-size="12.5" fill="#1e3a8a">① 投递消息（Push 或 Pull）</text>
  <line x1="200" y1="172" x2="200" y2="196" stroke="#334155" stroke-width="1.5" marker-end="url(#nt2)"/>

  <rect x="60" y="200" width="280" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="200" y="238" text-anchor="middle" font-size="12.5" fill="#1e3a8a">② AckWait（默认 30s）内处理并 ACK</text>

  <line x1="344" y1="222" x2="514" y2="176" stroke="#16a34a" stroke-width="1.5" marker-end="url(#nt3)"/>
  <line x1="344" y1="242" x2="514" y2="290" stroke="#dc2626" stroke-width="1.5" marker-end="url(#nt4)"/>

  <rect x="520" y="140" width="420" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="730" y="178" text-anchor="middle" font-size="12.5" fill="#14532d">✅ 成功：游标推进，消息不再重投</text>

  <rect x="520" y="260" width="420" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="730" y="298" text-anchor="middle" font-size="12.5" fill="#7f1d1d">❌ 未 ACK 或 Nak：重投，计数 +1</text>
  <line x1="730" y1="328" x2="730" y2="352" stroke="#334155" stroke-width="1.5" marker-end="url(#nt2)"/>

  <rect x="520" y="356" width="420" height="64" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="730" y="394" text-anchor="middle" font-size="12.5" fill="#7c2d12">⑤ 计数达 MaxDeliver 后停止自动投递</text>
  <line x1="730" y1="424" x2="730" y2="448" stroke="#334155" stroke-width="1.5" marker-end="url(#nt2)"/>

  <rect x="520" y="452" width="420" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="730" y="490" text-anchor="middle" font-size="12.5" fill="#0f172a">⑥ 无内建死信：转存死信 Stream 或落库告警</text>

  <rect x="60" y="322" width="280" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="200" y="360" text-anchor="middle" font-size="12" fill="#334155"># MaxAckPending 限在途未 ACK 数</text>
  <line x1="200" y1="318" x2="200" y2="268" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#nt2)"/>

  <rect x="60" y="422" width="280" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="200" y="460" text-anchor="middle" font-size="12" fill="#334155">InProgress() 延长 AckWait；Term() 终止</text>

  <line x1="20" y1="546" x2="980" y2="546" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="572" font-size="13" fill="#0f172a">⭐ 重投节奏由 AckWait（默认 30s）+ MaxDeliver（如 3）共同决定。</text>
  <text x="20" y="598" font-size="13" fill="#0f172a">⚠️ MaxDeliver 没有内建死信队列，超限后消息只是停在 Stream 里（可订阅 ADVISORY 事件感知）。</text>
  <text x="20" y="624" font-size="13" fill="#0f172a">⚠️ 落地必须自己把该事件转存到死信 Stream 或落库告警，否则坏消息静默沉底。</text>
  <text x="20" y="654" font-size="12" fill="#64748b">AutoAck 回调返回即 ACK：处理失败也会被 ACK，等于丢消息，生产用 ManualAck。</text>
</svg>
