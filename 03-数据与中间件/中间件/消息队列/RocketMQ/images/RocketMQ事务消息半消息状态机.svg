<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 748" width="1000" height="748" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="sm1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="smb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="smg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="smr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="748" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">RocketMQ 事务消息：半消息状态机</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">与「两阶段与回查」时序图互补：时序图讲「谁和谁说话」，这张只讲「这条半消息此刻在哪个状态、什么条件迁往哪个状态」</text>

  <!-- ===== 状态格：左侧两个过程态，右侧三个终态（上下排列，迁移线互不交叉） ===== -->

  <!-- 起始：Producer 发出半消息 -->
  <circle cx="165" cy="252" r="7" fill="#334155"/>
  <text x="165" y="234" text-anchor="middle" font-size="11.5" fill="#334155">① Producer 发半消息</text>
  <line x1="165" y1="259" x2="165" y2="306" stroke="#334155" stroke-width="1.6" marker-end="url(#sm1)"/>

  <!-- S1 未决（Half） -->
  <rect x="40" y="310" width="250" height="96" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
  <text x="165" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">未决（Half）</text>
  <text x="165" y="360" text-anchor="middle" font-size="11" fill="#7c2d12">HALF topic 有索引 · 真实 topic 无索引</text>
  <text x="165" y="382" text-anchor="middle" font-size="11" fill="#7c2d12">消费者对这条物理记录不可达</text>

  <!-- S4 回查中 -->
  <rect x="375" y="310" width="250" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="500" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">回查中</text>
  <text x="500" y="360" text-anchor="middle" font-size="11" fill="#1e3a8a">Broker 每 60s 回调 Producer</text>
  <text x="500" y="382" text-anchor="middle" font-size="11" fill="#1e3a8a">checkLocalTransaction · 累计 ≤15 次</text>

  <!-- S2 已提交 -->
  <rect x="700" y="96" width="270" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="835" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">已提交 · 可见（终态）</text>
  <text x="835" y="146" text-anchor="middle" font-size="11" fill="#14532d">副本追加进真实 Topic（OP 记 REP）</text>
  <text x="835" y="168" text-anchor="middle" font-size="11" fill="#14532d">此后按普通消息走重试 / 死信</text>

  <!-- S5 丢弃 -->
  <rect x="700" y="310" width="270" height="96" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="835" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">丢弃（终态 · 须对账）</text>
  <text x="835" y="360" text-anchor="middle" font-size="11" fill="#7f1d1d">回查 15 次耗尽仍未决</text>
  <text x="835" y="382" text-anchor="middle" font-size="11" fill="#7f1d1d">消息丢失 + 日志 · 业务须补偿</text>

  <!-- S3 已回滚 -->
  <rect x="700" y="520" width="270" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
  <text x="835" y="546" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">已回滚 · 待回收（终态）</text>
  <text x="835" y="570" text-anchor="middle" font-size="11" fill="#334155">OP 记 ROLLED_BACK · 不转真实 Topic</text>
  <text x="835" y="592" text-anchor="middle" font-size="11" fill="#334155">后台线程按 OP 日志回收半消息</text>

  <!-- ===== 迁移边：每条走独立通道，无交叉 ===== -->

  <!-- 未决 → 回查中 -->
  <line x1="290" y1="358" x2="369" y2="358" stroke="#2563eb" stroke-width="1.6" marker-end="url(#smb)"/>
  <text x="330" y="346" text-anchor="middle" font-size="11" fill="#2563eb">② 无响应</text>

  <!-- 未决 → 已提交（走上方通道，从 S2 左边界进入） -->
  <path d="M95,310 L95,141 L694,141" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#smg)"/>
  <text x="400" y="128" text-anchor="middle" font-size="11" fill="#16a34a">② Commit（COMMIT_MESSAGE）</text>

  <!-- 回查中 → 已提交（走中上通道，从 S2 下边界进入） -->
  <path d="M600,310 L600,240 L860,240 L860,190" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#smg)"/>
  <text x="700" y="228" text-anchor="middle" font-size="11" fill="#16a34a">回查报 Commit</text>

  <!-- 回查中 → 已回滚（走下方通道，从 S3 左边界进入） -->
  <path d="M500,406 L500,565 L694,565" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#sm1)"/>
  <text x="492" y="478" text-anchor="end" font-size="11" fill="#334155">回查报 Rollback</text>

  <!-- 未决 → 已回滚（走最底通道，从 S3 下边界进入） -->
  <path d="M95,406 L95,660 L835,660 L835,614" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#sm1)"/>
  <text x="300" y="648" text-anchor="middle" font-size="11" fill="#334155">② Rollback（ROLLBACK_MESSAGE）</text>

  <!-- 回查中 → 丢弃（水平直连） -->
  <line x1="625" y1="358" x2="694" y2="358" stroke="#dc2626" stroke-width="1.6" marker-end="url(#smr)"/>
  <text x="660" y="344" text-anchor="middle" font-size="11" fill="#dc2626">≤15 次耗尽</text>

  <!-- 回查中自环 -->
  <path d="M455,310 C450,250 550,250 545,310" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#smb)"/>
  <text x="480" y="242" text-anchor="middle" font-size="11" fill="#2563eb">仍 UNKNOW · 60s 后下一轮</text>

  <!-- ===== 收尾说明 ===== -->
  <text x="40" y="700" font-size="11.5" fill="#16a34a">⭐ 只有「已提交」是业务期望的出口；另两条路一条留痕（OP 记 ROLLED_BACK）、一条静默消失（丢弃 + 日志），所以关键业务必须配回查幂等与对账补偿。</text>
  <text x="40" y="722" font-size="11.5" fill="#64748b">⚠️ 「未决 → 回查中」不是 Producer 发起的：Broker 侧扫描服务每 60s 回调一次，回查可能落到同组另一台实例（细节见正文第四节）。</text>
</svg>
