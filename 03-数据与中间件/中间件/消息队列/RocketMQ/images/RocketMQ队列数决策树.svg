<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 706" width="1000" height="706" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="qd2a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="706" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#0f172a">RocketMQ 队列数决策：管的是并行度，不是吞吐</text>
  <text x="20" y="46" font-size="11" fill="#64748b">判据与实测读数都取自本篇第四节与 4.1 节：默认 8、4 队列 224~480 TPS、64 队列 213~348 TPS</text>

  <rect x="350" y="70" width="310" height="64" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.4"/>
  <text x="505" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">定队列数：唯一「定了就不好改」的参数</text>
  <text x="505" y="118" text-anchor="middle" font-size="9.5" fill="#334155">只能增不能减，改前先想清楚</text>

  <rect x="350" y="180" width="310" height="64" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="505" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">① 是顺序消息吗？</text>
  <text x="505" y="228" text-anchor="middle" font-size="9.5" fill="#92400e">同一个 Key 的多条要严格有序？</text>

  <rect x="20" y="180" width="290" height="84" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="165" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">按未来最大并行度一次定够</text>
  <text x="165" y="226" text-anchor="middle" font-size="9.5" fill="#b91c1c">改队列会让同 Key 落不同队列</text>
  <text x="165" y="248" text-anchor="middle" font-size="9.5" fill="#b91c1c">历史顺序断裂，连扩队列都不行</text>

  <rect x="350" y="290" width="310" height="64" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="505" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">② 消费侧要几个实例并行？</text>
  <text x="505" y="338" text-anchor="middle" font-size="9.5" fill="#92400e">队列是分配单位，整块给一个实例</text>

  <rect x="700" y="290" width="280" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="840" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">队列数 ≥ 实例数，取整数倍</text>
  <text x="840" y="336" text-anchor="middle" font-size="9.5" fill="#166534">实测 4 队列 5 实例：inst-3 空转</text>
  <text x="840" y="358" text-anchor="middle" font-size="9.5" fill="#166534">实测默认 8，生产常见 4 / 8 / 16</text>

  <rect x="350" y="400" width="310" height="64" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="505" y="424" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">③ 想靠加队列提吞吐？</text>
  <text x="505" y="448" text-anchor="middle" font-size="9.5" fill="#92400e">发送侧实测与队列数无关</text>

  <rect x="700" y="400" width="280" height="84" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="840" y="424" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">别为吞吐加队列</text>
  <text x="840" y="446" text-anchor="middle" font-size="9.5" fill="#b91c1c">4 队列实测 224~480 TPS</text>
  <text x="840" y="468" text-anchor="middle" font-size="9.5" fill="#b91c1c">64 队列 213~348 TPS，同量级</text>

  <rect x="350" y="510" width="310" height="64" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="505" y="534" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">④ 实例数已经追上队列数？</text>
  <text x="505" y="558" text-anchor="middle" font-size="9.5" fill="#92400e">再多实例只会空转</text>

  <rect x="700" y="510" width="280" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="840" y="534" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">先扩队列，再扩实例</text>
  <text x="840" y="556" text-anchor="middle" font-size="9.5" fill="#166534">mqadmin updateTopic -r 新值</text>
  <text x="840" y="578" text-anchor="middle" font-size="9.5" fill="#166534">顺序搞反就是白加机器</text>

  <rect x="350" y="620" width="310" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="505" y="644" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">队列没被吃满：先别动队列数</text>
  <text x="505" y="666" text-anchor="middle" font-size="9.5" fill="#475569">实测瓶颈是单条 RT 2.7~7.1 ms</text>

  <line x1="505" y1="134" x2="505" y2="178" stroke="#334155" stroke-width="1.5" marker-end="url(#qd2a)"/>
  <text x="513" y="162" font-size="9.5" fill="#334155">普通消息</text>
  <line x1="350" y1="212" x2="312" y2="212" stroke="#334155" stroke-width="1.5" marker-end="url(#qd2a)"/>
  <text x="331" y="206" text-anchor="middle" font-size="9.5" fill="#334155">是</text>
  <line x1="505" y1="244" x2="505" y2="288" stroke="#334155" stroke-width="1.5" marker-end="url(#qd2a)"/>
  <line x1="660" y1="322" x2="698" y2="322" stroke="#334155" stroke-width="1.5" marker-end="url(#qd2a)"/>
  <line x1="505" y1="354" x2="505" y2="398" stroke="#334155" stroke-width="1.5" marker-end="url(#qd2a)"/>
  <text x="513" y="382" font-size="9.5" fill="#334155">定好了</text>
  <line x1="660" y1="432" x2="698" y2="432" stroke="#334155" stroke-width="1.5" marker-end="url(#qd2a)"/>
  <text x="679" y="426" text-anchor="middle" font-size="9.5" fill="#334155">是</text>
  <line x1="505" y1="464" x2="505" y2="508" stroke="#334155" stroke-width="1.5" marker-end="url(#qd2a)"/>
  <text x="513" y="492" font-size="9.5" fill="#334155">否</text>
  <line x1="660" y1="542" x2="698" y2="542" stroke="#334155" stroke-width="1.5" marker-end="url(#qd2a)"/>
  <text x="679" y="536" text-anchor="middle" font-size="9.5" fill="#334155">是</text>
  <line x1="505" y1="574" x2="505" y2="618" stroke="#334155" stroke-width="1.5" marker-end="url(#qd2a)"/>
  <text x="513" y="600" font-size="9.5" fill="#334155">否</text>

  <text x="20" y="678" font-size="10" fill="#b45309">⚠️ 本图只管队列数这一个参数：它与刷盘、复制、高可用无关，也不改变 at-least-once 语义，重复投递仍要靠消费端幂等</text>
</svg>