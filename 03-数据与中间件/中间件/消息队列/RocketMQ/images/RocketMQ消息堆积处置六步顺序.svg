<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 768" width="1000" height="768" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="w2r2ga" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="768" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#0f172a">消息堆积的处置顺序：六步 ladder，代价从零风险走到不可逆</text>
  <text x="20" y="46" font-size="11" fill="#64748b">第 2 步的分叉用 1.1 节实测读数（600 条落 4 队列，每队列 150 条）；第 5 步临时 Topic 与第 6 步追位点是预案，不是常规动作</text>

  <line x1="92" y1="76" x2="92" y2="690" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#w2r2ga)"/>
  <text x="26" y="98" font-size="10" fill="#64748b">顺序不可颠倒</text>
  <text x="26" y="410" font-size="10" fill="#64748b">代价递增</text>
  <text x="26" y="690" font-size="10" fill="#dc2626">前可回退</text>
  <text x="26" y="712" font-size="10" fill="#dc2626">后可对账</text>

  <rect x="200" y="70" width="540" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="470" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">第 1 步 先判方向，再动手</text>
  <text x="470" y="116" text-anchor="middle" font-size="10" fill="#1e40af">生产 TPS 突增 → 流量问题：限流 / 扩容预案</text>
  <text x="470" y="136" text-anchor="middle" font-size="10" fill="#1e40af">消费变慢（消费 RT、失败率、GC）→ 先修消费能力，别急着动 Topic</text>

  <rect x="200" y="172" width="540" height="122" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="470" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#78350f">第 2 步 看分布定性质：逐队列 Diff，不看 Diff Total</text>
  <text x="470" y="220" text-anchor="middle" font-size="10" fill="#92400e">均匀：实测 150 / 150 / 150 / 149，Diff Total 599</text>
  <text x="470" y="240" text-anchor="middle" font-size="10" fill="#92400e">且 Inflight Total 同为 599 → 组整体能力不足，往下走</text>
  <text x="470" y="262" text-anchor="middle" font-size="10" fill="#b45309">集中：实测 q2 恒 150、另三队列 Diff 已归零</text>
  <text x="470" y="282" text-anchor="middle" font-size="10" fill="#b45309">→ 停滞类故障，走第三节，扩消费者无用</text>

  <rect x="200" y="316" width="540" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="470" y="340" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">第 3 步 扩容量：进程内手段先行（零风险）</text>
  <text x="470" y="362" text-anchor="middle" font-size="10" fill="#166534">提 consumeThreadMax（≤ 队列总数才有意义）</text>
  <text x="470" y="382" text-anchor="middle" font-size="10" fill="#166534">开批量消费、下游调用异步化</text>

  <rect x="200" y="418" width="540" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="470" y="442" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">第 4 步 扩并行：先加队列数，再加消费者实例</text>
  <text x="470" y="464" text-anchor="middle" font-size="10" fill="#166534">顺序反了：多出的实例一个队列都分不到，只能空转</text>
  <text x="470" y="484" text-anchor="middle" font-size="10" fill="#b91c1c">顺序消息 Topic 不能加队列（同 Key 会落不同队列）</text>

  <rect x="200" y="520" width="540" height="92" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="470" y="544" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c2d12">第 5 步 极端预案：转投队列数更多的临时 Topic</text>
  <text x="470" y="566" text-anchor="middle" font-size="10" fill="#9a3412">轻量搬运消费者把消息原样灌进临时 Topic，再挂大批实例消费</text>
  <text x="470" y="586" text-anchor="middle" font-size="10" fill="#9a3412">事后核对两边位点与总数再下线</text>
  <text x="470" y="604" text-anchor="middle" font-size="10" fill="#7c2d12">代价：用「一次额外堆积」换并行度</text>

  <rect x="200" y="634" width="540" height="92" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="470" y="658" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">第 6 步 追位点：resetOffsetByTime 向前跳 = 永久跳过</text>
  <text x="470" y="680" text-anchor="middle" font-size="10" fill="#b91c1c">跳之前确认区间内有无交易 / 资金类消息、能否从 DB / 轨迹反查补录</text>
  <text x="470" y="700" text-anchor="middle" font-size="10" fill="#b91c1c">无归档即真丢：这是弃车保帅，须留对账记录</text>

  <rect x="770" y="196" width="212" height="76" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="876" y="220" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991b1b">转第三节排查</text>
  <text x="876" y="242" text-anchor="middle" font-size="9.5" fill="#b91c1c">Diff 只涨不动的队列</text>
  <text x="876" y="260" text-anchor="middle" font-size="9.5" fill="#b91c1c">用 -s true 取客户端地址</text>

  <line x1="470" y1="150" x2="470" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#w2r2ga)"/>
  <line x1="470" y1="294" x2="470" y2="314" stroke="#334155" stroke-width="1.5" marker-end="url(#w2r2ga)"/>
  <text x="478" y="310" font-size="9.5" fill="#16a34a">均匀，继续</text>
  <line x1="470" y1="396" x2="470" y2="416" stroke="#334155" stroke-width="1.5" marker-end="url(#w2r2ga)"/>
  <line x1="470" y1="498" x2="470" y2="518" stroke="#334155" stroke-width="1.5" marker-end="url(#w2r2ga)"/>
  <line x1="470" y1="612" x2="470" y2="632" stroke="#334155" stroke-width="1.5" marker-end="url(#w2r2ga)"/>
  <line x1="740" y1="234" x2="768" y2="234" stroke="#dc2626" stroke-width="1.5" marker-end="url(#w2r2ga)"/>
  <text x="754" y="228" text-anchor="middle" font-size="9.5" fill="#dc2626">集中</text>

  <text x="20" y="748" font-size="10" fill="#b45309">注意：判错方向就动手是最常见的二次事故——第 3 步之前先确认 Diff 的分布形态，第 6 步是最后手段而不是第一选择</text>
</svg>
