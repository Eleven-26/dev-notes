<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="of3a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#0f172a">RocketMQ 消费位点的两种落点：集群交给 Broker，广播留在本地</text>
  <text x="20" y="46" font-size="11" fill="#64748b">本机 apache/rocketmq:5.3.1 实测：同一 Topic 4 队列，集群组 w2rmq-g6 与广播组 w2rmq-gb 各消费到 250</text>

  <rect x="40" y="86" width="440" height="48" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="260" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">集群模式 CLUSTERING（客户端实测默认）</text>
  <rect x="520" y="86" width="440" height="48" rx="8" fill="#fae8ff" stroke="#a21caf" stroke-width="1.4"/>
  <text x="740" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#701a75">广播模式 BROADCASTING</text>

  <rect x="40" y="156" width="440" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="260" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">offsetStore = RemoteBrokerOffsetStore</text>
  <text x="260" y="202" text-anchor="middle" font-size="9.5" fill="#475569">javap 反编译 5.3.1 客户端 start 分支实测</text>
  <rect x="520" y="156" width="440" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="740" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">offsetStore = LocalFileOffsetStore</text>
  <text x="740" y="202" text-anchor="middle" font-size="9.5" fill="#475569">老资料的 LocalOffsetStore 在这个 jar 里不存在</text>

  <rect x="40" y="236" width="440" height="88" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="260" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">Broker：config/consumerOffset.json</text>
  <text x="260" y="280" text-anchor="middle" font-size="9.5" fill="#166534">"w2rmq-lab6@w2rmq-g6":</text>
  <text x="260" y="298" text-anchor="middle" font-size="9.5" fill="#166534">{0:250,1:250,2:250,3:250}</text>
  <text x="260" y="316" text-anchor="middle" font-size="9.5" fill="#166534">组级共享，所以能分摊、能 rebalance</text>
  <rect x="520" y="236" width="440" height="88" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="740" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">消费者本地：offsets.json</text>
  <text x="740" y="278" text-anchor="middle" font-size="9.5" fill="#92400e">/home/rocketmq/.rocketmq_offsets/</text>
  <text x="740" y="294" text-anchor="middle" font-size="9" fill="#92400e">192.168.160.3@bc-2871835709400/w2rmq-gb/</text>
  <text x="740" y="310" text-anchor="middle" font-size="9" fill="#92400e">Broker 上另有 @broadcast 键，只是参考起点</text>

  <rect x="40" y="346" width="440" height="58" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
  <text x="260" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">consumerProgress -g w2rmq-g6</text>
  <text x="260" y="392" text-anchor="middle" font-size="9.5" fill="#075985">实测 4 行读数，Diff Total 598 → 0 收敛</text>
  <rect x="520" y="346" width="440" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="740" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">consumerProgress -g w2rmq-gb</text>
  <text x="740" y="392" text-anchor="middle" font-size="9.5" fill="#b91c1c">实测返回空：没有 Diff，也就没有统一告警</text>

  <rect x="40" y="426" width="440" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="260" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">加实例 = 分摊进度</text>
  <text x="260" y="472" text-anchor="middle" font-size="9.5" fill="#475569">实测 5 实例分 4 队列：1 个实例空转</text>
  <rect x="520" y="426" width="440" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="740" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">加实例 = 再来一份全量</text>
  <text x="740" y="472" text-anchor="middle" font-size="9.5" fill="#475569">换机器或重建容器 = 进度整份丢失</text>

  <line x1="260" y1="134" x2="260" y2="154" stroke="#334155" stroke-width="1.5" marker-end="url(#of3a)"/>
  <line x1="260" y1="214" x2="260" y2="234" stroke="#334155" stroke-width="1.5" marker-end="url(#of3a)"/>
  <line x1="260" y1="324" x2="260" y2="344" stroke="#334155" stroke-width="1.5" marker-end="url(#of3a)"/>
  <line x1="260" y1="404" x2="260" y2="424" stroke="#334155" stroke-width="1.5" marker-end="url(#of3a)"/>
  <line x1="740" y1="134" x2="740" y2="154" stroke="#334155" stroke-width="1.5" marker-end="url(#of3a)"/>
  <line x1="740" y1="214" x2="740" y2="234" stroke="#334155" stroke-width="1.5" marker-end="url(#of3a)"/>
  <line x1="740" y1="324" x2="740" y2="344" stroke="#334155" stroke-width="1.5" marker-end="url(#of3a)"/>
  <line x1="740" y1="404" x2="740" y2="424" stroke="#334155" stroke-width="1.5" marker-end="url(#of3a)"/>

  <text x="20" y="510" font-size="10" fill="#0f172a">⭐ 同一份 consumerOffset.json 里键是并存的：集群组 {topic}@{group}、重试与死信只是 topic 名前缀 %RETRY% 与 %DLQ%，没有特殊结构</text>
  <text x="20" y="532" font-size="10" fill="#b45309">⚠️ 广播的本地位点路径按 clientId（IP@随机数）分目录：进程换一次就多一份新位点，容器销毁则整份丢失</text>
</svg>