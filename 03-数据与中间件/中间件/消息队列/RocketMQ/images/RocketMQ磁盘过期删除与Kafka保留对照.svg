<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 664" width="1000" height="664" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="664" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#0f172a">磁盘与过期删除：RocketMQ 全局文件粒度 与 Kafka 分区段粒度 的五个维度对照</text>
  <text x="20" y="46" font-size="11" fill="#64748b">RocketMQ 侧数字来自本篇第四节与部署与配置.md 第三节实测；Kafka 侧数字来自本仓 Kafka/部署与配置.md 第三节实测表（本轮未复测）</text>

  <rect x="200" y="58" width="390" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="395" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">RocketMQ：CommitLog 混写 + 全局保留期</text>
  <rect x="600" y="58" width="380" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="790" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">Kafka：分区日志段 + Topic 级 retention</text>

  <rect x="20" y="106" width="160" height="84" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="100" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">存储单位</text>
  <text x="100" y="164" text-anchor="middle" font-size="9.5" fill="#475569">谁在追加写</text>
  <rect x="200" y="106" width="390" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="395" y="130" text-anchor="middle" font-size="10.5" fill="#0f172a">全机一条 CommitLog，所有 Topic 混写</text>
  <text x="395" y="152" text-anchor="middle" font-size="10" fill="#334155">单文件 1 GiB（mappedFileSizeCommitLog</text>
  <text x="395" y="172" text-anchor="middle" font-size="10" fill="#334155">= 1073741824），开跑即预分配满</text>
  <rect x="600" y="106" width="380" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="790" y="130" text-anchor="middle" font-size="10.5" fill="#0f172a">每个分区一套独立日志段文件</text>
  <text x="790" y="152" text-anchor="middle" font-size="10" fill="#334155">段大小 log.segment.bytes = 1 GiB</text>
  <text x="790" y="172" text-anchor="middle" font-size="10" fill="#334155">分区越多，文件句柄与随机 IO 越多</text>

  <rect x="20" y="202" width="160" height="84" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="100" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">删除最小粒度</text>
  <text x="100" y="260" text-anchor="middle" font-size="9.5" fill="#475569">一次能删多少</text>
  <rect x="200" y="202" width="390" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="395" y="226" text-anchor="middle" font-size="10.5" fill="#0f172a">整个 1 GiB 文件，不能只删其中一段</text>
  <text x="395" y="248" text-anchor="middle" font-size="10" fill="#b91c1c">文件里全部消息都超期才可删</text>
  <text x="395" y="268" text-anchor="middle" font-size="10" fill="#334155">ConsumeQueue / IndexFile 按已删偏移联动回收</text>
  <rect x="600" y="202" width="380" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="790" y="226" text-anchor="middle" font-size="10.5" fill="#0f172a">整个 segment 文件</text>
  <text x="790" y="248" text-anchor="middle" font-size="10" fill="#334155">但段属于某个分区，删这一段不动别的分区</text>
  <text x="790" y="268" text-anchor="middle" font-size="10" fill="#334155">所以同一集群能各删各的</text>

  <rect x="20" y="298" width="160" height="84" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="100" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">保留期作用域</text>
  <text x="100" y="356" text-anchor="middle" font-size="9.5" fill="#475569">参数管到哪一层</text>
  <rect x="200" y="298" width="390" height="84" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="395" y="322" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#78350f">集群全局一个值：fileReservedTime = 72 小时</text>
  <text x="395" y="344" text-anchor="middle" font-size="10" fill="#92400e">做不到「Topic A 留 3 天、Topic B 留 30 天」</text>
  <text x="395" y="364" text-anchor="middle" font-size="10" fill="#92400e">不同保留 SLA 的业务只能分集群部署</text>
  <rect x="600" y="298" width="380" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="790" y="322" text-anchor="middle" font-size="10.5" fill="#0f172a">Broker 默认 log.retention.hours = 168</text>
  <text x="790" y="344" text-anchor="middle" font-size="10" fill="#166534">Topic 级 retention.ms 可覆盖</text>
  <text x="790" y="364" text-anchor="middle" font-size="10" fill="#334155">与 log.retention.bytes（默认 -1）先到者触发</text>

  <rect x="20" y="394" width="160" height="84" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="100" y="428" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">触发时机</text>
  <text x="100" y="452" text-anchor="middle" font-size="9.5" fill="#475569">什么时候真删</text>
  <rect x="200" y="394" width="390" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="395" y="418" text-anchor="middle" font-size="10.5" fill="#0f172a">定时窗口 deleteWhen = 04（凌晨 4 点）</text>
  <text x="395" y="440" text-anchor="middle" font-size="10" fill="#334155">磁盘超 diskMaxUsedSpaceRatio = 75% 提前强清</text>
  <text x="395" y="460" text-anchor="middle" font-size="10" fill="#b91c1c">再恶化直接拒写：SERVICE_NOT_AVAILABLE</text>
  <rect x="600" y="394" width="380" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="790" y="418" text-anchor="middle" font-size="10.5" fill="#0f172a">保留时间 / 保留字节先到者删</text>
  <text x="790" y="440" text-anchor="middle" font-size="10" fill="#334155">段只有「非活跃」才可能被清理</text>
  <text x="790" y="460" text-anchor="middle" font-size="10" fill="#334155">cleanup.policy 还可选 compact 按 key 收敛</text>

  <rect x="20" y="490" width="160" height="98" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="100" y="522" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">未消费</text>
  <text x="100" y="542" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">是否被保护</text>
  <text x="100" y="566" text-anchor="middle" font-size="9.5" fill="#b91c1c">两家都不保护</text>
  <rect x="200" y="490" width="390" height="98" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="395" y="514" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991b1b">「未消费也照删」是设计立场</text>
  <text x="395" y="536" text-anchor="middle" font-size="10" fill="#b91c1c">ACK 之后、消费之前的消息会随文件过期物理删除</text>
  <text x="395" y="556" text-anchor="middle" font-size="10" fill="#b91c1c">堆积容忍上限 = 保留期 × 磁盘，不是无限日志</text>
  <text x="395" y="576" text-anchor="middle" font-size="10" fill="#334155">所以这一段只能靠容量与告警防住</text>
  <rect x="600" y="490" width="380" height="98" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="790" y="514" text-anchor="middle" font-size="10.5" fill="#0f172a">删除同样不看「有没有被消费」</text>
  <text x="790" y="536" text-anchor="middle" font-size="10" fill="#334155">消费进度只是 offset，不影响段是否被清理</text>
  <text x="790" y="556" text-anchor="middle" font-size="10" fill="#166534">差别只在保留期可按 Topic 拉长</text>
  <text x="790" y="576" text-anchor="middle" font-size="10" fill="#334155">给下游慢消费留时间窗</text>

  <text x="20" y="616" font-size="10" fill="#b45309">注意：混写让 RocketMQ 的保留策略无法按 Topic 切分，这是「按业务 SLA 拆集群」的硬约束，不是调参能解决的</text>
  <text x="20" y="638" font-size="10" fill="#64748b">对应正文：第四节「磁盘与过期删除」；Kafka 侧参数详见 部署与配置.md 第三节的实测表</text>
</svg>
