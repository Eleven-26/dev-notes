<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="w2r2gc" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#0f172a">两条答题链：把散点串成一条推理线</text>
  <text x="20" y="46" font-size="11" fill="#64748b">每一步的措辞与数字都取自本篇第七节的链一 / 链二正文，物理偏移读数见第三节</text>

  <rect x="20" y="58" width="470" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="255" y="79" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">链一：RocketMQ 怎么做到不丢？</text>
  <rect x="510" y="58" width="470" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="745" y="79" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">链二：为什么能挂万级队列？</text>

  <rect x="20" y="100" width="470" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="255" y="124" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">① send 成功不等于落盘</text>
  <text x="255" y="146" text-anchor="middle" font-size="9.5" fill="#475569">写进 PageCache 就返回 ACK</text>
  <text x="255" y="166" text-anchor="middle" font-size="9.5" fill="#475569">持久化边界由两个开关共同决定</text>

  <rect x="20" y="196" width="470" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="255" y="220" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">② 本机有没有：flushDiskType</text>
  <text x="255" y="242" text-anchor="middle" font-size="9.5" fill="#475569">ASYNC_FLUSH 只落页缓存</text>
  <text x="255" y="262" text-anchor="middle" font-size="9.5" fill="#475569">SYNC_FLUSH 才等刷盘返回</text>

  <rect x="20" y="292" width="470" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="255" y="316" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">③ 别的机器有没有：brokerRole</text>
  <text x="255" y="338" text-anchor="middle" font-size="9.5" fill="#475569">ASYNC_MASTER 异步复制</text>
  <text x="255" y="358" text-anchor="middle" font-size="9.5" fill="#475569">SYNC_MASTER 同步双写</text>

  <rect x="20" y="388" width="470" height="82" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="255" y="412" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#78350f">④ 两开关组合出四档语义</text>
  <text x="255" y="434" text-anchor="middle" font-size="9.5" fill="#92400e">落在哪一段失败，就用哪一段的补法</text>
  <text x="255" y="454" text-anchor="middle" font-size="9.5" fill="#92400e">汇总成三段责任表：生产端 → 存储 → 消费端</text>

  <rect x="20" y="484" width="470" height="82" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="255" y="508" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#78350f">⑤ 每段只对段内失败负责</text>
  <text x="255" y="530" text-anchor="middle" font-size="9.5" fill="#92400e">跨段的窟窿由下一段兜住</text>
  <text x="255" y="550" text-anchor="middle" font-size="9.5" fill="#92400e">「不重」Broker 完全不管，只有消费端幂等一道闸</text>

  <rect x="510" y="100" width="470" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="745" y="124" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">① 万级队列要求写吞吐与队列数解耦</text>
  <text x="745" y="146" text-anchor="middle" font-size="9.5" fill="#475569">若每队列一条日志：写头分散</text>
  <text x="745" y="166" text-anchor="middle" font-size="9.5" fill="#475569">顺序写退化成随机写</text>

  <rect x="510" y="196" width="470" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="745" y="220" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">② 全部 Topic 混写进一条 CommitLog</text>
  <text x="745" y="242" text-anchor="middle" font-size="9.5" fill="#475569">全机只剩一个追加点</text>
  <text x="745" y="262" text-anchor="middle" font-size="9.5" fill="#475569">写侧拿到接近顺序带宽</text>

  <rect x="510" y="292" width="470" height="82" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="745" y="316" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991b1b">③ 代价：读某队列时数据散落全日志</text>
  <text x="745" y="338" text-anchor="middle" font-size="9.5" fill="#b91c1c">实测物理偏移 0 / 223 / 892 / 1784</text>
  <text x="745" y="358" text-anchor="middle" font-size="9.5" fill="#b91c1c">明显不连续，必须两跳才能读到正文</text>

  <rect x="510" y="388" width="470" height="82" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="745" y="412" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">④ 用二级索引把逻辑顺序重建出来</text>
  <text x="745" y="434" text-anchor="middle" font-size="9.5" fill="#166534">ConsumeQueue 条目定长 20 字节</text>
  <text x="745" y="454" text-anchor="middle" font-size="9.5" fill="#166534">寻址变成纯算术：queueOffset × 20</text>

  <rect x="510" y="484" width="470" height="82" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="745" y="508" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">⑤ 扩展成本降到「加一个索引文件」</text>
  <text x="745" y="530" text-anchor="middle" font-size="9.5" fill="#166534">所以单机万级队列可行</text>
  <text x="745" y="550" text-anchor="middle" font-size="9.5" fill="#92400e">Kafka 是分区级日志：加一套日志段与句柄</text>

  <rect x="20" y="580" width="960" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="500" y="604" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">两条链的落点：链一落在「段内负责 + 跨段兜底 + 消费端幂等」，链二落在「写侧解耦、读侧靠定长索引重建顺序」</text>
  <text x="500" y="626" text-anchor="middle" font-size="9.5" fill="#475569">对照口径：数百分区就是 Kafka 的警戒线，而 RocketMQ 的队列数天花板在万级</text>

  <line x1="255" y1="182" x2="255" y2="194" stroke="#334155" stroke-width="1.5" marker-end="url(#w2r2gc)"/>
  <line x1="255" y1="278" x2="255" y2="290" stroke="#334155" stroke-width="1.5" marker-end="url(#w2r2gc)"/>
  <line x1="255" y1="374" x2="255" y2="386" stroke="#334155" stroke-width="1.5" marker-end="url(#w2r2gc)"/>
  <line x1="255" y1="470" x2="255" y2="482" stroke="#334155" stroke-width="1.5" marker-end="url(#w2r2gc)"/>
  <line x1="745" y1="182" x2="745" y2="194" stroke="#334155" stroke-width="1.5" marker-end="url(#w2r2gc)"/>
  <line x1="745" y1="278" x2="745" y2="290" stroke="#334155" stroke-width="1.5" marker-end="url(#w2r2gc)"/>
  <line x1="745" y1="374" x2="745" y2="386" stroke="#334155" stroke-width="1.5" marker-end="url(#w2r2gc)"/>
  <line x1="745" y1="470" x2="745" y2="482" stroke="#334155" stroke-width="1.5" marker-end="url(#w2r2gc)"/>

  <text x="20" y="668" font-size="10" fill="#64748b">注意：本页只做索引与结论，链上每一步的完整推导与实测读数在第七节标注的零件篇里，别把这张图当成机制详解</text>
</svg>
