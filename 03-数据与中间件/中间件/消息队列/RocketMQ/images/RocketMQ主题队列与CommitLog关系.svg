  <text x="862" y="559" text-anchor="end" font-size="11" fill="#64748b">2007</text>
  <rect x="870" y="536" width="280" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="1010" y="559" text-anchor="middle" font-size="12" fill="#1e3a8a">pay/1 · 223 B</text>

  <text x="985" y="610" text-anchor="middle" font-size="11" fill="#475569">所有 Topic / 队列按到达顺序混写，Topic / queueId 只是记录字段</text>

  <line x1="40" y1="656" x2="1160" y2="656" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="686" font-size="13" fill="#0f172a">① Topic → Queue 是 1:N：队列才是并行与保序的最小单位，队列数决定消费并行度上限。</text>
  <text x="40" y="714" font-size="13" fill="#0f172a">② Queue → ConsumeQueue 是 1:1：每个队列一套 20 B 定长索引，第 N 条位置 = queueOffset × 20；索引损坏可按 CommitLog 重建。</text>
  <text x="40" y="742" font-size="13" fill="#0f172a">③ Queue → CommitLog 是 N:1：队列不拥有独立日志文件，只有索引；一条消息只属于一个 Topic 的一个队列。</text>
  <text x="40" y="770" font-size="13" fill="#0f172a">⭐ 深橙底 = consumequeue/orders/2 的前四条记录：物理偏移 0 / 223 / 892 / 1784（相邻差 223 / 669 / 892），中间夹着别的 Topic。</text>
  <text x="40" y="798" font-size="13" fill="#0f172a">⚠️ 三层各司其职：Topic 是名字，Queue 是分配与位点单位，CommitLog 是唯一正文——消费者面对的是「队列 + 位点」。</text>
  <text x="40" y="832" font-size="12" fill="#64748b">偏移读数取自本机 apache/rocketmq:5.3.1 实测（lab-topic/2 的前四条 ConsumeQueue 记录，均长 223 B）；图中以 orders/2 示意。</text>
</svg>
