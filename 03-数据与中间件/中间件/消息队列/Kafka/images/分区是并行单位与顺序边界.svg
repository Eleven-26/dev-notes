<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="590" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">分区同时是「并行单位」与「顺序边界」：一个 Topic 三个分区、两个消费组</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">顺序只在分区内成立；同分区不能同时给同组两个消费者；两个组共享同一份日志</text>

  <rect x="40" y="84" width="340" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="210" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">分区（分区内按 offset 有序）</text>
  <rect x="380" y="84" width="290" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="525" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">消费组 cg-notify</text>
  <rect x="670" y="84" width="290" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="815" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">消费组 cg-audit</text>

  <rect x="40" y="128" width="340" height="72" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="58" y="152" font-size="13" font-weight="bold" fill="#1e3a8a">P0</text>
  <rect x="86" y="138" width="66" height="30" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="119" y="158" text-anchor="middle" font-size="11" fill="#1e40af">off 0</text>
  <rect x="158" y="138" width="66" height="30" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="191" y="158" text-anchor="middle" font-size="11" fill="#1e40af">off 1</text>
  <rect x="230" y="138" width="66" height="30" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="263" y="158" text-anchor="middle" font-size="11" fill="#1e40af">off 2</text>
  <text x="58" y="186" font-size="11.5" fill="#64748B">key=order-1　order-1　order-1</text>
  <rect x="380" y="128" width="290" height="72" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1"/>
  <text x="525" y="158" text-anchor="middle" font-size="12.5" fill="#14532d">consumer-1 独占 P0</text>
  <text x="525" y="182" text-anchor="middle" font-size="11.5" fill="#15803d">顺序处理这 3 条</text>
  <rect x="670" y="128" width="290" height="72" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1"/>
  <text x="815" y="158" text-anchor="middle" font-size="12.5" fill="#7c2d12">consumer-x 一起拿到</text>
  <text x="815" y="182" text-anchor="middle" font-size="11.5" fill="#c2410c">同一个分区不能分给两人</text>

  <rect x="40" y="200" width="340" height="72" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="58" y="224" font-size="13" font-weight="bold" fill="#1e3a8a">P1</text>
  <rect x="86" y="210" width="66" height="30" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="119" y="230" text-anchor="middle" font-size="11" fill="#1e40af">off 0</text>
  <rect x="158" y="210" width="66" height="30" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="191" y="230" text-anchor="middle" font-size="11" fill="#1e40af">off 1</text>
  <rect x="230" y="210" width="66" height="30" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="263" y="230" text-anchor="middle" font-size="11" fill="#1e40af">off 2</text>
  <text x="58" y="258" font-size="11.5" fill="#64748B">key=order-2　order-2　order-2</text>
  <rect x="380" y="200" width="290" height="72" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1"/>
  <text x="525" y="230" text-anchor="middle" font-size="12.5" fill="#14532d">consumer-2 独占 P1</text>
  <text x="525" y="254" text-anchor="middle" font-size="11.5" fill="#15803d">与 P0 之间无先后关系</text>
  <rect x="670" y="200" width="290" height="72" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1"/>
  <text x="815" y="230" text-anchor="middle" font-size="12.5" fill="#7c2d12">consumer-x 一起拿到</text>
  <text x="815" y="254" text-anchor="middle" font-size="11.5" fill="#c2410c">与 P0 各自记 offset</text>

  <rect x="40" y="272" width="340" height="72" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="58" y="296" font-size="13" font-weight="bold" fill="#1e3a8a">P2</text>
  <rect x="86" y="282" width="66" height="30" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="119" y="302" text-anchor="middle" font-size="11" fill="#1e40af">off 0</text>
  <rect x="158" y="282" width="66" height="30" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="191" y="302" text-anchor="middle" font-size="11" fill="#1e40af">off 1</text>
  <rect x="230" y="282" width="66" height="30" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="263" y="302" text-anchor="middle" font-size="11" fill="#1e40af">off 2</text>
  <text x="58" y="330" font-size="11.5" fill="#64748B">key=order-3　order-3　order-3</text>
  <rect x="380" y="272" width="290" height="72" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1"/>
  <text x="525" y="302" text-anchor="middle" font-size="12.5" fill="#14532d">consumer-3 独占 P2</text>
  <text x="525" y="326" text-anchor="middle" font-size="11.5" fill="#15803d">并行度上限 = 分区数 3</text>
  <rect x="670" y="272" width="290" height="72" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1"/>
  <text x="815" y="302" text-anchor="middle" font-size="12.5" fill="#7c2d12">consumer-x 一起拿到</text>
  <text x="815" y="326" text-anchor="middle" font-size="11.5" fill="#c2410c">单消费者全包 3 个分区</text>

  <rect x="40" y="356" width="920" height="146" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="60" y="382" font-size="12.5" font-weight="bold" fill="#0f172a">四条结论：这张图决定了分区数的定法</text>
  <text x="60" y="408" font-size="12" fill="#334155">1. 顺序边界是分区：同 key 的消息必须落同一分区才有顺序（图中三个分区各装一个订单），跨分区没有先后。</text>
  <text x="60" y="432" font-size="12" fill="#334155">2. 并行度上限是分区数：cg-notify 最多 3 个消费者有用，第 4 个只能空转；要更高并行只能加分区。</text>
  <text x="60" y="456" font-size="12" fill="#334155">3. 多一个下游成本为零：cg-audit 与 cg-notify 读的是同一份日志，只多记一套 offset，不复制数据。</text>
  <text x="60" y="480" font-size="12" fill="#b91c1c">4. 分区数只能加不能减：加分区会把 key % 分区数 的映射整体改变，依赖同 key 有序的消费端会断序。</text>

  <text x="40" y="546" font-size="11.5" fill="#64748B">实测依据：apache/kafka:3.9.0 单节点 KRaft，620 个分区 → 622 个目录、表观 13 GB 实际占 7.4 MB，见正文第 2.2 节</text>
  <text x="40" y="568" font-size="11.5" fill="#64748B">注：图中 order-1/2/3 为说明用的三个分区键，偏移量与目录读数为真实测数</text>
</svg>
