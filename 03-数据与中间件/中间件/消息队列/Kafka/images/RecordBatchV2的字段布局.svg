<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Record Batch v2 的字段布局：幂等就靠三个绿色字段</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">线上与磁盘用的是同一个结构；「批」是基本单位，不是「一条消息一帧」</text>

  <rect x="40" y="76" width="240" height="34" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="56" y="98" font-size="12" font-weight="bold" fill="#334155">字段</text>
  <rect x="280" y="76" width="120" height="34" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="340" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">宽度</text>
  <rect x="400" y="76" width="560" height="34" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="416" y="98" font-size="12" font-weight="bold" fill="#334155">作用</text>

  <rect x="40" y="110" width="240" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="128" font-family="Consolas, monospace" font-size="11.5" fill="#0f172a">baseOffset</text>
  <rect x="280" y="110" width="120" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="128" text-anchor="middle" font-size="11" fill="#475569">int64</text>
  <rect x="400" y="110" width="560" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="416" y="128" font-size="11" fill="#334155">这批第一条的 offset（由 Broker 在写入时填）</text>

  <rect x="40" y="136" width="240" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="154" font-family="Consolas, monospace" font-size="11.5" fill="#0f172a">batchLength</text>
  <rect x="280" y="136" width="120" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="154" text-anchor="middle" font-size="11" fill="#475569">int32</text>
  <rect x="400" y="136" width="560" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="416" y="154" font-size="11" fill="#334155">从 partitionLeaderEpoch 到结尾的字节数</text>

  <rect x="40" y="162" width="240" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="180" font-family="Consolas, monospace" font-size="11.5" fill="#0f172a">partitionLeaderEpoch</text>
  <rect x="280" y="162" width="120" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="180" text-anchor="middle" font-size="11" fill="#475569">int32</text>
  <rect x="400" y="162" width="560" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="416" y="180" font-size="11" fill="#334155">Leader 纪元，副本截断时用来判断「谁的数据新」</text>

  <rect x="40" y="188" width="240" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="206" font-family="Consolas, monospace" font-size="11.5" fill="#0f172a">magic</text>
  <rect x="280" y="188" width="120" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="206" text-anchor="middle" font-size="11" fill="#475569">int8</text>
  <rect x="400" y="188" width="560" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="416" y="206" font-size="11" fill="#334155">固定为 2 —— v2 格式的标志</text>

  <rect x="40" y="214" width="240" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="232" font-family="Consolas, monospace" font-size="11.5" fill="#0f172a">crc</text>
  <rect x="280" y="214" width="120" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="232" text-anchor="middle" font-size="11" fill="#475569">uint32</text>
  <rect x="400" y="214" width="560" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="416" y="232" font-size="11" fill="#334155">从 attributes 到结尾的 CRC32 —— 一批只算一次</text>

  <rect x="40" y="240" width="240" height="26" fill="#fef9c3" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="258" font-family="Consolas, monospace" font-size="11.5" fill="#713f12">attributes</text>
  <rect x="280" y="240" width="120" height="26" fill="#fef9c3" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="258" text-anchor="middle" font-size="11" fill="#854d0e">int16</text>
  <rect x="400" y="240" width="560" height="26" fill="#fef9c3" stroke="#e2e8f0" stroke-width="1"/>
  <text x="416" y="258" font-size="11" fill="#713f12">位段：低 3 位压缩类型、bit3 时间戳类型、bit4 事务、bit5 控制批</text>

  <rect x="40" y="266" width="240" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="284" font-family="Consolas, monospace" font-size="11.5" fill="#0f172a">lastOffsetDelta</text>
  <rect x="280" y="266" width="120" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="284" text-anchor="middle" font-size="11" fill="#475569">int32</text>
  <rect x="400" y="266" width="560" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="416" y="284" font-size="11" fill="#334155">这批的 offset 跨度（条数 - 1）</text>

  <rect x="40" y="292" width="240" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="310" font-family="Consolas, monospace" font-size="11.5" fill="#0f172a">baseTimestamp</text>
  <rect x="280" y="292" width="120" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="310" text-anchor="middle" font-size="11" fill="#475569">int64</text>
  <rect x="400" y="292" width="560" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="416" y="310" font-size="11" fill="#334155">批内最早时间戳 —— 记录里只存相对差值</text>

  <rect x="40" y="318" width="240" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="336" font-family="Consolas, monospace" font-size="11.5" fill="#0f172a">maxTimestamp</text>
  <rect x="280" y="318" width="120" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="336" text-anchor="middle" font-size="11" fill="#475569">int64</text>
  <rect x="400" y="318" width="560" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="416" y="336" font-size="11" fill="#334155">批内最晚时间戳 —— 按时间检索用的就是这个</text>

  <rect x="40" y="344" width="240" height="26" fill="#dcfce7" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="362" font-family="Consolas, monospace" font-size="11.5" fill="#14532d">producerId</text>
  <rect x="280" y="344" width="120" height="26" fill="#dcfce7" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="362" text-anchor="middle" font-size="11" fill="#166534">int64</text>
  <rect x="400" y="344" width="560" height="26" fill="#dcfce7" stroke="#e2e8f0" stroke-width="1"/>
  <text x="416" y="362" font-size="11" fill="#14532d">幂等 producer 的 ID（-1 表示非幂等 producer）</text>

  <rect x="40" y="370" width="240" height="26" fill="#dcfce7" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="388" font-family="Consolas, monospace" font-size="11.5" fill="#14532d">producerEpoch</text>
  <rect x="280" y="370" width="120" height="26" fill="#dcfce7" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="388" text-anchor="middle" font-size="11" fill="#166534">int16</text>
  <rect x="400" y="370" width="560" height="26" fill="#dcfce7" stroke="#e2e8f0" stroke-width="1"/>
  <text x="416" y="388" font-size="11" fill="#14532d">producer 的纪元，重启一次 +1，用于让旧序号失效</text>

  <rect x="40" y="396" width="240" height="26" fill="#dcfce7" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="414" font-family="Consolas, monospace" font-size="11.5" fill="#14532d">baseSequence</text>
  <rect x="280" y="396" width="120" height="26" fill="#dcfce7" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="414" text-anchor="middle" font-size="11" fill="#166534">int32</text>
  <rect x="400" y="396" width="560" height="26" fill="#dcfce7" stroke="#e2e8f0" stroke-width="1"/>
  <text x="416" y="414" font-size="11" fill="#14532d">这批第一条的序号 —— Broker 靠它去重（重复则丢并回成功）</text>

  <rect x="40" y="422" width="240" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="440" font-family="Consolas, monospace" font-size="11.5" fill="#0f172a">recordsCount</text>
  <rect x="280" y="422" width="120" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="440" text-anchor="middle" font-size="11" fill="#475569">int32</text>
  <rect x="400" y="422" width="560" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="416" y="440" font-size="11" fill="#334155">批内消息条数</text>

  <rect x="40" y="448" width="240" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="466" font-family="Consolas, monospace" font-size="11.5" fill="#0f172a">records</text>
  <rect x="280" y="448" width="120" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="466" text-anchor="middle" font-size="11" fill="#475569">变长</text>
  <rect x="400" y="448" width="560" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="416" y="466" font-size="11" fill="#334155">每条记录用 varint 编长度，时间戳与 offset 都存相对差值</text>

  <rect x="40" y="492" width="920" height="66" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="60" y="516" font-size="12" fill="#334155">批次之所以是「批」：一份 CRC、一次压缩、一份 offset 与时间戳基准 —— 批越大，单条开销越低。</text>
  <text x="60" y="540" font-size="12" fill="#b91c1c">注意：幂等是按 producer 维度做的，不是按消息 ID。序号重复 → 丢弃并回成功；序号跳跃 → OUT_OF_ORDER_SEQUENCE_NUMBER。</text>

  <text x="40" y="574" font-size="11.5" fill="#64748B">依据：Kafka 官方协议文档（3.9）；⚠️ 本篇未对本结构做本机逐字节解出验证，按规范陈述</text>
</svg>
