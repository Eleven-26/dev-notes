<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Pulsar 的两个确认：写入靠 BookKeeper quorum，消费靠游标 ack</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">本机 apachepulsar/pulsar:4.0.5 standalone 实测；生产副本参数按官方默认 3/2/2 标注</text>

  <rect x="20" y="78" width="960" height="220" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="104" font-size="14" font-weight="bold" fill="#0f172a">① 写入确认：Producer 拿到 SendReceipt，表示 Q 个 bookie 已确认</text>

  <rect x="50" y="140" width="150" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="125" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Producer</text>
  <text x="125" y="194" text-anchor="middle" font-size="11.5" fill="#1d4ed8">send() 同步等待</text>

  <line x1="204" y1="180" x2="250" y2="180" stroke="#2563eb" stroke-width="1.6"/>
  <polygon points="250,180 238,174 238,186" fill="#2563eb"/>

  <rect x="254" y="140" width="170" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="339" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Broker</text>
  <text x="339" y="190" text-anchor="middle" font-size="11.5" fill="#1d4ed8">校验 / 策略 / 攒批</text>
  <text x="339" y="208" text-anchor="middle" font-size="11.5" fill="#1d4ed8">再写 ensemble</text>

  <line x1="428" y1="180" x2="474" y2="180" stroke="#2563eb" stroke-width="1.6"/>
  <polygon points="474,180 462,174 462,186" fill="#2563eb"/>

  <rect x="478" y="132" width="230" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="593" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">BookKeeper ensemble</text>
  <text x="593" y="180" text-anchor="middle" font-size="11.5" fill="#1d4ed8">E 个参与 / W 个写成功 / Q 个确认</text>
  <text x="593" y="200" text-anchor="middle" font-size="11.5" fill="#1d4ed8">生产 3 / 2 / 2；本机单 bookie 1 / 1 / 1</text>
  <text x="593" y="218" text-anchor="middle" font-size="11.5" fill="#1d4ed8">journal + ledger 落盘</text>

  <rect x="748" y="132" width="212" height="96" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="854" y="158" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">同步发送的语义</text>
  <text x="854" y="180" text-anchor="middle" font-size="11.5" fill="#166534">返回即 quorum 已确认</text>
  <text x="854" y="200" text-anchor="middle" font-size="11.5" fill="#166534">未确认走 sendTimeout 报错</text>
  <text x="854" y="218" text-anchor="middle" font-size="11.5" fill="#166534">不要吞异常、不要发出即忘</text>

  <text x="50" y="262" font-size="12" fill="#334155">本机读数：200 条持久消息 1233 ms，平均 6.165 ms/条，publisher 150.41 msg/s，发布延迟 med 4 ms / 99pct 15 ms。</text>
  <text x="50" y="284" font-size="12" fill="#64748b">注意：standalone 只有一个 bookie，1/1/1 没有任何冗余；生产 3/2/2 才谈得上「确认即持久」。</text>

  <rect x="20" y="312" width="960" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="338" font-size="14" font-weight="bold" fill="#0f172a">② 消费确认与重投：ack 推进游标，Nack 或超时触发重投，超限进死信</text>

  <rect x="44" y="372" width="150" height="72" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.4"/>
  <text x="119" y="400" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">Broker 投递</text>
  <text x="119" y="422" text-anchor="middle" font-size="11.5" fill="#334155">按订阅类型分发</text>

  <line x1="198" y1="408" x2="242" y2="408" stroke="#475569" stroke-width="1.6"/>
  <polygon points="242,408 230,402 230,414" fill="#475569"/>

  <rect x="246" y="372" width="180" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="336" y="400" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">Consumer 处理业务</text>
  <text x="336" y="422" text-anchor="middle" font-size="11.5" fill="#166534">先处理，成功才 ack</text>

  <line x1="430" y1="408" x2="474" y2="408" stroke="#475569" stroke-width="1.6"/>
  <polygon points="474,408 462,402 462,414" fill="#475569"/>

  <rect x="478" y="380" width="120" height="56" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <text x="538" y="404" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">成功？</text>
  <text x="538" y="424" text-anchor="middle" font-size="11" fill="#64748b">是 / 否</text>

  <line x1="602" y1="396" x2="660" y2="396" stroke="#16a34a" stroke-width="1.6"/>
  <polygon points="660,396 648,390 648,402" fill="#16a34a"/>
  <text x="630" y="386" text-anchor="middle" font-size="11" fill="#16a34a">是</text>

  <rect x="664" y="372" width="180" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="754" y="400" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">acknowledge</text>
  <text x="754" y="422" text-anchor="middle" font-size="11.5" fill="#166534">游标前移，消息可被清理</text>

  <line x1="538" y1="440" x2="538" y2="486" stroke="#ea580c" stroke-width="1.6"/>
  <polygon points="538,486 532,474 544,474" fill="#ea580c"/>
  <text x="560" y="470" font-size="11" fill="#ea580c">否</text>

  <rect x="448" y="488" width="180" height="64" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="538" y="514" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">Nack 或 ackTimeout</text>
  <text x="538" y="536" text-anchor="middle" font-size="11.5" fill="#9a3412">按 negativeAckRedeliveryDelay</text>

  <line x1="444" y1="520" x2="400" y2="520" stroke="#ea580c" stroke-width="1.6"/>
  <polygon points="400,520 412,514 412,526" fill="#ea580c"/>

  <rect x="190" y="488" width="206" height="64" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="293" y="514" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">重投：redeliveryCount + 1</text>
  <text x="293" y="536" text-anchor="middle" font-size="11.5" fill="#9a3412">未超过 maxRedeliverCount</text>

  <line x1="190" y1="508" x2="150" y2="508" stroke="#ea580c" stroke-width="1.6"/>
  <line x1="150" y1="508" x2="150" y2="450" stroke="#ea580c" stroke-width="1.6"/>
  <line x1="150" y1="450" x2="112" y2="450" stroke="#ea580c" stroke-width="1.6"/>
  <polygon points="112,450 124,444 124,456" fill="#ea580c"/>

  <line x1="632" y1="520" x2="690" y2="520" stroke="#dc2626" stroke-width="1.6"/>
  <polygon points="690,520 678,514 678,526" fill="#dc2626"/>
  <text x="661" y="510" text-anchor="middle" font-size="11" fill="#dc2626">超限</text>

  <rect x="694" y="486" width="240" height="68" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="814" y="512" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">deadLetterTopic</text>
  <text x="814" y="534" text-anchor="middle" font-size="11.5" fill="#991b1b">仅 Shared / Key_Shared 支持</text>

  <text x="44" y="586" font-size="12" fill="#334155">本机实测：maxRedeliverCount=3 时 redeliveryCount 依次 0、1、2、3；第 5 次取不到消息，DLQ 主题收到它。</text>
  <text x="44" y="604" font-size="12" fill="#64748b">注意：ackTimeout 到期也会重投，表现为「没崩却重复消费」；重投是 At-Least-Once，去重与幂等见正文。</text>

  <text x="20" y="654" font-size="12" fill="#64748b">去重实测：同一 producerName 加同一 sequenceId 发送，第二次返回 -1:-1:-1，发 3 条只消费到 2 条；去重默认关闭，需在命名空间开启。</text>
  <text x="20" y="676" font-size="12" fill="#64748b">边界：retention 默认 0，所有订阅 ack 完即可删；想回溯必须显式设置命名空间保留策略。</text>
</svg>
