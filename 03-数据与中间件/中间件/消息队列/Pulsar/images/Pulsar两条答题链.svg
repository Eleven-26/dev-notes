<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">两条答题链：从问题一路推到「代价在哪」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">左到右是回答顺序，最后一格才是真正要落地的动作</text>

  <text x="24" y="94" font-size="12.5" font-weight="bold" fill="#1e3a8a">① Pulsar 消息会不会丢？</text>

  <rect x="24" y="106" width="172" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="110" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">生产端</text>
  <text x="110" y="154" text-anchor="middle" font-size="11" fill="#1d4ed8">同步 send / 异步查回调</text>
  <text x="110" y="174" text-anchor="middle" font-size="11" fill="#1d4ed8">sendTimeout 兜底</text>

  <line x1="200" y1="149" x2="220" y2="149" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="220,149 209,144 209,154" fill="#2563eb"/>

  <rect x="224" y="106" width="172" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="310" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">存储端</text>
  <text x="310" y="154" text-anchor="middle" font-size="11" fill="#1d4ed8">E / W / Q = 3 / 2 / 2</text>
  <text x="310" y="174" text-anchor="middle" font-size="11" fill="#1d4ed8">且 W + Q 大于 E</text>

  <line x1="400" y1="149" x2="420" y2="149" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="420,149 409,144 409,154" fill="#2563eb"/>

  <rect x="424" y="106" width="172" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="510" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">保留端</text>
  <text x="510" y="154" text-anchor="middle" font-size="11" fill="#1d4ed8">retention 默认 0</text>
  <text x="510" y="174" text-anchor="middle" font-size="11" fill="#1d4ed8">不丢但会被删</text>

  <line x1="600" y1="149" x2="620" y2="149" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="620,149 609,144 609,154" fill="#2563eb"/>

  <rect x="624" y="106" width="172" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="710" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">消费端</text>
  <text x="710" y="154" text-anchor="middle" font-size="11" fill="#1d4ed8">先处理再 ack</text>
  <text x="710" y="174" text-anchor="middle" font-size="11" fill="#1d4ed8">ackTimeout 大于 P99</text>

  <line x1="800" y1="149" x2="820" y2="149" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="820,149 809,144 809,154" fill="#16a34a"/>

  <rect x="824" y="106" width="152" height="86" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="900" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">语义边界</text>
  <text x="900" y="154" text-anchor="middle" font-size="11" fill="#166534">最多 At-Least-Once</text>
  <text x="900" y="174" text-anchor="middle" font-size="11" fill="#166534">重复 → 业务幂等</text>

  <text x="24" y="240" font-size="12.5" font-weight="bold" fill="#7c2d12">② 怎么做到同 key 有序？</text>

  <rect x="24" y="252" width="172" height="86" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="110" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">生产端</text>
  <text x="110" y="300" text-anchor="middle" font-size="11" fill="#9a3412">固定业务主键为 key</text>
  <text x="110" y="320" text-anchor="middle" font-size="11" fill="#9a3412">同实体恒定同一个值</text>

  <line x1="200" y1="295" x2="220" y2="295" stroke="#ea580c" stroke-width="1.5"/>
  <polygon points="220,295 209,290 209,300" fill="#ea580c"/>

  <rect x="224" y="252" width="172" height="86" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="310" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">选订阅类型</text>
  <text x="310" y="300" text-anchor="middle" font-size="11" fill="#9a3412">Key_Shared（不是 Shared）</text>
  <text x="310" y="320" text-anchor="middle" font-size="11" fill="#9a3412">要全局有序则 Exclusive</text>

  <line x1="400" y1="295" x2="420" y2="295" stroke="#ea580c" stroke-width="1.5"/>
  <polygon points="420,295 409,290 409,300" fill="#ea580c"/>

  <rect x="424" y="252" width="172" height="86" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="510" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">服务端分配</text>
  <text x="510" y="300" text-anchor="middle" font-size="11" fill="#9a3412">按 key 区间切给消费者</text>
  <text x="510" y="320" text-anchor="middle" font-size="11" fill="#9a3412">实测 1 个 key vs 3 个 key</text>

  <line x1="600" y1="295" x2="620" y2="295" stroke="#ea580c" stroke-width="1.5"/>
  <polygon points="620,295 609,290 609,300" fill="#ea580c"/>

  <rect x="624" y="252" width="172" height="86" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="710" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">消费端</text>
  <text x="710" y="300" text-anchor="middle" font-size="11" fill="#9a3412">同 key 串行处理</text>
  <text x="710" y="320" text-anchor="middle" font-size="11" fill="#9a3412">不要为提吞吐加并发</text>

  <line x1="800" y1="295" x2="820" y2="295" stroke="#dc2626" stroke-width="1.5"/>
  <polygon points="820,295 809,290 809,300" fill="#dc2626"/>

  <rect x="824" y="252" width="152" height="86" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="900" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">代价</text>
  <text x="900" y="300" text-anchor="middle" font-size="11" fill="#991b1b">key 分布不均</text>
  <text x="900" y="320" text-anchor="middle" font-size="11" fill="#991b1b">扩容期会重映射</text>

  <text x="24" y="378" font-size="11.5" fill="#64748b">两题共同的落点：中间件只给到语义与机制，业务侧的幂等与 key 设计才是最后一格。</text>
  <text x="24" y="400" font-size="11.5" fill="#64748b">答题时先给结论再往回推：会不会丢看五段、有序看「生产 key → 订阅类型 → 区间分配」三步。</text>
</svg>
