<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" width="1000" height="850" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="850" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Pulsar 排障决策：先分现象，再落到一个可读的字段</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">本机 apachepulsar/pulsar:4.0.5 standalone 实测；字段名取自 topics stats 与日志原文</text>

  <text x="134" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">现象</text>
  <text x="458" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">先看这个字段 / 命令</text>
  <text x="824" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">结论与动作</text>

  <rect x="24" y="110" width="220" height="125" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="134" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">① 生产者发不出去</text>
  <text x="134" y="168" text-anchor="middle" font-size="11.5" fill="#9a3412">或 send() 一直等到超时</text>
  <text x="134" y="194" text-anchor="middle" font-size="11.5" fill="#9a3412">先分清是「写不进」</text>
  <text x="134" y="216" text-anchor="middle" font-size="11.5" fill="#9a3412">还是「没人确认」</text>

  <rect x="268" y="110" width="380" height="125" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="458" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">ProducerBusyException：在途队列满了</text>
  <text x="458" y="168" text-anchor="middle" font-size="11.5" fill="#1d4ed8">NotEnoughBookiesException：可用 bookie 少于 ensemble</text>
  <text x="458" y="194" text-anchor="middle" font-size="11.5" fill="#1d4ed8">sendTimeout 到期：Broker 或 store 迟迟不确认</text>
  <text x="458" y="216" text-anchor="middle" font-size="11.5" fill="#64748b">日志里反复 lookup：owner 正在被搬走</text>

  <rect x="672" y="110" width="304" height="125" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="824" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">队列满：开 blockIfQueueFull</text>
  <text x="824" y="166" text-anchor="middle" font-size="11.5" fill="#166534">并提高 maxPendingMessages</text>
  <text x="824" y="192" text-anchor="middle" font-size="11.5" fill="#166534">bookie 不够：先补 bookie</text>
  <text x="824" y="216" text-anchor="middle" font-size="11.5" fill="#dc2626">不要降 ackQuorum 换可用性</text>

  <rect x="24" y="255" width="220" height="125" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="134" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">② 消费者不投消息</text>
  <text x="134" y="313" text-anchor="middle" font-size="11.5" fill="#9a3412">连接还活着</text>
  <text x="134" y="339" text-anchor="middle" font-size="11.5" fill="#9a3412">但积压一直不降</text>

  <rect x="268" y="255" width="380" height="125" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="458" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">blockedSubscriptionOnUnackedMsgs = true</text>
  <text x="458" y="313" text-anchor="middle" font-size="11.5" fill="#1d4ed8">unackedMessages 接近 maxUnackedMessagesPerConsumer</text>
  <text x="458" y="339" text-anchor="middle" font-size="11.5" fill="#1d4ed8">两个都为正常值：查 permits 与下游耗时</text>
  <text x="458" y="363" text-anchor="middle" font-size="11.5" fill="#64748b">同订阅已有一个消费者：ConsumerBusyException</text>

  <rect x="672" y="255" width="304" height="125" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="824" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">被背压卡住：提并发</text>
  <text x="824" y="311" text-anchor="middle" font-size="11.5" fill="#166534">降 receiverQueueSize</text>
  <text x="824" y="337" text-anchor="middle" font-size="11.5" fill="#166534">排查卡在下游的线程</text>
  <text x="824" y="363" text-anchor="middle" font-size="11.5" fill="#dc2626">Exclusive 订阅只能有一个消费者</text>

  <rect x="24" y="400" width="220" height="125" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="134" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">③ 没崩却重复消费</text>
  <text x="134" y="458" text-anchor="middle" font-size="11.5" fill="#9a3412">进程没重启</text>
  <text x="134" y="484" text-anchor="middle" font-size="11.5" fill="#9a3412">同一条来了好几次</text>

  <rect x="268" y="400" width="380" height="125" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="458" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">redeliveryCount 在涨、msgRateRedeliver 大于 0</text>
  <text x="458" y="458" text-anchor="middle" font-size="11.5" fill="#1d4ed8">ackTimeout 小于业务处理 P99</text>
  <text x="458" y="484" text-anchor="middle" font-size="11.5" fill="#1d4ed8">代码里调用了 negativeAcknowledge</text>
  <text x="458" y="508" text-anchor="middle" font-size="11.5" fill="#64748b">Broker 重启也会重投未 ack 的消息</text>

  <rect x="672" y="400" width="304" height="125" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="824" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">调大 ackTimeout 到 P99 以上</text>
  <text x="824" y="456" text-anchor="middle" font-size="11.5" fill="#166534">要控重投就手动 Nack</text>
  <text x="824" y="482" text-anchor="middle" font-size="11.5" fill="#166534">中间件只保证 At-Least-Once</text>
  <text x="824" y="508" text-anchor="middle" font-size="11.5" fill="#dc2626">正解在业务侧：幂等</text>

  <rect x="24" y="545" width="220" height="125" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="134" y="575" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">④ 磁盘涨、回溯没数据</text>
  <text x="134" y="603" text-anchor="middle" font-size="11.5" fill="#9a3412">两个现象常被混为一谈</text>
  <text x="134" y="629" text-anchor="middle" font-size="11.5" fill="#9a3412">其实是两件事</text>

  <rect x="268" y="545" width="380" height="125" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="458" y="575" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">backlogSize 不降：有订阅拖住删除位置</text>
  <text x="458" y="603" text-anchor="middle" font-size="11.5" fill="#1d4ed8">get-retention 读到 0：ack 完就删，无法重放</text>
  <text x="458" y="629" text-anchor="middle" font-size="11.5" fill="#1d4ed8">subscriptions 列表里有不再使用的订阅</text>
  <text x="458" y="653" text-anchor="middle" font-size="11.5" fill="#64748b">两者都不是「消息没写进去」</text>

  <rect x="672" y="545" width="304" height="125" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="824" y="575" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">清理僵尸订阅：unsubscribe</text>
  <text x="824" y="601" text-anchor="middle" font-size="11.5" fill="#166534">实测 25660 降到 17740 字节</text>
  <text x="824" y="627" text-anchor="middle" font-size="11.5" fill="#166534">要回溯：开 retention 并配 TTL</text>
  <text x="824" y="653" text-anchor="middle" font-size="11.5" fill="#dc2626">慢订阅要用 backlog 配额兜底</text>

  <rect x="24" y="690" width="952" height="140" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="40" y="716" font-size="13" font-weight="bold" fill="#78350f">本机实测的三条排障读数（都来自 4.0.5 的实际输出）</text>
  <text x="40" y="744" font-size="12" fill="#78350f">① topics stats 默认输出就带每个订阅的 msgBacklog 与 backlogSize；加 -sbs 反而把子项字节数打成 -1。</text>
  <text x="40" y="770" font-size="12" fill="#78350f">② peek-messages -s 一个不存在的订阅名，会凭空建出该订阅，topic backlog 从 17740 顶回 26540。</text>
  <text x="40" y="796" font-size="12" fill="#78350f">③ unsubscribe 掉积压 290 条的订阅后，topic backlogSize 从 25660 降到 17740，等于另一个订阅的积压。</text>
  <text x="40" y="820" font-size="11.5" fill="#92400e">注：backlogSize 是字节，msgBacklog 是条数；两者一起看，才能分清「积压很多条」与「单条很大」。</text>
</svg>
