<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Pulsar standalone：一个进程装下 Broker、Bookie 与元数据，对外只开两个端口</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">本机 apachepulsar/pulsar:4.0.5 容器 pulsar-lab 实测；宿主 16650 → 6650、18080 → 8080</text>

  <rect x="24" y="96" width="180" height="108" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="114" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">客户端</text>
  <text x="114" y="148" text-anchor="middle" font-size="11.5" fill="#166534">Java / Go 客户端</text>
  <text x="114" y="168" text-anchor="middle" font-size="11.5" fill="#166534">pulsar-admin / pulsar-client</text>
  <text x="114" y="190" text-anchor="middle" font-size="11.5" fill="#166534">pulsar://127.0.0.1:16650</text>

  <line x1="208" y1="150" x2="244" y2="150" stroke="#16a34a" stroke-width="1.6"/>
  <polygon points="244,150 232,144 232,156" fill="#16a34a"/>

  <rect x="248" y="96" width="176" height="108" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="336" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">宿主机端口映射</text>
  <text x="336" y="148" text-anchor="middle" font-size="11.5" fill="#1d4ed8">16650 → 6650（二进制协议）</text>
  <text x="336" y="168" text-anchor="middle" font-size="11.5" fill="#1d4ed8">18080 → 8080（Admin / Web）</text>
  <text x="336" y="190" text-anchor="middle" font-size="11.5" fill="#64748b">容器内客户端直连 6650</text>

  <line x1="428" y1="150" x2="462" y2="150" stroke="#2563eb" stroke-width="1.6"/>
  <polygon points="462,150 450,144 450,156" fill="#2563eb"/>

  <rect x="466" y="82" width="510" height="196" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="482" y="106" font-size="13" font-weight="bold" fill="#0f172a">容器 pulsar-lab · 单个 JVM（PID 1，RSS 804 MB）</text>

  <rect x="482" y="120" width="152" height="132" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="558" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">Broker</text>
  <text x="558" y="170" text-anchor="middle" font-size="11.5" fill="#1d4ed8">6650 二进制协议</text>
  <text x="558" y="190" text-anchor="middle" font-size="11.5" fill="#1d4ed8">8080 Admin / Web</text>
  <text x="558" y="210" text-anchor="middle" font-size="11.5" fill="#1d4ed8">订阅、分发、lookup</text>
  <text x="558" y="234" text-anchor="middle" font-size="11.5" fill="#64748b">无状态，不存消息</text>

  <line x1="638" y1="186" x2="668" y2="186" stroke="#475569" stroke-width="1.6"/>
  <polygon points="668,186 656,180 656,192" fill="#475569"/>

  <rect x="672" y="120" width="142" height="132" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="743" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">Bookie</text>
  <text x="743" y="170" text-anchor="middle" font-size="11.5" fill="#9a3412">端口随机（本机 45855）</text>
  <text x="743" y="190" text-anchor="middle" font-size="11.5" fill="#9a3412">本机 1 个 bookie</text>
  <text x="743" y="210" text-anchor="middle" font-size="11.5" fill="#9a3412">ledger / entry</text>
  <text x="743" y="234" text-anchor="middle" font-size="11.5" fill="#64748b">E / W / Q = 1 / 1 / 1</text>

  <line x1="818" y1="186" x2="846" y2="186" stroke="#475569" stroke-width="1.6"/>
  <polygon points="846,186 834,180 834,192" fill="#475569"/>

  <rect x="850" y="120" width="110" height="132" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.4"/>
  <text x="905" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">元数据</text>
  <text x="905" y="170" text-anchor="middle" font-size="11.5" fill="#334155">本地 RocksDB</text>
  <text x="905" y="190" text-anchor="middle" font-size="11.5" fill="#334155">无 ZooKeeper</text>
  <text x="905" y="210" text-anchor="middle" font-size="11.5" fill="#334155">命名空间策略</text>
  <text x="905" y="230" text-anchor="middle" font-size="11.5" fill="#334155">bundle 归属</text>

  <rect x="466" y="294" width="510" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="482" y="318" font-size="13" font-weight="bold" fill="#0f172a">磁盘布局：Broker 本地没有消息目录</text>
  <text x="482" y="346" font-size="12" fill="#334155">/pulsar/data/metadata　　　　75 MB　元数据 RocksDB（策略、ledger 元信息）</text>
  <text x="482" y="370" font-size="12" fill="#334155">/pulsar/data/standalone/bookkeeper　150 MB　BookKeeper 数据</text>
  <text x="482" y="394" font-size="12" fill="#334155">　├─ current/ledgers　　　75 MB　ledger 数据</text>
  <text x="482" y="418" font-size="12" fill="#334155">　└─ current/locations　　75 MB　entry 位置索引</text>

  <rect x="24" y="294" width="404" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="318" font-size="13" font-weight="bold" fill="#0f172a">最小起法</text>
  <text x="40" y="344" font-size="11.5" fill="#1e293b">docker run -d --name pulsar-lab \</text>
  <text x="40" y="364" font-size="11.5" fill="#1e293b">  -p 16650:6650 -p 18080:8080 \</text>
  <text x="40" y="384" font-size="11.5" fill="#1e293b">  apachepulsar/pulsar:4.0.5 \</text>
  <text x="40" y="404" font-size="11.5" fill="#1e293b">  bin/pulsar standalone</text>
  <text x="40" y="428" font-size="11.5" fill="#64748b">健康检查：pulsar-admin brokers healthcheck → ok</text>

  <rect x="24" y="466" width="952" height="150" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="40" y="490" font-size="13" font-weight="bold" fill="#78350f">standalone 的四个默认值，上线前必须逐条确认</text>
  <text x="40" y="516" font-size="12" fill="#78350f">① 副本：managedLedgerDefaultEnsembleSize / WriteQuorum / AckQuorum = 1 / 1 / 1，没有冗余。</text>
  <text x="40" y="540" font-size="12" fill="#78350f">② 保留：defaultRetentionTimeInMinutes = 0、defaultRetentionSizeInMB = 0，ack 完即可删。</text>
  <text x="40" y="564" font-size="12" fill="#78350f">③ 去重：brokerDeduplicationEnabled = false，需命名空间显式开启。</text>
  <text x="40" y="588" font-size="12" fill="#78350f">④ 事务：transactionCoordinatorEnabled = false；自动建 topic：allowAutoTopicCreation = true。</text>
</svg>
