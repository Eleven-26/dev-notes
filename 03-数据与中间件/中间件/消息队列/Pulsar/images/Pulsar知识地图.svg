<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Pulsar 册的知识地图：原理线、落地线与协议层各管一段</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">六篇零件 + 一篇追问汇编；箭头表示建议的阅读先后，不是调用关系</text>

  <rect x="24" y="86" width="296" height="126" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="172" y="114" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">① 核心概念与架构</text>
  <text x="172" y="142" text-anchor="middle" font-size="11.5" fill="#1d4ed8">存算分离：Broker 与 Bookie</text>
  <text x="172" y="164" text-anchor="middle" font-size="11.5" fill="#1d4ed8">MessageId 不是 offset</text>
  <text x="172" y="186" text-anchor="middle" font-size="11.5" fill="#1d4ed8">bundle 所有权与三类组件的账</text>

  <line x1="324" y1="149" x2="356" y2="149" stroke="#2563eb" stroke-width="1.6"/>
  <polygon points="356,149 344,143 344,155" fill="#2563eb"/>

  <rect x="360" y="86" width="280" height="126" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="114" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">② 订阅与消费语义</text>
  <text x="500" y="142" text-anchor="middle" font-size="11.5" fill="#1d4ed8">四种订阅类型怎么选</text>
  <text x="500" y="164" text-anchor="middle" font-size="11.5" fill="#1d4ed8">Shared 无序、Key_Shared 按 key 区间</text>
  <text x="500" y="186" text-anchor="middle" font-size="11.5" fill="#1d4ed8">延迟投递的订阅类型限制</text>

  <line x1="644" y1="149" x2="676" y2="149" stroke="#2563eb" stroke-width="1.6"/>
  <polygon points="676,149 664,143 664,155" fill="#2563eb"/>

  <rect x="680" y="86" width="296" height="126" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="828" y="114" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">③ 消息可靠性</text>
  <text x="828" y="142" text-anchor="middle" font-size="11.5" fill="#1d4ed8">生产、存储、保留、消费、语义五段</text>
  <text x="828" y="164" text-anchor="middle" font-size="11.5" fill="#1d4ed8">retention 默认 0、去重窗口</text>
  <text x="828" y="186" text-anchor="middle" font-size="11.5" fill="#1d4ed8">重投与死信，最终 At-Least-Once</text>

  <rect x="24" y="256" width="296" height="126" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="172" y="284" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">④ 部署与配置</text>
  <text x="172" y="312" text-anchor="middle" font-size="11.5" fill="#166534">standalone 是单个 JVM（无 ZooKeeper）</text>
  <text x="172" y="334" text-anchor="middle" font-size="11.5" fill="#166534">单机只能 E / W / Q = 1 / 1 / 1</text>
  <text x="172" y="356" text-anchor="middle" font-size="11.5" fill="#166534">retention 与去重必须显式开</text>

  <line x1="324" y1="319" x2="356" y2="319" stroke="#16a34a" stroke-width="1.6"/>
  <polygon points="356,319 344,313 344,325" fill="#16a34a"/>

  <rect x="360" y="256" width="280" height="126" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="500" y="284" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">⑤ 运维与排障</text>
  <text x="500" y="312" text-anchor="middle" font-size="11.5" fill="#166534">stats / stats-internal / subscriptions</text>
  <text x="500" y="334" text-anchor="middle" font-size="11.5" fill="#166534">backlogSize 不降与僵尸订阅</text>
  <text x="500" y="356" text-anchor="middle" font-size="11.5" fill="#166534">背压、重复消费、顺序归因</text>

  <rect x="680" y="256" width="296" height="126" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="828" y="284" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c2d12">⑥ Pulsar 协议</text>
  <text x="828" y="312" text-anchor="middle" font-size="11.5" fill="#9a3412">Protobuf 帧的六段结构</text>
  <text x="828" y="334" text-anchor="middle" font-size="11.5" fill="#9a3412">lookup 重定向</text>
  <text x="828" y="356" text-anchor="middle" font-size="11.5" fill="#9a3412">FLOW permits 流控</text>

  <line x1="828" y1="216" x2="828" y2="248" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="5 4"/>
  <polygon points="828,248 822,236 834,236" fill="#ea580c"/>
  <text x="816" y="236" text-anchor="end" font-size="11" fill="#9a3412">owner 模型决定 lookup</text>

  <line x1="172" y1="216" x2="172" y2="248" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <polygon points="172,248 166,236 178,236" fill="#16a34a"/>
  <text x="184" y="236" font-size="11" fill="#166534">读懂了架构再谈落地</text>

  <line x1="500" y1="386" x2="500" y2="418" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4"/>
  <polygon points="500,418 494,406 506,406" fill="#64748b"/>

  <rect x="248" y="422" width="504" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="500" y="450" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">⑦ 延伸追问</text>
  <text x="500" y="476" text-anchor="middle" font-size="11.5" fill="#334155">一句话结论 + 指向详解，最后读；它用来暴露缺口</text>
  <text x="500" y="498" text-anchor="middle" font-size="11.5" fill="#64748b">附两条答题链：会不会丢、怎么做同 key 有序</text>

  <text x="24" y="545" font-size="11.5" fill="#64748b">蓝色 = 原理线（为什么这样设计）　绿色 = 落地线（怎么起、怎么查）　橙色 = 协议层（客户端为什么先问路）</text>
</svg>
