<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" width="1000" height="710" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="710" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Pulsar 帧的六段结构：命令段与消息体段靠 magicNumber 分界</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">结构依据 PulsarApi.proto，未做本机抓包；图中十六进制为按 proto 推导的示意</text>

  <text x="40" y="94" font-size="13" font-weight="bold" fill="#1e3a8a">命令段：一个 BaseCommand</text>

  <rect x="40" y="106" width="120" height="56" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="100" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">totalSize</text>
  <text x="100" y="149" text-anchor="middle" font-size="11" fill="#1d4ed8">4 B</text>

  <rect x="160" y="106" width="130" height="56" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="225" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">commandSize</text>
  <text x="225" y="149" text-anchor="middle" font-size="11" fill="#1d4ed8">4 B</text>

  <rect x="290" y="106" width="330" height="56" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="455" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">command</text>
  <text x="455" y="149" text-anchor="middle" font-size="11" fill="#1d4ed8">变长 · BaseCommand{ type = SEND, ... }</text>

  <text x="640" y="128" font-size="11.5" fill="#334155">totalSize 不含自身这 4 字节，</text>
  <text x="640" y="147" font-size="11.5" fill="#334155">与 Kafka 的 size 语义一致</text>

  <rect x="40" y="172" width="920" height="30" rx="4" fill="#fef9c3" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="56" y="192" font-size="12" fill="#713f12">magicNumber　0x0e01（2 B）—— 读到它就说明命令段结束、后面是消息体；不带消息的 PING / ACK 帧到此为止</text>

  <text x="40" y="232" font-size="13" font-weight="bold" fill="#14532d">消息体段：MessageMetadata + payload</text>

  <rect x="40" y="244" width="150" height="56" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="115" y="268" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">checksum</text>
  <text x="115" y="287" text-anchor="middle" font-size="11" fill="#15803d">4 B · CRC32-C</text>

  <rect x="190" y="244" width="400" height="56" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="390" y="268" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">metadataSize + metadata</text>
  <text x="390" y="287" text-anchor="middle" font-size="11" fill="#15803d">4 B + 变长 · MessageMetadata（producer 名、序号、时间戳、属性）</text>

  <rect x="590" y="244" width="370" height="56" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="775" y="268" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">payloadSize + payload</text>
  <text x="775" y="287" text-anchor="middle" font-size="11" fill="#15803d">4 B + 变长 · 真正的消息内容（可能已批量或压缩）</text>

  <text x="40" y="330" font-size="12" fill="#0f172a">要点：command 与 metadata 是两个不同的 Protobuf 消息，前者是控制指令、后者是消息级元数据，不要混成一个。</text>
  <text x="40" y="352" font-size="12" fill="#b91c1c">注意：checksum 用的是 CRC32-C（Castagnoli 多项式），用 Python 的 zlib.crc32 算出来永远对不上。</text>

  <line x1="40" y1="376" x2="960" y2="376" stroke="#e2e8f0" stroke-width="1"/>

  <text x="40" y="404" font-size="15" font-weight="bold" fill="#0f172a">lookup 重定向：producer 发消息前先问「这个 topic 归谁」</text>

  <rect x="60" y="420" width="160" height="70" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="140" y="448" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#312e81">Pulsar 客户端</text>
  <text x="140" y="470" text-anchor="middle" font-size="11" fill="#4338ca">producer / consumer</text>

  <rect x="440" y="420" width="180" height="70" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="530" y="448" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">owner Broker</text>
  <text x="530" y="470" text-anchor="middle" font-size="11" fill="#334155">一个 topic 只归一个</text>

  <line x1="222" y1="440" x2="438" y2="440" stroke="#4338ca" stroke-width="1.6"/>
  <polygon points="438,440 426,434 426,446" fill="#4338ca"/>
  <text x="330" y="432" text-anchor="middle" font-size="11.5" fill="#4338ca">LOOKUP（topic）</text>

  <line x1="438" y1="474" x2="222" y2="474" stroke="#15803d" stroke-width="1.6"/>
  <polygon points="222,474 234,468 234,480" fill="#15803d"/>
  <text x="330" y="494" text-anchor="middle" font-size="11.5" fill="#15803d">LOOKUP_RESPONSE（带 LookupType）</text>

  <line x1="530" y1="490" x2="530" y2="508" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="275" y1="508" x2="735" y2="508" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="275" y1="508" x2="275" y2="520" stroke="#94a3b8" stroke-width="1.4"/>
  <polygon points="275,522 269,512 281,512" fill="#94a3b8"/>
  <line x1="735" y1="508" x2="735" y2="520" stroke="#94a3b8" stroke-width="1.4"/>
  <polygon points="735,522 729,512 741,512" fill="#94a3b8"/>

  <rect x="60" y="524" width="430" height="96" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="80" y="550" font-size="13" font-weight="bold" fill="#14532d">LookupType = Connect</text>
  <text x="80" y="574" font-size="11.5" fill="#166534">topic 就归当前 Broker，不需要换连接。</text>
  <text x="80" y="596" font-size="11.5" fill="#166534">直接在这条连接上建 producer / consumer。</text>

  <rect x="510" y="524" width="450" height="96" rx="6" fill="#fef9c3" stroke="#d97706" stroke-width="1.4"/>
  <text x="530" y="550" font-size="13" font-weight="bold" fill="#713f12">LookupType = Redirect</text>
  <text x="530" y="574" font-size="11.5" fill="#92400e">归属别的 Broker，当前 Broker 办不了这件事。</text>
  <text x="530" y="596" font-size="11.5" fill="#92400e">断开 → 重连到响应里的地址 → 在新连接上再建。</text>

  <text x="40" y="654" font-size="12" fill="#0f172a">要点：Pulsar 的 owner 是强制的，连错 Broker 就发不了；Kafka 的 Metadata 只是建议，连任意 Broker 都行，写错再返回 NOT_LEADER。</text>
  <text x="40" y="676" font-size="12" fill="#0f172a">所以 Pulsar 客户端常同时持有「一条查元数据的连接 + N 条连到各 owner Broker 的连接」，连接数天然比 Kafka 多。</text>
  <text x="40" y="698" font-size="11.5" fill="#64748B">实测口径：本篇未做本机实测，帧布局按 PulsarApi.proto 与官方文档陈述，图中未标任何吞吐或延迟数字。</text>
</svg>
