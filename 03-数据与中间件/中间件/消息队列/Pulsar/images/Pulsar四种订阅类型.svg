<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ps3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="ps4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Pulsar 四种订阅类型：并行与有序之间的取舍</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">订阅（游标）独立于 topic 存在，同一订阅可挂多个 Consumer</text>

  <rect x="20" y="86" width="460" height="196" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="112" font-size="14" font-weight="bold" fill="#1e3a8a">Exclusive（独占）</text>
  <text x="36" y="134" font-size="12" fill="#334155">同一订阅只能 1 个 Consumer；topic 内严格有序</text>
  <rect x="40" y="156" width="150" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="115" y="187" text-anchor="middle" font-size="12.5" fill="#7c2d12">消息按序</text>
  <line x1="194" y1="182" x2="256" y2="182" stroke="#334155" stroke-width="1.5" marker-end="url(#ps3)"/>
  <rect x="260" y="158" width="200" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="360" y="187" text-anchor="middle" font-size="12.5" fill="#14532d">唯一 Consumer</text>
  <text x="36" y="252" font-size="11.5" fill="#64748b">故障切换：需外部改配置或重启才能换人</text>

  <rect x="520" y="86" width="460" height="196" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="536" y="112" font-size="14" font-weight="bold" fill="#1e3a8a">Shared（共享）</text>
  <text x="536" y="134" font-size="12" fill="#334155">多个 Consumer；轮询派发，整体无序</text>
  <rect x="540" y="156" width="150" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="615" y="187" text-anchor="middle" font-size="12.5" fill="#7c2d12">轮询派发</text>
  <line x1="694" y1="182" x2="756" y2="165" stroke="#334155" stroke-width="1.4" marker-end="url(#ps3)"/>
  <line x1="694" y1="182" x2="756" y2="207" stroke="#334155" stroke-width="1.4" marker-end="url(#ps3)"/>
  <rect x="760" y="148" width="200" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="860" y="170" text-anchor="middle" font-size="12" fill="#14532d">Consumer A</text>
  <rect x="760" y="190" width="200" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="860" y="212" text-anchor="middle" font-size="12" fill="#14532d">Consumer B</text>
  <text x="536" y="252" font-size="11.5" fill="#b91c1c">⚠️ 同一分区也会被轮询发出去，从 Kafka 迁来最易踩</text>

  <rect x="20" y="296" width="460" height="196" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="322" font-size="14" font-weight="bold" fill="#1e3a8a">Key_Shared（按 key 哈希）</text>
  <text x="36" y="344" font-size="12" fill="#334155">多个 Consumer；按 key / orderingKey 哈希固定消费者</text>
  <rect x="40" y="366" width="150" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="115" y="397" text-anchor="middle" font-size="12.5" fill="#7c2d12">按 key 哈希</text>
  <line x1="194" y1="392" x2="256" y2="375" stroke="#334155" stroke-width="1.4" marker-end="url(#ps3)"/>
  <line x1="194" y1="392" x2="256" y2="417" stroke="#334155" stroke-width="1.4" marker-end="url(#ps3)"/>
  <rect x="260" y="358" width="200" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="360" y="380" text-anchor="middle" font-size="12" fill="#14532d">Consumer A</text>
  <rect x="260" y="400" width="200" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="360" y="422" text-anchor="middle" font-size="12" fill="#14532d">Consumer B</text>
  <text x="36" y="462" font-size="11.5" fill="#15803d">⭐ 同 key 有序、不同 key 并行（订单状态机）</text>

  <rect x="520" y="296" width="460" height="196" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="536" y="322" font-size="14" font-weight="bold" fill="#1e3a8a">Failover（故障转移）</text>
  <text x="536" y="344" font-size="12" fill="#334155">多个 Consumer（有优先级）；只投最高优先级的活跃者</text>
  <rect x="540" y="366" width="150" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="615" y="397" text-anchor="middle" font-size="12.5" fill="#7c2d12">只投活跃者</text>
  <line x1="694" y1="392" x2="756" y2="375" stroke="#334155" stroke-width="1.4" marker-end="url(#ps3)"/>
  <line x1="694" y1="392" x2="756" y2="417" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ps4)"/>
  <rect x="760" y="358" width="200" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="860" y="380" text-anchor="middle" font-size="12" fill="#14532d">主 Consumer（活跃）</text>
  <rect x="760" y="400" width="200" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="860" y="422" text-anchor="middle" font-size="12" fill="#475569">备 Consumer（待命）</text>
  <text x="536" y="462" font-size="11.5" fill="#15803d">⭐ 高优先级挂掉自动切到次优先级（带热备的有序消费）</text>

  <line x1="20" y1="516" x2="980" y2="516" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="542" font-size="13" fill="#0f172a">⭐ 与 Kafka 的对应：Exclusive ≈ 1 分区 1 消费者；Shared 按消息轮询；Key_Shared ≈ 按 key 哈希路由。</text>
  <text x="20" y="568" font-size="13" fill="#0f172a">⚠️ Shared 会破坏顺序：要有序请用 Key_Shared（生产端必须设 key）或 Exclusive。</text>
  <text x="20" y="600" font-size="12" fill="#64748b">订阅独立于 topic 存在，Broker 侧保存游标：一个 topic 可挂多个订阅，各自独立回溯。</text>
</svg>
