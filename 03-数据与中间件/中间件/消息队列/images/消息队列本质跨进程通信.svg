<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="mq01" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="400" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">消息队列的本质：两个进程之间传递信息</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">MQ 不只是「队列」，它的功能远不止于队列 —— 本质是跨进程通信（IPC）的一种载体</text>

  <rect x="120" y="118" width="176" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="208" y="150" text-anchor="middle" font-size="13" fill="#1e3a8a">进程 A</text>
  <text x="208" y="170" text-anchor="middle" font-size="11.5" fill="#1e3a8a">（生产者）</text>

  <line x1="300" y1="153" x2="392" y2="153" stroke="#334155" stroke-width="1.6" marker-end="url(#mq01)"/>
  <text x="346" y="143" text-anchor="middle" font-size="11.5" fill="#334155">消息</text>

  <rect x="396" y="110" width="208" height="86" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">MQ</text>
  <text x="500" y="166" text-anchor="middle" font-size="11.5" fill="#7c2d12">队列（点对点）/ 主题（发布订阅）</text>

  <line x1="608" y1="153" x2="700" y2="153" stroke="#334155" stroke-width="1.6" marker-end="url(#mq01)"/>
  <text x="654" y="143" text-anchor="middle" font-size="11.5" fill="#334155">消息</text>

  <rect x="704" y="118" width="176" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="792" y="150" text-anchor="middle" font-size="13" fill="#14532d">进程 B</text>
  <text x="792" y="170" text-anchor="middle" font-size="11.5" fill="#14532d">（消费者）</text>

  <line x1="20" y1="226" x2="980" y2="226" stroke="#cbd5e1" stroke-width="1"/>

  <text x="20" y="256" font-size="12.5" fill="#0f172a">⭐ 队列只是载体：真正被传递的是「消息」，生产者与消费者互相不持有对方的地址。</text>
  <text x="20" y="284" font-size="12.5" fill="#0f172a">⚠️ 与「同步调用」的差别：直接调用时 A 必须等 B 返回；经 MQ 则 A 写完就返回，B 按自己的节奏取。</text>

  <rect x="20" y="306" width="960" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="332" font-size="12.5" font-weight="bold" fill="#0f172a">一句话</text>
  <text x="36" y="356" font-size="12.5" fill="#334155">消息队列 = 用「异步 + 中间载体」换取可用性与吞吐：削峰、解耦、异步化、最终一致、延迟消息都建立在这一步之上。</text>
</svg>
