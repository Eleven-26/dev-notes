<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一条拆合判据，在三套体系里的动作完全不同</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">判据跨产品通用，但「拆」和「合」要落到各自的对象上，否则会把分类误做成并行</text>

  <rect x="40" y="82" width="918" height="62" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="56" y="106" font-size="11.5" fill="#4338ca">跨产品通用判据</text>
  <text x="56" y="130" font-size="13.5" font-weight="bold" fill="#312e81">同一份代码、同一个速率档 → 合；不同代码或不同速率档 → 拆（与事件类型多少无关）</text>

  <rect x="40" y="164" width="168" height="42" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="124" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">维度</text>
  <rect x="208" y="164" width="250" height="42" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="333" y="190" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c2d12">RabbitMQ</text>
  <rect x="458" y="164" width="250" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="583" y="190" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">Kafka</text>
  <rect x="708" y="164" width="250" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="833" y="190" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">RocketMQ</text>

  <rect x="40" y="206" width="168" height="58" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="124" y="240" text-anchor="middle" font-size="12" fill="#334155">分类落在哪</text>
  <rect x="208" y="206" width="250" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="333" y="240" text-anchor="middle" font-size="12.5" fill="#0f172a">Exchange + routing key</text>
  <rect x="458" y="206" width="250" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="583" y="240" text-anchor="middle" font-size="12.5" fill="#0f172a">Topic</text>
  <rect x="708" y="206" width="250" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="833" y="240" text-anchor="middle" font-size="12.5" fill="#0f172a">Topic + Tag</text>

  <rect x="40" y="264" width="168" height="58" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="124" y="298" text-anchor="middle" font-size="12" fill="#334155">并行单位</text>
  <rect x="208" y="264" width="250" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="333" y="298" text-anchor="middle" font-size="12.5" fill="#0f172a">Queue</text>
  <rect x="458" y="264" width="250" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="583" y="298" text-anchor="middle" font-size="12.5" fill="#0f172a">Partition</text>
  <rect x="708" y="264" width="250" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="833" y="298" text-anchor="middle" font-size="12.5" fill="#0f172a">MessageQueue</text>

  <rect x="40" y="322" width="168" height="58" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="124" y="356" text-anchor="middle" font-size="12" fill="#334155">「拆」的动作</text>
  <rect x="208" y="322" width="250" height="58" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1"/>
  <text x="333" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b91c1c">新队列（+1 份存储）</text>
  <rect x="458" y="322" width="250" height="58" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="583" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">新消费组（0 存储）</text>
  <rect x="708" y="322" width="250" height="58" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1"/>
  <text x="833" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">新消费组（0 存储）</text>

  <rect x="40" y="380" width="168" height="58" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="124" y="414" text-anchor="middle" font-size="12" fill="#334155">「合」的动作</text>
  <rect x="208" y="380" width="250" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="333" y="414" text-anchor="middle" font-size="12.5" fill="#0f172a">同队列多消费者竞争</text>
  <rect x="458" y="380" width="250" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="583" y="414" text-anchor="middle" font-size="12.5" fill="#0f172a">同消费组靠分区分摊</text>
  <rect x="708" y="380" width="250" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="833" y="414" text-anchor="middle" font-size="12.5" fill="#0f172a">同消费组靠队列分摊</text>

  <rect x="40" y="438" width="168" height="58" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="124" y="472" text-anchor="middle" font-size="12" fill="#334155">最常见的错</text>
  <rect x="208" y="438" width="250" height="58" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1"/>
  <text x="333" y="472" text-anchor="middle" font-size="12" fill="#15803d">无：本就该每下游一条</text>
  <rect x="458" y="438" width="250" height="58" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="583" y="472" text-anchor="middle" font-size="12" fill="#b91c1c">每下游建一个 Topic</text>
  <rect x="708" y="438" width="250" height="58" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="833" y="472" text-anchor="middle" font-size="12" fill="#b91c1c">每下游建一个 Topic</text>

  <text x="40" y="528" font-size="12" fill="#0f172a">要点：RabbitMQ 的队列是「订阅」，为每个下游建一条是正确做法；Kafka / RocketMQ 的 Topic 是「存储」，为每个下游建一个就是复制数据。</text>
  <text x="40" y="552" font-size="11.5" fill="#64748B">判据来源：本仓 RabbitMQ 队列数代价实测（两遍进程数一致）与 Kafka 分区数代价实测，见正文第二、三节</text>
</svg>
