<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="sm1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="smg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="smr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">RocketMQ 事务消息：半消息状态机</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">与「两阶段与回查」时序图互补：这里只回答此刻这条半消息处于什么状态、什么条件迁移到哪个状态</text>

  <!-- 起始点与 ① 发送半消息 -->
  <circle cx="48" cy="345" r="7" fill="#334155"/>
  <text x="48" y="318" text-anchor="middle" font-size="11" fill="#334155">发送半消息</text>
  <line x1="55" y1="345" x2="74" y2="345" stroke="#334155" stroke-width="1.5" marker-end="url(#sm1)"/>

  <!-- S1 未决（Half） -->
  <rect x="80" y="300" width="240" height="90" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
  <text x="200" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">未决（Half）</text>
  <text x="200" y="348" text-anchor="middle" font-size="11" fill="#7c2d12">HALF topic 有索引 · 真实 topic 无索引</text>
  <text x="200" y="368" text-anchor="middle" font-size="11" fill="#7c2d12">消费者对这条物理记录不可达</text>

  <!-- S4 回查中 -->
  <rect x="380" y="300" width="240" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="500" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">回查中</text>
  <text x="500" y="348" text-anchor="middle" font-size="11" fill="#1e3a8a">Broker 每 60s 回调 Producer</text>
  <text x="500" y="368" text-anchor="middle" font-size="11" fill="#1e3a8a">checkLocalTransaction · 累计 ≤15 次</text>

  <!-- S2 已提交 -->
  <rect x="700" y="120" width="270" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="835" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">已提交 · 可见</text>
  <text x="835" y="170" text-anchor="middle" font-size="11" fill="#14532d">副本追加进真实 Topic（OP 记 REP）</text>
  <text x="835" y="188" text-anchor="middle" font-size="11" fill="#14532d">此后按普通消息走重试 / 死信</text>

  <!-- S3 已回滚 -->
  <rect x="660" y="560" width="290" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
  <text x="805" y="588" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">已回滚 · 待回收</text>
  <text x="805" y="610" text-anchor="middle" font-size="11" fill="#334155">OP 记 ROLLED_BACK · 后台线程回收半消息</text>

  <!-- S5 丢弃 -->
  <rect x="80" y="560" width="240" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="200" y="588" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">丢弃（须对账）</text>
  <text x="200" y="610" text-anchor="middle" font-size="11" fill="#7f1d1d">回查耗尽仍未决 · 消息丢失 + 日志</text>

  <!-- 迁移边 -->
  <line x1="320" y1="345" x2="374" y2="345" stroke="#2563eb" stroke-width="1.5" marker-end="url(#sm1)"/>
  <text x="348" y="330" text-anchor="middle" font-size="11" fill="#2563eb">② 无响应</text>

  <line x1="250" y1="300" x2="766" y2="208" stroke="#16a34a" stroke-width="1.5" marker-end="url(#smg)"/>
  <text x="410" y="258" text-anchor="middle" font-size="11" fill="#16a34a">② Commit（COMMIT_MESSAGE）</text>

  <path d="M200,390 L200,595 L654,595" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#sm1)"/>
  <text x="490" y="583" text-anchor="middle" font-size="11" fill="#334155">② Rollback（ROLLBACK_MESSAGE）</text>

  <path d="M520,300 C540,252 600,252 618,296" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#sm1)"/>
  <text x="569" y="238" text-anchor="middle" font-size="11" fill="#2563eb">仍 UNKNOW · 60s 后下一轮</text>

  <path d="M620,330 L835,330 L835,204" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#smg)"/>
  <text x="843" y="270" text-anchor="start" font-size="11" fill="#16a34a">回查报 Commit</text>

  <line x1="805" y1="390" x2="805" y2="556" stroke="#334155" stroke-width="1.5" marker-end="url(#sm1)"/>
  <text x="813" y="470" text-anchor="start" font-size="11" fill="#334155">回查报 Rollback</text>

  <line x1="400" y1="392" x2="288" y2="556" stroke="#dc2626" stroke-width="1.5" marker-end="url(#smr)"/>
  <text x="300" y="480" text-anchor="end" font-size="11" fill="#dc2626">15 次仍未决</text>
</svg>
