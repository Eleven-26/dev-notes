<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ps2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Pulsar 故障转移与扩容：迁的是 bundle 所有权，不是数据</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">Broker 无状态，任何 Broker 都能读到同一段 Ledger</text>

  <rect x="20" y="82" width="960" height="196" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="108" font-size="14" font-weight="bold" fill="#0f172a">① Broker 宕机：所有权超时释放后被别的 Broker 接管</text>

  <rect x="40" y="132" width="200" height="88" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="140" y="168" text-anchor="middle" font-size="12.5" fill="#7f1d1d">Broker 宕机</text>
  <text x="140" y="194" text-anchor="middle" font-size="12" fill="#b91c1c">心跳停止</text>
  <line x1="244" y1="176" x2="276" y2="176" stroke="#334155" stroke-width="1.5" marker-end="url(#ps2)"/>

  <rect x="280" y="132" width="200" height="88" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="380" y="168" text-anchor="middle" font-size="12.5" fill="#7c2d12">bundle 所有权</text>
  <text x="380" y="194" text-anchor="middle" font-size="12" fill="#9a3412">租约超时释放</text>
  <line x1="484" y1="176" x2="516" y2="176" stroke="#334155" stroke-width="1.5" marker-end="url(#ps2)"/>

  <rect x="520" y="132" width="200" height="88" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="620" y="168" text-anchor="middle" font-size="12.5" fill="#1e3a8a">其他 Broker</text>
  <text x="620" y="194" text-anchor="middle" font-size="12" fill="#1d4ed8">抢到所有权</text>
  <line x1="724" y1="176" x2="756" y2="176" stroke="#334155" stroke-width="1.5" marker-end="url(#ps2)"/>

  <rect x="760" y="132" width="200" height="88" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="860" y="168" text-anchor="middle" font-size="12.5" fill="#14532d">读同一段 Ledger</text>
  <text x="860" y="194" text-anchor="middle" font-size="12" fill="#166534">继续服务，零拷贝</text>

  <rect x="20" y="300" width="960" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="326" font-size="14" font-weight="bold" fill="#0f172a">② 加 Broker：负载均衡器迁 bundle，没有副本重分配、没有数据拷贝</text>

  <rect x="60" y="352" width="220" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="170" y="382" text-anchor="middle" font-size="12.5" fill="#1e3a8a">新 Broker 加入</text>
  <text x="170" y="406" text-anchor="middle" font-size="12" fill="#1d4ed8">注册到元数据存储</text>
  <line x1="284" y1="390" x2="316" y2="390" stroke="#334155" stroke-width="1.5" marker-end="url(#ps2)"/>

  <rect x="340" y="352" width="320" height="76" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="382" text-anchor="middle" font-size="12.5" fill="#7c2d12">负载均衡器把部分 bundle 迁过去</text>
  <text x="500" y="406" text-anchor="middle" font-size="12" fill="#9a3412">只移交所有权，不搬数据</text>
  <line x1="664" y1="390" x2="696" y2="390" stroke="#334155" stroke-width="1.5" marker-end="url(#ps2)"/>

  <rect x="720" y="352" width="240" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="840" y="382" text-anchor="middle" font-size="12.5" fill="#14532d">客户端连接跟随重定向</text>
  <text x="840" y="406" text-anchor="middle" font-size="12" fill="#166534">读取完全不受影响</text>

  <line x1="20" y1="478" x2="980" y2="478" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="504" font-size="13" fill="#0f172a">⭐ 这就是 Pulsar 宣传「弹性扩缩容」的技术底座：迁的是 bundle 所有权，不是数据。</text>
  <text x="20" y="530" font-size="13" fill="#0f172a">⚠️ bundle 是所有权与负载均衡的最小单位；topic 太多会让单个 bundle 过载，触发 split-bundle。</text>
  <text x="20" y="556" font-size="13" fill="#0f172a">⚠️ 组件多的账要算清：Broker、Bookie、元数据三类组件的参数与故障域互相牵连。</text>
  <text x="20" y="582" font-size="12" fill="#64748b">Kafka 的 kafka-reassign-partitions 那套搬数据流程，在 Pulsar 里不存在。</text>
</svg>
