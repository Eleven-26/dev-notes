<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ps1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Pulsar 存算分离：数据跟着 BookKeeper 走，Broker 只是临时工</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">Broker 无状态、不存数据；消息全部落在 Apache BookKeeper</text>

  <rect x="380" y="90" width="240" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Producer / Consumer / Reader</text>
  <line x1="500" y1="146" x2="500" y2="166" stroke="#334155" stroke-width="1.5" marker-end="url(#ps1)"/>

  <rect x="180" y="170" width="640" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="196" y="190" font-size="13" font-weight="bold" fill="#0f172a">Broker 集群（无状态，可横向扩缩）</text>

  <rect x="200" y="206" width="190" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="295" y="228" text-anchor="middle" font-size="12.5" fill="#1e3a8a">Broker</text>
  <text x="295" y="248" text-anchor="middle" font-size="11" fill="#1d4ed8">持有若干 bundle 所有权</text>
  <rect x="405" y="206" width="190" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="500" y="228" text-anchor="middle" font-size="12.5" fill="#1e3a8a">Broker</text>
  <text x="500" y="248" text-anchor="middle" font-size="11" fill="#1d4ed8">协议 / 路由 / 订阅分发</text>
  <rect x="610" y="206" width="190" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="705" y="228" text-anchor="middle" font-size="12.5" fill="#1e3a8a">Broker</text>
  <text x="705" y="248" text-anchor="middle" font-size="11" fill="#1d4ed8">自己不留数据</text>

  <line x1="295" y1="278" x2="295" y2="296" stroke="#334155" stroke-width="1.5" marker-end="url(#ps1)"/>
  <line x1="500" y1="278" x2="500" y2="296" stroke="#334155" stroke-width="1.5" marker-end="url(#ps1)"/>
  <line x1="705" y1="278" x2="705" y2="296" stroke="#334155" stroke-width="1.5" marker-end="url(#ps1)"/>

  <rect x="180" y="302" width="640" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="196" y="324" font-size="13" font-weight="bold" fill="#0f172a">BookKeeper ensemble：E=3 / W=2 / Q=2</text>

  <rect x="200" y="342" width="190" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="295" y="364" text-anchor="middle" font-size="12.5" fill="#14532d">Bookie</text>
  <text x="295" y="384" text-anchor="middle" font-size="11" fill="#166534">journal + ledgers</text>
  <rect x="405" y="342" width="190" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="500" y="364" text-anchor="middle" font-size="12.5" fill="#14532d">Bookie</text>
  <text x="500" y="384" text-anchor="middle" font-size="11" fill="#166534">Ledger 只追加日志</text>
  <rect x="610" y="342" width="190" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="705" y="364" text-anchor="middle" font-size="12.5" fill="#14532d">Bookie</text>
  <text x="705" y="384" text-anchor="middle" font-size="11" fill="#166534">写 2 成功即确认</text>

  <rect x="850" y="302" width="130" height="110" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="915" y="350" text-anchor="middle" font-size="12.5" fill="#0f172a">元数据存储</text>
  <text x="915" y="374" text-anchor="middle" font-size="12" fill="#475569">ZooKeeper</text>

  <line x1="20" y1="436" x2="980" y2="436" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="462" font-size="13" fill="#0f172a">⭐ 数据全在 BookKeeper，Broker 不留数据：Broker 挂了，别的 Broker 抢到所有权即可继续服务。</text>
  <text x="20" y="488" font-size="13" fill="#0f172a">⭐ 写路径：E 个 bookie 并行写、W 个写成功、Q 个 ack 即返回成功（默认 3 / 2 / 2）。</text>
  <text x="20" y="514" font-size="13" fill="#0f172a">⭐ 扩容只迁 bundle 所有权，没有副本重分配、没有数据拷贝（Kafka 的搬数据流程这里不存在）。</text>
  <text x="20" y="540" font-size="13" fill="#0f172a">⚠️ 代价：组件最多（Broker + Bookie + 元数据），写路径多一跳跨节点确认，吞吐通常低于 Kafka。</text>
  <text x="20" y="570" font-size="12" fill="#64748b">Topic = persistent://（写 BookKeeper）或 non-persistent://（只在 Broker 内存，不持久化）。</text>
</svg>
