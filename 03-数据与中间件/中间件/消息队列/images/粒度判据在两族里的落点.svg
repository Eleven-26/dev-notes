<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一条拆合判据，在两族六款里的动作完全不同</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">判据跨产品通用，但「拆」和「合」要落到各自的对象上，否则会把分类误做成并行</text>

  <rect x="40" y="80" width="920" height="58" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="56" y="103" font-size="11.5" fill="#4338ca">跨产品通用判据（两问，与「事件类型多不多」无关）</text>
  <text x="56" y="126" font-size="13.5" font-weight="bold" fill="#312e81">问一：两个消费方处理的是同一份代码吗？　问二：两者的单条耗时差一个数量级吗？</text>

  <line x1="300" y1="138" x2="300" y2="168" stroke="#4f46e5" stroke-width="1.5"/>
  <line x1="700" y1="138" x2="700" y2="168" stroke="#4f46e5" stroke-width="1.5"/>

  <rect x="40" y="168" width="460" height="38" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.4"/>
  <text x="270" y="193" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">任一问答「否」→ 拆</text>
  <rect x="500" y="168" width="460" height="38" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="730" y="193" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">两问都答「是」→ 合</text>

  <rect x="40" y="220" width="460" height="24" rx="4" fill="#ffedd5"/>
  <text x="52" y="237" font-size="11.5" font-weight="bold" fill="#9a3412">族 A · 独占队列：拆就是多一份存储</text>
  <rect x="40" y="248" width="460" height="34" rx="5" fill="#fffbf5" stroke="#fdba74" stroke-width="1.1"/>
  <text x="52" y="270" font-size="12" fill="#0f172a">RabbitMQ：新队列 <tspan font-weight="bold" fill="#b91c1c">q.事件.下游名</tspan>，各自独立存储与死信</text>
  <rect x="40" y="286" width="460" height="34" rx="5" fill="#fffbf5" stroke="#fdba74" stroke-width="1.1"/>
  <text x="52" y="308" font-size="12" fill="#0f172a">ActiveMQ：Queue 域建新队列 / Topic 域建新持久订阅</text>

  <rect x="40" y="332" width="460" height="24" rx="4" fill="#dbeafe"/>
  <text x="52" y="349" font-size="11.5" font-weight="bold" fill="#1e3a8a">族 B · 共享日志：拆只是多一套位点</text>
  <rect x="40" y="360" width="460" height="34" rx="5" fill="#f8fbff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="52" y="382" font-size="12" fill="#0f172a">Kafka / RocketMQ：新消费组，<tspan font-weight="bold" fill="#b91c1c">不是新 Topic</tspan></text>
  <rect x="40" y="398" width="460" height="34" rx="5" fill="#f8fbff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="52" y="420" font-size="12" fill="#0f172a">Pulsar：新订阅（subscription）；NATS JS：新 Consumer</text>

  <rect x="500" y="220" width="460" height="24" rx="4" fill="#ffedd5"/>
  <text x="512" y="237" font-size="11.5" font-weight="bold" fill="#9a3412">族 A · 独占队列：合就是同队列抢</text>
  <rect x="500" y="248" width="460" height="34" rx="5" fill="#fffbf5" stroke="#fdba74" stroke-width="1.1"/>
  <text x="512" y="270" font-size="12" fill="#0f172a">RabbitMQ / ActiveMQ：同队列挂多个消费者竞争消费</text>
  <rect x="500" y="286" width="460" height="34" rx="5" fill="#fffbf5" stroke="#fdba74" stroke-width="1.1"/>
  <text x="512" y="308" font-size="12" fill="#0f172a">速率档靠 prefetch 控；保序靠 JMSXGroupID（ActiveMQ）</text>

  <rect x="500" y="332" width="460" height="24" rx="4" fill="#dbeafe"/>
  <text x="512" y="349" font-size="11.5" font-weight="bold" fill="#1e3a8a">族 B · 共享日志：合就是同组内分摊</text>
  <rect x="500" y="360" width="460" height="34" rx="5" fill="#f8fbff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="512" y="382" font-size="12" fill="#0f172a">Kafka 加分区 / RocketMQ 加队列（都不可逆或需扩）</text>
  <rect x="500" y="398" width="460" height="34" rx="5" fill="#f8fbff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="512" y="420" font-size="12" fill="#0f172a">Pulsar 加分区或 Shared 多消费者；NATS 加队列组成员</text>

  <rect x="40" y="448" width="920" height="112" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="56" y="472" font-size="12.5" font-weight="bold" fill="#0f172a">三个最常见的错，正好是「族 A 的动作」被套到「族 B」上</text>
  <text x="56" y="496" font-size="12" fill="#b91c1c">错一：Kafka / RocketMQ 里为每个下游建新 Topic —— 同一份数据被复制 N 份。</text>
  <text x="56" y="518" font-size="12" fill="#b91c1c">错二：ActiveMQ 里以为「多建队列就能加并行」—— 单队列没有分区，队列数不加并行度。</text>
  <text x="56" y="540" font-size="12" fill="#b91c1c">错三：Pulsar 里先给每个下游加分区 —— 订阅本来就是独立的，只有并行度不够才要加分区。</text>

  <rect x="40" y="574" width="920" height="76" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="56" y="598" font-size="12.5" font-weight="bold" fill="#15803d">反过来读也成立：族 A 的「拆」不会放大数据，族 B 的「拆」不会改变并行度</text>
  <text x="56" y="620" font-size="11.5" fill="#334155">族 A 拆一条队列 = 多一份存储，缺的是「多个下游各算一遍」时的复用；族 B 拆一个消费组 = 数据仍一份，但要加并行只能动分区数。</text>
  <text x="56" y="640" font-size="11.5" fill="#334155">所以「拆」在哪一族发生，决定了你付的是存储账还是分区账 —— 这两本账的量级差三个数量级，见第三节实测。</text>

  <text x="40" y="678" font-size="11" fill="#64748B">判据来源：本仓 RabbitMQ 队列数、Kafka 分区数、ActiveMQ 队列数、NATS Stream/Consumer、Pulsar 分区与订阅代价实测，见正文第三、四节</text>
</svg>
