<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">削峰填谷：请求先写 MQ 缓冲，后端按自身能力匀速消费</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">峰值被「摊平」成一条平直线 —— 后端不必为瞬时峰值扩容，低峰期也不再闲置</text>

  <rect x="20" y="76" width="960" height="272" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="70" y1="330" x2="965" y2="330" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="70" y1="100" x2="70" y2="330" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="42" y="215" font-size="11.5" fill="#64748b" transform="rotate(-90 42 215)" text-anchor="middle">请求速率</text>
  <text x="960" y="348" text-anchor="end" font-size="11.5" fill="#64748b">时间 →</text>

  <polygon points="239,250 258,150 282,118 306,190 319,250" fill="#ffedd5"/>
  <polyline points="70,330 110,328 150,329 190,327 215,325 235,270 258,150 282,118 306,190 330,300 355,327 400,329 450,328 500,330 560,329 620,328 680,329 740,330 800,328 860,329 920,330 960,329" fill="none" stroke="#dc2626" stroke-width="2"/>
  <line x1="70" y1="250" x2="960" y2="250" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5"/>

  <text x="96" y="304" font-size="11.5" fill="#b91c1c">上游请求速率（带峰值）</text>
  <text x="580" y="242" font-size="11.5" fill="#15803d">后端消费速率（按自己的能力匀速取）</text>
  <text x="279" y="222" text-anchor="middle" font-size="11" fill="#7c2d12">队列缓冲</text>

  <text x="20" y="376" font-size="12.5" fill="#0f172a">⚠️ 队列深度要设上限：缓冲不是免费的 —— 堆积超过磁盘与保留期后，Broker 会拒绝写入，反而拖垮上游。</text>
  <text x="20" y="402" font-size="12.5" fill="#0f172a">⭐ 另一条路是「为峰值直接扩容」：吞吐立刻上去了，代价是低峰期服务器相对较闲、成本常驻。</text>
</svg>
