<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Kafka 分区与副本：1 Leader + N Follower，分散到不同 Broker</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">Topic 拆成多个 Partition（并行单位）；每分区 1个 Leader 读写、其余 Follower 只拉取同步</text>

  <rect x="40" y="96" width="240" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="160" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Broker 1</text>
  <rect x="380" y="96" width="240" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Broker 2</text>
  <rect x="720" y="96" width="240" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="840" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Broker 3</text>

  <rect x="40" y="162" width="240" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="160" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">分区 0 · Leader</text>
  <text x="160" y="206" text-anchor="middle" font-size="11.5" fill="#166534">读写 · 对外服务</text>
  <rect x="380" y="162" width="240" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="500" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">分区 0 · Follower</text>
  <text x="500" y="206" text-anchor="middle" font-size="11.5" fill="#64748b">只拉取同步</text>
  <rect x="720" y="162" width="240" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="840" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">分区 0 · Follower</text>
  <text x="840" y="206" text-anchor="middle" font-size="11.5" fill="#64748b">只拉取同步</text>

  <rect x="40" y="232" width="240" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="160" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">分区 1 · Follower</text>
  <text x="160" y="276" text-anchor="middle" font-size="11.5" fill="#64748b">只拉取同步</text>
  <rect x="380" y="232" width="240" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="500" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">分区 1 · Leader</text>
  <text x="500" y="276" text-anchor="middle" font-size="11.5" fill="#166534">读写 · 对外服务</text>
  <rect x="720" y="232" width="240" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="840" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">分区 1 · Follower</text>
  <text x="840" y="276" text-anchor="middle" font-size="11.5" fill="#64748b">只拉取同步</text>

  <rect x="40" y="302" width="240" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="160" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">分区 2 · Follower</text>
  <text x="160" y="346" text-anchor="middle" font-size="11.5" fill="#64748b">只拉取同步</text>
  <rect x="380" y="302" width="240" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="500" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">分区 2 · Follower</text>
  <text x="500" y="346" text-anchor="middle" font-size="11.5" fill="#64748b">只拉取同步</text>
  <rect x="720" y="302" width="240" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="840" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">分区 2 · Leader</text>
  <text x="840" y="346" text-anchor="middle" font-size="11.5" fill="#166534">读写 · 对外服务</text>

  <line x1="20" y1="382" x2="980" y2="382" stroke="#cbd5e1" stroke-width="1"/>

  <text x="20" y="408" font-size="13" fill="#0f172a">⭐ ISR：与 Leader 保持同步的副本集合（含 Leader 自身）；acks=all 的「all」指的就是 ISR。</text>
  <text x="20" y="434" font-size="13" fill="#0f172a">⚠️ 必须配 min.insync.replicas ≥ 2：否则 ISR 只剩 Leader 时「all」形同 acks=1，宕机照样丢。</text>
  <text x="20" y="460" font-size="13" fill="#0f172a">⭐ 单机宕机只丢该机上的 Leader：Controller 从 ISR 中选新 Leader，其余副本不受影响。</text>
  <text x="20" y="486" font-size="13" fill="#0f172a">⚠️ 分区数只能增不能减：扩容后 hash(key) % 分区数 的映射会变，同 key 顺序性被破坏。</text>
  <text x="20" y="520" font-size="12" fill="#64748b">分区是多机并行的基本单位：加 Broker 分摊分区、加分区提并行度，吞吐随两者线性扩展。</text>
</svg>
