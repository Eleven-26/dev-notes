<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">三种 MQ 的粒度两级结构：分类容器与并行单位分别落在哪个对象上</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">判据相同、落点不同 —— 同一条「该拆该合」换到 RabbitMQ 就不能直译</text>

  <text x="190" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">RabbitMQ</text>
  <text x="500" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Kafka</text>
  <text x="810" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">RocketMQ</text>

  <rect x="40" y="108" width="300" height="72" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="190" y="130" text-anchor="middle" font-size="11" fill="#9a3412">分类容器</text>
  <text x="190" y="154" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c2d12">Exchange + routing key</text>
  <text x="190" y="172" text-anchor="middle" font-size="11" fill="#c2410c">binding 决定消息去向</text>

  <rect x="350" y="108" width="300" height="72" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="130" text-anchor="middle" font-size="11" fill="#1e40af">分类容器</text>
  <text x="500" y="154" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">Topic</text>
  <text x="500" y="172" text-anchor="middle" font-size="11" fill="#1d4ed8">分区是它的子单位</text>

  <rect x="660" y="108" width="300" height="72" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="810" y="130" text-anchor="middle" font-size="11" fill="#166534">分类容器</text>
  <text x="810" y="154" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">Topic + Tag</text>
  <text x="810" y="172" text-anchor="middle" font-size="11" fill="#15803d">Tag 是二级过滤属性</text>

  <line x1="190" y1="180" x2="190" y2="200" stroke="#9a3412" stroke-width="1.5"/>
  <polygon points="186,198 194,198 190,206" fill="#9a3412"/>
  <line x1="500" y1="180" x2="500" y2="200" stroke="#1e3a8a" stroke-width="1.5"/>
  <polygon points="496,198 504,198 500,206" fill="#1e3a8a"/>
  <line x1="810" y1="180" x2="810" y2="200" stroke="#14532d" stroke-width="1.5"/>
  <polygon points="806,198 814,198 810,206" fill="#14532d"/>

  <rect x="40" y="208" width="300" height="72" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="190" y="230" text-anchor="middle" font-size="11" fill="#9a3412">并行单位（消息独占）</text>
  <text x="190" y="254" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c2d12">Queue</text>
  <text x="190" y="272" text-anchor="middle" font-size="11" fill="#c2410c">一条消息只进一条队列</text>

  <rect x="350" y="208" width="300" height="72" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="230" text-anchor="middle" font-size="11" fill="#1e40af">并行单位（日志共享）</text>
  <text x="500" y="254" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">Partition</text>
  <text x="500" y="272" text-anchor="middle" font-size="11" fill="#1d4ed8">副本数是一个正交旋钮</text>

  <rect x="660" y="208" width="300" height="72" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="810" y="230" text-anchor="middle" font-size="11" fill="#166534">并行单位（日志共享）</text>
  <text x="810" y="254" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">MessageQueue</text>
  <text x="810" y="272" text-anchor="middle" font-size="11" fill="#15803d">正文统一落 CommitLog</text>

  <line x1="190" y1="280" x2="190" y2="300" stroke="#9a3412" stroke-width="1.5"/>
  <polygon points="186,298 194,298 190,306" fill="#9a3412"/>
  <line x1="500" y1="280" x2="500" y2="300" stroke="#1e3a8a" stroke-width="1.5"/>
  <polygon points="496,298 504,298 500,306" fill="#1e3a8a"/>
  <line x1="810" y1="280" x2="810" y2="300" stroke="#14532d" stroke-width="1.5"/>
  <polygon points="806,298 814,298 810,306" fill="#14532d"/>

  <rect x="40" y="308" width="300" height="72" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="190" y="330" text-anchor="middle" font-size="11" fill="#475569">消费进度记在哪</text>
  <text x="190" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">队列内 ack（无位点）</text>
  <text x="190" y="372" text-anchor="middle" font-size="11" fill="#64748B">ack 即删，不能回溯</text>

  <rect x="350" y="308" width="300" height="72" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="500" y="330" text-anchor="middle" font-size="11" fill="#475569">消费进度记在哪</text>
  <text x="500" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">消费组在分区上的 offset</text>
  <text x="500" y="372" text-anchor="middle" font-size="11" fill="#64748B">可重置，能回溯</text>

  <rect x="660" y="308" width="300" height="72" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="810" y="330" text-anchor="middle" font-size="11" fill="#475569">消费进度记在哪</text>
  <text x="810" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">消费组在队列上的 offset</text>
  <text x="810" y="372" text-anchor="middle" font-size="11" fill="#64748B">可重置，能回溯</text>

  <text x="190" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">多一个消费方 = 多一条队列 + 一份存储</text>
  <text x="500" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">多一个消费方 = 多记一套位点，0 存储</text>
  <text x="810" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">多一个消费方 = 多记一套位点，0 存储</text>

  <rect x="40" y="426" width="920" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="60" y="452" font-size="12.5" font-weight="bold" fill="#0f172a">三条结论：从这张图直接读出的粒度判据</text>
  <text x="60" y="478" font-size="12" fill="#334155">1. 只有 RabbitMQ 的「多一个消费方」改变存储布局：队列独占消息、ack 即删，两个下游只能复制成两条队列。</text>
  <text x="60" y="502" font-size="12" fill="#334155">2. Kafka / RocketMQ 的日志是共享的：多一个消费组只是多记一套位点，数据仍只有一份，所以「拆」的是消费组。</text>
  <text x="60" y="526" font-size="12" fill="#334155">3. 分类与并行是否同一对象，决定「加并行」的手段：RabbitMQ 拆队列、Kafka 加分区、RocketMQ 加队列。</text>
  <text x="60" y="552" font-size="11.5" fill="#b91c1c">注意：Kafka 里为每个下游建一个新 Topic 会把数据复制 N 份，与 RabbitMQ「每下游一条队列」正好相反。</text>

  <text x="40" y="608" font-size="11.5" fill="#64748B">读数来源：rabbitmq:4-management 4.3.6 单机 与 apache/kafka:3.9.0 单节点，见正文第一、三节</text>
</svg>
