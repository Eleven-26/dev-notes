<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="mq03" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">强耦合：上游直连下游多个系统</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">N 个下游 = N 份对接代码 + N 次联调排期，任一变更都牵一发动全身</text>

  <rect x="20" y="78" width="960" height="286" rx="10" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.4"/>

  <rect x="400" y="98" width="200" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="500" y="134" text-anchor="middle" font-size="13" fill="#1e3a8a">订单服务（上游）</text>

  <line x1="500" y1="160" x2="135" y2="286" stroke="#334155" stroke-width="1.4" marker-end="url(#mq03)"/>
  <line x1="500" y1="160" x2="365" y2="286" stroke="#334155" stroke-width="1.4" marker-end="url(#mq03)"/>
  <line x1="500" y1="160" x2="595" y2="286" stroke="#334155" stroke-width="1.4" marker-end="url(#mq03)"/>
  <line x1="500" y1="160" x2="825" y2="286" stroke="#334155" stroke-width="1.4" marker-end="url(#mq03)"/>

  <rect x="322" y="200" width="356" height="30" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="500" y="220" text-anchor="middle" font-size="11.5" fill="#b91c1c">每一条边都是一套：接口 / 超时 / 重试 / 序列化</text>

  <rect x="40" y="290" width="190" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="135" y="326" text-anchor="middle" font-size="12.5" fill="#14532d">库存服务</text>
  <rect x="270" y="290" width="190" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="365" y="326" text-anchor="middle" font-size="12.5" fill="#14532d">积分服务</text>
  <rect x="500" y="290" width="190" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="595" y="326" text-anchor="middle" font-size="12.5" fill="#14532d">物流服务</text>
  <rect x="730" y="290" width="190" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="825" y="326" text-anchor="middle" font-size="12.5" fill="#14532d">通知服务</text>

  <text x="20" y="392" font-size="12.5" fill="#0f172a">⚠️ 后果一：下游只要有一个没排上期，整条链路都推不动；上线往往要「一起上」。</text>
  <text x="20" y="418" font-size="12.5" fill="#0f172a">⚠️ 后果二：上游还持有 N 份下游地址，下游迁移 / 降级 / 改名都要回过头来改上游。</text>
</svg>
