<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 615" width="1000" height="615" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="615" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">常见消息队列一览：六款产品的定位速览</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">定位与「最强项 / 最弱项」取自正文表格；吞吐与延迟为量级口径，不构成性能排名</text>

  <rect x="30" y="88" width="306" height="216" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="31" y="89" width="304" height="34" rx="9" fill="#e2e8f0"/>
  <text x="44" y="112" font-size="15" font-weight="bold" fill="#0f172a">Kafka</text>
  <text x="44" y="148" font-size="12.5" fill="#0f172a">分布式提交日志</text>
  <text x="44" y="172" font-size="11.5" fill="#475569">吞吐：十万~百万级 msg/s</text>
  <text x="44" y="194" font-size="11.5" fill="#475569">延迟：毫秒级</text>
  <line x1="44" y1="208" x2="322" y2="208" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="232" font-size="11.5" fill="#15803d">✅ offset 任意回溯（保留期内）</text>
  <text x="44" y="258" font-size="11.5" fill="#b91c1c">⚠️ 无原生延迟 / 事务消息，路由弱</text>

  <rect x="350" y="88" width="306" height="216" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="351" y="89" width="304" height="34" rx="9" fill="#e2e8f0"/>
  <text x="364" y="112" font-size="15" font-weight="bold" fill="#0f172a">RabbitMQ</text>
  <text x="364" y="148" font-size="12.5" fill="#0f172a">AMQP 业务消息 broker</text>
  <text x="364" y="172" font-size="11.5" fill="#475569">吞吐：万级~十万级 msg/s</text>
  <text x="364" y="194" font-size="11.5" fill="#475569">延迟：微秒~毫秒级（低）</text>
  <line x1="364" y1="208" x2="642" y2="208" stroke="#e2e8f0" stroke-width="1"/>
  <text x="364" y="232" font-size="11.5" fill="#15803d">✅ 路由模型最灵活、运维最轻</text>
  <text x="364" y="258" font-size="11.5" fill="#b91c1c">⚠️ 单机吞吐与集群规模上限低</text>

  <rect x="670" y="88" width="306" height="216" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="671" y="89" width="304" height="34" rx="9" fill="#e2e8f0"/>
  <text x="684" y="112" font-size="15" font-weight="bold" fill="#0f172a">RocketMQ</text>
  <text x="684" y="148" font-size="12.5" fill="#0f172a">业务消息全家桶</text>
  <text x="684" y="172" font-size="11.5" fill="#475569">吞吐：十万级 msg/s</text>
  <text x="684" y="194" font-size="11.5" fill="#475569">延迟：毫秒级</text>
  <line x1="684" y1="208" x2="962" y2="208" stroke="#e2e8f0" stroke-width="1"/>
  <text x="684" y="232" font-size="11.5" fill="#15803d">✅ 事务 / 延迟 / 顺序 / 堆积治理</text>
  <text x="684" y="258" font-size="11.5" fill="#b91c1c">⚠️ Go 客户端滞后，生态偏 Java</text>

  <rect x="30" y="316" width="306" height="216" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="31" y="317" width="304" height="34" rx="9" fill="#e2e8f0"/>
  <text x="44" y="340" font-size="15" font-weight="bold" fill="#0f172a">Pulsar</text>
  <text x="44" y="376" font-size="12.5" fill="#0f172a">云原生消息与流平台</text>
  <text x="44" y="400" font-size="11.5" fill="#475569">吞吐：十万级+ msg/s（可扩）</text>
  <text x="44" y="422" font-size="11.5" fill="#475569">延迟：毫秒级（写路径多一跳）</text>
  <line x1="44" y1="436" x2="322" y2="436" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="460" font-size="11.5" fill="#15803d">✅ 存算分离、多租户、任意回溯</text>
  <text x="44" y="486" font-size="11.5" fill="#b91c1c">⚠️ 组件最多、运维最重</text>

  <rect x="350" y="316" width="306" height="216" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="351" y="317" width="304" height="34" rx="9" fill="#e2e8f0"/>
  <text x="364" y="340" font-size="15" font-weight="bold" fill="#0f172a">NATS</text>
  <text x="364" y="376" font-size="12.5" fill="#0f172a">云原生进程间通信总线</text>
  <text x="364" y="400" font-size="11.5" fill="#475569">吞吐：十万级 msg/s（Core 最快）</text>
  <text x="364" y="422" font-size="11.5" fill="#475569">延迟：微秒级（六者最低）</text>
  <line x1="364" y1="436" x2="642" y2="436" stroke="#e2e8f0" stroke-width="1"/>
  <text x="364" y="460" font-size="11.5" fill="#15803d">✅ 单二进制、部署极简、gossip</text>
  <text x="364" y="486" font-size="11.5" fill="#b91c1c">⚠️ Core 不持久化，靠 JetStream</text>

  <rect x="670" y="316" width="306" height="216" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="671" y="317" width="304" height="34" rx="9" fill="#e2e8f0"/>
  <text x="684" y="340" font-size="15" font-weight="bold" fill="#0f172a">ActiveMQ</text>
  <text x="684" y="376" font-size="12.5" fill="#0f172a">JMS 参考实现 + 协议瑞士军刀</text>
  <text x="684" y="400" font-size="11.5" fill="#475569">吞吐：万级~十万级 msg/s</text>
  <text x="684" y="422" font-size="11.5" fill="#475569">延迟：毫秒级（大消息抖动）</text>
  <line x1="684" y1="436" x2="962" y2="436" stroke="#e2e8f0" stroke-width="1"/>
  <text x="684" y="460" font-size="11.5" fill="#15803d">✅ 协议最全、Spring JMS 默认</text>
  <text x="684" y="486" font-size="11.5" fill="#b91c1c">⚠️ 单队列不可拆分、无回放</text>

  <text x="20" y="566" font-size="12.5" fill="#0f172a">⭐ 选型先问「投递语义与顺序要求」，再看吞吐与运维成本；把延迟 / 事务消息当第一诉求去选，往往就只剩一个选项。</text>
  <text x="20" y="592" font-size="12.5" fill="#0f172a">⚠️ 这里只给量级口径（精确对照见正文第三节的表）；客户端成熟度见「契合语言与团队栈怎么选」。</text>
</svg>
