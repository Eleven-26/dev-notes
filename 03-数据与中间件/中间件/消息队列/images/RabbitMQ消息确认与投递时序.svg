<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="rb3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="rb4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">RabbitMQ 消息不丢的三段链路：Confirm → 持久化 → 手动 ack</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">生产、存储、消费三段必须同时管住，任何一段缺失都会丢</text>

  <rect x="60" y="88" width="160" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="140" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">生产者 Producer</text>
  <rect x="360" y="88" width="280" height="44" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="500" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Broker（Exchange + Queue）</text>
  <rect x="720" y="88" width="160" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="800" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">消费者 Consumer</text>

  <line x1="140" y1="132" x2="140" y2="460" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="500" y1="132" x2="500" y2="460" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="800" y1="132" x2="800" y2="460" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>

  <text x="320" y="162" text-anchor="middle" font-size="13" fill="#0f172a">basicPublish：持久化 delivery_mode=2 + routingKey 路由</text>
  <line x1="144" y1="170" x2="494" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#rb3)"/>

  <text x="320" y="204" text-anchor="middle" font-size="13" fill="#64748b">Publisher Confirm：basic.ack / basic.nack（异步回执）</text>
  <line x1="494" y1="212" x2="146" y2="212" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#rb3)"/>

  <text x="650" y="250" text-anchor="middle" font-size="13" fill="#0f172a">推送消息（prefetch 限制每个消费者未 ack 上限）</text>
  <line x1="504" y1="258" x2="794" y2="258" stroke="#334155" stroke-width="1.5" marker-end="url(#rb3)"/>

  <text x="812" y="300" font-size="12.5" fill="#15803d">① 先处理业务（含幂等校验）</text>

  <text x="650" y="328" text-anchor="middle" font-size="13" fill="#0f172a">② basicAck(deliveryTag)：确认消费成功</text>
  <line x1="796" y1="336" x2="506" y2="336" stroke="#334155" stroke-width="1.5" marker-end="url(#rb3)"/>

  <text x="512" y="378" font-size="12.5" fill="#ea580c">③ 消息从队列删除</text>

  <text x="650" y="410" text-anchor="middle" font-size="13" fill="#b91c1c">失败：basicNack(requeue=false) → 进死信 DLX</text>
  <line x1="796" y1="418" x2="506" y2="418" stroke="#dc2626" stroke-width="1.5" marker-end="url(#rb4)"/>

  <line x1="20" y1="486" x2="980" y2="486" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="512" font-size="13" fill="#0f172a">⭐ 生产端：Publisher Confirm（异步确认 + 失败重发）优于 AMQP 事务（txCommit 每条约同步等待）。</text>
  <text x="20" y="538" font-size="13" fill="#0f172a">⭐ Broker 端：队列 durable + 消息 delivery_mode=2 + Quorum 队列（Raft 多数派确认）缺一不可。</text>
  <text x="20" y="564" font-size="13" fill="#0f172a">⭐ 消费端：autoAck=false，先处理业务再手动 ack；失败用 basicNack(requeue=false) 进死信。</text>
  <text x="20" y="590" font-size="13" fill="#0f172a">⚠️ 不设 prefetch 时 Broker 会一次性把队列消息全推给消费者，内存瞬间被打爆。</text>
  <text x="20" y="622" font-size="12" fill="#64748b">⚠️ Channel 不是线程安全的：多线程要么各自建 Channel，要么加锁，不要跨线程共用。</text>
</svg>
