<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 512" width="1000" height="512" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="mq05" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="512" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">异步处理：同步链路等耗时任务完成 vs 异步链路先返回</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">把「可以晚一点做」的事挪出主链路，用户侧等待的只剩业务本身</text>

  <rect x="20" y="76" width="960" height="162" rx="10" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="36" y="102" font-size="14" font-weight="bold" fill="#0f172a">① 同步链路：耗时任务堵在主链路上</text>

  <rect x="40" y="118" width="110" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="95" y="154" text-anchor="middle" font-size="12.5" fill="#1e3a8a">用户</text>
  <line x1="154" y1="148" x2="178" y2="148" stroke="#334155" stroke-width="1.5" marker-end="url(#mq05)"/>
  <rect x="182" y="118" width="130" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="247" y="154" text-anchor="middle" font-size="12.5" fill="#1e3a8a">API</text>
  <line x1="316" y1="148" x2="340" y2="148" stroke="#334155" stroke-width="1.5" marker-end="url(#mq05)"/>
  <rect x="344" y="118" width="290" height="60" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="489" y="146" text-anchor="middle" font-size="12.5" fill="#7c2d12">耗时任务（阻塞执行）</text>
  <text x="489" y="166" text-anchor="middle" font-size="11.5" fill="#7c2d12">发短信 / 生成报表 / 图片处理</text>
  <line x1="638" y1="148" x2="662" y2="148" stroke="#334155" stroke-width="1.5" marker-end="url(#mq05)"/>
  <rect x="666" y="118" width="140" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="736" y="154" text-anchor="middle" font-size="12.5" fill="#14532d">返回响应</text>

  <line x1="182" y1="196" x2="806" y2="196" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="494" y="216" text-anchor="middle" font-size="11.5" fill="#b91c1c">⚠️ 这一段用户全程在等：总耗时 = 业务耗时 + 耗时任务耗时</text>

  <rect x="20" y="254" width="960" height="182" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="280" font-size="14" font-weight="bold" fill="#0f172a">② 异步链路：只把消息交给 MQ 就返回，耗时任务后台做</text>

  <rect x="40" y="296" width="110" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="95" y="328" text-anchor="middle" font-size="12.5" fill="#1e3a8a">用户</text>
  <line x1="154" y1="323" x2="178" y2="323" stroke="#334155" stroke-width="1.5" marker-end="url(#mq05)"/>
  <rect x="182" y="296" width="180" height="54" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="272" y="328" text-anchor="middle" font-size="12.5" fill="#7c2d12">写入 MQ（入队）</text>
  <line x1="366" y1="323" x2="390" y2="323" stroke="#334155" stroke-width="1.5" marker-end="url(#mq05)"/>
  <rect x="394" y="296" width="170" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="479" y="328" text-anchor="middle" font-size="12.5" fill="#14532d">立即返回响应</text>
  <text x="588" y="328" font-size="11.5" fill="#15803d">⭐ 用户只等「入队」这一步</text>

  <line x1="36" y1="364" x2="964" y2="364" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>

  <rect x="182" y="378" width="180" height="50" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="272" y="408" text-anchor="middle" font-size="12.5" fill="#334155">MQ 消费者</text>
  <line x1="366" y1="403" x2="390" y2="403" stroke="#334155" stroke-width="1.5" marker-end="url(#mq05)"/>
  <rect x="394" y="378" width="290" height="50" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="539" y="408" text-anchor="middle" font-size="12.5" fill="#7c2d12">耗时任务（后台执行，失败可重试）</text>
  <text x="700" y="408" font-size="11.5" fill="#b91c1c">⚠️ 消费端必须幂等</text>

  <text x="20" y="470" font-size="12.5" fill="#0f172a">⭐ 收益：主链路只承受业务耗时，避免用户侧等待超时；耗时任务由后台按自己的能力处理。</text>
  <text x="20" y="496" font-size="12.5" fill="#0f172a">⚠️ 代价：链路变长，必须补上「失败重试 + 死信兜底 + 幂等消费」，否则异步化会把问题藏起来。</text>
</svg>
