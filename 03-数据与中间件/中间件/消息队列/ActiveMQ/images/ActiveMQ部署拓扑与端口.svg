<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ActiveMQ Classic 部署拓扑：一个容器五个连接器，客户端按协议选端口</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">本机 apache/activemq-classic:6.1.4 实测：运行时 TransportConnectors 共 5 个，宿主只映射 61616 / 8161</text>

  <rect x="20" y="85" width="212" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="126" y="110" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">客户端（按协议选端口）</text>

  <rect x="34" y="122" width="184" height="44" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="126" y="149" text-anchor="middle" font-size="12" fill="#1e3a8a">Java（JMS / OpenWire）</text>

  <rect x="34" y="178" width="184" height="44" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="126" y="205" text-anchor="middle" font-size="12" fill="#14532d">Go / 非 JVM（STOMP）</text>

  <rect x="34" y="234" width="184" height="44" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="126" y="261" text-anchor="middle" font-size="12" fill="#14532d">企业集成（AMQP 1.0）</text>

  <rect x="34" y="290" width="184" height="44" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="126" y="317" text-anchor="middle" font-size="12" fill="#14532d">IoT / 移动端（MQTT）</text>

  <rect x="34" y="346" width="184" height="44" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="126" y="373" text-anchor="middle" font-size="12" fill="#14532d">浏览器（WebSocket / ws）</text>

  <rect x="34" y="402" width="184" height="44" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="126" y="429" text-anchor="middle" font-size="12" fill="#7c2d12">运维（Web 控制台 / Jolokia）</text>

  <text x="126" y="482" text-anchor="middle" font-size="11.5" fill="#64748b">前四类走 broker 数据端口</text>
  <text x="126" y="502" text-anchor="middle" font-size="11.5" fill="#64748b">最后一类走管理端口 8161</text>

  <rect x="286" y="85" width="250" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="411" y="110" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">端口（宿主 → 容器）</text>

  <rect x="300" y="122" width="222" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="411" y="144" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">61616</text>
  <text x="411" y="160" text-anchor="middle" font-size="11" fill="#475569">OpenWire（Java 默认）</text>

  <rect x="300" y="178" width="222" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="411" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">61613</text>
  <text x="411" y="216" text-anchor="middle" font-size="11" fill="#475569">STOMP（文本帧）</text>

  <rect x="300" y="234" width="222" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="411" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">5672</text>
  <text x="411" y="272" text-anchor="middle" font-size="11" fill="#475569">AMQP 1.0（不是 0-9-1）</text>

  <rect x="300" y="290" width="222" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="411" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">1883</text>
  <text x="411" y="328" text-anchor="middle" font-size="11" fill="#475569">MQTT</text>

  <rect x="300" y="346" width="222" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="411" y="368" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">61614</text>
  <text x="411" y="384" text-anchor="middle" font-size="11" fill="#475569">ws（浏览器直连）</text>

  <rect x="300" y="402" width="222" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="411" y="424" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">8161</text>
  <text x="411" y="440" text-anchor="middle" font-size="11" fill="#475569">Web 控制台 + Jolokia</text>

  <text x="411" y="482" text-anchor="middle" font-size="11.5" fill="#64748b">每个连接器均 maximumConnections=1000</text>
  <text x="411" y="502" text-anchor="middle" font-size="11.5" fill="#64748b">wireFormat.maxFrameSize=104857600</text>

  <rect x="590" y="85" width="390" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="785" y="110" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">broker 容器 activemq-lab</text>

  <rect x="606" y="126" width="358" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="622" y="150" font-size="12.5" font-weight="bold" fill="#1e3a8a">conf/activemq.xml</text>
  <text x="622" y="174" font-size="11.5" fill="#1d4ed8">5 个 transportConnector 定义端口</text>
  <text x="622" y="196" font-size="11.5" fill="#1d4ed8">broker 标签上的 schedulerSupport 控制延迟消息</text>

  <rect x="606" y="228" width="358" height="86" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="622" y="252" font-size="12.5" font-weight="bold" fill="#7c2d12">KahaDB：data/kahadb</text>
  <text x="622" y="276" font-size="11.5" fill="#9a3412">所有目的地共用一个 journal 目录</text>
  <text x="622" y="298" font-size="11.5" fill="#9a3412">单队列堆积会拖慢全部目的地</text>

  <rect x="606" y="330" width="358" height="86" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="622" y="354" font-size="12.5" font-weight="bold" fill="#14532d">鉴权与账号</text>
  <text x="622" y="378" font-size="11.5" fill="#166534">simpleAuthenticationPlugin 替换默认 admin/admin</text>
  <text x="622" y="400" font-size="11.5" fill="#166534">控制台与所有连接器共用同一套账号</text>

  <text x="785" y="446" text-anchor="middle" font-size="11.5" fill="#64748b">容器内五个连接器都起来了</text>
  <text x="785" y="466" text-anchor="middle" font-size="11.5" fill="#64748b">不等于宿主都能连到</text>

  <line x1="218" y1="144" x2="296" y2="144" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="296,144 285,139 285,149" fill="#2563eb"/>
  <line x1="218" y1="200" x2="296" y2="200" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="296,200 285,195 285,205" fill="#16a34a"/>
  <line x1="218" y1="256" x2="296" y2="256" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="296,256 285,251 285,261" fill="#16a34a"/>
  <line x1="218" y1="312" x2="296" y2="312" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="296,312 285,307 285,317" fill="#16a34a"/>
  <line x1="218" y1="368" x2="296" y2="368" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="296,368 285,363 285,373" fill="#16a34a"/>
  <line x1="218" y1="424" x2="296" y2="424" stroke="#ea580c" stroke-width="1.5"/>
  <polygon points="296,424 285,419 285,429" fill="#ea580c"/>

  <line x1="522" y1="144" x2="582" y2="144" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="582,144 571,139 571,149" fill="#2563eb"/>
  <line x1="522" y1="200" x2="582" y2="200" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="582,200 571,195 571,205" fill="#16a34a"/>
  <line x1="522" y1="256" x2="582" y2="256" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="582,256 571,251 571,261" fill="#16a34a"/>
  <line x1="522" y1="312" x2="582" y2="312" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="582,312 571,307 571,317" fill="#16a34a"/>
  <line x1="522" y1="368" x2="582" y2="368" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="582,368 571,363 571,373" fill="#16a34a"/>
  <line x1="522" y1="424" x2="582" y2="424" stroke="#ea580c" stroke-width="1.5"/>
  <polygon points="582,424 571,419 571,429" fill="#ea580c"/>

  <rect x="20" y="486" width="960" height="134" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="36" y="512" font-size="13" font-weight="bold" fill="#7c2d12">起对了不等于能用对：三个最容易漏的开关</text>
  <text x="36" y="538" font-size="12" fill="#9a3412">1. 默认账号 admin/admin 必须在 simpleAuthenticationPlugin 里改掉，控制台与所有连接器共用这套账号</text>
  <text x="36" y="562" font-size="12" fill="#9a3412">2. 延迟消息必须 schedulerSupport=true：本机未开时 AMQ_SCHEDULED_DELAY=5000 只延迟 171 ms，开启后 5113 ms</text>
  <text x="36" y="586" font-size="12" fill="#9a3412">3. 用 Jolokia 读 MBean 要带 Origin 头；不带时请求被拒，日志里看不出是缺头</text>
  <text x="36" y="610" font-size="11.5" fill="#64748b">本机宿主只映射 61616 / 8161：另外四个连接器在容器内已确认存在，但未做协议级互通测试</text>
</svg>
