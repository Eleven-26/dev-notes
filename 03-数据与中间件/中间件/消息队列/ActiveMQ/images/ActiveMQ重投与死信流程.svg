<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="am3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="am4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="am5" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ActiveMQ 重投与死信：失败 → redeliveryPolicy → DLQ</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">JMS 语义下的 at-least-once：任何 ack 前崩溃都可能重复投递</text>

  <rect x="60" y="104" width="260" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="190" y="140" text-anchor="middle" font-size="12.5" fill="#1e3a8a">① 消费者收到消息</text>
  <line x1="190" y1="168" x2="190" y2="194" stroke="#334155" stroke-width="1.5" marker-end="url(#am3)"/>

  <rect x="60" y="198" width="260" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="190" y="234" text-anchor="middle" font-size="12.5" fill="#1e3a8a">② 业务处理成功？</text>

  <line x1="324" y1="214" x2="514" y2="136" stroke="#16a34a" stroke-width="1.5" marker-end="url(#am4)"/>
  <line x1="324" y1="230" x2="514" y2="230" stroke="#dc2626" stroke-width="1.5" marker-end="url(#am5)"/>

  <rect x="520" y="104" width="420" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="730" y="140" text-anchor="middle" font-size="12.5" fill="#14532d">✅ 成功：message.acknowledge()，消息删除</text>

  <rect x="520" y="200" width="420" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="730" y="236" text-anchor="middle" font-size="12.5" fill="#7f1d1d">❌ 不 ack / Nack：按 redeliveryPolicy 重投</text>
  <line x1="730" y1="264" x2="730" y2="288" stroke="#334155" stroke-width="1.5" marker-end="url(#am3)"/>

  <rect x="520" y="292" width="420" height="60" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="730" y="328" text-anchor="middle" font-size="12.5" fill="#7c2d12">③ 默认最多 6 次重投，可配指数退避</text>
  <line x1="730" y1="356" x2="730" y2="380" stroke="#334155" stroke-width="1.5" marker-end="url(#am3)"/>

  <rect x="520" y="384" width="420" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="730" y="420" text-anchor="middle" font-size="12.5" fill="#7f1d1d">④ 超过 maximumRedeliveries → ActiveMQ.DLQ</text>
  <line x1="730" y1="448" x2="730" y2="472" stroke="#334155" stroke-width="1.5" marker-end="url(#am3)"/>

  <rect x="520" y="476" width="420" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="730" y="512" text-anchor="middle" font-size="12.5" fill="#0f172a">⚠️ DLQ 无人消费会一直占 store，拖垮 broker</text>

  <rect x="60" y="330" width="260" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="190" y="366" text-anchor="middle" font-size="12" fill="#334155">JMS 没有 exactly-once</text>
  <rect x="60" y="428" width="260" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="190" y="464" text-anchor="middle" font-size="12" fill="#334155">业务必须幂等（唯一键 / 状态机）</text>

  <line x1="20" y1="558" x2="980" y2="558" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="584" font-size="13" fill="#0f172a">⭐ 正确姿势：CLIENT_ACKNOWLEDGE + 先处理业务、成功后再 acknowledge()。</text>
  <text x="20" y="610" font-size="13" fill="#0f172a">⚠️ AUTO_ACKNOWLEDGE 下「已投递未处理」时崩溃即丢；DUPS_OK 明确允许重复。</text>
  <text x="20" y="638" font-size="12" fill="#64748b">JMSXDeliveryCount 只能当重投计数参考；跨 broker 迁移时这些语义都可能不一致。</text>
</svg>
