<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ActiveMQ 队列分发：有 JMSXGroupID 才亲和，没有就看预取与派发</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">两个消费者、40 条消息、4 个业务键，本机 ActiveMQ Classic 6.1.4 实测</text>

  <rect x="20" y="78" width="960" height="216" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="104" font-size="14" font-weight="bold" fill="#0f172a">① 带 JMSXGroupID：同组消息全部落同一消费者，两组各 20 条</text>

  <rect x="40" y="140" width="170" height="102" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.4"/>
  <text x="125" y="168" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">生产者</text>
  <text x="125" y="192" text-anchor="middle" font-size="11.5" fill="#334155">40 条消息</text>
  <text x="125" y="214" text-anchor="middle" font-size="11.5" fill="#334155">4 组，每组 10 条</text>

  <line x1="214" y1="172" x2="386" y2="172" stroke="#2563eb" stroke-width="1.6"/>
  <polygon points="386,172 374,166 374,178" fill="#2563eb"/>
  <line x1="214" y1="212" x2="386" y2="212" stroke="#2563eb" stroke-width="1.6"/>
  <polygon points="386,212 374,206 374,218" fill="#2563eb"/>

  <rect x="390" y="130" width="570" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="406" y="154" font-size="12.5" font-weight="bold" fill="#1e3a8a">consumer#0：收到 20 条（queuePrefetch=1，先起消费者再生产）</text>
  <text x="406" y="180" font-size="12" fill="#1d4ed8">order-1 共 10 条 ｜ order-3 共 10 条 —— 每组整组归属</text>

  <rect x="390" y="212" width="570" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="406" y="236" font-size="12.5" font-weight="bold" fill="#1e3a8a">consumer#1：收到 20 条</text>
  <text x="406" y="262" font-size="12" fill="#1d4ed8">order-0 共 10 条 ｜ order-2 共 10 条 —— 组不跨消费者</text>

  <rect x="20" y="310" width="960" height="182" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="336" font-size="14" font-weight="bold" fill="#0f172a">② 不带 JMSXGroupID：条数大致均分，但同一个业务键被拆到两边</text>

  <rect x="390" y="352" width="570" height="62" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="406" y="376" font-size="12.5" font-weight="bold" fill="#7c2d12">consumer#0：order-0=2，order-1=8，order-2=1，order-3=9</text>
  <text x="406" y="400" font-size="11.5" fill="#9a3412">总数 20 条，但每个键都被拆成两份</text>

  <rect x="390" y="424" width="570" height="62" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="406" y="448" font-size="12.5" font-weight="bold" fill="#7c2d12">consumer#1：order-0=8，order-1=2，order-2=9，order-3=1</text>
  <text x="406" y="472" font-size="11.5" fill="#9a3412">与 consumer#0 互补：8+2、2+8、9+1、1+9</text>

  <text x="40" y="360" font-size="12" fill="#334155">判据：只要业务依赖「同一订单的消息必须</text>
  <text x="40" y="382" font-size="12" fill="#334155">按顺序处理」，就必须显式设 JMSXGroupID；</text>
  <text x="40" y="404" font-size="12" fill="#334155">靠条数均分只能均负载，保不住亲和。</text>

  <text x="40" y="516" font-size="12" fill="#64748b">预取默认值（6.1.4 实测）：queue=1000，topic=32767，queueBrowser=500，durableTopic=100</text>
  <text x="40" y="540" font-size="12" fill="#64748b">注意：queuePrefetch 越大，单消费者一次囤积越多，多实例时越容易出现「一个吃撑、其余空转」</text>
</svg>
