<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 596" width="1000" height="596" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="596" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">四种交换机的实测投递矩阵：12 次发布产生 15 条落点</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">同一批 3 条消息分别打进 4 个交换机，每格是该队列在 rabbitmqctl list_queues 里的 messages 读数</text>
  <rect x="40" y="86" width="920" height="30" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
  <text x="40" y="104" font-size="10.5" fill="#64748B" text-anchor="start">三条消息：msg1 = order.pay.created，msg2 = order.created，msg3 = payment.pay.created</text>
  <rect x="40" y="114" width="920" height="34" rx="0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0"/>
  <text x="50" y="136" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">队列</text>
  <text x="290" y="136" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">绑定</text>
  <text x="600" y="136" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">msg1</text>
  <text x="690" y="136" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">msg2</text>
  <text x="780" y="136" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">msg3</text>
  <text x="870" y="136" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">合计</text>
  <rect x="40" y="148" width="920" height="40" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="50" y="173" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">q.direct.created</text>
  <text x="290" y="173" font-size="11" fill="#334155" text-anchor="start">lab.direct  rk=order.created</text>
  <text x="640" y="174" font-size="12" fill="#cbd5e1" text-anchor="middle">0</text>
  <rect x="702" y="154" width="56" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="730" y="174" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">1</text>
  <text x="820" y="174" font-size="12" fill="#cbd5e1" text-anchor="middle">0</text>
  <text x="910" y="174" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="bold">1</text>
  <rect x="40" y="188" width="920" height="40" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="50" y="213" font-size="11.5" fill="#94a3b8" text-anchor="start">q.direct.paid</text>
  <text x="290" y="213" font-size="11" fill="#334155" text-anchor="start">lab.direct  rk=order.paid</text>
  <text x="640" y="214" font-size="12" fill="#cbd5e1" text-anchor="middle">0</text>
  <text x="730" y="214" font-size="12" fill="#cbd5e1" text-anchor="middle">0</text>
  <text x="820" y="214" font-size="12" fill="#cbd5e1" text-anchor="middle">0</text>
  <text x="910" y="214" font-size="13" fill="#cbd5e1" text-anchor="middle" font-weight="bold">0</text>
  <rect x="40" y="228" width="920" height="40" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="50" y="253" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">q.fanout.a</text>
  <text x="290" y="253" font-size="11" fill="#334155" text-anchor="start">lab.fanout  无键</text>
  <rect x="612" y="234" width="56" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="640" y="254" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">1</text>
  <rect x="702" y="234" width="56" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="730" y="254" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">1</text>
  <rect x="792" y="234" width="56" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="820" y="254" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">1</text>
  <text x="910" y="254" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="bold">3</text>
  <rect x="40" y="268" width="920" height="40" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="50" y="293" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">q.fanout.b</text>
  <text x="290" y="293" font-size="11" fill="#334155" text-anchor="start">lab.fanout  无键</text>
  <rect x="612" y="274" width="56" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="640" y="294" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">1</text>
  <rect x="702" y="274" width="56" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="730" y="294" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">1</text>
  <rect x="792" y="274" width="56" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="820" y="294" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">1</text>
  <text x="910" y="294" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="bold">3</text>
  <rect x="40" y="308" width="920" height="40" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="50" y="333" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">q.topic.star</text>
  <text x="290" y="333" font-size="11" fill="#334155" text-anchor="start">lab.topic  order.*.created</text>
  <rect x="612" y="314" width="56" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="640" y="334" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">1</text>
  <text x="730" y="334" font-size="12" fill="#cbd5e1" text-anchor="middle">0</text>
  <text x="820" y="334" font-size="12" fill="#cbd5e1" text-anchor="middle">0</text>
  <text x="910" y="334" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="bold">1</text>
  <rect x="40" y="348" width="920" height="40" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="50" y="373" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">q.topic.hash</text>
  <text x="290" y="373" font-size="11" fill="#334155" text-anchor="start">lab.topic  order.#</text>
  <rect x="612" y="354" width="56" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="640" y="374" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">1</text>
  <rect x="702" y="354" width="56" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="730" y="374" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">1</text>
  <text x="820" y="374" font-size="12" fill="#cbd5e1" text-anchor="middle">0</text>
  <text x="910" y="374" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="bold">2</text>
  <rect x="40" y="388" width="920" height="40" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="50" y="413" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">q.topic.lit</text>
  <text x="290" y="413" font-size="11" fill="#334155" text-anchor="start">lab.topic  order.pay.created</text>
  <rect x="612" y="394" width="56" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="640" y="414" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">1</text>
  <text x="730" y="414" font-size="12" fill="#cbd5e1" text-anchor="middle">0</text>
  <text x="820" y="414" font-size="12" fill="#cbd5e1" text-anchor="middle">0</text>
  <text x="910" y="414" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="bold">1</text>
  <rect x="40" y="428" width="920" height="40" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="50" y="453" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">q.hdr.all</text>
  <text x="290" y="453" font-size="11" fill="#334155" text-anchor="start">lab.headers  x-match=all</text>
  <rect x="612" y="434" width="56" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="640" y="454" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">1</text>
  <text x="730" y="454" font-size="12" fill="#cbd5e1" text-anchor="middle">0</text>
  <text x="820" y="454" font-size="12" fill="#cbd5e1" text-anchor="middle">0</text>
  <text x="910" y="454" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="bold">1</text>
  <rect x="40" y="468" width="920" height="40" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="50" y="493" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">q.hdr.any</text>
  <text x="290" y="493" font-size="11" fill="#334155" text-anchor="start">lab.headers  x-match=any</text>
  <rect x="612" y="474" width="56" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="640" y="494" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">1</text>
  <rect x="702" y="474" width="56" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="730" y="494" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">1</text>
  <rect x="792" y="474" width="56" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="820" y="494" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold">1</text>
  <text x="910" y="494" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="bold">3</text>
  <rect x="40" y="508" width="920" height="32" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="50" y="529" font-size="12" fill="#1e3a8a" text-anchor="start" font-weight="bold">落点合计（12 次发布 → 15 条落点）</text>
  <text x="910" y="529" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="bold">15</text>
  <text x="40" y="566" font-size="12.5" fill="#0f172a" text-anchor="start">要点：一次发布会落进 0~N 个队列（q.direct.paid 是 0），发布次数与落点条数没有固定关系。</text>
  <text x="40" y="590" font-size="12" fill="#b91c1c" text-anchor="start">注意：没有队列匹配时消息被静默丢弃，basicPublish 不报错；要感知必须 mandatory=true 并监听 basic.return。</text>
</svg>
