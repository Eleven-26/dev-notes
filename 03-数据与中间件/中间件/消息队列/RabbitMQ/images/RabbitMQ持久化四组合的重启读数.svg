<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">持久化四组合的重启读数：durable 与 delivery_mode 必须同时成立</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">4 个队列各写 2 条，docker restart 之后重读 messages</text>
  <rect x="40" y="88" width="960" height="44" rx="0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0"/>
  <text x="52" y="116" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">队列</text>
  <text x="242" y="116" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">durable</text>
  <text x="372" y="116" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">delivery_mode</text>
  <text x="562" y="116" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">重启前</text>
  <text x="712" y="116" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">重启后</text>
  <rect x="40" y="132" width="960" height="56" rx="0" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="52" y="156" font-size="12" fill="#14532d" text-anchor="start">lab.d.p</text>
  <text x="242" y="156" font-size="12" fill="#14532d" text-anchor="start">true</text>
  <text x="372" y="156" font-size="12" fill="#14532d" text-anchor="start">2 persistent</text>
  <text x="562" y="156" font-size="12" fill="#14532d" text-anchor="start" font-weight="bold">2</text>
  <text x="712" y="156" font-size="12" fill="#14532d" text-anchor="start" font-weight="bold">2</text>
  <text x="712" y="176" font-size="10" fill="#64748B" text-anchor="start">两个开关都开：消息留下来了</text>
  <rect x="40" y="188" width="960" height="56" rx="0" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="52" y="212" font-size="12" fill="#0f172a" text-anchor="start">lab.d.t</text>
  <text x="242" y="212" font-size="12" fill="#0f172a" text-anchor="start">true</text>
  <text x="372" y="212" font-size="12" fill="#0f172a" text-anchor="start">1 transient</text>
  <text x="562" y="212" font-size="12" fill="#991b1b" text-anchor="start" font-weight="bold">2</text>
  <text x="712" y="212" font-size="12" fill="#991b1b" text-anchor="start" font-weight="bold">0</text>
  <text x="712" y="232" font-size="10" fill="#64748B" text-anchor="start">队列在、消息没了 —— 线上最典型的一类丢失</text>
  <rect x="40" y="244" width="960" height="56" rx="0" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="52" y="268" font-size="12" fill="#0f172a" text-anchor="start">lab.nd.p</text>
  <text x="242" y="268" font-size="12" fill="#0f172a" text-anchor="start">false</text>
  <text x="372" y="268" font-size="12" fill="#0f172a" text-anchor="start">2 persistent</text>
  <text x="562" y="268" font-size="12" fill="#991b1b" text-anchor="start" font-weight="bold">2</text>
  <text x="712" y="268" font-size="12" fill="#991b1b" text-anchor="start" font-weight="bold">队列不存在</text>
  <text x="712" y="288" font-size="10" fill="#64748B" text-anchor="start">消息写得再持久，容器没了也没用</text>
  <rect x="40" y="300" width="960" height="56" rx="0" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="52" y="324" font-size="12" fill="#0f172a" text-anchor="start">lab.nd.t</text>
  <text x="242" y="324" font-size="12" fill="#0f172a" text-anchor="start">false</text>
  <text x="372" y="324" font-size="12" fill="#0f172a" text-anchor="start">1 transient</text>
  <text x="562" y="324" font-size="12" fill="#991b1b" text-anchor="start" font-weight="bold">2</text>
  <text x="712" y="324" font-size="12" fill="#991b1b" text-anchor="start" font-weight="bold">队列不存在</text>
  <text x="712" y="344" font-size="10" fill="#64748B" text-anchor="start">两个开关都没开</text>
  <text x="40" y="404" font-size="13" fill="#0f172a" text-anchor="start">要点：durable 管队列这个容器存不存在，delivery_mode=2 管这一条消息落不落盘，两个开关正交。</text>
  <text x="40" y="430" font-size="12.5" fill="#b91c1c" text-anchor="start">注意：4.x 默认禁声明「非持久 + 非排他」队列，会报 Feature `transient_nonexcl_queues` is deprecated；</text>
  <text x="40" y="454" font-size="12.5" fill="#b91c1c" text-anchor="start">本轮为凑齐第三、四行，在 conf.d 里放 deprecated_features.permit.transient_nonexcl_queues = true 才声明成功。</text>
</svg>
