<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">六种工作模式：同一套 Exchange + Queue + Binding 的六种组合</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">一条消息的命运由「它落进了几个队列」决定，而不是由消费者数量决定</text>
  <defs>
    <marker id="a5" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="40" y="84" width="448" height="130" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="56" y="110" font-size="13.5" fill="#1e3a8a" text-anchor="start" font-weight="bold">work queue（竞争消费）</text>
  <text x="56" y="138" font-size="11.5" fill="#1e3a8a" text-anchor="start">拓扑：1 交换机 → 1 队列 → N 消费者</text>
  <text x="56" y="162" font-size="11.5" fill="#1e3a8a" text-anchor="start">谁消费：组内只有一个消费者拿到这条消息</text>
  <rect x="504" y="84" width="448" height="130" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="520" y="110" font-size="13.5" fill="#14532d" text-anchor="start" font-weight="bold">pub-sub（发布订阅）</text>
  <text x="520" y="138" font-size="11.5" fill="#14532d" text-anchor="start">拓扑：fanout 交换机 → N 队列 → 各 1 消费者</text>
  <text x="520" y="162" font-size="11.5" fill="#14532d" text-anchor="start">谁消费：每个队列各拿一份（一条消息复制 N 份）</text>
  <rect x="40" y="232" width="448" height="130" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="56" y="258" font-size="13.5" fill="#7c2d12" text-anchor="start" font-weight="bold">routing（按类型分流）</text>
  <text x="56" y="286" font-size="11.5" fill="#7c2d12" text-anchor="start">拓扑：direct 交换机 → N 队列，绑定键不同</text>
  <text x="56" y="310" font-size="11.5" fill="#7c2d12" text-anchor="start">谁消费：命中绑定键的队列各拿一份</text>
  <rect x="504" y="232" width="448" height="130" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="520" y="258" font-size="13.5" fill="#4c1d95" text-anchor="start" font-weight="bold">topic（按维度订阅）</text>
  <text x="520" y="286" font-size="11.5" fill="#4c1d95" text-anchor="start">拓扑：topic 交换机 → N 队列，绑定键带通配</text>
  <text x="520" y="310" font-size="11.5" fill="#4c1d95" text-anchor="start">谁消费：命中通配的队列各拿一份</text>
  <rect x="40" y="380" width="448" height="130" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.4"/>
  <text x="56" y="406" font-size="13.5" fill="#831843" text-anchor="start" font-weight="bold">RPC（请求应答）</text>
  <text x="56" y="434" font-size="11.5" fill="#831843" text-anchor="start">拓扑：请求队列 + reply_to 指定的回复队列</text>
  <text x="56" y="458" font-size="11.5" fill="#831843" text-anchor="start">谁消费：请求被一个 worker 拿到，应答回专用队列</text>
  <rect x="504" y="380" width="448" height="130" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="520" y="406" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="bold">priority（优先级）</text>
  <text x="520" y="434" font-size="11.5" fill="#0f172a" text-anchor="start">拓扑：1 队列设 x-max-priority</text>
  <text x="520" y="458" font-size="11.5" fill="#0f172a" text-anchor="start">谁消费：高优先级先被投递（quorum 不支持）</text>
  <rect x="40" y="534" width="920" height="88" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="60" y="558" font-size="13" fill="#991b1b" text-anchor="start" font-weight="bold">注意：priority 的两个坑</text>
  <text x="60" y="582" font-size="11.5" fill="#991b1b" text-anchor="start">① quorum 队列不支持 x-max-priority，要用优先级只能用 classic；② 取值 1~255 但官方建议 ≤10，</text>
  <text x="60" y="602" font-size="11.5" fill="#991b1b" text-anchor="start">每条消息都会带上优先级字段，内存与 CPU 开销上升。</text>
  <text x="40" y="652" font-size="13" fill="#0f172a" text-anchor="start">要点：work queue 里 10 个消费者也只有 1 个拿到；pub-sub 里 10 个队列就算每个只 1 个消费者，也会产生 10 份副本。</text>
  <text x="40" y="678" font-size="13" fill="#0f172a" text-anchor="start">要点：所谓「工作模式」不是六种不同的队列，而是同一套 Exchange + Queue + Binding 的六种组合方式。</text>
  <text x="40" y="704" font-size="12.5" fill="#64748B" text-anchor="start">要点：优先级之外，单活跃消费者（x-single-active-consumer）是第七种拓扑上的「串行开关」，见队列类型篇第五节。</text>
</svg>
