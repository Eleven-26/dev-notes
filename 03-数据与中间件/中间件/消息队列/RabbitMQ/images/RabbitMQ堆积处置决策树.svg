<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">消息堆积的处置决策树：先看有没有消费者，最后才谈扩容</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">堆积不是一个数，是 messages_ready / messages_unacknowledged / consumers 三个数的组合</text>
  <defs>
    <marker id="a12" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="380" y="82" width="240" height="56" rx="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="500" y="106" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold">发现堆积</text>
  <text x="500" y="126" font-size="10.5" fill="#0f172a" text-anchor="middle">rabbitmqctl list_queues</text>
  <line x1="500" y1="138" x2="500" y2="166" stroke="#334155" stroke-width="1.6" marker-end="url(#a12)"/>
  <rect x="330" y="168" width="340" height="56" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="500" y="192" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold">consumers 是否为 0？</text>
  <text x="500" y="212" font-size="10.5" fill="#1e3a8a" text-anchor="middle">队列有没有消费者在工作</text>
  <text x="200" y="200" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="bold">是</text>
  <line x1="330" y1="196" x2="250" y2="196" stroke="#334155" stroke-width="1.6" marker-end="url(#a12)"/>
  <rect x="40" y="168" width="210" height="56" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="145" y="192" font-size="12.5" fill="#991b1b" text-anchor="middle" font-weight="bold">查订阅链路</text>
  <text x="145" y="212" font-size="10.5" fill="#991b1b" text-anchor="middle">队列名 / vhost / 绑定键 / 进程日志</text>
  <line x1="500" y1="224" x2="500" y2="252" stroke="#334155" stroke-width="1.6" marker-end="url(#a12)"/>
  <rect x="330" y="254" width="340" height="56" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="500" y="278" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold">unacked 是否等于 prefetch 上限？</text>
  <text x="500" y="298" font-size="10.5" fill="#1e3a8a" text-anchor="middle">且 10 分钟不动</text>
  <text x="760" y="286" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="bold">是</text>
  <line x1="670" y1="282" x2="740" y2="282" stroke="#334155" stroke-width="1.6" marker-end="url(#a12)"/>
  <rect x="740" y="254" width="220" height="56" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="850" y="278" font-size="12.5" fill="#991b1b" text-anchor="middle" font-weight="bold">消费者卡住</text>
  <text x="850" y="298" font-size="10.5" fill="#991b1b" text-anchor="middle">查栈 / 下游超时 / consumer_timeout</text>
  <line x1="500" y1="310" x2="500" y2="338" stroke="#334155" stroke-width="1.6" marker-end="url(#a12)"/>
  <rect x="330" y="340" width="340" height="56" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="500" y="364" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold">单条处理耗时是否远大于 RTT？</text>
  <text x="500" y="384" font-size="10.5" fill="#1e3a8a" text-anchor="middle">从「收消息 → ack」的时间差取</text>
  <text x="760" y="372" font-size="11" fill="#92400e" text-anchor="middle" font-weight="bold">是</text>
  <line x1="670" y1="368" x2="740" y2="368" stroke="#334155" stroke-width="1.6" marker-end="url(#a12)"/>
  <rect x="740" y="340" width="220" height="56" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="850" y="364" font-size="12.5" fill="#78350f" text-anchor="middle" font-weight="bold">优化单条耗时</text>
  <text x="850" y="384" font-size="10.5" fill="#78350f" text-anchor="middle">批量化 / 异步 / 查下游</text>
  <line x1="500" y1="396" x2="500" y2="424" stroke="#334155" stroke-width="1.6" marker-end="url(#a12)"/>
  <rect x="330" y="426" width="340" height="56" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="500" y="450" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold">是否触发 memory / disk 告警？</text>
  <text x="500" y="470" font-size="10.5" fill="#1e3a8a" text-anchor="middle">rabbitmq-diagnostics alarms</text>
  <text x="760" y="458" font-size="11" fill="#92400e" text-anchor="middle" font-weight="bold">是</text>
  <line x1="670" y1="454" x2="740" y2="454" stroke="#334155" stroke-width="1.6" marker-end="url(#a12)"/>
  <rect x="740" y="426" width="220" height="56" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="850" y="450" font-size="12.5" fill="#78350f" text-anchor="middle" font-weight="bold">先解决资源</text>
  <text x="850" y="470" font-size="10.5" fill="#78350f" text-anchor="middle">扩盘 / 提水位 / 加节点</text>
  <line x1="500" y1="482" x2="500" y2="510" stroke="#334155" stroke-width="1.6" marker-end="url(#a12)"/>
  <rect x="300" y="512" width="400" height="56" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="500" y="536" font-size="12.5" fill="#14532d" text-anchor="middle" font-weight="bold">加消费者 / 提 prefetch</text>
  <text x="500" y="556" font-size="10.5" fill="#14532d" text-anchor="middle">同时确认下游扛得住</text>
  <line x1="500" y1="568" x2="500" y2="596" stroke="#334155" stroke-width="1.6" marker-end="url(#a12)"/>
  <rect x="300" y="598" width="400" height="56" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="500" y="622" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold">兜底：x-max-length + DLX</text>
  <text x="500" y="642" font-size="10.5" fill="#0f172a" text-anchor="middle">防无限堆积写满磁盘（代价是丢队头）</text>
  <text x="40" y="682" font-size="13" fill="#0f172a" text-anchor="start">要点：consumers = 0 时加消费者无效；unacked 卡满时扩容只会让更多消费者一起卡。</text>
  <text x="40" y="708" font-size="12.5" fill="#b91c1c" text-anchor="start">注意：messages = messages_ready + messages_unacknowledged，只看 messages 会把「正在处理」误算成堆积。</text>
</svg>
