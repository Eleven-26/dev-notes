<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">prefetch 对照实测：不设时慢消费者独吞 20 条，快消费者一条也拿不到</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">队列预置 20 条；慢消费者 A（150ms/条）先启动，快消费者 B（不 sleep）0.4 秒后加入</text>
  <defs>
    <marker id="a8" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="40" y="90" width="920" height="150" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="60" y="116" font-size="14" fill="#991b1b" text-anchor="start" font-weight="bold">prefetch = 0（不限制，默认）</text>
  <text x="60" y="140" font-size="11.5" fill="#991b1b" text-anchor="start">A 拿到</text>
  <rect x="130" y="124" width="400" height="22" rx="3" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
  <text x="538" y="141" font-size="12" fill="#991b1b" text-anchor="start" font-weight="bold">20 条</text>
  <text x="60" y="174" font-size="11.5" fill="#991b1b" text-anchor="start">B 拿到</text>
  <text x="138" y="175" font-size="12" fill="#991b1b" text-anchor="start" font-weight="bold">0 条</text>
  <text x="60" y="208" font-size="11.5" fill="#991b1b" text-anchor="start">全部消费完耗时 3.0s（全由 A 处理的下限是 20 × 150ms = 3.0s）</text>
  <rect x="40" y="260" width="920" height="150" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="60" y="286" font-size="14" fill="#14532d" text-anchor="start" font-weight="bold">prefetch = 1</text>
  <text x="60" y="310" font-size="11.5" fill="#14532d" text-anchor="start">A 拿到</text>
  <rect x="130" y="294" width="60" height="22" rx="3" fill="#86efac" stroke="#16a34a" stroke-width="1"/>
  <text x="198" y="311" font-size="12" fill="#14532d" text-anchor="start" font-weight="bold">3 条</text>
  <text x="60" y="344" font-size="11.5" fill="#14532d" text-anchor="start">B 拿到</text>
  <rect x="130" y="328" width="340" height="22" rx="3" fill="#86efac" stroke="#16a34a" stroke-width="1"/>
  <text x="478" y="345" font-size="12" fill="#14532d" text-anchor="start" font-weight="bold">17 条</text>
  <text x="60" y="378" font-size="11.5" fill="#14532d" text-anchor="start">全部消费完耗时 0.5s（全由 A 处理的下限是 20 × 150ms = 3.0s）</text>
  <rect x="40" y="440" width="920" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="60" y="462" font-size="12.5" fill="#1e3a8a" text-anchor="start">读法：prefetch 是「未 ack 的欠账上限」，不是速率限制 —— 它才是「能者多劳」的开关。</text>
  <text x="60" y="482" font-size="11.5" fill="#1d4ed8" text-anchor="start">配额越小分发越公平（但吞吐受 RTT 影响），配额越大吞吐越高（但慢消费者会占着不放）。</text>
  <text x="40" y="512" font-size="12.5" fill="#0f172a" text-anchor="start">要点：两次实测读数完全一致（A/B 条数与耗时都相同），可复现。</text>
</svg>
