<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一条消息从 basicPublish 到 basicAck：六段链路与两个确认点</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">队列进程是串行的：一个队列一个 Erlang 进程，入队 / 出队 / ack / 过期扫描都在里面完成</text>
  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="60" y="88" width="400" height="62" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="80" y="114" font-size="13" fill="#1e3a8a" text-anchor="start" font-weight="bold">① 帧到达</text>
  <text x="80" y="136" font-size="11.5" fill="#1e3a8a" text-anchor="start">TCP 上切出 AMQP 帧，按 channel id 分派</text>
  <line x1="260" y1="150" x2="260" y2="166" stroke="#334155" stroke-width="1.6" marker-end="url(#a3)"/>
  <rect x="60" y="166" width="400" height="62" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="80" y="192" font-size="13" fill="#1e3a8a" text-anchor="start" font-weight="bold">② 通道进程</text>
  <text x="80" y="214" font-size="11.5" fill="#1e3a8a" text-anchor="start">校验资源是否存在、参数是否一致</text>
  <line x1="260" y1="228" x2="260" y2="244" stroke="#334155" stroke-width="1.6" marker-end="url(#a3)"/>
  <rect x="60" y="244" width="400" height="62" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="80" y="270" font-size="13" fill="#7c2d12" text-anchor="start" font-weight="bold">③ 交换机进程</text>
  <text x="80" y="292" font-size="11.5" fill="#7c2d12" text-anchor="start">按绑定表匹配，得到目标队列集合</text>
  <line x1="260" y1="306" x2="260" y2="322" stroke="#334155" stroke-width="1.6" marker-end="url(#a3)"/>
  <rect x="60" y="322" width="400" height="62" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="80" y="348" font-size="13" fill="#7c2d12" text-anchor="start" font-weight="bold">④ 队列进程</text>
  <text x="80" y="370" font-size="11.5" fill="#7c2d12" text-anchor="start">每队列一个进程，队内串行处理</text>
  <line x1="260" y1="384" x2="260" y2="400" stroke="#334155" stroke-width="1.6" marker-end="url(#a3)"/>
  <rect x="60" y="400" width="400" height="62" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="80" y="426" font-size="13" fill="#7c2d12" text-anchor="start" font-weight="bold">⑤ 索引与落盘</text>
  <text x="80" y="448" font-size="11.5" fill="#7c2d12" text-anchor="start">持久队列写磁盘；惰性队列优先留盘</text>
  <line x1="260" y1="462" x2="260" y2="478" stroke="#334155" stroke-width="1.6" marker-end="url(#a3)"/>
  <rect x="60" y="478" width="400" height="62" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="80" y="504" font-size="13" fill="#14532d" text-anchor="start" font-weight="bold">⑥ 投递与 ack</text>
  <text x="80" y="526" font-size="11.5" fill="#14532d" text-anchor="start">basic.deliver 推送，basicAck 后删除</text>
  <rect x="520" y="88" width="440" height="148" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="540" y="112" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="bold">两个确认点，别混</text>
  <text x="540" y="138" font-size="12" fill="#334155" text-anchor="start" font-weight="bold">Publisher Confirm：Broker → 生产者</text>
  <text x="540" y="158" font-size="11.5" fill="#64748B" text-anchor="start">确认「消息已被接受」（持久消息则已落盘）</text>
  <text x="540" y="186" font-size="12" fill="#334155" text-anchor="start" font-weight="bold">basicAck：消费者 → Broker</text>
  <text x="540" y="206" font-size="11.5" fill="#64748B" text-anchor="start">确认「业务已处理完」，随后消息被删除</text>
  <rect x="520" y="252" width="440" height="148" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="540" y="276" font-size="13.5" fill="#991b1b" text-anchor="start" font-weight="bold">每段出错的表现</text>
  <text x="540" y="300" font-size="11" fill="#991b1b" text-anchor="start">· ① 帧超 frame_max（131072 B）被拒</text>
  <text x="540" y="321" font-size="11" fill="#991b1b" text-anchor="start">· ② PRECONDITION_FAILED：channel 级异常，整条 Channel 关闭</text>
  <text x="540" y="342" font-size="11" fill="#991b1b" text-anchor="start">· ③ 目标集合为空 → 静默丢弃（除 mandatory）</text>
  <text x="540" y="363" font-size="11" fill="#991b1b" text-anchor="start">· ④ 队列多 → 进程多 → 调度与内存压力上升</text>
  <text x="540" y="384" font-size="11" fill="#991b1b" text-anchor="start">· ⑤ 磁盘告警 → 阻塞发布连接（不是拒收）</text>
  <text x="540" y="405" font-size="11" fill="#991b1b" text-anchor="start">· ⑥ 不 ack → 一直占着 prefetch 配额</text>
  <text x="520" y="428" font-size="11.5" fill="#64748B" text-anchor="start">⑤ 之后的 ack 是消费端动作，不属于发布链路</text>
  <text x="520" y="452" font-size="11.5" fill="#64748B" text-anchor="start">⑥ 的删除动作发生在 basicAck 返回之后</text>
  <rect x="520" y="476" width="440" height="96" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="540" y="500" font-size="13" fill="#14532d" text-anchor="start" font-weight="bold">为什么队列是串行的</text>
  <text x="540" y="522" font-size="11.5" fill="#166534" text-anchor="start">入队、出队、ack、TTL 扫描都由队列进程独占执行，</text>
  <text x="540" y="542" font-size="11.5" fill="#166534" text-anchor="start">单队列吞吐有上限 —— 扩队列才是横向扩展手段，</text>
  <text x="540" y="562" font-size="11.5" fill="#166534" text-anchor="start">所以不要设计「每用户一个队列」。</text>
  <text x="40" y="604" font-size="13" fill="#0f172a" text-anchor="start">要点：两个确认点在链路两端，中间隔着「队列里躺着」这段时间，必须分别管理。</text>
  <text x="40" y="630" font-size="13" fill="#0f172a" text-anchor="start">要点：绑定表把「消息去哪儿」从代码搬进了配置，代价是这条链路上没有位点、不能重放。</text>
</svg>
