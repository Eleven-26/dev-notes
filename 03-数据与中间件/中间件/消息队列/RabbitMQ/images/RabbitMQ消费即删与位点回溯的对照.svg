<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">消费即删与位点回溯：RabbitMQ 没有消费位点的根本原因</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">位点的前提是「日志保留完整历史」；RabbitMQ 在 ack 之后就把消息删了</text>
  <defs>
    <marker id="a9" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="40" y="84" width="440" height="300" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="60" y="110" font-size="14" fill="#991b1b" text-anchor="start" font-weight="bold">RabbitMQ：队列 + 未 ack 集合</text>
  <text x="60" y="134" font-size="11.5" fill="#b91c1c" text-anchor="start">消息 ack 之后立即删除，队列里没有历史</text>
  <rect x="60" y="152" width="68" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="94" y="178" font-size="12" fill="#cbd5e1" text-anchor="middle">m1</text>
  <rect x="142" y="152" width="68" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="176" y="178" font-size="12" fill="#cbd5e1" text-anchor="middle">m2</text>
  <rect x="224" y="152" width="68" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="258" y="178" font-size="12" fill="#cbd5e1" text-anchor="middle">m3</text>
  <rect x="306" y="152" width="68" height="40" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="340" y="178" font-size="12" fill="#991b1b" text-anchor="middle">m4</text>
  <rect x="388" y="152" width="68" height="40" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="422" y="178" font-size="12" fill="#991b1b" text-anchor="middle">m5</text>
  <text x="60" y="216" font-size="11" fill="#b91c1c" text-anchor="start">← 已 ack 的 3 条被删除，位置空出来了</text>
  <text x="60" y="244" font-size="11.5" fill="#991b1b" text-anchor="start">队列里只剩「还没被确认」的消息</text>
  <text x="60" y="272" font-size="11.5" fill="#991b1b" text-anchor="start">没有 offset 可记，也就没有「回到第 3 条重读」</text>
  <text x="60" y="300" font-size="11.5" fill="#991b1b" text-anchor="start">要重放只能把消息重新发一遍</text>
  <text x="60" y="330" font-size="11.5" fill="#991b1b" text-anchor="start">消费模型是推送：Broker 主动 deliver，prefetch 限流</text>
  <text x="60" y="358" font-size="11.5" fill="#991b1b" text-anchor="start">扩容靠加消费者，不靠加分区（队列数声明时就定了）</text>
  <rect x="520" y="84" width="440" height="300" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="540" y="110" font-size="14" fill="#14532d" text-anchor="start" font-weight="bold">Kafka / RocketMQ：日志 + 位点</text>
  <text x="540" y="134" font-size="11.5" fill="#166534" text-anchor="start">按保留策略删除，消费只推进位点、不动数据</text>
  <rect x="540" y="152" width="68" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="574" y="178" font-size="11" fill="#14532d" text-anchor="middle">off 0</text>
  <rect x="622" y="152" width="68" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="656" y="178" font-size="11" fill="#14532d" text-anchor="middle">off 1</text>
  <rect x="704" y="152" width="68" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="738" y="178" font-size="11" fill="#14532d" text-anchor="middle">off 2</text>
  <rect x="786" y="152" width="68" height="40" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="820" y="178" font-size="11" fill="#14532d" text-anchor="middle">off 3</text>
  <rect x="868" y="152" width="68" height="40" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="902" y="178" font-size="11" fill="#14532d" text-anchor="middle">off 4</text>
  <text x="540" y="216" font-size="11" fill="#166534" text-anchor="start">← 已读的 3 条仍在日志里（绿底）</text>
  <text x="540" y="244" font-size="11.5" fill="#14532d" text-anchor="start">消费者位点记在 offset 上（3）</text>
  <text x="540" y="272" font-size="11.5" fill="#14532d" text-anchor="start">改 offset 就能重读任意历史</text>
  <text x="540" y="300" font-size="11.5" fill="#14532d" text-anchor="start">消费模型是拉取：消费者按 offset 主动拉</text>
  <text x="540" y="330" font-size="11.5" fill="#14532d" text-anchor="start">扩容靠加分区（要提前规划），组内分摊</text>
  <text x="540" y="358" font-size="11.5" fill="#14532d" text-anchor="start">代价：存储要按保留期留足</text>
  <rect x="40" y="404" width="920" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="60" y="428" font-size="13" fill="#1e3a8a" text-anchor="start" font-weight="bold">一句话记住</text>
  <text x="60" y="452" font-size="11.5" fill="#1e3a8a" text-anchor="start">位点的本质是「在一条保留完整历史的日志上记下读到哪了」；RabbitMQ 的队列 ack 即删，没有历史可回溯，</text>
  <text x="60" y="474" font-size="11.5" fill="#1e3a8a" text-anchor="start">所以它只有「未 ack 集合」而没有位点 —— 这也决定了它必须用 prefetch 给推送限流。</text>
  <text x="40" y="528" font-size="13" fill="#0f172a" text-anchor="start">要点：需要「重放」的场景（事件回放、下游重建、审计）不要用 RabbitMQ，换 stream 队列或 Kafka。</text>
  <text x="40" y="554" font-size="13" fill="#0f172a" text-anchor="start">要点：不需要重放、只要「按维度路由 + 不丢」的业务消息，恰恰是 RabbitMQ 最合适的场景。</text>
</svg>
