<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 736" width="1000" height="736" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="736" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">三道水位与发布阻塞：返回成功不等于入队</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">人为把 disk_free_limit 抬到 1 TB 触发磁盘告警，逐级观察 publish 与队列堆积</text>
  <defs>
    <marker id="a11" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="40" y="82" width="920" height="86" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="58" y="103" font-size="12.5" fill="#14532d" text-anchor="start" font-weight="bold">① 基线</text>
  <text x="300" y="103" font-size="11" fill="#14532d" text-anchor="start">· alarms 为空</text>
  <text x="300" y="121" font-size="11" fill="#14532d" text-anchor="start">· 内存水位 0.6 → 3.7299 GB</text>
  <text x="300" y="139" font-size="11" fill="#14532d" text-anchor="start">· 磁盘低水位 0.05 GB</text>
  <rect x="40" y="174" width="920" height="68" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="58" y="195" font-size="12.5" fill="#14532d" text-anchor="start" font-weight="bold">② 无告警发 1 条</text>
  <text x="300" y="195" font-size="11" fill="#14532d" text-anchor="start">· publish 返回 nil，耗时 0.0s</text>
  <text x="300" y="213" font-size="11" fill="#14532d" text-anchor="start">· 队列 1 条</text>
  <rect x="40" y="248" width="920" height="68" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="58" y="269" font-size="12.5" fill="#78350f" text-anchor="start" font-weight="bold">③ 抬水位到 1 TB</text>
  <text x="300" y="269" font-size="11" fill="#78350f" text-anchor="start">· alarms：Free disk space alarm</text>
  <text x="300" y="287" font-size="11" fill="#78350f" text-anchor="start">· 触发 connection.blocked</text>
  <rect x="40" y="322" width="920" height="86" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="58" y="343" font-size="12.5" fill="#991b1b" text-anchor="start" font-weight="bold">④ 告警期发 1 条</text>
  <text x="300" y="343" font-size="11" fill="#991b1b" text-anchor="start">· ⚠️ 仍返回 nil，0.0s</text>
  <text x="300" y="361" font-size="11" fill="#991b1b" text-anchor="start">· blocked 通知：low on disk</text>
  <text x="300" y="379" font-size="11" fill="#991b1b" text-anchor="start">· ⚠️ 队列仍是 1 条</text>
  <rect x="40" y="414" width="920" height="86" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="58" y="435" font-size="12.5" fill="#991b1b" text-anchor="start" font-weight="bold">⑤ 告警期连发 20000 条</text>
  <text x="300" y="435" font-size="11" fill="#991b1b" text-anchor="start">· ⚠️ 8.0s 内没发完</text>
  <text x="300" y="453" font-size="11" fill="#991b1b" text-anchor="start">· 写缓冲灌满后 publish 开始阻塞</text>
  <text x="300" y="471" font-size="11" fill="#991b1b" text-anchor="start">· ⚠️ 队列仍是 1 条</text>
  <rect x="40" y="506" width="920" height="68" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="58" y="527" font-size="12.5" fill="#78350f" text-anchor="start" font-weight="bold">⑥ 复原到 50 MB</text>
  <text x="300" y="527" font-size="11" fill="#78350f" text-anchor="start">· alarms 为空</text>
  <text x="300" y="545" font-size="11" fill="#78350f" text-anchor="start">· 阻塞解除</text>
  <rect x="40" y="580" width="920" height="68" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="58" y="601" font-size="12.5" fill="#1e3a8a" text-anchor="start" font-weight="bold">⑦ 复原后再发 1 条</text>
  <text x="300" y="601" font-size="11" fill="#1e3a8a" text-anchor="start">· 队列变成 114 条</text>
  <text x="300" y="619" font-size="11" fill="#1e3a8a" text-anchor="start">· ⑤ 积压在缓冲区的消息一次性补投</text>
  <text x="40" y="678" font-size="13" fill="#0f172a" text-anchor="start">要点：basicPublish 返回 nil 只代表「帧写进了本地 socket 缓冲」；唯一的实时信号是 connection.blocked。</text>
  <text x="40" y="706" font-size="12.5" fill="#b91c1c" text-anchor="start">注意：缓冲的消息不会消失，告警解除后补投（两遍实测分别 119 / 114 条），所以告警期的超时重发会造成重复消息。</text>
</svg>
