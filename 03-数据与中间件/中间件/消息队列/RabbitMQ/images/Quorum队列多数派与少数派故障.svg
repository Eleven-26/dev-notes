<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Quorum 队列的多数派：停 1 个没事，停 2 个就只剩「假 running」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">同一个 quorum 队列 lab.quorum，按 3 → 2 → 1 个节点逐级停服实测</text>
  <defs>
    <marker id="a7" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="40" y="84" width="920" height="156" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="58" y="108" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="bold">3 / 3 节点</text>
  <text x="58" y="130" font-size="11" fill="#64748B" text-anchor="start">Raft 日志 Commit Index = 14</text>
  <rect x="58" y="144" width="120" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="118" y="164" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold">rq1</text>
  <text x="118" y="180" font-size="9" fill="#1d4ed8" text-anchor="middle">running</text>
  <rect x="190" y="144" width="120" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="250" y="164" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold">rq2</text>
  <text x="250" y="180" font-size="9" fill="#1d4ed8" text-anchor="middle">running</text>
  <rect x="322" y="144" width="120" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="382" y="164" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold">rq3</text>
  <text x="382" y="180" font-size="9" fill="#1d4ed8" text-anchor="middle">running</text>
  <text x="500" y="158" font-size="11.5" fill="#334155" text-anchor="start">list_queues 的 state</text>
  <text x="680" y="158" font-size="11.5" fill="#14532d" text-anchor="start" font-weight="bold">running</text>
  <text x="500" y="190" font-size="11.5" fill="#334155" text-anchor="start">消费</text>
  <text x="680" y="190" font-size="11.5" fill="#14532d" text-anchor="start" font-weight="bold">3 秒内取到 1 条</text>
  <text x="500" y="222" font-size="11.5" fill="#334155" text-anchor="start">发布</text>
  <text x="680" y="222" font-size="11.5" fill="#14532d" text-anchor="start" font-weight="bold">成功</text>
  <rect x="40" y="256" width="920" height="156" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="58" y="280" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="bold">2 / 3 节点</text>
  <text x="58" y="302" font-size="11" fill="#64748B" text-anchor="start">Raft 日志 Commit Index = 17</text>
  <rect x="58" y="316" width="120" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="118" y="336" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold">rq1</text>
  <text x="118" y="352" font-size="9" fill="#1d4ed8" text-anchor="middle">running</text>
  <rect x="190" y="316" width="120" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="250" y="336" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold">rq2</text>
  <text x="250" y="352" font-size="9" fill="#1d4ed8" text-anchor="middle">running</text>
  <rect x="322" y="316" width="120" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="382" y="336" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="bold">rq3</text>
  <text x="382" y="352" font-size="9" fill="#94a3b8" text-anchor="middle">noconnection</text>
  <text x="500" y="330" font-size="11.5" fill="#334155" text-anchor="start">list_queues 的 state</text>
  <text x="680" y="330" font-size="11.5" fill="#14532d" text-anchor="start" font-weight="bold">running</text>
  <text x="500" y="362" font-size="11.5" fill="#334155" text-anchor="start">消费</text>
  <text x="680" y="362" font-size="11.5" fill="#14532d" text-anchor="start" font-weight="bold">正常</text>
  <text x="500" y="394" font-size="11.5" fill="#334155" text-anchor="start">发布</text>
  <text x="680" y="394" font-size="11.5" fill="#14532d" text-anchor="start" font-weight="bold">成功（Commit Index 17）</text>
  <rect x="40" y="428" width="920" height="156" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="58" y="452" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="bold">1 / 3 节点</text>
  <text x="58" y="474" font-size="11" fill="#64748B" text-anchor="start">Raft 日志 Commit Index = 42</text>
  <rect x="58" y="488" width="120" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="118" y="508" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold">rq1</text>
  <text x="118" y="524" font-size="9" fill="#1d4ed8" text-anchor="middle">running</text>
  <rect x="190" y="488" width="120" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="250" y="508" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="bold">rq2</text>
  <text x="250" y="524" font-size="9" fill="#94a3b8" text-anchor="middle">noconnection</text>
  <rect x="322" y="488" width="120" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="382" y="508" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="bold">rq3</text>
  <text x="382" y="524" font-size="9" fill="#94a3b8" text-anchor="middle">noconnection</text>
  <text x="500" y="502" font-size="11.5" fill="#334155" text-anchor="start">list_queues 的 state</text>
  <text x="680" y="502" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="bold">仍然报 running</text>
  <text x="500" y="534" font-size="11.5" fill="#334155" text-anchor="start">消费</text>
  <text x="680" y="534" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="bold">Exception 541 nodedown</text>
  <text x="500" y="566" font-size="11.5" fill="#334155" text-anchor="start">发布</text>
  <text x="680" y="566" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="bold">返回成功，但不提交</text>
  <text x="40" y="610" font-size="12.5" fill="#0f172a" text-anchor="start">要点：判据是 quorum_status 的 Raft State 与消费的实际返回，list_queues 的 state 列在少数派下仍报 running。</text>
  <text x="40" y="634" font-size="12" fill="#b91c1c" text-anchor="start">注意：发布在少数派下仍返回成功 —— 它只是写进了 leader 的日志，永远等不到多数派提交；这就是必须开 Confirm 的理由。</text>
</svg>
