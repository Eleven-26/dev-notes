<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwR3" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#dc2626"/></marker>
    <marker id="arwG3" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">跨库 JOIN 不报错，只把能算的那一半算给你</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">t_order 分库分表、t_user 是只存在于 ds_0 的单表，同一条 JOIN 在两个库里命运不同</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="460" height="196" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. ds_0：能算出 1 行</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">订单与用户表在同一个库，JOIN 成立</text>

    <rect x="14" y="58" width="200" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="80" font-size="11" font-weight="bold" fill="#1e40af">t_order_1</text>
    <text x="28" y="98" font-size="9.5" fill="#1e40af">bob 的 1 条订单</text>

    <rect x="246" y="58" width="200" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="260" y="80" font-size="11" font-weight="bold" fill="#1e40af">t_user</text>
    <text x="260" y="98" font-size="9.5" fill="#1e40af">alice、bob 两行</text>

    <line x1="230" y1="126" x2="230" y2="146" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG3)"/>
    <text x="240" y="141" font-size="9.5" fill="#16a34a">user_id 对得上</text>

    <rect x="14" y="150" width="432" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="172" font-size="11" font-weight="bold" fill="#14532d">返回 1 行：bob 的订单</text>
  </g>

  <g transform="translate(520,74)">
    <rect x="0" y="0" width="460" height="196" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. ds_1：这半边被静默丢掉</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">t_user 根本不在这里，没有可 JOIN 的对象</text>

    <rect x="14" y="58" width="200" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="80" font-size="11" font-weight="bold" fill="#1e40af">t_order_0</text>
    <text x="28" y="98" font-size="9.5" fill="#1e40af">alice 的 1 条订单</text>

    <rect x="246" y="58" width="200" height="52" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="260" y="80" font-size="11" font-weight="bold" fill="#991b1b">t_user 不存在</text>
    <text x="260" y="98" font-size="9.5" fill="#991b1b">单表只在 ds_0</text>

    <line x1="230" y1="126" x2="230" y2="146" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR3)"/>
    <text x="240" y="141" font-size="9.5" fill="#dc2626">没有对手表</text>

    <rect x="14" y="150" width="432" height="34" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="28" y="172" font-size="11" font-weight="bold" fill="#991b1b">返回 0 行：没有任何异常</text>
  </g>

  <g transform="translate(20,290)">
    <rect x="0" y="0" width="960" height="104" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">合起来看：业务应得 2 行，实测只拿到 1 行，且未抛异常</text>
    <text x="14" y="52" font-size="11" fill="#92400e">这类错误不会出现在异常监控里，只会表现为列表少一条、报表偏低、对账差一笔。</text>
    <text x="14" y="76" font-size="11" fill="#92400e">判据：跨库 JOIN 要在设计阶段禁止，而不是靠运行期报错兜底。改成同分片键的绑定表、广播表或分两次查。</text>
  </g>
</svg>
