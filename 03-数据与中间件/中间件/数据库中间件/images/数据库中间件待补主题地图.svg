<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">数据库中间件 · 待补主题分类地图</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">占位目录：本类暂未整理笔记，下图仅登记正文清单中的三类主题，笔记成文后再补数据流转与判定图</text>

  <rect x="80" y="100" width="840" height="72" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="112" y="144" font-size="16" font-weight="bold" fill="#134e4a">① 分库分表</text>
  <text x="888" y="144" text-anchor="end" font-size="13" fill="#134e4a">ShardingSphere / MyCat</text>

  <rect x="80" y="200" width="840" height="72" rx="10" fill="#f8fafc" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="112" y="244" font-size="16" font-weight="bold" fill="#134e4a">② 读写分离</text>
  <text x="888" y="244" text-anchor="end" font-size="13" fill="#64748b">清单未列出具体工具</text>

  <rect x="80" y="300" width="840" height="72" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="112" y="344" font-size="16" font-weight="bold" fill="#134e4a">③ 连接池代理</text>
  <text x="888" y="344" text-anchor="end" font-size="13" fill="#134e4a">ProxySQL / 数据库网关</text>

  <line x1="40" y1="404" x2="960" y2="404" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="432" font-size="13" fill="#0f172a">⭐ 虚线框表示「待补主题」：图中条目与括号内工具名均出自本篇正文清单，未虚构组件。</text>
</svg>
