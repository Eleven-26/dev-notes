<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Nacos 实例健康检查：临时实例的失效时间线</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">15s 标记不健康，30s 从注册表摘除并推送变更</text>

  <rect x="20" y="110" width="260" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="150" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">T + 0s</text>
  <text x="150" y="166" text-anchor="middle" font-size="12" fill="#1d4ed8">客户端每 5s 上报一次心跳</text>
  <rect x="370" y="110" width="260" height="80" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">T + 15s</text>
  <text x="500" y="166" text-anchor="middle" font-size="12" fill="#9a3412">连续失败 → 标记不健康</text>
  <rect x="720" y="110" width="260" height="80" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="850" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">T + 30s</text>
  <text x="850" y="166" text-anchor="middle" font-size="12" fill="#b91c1c">继续失败 → 从注册表摘除</text>

  <line x1="150" y1="190" x2="150" y2="210" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="500" y1="190" x2="500" y2="210" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="850" y1="190" x2="850" y2="210" stroke="#94a3b8" stroke-width="1.4"/>

  <line x1="60" y1="210" x2="940" y2="210" stroke="#94a3b8" stroke-width="1.6"/>
  <circle cx="150" cy="210" r="7" fill="#2563eb"/>
  <circle cx="500" cy="210" r="7" fill="#ea580c"/>
  <circle cx="850" cy="210" r="7" fill="#dc2626"/>

  <rect x="20" y="250" width="460" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="250" y="288" text-anchor="middle" font-size="12" fill="#14532d">临时实例重启：重新注册即恢复，订阅方回调感知</text>
  <rect x="520" y="250" width="460" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="750" y="288" text-anchor="middle" font-size="12" fill="#334155">持久化实例：服务端探测，不健康只标记、不删除</text>

  <line x1="20" y1="350" x2="980" y2="350" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="376" font-size="13" fill="#0f172a">⭐ 只在客户端侧用 HealthyOnly 过滤即可，不要在业务代码里自己判 healthy 再兜底。</text>
  <text x="20" y="404" font-size="13" fill="#0f172a">⚠️ 容器 / 多网卡环境必须显式指定注册 IP，否则注册的是容器内网 IP。</text>
</svg>
