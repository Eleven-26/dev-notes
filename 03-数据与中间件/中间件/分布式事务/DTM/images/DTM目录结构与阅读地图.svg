<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">DTM 目录阅读地图：一篇总纲、四个零件、三份外联</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">总纲只回答「DTM 是什么、目录怎么读」；原理、模式、部署、生态分头展开，接入代码与选型各有归属</text>

  <rect x="340" y="84" width="320" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">README.md 总纲（本篇）</text>
  <text x="500" y="128" text-anchor="middle" font-size="11" fill="#1e40af">是什么 · 目录结构 · 按需求进</text>

  <line x1="500" y1="140" x2="140" y2="185" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="500" y1="140" x2="380" y2="185" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="500" y1="140" x2="620" y2="185" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="500" y1="140" x2="860" y2="185" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="26" y="190" width="228" height="112" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="42" y="216" font-size="13" font-weight="bold" fill="#14532d">① 原理与架构.md ⭐先读</text>
  <text x="42" y="244" font-size="11" fill="#166534">AP / RM / TM 三角色与分工</text>
  <text x="42" y="266" font-size="11" fill="#166534">多副本协作 · 子事务屏障</text>
  <text x="42" y="288" font-size="11" fill="#166534">幂等 / 空补偿 / 悬挂的自动拦截</text>

  <rect x="266" y="190" width="228" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="282" y="216" font-size="13" font-weight="bold" fill="#0f172a">② 事务模式.md</text>
  <text x="282" y="244" font-size="11" fill="#334155">六种模式各解决什么问题</text>
  <text x="282" y="266" font-size="11" fill="#334155">分支结果语义</text>
  <text x="282" y="288" font-size="11" fill="#334155">二阶段消息 · Workflow</text>

  <rect x="506" y="190" width="228" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="522" y="216" font-size="13" font-weight="bold" fill="#0f172a">③ 部署与运维.md</text>
  <text x="522" y="244" font-size="11" fill="#334155">二进制 / Docker / K8s 部署</text>
  <text x="522" y="266" font-size="11" fill="#334155">配置与环境变量 · 存储表</text>
  <text x="522" y="288" font-size="11" fill="#334155">诊断与上生产</text>

  <rect x="746" y="190" width="228" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="762" y="216" font-size="13" font-weight="bold" fill="#0f172a">④ 实践与生态.md</text>
  <text x="762" y="244" font-size="11" fill="#334155">微服务框架集成</text>
  <text x="762" y="266" font-size="11" fill="#334155">多语言 SDK · ORM 对接</text>
  <text x="762" y="288" font-size="11" fill="#334155">典型应用场景</text>

  <line x1="20" y1="322" x2="980" y2="322" stroke="#cbd5e1" stroke-width="1"/>
  <text x="26" y="346" font-size="12" fill="#64748b">外联文档：不在本目录，但常被一起问到</text>

  <rect x="35" y="358" width="300" height="96" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="51" y="384" font-size="13" font-weight="bold" fill="#5b21b6">接入DTM.md</text>
  <text x="51" y="410" font-size="11" fill="#334155">Go 侧接入代码分册</text>
  <text x="51" y="432" font-size="10.5" fill="#64748b">归 01-编程语言/go，本目录不放代码</text>

  <rect x="350" y="358" width="300" height="96" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="366" y="384" font-size="13" font-weight="bold" fill="#5b21b6">分布式事务选型对比.md</text>
  <text x="366" y="410" font-size="11" fill="#334155">上层横向选型：DTM vs Seata</text>
  <text x="366" y="432" font-size="10.5" fill="#64748b">位于本目录上一级</text>

  <rect x="665" y="358" width="300" height="96" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="681" y="384" font-size="13" font-weight="bold" fill="#5b21b6">分布式事务.md</text>
  <text x="681" y="410" font-size="11" fill="#334155">通用原理：2PC / TCC / Saga / 事务消息</text>
  <text x="681" y="432" font-size="10.5" fill="#64748b">位于 04-架构与系统/分布式/理论</text>

  <text x="20" y="486" font-size="12" fill="#0f172a">阅读顺序：① 原理与架构 → ② 事务模式 → ③ 部署与运维 → ④ 实践与生态；带着具体问题可从总纲「按需求进」表直接跳进对应零件篇的节。</text>
  <text x="20" y="512" font-size="12" fill="#64748b">例：幂等 / 空补偿 / 悬挂 → 原理与架构.md 第三节；不需要回滚的最终一致 → 事务模式.md 第四节；go-zero / Kratos 写法 → 实践与生态.md 与 接入DTM.md。</text>
</svg>
