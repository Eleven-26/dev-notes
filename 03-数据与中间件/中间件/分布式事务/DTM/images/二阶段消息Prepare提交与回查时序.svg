<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwC" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#334155"/>
    </marker>
    <marker id="arwD" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">二阶段消息：Prepare / Submit 与超时回查</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">本地事务同时写业务与 Prepare 记录；DTM 等到 Submit 才调用下游；宕机则靠 QueryPrepared 回查判定</text>

  <rect x="90" y="80" width="180" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" rx="7"/>
  <text x="180" y="105" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">业务服务（AP / RM）</text>
  <rect x="410" y="80" width="180" height="40" fill="#fef3c7" stroke="#b45309" stroke-width="1.3" rx="7"/>
  <text x="500" y="105" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">DTM（TM）</text>
  <rect x="730" y="80" width="180" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" rx="7"/>
  <text x="820" y="105" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">下游分支（RM）</text>

  <line x1="180" y1="120" x2="180" y2="470" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="500" y1="120" x2="500" y2="470" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="820" y1="120" x2="820" y2="470" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>

  <rect x="60" y="138" width="240" height="40" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.1" rx="6"/>
  <text x="75" y="158" font-size="11" fill="#3730a3">① 本地事务：业务更新</text>
  <text x="75" y="174" font-size="11" fill="#3730a3">＋ Prepare 记录，一起提交</text>

  <line x1="180" y1="196" x2="492" y2="196" stroke="#334155" stroke-width="1.5" marker-end="url(#arwC)"/>
  <text x="336" y="188" font-size="11" fill="#334155" text-anchor="middle">② Prepare（DTM 不调用分支，先持久化）</text>

  <line x1="180" y1="240" x2="492" y2="240" stroke="#334155" stroke-width="1.5" marker-end="url(#arwC)"/>
  <text x="336" y="232" font-size="11" fill="#334155" text-anchor="middle">③ Submit（此时才开始推进全局事务）</text>

  <line x1="492" y1="284" x2="828" y2="284" stroke="#334155" stroke-width="1.5" marker-end="url(#arwC)"/>
  <text x="660" y="276" font-size="11" fill="#334155" text-anchor="middle">④ 调用下游分支（至少一次，分支需幂等）</text>

  <line x1="828" y1="328" x2="508" y2="328" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwC)"/>
  <text x="660" y="320" font-size="11" fill="#16a34a" text-anchor="middle">⑤ 成功 → DTM 将全局事务标记为完成</text>

  <rect x="330" y="356" width="340" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.1" rx="6"/>
  <text x="500" y="376" font-size="11" fill="#334155" text-anchor="middle">⑥ 正常路径结束</text>
  <text x="500" y="390" font-size="11" fill="#334155" text-anchor="middle">（约定：分支只允许「成功 / 确定的失败 / 进行中」）</text>

  <rect x="40" y="410" width="920" height="140" fill="#fff7ed" stroke="#b45309" stroke-width="1.1" rx="10"/>
  <text x="60" y="434" font-size="13" font-weight="bold" fill="#92400e">异常路径：只 Prepare 未 Submit（提交前后宕机）</text>
  <text x="60" y="458" font-size="11.5" fill="#334155">• 提交后、Submit 前宕机 → 超时后 DTM 调 QueryPrepared，查到 committed → 继续调用下游分支</text>
  <text x="60" y="478" font-size="11.5" fill="#334155">• 提交前宕机 → 连接断，本地事务自动回滚 → 超时回查得到 rollbacked → 全局事务标记失败结束</text>
  <text x="60" y="502" font-size="11.5" fill="#92400e">回查原理：先 insert ignore 一条同 gid、原因为 rollbacked 的记录，再按 gid 查表看原因是 committed 还是 rollbacked。</text>
  <text x="60" y="522" font-size="11.5" fill="#92400e">若本地事务仍在进行中，这条插入会被事务持有的锁阻塞 —— 插入能返回，就说明本地事务一定已结束。</text>
  <text x="60" y="542" font-size="11.5" fill="#b45309">这正是它比「两分钟查不到就当作已回滚」更可靠的地方。</text>
</svg>
