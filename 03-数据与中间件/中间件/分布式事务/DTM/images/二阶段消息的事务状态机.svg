<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="dm1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="dmg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="dmr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">DTM 二阶段消息的事务状态机</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">与「Prepare / Submit 与回查时序」图互补：状态记在屏障表 (gid, reason)，回查用「插入 + 读回」一次性定状态</text>

  <!-- 起始 -->
  <circle cx="105" cy="135" r="7" fill="#334155"/>
  <text x="98" y="88" text-anchor="middle" font-size="11" fill="#334155">收到 Prepare</text>
  <line x1="111" y1="135" x2="129" y2="135" stroke="#334155" stroke-width="1.5" marker-end="url(#dm1)"/>

  <!-- A 本地事务进行中 -->
  <rect x="135" y="100" width="220" height="70" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
  <text x="245" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">本地事务进行中</text>
  <text x="245" y="150" text-anchor="middle" font-size="11" fill="#7c2d12">业务 + (gid, committed) 同事务</text>

  <!-- B 已提交待 Submit -->
  <rect x="135" y="260" width="220" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="245" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">已提交 · 待 Submit</text>
  <text x="245" y="310" text-anchor="middle" font-size="11" fill="#1e3a8a">屏障表已有 (gid, committed)</text>

  <!-- C 已调用分支 -->
  <rect x="135" y="420" width="220" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="245" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">已调用分支</text>
  <text x="245" y="470" text-anchor="middle" font-size="11" fill="#334155">DTM 依次回调下游接口</text>

  <!-- D 全局成功 -->
  <rect x="470" y="420" width="170" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="555" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">全局成功</text>
  <text x="555" y="470" text-anchor="middle" font-size="11" fill="#14532d">succeed · 终态</text>

  <!-- E 全局失败 -->
  <rect x="470" y="260" width="190" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="565" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">全局失败</text>
  <text x="565" y="310" text-anchor="middle" font-size="11" fill="#7f1d1d">failed · 终态并结束</text>

  <!-- 迁移边 -->
  <line x1="245" y1="170" x2="245" y2="256" stroke="#334155" stroke-width="1.5" marker-end="url(#dm1)"/>
  <text x="255" y="215" text-anchor="start" font-size="11" fill="#334155">本地事务提交</text>

  <path d="M355,135 C430,150 500,200 552,256" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#dmr)"/>
  <text x="480" y="120" text-anchor="start" font-size="11" fill="#dc2626">宕机断连 · 本地事务自动回滚</text>

  <line x1="245" y1="330" x2="245" y2="416" stroke="#334155" stroke-width="1.5" marker-end="url(#dm1)"/>
  <text x="255" y="375" text-anchor="start" font-size="11" fill="#334155">收到 Submit</text>

  <path d="M355,290 L466,290" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#dmr)"/>
  <text x="410" y="278" text-anchor="middle" font-size="11" fill="#dc2626">回查 rollbacked</text>

  <path d="M355,310 C430,360 430,420 360,447" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#dmg)"/>
  <text x="480" y="390" text-anchor="start" font-size="11" fill="#16a34a">回查 committed · 继续调分支</text>

  <line x1="355" y1="455" x2="466" y2="455" stroke="#16a34a" stroke-width="1.5" marker-end="url(#dmg)"/>
  <text x="410" y="445" text-anchor="middle" font-size="11" fill="#16a34a">分支全部成功</text>

  <!-- 回查三态判定注记 -->
  <text x="500" y="530" text-anchor="middle" font-size="12" fill="#64748b">回查原理：insert ignore (gid, rollbacked) 被锁阻塞 = 进行中（等待）；读回 committed = 已提交（继续调分支）；读回 rollbacked = 已回滚（全局失败）</text>
</svg>
