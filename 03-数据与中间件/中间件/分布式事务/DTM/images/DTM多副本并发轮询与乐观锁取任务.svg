<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwE" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">DTM 多副本并发轮询与乐观锁取任务</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">实例无状态、共享同一高可用存储；超时任务靠条件更新或 Lua 原子操作争抢，取到即打上 owner</text>

  <rect x="70" y="96" width="180" height="60" fill="#fef3c7" stroke="#b45309" stroke-width="1.3" rx="8"/>
  <text x="160" y="122" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">dtmsvr 实例 1</text>
  <text x="160" y="142" font-size="11" fill="#92400e" text-anchor="middle">无状态，可水平扩展</text>

  <rect x="410" y="96" width="180" height="60" fill="#fef3c7" stroke="#b45309" stroke-width="1.3" rx="8"/>
  <text x="500" y="122" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">dtmsvr 实例 2</text>
  <text x="500" y="142" font-size="11" fill="#92400e" text-anchor="middle">同上</text>

  <rect x="750" y="96" width="180" height="60" fill="#fef3c7" stroke="#b45309" stroke-width="1.3" rx="8"/>
  <text x="840" y="122" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">dtmsvr 实例 N</text>
  <text x="840" y="142" font-size="11" fill="#92400e" text-anchor="middle">按需增加</text>

  <line x1="160" y1="158" x2="160" y2="200" stroke="#b45309" stroke-width="1.5" marker-end="url(#arwE)"/>
  <line x1="500" y1="158" x2="500" y2="200" stroke="#b45309" stroke-width="1.5" marker-end="url(#arwE)"/>
  <line x1="840" y1="158" x2="840" y2="200" stroke="#b45309" stroke-width="1.5" marker-end="url(#arwE)"/>
  <text x="500" y="192" font-size="11.5" fill="#334155" text-anchor="middle">定时轮询「超时需要处理的全局任务」</text>

  <rect x="70" y="212" width="860" height="128" fill="#fff7ed" stroke="#b45309" stroke-width="1.2" rx="10"/>
  <text x="500" y="236" font-size="13.5" font-weight="bold" fill="#92400e" text-anchor="middle">共享高可用存储（同一份事务状态，非单点）</text>

  <rect x="96" y="252" width="392" height="72" fill="#ffffff" stroke="#b45309" stroke-width="1.1" rx="6"/>
  <text x="112" y="274" font-size="12" font-weight="bold" fill="#92400e">数据库存储：条件更新</text>
  <text x="112" y="294" font-size="11" fill="#334155">update ... set owner=?, time=? where ...</text>
  <text x="112" y="312" font-size="11" fill="#334155">靠 update 的原子性，一条记录只被一个实例改中</text>

  <rect x="512" y="252" width="392" height="72" fill="#ffffff" stroke="#b45309" stroke-width="1.1" rx="6"/>
  <text x="528" y="274" font-size="12" font-weight="bold" fill="#92400e">Redis 存储：Lua 脚本</text>
  <text x="528" y="294" font-size="11" fill="#334155">用 Lua 原子操作取任务</text>
  <text x="528" y="312" font-size="11" fill="#334155">保证一条记录只被一个实例取出</text>

  <rect x="70" y="360" width="860" height="130" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="90" y="384" font-size="13" font-weight="bold" fill="#0f172a">为什么这样就够用</text>
  <text x="90" y="408" font-size="12" fill="#334155">① 实例本身无状态，事务状态全在共享存储 —— 一个实例挂了，其他实例接着轮询未完成任务。</text>
  <text x="90" y="430" font-size="12" fill="#334155">② 不需要引入选举：协调者的高可用由共享存储提供，故障重新选举由存储层完成。</text>
  <text x="90" y="452" font-size="12" fill="#334155">③ 极端情况下一条任务被两个实例取出，也不会算错 —— 因为每个分支操作都是幂等的。</text>
  <text x="90" y="476" font-size="11.5" fill="#b45309">注意：使用数据库存储时一定要用主库，且 DTM 与数据库的时区、时间要一致（差不超过 3s）。</text>
</svg>
