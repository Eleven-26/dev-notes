<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">DTM 六种模式的回滚形态与适用面</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">先问「要不要回滚」：要回滚就写补偿或预留，不要回滚就只保证最终一致</text>

  <rect x="40" y="84" width="920" height="104" fill="#fef2f2" stroke="#dc2626" stroke-width="1.1" rx="10"/>
  <text x="60" y="108" font-size="13" font-weight="bold" fill="#991b1b">需要业务写补偿 / 预留</text>
  <rect x="196" y="118" width="362" height="58" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" rx="6"/>
  <text x="212" y="140" font-size="12.5" font-weight="bold" fill="#991b1b">SAGA</text>
  <text x="212" y="160" font-size="11" fill="#334155">正向操作 + 逆向补偿串成链；分支独立提交，可并发</text>
  <rect x="578" y="118" width="362" height="58" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" rx="6"/>
  <text x="594" y="140" font-size="12.5" font-weight="bold" fill="#991b1b">TCC</text>
  <text x="594" y="160" font-size="11" fill="#334155">Try 预留 / Confirm 消费 / Cancel 释放；隔离性更好</text>

  <rect x="40" y="200" width="920" height="104" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1" rx="10"/>
  <text x="60" y="224" font-size="13" font-weight="bold" fill="#1e40af">不需要业务写补偿</text>
  <rect x="196" y="234" width="222" height="58" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" rx="6"/>
  <text x="212" y="256" font-size="12.5" font-weight="bold" fill="#1e40af">XA</text>
  <text x="212" y="276" font-size="11" fill="#334155">数据库原生两阶段，回滚由数据库完成</text>
  <rect x="432" y="234" width="262" height="58" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" rx="6"/>
  <text x="448" y="256" font-size="12.5" font-weight="bold" fill="#1e40af">二阶段消息</text>
  <text x="448" y="276" font-size="11" fill="#334155">本地事务与事件发布原子化，不引入消息队列</text>
  <rect x="708" y="234" width="232" height="58" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" rx="6"/>
  <text x="724" y="256" font-size="12.5" font-weight="bold" fill="#1e40af">Outbox</text>
  <text x="724" y="276" font-size="11" fill="#334155">事件外发最终一致，二阶段消息为其更优替代</text>

  <rect x="40" y="316" width="920" height="96" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.1" rx="10"/>
  <text x="60" y="340" font-size="13" font-weight="bold" fill="#5b21b6">编排容器（可混用上面各模式）</text>
  <rect x="196" y="350" width="744" height="50" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" rx="6"/>
  <text x="212" y="370" font-size="12.5" font-weight="bold" fill="#5b21b6">Workflow（DTM 首创）</text>
  <text x="212" y="390" font-size="11" fill="#334155">一个函数里混用 XA / SAGA / TCC 与 HTTP / gRPC / 本地操作；分支用 OnCommit / OnRollback 表达语义</text>

  <rect x="40" y="428" width="920" height="80" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="60" y="452" font-size="12" fill="#334155">选择口径：需要回滚且资源可预留（资金 / 库存）→ TCC；长流程、每步可补偿 → SAGA；</text>
  <text x="60" y="474" font-size="12" fill="#334155">短事务且数据库支持 XA、无行锁争抢 → XA；只要求「本地提交与事件发布原子」→ 二阶段消息；</text>
  <text x="60" y="496" font-size="12" fill="#b45309">需要在一个流程里组合多种模式与协议 → Workflow；无论哪种，分支都必须幂等。</text>
</svg>
