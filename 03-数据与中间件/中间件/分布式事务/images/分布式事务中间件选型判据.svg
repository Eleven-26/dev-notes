<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">分布式事务中间件选型判据</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">先用语言栈与生态筛产品，再用「要不要回滚」收敛模式，最后比运维成本</text>

  <rect x="40" y="82" width="380" height="330" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="230" y="106" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">五道判据（按顺序问）</text>

  <rect x="60" y="122" width="340" height="46" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
  <text x="74" y="142" font-size="12" font-weight="bold" fill="#1e293b">① 语言栈是否统一在 Java？</text>
  <text x="74" y="160" font-size="11" fill="#475569">是 → 优先 Seata；含非 Java 语言 → DTM 的跨语言优势放大</text>

  <rect x="60" y="176" width="340" height="62" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
  <text x="74" y="196" font-size="12" font-weight="bold" fill="#1e293b">② 要贴哪个框架生态？</text>
  <text x="74" y="214" font-size="11" fill="#475569">Spring Cloud Alibaba → Seata</text>
  <text x="74" y="230" font-size="11" fill="#475569">go-zero / Kratos / Polaris → DTM</text>

  <rect x="60" y="246" width="340" height="46" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
  <text x="74" y="266" font-size="12" font-weight="bold" fill="#1e293b">③ 异常处理谁兜底？</text>
  <text x="74" y="284" font-size="11" fill="#475569">无人专管幂等 / 空补偿 / 悬挂 → 选带子事务屏障的 DTM</text>

  <rect x="60" y="300" width="340" height="46" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
  <text x="74" y="320" font-size="12" font-weight="bold" fill="#1e293b">④ 存储只有关系型数据库？</text>
  <text x="74" y="338" font-size="11" fill="#475569">能接受 Redis / Mongo 作事务存储 → DTM 选择面更宽</text>

  <rect x="60" y="354" width="340" height="46" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
  <text x="74" y="374" font-size="12" font-weight="bold" fill="#1e293b">⑤ 是否关键资金链路？</text>
  <text x="74" y="392" font-size="11" fill="#475569">核心链路评估协调者故障窗口；边缘通知可不上框架</text>

  <line x1="440" y1="247" x2="552" y2="247" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M552,247 L544,243 L544,251 Z" fill="#94a3b8"/>

  <rect x="580" y="90" width="380" height="96" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" rx="8"/>
  <text x="600" y="116" font-size="14" font-weight="bold" fill="#14532d">DTM</text>
  <text x="600" y="138" font-size="11.5" fill="#14532d">跨语言 SDK 薄 · 存储可选 MySQL / Redis / Mongo</text>
  <text x="600" y="156" font-size="11.5" fill="#14532d">子事务屏障自动处理幂等 / 空补偿 / 悬挂</text>
  <text x="600" y="174" font-size="11.5" fill="#14532d">含二阶段消息与 Workflow，对云原生更友好</text>

  <rect x="580" y="200" width="380" height="96" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4" rx="8"/>
  <text x="600" y="226" font-size="14" font-weight="bold" fill="#1e40af">Seata</text>
  <text x="600" y="248" font-size="11.5" fill="#1e40af">Java 生态最成熟，贴合 Spring Cloud Alibaba</text>
  <text x="600" y="266" font-size="11.5" fill="#1e40af">AT / TCC / Saga / XA 四模式，AT 靠镜像补偿</text>
  <text x="600" y="284" font-size="11.5" fill="#1e40af">异常处理更多由业务侧承担</text>

  <rect x="580" y="310" width="380" height="96" fill="#fef3c7" stroke="#b45309" stroke-width="1.4" rx="8"/>
  <text x="600" y="336" font-size="14" font-weight="bold" fill="#92400e">最大努力通知 + 对账</text>
  <text x="600" y="358" font-size="11.5" fill="#92400e">只要求弱一致的外部通知（支付回调等）</text>
  <text x="600" y="376" font-size="11.5" fill="#92400e">有限重试 + 结果查询 + 定时对账兜底</text>
  <text x="600" y="394" font-size="11.5" fill="#92400e">比引入协调者更轻，不必为了统一而上框架</text>

  <text x="500" y="440" font-size="11.5" fill="#b45309" text-anchor="middle">注意：先定业务不变量与最长可接受不一致窗口，再挑产品；两条路径都要求幂等与对账兜底</text>
</svg>
