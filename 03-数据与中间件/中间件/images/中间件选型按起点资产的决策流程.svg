<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="d1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">中间件选型：按「起点资产」分派的四条决策线</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">中间件选型不从空白开始，从「你手里已经有什么」开始；多数情形的正解是给现有组件加一层</text>

  <rect x="34" y="88" width="932" height="52" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="500" y="110" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">第 0 关（三问）：现有组件能不能解决？ / 它挂了业务能起吗？ / 谁来运维？</text>
  <text x="500" y="130" text-anchor="middle" font-size="11.5" fill="#64748b">任一条答不上来 → 不引，回到现有组件兜底</text>

  <line x1="500" y1="140" x2="500" y2="154" stroke="#334155" stroke-width="1.6"/>
  <line x1="143" y1="154" x2="857" y2="154" stroke="#334155" stroke-width="1.6"/>
  <line x1="143" y1="154" x2="143" y2="170" stroke="#334155" stroke-width="1.6" marker-end="url(#d1)"/>
  <line x1="381" y1="154" x2="381" y2="170" stroke="#334155" stroke-width="1.6" marker-end="url(#d1)"/>
  <line x1="619" y1="154" x2="619" y2="170" stroke="#334155" stroke-width="1.6" marker-end="url(#d1)"/>
  <line x1="857" y1="154" x2="857" y2="170" stroke="#334155" stroke-width="1.6" marker-end="url(#d1)"/>

  <rect x="34" y="174" width="218" height="48" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="143" y="196" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">A 已有 Spring Cloud</text>
  <text x="143" y="213" text-anchor="middle" font-size="10.5" fill="#334155">通信层已定 → 补协调与调度</text>
  <rect x="34" y="222" width="218" height="238" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="50" y="246" font-size="10" fill="#64748b">首选动作</text>
  <text x="50" y="272" font-size="11.5" fill="#334155">Feign → 只换热点链路</text>
  <text x="50" y="300" font-size="11.5" fill="#334155">Eureka → 迁到 Nacos</text>
  <text x="50" y="328" font-size="11.5" fill="#334155">Gateway → 不动</text>
  <text x="50" y="356" font-size="11.5" fill="#334155">Seata → 不动</text>
  <text x="50" y="396" font-size="10" fill="#64748b">判据</text>
  <text x="50" y="418" font-size="11" fill="#1e3a8a">先别整体换 RPC 子类，</text>
  <text x="50" y="438" font-size="11" fill="#1e3a8a">只挑高频小报文链路</text>

  <rect x="272" y="174" width="218" height="48" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="381" y="196" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4c1d95">B 已有 Nacos</text>
  <text x="381" y="213" text-anchor="middle" font-size="10.5" fill="#334155">协调层已定 → 补通信与数据</text>
  <rect x="272" y="222" width="218" height="238" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="288" y="246" font-size="10" fill="#64748b">首选动作</text>
  <text x="288" y="272" font-size="11.5" fill="#334155">REST → 按通信族判据</text>
  <text x="288" y="300" font-size="11.5" fill="#334155">定时任务 → 引调度族</text>
  <text x="288" y="328" font-size="11.5" fill="#334155">数据同步 → 用 CDC</text>
  <text x="288" y="356" font-size="11.5" fill="#334155">延迟/事务消息 → 引 MQ</text>
  <text x="288" y="396" font-size="10" fill="#64748b">判据</text>
  <text x="288" y="418" font-size="11" fill="#4c1d95">协调层不必再引第二种，</text>
  <text x="288" y="438" font-size="11" fill="#4c1d95">同类只引一种</text>

  <rect x="510" y="174" width="218" height="48" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
  <text x="619" y="196" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#134e4a">C 已在 K8s</text>
  <text x="619" y="213" text-anchor="middle" font-size="10.5" fill="#334155">用原生能力替代一部分</text>
  <rect x="510" y="222" width="218" height="238" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="526" y="246" font-size="10" fill="#64748b">首选动作</text>
  <text x="526" y="272" font-size="11.5" fill="#334155">服务发现 → headless Service</text>
  <text x="526" y="300" font-size="11.5" fill="#334155">配置 → ConfigMap + Secret</text>
  <text x="526" y="328" font-size="11.5" fill="#334155">定时任务 → CronJob</text>
  <text x="526" y="356" font-size="11.5" fill="#334155">网关 → Ingress-Nginx</text>
  <text x="526" y="384" font-size="11.5" fill="#334155">治理 → 框架内置 + OTel</text>
  <text x="526" y="418" font-size="11" fill="#134e4a">原生能力够用就先别引，</text>
  <text x="526" y="438" font-size="11" fill="#134e4a">缺的正是进程内能力</text>

  <rect x="748" y="174" width="218" height="48" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="857" y="196" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#78350f">D 从零开始</text>
  <text x="857" y="213" text-anchor="middle" font-size="10.5" fill="#334155">按主语言与规模排优先级</text>
  <rect x="748" y="222" width="218" height="238" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="764" y="246" font-size="10" fill="#64748b">按顺序问</text>
  <text x="764" y="272" font-size="11.5" fill="#334155">① 主语言是什么？</text>
  <text x="764" y="300" font-size="11.5" fill="#334155">② 要跨进程调用吗？</text>
  <text x="764" y="328" font-size="11.5" fill="#334155">③ 有一致性要求吗？</text>
  <text x="764" y="356" font-size="11.5" fill="#334155">④ 要定时任务吗？</text>
  <text x="764" y="384" font-size="11.5" fill="#334155">⑤ 要数据同步吗？</text>
  <text x="764" y="412" font-size="11.5" fill="#334155">⑥ 有运维能力吗？</text>
  <text x="764" y="440" font-size="11" fill="#78350f">主语言决定第一候选</text>

  <rect x="34" y="486" width="932" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="54" y="512" font-size="13" fill="#0f172a">⭐ 图怎么读：顶部那道门是第一节的三问（现有能否替代 / 有无降级 / 谁来运维），任一条答不上来就不引；</text>
  <text x="54" y="534" font-size="13" fill="#0f172a">下面四列按起点资产分派 —— A 已有 Spring Cloud、B 已有 Nacos、C 已在 K8s、D 从零开始。</text>
  <text x="54" y="562" font-size="12" fill="#64748b">⚠️ 图形只表达顺序，不代表每一族都要引；A / B / C 三列里的「不动」同样是结论 —— 不引也是一种选型。</text>
  <text x="54" y="584" font-size="12" fill="#64748b">⚠️ 无论走哪条线，第十一节那五条硬约束（同类只引一种 / 有降级 / 有 owner / 能观测 / 有退路）都随时成立。</text>
</svg>
