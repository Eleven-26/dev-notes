<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">中间件按职责分五族</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">分界线是「它替系统分担哪一类分布式难题」；前四族决定功能能不能用，第五族决定出了事能不能查</text>

  <rect x="36" y="92" width="928" height="40" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="500" y="117" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">一个系统：五族同时叠加（不是从中选一个）—— 一个中等规模微服务体系五族全引是常态</text>

  <rect x="36" y="152" width="168" height="310" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="120" y="182" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1e3a8a">① 通信族</text>
  <text x="120" y="204" text-anchor="middle" font-size="11" fill="#334155">进程间怎么把消息送达</text>
  <line x1="50" y1="218" x2="190" y2="218" stroke="#93c5fd" stroke-width="1"/>
  <text x="50" y="236" font-size="10" fill="#64748b">覆盖子类</text>
  <text x="50" y="258" font-size="11.5" fill="#334155">RPC 框架</text>
  <text x="50" y="280" font-size="11.5" fill="#334155">消息队列</text>
  <text x="50" y="302" font-size="11.5" fill="#334155">网关与代理</text>
  <line x1="50" y1="342" x2="190" y2="342" stroke="#93c5fd" stroke-width="1"/>
  <text x="50" y="360" font-size="10" fill="#64748b">在请求路径上</text>
  <text x="50" y="382" font-size="12.5" font-weight="bold" fill="#1e3a8a">是（故障 = 业务中断）</text>
  <text x="50" y="404" font-size="10" fill="#64748b">故障后果</text>
  <text x="50" y="426" font-size="12" fill="#1e3a8a">业务中断</text>

  <rect x="226" y="152" width="168" height="310" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="310" y="182" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#4c1d95">② 协调族</text>
  <text x="310" y="204" text-anchor="middle" font-size="11" fill="#334155">多个进程怎么达成一致</text>
  <line x1="240" y1="218" x2="380" y2="218" stroke="#c4b5fd" stroke-width="1"/>
  <text x="240" y="236" font-size="10" fill="#64748b">覆盖子类</text>
  <text x="240" y="258" font-size="11.5" fill="#334155">注册与配置中心</text>
  <text x="240" y="280" font-size="11.5" fill="#334155">分布式协调</text>
  <text x="240" y="302" font-size="11.5" fill="#334155">分布式事务</text>
  <text x="240" y="324" font-size="11.5" fill="#334155">分布式 ID</text>
  <line x1="240" y1="342" x2="380" y2="342" stroke="#c4b5fd" stroke-width="1"/>
  <text x="240" y="360" font-size="10" fill="#64748b">在请求路径上</text>
  <text x="240" y="382" font-size="12.5" font-weight="bold" fill="#4c1d95">部分（短时挂可容忍）</text>
  <text x="240" y="404" font-size="10" fill="#64748b">故障后果</text>
  <text x="240" y="426" font-size="12" fill="#4c1d95">数据不一致</text>

  <rect x="416" y="152" width="168" height="310" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="500" y="182" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#78350f">③ 调度族</text>
  <text x="500" y="204" text-anchor="middle" font-size="11" fill="#334155">什么时候该做某件事</text>
  <line x1="430" y1="218" x2="570" y2="218" stroke="#fcd34d" stroke-width="1"/>
  <text x="430" y="236" font-size="10" fill="#64748b">覆盖子类</text>
  <text x="430" y="258" font-size="11.5" fill="#334155">任务调度</text>
  <line x1="430" y1="342" x2="570" y2="342" stroke="#fcd34d" stroke-width="1"/>
  <text x="430" y="360" font-size="10" fill="#64748b">在请求路径上</text>
  <text x="430" y="382" font-size="12.5" font-weight="bold" fill="#78350f">否（不在请求路径）</text>
  <text x="430" y="404" font-size="10" fill="#64748b">故障后果</text>
  <text x="430" y="426" font-size="12" fill="#78350f">定时任务漏跑</text>

  <rect x="606" y="152" width="168" height="310" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
  <text x="690" y="182" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#134e4a">④ 数据族</text>
  <text x="690" y="204" text-anchor="middle" font-size="11" fill="#334155">数据怎么在存储之间流转</text>
  <line x1="620" y1="218" x2="760" y2="218" stroke="#5eead4" stroke-width="1"/>
  <text x="620" y="236" font-size="10" fill="#64748b">覆盖子类</text>
  <text x="620" y="258" font-size="11.5" fill="#334155">数据同步</text>
  <text x="620" y="280" font-size="11.5" fill="#334155">数据库中间件</text>
  <text x="620" y="302" font-size="11.5" fill="#334155">对象存储</text>
  <line x1="620" y1="342" x2="760" y2="342" stroke="#5eead4" stroke-width="1"/>
  <text x="620" y="360" font-size="10" fill="#64748b">在请求路径上</text>
  <text x="620" y="382" font-size="12.5" font-weight="bold" fill="#134e4a">部分（旁路居多）</text>
  <text x="620" y="404" font-size="10" fill="#64748b">故障后果</text>
  <text x="620" y="426" font-size="12" fill="#134e4a">数据链路断</text>

  <rect x="796" y="152" width="168" height="310" rx="12" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.6"/>
  <text x="880" y="182" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#881337">⑤ 治理族</text>
  <text x="880" y="204" text-anchor="middle" font-size="11" fill="#334155">出事时怎么观测与管控</text>
  <line x1="810" y1="218" x2="950" y2="218" stroke="#fda4af" stroke-width="1"/>
  <text x="810" y="236" font-size="10" fill="#64748b">覆盖子类</text>
  <text x="810" y="258" font-size="11.5" fill="#334155">服务网格</text>
  <text x="810" y="280" font-size="11.5" fill="#334155">可观测性</text>
  <line x1="810" y1="342" x2="950" y2="342" stroke="#fda4af" stroke-width="1"/>
  <text x="810" y="360" font-size="10" fill="#64748b">在请求路径上</text>
  <text x="810" y="382" font-size="12.5" font-weight="bold" fill="#881337">否（横切面）</text>
  <text x="810" y="404" font-size="10" fill="#64748b">故障后果</text>
  <text x="810" y="426" font-size="12" fill="#881337">只是盲区，不中断</text>

  <rect x="36" y="486" width="928" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="54" y="514" font-size="13" fill="#0f172a">⭐ 五族是叠加关系，不是并列关系：不像存储层的七类可以各存各的，一个系统同时引五族是常态。</text>
  <text x="54" y="540" font-size="12" fill="#64748b">⚠️ ①③④ 会改变业务数据路径（引了就有真流量走它）；②⑤ 主要改变系统的收敛行为（引了系统行为更可控）。</text>
</svg>
