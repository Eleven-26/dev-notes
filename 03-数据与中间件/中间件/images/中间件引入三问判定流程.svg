<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="1000" height="630" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="q1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="q2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="630" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">引入一个中间件前的三问判定</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">顺序就是优先级：先用现有组件 → 再要降级路径 → 最后看运维能力；三问有一问答不上来，就先别引</text>

  <rect x="50" y="96" width="380" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="70" y="124" font-size="14" font-weight="bold" fill="#0f172a">想引入一个新的中间件？</text>
  <text x="70" y="145" font-size="11.5" fill="#64748b">先判断「该不该引」，而不是「选哪一个」</text>

  <line x1="240" y1="152" x2="240" y2="176" stroke="#334155" stroke-width="1.6" marker-end="url(#q1)"/>

  <rect x="50" y="176" width="380" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="70" y="205" font-size="14" font-weight="bold" fill="#1e3a8a">判定 ①：现有组件能解决吗？</text>
  <text x="70" y="228" font-size="11.5" fill="#1d4ed8">数据库唯一键 / Redis / K8s 原生能力</text>

  <line x1="430" y1="210" x2="556" y2="210" stroke="#16a34a" stroke-width="1.6" marker-end="url(#q1)"/>
  <rect x="560" y="182" width="390" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="580" y="206" font-size="13.5" font-weight="bold" fill="#14532d">能解决 → 不引入新组件</text>
  <text x="580" y="228" font-size="11.5" fill="#166534">能靠现有组件解决，就别加新组件</text>

  <line x1="240" y1="244" x2="240" y2="268" stroke="#334155" stroke-width="1.6" marker-end="url(#q1)"/>

  <rect x="50" y="268" width="380" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="70" y="297" font-size="14" font-weight="bold" fill="#1e3a8a">判定 ②：它有降级路径吗？</text>
  <text x="70" y="320" font-size="11.5" fill="#1d4ed8">挂了业务能不能启动 / 能否容忍短时挂</text>

  <line x1="430" y1="302" x2="556" y2="302" stroke="#dc2626" stroke-width="1.6" marker-end="url(#q2)"/>
  <rect x="560" y="274" width="390" height="58" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="580" y="298" font-size="13.5" font-weight="bold" fill="#7f1d1d">没有降级 → 不上核心链路</text>
  <text x="580" y="320" font-size="11.5" fill="#b91c1c">没有降级路径的中间件不能上核心链路</text>

  <line x1="240" y1="336" x2="240" y2="360" stroke="#334155" stroke-width="1.6" marker-end="url(#q1)"/>

  <rect x="50" y="360" width="380" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="70" y="389" font-size="14" font-weight="bold" fill="#1e3a8a">判定 ③：谁来运维？</text>
  <text x="70" y="412" font-size="11.5" fill="#1d4ed8">团队有没有人能调优与排障</text>

  <line x1="430" y1="394" x2="556" y2="394" stroke="#dc2626" stroke-width="1.6" marker-end="url(#q2)"/>
  <rect x="560" y="366" width="390" height="58" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="580" y="390" font-size="13.5" font-weight="bold" fill="#7f1d1d">答不上来 → 先别引</text>
  <text x="580" y="412" font-size="11.5" fill="#b91c1c">三个问题有一个答不上来，就先别引</text>

  <line x1="240" y1="428" x2="240" y2="452" stroke="#334155" stroke-width="1.6" marker-end="url(#q1)"/>

  <rect x="50" y="452" width="380" height="68" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="70" y="481" font-size="14" font-weight="bold" fill="#14532d">三问都通过 → 可以引入</text>
  <text x="70" y="504" font-size="11.5" fill="#166534">但仍要：同类只引一种 / 有 metrics / 设计降级</text>

  <line x1="50" y1="544" x2="950" y2="544" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="572" font-size="13" fill="#0f172a">⭐ 三问的顺序就是引入前的优先级：先用现有组件 → 再要降级路径 → 最后看运维能力。</text>
  <text x="50" y="600" font-size="12" fill="#64748b">⚠️ 中间件的长期成本是运维，不是 License；三问里任何一问答不上来，就先别引。</text>
</svg>
