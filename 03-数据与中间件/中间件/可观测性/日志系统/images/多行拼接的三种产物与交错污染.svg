<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="610" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一条 13 行异常，三种规则给出三种产物</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">fluent/fluent-bit:3.2.10 实测；只有第三种把「错误信息」和「它的堆栈」留在了一起</text>

  <rect x="30" y="84" width="230" height="196" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="46" y="110" font-size="12.5" font-weight="bold" fill="#7f1d1d">① 解析器名不存在</text>
  <text x="46" y="134" font-size="10.5" font-family="Consolas, monospace" fill="#334155">Multiline.Parser java</text>
  <text x="46" y="158" font-size="11" fill="#334155">镜像里没有名为 java 的</text>
  <text x="46" y="176" font-size="11" fill="#334155">多行解析器（0 个）</text>
  <text x="46" y="202" font-size="11" fill="#b91c1c">不报错，按行输出</text>
  <text x="46" y="234" font-size="15" font-weight="bold" fill="#b91c1c">13 条</text>
  <text x="46" y="256" font-size="10.5" fill="#64748b">每条都是「一行」</text>
  <text x="46" y="274" font-size="10.5" fill="#64748b">堆栈散成 12 个 at</text>

  <rect x="280" y="84" width="230" height="196" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="296" y="110" font-size="12.5" font-weight="bold" fill="#7c2d12">② 只匹配 at 行</text>
  <text x="296" y="134" font-size="10" font-family="Consolas, monospace" fill="#334155">Rule cont "^(\s+at |…)"</text>
  <text x="296" y="158" font-size="11" fill="#334155">异常首行既不是时间戳</text>
  <text x="296" y="176" font-size="11" fill="#334155">也不以 at 开头 → 掉队</text>
  <text x="296" y="202" font-size="11" fill="#b45309">官方示例的规则集</text>
  <text x="296" y="234" font-size="15" font-weight="bold" fill="#b45309">3 条</text>
  <text x="296" y="256" font-size="10.5" fill="#64748b">1 行头 + 1 行异常信息</text>
  <text x="296" y="274" font-size="10.5" fill="#64748b">+ 11 行栈帧</text>

  <rect x="530" y="84" width="230" height="196" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="546" y="110" font-size="12.5" font-weight="bold" fill="#14532d">③ 补 Exception 规则</text>
  <text x="546" y="134" font-size="10" font-family="Consolas, monospace" fill="#334155">(Exception|Error)(:|\s|$)</text>
  <text x="546" y="158" font-size="11" fill="#334155">异常首行被认作续行</text>
  <text x="546" y="176" font-size="11" fill="#334155">整条异常合成一条</text>
  <text x="546" y="202" font-size="11" fill="#166534">推荐形态</text>
  <text x="546" y="234" font-size="15" font-weight="bold" fill="#166534">1 条</text>
  <text x="546" y="256" font-size="10.5" fill="#64748b">13 行完整保留</text>
  <text x="546" y="274" font-size="10.5" fill="#64748b">可按错误信息检索带栈</text>

  <rect x="780" y="84" width="190" height="196" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="796" y="110" font-size="12.5" font-weight="bold" fill="#334155">首选：一行一条 JSON</text>
  <text x="796" y="136" font-size="10.5" fill="#334155">堆栈作为字段值</text>
  <text x="796" y="156" font-size="10" font-family="Consolas, monospace" fill="#334155">"stack": "at …\nat …"</text>
  <text x="796" y="182" font-size="10.5" fill="#166534">不依赖行首模式</text>
  <text x="796" y="202" font-size="10.5" fill="#166534">不受交错写影响</text>
  <text x="796" y="234" font-size="15" font-weight="bold" fill="#166534">1 条</text>
  <text x="796" y="256" font-size="10.5" fill="#64748b">代价：改应用日志格式</text>
  <text x="796" y="274" font-size="10.5" fill="#64748b">文件不再「人眼可读」</text>

  <text x="30" y="318" font-size="14" font-weight="bold" fill="#0f172a">状态机假设「同一文件的行是顺序的」——交错写就把这个假设打破了</text>

  <rect x="30" y="334" width="460" height="200" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="46" y="358" font-size="11.5" font-weight="bold" fill="#334155">写入顺序（两个线程共用一条 stdout）</text>
  <text x="46" y="382" font-size="10" font-family="Consolas, monospace" fill="#166534">TS exec-1 … req=A start</text>
  <text x="46" y="400" font-size="10" font-family="Consolas, monospace" fill="#166534">java.lang.IllegalStateException: A</text>
  <text x="46" y="418" font-size="10" font-family="Consolas, monospace" fill="#166534">  at A.step1</text>
  <text x="46" y="436" font-size="10" font-family="Consolas, monospace" fill="#b45309">TS exec-2 … req=B start</text>
  <text x="46" y="454" font-size="10" font-family="Consolas, monospace" fill="#b45309">java.lang.RuntimeException: B</text>
  <text x="46" y="472" font-size="10" font-family="Consolas, monospace" fill="#b45309">  at B.step1</text>
  <text x="46" y="490" font-size="10" font-family="Consolas, monospace" fill="#b91c1c">  at A.step2   ← A 的后续</text>
  <text x="46" y="508" font-size="10" font-family="Consolas, monospace" fill="#b45309">  at B.step2</text>
  <text x="46" y="526" font-size="10" font-family="Consolas, monospace" fill="#b91c1c">  at A.step3   ← A 的后续</text>

  <rect x="510" y="334" width="460" height="200" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="526" y="358" font-size="11.5" font-weight="bold" fill="#7f1d1d">拼出来的两条记录（实测）</text>
  <text x="526" y="382" font-size="10.5" fill="#334155">rec1（3 行）A 的头 + 异常信息 + step1</text>
  <text x="526" y="404" font-size="10.5" fill="#334155">rec2（6 行）B 的头 + 异常信息 + B.step1</text>
  <text x="526" y="424" font-size="10.5" font-family="Consolas, monospace" fill="#b91c1c">         + A.step2 + B.step2 + A.step3</text>
  <text x="526" y="452" font-size="11" font-weight="bold" fill="#b91c1c">A 的两个栈帧被拼进了 B 的异常</text>
  <text x="526" y="476" font-size="10.5" fill="#334155">全程没有任何警告</text>
  <text x="526" y="500" font-size="10.5" fill="#64748b">堆栈看起来完整、行号也存在</text>
  <text x="526" y="520" font-size="10.5" fill="#64748b">但它指向的是另一条请求的调用路径</text>
</svg>
