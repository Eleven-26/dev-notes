<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 556" width="1000" height="556" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="556" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">从告警到单条日志的四段收窄：前三段都在排除，只有第四段在定位</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">顺序固定，跳步就是拿最贵的工具做最便宜的判断——第 1 段用日志查「哪个服务出问题」，成本最高</text>

  <rect x="20" y="76" width="228" height="180" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
  <text x="34" y="100" font-size="11" font-weight="bold" fill="#14532d">① 定服务</text>
  <text x="34" y="124" font-size="9" font-weight="bold" fill="#334155">目标</text>
  <text x="34" y="140" font-size="8.5" fill="#334155">哪个服务出问题</text>
  <text x="34" y="162" font-size="9" font-weight="bold" fill="#334155">用什么</text>
  <text x="34" y="178" font-size="8.5" fill="#334155">指标：错误率 / P99 / QPS</text>
  <text x="34" y="200" font-size="9" font-weight="bold" fill="#334155">做到什么算够</text>
  <text x="34" y="216" font-size="8.5" fill="#334155">能指出一个服务或一个依赖</text>
  <text x="34" y="240" font-size="8.5" fill="#14532d">⚠ 别用日志回答「是哪」</text>

  <rect x="264" y="76" width="228" height="180" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="278" y="100" font-size="11" font-weight="bold" fill="#1e3a8a">② 定时间窗</text>
  <text x="278" y="124" font-size="9" font-weight="bold" fill="#334155">目标</text>
  <text x="278" y="140" font-size="8.5" fill="#334155">故障什么时候开始</text>
  <text x="278" y="162" font-size="9" font-weight="bold" fill="#334155">用什么</text>
  <text x="278" y="178" font-size="8.5" fill="#334155">告警时间 ± 10 分钟</text>
  <text x="278" y="200" font-size="9" font-weight="bold" fill="#334155">做到什么算够</text>
  <text x="278" y="216" font-size="8.5" fill="#334155">窗口 ≤ 30 分钟</text>
  <text x="278" y="240" font-size="8.5" fill="#1e3a8a">⚠ Loki 不带时间窗就扫全量</text>

  <rect x="508" y="76" width="228" height="180" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="8"/>
  <text x="522" y="100" font-size="11" font-weight="bold" fill="#78350f">③ 定类型</text>
  <text x="522" y="124" font-size="9" font-weight="bold" fill="#334155">目标</text>
  <text x="522" y="140" font-size="8.5" fill="#334155">是什么错误</text>
  <text x="522" y="162" font-size="9" font-weight="bold" fill="#334155">用什么</text>
  <text x="522" y="178" font-size="8.5" fill="#334155">level 标签 + 关键词</text>
  <text x="522" y="200" font-size="9" font-weight="bold" fill="#334155">做到什么算够</text>
  <text x="522" y="216" font-size="8.5" fill="#334155">结果 ≤ 200 条，再多加条件</text>
  <text x="522" y="240" font-size="8.5" fill="#78350f">⚠ term 查 text 整串必 0 命中</text>

  <rect x="752" y="76" width="228" height="180" fill="#f3e8ff" stroke="#9333ea" stroke-width="1" rx="8"/>
  <text x="766" y="100" font-size="11" font-weight="bold" fill="#581c87">④ 定单条</text>
  <text x="766" y="124" font-size="9" font-weight="bold" fill="#334155">目标</text>
  <text x="766" y="140" font-size="8.5" fill="#334155">具体是哪一个请求</text>
  <text x="766" y="162" font-size="9" font-weight="bold" fill="#334155">用什么</text>
  <text x="766" y="178" font-size="8.5" fill="#334155">trace_id / user_id 反查</text>
  <text x="766" y="200" font-size="9" font-weight="bold" fill="#334155">做到什么算够</text>
  <text x="766" y="216" font-size="8.5" fill="#334155">1 条含完整上下文的日志</text>
  <text x="766" y="240" font-size="8.5" fill="#581c87">⚠ 正文里的 ID 只能扫</text>

  <rect x="20" y="264" width="960" height="96" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="34" y="286" font-size="11" font-weight="bold" fill="#334155">每一段都在减一个数量级：数据量降下来，剩下的才看得清</text>

  <rect x="20" y="288" width="228" height="56" fill="#bbf7d0" stroke="#16a34a" stroke-width="1" rx="4"/>
  <text x="134" y="308" text-anchor="middle" font-size="8.5" fill="#14532d">全部服务 × 全部时间</text>
  <text x="134" y="326" text-anchor="middle" font-size="8.5" fill="#14532d">这一段的量最大、也最没用</text>

  <rect x="264" y="304" width="228" height="40" fill="#bfdbfe" stroke="#2563eb" stroke-width="1" rx="4"/>
  <text x="378" y="322" text-anchor="middle" font-size="8.5" fill="#1e3a8a">1 个服务 × 分钟级窗口</text>
  <text x="378" y="338" text-anchor="middle" font-size="8.5" fill="#1e3a8a">量级已经落到「可扫」范围</text>

  <rect x="508" y="318" width="228" height="26" fill="#fde68a" stroke="#f59e0b" stroke-width="1" rx="4"/>
  <text x="622" y="335" text-anchor="middle" font-size="8.5" fill="#78350f">几十~几百条：可以一条条看了</text>

  <rect x="752" y="330" width="228" height="14" fill="#e9d5ff" stroke="#9333ea" stroke-width="1" rx="4"/>
  <text x="866" y="340" text-anchor="middle" font-size="8.5" fill="#581c87">1 条</text>

  <rect x="20" y="372" width="960" height="80" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="10"/>
  <text x="34" y="394" font-size="11" font-weight="bold" fill="#334155">一条能背下来的口诀，以及它的反例</text>
  <text x="34" y="416" font-size="9" fill="#0f172a">先用标签圈服务与时间 → 再用级别去噪 → 再用关键词定位 → 最后用 ID 收口。</text>
  <text x="34" y="436" font-size="8.5" fill="#9f1239">反例：先搜 trace_id 再补时间窗。在 Loki 上没有时间窗意味着扫全量，而 trace_id 又在正文里、没有索引——两处慢叠在一起，等于把最快的路径走到最慢。</text>

  <rect x="20" y="464" width="960" height="76" fill="#fff1f2" stroke="#f43f5e" stroke-width="1" rx="8"/>
  <text x="34" y="486" font-size="10.5" font-weight="bold" fill="#9f1239">本机读数（ES 8.19，300 条同一数据集）：第 3 段选错写法，比第 1 段用错工具更常见</text>
  <text x="34" y="506" font-size="8.5" fill="#334155">term 查词条 6 ms（300 命中）／ match 全串 144 ms（慢 20 倍以上）／ wildcard *orders/42* 79 ms 但 0 命中／ index:false 的 keyword 21 ms 且永远 0 命中</text>
  <text x="34" y="524" font-size="8.5" fill="#334155">track_total_hits 也是隐性成本：同一查询 true 20 ms、false 4 ms——只要不显示总数，第 3 段就该关掉它。</text>
</svg>
