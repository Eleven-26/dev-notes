<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="590" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一道风暴穿过五层：每层能做的事，正好对上它做不了的判断</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">「该丢谁」这个决策只有应用侧和 SDK 做得了；后端的 429 是拒收，不是优选</text>

  <rect x="20" y="72" width="960" height="402" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>

  <rect x="30" y="82" width="12" height="340" fill="#fecdd3" stroke="#f43f5e" stroke-width="1" rx="6"/>
  <polygon points="36,432 30,420 42,420" fill="#f43f5e"/>

  <text x="52" y="104" font-size="9" font-weight="bold" fill="#1e40af">层（自上而下）</text>
  <text x="190" y="104" font-size="9" font-weight="bold" fill="#1e40af">能做</text>
  <text x="452" y="104" font-size="9" font-weight="bold" fill="#1e40af">做不了</text>
  <text x="714" y="104" font-size="9" font-weight="bold" fill="#1e40af">超限之后会发生什么</text>
  <line x1="36" y1="112" x2="964" y2="112" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="52" y="120" width="130" height="52" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
  <text x="64" y="142" font-size="9.5" font-weight="bold" fill="#14532d">① 业务代码</text>
  <text x="64" y="160" font-size="8.5" fill="#334155">知道业务语义</text>

  <rect x="190" y="120" width="252" height="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="202" y="142" font-size="8.5" fill="#334155">知道「这条日志重不重要」</text>
  <text x="202" y="160" font-size="8.5" fill="#64748b">能按租户 / 接口 / 业务域分级</text>

  <rect x="452" y="120" width="252" height="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="464" y="142" font-size="8.5" fill="#334155">不知道「下游现在有多忙」</text>
  <text x="464" y="160" font-size="8.5" fill="#64748b">拿不到任何反馈信号</text>

  <rect x="714" y="120" width="250" height="52" fill="#fff1f2" stroke="#f43f5e" stroke-width="1" rx="6"/>
  <text x="726" y="142" font-size="8.5" fill="#9f1239">没有闸门，一直打</text>
  <text x="726" y="160" font-size="8.5" fill="#64748b">五层里唯一的「无限产能」</text>

  <rect x="52" y="182" width="130" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
  <text x="64" y="204" font-size="9.5" font-weight="bold" fill="#1e3a8a">② SDK</text>
  <text x="64" y="222" font-size="8.5" fill="#334155">采样 / 聚合 / 限速</text>

  <rect x="190" y="182" width="252" height="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="202" y="204" font-size="8.5" fill="#334155">源头减产，成本最低</text>
  <text x="202" y="222" font-size="8.5" fill="#64748b">能按级别开关、按比例采样</text>

  <rect x="452" y="182" width="252" height="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="464" y="204" font-size="8.5" fill="#334155">不知道「哪些是同一问题的重复」</text>
  <text x="464" y="222" font-size="8.5" fill="#64748b">聚合只能按内容哈希，语义不清</text>

  <rect x="714" y="182" width="250" height="52" fill="#fff1f2" stroke="#f43f5e" stroke-width="1" rx="6"/>
  <text x="726" y="204" font-size="8.5" fill="#9f1239">丢掉的日志无法恢复</text>
  <text x="726" y="222" font-size="8.5" fill="#64748b">但至少是自己选择丢的</text>

  <rect x="52" y="244" width="130" height="52" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="6"/>
  <text x="64" y="266" font-size="9.5" font-weight="bold" fill="#78350f">③ 采集器</text>
  <text x="64" y="284" font-size="8.5" fill="#334155">看到全量速率、能背压</text>

  <rect x="190" y="244" width="252" height="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="202" y="266" font-size="8.5" fill="#334155">能暂停输入、能按 tag 分流</text>
  <text x="202" y="284" font-size="8.5" fill="#64748b">P3 不匹配任何 output 即丢弃</text>

  <rect x="452" y="244" width="252" height="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="464" y="266" font-size="8.5" fill="#334155">不知道「业务语义上该丢谁」</text>
  <text x="464" y="284" font-size="8.5" fill="#64748b">只能靠上游打好的标记</text>

  <rect x="714" y="244" width="250" height="52" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="6"/>
  <text x="726" y="266" font-size="8.5" fill="#78350f">memory：paused 停输入</text>
  <text x="726" y="284" font-size="8.5" fill="#78350f">filesystem：不暂停、继续灌盘</text>

  <rect x="52" y="306" width="130" height="52" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1" rx="6"/>
  <text x="64" y="328" font-size="9.5" font-weight="bold" fill="#312e81">④ 传输</text>
  <text x="64" y="346" font-size="8.5" fill="#334155">重试 / 批量 / 压缩</text>

  <rect x="190" y="306" width="252" height="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="202" y="328" font-size="8.5" fill="#334155">批量能摊薄单条开销</text>
  <text x="202" y="346" font-size="8.5" fill="#64748b">压缩能降带宽，不降条数</text>

  <rect x="452" y="306" width="252" height="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="464" y="328" font-size="8.5" fill="#334155">无状态决策能力</text>
  <text x="464" y="346" font-size="8.5" fill="#64748b">它不知道对面为什么慢</text>

  <rect x="714" y="306" width="250" height="52" fill="#fff1f2" stroke="#f43f5e" stroke-width="1" rx="6"/>
  <text x="726" y="328" font-size="8.5" fill="#9f1239">重试会放大风暴</text>
  <text x="726" y="346" font-size="8.5" fill="#64748b">本机实测间隔 6~21s 带抖动</text>

  <rect x="52" y="368" width="130" height="52" fill="#f3e8ff" stroke="#9333ea" stroke-width="1" rx="6"/>
  <text x="64" y="390" font-size="9.5" font-weight="bold" fill="#581c87">⑤ 后端</text>
  <text x="64" y="408" font-size="8.5" fill="#334155">知道自己的容量极限</text>

  <rect x="190" y="368" width="252" height="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="202" y="390" font-size="8.5" fill="#334155">能硬限流、能拒收</text>
  <text x="202" y="408" font-size="8.5" fill="#64748b">429 让它重试，400 让它别试</text>

  <rect x="452" y="368" width="252" height="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="464" y="390" font-size="8.5" fill="#334155">不知道「丢哪条影响最小」</text>
  <text x="464" y="408" font-size="8.5" fill="#64748b">它连业务字段的含义都不知道</text>

  <rect x="714" y="368" width="250" height="52" fill="#f3e8ff" stroke="#9333ea" stroke-width="1" rx="6"/>
  <text x="726" y="390" font-size="8.5" fill="#581c87">Loki 4 MB/s → 429</text>
  <text x="726" y="408" font-size="8.5" fill="#581c87">单条 256 KB → 400，重试无用</text>

  <text x="52" y="444" font-size="8.5" fill="#334155">⭐ 完整方案一定是两侧配合：应用侧按重要性打标（P0~P3），采集器按速率执行丢弃。缺任何一侧，都会变成「随手丢」或「谁都不敢丢」。</text>
  <text x="52" y="460" font-size="8.5" fill="#64748b">五层里只有 ③ 同时具备「看得到速率」和「改得动行为」两个条件——这也是为什么背压总要落在采集器上。</text>

  <rect x="20" y="490" width="960" height="86" fill="#fff1f2" stroke="#f43f5e" stroke-width="1" rx="8"/>
  <text x="36" y="512" font-size="10.5" font-weight="bold" fill="#9f1239">两组实测读数：一组来自采集器，一组来自后端</text>
  <text x="36" y="532" font-size="8.5" fill="#334155">采集器（Fluent Bit 3.2.10，同一份配置只改 Storage.type）：memory 触发 paused (mem buf overlimit) + 15 次 flush 失败；filesystem 不暂停、92 次失败。</text>
  <text x="36" y="550" font-size="8.5" fill="#334155">后端（Loki 3.5.0）：速率上限 4 194 304 B/s，超了返回 429；单行上限 262 144 B，超了返回 400——400 这类错误重试永远不会成功，直接丢。</text>
  <text x="36" y="566" font-size="8.5" fill="#64748b">判据：429 说明「现在忙，等会再来」，400 说明「这条永远进不来」——把两者混成一个「写入失败」计数，扩容和改代码就会同时上。</text>
</svg>
