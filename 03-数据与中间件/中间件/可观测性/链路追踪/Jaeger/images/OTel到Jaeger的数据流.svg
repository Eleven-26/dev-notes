<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="jf1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">从 OTel 埋点到 Jaeger UI 的数据流</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">采集与协议标准化（OTel）+ 后端可替换（Jaeger v2 = OTel Collector 运行时）</text>

  <rect x="200" y="84" width="600" height="62" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">应用（OTel SDK 埋点）</text>
  <text x="500" y="132" text-anchor="middle" font-size="11.5" fill="#1e3a8a">产生 Trace / Span，并把 Context 注入请求头</text>

  <rect x="200" y="166" width="600" height="62" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="500" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">[可选] OTel Collector</text>
  <text x="500" y="214" text-anchor="middle" font-size="11.5" fill="#334155">统一接收 / 采样（含 tail sampling）/ 多路导出</text>

  <rect x="200" y="248" width="600" height="62" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="500" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Jaeger v2（运行时即 OTel Collector）</text>
  <text x="500" y="296" text-anchor="middle" font-size="11.5" fill="#14532d">一个进程 = Collector（接收）+ Query（查询）+ 内置 UI</text>

  <rect x="200" y="330" width="600" height="62" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="500" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Storage</text>
  <text x="500" y="378" text-anchor="middle" font-size="11.5" fill="#7c2d12">ClickHouse / Elasticsearch（Badger 仅本地 dev）</text>

  <rect x="200" y="412" width="600" height="62" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="438" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Jaeger UI :16686</text>
  <text x="500" y="460" text-anchor="middle" font-size="11.5" fill="#1e3a8a">按 trace_id / service / operation / tag 检索</text>

  <line x1="500" y1="146" x2="500" y2="166" stroke="#334155" stroke-width="1.6" marker-end="url(#jf1)"/>
  <text x="514" y="162" font-size="11.5" fill="#64748b">OTLP（gRPC:4317 / HTTP:4318）</text>
  <line x1="500" y1="228" x2="500" y2="248" stroke="#334155" stroke-width="1.6" marker-end="url(#jf1)"/>
  <text x="514" y="244" font-size="11.5" fill="#64748b">OTLP</text>
  <line x1="500" y1="310" x2="500" y2="330" stroke="#334155" stroke-width="1.6" marker-end="url(#jf1)"/>
  <text x="514" y="326" font-size="11.5" fill="#64748b">Span 写出</text>
  <line x1="500" y1="392" x2="500" y2="412" stroke="#334155" stroke-width="1.6" marker-end="url(#jf1)"/>
  <text x="514" y="408" font-size="11.5" fill="#64748b">查询</text>

  <rect x="20" y="490" width="960" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="36" y="516" font-size="12.5" fill="#0f172a">协议标准化：应用只认 OTLP，后端换 Jaeger / Tempo / SkyWalking 不用改埋点。</text>
  <text x="36" y="542" font-size="12.5" fill="#0f172a">⚠️ 传播标准化：跨服务用 W3C traceparent；头格式必须端到端一致，否则链路断成两段独立 trace。</text>
</svg>
