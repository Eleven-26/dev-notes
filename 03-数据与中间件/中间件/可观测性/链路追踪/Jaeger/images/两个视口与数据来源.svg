<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="e1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="e2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="570" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">两个视口：先搜后钻，界面每列都来自同一个 API</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">界面查不到时，直接用 curl 打对应端点，能立刻分出「后端没数据」还是「界面筛没了」</text>

  <rect x="50" y="88" width="380" height="168" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="66" y="114" font-size="13.5" font-weight="bold" fill="#1e3a8a">① 检索页（Search）</text>
  <text x="66" y="140" font-size="11.5" fill="#1e3a8a">Service → Operation（排序键前缀，便宜）</text>
  <text x="66" y="162" font-size="11.5" fill="#1e3a8a">Tags（数组扫描，贵）</text>
  <text x="66" y="184" font-size="11.5" fill="#1e3a8a">时间窗 / lookback（微秒，便宜）</text>
  <text x="66" y="206" font-size="11.5" fill="#1e3a8a">min / max Duration（后过滤）</text>
  <text x="66" y="234" font-size="11" fill="#b91c1c">输出：trace 列表，含总耗时与 span 数</text>

  <line x1="430" y1="172" x2="530" y2="172" stroke="#2563eb" stroke-width="2" marker-end="url(#e2)"/>
  <text x="446" y="162" font-size="10.5" fill="#2563eb">点开一条</text>

  <rect x="530" y="88" width="420" height="168" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="546" y="114" font-size="13.5" font-weight="bold" fill="#7c2d12">② 链路页（Trace Detail）</text>
  <text x="546" y="140" font-size="11.5" fill="#7c2d12">瀑布：找最长的一根（瓶颈）、找并排的几根（并发）</text>
  <text x="546" y="162" font-size="11.5" fill="#7c2d12">空档（gap）= 时间花在没埋点的地方</text>
  <text x="546" y="184" font-size="11.5" fill="#7c2d12">右侧三块：Tags / Logs / Process</text>
  <text x="546" y="206" font-size="11.5" fill="#7c2d12">Logs 就是 OTLP 的 events，事件名在 fields 里</text>
  <text x="546" y="234" font-size="11" fill="#b91c1c">根 span 的 references 为空，可用它判断链</text>

  <rect x="50" y="286" width="380" height="168" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="66" y="312" font-size="12.5" font-weight="bold" fill="#0f172a">检索页背后的三个端点</text>
  <text x="66" y="338" font-size="11" fill="#334155">GET /api/services → 服务下拉框</text>
  <text x="66" y="360" font-size="11" fill="#334155">GET /api/operations?service= → 操作下拉框</text>
  <text x="66" y="382" font-size="11" fill="#334155">GET /api/traces?service=&amp;limit=&amp;start=&amp;end=</text>
  <text x="66" y="404" font-size="10.5" fill="#475569">本机实测：services 返回 jaeger / order-service / zipkin-svc</text>
  <text x="66" y="426" font-size="10.5" fill="#b91c1c">start / end 传毫秒 → 200 但 data 为空</text>

  <rect x="530" y="286" width="420" height="168" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="546" y="312" font-size="12.5" font-weight="bold" fill="#0f172a">链路页背后的一个端点</text>
  <text x="546" y="338" font-size="11" fill="#334155">GET /api/traces/{traceID}</text>
  <text x="546" y="360" font-size="11" fill="#475569">返回顶层四个键：traceID / spans / processes / warnings</text>
  <text x="546" y="382" font-size="11" fill="#475569">processes 单独一张表，span 只存 processID</text>
  <text x="546" y="404" font-size="10.5" fill="#b91c1c">旧路径 /api/trace/{traceID} 在 v2 是 404（改复数）</text>
  <text x="546" y="426" font-size="10.5" fill="#475569">gRPC 面在同一进程的 16685，与 HTTP 等价</text>

  <rect x="50" y="474" width="900" height="76" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="66" y="498" font-size="12" font-weight="bold" fill="#7f1d1d">另外两个页面默认是空的，不是故障</text>
  <text x="66" y="520" font-size="11" fill="#334155">依赖图页 → /api/dependencies 返回 200 但 data 为空（v2.20 的 jaeger_storage 没有依赖计算配置项）</text>
  <text x="66" y="540" font-size="11" fill="#334155">监控页（SPM）→ /api/metrics/calls 返回 501 trace metrics are currently disabled - no metrics backend configured</text>
</svg>
