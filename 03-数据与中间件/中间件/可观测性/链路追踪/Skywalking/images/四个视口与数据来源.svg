<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a8" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="a8d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">四个视口与两条支线：先时间、再结构、后细节</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">每个视口只为回答一个问题而存在，混着看就会在无关的 trace 上耗时间</text>

  <rect x="30" y="84" width="215" height="110" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="46" y="110" font-size="13" font-weight="bold" fill="#1e3a8a">Dashboard</text>
  <text x="46" y="134" font-size="11" fill="#1e3a8a">整体有没有异常</text>
  <text x="46" y="156" font-size="11" fill="#1e3a8a">异常在哪个服务/接口</text>
  <text x="46" y="178" font-size="10.5" fill="#b91c1c">数据：OAL 分钟桶</text>

  <line x1="245" y1="139" x2="275" y2="139" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a8)"/>

  <rect x="275" y="84" width="215" height="110" rx="9" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="291" y="110" font-size="13" font-weight="bold" fill="#312e81">拓扑图</text>
  <text x="291" y="134" font-size="11" fill="#312e81">调用关系断没断</text>
  <text x="291" y="156" font-size="11" fill="#312e81">哪条边红了 / 缺了</text>
  <text x="291" y="178" font-size="10.5" fill="#b91c1c">数据：trace 推出的边</text>

  <line x1="490" y1="139" x2="520" y2="139" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a8)"/>

  <rect x="520" y="84" width="215" height="110" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="536" y="110" font-size="13" font-weight="bold" fill="#7c2d12">Trace</text>
  <text x="536" y="134" font-size="11" fill="#7c2d12">这次请求慢在哪一环</text>
  <text x="536" y="156" font-size="11" fill="#7c2d12">Duration 还是 Self 大</text>
  <text x="536" y="178" font-size="10.5" fill="#b91c1c">数据：原始 segment / span</text>

  <line x1="735" y1="139" x2="765" y2="139" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a8)"/>

  <rect x="765" y="84" width="205" height="110" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="781" y="110" font-size="13" font-weight="bold" fill="#14532d">Profile</text>
  <text x="781" y="134" font-size="11" fill="#14532d">卡在哪个方法</text>
  <text x="781" y="156" font-size="11" fill="#14532d">哪个线程栈</text>
  <text x="781" y="178" font-size="10.5" fill="#b91c1c">数据：运行期采样</text>

  <line x1="627" y1="194" x2="627" y2="222" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a8d)"/>

  <rect x="520" y="222" width="215" height="86" rx="9" fill="#f8fafc" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="536" y="246" font-size="12.5" font-weight="bold" fill="#7c2d12">日志（支线）</text>
  <text x="536" y="268" font-size="11" fill="#334155">当时业务在做什么</text>
  <text x="536" y="290" font-size="10.5" fill="#b91c1c">按 traceId 从 Trace 跳进来</text>

  <rect x="765" y="222" width="205" height="86" rx="9" fill="#f8fafc" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="781" y="246" font-size="12.5" font-weight="bold" fill="#7c2d12">告警（支线）</text>
  <text x="781" y="268" font-size="11" fill="#334155">什么时候开始坏的</text>
  <text x="781" y="290" font-size="10.5" fill="#b91c1c">定时间点后立刻跳走</text>

  <rect x="30" y="330" width="940" height="150" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="48" y="356" font-size="12.5" font-weight="bold" fill="#0f172a">读法上的三处硬区分</text>
  <text x="48" y="382" font-size="12" fill="#0f172a">① Duration 含子调用，Self Duration 才是自己花的；只有后者大才是真的慢或者真的卡住</text>
  <text x="48" y="406" font-size="12" fill="#0f172a">② 边红是慢 / 错，缺边是「根本不知道有这条调用」——后者只能往探针与透传方向查</text>
  <text x="48" y="430" font-size="12" fill="#0f172a">③ Apdex 阈值来自 service-apdex-threshold.yml，跨服务直接比数值没有意义</text>
  <text x="48" y="456" font-size="12" fill="#b91c1c">⚠️ 本机只验证到 UI 返回 200，未登录进面板，以上为面板结构说明而非实测读数</text>
</svg>
