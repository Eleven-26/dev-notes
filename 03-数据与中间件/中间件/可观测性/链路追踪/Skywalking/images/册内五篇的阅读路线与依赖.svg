<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">SkyWalking 册：五篇的阅读路线与依赖</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">主线按 ①→⑤ 读；四条支线只补自己缺的那一段</text>

  <rect x="60" y="86" width="420" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="78" y="112" font-size="13.5" font-weight="bold" fill="#1e3a8a">① 架构与部署</text>
  <text x="78" y="136" font-size="11.5" fill="#1e3a8a">四段架构 · OAL/MAL/LAL · 存储分组 · 三形态部署</text>

  <rect x="520" y="86" width="420" height="66" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="538" y="112" font-size="13.5" font-weight="bold" fill="#312e81">② 探针原理</text>
  <text x="538" y="136" font-size="11.5" fill="#312e81">javaAgent 五步 · 插件四阶段 · 队列两代 · 成本四象限</text>

  <line x1="480" y1="119" x2="520" y2="119" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="60" y="184" width="420" height="66" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="78" y="210" font-size="13.5" font-weight="bold" fill="#7c2d12">③ 协议与数据模型</text>
  <text x="78" y="234" font-size="11.5" fill="#7c2d12">sw8 八字段 · TraceSegment · GraphQL · 三格式映射</text>

  <rect x="520" y="184" width="420" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="538" y="210" font-size="13.5" font-weight="bold" fill="#14532d">④ UI 与排障</text>
  <text x="538" y="234" font-size="11.5" fill="#14532d">四视口 · 六面板 · 告警窗口 · 排障七问</text>

  <rect x="290" y="286" width="420" height="66" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="308" y="312" font-size="13.5" font-weight="bold" fill="#0f172a">⑤ 集成与生态</text>
  <text x="308" y="336" font-size="11.5" fill="#334155">OTLP/Zipkin 通道 · 插件矩阵 · 混跑断链 · 三档路线</text>

  <line x1="270" y1="250" x2="330" y2="286" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="730" y1="250" x2="670" y2="286" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="20" y="384" width="960" height="156" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="38" y="412" font-size="12.5" font-weight="bold" fill="#0f172a">四条支线：按目的取最短路径</text>
  <text x="38" y="438" font-size="11.5" fill="#334155">从零：本页第一节 → ① 一、二节 → 选型篇第二节（值不值得上）</text>
  <text x="38" y="462" font-size="11.5" fill="#334155">原理：② 一、二、四、七节（无侵入的代价与成本模型）</text>
  <text x="38" y="486" font-size="11.5" fill="#334155">排障：④ 第八节（七问）→ ③ 第二节（头字段）→ 各语言接入分册</text>
  <text x="38" y="510" font-size="11.5" fill="#334155">混跑：⑤ 一、二、七节 → 选型篇第六节（UI 与生态边界）</text>
  <text x="38" y="530" font-size="11" fill="#b91c1c">边界：接入代码不在本册，按语言拆到 01-编程语言/ 下的 接入Skywalking.md</text>
</svg>
