<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">1 小时窗口把故障稀释掉：14.4x 燃烧率要 165 秒才确认</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">故障在 t=0 开始、错误率 30%，之前有 1 小时 0.1% 的正常基线，SLO 99.9%</text>

  <line x1="140" y1="380" x2="900" y2="380" stroke="#334155" stroke-width="1.4"/>
  <line x1="140" y1="120" x2="140" y2="380" stroke="#334155" stroke-width="1.4"/>
  <text x="128" y="384" text-anchor="end" font-size="11.5" fill="#64748b">0</text>
  <text x="128" y="297" text-anchor="end" font-size="11.5" fill="#64748b">1%</text>
  <text x="128" y="210" text-anchor="end" font-size="11.5" fill="#64748b">2%</text>
  <text x="128" y="124" text-anchor="end" font-size="11.5" fill="#64748b">3%</text>
  <text x="120" y="106" text-anchor="middle" font-size="11" fill="#64748b">错误率</text>

  <text x="140" y="404" text-anchor="middle" font-size="11.5" fill="#64748b">0s</text>
  <text x="394" y="404" text-anchor="middle" font-size="11.5" fill="#64748b">100s</text>
  <text x="648" y="404" text-anchor="middle" font-size="11.5" fill="#64748b">200s</text>
  <text x="900" y="404" text-anchor="middle" font-size="11.5" fill="#64748b">300s</text>

  <line x1="140" y1="255" x2="900" y2="255" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="906" y="252" font-size="11.5" fill="#b91c1c">阈值 1.44%</text>
  <text x="906" y="270" font-size="11" fill="#b91c1c">等于 14.4x</text>

  <polyline points="140,371.3 393.3,299.3 646.7,227.4 900,155.4"
            fill="none" stroke="#2563eb" stroke-width="2.6"/>
  <circle cx="520" cy="263.4" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
  <circle cx="558" cy="252.6" r="5" fill="#16a34a" stroke="#ffffff" stroke-width="1.6"/>
  <text x="512" y="288" text-anchor="middle" font-size="11.5" fill="#1e40af">t=150s 读数 1.3500%</text>
  <text x="512" y="304" text-anchor="middle" font-size="11" fill="#64748b">低于阈值，不告警</text>
  <text x="575" y="236" font-size="11.5" fill="#15803d">t=165s 读数 1.4750%，触发</text>

  <line x1="558" y1="252.6" x2="558" y2="380" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="566" y="368" font-size="11.5" fill="#15803d">确认延迟 165 秒</text>

  <rect x="140" y="424" width="760" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="156" y="443" font-size="12" fill="#334155">要点：延迟 = (0.299 t + 3.6) / 3600 超过 1.44% 的解，t 约 173 秒；</text>
  <text x="156" y="461" font-size="12" fill="#334155">实测 165 秒触发，差值来自 15 秒采集对齐。要更快，只能加更短的窗口对。</text>
</svg>
