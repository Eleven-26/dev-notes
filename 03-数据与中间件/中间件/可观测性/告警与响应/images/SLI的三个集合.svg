<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1000" height="450" fill="#ffffff"/>

  <text x="60" y="44" font-size="18" font-weight="bold" fill="#1f2937">SLI 是一道除法：分母决定保护谁，分子决定什么叫失败</text>
  <text x="60" y="70" font-size="13" fill="#6b7280">同一个服务换一种口径，就能算出两个不同的 99.9%</text>

  <rect x="60" y="92" width="880" height="290" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="78" y="118" font-size="14" font-weight="bold" fill="#374151">所有到达服务端的请求</text>

  <rect x="80" y="134" width="240" height="150" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="200" y="162" font-size="14" font-weight="bold" fill="#4b5563" text-anchor="middle">排除流量</text>
  <text x="200" y="190" font-size="12.5" fill="#6b7280" text-anchor="middle">健康检查 / 静态资源</text>
  <text x="200" y="214" font-size="12.5" fill="#6b7280" text-anchor="middle">爬虫 / 压测流量</text>
  <text x="200" y="238" font-size="12.5" fill="#6b7280" text-anchor="middle">监控自检请求</text>
  <text x="200" y="268" font-size="12" fill="#9ca3af" text-anchor="middle">混进来会稀释 SLO</text>

  <line x1="338" y1="140" x2="338" y2="340" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="348" y="134" font-size="11.5" fill="#9ca3af">此处断开</text>

  <rect x="360" y="128" width="560" height="220" rx="6" fill="#eaf2fb" stroke="#2c6fbb" stroke-width="1.5"/>
  <text x="640" y="156" font-size="14" font-weight="bold" fill="#1b4f8a" text-anchor="middle">有效事件 = 分母</text>

  <rect x="380" y="180" width="250" height="88" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="505" y="208" font-size="14" font-weight="bold" fill="#1b5e20" text-anchor="middle">好事件 = 分子</text>
  <text x="505" y="234" font-size="11.5" fill="#2e7d32" text-anchor="middle">非 5xx 且未超时</text>

  <rect x="660" y="180" width="240" height="88" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="780" y="208" font-size="14" font-weight="bold" fill="#7b241c" text-anchor="middle">坏事件</text>
  <text x="780" y="234" font-size="11.5" fill="#c0392b" text-anchor="middle">5xx / 超时 / 系统误判 4xx</text>

  <text x="640" y="316" font-size="12.5" fill="#1b4f8a" text-anchor="middle">SLI = 好事件 ÷ 有效事件；坏事件消耗错误预算</text>

  <text x="60" y="420" font-size="13" fill="#374151">4xx 按原因分：用户传错参数不算失败，鉴权服务挂了导致的 401 才算。</text>
</svg>
