<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#334155"/>
    </marker>
  </defs>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">40 条告警到 1 条通知：四道闸各管一段</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">20 个分片同时报错、20 个分片延迟升高，Alertmanager 0.34.1 三组配置实测</text>

  <rect x="30" y="96" width="200" height="150" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="130" y="126" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#991b1b">① 规则命中</text>
  <text x="130" y="164" text-anchor="middle" font-size="30" font-weight="bold" fill="#b91c1c">40</text>
  <text x="130" y="188" text-anchor="middle" font-size="11.5" fill="#991b1b">个 alert 实例</text>
  <text x="130" y="214" text-anchor="middle" font-size="11" fill="#7f1d1d">20 分片 x 2 条规则</text>
  <text x="130" y="232" text-anchor="middle" font-size="11" fill="#7f1d1d">shard 0 到 19</text>

  <rect x="270" y="96" width="200" height="150" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="370" y="126" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#854d0e">② 分组</text>
  <text x="370" y="164" text-anchor="middle" font-size="30" font-weight="bold" fill="#a16207">2</text>
  <text x="370" y="188" text-anchor="middle" font-size="11.5" fill="#854d0e">条通知</text>
  <text x="370" y="214" text-anchor="middle" font-size="11" fill="#713f12">group_by alertname</text>
  <text x="370" y="232" text-anchor="middle" font-size="11" fill="#713f12">每条携带 20 个告警</text>

  <rect x="510" y="96" width="200" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="610" y="126" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#15803d">③ 抑制</text>
  <text x="610" y="164" text-anchor="middle" font-size="30" font-weight="bold" fill="#15803d">1</text>
  <text x="610" y="188" text-anchor="middle" font-size="11.5" fill="#15803d">条通知</text>
  <text x="610" y="214" text-anchor="middle" font-size="11" fill="#166534">critical 压掉 warning</text>
  <text x="610" y="232" text-anchor="middle" font-size="11" fill="#166534">equal shard 对齐同分片</text>

  <rect x="750" y="96" width="220" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="860" y="126" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">④ 路由与重发</text>
  <text x="860" y="160" text-anchor="middle" font-size="13" fill="#1d4ed8">critical 到值班</text>
  <text x="860" y="184" text-anchor="middle" font-size="11.5" fill="#1e40af">首发送达后</text>
  <text x="860" y="204" text-anchor="middle" font-size="11.5" fill="#1e40af">每 repeat_interval 重发</text>
  <text x="860" y="228" text-anchor="middle" font-size="11" fill="#1e3a8a">1m 间隔下 150 秒发 2 次</text>

  <line x1="232" y1="171" x2="266" y2="171" stroke="#334155" stroke-width="1.8" marker-end="url(#a1)"/>
  <line x1="472" y1="171" x2="506" y2="171" stroke="#334155" stroke-width="1.8" marker-end="url(#a1)"/>
  <line x1="712" y1="171" x2="746" y2="171" stroke="#334155" stroke-width="1.8" marker-end="url(#a1)"/>

  <rect x="30" y="272" width="940" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="294" font-size="12" font-weight="bold" fill="#0f172a">分组维度选错的代价（同一次故障，只改 group_by 与抑制）</text>
  <text x="46" y="316" font-size="12" fill="#334155">group_by 加 shard、不加抑制：40 条通知，每条 1 个告警，值班手机震 40 次</text>
  <text x="46" y="336" font-size="12" fill="#334155">group_by 只留 alertname、加抑制：1 条通知，20 个告警在同一条消息里，一眼看出是全局问题</text>

  <rect x="30" y="372" width="940" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="394" font-size="12" fill="#334155">要点：分组决定「一次通知装几个告警」，抑制决定「哪些告警根本不该通知」，</text>
  <text x="46" y="414" font-size="12" fill="#334155">重发间隔决定「同一条告警被提醒几次」。三者独立可调，先调分组再调阈值。</text>
</svg>
