<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>

  <text x="60" y="44" font-size="18" font-weight="bold" fill="#1f2937">同一场故障，两个窗口读出两个燃烧率</text>

  <rect x="100" y="90" width="672" height="60" fill="#eaf7ef" stroke="#2f8f5b" stroke-width="1.5"/>
  <rect x="772" y="90" width="168" height="60" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="436" y="126" font-size="13" fill="#1d6b45" text-anchor="middle">基线 6000 请求/分钟，全部成功</text>
  <text x="856" y="118" font-size="13" fill="#7b241c" text-anchor="middle">故障段</text>
  <text x="856" y="138" font-size="13" fill="#7b241c" text-anchor="middle">1800 错误/分钟</text>

  <line x1="772" y1="86" x2="772" y2="320" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="772" y="80" font-size="12" fill="#c0392b" text-anchor="middle">第 60 分钟：故障开始</text>

  <line x1="100" y1="180" x2="940" y2="180" stroke="#374151" stroke-width="1.5"/>
  <polygon points="940,180 928,175 928,185" fill="#374151"/>
  <line x1="100" y1="174" x2="100" y2="186" stroke="#374151" stroke-width="1.5"/>
  <line x1="436" y1="174" x2="436" y2="186" stroke="#374151" stroke-width="1.5"/>
  <line x1="772" y1="174" x2="772" y2="186" stroke="#374151" stroke-width="1.5"/>
  <line x1="884" y1="174" x2="884" y2="186" stroke="#374151" stroke-width="1.5"/>
  <text x="100" y="204" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="436" y="204" font-size="12" fill="#6b7280" text-anchor="middle">30 分</text>
  <text x="772" y="204" font-size="12" fill="#6b7280" text-anchor="middle">60 分</text>
  <text x="884" y="204" font-size="12" fill="#6b7280" text-anchor="middle">70 分</text>
  <text x="936" y="204" font-size="12" fill="#6b7280" text-anchor="end">时间</text>

  <line x1="212" y1="250" x2="884" y2="250" stroke="#2c6fbb" stroke-width="2"/>
  <line x1="212" y1="240" x2="212" y2="260" stroke="#2c6fbb" stroke-width="2"/>
  <line x1="884" y1="240" x2="884" y2="260" stroke="#2c6fbb" stroke-width="2"/>
  <text x="548" y="236" font-size="13" fill="#1b4f8a" text-anchor="middle">1 小时窗口：50 分钟正常 + 10 分钟故障</text>

  <line x1="828" y1="300" x2="884" y2="300" stroke="#c0392b" stroke-width="2"/>
  <line x1="828" y1="290" x2="828" y2="310" stroke="#c0392b" stroke-width="2"/>
  <line x1="884" y1="290" x2="884" y2="310" stroke="#c0392b" stroke-width="2"/>
  <text x="820" y="292" font-size="13" fill="#7b241c" text-anchor="end">5 分钟窗口：全在故障段内</text>

  <rect x="100" y="340" width="380" height="80" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="116" y="370" font-size="14" font-weight="bold" fill="#7b241c">5 分钟窗口（65~70 分）</text>
  <text x="116" y="398" font-size="13" fill="#7b241c">错误率 0.2308 → 燃烧率 230.8</text>

  <rect x="520" y="340" width="380" height="80" rx="6" fill="#eaf2fb" stroke="#2c6fbb" stroke-width="1.5"/>
  <text x="536" y="370" font-size="14" font-weight="bold" fill="#1b4f8a">1 小时窗口（10~70 分）</text>
  <text x="536" y="398" font-size="13" fill="#1b4f8a">错误率 0.0476 → 燃烧率 47.6</text>

  <text x="60" y="452" font-size="13" fill="#6b7280">同一场故障，两个读数差近 5 倍：差的不是故障强度，而是窗口里正常流量占多少。</text>
</svg>
