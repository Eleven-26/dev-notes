<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="60" y="44" font-size="18" font-weight="bold" fill="#1f2937">两条时钟：先恢复，再根因</text>

  <text x="60" y="100" font-size="15" font-weight="bold" fill="#c0392b">恢复时钟（分钟级）</text>
  <text x="560" y="200" font-size="15" font-weight="bold" fill="#2c6fbb">根因时钟（天~周级）</text>

  <rect x="150" y="115" width="88" height="56" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="194" y="149" font-size="14" fill="#7b241c" text-anchor="middle">发现</text>
  <rect x="242" y="115" width="88" height="56" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="286" y="149" font-size="14" fill="#7b241c" text-anchor="middle">宣布</text>
  <rect x="334" y="115" width="88" height="56" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="378" y="149" font-size="14" fill="#7b241c" text-anchor="middle">止损</text>
  <rect x="426" y="115" width="88" height="56" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="470" y="149" font-size="14" fill="#7b241c" text-anchor="middle">恢复</text>

  <rect x="530" y="215" width="100" height="56" rx="6" fill="#eaf2fb" stroke="#2c6fbb" stroke-width="1.5"/>
  <text x="580" y="249" font-size="14" fill="#1b4f8a" text-anchor="middle">定位</text>
  <rect x="634" y="215" width="100" height="56" rx="6" fill="#eaf2fb" stroke="#2c6fbb" stroke-width="1.5"/>
  <text x="684" y="249" font-size="14" fill="#1b4f8a" text-anchor="middle">复盘</text>
  <rect x="738" y="215" width="100" height="56" rx="6" fill="#eaf2fb" stroke="#2c6fbb" stroke-width="1.5"/>
  <text x="788" y="249" font-size="14" fill="#1b4f8a" text-anchor="middle">行动项</text>
  <rect x="842" y="215" width="100" height="56" rx="6" fill="#eaf2fb" stroke="#2c6fbb" stroke-width="1.5"/>
  <text x="892" y="249" font-size="14" fill="#1b4f8a" text-anchor="middle">验收</text>

  <line x1="520" y1="85" x2="520" y2="390" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="528" y="96" font-size="13" fill="#6b7280">服务恢复 = 分界</text>

  <text x="300" y="200" font-size="13" fill="#6b7280" text-anchor="middle">用户不受影响之前，恢复动作优先</text>
  <text x="740" y="305" font-size="13" fill="#6b7280" text-anchor="middle">服务恢复之后，才把根因查到底</text>

  <line x1="60" y1="390" x2="960" y2="390" stroke="#374151" stroke-width="1.5"/>
  <polygon points="960,390 948,385 948,395" fill="#374151"/>
  <text x="920" y="412" font-size="13" fill="#374151">时间</text>

  <rect x="60" y="330" width="430" height="40" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="72" y="356" font-size="13" fill="#92400e">止损前先留证据：日志片段、trace_id、变更记录</text>

  <text x="60" y="448" font-size="13" fill="#6b7280">两个时钟串行而不是并行：在恢复时钟里做根因分析，等于让用户继续受影响。</text>
</svg>
