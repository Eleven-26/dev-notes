<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>

  <text x="60" y="44" font-size="18" font-weight="bold" fill="#1f2937">根因写三层，行动项才有三个时间尺度</text>
  <text x="60" y="70" font-size="13" fill="#6b7280">只写直接原因，行动项就只剩「改回去」；三层都写，才会改到流程</text>

  <rect x="60" y="96" width="600" height="76" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="76" y="126" font-size="15" font-weight="bold" fill="#7b241c">直接原因</text>
  <text x="76" y="150" font-size="12.5" fill="#c0392b">什么触发了故障：一次配置推送把连接池上限改成 10</text>

  <rect x="60" y="182" width="600" height="76" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="76" y="212" font-size="15" font-weight="bold" fill="#92400e">促成条件</text>
  <text x="76" y="236" font-size="12.5" fill="#92400e">为什么影响这么大：没有配置校验、没有灰度、回滚要 20 分钟</text>

  <rect x="60" y="268" width="600" height="76" rx="6" fill="#eaf2fb" stroke="#2c6fbb" stroke-width="1.5"/>
  <text x="76" y="298" font-size="15" font-weight="bold" fill="#1b4f8a">系统性缺口</text>
  <text x="76" y="322" font-size="12.5" fill="#1b4f8a">为什么条件一直存在：变更流程允许直接改生产、容量评审没覆盖连接数</text>

  <line x1="660" y1="134" x2="696" y2="134" stroke="#c0392b" stroke-width="1.5"/>
  <polygon points="698,134 688,129 688,139" fill="#c0392b"/>
  <line x1="660" y1="220" x2="696" y2="220" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="698,220 688,215 688,225" fill="#f59e0b"/>
  <line x1="660" y1="306" x2="696" y2="306" stroke="#2c6fbb" stroke-width="1.5"/>
  <polygon points="698,306 688,301 688,311" fill="#2c6fbb"/>

  <rect x="700" y="96" width="240" height="76" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="716" y="126" font-size="14" font-weight="bold" fill="#7b241c">24~72 小时</text>
  <text x="716" y="150" font-size="12" fill="#6b7280">改回去 + 立即能补的防线</text>

  <rect x="700" y="182" width="240" height="76" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="716" y="212" font-size="14" font-weight="bold" fill="#92400e">1~2 个迭代</text>
  <text x="716" y="236" font-size="12" fill="#6b7280">校验、灰度、回滚演练</text>

  <rect x="700" y="268" width="240" height="76" rx="6" fill="#ffffff" stroke="#2c6fbb" stroke-width="1.5"/>
  <text x="716" y="298" font-size="14" font-weight="bold" fill="#1b4f8a">季度治理</text>
  <text x="716" y="322" font-size="12" fill="#6b7280">流程与平台能力</text>

  <text x="60" y="390" font-size="13" fill="#374151">行动项只到「直接原因」那一层，同类事故三个月后原样复发。</text>
</svg>
