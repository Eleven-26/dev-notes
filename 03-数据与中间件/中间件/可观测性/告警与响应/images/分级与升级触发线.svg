<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="555" viewBox="0 0 1000 555" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1000" height="555" fill="#ffffff"/>

  <text x="60" y="44" font-size="18" font-weight="bold" fill="#1f2937">三个维度定档，一张触发线决定叫谁</text>
  <text x="60" y="70" font-size="13" fill="#6b7280">维度先高后低、宁可升级过度；级别随时复核，升得快、降得慢</text>

  <rect x="60" y="100" width="280" height="64" rx="6" fill="#eaf2fb" stroke="#2c6fbb" stroke-width="1.5"/>
  <text x="76" y="126" font-size="15" font-weight="bold" fill="#1b4f8a">影响面</text>
  <text x="76" y="148" font-size="12.5" fill="#1b4f8a">多少用户 / 是否核心链路 / 是否涉及资金</text>

  <rect x="60" y="180" width="280" height="64" rx="6" fill="#eaf2fb" stroke="#2c6fbb" stroke-width="1.5"/>
  <text x="76" y="206" font-size="15" font-weight="bold" fill="#1b4f8a">严重度</text>
  <text x="76" y="228" font-size="12.5" fill="#1b4f8a">完全不可用还是部分降级；数据错误升一档</text>

  <rect x="60" y="260" width="280" height="64" rx="6" fill="#eaf2fb" stroke="#2c6fbb" stroke-width="1.5"/>
  <text x="76" y="286" font-size="15" font-weight="bold" fill="#1b4f8a">可绕过性</text>
  <text x="76" y="308" font-size="12.5" fill="#1b4f8a">用户或客服有没有临时替代入口</text>

  <line x1="340" y1="132" x2="356" y2="132" stroke="#2c6fbb" stroke-width="1.5"/>
  <line x1="340" y1="212" x2="356" y2="212" stroke="#2c6fbb" stroke-width="1.5"/>
  <line x1="340" y1="292" x2="356" y2="292" stroke="#2c6fbb" stroke-width="1.5"/>
  <line x1="356" y1="132" x2="356" y2="292" stroke="#2c6fbb" stroke-width="1.5"/>
  <line x1="356" y1="212" x2="376" y2="212" stroke="#2c6fbb" stroke-width="1.5"/>
  <polygon points="378,212 368,207 368,217" fill="#2c6fbb"/>

  <rect x="380" y="170" width="210" height="86" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="485" y="198" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">定档 P0 ~ P3</text>
  <text x="485" y="226" font-size="12.5" fill="#92400e" text-anchor="middle">三个维度先高后低</text>

  <line x1="485" y1="256" x2="485" y2="298" stroke="#7c3aed" stroke-width="1.5"/>
  <polygon points="485,300 480,290 490,290" fill="#7c3aed"/>

  <rect x="380" y="300" width="210" height="80" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="485" y="328" font-size="15" font-weight="bold" fill="#5b21b6" text-anchor="middle">每 15 分钟复核</text>
  <text x="485" y="354" font-size="12.5" fill="#5b21b6" text-anchor="middle">影响面缩小才降级</text>

  <line x1="590" y1="212" x2="618" y2="212" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="620,212 610,207 610,217" fill="#6b7280"/>

  <rect x="620" y="100" width="320" height="300" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="634" y="126" font-size="13" font-weight="bold" fill="#374151">档位</text>
  <text x="686" y="126" font-size="13" font-weight="bold" fill="#374151">响应时限</text>
  <text x="806" y="126" font-size="13" font-weight="bold" fill="#374151">谁必须到场</text>
  <line x1="632" y1="138" x2="928" y2="138" stroke="#d1d5db" stroke-width="1"/>

  <text x="634" y="164" font-size="13" font-weight="bold" fill="#c0392b">P0</text>
  <text x="686" y="164" font-size="12" fill="#c0392b">立即 7×24 叫醒</text>
  <text x="806" y="164" font-size="11.5" fill="#c0392b">IC + 业务 + 值班主管</text>
  <line x1="632" y1="180" x2="928" y2="180" stroke="#e5e7eb" stroke-width="1"/>

  <text x="634" y="210" font-size="13" font-weight="bold" fill="#d97706">P1</text>
  <text x="686" y="210" font-size="12" fill="#d97706">15 分钟</text>
  <text x="806" y="210" font-size="11.5" fill="#d97706">IC + 模块 owner</text>
  <line x1="632" y1="226" x2="928" y2="226" stroke="#e5e7eb" stroke-width="1"/>

  <text x="634" y="256" font-size="13" font-weight="bold" fill="#374151">P2</text>
  <text x="686" y="256" font-size="12" fill="#374151">工时 2 小时</text>
  <text x="806" y="256" font-size="11.5" fill="#374151">模块 owner</text>
  <line x1="632" y1="272" x2="928" y2="272" stroke="#e5e7eb" stroke-width="1"/>

  <text x="634" y="302" font-size="13" font-weight="bold" fill="#6b7280">P3</text>
  <text x="686" y="302" font-size="12" fill="#6b7280">下一工作日</text>
  <text x="806" y="302" font-size="11.5" fill="#6b7280">提单人</text>

  <text x="634" y="380" font-size="12" fill="#6b7280">涉及资金、订单状态、权限判定的错误，至少按高一级处理。</text>

  <rect x="60" y="430" width="880" height="74" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="76" y="454" font-size="14" font-weight="bold" fill="#065f46">升级触发线（升级不是失败）</text>
  <text x="76" y="482" font-size="12.5" fill="#065f46">15 分钟无实质进展 → 二线 / 模块 owner；30 分钟需跨团队决策 → 值班主管；1 小时未恢复 → 全员事故模式</text>

  <text x="60" y="535" font-size="13" fill="#374151">先按高一级把人拉起来，确认影响面小再降级：降级可以慢，升级必须快。</text>
</svg>
