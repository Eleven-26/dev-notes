<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>

  <text x="60" y="44" font-size="18" font-weight="bold" fill="#1f2937">预算剩余决定发布放行：档位越低，放行人越高级</text>

  <text x="290" y="80" font-size="14" font-weight="bold" fill="#374151">触发与动作</text>
  <text x="640" y="80" font-size="14" font-weight="bold" fill="#374151">谁能放行 / 必须留痕</text>

  <rect x="60" y="196" width="150" height="88" rx="8" fill="#eef2f7" stroke="#374151" stroke-width="1.5"/>
  <text x="135" y="232" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">当前预算剩余</text>
  <text x="135" y="256" font-size="13" fill="#4b5563" text-anchor="middle">滚动 30 天</text>

  <path d="M210 240 H250 V126 H284" fill="none" stroke="#374151" stroke-width="1.5"/>
  <path d="M210 240 H250 V218 H284" fill="none" stroke="#374151" stroke-width="1.5"/>
  <path d="M210 240 H250 V310 H284" fill="none" stroke="#374151" stroke-width="1.5"/>
  <path d="M210 240 H250 V402 H284" fill="none" stroke="#374151" stroke-width="1.5"/>
  <polygon points="290,126 282,121 282,131" fill="#374151"/>
  <polygon points="290,218 282,213 282,223" fill="#374151"/>
  <polygon points="290,310 282,305 282,315" fill="#374151"/>
  <polygon points="290,402 282,397 282,407" fill="#374151"/>

  <rect x="290" y="92" width="300" height="68" rx="6" fill="#eaf7ef" stroke="#2f8f5b" stroke-width="1.5"/>
  <text x="302" y="118" font-size="14" font-weight="bold" fill="#1d6b45">预算剩余 ≥ 50%</text>
  <text x="302" y="140" font-size="13" fill="#1d6b45">正常发布，只走常规灰度</text>

  <rect x="290" y="184" width="300" height="68" rx="6" fill="#fdf6e3" stroke="#b7791f" stroke-width="1.5"/>
  <text x="302" y="210" font-size="14" font-weight="bold" fill="#8a5a12">剩余 10% ~ 50%</text>
  <text x="302" y="232" font-size="13" fill="#8a5a12">月度复核：复盘主要成因</text>

  <rect x="290" y="276" width="300" height="68" rx="6" fill="#fff1e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="302" y="302" font-size="14" font-weight="bold" fill="#9c4221">剩余 &lt; 10%</text>
  <text x="302" y="324" font-size="13" fill="#9c4221">暂停非必要变更，发布需评审</text>

  <rect x="290" y="368" width="300" height="68" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="302" y="394" font-size="14" font-weight="bold" fill="#7b241c">预算为负</text>
  <text x="302" y="416" font-size="13" fill="#7b241c">冻结：只允许修复与可靠性变更</text>

  <path d="M590 126 H634" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M590 218 H634" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M590 310 H634" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M590 402 H634" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="640,126 632,121 632,131" fill="#9ca3af"/>
  <polygon points="640,218 632,213 632,223" fill="#9ca3af"/>
  <polygon points="640,310 632,305 632,315" fill="#9ca3af"/>
  <polygon points="640,402 632,397 632,407" fill="#9ca3af"/>

  <rect x="640" y="92" width="300" height="68" rx="6" fill="#eaf7ef" stroke="#2f8f5b" stroke-width="1.5"/>
  <text x="652" y="118" font-size="13" fill="#1d6b45">放行：团队负责人</text>
  <text x="652" y="140" font-size="13" fill="#1d6b45">留痕：无额外要求</text>

  <rect x="640" y="184" width="300" height="68" rx="6" fill="#fdf6e3" stroke="#b7791f" stroke-width="1.5"/>
  <text x="652" y="210" font-size="13" fill="#8a5a12">放行：团队负责人</text>
  <text x="652" y="232" font-size="13" fill="#8a5a12">留痕：复盘结论与行动项</text>

  <rect x="640" y="276" width="300" height="68" rx="6" fill="#fff1e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="652" y="302" font-size="13" fill="#9c4221">放行：研发负责人 + SRE</text>
  <text x="652" y="324" font-size="13" fill="#9c4221">留痕：评审结论与灰度方案</text>

  <rect x="640" y="368" width="300" height="68" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="652" y="394" font-size="13" fill="#7b241c">放行：业务负责人书面豁免</text>
  <text x="652" y="416" font-size="13" fill="#7b241c">留痕：风险、范围与回滚预案</text>

  <text x="60" y="458" font-size="13" fill="#6b7280">三档政策的差别不在动作，而在放行者逐级上收；每次豁免都要留下书面风险记录。</text>
</svg>
