<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1000" height="380" fill="#ffffff"/>

  <text x="60" y="44" font-size="18" font-weight="bold" fill="#1f2937">批处理的两个参数：一个决定何时发，一个决定切多大</text>

  <rect x="40" y="100" width="150" height="150" rx="8" fill="#eef2f7" stroke="#374151" stroke-width="1.5"/>
  <text x="115" y="158" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">一次送达</text>
  <text x="115" y="184" font-size="14" fill="#1f2937" text-anchor="middle">100 个 span</text>
  <text x="115" y="208" font-size="12" fill="#6b7280" text-anchor="middle">单个 OTLP 请求</text>

  <path d="M190 150 H240 V132 H270" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M190 200 H240 V262 H270" fill="none" stroke="#9ca3af" stroke-width="1.5"/>

  <text x="270" y="120" font-size="13" font-weight="bold" fill="#7b241c">只配 send_batch_size: 10</text>
  <rect x="270" y="128" width="670" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="605" y="150" font-size="13" fill="#7b241c" text-anchor="middle">1 个批次 × 100 个 span（count=1，sum=100）</text>

  <text x="270" y="250" font-size="13" font-weight="bold" fill="#1d6b45">再加 send_batch_max_size: 10</text>
  <rect x="270" y="258" width="63" height="34" rx="4" fill="#eaf7ef" stroke="#2f8f5b" stroke-width="1.5"/>
  <rect x="338" y="258" width="63" height="34" rx="4" fill="#eaf7ef" stroke="#2f8f5b" stroke-width="1.5"/>
  <rect x="406" y="258" width="63" height="34" rx="4" fill="#eaf7ef" stroke="#2f8f5b" stroke-width="1.5"/>
  <rect x="474" y="258" width="63" height="34" rx="4" fill="#eaf7ef" stroke="#2f8f5b" stroke-width="1.5"/>
  <rect x="542" y="258" width="63" height="34" rx="4" fill="#eaf7ef" stroke="#2f8f5b" stroke-width="1.5"/>
  <rect x="610" y="258" width="63" height="34" rx="4" fill="#eaf7ef" stroke="#2f8f5b" stroke-width="1.5"/>
  <rect x="678" y="258" width="63" height="34" rx="4" fill="#eaf7ef" stroke="#2f8f5b" stroke-width="1.5"/>
  <rect x="746" y="258" width="63" height="34" rx="4" fill="#eaf7ef" stroke="#2f8f5b" stroke-width="1.5"/>
  <rect x="814" y="258" width="63" height="34" rx="4" fill="#eaf7ef" stroke="#2f8f5b" stroke-width="1.5"/>
  <rect x="882" y="258" width="58" height="34" rx="4" fill="#eaf7ef" stroke="#2f8f5b" stroke-width="1.5"/>
  <text x="301" y="280" font-size="12" fill="#1d6b45" text-anchor="middle">10</text>
  <text x="369" y="280" font-size="12" fill="#1d6b45" text-anchor="middle">10</text>
  <text x="437" y="280" font-size="12" fill="#1d6b45" text-anchor="middle">10</text>
  <text x="505" y="280" font-size="12" fill="#1d6b45" text-anchor="middle">10</text>
  <text x="573" y="280" font-size="12" fill="#1d6b45" text-anchor="middle">10</text>
  <text x="641" y="280" font-size="12" fill="#1d6b45" text-anchor="middle">10</text>
  <text x="709" y="280" font-size="12" fill="#1d6b45" text-anchor="middle">10</text>
  <text x="777" y="280" font-size="12" fill="#1d6b45" text-anchor="middle">10</text>
  <text x="845" y="280" font-size="12" fill="#1d6b45" text-anchor="middle">10</text>
  <text x="911" y="280" font-size="12" fill="#1d6b45" text-anchor="middle">10</text>

  <text x="60" y="322" font-size="13" fill="#6b7280">send_batch_size 是触发阈值：攒够就发，但发的是当前缓冲里的全部内容，不切包。</text>
  <text x="60" y="348" font-size="13" fill="#6b7280">send_batch_max_size 才是单批上限，且必须 ≥ send_batch_size，否则启动直接报错。</text>
</svg>
