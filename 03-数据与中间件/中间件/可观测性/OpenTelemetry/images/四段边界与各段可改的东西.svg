<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <rect x="0" y="64" width="1000" height="406" fill="#ffffff" fill-opacity="0"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">从埋点到落库的四段边界：每段能改的东西不一样</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">判断一个需求该放哪一段，只问一句：要不要动业务代码</text>

  <rect x="26" y="86" width="228" height="212" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="140" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">① 进程内</text>
  <text x="140" y="140" text-anchor="middle" font-size="11.5" fill="#1d4ed8">业务代码 → API → SDK</text>
  <text x="140" y="166" text-anchor="middle" font-size="11.5" fill="#1d4ed8">能改：埋点位置、属性</text>
  <text x="140" y="188" text-anchor="middle" font-size="11.5" fill="#1d4ed8">能改：采样初判</text>
  <text x="140" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">改了要发版</text>
  <text x="140" y="244" text-anchor="middle" font-size="11.5" fill="#1d4ed8">谁控制：业务团队</text>
  <text x="140" y="270" text-anchor="middle" font-size="11.5" fill="#1d4ed8">成本：最高</text>

  <rect x="266" y="86" width="228" height="212" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="380" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">② 首跳</text>
  <text x="380" y="140" text-anchor="middle" font-size="11.5" fill="#166534">SDK exporter → Collector</text>
  <text x="380" y="166" text-anchor="middle" font-size="11.5" fill="#166534">能改：传输协议（gRPC/HTTP）</text>
  <text x="380" y="188" text-anchor="middle" font-size="11.5" fill="#166534">能改：目标地址、压缩</text>
  <text x="380" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">改配置即可，不改代码</text>
  <text x="380" y="244" text-anchor="middle" font-size="11.5" fill="#166534">谁控制：平台团队</text>
  <text x="380" y="270" text-anchor="middle" font-size="11.5" fill="#166534">风险：主机名写错看不出根因</text>

  <rect x="506" y="86" width="228" height="212" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="620" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">③ 采集器内</text>
  <text x="620" y="140" text-anchor="middle" font-size="11.5" fill="#92400e">processor 与 pipeline</text>
  <text x="620" y="166" text-anchor="middle" font-size="11.5" fill="#92400e">能改：属性改写、过滤</text>
  <text x="620" y="188" text-anchor="middle" font-size="11.5" fill="#92400e">能改：采样、路由</text>
  <text x="620" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">改 YAML 即全局生效</text>
  <text x="620" y="244" text-anchor="middle" font-size="11.5" fill="#92400e">唯一能跨信号处理的位置</text>
  <text x="620" y="270" text-anchor="middle" font-size="11.5" fill="#92400e">成本：最低（改配置重启）</text>

  <rect x="746" y="86" width="228" height="212" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="860" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">④ 落库</text>
  <text x="860" y="140" text-anchor="middle" font-size="11.5" fill="#334155">Collector exporter → 后端</text>
  <text x="860" y="166" text-anchor="middle" font-size="11.5" fill="#334155">能改：编码、目标后端</text>
  <text x="860" y="188" text-anchor="middle" font-size="11.5" fill="#334155">能改：批量与重试</text>
  <text x="860" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">从这里开始失去通用性</text>
  <text x="860" y="244" text-anchor="middle" font-size="11.5" fill="#334155">后端模型说了算</text>
  <text x="860" y="270" text-anchor="middle" font-size="11.5" fill="#334155">例：Prometheus 削 resource</text>

  <line x1="140" y1="298" x2="140" y2="316" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="380" y1="298" x2="380" y2="316" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="620" y1="298" x2="620" y2="316" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="860" y1="298" x2="860" y2="316" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="26" y="316" width="948" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="340" font-size="12.5" font-weight="bold" fill="#0f172a">判定顺序</text>
  <text x="130" y="340" font-size="11.5" fill="#334155">要不要动业务代码 → 要，就是第①段；不要，就往下走。采样率、resource 归一、属性清洗这三件最常改的事都落在第③段。</text>
  <text x="130" y="362" font-size="11.5" fill="#b91c1c">⚠️ 第④段反直觉：同一条 OTLP 指标经 Prometheus exporter 出去，service.name 改名成 job、其余属性整条丢弃，且不报错。</text>

  <line x1="20" y1="398" x2="980" y2="398" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="26" y="404" width="948" height="54" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="422" font-size="13" fill="#0f172a">要点：前三段是「OTel 地盘」，第四段开始由各家后端的模型说了算——所以换后端的成本集中在这里，不集中在埋点。</text>
  <text x="30" y="446" font-size="12" fill="#64748b">四段里只有第②③④段可以「改一处全局生效」，这也是引入 Collector 的唯一理由。</text>
</svg>
