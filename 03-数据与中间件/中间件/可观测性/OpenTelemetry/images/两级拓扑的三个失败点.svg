<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>
  <rect x="0" y="64" width="1000" height="416" fill="#ffffff" fill-opacity="0"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">两级拓扑里数据只能丢在三个地方，三处的表现完全不同</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">排障第一步不是看日志，是先定位「丢在哪一跳」</text>

  <rect x="30" y="112" width="150" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="105" y="142" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">SDK</text>
  <text x="105" y="166" text-anchor="middle" font-size="11.5" fill="#1d4ed8">进程内埋点</text>
  <text x="105" y="186" text-anchor="middle" font-size="11.5" fill="#1d4ed8">批量 + 队列</text>

  <rect x="250" y="112" width="170" height="86" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="335" y="142" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">Agent</text>
  <text x="335" y="166" text-anchor="middle" font-size="11.5" fill="#166534">就近收敛</text>
  <text x="335" y="186" text-anchor="middle" font-size="11.5" fill="#166534">加节点级属性</text>

  <rect x="490" y="112" width="170" height="86" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="575" y="142" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#78350f">Gateway</text>
  <text x="575" y="166" text-anchor="middle" font-size="11.5" fill="#92400e">全局决策：采样</text>
  <text x="575" y="186" text-anchor="middle" font-size="11.5" fill="#92400e">归一 / 路由</text>

  <rect x="730" y="112" width="170" height="86" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="815" y="142" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">后端</text>
  <text x="815" y="166" text-anchor="middle" font-size="11.5" fill="#334155">存储 + 查询</text>
  <text x="815" y="186" text-anchor="middle" font-size="11.5" fill="#334155">模型说了算</text>

  <line x1="180" y1="155" x2="244" y2="155" stroke="#64748b" stroke-width="2"/>
  <polygon points="244,155 234,150 234,160" fill="#64748b"/>
  <line x1="420" y1="155" x2="484" y2="155" stroke="#64748b" stroke-width="2"/>
  <polygon points="484,155 474,150 474,160" fill="#64748b"/>
  <line x1="660" y1="155" x2="724" y2="155" stroke="#64748b" stroke-width="2"/>
  <polygon points="724,155 714,150 714,160" fill="#64748b"/>

  <circle cx="212" cy="155" r="14" fill="#dc2626"/>
  <text x="212" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1</text>
  <circle cx="452" cy="155" r="14" fill="#dc2626"/>
  <text x="452" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2</text>
  <circle cx="692" cy="155" r="14" fill="#dc2626"/>
  <text x="692" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3</text>

  <rect x="30" y="228" width="940" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="50" y="252" font-size="12.5" font-weight="bold" fill="#0f172a">① SDK → Agent</text>
  <text x="180" y="252" font-size="11.5" fill="#334155">原因：地址写错 / Agent 未起 / 端口错（4317 当 4318 用）</text>
  <text x="180" y="274" font-size="11.5" fill="#b91c1c">线索：SDK 侧导出失败计数上涨；这是唯一一处「业务方先发现」的失败</text>

  <rect x="30" y="304" width="940" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="50" y="328" font-size="12.5" font-weight="bold" fill="#0f172a">② Agent → Gateway</text>
  <text x="180" y="328" font-size="11.5" fill="#334155">原因：主机名解析不出（最常见）/ Gateway 挂了 / TLS 不匹配</text>
  <text x="180" y="350" font-size="11.5" fill="#b91c1c">线索：Exporting failed + Dropping data；⚠️ 主机名错时报 no children to pick from，看不出根因</text>

  <rect x="30" y="380" width="940" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="50" y="404" font-size="12.5" font-weight="bold" fill="#0f172a">③ Gateway → 后端</text>
  <text x="180" y="404" font-size="11.5" fill="#334155">原因：限流 / 认证失败 / schema 不兼容 / 后端写入超时</text>
  <text x="180" y="426" font-size="11.5" fill="#b91c1c">线索：同上，但发生在最后一个进程；⚠️ 队列满之后才丢，前面看起来一切正常</text>

  <line x1="20" y1="458" x2="980" y2="458" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="470" font-size="12.5" fill="#0f172a">实测：② 处主机名写错 → 重试 5 次（间隔 567ms → 3.3s）→ 10 秒窗口到 → Dropping data, dropped_items: 3，全程只有 info 日志。</text>
</svg>
