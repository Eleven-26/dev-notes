<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>

  <text x="60" y="44" font-size="18" font-weight="bold" fill="#1f2937">头采样在结果出现前抽签，尾采样等链路收齐再挑</text>

  <rect x="60" y="76" width="280" height="64" rx="6" fill="#eaf2fb" stroke="#2c6fbb" stroke-width="1.5"/>
  <text x="72" y="102" font-size="13" font-weight="bold" fill="#1b4f8a">头采样：在这里决定</text>
  <text x="72" y="124" font-size="12" fill="#1b4f8a">此刻只有路由、用户与规则，没有结果</text>

  <line x1="110" y1="140" x2="110" y2="168" stroke="#2c6fbb" stroke-width="1.5"/>
  <polygon points="110,174 105,165 115,165" fill="#2c6fbb"/>

  <rect x="100" y="176" width="660" height="60" fill="#eaf2fb" stroke="#2c6fbb" stroke-width="1.5"/>
  <text x="430" y="212" font-size="13" fill="#1b4f8a" text-anchor="middle">各服务的 span 陆续上报：错误与耗时都还不知道</text>

  <rect x="760" y="176" width="180" height="60" fill="#eaf7ef" stroke="#2f8f5b" stroke-width="1.5"/>
  <text x="850" y="202" font-size="13" fill="#1d6b45" text-anchor="middle">链路收齐</text>
  <text x="850" y="222" font-size="12" fill="#1d6b45" text-anchor="middle">decision_wait 计时中</text>

  <text x="100" y="166" font-size="12" fill="#6b7280">请求开始</text>
  <text x="760" y="166" font-size="12" fill="#2f8f5b">结果已知</text>

  <rect x="680" y="286" width="300" height="64" rx="6" fill="#eaf7ef" stroke="#2f8f5b" stroke-width="1.5"/>
  <text x="692" y="312" font-size="13" font-weight="bold" fill="#1d6b45">尾采样：在这里决定</text>
  <text x="692" y="334" font-size="12" fill="#1d6b45">状态码、整条耗时、属性都已就绪</text>

  <line x1="880" y1="284" x2="880" y2="240" stroke="#2f8f5b" stroke-width="1.5"/>
  <polygon points="880,234 875,243 885,243" fill="#2f8f5b"/>

  <text x="60" y="378" font-size="13" fill="#6b7280">头采样必须提前给答案，只能按比例或入口规则抽；尾采样等得起，所以能保住错误与慢请求。</text>
  <text x="60" y="404" font-size="13" fill="#6b7280">代价是尾采样要在内存里攒住所有 span，并且同一 trace 必须落到同一个实例。</text>
</svg>
