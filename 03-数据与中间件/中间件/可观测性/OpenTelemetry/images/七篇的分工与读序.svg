<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">OpenTelemetry 七篇：一条数据的一生 + 四个可插拔的判断</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">左半三段有严格先后（定边界 → 定形状 → 定报文）；右半四篇彼此无依赖，按当下痛点挑一个进</text>

  <rect x="20" y="74" width="530" height="330" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="36" y="98" font-size="12.5" font-weight="bold" fill="#1e40af">① 数据的一生：进程内 → 出进程</text>

  <rect x="36" y="110" width="498" height="78" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="48" y="132" font-size="11" font-weight="bold" fill="#0f172a">概念 · 总体架构与核心概念.md</text>
  <text x="48" y="151" font-size="8.5" fill="#334155">定边界：五个部件里只有 SDK 与 Collector 必须自己装，API 是库、OTLP 是协议</text>
  <text x="48" y="168" font-size="8.5" fill="#334155">四段边界：进程内要发版 / 首跳 / 采集器内改配置即生效 / 落库后失去通用性</text>
  <text x="48" y="182" font-size="8.5" fill="#64748b">判据：这次改动要不要动业务代码、要不要发版</text>

  <line x1="285" y1="190" x2="285" y2="200" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="285,204 281,196 289,196" fill="#2563eb"/>

  <rect x="36" y="204" width="498" height="78" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="48" y="226" font-size="11" font-weight="bold" fill="#0f172a">形状 · 数据模型与上下文传播.md</text>
  <text x="48" y="245" font-size="8.5" fill="#334155">resource / scope / span 三层按变更频率分家，跨进程只传 55 字符的 traceparent</text>
  <text x="48" y="262" font-size="8.5" fill="#334155">断 ctx 得到的是新 traceID 而不是空 ID；四种非法头全部静默开新链路</text>
  <text x="48" y="276" font-size="8.5" fill="#64748b">这一层是后面五篇的公共词汇表</text>

  <line x1="285" y1="284" x2="285" y2="294" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="285,298 281,290 289,290" fill="#2563eb"/>

  <rect x="36" y="298" width="498" height="78" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="48" y="320" font-size="11" font-weight="bold" fill="#0f172a">报文 · OTLP协议与传输机制.md</text>
  <text x="48" y="339" font-size="8.5" fill="#334155">protobuf 是主线、JSON 只作调试面；4317 只认 HTTP/2，用 1.1 打得到 http=000</text>
  <text x="48" y="356" font-size="8.5" fill="#334155">同一请求 protobuf 与 JSON 差约 2.9 倍，gzip 后收窄到 1.33~1.53 倍</text>
  <text x="48" y="370" font-size="8.5" fill="#64748b">partialSuccess 空对象才是全成功</text>

  <rect x="566" y="74" width="412" height="330" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="582" y="98" font-size="12.5" font-weight="bold" fill="#b45309">② 四个判断：彼此无前置关系</text>

  <rect x="580" y="110" width="188" height="136" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="8"/>
  <text x="590" y="132" font-size="10.5" font-weight="bold" fill="#78350f">缝合</text>
  <text x="590" y="149" font-size="8" fill="#92400e">OpenTelemetry与关联分析.md</text>
  <text x="590" y="172" font-size="8.5" fill="#334155">三支柱靠 resource 打地基</text>
  <text x="590" y="189" font-size="8.5" fill="#334155">三条载体线各自有边界</text>
  <text x="590" y="206" font-size="8.5" fill="#334155">四个静默断点全都不报错</text>
  <text x="590" y="228" font-size="8.5" fill="#64748b">串不起来时读</text>

  <rect x="780" y="110" width="188" height="136" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="8"/>
  <text x="790" y="132" font-size="10.5" font-weight="bold" fill="#78350f">裁剪</text>
  <text x="790" y="149" font-size="8" fill="#92400e">采样策略.md</text>
  <text x="790" y="172" font-size="8.5" fill="#334155">头采样看当下、尾采样等整条</text>
  <text x="790" y="189" font-size="8.5" fill="#334155">策略计数会重叠，不能相加</text>
  <text x="790" y="206" font-size="8.5" fill="#334155">丢掉的链路找不回来</text>
  <text x="790" y="228" font-size="8.5" fill="#64748b">成本高时读</text>

  <rect x="580" y="252" width="188" height="136" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="8"/>
  <text x="590" y="274" font-size="10.5" font-weight="bold" fill="#78350f">处理</text>
  <text x="590" y="291" font-size="8" fill="#92400e">Collector配置与调优.md</text>
  <text x="590" y="314" font-size="8.5" fill="#334155">processor 顺序即语义</text>
  <text x="590" y="331" font-size="8.5" fill="#334155">而 Collector 不校验顺序</text>
  <text x="590" y="348" font-size="8.5" fill="#334155">send_batch_size 不切包</text>
  <text x="590" y="370" font-size="8.5" fill="#64748b">丢数据 / 内存涨时读</text>

  <rect x="780" y="252" width="188" height="136" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="8"/>
  <text x="790" y="274" font-size="10.5" font-weight="bold" fill="#78350f">落地</text>
  <text x="790" y="291" font-size="8" fill="#92400e">部署架构与最佳实践.md</text>
  <text x="790" y="314" font-size="8.5" fill="#334155">按「谁做全局决策」分 Agent</text>
  <text x="790" y="331" font-size="8.5" fill="#334155">与 Gateway，不是按机器分</text>
  <text x="790" y="348" font-size="8.5" fill="#334155">单副本 54k~76k span/s</text>
  <text x="790" y="370" font-size="8.5" fill="#64748b">要上生产时读</text>

  <rect x="20" y="424" width="960" height="54" fill="#ecfdf5" stroke="#10b981" stroke-width="1" rx="8"/>
  <text x="36" y="446" font-size="11" font-weight="bold" fill="#065f46">贯穿全目录的唯一判据：这次改动要不要动业务代码、要不要发版</text>
  <text x="36" y="466" font-size="8.5" fill="#334155">四段边界里只有第一段要发版，后三段都能改配置——这是 OTel 相对「每个服务直连各后端」的全部价值来源</text>

  <rect x="20" y="492" width="960" height="64" fill="#fff1f2" stroke="#f43f5e" stroke-width="1" rx="8"/>
  <text x="36" y="514" font-size="10.5" font-weight="bold" fill="#9f1239">左半不能跳</text>
  <text x="36" y="532" font-size="8.5" fill="#334155">直接从 Collector 配置开始读，会遇到 resource / scope / pipeline 这些词却不知道它们对应数据里的哪一层</text>
  <text x="36" y="549" font-size="8.5" fill="#64748b">右半则相反：四篇只共享左半的词汇表，彼此之间没有谁必须先读</text>
</svg>
