<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>

  <text x="60" y="44" font-size="18" font-weight="bold" fill="#1f2937">同一份 200 条 trace：尾采样留 36 条，头采样留 18 条</text>

  <text x="60" y="102" font-size="13" font-weight="bold" fill="#1d6b45">尾采样</text>
  <text x="60" y="122" font-size="12" fill="#6b7280">错误 + 慢 + 10%</text>
  <rect x="300" y="84" width="151" height="44" rx="4" fill="#eaf7ef" stroke="#2f8f5b" stroke-width="1.5"/>
  <text x="463" y="112" font-size="13" fill="#1d6b45">36 条 · 错误 10/10、慢 10/10、正常 19/180</text>

  <text x="60" y="172" font-size="13" font-weight="bold" fill="#7b241c">头采样</text>
  <text x="60" y="192" font-size="12" fill="#6b7280">固定 10%</text>
  <rect x="300" y="154" width="76" height="44" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="388" y="182" font-size="13" fill="#7b241c">18 条 · 错误约 2/20</text>

  <text x="60" y="242" font-size="13" font-weight="bold" fill="#7b241c">只送错误</text>
  <text x="60" y="262" font-size="12" fill="#6b7280">头采样 10%</text>
  <text x="300" y="256" font-size="13" fill="#7b241c">另测 20 条 ERROR trace，只留下 2 条</text>

  <line x1="300" y1="304" x2="940" y2="304" stroke="#374151" stroke-width="1.5"/>
  <line x1="300" y1="298" x2="300" y2="310" stroke="#374151" stroke-width="1.5"/>
  <line x1="460" y1="298" x2="460" y2="310" stroke="#374151" stroke-width="1.5"/>
  <line x1="620" y1="298" x2="620" y2="310" stroke="#374151" stroke-width="1.5"/>
  <line x1="780" y1="298" x2="780" y2="310" stroke="#374151" stroke-width="1.5"/>
  <line x1="940" y1="298" x2="940" y2="310" stroke="#374151" stroke-width="1.5"/>
  <text x="300" y="326" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="460" y="326" font-size="12" fill="#6b7280" text-anchor="middle">50</text>
  <text x="620" y="326" font-size="12" fill="#6b7280" text-anchor="middle">100</text>
  <text x="780" y="326" font-size="12" fill="#6b7280" text-anchor="middle">150</text>
  <text x="940" y="326" font-size="12" fill="#6b7280" text-anchor="middle">200 条</text>

  <text x="60" y="372" font-size="13" fill="#6b7280">两者留存率只差一倍，但留下的是哪一批完全不同：尾采样里错误一条不少，头采样按比例丢掉九成。</text>
  <text x="60" y="398" font-size="13" fill="#6b7280">逐策略计数可重叠，所以 10 + 10 + 19 = 39 大于去重后的 36 条。</text>
</svg>
