<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
  <rect x="0" y="64" width="1000" height="436" fill="#ffffff" fill-opacity="0"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">OTel 的生态位：它管「产生与运输」，不管「存储与查询」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">三类东西经常被混为一谈：早期的标准、OTel 本身、以及各家后端</text>

  <rect x="120" y="84" width="230" height="72" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="235" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">OpenTracing</text>
  <text x="235" y="132" text-anchor="middle" font-size="11.5" fill="#64748b">只做 API，不做指标</text>

  <rect x="400" y="84" width="230" height="72" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="515" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">OpenCensus</text>
  <text x="515" y="132" text-anchor="middle" font-size="11.5" fill="#64748b">API + 指标，两家并行</text>

  <line x1="235" y1="156" x2="380" y2="196" stroke="#94a3b8" stroke-width="2"/>
  <line x1="515" y1="156" x2="400" y2="196" stroke="#94a3b8" stroke-width="2"/>
  <text x="300" y="180" font-size="11" fill="#64748b">2019 合并</text>

  <rect x="290" y="196" width="300" height="86" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="440" y="224" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">OpenTelemetry</text>
  <text x="440" y="248" text-anchor="middle" font-size="11.5" fill="#1d4ed8">规范 + 各语言 SDK + Collector</text>
  <text x="440" y="268" text-anchor="middle" font-size="11.5" fill="#1d4ed8">唯一还在演进的标准</text>

  <line x1="440" y1="282" x2="440" y2="312" stroke="#cbd5e1" stroke-width="2"/>
  <text x="450" y="302" font-size="11" fill="#94a3b8">往下是后端（各自独立）</text>

  <rect x="60" y="312" width="270" height="104" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="195" y="338" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">Jaeger v2</text>
  <text x="195" y="362" text-anchor="middle" font-size="11.5" fill="#166534">运行时本身就是 Collector</text>
  <text x="195" y="384" text-anchor="middle" font-size="11.5" fill="#166534">能收能存能查，但要一个</text>
  <text x="195" y="404" text-anchor="middle" font-size="11.5" fill="#166534">独立 Collector 层做策略</text>

  <rect x="365" y="312" width="270" height="104" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="500" y="338" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">SkyWalking</text>
  <text x="500" y="362" text-anchor="middle" font-size="11.5" fill="#92400e">一体化 APM，私有 sw8 头</text>
  <text x="500" y="384" text-anchor="middle" font-size="11.5" fill="#92400e">有 OTLP 兼容通道：只解决</text>
  <text x="500" y="404" text-anchor="middle" font-size="11.5" fill="#92400e">「能收」，不解决「全用 OTel」</text>

  <rect x="670" y="312" width="270" height="104" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="805" y="338" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Prometheus / Loki</text>
  <text x="805" y="362" text-anchor="middle" font-size="11.5" fill="#334155">各自的存储与查询模型</text>
  <text x="805" y="384" text-anchor="middle" font-size="11.5" fill="#334155">通过 exporter / receiver 互通</text>
  <text x="805" y="404" text-anchor="middle" font-size="11.5" fill="#334155">OTel 不替代它们</text>

  <line x1="20" y1="436" x2="980" y2="436" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="460" font-size="13" fill="#0f172a">判据：选后端时 OTel 不参与竞争；选埋点方式时它是唯一还在演进的标准。</text>
  <text x="30" y="484" font-size="12" fill="#64748b">⚠️ 用 SkyWalking 私有探针埋点，换后端时埋点要重做；用 OTel 埋点 + SkyWalking 后端则可行（受兼容通道限制）。</text>
</svg>
