<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a10" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">告警规则的窗口语义：10 个分钟桶里有 3 个满足就触发</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">expression: sum(service_resp_time &gt; 1000) &gt;= 3 与 period: 10 组合起来的真实含义</text>

  <text x="50" y="102" font-size="12" font-weight="bold" fill="#475569">最近 10 个分钟桶（period = 10）</text>

  <rect x="50" y="116" width="80" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="90" y="140" text-anchor="middle" font-size="11" fill="#334155">m-9</text>
  <text x="90" y="160" text-anchor="middle" font-size="10.5" fill="#334155">800ms</text>

  <rect x="140" y="116" width="80" height="56" rx="5" fill="#fecaca" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="180" y="140" text-anchor="middle" font-size="11" fill="#7f1d1d">m-8</text>
  <text x="180" y="160" text-anchor="middle" font-size="10.5" fill="#7f1d1d">1200ms</text>

  <rect x="230" y="116" width="80" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="270" y="140" text-anchor="middle" font-size="11" fill="#334155">m-7</text>
  <text x="270" y="160" text-anchor="middle" font-size="10.5" fill="#334155">900ms</text>

  <rect x="320" y="116" width="80" height="56" rx="5" fill="#fecaca" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="360" y="140" text-anchor="middle" font-size="11" fill="#7f1d1d">m-6</text>
  <text x="360" y="160" text-anchor="middle" font-size="10.5" fill="#7f1d1d">1500ms</text>

  <rect x="410" y="116" width="80" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="450" y="140" text-anchor="middle" font-size="11" fill="#334155">m-5</text>
  <text x="450" y="160" text-anchor="middle" font-size="10.5" fill="#334155">700ms</text>

  <rect x="500" y="116" width="80" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="540" y="140" text-anchor="middle" font-size="11" fill="#334155">m-4</text>
  <text x="540" y="160" text-anchor="middle" font-size="10.5" fill="#334155">850ms</text>

  <rect x="590" y="116" width="80" height="56" rx="5" fill="#fecaca" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="630" y="140" text-anchor="middle" font-size="11" fill="#7f1d1d">m-3</text>
  <text x="630" y="160" text-anchor="middle" font-size="10.5" fill="#7f1d1d">1100ms</text>

  <rect x="680" y="116" width="80" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="720" y="140" text-anchor="middle" font-size="11" fill="#334155">m-2</text>
  <text x="720" y="160" text-anchor="middle" font-size="10.5" fill="#334155">950ms</text>

  <rect x="770" y="116" width="80" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="810" y="140" text-anchor="middle" font-size="11" fill="#334155">m-1</text>
  <text x="810" y="160" text-anchor="middle" font-size="10.5" fill="#334155">880ms</text>

  <rect x="860" y="116" width="80" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="900" y="140" text-anchor="middle" font-size="11" fill="#334155">m0</text>
  <text x="900" y="160" text-anchor="middle" font-size="10.5" fill="#334155">920ms</text>

  <text x="50" y="196" font-size="11.5" fill="#b91c1c">红 = 该分钟桶的 service_resp_time 超过 1000ms 阈值；本窗口共 3 个桶满足 → sum(...) = 3 → 触发</text>

  <rect x="50" y="212" width="10" height="10" fill="#fecaca" stroke="#b91c1c" stroke-width="1"/>
  <text x="68" y="222" font-size="11" fill="#334155">满足阈值的桶（不必连续）</text>
  <rect x="240" y="212" width="10" height="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="258" y="222" font-size="11" fill="#334155">未超阈值的桶</text>

  <rect x="50" y="248" width="890" height="98" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="66" y="274" font-size="12.5" font-weight="bold" fill="#7c2d12">三个时间参数各管一段，别混</text>
  <text x="66" y="298" font-size="11.5" fill="#7c2d12">period = 10：回看窗口大小，不是「持续多久」</text>
  <text x="66" y="320" font-size="11.5" fill="#7c2d12">silence-period = 5：同一规则触发后静默 5 个周期，避免刷屏</text>
  <text x="66" y="340" font-size="11.5" fill="#7c2d12">recovery-observation-period = 3：11.x 新增的恢复观察期，压制恢复抖动</text>

  <rect x="50" y="362" width="890" height="96" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="66" y="388" font-size="12.5" font-weight="bold" fill="#0f172a">告警文本模板的读法</text>
  <text x="66" y="412" font-size="11.5" fill="#334155">分位告警：P50 / P75 / P90 / P95 / P99 中任意一个超阈值就告警（阈值之间是「或」）</text>
  <text x="66" y="434" font-size="11.5" fill="#334155">关系告警：调用方 A 到端点 B 这条关系边超阈值，不一定是 B 自己慢</text>

  <rect x="20" y="474" width="960" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="38" y="500" font-size="12" fill="#0f172a">⚠️ 规则原文取自本机 11.0.0 容器内 alarm-settings.yml；本机未实际触发过告警、未配 webhook 出口</text>
  <text x="38" y="524" font-size="12" fill="#334155">v10 之前的老规则是「指标 + 阈值 + period」三段式，升级时要逐条改写成 expression 形式</text>
</svg>
