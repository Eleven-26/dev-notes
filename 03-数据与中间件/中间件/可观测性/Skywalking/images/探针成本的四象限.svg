<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">探针成本的四象限：三块能调，一块只能防</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">只有采样能同时压住 CPU、内存、网络；丢数风险靠优雅停机兜，不靠配置</text>

  <rect x="40" y="80" width="440" height="196" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="58" y="108" font-size="14" font-weight="bold" fill="#7c2d12">① CPU</text>
  <text x="58" y="134" font-size="11.5" fill="#7c2d12">来源：每 span 的构建与序列化、队列写入的原子操作、批量上报线程</text>
  <text x="58" y="158" font-size="11.5" fill="#7c2d12">可调：采样条数（近似线性）、trace-ignore 按路径跳过</text>
  <text x="58" y="182" font-size="11.5" fill="#7c2d12">不可调：启动期的插件匹配与类加载期增强（一次性）</text>
  <text x="58" y="212" font-size="11.5" fill="#b91c1c">与「命中插件的方法数」相关，不与 QPS 严格成正比</text>
  <text x="58" y="238" font-size="11.5" fill="#334155">判据：链深 + 框架嵌套多的服务，占比更高</text>
  <text x="58" y="262" font-size="11.5" fill="#334155">压测读数不能跨服务搬用</text>

  <rect x="520" y="80" width="440" height="196" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="538" y="108" font-size="14" font-weight="bold" fill="#1e3a8a">② 内存</text>
  <text x="538" y="134" font-size="11.5" fill="#1e3a8a">来源：agent 侧队列（槽数 × 单条引用）、待发送批次、类缓存</text>
  <text x="538" y="158" font-size="11.5" fill="#1e3a8a">可调：CHANNEL_SIZE 与 BUFFER_SIZE、class_cache_mode</text>
  <text x="538" y="182" font-size="11.5" fill="#1e3a8a">不可调：当前 trace 的 TraceSegment 与 span 对象本身</text>
  <text x="538" y="212" font-size="11.5" fill="#b91c1c">MEMORY 类缓存省 IO 但吃堆，大量增强时可能 OOM</text>
  <text x="538" y="238" font-size="11.5" fill="#334155">判据：队列长度必须显式封死，默认值不等于安全值</text>
  <text x="538" y="262" font-size="11.5" fill="#334155">队列满 → 按策略丢，不会无限涨</text>

  <rect x="40" y="296" width="440" height="196" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="58" y="324" font-size="14" font-weight="bold" fill="#14532d">③ 网络</text>
  <text x="58" y="350" font-size="11.5" fill="#14532d">来源：批量 gRPC 上报的字节数（条数 × 单条大小）</text>
  <text x="58" y="374" font-size="11.5" fill="#14532d">可调：采样条数、批量大小（攒批换吞吐）</text>
  <text x="58" y="398" font-size="11.5" fill="#14532d">不可调：单条 segment 的字节数，由 span 与 tag 数量决定</text>
  <text x="58" y="428" font-size="11.5" fill="#b91c1c">单条消息上限 50 MB 是安全阀，不是批量上限</text>
  <text x="58" y="454" font-size="11.5" fill="#334155">判据：先算日条数（N × 28,800），再谈带宽</text>
  <text x="58" y="478" font-size="11.5" fill="#334155">单条字节数本机未测，不给容量承诺</text>

  <rect x="520" y="296" width="440" height="196" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="538" y="324" font-size="14" font-weight="bold" fill="#0f172a">④ 丢数风险（不是成本，是风险）</text>
  <text x="538" y="350" font-size="11.5" fill="#334155">来源：kill -9、进程 OOM、队列满按策略丢、OAP 不可用</text>
  <text x="538" y="374" font-size="11.5" fill="#334155">防线：ShutdownHook 先 flush 队列再关通道</text>
  <text x="538" y="398" font-size="11.5" fill="#334155">无防线：上报不落盘、不重发，OAP 宕机期间的窗口补不回来</text>
  <text x="538" y="428" font-size="11.5" fill="#b91c1c">「数据有个洞」先问：那段时间 OAP 活着吗</text>
  <text x="538" y="454" font-size="11.5" fill="#334155">判据：看是否有部署/重启事件与洞的时间窗重合</text>
  <text x="538" y="478" font-size="11.5" fill="#334155">这一类只能靠流程（滚动重启、停机前摘流量）</text>

  <rect x="20" y="508" width="960" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="38" y="534" font-size="12" fill="#0f172a">⭐ 两个必调旋钮：采样条数（生产别留 -1）与批量大小（决定「数据延迟」的基线）</text>
</svg>
