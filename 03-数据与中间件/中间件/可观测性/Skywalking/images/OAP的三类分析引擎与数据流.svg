<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">OAP 的三类分析引擎：看输入就能分清谁管什么</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">OAL 吃 trace 与 mesh 访问日志，MAL 吃 meter，LAL 吃日志；产出统一成「实体 + 时间桶 + 值」</text>

  <rect x="40" y="80" width="290" height="76" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="56" y="106" font-size="13" font-weight="bold" fill="#1e3a8a">输入：原生 trace / mesh 日志</text>
  <text x="56" y="128" font-size="11.5" fill="#1e3a8a">SkyWalking segment</text>
  <text x="56" y="146" font-size="11.5" fill="#1e3a8a">Envoy ALS 等访问日志</text>

  <rect x="355" y="80" width="290" height="76" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="371" y="106" font-size="13" font-weight="bold" fill="#1e3a8a">输入：meter</text>
  <text x="371" y="128" font-size="11.5" fill="#1e3a8a">OTel metrics / agent meter</text>
  <text x="371" y="146" font-size="11.5" fill="#1e3a8a">otel-rules 覆盖的中间件指标</text>

  <rect x="670" y="80" width="290" height="76" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="686" y="106" font-size="13" font-weight="bold" fill="#1e3a8a">输入：日志</text>
  <text x="686" y="128" font-size="11.5" fill="#1e3a8a">应用日志 / K8s 事件 / Envoy 日志</text>
  <text x="686" y="146" font-size="11.5" fill="#1e3a8a">经 LAL 解析成结构化记录</text>

  <line x1="185" y1="156" x2="185" y2="180" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="500" y1="156" x2="500" y2="180" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="815" y1="156" x2="815" y2="180" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a2)"/>

  <rect x="40" y="180" width="290" height="112" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="56" y="206" font-size="13.5" font-weight="bold" fill="#7c2d12">OAL</text>
  <text x="56" y="230" font-size="11.5" fill="#7c2d12">三段式：from / filter / 聚合</text>
  <text x="56" y="250" font-size="11.5" fill="#7c2d12">Scope：Service、Instance、Endpoint</text>
  <text x="56" y="270" font-size="11.5" fill="#7c2d12">启动期编译成类，改脚本要重启</text>
  <text x="56" y="288" font-size="11.5" fill="#b91c1c">本机日志：296 个指标类、5 个 dispatcher</text>

  <rect x="355" y="180" width="290" height="112" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="371" y="206" font-size="13.5" font-weight="bold" fill="#7c2d12">MAL</text>
  <text x="371" y="230" font-size="11.5" fill="#7c2d12">操作对象是 sample family</text>
  <text x="371" y="250" font-size="11.5" fill="#7c2d12">tagEqual / tagMatch / 四则运算</text>
  <text x="371" y="270" font-size="11.5" fill="#7c2d12">service() / instance() 提升层级</text>
  <text x="371" y="288" font-size="11.5" fill="#b91c1c">少了提升层级：入库但不挂服务</text>

  <rect x="670" y="180" width="290" height="112" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="686" y="206" font-size="13.5" font-weight="bold" fill="#7c2d12">LAL</text>
  <text x="686" y="230" font-size="11.5" fill="#7c2d12">filter：parser → extractor → sink</text>
  <text x="686" y="250" font-size="11.5" fill="#7c2d12">parser 三选一：json / yaml / text</text>
  <text x="686" y="270" font-size="11.5" fill="#7c2d12">traceId 提取决定日志能否关联链路</text>
  <text x="686" y="288" font-size="11.5" fill="#b91c1c">metrics 块可把日志变成指标</text>

  <line x1="185" y1="292" x2="185" y2="316" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="500" y1="292" x2="500" y2="316" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="815" y1="292" x2="815" y2="316" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a2)"/>

  <rect x="40" y="316" width="920" height="86" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="56" y="342" font-size="13" font-weight="bold" fill="#14532d">产出：指标 + 拓扑边（拓扑由内核自动构建，不需要写 OAL）</text>
  <text x="56" y="364" font-size="11.5" fill="#14532d">按 Scope.ID 与最小时间桶分组；分钟桶默认强制，Hour / Day 由 core.downsampling 控制（默认 Hour,Day）</text>
  <text x="56" y="386" font-size="11.5" fill="#14532d">BanyanDB 落组：sw_metricsMinute / sw_metricsHour / sw_metricsDay；日志落 sw_recordsLog</text>

  <rect x="20" y="428" width="960" height="128" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="38" y="454" font-size="12" fill="#0f172a">⭐ 判据：三者分工只看输入，不看输出——所以面板上不区分「这条曲线来自 OAL 还是 MAL」</text>
  <text x="38" y="478" font-size="12" fill="#0f172a">⚠️ 两条硬约束：① OAL 集群内脚本必须一致，否则同名指标各节点值不同</text>
  <text x="38" y="500" font-size="12" fill="#0f172a">② percentile 在 10.0.0 被 percentile2 取代，告警里才能写 service_percentile{p='50,75,90,95,99'}</text>
  <text x="38" y="524" font-size="12" fill="#b91c1c">本机未跑 MAL / LAL 规则，也未压测分析链吞吐——此处为机制说明，不是性能读数</text>
  <text x="38" y="546" font-size="12" fill="#334155">延伸：OAL 的 disable.oal 可关掉硬编码指标（segment、top_n_database_statement）</text>
</svg>
