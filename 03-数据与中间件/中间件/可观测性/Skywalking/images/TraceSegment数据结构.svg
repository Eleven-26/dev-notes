<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="sq1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">TraceSegment：一个服务实例内的采集单元</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">跨进程用 refs[] 接链，跨线程用 spanId / parentSpanId 还原树形</text>

  <rect x="90" y="86" width="240" height="48" rx="9" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/>
  <text x="210" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">TraceSegment</text>
  <line x1="110" y1="134" x2="110" y2="614" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="110" y1="169" x2="150" y2="169" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="110" y1="215" x2="150" y2="215" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="110" y1="261" x2="150" y2="261" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="110" y1="307" x2="150" y2="307" stroke="#94a3b8" stroke-width="1.4"/>

  <rect x="150" y="148" width="380" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="166" y="175" font-size="12.5" fill="#1e3a8a">traceId / segmentId</text>
  <rect x="150" y="194" width="380" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="166" y="221" font-size="12.5" fill="#1e3a8a">serviceId / serviceInstanceId</text>
  <rect x="150" y="240" width="380" height="42" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="166" y="267" font-size="12.5" fill="#7c2d12">refs[]  上游引用（跨进程 / 跨线程接链）</text>
  <rect x="150" y="286" width="380" height="42" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="166" y="313" font-size="12.5" fill="#7c2d12">spans[]  元素结构见下</text>

  <line x1="185" y1="336" x2="185" y2="614" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="185" y1="366" x2="210" y2="366" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="185" y1="412" x2="210" y2="412" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="185" y1="458" x2="210" y2="458" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="185" y1="504" x2="210" y2="504" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="185" y1="550" x2="210" y2="550" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="185" y1="596" x2="210" y2="596" stroke="#94a3b8" stroke-width="1.4"/>

  <rect x="210" y="346" width="320" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="226" y="372" font-size="12.5" fill="#0f172a">spanId / parentSpanId</text>
  <rect x="210" y="392" width="320" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="226" y="418" font-size="12.5" fill="#0f172a">spanType: Entry | Exit | Local</text>
  <rect x="210" y="438" width="320" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="226" y="464" font-size="12.5" fill="#0f172a">operationName / peer</text>
  <rect x="210" y="484" width="320" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="226" y="510" font-size="12.5" fill="#0f172a">componentId</text>
  <rect x="210" y="530" width="320" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="226" y="556" font-size="12.5" fill="#0f172a">startTime / endTime</text>
  <rect x="210" y="576" width="320" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="226" y="602" font-size="12.5" fill="#0f172a">tags[] / logs[] / events[]</text>

  <rect x="590" y="86" width="380" height="216" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="606" y="114" font-size="13" font-weight="bold" fill="#0f172a">spanType 三类含义</text>
  <text x="606" y="142" font-size="12" fill="#334155">• Entry：本服务被调用的入口</text>
  <text x="606" y="164" font-size="12" fill="#64748b">  （HTTP / RPC 服务端）</text>
  <text x="606" y="192" font-size="12" fill="#334155">• Exit：本服务调出去的依赖</text>
  <text x="606" y="214" font-size="12" fill="#64748b">  （DB / Redis / 下游 HTTP）</text>
  <text x="606" y="242" font-size="12" fill="#334155">• Local：服务内部的方法级埋点</text>
  <text x="606" y="274" font-size="12" fill="#b91c1c">⚠️ 只有宿主真的加载了 witness 类</text>
  <text x="606" y="294" font-size="12" fill="#b91c1c">   对应框架，插件才被认为生效</text>

  <rect x="590" y="318" width="380" height="216" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="606" y="346" font-size="13" font-weight="bold" fill="#0f172a">上报通道（轻量级队列内核）</text>
  <text x="606" y="374" font-size="12" fill="#334155">• Buffer = 定长数组 + 环形游标</text>
  <text x="606" y="394" font-size="12" fill="#64748b">  入队按取模定位，无需加锁</text>
  <text x="606" y="422" font-size="12" fill="#334155">• 采样发生在入队之前</text>
  <text x="606" y="442" font-size="12" fill="#64748b">  未命中直接丢弃，不占队列</text>
  <text x="606" y="470" font-size="12" fill="#334155">• 指标 / 日志各走独立 DataCarrier</text>
  <text x="606" y="490" font-size="12" fill="#64748b">  互不阻塞，消费线程可独立配置</text>
  <text x="606" y="518" font-size="12" fill="#b91c1c">⚠️ 队列满时按策略丢数据，不阻塞业务</text>

  <rect x="590" y="550" width="380" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="606" y="578" font-size="12" fill="#0f172a">refs[] 是跨进程接链的依据；</text>
  <text x="606" y="600" font-size="12" fill="#0f172a">spanId / parentSpanId 是树形关系的来源。</text>
</svg>
