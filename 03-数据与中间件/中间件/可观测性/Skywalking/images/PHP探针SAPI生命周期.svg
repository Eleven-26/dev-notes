<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="pp1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">PHP 探针：扩展形式挂载，生命周期即 SAPI 生命周期</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">MINIT → RINIT → 脚本执行 → RSHUTDOWN → MSHUTDOWN（cli / cgi / php-fpm 通用，只是触发次数不同）</text>

  <rect x="70" y="84" width="860" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="90" y="110" font-size="13.5" font-weight="bold" fill="#14532d">① MINIT（模块初始化）—— 常驻进程，只执行一次</text>
  <text x="90" y="134" font-size="12" fill="#14532d">加载扩展代码、分配资源、注册资源处理器；php-fpm 的 master 在此 fork 出上报 worker</text>

  <rect x="70" y="164" width="860" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="90" y="186" font-size="13.5" font-weight="bold" fill="#1e3a8a">② RINIT（请求初始化）—— 每个请求执行一次</text>
  <text x="90" y="206" font-size="12" fill="#1e3a8a">重建本次请求的 trace 上下文（多请求之间不串数据）</text>

  <rect x="70" y="232" width="860" height="64" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="90" y="258" font-size="13.5" font-weight="bold" fill="#7c2d12">③ 脚本执行 —— 真正采集的阶段</text>
  <text x="90" y="282" font-size="12" fill="#7c2d12">扩展 hook 内置函数与 curl / PDO / redis 等扩展，采集 span 与日志，经 unix socket 交给上报 worker</text>

  <rect x="70" y="312" width="860" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="90" y="334" font-size="13.5" font-weight="bold" fill="#1e3a8a">④ RSHUTDOWN（请求关闭）</text>
  <text x="90" y="354" font-size="12" fill="#1e3a8a">执行相关 gc，并把本次请求的链路数据交给上报逻辑</text>

  <rect x="70" y="380" width="860" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="90" y="402" font-size="13.5" font-weight="bold" fill="#14532d">⑤ MSHUTDOWN（模块关闭）</text>
  <text x="90" y="422" font-size="12" fill="#14532d">SAPI 退出时调用扩展的关闭函数，最终关闭自己的内存核心</text>

  <line x1="500" y1="148" x2="500" y2="164" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#pp1)"/>
  <line x1="500" y1="216" x2="500" y2="232" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#pp1)"/>
  <line x1="500" y1="296" x2="500" y2="312" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#pp1)"/>
  <line x1="500" y1="364" x2="500" y2="380" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#pp1)"/>

  <rect x="20" y="452" width="960" height="148" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="36" y="480" font-size="13" font-weight="bold" fill="#0f172a">与 Java 探针的关键差异（多语言探针里 PHP 这条路坑最多）</text>
  <text x="36" y="510" font-size="12" fill="#0f172a">• 只能在扩展 hook 到的层面工作，无法像 javaagent 那样做全量字节码增强</text>
  <text x="36" y="534" font-size="12" fill="#0f172a">• php-fpm 是多进程模型：上报 worker 由 master 在 module init 时 fork，靠 unix socket 与 PHP 进程通信</text>
  <text x="36" y="558" font-size="12" fill="#0f172a">• runtime_dir 的可写性与前台 / daemon 启动方式必须一起考虑，容器化时最容易踩</text>
  <text x="36" y="582" font-size="12" fill="#b91c1c">⚠️ 优雅停机同样影响可观测性：进程被强杀时未 flush 的链路数据会丢（接入步骤见 01-编程语言/php/接入Skywalking.md）</text>
</svg>
