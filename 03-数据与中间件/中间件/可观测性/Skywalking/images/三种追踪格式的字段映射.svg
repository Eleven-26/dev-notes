<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">三种追踪格式的字段映射：能对齐的只有身份与父子</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">sw8（8 字段，Base64）· W3C traceparent（4 段，定长十六进制）· Zipkin v2 JSON</text>

  <rect x="30" y="78" width="300" height="42" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="180" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">SkyWalking sw8</text>

  <rect x="350" y="78" width="300" height="42" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="500" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">W3C traceparent</text>

  <rect x="670" y="78" width="300" height="42" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="820" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Zipkin v2 JSON</text>

  <text x="30" y="146" font-size="11.5" font-weight="bold" fill="#475569">链路 ID</text>
  <rect x="30" y="154" width="300" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="181" font-size="11.5" fill="#334155">段 2，Base64 后的字符串</text>
  <rect x="350" y="154" width="300" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="364" y="181" font-size="11.5" fill="#334155">第 2 段，32 位十六进制</text>
  <rect x="670" y="154" width="300" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="684" y="181" font-size="11.5" fill="#334155">traceId，16 或 32 位十六进制</text>

  <text x="30" y="222" font-size="11.5" font-weight="bold" fill="#475569">父引用</text>
  <rect x="30" y="230" width="300" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="257" font-size="11.5" fill="#334155">段 3 加段 4（segment 与 span）</text>
  <rect x="350" y="230" width="300" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="364" y="257" font-size="11.5" fill="#334155">第 3 段 parent-id，16 位</text>
  <rect x="670" y="230" width="300" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="684" y="257" font-size="11.5" fill="#334155">parentId</text>

  <text x="30" y="298" font-size="11.5" font-weight="bold" fill="#475569">采样</text>
  <rect x="30" y="306" width="300" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="44" y="333" font-size="11.5" fill="#7c2d12">段 1，0 或 1，端到端跟随</text>
  <rect x="350" y="306" width="300" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="364" y="333" font-size="11.5" fill="#1e3a8a">第 4 段 flags，01 表示采样</text>
  <rect x="670" y="306" width="300" height="44" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="684" y="333" font-size="11.5" fill="#334155">无采样位：上报即采，客户端决定</text>

  <text x="30" y="374" font-size="11.5" font-weight="bold" fill="#475569">服务标识</text>
  <rect x="30" y="382" width="300" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="409" font-size="11.5" fill="#334155">段 5 与段 6（服务加实例）</text>
  <rect x="350" y="382" width="300" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="364" y="409" font-size="11.5" fill="#334155">resource.service.name（span 之外）</text>
  <rect x="670" y="382" width="300" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="684" y="409" font-size="11.5" fill="#334155">localEndpoint.serviceName</text>

  <text x="30" y="450" font-size="11.5" font-weight="bold" fill="#475569">端点名</text>
  <rect x="30" y="458" width="300" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="485" font-size="11.5" fill="#334155">段 7，父段首个 Entry span 名</text>
  <rect x="350" y="458" width="300" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="364" y="485" font-size="11.5" fill="#334155">span.name</text>
  <rect x="670" y="458" width="300" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="684" y="485" font-size="11.5" fill="#334155">name</text>

  <rect x="20" y="512" width="960" height="36" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="38" y="535" font-size="11.5" fill="#0f172a">⚠️ 粒度对不上：sw8 一次送整段，OTel 逐 span 上报；CROSS_THREAD 引用只活在原进程内存，换格式即丢</text>
</svg>
