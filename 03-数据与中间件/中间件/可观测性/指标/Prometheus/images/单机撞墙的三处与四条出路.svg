<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">单机撞的三处墙，与四条出路的固定顺序</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">顺序不能调换：先降基数再谈扩容。倒过来做的团队，通常分片之后才发现每一片的基数都还是错的</text>

  <rect x="20" y="76" width="440" height="380" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" rx="10"/>
  <text x="38" y="100" font-size="12" font-weight="bold" fill="#7f1d1d">三处墙：三种不同的死法</text>

  <rect x="40" y="110" width="400" height="100" fill="#ffffff" stroke="#dc2626" stroke-width="1" rx="8"/>
  <text x="54" y="132" font-size="10.5" font-weight="bold" fill="#7f1d1d">① 基数撞内存</text>
  <text x="54" y="152" font-size="8.8" fill="#334155">序列的元数据与索引常驻内存，样本量其次</text>
  <text x="54" y="170" font-size="8.8" fill="#334155">判据：head_series 是否单调上涨（不是看绝对值）</text>
  <text x="54" y="190" font-size="8.5" fill="#b45309">症状：OOM、抓取超时、所有查询一起变慢</text>
  <text x="54" y="204" font-size="8" fill="#64748b">注意：拉长抓取周期只减样本、不减序列，对这一条几乎无效</text>

  <rect x="40" y="222" width="400" height="100" fill="#ffffff" stroke="#dc2626" stroke-width="1" rx="8"/>
  <text x="54" y="244" font-size="10.5" font-weight="bold" fill="#7f1d1d">② 保留期撞磁盘</text>
  <text x="54" y="264" font-size="8.8" fill="#334155">所需空间 = 保留秒数 × 每秒样本数 × 每样本字节数</text>
  <text x="54" y="282" font-size="8.8" fill="#334155">判据：算出每日增量，再线性外推剩余天数</text>
  <text x="54" y="302" font-size="8.5" fill="#b45309">症状：磁盘满、旧数据被提前删除、compaction 失败</text>
  <text x="54" y="316" font-size="8" fill="#64748b">注意：compaction 期间源块与新块共存，峰值会超过保留上限</text>

  <rect x="40" y="334" width="400" height="100" fill="#ffffff" stroke="#dc2626" stroke-width="1" rx="8"/>
  <text x="54" y="356" font-size="10.5" font-weight="bold" fill="#7f1d1d">③ 无副本撞可用性</text>
  <text x="54" y="376" font-size="8.8" fill="#334155">官方立场：本地存储不集群、不复制</text>
  <text x="54" y="394" font-size="8.8" fill="#334155">判据：节点故障时监控是否整体失明</text>
  <text x="54" y="414" font-size="8.5" fill="#b45309">症状：不是数据不准，是「故障期间什么都看不到」</text>
  <text x="54" y="428" font-size="8" fill="#64748b">注意：双跑不等于高可用，还要查询侧去重</text>

  <rect x="480" y="76" width="500" height="380" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" rx="10"/>
  <text x="498" y="100" font-size="12" font-weight="bold" fill="#1e40af">四条出路：越靠前越省钱，越靠后越伤架构</text>

  <rect x="500" y="110" width="460" height="72" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" rx="8"/>
  <text x="514" y="132" font-size="10.5" font-weight="bold" fill="#1e3a8a">① 降基数：应用侧少暴露 + metric_relabel 丢弃 + 砍标签</text>
  <text x="514" y="152" font-size="8.8" fill="#334155">适合：序列数在百万级上下徘徊，且排障维度没被真正用到</text>
  <text x="514" y="172" font-size="8.5" fill="#b45309">代价：排障维度永久变少 —— 但收益是复利的，同时降内存、索引、磁盘、查询与规则耗时</text>

  <rect x="500" y="196" width="460" height="72" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="514" y="218" font-size="10.5" font-weight="bold" fill="#1e40af">② 缩保留 + 预聚合</text>
  <text x="514" y="238" font-size="8.8" fill="#334155">适合：磁盘不够，但长期趋势还要看</text>
  <text x="514" y="258" font-size="8.5" fill="#64748b">代价：原始点丢失，长周期只能看记录规则算出的低精度序列</text>

  <rect x="500" y="282" width="460" height="72" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="514" y="304" font-size="10.5" font-weight="bold" fill="#1e40af">③ remote_write 外挂远端存储</text>
  <text x="514" y="324" font-size="8.8" fill="#334155">适合：要多集群全局视图、要长保留、已有远端后端</text>
  <text x="514" y="344" font-size="8.5" fill="#64748b">代价：多一套组件；队列积压与失败率要单独盯（见生态关系篇）</text>

  <rect x="500" y="368" width="460" height="72" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" rx="8"/>
  <text x="514" y="390" font-size="10.5" font-weight="bold" fill="#78350f">④ 分片 / 联邦</text>
  <text x="514" y="410" font-size="8.8" fill="#334155">适合：组织上本来就有边界（多团队、多集群各自负责）</text>
  <text x="514" y="430" font-size="8.5" fill="#b45309">代价：全局查询要靠上层组件；运维面与配置面成倍增长</text>

  <rect x="20" y="470" width="960" height="76" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="8"/>
  <text x="38" y="494" font-size="10.5" font-weight="bold" fill="#0f172a">唯一不能靠这四条解决的问题</text>
  <text x="38" y="516" font-size="9" fill="#475569">无副本：单节点故障就是监控盲区。补法是双跑加查询侧去重，代价是双份存储与「两边数据不一致时信谁」的判断</text>
  <text x="38" y="536" font-size="9" fill="#b45309">所以任何「要不要上集群」的讨论，都应该先回答一句：基数砍到位了吗</text>
</svg>
