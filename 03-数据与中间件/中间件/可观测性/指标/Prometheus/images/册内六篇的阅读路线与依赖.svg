<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">六篇的分工与读序</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">左侧主干四篇必须按序走完；右侧两篇是在主干里遇到具体问题时才拐进去</text>

  <rect x="20" y="76" width="556" height="474" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="38" y="100" font-size="12.5" font-weight="bold" fill="#1e40af">主干四篇：按序，不能跳</text>

  <rect x="40" y="114" width="516" height="82" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="54" y="136" font-size="11" font-weight="bold" fill="#0f172a">① 定位与架构</text>
  <text x="54" y="156" font-size="8.8" fill="#334155">四件事为什么互相锁死、五个模块、一次抓取的七步、最小可运行实例</text>
  <text x="54" y="174" font-size="8.5" fill="#64748b">建立「它是什么」与「它不做什么」，后面五篇都挂在这套坐标上</text>
  <text x="54" y="190" font-size="8.5" fill="#b45309">出口：能判断一个需求该不该用它回答</text>

  <line x1="298" y1="198" x2="298" y2="222" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="298,226 294,218 302,218" fill="#2563eb"/>

  <rect x="40" y="230" width="516" height="82" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="54" y="252" font-size="11" font-weight="bold" fill="#0f172a">② 数据模型与存储</text>
  <text x="54" y="272" font-size="8.8" fill="#334155">序列身份由标签全集决定、指标名只是 __name__、倒排索引、head 到 block 的四段落地</text>
  <text x="54" y="290" font-size="8.5" fill="#64748b">这一篇解释「基数为什么致命」与「磁盘为什么算不准」两个后果</text>
  <text x="54" y="306" font-size="8.5" fill="#b45309">出口：能自己算出容量，知道砍哪里最省</text>

  <line x1="298" y1="314" x2="298" y2="338" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="298,342 294,334 302,334" fill="#2563eb"/>

  <rect x="40" y="346" width="516" height="82" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="54" y="368" font-size="11" font-weight="bold" fill="#0f172a">③ 抓取与目标发现</text>
  <text x="54" y="388" font-size="8.8" fill="#334155">scrape_config 三段、五种目标来源、relabel 的两个阶段、六种失败形态的区分</text>
  <text x="54" y="406" font-size="8.5" fill="#64748b">核心是分清「改抓谁」与「改存什么」，二者写错位置都不会报错</text>
  <text x="54" y="422" font-size="8.5" fill="#b45309">出口：目标抓不到时，能一次问对问题</text>

  <line x1="298" y1="430" x2="298" y2="454" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="298,458 294,450 302,450" fill="#2563eb"/>

  <rect x="40" y="462" width="516" height="72" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" rx="8"/>
  <text x="54" y="484" font-size="11" font-weight="bold" fill="#1e3a8a">④ PromQL 求值机制</text>
  <text x="54" y="504" font-size="8.8" fill="#334155">四种值类型、五段求值、区间左开右闭、lookback 与 stale、五个必踩的坑</text>
  <text x="54" y="522" font-size="8.5" fill="#64748b">全册最厚的一篇：写查询和解释「曲线为什么不对」都在这里</text>

  <rect x="594" y="76" width="386" height="474" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" rx="10"/>
  <text x="612" y="100" font-size="12.5" font-weight="bold" fill="#b45309">两条支线：按需要进，不必等主干读完</text>

  <rect x="614" y="118" width="346" height="132" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="8"/>
  <text x="628" y="140" font-size="11" font-weight="bold" fill="#78350f">⑤ 告警与规则</text>
  <text x="628" y="160" font-size="8.8" fill="#334155">两种规则、求值周期、inactive 到 firing 的状态机、ALERTS 的真实形态</text>
  <text x="628" y="178" font-size="8.8" fill="#334155">Alertmanager 的四道闸与路由、promtool 三条命令的分工</text>
  <text x="628" y="200" font-size="8.5" fill="#b45309">前置：④ 的第三、四节（不会读表达式就写不出规则）</text>
  <text x="628" y="220" font-size="8.5" fill="#64748b">只讲产品形态；阈值与燃烧率在告警与响应目录</text>
  <text x="628" y="240" font-size="8.5" fill="#64748b">典型触发：告警不响、告警来迟、通知发错人</text>

  <rect x="614" y="272" width="346" height="132" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="8"/>
  <text x="628" y="294" font-size="11" font-weight="bold" fill="#78350f">⑥ 运维与排障</text>
  <text x="628" y="314" font-size="8.8" fill="#334155">要动的六个参数、四组自带指标、五个高频故障的定位顺序</text>
  <text x="628" y="332" font-size="8.8" fill="#334155">磁盘三部分怎么算、热重载边界、撞墙后的四条出路</text>
  <text x="628" y="354" font-size="8.5" fill="#b45309">前置：② 的存储机制与 ③ 的失败形态</text>
  <text x="628" y="374" font-size="8.5" fill="#64748b">只讲它自己怎么活；扩容选型在指标选型对比篇</text>
  <text x="628" y="394" font-size="8.5" fill="#64748b">典型触发：内存涨、磁盘不降、查询变慢</text>

  <rect x="614" y="424" width="346" height="110" fill="#ffffff" stroke="#fcd34d" stroke-width="1" rx="8"/>
  <text x="628" y="446" font-size="10.5" font-weight="bold" fill="#78350f">只有一条真硬依赖</text>
  <text x="628" y="466" font-size="8.8" fill="#334155">告警篇不能跳查询篇直接读</text>
  <text x="628" y="486" font-size="8.8" fill="#334155">因为规则就是定时跑一条 PromQL</text>
  <text x="628" y="510" font-size="8.5" fill="#64748b">其余五篇都可以在遇到问题时倒着翻</text>
  <text x="628" y="528" font-size="8.5" fill="#64748b">读完 ① 与 ② 就已经能看懂大部分现象</text>

  <rect x="20" y="566" width="960" height="56" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="8"/>
  <text x="38" y="588" font-size="10.5" font-weight="bold" fill="#0f172a">贯穿全册的唯一判据：先分清「数据没进来」还是「进来了但算错了」</text>
  <text x="38" y="608" font-size="9" fill="#475569">没进来查 ③ 的失败形态；进来了但不对，回 ④ 的五个坑。两件事的排查工具与顺序完全不同，混在一起会白花时间</text>
</svg>
