<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="rd1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="490" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">可观测性目录主线：从选型决策到实现篇</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">选型篇是唯一的决策入口；两篇实现篇都以它为前置，互不依赖，按选型结果任选一条读</text>

  <rect x="270" y="82" width="460" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">① 可观测性选型对比 · 第一节</text>
  <text x="500" y="127" text-anchor="middle" font-size="11.5" fill="#1d4ed8">先建立「排查链条三段」的框架：三支柱各自解决什么</text>
  <line x1="500" y1="138" x2="500" y2="158" stroke="#334155" stroke-width="1.6" marker-end="url(#rd1)"/>

  <rect x="270" y="162" width="460" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">② 可观测性选型对比 · 第二节</text>
  <text x="500" y="207" text-anchor="middle" font-size="11.5" fill="#1d4ed8">链路追踪怎么选 + 契合语言维度（探针成熟度是隐性成本大头）</text>

  <line x1="500" y1="218" x2="500" y2="236" stroke="#334155" stroke-width="1.6"/>
  <line x1="250" y1="236" x2="750" y2="236" stroke="#334155" stroke-width="1.6"/>
  <line x1="250" y1="236" x2="250" y2="256" stroke="#334155" stroke-width="1.6" marker-end="url(#rd1)"/>
  <line x1="750" y1="236" x2="750" y2="256" stroke="#334155" stroke-width="1.6" marker-end="url(#rd1)"/>
  <text x="262" y="248" font-size="12" font-weight="bold" fill="#0f172a">Java 为主</text>
  <text x="762" y="248" font-size="12" font-weight="bold" fill="#0f172a">Go / 多语言 / 走 OTel</text>

  <rect x="40" y="260" width="420" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="60" y="286" font-size="14" font-weight="bold" fill="#14532d">③ Skywalking.md（探针式 APM 主线）</text>
  <text x="60" y="310" font-size="11.5" fill="#166534">Trace / Segment / Span 分层 · 四层架构与数据流</text>
  <text x="60" y="332" font-size="11.5" fill="#166534">四语言探针无侵入原理 · UI 面板 · 11.0.0 三容器实跑</text>

  <rect x="540" y="260" width="420" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="560" y="286" font-size="14" font-weight="bold" fill="#14532d">③' Jaeger.md（OTel 路线主线）</text>
  <text x="560" y="310" font-size="11.5" fill="#166534">Trace / Span 概念 · 与 OpenTelemetry 的协作关系</text>
  <text x="560" y="332" font-size="11.5" fill="#166534">部署形态（all-in-one / v2 + ClickHouse）· 采样策略</text>

  <line x1="20" y1="376" x2="980" y2="376" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="404" font-size="13" fill="#0f172a">⭐ 两篇 tracing 篇的配合：Skywalking.md 讲「探针替你做掉多少事、绑定了什么」，Jaeger.md 讲「自己埋点换来多少自由」。</text>
  <text x="40" y="430" font-size="13" fill="#0f172a">⚠️ 具体判据（谁干什么、采样率怎么定、成本怎么降）只在选型篇写一份，零件篇指回去，不重复讲。</text>
  <text x="40" y="456" font-size="12" fill="#64748b">要接进自己的服务时直接跳语言分册（go / java / php），概念不清再回本目录；部署试水见 Skywalking 第五节或 Jaeger 第四节。</text>
</svg>
