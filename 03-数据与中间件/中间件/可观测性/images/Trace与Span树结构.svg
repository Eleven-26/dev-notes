<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="jt1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Trace 是一棵树：Span 是节点，SpanContext 是跨进程的「接力棒」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">子 span 的 parent_span_id 指向父 span，据此还原调用树；trace_id 全链路唯一</text>

  <rect x="240" y="96" width="240" height="58" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="360" y="121" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">GET /api/user</text>
  <text x="360" y="141" text-anchor="middle" font-size="11.5" fill="#1e3a8a">span A · parent = 空（根 span）</text>

  <rect x="60" y="236" width="240" height="58" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="180" y="261" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">SELECT users</text>
  <text x="180" y="281" text-anchor="middle" font-size="11.5" fill="#14532d">span B · parent = A</text>

  <rect x="380" y="236" width="240" height="58" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="500" y="261" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">RPC 调用</text>
  <text x="500" y="281" text-anchor="middle" font-size="11.5" fill="#14532d">span C · parent = A</text>

  <rect x="380" y="376" width="240" height="58" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="500" y="401" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">SQL 查询</text>
  <text x="500" y="421" text-anchor="middle" font-size="11.5" fill="#7c2d12">span D · parent = C</text>

  <polyline points="360,154 360,196 180,196" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
  <polyline points="360,196 500,196" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="180" y1="196" x2="180" y2="236" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#jt1)"/>
  <line x1="500" y1="196" x2="500" y2="236" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#jt1)"/>
  <line x1="500" y1="294" x2="500" y2="376" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#jt1)"/>

  <rect x="636" y="96" width="324" height="338" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="652" y="124" font-size="13" font-weight="bold" fill="#0f172a">SpanContext（跨进程的最小信息集）</text>
  <text x="652" y="150" font-size="12" fill="#334155">• trace_id + span_id + 采样标志</text>
  <text x="652" y="174" font-size="12" fill="#334155">• W3C 用 traceparent 头承载</text>
  <text x="652" y="198" font-size="12" fill="#b91c1c">• 混用 sw8 / uber-trace-id 会断链</text>
  <text x="652" y="232" font-size="13" font-weight="bold" fill="#0f172a">Span 上的字段</text>
  <text x="652" y="258" font-size="12" fill="#334155">• span_id / parent_span_id（树形）</text>
  <text x="652" y="282" font-size="12" fill="#334155">• 起止时间（瀑布图的数据）</text>
  <text x="652" y="306" font-size="12" fill="#334155">• Tag：http.status_code=500</text>
  <text x="652" y="330" font-size="12" fill="#334155">• Event：span.AddEvent</text>
  <text x="652" y="354" font-size="12" fill="#334155">• Baggage：随链路透传</text>
  <text x="652" y="378" font-size="12" fill="#b91c1c">  ⚠️ Baggage 别塞敏感信息</text>
  <text x="652" y="410" font-size="12" fill="#334155">Sampler 决定这棵树留不留档</text>

  <rect x="20" y="470" width="960" height="88" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="36" y="498" font-size="12.5" fill="#0f172a">⭐ 一句话：Trace 是树，Span 是节点，SpanContext 是跨进程的「接力棒」，Sampler 决定这棵树留不留档。</text>
  <text x="36" y="524" font-size="12.5" fill="#0f172a">生产推荐 ParentBased(TraceIDRatioBased(x))：保证同一 trace 全链路采样决策一致，避免「下游有、上游无」。</text>
  <text x="36" y="548" font-size="12.5" fill="#b91c1c">⚠️ 上游注入 traceparent、下游只认 sw8，链路会断成两段互不相干的 trace。</text>
</svg>
