<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Jaeger 册的五篇：一条主线，两处回查</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">实线是建议的阅读顺序；虚线是用到再回查——架构是地基，数据模型是所有排障的终点</text>

  <rect x="60" y="88" width="330" height="76" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="76" y="114" font-size="13.5" font-weight="bold" fill="#1e3a8a">① 架构与部署</text>
  <text x="76" y="136" font-size="11.5" fill="#1e3a8a">v2 就是 OTel Collector、五个子命令</text>
  <text x="76" y="154" font-size="11.5" fill="#1e3a8a">存储五候选、两容器四个坑</text>

  <line x1="225" y1="164" x2="225" y2="190" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a1)"/>

  <rect x="60" y="190" width="330" height="76" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="76" y="216" font-size="13.5" font-weight="bold" fill="#1e3a8a">② 采集与传播</text>
  <text x="76" y="238" font-size="11.5" fill="#1e3a8a">traceparent 四字段、三处采样点</text>
  <text x="76" y="256" font-size="11.5" fill="#1e3a8a">五个断点、MQ 的 Inject 与 Extract</text>

  <line x1="225" y1="266" x2="225" y2="292" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a1)"/>

  <rect x="60" y="292" width="330" height="76" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="76" y="318" font-size="13.5" font-weight="bold" fill="#7c2d12">③ 数据模型与查询</text>
  <text x="76" y="340" font-size="11.5" fill="#7c2d12">十一张表、纳秒存微秒报</text>
  <text x="76" y="358" font-size="11.5" fill="#7c2d12">六类查询的便宜与贵</text>

  <line x1="225" y1="368" x2="225" y2="394" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a1)"/>

  <rect x="60" y="394" width="330" height="76" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="76" y="420" font-size="13.5" font-weight="bold" fill="#1e3a8a">④ UI 与排障</text>
  <text x="76" y="442" font-size="11.5" fill="#1e3a8a">两个视口、界面每列的数据来源</text>
  <text x="76" y="460" font-size="11.5" fill="#1e3a8a">七问排障、三种服务列表杂音</text>

  <line x1="225" y1="470" x2="225" y2="496" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a1)"/>

  <rect x="60" y="496" width="330" height="76" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="76" y="522" font-size="13.5" font-weight="bold" fill="#1e3a8a">⑤ 集成与生态</text>
  <text x="76" y="544" font-size="11.5" fill="#1e3a8a">四条边界、要不要前置 Collector</text>
  <text x="76" y="562" font-size="11.5" fill="#1e3a8a">指标日志拓扑怎么补、三档接入</text>

  <rect x="470" y="88" width="470" height="484" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="492" y="118" font-size="14" font-weight="bold" fill="#0f172a">全册一句话</text>
  <text x="492" y="146" font-size="12.5" fill="#334155">Jaeger 不预聚合：span 原样存起来，提问时再扫。</text>

  <text x="492" y="182" font-size="12.5" font-weight="bold" fill="#7c2d12">这句决定了四件事</text>
  <text x="492" y="208" font-size="11.5" fill="#334155">· 没有首页大盘，只有「先搜再钻」两个视口</text>
  <text x="492" y="230" font-size="11.5" fill="#334155">· 加查询维度不用重启，代价是按属性搜要扫</text>
  <text x="492" y="252" font-size="11.5" fill="#334155">· 成本跟 span 条数成正比，采样是头等大事</text>
  <text x="492" y="274" font-size="11.5" fill="#334155">· 指标、告警、日志、拓扑都要外部补</text>

  <text x="492" y="312" font-size="12.5" font-weight="bold" fill="#1e3a8a">两处回查</text>
  <text x="492" y="338" font-size="11.5" fill="#334155">「查不到数据」→ 回 ③ 看单位与排序键</text>
  <text x="492" y="360" font-size="11.5" fill="#334155">「起不来 / 写不进」→ 回 ① 看四个坑</text>

  <text x="492" y="398" font-size="12.5" font-weight="bold" fill="#b91c1c">本册实测边界</text>
  <text x="492" y="424" font-size="11.5" fill="#7f1d1d">跑通：写入 3 条 span、六类查询、尾部采样</text>
  <text x="492" y="446" font-size="11.5" fill="#7f1d1d">未跑：语言 SDK、ES / Cassandra、多副本</text>
  <text x="492" y="468" font-size="11.5" fill="#7f1d1d">界面只验证可访问，未做浏览器交互</text>

  <rect x="492" y="492" width="426" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="508" y="516" font-size="11.5" fill="#334155">接入代码不在本册：Go / Java 各有接入Jaeger.md，</text>
  <text x="508" y="536" font-size="11.5" fill="#334155">与接入Skywalking.md 同一命名口径。</text>

  <line x1="390" y1="330" x2="470" y2="330" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a2)"/>
  <line x1="390" y1="126" x2="470" y2="126" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a2)"/>
</svg>
