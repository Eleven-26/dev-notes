<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="gw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">「网关」的五种含义：先对齐名词，再谈选型</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">同一个「网关」在五个层次上被使用 —— 选错层，就会拿 Kong 的插件清单去比 Nginx 的性能数字</text>

  <rect x="40" y="116" width="500" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="60" y="146" font-size="14" font-weight="bold" fill="#1e3a8a">① 流量网关</text>
  <text x="60" y="168" font-size="11.5" fill="#1d4ed8">Nginx / OpenResty · TLS 卸载、静态、L4/L7 转发、WAF</text>
  <rect x="444" y="130" width="82" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="485" y="152" text-anchor="middle" font-size="11" fill="#334155">南北向</text>

  <rect x="40" y="190" width="500" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="60" y="220" font-size="14" font-weight="bold" fill="#1e3a8a">② API 网关</text>
  <text x="60" y="242" font-size="11.5" fill="#1d4ed8">APISIX / Kong / Tyk / KrakenD · 认证、限流、路由、灰度、插件</text>
  <rect x="444" y="204" width="82" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="485" y="226" text-anchor="middle" font-size="11" fill="#334155">南北向</text>

  <rect x="40" y="264" width="500" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="60" y="294" font-size="14" font-weight="bold" fill="#1e3a8a">③ 微服务网关</text>
  <text x="60" y="316" font-size="11.5" fill="#1d4ed8">Spring Cloud Gateway / Kratos 网关 · 服务发现、按服务名路由</text>
  <rect x="444" y="278" width="82" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="485" y="300" text-anchor="middle" font-size="11" fill="#334155">南北向</text>

  <rect x="40" y="338" width="500" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="60" y="368" font-size="14" font-weight="bold" fill="#1e3a8a">④ K8s 入口网关</text>
  <text x="60" y="390" font-size="11.5" fill="#1d4ed8">Ingress / Gateway API / Traefik · 集群入口抽象</text>
  <rect x="444" y="352" width="82" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="485" y="374" text-anchor="middle" font-size="11" fill="#334155">南北向</text>

  <rect x="600" y="116" width="370" height="284" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="620" y="146" font-size="14" font-weight="bold" fill="#7c2d12">⑤ 服务网格数据面</text>
  <text x="620" y="168" font-size="11.5" fill="#9a3412">Envoy（Istio）/ Linkerd / Cilium</text>
  <text x="620" y="190" font-size="11.5" fill="#9a3412">流量方向：东西向（服务 ↔ 服务）</text>

  <rect x="630" y="214" width="120" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="690" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">服务 A</text>
  <text x="690" y="258" text-anchor="middle" font-size="10.5" fill="#64748b">order</text>
  <rect x="820" y="214" width="120" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="880" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">服务 B</text>
  <text x="880" y="258" text-anchor="middle" font-size="10.5" fill="#64748b">inventory</text>

  <line x1="754" y1="234" x2="816" y2="234" stroke="#ea580c" stroke-width="1.5" marker-end="url(#gw)"/>
  <line x1="816" y1="252" x2="754" y2="252" stroke="#ea580c" stroke-width="1.5" marker-end="url(#gw)"/>

  <text x="620" y="300" font-size="11.5" fill="#9a3412">每个 Pod 一个 Sidecar：mTLS、重试、熔断、遥测</text>
  <text x="620" y="326" font-size="11.5" fill="#9a3412">⚠️ 网关管入口、网格管内部 —— 不是同层替代</text>
  <text x="620" y="352" font-size="11.5" fill="#9a3412">单体的 K8s 集群两者都不需要</text>

  <line x1="40" y1="440" x2="970" y2="440" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="468" font-size="13" font-weight="bold" fill="#0f172a">⭐ 怎么快速判断说的是哪一层，看两个问题就够了：</text>
  <text x="40" y="496" font-size="12" fill="#0f172a">① 流量从哪来？ 公网 / 客户端进来 → ①~④；服务与服务之间 → ⑤。</text>
  <text x="40" y="524" font-size="12" fill="#0f172a">② 要不要「按服务名」路由？ 要（/api/order → order-service）→ ③；只是转发到固定上游 → ①。</text>
  <text x="40" y="554" font-size="12" fill="#b91c1c">⚠️ 最高频的混淆：把 ⑤ 当成 ④ 的替代。</text>
</svg>
