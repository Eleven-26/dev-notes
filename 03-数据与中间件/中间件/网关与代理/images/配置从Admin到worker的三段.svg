<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB4" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwG4" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="372" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">改一条路由是一次 HTTP 写，不是一次 reload</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">APISIX 3.13.0 实跑：Admin API 写入后，实测 6 次请求在 290ms 内全部按新规则处理</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="620" height="278" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. etcd 模式下的三段</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">写入方、存储方、执行方彼此解耦</text>

    <rect x="14" y="60" width="592" height="54" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="82" font-size="11.5" font-weight="bold" fill="#1e40af">第一段：Admin API（默认 9180）</text>
    <text x="28" y="100" font-size="10" fill="#1e40af">PUT /apisix/admin/routes/rl，带 X-API-KEY</text>

    <line x1="310" y1="118" x2="310" y2="134" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB4)"/>
    <text x="320" y="130" font-size="9.5" fill="#2563eb">写入即落盘，与运行中的 worker 无关</text>

    <rect x="14" y="138" width="592" height="54" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="160" font-size="11.5" font-weight="bold" fill="#92400e">第二段：etcd 的 /apisix 前缀</text>
    <text x="28" y="178" font-size="10" fill="#92400e">两副本共享同一份，这是多副本对齐的根</text>

    <line x1="310" y1="196" x2="310" y2="212" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG4)"/>
    <text x="320" y="208" font-size="9.5" fill="#16a34a">watch 到变化即刷新内存表</text>

    <rect x="14" y="216" width="592" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="238" font-size="11.5" font-weight="bold" fill="#14532d">第三段：每个 worker 的内存路由表</text>
    <text x="28" y="256" font-size="10" fill="#14532d">连接不断、进程不换，所以不存在 reload 抖动</text>
  </g>

  <g transform="translate(660,74)">
    <rect x="0" y="0" width="320" height="278" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 与 reload 的差别</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">代价落在哪一段</text>

    <rect x="14" y="60" width="292" height="86" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="28" y="82" font-size="11.5" font-weight="bold" fill="#991b1b">Nginx：改文件 + reload</text>
    <text x="28" y="102" font-size="10" fill="#991b1b">重建 worker，旧连接要退出</text>
    <text x="28" y="120" font-size="10" fill="#991b1b">多台机器要逐台同步</text>
    <text x="28" y="138" font-size="10" fill="#991b1b">比例类参数改一次就是一次抖动</text>

    <rect x="14" y="158" width="292" height="104" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="180" font-size="11.5" font-weight="bold" fill="#14532d">APISIX：一次写 + watch</text>
    <text x="28" y="200" font-size="10" fill="#14532d">实测改 count 从 1 到 50</text>
    <text x="28" y="218" font-size="10" fill="#14532d">紧接着 6 次请求全部放行</text>
    <text x="28" y="236" font-size="10" fill="#14532d">6 次合计 290ms，无 reload</text>
    <text x="28" y="254" font-size="10" fill="#14532d">所有副本同一份配置</text>
  </g>
</svg>
