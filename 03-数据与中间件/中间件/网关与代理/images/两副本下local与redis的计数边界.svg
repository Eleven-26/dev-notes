<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwR6" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#dc2626"/></marker>
    <marker id="arwG6" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一条 count=5 的规则，两副本下实际放行 10 还是 5</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">APISIX 3.13.0 两副本共享同一份 etcd 配置，各交替打 10 次后的实测结果</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="460" height="346" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. policy=local（默认）</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">计数在各自进程的共享内存里</text>

    <rect x="14" y="58" width="432" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="80" font-size="11.5" font-weight="bold" fill="#1e40af">副本 1：自己的计数器</text>
    <text x="28" y="98" font-size="10" fill="#1e40af">从 0 数到 5，放行 5 个</text>

    <rect x="14" y="122" width="432" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="144" font-size="11.5" font-weight="bold" fill="#1e40af">副本 2：另一个计数器</text>
    <text x="28" y="162" font-size="10" fill="#1e40af">同样从 0 数到 5，再放行 5 个</text>

    <line x1="230" y1="180" x2="230" y2="204" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR6)"/>
    <text x="240" y="198" font-size="9.5" fill="#dc2626">两个计数器互不知情</text>

    <rect x="14" y="208" width="432" height="52" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="28" y="230" font-size="11.5" font-weight="bold" fill="#991b1b">实际总放行：10</text>
    <text x="28" y="248" font-size="10" fill="#991b1b">限额等于 5 乘副本数，扩到 10 副本就是 50</text>

    <rect x="14" y="276" width="432" height="56" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="298" font-size="10.5" fill="#92400e">实测顺序：20 次交替请求里前 8 次 200，</text>
    <text x="28" y="316" font-size="10.5" fill="#92400e">加上探测时的 2 次，合计正好 10 次放行。</text>
  </g>

  <g transform="translate(520,74)">
    <rect x="0" y="0" width="460" height="346" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. policy=redis</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">计数挪到两副本都能看见的地方</text>

    <rect x="14" y="58" width="180" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="78" font-size="11" font-weight="bold" fill="#1e40af">副本 1</text>
    <text x="28" y="96" font-size="9.5" fill="#1e40af">不自己计数</text>

    <rect x="14" y="122" width="180" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="142" font-size="11" font-weight="bold" fill="#1e40af">副本 2</text>
    <text x="28" y="160" font-size="9.5" fill="#1e40af">不自己计数</text>

    <line x1="198" y1="82" x2="264" y2="104" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG6)"/>
    <line x1="198" y1="146" x2="264" y2="124" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG6)"/>

    <rect x="268" y="70" width="178" height="88" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="282" y="92" font-size="11.5" font-weight="bold" fill="#92400e">Redis 里的一个计数</text>
    <text x="282" y="112" font-size="10" fill="#92400e">key 形如 plugin-limit-count</text>
    <text x="282" y="128" font-size="10" fill="#92400e">加路由 id 加客户端地址</text>
    <text x="282" y="146" font-size="10" fill="#92400e">超过 5 谁都拿不到</text>

    <line x1="230" y1="180" x2="230" y2="204" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG6)"/>
    <text x="240" y="198" font-size="9.5" fill="#16a34a">一份计数裁决两边</text>

    <rect x="14" y="208" width="432" height="52" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="230" font-size="11.5" font-weight="bold" fill="#14532d">实际总放行：5</text>
    <text x="28" y="248" font-size="10" fill="#14532d">与配置一致，代价是 Redis 成了限流的单点</text>

    <rect x="14" y="276" width="432" height="56" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="298" font-size="10.5" fill="#92400e">实测：清空 Redis 后 20 次交替请求里</text>
    <text x="28" y="316" font-size="10.5" fill="#92400e">恰好 5 次 200，其余全部 429。</text>
  </g>
</svg>
