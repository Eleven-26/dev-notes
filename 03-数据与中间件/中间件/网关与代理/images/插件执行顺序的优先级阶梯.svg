<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwU5" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一个路由上挂多个插件，谁先跑由 priority 决定</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">APISIX 3.13.0 内置 93 个插件，下表为 Admin API 返回的 priority 原值，越靠上越先执行</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="430" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">执行顺序阶梯</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">从上到下 priority 递减；同一请求先过后面的、再过前面的</text>

    <line x1="70" y1="382" x2="70" y2="62" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwU5)"/>
    <text x="58" y="230" font-size="10" fill="#2563eb" transform="rotate(-90 58 230)">priority 增大方向</text>

    <rect x="100" y="58" width="480" height="32" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="114" y="79" font-size="11" font-weight="bold" fill="#14532d">ip-restriction</text>
    <text x="500" y="79" font-size="11" fill="#14532d">3000</text>
    <text x="600" y="79" font-size="10.5" fill="#14532d">排在认证之前，能挡住无限刷 401 的流量</text>

    <rect x="100" y="102" width="480" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="114" y="123" font-size="11" fill="#334155">jwt-auth</text>
    <text x="500" y="123" font-size="11" fill="#334155">2510</text>

    <rect x="100" y="146" width="480" height="32" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="114" y="167" font-size="11" font-weight="bold" fill="#1e40af">key-auth</text>
    <text x="500" y="167" font-size="11" fill="#1e40af">2500</text>
    <text x="600" y="167" font-size="10.5" fill="#1e40af">认证在限流之前，实测 10 次 401 不消耗配额</text>

    <rect x="100" y="190" width="480" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="114" y="211" font-size="11" fill="#334155">proxy-rewrite</text>
    <text x="500" y="211" font-size="11" fill="#334155">1008</text>
    <text x="600" y="211" font-size="10.5" fill="#334155">先改 URI，分流看到的是改写后的地址</text>

    <rect x="100" y="234" width="480" height="32" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="114" y="255" font-size="11" font-weight="bold" fill="#92400e">limit-count</text>
    <text x="500" y="255" font-size="11" fill="#92400e">1002</text>
    <text x="600" y="255" font-size="10.5" fill="#92400e">固定窗口计数，默认拒绝体是 HTML</text>

    <rect x="100" y="278" width="480" height="32" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="114" y="299" font-size="11" font-weight="bold" fill="#92400e">limit-req</text>
    <text x="500" y="299" font-size="11" fill="#92400e">1001</text>
    <text x="600" y="299" font-size="10.5" fill="#92400e">漏桶，nodelay 为 false 时是延迟不是拒绝</text>

    <rect x="100" y="322" width="480" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="114" y="343" font-size="11" fill="#334155">traffic-split</text>
    <text x="500" y="343" font-size="11" fill="#334155">966</text>
    <text x="600" y="343" font-size="10.5" fill="#334155">排在限流之后，两个版本共用一份配额</text>

    <rect x="100" y="366" width="480" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="114" y="387" font-size="11" fill="#334155">prometheus</text>
    <text x="500" y="387" font-size="11" fill="#334155">500</text>
    <text x="600" y="387" font-size="10.5" fill="#334155">最后执行，记录的是最终响应</text>

    <text x="14" y="418" font-size="10" fill="#64748b">注：real-ip 23000、request-id 12015、zipkin 12011 都高于本表所有行，本篇正文第三节有完整读数。</text>
  </g>
</svg>
