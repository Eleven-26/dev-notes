<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 492" width="1000" height="492" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="dir" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="492" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">网关与代理目录：两篇正文的分工与相邻目录的责任</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">先判断问题属于「选哪个」还是「怎么写」，再看同一问题在别处的主答案</text>
  <line x1="30" y1="74" x2="970" y2="74" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="30" y="96" width="230" height="136" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="42" y="124" font-size="13.5" font-weight="bold" fill="#1e3a8a">问题一：选哪个</text>
  <text x="42" y="150" font-size="12" fill="#0f172a">流量网关、API 网关、微服务</text>
  <text x="42" y="170" font-size="12" fill="#0f172a">网关，到底该用哪种？</text>
  <text x="42" y="190" font-size="12" fill="#0f172a">Nginx 够不够、要不要上网格？</text>
  <text x="42" y="214" font-size="11.5" fill="#64748b">→ 只关心「够不够、选哪个」</text>

  <rect x="330" y="96" width="280" height="136" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="342" y="124" font-size="14" font-weight="bold" fill="#14532d">网关选型对比.md</text>
  <text x="342" y="150" font-size="11.5" fill="#14532d">「网关」的五种含义 + 六个选型维度</text>
  <text x="342" y="170" font-size="11.5" fill="#14532d">四层横向对比 + 决策速查表</text>
  <text x="342" y="190" font-size="11.5" fill="#14532d">Nginx 能力边界的四组本机实测</text>
  <text x="342" y="210" font-size="11.5" fill="#14532d">上线检查单与五个高频的坑</text>

  <rect x="680" y="96" width="290" height="136" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="692" y="124" font-size="13" font-weight="bold" fill="#334155">相邻目录：各有主答案</text>
  <text x="692" y="150" font-size="11.5" fill="#0f172a">中间件选型.md：族与子类粒度</text>
  <text x="692" y="170" font-size="11.5" fill="#0f172a">04 服务治理：LB / 服务发现理论</text>
  <text x="692" y="190" font-size="11.5" fill="#0f172a">06 容器与编排选型：要不要上网格</text>
  <text x="692" y="214" font-size="11.5" fill="#64748b">本目录不重复这些推导</text>

  <line x1="260" y1="164" x2="326" y2="164" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#dir)"/>
  <line x1="610" y1="164" x2="676" y2="164" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#dir)"/>

  <rect x="30" y="272" width="230" height="136" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="42" y="300" font-size="12.5" font-weight="bold" fill="#1e3a8a">问题二：怎么写、为什么没生效</text>
  <text x="42" y="326" font-size="12" fill="#0f172a">鉴权 / 限流 / 灰度写在哪？</text>
  <text x="42" y="346" font-size="12" fill="#0f172a">Lua 该挂在哪个阶段？</text>
  <text x="42" y="366" font-size="12" fill="#0f172a">配置配了为什么测不出来？</text>
  <text x="42" y="390" font-size="11.5" fill="#64748b">→ 关心「配置与代码怎么写」</text>

  <rect x="330" y="272" width="280" height="136" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="342" y="300" font-size="14" font-weight="bold" fill="#1e3a8a">OpenResty.md</text>
  <text x="342" y="326" font-size="11.5" fill="#1e3a8a">执行阶段 × Lua 入口的对照与判据</text>
  <text x="342" y="346" font-size="11.5" fill="#1e3a8a">ngx.* API 速查 + cosocket 硬限制</text>
  <text x="342" y="366" font-size="11.5" fill="#1e3a8a">六个典型能力 + photography 接入</text>
  <text x="342" y="386" font-size="11.5" fill="#1e3a8a">部署、上线检查与故障速查</text>

  <rect x="680" y="272" width="290" height="136" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="692" y="300" font-size="13" font-weight="bold" fill="#334155">相邻目录：各有主答案</text>
  <text x="692" y="326" font-size="11.5" fill="#0f172a">Nginx配置语义.md：四组配置实测</text>
  <text x="692" y="346" font-size="11.5" fill="#0f172a">Lua语法够用版.md：语言子集</text>
  <text x="692" y="366" font-size="11.5" fill="#0f172a">14-OpenResty生态.md：版本与生态</text>
  <text x="692" y="390" font-size="11.5" fill="#64748b">本目录只讲「怎么用起来」</text>

  <line x1="260" y1="340" x2="326" y2="340" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#dir)"/>
  <line x1="610" y1="340" x2="676" y2="340" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#dir)"/>

  <line x1="30" y1="428" x2="970" y2="428" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="452" font-size="12.5" font-weight="bold" fill="#0f172a">判据：把具体产品换掉，这段话还成立吗？成立 → 去 04 分布式看理论；不成立 → 留在本目录看产品。</text>
  <text x="30" y="474" font-size="12" fill="#475569">同一个知识点只留一处主答案：选型看左边那篇，写法看右边那篇，配置语义去 02 网络。</text>
</svg>
