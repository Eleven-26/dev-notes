<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 830" width="1000" height="830" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arwR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arwG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="830" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">图数据库候选的四个族：差别在存储实现</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">功能表各家都能凑齐，存储实现才是判据；本仓只对 Neo4j 做过容器实测</text>

  <rect x="30" y="72" width="940" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="90" font-size="11" font-weight="bold" fill="#475569">存储形态（机制）</text>
  <text x="444" y="90" font-size="11" font-weight="bold" fill="#475569">遍历代价</text>
  <text x="708" y="90" font-size="11" font-weight="bold" fill="#475569">规模与主战场</text>

  <g>
    <rect x="30" y="106" width="940" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="44" y="126" font-size="12.5" font-weight="bold" fill="#1e3a8a">第一族 · 原生图存储：定长记录 + 记录号指针</text>

    <rect x="44" y="140" width="386" height="100" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="52" y="156" font-size="9.5" font-weight="bold" fill="#1d4ed8">节点记录 + 关系记录 = 双向指针</text>
    <circle cx="95" cy="200" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="95" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">A</text>
    <circle cx="215" cy="172" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="215" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">B</text>
    <circle cx="215" cy="228" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="215" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">C</text>
    <line x1="110" y1="194" x2="199" y2="178" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="112" y1="201" x2="201" y2="185" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arwB)"/>
    <line x1="110" y1="207" x2="199" y2="222" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="215" y1="189" x2="215" y2="210" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="232" y1="178" x2="299" y2="195" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arwB)"/>
    <line x1="232" y1="222" x2="299" y2="205" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arwB)"/>
    <circle cx="320" cy="200" r="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="320" y="204" text-anchor="middle" font-size="10" fill="#64748b">…</text>
    <text x="248" y="164" font-size="8.5" fill="#64748b">每条边是一条记录</text>
    <text x="52" y="232" font-size="9.5" fill="#1e3a8a">不经索引查找</text>

    <rect x="444" y="140" width="250" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="452" y="158" font-size="10.5" font-weight="bold" fill="#14532d">每跳接近常数开销</text>
    <text x="452" y="176" font-size="9.5" fill="#166534">本仓 Neo4j 实测到的「每跳 O(1)」</text>
    <text x="452" y="192" font-size="9.5" fill="#166534">就是这一族的结论</text>
    <text x="452" y="208" font-size="9.5" fill="#166534">深跳、变长路径最省力</text>
    <rect x="450" y="214" width="238" height="22" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="456" y="229" font-size="9" fill="#991b1b">⚠ 只属于这一族，不能外推到 KV 族</text>

    <rect x="708" y="140" width="250" height="100" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="716" y="158" font-size="10.5" font-weight="bold" fill="#0f172a">结构性短板：天然偏单机</text>
    <text x="716" y="176" font-size="9.5" fill="#334155">记录号 × 定长寻址要求邻接记录</text>
    <text x="716" y="192" font-size="9.5" fill="#334155">物理可达、寻址是常数</text>
    <text x="716" y="208" font-size="9.5" fill="#334155">边分到多台机器，指针就变成跨网查询</text>
    <text x="716" y="224" font-size="9.5" fill="#334155">代表：Neo4j（本仓唯一实测）</text>
    <text x="716" y="238" font-size="9.5" fill="#64748b">Memgraph / TigerGraph 一系未实测</text>
  </g>

  <g>
    <rect x="30" y="268" width="940" height="138" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="44" y="288" font-size="12.5" font-weight="bold" fill="#1e3a8a">第二族 · 构建在 KV / 列族之上：邻接编码成键值对</text>

    <rect x="44" y="302" width="386" height="88" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="52" y="320" font-size="9.5" font-weight="bold" fill="#1d4ed8">邻接写成 outKey -&gt; 邻接表，按 key 查</text>
    <rect x="52" y="332" width="112" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="108" y="348" text-anchor="middle" font-size="9.5" fill="#334155">RocksDB</text>
    <text x="108" y="366" text-anchor="middle" font-size="9" fill="#64748b">单机有序 KV</text>
    <rect x="172" y="332" width="112" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="228" y="348" text-anchor="middle" font-size="9.5" fill="#334155">Cassandra</text>
    <text x="228" y="366" text-anchor="middle" font-size="9" fill="#64748b">宽列 + 分区</text>
    <rect x="292" y="332" width="112" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="348" y="348" text-anchor="middle" font-size="9.5" fill="#334155">HBase</text>
    <text x="348" y="366" text-anchor="middle" font-size="9" fill="#64748b">region 分片</text>
    <text x="52" y="386" font-size="9" fill="#64748b">图的点边落在后端分片上，扩展性继承后端</text>

    <rect x="444" y="302" width="250" height="88" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
    <text x="452" y="318" font-size="9.5" font-weight="bold" fill="#92400e">每跳至少一次按 key 查询</text>
    <text x="452" y="334" font-size="9" fill="#92400e">一跳一跳乘下去（可能跨分区 / 跨节点）</text>
    <text x="452" y="350" font-size="9.5" font-weight="bold" fill="#92400e">⚠ 不能套用「每跳 O(1)」</text>
    <rect x="450" y="356" width="238" height="24" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="456" y="372" font-size="9.5" fill="#991b1b">深跳时 KV 层固定开销占主导</text>
    <text x="456" y="386" font-size="9" fill="#991b1b">遍历要「解码 KV」</text>

    <rect x="708" y="302" width="250" height="88" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="716" y="318" font-size="10.5" font-weight="bold" fill="#0f172a">规模上限高</text>
    <text x="716" y="334" font-size="9.5" fill="#334155">天然分片 + 多数派</text>
    <text x="716" y="350" font-size="9.5" fill="#334155">复用成熟分布式存储的运维体系</text>
    <text x="716" y="366" font-size="9.5" fill="#334155">已过单机容量、必须多副本时看这族</text>
    <text x="716" y="382" font-size="9.5" fill="#64748b">NebulaGraph / JanusGraph / HugeGraph</text>

    <rect x="708" y="388" width="250" height="16" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="833" y="399" text-anchor="middle" font-size="9" fill="#64748b">本仓均未实测，边界以官方文档为准</text>
  </g>

  <g>
    <rect x="30" y="418" width="940" height="126" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="44" y="438" font-size="12.5" font-weight="bold" fill="#1e3a8a">第三族 · 多模数据库里的图模块：引擎不变，叠一层图能力</text>

    <rect x="44" y="452" width="386" height="82" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <rect x="100" y="464" width="270" height="24" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="235" y="480" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e3a8a">图能力 + 图查询语法（叠加层）</text>
    <line x1="165" y1="490" x2="165" y2="500" stroke="#64748b" stroke-width="1.3" marker-end="url(#arwG)"/>
    <line x1="235" y1="490" x2="235" y2="500" stroke="#64748b" stroke-width="1.3" marker-end="url(#arwG)"/>
    <line x1="305" y1="490" x2="305" y2="500" stroke="#64748b" stroke-width="1.3" marker-end="url(#arwG)"/>
    <rect x="60" y="502" width="350" height="22" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="235" y="516" text-anchor="middle" font-size="9.5" fill="#334155">本体：文档 / KV / 宽表引擎</text>
    <text x="52" y="530" font-size="8.5" fill="#64748b">图只是它支持的其中一种模型，存储与事务都跟着本体引擎走</text>

    <rect x="444" y="452" width="250" height="82" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="452" y="468" font-size="10.5" font-weight="bold" fill="#991b1b">图只是顺带支持</text>
    <text x="452" y="484" font-size="9.5" fill="#991b1b">遍历深度、图算法丰富度不及专精族</text>
    <text x="452" y="500" font-size="9.5" fill="#991b1b">纯图库的建模表达力通常也弱一档</text>
    <text x="452" y="516" font-size="9.5" fill="#991b1b">一库多能反而摊薄了图侧投入</text>
    <text x="452" y="530" font-size="9" fill="#991b1b">⚠ 多跳是唯一主查询时别选它</text>

    <rect x="708" y="452" width="250" height="82" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="716" y="468" font-size="10.5" font-weight="bold" fill="#0f172a">少一个组件</text>
    <text x="716" y="484" font-size="9.5" fill="#334155">数据本就在同一库里，省掉同步管道</text>
    <text x="716" y="500" font-size="9.5" fill="#334155">适合：图只是多种负载之一</text>
    <text x="716" y="516" font-size="9.5" fill="#334155">能接受够用即可的团队</text>
    <text x="716" y="530" font-size="9.5" fill="#64748b">代表：ArangoDB 一系（未实测）</text>
  </g>

  <g>
    <rect x="30" y="556" width="940" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="44" y="576" font-size="12.5" font-weight="bold" fill="#1e3a8a">第四族 · 图能力作为计算层 / 托管服务：两条子路线</text>

    <rect x="44" y="590" width="386" height="96" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <rect x="52" y="598" width="370" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="237" y="613" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">子路线一：云上托管图库</text>
    <text x="237" y="627" text-anchor="middle" font-size="8.5" fill="#1d4ed8">运维 / 集群 / 备份交给云</text>
    <rect x="52" y="640" width="370" height="42" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
    <text x="237" y="657" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">子路线二：不存图，只算图</text>
    <text x="237" y="674" text-anchor="middle" font-size="8.5" fill="#92400e">图数据留在已有存储，临时加载做全图算法</text>

    <rect x="444" y="590" width="250" height="96" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="452" y="608" font-size="10" font-weight="bold" fill="#991b1b">离线路线不是在线库</text>
    <text x="452" y="624" font-size="9.5" fill="#991b1b">不提供在线低延迟多跳查询</text>
    <text x="452" y="640" font-size="9.5" font-weight="bold" fill="#991b1b">是「算一次」不是「随时查」</text>
    <text x="452" y="660" font-size="9.5" fill="#991b1b">托管路线：成本随规模走</text>
    <text x="452" y="676" font-size="9.5" fill="#991b1b">可移植性弱、深度定制受限</text>

    <rect x="708" y="590" width="250" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="716" y="608" font-size="10" font-weight="bold" fill="#0f172a">全图算法在批处理里最划算</text>
    <text x="716" y="624" font-size="9.5" fill="#334155">PageRank / 社区发现 / 连通分量</text>
    <text x="716" y="640" font-size="9.5" fill="#334155">复用现有数据湖 / 数仓</text>
    <text x="716" y="656" font-size="9.5" fill="#334155">只是偶尔跑一次就别常驻在线图库</text>
    <text x="716" y="672" font-size="9.5" fill="#64748b">云厂商托管图库；离线如 GraphX 一系</text>
  </g>

  <rect x="30" y="708" width="940" height="104" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="728" font-size="11" font-weight="bold" fill="#0f172a">读图口径</text>
  <text x="44" y="748" font-size="10" fill="#334155">⭐ 四族的根本差异在存储实现，不在功能表：它直接决定规模天花板与遍历代价的来源</text>
  <text x="44" y="766" font-size="10" fill="#334155">⚠ 除 Neo4j 外本仓未实测，能力边界以官方文档为准；「每跳 O(1)」只属于第一族的定长记录 + 指针模型</text>
  <text x="44" y="784" font-size="10" fill="#334155">⚠ 跨族比性能数字尤其没意义：两个成本模型无法用同一个跑分口径同时公平衡量</text>
</svg>
