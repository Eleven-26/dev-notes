<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arwR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arwB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="780" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">图库选型决策流：一道准入门槛 + 六个按顺序问的问题</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">门槛与问题①~⑥取自本篇第四节判据和第二节决策表；⚠️ 除 Neo4j 外的产品为文档陈述、本仓未实测</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="686" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <rect x="300" y="22" width="360" height="54" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="480" y="44" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">准入门槛：多跳关系查询是不是「主查询」？</text>
    <text x="480" y="64" text-anchor="middle" font-size="10.5" fill="#334155">判据是主查询，不是「有没有多跳查询」</text>

    <line x1="300" y1="49" x2="150" y2="49" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arwR)"/>
    <rect x="30" y="26" width="118" height="46" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
    <text x="89" y="46" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#475569">否 → 别上图库</text>
    <text x="89" y="64" text-anchor="middle" font-size="10" fill="#334155">关系型 + 索引足够</text>

    <line x1="480" y1="76" x2="480" y2="104" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
    <text x="494" y="96" font-size="10.5" fill="#15803d">是 ↓</text>

    <rect x="300" y="108" width="360" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="480" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">① 数据规模到多少？（一票否决级）</text>
    <text x="480" y="152" text-anchor="middle" font-size="10.5" fill="#334155">单机可容纳（约亿级以下）vs 十亿级以上</text>

    <line x1="300" y1="138" x2="205" y2="196" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="660" y1="138" x2="755" y2="196" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

    <rect x="70" y="200" width="270" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="205" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Neo4j 档位（本仓实测档）</text>
    <text x="205" y="246" text-anchor="middle" font-size="10.5" fill="#334155">完整 ACID + 单机 + 开箱图算法（GDS）</text>
    <text x="205" y="264" text-anchor="middle" font-size="10.5" fill="#64748b">原生图存储，每跳 O(1) 无索引邻接</text>

    <rect x="620" y="200" width="310" height="76" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
    <text x="775" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">NebulaGraph / TigerGraph 档位</text>
    <text x="775" y="246" text-anchor="middle" font-size="10.5" fill="#334155">十亿级以上、必须分布式（Raft / 原生分布式）</text>
    <text x="775" y="264" text-anchor="middle" font-size="10.5" fill="#64748b">构建在 KV / 列族上，遍历要「解码 KV」</text>

    <line x1="205" y1="276" x2="205" y2="312" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

    <rect x="40" y="316" width="880" height="220" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="56" y="342" font-size="13" font-weight="bold" fill="#0f172a">选 Neo4j 档后继续问（第一个卡住的问题就是决定性因素）</text>

    <rect x="56" y="358" width="200" height="74" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="156" y="380" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#475569">② 要多强的一致性？</text>
    <text x="156" y="400" text-anchor="middle" font-size="10" fill="#334155">完整 ACID + 单机 → Neo4j</text>
    <text x="156" y="416" text-anchor="middle" font-size="10" fill="#334155">分布式强一致 → Nebula（Raft）</text>

    <rect x="272" y="358" width="200" height="74" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="372" y="380" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#475569">③ 团队主力语言？</text>
    <text x="372" y="400" text-anchor="middle" font-size="10" fill="#334155">Java / Python 最贴 Neo4j</text>
    <text x="372" y="416" text-anchor="middle" font-size="10" fill="#334155">JVM 生态 → JanusGraph 最顺</text>

    <rect x="488" y="358" width="200" height="74" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="588" y="380" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#475569">④ 需要图算法吗？</text>
    <text x="588" y="400" text-anchor="middle" font-size="10" fill="#334155">需要 → Neo4j + GDS（实测可用）</text>
    <text x="588" y="416" text-anchor="middle" font-size="10" fill="#334155">不需要 → 这项不加权</text>

    <rect x="704" y="358" width="200" height="74" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="804" y="380" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#475569">⑤ 谁运维？</text>
    <text x="804" y="400" text-anchor="middle" font-size="10" fill="#334155">不想自己运维 → Aura 托管</text>
    <text x="804" y="416" text-anchor="middle" font-size="10" fill="#334155">自建 → Nebula / JanusGraph</text>

    <rect x="56" y="446" width="200" height="74" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="156" y="468" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#475569">⑥ 查询语言能接受？</text>
    <text x="156" y="488" text-anchor="middle" font-size="10" fill="#334155">Cypher（GQL 背书）/ Gremlin</text>
    <text x="156" y="504" text-anchor="middle" font-size="10" fill="#334155">/ nGQL、GSQL 是私有的</text>

    <rect x="272" y="446" width="632" height="74" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="288" y="468" font-size="11.5" font-weight="bold" fill="#dc2626">⚠️ 全程压顶的硬约束：社区版能力边界（本仓实测）</text>
    <text x="288" y="488" font-size="10.5" fill="#334155">无集群、无在线备份、无 org.neo4j:* 细指标 —— 「要 HA / 在线备份」会直接把选型推向企业版 / Aura；</text>
    <text x="288" y="506" font-size="10.5" fill="#334155">这是选型里最容易低估的成本项 —— 即便前四问都指向 Neo4j，这一条也会把方案推向企业版 / Aura。</text>

    <text x="40" y="572" font-size="12" fill="#334155">收口：走到任何一步想验证「多跳真的更快吗」，用第五节的 30 分钟可行性判定 —— 隔离容器 + 真实数据 + 先建索引，只认一条判据：同一个业务查询谁快、差多少。</text>
    <text x="40" y="596" font-size="12" fill="#64748b">参照读数（10 万用户 / 30 万边）：1~4 跳 Neo4j 与 MySQL 都在亚毫秒~毫秒级；5 跳起拉开（4.37 ms vs 277 µs）、6 跳 16.9 ms vs 230 µs。</text>
    <text x="40" y="626" font-size="12" fill="#b45309">别拿宣传数字当判据：案例的机器规格、数据形态、查询模式都与你的不同 —— 共同点只有一条：价值来自「多跳」。</text>
  </g>
</svg>
