<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arwY" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arwN" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">「属性还是节点？」四问判定流程</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">四问即本篇 1.1 判据表的四行 —— 任何一问答「会 / 需要 / 有」就升格为节点；判据是「要不要以它为起点 / 被引用」，不是「像不像实体」</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="526" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <rect x="350" y="22" width="260" height="48" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
    <text x="480" y="42" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">待定的值（如「所在城市」）</text>
    <text x="480" y="60" text-anchor="middle" font-size="10.5" fill="#64748b">例：(订单)-[:下单]->(用户) 里的 city</text>

    <line x1="480" y1="70" x2="480" y2="94" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="330" y="98" width="300" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="480" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Q1 会不会被别人引用？</text>
    <text x="480" y="140" text-anchor="middle" font-size="10.5" fill="#334155">（作为关系的一端）</text>

    <rect x="330" y="174" width="300" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="480" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Q2 需不需要独立作为查询起点？</text>
    <text x="480" y="216" text-anchor="middle" font-size="10.5" fill="#334155">（「以城市为起点查」而不是过滤用户）</text>

    <rect x="330" y="250" width="300" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="480" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Q3 有没有自己的属性 / 关系？</text>
    <text x="480" y="292" text-anchor="middle" font-size="10.5" fill="#334155">（城市要挂经济数据、行政区划）</text>

    <rect x="330" y="326" width="300" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="480" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Q4 数量与复用度？</text>
    <text x="480" y="368" text-anchor="middle" font-size="10.5" fill="#334155">（会被大量共享、需要单独维护吗）</text>

    <line x1="480" y1="150" x2="480" y2="168" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arwN)"/>
    <text x="492" y="164" font-size="10.5" fill="#b45309">不会</text>
    <line x1="480" y1="226" x2="480" y2="244" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arwN)"/>
    <text x="492" y="240" font-size="10.5" fill="#b45309">不需要</text>
    <line x1="480" y1="302" x2="480" y2="320" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arwN)"/>
    <text x="492" y="316" font-size="10.5" fill="#b45309">没有</text>

    <rect x="700" y="150" width="220" height="230" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="810" y="182" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#15803d">升格为节点 (:City)</text>
    <text x="810" y="210" text-anchor="middle" font-size="11" fill="#334155">用户 -[:LIVES_IN]-> 城市</text>
    <text x="810" y="236" text-anchor="middle" font-size="11" fill="#334155">任何一问答「会 / 需要 / 有」</text>
    <text x="810" y="256" text-anchor="middle" font-size="11" fill="#334155">即命中 → 走右侧</text>
    <text x="810" y="290" text-anchor="middle" font-size="10.5" fill="#15803d">要「同城用户」推荐、</text>
    <text x="810" y="308" text-anchor="middle" font-size="10.5" fill="#15803d">要查城市本身的数据时，</text>
    <text x="810" y="326" text-anchor="middle" font-size="10.5" fill="#15803d">城市就不再只是属性</text>

    <line x1="630" y1="124" x2="694" y2="160" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwY)"/>
    <line x1="630" y1="200" x2="694" y2="216" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwY)"/>
    <line x1="630" y1="276" x2="694" y2="272" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwY)"/>
    <line x1="630" y1="352" x2="694" y2="330" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwY)"/>

    <line x1="480" y1="378" x2="480" y2="412" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
    <text x="492" y="400" font-size="10.5" fill="#b45309">四问全「否」（值域小、随主体走）</text>

    <rect x="330" y="416" width="300" height="50" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
    <text x="480" y="437" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b45309">存为属性 u.city = '北京'</text>
    <text x="480" y="457" text-anchor="middle" font-size="10.5" fill="#334155">少一跳遍历、少一个索引</text>

    <text x="40" y="502" font-size="12" fill="#334155">⚠️ 过度节点化的代价（1.1 原文）：每个升格 = 多一次遍历 + 多一个索引；把「性别」这种两三个取值做成节点，除了多一跳没有任何好处。</text>
    <text x="40" y="522" font-size="12" fill="#dc2626">⚠️ 同类反例在标签侧：把等级拆成 :Lv1/:Lv2/:Lv3 → 标签爆炸、索引翻倍 —— 等级是属性，不是标签（1.3）。</text>
  </g>
</svg>
