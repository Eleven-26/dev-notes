<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arwB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arwO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Neo4j 目录阅读地图：10 篇、五个主题域、两条学习线</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">依据本篇第一、三节：域只体现为阅读顺序（文件平铺）；⭐ ①②③ 是三篇「理解成本最高、也最值钱」的地基</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">五个主题域（篇数：3 + 2 + 2 + 2 + 1）</text>

    <rect x="24" y="46" width="180" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="38" y="70" font-size="13" font-weight="bold" fill="#1d4ed8">存储与查询</text>
    <text x="38" y="94" font-size="11" fill="#334155">① 架构与存储引擎</text>
    <text x="38" y="114" font-size="11" fill="#334155">② Cypher查询与执行计划</text>
    <text x="38" y="134" font-size="11" fill="#334155">③ 索引设计与查询优化</text>
    <text x="38" y="162" font-size="11" fill="#1d4ed8">「为什么遍历快 / 慢不慢」</text>
    <text x="38" y="180" font-size="11" fill="#dc2626">⭐ 其余七篇都建立在这三篇之上</text>

    <rect x="216" y="46" width="180" height="150" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
    <text x="230" y="70" font-size="13" font-weight="bold" fill="#b45309">事务与高可用</text>
    <text x="230" y="94" font-size="11" fill="#334155">④ 事务与并发控制</text>
    <text x="230" y="114" font-size="11" fill="#334155">⑤ 因果集群与高可用</text>
    <text x="230" y="142" font-size="11" fill="#b45309">ACID / 锁与死锁</text>
    <text x="230" y="160" font-size="11" fill="#b45309">Raft 多数派 / bookmark</text>

    <rect x="408" y="46" width="180" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="422" y="70" font-size="13" font-weight="bold" fill="#15803d">算法与建模</text>
    <text x="422" y="94" font-size="11" fill="#334155">⑥ GDS图算法实战</text>
    <text x="422" y="114" font-size="11" fill="#334155">⑦ 数据建模与导入</text>
    <text x="422" y="142" font-size="11" fill="#15803d">⑥ 是「算图」（图当特征工厂）</text>
    <text x="422" y="160" font-size="11" fill="#15803d">⑦ 是「用图」（把数据放进去）</text>

    <rect x="600" y="46" width="180" height="150" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <text x="614" y="70" font-size="13" font-weight="bold" fill="#475569">运维与 AI</text>
    <text x="614" y="94" font-size="11" fill="#334155">⑧ 运维与调优</text>
    <text x="614" y="114" font-size="11" fill="#334155">⑨ 向量索引与GraphRAG</text>
    <text x="614" y="142" font-size="11" fill="#475569">⑧ 上线后怎么不出事</text>
    <text x="614" y="160" font-size="11" fill="#475569">⑨ 用图（把 AI 接上来）</text>

    <rect x="792" y="46" width="144" height="150" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="806" y="70" font-size="13" font-weight="bold" fill="#dc2626">选型</text>
    <text x="806" y="94" font-size="11" fill="#334155">⑩ 选型与落地案例</text>
    <text x="806" y="122" font-size="11" fill="#dc2626">四家图库对比</text>
    <text x="806" y="140" font-size="11" fill="#dc2626">决策框架 / 收口</text>
  </g>

  <g transform="translate(20,320)">
    <rect x="0" y="0" width="960" height="356" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">学习路径：编号即推荐阅读顺序，两条线各有回答</text>

    <rect x="30" y="46" width="118" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="89" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">① 架构存储</text>
    <text x="89" y="90" text-anchor="middle" font-size="10.5" fill="#334155">定长记录 / 无索引邻接</text>
    <line x1="148" y1="75" x2="176" y2="75" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arwB)"/>

    <rect x="178" y="46" width="118" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="237" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">② Cypher计划</text>
    <text x="237" y="90" text-anchor="middle" font-size="10.5" fill="#334155">EXPLAIN / PROFILE</text>
    <line x1="296" y1="75" x2="324" y2="75" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arwB)"/>

    <rect x="326" y="46" width="118" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="385" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">③ 索引优化</text>
    <text x="385" y="90" text-anchor="middle" font-size="10.5" fill="#334155">五类索引 / 前缀陷阱</text>
    <line x1="444" y1="75" x2="472" y2="75" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arwB)"/>

    <rect x="474" y="46" width="118" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="533" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">④ 事务并发</text>
    <text x="533" y="90" text-anchor="middle" font-size="10.5" fill="#334155">锁 / 死锁 / 大事务</text>

    <text x="630" y="62" font-size="12" font-weight="bold" fill="#1d4ed8">开发线 ①→②→③→④</text>
    <text x="630" y="84" font-size="11.5" fill="#334155">回答「怎么写、怎么快」</text>

    <rect x="30" y="150" width="118" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
    <text x="89" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">⑤ 因果集群</text>
    <text x="89" y="194" text-anchor="middle" font-size="10.5" fill="#334155">Core / Read Replica</text>
    <line x1="148" y1="179" x2="176" y2="179" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arwO)"/>

    <rect x="178" y="150" width="118" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
    <text x="237" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">⑥ GDS算法</text>
    <text x="237" y="194" text-anchor="middle" font-size="10.5" fill="#334155">投影 / PageRank</text>
    <line x1="296" y1="179" x2="324" y2="179" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arwO)"/>

    <rect x="326" y="150" width="118" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
    <text x="385" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">⑦ 建模导入</text>
    <text x="385" y="194" text-anchor="middle" font-size="10.5" fill="#334155">LOAD CSV / APOC</text>
    <line x1="444" y1="179" x2="472" y2="179" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arwO)"/>

    <rect x="474" y="150" width="118" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
    <text x="533" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">⑧ 运维调优</text>
    <text x="533" y="194" text-anchor="middle" font-size="10.5" fill="#334155">Heap / 页缓存 / 备份</text>

    <text x="630" y="166" font-size="12" font-weight="bold" fill="#b45309">生产线 ⑤→⑧</text>
    <text x="630" y="188" font-size="11.5" fill="#334155">回答「上线后怎么不出事」</text>

    <rect x="326" y="242" width="118" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="385" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">⑨ 向量与GraphRAG</text>
    <text x="385" y="282" text-anchor="middle" font-size="10.5" fill="#334155">用图：把 AI 接上来</text>

    <rect x="474" y="242" width="118" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="533" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">⑩ 选型与案例</text>
    <text x="533" y="282" text-anchor="middle" font-size="10.5" fill="#334155">收口</text>

    <text x="30" y="330" font-size="12" fill="#64748b">角色标注取自正文第三节的「两条线」引语：⑦⑨ 是用图、⑥ 是算图、⑩ 是收口；实测口径见篇首（5.26.31 社区版容器）。</text>
  </g>
</svg>
