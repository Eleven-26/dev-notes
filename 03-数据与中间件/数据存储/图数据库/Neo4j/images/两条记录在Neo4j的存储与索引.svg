<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">图库的落点：一条节点记录串起属性链，每个索引占一个目录</text>
  <text x="500" y="56" font-size="13" fill="#64748b" text-anchor="middle">样本 2 个 :User 节点（各 7 个属性）；目录均在 data/databases/neo4j/ 下</text>

  <rect x="20" y="82" width="300" height="448" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="32" y="106" font-size="14" font-weight="bold" fill="#0f172a">原始数据：节点记录 + 属性链</text>

  <rect x="32" y="120" width="276" height="62" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" rx="8"/>
  <text x="44" y="142" font-size="12" font-weight="bold" fill="#1e3a8a">节点记录 #4（张三）</text>
  <text x="44" y="164" font-size="10.5" fill="#1e3a8a">标签 id → User；首属性 id → id=1</text>

  <text x="32" y="202" font-size="11" font-weight="bold" fill="#334155">属性链：7 条记录</text>

  <rect x="44" y="212" width="252" height="26" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1" rx="6"/>
  <text x="56" y="230" font-size="10.5" fill="#1e3a8a">id = 1</text>
  <rect x="44" y="244" width="252" height="26" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1" rx="6"/>
  <text x="56" y="262" font-size="10.5" fill="#1e3a8a">name = 张三</text>
  <rect x="44" y="276" width="252" height="26" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1" rx="6"/>
  <text x="56" y="294" font-size="10.5" fill="#1e3a8a">age = 18</text>
  <rect x="44" y="308" width="252" height="26" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1" rx="6"/>
  <text x="56" y="326" font-size="10.5" fill="#1e3a8a">phone = 13700000000</text>
  <rect x="44" y="340" width="252" height="26" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1" rx="6"/>
  <text x="56" y="358" font-size="10.5" fill="#1e3a8a">addr = 广东省深圳</text>
  <rect x="44" y="372" width="252" height="26" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1" rx="6"/>
  <text x="56" y="390" font-size="10.5" fill="#1e3a8a">hobby = 打游戏，爬山</text>
  <rect x="44" y="404" width="252" height="26" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1" rx="6"/>
  <text x="56" y="422" font-size="10.5" fill="#1e3a8a">remark = 这是张三备注</text>

  <text x="32" y="454" font-size="10.5" fill="#334155">属性库共 14 条（2 个节点 × 7 个属性）</text>
  <text x="32" y="474" font-size="10.5" fill="#334155">长字符串进 propertystore.strings</text>
  <text x="32" y="494" font-size="10.5" fill="#b91c1c">relationshipstore.db 0 B：本样本没有边</text>
  <text x="32" y="514" font-size="10.5" fill="#334155">各文件 8192 B 是一页的下限，非实际用量</text>

  <line x1="322" y1="300" x2="337" y2="300" stroke="#64748b" stroke-width="1.8" marker-end="url(#a1)"/>

  <rect x="340" y="82" width="330" height="448" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="354" y="106" font-size="14" font-weight="bold" fill="#0f172a">索引：schema/index/ 下六个目录</text>

  <rect x="354" y="120" width="302" height="54" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="8"/>
  <text x="366" y="140" font-size="11" font-weight="bold" fill="#14532d">token-lookup-1.0/1/index-1　49152 B</text>
  <text x="366" y="160" font-size="10.5" fill="#14532d">LOOKUP：标签 → 节点（自动建）</text>

  <rect x="354" y="182" width="302" height="54" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="8"/>
  <text x="366" y="202" font-size="11" font-weight="bold" fill="#14532d">token-lookup-1.0/2/index-2　40960 B</text>
  <text x="366" y="222" font-size="10.5" fill="#14532d">LOOKUP：关系类型 → 关系（自动建）</text>

  <rect x="354" y="244" width="302" height="54" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="8"/>
  <text x="366" y="264" font-size="11" font-weight="bold" fill="#14532d">range-1.0/3/index-3　49152 B</text>
  <text x="366" y="284" font-size="10.5" fill="#14532d">RANGE：user_id_unique（唯一约束）</text>

  <rect x="354" y="306" width="302" height="54" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="8"/>
  <text x="366" y="326" font-size="11" font-weight="bold" fill="#14532d">range-1.0/4/index-4　49152 B</text>
  <text x="366" y="346" font-size="10.5" fill="#14532d">RANGE：idx_phone（手机号等值）</text>

  <rect x="354" y="368" width="302" height="54" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" rx="8"/>
  <text x="366" y="388" font-size="11" font-weight="bold" fill="#4c1d95">text-2.0/5/1/_2.cfs　1571 B</text>
  <text x="366" y="408" font-size="10.5" fill="#4c1d95">余三件 342 + 389 + 168，合计 2470 B</text>

  <rect x="354" y="430" width="302" height="54" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" rx="8"/>
  <text x="366" y="450" font-size="11" font-weight="bold" fill="#4c1d95">fulltext-1.0/6/1/_2.cfs　1846 B</text>
  <text x="366" y="470" font-size="10.5" fill="#4c1d95">余三件 416 + 389 + 168，合计 2819 B</text>

  <text x="354" y="504" font-size="10.5" fill="#334155">目录名 = SHOW INDEXES 的 id</text>
  <text x="354" y="522" font-size="10.5" fill="#334155">原生索引一个文件；Lucene 索引四个文件</text>

  <line x1="672" y1="300" x2="687" y2="300" stroke="#64748b" stroke-width="1.8" marker-end="url(#a1)"/>

  <rect x="690" y="82" width="290" height="448" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="704" y="106" font-size="14" font-weight="bold" fill="#0f172a">查询：找起点才用索引</text>

  <rect x="704" y="120" width="262" height="76" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="8"/>
  <text x="716" y="142" font-size="11.5" font-weight="bold" fill="#14532d">phone = '13700000000'</text>
  <text x="716" y="164" font-size="10.5" fill="#14532d">NodeIndexSeek 2 次</text>
  <text x="716" y="184" font-size="10.5" fill="#14532d">取属性 Projection 1 次，共 3</text>

  <rect x="704" y="208" width="262" height="76" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="8"/>
  <text x="716" y="230" font-size="11.5" font-weight="bold" fill="#14532d">hobby CONTAINS '爬山'</text>
  <text x="716" y="252" font-size="10.5" fill="#14532d">NodeIndexContainsScan 2 次</text>
  <text x="716" y="272" font-size="10.5" fill="#14532d">取属性 1 次，共 3</text>

  <rect x="704" y="296" width="262" height="88" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2" rx="8"/>
  <text x="716" y="318" font-size="11.5" font-weight="bold" fill="#7c2d12">age = 18（没有索引）</text>
  <text x="716" y="340" font-size="10.5" fill="#7c2d12">NodeByLabelScan 3 + Filter 2</text>
  <text x="716" y="360" font-size="10.5" fill="#7c2d12">+ Projection 1，共 6</text>
  <text x="716" y="378" font-size="10.5" fill="#7c2d12">与谓词无关，永远走全标签扫描</text>

  <rect x="704" y="396" width="262" height="76" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" rx="8"/>
  <text x="716" y="418" font-size="11.5" font-weight="bold" fill="#1e3a8a">命中之后</text>
  <text x="716" y="440" font-size="10.5" fill="#1e3a8a">节点号 → 节点记录 → 属性链</text>
  <text x="716" y="460" font-size="10.5" fill="#1e3a8a">直接读「行」，没有第二棵树</text>

  <text x="704" y="496" font-size="10.5" fill="#334155">索引只回答「是哪个节点」，</text>
  <text x="704" y="514" font-size="10.5" fill="#334155">不回答「字段在哪」</text>

  <rect x="20" y="552" width="960" height="70" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="36" y="578" font-size="11.5" font-weight="bold" fill="#0f172a">连接点：elementId 的第三段就是节点号（4:274ba8f0-…:4 的末段）</text>
  <text x="36" y="602" font-size="11.5" fill="#334155">MySQL 拿主键回聚簇树取整行；Neo4j 拿节点号直接读节点与属性链 —— 「索引指向实体」的两种走法</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
