<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arwB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arwO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ea580c"/>
    </marker>
    <marker id="arwG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">混合检索数据流转：一个召回、另一个打分，图遍历补上下文</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">框内读数全部为本仓 5.26.31 实测（8 个 :Doc / 4 维 embedding / query = [1,0,0,0] + 关键词「存储」）；融合演示的是最朴素的 vec + kw</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="666" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <rect x="330" y="24" width="300" height="52" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
    <text x="480" y="46" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">用户查询</text>
    <text x="480" y="66" text-anchor="middle" font-size="11" fill="#334155">语义向量 [1,0,0,0] ＋ 精确关键词「存储」</text>

    <line x1="420" y1="76" x2="230" y2="122" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arwB)"/>
    <line x1="540" y1="76" x2="730" y2="122" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arwO)"/>

    <rect x="60" y="126" width="360" height="128" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="76" y="150" font-size="13" font-weight="bold" fill="#1d4ed8">向量召回（语义路，doc_vec / HNSW）</text>
    <text x="76" y="174" font-size="11" fill="#334155">db.index.vector.queryNodes top5：</text>
    <text x="76" y="194" font-size="11" fill="#334155">1→1.0　5→0.9969　6→0.556</text>
    <text x="76" y="212" font-size="11" fill="#334155">8→0.5009　7→0.5009</text>
    <text x="76" y="236" font-size="10.5" fill="#64748b">强在语义排序；vector/cluster 主题也被带进来</text>

    <rect x="540" y="126" width="360" height="128" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
    <text x="556" y="150" font-size="13" font-weight="bold" fill="#b45309">全文召回（精确词路，doc_ft / Lucene）</text>
    <text x="556" y="174" font-size="11" fill="#334155">fulltext.queryNodes('存储') 只给两个：</text>
    <text x="556" y="194" font-size="11" fill="#334155">5→1.1645　1→1.0564</text>
    <text x="556" y="236" font-size="10.5" fill="#dc2626">⚠️ 分数无上界，与向量分（[0,1]）量纲不同</text>

    <line x1="240" y1="254" x2="410" y2="308" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
    <line x1="720" y1="254" x2="550" y2="308" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="230" y="312" width="500" height="106" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="246" y="336" font-size="13" font-weight="bold" fill="#15803d">分数融合 / 交集 / 加权</text>
    <text x="246" y="360" font-size="11" fill="#334155">本仓演示 vec + kw：1→2.0　5→1.9969　6→0.556　8/7→0.5009</text>
    <text x="246" y="380" font-size="11" fill="#334155">真实系统：全文分先归一到 [0,1]，再按 w1×向量 + w2×全文 加权</text>
    <text x="246" y="402" font-size="10.5" fill="#64748b">也可以只做交集（向量召回 → 全文过滤），召回更保守</text>

    <line x1="480" y1="418" x2="480" y2="452" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="230" y="456" width="500" height="94" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
    <text x="246" y="480" font-size="13" font-weight="bold" fill="#0f172a">图遍历扩展（可选，GraphRAG 的关键动作）</text>
    <text x="246" y="504" font-size="11" fill="#334155">向量种子 60 / 90 / 30 沿 FOLLOWS 各扩出 3 个邻居（score 0.9977）</text>
    <text x="246" y="526" font-size="10.5" fill="#64748b">⚠️ :User 是合成向量、几乎共线，0.9977 无区分度 —— 演示机制而非排序质量</text>

    <line x1="480" y1="550" x2="480" y2="584" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="330" y="588" width="300" height="50" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <text x="480" y="610" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">最终结果</text>
    <text x="480" y="628" text-anchor="middle" font-size="10.5" fill="#334155">入口实体 + 关系上下文，一起交给 LLM 组装</text>

    <text x="40" y="658" font-size="11" fill="#64748b">PROFILE 实测：向量检索在计划里是 ProcedureCall 算子，DB Hits 5 —— 候选数就是它访问的节点量级。</text>
  </g>
</svg>
