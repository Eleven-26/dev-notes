<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arwO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ea580c"/>
    </marker>
    <marker id="arwG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">社区版离线备份恢复流程：停库 → dump → load → 三计数验收</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">命令与验收数字取自本篇第四节实测（5.26 社区版 dump → load，恢复出 101000 节点 / 300000 关系 / 7 个索引）；「顺序不能反」是原文纪律</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="466" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">备份线（dump）</text>

    <rect x="30" y="46" width="150" height="66" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
    <text x="105" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">运行中的库</text>
    <text x="105" y="96" text-anchor="middle" font-size="10.5" fill="#334155">要求「不可写」</text>
    <line x1="180" y1="79" x2="212" y2="79" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="216" y="46" width="150" height="66" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="291" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">停库</text>
    <text x="291" y="96" text-anchor="middle" font-size="10.5" fill="#334155">社区版 dump 的前提</text>
    <line x1="366" y1="79" x2="398" y2="79" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="402" y="46" width="250" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="527" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">neo4j-admin database dump</text>
    <text x="527" y="96" text-anchor="middle" font-size="10.5" fill="#334155">--to-path=/backups（产物是逻辑备份）</text>
    <line x1="652" y1="79" x2="684" y2="79" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="688" y="46" width="130" height="66" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
    <text x="753" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">启库</text>
    <text x="753" y="96" text-anchor="middle" font-size="10.5" fill="#334155">恢复对外服务</text>

    <text x="30" y="146" font-size="11" fill="#dc2626">⚠️ 备份窗口要有停写预案（或用挂载快照兜底）—— 社区版没有「不停机」这条路。</text>

    <text x="16" y="182" font-size="15" font-weight="bold" fill="#0f172a">恢复线（load，需要时才走）</text>

    <rect x="30" y="200" width="150" height="66" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="105" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">停库</text>
    <text x="105" y="250" text-anchor="middle" font-size="10.5" fill="#334155">同样要停</text>
    <line x1="180" y1="233" x2="212" y2="233" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arwO)"/>

    <rect x="216" y="200" width="290" height="66" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
    <text x="361" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">database load --overwrite-destination=true</text>
    <text x="361" y="250" text-anchor="middle" font-size="10.5" fill="#dc2626">⚠️ 覆盖式：先清掉目标库现有数据，执行前确认</text>
    <line x1="506" y1="233" x2="538" y2="233" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arwO)"/>

    <rect x="542" y="200" width="130" height="66" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
    <text x="607" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">启库</text>
    <text x="607" y="250" text-anchor="middle" font-size="10.5" fill="#334155">（可选 check）</text>
    <line x1="672" y1="233" x2="704" y2="233" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arwG)"/>

    <rect x="708" y="200" width="222" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="819" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">验收：三个计数对得上</text>
    <text x="819" y="242" text-anchor="middle" font-size="10.5" fill="#334155">节点 101000 / 关系 300000 / 索引 7</text>
    <text x="819" y="258" text-anchor="middle" font-size="10.5" fill="#64748b">对不上 = 备份没演练过等于没有</text>

    <text x="30" y="300" font-size="11" fill="#64748b">跨大版本迁移一律走 dump/load，不直接拷 data/ 目录 —— 存储格式会演进（见 架构与存储引擎.md 第四节）。</text>

    <rect x="30" y="322" width="900" height="122" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="46" y="348" font-size="13" font-weight="bold" fill="#0f172a">不停机的两条岔路（版本能力差异）</text>
    <text x="46" y="376" font-size="11.5" fill="#1d4ed8">企业版：neo4j-admin database backup —— 在线备份，不停机；</text>
    <text x="46" y="400" font-size="11.5" fill="#15803d">Aura：托管服务内置自动备份 / PITR（时间点恢复）；</text>
    <text x="46" y="426" font-size="11.5" fill="#dc2626">社区版：只有上面那条「停库」主线 —— 要在线备份，选型时就得推向企业版 / Aura（见 选型与落地案例.md）。</text>
  </g>
</svg>
