<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 870" width="1000" height="870" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="870" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">bookmark 保证「读己之写」，不是「读到全局最新」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">⭐ 副本是异步追上的 —— 要读到自己的写用 bookmark，要读所有人的最新只能读 Core</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="960" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">因果一致性（bookmark）的三步</text>

    <rect x="30" y="44" width="290" height="96" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="46" y="68" font-size="12.5" font-weight="bold" fill="#1d4ed8">① 写事务提交后</text>
    <text x="46" y="90" font-size="11" fill="#334155">Core 返回一个 bookmark</text>
    <text x="46" y="108" font-size="11" fill="#334155">代表「已提交到哪个位置」</text>
    <text x="46" y="126" font-size="11" fill="#64748b">—— 是位置，不是数据本身</text>

    <rect x="335" y="44" width="290" height="96" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="351" y="68" font-size="12.5" font-weight="bold" fill="#1d4ed8">② 同一个 session 的下一次读</text>
    <text x="351" y="90" font-size="11" fill="#334155">把上一步的 bookmark 带上</text>
    <text x="351" y="108" font-size="11" fill="#334155">随请求发给服务端</text>
    <text x="351" y="126" font-size="11" fill="#64748b">驱动自动带上，无需手动拼</text>

    <rect x="640" y="44" width="290" height="96" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="656" y="68" font-size="12.5" font-weight="bold" fill="#1d4ed8">③ 服务端择实例返回</text>
    <text x="656" y="90" font-size="11" fill="#334155">只发给「已追上该 bookmark」的实例</text>
    <text x="656" y="108" font-size="11" fill="#334155">没追上的则等待或转发</text>
    <text x="656" y="126" font-size="11" fill="#b45309">等待可能超时</text>

    <text x="20" y="166" font-size="12" fill="#334155">⭐ 它保证的是「读到自己写过的那些修改之后的状态」（read-your-own-writes / 因果一致），不是「读到全局最新」。</text>
    <text x="20" y="190" font-size="12" fill="#334155">Go / Java 驱动：读写都走同一个 session → 读请求自动带上写产生的 bookmark；跨请求时要把 bookmark 显式传下去。</text>
    <text x="20" y="214" font-size="12" fill="#b45309">⚠️ Web 服务通常无状态，session 与请求不是一对一 —— 必须把 bookmark 从「写请求的响应」传到「读请求的请求」。</text>
    <text x="20" y="238" font-size="12" fill="#64748b">否则同一条业务链上的读可能落到落后的副本上，出现「刚提交却看不到」。</text>
  </g>

  <g transform="translate(20,335)">
    <rect x="0" y="0" width="960" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">三种保证，bookmark 能兑现哪些</text>

    <rect x="20" y="42" width="920" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="62" font-size="12.5" font-weight="bold" fill="#0f172a">保证</text>
    <text x="280" y="62" font-size="12.5" font-weight="bold" fill="#0f172a">含义</text>
    <text x="640" y="62" font-size="12.5" font-weight="bold" fill="#1d4ed8">bookmark 能不能给</text>

    <rect x="20" y="72" width="920" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="90" font-size="12" fill="#334155">读己之写</text>
    <text x="280" y="90" font-size="12" fill="#334155">我写过 X，我后面能读到 X</text>
    <text x="640" y="90" font-size="12" fill="#047857">✅ 能</text>

    <rect x="20" y="98" width="920" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="116" font-size="12" fill="#334155">单调读</text>
    <text x="280" y="116" font-size="12" fill="#334155">我不会读到比上次更旧的状态</text>
    <text x="640" y="116" font-size="12" fill="#047857">✅ 能（同一 session 链）</text>

    <rect x="20" y="124" width="920" height="26" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="142" font-size="12" fill="#334155">全局最新</text>
    <text x="280" y="142" font-size="12" fill="#334155">别人刚提交的我也立刻能读到</text>
    <text x="640" y="142" font-size="12" fill="#dc2626">❌ 做不到（副本可能还没追上）</text>

    <text x="20" y="174" font-size="12" fill="#334155">⭐ 强一致性（线性一致）要求任何客户端任何时刻读到的都是全局最新；因果一致性只要求有因果关系的操作按顺序被看到。</text>
    <text x="20" y="198" font-size="12" fill="#b45309">这是可用性与延迟的折中：全局强一致会让每次读都要等副本追上，代价很大。</text>
  </g>

  <g transform="translate(20,580)">
    <rect x="0" y="0" width="960" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">故障切换：谁挂了、什么影响、怎么恢复</text>

    <rect x="20" y="42" width="920" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="62" font-size="12.5" font-weight="bold" fill="#0f172a">故障对象</text>
    <text x="300" y="62" font-size="12.5" font-weight="bold" fill="#0f172a">影响</text>
    <text x="620" y="62" font-size="12.5" font-weight="bold" fill="#1d4ed8">恢复机制</text>

    <rect x="20" y="72" width="920" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="90" font-size="12" fill="#334155">Raft Leader（当前写主）</text>
    <text x="300" y="90" font-size="12" fill="#b45309">写短暂不可用</text>
    <text x="620" y="90" font-size="12" fill="#334155">剩余 Core 重新选举新 Leader，客户端重连</text>

    <rect x="20" y="98" width="920" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="116" font-size="12" fill="#334155">非 Leader 的 Core</text>
    <text x="300" y="116" font-size="12" fill="#334155">冗余下降一档</text>
    <text x="620" y="116" font-size="12" fill="#334155">修复后自动追上日志</text>

    <rect x="20" y="124" width="920" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="142" font-size="12" fill="#334155">Read Replica</text>
    <text x="300" y="142" font-size="12" fill="#334155">读容量下降，写不受影响</text>
    <text x="620" y="142" font-size="12" fill="#334155">读请求转到其他副本 / Core；修复后自动对齐</text>

    <rect x="20" y="150" width="920" height="26" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="168" font-size="12" font-weight="bold" fill="#dc2626">失去多数派</text>
    <text x="300" y="168" font-size="12" fill="#dc2626">集群整体不可写</text>
    <text x="620" y="168" font-size="12" fill="#334155">必须先把 Core 恢复到多数派</text>

    <text x="20" y="200" font-size="12" fill="#334155">⭐ 切换期间客户端要用「能重试」的写法包住写操作：neo4j:// 驱动做服务端路由，把请求导向当前 Leader，</text>
    <text x="20" y="224" font-size="12" fill="#334155">遇到瞬时错误（Leader 正在切换）时重试整个事务 —— 有限次数 + 退避 + 只重试可重试错误。</text>
    <text x="20" y="248" font-size="12" fill="#b45309">⚠️ 实测边界：本仓社区版下 SHOW SERVERS / CREATE DATABASE 报 Unsupported administration command —— 集群行为属文档陈述。</text>
  </g>
</svg>
