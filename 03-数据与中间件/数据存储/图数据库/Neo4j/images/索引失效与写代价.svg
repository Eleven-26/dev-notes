<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 926" width="1000" height="926" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="926" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">索引要按查询反推：建什么、什么会失效、怎么验证命中</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">⭐ 索引不是越多越好 —— 每个索引都要在每次写入时维护，写放大是实打实的</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="960" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">选型口诀：查询长什么样，就建什么</text>

    <rect x="20" y="42" width="920" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="62" font-size="12.5" font-weight="bold" fill="#0f172a">查询长什么样</text>
    <text x="600" y="62" font-size="12.5" font-weight="bold" fill="#1d4ed8">建什么</text>

    <rect x="20" y="72" width="920" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="90" font-size="12" fill="#334155">按某属性等值 / 范围 / IN / 前缀定位起点</text>
    <text x="600" y="90" font-size="12" fill="#047857">RANGE（复合则按「等值列在前」排）</text>

    <rect x="20" y="98" width="920" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="116" font-size="12" fill="#334155">长文本「中间 / 后缀」子串匹配</text>
    <text x="600" y="116" font-size="12" fill="#047857">TEXT</text>

    <rect x="20" y="124" width="920" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="142" font-size="12" fill="#334155">分词检索 + 相关性排序</text>
    <text x="600" y="142" font-size="12" fill="#047857">FULLTEXT</text>

    <rect x="20" y="150" width="920" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="168" font-size="12" fill="#334155">按语义相似找（RAG 检索）</text>
    <text x="600" y="168" font-size="12" fill="#047857">VECTOR</text>

    <rect x="20" y="176" width="920" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="194" font-size="12" fill="#334155">唯一性约束</text>
    <text x="600" y="194" font-size="12" fill="#047857">CREATE CONSTRAINT（自带索引）</text>

    <text x="20" y="226" font-size="12" fill="#b45309">⚠️ 写放大代价：本仓 30 万关系 + 10 万节点上有 5 个业务索引，导入 2 万条带索引的写入实测 1031 ms、MERGE（含唯一约束）1513 ms。</text>
    <text x="20" y="250" font-size="12" fill="#334155">索引不是越多越好：每个索引都要在每次写入时同步维护，原则是「按查询反推索引」，而不是给每个属性都建一个。</text>
    <text x="20" y="274" font-size="12" fill="#64748b">在线建索引：CREATE INDEX 不阻塞读写（社区版也是在线建），但索引建好前用不上 —— 中间差一个 db.awaitIndexes()。</text>
  </g>

  <g transform="translate(20,385)">
    <rect x="0" y="0" width="960" height="256" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">索引失效的四类场景（自查清单）</text>

    <rect x="30" y="44" width="450" height="90" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="46" y="68" font-size="12.5" font-weight="bold" fill="#dc2626">① 函数包裹</text>
    <text x="46" y="90" font-size="11" fill="#334155" font-family="Consolas, Menlo, monospace">WHERE toString(u.id) = 'x'</text>
    <text x="46" y="108" font-size="11" fill="#334155" font-family="Consolas, Menlo, monospace">toLower(u.name) = 'x'</text>
    <text x="46" y="126" font-size="11" fill="#dc2626">→ 退回全标签扫描</text>

    <rect x="500" y="44" width="450" height="90" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
    <text x="516" y="68" font-size="12.5" font-weight="bold" fill="#b45309">② 类型不匹配</text>
    <text x="516" y="90" font-size="11" fill="#334155">属性存的是字符串、查询传整数（或反之）</text>
    <text x="516" y="108" font-size="11" fill="#334155">→ 谓词直接不成立，索引无从匹配</text>
    <text x="516" y="126" font-size="11" fill="#b45309">先对齐属性类型再谈索引</text>

    <rect x="30" y="150" width="450" height="90" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
    <text x="46" y="174" font-size="12.5" font-weight="bold" fill="#b45309">③ 复合索引没从第一列用起</text>
    <text x="46" y="196" font-size="11" fill="#334155">只给后导列（如 (name, id) 只约束 id）</text>
    <text x="46" y="214" font-size="11" fill="#334155">→ 索引用不上，退化成 NodeByLabelScan</text>
    <text x="46" y="232" font-size="11" fill="#b45309">实测 200002 dbHits</text>

    <rect x="500" y="150" width="450" height="90" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
    <text x="516" y="174" font-size="12.5" font-weight="bold" fill="#b45309">④ 索引还在 POPULATING</text>
    <text x="516" y="196" font-size="11" fill="#334155" font-family="Consolas, Menlo, monospace">SHOW INDEXES ... state 不是 ONLINE</text>
    <text x="516" y="214" font-size="11" fill="#334155">→ 等于没建，后面的 PROFILE 看不到命中</text>
    <text x="516" y="232" font-size="11" fill="#047857">CALL db.awaitIndexes() 等齐</text>
  </g>

  <g transform="translate(20,656)">
    <rect x="0" y="0" width="960" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">判据门禁：计划里出现什么，就判什么</text>

    <rect x="20" y="42" width="920" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="62" font-size="12.5" font-weight="bold" fill="#0f172a">PROFILE 里出现</text>
    <text x="640" y="62" font-size="12.5" font-weight="bold" fill="#1d4ed8">判</text>

    <rect x="20" y="72" width="920" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="90" font-size="12" fill="#334155">NodeIndexSeek / NodeIndexSeekByRange / NodeIndexContainsScan 打头</text>
    <text x="640" y="90" font-size="12" fill="#047857">✅ 起点走了索引</text>

    <rect x="20" y="98" width="920" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="116" font-size="12" fill="#334155">NodeByLabelScan / AllNodesScan 打头</text>
    <text x="640" y="116" font-size="12" fill="#b45309">⚠️ 全标签 / 全库扫描，先查索引与谓词</text>

    <rect x="20" y="124" width="920" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="142" font-size="12" fill="#334155">CartesianProduct</text>
    <text x="640" y="142" font-size="12" fill="#dc2626">❌ 查询写错了，不是索引问题</text>

    <rect x="20" y="150" width="920" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="168" font-size="12" fill="#334155">总 dbHits 与「实际返回行数」差好几个数量级</text>
    <text x="640" y="168" font-size="12" fill="#b45309">⚠️ 索引没真正收窄</text>

    <text x="20" y="200" font-size="12" fill="#334155">⭐ 三条纪律：① 每次 PROFILE 跑两次取第二次（冷热差约 7 倍）；② 建完索引必须 CALL db.awaitIndexes() 再验证；</text>
    <text x="20" y="224" font-size="12" fill="#64748b">③ 索引个数按查询清单逐条对应 —— 没有查询对应的索引就是纯负债，删掉它。</text>
  </g>
</svg>
