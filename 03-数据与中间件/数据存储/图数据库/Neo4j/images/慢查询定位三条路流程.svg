<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arwO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ea580c"/>
    </marker>
    <marker id="arwR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">慢查询定位三条路：先计划、再现场、日志放最后</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">顺序与分支取自本篇第三节要点；第三路的「负结果」是本仓实测 —— query.log 配置齐全仍 0 字节</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="586" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <rect x="370" y="22" width="220" height="48" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
    <text x="480" y="42" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">线上「查询慢」</text>
    <text x="480" y="60" text-anchor="middle" font-size="10.5" fill="#64748b">按本篇要点顺序：计划 → 现场 → 日志</text>

    <line x1="400" y1="70" x2="180" y2="106" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
    <line x1="480" y1="70" x2="480" y2="106" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
    <line x1="560" y1="70" x2="790" y2="106" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arwR)"/>

    <rect x="40" y="110" width="280" height="210" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="56" y="136" font-size="13" font-weight="bold" fill="#1d4ed8">路① PROFILE 看计划（首选）</text>
    <text x="56" y="158" font-size="10.5" fill="#334155">能复现的慢查询 → 直接加 PROFILE 跑</text>
    <text x="56" y="182" font-size="10.5" fill="#334155">NodeByLabelScan 打头 → 起点没索引</text>
    <text x="56" y="200" font-size="10.5" fill="#334155">CartesianProduct → 两个 MATCH 没连起来</text>
    <text x="56" y="218" font-size="10.5" fill="#334155">Eager 在中间 → 阻塞算子提前物化</text>
    <text x="56" y="236" font-size="10.5" fill="#334155">AllNodesScan → 连标签都没指定</text>
    <text x="56" y="254" font-size="10.5" fill="#334155">dbHits 远大于结果数 → 扫描后过滤</text>
    <text x="56" y="280" font-size="10.5" fill="#64748b">症状→处方对照见 3.4 速查表；</text>
    <text x="56" y="298" font-size="10.5" fill="#64748b">算子细读见 Cypher查询与执行计划.md</text>

    <rect x="340" y="110" width="290" height="210" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
    <text x="356" y="136" font-size="13" font-weight="bold" fill="#b45309">路② SHOW TRANSACTIONS 看现场</text>
    <text x="356" y="158" font-size="10.5" fill="#334155">「正在跑、复现不了」的卡慢 → 看运行中事务</text>
    <text x="356" y="182" font-size="10.5" fill="#334155">status = Blocked by: [...] 且 elapsedTime 涨</text>
    <text x="368" y="198" font-size="10.5" fill="#b45309">→ 锁等待，顺 Blocked by 找持有者</text>
    <text x="356" y="220" font-size="10.5" fill="#334155">activeLockCount 大 + 运行很久</text>
    <text x="368" y="236" font-size="10.5" fill="#b45309">→ 长事务/大事务，考虑拆分</text>
    <text x="356" y="258" font-size="10.5" fill="#334155">一堆事务等同一个 id → 热点（超级节点）</text>
    <text x="356" y="290" font-size="10.5" fill="#dc2626">万不得已：TERMINATE TRANSACTIONS 'id'</text>
    <text x="356" y="308" font-size="10.5" fill="#64748b">⚠️ 5.x 已取代 dbms.listTransactions()</text>

    <rect x="650" y="110" width="270" height="210" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="666" y="136" font-size="13" font-weight="bold" fill="#dc2626">路③ 慢查询日志（本仓负结果）</text>
    <text x="666" y="158" font-size="10.5" fill="#334155">db.logs.query.enabled = INFO</text>
    <text x="666" y="176" font-size="10.5" fill="#334155">threshold = 0s、参数日志开、补了 appender</text>
    <text x="666" y="204" font-size="10.5" font-weight="bold" fill="#dc2626">→ query.log 仍 0 字节（wc -c 实测）</text>
    <text x="666" y="232" font-size="10.5" fill="#334155">可能原因（未逐一验证）：user-logs.xml</text>
    <text x="666" y="250" font-size="10.5" fill="#334155">覆盖了默认 appender、新旧前缀映射不一致</text>
    <text x="666" y="280" font-size="10.5" fill="#b45309">实践：先验证「真的写盘」再依赖它，</text>
    <text x="666" y="298" font-size="10.5" fill="#b45309">别把「配了」当成「生效了」</text>

    <line x1="180" y1="320" x2="180" y2="366" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
    <line x1="485" y1="320" x2="485" y2="366" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arwO)"/>

    <rect x="40" y="370" width="400" height="86" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="56" y="396" font-size="12.5" font-weight="bold" fill="#15803d">出口 A：找到病因 → 按处方改写</text>
    <text x="56" y="420" font-size="10.5" fill="#334155">建索引 / 连模式 / 拆查询 / 复合索引把过滤做进索引</text>
    <text x="56" y="442" font-size="10.5" fill="#64748b">改写细节见 索引设计与查询优化.md</text>

    <rect x="470" y="370" width="450" height="86" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
    <text x="486" y="396" font-size="12.5" font-weight="bold" fill="#0f172a">出口 B：确认是锁问题 → 转事务篇处理</text>
    <text x="486" y="420" font-size="10.5" fill="#334155">Blocked 链 / 死锁牺牲者 / 大事务拆分 → 见 事务与并发控制.md</text>
    <text x="486" y="442" font-size="10.5" fill="#64748b">默认 db.transaction.timeout = 0s，等锁也不超时 —— 生产要显式设上限</text>

    <text x="40" y="500" font-size="12" fill="#334155">为什么日志放最后：路①②都在数据库进程内拿数，不依赖外部文件配置；路③在本仓环境下连「是否落盘」都要先验证 —— 兜底可以，打头不行。</text>
    <text x="40" y="524" font-size="12" fill="#64748b">冷/热背景值（本篇第一节）：同一 10 万节点计数查询，冷页缓存 1370 ms vs 热 186 ms（约 7 倍）—— 先排除「冷启动」再怀疑查询本身。</text>
    <text x="40" y="556" font-size="12" fill="#b45309">⚠️ 页缓存命中率在社区版没有现成指标（实测无 PAGE CACHE section），只能靠 OS 磁盘 IO 间接判断。</text>
  </g>
</svg>
