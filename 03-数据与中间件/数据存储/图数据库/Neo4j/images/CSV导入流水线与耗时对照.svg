<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arwR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">CSV 在线导入流水线：建约束 → 导节点 → 导关系 → 校验计数</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">耗时全部为本仓 5.26.31 实测（cypher-shell 数据库侧计时；csv_users 20000 行 / csv_follows 60000 行）</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="450" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <rect x="30" y="34" width="170" height="88" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
    <text x="115" y="60" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">① 放文件</text>
    <text x="115" y="82" text-anchor="middle" font-size="10.5" fill="#334155">挂进容器 import/</text>
    <text x="115" y="100" text-anchor="middle" font-size="10.5" fill="#334155">file:/// 指的就是它</text>

    <rect x="230" y="34" width="190" height="88" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
    <text x="325" y="56" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b45309">② 先建唯一约束</text>
    <text x="325" y="76" text-anchor="middle" font-size="10.5" fill="#334155">REQUIRE u.id IS UNIQUE</text>
    <text x="325" y="94" text-anchor="middle" font-size="10.5" fill="#dc2626">⭐ 顺序不能反：它决定</text>
    <text x="325" y="110" text-anchor="middle" font-size="10.5" fill="#dc2626">④ 是 Seek 还是笛卡尔积</text>

    <rect x="450" y="34" width="220" height="88" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="560" y="56" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">③ LOAD CSV 导节点</text>
    <text x="560" y="76" text-anchor="middle" font-size="10.5" fill="#334155">CREATE + toInteger 显式转类型</text>
    <text x="560" y="94" text-anchor="middle" font-size="10.5" fill="#334155">20000 用户热 425~876 ms（冷 5425）</text>
    <text x="560" y="110" text-anchor="middle" font-size="10.5" fill="#64748b">MERGE+约束 1496~2266（冷 7942）</text>

    <rect x="700" y="34" width="230" height="88" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="815" y="56" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">④ LOAD CSV 导关系</text>
    <text x="815" y="76" text-anchor="middle" font-size="10.5" fill="#334155">MATCH (a)…MATCH (b)…CREATE</text>
    <text x="815" y="94" text-anchor="middle" font-size="10.5" fill="#334155">60000 条有约束 3299~7163 ms</text>
    <text x="815" y="110" text-anchor="middle" font-size="10.5" fill="#15803d">两端各一次索引定位（Seek）</text>

    <line x1="200" y1="78" x2="224" y2="78" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
    <line x1="420" y1="78" x2="444" y2="78" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
    <line x1="670" y1="78" x2="694" y2="78" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

    <line x1="815" y1="122" x2="640" y2="170" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="390" y="174" width="250" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="515" y="198" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">⑤ 校验计数</text>
    <text x="515" y="220" text-anchor="middle" font-size="10.5" fill="#334155">节点 20000 / 关系 60000 对得上</text>
    <text x="515" y="238" text-anchor="middle" font-size="10.5" fill="#334155">SHOW CONSTRAINTS 确认约束在</text>

    <rect x="30" y="174" width="330" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="46" y="198" font-size="12.5" font-weight="bold" fill="#dc2626">⚠️ 跳过 ② 直接做 ④ 会怎样（3.5 计划对照）</text>
    <text x="46" y="222" font-size="10.5" fill="#334155">计划退化成两个 NodeByLabelScan + CartesianProduct</text>
    <text x="46" y="240" font-size="10.5" fill="#334155">20000 × 20000 = 4 亿次节点访问「换 1 条关系」</text>
    <text x="46" y="258" font-size="10.5" fill="#334155">实测单行 1679 ms（有约束同场景 521 ms）</text>
    <text x="46" y="280" font-size="10.5" fill="#dc2626">2000 行就是小时级 —— 等于不可行</text>
    <line x1="360" y1="234" x2="384" y2="216" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arwR)"/>

    <rect x="30" y="316" width="900" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="46" y="340" font-size="12.5" font-weight="bold" fill="#0f172a">流水线之外的两个岔路口（第五、六节）</text>
    <text x="46" y="366" font-size="11" fill="#334155">■ 要不要分批：单事务写完 60000 关系 1981 ms；CALL {…} IN TRANSACTIONS OF 5000 ROWS 要 8042 ms（慢约 4 倍）——</text>
    <text x="62" y="386" font-size="11" fill="#64748b">分批换来的不是速度，是「有界的内存与锁」；OF 5000 后面必须跟 ROWS（实测踩过的语法坑）。</text>
    <text x="46" y="412" font-size="11" fill="#334155">■ 是不是冷库全量初始化：是 → 别走这条流水线，用 neo4j-admin database import（离线、绕过事务与约束校验）；LOAD CSV / APOC 的位置是增量与在线补数据。</text>

    <text x="30" y="442" font-size="11.5" fill="#64748b">计时口径：读数取自 cypher-shell 的 ready to start consuming query after N ms（数据库侧计时，不含 shell 启动的 7~8.6 s）。</text>
  </g>
</svg>
