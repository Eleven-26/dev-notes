<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>
  <text x="40" y="42" font-size="19" fill="#0f172a">真实系统的存储全景（Feed 例）：一个权威源 + 五种派生</text>
  <text x="40" y="70" font-size="13" fill="#64748b">先定「谁是权威源」，其余一切都从它派生</text>

  <!-- 发布 -->
  <rect x="360" y="90" width="280" height="46" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="500" y="119" font-size="14" fill="#7c2d12" text-anchor="middle">发布：内容本体 + 图片 / 视频</text>
  <line x1="500" y1="136" x2="500" y2="156" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="500,162 495,152 505,152" fill="#94a3b8"/>

  <!-- 权威源 -->
  <rect x="330" y="162" width="340" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="188" font-size="15" fill="#1e3a8a" text-anchor="middle">内容本体：MySQL（权威源）</text>
  <text x="500" y="209" font-size="12" fill="#1e3a8a" text-anchor="middle">唯一真相 · 时间线 / 检索 / 分析都能从它重建</text>

  <!-- 派生扇出 -->
  <line x1="500" y1="222" x2="500" y2="240" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="128" y1="240" x2="872" y2="240" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="128" y1="240" x2="128" y2="258" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="314" y1="240" x2="314" y2="258" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="500" y1="240" x2="500" y2="258" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="686" y1="240" x2="686" y2="258" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="872" y1="240" x2="872" y2="258" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- 五个派生 -->
  <rect x="40" y="258" width="176" height="118" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="128" y="286" font-size="13" fill="#1e3a8a" text-anchor="middle">时间线 inbox</text>
  <text x="128" y="308" font-size="11" fill="#334155" text-anchor="middle">Redis ZSet</text>
  <text x="128" y="330" font-size="11" fill="#64748b" text-anchor="middle">副本 · 可丢 · 可重建</text>
  <text x="128" y="352" font-size="11" fill="#64748b" text-anchor="middle">按分数翻页</text>

  <rect x="226" y="258" width="176" height="118" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="314" y="286" font-size="13" fill="#334155" text-anchor="middle">图片 / 视频</text>
  <text x="314" y="308" font-size="11" fill="#334155" text-anchor="middle">对象存储 + CDN</text>
  <text x="314" y="330" font-size="11" fill="#64748b" text-anchor="middle">静态资源 · 不进库</text>
  <text x="314" y="352" font-size="11" fill="#64748b" text-anchor="middle">库里只存 URL</text>

  <rect x="412" y="258" width="176" height="118" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="286" font-size="13" fill="#7c2d12" text-anchor="middle">检索</text>
  <text x="500" y="308" font-size="11" fill="#334155" text-anchor="middle">Elasticsearch</text>
  <text x="500" y="330" font-size="11" fill="#64748b" text-anchor="middle">副本 · 可丢 · 可重建</text>
  <text x="500" y="352" font-size="11" fill="#64748b" text-anchor="middle">按标签 / 关键词找</text>

  <rect x="598" y="258" width="176" height="118" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="686" y="286" font-size="13" fill="#14532d" text-anchor="middle">互动计数</text>
  <text x="686" y="308" font-size="11" fill="#334155" text-anchor="middle">Redis 计数 + 落库</text>
  <text x="686" y="330" font-size="11" fill="#64748b" text-anchor="middle">副本 · 可丢 · 可重算</text>
  <text x="686" y="352" font-size="11" fill="#64748b" text-anchor="middle">点赞 / 评论数</text>

  <rect x="784" y="258" width="176" height="118" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="872" y="286" font-size="13" fill="#334155" text-anchor="middle">冷归档</text>
  <text x="872" y="308" font-size="11" fill="#334155" text-anchor="middle">对象存储 + 列存</text>
  <text x="872" y="330" font-size="11" fill="#64748b" text-anchor="middle">归档 · 极低频</text>
  <text x="872" y="352" font-size="11" fill="#64748b" text-anchor="middle">一年以上内容 / 日志</text>

  <!-- 小结 -->
  <rect x="40" y="394" width="920" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="420" font-size="13" fill="#0f172a">读取：Redis 时间线（热）→ 回填内容本体（MySQL 批量 MGET / 点查）；翻到有界时间线之外 → 回源 MySQL 或冷层。</text>
  <text x="60" y="444" font-size="13" fill="#0f172a">写入：内容本体先落 MySQL；图片先传对象存储、库里只存 URL；时间线与检索 / 分析副本由异步扇出与 CDC 派生。</text>
</svg>
