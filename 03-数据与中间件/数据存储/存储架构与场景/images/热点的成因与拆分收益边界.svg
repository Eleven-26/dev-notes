<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">热点数据：成因、拆分收益边界与替代手段</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">读数取自本篇引用的本机实测；倍数为量级口径，不构成性能排名</text>

  <rect x="30" y="80" width="306" height="104" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="46" y="104" font-size="13" font-weight="bold" fill="#991b1b">① 热点内容</text>
  <text x="46" y="128" font-size="11.5" fill="#7f1d1d">某个对象的读或写高度集中</text>
  <text x="46" y="149" font-size="11.5" fill="#7f1d1d">所有请求打到同一个 key / 同一行</text>
  <text x="46" y="170" font-size="11.5" fill="#7f1d1d">→ 单点资源的 CPU 或锁先到顶</text>

  <rect x="347" y="80" width="306" height="104" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="363" y="104" font-size="13" font-weight="bold" fill="#9a3412">② 大号 / 大 V</text>
  <text x="363" y="128" font-size="11.5" fill="#7c2d12">一个账号的扇出 = 它的粉丝数</text>
  <text x="363" y="149" font-size="11.5" fill="#7c2d12">一次发布就是百万级写入</text>
  <text x="363" y="170" font-size="11.5" fill="#7c2d12">→ 不是慢一点，而是不可行</text>

  <rect x="664" y="80" width="306" height="104" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="680" y="104" font-size="13" font-weight="bold" fill="#854d0e">③ 热点行 / 热点分片</text>
  <text x="680" y="128" font-size="11.5" fill="#713f12">扣减集中在同一行或同一分片</text>
  <text x="680" y="149" font-size="11.5" fill="#713f12">行锁把并发压成串行</text>
  <text x="680" y="170" font-size="11.5" fill="#713f12">→ 冲突重试反而放大代价</text>

  <rect x="30" y="204" width="470" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="31" y="205" width="468" height="32" rx="9" fill="#e2e8f0"/>
  <text x="46" y="227" font-size="14" font-weight="bold" fill="#0f172a">A 拆 key 的收益边界（实测）</text>

  <text x="46" y="258" font-size="12" fill="#334155">单实例 · 单 key</text>
  <text x="470" y="258" text-anchor="end" font-size="12" fill="#0f172a">173ms ~ 496ms</text>
  <text x="46" y="282" font-size="12" fill="#334155">单实例 · 分 8 个子 key</text>
  <text x="470" y="282" text-anchor="end" font-size="12" fill="#b91c1c">174ms ~ 285ms</text>
  <rect x="46" y="294" width="424" height="34" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="60" y="316" font-size="11.5" fill="#991b1b">要点：单实例里拆 8 份，最快值与不拆完全相同</text>

  <text x="46" y="352" font-size="12" fill="#334155">两实例 · 分片到 2 实例</text>
  <text x="470" y="352" text-anchor="end" font-size="12" fill="#166534">142ms ~ 179ms</text>
  <text x="46" y="376" font-size="11.5" fill="#475569">原因：Redis 单线程、命令串行、单 key 查找本就是 O(1)</text>
  <text x="46" y="398" font-size="11.5" fill="#475569">收益只来自「多一个节点、多一个 CPU 核心」，约 1.2~1.4 倍</text>

  <rect x="520" y="204" width="450" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="521" y="205" width="448" height="32" rx="9" fill="#e2e8f0"/>
  <text x="536" y="227" font-size="14" font-weight="bold" fill="#0f172a">B 拆完之后要还的账</text>
  <text x="536" y="258" font-size="12" fill="#334155">读计数要聚合 N 个子 key（实测，用管道取值）</text>
  <text x="536" y="282" font-size="12" fill="#334155">聚合 1 个 key：130µs</text>
  <text x="536" y="306" font-size="12" fill="#334155">聚合 4 / 8 / 16 个：205 ~ 318µs，约 1.6 ~ 2.4 倍</text>
  <text x="536" y="334" font-size="11.5" fill="#b91c1c">注意：还没算子 key 写失败的补偿</text>
  <text x="536" y="356" font-size="11.5" fill="#b91c1c">注意：聚合逻辑污染业务代码</text>
  <text x="536" y="378" font-size="11.5" fill="#b91c1c">注意：子 key 数写死就与分片数耦合</text>
  <text x="536" y="402" font-size="11.5" fill="#475569">分片数要与子 key 数对齐，否则某个分片仍然热</text>

  <rect x="30" y="436" width="940" height="104" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="460" font-size="14" font-weight="bold" fill="#1e40af">拆分之外的三招，先试再拆</text>
  <text x="46" y="485" font-size="12" fill="#1e3a8a">① 本地缓存 + 合并写入：把同一 key 的 N 次自增在应用侧合并成 1 次</text>
  <text x="46" y="508" font-size="12" fill="#1e3a8a">② 读写分离：让从节点分担读；③ 热点内容下沉到本地，多级缓存逐层拦截</text>
  <text x="46" y="531" font-size="12" fill="#1e3a8a">热点行一侧：冲突重试在热点行上是负优化；分段只有在物理资源真的不止一份时才有收益</text>

  <rect x="30" y="556" width="940" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="578" font-size="12.5" font-weight="bold" fill="#0f172a">判据顺序</text>
  <text x="46" y="597" font-size="12" fill="#334155">先看单节点是否被打满（延迟、节点 CPU、每秒操作数）；没打满就别拆——且热点是现象不是名单，要持续监控发现</text>
</svg>
