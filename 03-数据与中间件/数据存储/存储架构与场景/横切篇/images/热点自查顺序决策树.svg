<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1100" height="720" fill="#ffffff"/>
  <defs>
    <marker id="rd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">热点自查顺序：先定位物理资源，再决定减请求还是分散</text>
  <text x="550" y="60" text-anchor="middle" font-size="12.5" fill="#64748b">六步往下走，两处分叉；本图为判据示意，不含新读数</text>

  <rect x="60" y="100" width="360" height="60" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="240" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">① 确认瓶颈在哪个物理资源</text>
  <text x="240" y="147" text-anchor="middle" font-size="10.5" fill="#1e3a8a">CPU / 网络 / 锁 / 磁盘，先定位，别猜</text>

  <rect x="60" y="190" width="360" height="60" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="240" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">② 单节点是否被打满？</text>
  <text x="240" y="237" text-anchor="middle" font-size="10.5" fill="#1e3a8a">没打满就说明瓶颈不在这条路上</text>

  <rect x="60" y="280" width="360" height="60" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="240" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">③ 先减少请求</text>
  <text x="240" y="327" text-anchor="middle" font-size="10.5" fill="#1e3a8a">本地缓存、合并写入、多级缓存逐层拦截</text>

  <rect x="60" y="370" width="360" height="60" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="240" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">④ 再分散请求</text>
  <text x="240" y="417" text-anchor="middle" font-size="10.5" fill="#1e3a8a">拆到不同实例 / 分片，分片数与子 key 数对齐</text>

  <rect x="60" y="460" width="360" height="60" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="240" y="486" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">⑤ 检查是不是热点行</text>
  <text x="240" y="507" text-anchor="middle" font-size="10.5" fill="#92400e">热点键与热点行的手法不能互换</text>

  <rect x="60" y="550" width="360" height="60" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="240" y="576" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">⑥ 建立持续监控</text>
  <text x="240" y="597" text-anchor="middle" font-size="10.5" fill="#166534">热点是现象不是名单，要能发现新的</text>

  <path d="M 240 160 L 240 190" stroke="#64748b" stroke-width="1.5" marker-end="url(#rd)"/>
  <path d="M 240 250 L 240 280" stroke="#64748b" stroke-width="1.5" marker-end="url(#rd)"/>
  <path d="M 240 340 L 240 370" stroke="#64748b" stroke-width="1.5" marker-end="url(#rd)"/>
  <path d="M 240 430 L 240 460" stroke="#64748b" stroke-width="1.5" marker-end="url(#rd)"/>
  <path d="M 240 520 L 240 550" stroke="#64748b" stroke-width="1.5" marker-end="url(#rd)"/>

  <path d="M 420 220 L 530 220" stroke="#dc2626" stroke-width="1.5" marker-end="url(#rd)"/>
  <text x="475" y="212" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b91c1c">没打满</text>
  <rect x="530" y="190" width="500" height="60" rx="9" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
  <text x="548" y="216" font-size="13" font-weight="bold" fill="#991b1b">拆分没有收益 → 回头查别的原因</text>
  <text x="548" y="237" font-size="10.5" fill="#991b1b">单实例没到顶时，拆 key 只是把请求绕一圈</text>

  <path d="M 420 490 L 530 490" stroke="#d97706" stroke-width="1.5" marker-end="url(#rd)"/>
  <text x="475" y="482" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">是热点行</text>
  <rect x="530" y="460" width="500" height="60" rx="9" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="548" y="486" font-size="13" font-weight="bold" fill="#92400e">别用重试型 CAS → 把扣减收敛到一个原子点</text>
  <text x="548" y="507" font-size="10.5" fill="#92400e">冲突几乎必然发生，重试会把资源消耗放大</text>

  <rect x="60" y="642" width="970" height="48" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="76" y="671" font-size="12.5" font-weight="bold" fill="#1e40af">判据：分的是物理资源，不是逻辑名字 —— 单节点没打满时，任何拆分都不改变上限。</text>
</svg>
