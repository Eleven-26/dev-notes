<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <defs>
    <marker id="cb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">冷热边界怎么定：按时间拍天数，还是按访问分布切</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">两种定法的判据与失效点；本图为判据示意，不含新读数</text>

  <rect x="40" y="86" width="440" height="390" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
  <text x="260" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">按时间远近：拍一个天数</text>

  <path d="M 72 176 L 448 176" stroke="#334155" stroke-width="1.6" marker-end="url(#cb)"/>
  <path d="M 300 166 L 300 186" stroke="#dc2626" stroke-width="2"/>
  <text x="300" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">超过 30 天 → 冷层</text>
  <text x="180" y="200" text-anchor="middle" font-size="11" fill="#991b1b">热层</text>
  <text x="380" y="200" text-anchor="middle" font-size="11" fill="#991b1b">冷层</text>

  <text x="72" y="240" font-size="12" fill="#334155">✗ 热点内容可能很久仍被读</text>
  <text x="72" y="266" font-size="12" fill="#334155">✗ 冷内容也可能只隔几天</text>
  <text x="72" y="292" font-size="12" fill="#334155">✗ 访问分布的形状完全没看</text>
  <text x="72" y="334" font-size="12" font-weight="bold" fill="#b91c1c">→ 边界与真实负载脱节</text>
  <text x="72" y="372" font-size="11.5" fill="#991b1b">它只是分布的一种常见形状，不是判据本身</text>

  <rect x="520" y="86" width="440" height="390" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="740" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">按访问分布：看请求落在哪</text>

  <path d="M 552 320 L 948 320" stroke="#334155" stroke-width="1.6" marker-end="url(#cb)"/>
  <rect x="572" y="170" width="60" height="150" rx="3" fill="#16a34a" opacity="0.85"/>
  <rect x="652" y="230" width="60" height="90" rx="3" fill="#22c55e" opacity="0.8"/>
  <rect x="732" y="270" width="60" height="50" rx="3" fill="#4ade80" opacity="0.8"/>
  <rect x="812" y="295" width="60" height="25" rx="3" fill="#86efac"/>
  <text x="602" y="340" text-anchor="middle" font-size="10.5" fill="#334155">最近</text>
  <text x="682" y="340" text-anchor="middle" font-size="10.5" fill="#334155">较近</text>
  <text x="762" y="340" text-anchor="middle" font-size="10.5" fill="#334155">较久</text>
  <text x="842" y="340" text-anchor="middle" font-size="10.5" fill="#334155">最久</text>
  <text x="552" y="160" font-size="10.5" fill="#166534">请求数</text>

  <text x="552" y="378" font-size="12" font-weight="bold" fill="#166534">承接绝大多数请求的那一段 = 热层</text>
  <text x="552" y="404" font-size="11.5" fill="#166534">边界跟着真实负载走，长尾也能切</text>
  <text x="552" y="430" font-size="11.5" fill="#166534">代价是要有访问统计，不能拍脑袋</text>

  <rect x="40" y="500" width="920" height="60" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="56" y="526" font-size="12.5" font-weight="bold" fill="#1e40af">判据：「热」是由请求定义的，不是由数据年龄定义的。</text>
  <text x="56" y="548" font-size="12" fill="#1e3a8a">按时间之所以经常成立，只是因为它恰好近似了访问分布 —— 分布一变，边界就得跟着换算法。</text>
</svg>
