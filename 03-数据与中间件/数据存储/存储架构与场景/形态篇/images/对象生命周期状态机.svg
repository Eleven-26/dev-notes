<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <defs>
    <marker id="ol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="or" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">对象生命周期是一个状态机：下沉单向、取回有延迟、删除分两步</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">标准 → 低频 → 归档 → 冻结 按年龄 / 访问次数自动下沉；回到可读状态要发起取回（形态示意）</text>

  <rect x="40" y="110" width="150" height="64" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="115" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">标准存储</text>
  <text x="115" y="156" text-anchor="middle" font-size="10.5" fill="#166534">频繁访问</text>

  <rect x="250" y="110" width="150" height="64" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="325" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">低频访问</text>
  <text x="325" y="156" text-anchor="middle" font-size="10.5" fill="#075985">偶尔读</text>

  <rect x="460" y="110" width="150" height="64" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="535" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">归档</text>
  <text x="535" y="156" text-anchor="middle" font-size="10.5" fill="#475569">取回要分钟～小时</text>

  <rect x="670" y="110" width="150" height="64" rx="9" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
  <text x="745" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">冻结 / 深度归档</text>
  <text x="745" y="156" text-anchor="middle" font-size="10.5" fill="#334155">最便宜、取回最慢</text>

  <rect x="870" y="110" width="100" height="64" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="920" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">过期 / 删除</text>
  <text x="920" y="156" text-anchor="middle" font-size="10.5" fill="#991b1b">先不可达</text>

  <path d="M 190 142 L 250 142" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ol)"/>
  <path d="M 400 142 L 460 142" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ol)"/>
  <path d="M 610 142 L 670 142" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ol)"/>
  <path d="M 820 142 L 870 142" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ol)"/>

  <text x="115" y="200" text-anchor="middle" font-size="11" fill="#64748b">贵 / 读快</text>
  <text x="325" y="200" text-anchor="middle" font-size="11" fill="#64748b">较便宜</text>
  <text x="535" y="200" text-anchor="middle" font-size="11" fill="#64748b">更便宜 / 需解冻</text>
  <text x="745" y="200" text-anchor="middle" font-size="11" fill="#64748b">最便宜 / 最慢</text>
  <text x="430" y="232" text-anchor="middle" font-size="12" fill="#334155">按年龄 / 访问次数自动下沉（只往下，不往上）</text>

  <path d="M 605 174 L 605 290 L 115 290 L 115 174" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#or)"/>
  <text x="340" y="282" text-anchor="middle" font-size="11.5" fill="#1d4ed8">取回：解冻 + 拷一份回来（分钟～小时级）</text>

  <path d="M 920 174 L 920 330 L 595 330 L 595 360" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ol)"/>

  <rect x="480" y="360" width="230" height="52" rx="8" fill="#fff1f2" stroke="#f87171" stroke-width="1.2"/>
  <text x="595" y="383" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">① 删指针 / 标记删除</text>
  <text x="595" y="401" text-anchor="middle" font-size="10.5" fill="#991b1b">让对象先不可达</text>

  <rect x="760" y="360" width="170" height="52" rx="8" fill="#fff1f2" stroke="#f87171" stroke-width="1.2"/>
  <text x="845" y="383" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">② 异步清本体</text>
  <text x="845" y="401" text-anchor="middle" font-size="10.5" fill="#991b1b">清桶里的对象</text>

  <path d="M 710 386 L 760 386" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ol)"/>

  <text x="46" y="330" font-size="12" fill="#b91c1c">顺序不能反：先清对象 → 留下悬空指针</text>
  <text x="46" y="360" font-size="12" fill="#334155">改内容：写新对象 + 换指针，不原地改</text>
  <text x="46" y="390" font-size="12" fill="#334155">不可变：旧版本仍在，可回滚、可校验</text>
  <text x="46" y="420" font-size="12" fill="#334155">对账：孤儿对象 = 有对象无指针</text>
  <text x="46" y="450" font-size="12" fill="#334155">　　　悬空指针 = 有指针无对象</text>

  <rect x="30" y="480" width="940" height="130" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="506" font-size="13" font-weight="bold" fill="#1e40af">判据：用「还会不会被读」定档位，用「谁先谁后」定删除</text>
  <text x="46" y="536" font-size="12" fill="#1e3a8a">还在被读的别按年龄一刀切；归档取回要时间，产品交互得容忍</text>
  <text x="46" y="562" font-size="12" fill="#1e3a8a">删除只有一种顺序：先让对象不可达 → 再异步清本体</text>
  <text x="46" y="588" font-size="12" fill="#1e3a8a">对账兜底：孤儿对象（有对象无指针）与悬空指针（有指针无对象）</text>
</svg>
