<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">时序数据的存储形态：载体、有界与游标</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">只追加、按时间读、只关心最近一段；本图为形态示意，N 为产品水位参数</text>

  <rect x="30" y="80" width="470" height="228" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="31" y="81" width="468" height="32" rx="9" fill="#e2e8f0"/>
  <text x="46" y="103" font-size="14" font-weight="bold" fill="#0f172a">A 三种载体，各服务一层</text>

  <rect x="46" y="126" width="438" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="60" y="146" font-size="12.5" font-weight="bold" fill="#991b1b">有序集合（Redis ZSET）</text>
  <text x="60" y="167" font-size="11.5" fill="#7f1d1d">按分数插入、按分数范围取一页、按排名截断——三件事都贴合</text>

  <rect x="46" y="186" width="438" height="52" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="60" y="206" font-size="12.5" font-weight="bold" fill="#854d0e">本地内存</text>
  <text x="60" y="227" font-size="11.5" fill="#713f12">极热、超低延迟；代价是不能多实例共享、重启即丢</text>

  <rect x="46" y="246" width="438" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="60" y="266" font-size="12.5" font-weight="bold" fill="#075985">数据库表</text>
  <text x="60" y="286" font-size="11.5" fill="#0c4a6e">要持久、要按属性过滤；写入密集与深分页是它的弱项</text>

  <rect x="520" y="80" width="450" height="228" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="521" y="81" width="448" height="32" rx="9" fill="#e2e8f0"/>
  <text x="536" y="103" font-size="14" font-weight="bold" fill="#0f172a">B 有界：只留最近 N 条</text>
  <text x="536" y="132" font-size="12" fill="#334155">追加写入会让列表无限膨胀，必须截断头部</text>
  <text x="536" y="160" font-size="12" fill="#334155">写：按分数加入一条</text>
  <text x="536" y="183" font-size="12" fill="#334155">截断：按排名删掉最老的部分，只保留 N 条</text>
  <text x="536" y="206" font-size="12" fill="#334155">读：从某个分数之后取一页</text>
  <path d="M 536 222 L 954 222" stroke="#e2e8f0" stroke-width="1"/>
  <text x="536" y="244" font-size="12" fill="#1d4ed8">要点：列表里只存指针（内容 ID + 排序键）</text>
  <text x="536" y="267" font-size="12" fill="#334155">内容本体另存一层，读时按 ID 批量回填</text>
  <text x="536" y="290" font-size="12" fill="#b91c1c">注意：翻出有界范围只能回源或明确「到底」</text>

  <rect x="30" y="328" width="940" height="188" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="31" y="329" width="938" height="32" rx="9" fill="#e2e8f0"/>
  <text x="46" y="351" font-size="14" font-weight="bold" fill="#0f172a">C 分页：为什么游标替代 offset</text>

  <rect x="46" y="374" width="450" height="72" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="60" y="396" font-size="12.5" font-weight="bold" fill="#991b1b">offset：跳过前 K 条</text>
  <text x="60" y="418" font-size="11.5" fill="#7f1d1d">中途插入新内容 → 边界后移，有一条没人展示（漂移）</text>
  <text x="60" y="437" font-size="11.5" fill="#7f1d1d">中途删除内容 → 边界前移，同一条出现在两页（重复）</text>

  <rect x="514" y="374" width="456" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="528" y="396" font-size="12.5" font-weight="bold" fill="#166534">游标：从某个排序键之后继续</text>
  <text x="528" y="418" font-size="11.5" fill="#14532d">中间增删都不影响位置，翻页始终锚定在同一个排序键上</text>
  <text x="528" y="437" font-size="11.5" fill="#14532d">硬前提：排序键必须唯一（同秒时间戳会碰撞）</text>

  <text x="46" y="472" font-size="12" fill="#334155">取舍：游标换来翻页一致，代价是失去「直接跳到第 N 页」的能力——「一路往下刷」的形态几乎不需要跳页</text>
  <text x="46" y="496" font-size="12" fill="#64748b">多路合并（推来的 + 现场拉的）用堆做 k 路归并，每路只取当前头部，取够一页即停，再按内容 ID 去重</text>

  <rect x="30" y="528" width="940" height="62" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="550" font-size="12.5" font-weight="bold" fill="#1e40af">判据</text>
  <text x="46" y="572" font-size="12" fill="#1e3a8a">翻页时集合会不会变？会变就必须游标；时间线必须设上限，有界是前提假设、不是优化项</text>
</svg>
