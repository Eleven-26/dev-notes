<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">层级与树形数据的四种存储模型</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">列的是相对代价与适用面，不是实测读数；四个模型都建立在「单一父 + 无环」之上</text>

  <rect x="30" y="78" width="450" height="206" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="31" y="79" width="448" height="32" rx="9" fill="#e2e8f0"/>
  <text x="46" y="101" font-size="14" font-weight="bold" fill="#0f172a">A 邻接表：只存 parent_id</text>
  <text x="46" y="136" font-size="12" fill="#334155">查子孙：递归 / 递归 CTE，深度受限</text>
  <text x="46" y="160" font-size="12" fill="#334155">查祖先：沿父链上溯，便宜</text>
  <text x="46" y="184" font-size="12" fill="#334155">移动子树：改一行，最便宜</text>
  <text x="46" y="208" font-size="12" fill="#334155">适合：写多、层级浅、读少</text>
  <text x="46" y="240" font-size="12" fill="#b91c1c">注意：本身不保证无环，递归可能死循环</text>
  <text x="46" y="264" font-size="11.5" fill="#64748b">照数据本来的样子存，代价全落在递归查询上</text>

  <rect x="520" y="78" width="450" height="206" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="521" y="79" width="448" height="32" rx="9" fill="#e2e8f0"/>
  <text x="536" y="101" font-size="14" font-weight="bold" fill="#0f172a">B 路径枚举：存 /1/12/123/</text>
  <text x="536" y="136" font-size="12" fill="#334155">查子孙：字符串前缀匹配，一次范围扫</text>
  <text x="536" y="160" font-size="12" fill="#334155">查祖先：拆路径串，便宜</text>
  <text x="536" y="184" font-size="12" fill="#334155">移动子树：重写所有子孙的路径串</text>
  <text x="536" y="208" font-size="12" fill="#334155">适合：读多写少、层级浅</text>
  <text x="536" y="240" font-size="12" fill="#b91c1c">注意：路径串有长度上限，层级深了会顶到</text>
  <text x="536" y="264" font-size="11.5" fill="#64748b">要点：把路径压成一行字符串，用前缀换范围扫</text>

  <rect x="30" y="296" width="450" height="206" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="31" y="297" width="448" height="32" rx="9" fill="#e2e8f0"/>
  <text x="46" y="319" font-size="14" font-weight="bold" fill="#0f172a">C 嵌套集：存 left / right 左右值</text>
  <text x="46" y="354" font-size="12" fill="#334155">查子孙：范围查（left &gt; a 且 right &lt; b），很快</text>
  <text x="46" y="378" font-size="12" fill="#334155">查祖先：便宜</text>
  <text x="46" y="402" font-size="12" fill="#334155">移动子树：要挪半个表的左右值（极贵）</text>
  <text x="46" y="426" font-size="12" fill="#334155">适合：几乎只读（静态类目、省市区划）</text>
  <text x="46" y="458" font-size="12" fill="#b91c1c">注意：一次增删的代价约等于全表更新</text>
  <text x="46" y="482" font-size="11.5" fill="#64748b">要点：把树编码成区间，区间包含即层级关系</text>

  <rect x="520" y="296" width="450" height="206" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="521" y="297" width="448" height="32" rx="9" fill="#e2e8f0"/>
  <text x="536" y="319" font-size="14" font-weight="bold" fill="#0f172a">D 闭包表：另存 (祖先, 后代, 距离)</text>
  <text x="536" y="354" font-size="12" fill="#334155">查子孙：一次索引查，任意深度都快</text>
  <text x="536" y="378" font-size="12" fill="#334155">查祖先：同样快</text>
  <text x="536" y="402" font-size="12" fill="#334155">移动子树：增删 O(深度²) 行</text>
  <text x="536" y="426" font-size="12" fill="#334155">适合：读多、层级深、还要按距离查</text>
  <text x="536" y="458" font-size="12" fill="#b91c1c">注意：行数 ≈ 节点数 × 平均深度，冗余大</text>
  <text x="536" y="482" font-size="11.5" fill="#64748b">要点：拿空间买查询，查询不随深度退化</text>

  <rect x="30" y="514" width="940" height="130" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="540" font-size="13" font-weight="bold" fill="#1e40af">判据：先看「读多还是写多」，再看「层级深不深」</text>
  <text x="46" y="570" font-size="12" fill="#1e3a8a">只读 → 嵌套集 / 路径枚举；读多写少 → 闭包表；写多且浅 → 邻接表</text>
  <text x="46" y="596" font-size="12" fill="#1e3a8a">有环 / 多父 / 边带属性 → 它就不是树，退回邻接表或图模型</text>
  <text x="46" y="622" font-size="12" fill="#1e3a8a">缓存的失效粒度是「子树 + 祖先链」，不是单个节点</text>
</svg>
