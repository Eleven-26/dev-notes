<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">关系多跳查询：集合运算、跨槽约束与三条路的分界</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">命令与代价量级取自本篇第七节；本图为形态示意，不构成性能排名</text>

  <rect x="30" y="80" width="460" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="31" y="81" width="458" height="32" rx="9" fill="#e2e8f0"/>
  <text x="46" y="103" font-size="14" font-weight="bold" fill="#0f172a">A 交集：共同关注 = 两个一跳集合求交</text>

  <circle cx="160" cy="190" r="54" fill="#dbeafe" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="232" cy="190" r="54" fill="#fee2e2" fill-opacity="0.55" stroke="#f87171" stroke-width="1"/>
  <text x="138" y="168" text-anchor="middle" font-size="10.5" fill="#1e40af">我关注的人</text>
  <text x="254" y="168" text-anchor="middle" font-size="10.5" fill="#991b1b">他关注的人</text>
  <text x="196" y="192" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">共同关注</text>
  <text x="196" y="208" text-anchor="middle" font-size="9.5" fill="#475569">SINTER</text>

  <text x="46" y="252" font-size="11.5" fill="#334155">代价看「最小集合」的基数，不随结果集大小增长</text>
  <text x="46" y="270" font-size="11.5" fill="#334155">只要数量 / 判有无：SINTERCARD 2 带 LIMIT 可提前停</text>
  <text x="46" y="288" font-size="11.5" fill="#b91c1c">⚠️ 集合要整份搬进内存算，百万级大集合代价可观</text>

  <rect x="520" y="80" width="450" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="521" y="81" width="448" height="32" rx="9" fill="#e2e8f0"/>
  <text x="536" y="103" font-size="14" font-weight="bold" fill="#0f172a">B 并集：二度人脉 = 一跳集合们求并</text>

  <rect x="536" y="122" width="418" height="78" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="548" y="142" font-size="11" font-weight="bold" fill="#334155">并集（SUNION）：代价随所有集合的元素总数增长</text>
  <rect x="548" y="152" width="126" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="611" y="175" text-anchor="middle" font-size="10.5" fill="#475569">对象①的一跳集合</text>
  <rect x="682" y="152" width="126" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="745" y="175" text-anchor="middle" font-size="10.5" fill="#475569">对象②的一跳集合</text>
  <rect x="816" y="152" width="126" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="879" y="175" text-anchor="middle" font-size="10.5" fill="#475569">对象③的一跳集合</text>

  <text x="536" y="226" font-size="11.5" fill="#334155">膨胀点 = 关注数 × 平均关注数：取之前必须先裁剪</text>
  <text x="536" y="246" font-size="11.5" fill="#334155">SUNION 省的是「不用 JOIN」，不省规模</text>
  <text x="536" y="266" font-size="11.5" fill="#334155">跨主体求并做不到服务端同槽（见 C）</text>
  <text x="536" y="286" font-size="11.5" fill="#b91c1c">⚠️ 不裁剪，一次查询就是一次全量并集</text>

  <rect x="30" y="310" width="940" height="196" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="31" y="311" width="938" height="32" rx="9" fill="#e2e8f0"/>
  <text x="46" y="333" font-size="14" font-weight="bold" fill="#0f172a">C 跨槽约束：一条命令的所有 key 必须落在同一个槽</text>
  <text x="46" y="358" font-size="11" fill="#334155">同一主体的两个方向 key 前缀不同 → 默认落到不同槽；一条命令的 key 跨槽 → 直接报错</text>

  <text x="269" y="376" text-anchor="middle" font-size="10.5" fill="#b91c1c">我:followee</text>
  <text x="731" y="376" text-anchor="middle" font-size="10.5" fill="#b91c1c">他:followee</text>

  <rect x="50" y="382" width="130" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="115" y="409" text-anchor="middle" font-size="11" fill="#64748b">槽①</text>
  <rect x="204" y="382" width="130" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="269" y="409" text-anchor="middle" font-size="11" fill="#991b1b">槽②</text>
  <rect x="358" y="382" width="130" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="423" y="409" text-anchor="middle" font-size="11" fill="#166534">槽③</text>
  <rect x="512" y="382" width="130" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="577" y="409" text-anchor="middle" font-size="11" fill="#64748b">槽④</text>
  <rect x="666" y="382" width="130" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="731" y="409" text-anchor="middle" font-size="11" fill="#991b1b">槽⑤</text>
  <rect x="820" y="382" width="130" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="885" y="409" text-anchor="middle" font-size="11" fill="#64748b">槽⑥</text>

  <text x="46" y="452" font-size="11" fill="#b91c1c">⚠️ 跨槽不可用是硬约束，不是可调优项</text>
  <text x="560" y="452" font-size="11" fill="#166534">hash tag：「{u:1001}:followee」与「{u:1001}:fans」绑同槽</text>
  <text x="46" y="472" font-size="11" fill="#b91c1c">退回应用层：各自 SMEMBERS 后自己求交，放弃服务端运算</text>
  <text x="560" y="472" font-size="11" fill="#334155">代价：把「跨槽不可用」换成「单槽变热」（见 热点数据存储.md）</text>

  <rect x="30" y="526" width="940" height="110" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="552" font-size="12.5" font-weight="bold" fill="#1e40af">D 三条路的分界：先看跳数，再看集合规模</text>
  <rect x="46" y="566" width="290" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="58" y="588" font-size="11.5" fill="#334155">一跳 / 两跳 + 集合可控</text>
  <text x="58" y="607" font-size="11" fill="#1d4ed8">→ 内存集合（SINTER / SUNION）</text>
  <rect x="350" y="566" width="290" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="362" y="588" font-size="11.5" fill="#334155">集合大，或要过滤 / 排序 / 分页</text>
  <text x="362" y="607" font-size="11" fill="#1d4ed8">→ 邻接表 + 索引（+ JOIN）</text>
  <rect x="654" y="566" width="292" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="666" y="588" font-size="11.5" fill="#334155">三跳以上且是主查询</text>
  <text x="666" y="607" font-size="11" fill="#1d4ed8">→ 图数据库（第六节）</text>
</svg>
