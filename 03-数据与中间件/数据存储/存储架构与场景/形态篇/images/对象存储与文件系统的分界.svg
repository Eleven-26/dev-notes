<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">对象与文件数据的存储形态</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">两条路线的分界、生命周期降档与出入链路；本图为形态示意，不构成产品排名</text>

  <rect x="30" y="78" width="450" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="31" y="79" width="448" height="32" rx="9" fill="#e2e8f0"/>
  <text x="46" y="101" font-size="14" font-weight="bold" fill="#0f172a">A 这类数据的共同形态</text>
  <text x="46" y="138" font-size="12" fill="#334155">大：单条 MB～GB 级 → 业务库里只存指针</text>
  <text x="46" y="162" font-size="12" fill="#334155">不可变：写完基本不改 → 适合内容寻址</text>
  <text x="46" y="186" font-size="12" fill="#334155">整存整取：不按字段查 → 只需按 key 定位</text>
  <text x="46" y="210" font-size="12" fill="#334155">要能直接对外：能签发临时凭证直接给出去</text>
  <text x="46" y="242" font-size="12" fill="#1d4ed8">要点：单条大且不可变，优化的是「吞吐一整份」</text>
  <text x="46" y="266" font-size="11.5" fill="#64748b">与时序类数据同属「只追加」，区别在粒度</text>

  <rect x="520" y="78" width="450" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="521" y="79" width="448" height="32" rx="9" fill="#e2e8f0"/>
  <text x="536" y="101" font-size="14" font-weight="bold" fill="#0f172a">B 对象存储 vs 文件系统</text>
  <text x="536" y="138" font-size="12" fill="#334155">对象存储：扁平的桶 + 对象，没有真目录</text>
  <text x="536" y="162" font-size="12" fill="#334155">文件系统：真实目录树 + 文件语义</text>
  <text x="536" y="186" font-size="12" fill="#334155">改一个字节：整对象重写 vs 可随机写</text>
  <text x="536" y="210" font-size="12" fill="#334155">并发：强读后写 vs POSIX 语义（要加锁）</text>
  <text x="536" y="242" font-size="12" fill="#1d4ed8">要点：要 POSIX 随机写 → 文件系统</text>
  <text x="536" y="266" font-size="11.5" fill="#64748b">「不能改」换来的是近乎无限的扩展性</text>

  <rect x="30" y="304" width="940" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="31" y="305" width="938" height="32" rx="9" fill="#e2e8f0"/>
  <text x="46" y="327" font-size="14" font-weight="bold" fill="#0f172a">C 生命周期：按年龄 / 访问次数自动降档</text>
  <rect x="60" y="350" width="190" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="155" y="371" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">标准存储</text>
  <text x="155" y="389" text-anchor="middle" font-size="10.5" fill="#166534">频繁访问</text>
  <path d="M 252 374 L 286 374" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar3)"/>
  <rect x="290" y="350" width="190" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="385" y="371" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">低频访问</text>
  <text x="385" y="389" text-anchor="middle" font-size="10.5" fill="#075985">偶尔读</text>
  <path d="M 482 374 L 516 374" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar3)"/>
  <rect x="520" y="350" width="190" height="48" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="615" y="371" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">归档</text>
  <text x="615" y="389" text-anchor="middle" font-size="10.5" fill="#475569">取回要分钟～小时</text>
  <path d="M 712 374 L 746 374" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar3)"/>
  <rect x="750" y="350" width="190" height="48" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="845" y="371" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">冻结 / 深度归档</text>
  <text x="845" y="389" text-anchor="middle" font-size="10.5" fill="#475569">最便宜、取回最慢</text>
  <text x="46" y="430" font-size="12" fill="#1d4ed8">要点：与「按时间下沉」同一套——贵的介质存了几乎不读的数据就该降档；还在被读的别按年龄一刀切</text>

  <rect x="30" y="470" width="940" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="31" y="471" width="938" height="32" rx="9" fill="#e2e8f0"/>
  <text x="46" y="493" font-size="14" font-weight="bold" fill="#0f172a">D 存进来与给出去：写在最前面</text>
  <text x="46" y="524" font-size="12" fill="#334155">客户端直传：业务服务器只签发临时凭证 / 预签名 URL，数据不进业务服务器</text>
  <text x="46" y="548" font-size="12" fill="#334155">分片 + 断点续传 + 退避重试：大文件要分片，重试要退避，否则打爆网关</text>
  <text x="46" y="572" font-size="12" fill="#334155">先让对象落地、确认后再在权威源写指针 → 避免「库里有、文件没有」</text>

  <rect x="30" y="606" width="940" height="44" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="632" font-size="12" fill="#1e3a8a">三条判据：① 先问要不要 POSIX 随机写；② 业务库只存指针，本体永不进库；③ 不可变 → 内容寻址 + 长 TTL</text>
</svg>
