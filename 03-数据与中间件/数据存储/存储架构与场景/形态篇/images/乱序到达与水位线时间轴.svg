<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="650" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">乱序数据怎么处理：两个时间、一条水位线</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">窗口长短由业务容忍的延迟决定；本图为形态示意，不给固定阈值</text>

  <rect x="30" y="80" width="940" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="31" y="81" width="938" height="32" rx="9" fill="#e2e8f0"/>
  <text x="46" y="103" font-size="14" font-weight="bold" fill="#0f172a">A 一条时间轴：事件时间与到达顺序错开</text>
  <text x="46" y="134" font-size="11" fill="#334155">同一批事件，两种排序：上排按事件时间（实际发生），下排按到达顺序（系统接收）</text>

  <text x="46" y="174" font-size="11" fill="#475569">事件时间</text>
  <path d="M 110 170 L 930 170" stroke="#94a3b8" stroke-width="1.4" fill="none"/>
  <text x="46" y="254" font-size="11" fill="#475569">到达顺序</text>
  <path d="M 110 250 L 930 250" stroke="#94a3b8" stroke-width="1.4" fill="none"/>

  <rect x="135" y="159" width="30" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="150" y="150" text-anchor="middle" font-size="10.5" fill="#1e40af">事件①</text>
  <rect x="245" y="159" width="30" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="260" y="150" text-anchor="middle" font-size="10.5" fill="#1e40af">事件②</text>
  <rect x="355" y="159" width="30" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="370" y="150" text-anchor="middle" font-size="10.5" fill="#1e40af">事件③</text>
  <rect x="465" y="159" width="30" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="480" y="150" text-anchor="middle" font-size="10.5" fill="#1e40af">事件④</text>
  <rect x="575" y="159" width="30" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="590" y="150" text-anchor="middle" font-size="10.5" fill="#1e40af">事件⑤</text>

  <rect x="135" y="239" width="30" height="22" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="150" y="282" text-anchor="middle" font-size="10.5" fill="#991b1b">事件①</text>
  <rect x="245" y="239" width="30" height="22" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="260" y="282" text-anchor="middle" font-size="10.5" fill="#991b1b">事件③</text>
  <rect x="355" y="239" width="30" height="22" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="370" y="282" text-anchor="middle" font-size="10.5" fill="#991b1b">事件②</text>
  <rect x="465" y="239" width="30" height="22" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="480" y="282" text-anchor="middle" font-size="10.5" fill="#991b1b">事件⑤</text>
  <rect x="575" y="239" width="30" height="22" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="590" y="282" text-anchor="middle" font-size="10.5" fill="#991b1b">事件④</text>

  <path d="M 530 170 L 530 222" stroke="#1e40af" stroke-width="1.4" fill="none" stroke-dasharray="5 4"/>
  <text x="542" y="196" font-size="11" fill="#1e40af">水位线 = 最大事件时间 − 允许延迟</text>
  <text x="110" y="200" font-size="11" fill="#166534">线左侧（时间戳 ≤ 水位）→ 照常并入</text>
  <text x="110" y="220" font-size="11" fill="#b91c1c">线右侧（超出允许延迟）→ 走迟到侧单独处理</text>
  <text x="46" y="308" font-size="11.5" fill="#64748b">窗口 = 你能容忍的迟到时长：监控可到秒级、离线分析可到小时级；越长越准、产出越晚</text>

  <rect x="30" y="350" width="940" height="170" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="31" y="351" width="938" height="32" rx="9" fill="#e2e8f0"/>
  <text x="46" y="373" font-size="14" font-weight="bold" fill="#0f172a">B 三种应对：各解决什么、不解决什么</text>

  <rect x="46" y="396" width="290" height="108" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="58" y="420" font-size="11.5" font-weight="bold" fill="#334155">水位线 + 允许延迟窗口</text>
  <text x="58" y="444" font-size="11" fill="#166534">解决：迟到多久还算数</text>
  <text x="58" y="466" font-size="11" fill="#334155">窗口内照常并入</text>
  <text x="58" y="488" font-size="11" fill="#b91c1c">超出窗口走迟到侧</text>

  <rect x="350" y="396" width="290" height="108" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="362" y="420" font-size="11.5" font-weight="bold" fill="#334155">复合排序键（时间戳, 唯一 ID）</text>
  <text x="362" y="444" font-size="11" fill="#166534">解决：同一时间戳的键碰撞</text>
  <text x="362" y="466" font-size="11" fill="#b91c1c">⚠️ 不解决迟到</text>
  <text x="362" y="488" font-size="11" fill="#334155">迟到的键更小，仍插到前面</text>

  <rect x="654" y="396" width="292" height="108" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="666" y="420" font-size="11.5" font-weight="bold" fill="#334155">分区按到达时间</text>
  <text x="666" y="444" font-size="11" fill="#166534">解决：不写回已关闭分区</text>
  <text x="666" y="466" font-size="11" fill="#334155">新到达的一定进当前分区</text>
  <text x="666" y="488" font-size="11" fill="#b91c1c">代价：放弃「分区即有序」</text>

  <rect x="30" y="540" width="940" height="100" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="566" font-size="12.5" font-weight="bold" fill="#1e40af">一条硬约束</text>
  <text x="46" y="590" font-size="11.5" fill="#1e3a8a">① 按事件时间严格有序 与 写入不被阻塞 不可兼得：要严格有序就得缓冲等待，要低延迟就得在读侧兜住</text>
  <text x="46" y="612" font-size="11.5" fill="#1e3a8a">② 常见组合：复合排序键 + 读侧归并 + 水位线；游标的前提是排序键唯一，乱序额外要求它对齐读序</text>
</svg>
