<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="650" fill="#ffffff"/>
  <defs>
    <marker id="vp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">两种近似索引的空间划分：分桶扫几桶 vs 分层逐级下落</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">IVF 把空间切成桶，HNSW 把可达路径铺成多层图；两者都是拿召回率换延迟（形态示意）</text>

  <rect x="30" y="78" width="460" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="31" y="79" width="458" height="32" rx="9" fill="#e2e8f0"/>
  <text x="46" y="101" font-size="14" font-weight="bold" fill="#0f172a">A 聚簇倒排（IVF）：先把空间切成桶</text>

  <ellipse cx="145" cy="175" rx="88" ry="62" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <ellipse cx="345" cy="330" rx="88" ry="62" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <ellipse cx="335" cy="150" rx="78" ry="58" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <ellipse cx="150" cy="330" rx="80" ry="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>

  <circle cx="110" cy="150" r="3.5" fill="#94a3b8"/>
  <circle cx="150" cy="190" r="3.5" fill="#94a3b8"/>
  <circle cx="185" cy="155" r="3.5" fill="#94a3b8"/>
  <circle cx="120" cy="210" r="3.5" fill="#94a3b8"/>
  <circle cx="305" cy="130" r="3.5" fill="#94a3b8"/>
  <circle cx="350" cy="165" r="3.5" fill="#94a3b8"/>
  <circle cx="375" cy="120" r="3.5" fill="#94a3b8"/>
  <circle cx="320" cy="180" r="3.5" fill="#94a3b8"/>
  <circle cx="115" cy="320" r="3.5" fill="#94a3b8"/>
  <circle cx="165" cy="355" r="3.5" fill="#94a3b8"/>
  <circle cx="190" cy="310" r="3.5" fill="#94a3b8"/>
  <circle cx="125" cy="365" r="3.5" fill="#94a3b8"/>
  <circle cx="310" cy="320" r="3.5" fill="#94a3b8"/>
  <circle cx="360" cy="355" r="3.5" fill="#94a3b8"/>
  <circle cx="385" cy="310" r="3.5" fill="#94a3b8"/>
  <circle cx="330" cy="370" r="3.5" fill="#94a3b8"/>

  <path d="M 245 245 L 335 150" stroke="#2563eb" stroke-width="1.5" marker-end="url(#vp)"/>
  <path d="M 245 245 L 150 330" stroke="#2563eb" stroke-width="1.5" marker-end="url(#vp)"/>
  <path d="M 245 232 L 258 245 L 245 258 L 232 245 Z" fill="#dc2626"/>
  <text x="262" y="240" font-size="11.5" fill="#b91c1c">查询</text>
  <path d="M 286 270 L 292 276" stroke="#dc2626" stroke-width="2"/>
  <path d="M 294 278 L 300 284" stroke="#dc2626" stroke-width="2"/>
  <path d="M 300 270 L 294 276" stroke="#dc2626" stroke-width="2"/>
  <path d="M 292 278 L 286 284" stroke="#dc2626" stroke-width="2"/>
  <text x="306" y="281" font-size="11.5" fill="#b91c1c">边界 / 未扫桶里的近邻会被漏</text>

  <text x="46" y="405" font-size="12" fill="#334155">查询只扫离它最近的若干桶（旋钮：扫几个桶）</text>
  <text x="46" y="425" font-size="12" fill="#b91c1c">桶边界上的近邻可能直接被漏掉 → 调大扫描数来补</text>
  <text x="46" y="445" font-size="12" fill="#334155">每桶向量数可控 → 构建快、内存可控，常与量化叠加</text>

  <rect x="510" y="78" width="460" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="511" y="79" width="458" height="32" rx="9" fill="#e2e8f0"/>
  <text x="526" y="101" font-size="14" font-weight="bold" fill="#0f172a">B 分层图（HNSW）：上层长跳、下层精找</text>

  <text x="526" y="132" font-size="12" fill="#334155">第 2 层 稀疏：只做长跳</text>
  <path d="M 620 155 L 850 155" stroke="#2563eb" stroke-width="2.4" marker-end="url(#vp)"/>
  <path d="M 850 155 L 800 240" stroke="#2563eb" stroke-width="2.4" marker-end="url(#vp)"/>
  <text x="526" y="218" font-size="12" fill="#334155">第 1 层 中等：缩小范围</text>
  <path d="M 580 240 L 700 240" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 700 240 L 800 240" stroke="#2563eb" stroke-width="2.4" marker-end="url(#vp)"/>
  <path d="M 800 240 L 900 240" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="526" y="303" font-size="12" fill="#334155">第 0 层 稠密：精确近邻</text>
  <path d="M 800 240 L 740 325" stroke="#2563eb" stroke-width="2.4" marker-end="url(#vp)"/>
  <path d="M 560 325 L 620 325 L 680 325 L 740 325 L 800 325 L 860 325 L 920 325" stroke="#94a3b8" stroke-width="1.5"/>

  <circle cx="620" cy="155" r="8" fill="#1d4ed8"/>
  <circle cx="850" cy="155" r="8" fill="#60a5fa"/>
  <circle cx="580" cy="240" r="8" fill="#93c5fd"/>
  <circle cx="700" cy="240" r="8" fill="#93c5fd"/>
  <circle cx="800" cy="240" r="8" fill="#2563eb"/>
  <circle cx="900" cy="240" r="8" fill="#93c5fd"/>
  <circle cx="560" cy="325" r="8" fill="#cbd5e1"/>
  <circle cx="620" cy="325" r="8" fill="#cbd5e1"/>
  <circle cx="680" cy="325" r="8" fill="#cbd5e1"/>
  <circle cx="740" cy="325" r="9" fill="#dc2626"/>
  <circle cx="800" cy="325" r="8" fill="#cbd5e1"/>
  <circle cx="860" cy="325" r="8" fill="#cbd5e1"/>
  <circle cx="920" cy="325" r="8" fill="#cbd5e1"/>
  <text x="600" y="182" font-size="11" fill="#1d4ed8">入口</text>
  <text x="712" y="350" font-size="11" fill="#b91c1c">命中近邻</text>

  <text x="526" y="392" font-size="12" fill="#334155">入口在顶层，贪心找最近点，逐层下落收敛</text>
  <text x="526" y="414" font-size="12" fill="#334155">召回高、延迟低，是当前主流</text>
  <text x="526" y="436" font-size="12" fill="#b91c1c">内存最贵：每个向量要存多层邻居；删除要重连</text>

  <rect x="30" y="472" width="940" height="150" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="500" font-size="13" font-weight="bold" fill="#1e40af">判据：先排序「召回率 / 延迟 / 内存」哪个是硬约束</text>
  <text x="46" y="530" font-size="12" fill="#1e3a8a">召回 + 延迟最要紧 → 图（HNSW）类，代价是内存</text>
  <text x="46" y="556" font-size="12" fill="#1e3a8a">内存最要紧 → 量化 + 倒排，代价是精度</text>
  <text x="46" y="582" font-size="12" fill="#1e3a8a">规模大到内存装不下 → 磁盘路线，代价是延迟高一个量级</text>
  <text x="46" y="608" font-size="12" fill="#b91c1c">⚠ 索引结构本身也占内存：图类的邻居表要另算一份</text>
</svg>
