<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" width="1000" height="840" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="840" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">检索与分析选型：三条判据开门，再按起点资产分派</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">先问主查询长什么样，再问手里已经有什么；改现有集群永远比引进新组件便宜</text>

  <rect x="30" y="72" width="940" height="176" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="92" font-size="13" font-weight="bold" fill="#0f172a">第一道门 · 三条判据按顺序问</text>

  <rect x="44" y="100" width="292" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="54" y="118" font-size="10" font-weight="bold" fill="#1e3a8a">① 要不要分词与相关度排序</text>
  <text x="54" y="134" font-size="9" fill="#1d4ed8">是 → 检索族（倒排）</text>

  <rect x="354" y="100" width="292" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="364" y="118" font-size="10" font-weight="bold" fill="#1e3a8a">② 要不要任意条件组合过滤</text>
  <text x="364" y="134" font-size="9" fill="#1d4ed8">是 → 倒排天然做集合求交并</text>

  <rect x="664" y="100" width="292" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="674" y="118" font-size="10" font-weight="bold" fill="#1e3a8a">③ 要不要大宽表聚合与高压缩</text>
  <text x="674" y="134" font-size="9" fill="#1d4ed8">是 → 分析族（列存）</text>

  <rect x="44" y="156" width="904" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="56" y="176" font-size="10" font-weight="bold" fill="#991b1b">① 与 ③ 同时为「是」→ 两套并存 + 一份权威源</text>
  <text x="56" y="194" font-size="9" fill="#991b1b">同一份数据的两种访问姿势无法用一种物理结构同时最优化，这就是这个目录需要两套存储的最常见原因</text>

  <rect x="44" y="210" width="904" height="30" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/>
  <text x="56" y="229" font-size="9.5" font-weight="bold" fill="#92400e">三条判据问完才轮到候选产品；第五个数（索引膨胀率）最容易漏，必须自己 POC</text>

  <rect x="30" y="256" width="460" height="332" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="276" font-size="12" font-weight="bold" fill="#1e3a8a">检索族四路（第三节）</text>

  <rect x="44" y="286" width="432" height="68" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="52" y="302" font-size="10" font-weight="bold" fill="#1e3a8a">通用分布式检索：ES / OpenSearch 一系</text>
  <text x="52" y="318" font-size="9" fill="#1d4ed8">强项：全文 + 任意条件组合 + 聚合三件在一套里，生态最厚</text>
  <text x="52" y="332" font-size="9" fill="#1d4ed8">代价：写入与存储开销大、近实时、无跨文档事务、深翻页有上限</text>

  <rect x="44" y="362" width="432" height="68" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="52" y="378" font-size="10" font-weight="bold" fill="#0f172a">传统 Java 系：Solr 一类</text>
  <text x="52" y="394" font-size="9" fill="#334155">强项：Schema 更显式、分面检索成熟、与既有 Java 栈贴合</text>
  <text x="52" y="408" font-size="9" fill="#334155">代价：生态与人才相对薄，UI / 告警 / 插件都要自己凑</text>

  <rect x="44" y="438" width="432" height="68" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="52" y="454" font-size="10" font-weight="bold" fill="#0f172a">轻量即开即用：Meilisearch / Typesense</text>
  <text x="52" y="470" font-size="9" fill="#334155">强项：上手快、默认体验好（错别字容忍、排序直观）、资源占用小</text>
  <text x="52" y="484" font-size="9" fill="#334155">代价：规模上限、可调性与聚合能力受限；本仓未实测</text>

  <rect x="44" y="514" width="432" height="68" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="52" y="530" font-size="10" font-weight="bold" fill="#14532d">⭐ 替代路线：数据库自带的全文检索</text>
  <text x="52" y="546" font-size="9" fill="#166534">PostgreSQL 全文 + GIN / MySQL 全文索引 / MongoDB 文本索引</text>
  <text x="52" y="560" font-size="9" fill="#166534">检索只是锦上添花、数据本来就在这个库里时，它往往是正解</text>
  <text x="52" y="574" font-size="9" fill="#166534">要打分、要高亮、要自由筛选、要独立扩缩容才上独立倒排集群</text>

  <rect x="510" y="256" width="460" height="332" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="524" y="276" font-size="12" font-weight="bold" fill="#1e3a8a">分析族四路（第四节）</text>

  <rect x="524" y="286" width="432" height="68" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="532" y="302" font-size="10" font-weight="bold" fill="#1e3a8a">单机起步的列存：ClickHouse 一类</text>
  <text x="532" y="318" font-size="9" fill="#1d4ed8">强项：大宽表聚合与扫描快、单位成本低、SQL 心智负担小</text>
  <text x="532" y="332" font-size="9" fill="#1d4ed8">代价：不适合行级高频更新与高并发点查，检索界面要自建</text>

  <rect x="524" y="362" width="432" height="68" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="532" y="378" font-size="10" font-weight="bold" fill="#0f172a">MPP / 交互式分析：Doris、StarRocks 一类</text>
  <text x="532" y="394" font-size="9" fill="#334155">强项：更早面对并发与多表关联，物化视图把高频报表的代价前置</text>
  <text x="532" y="408" font-size="9" fill="#334155">代价：FE / BE 角色划分组件更多，升级路径要提前评估；本仓未实测</text>

  <rect x="524" y="438" width="432" height="68" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="532" y="454" font-size="10" font-weight="bold" fill="#0f172a">实时 OLAP 与流式摄取：Druid / Pinot 一类</text>
  <text x="532" y="470" font-size="9" fill="#334155">强项：持续摄入 + 秒级查询窗口、时间分段利于裁剪、查询隔离设计早</text>
  <text x="532" y="484" font-size="9" fill="#334155">代价：模型约束强、ad-hoc 灵活度不如 SQL 一族、运维门槛高</text>

  <rect x="524" y="514" width="432" height="68" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="532" y="530" font-size="10" font-weight="bold" fill="#0f172a">湖上分析：Iceberg / Hudi / Paimon 表格式</text>
  <text x="532" y="546" font-size="9" fill="#334155">强项：同一份数据被多个引擎复用，存储成本外移</text>
  <text x="532" y="560" font-size="9" fill="#334155">代价：schema 演进、小文件治理与一致性都变成自己的工程问题</text>
  <text x="532" y="574" font-size="9" fill="#334155">⚠ 本仓该目录只有占位导读，只给方向不给判据细节</text>

  <rect x="30" y="596" width="940" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="616" font-size="12" font-weight="bold" fill="#0f172a">按起点资产给五条决策线（第八节）：各写第一动作</text>
  <text x="44" y="636" font-size="9.5" fill="#334155">A · 已有 MySQL / MongoDB 的站内搜索 → 先把索引建对、改掉不走索引的写法，再用三条判据决定要不要上倒排集群</text>
  <text x="44" y="654" font-size="9.5" fill="#334155">B · 已经在用 ES → 同族内先收：砍字段索引、按需关 doc_values、按时间分索引 + 生命周期分层</text>
  <text x="44" y="672" font-size="9.5" fill="#334155">C · 已经在用 ClickHouse → 要全文别指望列存的可选倒排追上专用检索；并发与 JOIN 上来了才评估 MPP 一族</text>
  <text x="44" y="690" font-size="9.5" fill="#334155">D · 从零开始 → 只问一句：主查询是「找记录」还是「算结论」；两者都是就两套并存 + 一份权威源</text>
  <text x="44" y="708" font-size="9.5" fill="#334155">E · 想做日志栈 → 回到第五节的三种存储哲学，再看可观测性选型篇的整栈组合</text>
  <text x="44" y="728" font-size="9" fill="#64748b">⚠ 常见错法：因为「搜索慢」就直接买一个检索集群 —— 慢的原因经常是索引与写法</text>

  <rect x="30" y="754" width="940" height="64" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="772" font-size="9.5" fill="#334155">⭐ 顺序必须是「先定逐条可追溯要求 → 再定索引哲学 → 最后才选产品」，反过来一定返工</text>
  <text x="44" y="790" font-size="9.5" fill="#334155">⚠ 第九节：这两族都是要有运维主人才转得动的重资产 —— 没有 owner 就先别上，宁可先用托管把运维面外包</text>
  <text x="44" y="808" font-size="9.5" fill="#334155">上了之后把退路当指标选：格式能不能导出、接口有没有通用协议、索引与表能否从权威源整体重建</text>
</svg>
