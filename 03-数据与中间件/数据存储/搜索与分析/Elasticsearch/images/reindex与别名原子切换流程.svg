<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">改 mapping / 改分片数的标准路线：reindex 七步 + _aliases 原子切换</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">目标：切换瞬间不出现「写进旧索引 + 新索引没别名」的窗口</text>

  <rect x="30" y="78" width="580" height="62" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="46" y="102" font-size="12.5" font-weight="bold" fill="#1e3a8a">1 · 建新索引</text>
  <text x="46" y="126" font-size="11.5" fill="#334155">正确的分片数 + 固化 mapping + refresh_interval: -1 + 副本先设 0</text>

  <line x1="320" y1="140" x2="320" y2="154" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="30" y="156" width="580" height="62" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="46" y="180" font-size="12.5" font-weight="bold" fill="#1e3a8a">2 · 全量 reindex（异步）</text>
  <text x="46" y="204" font-size="11.5" fill="#334155">POST _reindex?wait_for_completion=false&amp;slices=auto 拿 task id，GET _tasks/&lt;id&gt; 轮询进度</text>

  <line x1="320" y1="218" x2="320" y2="232" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="30" y="234" width="580" height="62" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
  <text x="46" y="258" font-size="12.5" font-weight="bold" fill="#7c2d12">3 · 追增量 reindex</text>
  <text x="46" y="282" font-size="11.5" fill="#334155">记录切换时刻 T（或短暂停写），按业务时间 &gt;= T - overlap 重跑，同 _id 天然覆盖</text>

  <line x1="320" y1="296" x2="320" y2="310" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="30" y="312" width="580" height="62" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <text x="46" y="336" font-size="12.5" font-weight="bold" fill="#14532d">4 · 校验</text>
  <text x="46" y="360" font-size="11.5" fill="#334155">新旧 _count · 关键字段非空数 · 抽样比对若干 _id 的 _source</text>

  <line x1="320" y1="374" x2="320" y2="388" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="30" y="390" width="580" height="62" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <text x="46" y="414" font-size="12.5" font-weight="bold" fill="#14532d">5 · 恢复写入性能配置</text>
  <text x="46" y="438" font-size="11.5" fill="#334155">恢复副本数与 refresh_interval，等待分片 green</text>

  <line x1="320" y1="452" x2="320" y2="466" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="30" y="468" width="580" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="46" y="492" font-size="12.5" font-weight="bold" fill="#1e3a8a">6 · 原子切换别名 + 旧索引兜底</text>
  <text x="46" y="516" font-size="11.5" fill="#334155">_aliases 一次请求切 logs → logs_v2；旧索引置 index.blocks.write: true 防硬编码写入</text>

  <line x1="320" y1="530" x2="320" y2="544" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="30" y="546" width="580" height="62" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="46" y="570" font-size="12.5" font-weight="bold" fill="#334155">7 · 旧索引收尾</text>
  <text x="46" y="594" font-size="11.5" fill="#334155">保留观察期后删除，或直接交给 ILM 转冷</text>

  <rect x="640" y="78" width="330" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="656" y="104" font-size="13" font-weight="bold" fill="#991b1b">错误做法</text>
  <text x="656" y="130" font-size="11.5" fill="#991b1b">先 DELETE alias 再 PUT alias：</text>
  <text x="656" y="152" font-size="11.5" fill="#991b1b">两步之间写请求会失败，</text>
  <text x="656" y="174" font-size="11.5" fill="#991b1b">或落到已被废弃的索引上</text>

  <rect x="640" y="212" width="330" height="156" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="656" y="238" font-size="13" font-weight="bold" fill="#14532d">正确姿势：一次集群状态发布</text>
  <text x="656" y="264" font-size="11.5" fill="#14532d">同一个 _aliases 请求里的 actions</text>
  <text x="656" y="286" font-size="11.5" fill="#14532d">是原子生效的：</text>
  <text x="656" y="312" font-size="11.5" fill="#334155">remove logs_v1 → logs</text>
  <text x="656" y="334" font-size="11.5" fill="#334155">add logs_v2 → logs / logs_write</text>
  <text x="656" y="356" font-size="11.5" fill="#334155">（is_write_index: true）</text>

  <rect x="640" y="382" width="330" height="150" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="656" y="408" font-size="13" font-weight="bold" fill="#7c2d12">⚠️ 别名切换只解决「读入口」</text>
  <text x="656" y="434" font-size="11.5" fill="#7c2d12">写入走 rollover 别名时，必须靠</text>
  <text x="656" y="456" font-size="11.5" fill="#7c2d12">is_write_index 指定唯一写索引；</text>
  <text x="656" y="478" font-size="11.5" fill="#7c2d12">一个别名匹配两个索引且没标 write</text>
  <text x="656" y="500" font-size="11.5" fill="#7c2d12">index，写入会直接报错</text>
  <text x="656" y="522" font-size="11.5" fill="#7c2d12">（这是 feature，不是 bug）</text>

  <rect x="640" y="546" width="330" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="656" y="572" font-size="12.5" font-weight="bold" fill="#0f172a">第 2 步的坑</text>
  <text x="656" y="596" font-size="11" fill="#334155">"conflicts": "proceed" 容忍并发更新，</text>
  <text x="656" y="616" font-size="11" fill="#334155">但会跳过冲突文档 —— 所以必须有第 3 步</text>
</svg>
