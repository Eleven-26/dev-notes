<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">from/size 深分页的数据流转：拿 10 条结果，汇总 50050 条</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">示例来自第一节：from=10000, size=10 且 5 个分片，每个分片都被要求取出 from + size = 10010 条</text>

  <rect x="390" y="78" width="220" height="44" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="500" y="105" text-anchor="middle" font-size="12.5" fill="#334155">{ "from": 10000, "size": 10 }</text>

  <line x1="500" y1="122" x2="500" y2="146" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="290" y="148" width="420" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="500" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">协调节点</text>
  <text x="500" y="190" text-anchor="middle" font-size="11.5" fill="#1e3a8a">必须从每个分片取出 from + size 条，再汇总排序截取</text>

  <line x1="420" y1="202" x2="110" y2="252" stroke="#334155" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="460" y1="202" x2="295" y2="252" stroke="#334155" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="500" y1="202" x2="500" y2="252" stroke="#334155" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="540" y1="202" x2="705" y2="252" stroke="#334155" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="580" y1="202" x2="890" y2="252" stroke="#334155" stroke-width="1.4" marker-end="url(#arw)"/>

  <rect x="20" y="254" width="170" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="105" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">分片 P0</text>
  <text x="105" y="300" text-anchor="middle" font-size="11.5" fill="#14532d">取出前 10010 条</text>

  <rect x="205" y="254" width="170" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="290" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">分片 P1</text>
  <text x="290" y="300" text-anchor="middle" font-size="11.5" fill="#14532d">取出前 10010 条</text>

  <rect x="390" y="254" width="170" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="475" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">分片 P2</text>
  <text x="475" y="300" text-anchor="middle" font-size="11.5" fill="#14532d">取出前 10010 条</text>

  <rect x="575" y="254" width="170" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="660" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">分片 P3</text>
  <text x="660" y="300" text-anchor="middle" font-size="11.5" fill="#14532d">取出前 10010 条</text>

  <rect x="760" y="254" width="170" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="845" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">分片 P4</text>
  <text x="845" y="300" text-anchor="middle" font-size="11.5" fill="#14532d">取出前 10010 条</text>

  <line x1="105" y1="320" x2="415" y2="366" stroke="#334155" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="290" y1="320" x2="455" y2="366" stroke="#334155" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="475" y1="320" x2="495" y2="366" stroke="#334155" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="660" y1="320" x2="535" y2="366" stroke="#334155" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="845" y1="320" x2="575" y2="366" stroke="#334155" stroke-width="1.4" marker-end="url(#arw)"/>

  <rect x="290" y="368" width="420" height="54" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="500" y="390" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">汇总 5 × 10010 = 50050 条再排序</text>
  <text x="500" y="410" text-anchor="middle" font-size="11.5" fill="#7c2d12">内存与耗时随 from 急剧增长</text>

  <line x1="420" y1="422" x2="270" y2="456" stroke="#334155" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="580" y1="422" x2="730" y2="456" stroke="#334155" stroke-width="1.4" marker-end="url(#arw)"/>

  <rect x="60" y="458" width="400" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="260" y="484" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">截出第 10001–10010 条返回</text>
  <text x="260" y="506" text-anchor="middle" font-size="11.5" fill="#14532d">这 10 条才是业务真正要看的数据</text>

  <rect x="540" y="458" width="400" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="740" y="484" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">前 10000 条是纯白算的</text>
  <text x="740" y="506" text-anchor="middle" font-size="11.5" fill="#991b1b">每个分片为它们维护堆，协调节点排完就丢</text>

  <rect x="20" y="550" width="940" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="578" font-size="14" font-weight="bold" fill="#0f172a">护栏与出路（第一节的判据）</text>
  <text x="40" y="604" font-size="12" fill="#334155">index.max_result_window 默认限制 from + size ≤ 10000；search_after / PIT 没有 from，不受这个限制</text>
  <text x="40" y="626" font-size="12" fill="#334155">from/size 每页都是最新视图 —— 中途有写入就会重复 / 漏；要一致性视图得换 scroll 或 PIT</text>
  <text x="40" y="648" font-size="12" fill="#64748b">真实需求若是「看某个时间段的全部数据」，正解是缩小查询范围 + 按时间落到不同索引，而不是换游标方案</text>
</svg>
