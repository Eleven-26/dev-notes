<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">搜索引擎的四个模块与协作流程</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">原始文本先被切成有意义的分词、组织成倒排索引，搜索模块才能按查询条件高速返回最相关结果</text>

  <rect x="25" y="90" width="140" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="95" y="118" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">原始数据</text>
  <text x="95" y="144" text-anchor="middle" font-size="11.5" fill="#64748b">日志分析 · 文献检索</text>
  <text x="95" y="164" text-anchor="middle" font-size="11.5" fill="#64748b">IoT 监控 · BI 大屏</text>

  <line x1="165" y1="140" x2="203" y2="140" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="205" y="90" width="170" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="290" y="118" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">数据采集模块</text>
  <text x="290" y="146" text-anchor="middle" font-size="11.5" fill="#1e3a8a">负责采集数据</text>

  <line x1="375" y1="140" x2="413" y2="140" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="415" y="90" width="170" height="100" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="500" y="118" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c2d12">文本分析模块</text>
  <text x="500" y="144" text-anchor="middle" font-size="11.5" fill="#7c2d12">把原始文本切分成</text>
  <text x="500" y="164" text-anchor="middle" font-size="11.5" fill="#7c2d12">有意义的分词，便于搜索</text>

  <line x1="585" y1="140" x2="623" y2="140" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="625" y="90" width="170" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="710" y="118" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">索引存储模块</text>
  <text x="710" y="144" text-anchor="middle" font-size="11.5" fill="#14532d">把数据组建成倒排索引</text>
  <text x="710" y="164" text-anchor="middle" font-size="11.5" fill="#14532d">以实现高速搜索</text>

  <line x1="795" y1="140" x2="833" y2="140" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="835" y="90" width="140" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="905" y="118" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">搜索模块</text>
  <text x="905" y="144" text-anchor="middle" font-size="11.5" fill="#1e3a8a">按用户查询条件</text>
  <text x="905" y="164" text-anchor="middle" font-size="11.5" fill="#1e3a8a">返回最相关结果</text>

  <rect x="835" y="228" width="140" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="905" y="256" text-anchor="middle" font-size="12" fill="#334155">用户查询条件</text>
  <line x1="905" y1="228" x2="905" y2="194" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="25" y="295" width="950" height="145" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="45" y="322" font-size="14" font-weight="bold" fill="#0f172a">本目录用哪些篇承接这四个模块（对应第三节学习路径）</text>
  <text x="45" y="350" font-size="12.5" fill="#334155">数据采集 → ② 写入流程.md（路由 + 主副本同步）　　文本分析 → ① 索引原理.md（分析器）</text>
  <text x="45" y="376" font-size="12.5" fill="#334155">索引存储 → ① 索引原理.md（倒排 + doc_values）与 ⑥ 集群与运维.md（分片与分配）</text>
  <text x="45" y="402" font-size="12.5" fill="#334155">搜索 → ③ 搜索流程与DSL.md，并延伸出 ④ 分页与聚合.md 与 ⑤ 向量与AI搜索.md</text>
  <text x="45" y="428" font-size="12" fill="#64748b">这四路协作的前提是「写少读多、不支持事务、数据量大且响应要快」——1.3 节的选型条件</text>
</svg>
