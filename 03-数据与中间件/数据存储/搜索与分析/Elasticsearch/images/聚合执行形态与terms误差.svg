<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" width="1000" height="810" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="810" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">聚合的执行形态与 terms 的误差来源</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">上半：第三节的 size:0 + by_user(terms) + avg_age(avg) 怎么算；下半：第四节的 doc_count_error_upper_bound 从哪来</text>

  <g transform="translate(20,75)">
    <rect x="0" y="0" width="940" height="235" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="30" font-size="15" font-weight="bold" fill="#0f172a">一、bucket 决定「谁进组」，metric 决定「算什么」：每多一层 bucket 重定一次文档集</text>

    <rect x="20" y="50" width="180" height="72" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <text x="110" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">query 命中文档</text>
    <text x="110" y="102" text-anchor="middle" font-size="11.5" fill="#64748b">聚合在命中文档上做</text>

    <line x1="200" y1="86" x2="232" y2="86" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="234" y="50" width="200" height="72" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
    <text x="334" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">bucket：terms by_user</text>
    <text x="334" y="94" text-anchor="middle" font-size="11.5" fill="#7c2d12">按 userid 分组 · size 10</text>
    <text x="334" y="112" text-anchor="middle" font-size="11.5" fill="#7c2d12">field 必须不分词</text>

    <line x1="434" y1="86" x2="466" y2="86" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="468" y="50" width="200" height="72" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
    <text x="568" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">bucket：nested（若有）</text>
    <text x="568" y="94" text-anchor="middle" font-size="11.5" fill="#7c2d12">doc_count 是子文档条数</text>
    <text x="568" y="112" text-anchor="middle" font-size="11.5" fill="#dc2626">商品数 ≠ 订单数</text>

    <line x1="668" y1="86" x2="700" y2="86" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="702" y="50" width="218" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="811" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">metric：avg_age 等</text>
    <text x="811" y="94" text-anchor="middle" font-size="11.5" fill="#14532d">对每个桶算 avg / sum / max</text>
    <text x="811" y="112" text-anchor="middle" font-size="11.5" fill="#14532d">不改文档集</text>

    <text x="20" y="150" font-size="12" fill="#334155">成本随 bucket 层数增长而不是随文档数增长；父子文档（join field）比 nested 更贵——父子关系靠每个段现场构建的 bitset，</text>
    <text x="20" y="172" font-size="12" fill="#334155">不能用物理相邻访问</text>
    <text x="20" y="200" font-size="12" fill="#334155">"size": 0 只返回聚合结果、不返回命中文档，能显著减少传输量</text>
    <text x="20" y="224" font-size="12" fill="#64748b">减少成本的顺序：先用 query/filter 缩小文档集 → 再考虑 size / shard_size → 最后才想 execution_hint: map 与 eager_global_ordinals</text>
  </g>

  <g transform="translate(20,330)">
    <rect x="0" y="0" width="940" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="30" font-size="15" font-weight="bold" fill="#0f172a">二、terms 的 doc_count_error_upper_bound 从哪来</text>

    <rect x="20" y="50" width="260" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="150" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">分片 P0 / P1 / P2 …</text>
    <text x="150" y="96" text-anchor="middle" font-size="11.5" fill="#14532d">每片只回传本地 top size（实际取 shard_size 条）</text>

    <line x1="280" y1="80" x2="340" y2="80" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="342" y="50" width="260" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="472" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">协调节点按 term 汇总</text>
    <text x="472" y="96" text-anchor="middle" font-size="11.5" fill="#1e3a8a">把各分片回传的桶计数相加</text>

    <line x1="602" y1="80" x2="662" y2="80" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="664" y="50" width="256" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="792" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">全局高频词被静默丢掉</text>
    <text x="792" y="96" text-anchor="middle" font-size="11.5" fill="#991b1b">它恰好在每个分片都进不了本地前 size</text>

    <text x="20" y="140" font-size="12" fill="#334155">doc_count_error_upper_bound = 「各分片第 size + 1 名计数」的最大值 —— 是误差上界，不是实际误差</text>
    <text x="20" y="164" font-size="12" fill="#334155">sum_other_doc_count 不为 0 → 长尾被截断；调大 shard_size 能收敛，代价是分片和协调节点都更贵</text>
    <text x="20" y="192" font-size="12" fill="#dc2626">⚠️ keyword 设了 ignore_above 时，超长值根本没进索引：terms 与 cardinality 都统计不到（表现为「少了几个」，很难查）</text>
    <text x="20" y="220" font-size="12" fill="#334155">cardinality 是 HyperLogLog 近似：precision_threshold（默认 3000）内接近精确，阈值外只保证数量级——计费对账别直接用它</text>
    <text x="20" y="248" font-size="12" fill="#64748b">⭐ 最快自查：terms 默认 size: 10 与同层 cardinality 给出的几千基数放在一起看——「长尾被砍掉了 99%」立刻可见</text>
  </g>

  <g transform="translate(20,620)">
    <rect x="0" y="0" width="940" height="170" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="30" font-size="15" font-weight="bold" fill="#0f172a">三、terms 还是 composite？</text>

    <rect x="20" y="50" width="440" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="240" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">「只要前 10 名」→ terms</text>
    <text x="240" y="98" text-anchor="middle" font-size="11.5" fill="#1e3a8a">按 count 抢 top N，接受 doc_count_error 的可能性</text>

    <rect x="480" y="50" width="440" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="700" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">「遍历所有 term 并拿精确计数」→ composite</text>
    <text x="700" y="98" text-anchor="middle" font-size="11.5" fill="#14532d">按 bucket key 有序逐页翻：请求带 after，响应给 after_key</text>

    <text x="20" y="140" font-size="12" fill="#334155">按 key 归并不存在「各分片抢 top by count」的歧义，所以 composite 没有 doc_count_error；代价是拿不到全局按 count 排序的前 N，也拿不到 bucket 总数</text>
  </g>
</svg>
