<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一条工程主线：写进去 → 查出来 → 翻页统计 → 集群撑住</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">① 索引原理是两条检索线共用的地基；⑤ 向量搜索是把「词项匹配」换成「向量相似」的另一条线，与 ③ 在混合检索处合流</text>

  <rect x="30" y="80" width="940" height="86" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="50" y="108" font-size="14" font-weight="bold" fill="#1e3a8a">① 索引原理.md —— 地基</text>
  <text x="50" y="132" font-size="12" fill="#1e3a8a">倒排索引「词典 + 倒排表」 · 分析器 · 字段类型 · doc_values 与 fielddata</text>
  <text x="50" y="154" font-size="12" fill="#dc2626">不理解倒排与 doc_values 的方向差异，后面所有「为什么慢」都只能死记</text>

  <line x1="180" y1="166" x2="180" y2="196" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="820" y1="166" x2="820" y2="196" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="30" y="198" width="230" height="96" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="145" y="224" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c2d12">② 写入流程.md</text>
  <text x="145" y="248" text-anchor="middle" font-size="11.5" fill="#7c2d12">路由 + 主副本 · translog</text>
  <text x="145" y="268" text-anchor="middle" font-size="11.5" fill="#7c2d12">refresh / flush / merge 代价链</text>
  <text x="145" y="286" text-anchor="middle" font-size="11.5" fill="#7c2d12">删除更新与并发写</text>

  <rect x="290" y="198" width="230" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="405" y="224" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">③ 搜索流程与DSL.md</text>
  <text x="405" y="248" text-anchor="middle" font-size="11.5" fill="#14532d">query-then-fetch 两阶段</text>
  <text x="405" y="268" text-anchor="middle" font-size="11.5" fill="#14532d">match / term / bool · BM25</text>
  <text x="405" y="286" text-anchor="middle" font-size="11.5" fill="#14532d">profile 观测</text>

  <rect x="550" y="198" width="200" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="650" y="224" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">④ 分页与聚合.md</text>
  <text x="650" y="248" text-anchor="middle" font-size="11.5" fill="#14532d">from/size · search_after</text>
  <text x="650" y="268" text-anchor="middle" font-size="11.5" fill="#14532d">scroll · PIT</text>
  <text x="650" y="286" text-anchor="middle" font-size="11.5" fill="#14532d">bucket / metric / nested</text>

  <rect x="780" y="198" width="190" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="875" y="224" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">⑥ 集群与运维.md</text>
  <text x="875" y="248" text-anchor="middle" font-size="11.5" fill="#334155">分片与分配 · 恢复</text>
  <text x="875" y="268" text-anchor="middle" font-size="11.5" fill="#334155">green / yellow / red</text>
  <text x="875" y="286" text-anchor="middle" font-size="11.5" fill="#334155">ILM 索引状态管理</text>

  <line x1="260" y1="246" x2="288" y2="246" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="520" y1="246" x2="548" y2="246" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="750" y1="246" x2="778" y2="246" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="290" y="330" width="230" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="405" y="356" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">⑤ 向量与AI搜索.md</text>
  <text x="405" y="380" text-anchor="middle" font-size="11.5" fill="#1e3a8a">向量索引 · BBQ 量化 · 语义搜索</text>
  <text x="405" y="400" text-anchor="middle" font-size="11.5" fill="#1e3a8a">混合检索与 ③ 合流</text>

  <line x1="405" y1="328" x2="405" y2="296" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="418" y="316" font-size="11" fill="#64748b">另一条检索线</text>

  <rect x="30" y="440" width="940" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="464" font-size="13" font-weight="bold" fill="#0f172a">⑦ 客户端.md（Go / Java 接入） · ⑧ 常见事故.md（事故清单与排查顺序）</text>
  <text x="50" y="488" font-size="12" fill="#64748b">读完主线与地基后接着读：⑦ 的接入与最佳实践、⑧ 的事故清单与排查顺序</text>
</svg>
