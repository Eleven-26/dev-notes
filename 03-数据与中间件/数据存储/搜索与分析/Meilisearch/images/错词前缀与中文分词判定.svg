<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">错词、前缀与中文分词：三条判据决定「搜得到还是搜不到」</text>
  <text x="500" y="56" font-size="13" fill="#64748b" text-anchor="middle">错词按词长分档，前缀只给最后一个词，中文先分词再按词项匹配</text>

  <rect x="30" y="80" width="310" height="400" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" rx="10"/>
  <text x="46" y="106" font-size="14" font-weight="bold" fill="#1e3a8a">错词：按词长分档</text>

  <text x="46" y="138" font-size="12" font-weight="bold" fill="#1e3a8a">词长 4：不容错</text>
  <text x="58" y="160" font-size="11.5" fill="#1e3a8a">Rdie（2 错）→ 0 命中</text>
  <text x="58" y="180" font-size="11.5" fill="#1e3a8a">Javo（1 错）→ 0 命中</text>

  <text x="46" y="212" font-size="12" font-weight="bold" fill="#1e3a8a">词长 5–8：容 1 错</text>
  <text x="58" y="234" font-size="11.5" fill="#1e3a8a">Kafak → 1（Kafka）</text>
  <text x="58" y="254" font-size="11.5" fill="#1e3a8a">Javva → 1（Java）</text>
  <text x="58" y="274" font-size="11.5" fill="#1e3a8a">Kafkkka（7 字 2 错）→ 0</text>

  <text x="46" y="306" font-size="12" font-weight="bold" fill="#1e3a8a">词长 ≥9：容 2 错</text>
  <text x="58" y="328" font-size="11.5" fill="#1e3a8a">Meiliseeearch（13 字）→ 1</text>

  <text x="46" y="362" font-size="11.5" fill="#1e3a8a">阈值来自 settings：</text>
  <text x="58" y="382" font-size="11.5" fill="#1e3a8a">oneTypo=5 / twoTypos=9</text>
  <text x="46" y="418" font-size="11.5" font-weight="bold" fill="#b91c1c">短品牌名拼错一个就搜不到</text>
  <text x="46" y="440" font-size="11" fill="#1e3a8a">这是默认行为，不是 bug</text>

  <rect x="360" y="80" width="300" height="400" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3" rx="10"/>
  <text x="376" y="106" font-size="14" font-weight="bold" fill="#14532d">前缀：只给最后一个词</text>

  <rect x="376" y="124" width="268" height="34" fill="#ffffff" stroke="#16a34a" stroke-width="1" rx="6"/>
  <text x="510" y="146" font-size="11.5" fill="#14532d" text-anchor="middle">搜索 → 1,401</text>
  <rect x="376" y="168" width="268" height="34" fill="#ffffff" stroke="#16a34a" stroke-width="1" rx="6"/>
  <text x="510" y="190" font-size="11.5" fill="#14532d" text-anchor="middle">搜索 引 → 1,401（引 是末词）</text>
  <rect x="376" y="212" width="268" height="34" fill="#ffffff" stroke="#16a34a" stroke-width="1" rx="6"/>
  <text x="510" y="234" font-size="11.5" fill="#14532d" text-anchor="middle">搜索 引擎 → 1,401（引擎 是末词）</text>
  <rect x="376" y="256" width="268" height="34" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="6"/>
  <text x="510" y="278" font-size="11.5" fill="#7f1d1d" text-anchor="middle">引擎 搜 → 1（引擎 必须完整命中）</text>

  <text x="376" y="318" font-size="11.5" fill="#14532d">规则：末词按前缀匹配，</text>
  <text x="376" y="340" font-size="11.5" fill="#14532d">前面的词必须完整命中。</text>
  <text x="376" y="372" font-size="11.5" fill="#14532d">「引擎」只在 1 条文档里，</text>
  <text x="376" y="394" font-size="11.5" fill="#14532d">所以「引擎 搜」只剩 1 条。</text>
  <text x="376" y="430" font-size="11.5" font-weight="bold" fill="#14532d">把可能只输一半的词放最后</text>
  <text x="376" y="452" font-size="11" fill="#14532d">搜索框本身就是这个顺序</text>

  <rect x="680" y="80" width="290" height="400" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3" rx="10"/>
  <text x="696" y="106" font-size="14" font-weight="bold" fill="#7c2d12">中文：charabia 按词切</text>

  <text x="696" y="138" font-size="11.5" fill="#7c2d12">搜 → 2（搜索引擎、搜索）</text>
  <text x="696" y="160" font-size="11.5" fill="#7c2d12">索 → 1（数据库索引）</text>
  <text x="696" y="182" font-size="11.5" fill="#7c2d12">对象存 → 1（对象存储，前缀）</text>
  <text x="696" y="204" font-size="11.5" fill="#7c2d12">对象存储 → 1（完整词）</text>

  <text x="696" y="238" font-size="12" font-weight="bold" fill="#7c2d12">分词后的词项示意</text>
  <rect x="696" y="250" width="52" height="30" fill="#ffffff" stroke="#ea580c" stroke-width="1" rx="5"/>
  <text x="722" y="270" font-size="11" fill="#7c2d12" text-anchor="middle">搜索</text>
  <rect x="754" y="250" width="52" height="30" fill="#ffffff" stroke="#ea580c" stroke-width="1" rx="5"/>
  <text x="780" y="270" font-size="11" fill="#7c2d12" text-anchor="middle">引擎</text>
  <rect x="812" y="250" width="66" height="30" fill="#ffffff" stroke="#ea580c" stroke-width="1" rx="5"/>
  <text x="845" y="270" font-size="11" fill="#7c2d12" text-anchor="middle">数据库</text>
  <rect x="884" y="250" width="52" height="30" fill="#ffffff" stroke="#ea580c" stroke-width="1" rx="5"/>
  <text x="910" y="270" font-size="11" fill="#7c2d12" text-anchor="middle">索引</text>
  <rect x="696" y="290" width="52" height="30" fill="#ffffff" stroke="#ea580c" stroke-width="1" rx="5"/>
  <text x="722" y="310" font-size="11" fill="#7c2d12" text-anchor="middle">对象</text>
  <rect x="754" y="290" width="52" height="30" fill="#ffffff" stroke="#ea580c" stroke-width="1" rx="5"/>
  <text x="780" y="310" font-size="11" fill="#7c2d12" text-anchor="middle">存储</text>

  <text x="696" y="352" font-size="11.5" fill="#7c2d12">单字只命中以该字开头的词，</text>
  <text x="696" y="374" font-size="11.5" fill="#7c2d12">不是逐字包含。</text>
  <text x="696" y="406" font-size="11.5" fill="#7c2d12">没有 ES 的 analyzer 链；</text>
  <text x="696" y="428" font-size="11.5" fill="#7c2d12">同义词走 synonyms，停用词走 stopWords</text>
  <text x="696" y="454" font-size="11" fill="#7c2d12">细粒度切词要改 dictionary 配置</text>

  <rect x="30" y="500" width="940" height="76" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="46" y="524" font-size="11.5" font-weight="bold" fill="#0f172a">三条判据合起来看：能不能搜到 = 词长是否达到容错阈值 × 查询词位置 × 分词后的词项是否以该前缀开头</text>
  <text x="46" y="548" font-size="11.5" fill="#334155">所有读数来自 typo 索引（4 条）与 zh 索引（5 条）的单变量实验；换数据与语言，阈值效应会变</text>

</svg>
