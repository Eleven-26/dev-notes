<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">一个索引 = 一个 data.mdb，里面开 16 个命名库</text>
  <text x="500" y="56" font-size="13" fill="#64748b" text-anchor="middle">原文只占其中一个库，其余 15 个都是索引，全部按内部文档号对齐</text>

  <rect x="20" y="82" width="180" height="468" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="32" y="106" font-size="14" font-weight="bold" fill="#0f172a">写入：2 条样本</text>

  <rect x="32" y="124" width="156" height="86" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" rx="8"/>
  <text x="42" y="146" font-size="11" font-weight="bold" fill="#1e3a8a">id=1 张三</text>
  <text x="42" y="165" font-size="10" fill="#1e3a8a">age=18</text>
  <text x="42" y="184" font-size="10" fill="#1e3a8a">phone 13700000000</text>
  <text x="42" y="203" font-size="10" fill="#1e3a8a">hobby 打游戏，爬山</text>

  <rect x="32" y="220" width="156" height="86" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" rx="8"/>
  <text x="42" y="242" font-size="11" font-weight="bold" fill="#1e3a8a">id=2 李四</text>
  <text x="42" y="261" font-size="10" fill="#1e3a8a">age=19</text>
  <text x="42" y="280" font-size="10" fill="#1e3a8a">phone 13800000000</text>
  <text x="42" y="299" font-size="10" fill="#1e3a8a">hobby 唱、跳、rap、打蓝球</text>

  <text x="32" y="332" font-size="10.5" fill="#334155">task 0 建索引</text>
  <text x="32" y="352" font-size="10.5" fill="#334155">task 1 写文档</text>
  <text x="32" y="372" font-size="10.5" fill="#334155">task 2 改设置（PATCH）</text>
  <text x="32" y="402" font-size="10.5" font-weight="bold" fill="#0f172a">一条任务 = 一个写事务</text>
  <text x="32" y="422" font-size="10.5" fill="#334155">16 个库要么全生效</text>
  <text x="32" y="440" font-size="10.5" fill="#334155">要么全不生效</text>
  <text x="32" y="470" font-size="10.5" fill="#334155">task 1 duration</text>
  <text x="32" y="488" font-size="10" fill="#334155">PT0.409930127S</text>
  <text x="32" y="510" font-size="10" fill="#334155">received=2 indexed=2</text>

  <rect x="214" y="228" width="92" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="260" y="243" font-size="10" fill="#334155" text-anchor="middle">主键 → 文档号</text>
  <line x1="202" y1="258" x2="304" y2="258" stroke="#ea580c" stroke-width="1.8" marker-end="url(#m1)"/>

  <rect x="310" y="82" width="440" height="468" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="326" y="106" font-size="14" font-weight="bold" fill="#0f172a">data.mdb 110592 B：16 个命名库</text>

  <rect x="322" y="124" width="200" height="34" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.1" rx="6"/>
  <text x="422" y="146" font-size="10" fill="#334155" text-anchor="middle">main</text>
  <rect x="532" y="124" width="200" height="34" fill="#ffedd5" stroke="#ea580c" stroke-width="1.1" rx="6"/>
  <text x="632" y="146" font-size="10" fill="#7c2d12" text-anchor="middle">externalDocumentsIds</text>

  <rect x="322" y="168" width="200" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1" rx="6"/>
  <text x="422" y="190" font-size="10" fill="#14532d" text-anchor="middle">documents</text>
  <rect x="532" y="168" width="200" height="34" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.1" rx="6"/>
  <text x="632" y="190" font-size="10" fill="#334155" text-anchor="middle">celluliteMetadata</text>

  <rect x="322" y="212" width="200" height="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.1" rx="6"/>
  <text x="422" y="234" font-size="10" fill="#4c1d95" text-anchor="middle">wordDocids</text>
  <rect x="532" y="212" width="200" height="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.1" rx="6"/>
  <text x="632" y="234" font-size="10" fill="#4c1d95" text-anchor="middle">wordPositionDocids</text>

  <rect x="322" y="256" width="200" height="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.1" rx="6"/>
  <text x="422" y="278" font-size="10" fill="#4c1d95" text-anchor="middle">wordPairProximityDocids</text>
  <rect x="532" y="256" width="200" height="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.1" rx="6"/>
  <text x="632" y="278" font-size="10" fill="#4c1d95" text-anchor="middle">wordFidDocids</text>

  <rect x="322" y="300" width="200" height="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.1" rx="6"/>
  <text x="422" y="322" font-size="10" fill="#4c1d95" text-anchor="middle">fieldIdWordCountDocids</text>
  <rect x="532" y="300" width="200" height="34" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1" rx="6"/>
  <text x="632" y="322" font-size="10" fill="#1e3a8a" text-anchor="middle">facetIdStringDocids</text>

  <rect x="322" y="344" width="200" height="34" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1" rx="6"/>
  <text x="422" y="366" font-size="10" fill="#1e3a8a" text-anchor="middle">facetIdStringFst</text>
  <rect x="532" y="344" width="200" height="34" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1" rx="6"/>
  <text x="632" y="366" font-size="10" fill="#1e3a8a" text-anchor="middle">facetIdNormalizedStringStrings</text>

  <rect x="322" y="388" width="200" height="34" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1" rx="6"/>
  <text x="422" y="410" font-size="10" fill="#1e3a8a" text-anchor="middle">facetIdExistsDocids</text>
  <rect x="532" y="388" width="200" height="34" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1" rx="6"/>
  <text x="632" y="410" font-size="10" fill="#1e3a8a" text-anchor="middle">facetIdF64Docids</text>

  <rect x="322" y="432" width="200" height="34" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1" rx="6"/>
  <text x="422" y="454" font-size="10" fill="#1e3a8a" text-anchor="middle">fieldIdDocidFacetF64S</text>
  <rect x="532" y="432" width="200" height="34" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1" rx="6"/>
  <text x="632" y="454" font-size="10" fill="#1e3a8a" text-anchor="middle">fieldIdDocidFacetStrings</text>

  <rect x="322" y="482" width="12" height="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="340" y="492" font-size="11" fill="#334155">元数据</text>
  <rect x="392" y="482" width="12" height="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="410" y="492" font-size="11" fill="#7c2d12">主键映射</text>
  <rect x="472" y="482" width="12" height="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="490" y="492" font-size="11" fill="#14532d">原文</text>
  <rect x="530" y="482" width="12" height="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="548" y="492" font-size="11" fill="#4c1d95">词与位置</text>
  <rect x="610" y="482" width="12" height="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="628" y="492" font-size="11" fill="#1e3a8a">分面</text>

  <text x="322" y="520" font-size="10.5" fill="#334155">usedIndexSize 65536 B = 16 页；indexSize 110592 B = 27 页</text>
  <text x="322" y="540" font-size="10.5" fill="#b91c1c">16 个库在 2 条数据时全都只读 4096 B（页粒度，看不出谁大）</text>

  <line x1="754" y1="170" x2="786" y2="170" stroke="#64748b" stroke-width="1.6" marker-end="url(#m2)"/>
  <line x1="754" y1="274" x2="786" y2="274" stroke="#64748b" stroke-width="1.6" marker-end="url(#m2)"/>
  <line x1="754" y1="378" x2="786" y2="378" stroke="#64748b" stroke-width="1.6" marker-end="url(#m2)"/>

  <rect x="790" y="82" width="190" height="468" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="802" y="106" font-size="14" font-weight="bold" fill="#0f172a">查询读哪个库</text>

  <rect x="800" y="124" width="170" height="92" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" rx="8"/>
  <text x="810" y="146" font-size="11" font-weight="bold" fill="#4c1d95">q=爬山 / q=张三</text>
  <text x="810" y="166" font-size="10" fill="#4c1d95">word* 三库</text>
  <text x="810" y="186" font-size="10" fill="#4c1d95">1 条，得分 0.9242</text>
  <text x="810" y="206" font-size="10" fill="#4c1d95">q=张三 得分 1.0</text>

  <rect x="800" y="228" width="170" height="92" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" rx="8"/>
  <text x="810" y="250" font-size="11" font-weight="bold" fill="#1e3a8a">filter phone=…</text>
  <text x="810" y="270" font-size="10" fill="#1e3a8a">读字符串分面库</text>
  <text x="810" y="290" font-size="10" fill="#1e3a8a">facetIdString*</text>
  <text x="810" y="310" font-size="10" fill="#1e3a8a">1 条（整值匹配）</text>

  <rect x="800" y="332" width="170" height="92" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="8"/>
  <text x="810" y="354" font-size="11" font-weight="bold" fill="#14532d">sort phone:asc</text>
  <text x="810" y="374" font-size="10" fill="#14532d">读 sortableAttributes</text>
  <text x="810" y="394" font-size="10" fill="#14532d">对应的分面库</text>
  <text x="810" y="414" font-size="10" fill="#14532d">2 条，按手机号升序</text>

  <text x="802" y="452" font-size="10.5" font-weight="bold" fill="#b91c1c">过滤是整值匹配</text>
  <text x="802" y="472" font-size="10" fill="#334155">hobby=「爬山」</text>
  <text x="802" y="490" font-size="10" fill="#334155">→ 0 条</text>
  <text x="802" y="512" font-size="10" fill="#334155">改成数组后</text>
  <text x="802" y="530" font-size="10" fill="#334155">→ 1 条</text>

  <rect x="20" y="580" width="960" height="64" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="36" y="604" font-size="11.5" font-weight="bold" fill="#0f172a">原文只占 16 个库中的 1 个：documents 4096 B ≈ 一页，其余 15 个都是索引结构</text>
  <text x="36" y="628" font-size="11.5" fill="#334155">16 个库按同一个内部文档号对齐，一条任务 = 一个 LMDB 写事务，要么全生效要么全不生效</text>

  <defs>
    <marker id="m1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ea580c"/>
    </marker>
    <marker id="m2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
