<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Meilisearch 册阅读路线：一条主线 + 两条支线</text>
  <text x="500" y="56" font-size="13" fill="#64748b" text-anchor="middle">先按主线读写入与查询；分页与运维按需挑读，箭头方向就是建议的先后</text>

  <rect x="60" y="88" width="420" height="100" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" rx="10"/>
  <text x="78" y="112" font-size="14" font-weight="bold" fill="#1e3a8a">① 定位与架构</text>
  <text x="78" y="138" font-size="12" fill="#1e3a8a">它是什么：一个进程里的四条通道</text>
  <text x="78" y="160" font-size="12" fill="#1e3a8a">与 ES 的分水岭只看三条判据</text>
  <text x="78" y="180" font-size="12" fill="#1e3a8a">写入 202 到可搜的完整路径</text>

  <rect x="60" y="218" width="420" height="100" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" rx="10"/>
  <text x="78" y="242" font-size="14" font-weight="bold" fill="#14532d">② 索引与任务队列</text>
  <text x="78" y="268" font-size="12" fill="#14532d">主键推断与任务状态机</text>
  <text x="78" y="290" font-size="12" fill="#14532d">自动合批：6 个请求 → 2 批</text>
  <text x="78" y="310" font-size="12" fill="#14532d">索引放大 4.52 倍，钱在邻近库</text>

  <rect x="60" y="348" width="420" height="100" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.3" rx="10"/>
  <text x="78" y="372" font-size="14" font-weight="bold" fill="#713f12">③ 搜索与相关性</text>
  <text x="78" y="398" font-size="12" fill="#713f12">错词阈值 5 / 9，前缀只给末词</text>
  <text x="78" y="420" font-size="12" fill="#713f12">中文按词切，单字只前缀命中</text>
  <text x="78" y="440" font-size="12" fill="#713f12">七条排序规则与 _rankingScore</text>

  <rect x="560" y="218" width="380" height="100" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3" rx="10"/>
  <text x="578" y="242" font-size="14" font-weight="bold" fill="#7c2d12">④ 过滤分面与分页</text>
  <text x="578" y="268" font-size="12" fill="#7c2d12">filter / sort 两套白名单</text>
  <text x="578" y="290" font-size="12" fill="#7c2d12">maxTotalHits 静默截断</text>
  <text x="578" y="310" font-size="12" fill="#7c2d12">distinct 的估算陷阱</text>

  <rect x="560" y="348" width="380" height="100" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3" rx="10"/>
  <text x="578" y="372" font-size="14" font-weight="bold" fill="#334155">⑤ 部署与运维</text>
  <text x="578" y="398" font-size="12" fill="#334155">五把默认密钥 + 范围 key</text>
  <text x="578" y="420" font-size="12" fill="#334155">dump 390,842 B，GET 405</text>
  <text x="578" y="440" font-size="12" fill="#334155">重启后 11,208 条仍在</text>

  <line x1="270" y1="188" x2="270" y2="218" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar1)"/>
  <line x1="270" y1="318" x2="270" y2="348" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar1)"/>
  <line x1="480" y1="268" x2="560" y2="268" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ar2)"/>
  <polyline points="480,318 535,318 535,398 560,398" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar3)"/>

  <rect x="30" y="470" width="940" height="76" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="46" y="494" font-size="12" font-weight="bold" fill="#0f172a">最该记住的四组读数：11,208 条索引 18.8 MiB｜1000 条默认上限静默截断｜错词阈值 5 / 9｜11k 文档 P95 2 ms</text>
  <text x="46" y="518" font-size="11.5" fill="#334155">读序：主线 ①→②→③；支线 ③→④（分页依赖搜索）、②→⑤（运维依赖索引）</text>
  <text x="46" y="538" font-size="11.5" fill="#334155">全文读数来自单机容器 v1.56.0 与 11,208 条构造数据；换数据分布与磁盘，数字会变</text>

  <defs>
    <marker id="ar1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ea580c"/>
    </marker>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
