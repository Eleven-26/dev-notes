<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">密钥与备份：主密钥只签发，dump 才是跨版本的退路</text>
  <text x="500" y="56" font-size="13" fill="#64748b" text-anchor="middle">前端只拿 search + 指定索引的 key；备份文件生成成功不等于能恢复</text>

  <rect x="30" y="80" width="480" height="300" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" rx="10"/>
  <text x="46" y="106" font-size="14" font-weight="bold" fill="#1e3a8a">密钥层级：主密钥只负责签发</text>

  <rect x="50" y="126" width="150" height="60" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" rx="8"/>
  <text x="125" y="152" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">MEILI_MASTER_KEY</text>
  <text x="125" y="172" font-size="10.5" fill="#1e3a8a" text-anchor="middle">能签发任意 key</text>

  <rect x="250" y="120" width="240" height="34" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="6"/>
  <text x="262" y="142" font-size="11" fill="#1e3a8a">Default Search（search / *）</text>
  <rect x="250" y="160" width="240" height="34" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="6"/>
  <text x="262" y="182" font-size="11" fill="#1e3a8a">Default Admin（* / *）</text>
  <rect x="250" y="200" width="240" height="34" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="6"/>
  <text x="262" y="222" font-size="11" fill="#1e3a8a">Read-Only Admin（*.get）</text>
  <rect x="250" y="240" width="240" height="34" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="6"/>
  <text x="262" y="262" font-size="11" fill="#1e3a8a">Default Chat（chat + search）</text>
  <rect x="250" y="280" width="240" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
  <text x="262" y="302" font-size="11" fill="#14532d">自定义（search / notes）</text>

  <line x1="200" y1="156" x2="250" y2="137" stroke="#2563eb" stroke-width="1.4" marker-end="url(#d1)"/>
  <line x1="200" y1="156" x2="250" y2="177" stroke="#2563eb" stroke-width="1.4" marker-end="url(#d1)"/>
  <line x1="200" y1="156" x2="250" y2="217" stroke="#2563eb" stroke-width="1.4" marker-end="url(#d1)"/>
  <line x1="200" y1="156" x2="250" y2="257" stroke="#2563eb" stroke-width="1.4" marker-end="url(#d1)"/>
  <line x1="200" y1="156" x2="250" y2="297" stroke="#16a34a" stroke-width="1.4" marker-end="url(#d2)"/>

  <text x="46" y="340" font-size="11.5" fill="#1e3a8a">前端只发 search + 指定索引的 key；</text>
  <text x="46" y="362" font-size="11.5" fill="#1e3a8a">admin 只放服务端环境变量。</text>

  <rect x="520" y="80" width="450" height="300" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3" rx="10"/>
  <text x="536" y="106" font-size="14" font-weight="bold" fill="#7c2d12">备份：逻辑 dump 与物理 snapshot</text>

  <rect x="540" y="120" width="410" height="86" fill="#ffffff" stroke="#ea580c" stroke-width="1" rx="8"/>
  <text x="554" y="142" font-size="12" font-weight="bold" fill="#7c2d12">dump：POST /dumps → 202 + taskUid</text>
  <text x="554" y="164" font-size="11.5" fill="#7c2d12">11,208 条 → 390,842 B，任务 402 ms</text>
  <text x="554" y="186" font-size="11.5" fill="#7c2d12">GET /dumps 在 v1.56.0 回 405</text>

  <rect x="540" y="220" width="410" height="86" fill="#ffffff" stroke="#ea580c" stroke-width="1" rx="8"/>
  <text x="554" y="242" font-size="12" font-weight="bold" fill="#7c2d12">snapshot：需 MEILI_SNAPSHOT_DIR</text>
  <text x="554" y="264" font-size="11.5" fill="#7c2d12">物理复制，同版本回滚快</text>
  <text x="554" y="286" font-size="11.5" fill="#7c2d12">⚠️ 本册未配置、未实测</text>

  <text x="536" y="336" font-size="11.5" fill="#7c2d12">恢复：MEILI_IMPORT_DUMP / MEILI_IMPORT_SNAPSHOT</text>
  <text x="536" y="360" font-size="11.5" font-weight="bold" fill="#b91c1c">没做过恢复演练的备份，不算备份</text>

  <rect x="30" y="400" width="940" height="152" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="46" y="424" font-size="12" font-weight="bold" fill="#0f172a">观测面：五个接口各看什么</text>

  <rect x="46" y="438" width="172" height="40" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="132" y="456" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">/health</text>
  <text x="132" y="471" font-size="10.5" fill="#334155" text-anchor="middle">免鉴权 200</text>

  <rect x="230" y="438" width="172" height="40" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="316" y="456" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">/version</text>
  <text x="316" y="471" font-size="10.5" fill="#334155" text-anchor="middle">无头 401，带密钥可用</text>

  <rect x="414" y="438" width="172" height="40" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="500" y="456" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">/stats</text>
  <text x="500" y="471" font-size="10.5" fill="#334155" text-anchor="middle">容量与放大倍数</text>

  <rect x="598" y="438" width="172" height="40" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="684" y="456" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">/tasks</text>
  <text x="684" y="471" font-size="10.5" fill="#334155" text-anchor="middle">失败项与 progressTrace</text>

  <rect x="782" y="438" width="172" height="40" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="868" y="456" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">/metrics</text>
  <text x="868" y="471" font-size="10.5" fill="#334155" text-anchor="middle">需实验开关，否则 400</text>

  <text x="46" y="502" font-size="11.5" fill="#334155">资源读数：空载 RSS 13.21 MiB → 灌入 11,208 条后 112.1 MiB；镜像 482 MB；重启后数据与 58 个任务仍在</text>
  <text x="46" y="524" font-size="11.5" fill="#334155">排障顺序：/health → /version → 鉴权 → /tasks 失败项 → /stats 容量，不要反过来查</text>

  <defs>
    <marker id="d1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="d2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
