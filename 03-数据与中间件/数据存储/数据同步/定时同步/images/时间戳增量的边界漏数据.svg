<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">时间戳增量：边界为什么会漏数据</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#475569">用不精确、会乱、还可能不被维护的字段当游标，边界一定会漏</text>

  <rect x="24" y="80" width="952" height="230" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="108" font-size="15" font-weight="700" fill="#7c2d12">错误：只按「&gt; 水位」切窗口，首尾不留余量</text>

  <line x1="90" y1="200" x2="910" y2="200" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="360" y="186" width="360" height="28" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="540" y="178" text-anchor="middle" font-size="12" fill="#1e3a8a">本轮窗口：updated_at &gt; t1</text>

  <line x1="360" y1="170" x2="360" y2="232" stroke="#2563eb" stroke-width="2"/>
  <circle cx="360" cy="200" r="5" fill="#2563eb"/>
  <text x="360" y="252" text-anchor="middle" font-size="11" fill="#1e3a8a">上一轮水位 t1</text>

  <line x1="720" y1="170" x2="720" y2="232" stroke="#2563eb" stroke-width="2"/>
  <circle cx="720" cy="200" r="5" fill="#2563eb"/>
  <text x="720" y="252" text-anchor="middle" font-size="11" fill="#1e3a8a">本次查询时刻 t2</text>

  <circle cx="320" cy="200" r="5" fill="#ea580c"/>
  <text x="320" y="140" text-anchor="middle" font-size="12" fill="#7c2d12">行 A：updated_at ≤ t1</text>
  <text x="320" y="158" text-anchor="middle" font-size="12" fill="#7c2d12">但 t1 之后才提交</text>
  <line x1="320" y1="176" x2="320" y2="194" stroke="#ea580c" stroke-width="2"/>

  <text x="500" y="288" text-anchor="middle" font-size="12" fill="#7c2d12">行 A 既不在上一轮（查时尚未提交），又不满足本轮 &gt; t1 → 永久漏</text>

  <rect x="24" y="330" width="952" height="270" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="358" font-size="15" font-weight="700" fill="#14532d">兜底：重叠水位 + 双游标 + 周期全量校正</text>

  <line x1="90" y1="440" x2="910" y2="440" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="270" y="426" width="450" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="495" y="418" text-anchor="middle" font-size="12" fill="#14532d">重叠窗口：水位回退 Δ，边界行至少被捞一次</text>

  <line x1="270" y1="410" x2="270" y2="472" stroke="#16a34a" stroke-width="2"/>
  <circle cx="270" cy="440" r="5" fill="#16a34a"/>
  <text x="270" y="492" text-anchor="middle" font-size="11" fill="#14532d">回退后的水位 t1−Δ</text>

  <line x1="720" y1="410" x2="720" y2="472" stroke="#16a34a" stroke-width="2"/>
  <circle cx="720" cy="440" r="5" fill="#16a34a"/>
  <text x="720" y="492" text-anchor="middle" font-size="11" fill="#14532d">本次查询时刻 t2</text>

  <text x="44" y="534" font-size="12" fill="#334155">① 重叠水位：重复捞不可怕（upsert 去重），漏捞才致命</text>
  <text x="44" y="560" font-size="12" fill="#334155">② 双游标：(updated_at, 自增主键) —— 同秒多行也能精确续跑</text>
  <text x="44" y="586" font-size="12" fill="#334155">③ 周期全量校正：时钟回拨 / 软删除 / updated_at 未维护，只有全量能发现</text>

  <text x="500" y="622" text-anchor="middle" font-size="11" fill="#94a3b8">本图仅示机制；本仓未实测，无读数</text>
</svg>
