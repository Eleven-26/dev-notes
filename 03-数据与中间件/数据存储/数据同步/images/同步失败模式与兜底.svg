<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同步对不上时的分流：先按「差的方向」定责任，再选兜底</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">三条路线的失败面不同，但排查的入口是同一个：目标侧与源侧差在哪一边</text>

  <rect x="390" y="74" width="220" height="44" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/>
  <text x="500" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">目标侧对不上源侧</text>

  <path d="M 500 118 L 500 138" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <path d="M 132 138 L 846 138" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <path d="M 132 138 L 132 158" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <path d="M 126 156 L 138 156 L 132 164 z" fill="#64748b"/>
  <path d="M 370 138 L 370 158" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <path d="M 364 156 L 376 156 L 370 164 z" fill="#64748b"/>
  <path d="M 608 138 L 608 158" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <path d="M 602 156 L 614 156 L 608 164 z" fill="#64748b"/>
  <path d="M 846 138 L 846 158" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <path d="M 840 156 L 852 156 L 846 164 z" fill="#64748b"/>

  <rect x="20" y="158" width="225" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="132" y="183" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">漏行（目标少）</text>
  <rect x="258" y="158" width="225" height="40" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="370" y="183" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a3412">重复（目标多）</text>
  <rect x="496" y="158" width="225" height="40" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="608" y="183" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5b21b6">孤儿（目标有源没有）</text>
  <rect x="734" y="158" width="225" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="846" y="183" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">滞后（最新数据没到）</text>

  <rect x="20" y="206" width="225" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="32" y="226" font-size="11" font-weight="bold" fill="#0f172a">先查什么</text>
  <text x="32" y="246" font-size="11" fill="#334155">位点是否被回退过</text>
  <text x="32" y="264" font-size="11" fill="#334155">增量边界是否撞上同秒</text>
  <text x="32" y="280" font-size="11" fill="#334155">日志保留期是否已过期</text>
  <rect x="258" y="206" width="225" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="270" y="226" font-size="11" font-weight="bold" fill="#0f172a">先查什么</text>
  <text x="270" y="246" font-size="11" fill="#334155">消费重试 / 任务重跑</text>
  <text x="270" y="264" font-size="11" fill="#334155">是不是按主键写入</text>
  <text x="270" y="280" font-size="11" fill="#334155">有没有多路消费者</text>
  <rect x="496" y="206" width="225" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="508" y="226" font-size="11" font-weight="bold" fill="#0f172a">先查什么</text>
  <text x="508" y="246" font-size="11" fill="#334155">删除事件是否被消费</text>
  <text x="508" y="264" font-size="11" fill="#334155">只同步新增会留孤儿</text>
  <text x="508" y="280" font-size="11" fill="#334155">双写有没有写删除分支</text>
  <rect x="734" y="206" width="225" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="746" y="226" font-size="11" font-weight="bold" fill="#0f172a">先查什么</text>
  <text x="746" y="246" font-size="11" fill="#334155">消费积压（lag）</text>
  <text x="746" y="264" font-size="11" fill="#334155">单条大事务</text>
  <text x="746" y="280" font-size="11" fill="#334155">源库日志写入量突增</text>

  <rect x="20" y="296" width="225" height="86" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="32" y="316" font-size="11" font-weight="bold" fill="#0f172a">兜底动作</text>
  <text x="32" y="336" font-size="11" fill="#334155">周期全量校正 + 补行</text>
  <text x="32" y="354" font-size="11" fill="#334155">必要时从检查点重放</text>
  <text x="32" y="374" font-size="11" fill="#b45309">⭐ 位点必须落库</text>
  <rect x="258" y="296" width="225" height="86" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="270" y="316" font-size="11" font-weight="bold" fill="#0f172a">兜底动作</text>
  <text x="270" y="336" font-size="11" fill="#334155">目标侧按主键 upsert</text>
  <text x="270" y="354" font-size="11" fill="#334155">对账按主键比对</text>
  <text x="270" y="374" font-size="11" fill="#b45309">⭐ 幂等写在目标侧</text>
  <rect x="496" y="296" width="225" height="86" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="508" y="316" font-size="11" font-weight="bold" fill="#0f172a">兜底动作</text>
  <text x="508" y="336" font-size="11" fill="#334155">消费 delete 事件</text>
  <text x="508" y="354" font-size="11" fill="#334155">对账做差集后再删</text>
  <text x="508" y="374" font-size="11" fill="#b45309">⭐ 删除也要有事件</text>
  <rect x="734" y="296" width="225" height="86" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="746" y="316" font-size="11" font-weight="bold" fill="#0f172a">兜底动作</text>
  <text x="746" y="336" font-size="11" fill="#334155">扩并发 / 拆分区</text>
  <text x="746" y="354" font-size="11" fill="#334155">压不住就重建链路切流</text>
  <text x="746" y="374" font-size="11" fill="#b45309">⭐ 滞后必须能监控</text>

  <rect x="20" y="406" width="940" height="140" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="36" y="432" font-size="12.5" font-weight="bold" fill="#0f172a">⭐ 兜底的两条铁律：能发现（对账） + 能重算（位点或全量基线）——少任何一条，出问题就只能靠人肉猜。</text>
  <text x="36" y="458" font-size="12" fill="#334155">四种分支里，只有「重复」能在目标侧单独解掉（按主键 upsert）；漏行与孤儿都要靠「通道 + 对账」配合，滞后要靠扩容或重建。</text>
  <text x="36" y="484" font-size="12" fill="#334155">⚠️ 三条路线各有各的失败面：双写漏一个写入点就长期不一致；定时增量在 updated_at 边界漏行；读日志这条怕位点丢与保留期过期。</text>
  <text x="36" y="510" font-size="12" fill="#334155">所以组合方案的目标不是「不出错」，而是「错误必然暴露、暴露后能自动补」——这正是标准三件套那三个角色的分工。</text>
  <text x="36" y="534" font-size="12" fill="#64748b">排查顺序建议：先看差的方向（本页）→ 再看位点与位点表 → 最后才动目标侧的数据。</text>

  <text x="20" y="580" font-size="12" fill="#64748b">图只回答「对不上时往哪分流」；五种模式各自的判据与兜底动作，见第五节的两张表。</text>
</svg>
