<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="644" viewBox="0 0 1000 644" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="644" fill="#ffffff"/>

  <text x="500" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">数据同步：一张图分清「拍照」与「录像」</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#475569">三条同步路线的本质差别，是「变化从哪里被读出来」</text>

  <rect x="24" y="86" width="464" height="148" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="114" font-size="15" font-weight="700" fill="#334155">一次性迁移（拍照）</text>
  <line x1="70" y1="168" x2="432" y2="168" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="432,162 446,168 432,174" fill="#cbd5e1"/>
  <circle cx="100" cy="168" r="8" fill="#2563eb"/>
  <text x="100" y="148" text-anchor="middle" font-size="12" fill="#1e3a8a">源库快照</text>
  <circle cx="392" cy="168" r="8" fill="#16a34a"/>
  <text x="392" y="148" text-anchor="middle" font-size="12" fill="#14532d">目标库</text>
  <text x="256" y="200" text-anchor="middle" font-size="12" fill="#64748b">搬完即止：校验一致 → 收工</text>
  <text x="256" y="220" text-anchor="middle" font-size="11" fill="#94a3b8">只关心某个时点的一份快照</text>

  <rect x="512" y="86" width="464" height="148" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="532" y="114" font-size="15" font-weight="700" fill="#334155">持续同步（录像）</text>
  <rect x="522" y="130" width="140" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="592" y="156" text-anchor="middle" font-size="13" fill="#1e3a8a">① 初始全量</text>
  <text x="592" y="176" text-anchor="middle" font-size="11" fill="#334155">基线</text>
  <rect x="674" y="130" width="140" height="60" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="744" y="156" text-anchor="middle" font-size="13" fill="#7c2d12">② 持续增量</text>
  <text x="744" y="176" text-anchor="middle" font-size="11" fill="#334155">跟住变化</text>
  <rect x="826" y="130" width="140" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="896" y="156" text-anchor="middle" font-size="13" fill="#14532d">③ 对账</text>
  <text x="896" y="176" text-anchor="middle" font-size="11" fill="#334155">证明一致</text>
  <text x="744" y="216" text-anchor="middle" font-size="12" fill="#64748b">三段缺一不可：基线 + 增量 + 证明</text>

  <text x="24" y="276" font-size="15" font-weight="700" fill="#334155">三条路线：变化从哪读</text>

  <rect x="24" y="292" width="304" height="34" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="40" y="315" font-size="14" font-weight="700" fill="#1e3a8a">CDC · 读变更日志</text>
  <rect x="24" y="334" width="304" height="266" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="364" font-size="12" font-weight="700" fill="#334155">来源</text>
  <text x="40" y="384" font-size="12" fill="#475569">数据库变更日志</text>
  <text x="40" y="402" font-size="12" fill="#475569">binlog / WAL / oplog</text>
  <text x="40" y="438" font-size="12" font-weight="700" fill="#334155">优点</text>
  <text x="40" y="458" font-size="12" fill="#475569">不侵入代码、能捕获删除</text>
  <text x="40" y="476" font-size="12" fill="#475569">延迟低、可从位点重放</text>
  <text x="40" y="512" font-size="12" font-weight="700" fill="#334155">代价</text>
  <text x="40" y="532" font-size="12" fill="#475569">要开日志、维护消费位点</text>
  <text x="40" y="550" font-size="12" fill="#475569">处理 schema 演进</text>
  <text x="40" y="580" font-size="12" fill="#1e3a8a">近实时（随日志消费速度）</text>

  <rect x="348" y="292" width="304" height="34" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="364" y="315" font-size="14" font-weight="700" fill="#7c2d12">应用双写</text>
  <rect x="348" y="334" width="304" height="266" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="364" y="364" font-size="12" font-weight="700" fill="#334155">来源</text>
  <text x="364" y="384" font-size="12" fill="#475569">业务写源库的同时写目标</text>
  <text x="364" y="402" font-size="12" fill="#475569">同步写 或 发 MQ 异步写</text>
  <text x="364" y="438" font-size="12" font-weight="700" fill="#334155">优点</text>
  <text x="364" y="458" font-size="12" fill="#475569">不依赖源库日志、上线快</text>
  <text x="364" y="476" font-size="12" fill="#475569">目标写入可带业务语义</text>
  <text x="364" y="512" font-size="12" font-weight="700" fill="#334155">代价</text>
  <text x="364" y="532" font-size="12" fill="#ea580c">一定存在不一致窗口</text>
  <text x="364" y="550" font-size="12" fill="#475569">同步逻辑散落各写入点</text>
  <text x="364" y="580" font-size="12" fill="#7c2d12">必须配对账才能兜底</text>

  <rect x="672" y="292" width="304" height="34" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="688" y="315" font-size="14" font-weight="700" fill="#14532d">定时同步 · 批量</text>
  <rect x="672" y="334" width="304" height="266" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="688" y="364" font-size="12" font-weight="700" fill="#334155">来源</text>
  <text x="688" y="384" font-size="12" fill="#475569">定期查询源库</text>
  <text x="688" y="402" font-size="12" fill="#475569">按 updated_at 增量 / 全量</text>
  <text x="688" y="438" font-size="12" font-weight="700" fill="#334155">优点</text>
  <text x="688" y="458" font-size="12" fill="#475569">链路最简单、T+1 够用</text>
  <text x="688" y="476" font-size="12" fill="#475569">全量天然能发现删除</text>
  <text x="688" y="512" font-size="12" font-weight="700" fill="#334155">代价</text>
  <text x="688" y="532" font-size="12" fill="#475569">时效差、全量扫库有压力</text>
  <text x="688" y="550" font-size="12" fill="#16a34a">增量有时间戳边界漏数据</text>
  <text x="688" y="580" font-size="12" fill="#14532d">分钟级 ~ 天级（随调度周期）</text>

  <text x="500" y="626" text-anchor="middle" font-size="12" fill="#64748b">要点：生产上很少只用一种 —— 常见组合是「CDC 增量 + 定时全量基线 + 对账证明」三件套</text>
</svg>
