<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Flink CDC 一体化流水线</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#475569">Source 直读源库日志，一个作业内完成全量 + 增量，位点随 checkpoint 提交</text>

  <rect x="40" y="120" width="180" height="120" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="130" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">源库日志</text>
  <text x="130" y="188" text-anchor="middle" font-size="11" fill="#334155">binlog / WAL / oplog</text>
  <text x="130" y="214" text-anchor="middle" font-size="11" fill="#334155">增删改都在这里</text>

  <line x1="222" y1="180" x2="252" y2="180" stroke="#2563eb" stroke-width="2"/>
  <polygon points="252,174 266,180 252,186" fill="#2563eb"/>

  <rect x="256" y="96" width="468" height="168" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="490" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Flink 作业（一个作业）</text>

  <rect x="276" y="140" width="130" height="104" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="341" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Source</text>
  <text x="341" y="204" text-anchor="middle" font-size="11" fill="#334155">直读源库日志</text>

  <line x1="408" y1="192" x2="424" y2="192" stroke="#2563eb" stroke-width="2"/>
  <polygon points="424,188 434,192 424,196" fill="#2563eb"/>

  <rect x="430" y="140" width="130" height="104" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="495" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">transform</text>
  <text x="495" y="204" text-anchor="middle" font-size="11" fill="#334155">字段映射 / 过滤</text>

  <line x1="562" y1="192" x2="578" y2="192" stroke="#2563eb" stroke-width="2"/>
  <polygon points="578,188 588,192 578,196" fill="#2563eb"/>

  <rect x="584" y="140" width="130" height="104" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="649" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">sink</text>
  <text x="649" y="204" text-anchor="middle" font-size="11" fill="#334155">写出目标</text>

  <line x1="726" y1="180" x2="754" y2="180" stroke="#16a34a" stroke-width="2"/>
  <polygon points="754,174 768,180 754,186" fill="#16a34a"/>

  <rect x="764" y="120" width="196" height="120" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="862" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">目标</text>
  <text x="862" y="188" text-anchor="middle" font-size="11" fill="#334155">库 / 数据湖 / MQ</text>
  <text x="862" y="214" text-anchor="middle" font-size="11" fill="#334155">按主键 upsert 收敛</text>

  <line x1="490" y1="264" x2="490" y2="286" stroke="#ea580c" stroke-width="2"/>
  <polygon points="484,286 490,298 496,286" fill="#ea580c"/>

  <rect x="256" y="300" width="468" height="96" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="490" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">checkpoint：位点 + 作业状态一起快照</text>
  <text x="490" y="356" text-anchor="middle" font-size="11" fill="#7c2d12">重启从最近一次成功 checkpoint 续读</text>
  <text x="490" y="380" text-anchor="middle" font-size="11" fill="#7c2d12">端到端恰好一次还需 sink 支持事务 / 幂等</text>

  <text x="500" y="428" text-anchor="middle" font-size="12" fill="#64748b">对照传统三段（Canal → MQ → Flink）：这里没有独立 CDC 组件，也没有中间 MQ</text>
  <text x="500" y="454" text-anchor="middle" font-size="12" fill="#ea580c">注意：一段化省的是运维面，不是复杂度 —— 仍需 Flink 集群与 checkpoint 运维</text>
  <text x="500" y="482" text-anchor="middle" font-size="11" fill="#94a3b8">本图仅示结构；本仓未实测，无读数</text>
</svg>
