<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="550" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">CDC 工具族谱与依赖</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#475569">按「依赖什么运行时」把五个工具分成三条带；底部三条选择线对应三种起点资产</text>

  <rect x="24" y="78" width="952" height="272" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="36" y="90" width="180" height="250" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="126" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Debezium</text>
  <text x="126" y="146" text-anchor="middle" font-size="11" fill="#334155">生态：Kafka Connect</text>
  <text x="126" y="168" text-anchor="middle" font-size="11" fill="#334155">源库：多引擎覆盖</text>
  <text x="126" y="190" text-anchor="middle" font-size="11" fill="#334155">(MySQL/PG/Mongo…)</text>
  <text x="126" y="212" text-anchor="middle" font-size="11" fill="#334155">快照：内置初始快照</text>
  <text x="126" y="234" text-anchor="middle" font-size="11" fill="#334155">增量快照（信号触发）</text>
  <text x="126" y="256" text-anchor="middle" font-size="11" fill="#334155">语义：至少一次为底</text>
  <text x="126" y="278" text-anchor="middle" font-size="11" fill="#334155">恰好一次依托 Kafka</text>

  <rect x="223" y="90" width="180" height="250" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="313" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Canal</text>
  <text x="313" y="146" text-anchor="middle" font-size="11" fill="#334155">生态：canal server</text>
  <text x="313" y="168" text-anchor="middle" font-size="11" fill="#334155">不强制 Kafka</text>
  <text x="313" y="190" text-anchor="middle" font-size="11" fill="#334155">源库：主打 MySQL</text>
  <text x="313" y="212" text-anchor="middle" font-size="11" fill="#334155">快照：偏增量</text>
  <text x="313" y="234" text-anchor="middle" font-size="11" fill="#334155">全量需另行 dump</text>
  <text x="313" y="256" text-anchor="middle" font-size="11" fill="#334155">语义：至少一次</text>
  <text x="313" y="278" text-anchor="middle" font-size="11" fill="#334155">位点自管</text>

  <rect x="410" y="90" width="180" height="250" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Maxwell</text>
  <text x="500" y="146" text-anchor="middle" font-size="11" fill="#334155">生态：单进程</text>
  <text x="500" y="168" text-anchor="middle" font-size="11" fill="#334155">不强制 Kafka</text>
  <text x="500" y="190" text-anchor="middle" font-size="11" fill="#334155">源库：仅 MySQL</text>
  <text x="500" y="212" text-anchor="middle" font-size="11" fill="#334155">快照：需另行 bootstrap</text>
  <text x="500" y="234" text-anchor="middle" font-size="11" fill="#334155">输出目标多</text>
  <text x="500" y="256" text-anchor="middle" font-size="11" fill="#334155">（MQ / 文件 等）</text>
  <text x="500" y="278" text-anchor="middle" font-size="11" fill="#334155">语义：至少一次</text>

  <rect x="597" y="90" width="180" height="250" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="687" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Flink CDC</text>
  <text x="687" y="146" text-anchor="middle" font-size="11" fill="#334155">生态：必须有 Flink 集群</text>
  <text x="687" y="168" text-anchor="middle" font-size="11" fill="#334155">源库：多引擎覆盖</text>
  <text x="687" y="190" text-anchor="middle" font-size="11" fill="#334155">(MySQL/PG/Oracle…)</text>
  <text x="687" y="212" text-anchor="middle" font-size="11" fill="#334155">全量+增量一体（核心）</text>
  <text x="687" y="234" text-anchor="middle" font-size="11" fill="#334155">语义：checkpoint</text>
  <text x="687" y="256" text-anchor="middle" font-size="11" fill="#334155">→ 恰好一次</text>
  <text x="687" y="278" text-anchor="middle" font-size="11" fill="#334155">YAML pipeline（新版）</text>

  <rect x="784" y="90" width="180" height="250" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="874" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">SeaTunnel</text>
  <text x="874" y="146" text-anchor="middle" font-size="11" fill="#334155">生态：自带引擎 Zeta</text>
  <text x="874" y="168" text-anchor="middle" font-size="11" fill="#334155">可跑 Flink / Spark</text>
  <text x="874" y="190" text-anchor="middle" font-size="11" fill="#334155">源库：多源连接器</text>
  <text x="874" y="212" text-anchor="middle" font-size="11" fill="#334155">批流一体数据集成</text>
  <text x="874" y="234" text-anchor="middle" font-size="11" fill="#334155">快照：连接器层一体化</text>
  <text x="874" y="256" text-anchor="middle" font-size="11" fill="#334155">语义：随所跑引擎</text>
  <text x="874" y="278" text-anchor="middle" font-size="11" fill="#334155">原 Waterdrop</text>

  <rect x="24" y="370" width="300" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="174" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">已经用 Kafka 生态</text>
  <text x="174" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">→ 偏 Debezium</text>
  <text x="174" y="452" text-anchor="middle" font-size="11" fill="#475569">已有 Connect / topic 通道</text>

  <rect x="340" y="370" width="300" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="490" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">只用 MySQL 且想轻量</text>
  <text x="490" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">→ 偏 Canal / Maxwell</text>
  <text x="490" y="452" text-anchor="middle" font-size="11" fill="#475569">不强制 Kafka，单进程 / 轻服务</text>

  <rect x="656" y="370" width="320" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="816" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">已经上 Flink 要全增量一体</text>
  <text x="816" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">→ 偏 Flink CDC</text>
  <text x="816" y="452" text-anchor="middle" font-size="11" fill="#475569">一个作业内完成全量 + 增量</text>

  <text x="500" y="492" text-anchor="middle" font-size="12" fill="#64748b">SeaTunnel：批流一体连接器，自带引擎 Zeta，也能跑 Flink / Spark，自成一路</text>
  <text x="500" y="516" text-anchor="middle" font-size="12" fill="#64748b">要点：依赖决定你能选什么 —— 先看手上有没有 Kafka / Flink，再谈功能</text>
  <text x="500" y="540" text-anchor="middle" font-size="11" fill="#94a3b8">注意：功能有无与配置以各工具官方文档为准；本仓未实测，无读数</text>
</svg>
