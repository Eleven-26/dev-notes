<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1100" height="620" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">全量与增量的接缝由谁负责：五个工具的快照能力对照</text>
  <text x="550" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">接缝是 CDC 落地最容易出错的地方；本图为定性对照，不含性能读数</text>

  <rect x="35" y="88" width="190" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="130" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Debezium</text>

  <rect x="245" y="88" width="190" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="340" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Canal</text>

  <rect x="455" y="88" width="190" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="550" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Maxwell</text>

  <rect x="665" y="88" width="190" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="760" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Flink CDC</text>

  <rect x="875" y="88" width="190" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="970" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">SeaTunnel</text>

  <rect x="35" y="158" width="190" height="64" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="130" y="197" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">全量</text>
  <rect x="35" y="230" width="190" height="64" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="130" y="269" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">接缝：工具负责</text>
  <rect x="35" y="302" width="190" height="64" rx="7" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="130" y="341" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">增量</text>
  <text x="35" y="396" font-size="11" fill="#334155">内置初始快照</text>
  <text x="35" y="418" font-size="11" fill="#334155">+ 增量快照</text>
  <text x="35" y="440" font-size="11" fill="#166534">全量与位点不用自己拼</text>

  <rect x="245" y="158" width="190" height="64" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="340" y="197" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">全量</text>
  <rect x="245" y="230" width="190" height="64" rx="7" fill="#fee2e2" stroke="#f87171" stroke-width="1.2"/>
  <text x="340" y="269" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">接缝：自己负责</text>
  <rect x="245" y="302" width="190" height="64" rx="7" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="340" y="341" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">增量</text>
  <text x="245" y="396" font-size="11" fill="#334155">偏增量，全量另行 dump</text>
  <text x="245" y="418" font-size="11" fill="#334155">位点自己接</text>
  <text x="245" y="440" font-size="11" fill="#b91c1c">全量 + 位点衔接自己做</text>

  <rect x="455" y="158" width="190" height="64" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="550" y="197" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">全量</text>
  <rect x="455" y="230" width="190" height="64" rx="7" fill="#fee2e2" stroke="#f87171" stroke-width="1.2"/>
  <text x="550" y="269" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">接缝：自己负责</text>
  <rect x="455" y="302" width="190" height="64" rx="7" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="550" y="341" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">增量</text>
  <text x="455" y="396" font-size="11" fill="#334155">需单独 bootstrap</text>
  <text x="455" y="418" font-size="11" fill="#334155">再接增量</text>
  <text x="455" y="440" font-size="11" fill="#b91c1c">全量基线自己做</text>

  <rect x="665" y="158" width="190" height="64" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="760" y="197" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">全量</text>
  <rect x="665" y="230" width="190" height="64" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="760" y="269" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">接缝：工具负责</text>
  <rect x="665" y="302" width="190" height="64" rx="7" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="760" y="341" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">增量</text>
  <text x="665" y="396" font-size="11" fill="#334155">全量 + 增量</text>
  <text x="665" y="418" font-size="11" fill="#334155">一个作业内完成</text>
  <text x="665" y="440" font-size="11" fill="#166534">位点交给 checkpoint</text>

  <rect x="875" y="158" width="190" height="64" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="970" y="197" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">全量</text>
  <rect x="875" y="230" width="190" height="64" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="970" y="269" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">接缝：工具负责</text>
  <rect x="875" y="302" width="190" height="64" rx="7" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="970" y="341" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">增量</text>
  <text x="875" y="396" font-size="11" fill="#334155">连接器层</text>
  <text x="875" y="418" font-size="11" fill="#334155">批流一体化</text>
  <text x="875" y="440" font-size="11" fill="#166534">具体能力以官方文档为准</text>

  <rect x="35" y="488" width="1030" height="100" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="51" y="516" font-size="13" font-weight="bold" fill="#1e40af">判据：先看「接缝」由谁负责，再看别的维度。</text>
  <text x="51" y="542" font-size="12" fill="#1e3a8a">想省掉自己拼全量 + 位点，就选内置一体化的工具；接受自己拼，轻量客户端也能跑得很稳。</text>
  <text x="51" y="566" font-size="12" fill="#1e3a8a">快照能力是硬维度：它决定「全量切换增量」这一刻，是工具兜住还是你兜住。</text>
</svg>
