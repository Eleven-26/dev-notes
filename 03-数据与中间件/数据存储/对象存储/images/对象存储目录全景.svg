<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">对象存储目录全景：先选路线，再看产品，最后落到上传链路</text>
  <text x="500" y="56" font-size="13" fill="#64748b" text-anchor="middle">本目录只回答「用哪一类、用哪个产品」；上传怎么设计、对象怎么过期，在相邻目录</text>

  <rect x="60" y="80" width="410" height="96" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3" rx="10"/>
  <text x="76" y="104" font-size="13" font-weight="bold" fill="#7c2d12">选型篇 · 对象存储选型对比</text>
  <text x="76" y="128" font-size="11.5" fill="#7c2d12">两条路线：分布式文件系统（Ceph）vs 对象存储</text>
  <text x="76" y="150" font-size="11.5" fill="#7c2d12">判据只有一条：要不要在多节点之间共享</text>
  <text x="76" y="168" font-size="11.5" fill="#7c2d12">原则：从需求与熟悉度出发，不从跑分出发</text>

  <line x1="470" y1="128" x2="524" y2="128" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ovOrange)"/>

  <rect x="530" y="80" width="410" height="96" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2" rx="10"/>
  <text x="546" y="104" font-size="12.5" font-weight="bold" fill="#7c2d12">路线结论</text>
  <text x="546" y="128" font-size="11.5" fill="#7c2d12">要共享 → Ceph：挂载到 OS 目录，像本地文件夹</text>
  <text x="546" y="150" font-size="11.5" fill="#7c2d12">不共享 → 对象存储：HTTP 存取，整块写、按 key 读</text>
  <text x="546" y="168" font-size="11.5" fill="#7c2d12">要追加写 → HDFS（另一个分水岭，不在本目录）</text>

  <line x1="265" y1="176" x2="265" y2="206" stroke="#64748b" stroke-width="1.8" marker-end="url(#ovGray)"/>

  <rect x="60" y="210" width="410" height="124" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" rx="10"/>
  <text x="76" y="234" font-size="13" font-weight="bold" fill="#14532d">产品篇 · MinIO</text>
  <text x="76" y="258" font-size="11.5" fill="#14532d">一个进程 + 4 个目录 = 一套 S3 兼容服务</text>
  <text x="76" y="280" font-size="11.5" fill="#14532d">4 盘默认 EC 2+2，容量按一半算（实测 2.000）</text>
  <text x="76" y="302" font-size="11.5" fill="#14532d">预签名直传、1000 条分页、分片上传与残留</text>
  <text x="76" y="324" font-size="11.5" fill="#166534">实测：命名卷 1 KB PUT 94~100 个/秒</text>

  <rect x="530" y="210" width="410" height="124" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="546" y="234" font-size="12.5" font-weight="bold" fill="#334155">协议篇 · S3 兼容协议与分片上传</text>
  <text x="546" y="258" font-size="11.5" fill="#475569">SigV4 四步签名与报文逐字段拼装（手算签名实测 200）</text>
  <text x="546" y="280" font-size="11.5" fill="#475569">分片四步 XML、5 MiB 下限、ETag 按分片重算</text>
  <text x="546" y="302" font-size="11.5" fill="#475569">Range 206/416 与条件请求 304/412 的判定链</text>

  <line x1="265" y1="334" x2="265" y2="364" stroke="#64748b" stroke-width="1.8" marker-end="url(#ovGray)"/>

  <rect x="60" y="368" width="410" height="86" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" rx="10"/>
  <text x="76" y="392" font-size="12.5" font-weight="bold" fill="#1e3a8a">上传链路 · 04 系统设计 / 文件存储与上传架构</text>
  <text x="76" y="416" font-size="11.5" fill="#1e3a8a">直传还是中转、临时凭证怎么签发、业务节点无状态</text>
  <text x="76" y="438" font-size="11.5" fill="#1e3a8a">MinIO 的预签名只是这套架构里的一个实现选项</text>

  <rect x="530" y="368" width="410" height="86" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" rx="10"/>
  <text x="546" y="392" font-size="12.5" font-weight="bold" fill="#334155">形态 · 存储架构与场景 / 对象与文件数据存储</text>
  <text x="546" y="416" font-size="11.5" fill="#475569">对象为什么不可变、生命周期怎么逐级降档</text>
  <text x="546" y="438" font-size="11.5" fill="#475569">指针与本体分离之后，删除为什么会踩坑</text>

  <rect x="30" y="478" width="940" height="76" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="46" y="502" font-size="11.5" font-weight="bold" fill="#0f172a">读序：选型篇（要不要自建）→ 产品篇（怎么跑、错在哪）→ 协议篇（报文、签名与分片细节）→ 上传链路（怎么接业务）</text>
  <text x="46" y="528" font-size="11.5" fill="#334155">实测坐标：MinIO RELEASE.2025-10-15，单机 4 目录 EC:2；性能只代表本机盘与后端，换盘就变</text>
  <text x="46" y="550" font-size="11.5" fill="#334155">边界：本目录不含云厂商计费、跨区复制与 KMS；也不含「怎么在业务代码里用 SDK」</text>

  <defs>
    <marker id="ovOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ea580c"/>
    </marker>
    <marker id="ovGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
