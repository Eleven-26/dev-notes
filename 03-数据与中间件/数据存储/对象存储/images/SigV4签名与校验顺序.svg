<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">SigV4 签名：客户端四步计算，服务端六步校验</text>
  <text x="500" y="56" font-size="13" fill="#64748b" text-anchor="middle">签名不是加密，而是把请求规范化成一段文本后做 HMAC；服务端重算同一段文本即可验证</text>

  <rect x="40" y="78" width="440" height="360" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3" rx="10"/>
  <text x="60" y="104" font-size="14" font-weight="bold" fill="#7c2d12">客户端：四步纯计算</text>

  <rect x="58" y="118" width="404" height="68" fill="#ffffff" stroke="#ea580c" stroke-width="1.1" rx="8"/>
  <text x="72" y="142" font-size="13" font-weight="bold" fill="#7c2d12">① 拼 canonical request</text>
  <text x="72" y="164" font-size="11.5" fill="#7c2d12">方法 + 规范化 URI + 查询串 + headers + 摘要</text>

  <line x1="260" y1="186" x2="260" y2="196" stroke="#ea580c" stroke-width="1.8" marker-end="url(#flowOrange)"/>

  <rect x="58" y="196" width="404" height="68" fill="#ffffff" stroke="#ea580c" stroke-width="1.1" rx="8"/>
  <text x="72" y="220" font-size="13" font-weight="bold" fill="#7c2d12">② 拼 string to sign</text>
  <text x="72" y="242" font-size="11.5" fill="#7c2d12">时间 + scope（日期 / 区域 / 服务）+ 上一步的 SHA-256</text>

  <line x1="260" y1="264" x2="260" y2="274" stroke="#ea580c" stroke-width="1.8" marker-end="url(#flowOrange)"/>

  <rect x="58" y="274" width="404" height="68" fill="#ffffff" stroke="#ea580c" stroke-width="1.1" rx="8"/>
  <text x="72" y="298" font-size="13" font-weight="bold" fill="#7c2d12">③ 派生 signing key</text>
  <text x="72" y="320" font-size="11.5" fill="#7c2d12">HMAC 四级：日期 → 区域 → 服务 → aws4_request</text>

  <line x1="260" y1="342" x2="260" y2="352" stroke="#ea580c" stroke-width="1.8" marker-end="url(#flowOrange)"/>

  <rect x="58" y="352" width="404" height="68" fill="#ffffff" stroke="#ea580c" stroke-width="1.1" rx="8"/>
  <text x="72" y="376" font-size="13" font-weight="bold" fill="#7c2d12">④ 写 Authorization 头</text>
  <text x="72" y="398" font-size="11.5" fill="#7c2d12">Credential + SignedHeaders + Signature 三段</text>

  <line x1="485" y1="258" x2="513" y2="258" stroke="#64748b" stroke-width="2" marker-end="url(#flowGray)"/>

  <rect x="520" y="78" width="440" height="360" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" rx="10"/>
  <text x="540" y="104" font-size="14" font-weight="bold" fill="#1e3a8a">服务端：六步固定顺序</text>

  <rect x="538" y="112" width="404" height="42" fill="#ffffff" stroke="#2563eb" stroke-width="1.1" rx="7"/>
  <text x="552" y="138" font-size="11.5" fill="#1e3a8a">① 解析请求，取方法与子资源查询串</text>

  <rect x="538" y="166" width="404" height="42" fill="#ffffff" stroke="#2563eb" stroke-width="1.1" rx="7"/>
  <text x="552" y="192" font-size="11.5" fill="#1e3a8a">② 校验时间窗（约 15 分钟），超窗报 403</text>

  <rect x="538" y="220" width="404" height="42" fill="#ffffff" stroke="#2563eb" stroke-width="1.1" rx="7"/>
  <text x="552" y="246" font-size="11.5" fill="#1e3a8a">③ 按 Credential 找到对应密钥</text>

  <rect x="538" y="274" width="404" height="42" fill="#ffffff" stroke="#2563eb" stroke-width="1.1" rx="7"/>
  <text x="552" y="300" font-size="11.5" fill="#1e3a8a">④ 重算签名并比对，不符报 403</text>

  <rect x="538" y="328" width="404" height="42" fill="#ffffff" stroke="#2563eb" stroke-width="1.1" rx="7"/>
  <text x="552" y="354" font-size="11.5" fill="#1e3a8a">⑤ 校验 payload 摘要，不符报 400</text>

  <rect x="538" y="382" width="404" height="42" fill="#ffffff" stroke="#2563eb" stroke-width="1.1" rx="7"/>
  <text x="552" y="408" font-size="11.5" fill="#1e3a8a">⑥ 授权检查与业务处理，成功回 200</text>

  <rect x="40" y="458" width="920" height="140" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="58" y="484" font-size="12.5" font-weight="bold" fill="#0f172a">本机实测：错误码能定位到校验层</text>
  <text x="58" y="510" font-size="11.5" fill="#334155">签名末位改错 → 403 SignatureDoesNotMatch；签名对但摘要不符 → 400 XAmzContentSHA256Mismatch</text>
  <text x="58" y="534" font-size="11.5" fill="#334155">签名时间偏 10 分钟 → 200；偏 16 分钟 → 403 RequestTimeTooSkewed</text>
  <text x="58" y="558" font-size="11.5" fill="#334155">顺序证据：签名错先于摘要被拦下，说明身份校验在内容校验之前</text>

  <defs>
    <marker id="flowOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ea580c"/>
    </marker>
    <marker id="flowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
