<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">分片上传四步协议：发起、传片、续传、合并</text>
  <text x="500" y="56" font-size="13" fill="#64748b" text-anchor="middle">断点续传的依据是服务端 ListParts，不是客户端自己的记录；分片可重传，合并不可重试</text>

  <rect x="90" y="74" width="120" height="30" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2" rx="6"/>
  <text x="150" y="94" font-size="12.5" font-weight="bold" fill="#7c2d12" text-anchor="middle">客户端</text>
  <rect x="530" y="74" width="140" height="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" rx="6"/>
  <text x="600" y="94" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">对象存储服务端</text>

  <line x1="150" y1="104" x2="150" y2="452" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="600" y1="104" x2="600" y2="452" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4"/>

  <text x="190" y="130" font-size="11.5" fill="#0f172a">① POST /bucket/key?uploads</text>
  <line x1="150" y1="138" x2="596" y2="138" stroke="#ea580c" stroke-width="1.6" marker-end="url(#seqOrange)"/>
  <text x="190" y="158" font-size="11" fill="#475569">200，返回 UploadId</text>
  <line x1="600" y1="166" x2="154" y2="166" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#seqBlue)"/>

  <text x="190" y="196" font-size="11.5" fill="#0f172a">② PUT ?partNumber=1&amp;uploadId=…</text>
  <line x1="150" y1="204" x2="596" y2="204" stroke="#ea580c" stroke-width="1.6" marker-end="url(#seqOrange)"/>
  <text x="190" y="224" font-size="11" fill="#475569">200，ETag 就是第 1 片的 MD5</text>
  <line x1="600" y1="232" x2="154" y2="232" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#seqBlue)"/>

  <text x="190" y="262" font-size="11.5" fill="#0f172a">③ PUT ?partNumber=2&amp;uploadId=…</text>
  <line x1="150" y1="270" x2="596" y2="270" stroke="#ea580c" stroke-width="1.6" marker-end="url(#seqOrange)"/>
  <text x="190" y="290" font-size="11" fill="#475569">200，第 2 片已落盘</text>
  <line x1="600" y1="298" x2="154" y2="298" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#seqBlue)"/>

  <rect x="230" y="310" width="290" height="34" fill="#fef2f2" stroke="#dc2626" stroke-width="1.1" stroke-dasharray="4 3" rx="6"/>
  <text x="375" y="332" font-size="11.5" fill="#991b1b" text-anchor="middle">客户端崩溃 / 网络中断（对象仍查不到）</text>

  <text x="190" y="368" font-size="11.5" fill="#0f172a">④ GET ?uploadId（ListParts）</text>
  <line x1="150" y1="376" x2="596" y2="376" stroke="#ea580c" stroke-width="1.6" marker-end="url(#seqOrange)"/>
  <text x="190" y="396" font-size="11" fill="#475569">200，返回已传分片清单；只补缺失片</text>
  <line x1="600" y1="404" x2="154" y2="404" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#seqBlue)"/>

  <text x="190" y="426" font-size="11.5" fill="#0f172a">⑤ POST ?uploadId + Part 列表 XML</text>
  <line x1="150" y1="434" x2="596" y2="434" stroke="#16a34a" stroke-width="1.8" marker-end="url(#seqGreen)"/>
  <text x="190" y="452" font-size="11" fill="#166534">200，对象 ETag 带 -N 后缀</text>

  <rect x="650" y="104" width="310" height="348" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="668" y="130" font-size="12.5" font-weight="bold" fill="#0f172a">三条硬约束（本机实测）</text>
  <text x="668" y="160" font-size="11.5" fill="#334155">除末片外每片至少 5 MiB，</text>
  <text x="668" y="180" font-size="11.5" fill="#334155">否则合并报 400 EntityTooSmall</text>
  <text x="668" y="216" font-size="11.5" fill="#334155">同号重传会覆盖：ListParts</text>
  <text x="668" y="236" font-size="11.5" fill="#334155">仍只有 1 条，ETag 取后一次</text>
  <text x="668" y="272" font-size="11.5" fill="#334155">合并不幂等：同一 uploadId</text>
  <text x="668" y="292" font-size="11.5" fill="#334155">二次合并报 404 NoSuchUpload</text>
  <text x="668" y="328" font-size="11.5" fill="#334155">对已完成上传 abort 返回 204，</text>
  <text x="668" y="348" font-size="11.5" fill="#334155">清理脚本拿不到失败信号</text>
  <text x="668" y="384" font-size="11.5" fill="#334155">失败重试先 HEAD 目标 key，</text>
  <text x="668" y="404" font-size="11.5" fill="#334155">再决定是否重发合并</text>

  <rect x="40" y="470" width="920" height="130" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="58" y="496" font-size="12.5" font-weight="bold" fill="#0f172a">本机一组读数：两片 5 MiB + 1 MiB</text>
  <text x="58" y="522" font-size="11.5" fill="#334155">合并返回 ETag 34012e0e9ff4d0e39a9791f0277c6674-2，由两片 MD5 再取一次 MD5 复算一致</text>
  <text x="58" y="546" font-size="11.5" fill="#334155">合并后 HEAD 读到 content_length=6291456，后缀 -2 表示两片</text>
  <text x="58" y="570" font-size="11.5" fill="#334155">把两片都切成 1 MiB 再合并，返回 400 EntityTooSmall，对象不会生成</text>

  <defs>
    <marker id="seqOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ea580c"/>
    </marker>
    <marker id="seqBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="seqGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
