<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" width="1000" height="710" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="710" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Range 与条件请求的判定顺序：先取段，再看缓存，最后看前置条件</text>
  <text x="500" y="56" font-size="13" fill="#64748b" text-anchor="middle">三种 header 各自回答一个问题，状态码就是答案；304 与 412 都是正常协议行为，不是故障</text>

  <rect x="70" y="100" width="360" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" rx="8"/>
  <text x="250" y="131" font-size="12.5" fill="#1e3a8a" text-anchor="middle">① 请求带 Range 头？</text>

  <line x1="430" y1="125" x2="514" y2="125" stroke="#2563eb" stroke-width="1.6" marker-end="url(#treeBlue)"/>
  <text x="455" y="116" font-size="11.5" fill="#2563eb">是</text>

  <rect x="520" y="100" width="390" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" rx="8"/>
  <text x="715" y="131" font-size="12.5" fill="#1e3a8a" text-anchor="middle">② 请求的区间可满足？</text>

  <line x1="640" y1="150" x2="640" y2="176" stroke="#16a34a" stroke-width="1.6" marker-end="url(#treeGreen)"/>
  <text x="648" y="170" font-size="11.5" fill="#16a34a">是</text>
  <rect x="540" y="176" width="200" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="7"/>
  <text x="640" y="201" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">206 + Content-Range</text>

  <line x1="800" y1="150" x2="800" y2="176" stroke="#dc2626" stroke-width="1.6" marker-end="url(#treeRed)"/>
  <text x="808" y="170" font-size="11.5" fill="#dc2626">否</text>
  <rect x="740" y="176" width="170" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" rx="7"/>
  <text x="825" y="201" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">416 InvalidRange</text>

  <line x1="250" y1="150" x2="250" y2="246" stroke="#64748b" stroke-width="1.6" marker-end="url(#treeGray)"/>
  <text x="258" y="200" font-size="11.5" fill="#64748b">否</text>

  <rect x="70" y="246" width="360" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" rx="8"/>
  <text x="250" y="277" font-size="12.5" fill="#1e3a8a" text-anchor="middle">③ If-None-Match 命中？</text>

  <line x1="430" y1="271" x2="514" y2="271" stroke="#64748b" stroke-width="1.6" marker-end="url(#treeGray)"/>
  <text x="455" y="262" font-size="11.5" fill="#64748b">是</text>
  <rect x="520" y="251" width="200" height="40" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" rx="7"/>
  <text x="620" y="276" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">304 无 body</text>

  <line x1="250" y1="296" x2="250" y2="336" stroke="#64748b" stroke-width="1.6" marker-end="url(#treeGray)"/>
  <text x="258" y="322" font-size="11.5" fill="#64748b">否</text>

  <rect x="70" y="336" width="360" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" rx="8"/>
  <text x="250" y="367" font-size="12.5" fill="#1e3a8a" text-anchor="middle">④ If-Match 不匹配？</text>

  <line x1="430" y1="361" x2="514" y2="361" stroke="#dc2626" stroke-width="1.6" marker-end="url(#treeRed)"/>
  <text x="455" y="352" font-size="11.5" fill="#dc2626">是</text>
  <rect x="520" y="341" width="220" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" rx="7"/>
  <text x="630" y="366" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">412 PreconditionFailed</text>

  <line x1="250" y1="386" x2="250" y2="426" stroke="#16a34a" stroke-width="1.6" marker-end="url(#treeGreen)"/>
  <text x="258" y="412" font-size="11.5" fill="#16a34a">否</text>

  <rect x="70" y="426" width="360" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" rx="8"/>
  <text x="250" y="453" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">200 正常返回对象</text>

  <rect x="70" y="500" width="360" height="50" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3" rx="8"/>
  <text x="250" y="531" font-size="12.5" fill="#7c2d12" text-anchor="middle">⑤ 写请求带 If-None-Match: *？</text>

  <line x1="430" y1="510" x2="514" y2="510" stroke="#dc2626" stroke-width="1.6" marker-end="url(#treeRed)"/>
  <text x="452" y="501" font-size="11.5" fill="#dc2626">已存在</text>
  <rect x="520" y="490" width="220" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" rx="7"/>
  <text x="630" y="515" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">412，保留原内容</text>

  <line x1="430" y1="540" x2="514" y2="540" stroke="#16a34a" stroke-width="1.6" marker-end="url(#treeGreen)"/>
  <text x="452" y="562" font-size="11.5" fill="#16a34a">不存在</text>
  <rect x="520" y="556" width="220" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="7"/>
  <text x="630" y="581" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">200，只写一次</text>

  <rect x="40" y="626" width="920" height="70" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="58" y="651" font-size="11.5" fill="#334155">本机实测：Range bytes=0-99 回 206 与 bytes 0-99/1048576；越界回 416；If-None-Match 命中回 304</text>
  <text x="58" y="675" font-size="11.5" fill="#334155">If-Match 写错回 412；PUT 加 If-None-Match 星号，第二次写入回 412 且保留第一次的内容</text>

  <defs>
    <marker id="treeBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="treeGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
    <marker id="treeRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/>
    </marker>
    <marker id="treeGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
