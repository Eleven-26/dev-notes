<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="mLk" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="mLg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="mLr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">分布式锁：加锁 → 续期 → 释放的时序</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">锁的 value 必须是唯一标识；释放必须走 Lua「比对后再删」，否则会误删别人的锁</text>

  <rect x="60" y="78" width="200" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="160" y="104" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1e3a8a">业务实例 A</text>
  <rect x="420" y="78" width="200" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="520" y="104" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#14532d">Redis（单实例）</text>
  <rect x="780" y="78" width="170" height="42" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="865" y="104" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">业务实例 B</text>

  <line x1="160" y1="122" x2="160" y2="556" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="520" y1="122" x2="520" y2="556" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="865" y1="122" x2="865" y2="556" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>

  <rect x="143" y="200" width="34" height="252" rx="5" fill="#dbeafe" opacity="0.55"/>
  <rect x="150" y="140" width="20" height="318" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="855" y="232" width="20" height="58" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="855" y="490" width="20" height="58" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>

  <line x1="172" y1="170" x2="504" y2="170" stroke="#334155" stroke-width="1.6" marker-end="url(#mLk)"/>
  <text x="338" y="162" text-anchor="middle" font-size="12.5" fill="#0f172a">① SET lock 〈uid-A〉 NX PX 30000</text>
  <line x1="508" y1="198" x2="176" y2="198" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mLg)"/>
  <text x="342" y="192" text-anchor="middle" font-size="12" fill="#15803d">OK → A 拿到锁</text>

  <text x="190" y="232" font-size="12" fill="#1d4ed8">临界区：执行业务（耗时可能超过 30s 租期）</text>

  <line x1="853" y1="252" x2="532" y2="252" stroke="#334155" stroke-width="1.6" marker-end="url(#mLk)"/>
  <text x="692" y="244" text-anchor="middle" font-size="12.5" fill="#0f172a">② SET lock 〈uid-B〉 NX PX 30000</text>
  <line x1="528" y1="280" x2="849" y2="280" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mLr)"/>
  <text x="688" y="274" text-anchor="middle" font-size="12" fill="#b91c1c">nil → 已占用，退避重试</text>

  <line x1="172" y1="346" x2="504" y2="346" stroke="#334155" stroke-width="1.6" marker-end="url(#mLk)"/>
  <text x="338" y="338" text-anchor="middle" font-size="12.5" fill="#0f172a">③ PEXPIRE lock 30000（watchdog 续期）</text>
  <line x1="508" y1="372" x2="176" y2="372" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mLg)"/>
  <text x="342" y="366" text-anchor="middle" font-size="12" fill="#15803d">1</text>

  <line x1="172" y1="418" x2="504" y2="418" stroke="#334155" stroke-width="1.6" marker-end="url(#mLk)"/>
  <text x="338" y="410" text-anchor="middle" font-size="12.5" fill="#0f172a">④ EVAL「GET==uid-A ? DEL : 0」（原子）</text>
  <line x1="508" y1="444" x2="176" y2="444" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mLg)"/>
  <text x="342" y="438" text-anchor="middle" font-size="12" fill="#15803d">1 → 释放成功</text>

  <line x1="853" y1="508" x2="532" y2="508" stroke="#334155" stroke-width="1.6" marker-end="url(#mLk)"/>
  <text x="692" y="500" text-anchor="middle" font-size="12.5" fill="#0f172a">⑤ 重试 SET NX → OK</text>
  <line x1="528" y1="534" x2="849" y2="534" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mLg)"/>
  <text x="688" y="528" text-anchor="middle" font-size="12" fill="#15803d">B 拿到锁</text>

  <rect x="20" y="566" width="960" height="76" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="36" y="594" font-size="12.5" fill="#0f172a">⚠️ 主从切换窗口：主节点写入锁后、尚未同步到从库就宕机 → 新主没有这条 key → 可能两个实例同时持锁。</text>
  <text x="36" y="620" font-size="12.5" fill="#0f172a">⚠️ 租期到点业务没跑完：靠 watchdog 续期；续期进程自己挂了就退化成「锁提前释放」→ 业务侧仍要有幂等兜底。</text>
</svg>
