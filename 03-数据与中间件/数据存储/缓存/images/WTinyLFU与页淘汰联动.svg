<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" height="790" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arwA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="790" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">W-TinyLFU 的结构，与 WiredTiger 的压缩 / 淘汰联动</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">前者的难点是「准入比频率」，后者的关键是「缓存里放的是解压后的页」</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="960" height="262" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">① W-TinyLFU：小窗口 + 分段主体 + 一道准入门</text>

    <rect x="24" y="48" width="200" height="64" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="124" y="70" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1d4ed8">window（小 LRU）</text>
    <text x="124" y="92" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#334155">所有新数据先进这里</text>

    <line x1="224" y1="80" x2="286" y2="80" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <text x="228" y="70" font-size="10.5" fill="#64748b">溢出</text>

    <rect x="290" y="48" width="200" height="64" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
    <text x="390" y="70" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#b45309">准入判断 TinyLFU</text>
    <text x="390" y="92" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#334155">比估计频率，输者出局</text>

    <line x1="490" y1="80" x2="552" y2="80" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <text x="494" y="70" font-size="10.5" fill="#64748b">赢者进</text>

    <rect x="556" y="40" width="380" height="188" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="746" y="60" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#0f172a">main（主体，占大头）</text>
    <rect x="572" y="74" width="348" height="60" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.1"/>
    <text x="746" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1d4ed8">protected（大头）</text>
    <text x="746" y="116" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#334155">真热点留在这一段</text>
    <rect x="572" y="146" width="348" height="60" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/>
    <text x="746" y="168" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#b45309">probation（小头）</text>
    <text x="746" y="188" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#334155">被再次访问才升上去</text>

    <line x1="596" y1="146" x2="596" y2="134" stroke="#b45309" stroke-width="1.5" marker-end="url(#arwA)"/>
    <line x1="620" y1="134" x2="620" y2="146" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <text x="636" y="140" dominant-baseline="central" font-size="10.5" fill="#64748b">升 / 降</text>

    <text x="24" y="242" font-size="12" fill="#334155">⭐ protected 里的不是直接被淘汰，而是先降到 probation —— 给老热点一道「第二次机会」，避免抖动。</text>
  </g>

  <g transform="translate(20,352)">
    <rect x="0" y="0" width="960" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">② 为什么「估计器有假阳性」却够用：count-min sketch 只会高估、不会低估</text>

    <text x="24" y="60" font-size="12.5" fill="#334155">count-min sketch = 几个小数组 + k 个哈希：用固定小内存，给任意 key 一个频率估计。</text>
    <text x="24" y="90" font-size="12.5" fill="#334155">估计值 ≥ 真实值 → 这里只拿它做「两个候选比大小」，根本不需要精确值。</text>
    <text x="24" y="120" font-size="12.5" fill="#b45309">⭐ 误差方向不致命时，就能用极小内存换掉一个 per-key 计数器字典 —— 淘汰场景里近似结构的典型用法。</text>
  </g>

  <g transform="translate(20,522)">
    <rect x="0" y="0" width="960" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">③ WiredTiger：块压缩与页淘汰怎么咬合（MongoDB 默认引擎）</text>

    <rect x="24" y="44" width="912" height="28" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="58" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#0f172a">机制</text>
    <text x="184" y="58" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#0f172a">采用的算法</text>
    <text x="384" y="58" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#0f172a">说明</text>

    <rect x="24" y="72" width="912" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="88" dominant-baseline="central" font-size="12" fill="#334155">集合数据压缩</text>
    <text x="184" y="88" dominant-baseline="central" font-size="12" fill="#1d4ed8">块压缩（默认 Snappy）</text>
    <text x="384" y="88" dominant-baseline="central" font-size="12" fill="#334155">页面写盘时压缩，从磁盘读入缓存时解压</text>

    <rect x="24" y="104" width="912" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="120" dominant-baseline="central" font-size="12" fill="#334155">索引压缩</text>
    <text x="184" y="120" dominant-baseline="central" font-size="12" fill="#1d4ed8">前缀压缩</text>
    <text x="384" y="120" dominant-baseline="central" font-size="12" fill="#334155">索引键常有共同前缀，去掉重复前缀可显著减小体积</text>

    <rect x="24" y="136" width="912" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="152" dominant-baseline="central" font-size="12" fill="#334155">缓存淘汰</text>
    <text x="184" y="152" dominant-baseline="central" font-size="12" fill="#1d4ed8">LRU</text>
    <text x="384" y="152" dominant-baseline="central" font-size="12" fill="#334155">常态由后台 evict 线程淘汰页面</text>

    <text x="24" y="196" font-size="12" fill="#b45309">⚠️ 缓存里放的是「解压后的页」—— 压缩省的是磁盘与 IO，不省缓存内存（cacheSizeGB 口径以官方文档为准）。</text>
    <text x="24" y="222" font-size="12" fill="#b45309">⚠️ 内存极紧张时用户线程也参与淘汰 → 请求阻塞，且叠加解压 CPU：读写路径被 IO / CPU / 淘汰三方拉扯。</text>
  </g>
</svg>
