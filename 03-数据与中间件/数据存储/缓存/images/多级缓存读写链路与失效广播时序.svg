<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 664" width="1000" height="664" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="q1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="q2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="q3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/>
    </marker>
    <marker id="q4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="664" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">多级缓存的一条调用时序：读有四条结局，写要广播删各节点 L1</text>
  <text x="500" y="57" text-anchor="middle" font-size="13" fill="#64748b">取自本篇「使用：Go」的 Get / Invalid / SubscribeInvalidate 三段代码，分支顺序与代码一致</text>

  <rect x="38" y="78" width="148" height="42" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="112" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">调用方</text>
  <text x="112" y="113" text-anchor="middle" font-size="9.5" fill="#475569">MultiLevel.Get</text>
  <rect x="216" y="78" width="148" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="290" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">L1 bigcache</text>
  <text x="290" y="113" text-anchor="middle" font-size="9.5" fill="#1d4ed8">进程内，纳秒级</text>
  <rect x="394" y="78" width="148" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="468" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">L2 Redis</text>
  <text x="468" y="113" text-anchor="middle" font-size="9.5" fill="#166534">毫秒级，一次往返</text>
  <rect x="572" y="78" width="148" height="42" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="646" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">DB（权威源）</text>
  <text x="646" y="113" text-anchor="middle" font-size="9.5" fill="#9a3412">loader 回源</text>
  <rect x="770" y="78" width="196" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="868" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">其他节点的订阅协程</text>
  <text x="868" y="113" text-anchor="middle" font-size="9.5" fill="#475569">SubscribeInvalidate</text>

  <line x1="112" y1="120" x2="112" y2="556" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="290" y1="120" x2="290" y2="556" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="468" y1="120" x2="468" y2="556" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="646" y1="120" x2="646" y2="556" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="868" y1="120" x2="868" y2="556" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="124" y="150" font-size="11.5" font-weight="bold" fill="#1e3a8a">读路径：Get(key) 的四条结局</text>

  <line x1="112" y1="172" x2="290" y2="172" stroke="#2563eb" stroke-width="1.8" marker-end="url(#q1)"/>
  <text x="130" y="167" font-size="9.5" fill="#1e40af">① Get(key)</text>
  <line x1="290" y1="196" x2="112" y2="196" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#q2)"/>
  <text x="130" y="191" font-size="9.5" fill="#15803d">命中：直接返回，无网络往返</text>
  <line x1="112" y1="222" x2="468" y2="222" stroke="#2563eb" stroke-width="1.8" marker-end="url(#q1)"/>
  <text x="130" y="217" font-size="9.5" fill="#1e40af">② L1 未命中 → GET key</text>
  <line x1="468" y1="246" x2="112" y2="246" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#q2)"/>
  <text x="130" y="241" font-size="9.5" fill="#15803d">L2 命中：回填 L1 后返回</text>
  <line x1="112" y1="272" x2="646" y2="272" stroke="#ea580c" stroke-width="1.8" marker-end="url(#q3)"/>
  <text x="130" y="267" font-size="9.5" fill="#9a3412">③ 返回 redis.Nil（确实没有）→ 调 loader 回源</text>
  <line x1="646" y1="296" x2="112" y2="296" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#q4)"/>
  <text x="130" y="291" font-size="9.5" fill="#334155">取到真值</text>
  <line x1="112" y1="322" x2="468" y2="322" stroke="#2563eb" stroke-width="1.8" marker-end="url(#q1)"/>
  <text x="130" y="317" font-size="9.5" fill="#1e40af">SET key v ttl（只有这里写 L2）</text>
  <line x1="112" y1="346" x2="290" y2="346" stroke="#2563eb" stroke-width="1.8" marker-end="url(#q1)"/>
  <text x="130" y="341" font-size="9.5" fill="#1e40af">l1.Set 回填 L1 → 返回</text>
  <text x="124" y="372" font-size="9.5" font-weight="bold" fill="#991b1b">④ 其他错误（超时 / 认证失败）→ 直接返回错误，不回源</text>
  <text x="124" y="390" font-size="9.5" fill="#b91c1c">⚠️ Redis 故障不等于未命中，否则缓存一挂，全量流量直接砸到 DB</text>

  <line x1="38" y1="404" x2="962" y2="404" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="124" y="426" font-size="11.5" font-weight="bold" fill="#14532d">写路径：先库后缓存（Cache Aside），再广播删各节点 L1</text>

  <line x1="112" y1="448" x2="646" y2="448" stroke="#ea580c" stroke-width="1.8" marker-end="url(#q3)"/>
  <text x="130" y="443" font-size="9.5" fill="#9a3412">先更新 DB（权威源必须成功）</text>
  <line x1="112" y1="474" x2="468" y2="474" stroke="#2563eb" stroke-width="1.8" marker-end="url(#q1)"/>
  <text x="130" y="469" font-size="9.5" fill="#1e40af">Invalid：DEL key（删 L2）</text>
  <line x1="112" y1="500" x2="468" y2="500" stroke="#2563eb" stroke-width="1.8" marker-end="url(#q1)"/>
  <text x="130" y="495" font-size="9.5" fill="#1e40af">PUBLISH cache:invalidate key</text>
  <line x1="468" y1="526" x2="868" y2="526" stroke="#64748b" stroke-width="1.8" marker-end="url(#q4)"/>
  <text x="486" y="521" font-size="9.5" fill="#334155">推给「此刻在线」的订阅者（不持久化）</text>
  <text x="124" y="550" font-size="9.5" fill="#334155">各节点（含自己）收到后 l1.Delete(key)；此刻掉线的节点永远收不到 → 靠 L1 短 TTL 兜底</text>

  <rect x="30" y="572" width="940" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="46" y="592" font-size="10.5" fill="#334155">⭐ 工程纪律（2.3）：写路径不碰 L1、先库后缓存；强一致 / 频繁变更 / 涉及金额库存的数据不进 L1；L1 必须有容量上限</text>
  <text x="46" y="612" font-size="10.5" fill="#334155">⚠️ 广播不是正确性来源：Pub/Sub 不持久化，掉线窗口的失效消息永久丢失，必须配短 TTL 兜底（2.2）</text>
  <text x="46" y="632" font-size="10" fill="#64748b">时序与分支均出自本篇代码：Shards 256 · LifeWindow 3 秒 · HardMaxCacheSize 512 · 频道 cache:invalidate</text>
</svg>
