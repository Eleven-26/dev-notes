<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" width="1000" height="710" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="710" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">页面置换：同一引用串，四种算法各缺页几次</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">操作系统经典引用串（3 个物理帧、20 次访问）—— 读数见本文第二节的实测</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="960" height="155" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">① 引用串与物理帧（3 帧，20 次访问）</text>

    <rect x="30" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="50" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">7</text>
    <rect x="74" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="94" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">0</text>
    <rect x="118" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="138" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">1</text>
    <rect x="162" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="182" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">2</text>
    <rect x="206" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="226" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">0</text>
    <rect x="250" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="270" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">3</text>
    <rect x="294" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="314" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">0</text>
    <rect x="338" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="358" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">4</text>
    <rect x="382" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="402" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">2</text>
    <rect x="426" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="446" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">3</text>
    <rect x="470" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="490" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">0</text>
    <rect x="514" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="534" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">3</text>
    <rect x="558" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="578" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">2</text>
    <rect x="602" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="622" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">1</text>
    <rect x="646" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="666" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">2</text>
    <rect x="690" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="710" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">0</text>
    <rect x="734" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="754" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">1</text>
    <rect x="778" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="798" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">7</text>
    <rect x="822" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="842" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">0</text>
    <rect x="866" y="56" width="40" height="30" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="886" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">1</text>

    <text x="30" y="112" font-size="12" fill="#334155">物理帧数 = 3；从左往右依次访问这 20 次，每次要么命中、要么缺页换入一帧。</text>
    <text x="30" y="138" font-size="12" fill="#334155">⭐ 同一串访问，换不同算法，缺页次数从 9 到 15 不等 —— 这就是页面置换算法要区分的地方。</text>
  </g>

  <g transform="translate(20,245)">
    <rect x="0" y="0" width="960" height="245" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">② 四种算法的缺页次数（条越短越好）</text>

    <rect x="24" y="44" width="912" height="28" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="58" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#0f172a">算法</text>
    <text x="304" y="58" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#0f172a">缺页次数</text>
    <text x="444" y="58" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#0f172a">缺页率</text>
    <text x="584" y="58" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#0f172a">直观对比</text>

    <rect x="24" y="72" width="912" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="90" dominant-baseline="central" font-size="12" font-weight="bold" fill="#047857">OPT 理论最优</text>
    <text x="304" y="90" dominant-baseline="central" font-size="12" fill="#334155">9</text>
    <text x="444" y="90" dominant-baseline="central" font-size="12" fill="#334155">45.0%</text>
    <rect x="584" y="82" width="149" height="16" rx="3" fill="#047857" opacity="0.75"/>
    <text x="741" y="90" dominant-baseline="central" font-size="11" fill="#047857">下界（要预知未来）</text>

    <rect x="24" y="108" width="912" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="126" dominant-baseline="central" font-size="12" font-weight="bold" fill="#dc2626">FIFO 先进先出</text>
    <text x="304" y="126" dominant-baseline="central" font-size="12" fill="#334155">15</text>
    <text x="444" y="126" dominant-baseline="central" font-size="12" fill="#334155">75.0%</text>
    <rect x="584" y="118" width="248" height="16" rx="3" fill="#dc2626" opacity="0.75"/>
    <text x="840" y="126" dominant-baseline="central" font-size="11" fill="#dc2626">最差</text>

    <rect x="24" y="144" width="912" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="162" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1d4ed8">LRU 最近最少使用</text>
    <text x="304" y="162" dominant-baseline="central" font-size="12" fill="#334155">12</text>
    <text x="444" y="162" dominant-baseline="central" font-size="12" fill="#334155">60.0%</text>
    <rect x="584" y="154" width="198" height="16" rx="3" fill="#1d4ed8" opacity="0.75"/>

    <rect x="24" y="180" width="912" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="198" dominant-baseline="central" font-size="12" font-weight="bold" fill="#b45309">Clock 第二次机会</text>
    <text x="304" y="198" dominant-baseline="central" font-size="12" fill="#334155">14</text>
    <text x="444" y="198" dominant-baseline="central" font-size="12" fill="#334155">70.0%</text>
    <rect x="584" y="190" width="231" height="16" rx="3" fill="#b45309" opacity="0.75"/>
    <text x="823" y="198" dominant-baseline="central" font-size="11" fill="#b45309">访存零开销</text>
  </g>

  <g transform="translate(20,510)">
    <rect x="0" y="0" width="960" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">③ 三个读法（以及为什么内核最终选 Clock）</text>

    <text x="24" y="58" font-size="12.5" fill="#334155">1. OPT = 9 是下界 —— 它要预知未来，现实中拿不到，只用来给其它算法打分。</text>
    <text x="24" y="86" font-size="12.5" fill="#334155">2. FIFO = 15 最差，还有 Belady 异常：帧数变多、缺页反而更多（LRU / OPT 属「栈算法」，不会这样）。</text>
    <text x="24" y="114" font-size="12.5" fill="#334155">3. Clock = 14 略差于 LRU = 12，但每次访存开销几乎为零 —— 在内核路径上这个交换非常划算。</text>
    <text x="24" y="148" font-size="12.5" fill="#b45309">⭐ LRU 要求「每次访存都改时序」（链表 / 时间戳），内核不可接受；Clock 降级成「每页一个访问位」，命中只置位。</text>
  </g>
</svg>
