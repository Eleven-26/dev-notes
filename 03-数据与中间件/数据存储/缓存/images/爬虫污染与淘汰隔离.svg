<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" width="1000" height="810" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="810" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">爬虫污染：根因在淘汰策略，不在雪崩本身</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">要答的不是「雪崩是什么」，而是「能不能定位到淘汰策略缺陷这个根因」</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="960" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">① 根因不是「雪崩」，而是淘汰策略把冷门数据当成了热数据</text>

    <rect x="24" y="56" width="200" height="64" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
    <text x="124" y="88" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#334155">爬虫批量访问冷门数据</text>
    <line x1="224" y1="88" x2="240" y2="88" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>

    <rect x="244" y="56" width="200" height="64" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
    <text x="344" y="88" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#334155">被策略误判为热数据</text>
    <line x1="444" y1="88" x2="460" y2="88" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>

    <rect x="464" y="56" width="200" height="64" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="564" y="88" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#334155">真正的热数据被优先淘汰</text>
    <line x1="664" y1="88" x2="680" y2="88" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>

    <rect x="684" y="56" width="200" height="64" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="784" y="88" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#334155">请求全部回源 → 雪崩</text>

    <text x="24" y="150" font-size="12" fill="#334155">⚠️ LRU 骗自己「最近被访问过」，LFU 骗自己「频率高」—— 批量爬虫把这两个信号同时污染。</text>
  </g>

  <g transform="translate(20,270)">
    <rect x="0" y="0" width="960" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">② 解决优先级：能隔离就隔离，别在淘汰策略上做文章</text>

    <rect x="24" y="48" width="64" height="36" rx="6" fill="#047857"/>
    <text x="56" y="66" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#ffffff">①</text>
    <text x="104" y="66" dominant-baseline="central" font-size="12" fill="#334155">隔离（最优解）—— 不同业务就给爬虫独立实例 / DB index / 命名空间，让它挤自己的空间</text>

    <rect x="24" y="92" width="64" height="36" rx="6" fill="#1d4ed8"/>
    <text x="56" y="110" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#ffffff">②</text>
    <text x="104" y="110" dominant-baseline="central" font-size="12" fill="#334155">热点保护 —— 永不过期 / 超长 TTL；同批热 key 的 TTL 要错落，否则 30 分钟后自个儿形成雪崩</text>

    <rect x="24" y="136" width="64" height="36" rx="6" fill="#7c3aed"/>
    <text x="56" y="154" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#ffffff">③</text>
    <text x="104" y="154" dominant-baseline="central" font-size="12" fill="#334155">监控告警 —— 空间使用量 + 命中率（5 分钟 &lt; 80% 告警）+ 写入量 / key 数突增</text>

    <rect x="24" y="180" width="64" height="36" rx="6" fill="#b45309"/>
    <text x="56" y="198" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#ffffff">④</text>
    <text x="104" y="198" dominant-baseline="central" font-size="12" fill="#334155">调整淘汰策略（最后手段）—— LRU-K / 2Q：访问达 K 次才进候选，过滤一次性扫描</text>

    <rect x="24" y="224" width="64" height="36" rx="6" fill="#dc2626"/>
    <text x="56" y="242" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#ffffff">⑤</text>
    <text x="104" y="242" dominant-baseline="central" font-size="12" fill="#334155">兜底 —— 数据库侧熔断限流（与雪崩一致）</text>
  </g>

  <g transform="translate(20,570)">
    <rect x="0" y="0" width="960" height="215" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">③ 监控与告警：提前发现「热数据正在被挤」</text>

    <rect x="24" y="44" width="912" height="28" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="58" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#0f172a">监控项</text>
    <text x="264" y="58" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#0f172a">阈值示例</text>
    <text x="554" y="58" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#0f172a">含义</text>

    <rect x="24" y="72" width="912" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="90" dominant-baseline="central" font-size="12" fill="#334155">缓存空间使用量</text>
    <text x="264" y="90" dominant-baseline="central" font-size="12" fill="#334155">总量 2G，用到 1.5G / 1.8G 告警</text>
    <text x="554" y="90" dominant-baseline="central" font-size="12" fill="#334155">提前扩容，别等写满</text>

    <rect x="24" y="108" width="912" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="126" dominant-baseline="central" font-size="12" fill="#334155">缓存命中率</text>
    <text x="264" y="126" dominant-baseline="central" font-size="12" fill="#334155">5 分钟内低于 80% 告警</text>
    <text x="554" y="126" dominant-baseline="central" font-size="12" fill="#334155">命中率骤降 = 热点被替换，流量将砸向 DB</text>

    <rect x="24" y="144" width="912" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="162" dominant-baseline="central" font-size="12" fill="#334155">写入量 / key 数突增</text>
    <text x="264" y="162" dominant-baseline="central" font-size="12" fill="#334155">突增即告警</text>
    <text x="554" y="162" dominant-baseline="central" font-size="12" fill="#334155">判断是否有爬虫之类的异常流量</text>

    <text x="24" y="200" font-size="12" fill="#334155">⭐ 用 Prometheus + redis_exporter：监控命中率是发现「热数据被挤出」最快的手段。</text>
  </g>
</svg>
