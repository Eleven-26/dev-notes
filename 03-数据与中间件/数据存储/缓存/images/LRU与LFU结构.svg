<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" width="1000" height="740" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="740" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">LRU 与 LFU：两个 O(1) 淘汰结构</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">LRU 用「哈希表 + 双向链表」记新旧，LFU 用「频率分桶 + minFreq」记冷热 —— 淘汰动作都只碰链表头尾</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="960" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">① LRU：哈希表负责「找到节点」，双向链表负责「维持新旧顺序」</text>

    <rect x="24" y="44" width="200" height="124" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="36" y="63" font-size="12" font-weight="bold" fill="#1d4ed8">哈希表 key → 节点</text>
    <rect x="36" y="72" width="176" height="20" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="124" y="82" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#334155">a → 节点①</text>
    <rect x="36" y="94" width="176" height="20" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="124" y="104" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#334155">b → 节点②</text>
    <rect x="36" y="116" width="176" height="20" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="124" y="126" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#334155">c → 节点③</text>
    <rect x="36" y="138" width="176" height="20" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="124" y="148" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#334155">d → 节点④</text>

    <line x1="224" y1="106" x2="272" y2="106" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arw)"/>
    <text x="228" y="94" font-size="11" fill="#1d4ed8">O(1) 定位</text>

    <text x="290" y="66" font-size="11" fill="#047857">head（最近使用）</text>
    <text x="860" y="66" text-anchor="end" font-size="11" fill="#dc2626">tail（最久未用）</text>
    <rect x="290" y="78" width="120" height="56" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="350" y="99" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1d4ed8">节点①</text>
    <text x="350" y="117" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#94a3b8">a</text>
    <text x="425" y="106" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#64748b">⇄</text>
    <rect x="440" y="78" width="120" height="56" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="500" y="99" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1d4ed8">节点②</text>
    <text x="500" y="117" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#94a3b8">b</text>
    <text x="575" y="106" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#64748b">⇄</text>
    <rect x="590" y="78" width="120" height="56" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="650" y="99" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1d4ed8">节点③</text>
    <text x="650" y="117" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#94a3b8">c</text>
    <text x="725" y="106" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#64748b">⇄</text>
    <rect x="740" y="78" width="120" height="56" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="800" y="99" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#dc2626">节点④</text>
    <text x="800" y="117" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#94a3b8">d</text>

    <text x="290" y="154" font-size="11" fill="#1d4ed8">命中 / 新增 → 移到头部</text>
    <text x="860" y="154" text-anchor="end" font-size="11" fill="#dc2626">容量满 → 删这个</text>
    <text x="24" y="186" font-size="12" fill="#334155">get 命中也要 moveToHead，否则「最近使用」这个信号就丢了；put 淘汰时哈希表与链表必须同步删。</text>
  </g>

  <g transform="translate(20,300)">
    <rect x="0" y="0" width="960" height="235" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">② LFU：频率分桶 + 每桶一条按 LRU 排的双向链表，维护 minFreq 指针</text>

    <rect x="24" y="44" width="912" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="40" y="65" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1d4ed8">freq = 3</text>
    <rect x="150" y="52" width="110" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="205" y="65" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#334155">节点</text>
    <rect x="300" y="52" width="110" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="355" y="65" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#334155">节点</text>
    <text x="440" y="65" dominant-baseline="central" font-size="14" fill="#64748b">…</text>

    <rect x="24" y="96" width="912" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="40" y="117" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1d4ed8">freq = 2</text>
    <rect x="150" y="104" width="110" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="205" y="117" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#334155">节点</text>
    <rect x="300" y="104" width="110" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="355" y="117" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#334155">节点</text>
    <text x="440" y="117" dominant-baseline="central" font-size="14" fill="#64748b">…</text>

    <rect x="24" y="148" width="912" height="42" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
    <text x="40" y="169" dominant-baseline="central" font-size="12" font-weight="bold" fill="#b45309">freq = 1</text>
    <rect x="150" y="156" width="110" height="26" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1"/>
    <text x="205" y="169" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#334155">新数据</text>
    <rect x="300" y="156" width="110" height="26" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="355" y="169" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#dc2626">尾部淘汰</text>
    <text x="440" y="169" dominant-baseline="central" font-size="14" fill="#b45309">← minFreq</text>

    <text x="24" y="212" font-size="12" fill="#334155">命中：把节点从 freq 桶摘出、挂到 freq+1 桶头部；原桶空了且它 == minFreq，则 minFreq++。淘汰永远只碰 minFreq 桶尾部。</text>
  </g>

  <g transform="translate(20,550)">
    <rect x="0" y="0" width="960" height="175" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">③ 两者的取舍：各自的致命缺陷都来自「只用一个信号」</text>

    <rect x="24" y="44" width="912" height="28" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="58" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#0f172a">算法</text>
    <text x="184" y="58" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#0f172a">优点</text>
    <text x="564" y="58" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#0f172a">致命缺陷</text>

    <rect x="24" y="72" width="912" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="87" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1d4ed8">LRU</text>
    <text x="184" y="87" dominant-baseline="central" font-size="12" fill="#334155">符合时间局部性，实现成熟</text>
    <text x="564" y="87" dominant-baseline="central" font-size="12" fill="#b45309">批量扫描污染：只记住「最近」一个信号</text>

    <rect x="24" y="102" width="912" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="117" dominant-baseline="central" font-size="12" font-weight="bold" fill="#047857">LFU</text>
    <text x="184" y="117" dominant-baseline="central" font-size="12" fill="#334155">抗扫描，热点稳定时命中率高</text>
    <text x="564" y="117" dominant-baseline="central" font-size="12" fill="#b45309">新数据频率=1 被饿死、老热点计数粘滞</text>

    <text x="24" y="156" font-size="12" fill="#334155">⭐ 「最久没被用」≠「最没用」—— 两个算法的问题都源于信号单一，于是有了 2Q / LRU-K / W-TinyLFU 这些补第二个信号的变体。</text>
  </g>
</svg>
