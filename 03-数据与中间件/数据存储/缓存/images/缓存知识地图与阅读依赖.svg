<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#334155"/>
    </marker>
    <marker id="arwB" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#2563eb"/>
    </marker>
    <marker id="arwO" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">八篇两条线：主线讲「怎么设计」，支线讲「怎么用、怎么查」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">知识地图 / 流程图 —— 编号、视角与「④→⑤→⑥ 才是完整一条链」「⑦⑧ 可单独读」的依赖关系全部来自本篇第二节</text>

  <g transform="translate(20,84)">
    <rect x="0" y="0" width="960" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" font-size="14" font-weight="bold" fill="#64748b">地基：先把「选什么、备多大、淘汰谁」定下来</text>

    <rect x="20" y="42" width="280" height="72" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <text x="160" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">① 缓存选型对比</text>
    <text x="160" y="86" text-anchor="middle" font-size="11" fill="#64748b">与权威库的分工、本地族 vs</text>
    <text x="160" y="102" text-anchor="middle" font-size="11" fill="#64748b">中心化族、起点资产决策线</text>

    <rect x="340" y="42" width="280" height="72" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <text x="480" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">② 缓存容量与治理</text>
    <text x="480" y="86" text-anchor="middle" font-size="11" fill="#64748b">容量扛不住怎么办、多级缓存</text>
    <text x="480" y="102" text-anchor="middle" font-size="11" fill="#64748b">的 L1 一致性（含 Go 实现）</text>

    <rect x="660" y="42" width="280" height="72" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <text x="800" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">③ 缓存淘汰算法</text>
    <text x="800" y="86" text-anchor="middle" font-size="11" fill="#64748b">LRU / LFU / W-TinyLFU</text>
    <text x="800" y="102" text-anchor="middle" font-size="11" fill="#64748b">的原理与取舍</text>
  </g>

  <g transform="translate(20,254)">
    <rect x="0" y="0" width="960" height="170" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" font-size="14" font-weight="bold" fill="#1d4ed8">主线核心：模式 → 一致性 → 故障形态（三篇连起来才是完整一条链）</text>

    <rect x="20" y="42" width="270" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="155" y="64" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">④ 缓存架构与模式 ⭐</text>
    <text x="155" y="86" text-anchor="middle" font-size="11" fill="#334155">缓存放哪一层、Cache Aside</text>
    <text x="155" y="102" text-anchor="middle" font-size="11" fill="#334155">与多级缓存 —— 建立「链路」整体观</text>
    <text x="155" y="124" text-anchor="middle" font-size="11" fill="#1d4ed8">只读两篇的话，它是其一</text>

    <line x1="290" y1="88" x2="344" y2="88" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arwB)"/>
    <text x="317" y="78" text-anchor="middle" font-size="10.5" fill="#2563eb">写完不一致怎么办</text>

    <rect x="346" y="42" width="270" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="481" y="64" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">⑤ 缓存一致性</text>
    <text x="481" y="86" text-anchor="middle" font-size="11" fill="#334155">与数据库的双写顺序、</text>
    <text x="481" y="102" text-anchor="middle" font-size="11" fill="#334155">失效与补偿</text>
    <text x="481" y="124" text-anchor="middle" font-size="11" fill="#64748b">对照面是 MySQL 的复制语义</text>

    <line x1="616" y1="88" x2="670" y2="88" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arwB)"/>
    <text x="643" y="78" text-anchor="middle" font-size="10.5" fill="#2563eb">用上之后仍会出的故障</text>

    <rect x="672" y="42" width="270" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="807" y="64" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">⑥ 缓存问题与方案 ⭐</text>
    <text x="807" y="86" text-anchor="middle" font-size="11" fill="#334155">雪崩、击穿、穿透、热 key、大 key</text>
    <text x="807" y="102" text-anchor="middle" font-size="11" fill="#334155">—— 线上真会踩的坑</text>
    <text x="807" y="124" text-anchor="middle" font-size="11" fill="#1d4ed8">只读两篇的话，它是其二</text>

    <text x="16" y="158" font-size="11.5" fill="#64748b">顺序依赖写在第二节的注里：④ 讲模式（放哪、怎么写）→ ⑤ 接「写完不一致怎么办」→ ⑥ 是前两者都用上之后仍会出现的故障形态。</text>
  </g>

  <g transform="translate(20,444)">
    <rect x="0" y="0" width="960" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" font-size="14" font-weight="bold" fill="#ea580c">支线：另一条线，不依赖 ①~⑥ 的阅读顺序，可单独读</text>

    <rect x="20" y="40" width="440" height="36" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
    <text x="240" y="62" text-anchor="middle" font-size="11.5" fill="#334155">⑦ 缓存应用场景：缓存不止加速读（锁 / 限流 / 会话 / 排行榜…）</text>

    <rect x="500" y="40" width="440" height="36" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
    <text x="720" y="62" text-anchor="middle" font-size="11.5" fill="#334155">⑧ 缓存运维与排查：线上出事怎么定位（指标 / 大热 key / 阻塞命令）</text>
  </g>

  <text x="500" y="556" text-anchor="middle" font-size="11.5" fill="#64748b">边界（篇首 ⭐ 引语）：NoSQL/Redis/ 是组件手册（命令、数据结构、部署）；本目录是架构决策（怎么在它前面加一层）。</text>
</svg>
