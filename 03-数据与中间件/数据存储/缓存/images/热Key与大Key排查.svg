<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 476" width="1000" height="476" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="476" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">热 key 与大 key：两种不同性质的瓶颈，两条排查链</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">热 key 的瓶颈在「单分片 CPU 倾斜」，大 key 的瓶颈在「单次操作的阻塞时间」—— 解法完全不同</text>

  <g transform="translate(20,80)">
    <rect x="0" y="0" width="440" height="376" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#7c2d12">热 key：单 key 的 QPS 打满一个分片</text>
    <text x="16" y="52" font-size="12" fill="#9a3412">特征：整体负载不高，但某个 Redis 实例 / 分片 CPU 跑满</text>

    <rect x="16" y="66" width="408" height="60" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.3"/>
    <text x="32" y="90" font-size="13.5" font-weight="bold" fill="#7c2d12">① 发现：找出「被访问最多的 key」</text>
    <text x="32" y="111" font-size="11.5" fill="#334155">`redis-cli --hotkeys`（需 LFU 策略）· `MONITOR` 抽样 · 客户端埋点计数</text>

    <rect x="16" y="140" width="408" height="60" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.3"/>
    <text x="32" y="164" font-size="13.5" font-weight="bold" fill="#7c2d12">② 定位：确认是不是「分片倾斜」</text>
    <text x="32" y="185" font-size="11.5" fill="#334155">看各实例 CPU / `INFO commandstats` 是否只集中在某一个分片</text>

    <rect x="16" y="214" width="408" height="60" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.3"/>
    <text x="32" y="238" font-size="13.5" font-weight="bold" fill="#7c2d12">③ 处理：挡一层 + 打散 + 分流（按代价从低到高）</text>
    <text x="32" y="259" font-size="11.5" fill="#334155">本地缓存挡最近最热 → key 加随机后缀散到多分片 → 读写分离 / 多副本</text>

    <rect x="16" y="288" width="408" height="60" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.3"/>
    <text x="32" y="312" font-size="13.5" font-weight="bold" fill="#7c2d12">④ 兜底：限流 + 降级</text>
    <text x="32" y="333" font-size="11.5" fill="#334155">热点突发的根因常是业务事件（秒杀 / 明星离婚），限流是最后一道闸</text>

    <text x="16" y="368" font-size="11.5" fill="#9a3412">⚠️ 加后缀打散后，读要 N 个都查（或路由到一个），写要 N 个都写 —— 复杂度上来了</text>
  </g>

  <g transform="translate(520,80)">
    <rect x="0" y="0" width="440" height="376" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#7f1d1d">大 key：单次操作阻塞主线程</text>
    <text x="16" y="52" font-size="12" fill="#b91c1c">特征：QPS 不高，但偶发卡顿 / 慢查询 / 网络带宽突刺</text>

    <rect x="16" y="66" width="408" height="60" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
    <text x="32" y="90" font-size="13.5" font-weight="bold" fill="#7f1d1d">① 发现：扫描体量异常的 key</text>
    <text x="32" y="111" font-size="11.5" fill="#334155">`redis-cli --bigkeys`（抽样）· 慢查询日志 · `MEMORY USAGE key`</text>

    <rect x="16" y="140" width="408" height="60" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
    <text x="32" y="164" font-size="13.5" font-weight="bold" fill="#7f1d1d">② 定位：按类型量体量</text>
    <text x="32" y="185" font-size="11.5" fill="#334155">`STRLEN` / `HLEN` / `LLEN` / `SCARD` / `ZCARD` —— 别用 `KEYS *` 扫全库</text>

    <rect x="16" y="214" width="408" height="60" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
    <text x="32" y="238" font-size="13.5" font-weight="bold" fill="#7f1d1d">③ 处理：拆（分片 / 换结构）</text>
    <text x="32" y="259" font-size="11.5" fill="#334155">大 Hash 按 field 拆、大 List 按段拆、大 String 改存引用（对象存储）</text>

    <rect x="16" y="288" width="408" height="60" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
    <text x="32" y="312" font-size="13.5" font-weight="bold" fill="#7f1d1d">④ 兜底：删除用异步命令</text>
    <text x="32" y="333" font-size="11.5" fill="#334155">`UNLINK` 后台回收内存，别用 `DEL`（O(n) 同步释放，直接卡主线程）</text>

    <text x="16" y="368" font-size="11.5" fill="#b91c1c">⚠️ 拆分后要保证「一次业务读」不会变成 N 次往返：批量化走 Pipeline / MGET</text>
  </g>
</svg>
