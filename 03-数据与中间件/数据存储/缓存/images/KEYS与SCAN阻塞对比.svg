<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="kA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="kB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">为什么 `KEYS *` 要禁用：单线程被一条命令占住</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">库内 10 万个键；同一实例上另一连接持续发 PING，看它被拖慢多少（实测 5 次取中位数）</text>

  <rect x="20" y="84" width="960" height="190" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="36" y="110" font-size="14" font-weight="bold" fill="#b91c1c">`KEYS *`：O(N) 全量扫描，一条命令跑完才轮到别人</text>

  <line x1="110" y1="190" x2="900" y2="190" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="110" y="140" width="700" height="42" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.6"/>
  <text x="460" y="167" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">KEYS * 执行 61.8 ms（占用唯一执行线程）</text>
  <text x="110" y="206" text-anchor="middle" font-size="10.5" fill="#64748b">0 ms</text>
  <text x="900" y="206" text-anchor="middle" font-size="10.5" fill="#64748b">70 ms</text>

  <line x1="144" y1="244" x2="618" y2="244" stroke="#dc2626" stroke-width="1.8" marker-end="url(#kA)"/>
  <circle cx="144" cy="244" r="4" fill="#dc2626"/>
  <text x="381" y="236" text-anchor="middle" font-size="11.5" fill="#b91c1c">同一时刻发出的 PING，40.5 ms 后才拿到回复</text>
  <text x="381" y="264" text-anchor="middle" font-size="11" fill="#64748b">PING 的延迟被拉到与 KEYS 同量级 ⇒ 整个实例卡住</text>

  <rect x="20" y="290" width="960" height="190" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="36" y="316" font-size="14" font-weight="bold" fill="#15803d">`SCAN`：单次调用极短，全量遍历摊到多次往返（不阻塞）</text>

  <line x1="110" y1="396" x2="900" y2="396" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="110" y="350" width="125" height="38" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="243" y="350" width="125" height="38" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="376" y="350" width="125" height="38" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="509" y="350" width="125" height="38" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="642" y="350" width="125" height="38" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="775" y="350" width="125" height="38" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="172" y="374" text-anchor="middle" font-size="11" fill="#14532d">0.95 ms</text>
  <text x="837" y="374" text-anchor="middle" font-size="11" fill="#64748b">继续…</text>
  <text x="110" y="412" text-anchor="middle" font-size="10.5" fill="#64748b">0 ms</text>
  <text x="900" y="412" text-anchor="middle" font-size="10.5" fill="#64748b">6 ms</text>

  <line x1="240" y1="450" x2="385" y2="450" stroke="#16a34a" stroke-width="1.8" marker-end="url(#kB)"/>
  <circle cx="240" cy="450" r="4" fill="#16a34a"/>
  <text x="312" y="442" text-anchor="middle" font-size="11.5" fill="#15803d">PING 1.1 ms 就返回</text>
  <text x="312" y="470" text-anchor="middle" font-size="11" fill="#64748b">⚠️ SCAN 不阻塞，但全量遍历 100 次调用合计 118 ms —— 仍要限流、避开高峰</text>
</svg>
