<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">五条导入通道：先看数据在哪，再看一次多少</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">绿 = 同步（返回即终态）；黄 = 异步（必须轮询到 FINISHED）</text>

  <rect x="20" y="78" width="960" height="34" fill="#334155" rx="6"/>
  <text x="34" y="100" font-size="11" font-weight="bold" fill="#ffffff">数据在哪</text>
  <text x="264" y="100" font-size="11" font-weight="bold" fill="#ffffff">用哪条通道</text>
  <text x="484" y="100" font-size="11" font-weight="bold" fill="#ffffff">单作业量级</text>
  <text x="684" y="100" font-size="11" font-weight="bold" fill="#ffffff">同步 / 异步</text>
  <text x="800" y="100" font-size="11" font-weight="bold" fill="#ffffff">要记住的一句</text>

  <rect x="20" y="112" width="960" height="54" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
  <text x="34" y="135" font-size="11" font-weight="bold" fill="#14532d">本地文件、程序数据流</text>
  <text x="34" y="153" font-size="10" fill="#14532d">HTTP 协议，唯一走 HTTP 的一条</text>
  <text x="264" y="144" font-size="12" font-weight="bold" fill="#14532d">Stream Load</text>
  <text x="484" y="144" font-size="10.5" fill="#14532d">10 GB 以内</text>
  <text x="684" y="144" font-size="10.5" font-weight="bold" fill="#14532d">同步</text>
  <text x="800" y="138" font-size="10" fill="#14532d">重试沿用同一 label</text>
  <text x="800" y="154" font-size="10" fill="#14532d">就不会写重</text>

  <rect x="20" y="172" width="960" height="54" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
  <text x="34" y="195" font-size="11" font-weight="bold" fill="#92400e">HDFS、S3、OSS、COS、MinIO</text>
  <text x="34" y="213" font-size="10" fill="#92400e">对象存储与分布式文件系统</text>
  <text x="264" y="204" font-size="12" font-weight="bold" fill="#92400e">Broker Load</text>
  <text x="484" y="204" font-size="10.5" fill="#92400e">数十 GB 到数百 GB</text>
  <text x="684" y="204" font-size="10.5" font-weight="bold" fill="#92400e">异步</text>
  <text x="800" y="198" font-size="10" fill="#92400e">「创建成功」≠</text>
  <text x="800" y="214" font-size="10" fill="#92400e">「数据到了」</text>

  <rect x="20" y="232" width="960" height="54" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
  <text x="34" y="255" font-size="11" font-weight="bold" fill="#92400e">Kafka</text>
  <text x="34" y="273" font-size="10" fill="#92400e">流式数据源</text>
  <text x="264" y="264" font-size="12" font-weight="bold" fill="#92400e">Routine Load</text>
  <text x="484" y="264" font-size="10.5" fill="#92400e">MB 到 GB 的微批</text>
  <text x="684" y="264" font-size="10.5" font-weight="bold" fill="#92400e">异步</text>
  <text x="800" y="258" font-size="10" fill="#92400e">常驻线程持续消费</text>
  <text x="800" y="274" font-size="10" fill="#92400e">不是一次性的作业</text>

  <rect x="20" y="292" width="960" height="54" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
  <text x="34" y="315" font-size="11" font-weight="bold" fill="#92400e">HDFS、Hive（首次搬迁）</text>
  <text x="34" y="333" font-size="10" fill="#92400e">要全局字典精确去重时</text>
  <text x="264" y="324" font-size="12" font-weight="bold" fill="#92400e">Spark Load</text>
  <text x="484" y="324" font-size="10.5" fill="#92400e">数十 GB 到 TB</text>
  <text x="684" y="324" font-size="10.5" font-weight="bold" fill="#92400e">异步</text>
  <text x="800" y="318" font-size="10" fill="#92400e">五阶段里唯一有</text>
  <text x="800" y="334" font-size="10" fill="#92400e">ETL 阶段的一条</text>

  <rect x="20" y="352" width="960" height="54" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
  <text x="34" y="375" font-size="11" font-weight="bold" fill="#14532d">StarRocks 表、外部表</text>
  <text x="34" y="393" font-size="10" fill="#14532d">库内搬数、简单 ETL</text>
  <text x="264" y="384" font-size="12" font-weight="bold" fill="#14532d">INSERT ... SELECT</text>
  <text x="484" y="384" font-size="10.5" fill="#14532d">取决于内存</text>
  <text x="684" y="384" font-size="10.5" font-weight="bold" fill="#14532d">同步</text>
  <text x="800" y="378" font-size="10" fill="#14532d">量级不由「同步」</text>
  <text x="800" y="394" font-size="10" fill="#14532d">决定，由内存决定</text>

  <rect x="10" y="412" width="980" height="48" fill="#ffffff" stroke="none"/>
  <text x="20" y="430" font-size="10.5" fill="#334155">判据顺序：① 数据在哪 → ② 一次多少 → ③ 要不要等结果（同步 / 异步），三问答完只剩一条</text>
  <text x="20" y="450" font-size="9.5" fill="#991b1b">Exactly-Once = 调用方的 At-Least-Once × StarRocks 的 At-Most-Once（label 保证，记录默认只留 3 天）</text>
</svg>
