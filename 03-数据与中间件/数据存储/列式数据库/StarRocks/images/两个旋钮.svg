<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="360" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">两个旋钮：一个管边界，一个管并行</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">它们常被当成一个「分片」概念，其实是完全不同的事</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="470" height="214" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <rect x="14" y="16" width="442" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="28" y="39" font-size="13" font-weight="bold" fill="#14532d">分区 PARTITION — 管「数据的边界」</text>

    <text x="14" y="76" font-size="10.5" fill="#14532d">决定什么：生命周期、冷热介质、副本数、按分区删数据</text>
    <text x="14" y="98" font-size="10.5" fill="#14532d">怎么切：表达式分区（推荐）／ Range ／ List</text>
    <text x="14" y="120" font-size="10.5" fill="#14532d">切多细：单分区量大按天、量小按月（省元数据）</text>
    <text x="14" y="142" font-size="10.5" fill="#14532d">能不能改：能，加分区 / 删分区都是元数据操作</text>
    <text x="14" y="172" font-size="10" font-weight="bold" fill="#991b1b">切太碎的代价：分区数是 FE 元数据内存的主因</text>
    <text x="14" y="194" font-size="10" fill="#64748b">按小时分区、留两年 = 17520 个分区</text>
  </g>

  <g transform="translate(510,74)">
    <rect x="0" y="0" width="470" height="214" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <rect x="14" y="16" width="442" height="34" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="28" y="39" font-size="13" font-weight="bold" fill="#92400e">分桶 BUCKET — 管「并行与裁剪」</text>

    <text x="14" y="76" font-size="10.5" fill="#92400e">决定什么：按分桶键过滤能省几分之一、并行度、倾斜</text>
    <text x="14" y="98" font-size="10.5" fill="#92400e">怎么切：随机分桶（默认，仅明细表）／ 哈希分桶</text>
    <text x="14" y="120" font-size="10.5" fill="#92400e">多少个：v2.5.7 起默认自动；目标是 1~10 GB 一个 tablet</text>
    <text x="14" y="142" font-size="10.5" fill="#92400e">能不能改：v3.2 起可 ALTER，v3.3.3 起可在线改</text>
    <text x="14" y="172" font-size="10" font-weight="bold" fill="#991b1b">选错的代价：均匀与裁剪是一对矛盾</text>
    <text x="14" y="194" font-size="10" fill="#64748b">加列能打散倾斜，但单列过滤的裁剪就失效了</text>
  </g>

  <rect x="20" y="300" width="960" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="500" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">分区数 × 分桶数 × 副本数 = 这张表的 tablet 总数（也是 FE 要记的元数据量）</text>
</svg>
