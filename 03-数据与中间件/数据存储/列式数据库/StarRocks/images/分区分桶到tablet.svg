<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwG" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="400" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一份数据被切成什么：分区 → 分桶 → tablet</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">示例：按天分区、哈希分桶 site_id、3 副本</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="600" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 一张表落到盘上的完整路径</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">分区数 × 分桶数 × 副本数 = 这张表的 tablet 总数</text>

    <rect x="20" y="52" width="560" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="34" y="70" font-size="11.5" font-weight="bold" fill="#1e40af">表 orders</text>
    <text x="34" y="87" font-size="10" fill="#1e40af">ORDER BY / KEY 定排序，PARTITION BY 定分区，DISTRIBUTED BY 定分桶</text>

    <line x1="300" y1="96" x2="300" y2="110" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="150" y1="110" x2="450" y2="110" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="150" y1="110" x2="150" y2="120" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="450" y1="110" x2="450" y2="120" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="50" y="120" width="200" height="38" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="60" y="138" font-size="11" font-weight="bold" fill="#14532d">分区 p20261101</text>
    <text x="60" y="152" font-size="9.5" fill="#14532d">可单独设副本数 / 冷热 / TTL</text>

    <rect x="350" y="120" width="200" height="38" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="360" y="138" font-size="11" font-weight="bold" fill="#14532d">分区 p20261102</text>
    <text x="360" y="152" font-size="9.5" fill="#14532d">删整个分区是一次元数据操作</text>

    <line x1="150" y1="158" x2="150" y2="178" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>
    <text x="160" y="172" font-size="9.5" fill="#16a34a">分区内再切桶</text>

    <rect x="24" y="182" width="126" height="42" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="34" y="200" font-size="10.5" font-weight="bold" fill="#92400e">bucket 0</text>
    <text x="34" y="215" font-size="9.5" fill="#92400e">hash(site_id) 落桶</text>

    <rect x="166" y="182" width="126" height="42" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="176" y="200" font-size="10.5" font-weight="bold" fill="#92400e">bucket 1</text>
    <text x="176" y="215" font-size="9.5" fill="#92400e">等值过滤只扫命中桶</text>

    <rect x="308" y="182" width="126" height="42" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="318" y="200" font-size="10.5" font-weight="bold" fill="#92400e">bucket 2</text>
    <text x="318" y="215" font-size="9.5" fill="#92400e">每桶在每个副本上一份</text>

    <text x="450" y="200" font-size="10" fill="#64748b">← 每个桶 × 3 副本</text>
    <text x="450" y="216" font-size="10" fill="#64748b">　= 3 个 tablet</text>

    <text x="24" y="252" font-size="10" fill="#334155">副本是分区级属性：月内热数据 3 份、去年冷数据 1 份，同一张表可以并存</text>
    <text x="24" y="272" font-size="10" fill="#334155">修复、迁移、均衡都以 tablet 为单位，不是以表或分区为单位</text>
    <text x="24" y="290" font-size="9.5" fill="#991b1b">分桶数不是终身制：v3.2 起可 ALTER，v3.3.3 起可在线改（存算分离不支持在线）</text>
  </g>

  <g transform="translate(640,74)">
    <rect x="0" y="0" width="340" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 三层各管一件事</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">混起来就会问出没有统一答案的问题</text>

    <rect x="14" y="54" width="312" height="74" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="74" font-size="11.5" font-weight="bold" fill="#14532d">分区 = 管理单位</text>
    <text x="28" y="92" font-size="10" fill="#14532d">决定生命周期：TTL、冷热介质、副本数</text>
    <text x="28" y="110" font-size="10" fill="#14532d">按分区删数据 = 元数据操作，最快</text>

    <rect x="14" y="140" width="312" height="74" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="160" font-size="11.5" font-weight="bold" fill="#92400e">分桶 = 并行与裁剪单位</text>
    <text x="28" y="178" font-size="10" fill="#92400e">决定「按这个键过滤能省几分之一」</text>
    <text x="28" y="196" font-size="10" fill="#92400e">目标是每个 tablet 落在 1~10 GB</text>

    <rect x="14" y="226" width="312" height="62" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="246" font-size="11.5" font-weight="bold" fill="#1e40af">tablet = 复制与调度单位</text>
    <text x="28" y="264" font-size="10" fill="#1e40af">副本掉了补的是它，不是整张表</text>
  </g>
</svg>
