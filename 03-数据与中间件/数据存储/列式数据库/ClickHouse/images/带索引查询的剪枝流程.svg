<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="pnA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一次带索引查询的剪枝流程（标注为容器实测真值）</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">容器 clickhouse-server 26.3-alpine / 26.3.29.7 · 表 events：1000 万行 · PARTITION BY toDate(event_time) · ORDER BY (city, user_id)</text>

  <rect x="60" y="78" width="500" height="48" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="310" y="100" text-anchor="middle" font-size="12" fill="#0f172a">查询：SELECT count() FROM events WHERE city='北京' AND user_id=123456</text>
  <text x="310" y="118" text-anchor="middle" font-size="11.5" fill="#b91c1c">（下方第 ③ 步的 Skip 分支改用 url 谓词演示，见标注）</text>

  <line x1="310" y1="126" x2="310" y2="138" stroke="#64748b" stroke-width="1.8" marker-end="url(#pnA)"/>

  <rect x="60" y="138" width="500" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="310" y="159" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">① 分区级剪枝（MinMax + Partition）</text>
  <text x="310" y="179" text-anchor="middle" font-size="11.5" fill="#1d4ed8">Condition: true · Parts 11/11 · Granules 1231/1231（本例分区键未参与谓词，未剪）</text>

  <line x1="310" y1="190" x2="310" y2="202" stroke="#64748b" stroke-width="1.8" marker-end="url(#pnA)"/>

  <rect x="60" y="202" width="500" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="310" y="223" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">② 一级索引 PrimaryKey（稀疏索引）</text>
  <text x="310" y="241" text-anchor="middle" font-size="11.5" fill="#166534">Search Algorithm: binary search · Parts 10/11 · Granules 10/1231 · Ranges 10</text>
  <text x="310" y="254" text-anchor="middle" font-size="11" fill="#166534">条件区间 ∩ MarkRange：and((user_id in [123456,123456]), (city in ['北京','北京']))</text>

  <line x1="310" y1="260" x2="310" y2="272" stroke="#64748b" stroke-width="1.8" marker-end="url(#pnA)"/>

  <rect x="60" y="272" width="500" height="58" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="310" y="293" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">③ 二级（跳数）索引 Skip 分支</text>
  <text x="310" y="311" text-anchor="middle" font-size="11.5" fill="#9a3412">Name: idx_bf_url · Description: bloom_filter GRANULARITY 4</text>
  <text x="310" y="324" text-anchor="middle" font-size="11.5" fill="#9a3412">Parts 10/10 · Granules 160/1230（在 ①② 之后继续剪）</text>

  <line x1="310" y1="330" x2="310" y2="342" stroke="#64748b" stroke-width="1.8" marker-end="url(#pnA)"/>

  <rect x="60" y="342" width="500" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="310" y="363" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">④ 读数据（MarkRange → .cmrk2 → 压缩块）</text>
  <text x="310" y="382" text-anchor="middle" font-size="11.5" fill="#991b1b">read_rows = 160 × 8192 = 1,310,720 · read_bytes 208,889,400 → 27,372,220</text>

  <rect x="596" y="78" width="344" height="316" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="768" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">同一条查询的三种命运（实测对照）</text>

  <rect x="614" y="112" width="308" height="78" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="768" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">命中主键前缀 (city, user_id)</text>
  <text x="768" y="151" text-anchor="middle" font-size="11.5" fill="#166534">binary search → Granules 10/1231</text>
  <text x="768" y="170" text-anchor="middle" font-size="11.5" fill="#166534">read_rows 81,920（=10 × 8192）</text>
  <text x="768" y="185" text-anchor="middle" font-size="11" fill="#166534">耗时区间 14 ~ 20 ms</text>

  <rect x="614" y="198" width="308" height="78" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="768" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">仅 user_id（非主键前缀）</text>
  <text x="768" y="237" text-anchor="middle" font-size="11.5" fill="#9a3412">generic exclusion search → 150/1231</text>
  <text x="768" y="256" text-anchor="middle" font-size="11.5" fill="#9a3412">read_rows 1,228,800（=150 × 8192）</text>
  <text x="768" y="271" text-anchor="middle" font-size="11" fill="#9a3412">并不退化成全表扫描</text>

  <rect x="614" y="284" width="308" height="94" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="768" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">对照表 events_alt（ORDER BY event_time）</text>
  <text x="768" y="323" text-anchor="middle" font-size="11.5" fill="#991b1b">PrimaryKey Condition: true</text>
  <text x="768" y="342" text-anchor="middle" font-size="11.5" fill="#991b1b">Granules 980/980（全读）</text>
  <text x="768" y="361" text-anchor="middle" font-size="11.5" fill="#991b1b">read_rows 8,000,000 · 耗时 37 ~ 147 ms</text>
  <text x="768" y="374" text-anchor="middle" font-size="11" fill="#991b1b">这就是 ORDER BY 选错列的代价</text>

  <text x="60" y="418" font-size="12" fill="#0f172a">读法要点：三级剪枝是「按代价递增依次尝试」而非全跑一遍 —— 能靠前一级剪掉的绝不留给下一级；Skip 分支只在其谓词真有区分度时才出现。</text>
  <text x="60" y="440" font-size="12" fill="#0f172a">换算要点：read_rows = SelectedMarks × 8192 在两个非全扫例子里精确成立，「读了几个 granule」就等于「读了多少行」。</text>
  <text x="60" y="462" font-size="12" fill="#0f172a">⚠️ 排查要点：判断跳过索引是否生效，用 EXPLAIN indexes=1 的 Skip 分支或 read_rows，不要用 ProfileEvents['SelectedMarks']（实测它不随剪枝变化）。</text>
  <text x="60" y="484" font-size="12" fill="#0f172a">⚠️ 口径要点：读数前必须 SET use_query_condition_cache=0，否则第二次起 granule 结论被缓存、read_rows 逐次下降，两次运行的数字不能混用。</text>
  <text x="60" y="506" font-size="11.5" fill="#64748b">耗时为区间（每查询连跑 3 次），只断言趋势：全扫 37 ~ 147 ms 明显慢于主键命中的 14 ~ 20 ms；容器读数波动大，不写单点值。</text>
  <text x="60" y="528" font-size="11.5" fill="#64748b">本图全部数字取自本目录容器实测（实验 03 / 04），非书本复述；书中 2020 口径的 marks 读法见正文对应小节。</text>
</svg>
