<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="evA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Yandex.Metrica 底层四次换架构：每版解掉上一版的痛点、再留下新痛点</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">内容出处：第四节演进表格 + 4.1 两个关键取舍 + 节末历史量级引言（2020 版口径，非当前承诺）</text>

  <line x1="40" y1="100" x2="944" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#evA)"/>
  <circle cx="140" cy="100" r="5" fill="#94a3b8"/>
  <circle cx="380" cy="100" r="5" fill="#94a3b8"/>
  <circle cx="620" cy="100" r="5" fill="#94a3b8"/>
  <circle cx="860" cy="100" r="5" fill="#94a3b8"/>
  <line x1="140" y1="100" x2="140" y2="124" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="380" y1="100" x2="380" y2="124" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="620" y1="100" x2="620" y2="124" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="860" y1="100" x2="860" y2="124" stroke="#94a3b8" stroke-width="1.4"/>

  <rect x="30" y="124" width="220" height="200" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="140" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">① MySQL（MyISAM）</text>
  <text x="140" y="172" text-anchor="middle" font-size="11.5" fill="#0f172a">索引：B+ 树</text>
  <text x="140" y="192" text-anchor="middle" font-size="11.5" fill="#0f172a">数据：单独文件</text>
  <text x="140" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">痛点：并行随机写</text>
  <text x="140" y="238" text-anchor="middle" font-size="11.5" fill="#0f172a">→ 物理随机存储</text>
  <text x="140" y="258" text-anchor="middle" font-size="11.5" fill="#0f172a">→ 磁盘碎片</text>
  <text x="140" y="286" text-anchor="middle" font-size="11.5" fill="#64748b">瓶颈：磁盘寻道</text>

  <rect x="270" y="124" width="220" height="200" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="380" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">② Metrage</text>
  <text x="380" y="172" text-anchor="middle" font-size="11.5" fill="#0f172a">模型：数据 KV 化</text>
  <text x="380" y="192" text-anchor="middle" font-size="11.5" fill="#0f172a">索引：换 LSM 树</text>
  <text x="380" y="212" text-anchor="middle" font-size="11.5" fill="#0f172a">聚合：预聚合立方体</text>
  <text x="380" y="236" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">解掉：随机存储查询慢</text>
  <text x="380" y="260" text-anchor="middle" font-size="11.5" fill="#b91c1c">遗留：内置固定场景</text>
  <text x="380" y="280" text-anchor="middle" font-size="11.5" fill="#b91c1c">遗留：维度爆炸 2^N</text>

  <rect x="510" y="124" width="220" height="200" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="620" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">③ OLAPServer</text>
  <text x="620" y="172" text-anchor="middle" font-size="11.5" fill="#0f172a">模型：关系 + SQL</text>
  <text x="620" y="192" text-anchor="middle" font-size="11.5" fill="#0f172a">索引：稀疏索引</text>
  <text x="620" y="212" text-anchor="middle" font-size="11.5" fill="#0f172a">数据段 + 列式存储</text>
  <text x="620" y="236" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">解掉：固定场景与</text>
  <text x="620" y="254" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">KV 描述能力不足</text>
  <text x="620" y="278" text-anchor="middle" font-size="11.5" fill="#b91c1c">遗留：只有一种数据类型</text>
  <text x="620" y="298" text-anchor="middle" font-size="11.5" fill="#b91c1c">缺 DDL → 不成 DBMS</text>

  <rect x="750" y="124" width="220" height="200" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="860" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">④ ClickHouse</text>
  <text x="860" y="172" text-anchor="middle" font-size="11.5" fill="#0f172a">以 OLAPServer 为基础</text>
  <text x="860" y="192" text-anchor="middle" font-size="11.5" fill="#0f172a">补齐完备 DBMS 能力</text>
  <text x="860" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c2d12">预聚合与实时聚合</text>
  <text x="860" y="234" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c2d12">之间定取舍</text>
  <text x="860" y="262" text-anchor="middle" font-size="11.5" fill="#0f172a">2016 年开源</text>
  <text x="860" y="282" text-anchor="middle" font-size="11.5" fill="#0f172a">倾向实时聚合</text>

  <rect x="50" y="340" width="900" height="102" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="66" y="362" font-size="11.5" fill="#0f172a">要点一 为什么用 LSM 树换掉 B+ 树：7200 转 SATA 盘约 100 IOPS，即每秒只能随机读 100 次；假设一次随机读 10 行，查 10 万行至少 100 秒。</text>
  <text x="66" y="384" font-size="11.5" fill="#0f172a">由此得到的原则是「按顺序存储的数据拥有更高的查询性能」：LSM 树写入先在内存建小树（配 WAL 防丢），达阈值后由后台刷成局部有序的数据段，</text>
  <text x="66" y="406" font-size="11.5" fill="#0f172a">于是才能用稀疏索引定位数据段、拿到顺序读与预读缓存。</text>
  <text x="66" y="430" font-size="11.5" fill="#b45309">要点二 为什么最终放弃预聚合：立方体要预算全部维度组合（2^N，5 维 32 种、9 维 512 种），高基数下膨胀 10~20 倍、千万级涨到亿级，且更新滞后。</text>

  <rect x="50" y="456" width="296" height="52" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="198" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">2011 年 单库超 5800 亿行</text>
  <text x="198" y="498" text-anchor="middle" font-size="11" fill="#78350f">90% 报表 26 秒返回</text>
  <rect x="352" y="456" width="296" height="52" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="500" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">2015 年 超 3 万亿行</text>
  <text x="500" y="498" text-anchor="middle" font-size="11" fill="#78350f">降到 1 秒内</text>
  <rect x="654" y="456" width="296" height="52" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="802" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">开源时 超 20 万亿行</text>
  <text x="802" y="498" text-anchor="middle" font-size="11" fill="#78350f">90% 查询 1 秒内</text>

  <text x="50" y="532" font-size="11" fill="#64748b">口径提醒：上排三个量级是旧资料口径的历史读数，不代表当前承诺；当前的发版节奏、贡献者规模等未核实，本图不写。</text>
  <text x="50" y="552" font-size="11" fill="#64748b">版本对照：素材成书基于 19.17.4.11（2020 年，CentOS 7.7），本目录容器实测为 26.3.29.7（clickhouse/clickhouse-server:26.3-alpine）。</text>
  <text x="50" y="572" font-size="11" fill="#64748b">本图为概念演进图，不含运行行为读数；图内每个名词与数字都能在第四节正文与表格中找到出处。</text>
</svg>
