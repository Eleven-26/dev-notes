<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="mkS" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="mkD" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="mkK" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">副本故障与恢复时序（26.3 实测）：停 s1r1 → 读自动切换 → 写入照常 → 重启追平</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#64748b">实线＝请求／写入　虚线＝响应　橙线＝Keeper 交互　实测读始终完整，重启后约 9.7 s 追平</text>

  <rect x="40" y="70" width="120" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="100" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">客户端</text>
  <rect x="230" y="70" width="130" height="34" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="295" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">events_dist</text>
  <rect x="430" y="70" width="120" height="34" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="490" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">s1r1</text>
  <rect x="620" y="70" width="120" height="34" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="680" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">s1r2</text>
  <rect x="810" y="70" width="150" height="34" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="885" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Keeper</text>

  <line x1="100" y1="104" x2="100" y2="540" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="295" y1="104" x2="295" y2="540" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="490" y1="104" x2="490" y2="540" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="680" y1="104" x2="680" y2="540" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="885" y1="104" x2="885" y2="540" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5,4"/>

  <line x1="100" y1="134" x2="288" y2="134" stroke="#2563eb" stroke-width="1.6" marker-end="url(#mkS)"/>
  <text x="108" y="128" font-size="11" fill="#1d4ed8">① SELECT count() FROM events_dist</text>
  <line x1="295" y1="164" x2="483" y2="164" stroke="#2563eb" stroke-width="1.6" marker-end="url(#mkS)"/>
  <text x="303" y="158" font-size="11" fill="#1d4ed8">② shard01 子查询（每个分片挑一个健康副本）</text>
  <line x1="483" y1="194" x2="302" y2="194" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#mkD)"/>
  <text x="340" y="188" font-size="11" fill="#166534">③ 500160</text>
  <line x1="288" y1="224" x2="107" y2="224" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#mkD)"/>
  <text x="120" y="218" font-size="11" fill="#166534">④ 汇总 = 1000001（含第 4.4 节写入的那 1 行）</text>

  <rect x="40" y="240" width="920" height="30" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="500" y="261" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">⏸ docker stop devnotes-ch-s1r1　→　active_replicas 由 2 掉到 1，s1r2 接任 is_leader</text>

  <line x1="100" y1="292" x2="288" y2="292" stroke="#2563eb" stroke-width="1.6" marker-end="url(#mkS)"/>
  <text x="108" y="286" font-size="11" fill="#1d4ed8">⑤ 停机后再读一次 count()</text>
  <line x1="295" y1="322" x2="673" y2="322" stroke="#2563eb" stroke-width="1.6" marker-end="url(#mkS)"/>
  <text x="350" y="316" font-size="11" fill="#1d4ed8">⑥ 读自动落到同分片另一副本 s1r2</text>
  <line x1="673" y1="352" x2="302" y2="352" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#mkD)"/>
  <text x="380" y="346" font-size="11" fill="#166534">⑦ 500161</text>
  <line x1="288" y1="382" x2="107" y2="382" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#mkD)"/>
  <text x="120" y="376" font-size="11" fill="#166534">⑧ 仍为 1000001 ⇒ 单副本宕机对读是透明的</text>

  <line x1="100" y1="414" x2="288" y2="414" stroke="#2563eb" stroke-width="1.6" marker-end="url(#mkS)"/>
  <text x="108" y="408" font-size="11" fill="#1d4ed8">⑨ 停机期间 INSERT 4 万行进 events_dist</text>
  <line x1="295" y1="444" x2="673" y2="444" stroke="#2563eb" stroke-width="1.6" marker-end="url(#mkS)"/>
  <text x="360" y="438" font-size="11" fill="#1d4ed8">⑩ shard01 的这份落到 s1r2（另一分片照常）</text>
  <line x1="680" y1="474" x2="878" y2="474" stroke="#b45309" stroke-width="1.6" marker-end="url(#mkK)"/>
  <text x="700" y="468" font-size="11" fill="#92400e">⑪ 写「新 part 已就绪」进 Keeper 复制日志</text>

  <rect x="40" y="492" width="920" height="30" rx="4" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.4"/>
  <text x="500" y="513" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">▶ docker start devnotes-ch-s1r1　→　按 log_pointer 接着拉，只补落下的 part，不做全量重传</text>

  <line x1="878" y1="544" x2="497" y2="544" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#mkK)"/>
  <text x="540" y="538" font-size="11" fill="#92400e">⑫ 从源副本拉取 part</text>

  <rect x="40" y="562" width="920" height="48" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="60" y="583" font-size="11.5" fill="#0f172a">恢复读数：s1r1 行数 500160 → <tspan font-weight="bold" fill="#166534">520214</tspan>（约 9.7 s，含进程启动）　active_replicas 回到 2　absolute_delay 回到 0　replication_queue 清空（queued=0 / running=0）</text>
  <text x="60" y="602" font-size="11" fill="#b45309">⚠️ 追平速度取决于「落后期间积累的 part 数量与大小」，不是单纯的行数 —— 落后期间产生大量小 part 会反而更慢</text>
</svg>
