<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 566" width="1000" height="566" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="566" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">外部集成的两条路线：读 与 搬</text>
  <text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">判据只有一条：这份数据会不会被反复分析</text>

  <!-- 路线 A -->
  <rect x="40" y="74" width="920" height="142" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="40" y="74" width="920" height="30" rx="10" fill="#e0e7ff" stroke="#cbd5e1"/>
  <text x="58" y="95" font-size="13.5" font-weight="bold" fill="#312e81">路线 A「读」：远端数据留在原地，按需拉取</text>

  <rect x="60" y="116" width="250" height="88" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="74" y="138" font-size="12.5" font-weight="bold" fill="#1e3a8a">远端数据源</text>
  <text x="74" y="159" font-size="11.5" fill="#334155">关系库：MySQL / PostgreSQL</text>
  <text x="74" y="177" font-size="11.5" fill="#334155">NoSQL：MongoDB / Redis</text>
  <text x="74" y="195" font-size="11.5" fill="#334155">文件与对象：S3 / HDFS / URL</text>

  <line x1="312" y1="160" x2="342" y2="160" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="346" y="116" width="270" height="88" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="138" font-size="12.5" font-weight="bold" fill="#1e3a8a">外部表引擎 / 表函数</text>
  <text x="360" y="159" font-size="11.5" fill="#334155">引擎表：建一次，长期可查</text>
  <text x="360" y="177" font-size="11.5" fill="#334155">表函数：只活在这一条 SQL</text>
  <text x="360" y="195" font-size="11.5" fill="#334155">26.3 实测：88 个表函数</text>

  <line x1="618" y1="160" x2="648" y2="160" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="652" y="116" width="290" height="88" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="666" y="138" font-size="12.5" font-weight="bold" fill="#78350f">查询时实时拉取</text>
  <text x="666" y="159" font-size="11.5" fill="#92400e">计划里是 ReadFromMySQL 节点</text>
  <text x="666" y="177" font-size="11.5" fill="#92400e">稀疏索引 / 跳数索引都用不上</text>
  <text x="666" y="195" font-size="11.5" fill="#92400e">远端列被映射成 Nullable</text>

  <!-- 路线 B -->
  <rect x="40" y="230" width="920" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="40" y="230" width="920" height="30" rx="10" fill="#dcfce7" stroke="#cbd5e1"/>
  <text x="58" y="251" font-size="13.5" font-weight="bold" fill="#14532d">路线 B「搬」：数据落成本地 part，查询只读本地</text>

  <rect x="60" y="272" width="196" height="80" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="72" y="293" font-size="12.5" font-weight="bold" fill="#14532d">上游</text>
  <text x="72" y="313" font-size="11.5" fill="#334155">Kafka topic</text>
  <text x="72" y="331" font-size="11.5" fill="#334155">本地 / 对象存储文件</text>
  <text x="72" y="349" font-size="11.5" fill="#334155">远端关系库</text>

  <line x1="258" y1="312" x2="286" y2="312" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="290" y="272" width="200" height="80" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="302" y="293" font-size="12.5" font-weight="bold" fill="#14532d">接入</text>
  <text x="302" y="313" font-size="11.5" fill="#334155">Kafka 引擎</text>
  <text x="302" y="331" font-size="11.5" fill="#334155">file() / s3()</text>
  <text x="302" y="349" font-size="11.5" fill="#334155">mysql() / INSERT SELECT</text>

  <line x1="492" y1="312" x2="520" y2="312" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="524" y="272" width="186" height="80" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="536" y="293" font-size="12.5" font-weight="bold" fill="#14532d">转发</text>
  <text x="536" y="313" font-size="11.5" fill="#334155">物化视图 TO 目标表</text>
  <text x="536" y="331" font-size="11.5" fill="#334155">阻塞在同步链路里</text>
  <text x="536" y="349" font-size="11.5" fill="#334155">只对新写入的块触发</text>

  <line x1="712" y1="312" x2="740" y2="312" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="744" y="272" width="198" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="756" y="293" font-size="12.5" font-weight="bold" fill="#14532d">本地 part</text>
  <text x="756" y="313" font-size="11.5" fill="#166534">MergeTree / 变种</text>
  <text x="756" y="331" font-size="11.5" fill="#166534">稀疏索引可剪 granule</text>
  <text x="756" y="349" font-size="11.5" fill="#166534">列存 + 向量化生效</text>

  <text x="60" y="372" font-size="11.5" fill="#b45309">注意：Kafka 引擎表不存数据，直接 SELECT 等于提交消费位移 —— 生产上必须经物化视图转发到本地表。</text>

  <!-- 判据 -->
  <rect x="40" y="396" width="920" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="58" y="418" font-size="13.5" font-weight="bold" fill="#1e3a8a">一条判据：反复分析 → 搬（路线 B）；只当维表或偶尔看一眼 → 读（路线 A）</text>
  <text x="58" y="438" font-size="11.5" fill="#1d4ed8">远端表又小又变化慢、还要在 JOIN 里当维表 → 用外部字典（按刷新周期同步进内存，查询不打远端）</text>
  <text x="58" y="454" font-size="11.5" fill="#1d4ed8">远端表很大、要反复聚合 → 先搬进来；外部表不是省事替代品，它把计算压力留在了远端</text>

  <text x="40" y="484" font-size="11.5" fill="#64748b">本篇实测：ClickHouse 26.3.29.7 对连自建 MySQL 8.0.46 —— mysql() 直读、MySQL 引擎表、INSERT ... SELECT 导入、写回 MySQL 四步全部通过。</text>
  <text x="40" y="504" font-size="11.5" fill="#64748b">file() 表函数只能读 user_files_path 内的文件（写绝对路径实测报 Code 291），且要用相对路径。</text>
  <text x="40" y="524" font-size="11.5" fill="#b45309">未实测：Kafka 引擎（本机无 Kafka 镜像）、S3 / HDFS / 湖仓格式（无凭据与网络）—— 图中这两类只写机制，不写读数。</text>
  <text x="40" y="544" font-size="11.5" fill="#64748b">引擎与表函数名单每个版本都在变，本篇的「88 个表函数 / 75 个引擎」取自 system.table_functions 与 system.table_engines 实测。</text>
</svg>
