  <text x="70" y="454" font-size="10.5" fill="#64748b">user_id = 0</text>
  <text x="406" y="454" font-size="10.5" fill="#64748b">= 8</text>
  <text x="868" y="454" font-size="10.5" fill="#64748b">= 19</text>

  <rect x="48" y="470" width="904" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="64" y="492" font-size="12" font-weight="bold" fill="#1e3a8a">集合运算实测（t00 ∩ t01，结果均为 12073）：位图 0.035~0.106 s ＜ IN 0.059~0.238 s ＜ JOIN 0.115~0.382 s ＜ INTERSECT 0.177~0.496 s</text>
  <text x="64" y="512" font-size="11.5" fill="#0f172a">bitmapAnd = 12073　bitmapOr = 207375　bitmapXor = 195302　bitmapAndnot(t19,t00) = 630441</text>
  <text x="64" y="532" font-size="11.5" fill="#166534">交叉验证：IN 子查询求 t19 ∩ t00 = 69890 ⇒ 700331 − 69890 = 630441，与 bitmapAndnot 完全吻合</text>
  <text x="64" y="546" font-size="11" fill="#b45309">⚠️ 差集函数名是 bitmapAndnot（小写 n）；arrayReduce('bitmapAnd', ...) 报 Code 63</text>
