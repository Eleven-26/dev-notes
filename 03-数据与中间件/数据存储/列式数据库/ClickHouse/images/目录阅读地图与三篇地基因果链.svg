<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ar6" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ClickHouse 目录阅读地图与三篇地基因果链</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">左列是五个主题域各含哪些篇（域只体现为阅读顺序，文件平铺）；右列是 1.2 节那条因果链的展开</text>

  <rect x="20" y="76" width="400" height="546" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="100" font-size="14" font-weight="bold" fill="#0f172a">五个主题域 · 十篇</text>

  <rect x="40" y="114" width="360" height="82" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="56" y="136" font-size="12.5" font-weight="bold" fill="#334155">① 定位与全景（第 0 步）</text>
  <text x="56" y="156" font-size="11" fill="#475569">定位与适用场景.md — 能力半径与不适用场景</text>
  <text x="56" y="174" font-size="11" fill="#475569">选型对比与落地案例.md — 横向对比与落地</text>
  <text x="56" y="190" font-size="10.5" fill="#64748b">总体印象路线：定位与适用场景 → 架构与存储引擎</text>

  <rect x="40" y="208" width="360" height="98" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="56" y="230" font-size="12.5" font-weight="bold" fill="#1e3a8a">② 存储内核（理解成本最高、最值钱）</text>
  <text x="56" y="250" font-size="11" fill="#334155">架构与存储引擎.md — 本目录的地基</text>
  <text x="56" y="268" font-size="11" fill="#334155">数据模型与表设计.md — 表怎么建</text>
  <text x="56" y="286" font-size="11" fill="#334155">索引原理与查询优化.md — 查询慢不慢</text>

  <rect x="40" y="318" width="360" height="82" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="56" y="340" font-size="12.5" font-weight="bold" fill="#15803d">③ 查询</text>
  <text x="56" y="360" font-size="11" fill="#334155">SQL查询与优化.md — 子句全集与执行计划</text>
  <text x="56" y="378" font-size="11" fill="#334155">物化视图与实时聚合.md — 预聚合与增量计算</text>
  <text x="56" y="394" font-size="10.5" fill="#64748b">查询链路：SQL 解析 → 剪枝读取 → 聚合</text>

  <rect x="40" y="412" width="360" height="66" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="56" y="434" font-size="12.5" font-weight="bold" fill="#9a3412">④ 数据进出</text>
  <text x="56" y="454" font-size="11" fill="#334155">写入与数据导入.md — 批量写、part 与后台合并</text>

  <rect x="40" y="490" width="360" height="82" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="56" y="512" font-size="12.5" font-weight="bold" fill="#334155">⑤ 生产运行</text>
  <text x="56" y="532" font-size="11" fill="#475569">集群与高可用.md — 副本、分片与 Keeper</text>
  <text x="56" y="550" font-size="11" fill="#475569">性能调优与基准测试.md — 参数、指标与基准</text>
  <text x="56" y="566" font-size="10.5" fill="#64748b">上线前：参数与容量规划看这两篇</text>

  <line x1="422" y1="257" x2="480" y2="160" stroke="#334155" stroke-width="1.6" marker-end="url(#ar6)"/>
  <text x="452" y="200" text-anchor="middle" font-size="10.5" fill="#64748b">展开</text>

  <rect x="490" y="76" width="490" height="546" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="506" y="100" font-size="14" font-weight="bold" fill="#0f172a">三篇地基 = 一条因果链（自上而下读）</text>

  <rect x="510" y="116" width="450" height="120" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="530" y="140" font-size="12.5" font-weight="bold" fill="#1e3a8a">架构与存储引擎.md：数据以什么形态存在</text>
  <text x="530" y="162" font-size="11" fill="#334155">列存 + 分区 + 不可变 part + 后台合并</text>
  <text x="530" y="180" font-size="11" fill="#334155">一条 SQL 经过的九个处理模块、九种引擎家族</text>
  <text x="530" y="200" font-size="11" fill="#334155">MergeTree 磁盘布局、数据标记与压缩块的关系</text>
  <text x="530" y="222" font-size="10.5" fill="#1e3a8a">后面所有「为什么快 / 为什么省」的结论都从这里长出</text>

  <line x1="735" y1="236" x2="735" y2="272" stroke="#334155" stroke-width="1.6" marker-end="url(#ar6)"/>
  <text x="748" y="258" font-size="11" fill="#9a3412">存储布局决定能剪谁</text>

  <rect x="510" y="274" width="450" height="120" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="530" y="298" font-size="12.5" font-weight="bold" fill="#1e3a8a">数据模型与表设计.md：表该怎么建</text>
  <text x="530" y="320" font-size="11" fill="#334155">分区键决定能剪哪个范围</text>
  <text x="530" y="338" font-size="11" fill="#334155">ORDER BY 决定一级索引怎么排</text>
  <text x="530" y="356" font-size="11" fill="#334155">列类型与编码决定每列占多少字节</text>
  <text x="530" y="378" font-size="11" fill="#334155">Nullable / LowCardinality / DateTime64 的取舍</text>

  <line x1="735" y1="394" x2="735" y2="430" stroke="#334155" stroke-width="1.6" marker-end="url(#ar6)"/>
  <text x="748" y="416" font-size="11" fill="#9a3412">建表顺序决定剪得多准</text>

  <rect x="510" y="432" width="450" height="120" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="530" y="456" font-size="12.5" font-weight="bold" fill="#1e3a8a">索引原理与查询优化.md：怎么少读数据</text>
  <text x="530" y="478" font-size="11" fill="#334155">稀疏一级索引剪 granule</text>
  <text x="530" y="496" font-size="11" fill="#334155">跳数索引剪数据块、数据标记定位到具体压缩块</text>
  <text x="530" y="514" font-size="11" fill="#334155">EXPLAIN 怎么读、PREWHERE 与谓词下推的边界</text>
  <text x="530" y="538" font-size="11" font-weight="bold" fill="#1e3a8a">⭐ 一句话：布局定能剪谁，建表定剪多准，索引定剩下怎么快速过滤</text>

  <text x="490" y="644" font-size="11.5" fill="#64748b">域只是阅读顺序不是分层结构；按问题找篇目见 1.3 节表格。</text>
</svg>
