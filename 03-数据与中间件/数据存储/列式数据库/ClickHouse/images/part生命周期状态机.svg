<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="mkC" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="mkA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b45309"/>
    </marker>
    <marker id="mkG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Part 的生命周期：从写入创建到延迟删除</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">一次 INSERT 生成一批新目录；同分区内的多个 part 由后台 merge 合并，旧 part 先置 active=0 再延迟清理</text>

  <rect x="40" y="96" width="180" height="82" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="130" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">① 创建</text>
  <text x="130" y="148" text-anchor="middle" font-size="11" fill="#475569">一次 INSERT 建一批</text>
  <text x="130" y="165" text-anchor="middle" font-size="11" fill="#475569">目录名 PartitionID_Min_Max_Level</text>

  <rect x="280" y="96" width="180" height="82" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="370" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">② Active（可见）</text>
  <text x="370" y="148" text-anchor="middle" font-size="11" fill="#334155">active=1，查询可见</text>
  <text x="370" y="165" text-anchor="middle" font-size="11" fill="#334155">进 system.parts、可被合并选中</text>

  <rect x="520" y="96" width="180" height="82" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
  <text x="610" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">③ 参与合并（source）</text>
  <text x="610" y="148" text-anchor="middle" font-size="11" fill="#334155">被后台 merge 选中</text>
  <text x="610" y="165" text-anchor="middle" font-size="11" fill="#334155">仅在同一分片内、同分区内合并</text>

  <rect x="760" y="96" width="200" height="82" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="860" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">④ 新 part（Active）</text>
  <text x="860" y="148" text-anchor="middle" font-size="11" fill="#334155">合并产物，Level 取同分区最大 +1</text>
  <text x="860" y="165" text-anchor="middle" font-size="11" fill="#334155">Min / Max 重算，行数不变</text>

  <line x1="220" y1="137" x2="276" y2="137" stroke="#2563eb" stroke-width="1.8" marker-end="url(#mkC)"/>
  <text x="248" y="128" text-anchor="middle" font-size="10.5" fill="#2563eb">写入</text>
  <line x1="460" y1="137" x2="516" y2="137" stroke="#2563eb" stroke-width="1.8" marker-end="url(#mkC)"/>
  <text x="488" y="128" text-anchor="middle" font-size="10.5" fill="#2563eb">选中</text>
  <line x1="700" y1="137" x2="756" y2="137" stroke="#2563eb" stroke-width="1.8" marker-end="url(#mkC)"/>
  <text x="728" y="128" text-anchor="middle" font-size="10.5" fill="#2563eb">产出</text>

  <path d="M860,96 C860,60 370,60 370,92" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mkG)"/>
  <text x="615" y="56" text-anchor="middle" font-size="10.5" fill="#64748b">合并产物回到 Active，继续参与后续合并</text>

  <rect x="520" y="252" width="180" height="82" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="610" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">⑤ Inactive（旧 part）</text>
  <text x="610" y="304" text-anchor="middle" font-size="11" fill="#475569">active=0，查询时被自动过滤</text>
  <text x="610" y="321" text-anchor="middle" font-size="11" fill="#475569">磁盘上仍存在（可回溯的现场）</text>

  <line x1="610" y1="178" x2="610" y2="248" stroke="#b45309" stroke-width="1.8" marker-end="url(#mkA)"/>
  <text x="700" y="216" text-anchor="middle" font-size="10.5" fill="#b45309">旧 part 标记 active=0</text>

  <rect x="520" y="408" width="180" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="610" y="438" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">⑥ 已删除</text>
  <text x="610" y="460" text-anchor="middle" font-size="11" fill="#475569">后台延迟清理，空间回收</text>

  <line x1="610" y1="334" x2="610" y2="404" stroke="#2563eb" stroke-width="1.8" marker-end="url(#mkC)"/>
  <text x="742" y="374" text-anchor="middle" font-size="10.5" fill="#2563eb">默认约 8 分钟后清理</text>

  <rect x="40" y="408" width="440" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="60" y="434" font-size="12.5" font-weight="bold" fill="#0f172a">为什么要有这套「先置灰、再延迟删」</text>
  <text x="60" y="460" font-size="11.5" fill="#334155">· 合并期间查询仍可能持有旧 part 的读视图，立即删会出错</text>
  <text x="60" y="484" font-size="11.5" fill="#334155">· 置 active=0 让查询立刻看不到、但不丢文件，读路径安全切换</text>
  <text x="60" y="508" font-size="11.5" fill="#b45309">⚠️ 合并触发（写入后 10~15 分钟）与延迟清理（约 8 分钟）为 2020 版默认值</text>
  <text x="60" y="532" font-size="11.5" fill="#b45309">　 本批实测用手动 OPTIMIZE 与恢复后台合并观察，未验证这两个时间默认值</text>

  <rect x="760" y="252" width="200" height="228" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="860" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">判据速记</text>
  <text x="780" y="304" font-size="11" fill="#334155">· part 总数 ≈</text>
  <text x="790" y="322" font-size="11" fill="#334155">分区数 × 每分区批次数</text>
  <text x="780" y="348" font-size="11" fill="#334155">· 写入越快 / 批次越小，</text>
  <text x="790" y="366" font-size="11" fill="#334155">part 涨得越快</text>
  <text x="780" y="392" font-size="11" fill="#334155">· 合并只改组织方式，</text>
  <text x="790" y="410" font-size="11" fill="#334155">不改数据（行数不变）</text>
  <text x="780" y="436" font-size="11" fill="#b45309">· 跨分区永不合并</text>
  <text x="780" y="462" font-size="11" fill="#334155">· 盯 system.parts 的</text>
  <text x="790" y="480" font-size="11" fill="#334155">active 数与 system.merges</text>
</svg>
