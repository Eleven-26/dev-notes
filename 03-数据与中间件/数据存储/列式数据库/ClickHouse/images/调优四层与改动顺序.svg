<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="pnA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">调优的四个层面与改动顺序（判据全部来自本目录容器实测）</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">口径：容器 devnotes-ch · ClickHouse 26.3.29.7 · 4 核 / cgroup 内存无上限 · 实测取自实验 01 / 03 / 04 / 08</text>

  <rect x="20" y="74" width="600" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="36" y="88" width="568" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="110" font-size="14" font-weight="bold" fill="#0f172a">四个层面：越往下走，改动代价越大</text>

  <rect x="36" y="132" width="568" height="72" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="52" y="155" font-size="12.5" font-weight="bold" fill="#0f172a">① 表设计：ORDER BY / 分区键 / 类型与编码</text>
  <text x="52" y="175" font-size="11" fill="#334155">决定「一个 granule 里数据怎么聚、一次要读几段」</text>
  <text x="52" y="194" font-size="11" fill="#334155">这是唯一能直接改掉 read_rows 的层面</text>

  <line x1="320" y1="206" x2="320" y2="220" stroke="#64748b" stroke-width="1.6" marker-end="url(#pnA)"/>

  <rect x="36" y="220" width="568" height="72" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="52" y="243" font-size="12.5" font-weight="bold" fill="#0f172a">② 索引：分区索引 → 一级稀疏索引 → 跳过索引</text>
  <text x="52" y="263" font-size="11" fill="#334155">实测：url 等值查询 10,000,100 行 → 加 bloom_filter 后 1,310,720 行</text>
  <text x="52" y="282" font-size="11" fill="#334155">前提是谓词与排序键或值域区分度相关，否则白占空间</text>

  <line x1="320" y1="294" x2="320" y2="308" stroke="#64748b" stroke-width="1.6" marker-end="url(#pnA)"/>

  <rect x="36" y="308" width="568" height="72" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="52" y="331" font-size="12.5" font-weight="bold" fill="#0f172a">③ 参数：max_threads / max_block_size / index_granularity</text>
  <text x="52" y="351" font-size="11" fill="#334155">实测 max_threads 默认 'auto(4)'、本机 nproc=4 → 只能给到 4 核</text>
  <text x="52" y="370" font-size="11" fill="#334155">参数决定「用几核、用多少内存去读」，改不掉「要读多少」</text>

  <line x1="320" y1="382" x2="320" y2="396" stroke="#64748b" stroke-width="1.6" marker-end="url(#pnA)"/>

  <rect x="36" y="396" width="568" height="72" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="52" y="419" font-size="12.5" font-weight="bold" fill="#0f172a">④ 硬件与系统层：CPU 核数 / 内存 / 磁盘 / 文件句柄</text>
  <text x="52" y="439" font-size="11" fill="#334155">实测容器所见：nproc=4、cgroup memory.max=max（未设上限）</text>
  <text x="52" y="458" font-size="11" fill="#334155">OSMemoryTotal ≈ 6.22 GB、ClickHouse 常驻 ≈ 1.0 GB</text>

  <text x="52" y="492" font-size="11.5" fill="#64748b">顺序判据：先改能改掉 read_rows 的层，再改只影响「把资源用满」的层。单点数字切勿跨机器套用。</text>

  <rect x="640" y="74" width="340" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="656" y="104" font-size="14" font-weight="bold" fill="#0f172a">先改哪个？改动优先级</text>
  <text x="656" y="124" font-size="10.5" fill="#64748b">每一步附一条本目录容器的实测证据</text>

  <rect x="656" y="136" width="308" height="88" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="670" y="158" font-size="12" font-weight="bold" fill="#0f172a">第 1 步：改表设计（收益最大）</text>
  <text x="670" y="178" font-size="10.5" fill="#334155">ORDER BY 选错列：同一查询 980/980</text>
  <text x="670" y="196" font-size="10.5" fill="#334155">个 granule 全读；命中前缀只要 10/1231</text>
  <text x="670" y="214" font-size="10.5" fill="#64748b">证据：实验 03 对照表 events_alt</text>

  <rect x="656" y="236" width="308" height="88" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="670" y="258" font-size="12" font-weight="bold" fill="#0f172a">第 2 步：加索引 —— 只加有区分度的</text>
  <text x="670" y="278" font-size="10.5" fill="#334155">实测 5 个跳过索引只有 bloom_filter</text>
  <text x="670" y="296" font-size="10.5" fill="#334155">剪掉约 87%；minmax / set(8) /</text>
  <text x="670" y="314" font-size="10.5" fill="#334155">ngrambf_v1(n=3) 都等于没剪</text>

  <rect x="656" y="336" width="308" height="88" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="670" y="358" font-size="12" font-weight="bold" fill="#0f172a">第 3 步：调参数（把资源用满）</text>
  <text x="670" y="378" font-size="10.5" fill="#334155">max_threads 实测默认 4（本机 4 核）</text>
  <text x="670" y="396" font-size="10.5" fill="#334155">参数只改并发与内存上限，改不了</text>
  <text x="670" y="414" font-size="10.5" fill="#334155">read_rows</text>

  <rect x="656" y="436" width="308" height="68" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="670" y="458" font-size="12" font-weight="bold" fill="#0f172a">最后：才谈硬件 / 系统层</text>
  <text x="670" y="478" font-size="10.5" fill="#334155">换磁盘与核数前，先把前三层做对</text>
  <text x="670" y="496" font-size="10.5" fill="#64748b">跨机器、跨容器规格的数字不可比</text>

  <rect x="20" y="524" width="960" height="104" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="550" font-size="11.5" fill="#0f172a">读法：四个层面不是并列的四张牌，而是「上面决定下面」—— 表设计决定要读多少段数据，索引在此基础上再剪，参数只决定用几核去读。</text>
  <text x="36" y="574" font-size="11.5" fill="#0f172a">顺序判据：改动优先级 = ① 表设计 → ② 索引 → ③ 参数 → ④ 硬件；越靠前收益越大，越靠后越接近「花钱买」。</text>
  <text x="36" y="598" font-size="11.5" fill="#0f172a">⚠️ 反例：实验 04 在同一张表上加 5 个跳过索引，其中 4 个没剪掉任何 granule —— 加之前先看 EXPLAIN indexes=1。</text>
  <text x="36" y="620" font-size="11.5" fill="#64748b">本图数字全部取自本目录容器实测（实验 01 / 03 / 04 / 08），非书本复述；书 2020 口径的默认值差异见正文第三节。</text>
</svg>
