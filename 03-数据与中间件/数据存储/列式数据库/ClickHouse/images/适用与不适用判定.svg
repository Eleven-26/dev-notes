<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="mkA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="mkB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">ClickHouse 适用 / 不适用判定流程</text>
  <text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">判据来自《ClickHouse 原理解析与应用实践》1.8「适用的场景」与 1.9「不适用的场景」，按读书笔记归纳为逐条判定</text>

  <rect x="40" y="74" width="592" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="95" font-size="13" font-weight="bold" fill="#1e3a8a">判定 1　写入以「批量追加」为主，历史行基本不改？</text>
  <text x="58" y="114" font-size="11.5" fill="#1d4ed8">依据：书 1.9「不擅长（但支持）按行删除」—— 列存按 part 组织，改一行要重写整个 part</text>

  <line x1="336" y1="126" x2="336" y2="140" stroke="#64748b" stroke-width="1.6" marker-end="url(#mkA)"/>
  <line x1="632" y1="100" x2="666" y2="100" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mkB)"/>
  <text x="640" y="94" font-size="11" fill="#dc2626">否</text>
  <rect x="666" y="74" width="304" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="682" y="94" font-size="12" font-weight="bold" fill="#7f1d1d">别碰：行级更新 / 删除是主路径</text>
  <text x="682" y="113" font-size="11.5" fill="#991b1b">那是行存 OLTP 的形态，列存每次改行都要重写 part</text>

  <rect x="40" y="140" width="592" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="161" font-size="13" font-weight="bold" fill="#1e3a8a">判定 2　查询以「大宽表聚合 / 明细扫描 + 少数列」为主？</text>
  <text x="58" y="180" font-size="11.5" fill="#1d4ed8">依据：列存只读被选中的列，压缩与向量化的收益都建立在「按列扫」上</text>

  <line x1="336" y1="192" x2="336" y2="206" stroke="#64748b" stroke-width="1.6" marker-end="url(#mkA)"/>
  <line x1="632" y1="166" x2="666" y2="166" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mkB)"/>
  <text x="640" y="160" font-size="11" fill="#dc2626">否</text>
  <rect x="666" y="140" width="304" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="682" y="160" font-size="12" font-weight="bold" fill="#7f1d1d">别碰：单键随机读、极低延迟 KV 访问</text>
  <text x="682" y="179" font-size="11.5" fill="#991b1b">列式布局为批量扫描优化，不为逐行点查优化</text>

  <rect x="40" y="206" width="592" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="227" font-size="13" font-weight="bold" fill="#1e3a8a">判定 3　不需要多行事务、外键约束与行级锁语义？</text>
  <text x="58" y="246" font-size="11.5" fill="#1d4ed8">依据：书 1.9「不支持事务」—— 它面向分析型读取，不提供事务与约束</text>

  <line x1="336" y1="258" x2="336" y2="272" stroke="#64748b" stroke-width="1.6" marker-end="url(#mkA)"/>
  <line x1="632" y1="232" x2="666" y2="232" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mkB)"/>
  <text x="640" y="226" font-size="11" fill="#dc2626">否</text>
  <rect x="666" y="206" width="304" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="682" y="226" font-size="12" font-weight="bold" fill="#7f1d1d">别碰：订单 / 账务这类核心业务库</text>
  <text x="682" y="245" font-size="11.5" fill="#991b1b">要强 ACID 与约束，应交给面向事务的系统</text>

  <rect x="40" y="272" width="592" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="293" font-size="13" font-weight="bold" fill="#1e3a8a">判定 4　不需要按主键做高频、行粒度的点查？</text>
  <text x="58" y="312" font-size="11.5" fill="#1d4ed8">依据：书 1.9「不擅长（但支持）按主键行粒度查询，不应当 KV 库用」</text>

  <line x1="336" y1="324" x2="336" y2="338" stroke="#64748b" stroke-width="1.6" marker-end="url(#mkA)"/>
  <line x1="632" y1="298" x2="666" y2="298" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mkB)"/>
  <text x="640" y="292" font-size="11" fill="#dc2626">否</text>
  <rect x="666" y="272" width="304" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="682" y="292" font-size="12" font-weight="bold" fill="#7f1d1d">别碰：高并发按主键取单行</text>
  <text x="682" y="311" font-size="11.5" fill="#991b1b">行存 + 缓存更合适，列存的稀疏索引帮不上这种访问</text>

  <rect x="40" y="338" width="592" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="359" font-size="13" font-weight="bold" fill="#1e3a8a">判定 5　接受「单机起步 + 分片与运维自担」的手动挡风格？</text>
  <text x="58" y="378" font-size="11.5" fill="#1d4ed8">依据：书 2 章自评「一辆手动挡的赛车」，分片有时甚至需要手动完成</text>

  <line x1="336" y1="390" x2="336" y2="404" stroke="#64748b" stroke-width="1.6" marker-end="url(#mkA)"/>
  <line x1="632" y1="364" x2="666" y2="364" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mkB)"/>
  <text x="640" y="358" font-size="11" fill="#dc2626">否</text>
  <rect x="666" y="338" width="304" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="682" y="358" font-size="12" font-weight="bold" fill="#78350f">先算账：分片、副本与运维人力</text>
  <text x="682" y="377" font-size="11.5" fill="#92400e">书的评价：所有选择权都交到了使用者手里</text>

  <rect x="40" y="404" width="592" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="58" y="428" font-size="13.5" font-weight="bold" fill="#14532d">✔ 五问都过 → 可以上：批量写入 + 大宽表聚合 + 只读少数列 + 按范围扫描</text>
  <text x="58" y="449" font-size="11.5" fill="#166534">单节点自成一体、不需要额外系统依赖（集群才需要 ZooKeeper）；上线初期先用单机 + 本地表即可</text>
  <text x="58" y="465" font-size="11.5" fill="#166534">规模增长后再加分片、用分布式表代理本地表（书 2.1.9：分布式表本身不存数据）</text>

  <text x="40" y="494" font-size="11.5" fill="#64748b">说明：五个判定问题由读书笔记据书 1.8 / 1.9 两节归纳，不是书中的原表格式；「别碰」一侧不是「做不到」，而是「用它别扭」。</text>
  <text x="40" y="514" font-size="11.5" fill="#b45309">⚠️ 本目录容器实测（26.3.29.7）只覆盖建表、写入、parts 与落盘形态，未覆盖事务与行级删除路径 → 图里不写「当前是否已支持」的版本结论。</text>
  <text x="40" y="532" font-size="11.5" fill="#64748b">判定 5 的取舍见书 2 章；「不擅长」三条的定性见书 1.9 节：这不是缺点，是为极致查询性能所做的权衡。</text>
</svg>
