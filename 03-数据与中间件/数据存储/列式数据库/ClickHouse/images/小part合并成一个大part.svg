<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="mkC" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">100 个小 part 被后台合并成 1 个大 part（exp09 ④a / ④d 实测）</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#64748b">同一份 100 万行数据：1 万行/批 × 100 次 vs 一次写入　合并前后行数不变，变的是 part 数与 marks 合计</text>

  <rect x="30" y="76" width="370" height="300" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="50" y="102" font-size="13" font-weight="bold" fill="#0f172a">合并前：100 个 part（每个 1 万行）</text>

  <rect x="60" y="120" width="150" height="50" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="135" y="150" text-anchor="middle" font-size="11" fill="#334155">小 part · 1 万行</text>
  <rect x="225" y="120" width="150" height="50" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="300" y="150" text-anchor="middle" font-size="11" fill="#334155">小 part · 1 万行</text>

  <rect x="60" y="186" width="150" height="50" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="135" y="216" text-anchor="middle" font-size="11" fill="#334155">小 part · 1 万行</text>
  <rect x="225" y="186" width="150" height="50" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="300" y="216" text-anchor="middle" font-size="11" fill="#334155">小 part · 1 万行</text>

  <rect x="60" y="252" width="150" height="50" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="135" y="282" text-anchor="middle" font-size="11" fill="#334155">小 part · 1 万行</text>
  <rect x="225" y="252" width="150" height="50" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="300" y="282" text-anchor="middle" font-size="11" fill="#334155">小 part · 1 万行</text>

  <text x="60" y="326" font-size="11.5" fill="#475569">　　…… 其余 94 个同形，合计 100 个</text>
  <text x="60" y="350" font-size="11.5" fill="#0f172a">marks 合计 = 200（每个记 2 个）</text>
  <text x="60" y="368" font-size="11.5" fill="#0f172a">bytes_on_disk = 11.66 MiB</text>

  <line x1="415" y1="226" x2="555" y2="226" stroke="#2563eb" stroke-width="2" marker-end="url(#mkC)"/>
  <text x="485" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">后台合并</text>
  <text x="485" y="250" text-anchor="middle" font-size="11" fill="#475569">异步执行</text>
  <text x="485" y="270" text-anchor="middle" font-size="11" fill="#475569">21 秒窗口内完成</text>

  <rect x="585" y="76" width="385" height="300" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="605" y="102" font-size="13" font-weight="bold" fill="#1e3a8a">合并后：1 个 part（100 万行）</text>

  <rect x="620" y="118" width="320" height="160" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="640" y="148" font-size="12" font-weight="bold" fill="#0f172a">1 个 part · Wide 形态</text>
  <text x="640" y="176" font-size="11.5" fill="#334155">100 万行 · marks 124</text>
  <text x="640" y="202" font-size="11.5" fill="#334155">bytes_on_disk = 11.69 MiB</text>
  <text x="640" y="226" font-size="11" fill="#64748b">（合并前 11.66 MiB，几乎不变）</text>
  <text x="640" y="254" font-size="11.5" fill="#0f172a">行数不变：1000000</text>

  <text x="605" y="302" font-size="11" fill="#475569">同分区内合成，Min / Max / Level 重算（书 6.2.3）</text>
  <text x="605" y="322" font-size="11" fill="#475569">跨分区的数据永远不合并（书 6.2.3）</text>
  <text x="605" y="342" font-size="11" fill="#b45309">旧 part 不立即删除：active = 0 后被清理</text>
  <text x="605" y="362" font-size="11" fill="#b45309">（书 2020 口径：默认约 8 分钟后）</text>

  <text x="30" y="404" font-size="11.5" fill="#0f172a">⭐ 合并只改组织方式、不改数据：合并前后行数与聚合结果完全一致（1000000 / 499999500000 / name_999999）。</text>
  <text x="30" y="430" font-size="11.5" fill="#0f172a">⭐ part 多出来的元数据要靠合并还回去：marks 合计从 200（100 个 part）回到 124（1 个 part）。</text>
  <text x="30" y="456" font-size="11.5" fill="#b45309">⚠️ 造这 100 个 part 之前必须先停掉后台合并，否则 part 会被立刻合掉；观察回落时再恢复。</text>
  <text x="30" y="482" font-size="11.5" fill="#b45309">⚠️ 书 2020 口径的触发时机是「写入后 10 ~ 15 分钟」、旧目录「默认约 8 分钟后清理」，本批实测未验证。</text>
  <text x="30" y="508" font-size="11.5" fill="#64748b">说明：数值取自本目录实验 09（容器 devnotes-ch，clickhouse/clickhouse-server:26.3-alpine，版本 26.3.29.7）。</text>
</svg>
