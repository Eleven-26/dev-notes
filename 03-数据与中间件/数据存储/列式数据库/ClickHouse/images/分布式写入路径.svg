<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="mkB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="mkG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="mkR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">写一条数据进分布式表：分片选路 → 落一个副本 → Keeper 记日志 → 另一副本拉取</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#64748b">实测：INSERT 100 万行后 s1r1=s1r2=500160、s2r1=s2r2=499840、events_dist 合计 1000000</text>

  <rect x="30" y="70" width="560" height="442" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="48" y="94" font-size="13.5" font-weight="bold" fill="#0f172a">① 写入路径（客户端 → 分片）</text>

  <rect x="48" y="108" width="524" height="52" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="310" y="129" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">客户端　INSERT INTO events_dist SELECT ...</text>
  <text x="310" y="148" text-anchor="middle" font-size="11" fill="#475569">命令返回 ≠ 数据已落到远端（默认异步，见右侧面板）</text>

  <line x1="310" y1="160" x2="310" y2="184" stroke="#2563eb" stroke-width="1.8" marker-end="url(#mkB)"/>

  <rect x="48" y="186" width="524" height="52" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="310" y="207" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">Distributed 引擎按分片键把 block 切成 N 份</text>
  <text x="310" y="226" text-anchor="middle" font-size="11" fill="#475569">本篇分片键 rand()　⚠️ 近似均匀但不精确等分</text>

  <line x1="180" y1="238" x2="180" y2="262" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="440" y1="238" x2="440" y2="262" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="180" y1="262" x2="440" y2="262" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="180" y1="262" x2="180" y2="286" stroke="#2563eb" stroke-width="1.8" marker-end="url(#mkB)"/>
  <line x1="440" y1="262" x2="440" y2="286" stroke="#2563eb" stroke-width="1.8" marker-end="url(#mkB)"/>

  <rect x="48" y="288" width="256" height="76" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="176" y="309" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">shard 01 → 写 1 个副本</text>
  <text x="176" y="330" text-anchor="middle" font-size="11" fill="#16a34a">internal_replication = true</text>
  <text x="176" y="348" text-anchor="middle" font-size="11" fill="#475569">只写 s1r1 或 s1r2 之一，不各写一份</text>

  <rect x="316" y="288" width="256" height="76" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="444" y="309" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">shard 02 → 写 1 个副本</text>
  <text x="444" y="330" text-anchor="middle" font-size="11" fill="#16a34a">internal_replication = true</text>
  <text x="444" y="348" text-anchor="middle" font-size="11" fill="#475569">只写 s2r1 或 s2r2 之一</text>

  <line x1="176" y1="364" x2="176" y2="388" stroke="#16a34a" stroke-width="1.8" marker-end="url(#mkG)"/>
  <line x1="444" y1="364" x2="444" y2="388" stroke="#16a34a" stroke-width="1.8" marker-end="url(#mkG)"/>

  <rect x="48" y="390" width="524" height="52" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="310" y="411" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">被选中的那个副本落 part，并把「新 part 已就绪」写进 Keeper 日志</text>
  <text x="310" y="430" text-anchor="middle" font-size="11" fill="#475569">写入方到此即返回 —— 不负责推给同分片的其它副本</text>

  <line x1="310" y1="442" x2="310" y2="466" stroke="#16a34a" stroke-width="1.8" marker-end="url(#mkG)"/>

  <rect x="48" y="468" width="524" height="34" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.4"/>
  <text x="310" y="490" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">② 同分片另一副本监听日志 → 主动「拉」part → 落盘并前移自己的日志指针</text>

  <rect x="610" y="70" width="360" height="442" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
  <text x="628" y="94" font-size="13.5" font-weight="bold" fill="#991b1b">③ ⭐ 异步写入的静默失败</text>

  <text x="628" y="118" font-size="11.5" fill="#0f172a">insert_distributed_sync 默认 0</text>
  <text x="628" y="138" font-size="11" fill="#475569">⇒ 命令立刻返回，真正发送在后台线程</text>

  <rect x="628" y="150" width="324" height="120" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="644" y="171" font-size="11.5" font-weight="bold" fill="#991b1b">实测：权限未修好时写 100 万行</text>
  <text x="644" y="191" font-size="11" fill="#7f1d1d">INSERT 命令一声不吭地「成功」</text>
  <text x="644" y="210" font-size="11" fill="#7f1d1d">但 shard02 拿到 0 行</text>
  <text x="644" y="232" font-size="11" fill="#0f172a">SELECT ... FROM system.distribution_queue</text>
  <text x="644" y="250" font-size="11" fill="#0f172a">→ error_count = 9，last_exception = Code 516</text>
  <text x="644" y="264" font-size="11" fill="#0f172a">　 default: Authentication failed</text>

  <line x1="790" y1="270" x2="790" y2="294" stroke="#dc2626" stroke-width="1.8" marker-end="url(#mkR)"/>

  <rect x="628" y="296" width="324" height="96" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.4"/>
  <text x="644" y="317" font-size="11.5" font-weight="bold" fill="#166534">修好权限后：队列自行重投</text>
  <text x="644" y="337" font-size="11" fill="#14532d">shard02 补齐 499840 行</text>
  <text x="644" y="356" font-size="11" fill="#14532d">分布式表总数回到 1000000</text>
  <text x="644" y="377" font-size="11" fill="#b45309">⚠️ 自动重投不是无限的，仍需监控</text>

  <rect x="628" y="406" width="324" height="106" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="644" y="427" font-size="11.5" font-weight="bold" fill="#1e3a8a">生产上二选一</text>
  <text x="644" y="448" font-size="11" fill="#1d4ed8">① insert_distributed_sync = 1</text>
  <text x="656" y="465" font-size="11" fill="#475569">同步写：失败立刻报错，代价是延迟</text>
  <text x="644" y="486" font-size="11" fill="#1d4ed8">② 保持异步 + 监控 error_count</text>
  <text x="656" y="503" font-size="11" fill="#475569">把 distribution_queue 纳入告警</text>
</svg>
