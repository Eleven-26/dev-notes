<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">缓存三大坑：三个动作落在链路的三个不同位置</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">位置不同，所以它们不能互相替代；数字为本轮 Redis 8.10.2 实测</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>

    <rect x="30" y="36" width="140" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="100" y="58" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">请求进来</text>
    <text x="100" y="76" text-anchor="middle" font-size="9.5" fill="#1e40af">GET /user/99999</text>

    <line x1="172" y1="62" x2="206" y2="62" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="210" y="36" width="170" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="295" y="58" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">查缓存 Redis</text>
    <text x="295" y="76" text-anchor="middle" font-size="9.5" fill="#1e40af">命中就返回；未命中往下走</text>

    <line x1="382" y1="62" x2="416" y2="62" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="420" y="36" width="170" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="505" y="58" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">回源 MySQL</text>
    <text x="505" y="76" text-anchor="middle" font-size="9.5" fill="#1e40af">没命中就会打到这里</text>

    <line x1="592" y1="62" x2="626" y2="62" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="630" y="36" width="200" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="730" y="58" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">回写缓存 + EXPIRE</text>
    <text x="730" y="76" text-anchor="middle" font-size="9.5" fill="#1e40af">TTL 在这一步被定下来</text>

    <circle cx="400" cy="104" r="10" fill="#dc2626"/>
    <text x="400" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">1</text>
    <circle cx="295" cy="104" r="10" fill="#b45309"/>
    <text x="295" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">2</text>
    <circle cx="730" cy="104" r="10" fill="#dc2626"/>
    <text x="730" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">3</text>

    <rect x="20" y="130" width="285" height="140" fill="#ffffff" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="34" y="154" font-size="11.5" font-weight="bold" fill="#991b1b">穿透：缓存里永远没有它</text>
    <text x="34" y="180" font-size="10" fill="#334155">查一个不存在的 ID，每次都穿过缓存</text>
    <text x="34" y="200" font-size="10" fill="#334155">→ 先判「可能存在」：位图 / 布隆</text>
    <text x="34" y="220" font-size="10" fill="#334155">→ 100 万 ID 只占 0.13 MB</text>
    <text x="34" y="240" font-size="10" fill="#334155">→ 实测 50 万次「不存在」被拦下</text>
    <text x="34" y="260" font-size="10" fill="#991b1b">不判就是每次都落到 MySQL</text>

    <rect x="350" y="130" width="285" height="140" fill="#ffffff" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="364" y="154" font-size="11.5" font-weight="bold" fill="#92400e">击穿：热点 key 过期的一瞬</text>
    <text x="364" y="180" font-size="10" fill="#334155">1,000 个并发同时发现缓存失效</text>
    <text x="364" y="200" font-size="10" fill="#334155">→ SET NX 只放一个请求去回源</text>
    <text x="364" y="220" font-size="10" fill="#334155">→ 其余等锁释放，或直接读旧值</text>
    <text x="364" y="240" font-size="10" fill="#334155">→ 锁的 TTL 要盖住回源耗时</text>
    <text x="364" y="260" font-size="10" fill="#92400e">实测回源 1,000 次 → 1 次</text>

    <rect x="665" y="130" width="285" height="140" fill="#ffffff" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="679" y="154" font-size="11.5" font-weight="bold" fill="#991b1b">雪崩：大量 key 同一秒过期</text>
    <text x="679" y="180" font-size="10" fill="#334155">1,000 个 key 都写 EXPIRE 3600</text>
    <text x="679" y="200" font-size="10" fill="#334155">→ 改成 base + rand(0, 600)</text>
    <text x="679" y="220" font-size="10" fill="#334155">→ 打散的是到期时刻，不是数据</text>
    <text x="679" y="240" font-size="10" fill="#334155">→ 最挤 10 秒窗口：648 → 25 个</text>
    <text x="679" y="260" font-size="10" fill="#991b1b">但整实例挂掉，打散也救不了</text>
  </g>

  <rect x="20" y="378" width="960" height="32" fill="#ffffff" stroke="none"/>
  <text x="20" y="396" font-size="10.5" fill="#94a3b8">三个数字分别来自：位图 100 万 ID 建图与 100 万次 GETBIT、1,000 并发的 SET NX、1,000 个 key 的 TTL 分桶统计。</text>
</svg>
