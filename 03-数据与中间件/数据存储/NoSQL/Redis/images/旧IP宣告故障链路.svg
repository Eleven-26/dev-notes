<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#334155"/>
    </marker>
    <marker id="arwR" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#dc2626"/>
    </marker>
    <marker id="arwG" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">「集群状态正常但连不上」的容器坑：节点宣告了旧 IP</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">调用时序图 —— IP、报错文本与三条 CLUSTER SHARDS 视图均为本篇 3.3 节实测记录</text>

  <g transform="translate(0,0)">
    <rect x="80" y="84" width="180" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="170" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">客户端（go-redis）</text>
    <rect x="410" y="84" width="180" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="500" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">种子节点 redis-c1</text>
    <rect x="740" y="84" width="180" height="40" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="830" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">主节点 redis-c2</text>

    <line x1="170" y1="124" x2="170" y2="430" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
    <line x1="500" y1="124" x2="500" y2="430" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
    <line x1="830" y1="124" x2="830" y2="430" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>

    <rect x="735" y="140" width="190" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="830" y="162" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#dc2626">① 容器重启，IP 变了</text>
    <text x="830" y="182" text-anchor="middle" font-size="11.5" fill="#334155">自我探测仍报旧值 172.25.0.16</text>

    <line x1="830" y1="214" x2="510" y2="234" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
    <text x="660" y="220" text-anchor="middle" font-size="11.5" fill="#334155">② 集群视图被污染：c2 视图里自己是 .16（c3 同样报旧 IP .17）</text>

    <line x1="170" y1="262" x2="490" y2="262" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
    <text x="330" y="252" text-anchor="middle" font-size="11.5" fill="#334155">③ 连种子节点，取集群拓扑</text>

    <line x1="500" y1="300" x2="180" y2="300" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
    <text x="330" y="290" text-anchor="middle" font-size="11.5" fill="#334155">④ 拓扑里带着 c2 宣告的 172.25.0.16</text>

    <line x1="170" y1="340" x2="820" y2="340" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arwR)"/>
    <text x="490" y="330" text-anchor="middle" font-size="11.5" fill="#dc2626">⑤ dial tcp 172.25.0.16:6379 → no route to host，重试 5 次全失败</text>

    <rect x="240" y="360" width="520" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="500" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">⑥ 现象：CLUSTER INFO 显示 cluster_state:ok，客户端却连不上</text>
    <text x="500" y="398" text-anchor="middle" font-size="11.5" fill="#334155">redis: connection pool: failed to dial after 5 attempts —— 非常难查</text>
  </g>

  <g transform="translate(20,450)">
    <rect x="0" y="0" width="960" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="16" y="28" font-size="14" font-weight="bold" fill="#166534">修法（3.3 实测路径）</text>
    <text x="16" y="54" font-size="12.5" fill="#334155">① 三个主节点分别跑 <tspan font-family="Consolas, monospace" fill="#1d4ed8">CLUSTER SHARDS</tspan> 比对：c1 视图 6 个地址正常，c2 / c3 视图里「自己那一项」是旧 IP —— 一比对就暴露。</text>
    <text x="16" y="80" font-size="12.5" fill="#334155">② <tspan font-family="Consolas, monospace" fill="#1d4ed8">redis-cli CONFIG SET cluster-announce-ip 当前 IP</tspan>（该参数支持运行时修改）。</text>
    <text x="16" y="106" font-size="12.5" fill="#166534">③ 确认收敛：三节点视图一致后客户端恢复。部署时把 cluster-announce-ip / port / bus-port 写进配置，别靠默认自探测。</text>
  </g>

  <g transform="translate(20,590)">
    <rect x="0" y="0" width="960" height="50" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="16" y="22" font-size="12.5" font-weight="bold" fill="#0f172a">生产判据：容器 / K8s 里 Pod 的 IP 是会变的，而节点的「自我宣告地址」默认由它自己探测，重启后可能仍报旧值。</text>
    <text x="16" y="42" font-size="12" fill="#64748b">K8s 下配合 Service / Headless Service 用固定 DNS 名更稳。</text>
  </g>
</svg>
