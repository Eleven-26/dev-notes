<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwR" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#dc2626"/></marker>
    <marker id="arwG" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">延迟队列：缝在「取出来」与「删掉」之间</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">300 个已到期任务、两个消费者并发抢；score 全部已过期，Redis 8.10.2 实测</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. ZRANGEBYSCORE + ZREM：两次调用之间有一条缝</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">两个消费者都先「看」再「删」，看到的是同一批任务</text>

    <line x1="90" y1="58" x2="90" y2="168" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="280" y1="58" x2="280" y2="168" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="640" y1="58" x2="640" y2="168" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="90" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">消费者 A</text>
    <text x="280" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">消费者 B</text>
    <text x="640" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Redis</text>

    <line x1="100" y1="78" x2="630" y2="78" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <text x="104" y="74" font-size="10" fill="#1e40af">ZRANGEBYSCORE 0 now → 拿到 task1..task10</text>

    <line x1="290" y1="102" x2="630" y2="102" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <text x="294" y="98" font-size="10" fill="#1e40af">另一个消费者做同一件事 → 拿到完全相同的 10 条</text>

    <line x1="100" y1="132" x2="630" y2="132" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>
    <text x="104" y="128" font-size="10" fill="#991b1b">ZREM ×10：只有我删掉的几条算我的</text>

    <line x1="290" y1="156" x2="630" y2="156" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>
    <text x="294" y="152" font-size="10" fill="#991b1b">ZREM ×10：已被对方删掉，返回 0（实测 286 次白取）</text>
  </g>

  <g transform="translate(20,272)">
    <rect x="0" y="0" width="960" height="150" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 合成一次 Lua：缝消失，重复领取在结构上不可能</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">EVAL 在服务端一次执行完 range 与 zrem，Redis 单线程保证两次领取不会重叠</text>

    <line x1="90" y1="58" x2="90" y2="116" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="280" y1="58" x2="280" y2="116" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="640" y1="58" x2="640" y2="116" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="90" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">消费者 A</text>
    <text x="280" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">消费者 B</text>
    <text x="640" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Redis</text>

    <line x1="100" y1="82" x2="630" y2="82" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>
    <text x="104" y="78" font-size="10" fill="#14532d">EVAL claim 10 → 我拿到 10 条，且它们已被删除</text>

    <line x1="290" y1="108" x2="630" y2="108" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>
    <text x="294" y="104" font-size="10" fill="#14532d">EVAL claim 10 → 拿到另外 10 条，两次领取不重叠</text>

    <text x="14" y="138" font-size="9.5" fill="#475569">实测 300 个任务：非原子版 A 173 + B 127、白取 286 次（试了 586 次）；Lua 版 A 150 + B 150、重复 0，耗时 25.7 ms</text>
  </g>

  <rect x="20" y="430" width="960" height="32" fill="#ffffff" stroke="none"/>
  <text x="20" y="446" font-size="11" fill="#475569">「任务一个没丢」不等于「没有被重复处理」：只要读取与删除是两次调用，中间那段就是并发窗口。</text>
</svg>
