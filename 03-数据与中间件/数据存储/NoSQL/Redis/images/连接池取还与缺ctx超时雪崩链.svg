<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#334155"/>
    </marker>
    <marker id="arwG" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#16a34a"/>
    </marker>
    <marker id="arwR" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">池参数管「容量」，ctx 管「寿命」—— 缺一个就会走通故障链</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">流程图 —— 参数取自本篇第一节代码：PoolSize 100、MinIdleConns 10、PoolTimeout 2s、DialTimeout 2s、Read/WriteTimeout 1s；故障链来自「context 超时」一节（示意）</text>

  <g transform="translate(20,84)">
    <rect x="0" y="0" width="960" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="14" font-weight="bold" fill="#166534">正常路径：借出 → 限时执行 → 归还</text>

    <rect x="20" y="46" width="180" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="110" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">发起命令</text>
    <text x="110" y="90" text-anchor="middle" font-size="11" fill="#334155">ctx 带 deadline</text>
    <text x="110" y="106" text-anchor="middle" font-size="11" fill="#334155">（示例 300ms）</text>

    <line x1="200" y1="82" x2="226" y2="82" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>

    <rect x="228" y="46" width="200" height="72" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
    <text x="328" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">从池取连接</text>
    <text x="328" y="86" text-anchor="middle" font-size="11" fill="#64748b">MinIdleConns 10 常备空闲</text>
    <text x="328" y="104" text-anchor="middle" font-size="11" fill="#64748b">池未满（&lt;100）→ 新建</text>
    <text x="328" y="112" text-anchor="middle" font-size="1" fill="#64748b"> </text>

    <line x1="428" y1="82" x2="454" y2="82" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>

    <rect x="456" y="46" width="200" height="72" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
    <text x="556" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">限时执行</text>
    <text x="556" y="86" text-anchor="middle" font-size="11" fill="#64748b">建连 DialTimeout 2s</text>
    <text x="556" y="104" text-anchor="middle" font-size="11" fill="#64748b">读写 Read/WriteTimeout 1s</text>

    <line x1="656" y1="82" x2="682" y2="82" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>

    <rect x="684" y="46" width="160" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="764" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">归还连接</text>
    <text x="764" y="90" text-anchor="middle" font-size="11" fill="#334155">超时 / 出错也要归还</text>

    <rect x="860" y="46" width="84" height="72" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="902" y="72" text-anchor="middle" font-size="11" fill="#dc2626">池满时：</text>
    <text x="902" y="90" text-anchor="middle" font-size="11" fill="#334155">等 Pool</text>
    <text x="902" y="106" text-anchor="middle" font-size="11" fill="#334155">Timeout 2s</text>

    <text x="16" y="146" font-size="11.5" fill="#64748b">等待超过 PoolTimeout 仍拿不到连接 → 本次命令报错上抛（好过无限堆积）；代码里另有 MaxRetries 2 限制重试次数。</text>
    <text x="16" y="170" font-size="11.5" fill="#166534">启动自检：Ping 带 3s ctx，失败即 panic —— 别让服务「带病启动」。</text>
  </g>

  <g transform="translate(20,304)">
    <rect x="0" y="0" width="960" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="14" font-weight="bold" fill="#dc2626">故障链：直接传 context.Background()（无 deadline）</text>

    <rect x="20" y="46" width="270" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="155" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">① Redis 变慢 / 网络抖动</text>
    <text x="155" y="88" text-anchor="middle" font-size="11.5" fill="#334155">命令迟迟不返回</text>

    <line x1="290" y1="74" x2="330" y2="74" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>

    <rect x="332" y="46" width="280" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="472" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">② 该 goroutine 无限等下去</text>
    <text x="472" y="88" text-anchor="middle" font-size="11.5" fill="#334155">ctx 没有 deadline，没人喊停</text>

    <line x1="612" y1="74" x2="652" y2="74" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>

    <rect x="654" y="46" width="286" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="797" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">③ 连接被占住不归还</text>
    <text x="797" y="88" text-anchor="middle" font-size="11.5" fill="#334155">PoolSize 100 被越占越满</text>

    <path d="M 797 102 L 797 132 L 165 132 L 165 156" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>

    <rect x="20" y="160" width="440" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="240" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">④ 后续请求拿不到连接</text>
    <text x="240" y="200" text-anchor="middle" font-size="11.5" fill="#334155">等满 PoolTimeout 2s 后成片失败</text>

    <rect x="480" y="160" width="460" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="710" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#ea580c">⑤ 终局：整条调用链雪崩</text>
    <text x="710" y="200" text-anchor="middle" font-size="11.5" fill="#334155">一个 Redis 调用点拖垮上游所有依赖它的请求</text>
  </g>

  <g transform="translate(20,554)">
    <rect x="0" y="0" width="960" height="66" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="16" y="26" font-size="12.5" font-weight="bold" fill="#0f172a">✅ 更好的做法：复用上游 HTTP / RPC 请求传入的 ctx（天然带 deadline），而不是每层新造。</text>
    <text x="16" y="50" font-size="12" fill="#64748b">判据：全文每个 rdb.XXX(ctx, …) 的 ctx 必须能回答两个问题 —— 谁给它设了期限？期限到了谁受益（连接被释放）？</text>
  </g>
</svg>
