<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">SDS：追加为什么不必每次都 realloc</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">头部记长度 + 多要一点余量；8 行读数取自 redis:7-alpine（7.4.11）的 MEMORY USAGE 容器实测</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="960" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="16" font-weight="bold" fill="#0f172a">结构：一个头 + 一段字节数组（按长度选 8 / 16 / 32 / 64 位头）</text>

    <rect x="20" y="46" width="70" height="40" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
    <text x="55" y="71" text-anchor="middle" font-size="13" fill="#334155">len</text>
    <rect x="90" y="46" width="70" height="40" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
    <text x="125" y="71" text-anchor="middle" font-size="13" fill="#334155">alloc</text>
    <rect x="160" y="46" width="76" height="40" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
    <text x="198" y="71" text-anchor="middle" font-size="13" fill="#334155">flags</text>
    <rect x="236" y="46" width="360" height="40" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
    <text x="416" y="71" text-anchor="middle" font-size="13" fill="#334155">buf[]　数据……（末尾仍留一个 \0）</text>

    <text x="55" y="106" text-anchor="middle" font-size="12" fill="#64748b">已用长度</text>
    <text x="125" y="106" text-anchor="middle" font-size="12" fill="#64748b">总容量</text>
    <text x="198" y="106" text-anchor="middle" font-size="12" fill="#64748b">低 3 位标类型</text>

    <text x="20" y="134" font-size="12.5" fill="#334155">⭐ 三个字段各自回答一个问题：</text>
    <text x="20" y="156" font-size="12.5" fill="#334155">len → STRLEN 是 O(1)；buf 按长度读写 → 二进制安全（不认 \0 截断）；alloc − len → 预分配余量。</text>
  </g>

  <g transform="translate(20,262)">
    <rect x="0" y="0" width="960" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="16" font-weight="bold" fill="#0f172a">8 行实测：要看的是「台阶」，不是绝对值</text>

    <text x="30" y="58" font-size="12.5" font-weight="bold" fill="#475569">操作</text>
    <text x="270" y="58" font-size="12.5" font-weight="bold" fill="#475569">len</text>
    <text x="360" y="58" font-size="12.5" font-weight="bold" fill="#475569">encoding</text>
    <text x="470" y="58" font-size="12.5" font-weight="bold" fill="#475569">MEMORY USAGE</text>
    <text x="620" y="58" font-size="12.5" font-weight="bold" fill="#475569">台阶 / 规则</text>
    <line x1="24" y1="66" x2="936" y2="66" stroke="#cbd5e1" stroke-width="1"/>

    <text x="30" y="88" font-size="12.5" fill="#334155">初始 SET</text>
    <text x="270" y="88" font-size="12.5" fill="#334155">10</text>
    <text x="360" y="88" font-size="12.5" fill="#334155">embstr</text>
    <text x="470" y="88" font-size="12.5" fill="#334155">72 B</text>

    <text x="30" y="118" font-size="12.5" fill="#334155">APPEND 到 20 字节</text>
    <text x="270" y="118" font-size="12.5" fill="#334155">20</text>
    <text x="360" y="118" font-size="12.5" fill="#334155">raw</text>
    <text x="470" y="118" font-size="12.5" fill="#334155">104 B</text>

    <text x="30" y="148" font-size="12.5" fill="#334155">APPEND 到 40 字节</text>
    <text x="270" y="148" font-size="12.5" fill="#334155">40</text>
    <text x="360" y="148" font-size="12.5" fill="#334155">raw</text>
    <text x="470" y="148" font-size="12.5" fill="#334155">104 B</text>
    <rect x="460" y="104" width="100" height="58" rx="3" fill="none" stroke="#dc2626" stroke-width="2"/>
    <text x="578" y="127" font-size="12.5" font-weight="bold" fill="#dc2626">len 翻倍，内存没变</text>
    <text x="578" y="147" font-size="12" fill="#64748b">多出来的正是 alloc − len</text>

    <text x="30" y="178" font-size="12.5" fill="#334155">APPEND 到 80 字节</text>
    <text x="270" y="178" font-size="12.5" fill="#334155">80</text>
    <text x="360" y="178" font-size="12.5" fill="#334155">raw</text>
    <text x="470" y="178" font-size="12.5" fill="#334155">248 B</text>

    <text x="30" y="208" font-size="12.5" fill="#334155">APPEND 到 160 字节</text>
    <text x="270" y="208" font-size="12.5" fill="#334155">160</text>
    <text x="360" y="208" font-size="12.5" fill="#334155">raw</text>
    <text x="470" y="208" font-size="12.5" fill="#334155">248 B</text>
    <rect x="460" y="164" width="100" height="58" rx="3" fill="none" stroke="#dc2626" stroke-width="2"/>
    <text x="578" y="187" font-size="12.5" font-weight="bold" fill="#dc2626">又是同一档</text>
    <text x="578" y="207" font-size="12" fill="#64748b">80 → 160 落在同一 size class</text>

    <text x="30" y="238" font-size="12.5" fill="#334155">APPEND 到 1000 字节</text>
    <text x="270" y="238" font-size="12.5" fill="#334155">1000</text>
    <text x="360" y="238" font-size="12.5" fill="#334155">raw</text>
    <text x="470" y="238" font-size="12.5" fill="#334155">2104 B</text>

    <text x="30" y="268" font-size="12.5" fill="#334155">APPEND 到 100000 字节</text>
    <text x="270" y="268" font-size="12.5" fill="#334155">100000</text>
    <text x="360" y="268" font-size="12.5" fill="#334155">raw</text>
    <text x="470" y="268" font-size="12.5" fill="#334155">229432 B</text>
    <text x="620" y="268" font-size="12.5" fill="#b45309">&lt; 1MB → 2 × 新长度</text>

    <text x="30" y="298" font-size="12.5" fill="#334155">APPEND 到 1200000 字节</text>
    <text x="270" y="298" font-size="12.5" fill="#334155">1200000</text>
    <text x="360" y="298" font-size="12.5" fill="#334155">raw</text>
    <text x="470" y="298" font-size="12.5" fill="#334155">2621496 B</text>
    <text x="620" y="298" font-size="12.5" fill="#b45309">≥ 1MB → 只多留 1MB</text>
  </g>

  <g transform="translate(20,604)">
    <rect x="0" y="0" width="960" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" font-size="14" font-weight="bold" fill="#0f172a">口径提醒</text>
    <text x="16" y="50" font-size="12.5" fill="#334155">转换点是硬编码的 44 字节（String）与各项 max-listpack-* 配置；越过后编码只升不降，删元素也不会退回。</text>
    <text x="16" y="74" font-size="12.5" fill="#b45309">⚠️ 读数含 redisObject（16 B）与 SDS 头，且 jemalloc 会把相邻尺寸并进同一 size class —— 所以看台阶、别看绝对值。</text>
  </g>
</svg>
