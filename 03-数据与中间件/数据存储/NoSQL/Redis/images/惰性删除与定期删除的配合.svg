<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#334155"/>
    </marker>
    <marker id="arwB" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#2563eb"/>
    </marker>
    <marker id="arwG" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">过期 key 的两条释放路径：各管一头，缺一不可</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">流程图 —— 对应本篇第五节删除策略表：惰性删除「访问时才查」，定期删除「后台每秒 10 次抽样」；TTL 返回 -1 永久、-2 不存在（示意）</text>

  <g transform="translate(20,80)">
    <rect x="0" y="0" width="960" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#1d4ed8">路径一：惰性删除 —— 保证「读到的一定没错」</text>

    <rect x="20" y="48" width="160" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="100" y="74" text-anchor="middle" font-size="12.5" fill="#334155">请求访问 key</text>
    <text x="100" y="96" text-anchor="middle" font-size="11.5" fill="#1d4ed8">GET / TTL …</text>

    <line x1="180" y1="80" x2="208" y2="80" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="210" y="48" width="180" height="64" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
    <text x="300" y="74" text-anchor="middle" font-size="12.5" fill="#334155">此时才检查</text>
    <text x="300" y="96" text-anchor="middle" font-size="11.5" fill="#64748b">是否已过期</text>

    <line x1="390" y1="80" x2="418" y2="80" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="420" y="48" width="230" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="535" y="70" text-anchor="middle" font-size="12.5" fill="#166534">已过期 → 删除、按过期处理</text>
    <text x="535" y="92" text-anchor="middle" font-size="11.5" fill="#334155">返回 nil（物理键可能还躺着）</text>

    <line x1="650" y1="80" x2="678" y2="80" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

    <rect x="680" y="40" width="260" height="44" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="810" y="66" text-anchor="middle" font-size="12" fill="#334155">未过期 → 正常返回值</text>

    <text x="680" y="104" font-size="12" fill="#dc2626">⚠️ 缺点（表中原话）：不被访问的</text>
    <text x="680" y="122" font-size="12" fill="#dc2626">key 永不释放 —— 内存谁来还？</text>

    <text x="16" y="162" font-size="11.5" fill="#64748b">优点：不浪费 CPU，只在真正要读数的那一刻花一次检查。</text>
  </g>

  <g transform="translate(20,280)">
    <rect x="0" y="0" width="960" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#166534">路径二：定期删除 —— 保证「内存最终还得掉」</text>

    <rect x="20" y="48" width="200" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="120" y="70" text-anchor="middle" font-size="12.5" fill="#166534">后台定时任务</text>
    <text x="120" y="92" text-anchor="middle" font-size="11.5" fill="#334155">每秒 10 次</text>

    <line x1="220" y1="80" x2="248" y2="80" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>

    <rect x="250" y="48" width="220" height="64" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
    <text x="360" y="70" text-anchor="middle" font-size="12.5" fill="#334155">从过期字典「抽样」</text>
    <text x="360" y="92" text-anchor="middle" font-size="11.5" fill="#64748b">不是全量扫描</text>

    <line x1="470" y1="80" x2="498" y2="80" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>

    <rect x="500" y="48" width="200" height="64" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
    <text x="600" y="70" text-anchor="middle" font-size="12.5" fill="#334155">删掉其中已过期的</text>
    <text x="600" y="92" text-anchor="middle" font-size="11.5" fill="#64748b">兜住惰性删除的漏网之鱼</text>

    <rect x="720" y="48" width="220" height="64" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
    <text x="830" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#ea580c">⚠️ 抽样而非全扫</text>
    <text x="830" y="92" text-anchor="middle" font-size="11.5" fill="#334155">可能有残留</text>

    <text x="16" y="132" font-size="11.5" fill="#64748b">两条路径的分工：惰性删除管「读正确」，定期删除管「内存释放」；共同点是都不保证过期瞬间物理消失。</text>
  </g>

  <g transform="translate(20,450)">
    <rect x="0" y="0" width="960" height="84" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="16" y="28" font-size="14" font-weight="bold" fill="#0f172a">为什么不用「每个 key 挂一个定时器」？</text>
    <text x="16" y="54" font-size="12.5" fill="#334155">百万级 key 就要维护百万个定时任务，<tspan font-weight="bold" fill="#dc2626">内存与 CPU 开销不可接受</tspan>；抽样扫描是「用可控成本把过期 key 压在低水位」的折中。</text>
    <text x="16" y="74" font-size="11.5" fill="#64748b">过期范围只在设了 TTL 的 key 里谈 —— 淘汰策略（触顶后删谁）见 淘汰策略.md。</text>
  </g>
</svg>
