<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">MongoDB 目录阅读路线与篇目依赖</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">先读决定性能的两篇，再按需进入集群、加密与运维；每篇独立成文，靠「关联」互相指路（依据本篇第四节）</text>

  <rect x="20" y="80" width="960" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="104" font-size="14" font-weight="bold" fill="#0f172a">第一层 · 先读：决定性能的两篇</text>

  <rect x="120" y="120" width="230" height="88" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="235" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">数据建模.md</text>
  <text x="235" y="163" text-anchor="middle" font-size="11" fill="#334155">内嵌还是引用、16MB 与写放大</text>
  <text x="235" y="183" text-anchor="middle" font-size="11" fill="#334155">attribute / subset / buckets 模式</text>

  <rect x="650" y="120" width="230" height="88" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="765" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">索引原理.md</text>
  <text x="765" y="163" text-anchor="middle" font-size="11" fill="#334155">ESR 顺序、覆盖索引、最左前缀</text>
  <text x="765" y="183" text-anchor="middle" font-size="11" fill="#334155">planner 选索引、explain 完整读法</text>

  <line x1="235" y1="230" x2="235" y2="252" stroke="#334155" stroke-width="1.5" marker-end="url(#ar2)"/>
  <line x1="765" y1="230" x2="765" y2="252" stroke="#334155" stroke-width="1.5" marker-end="url(#ar2)"/>

  <rect x="20" y="254" width="960" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="278" font-size="14" font-weight="bold" fill="#0f172a">第二层 · 能力与集群：在此之上按需展开</text>

  <rect x="30" y="292" width="128" height="88" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="94" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">聚合管道.md</text>
  <text x="94" y="332" text-anchor="middle" font-size="10.5" fill="#334155">stage 顺序</text>
  <text x="94" y="350" text-anchor="middle" font-size="10.5" fill="#334155">与内存约束</text>
  <text x="94" y="368" text-anchor="middle" font-size="10.5" fill="#334155">lookup 代价</text>

  <rect x="164" y="292" width="128" height="88" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="228" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">副本集与选举.md</text>
  <text x="228" y="332" text-anchor="middle" font-size="10.5" fill="#334155">选主与故障转移</text>
  <text x="228" y="350" text-anchor="middle" font-size="10.5" fill="#334155">oplog 复制</text>
  <text x="228" y="368" text-anchor="middle" font-size="10.5" fill="#334155">读写关注</text>

  <rect x="298" y="292" width="128" height="88" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="362" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">分片基础.md</text>
  <text x="362" y="332" text-anchor="middle" font-size="10.5" fill="#334155">chunk、balancer</text>
  <text x="362" y="350" text-anchor="middle" font-size="10.5" fill="#334155">片键三目标</text>
  <text x="362" y="368" text-anchor="middle" font-size="10.5" fill="#334155">range vs hashed</text>

  <line x1="428" y1="336" x2="448" y2="336" stroke="#334155" stroke-width="1.5" marker-end="url(#ar2)"/>

  <rect x="450" y="292" width="128" height="88" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="514" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">分片增强与</text>
  <text x="514" y="321" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">在线操作.md</text>
  <text x="514" y="341" text-anchor="middle" font-size="10.5" fill="#334155">在线重分片</text>
  <text x="514" y="357" text-anchor="middle" font-size="10.5" fill="#334155">moveCollection</text>
  <text x="514" y="373" text-anchor="middle" font-size="10.5" fill="#334155">8.0 均衡提速</text>

  <rect x="584" y="292" width="128" height="88" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="648" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">事务与一致性.md</text>
  <text x="648" y="332" text-anchor="middle" font-size="10.5" fill="#334155">硬边界</text>
  <text x="648" y="350" text-anchor="middle" font-size="10.5" fill="#334155">闭包可重放</text>
  <text x="648" y="368" text-anchor="middle" font-size="10.5" fill="#334155">替代手段优先级</text>

  <rect x="718" y="292" width="128" height="88" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="782" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">时间序列集合.md</text>
  <text x="782" y="332" text-anchor="middle" font-size="10.5" fill="#334155">桶文档</text>
  <text x="782" y="350" text-anchor="middle" font-size="10.5" fill="#334155">列式压缩</text>
  <text x="782" y="368" text-anchor="middle" font-size="10.5" fill="#334155">时序索引策略</text>

  <rect x="852" y="292" width="124" height="88" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="914" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">可查询加密.md</text>
  <text x="914" y="332" text-anchor="middle" font-size="10.5" fill="#334155">CSFLE 与 QE</text>
  <text x="914" y="350" text-anchor="middle" font-size="10.5" fill="#334155">等值 / 范围 /</text>
  <text x="914" y="368" text-anchor="middle" font-size="10.5" fill="#334155">子串的演进</text>

  <line x1="500" y1="394" x2="500" y2="416" stroke="#334155" stroke-width="1.5" marker-end="url(#ar2)"/>

  <rect x="20" y="418" width="960" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="442" font-size="14" font-weight="bold" fill="#0f172a">第三层 · 工程与落地：独立成文，按需查阅</text>

  <rect x="60" y="456" width="200" height="76" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="160" y="476" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">客户端使用.md</text>
  <text x="160" y="496" text-anchor="middle" font-size="10.5" fill="#475569">Go v1 / v2、Java 驱动</text>
  <text x="160" y="514" text-anchor="middle" font-size="10.5" fill="#475569">Spring Data 等价写法</text>

  <rect x="300" y="456" width="200" height="76" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="400" y="476" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">运维与监控.md</text>
  <text x="400" y="496" text-anchor="middle" font-size="10.5" fill="#475569">连接池、WT cache、compact</text>
  <text x="400" y="514" text-anchor="middle" font-size="10.5" fill="#475569">监控指标清单</text>

  <rect x="540" y="456" width="200" height="76" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="640" y="476" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">应用与场景.md</text>
  <text x="640" y="496" text-anchor="middle" font-size="10.5" fill="#475569">五类典型场景 + Go 实现</text>
  <text x="640" y="514" text-anchor="middle" font-size="10.5" fill="#475569">把各篇落到具体系统</text>

  <rect x="780" y="456" width="190" height="76" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="875" y="476" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">9.0新特性速览.md</text>
  <text x="875" y="496" text-anchor="middle" font-size="10.5" fill="#475569">四类变化 + 兼容性回归</text>
  <text x="875" y="514" text-anchor="middle" font-size="10.5" fill="#475569">升级前查阅</text>

  <text x="30" y="576" font-size="12" fill="#64748b">显式依赖只有两条：分片基础 → 分片增强与在线操作（同一主题的 5.0~8.0 增量）；事务的前提是副本集 / 分片（4.0 副本集事务、4.2 分片事务）。</text>
  <text x="30" y="598" font-size="12" fill="#64748b">只想快速上手：读「数据建模 + 索引原理」两篇即可，其余都是在此之上的运维与可靠性话题。</text>
</svg>
