<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">9.0 单次操作内存上限：两层护栏与失败出口</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">9.0 新增的是整条操作的全局上限；单个 stage 的 100 MB 上限与溢盘行为不变（依据本篇 2.1 节）</text>

  <rect x="330" y="80" width="340" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="500" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">一条查询操作：排序 / 聚合 /</text>
  <text x="500" y="120" text-anchor="middle" font-size="12.5" fill="#334155">无 limit 的全量扫描</text>

  <line x1="500" y1="132" x2="500" y2="156" stroke="#334155" stroke-width="1.6" marker-end="url(#ar3)"/>

  <rect x="240" y="158" width="520" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="182" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">第一层护栏：单个 stage 上限（行为不变）</text>
  <text x="500" y="204" text-anchor="middle" font-size="11.5" fill="#334155">单 stage 100 MB 上限照旧</text>
  <text x="500" y="224" text-anchor="middle" font-size="11.5" fill="#334155">允许溢盘（spill to disk）继续执行</text>
  <text x="500" y="244" text-anchor="middle" font-size="11.5" fill="#1e3a8a">9.0 没有改动这一层</text>

  <line x1="500" y1="254" x2="500" y2="278" stroke="#334155" stroke-width="1.6" marker-end="url(#ar3)"/>

  <rect x="240" y="280" width="520" height="100" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
  <text x="500" y="304" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9a3412">第二层护栏：整条操作的全局上限（⭐ 9.0 新增）</text>
  <text x="500" y="326" text-anchor="middle" font-size="11.5" fill="#334155">默认 = max（1 GB，服务端进程可用内存的 20%）</text>
  <text x="500" y="346" text-anchor="middle" font-size="11.5" fill="#334155">统计的是整条操作，而不是某一个 stage</text>
  <text x="500" y="366" text-anchor="middle" font-size="11.5" fill="#9a3412">目的：把「一条查询无限吃内存拖垮实例」变成可控失败</text>

  <line x1="380" y1="380" x2="252" y2="430" stroke="#334155" stroke-width="1.6" marker-end="url(#ar3)"/>
  <line x1="620" y1="380" x2="748" y2="430" stroke="#334155" stroke-width="1.6" marker-end="url(#ar3)"/>
  <text x="270" y="404" font-size="11.5" fill="#15803d">未超限</text>
  <text x="688" y="404" font-size="11.5" fill="#b91c1c">超限</text>

  <rect x="60" y="432" width="380" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="250" y="455" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">✅ 正常返回结果</text>
  <text x="250" y="476" text-anchor="middle" font-size="11" fill="#334155">行为与 8.x 一致，无需改动</text>

  <rect x="560" y="432" width="380" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="750" y="455" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b91c1c">⚠️ 报错：可控失败</text>
  <text x="750" y="476" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#7f1d1d">ExceededMemoryLimit / QueryExceededMemoryLimitNoDiskUseAllowed</text>

  <line x1="750" y1="488" x2="750" y2="512" stroke="#334155" stroke-width="1.6" marker-end="url(#ar3)"/>

  <rect x="560" y="514" width="380" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="750" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">应对手段</text>
  <text x="750" y="554" text-anchor="middle" font-size="11" fill="#475569">allowDiskUse，或在进入护栏前先收窄输入</text>

  <text x="60" y="530" font-size="11.5" fill="#475569">升级后重点盯的观测项（本篇「使用」一节）：</text>
  <text x="60" y="550" font-size="11" font-family="Consolas, Menlo, monospace" fill="#475569">metrics.query.operationsFailedDueToMemoryLimit</text>
  <text x="60" y="570" font-size="11" font-family="Consolas, Menlo, monospace" fill="#475569">metrics.query.peakMemoryUsageOperation</text>
  <text x="60" y="592" font-size="11.5" fill="#9a3412">失败计数抬头 = 有查询撞上了新上限。</text>
</svg>
