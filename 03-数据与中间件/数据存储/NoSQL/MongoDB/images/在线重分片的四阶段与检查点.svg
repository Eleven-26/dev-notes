<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" height="790" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ab2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="790" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">在线重分片：源与目标并存的四阶段</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">reshardCollection 把「停机窗口」换成「更长的资源占用窗口」</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="960" height="215" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">四阶段：建新集合 → 双写 → 拉取追赶 → 切换并清理</text>

    <rect x="30" y="44" width="210" height="104" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="135" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">阶段 1　建新集合</text>
    <text x="46" y="90" font-size="11.5" fill="#334155">在目标分片上按新片键</text>
    <text x="46" y="108" font-size="11.5" fill="#334155">建立新集合（含新索引）</text>
    <text x="46" y="128" font-size="11.5" fill="#15803d">新片键索引自动创建</text>
    <line x1="242" y1="96" x2="256" y2="96" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab2)"/>

    <rect x="260" y="44" width="210" height="104" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="365" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">阶段 2　双写</text>
    <text x="276" y="90" font-size="11.5" fill="#334155">源集合上的写入同时</text>
    <text x="276" y="108" font-size="11.5" fill="#334155">记录到新集合的变更流</text>
    <text x="276" y="128" font-size="11.5" fill="#c2410c">持续占用写入带宽</text>
    <line x1="472" y1="96" x2="486" y2="96" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab2)"/>

    <rect x="490" y="44" width="210" height="104" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="595" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">阶段 3　拉取 + 追赶</text>
    <text x="506" y="90" font-size="11.5" fill="#334155">后台按新片键区间拉历史</text>
    <text x="506" y="108" font-size="11.5" fill="#334155">数据，再追增量直到追平</text>
    <text x="506" y="128" font-size="11.5" fill="#c2410c">会抬高从节点 lag</text>
    <line x1="702" y1="96" x2="716" y2="96" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab2)"/>

    <rect x="720" y="44" width="210" height="104" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="825" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">阶段 4　切换 + 清理</text>
    <text x="736" y="90" font-size="11.5" fill="#334155">追平后短暂切换路由</text>
    <text x="736" y="108" font-size="11.5" fill="#334155">（ownership 交接）</text>
    <text x="736" y="128" font-size="11.5" fill="#334155">随后清理旧集合</text>

    <text x="20" y="172" font-size="12" fill="#334155">要点：全程源集合与目标集合并存 → 需要额外磁盘与额外写入带宽，耗时随数据量增长。</text>
    <text x="20" y="196" font-size="12" fill="#c2410c">注意：它把「停机窗口」换成了「更长的资源占用窗口」，不是免费的。</text>
  </g>

  <g transform="translate(20,305)">
    <rect x="0" y="0" width="960" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">三个检查点与中止的代价</text>

    <rect x="20" y="40" width="920" height="28" rx="4" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="59" font-size="12" font-weight="bold" fill="#0f172a">检查项</text>
    <text x="250" y="59" font-size="12" font-weight="bold" fill="#0f172a">看什么</text>
    <text x="480" y="59" font-size="12" font-weight="bold" fill="#0f172a">判据</text>

    <rect x="20" y="68" width="920" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="87" font-size="11.5" fill="#334155">资源够不够</text>
    <text x="250" y="87" font-size="11.5" fill="#334155">源 + 目标并存</text>
    <text x="480" y="87" font-size="11.5" fill="#334155">磁盘与写入带宽要留一倍余量</text>

    <rect x="20" y="96" width="920" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="115" font-size="11.5" fill="#334155">进度</text>
    <text x="250" y="115" font-size="11.5" fill="#334155">$currentOp + 从节点 lag</text>
    <text x="480" y="115" font-size="11.5" fill="#334155">能看到 resharding 子阶段；lag 逼近 oplog 窗口就评估中止</text>

    <rect x="20" y="124" width="920" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="34" y="143" font-size="11.5" fill="#334155">切完之后</text>
    <text x="250" y="143" font-size="11.5" fill="#334155">getShardDistribution() + explain</text>
    <text x="480" y="143" font-size="11.5" fill="#334155">chunk 数是否均衡；常用查询是否定向</text>

    <rect x="20" y="164" width="920" height="46" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="34" y="186" font-size="12" font-weight="bold" fill="#dc2626">中止：abortReshardCollection</text>
    <text x="34" y="204" font-size="11.5" fill="#334155">集合回到源结构，已投入的 IO 与写入放大不会退还，且中止本身也要时间。</text>

    <line x1="500" y1="156" x2="500" y2="162" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ar2)"/>
  </g>

  <g transform="translate(20,555)">
    <rect x="0" y="0" width="960" height="215" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">两个常见误解与两条硬约束</text>

    <rect x="30" y="44" width="440" height="76" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
    <text x="46" y="66" font-size="12" font-weight="bold" fill="#dc2626">误解：必须先手工给新片键建索引</text>
    <text x="46" y="88" font-size="11.5" fill="#334155">重分片过程会自动创建新片键索引，不需要预先建。</text>
    <text x="46" y="108" font-size="11.5" fill="#334155">要算的反而是资源：源与目标并存期间的磁盘与带宽。</text>

    <rect x="490" y="44" width="440" height="76" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
    <text x="506" y="66" font-size="12" font-weight="bold" fill="#dc2626">误解：可以原地改成相同的片键</text>
    <text x="506" y="88" font-size="11.5" fill="#334155">不能重分片到完全相同的片键；8.0 起的「同键重分片」</text>
    <text x="506" y="108" font-size="11.5" fill="#334155">是为了重新分布数据、打散倾斜，不是改键。</text>

    <text x="20" y="146" font-size="12" fill="#334155">预铺 chunk：numInitialChunks 可一次性铺够（示例里取 64），避免切完立刻又触发均衡。</text>
    <text x="20" y="170" font-size="12" fill="#334155">跨分片事务：提交要触及所有参与分片，多一轮两阶段协调，延迟随参与分片数上升。</text>
    <text x="20" y="194" font-size="12" fill="#c2410c">注意：9.0 起并发多文档事务有默认上限 10000（maxConcurrentMultiDocumentTransactions），超出返回 TooManyOpenTransactions。</text>
  </g>
</svg>
