<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">NoSQL 选型：按「起点资产」分派</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">先过第一节的三条准入判据这道门，再按手里已有的存储走 A / B / C / D 四条决策线</text>

  <rect x="30" y="78" width="940" height="78" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="45" y="100" font-size="13" font-weight="bold" fill="#0f172a">门：三条准入判据要同时成立，缺一条就留在关系型</text>
  <text x="45" y="124" font-size="10.5" fill="#1e40af">① 要水平扩展且不愿靠中间件分片　② 形态与访问模式天然不按表来　③ 能接受放弃跨行强事务与 JOIN</text>
  <text x="45" y="146" font-size="10.5" font-weight="bold" fill="#991b1b">任一条不成立 → 留在关系型：先穷尽「索引优化 → 加缓存 → 读写分离 → 垂直拆分」</text>

  <path d="M500,156 V166 H143 V180" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M500,156 V166 H381 V180" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M500,156 V166 H619 V180" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M500,156 V166 H857 V180" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="30" y="170" width="226" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="268" y="170" width="226" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="506" y="170" width="226" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="744" y="170" width="226" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 3"/>

  <rect x="42" y="182" width="202" height="46" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="143" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">A · 已经有 MySQL</text>
  <text x="143" y="221" text-anchor="middle" font-size="10.5" fill="#1d4ed8">第一动作：别动存储主干</text>

  <rect x="52" y="240" width="202" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="62" y="259" font-size="10" font-weight="bold" fill="#1e3a8a">只是读得慢、数据还在表里</text>
  <text x="62" y="277" font-size="9.5" fill="#1d4ed8">→ 先加缓存（本地 + KV 两级）</text>
  <text x="62" y="293" font-size="9.5" fill="#1d4ed8">容量按 2.2 的编码账算</text>

  <rect x="52" y="314" width="202" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="62" y="333" font-size="10" font-weight="bold" fill="#1e3a8a">某些字段结构不固定</text>
  <text x="62" y="351" font-size="9.5" fill="#1d4ed8">→ 用 JSON 列 + 生成列</text>
  <text x="62" y="367" font-size="9.5" fill="#1d4ed8">给 JSON 数组建多值索引</text>

  <rect x="52" y="388" width="202" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="62" y="407" font-size="10" font-weight="bold" fill="#1e3a8a">子树整体读写 + 写要水平扩展</text>
  <text x="62" y="425" font-size="9.5" fill="#1d4ed8">→ 才评估文档族</text>
  <text x="62" y="441" font-size="9.5" fill="#1d4ed8">先按 4.2 的三问做纸面建模</text>

  <rect x="280" y="182" width="202" height="46" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="381" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">B · 已经在用 Redis</text>
  <text x="381" y="221" text-anchor="middle" font-size="10.5" fill="#166534">先看它是不是被当权威源</text>

  <rect x="290" y="240" width="202" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="300" y="259" font-size="10" font-weight="bold" fill="#14532d">单实例封顶、机器还有空闲核</text>
  <text x="300" y="277" font-size="9.5" fill="#166534">→ 先分清「单机多实例」与</text>
  <text x="300" y="293" font-size="9.5" fill="#166534">「分槽集群」，别直接上集群</text>

  <rect x="290" y="314" width="202" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="300" y="333" font-size="10" font-weight="bold" fill="#14532d">容量逼近上限、开始淘汰</text>
  <text x="300" y="351" font-size="9.5" fill="#166534">→ 热集切回权威库、只留真热点</text>
  <text x="300" y="367" font-size="9.5" fill="#166534">仍要全放：不淘汰 + 扩容算账</text>

  <rect x="290" y="388" width="202" height="66" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="300" y="407" font-size="10" font-weight="bold" fill="#991b1b">持久化开始承担业务正确性</text>
  <text x="300" y="425" font-size="9.5" fill="#991b1b">⚠️ 危险信号：它在当权威源</text>
  <text x="300" y="441" font-size="9.5" fill="#991b1b">→ 把这份数据挪回有事务与备份的库</text>

  <rect x="518" y="182" width="202" height="46" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
  <text x="619" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">C · 已经在用 MongoDB</text>
  <text x="619" y="221" text-anchor="middle" font-size="10.5" fill="#9a3412">先核建模与片键，再谈事务</text>

  <rect x="528" y="240" width="202" height="66" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="538" y="259" font-size="10" font-weight="bold" fill="#7c2d12">频繁出现跨文档一致性问题</text>
  <text x="538" y="277" font-size="9.5" fill="#9a3412">→ 按替代手段逐级排</text>
  <text x="538" y="293" font-size="9.5" fill="#9a3412">开多文档事务是最后一级</text>

  <rect x="528" y="314" width="202" height="66" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="538" y="333" font-size="10" font-weight="bold" fill="#7c2d12">无界数组 / 逼近 16MB 上限</text>
  <text x="538" y="351" font-size="9.5" fill="#9a3412">→ 重新建模：改引用或分桶</text>
  <text x="538" y="367" font-size="9.5" fill="#9a3412">上限是预警线，不是调参数</text>

  <rect x="528" y="388" width="202" height="66" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="538" y="407" font-size="10" font-weight="bold" fill="#7c2d12">广播到全部分片的查询变多</text>
  <text x="538" y="425" font-size="9.5" fill="#9a3412">→ 片键选错的症状</text>
  <text x="538" y="441" font-size="9.5" fill="#9a3412">先加索引，再评在线重分片代价</text>

  <rect x="756" y="182" width="202" height="46" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="857" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">D · 从零开始</text>
  <text x="857" y="221" text-anchor="middle" font-size="10.5" fill="#475569">7.4 的三问依次筛</text>

  <rect x="766" y="240" width="202" height="66" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="776" y="259" font-size="10" font-weight="bold" fill="#0f172a">要放内存换亚毫秒，还是磁盘？</text>
  <text x="776" y="277" font-size="9.5" fill="#334155">内存 → KV 族</text>
  <text x="776" y="293" font-size="9.5" fill="#334155">磁盘 → 文档族或宽列族</text>

  <rect x="766" y="314" width="202" height="66" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="776" y="333" font-size="10" font-weight="bold" fill="#0f172a">要不要文档模型？</text>
  <text x="776" y="351" font-size="9.5" fill="#334155">整棵子树一次读、字段会变 → 文档族</text>
  <text x="776" y="367" font-size="9.5" fill="#334155">只是字段变一变 → 关系型 JSON 列</text>

  <rect x="766" y="388" width="202" height="66" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="776" y="407" font-size="10" font-weight="bold" fill="#0f172a">要可扩展写入 + 多数据中心？</text>
  <text x="776" y="425" font-size="9.5" fill="#334155">且访问模式能设计期冻结 → 宽列族</text>
  <text x="776" y="441" font-size="9.5" fill="#334155">否则它的运维面就是净损失</text>

  <rect x="30" y="484" width="940" height="72" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="45" y="500" font-size="11" font-weight="bold" fill="#0f172a">各条线剩下的分支（都取自 7.1 ~ 7.3 的表格）：</text>
  <text x="45" y="520" font-size="10.5" fill="#334155">MySQL：单表到千万级、多维组合统计仍是主线 → 分库分表 + 只读副本　Redis：在意许可口径 → 按 4.1 三条判据评估分叉产品（本仓未实测）</text>
  <text x="45" y="540" font-size="10.5" fill="#334155">MongoDB：多维过滤与全文需求变多 → 加检索副本，别硬撑文档模型</text>

  <rect x="30" y="566" width="940" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="45" y="582" font-size="11.5" fill="#334155">⭐ 判据：多数情形的正解是「给现有库加一层」，不是引进新库</text>
  <text x="45" y="602" font-size="11.5" fill="#334155">⚠️ 没有 owner 的存储迟早变成线上事故源；三项全弱（内存族当唯一数据源 + 宽列族改分区键 + 文档族改片键）等于没有退路</text>
</svg>
