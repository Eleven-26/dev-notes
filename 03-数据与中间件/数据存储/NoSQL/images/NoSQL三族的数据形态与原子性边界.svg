<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">NoSQL 三族的数据形态与原子性边界</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">分界线是数据形状 + 原子性边界，不是「功能多少」；最后一行是常被漏掉的替代路线</text>

  <rect x="30" y="76" width="940" height="26" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="245" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">数据形态（形状即差别）</text>
  <text x="580" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">原子性边界</text>
  <text x="835" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">主战场 / 最常见的误用</text>

  <rect x="30" y="110" width="430" height="112" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.4"/>
  <text x="44" y="132" font-size="12.5" font-weight="bold" fill="#1e3a8a">KV / 内存结构族：Redis、Valkey、Memcached</text>
  <rect x="44" y="154" width="64" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="76" y="171" text-anchor="middle" font-size="11" fill="#1e40af">key</text>
  <line x1="108" y1="167" x2="132" y2="167" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="136" y="154" width="80" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="176" y="171" text-anchor="middle" font-size="10.5" fill="#1e40af">集合运算</text>
  <rect x="220" y="154" width="80" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="260" y="171" text-anchor="middle" font-size="10.5" fill="#1e40af">有序榜单</text>
  <rect x="304" y="154" width="80" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="344" y="171" text-anchor="middle" font-size="10.5" fill="#1e40af">位图 · 流</text>
  <text x="44" y="200" font-size="10" fill="#475569">按 key 直达 + 服务端内置结构，把延迟压到亚毫秒</text>

  <rect x="475" y="126" width="210" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="487" y="148" font-size="12" font-weight="bold" fill="#1e40af">边界＝单命令</text>
  <text x="487" y="168" font-size="10" fill="#1e40af">MULTI / EXEC 只保证</text>
  <text x="487" y="186" font-size="10" fill="#1e40af">排队顺序执行</text>
  <text x="487" y="204" font-size="10" font-weight="bold" fill="#1e40af">没有回滚（不是事务）</text>

  <rect x="700" y="126" width="264" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="712" y="144" font-size="11" font-weight="bold" fill="#0f172a">主战场：热集放进内存</text>
  <text x="712" y="162" font-size="10" fill="#334155">计数器 / 榜单 / 锁 / 轻量消息</text>
  <rect x="700" y="176" width="264" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="712" y="192" font-size="10" font-weight="bold" fill="#991b1b">⚠️ 误用：当唯一数据源</text>
  <text x="712" y="208" font-size="10" fill="#991b1b">淘汰触顶 / 写报错 / 恢复缺口</text>

  <rect x="30" y="234" width="430" height="112" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="1.4"/>
  <text x="44" y="256" font-size="12.5" font-weight="bold" fill="#14532d">文档族：MongoDB（BSON 文档嵌套）</text>
  <rect x="44" y="272" width="120" height="22" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="104" y="287" text-anchor="middle" font-size="10.5" fill="#14532d">文档根 · 聚合根</text>
  <path d="M104,294 V300" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <path d="M104,300 H92 V306" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>
  <path d="M104,300 H212 V306" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>
  <path d="M104,300 H330 V306" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="44" y="306" width="96" height="22" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="92" y="321" text-anchor="middle" font-size="9.5" fill="#14532d">子文档</text>
  <rect x="150" y="306" width="124" height="22" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="212" y="321" text-anchor="middle" font-size="9.5" fill="#14532d">数组（无界增长）</text>
  <rect x="284" y="306" width="92" height="22" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="330" y="321" text-anchor="middle" font-size="9.5" fill="#14532d">标量字段</text>
  <text x="44" y="342" font-size="10" fill="#475569">一次读要拿到整棵子树，字段可随时增减</text>

  <rect x="475" y="250" width="210" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="487" y="272" font-size="12" font-weight="bold" fill="#1e40af">边界＝单文档</text>
  <text x="487" y="292" font-size="10" fill="#1e40af">跨文档事务有硬边界</text>
  <text x="487" y="310" font-size="10" fill="#1e40af">16MB 上限＝预警线</text>
  <text x="487" y="328" font-size="10" font-weight="bold" fill="#1e40af">不是护栏：撞了要重建模</text>

  <rect x="700" y="250" width="264" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="712" y="268" font-size="11" font-weight="bold" fill="#0f172a">主战场：嵌套 + 频繁改字段</text>
  <text x="712" y="286" font-size="10" fill="#334155">写入量需要水平扩展</text>
  <rect x="700" y="300" width="264" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="712" y="316" font-size="10" font-weight="bold" fill="#991b1b">⚠️ 误用：当成不用设计 Schema</text>
  <text x="712" y="332" font-size="10" fill="#991b1b">无界数组撑爆文档 / $lookup 硬关联</text>

  <rect x="30" y="358" width="430" height="112" rx="8" fill="#f8fafc" stroke="#ea580c" stroke-width="1.4"/>
  <text x="44" y="380" font-size="12.5" font-weight="bold" fill="#7c2d12">宽列 / 列族族：Cassandra、HBase、ScyllaDB</text>
  <rect x="44" y="398" width="62" height="42" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="75" y="424" text-anchor="middle" font-size="10.5" fill="#7c2d12">行键</text>
  <line x1="106" y1="419" x2="112" y2="419" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="112" y="398" width="124" height="20" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="174" y="412" text-anchor="middle" font-size="10" fill="#7c2d12">列族 basic</text>
  <rect x="112" y="420" width="124" height="20" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="174" y="434" text-anchor="middle" font-size="9.5" fill="#7c2d12">列＝值@时间戳</text>
  <rect x="244" y="398" width="124" height="20" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="306" y="412" text-anchor="middle" font-size="10" fill="#7c2d12">列族 stats</text>
  <rect x="244" y="420" width="124" height="20" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="306" y="434" text-anchor="middle" font-size="9.5" fill="#7c2d12">版本＝时间戳</text>
  <text x="44" y="462" font-size="10" fill="#475569">写入按分区键分散、批量友好；访问模式在设计期冻结</text>

  <rect x="475" y="374" width="210" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="487" y="396" font-size="12" font-weight="bold" fill="#1e40af">边界＝单分区键内</text>
  <text x="487" y="416" font-size="10" fill="#1e40af">跨分区事务基本不谈</text>
  <text x="487" y="434" font-size="10" font-weight="bold" fill="#1e40af">查询能力被刻意做弱</text>
  <text x="487" y="452" font-size="10" fill="#1e40af">拿不到分区键 → 扫描</text>

  <rect x="700" y="374" width="264" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="712" y="392" font-size="11" font-weight="bold" fill="#0f172a">主战场：海量追加写 + 跨地域多活</text>
  <text x="712" y="410" font-size="10" fill="#334155">线性加节点，多数据中心原生</text>
  <rect x="700" y="424" width="264" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="712" y="440" font-size="10" font-weight="bold" fill="#991b1b">⚠️ 误用：当能横向扩展的 MySQL</text>
  <text x="712" y="456" font-size="10" fill="#991b1b">先上线再改分区键＝更贵的返工</text>

  <rect x="30" y="482" width="430" height="112" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="44" y="504" font-size="12.5" font-weight="bold" fill="#0f172a">替代路线：关系型 + JSON 列</text>
  <rect x="44" y="522" width="168" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="128" y="540" text-anchor="middle" font-size="10" fill="#1e40af">规范化多表 · JOIN 最强</text>
  <text x="128" y="558" text-anchor="middle" font-size="10" fill="#1e40af">固定列 + 生成列 / 多值索引</text>
  <rect x="222" y="522" width="120" height="50" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="282" y="540" text-anchor="middle" font-size="10" fill="#92400e">JSON 变长列</text>
  <text x="282" y="558" text-anchor="middle" font-size="10" fill="#92400e">8.0 起可局部更新</text>
  <text x="44" y="586" font-size="10" fill="#475569">只是部分字段结构不固定时，先评估它，不必引进整族</text>

  <rect x="475" y="498" width="210" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="487" y="520" font-size="12" font-weight="bold" fill="#14532d">完整 ACID</text>
  <text x="487" y="540" font-size="10" fill="#166534">跨行事务与约束都在库层</text>
  <text x="487" y="558" font-size="10" fill="#166534">多表 JOIN 与统计最强</text>
  <text x="487" y="576" font-size="10" fill="#166534">沿用既有生态与人才</text>

  <rect x="700" y="498" width="264" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="712" y="516" font-size="11" font-weight="bold" fill="#0f172a">主战场：数据本就是规范化表</text>
  <text x="712" y="534" font-size="10" fill="#334155">多维组合统计是主线</text>
  <rect x="700" y="548" width="264" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="712" y="564" font-size="10" font-weight="bold" fill="#991b1b">⚠️ 代价：水平扩展要靠分片中间件</text>
  <text x="712" y="580" font-size="10" fill="#991b1b">引进文档族要把整族的账一起算</text>

  <rect x="30" y="612" width="940" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="45" y="634" font-size="11.5" fill="#334155">⭐ 三族的差别只在「原子性边界画在哪」：单命令 → 单文档 → 单分区键内，其余维度都是它的下游</text>
  <text x="45" y="656" font-size="11.5" fill="#334155">⚠️ 2.2 实测的编码账：Set 512 个整数走 intset 是 1336 B（2.6 B/元素），ZSet 512 个成员走 skiplist 是 41760 B（92.8 B/元素）</text>
</svg>
