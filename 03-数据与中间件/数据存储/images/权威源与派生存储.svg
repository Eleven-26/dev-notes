<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">组合范式：一套系统里各存各的</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">权威源写、派生存储读 —— 六个角色分工，同步方式决定能达到的一致性</text>

  <!-- Panel A -->
  <g transform="translate(20,78)">
    <rect x="0" y="0" width="960" height="288" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="24" font-size="13.5" font-weight="700" fill="#0f172a">① 六个角色：谁是权威源，谁是可重建的副本</text>

    <rect x="24" y="48" width="912" height="34" fill="#eef2f7" stroke="#cbd5e1"/>
    <text x="34" y="65" font-size="11.5" font-weight="600" fill="#334155">角色</text>
    <text x="224" y="65" font-size="11.5" font-weight="600" fill="#334155">选型</text>
    <text x="484" y="65" font-size="11.5" font-weight="600" fill="#334155">存什么</text>
    <text x="754" y="65" font-size="11.5" font-weight="600" fill="#334155">一致性要求</text>

    <rect x="24" y="82" width="912" height="32" fill="#dcfce7" stroke="#cbd5e1"/>
    <text x="34" y="98" font-size="11.5" font-weight="600" fill="#065f46">权威源（写）</text>
    <text x="224" y="98" font-size="11.5" fill="#334155">MySQL / PostgreSQL</text>
    <text x="484" y="98" font-size="11.5" fill="#334155">订单、用户、资金、库存</text>
    <text x="754" y="98" font-size="11.5" fill="#334155">强一致（事务保证）</text>

    <rect x="24" y="114" width="912" height="32" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="34" y="130" font-size="11.5" fill="#334155">缓存（读加速）</text>
    <text x="224" y="130" font-size="11.5" fill="#334155">Redis（+ 本地缓存）</text>
    <text x="484" y="130" font-size="11.5" fill="#334155">热点数据、会话、计数器、锁</text>
    <text x="754" y="130" font-size="11.5" fill="#334155">最终一致（容忍短暂脏读）</text>

    <rect x="24" y="146" width="912" height="32" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="34" y="162" font-size="11.5" fill="#334155">检索副本</text>
    <text x="224" y="162" font-size="11.5" fill="#334155">Elasticsearch</text>
    <text x="484" y="162" font-size="11.5" fill="#334155">商品搜索、订单全文检索、日志</text>
    <text x="754" y="162" font-size="11.5" fill="#334155">秒级最终一致</text>

    <rect x="24" y="178" width="912" height="32" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="34" y="194" font-size="11.5" fill="#334155">分析副本</text>
    <text x="224" y="194" font-size="11.5" fill="#334155">ClickHouse</text>
    <text x="484" y="194" font-size="11.5" fill="#334155">报表、用户行为、埋点明细</text>
    <text x="754" y="194" font-size="11.5" fill="#334155">分钟级（批量导入）</text>

    <rect x="24" y="210" width="912" height="32" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="34" y="226" font-size="11.5" fill="#334155">关系网查询副本</text>
    <text x="224" y="226" font-size="11.5" fill="#334155">图数据库（Neo4j）</text>
    <text x="484" y="226" font-size="11.5" fill="#334155">社交、风控、知识图谱的多跳遍历</text>
    <text x="754" y="226" font-size="11.5" fill="#334155">最终一致（CDC 同步）</text>

    <rect x="24" y="242" width="912" height="32" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="34" y="258" font-size="11.5" fill="#334155">归档 / 冷数据</text>
    <text x="224" y="258" font-size="11.5" fill="#334155">对象存储（S3 / OSS）</text>
    <text x="484" y="258" font-size="11.5" fill="#334155">历史订单、日志归档、备份</text>
    <text x="754" y="258" font-size="11.5" fill="#334155">只读，按需回捞</text>
  </g>

  <!-- Panel B -->
  <g transform="translate(20,384)">
    <rect x="0" y="0" width="960" height="288" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="24" font-size="13.5" font-weight="700" fill="#0f172a">② 同步方式怎么选：派生存储必须能从权威源重建</text>

    <rect x="24" y="48" width="912" height="32" fill="#eef2f7" stroke="#cbd5e1"/>
    <text x="34" y="64" font-size="11.5" font-weight="600" fill="#334155">方式</text>
    <text x="234" y="64" font-size="11.5" font-weight="600" fill="#334155">优点</text>
    <text x="504" y="64" font-size="11.5" font-weight="600" fill="#334155">缺点</text>
    <text x="784" y="64" font-size="11.5" font-weight="600" fill="#334155">建议</text>

    <rect x="24" y="80" width="912" height="34" fill="#dcfce7" stroke="#cbd5e1"/>
    <text x="34" y="97" font-size="11.5" font-weight="600" fill="#065f46">CDC（订阅 binlog）</text>
    <text x="234" y="97" font-size="11.5" fill="#334155">与业务解耦、不侵入代码、可重放</text>
    <text x="504" y="97" font-size="11.5" fill="#334155">需 Canal / Debezium 组件与运维；有延迟</text>
    <text x="784" y="97" font-size="11.5" font-weight="600" fill="#065f46">首选</text>

    <rect x="24" y="114" width="912" height="34" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="34" y="131" font-size="11.5" fill="#334155">应用双写</text>
    <text x="234" y="131" font-size="11.5" fill="#334155">实现简单直观</text>
    <text x="504" y="131" font-size="11.5" fill="#334155">双写不一致；业务代码变脏；性能受损</text>
    <text x="784" y="131" font-size="11.5" fill="#b45309">少用</text>

    <rect x="24" y="148" width="912" height="34" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="34" y="165" font-size="11.5" fill="#334155">定时任务同步</text>
    <text x="234" y="165" font-size="11.5" fill="#334155">实现最简单</text>
    <text x="504" y="165" font-size="11.5" fill="#334155">延迟大（分钟~小时）、对源库压力大</text>
    <text x="784" y="165" font-size="11.5" fill="#475569">报表专用</text>

    <rect x="24" y="196" width="912" height="76" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="36" y="220" font-size="11.5" fill="#92400e">⚠️ 双写的本质问题：两个存储不在一个事务里，第二步失败就产生不一致。</text>
    <text x="36" y="244" font-size="11.5" fill="#92400e">「双写 + 定时对账修复」是常见折中，但对账窗口内数据是脏的 —— 派生存储只要权威源在，随时可清空重灌。</text>
  </g>
</svg>
