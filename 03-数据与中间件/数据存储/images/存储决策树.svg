<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 824" width="1000" height="824" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="824" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">存储选型：按数据形态与访问模式决策</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">先看数据长什么样、怎么被访问，再落到产品 —— 七类存储速查 + 七条决策清单</text>

  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Panel A -->
  <g transform="translate(20,78)">
    <rect x="0" y="0" width="960" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="24" font-size="13.5" font-weight="700" fill="#0f172a">① 七类存储速查：强项与弱项一眼可见</text>

    <rect x="24" y="48" width="912" height="34" fill="#eef2f7" stroke="#cbd5e1"/>
    <text x="34" y="65" font-size="11.5" font-weight="600" fill="#334155">类型</text>
    <text x="174" y="65" font-size="11.5" font-weight="600" fill="#334155">代表技术</text>
    <text x="404" y="65" font-size="11.5" font-weight="600" fill="#334155">强项</text>
    <text x="704" y="65" font-size="11.5" font-weight="600" fill="#334155">弱项</text>

    <rect x="24" y="82" width="912" height="32" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="34" y="98" font-size="11.5" fill="#334155">关系型 OLTP</text>
    <text x="174" y="98" font-size="11.5" fill="#334155">MySQL / PostgreSQL</text>
    <text x="404" y="98" font-size="11.5" fill="#047857">事务强一致、复杂关联、生态最厚</text>
    <text x="704" y="98" font-size="11.5" fill="#b45309">水平扩展难，半结构化数据别扭</text>

    <rect x="24" y="114" width="912" height="32" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="34" y="130" font-size="11.5" fill="#334155">文档型</text>
    <text x="174" y="130" font-size="11.5" fill="#334155">MongoDB</text>
    <text x="404" y="130" font-size="11.5" fill="#047857">Schema 灵活、嵌套贴合、原生分片</text>
    <text x="704" y="130" font-size="11.5" fill="#b45309">多文档事务代价高，跨集合关联弱</text>

    <rect x="24" y="146" width="912" height="32" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="34" y="162" font-size="11.5" fill="#334155">搜索引擎</text>
    <text x="174" y="162" font-size="11.5" fill="#334155">Elasticsearch / OpenSearch</text>
    <text x="404" y="162" font-size="11.5" fill="#047857">全文检索、组合过滤、聚合分析</text>
    <text x="704" y="162" font-size="11.5" fill="#b45309">最终一致、无真正事务、写开销大</text>

    <rect x="24" y="178" width="912" height="32" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="34" y="194" font-size="11.5" fill="#334155">KV 缓存</text>
    <text x="174" y="194" font-size="11.5" fill="#334155">Redis / Memcached</text>
    <text x="404" y="194" font-size="11.5" fill="#047857">十万级 QPS、亚毫秒延迟</text>
    <text x="704" y="194" font-size="11.5" fill="#b45309">内存成本高、不可作权威存储</text>

    <rect x="24" y="210" width="912" height="32" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="34" y="226" font-size="11.5" fill="#334155">列式分析</text>
    <text x="174" y="226" font-size="11.5" fill="#334155">ClickHouse / Doris / StarRocks</text>
    <text x="404" y="226" font-size="11.5" fill="#047857">大宽表聚合极快、压缩比高</text>
    <text x="704" y="226" font-size="11.5" fill="#b45309">行级更新与高并发点查差</text>

    <rect x="24" y="242" width="912" height="32" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="34" y="258" font-size="11.5" fill="#334155">时序</text>
    <text x="174" y="258" font-size="11.5" fill="#334155">InfluxDB / VictoriaMetrics</text>
    <text x="404" y="258" font-size="11.5" fill="#047857">高写入吞吐、按窗口聚合降采样</text>
    <text x="704" y="258" font-size="11.5" fill="#b45309">通用查询能力弱</text>

    <rect x="24" y="274" width="912" height="32" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="34" y="290" font-size="11.5" fill="#334155">图</text>
    <text x="174" y="290" font-size="11.5" fill="#334155">Neo4j / NebulaGraph</text>
    <text x="404" y="290" font-size="11.5" fill="#047857">多跳遍历（本仓 6 跳百微秒级）</text>
    <text x="704" y="290" font-size="11.5" fill="#b45309">生态小、只在多跳是主查询时划算</text>
  </g>

  <!-- Panel B -->
  <g transform="translate(20,416)">
    <rect x="0" y="0" width="960" height="388" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="24" font-size="13.5" font-weight="700" fill="#0f172a">② 决策清单：按顺序问自己，第一个「是」就是答案</text>

    <rect x="24" y="48" width="560" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="36" y="62" font-size="11.5" fill="#334155">需要强事务 + 复杂关联 + 报表</text>
    <line x1="592" y1="62" x2="610" y2="62" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="616" y="48" width="320" height="28" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="628" y="62" font-size="11.5" fill="#065f46">关系型（MySQL / PostgreSQL）</text>

    <rect x="24" y="80" width="560" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="36" y="94" font-size="11.5" fill="#334155">Schema 频繁变、嵌套对象、一次读整个聚合根</text>
    <line x1="592" y1="94" x2="610" y2="94" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="616" y="80" width="320" height="28" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="628" y="94" font-size="11.5" fill="#065f46">文档型（MongoDB）</text>

    <rect x="24" y="112" width="560" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="36" y="126" font-size="11.5" fill="#334155">核心是全文检索 / 条件组合筛选 / 相关度排序</text>
    <line x1="592" y1="126" x2="610" y2="126" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="616" y="112" width="320" height="28" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="628" y="126" font-size="11.5" fill="#065f46">搜索引擎（Elasticsearch）</text>

    <rect x="24" y="144" width="560" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="36" y="158" font-size="11.5" fill="#334155">只是「读得慢」，数据本身已在关系库</text>
    <line x1="592" y1="158" x2="610" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="616" y="144" width="320" height="28" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="628" y="158" font-size="11.5" fill="#065f46">加缓存（Redis，必要时多级）</text>

    <rect x="24" y="176" width="560" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="36" y="190" font-size="11.5" fill="#334155">大宽表聚合分析、日志明细、成本敏感</text>
    <line x1="592" y1="190" x2="610" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="616" y="176" width="320" height="28" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="628" y="190" font-size="11.5" fill="#065f46">列式（ClickHouse / Doris）</text>

    <rect x="24" y="208" width="560" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="36" y="222" font-size="11.5" fill="#334155">时间序列指标、按窗口聚合与降采样</text>
    <line x1="592" y1="222" x2="610" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="616" y="208" width="320" height="28" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="628" y="222" font-size="11.5" fill="#065f46">时序库（InfluxDB / VictoriaMetrics）</text>

    <rect x="24" y="240" width="560" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="36" y="254" font-size="11.5" fill="#334155">多跳关系遍历是主查询（关系网、血缘、反欺诈）</text>
    <line x1="592" y1="254" x2="610" y2="254" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="616" y="240" width="320" height="28" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="628" y="254" font-size="11.5" fill="#065f46">图数据库（Neo4j）</text>

    <rect x="24" y="282" width="912" height="32" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="36" y="298" font-size="11.5" font-weight="600" fill="#92400e">一句话记忆：写和强一致找关系型，搜索找 ES，缓存找 Redis，聚合分析找列式，关系网找图。</text>

    <text x="24" y="340" font-size="11.5" fill="#334155">① 关系型先扛住，按「索引优化 → 加缓存 → 读写分离 → 垂直拆分 → 水平分片」逐步升级，别一上来就分库分表。</text>
    <text x="24" y="364" font-size="11.5" fill="#334155">② 派生存储（缓存 / 检索 / 分析 / 关系网）都必须能重建 —— 只要权威源在，随时可清空重灌。</text>
  </g>
</svg>
