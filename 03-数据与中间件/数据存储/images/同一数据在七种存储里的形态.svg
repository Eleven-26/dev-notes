<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 830" width="1000" height="830" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="830" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">同一条用户数据在七种存储里的形态</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">数据长什么样，决定了它怎么被读写 —— 同一份记录，落进不同容器就是不同的形状</text>

  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Panel A：原始数据样本 -->
  <g transform="translate(20,78)">
    <rect x="0" y="0" width="960" height="116" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="24" font-size="13.5" font-weight="700" fill="#0f172a">① 原始数据样本（只有这一种「真相」）</text>

    <rect x="24" y="38" width="912" height="62" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="40" y="60" font-size="11.5" fill="#1e3a8a">id=1</text>
    <text x="130" y="60" font-size="11.5" fill="#1e3a8a">name=张三</text>
    <text x="250" y="60" font-size="11.5" fill="#1e3a8a">age=18</text>
    <text x="340" y="60" font-size="11.5" fill="#1e3a8a">phone=13700000000</text>
    <text x="520" y="60" font-size="11.5" fill="#1e3a8a">remark=这是张三备注</text>
    <text x="40" y="82" font-size="11.5" fill="#1e3a8a">id=2</text>
    <text x="130" y="82" font-size="11.5" fill="#1e3a8a">name=李四</text>
    <text x="250" y="82" font-size="11.5" fill="#1e3a8a">age=19</text>
    <text x="340" y="82" font-size="11.5" fill="#1e3a8a">phone=13800000000</text>
    <text x="520" y="82" font-size="11.5" fill="#1e3a8a">remark=这是李四备注</text>
  </g>

  <!-- Panel B：七种容器 -->
  <g transform="translate(20,212)">
    <rect x="0" y="0" width="960" height="596" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="24" font-size="13.5" font-weight="700" fill="#0f172a">② 同一份数据落进七种容器：形状截然不同</text>

    <!-- 卡片 1：关系型 -->
    <g>
      <rect x="24" y="44" width="296" height="196" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="38" y="68" font-size="12" font-weight="600" fill="#0f172a">关系型 · MySQL / PostgreSQL</text>
      <text x="38" y="88" font-size="10.5" fill="#64748b">二维表（行式存储）</text>
      <line x1="38" y1="100" x2="306" y2="100" stroke="#e2e8f0"/>
      <rect x="38" y="108" width="268" height="20" fill="#eef2f7" stroke="#cbd5e1"/>
      <line x1="62" y1="108" x2="62" y2="168" stroke="#cbd5e1"/>
      <line x1="112" y1="108" x2="112" y2="168" stroke="#cbd5e1"/>
      <line x1="142" y1="108" x2="142" y2="168" stroke="#cbd5e1"/>
      <line x1="230" y1="108" x2="230" y2="168" stroke="#cbd5e1"/>
      <text x="42" y="122" font-size="9" font-weight="600" fill="#334155">id</text>
      <text x="66" y="122" font-size="9" font-weight="600" fill="#334155">name</text>
      <text x="116" y="122" font-size="9" font-weight="600" fill="#334155">age</text>
      <text x="146" y="122" font-size="9" font-weight="600" fill="#334155">phone</text>
      <text x="234" y="122" font-size="9" font-weight="600" fill="#334155">remark</text>
      <rect x="38" y="128" width="268" height="20" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="38" y="148" width="268" height="20" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="42" y="142" font-size="9" fill="#334155">1</text>
      <text x="66" y="142" font-size="9" fill="#334155">张三</text>
      <text x="116" y="142" font-size="9" fill="#334155">18</text>
      <text x="146" y="142" font-size="9" fill="#334155">13700000000</text>
      <text x="234" y="142" font-size="9" fill="#334155">这是张三备注</text>
      <text x="42" y="162" font-size="9" fill="#334155">2</text>
      <text x="66" y="162" font-size="9" fill="#334155">李四</text>
      <text x="116" y="162" font-size="9" fill="#334155">19</text>
      <text x="146" y="162" font-size="9" fill="#334155">13800000000</text>
      <text x="234" y="162" font-size="9" fill="#334155">这是李四备注</text>
      <text x="38" y="200" font-size="10.5" fill="#475569">格式严整：像 Excel 表格，每列类型固定。</text>
      <text x="38" y="216" font-size="10.5" fill="#475569">行式存储 → 适合整行读写的 OLTP。</text>
    </g>

    <!-- 卡片 2：文档型 -->
    <g>
      <rect x="336" y="44" width="296" height="196" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="350" y="68" font-size="12" font-weight="600" fill="#0f172a">文档型 · MongoDB</text>
      <text x="350" y="88" font-size="10.5" fill="#64748b">JSON 文档（BSON）</text>
      <line x1="350" y1="100" x2="618" y2="100" stroke="#e2e8f0"/>
      <rect x="350" y="106" width="268" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
      <g xml:space="preserve" font-size="9" fill="#334155">
        <text x="358" y="120">{</text>
        <text x="358" y="134">  "_id": ObjectId("..."),</text>
        <text x="358" y="148">  "id": 1, "name": "张三", "age": 18,</text>
        <text x="358" y="162">  "phone": "13700000000",</text>
        <text x="358" y="176">  "remark": "这是张三备注"</text>
        <text x="358" y="190">}</text>
      </g>
      <text x="350" y="212" font-size="10.5" fill="#475569">聚合整体：一个 JSON 对象，字段可随时增减。</text>
      <text x="350" y="228" font-size="10.5" fill="#475569">一次读取就拿到完整聚合根。</text>
    </g>

    <!-- 卡片 3：KV 缓存 -->
    <g>
      <rect x="648" y="44" width="296" height="196" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="662" y="68" font-size="12" font-weight="600" fill="#0f172a">KV 缓存 · Redis</text>
      <text x="662" y="88" font-size="10.5" fill="#64748b">Key-Value / Hash</text>
      <line x1="662" y1="100" x2="930" y2="100" stroke="#e2e8f0"/>
      <text x="662" y="122" font-size="9.5" fill="#64748b">Key</text>
      <rect x="662" y="126" width="104" height="26" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
      <text x="714" y="143" text-anchor="middle" font-size="10" fill="#1e3a8a">user:1</text>
      <line x1="772" y1="139" x2="794" y2="139" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
      <rect x="800" y="106" width="130" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
      <g font-size="9.5" fill="#334155">
        <text x="808" y="120">id=1</text>
        <text x="808" y="135">name=张三</text>
        <text x="808" y="150">age=18</text>
        <text x="808" y="165">phone=13700000000</text>
        <text x="808" y="180">remark=这是张三备注</text>
      </g>
      <text x="662" y="212" font-size="10.5" fill="#475569">字典映射：靠唯一 Key 直接定位整个对象。</text>
      <text x="662" y="228" font-size="10.5" fill="#475569">亚毫秒延迟，内存成本最高。</text>
    </g>

    <!-- 卡片 4：搜索型 -->
    <g>
      <rect x="24" y="256" width="296" height="196" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="38" y="280" font-size="12" font-weight="600" fill="#0f172a">搜索型 · Elasticsearch</text>
      <text x="38" y="300" font-size="10.5" fill="#64748b">JSON 文档 + 倒排索引</text>
      <line x1="38" y1="312" x2="306" y2="312" stroke="#e2e8f0"/>
      <rect x="38" y="318" width="268" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="46" y="338" font-size="9.5" fill="#334155">{"id":1,"name":"张三","age":18}</text>
      <text x="38" y="368" font-size="9.5" fill="#64748b">倒排索引（额外维护）：</text>
      <rect x="38" y="376" width="268" height="36" rx="4" fill="#fef3c7" stroke="#fcd34d"/>
      <text x="46" y="389" font-size="9.5" fill="#92400e">"张三"  →  [文档 1]</text>
      <text x="46" y="403" font-size="9.5" fill="#92400e">18  →  [文档 1]</text>
      <text x="38" y="428" font-size="10.5" fill="#475569">碎片化索引：数据被分词、建索引，</text>
      <text x="38" y="444" font-size="10.5" fill="#475569">为的是秒级检索，不是权威持久化。</text>
    </g>

    <!-- 卡片 5：列式 -->
    <g>
      <rect x="336" y="256" width="296" height="196" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="350" y="280" font-size="12" font-weight="600" fill="#0f172a">列式 · ClickHouse</text>
      <text x="350" y="300" font-size="10.5" fill="#64748b">按列独立存储</text>
      <line x1="350" y1="312" x2="618" y2="312" stroke="#e2e8f0"/>
      <rect x="350" y="322" width="268" height="15" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="358" y="333" font-size="9.5" fill="#334155">id 列</text>
      <text x="446" y="333" font-size="9.5" fill="#1d4ed8">[1]</text>
      <rect x="350" y="339" width="268" height="15" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="358" y="350" font-size="9.5" fill="#334155">name 列</text>
      <text x="446" y="350" font-size="9.5" fill="#1d4ed8">["张三"]</text>
      <rect x="350" y="356" width="268" height="15" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="358" y="367" font-size="9.5" fill="#334155">age 列</text>
      <text x="446" y="367" font-size="9.5" fill="#1d4ed8">[18]</text>
      <rect x="350" y="373" width="268" height="15" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="358" y="384" font-size="9.5" fill="#334155">phone 列</text>
      <text x="446" y="384" font-size="9.5" fill="#1d4ed8">["13700000000"]</text>
      <rect x="350" y="390" width="268" height="15" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="358" y="401" font-size="9.5" fill="#334155">remark 列</text>
      <text x="446" y="401" font-size="9.5" fill="#1d4ed8">["这是张三备注"]</text>
      <text x="350" y="428" font-size="10.5" fill="#475569">纵向切割：同一列的数据连续存放，</text>
      <text x="350" y="444" font-size="10.5" fill="#475569">聚合快、压缩比高，但不适合行级更新。</text>
    </g>

    <!-- 卡片 6：图 -->
    <g>
      <rect x="648" y="256" width="296" height="196" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="662" y="280" font-size="12" font-weight="600" fill="#0f172a">图 · Neo4j / NebulaGraph</text>
      <text x="662" y="300" font-size="10.5" fill="#64748b">节点 + 属性 + 边</text>
      <line x1="662" y1="312" x2="930" y2="312" stroke="#e2e8f0"/>
      <circle cx="706" cy="350" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="706" y="342" text-anchor="middle" font-size="9" fill="#065f46">User</text>
      <text x="706" y="360" text-anchor="middle" font-size="10" fill="#065f46">张三</text>
      <circle cx="886" cy="350" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="886" y="342" text-anchor="middle" font-size="9" fill="#065f46">User</text>
      <text x="886" y="360" text-anchor="middle" font-size="10" fill="#065f46">李四</text>
      <line x1="732" y1="350" x2="860" y2="350" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
      <text x="796" y="342" text-anchor="middle" font-size="9.5" fill="#b45309">FRIEND</text>
      <text x="662" y="396" font-size="9" fill="#334155">(:User {id:1, name:"张三", age:18, …})</text>
      <text x="662" y="428" font-size="10.5" fill="#475569">实体与关系：用户是节点、节点带属性，</text>
      <text x="662" y="444" font-size="10.5" fill="#475569">遍历靠边而非 JOIN。</text>
    </g>

    <!-- 卡片 7：时序 -->
    <g>
      <rect x="24" y="468" width="912" height="60" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="38" y="489" font-size="11.5" font-weight="600" fill="#0f172a">时序 · InfluxDB</text>
      <text x="150" y="489" font-size="10.5" fill="#b45309">⚠️ 不推荐存用户资料，只能强行套用：</text>
      <text x="38" y="513" font-size="9.5" fill="#334155">measurement=user, tags={phone}, fields={id, name, age}, time=…</text>
      <text x="600" y="513" font-size="10.5" fill="#475569">按时间追加，适合「随时间变化的指标」，不适合静态实体。</text>
    </g>

    <rect x="24" y="544" width="912" height="36" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="38" y="567" font-size="11.5" font-weight="600" fill="#92400e">⭐ 结论：数据显示形态 → 决定读写方式：关系型行级读写 / 文档型整体读写 / 列式按列聚合 / 搜索型分词检索 / 图关系遍历。</text>
  </g>
</svg>
