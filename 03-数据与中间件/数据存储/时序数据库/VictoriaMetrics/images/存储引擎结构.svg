<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="sArr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">VictoriaMetrics 单机存储结构：三角色与三层磁盘组织</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">进程内三段职责协作；磁盘按「月分区 → part → block → 列式文件」逐层包含，样本另存于 mergeset</text>

  <rect x="40" y="84" width="920" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="60" y="108" font-size="14" font-weight="bold" fill="#0f172a">单机版：一个进程 = 三个角色（集群版才拆成独立服务）</text>

  <rect x="62" y="122" width="280" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="202" y="146" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">vminsert（接收）</text>
  <text x="202" y="168" text-anchor="middle" font-size="11.5" fill="#1d4ed8">解析 · relabel · 分片</text>

  <rect x="360" y="122" width="280" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="500" y="146" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">vmstorage（存储）</text>
  <text x="500" y="168" text-anchor="middle" font-size="11.5" fill="#166534">落盘 · 合并 · 保留</text>

  <rect x="658" y="122" width="280" height="58" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="798" y="146" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c2d12">vmselect（查询）</text>
  <text x="798" y="168" text-anchor="middle" font-size="11.5" fill="#9a3412">取数 · 合并 · 聚合</text>

  <line x1="500" y1="196" x2="500" y2="224" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#sArr)"/>

  <text x="40" y="252" font-size="13" font-weight="bold" fill="#334155">磁盘层级（自上而下逐层包含）</text>

  <rect x="40" y="266" width="920" height="46" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="60" y="294" font-size="13" fill="#1e3a8a">① 分区：按月 YYYY_MM（/data/small 与 /data/big），含 parts.json</text>

  <rect x="90" y="324" width="870" height="46" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="110" y="352" font-size="13" fill="#14532d">② part：命名 rows_blocks_minTS_maxTS，含 metadata.json（BlocksCount / Min / Max）</text>

  <rect x="140" y="382" width="820" height="46" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/>
  <text x="160" y="410" font-size="13" fill="#7c2d12">③ block：最多约 8K 样本，且同属一条序列（同一 TSID），样本按时间排序</text>

  <rect x="190" y="440" width="770" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="210" y="468" font-size="13" fill="#334155">④ 列式文件：timestamps.bin · values.bin · index.bin · metaindex.bin</text>

  <rect x="40" y="512" width="450" height="104" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="60" y="540" font-size="14" font-weight="bold" fill="#1e3a8a">mergeset：存样本值</text>
  <text x="60" y="566" font-size="12" fill="#1d4ed8">按 TSID 排序，序列内按时间排序</text>
  <text x="60" y="588" font-size="12" fill="#1d4ed8">答「某序列在 [start, end] 的样本是什么」</text>
  <text x="60" y="608" font-size="11.5" fill="#64748b">part 不可变，靠后台合并瘦身</text>

  <rect x="510" y="512" width="450" height="104" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="530" y="540" font-size="14" font-weight="bold" fill="#14532d">倒排索引 IndexDB：存标签到 TSID</text>
  <text x="530" y="566" font-size="12" fill="#166534">维护 标签=值 到一组 TSID 的 postings</text>
  <text x="530" y="588" font-size="12" fill="#166534">答「有哪些序列满足标签条件」</text>
  <text x="530" y="608" font-size="11.5" fill="#64748b">按 -retentionPeriod 轮换</text>
</svg>
