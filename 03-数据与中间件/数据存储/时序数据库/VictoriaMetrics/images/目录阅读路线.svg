<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="vmRouteA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="650" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">VictoriaMetrics 目录阅读路线：十篇、两条线、双收口</text>
  <text x="500" y="55" text-anchor="middle" font-size="13" fill="#64748b">编号、视角与前置取自第三节学习路径表；两条线取自该节引言；角色入口取自 3.1；框内小字是各篇视角摘要</text>

  <rect x="40" y="102" width="190" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="135" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">① 定位与适用场景</text>
  <text x="135" y="147" text-anchor="middle" font-size="11" fill="#166534">入口：能力边界 · 何时上集群</text>
  <line x1="234" y1="131" x2="261" y2="131" stroke="#334155" stroke-width="1.8" marker-end="url(#vmRouteA)"/>

  <text x="265" y="92" font-size="13" font-weight="bold" fill="#1e3a8a">建模线 ②→③→④：数据怎么存、怎么查才快</text>
  <rect x="265" y="102" width="220" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="375" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">② 架构与存储引擎</text>
  <text x="375" y="147" text-anchor="middle" font-size="11" fill="#1d4ed8">三角色 · mergeset · 分区与 part</text>
  <line x1="489" y1="131" x2="511" y2="131" stroke="#334155" stroke-width="1.8" marker-end="url(#vmRouteA)"/>
  <rect x="515" y="102" width="220" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="625" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">③ 数据模型与写入路径</text>
  <text x="625" y="147" text-anchor="middle" font-size="11" fill="#1d4ed8">基数即成本 · 五站写入路径</text>
  <line x1="739" y1="131" x2="761" y2="131" stroke="#334155" stroke-width="1.8" marker-end="url(#vmRouteA)"/>
  <rect x="765" y="102" width="205" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="867" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">④ 索引设计与查询优化</text>
  <text x="867" y="147" text-anchor="middle" font-size="11" fill="#1d4ed8">倒排索引选择器 · 查询改写</text>

  <text x="40" y="196" font-size="13" font-weight="bold" fill="#7c2d12">生态与生产线 ⑤→⑥→⑦→⑧：怎么接进来、上线后怎么不出事</text>
  <rect x="40" y="206" width="210" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="145" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">⑤ MetricsQL查询</text>
  <text x="145" y="251" text-anchor="middle" font-size="11" fill="#9a3412">与 PromQL 的差异与坑 · 前置③</text>
  <line x1="254" y1="235" x2="276" y2="235" stroke="#334155" stroke-width="1.8" marker-end="url(#vmRouteA)"/>
  <rect x="280" y="206" width="230" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="395" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">⑥ 与Prometheus生态的关系</text>
  <text x="395" y="251" text-anchor="middle" font-size="11" fill="#9a3412">remote write · 兼容面 · 前置⑤</text>
  <line x1="514" y1="235" x2="536" y2="235" stroke="#334155" stroke-width="1.8" marker-end="url(#vmRouteA)"/>
  <rect x="540" y="206" width="210" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="645" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">⑦ 高可用与集群部署</text>
  <text x="645" y="251" text-anchor="middle" font-size="11" fill="#9a3412">shared-nothing · 分片副本 · 前置②</text>
  <line x1="754" y1="235" x2="776" y2="235" stroke="#334155" stroke-width="1.8" marker-end="url(#vmRouteA)"/>
  <rect x="780" y="206" width="190" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="875" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">⑧ 运维与监控</text>
  <text x="875" y="251" text-anchor="middle" font-size="11" fill="#9a3412">自监控 · 快照 · 只读 · 前置⑦</text>

  <line x1="867" y1="160" x2="820" y2="318" stroke="#334155" stroke-width="1.5" marker-end="url(#vmRouteA)"/>
  <line x1="875" y1="264" x2="860" y2="318" stroke="#334155" stroke-width="1.5" marker-end="url(#vmRouteA)"/>
  <text x="40" y="300" font-size="12.5" fill="#475569">收口：⑨ 是调优收口（前置 ④⑧）；⑩ 是选型收口（前置 ①⑨）——两条线都读完才轮到收口</text>
  <rect x="640" y="322" width="200" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="740" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">⑨ 性能调优与基准测试</text>
  <text x="740" y="371" text-anchor="middle" font-size="11" fill="#475569">缓存与参数 · 容量评估 · 前置 ④⑧</text>
  <line x1="844" y1="354" x2="866" y2="354" stroke="#334155" stroke-width="1.8" marker-end="url(#vmRouteA)"/>
  <rect x="870" y="322" width="120" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="930" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">⑩ 选型与</text>
  <text x="930" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">落地案例</text>
  <text x="930" y="381" text-anchor="middle" font-size="10.5" fill="#475569">前置 ①⑨</text>

  <rect x="40" y="414" width="920" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="442" font-size="13.5" font-weight="bold" fill="#0f172a">按角色选入口（3.1）——在图上抄近路，不必从 ① 顺序通读</text>
  <text x="60" y="472" font-size="12.5" fill="#334155">第一次接触 VM，想先搞清楚"它是什么、能扛多大"：① → ②</text>
  <text x="60" y="500" font-size="12.5" fill="#334155">已有 Prometheus，想迁到 VM 做长期存储：⑥ → ⑤</text>
  <text x="60" y="528" font-size="12.5" fill="#334155">要上生产 / 要搭集群：⑦ → ⑧</text>
  <text x="60" y="556" font-size="12.5" fill="#334155">只关心容量、成本与调优：⑨（先读 ②③④ 再上手）</text>
  <text x="60" y="588" font-size="11.5" fill="#94a3b8">三篇核心（1.1）：架构与存储引擎解释"为什么高基数下省内存"，数据模型解释"为什么基数是成本核心"，索引篇回答"查询怎么变快"</text>
</svg>
