<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="c3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="610" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">基数为什么是性能的根变量</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">一个 label 设计失当，会同时打穿内存、索引与查询三条链路</text>

  <rect x="290" y="92" width="420" height="76" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="500" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">把无界值放进 label</text>
  <text x="500" y="148" text-anchor="middle" font-size="11.5" fill="#991b1b">时间戳 / 请求 ID / user_id / session_id</text>

  <line x1="440" y1="168" x2="190" y2="208" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#c3)"/>
  <line x1="500" y1="168" x2="500" y2="208" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#c3)"/>
  <line x1="560" y1="168" x2="810" y2="208" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#c3)"/>

  <rect x="40" y="212" width="280" height="72" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="180" y="244" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">活跃序列数暴涨</text>
  <text x="180" y="268" text-anchor="middle" font-size="11.5" fill="#1d4ed8">内存里的元信息装不下</text>

  <rect x="360" y="212" width="280" height="72" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="244" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">churn rate 升高</text>
  <text x="500" y="268" text-anchor="middle" font-size="11.5" fill="#1d4ed8">序列不断被新建</text>

  <rect x="680" y="212" width="280" height="72" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="820" y="244" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">查询要扫的序列变多</text>
  <text x="820" y="268" text-anchor="middle" font-size="11.5" fill="#1d4ed8">单次查询命中面变大</text>

  <line x1="180" y1="284" x2="180" y2="324" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#c3)"/>
  <line x1="500" y1="284" x2="500" y2="324" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#c3)"/>
  <line x1="820" y1="284" x2="820" y2="324" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#c3)"/>

  <rect x="40" y="328" width="280" height="72" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="180" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">storage/tsid cache 装不下</text>
  <text x="180" y="384" text-anchor="middle" font-size="11.5" fill="#9a3412">回磁盘解包重建元信息</text>

  <rect x="360" y="328" width="280" height="72" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="500" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">indexdb 不断注册新序列</text>
  <text x="500" y="384" text-anchor="middle" font-size="11.5" fill="#9a3412">注册成本远高于追加样本</text>

  <rect x="680" y="328" width="280" height="72" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="820" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">单查询内存 / CPU 上升</text>
  <text x="820" y="384" text-anchor="middle" font-size="11.5" fill="#9a3412">与扫描的序列数成正比</text>

  <line x1="180" y1="400" x2="180" y2="440" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#c3)"/>
  <line x1="500" y1="400" x2="500" y2="440" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#c3)"/>
  <line x1="820" y1="400" x2="820" y2="440" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#c3)"/>

  <rect x="40" y="444" width="280" height="72" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="180" y="476" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7f1d1d">slow inserts（写变慢）</text>
  <text x="180" y="500" text-anchor="middle" font-size="11.5" fill="#991b1b">vm_slow_row_inserts_total 升高</text>

  <rect x="360" y="444" width="280" height="72" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="500" y="476" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7f1d1d">索引体积膨胀 + CPU 升高</text>
  <text x="500" y="500" text-anchor="middle" font-size="11.5" fill="#991b1b">indexdb 随 churn 一起膨胀</text>

  <rect x="680" y="444" width="280" height="72" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="820" y="476" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7f1d1d">慢查询，甚至 OOM</text>
  <text x="820" y="500" text-anchor="middle" font-size="11.5" fill="#991b1b">重查询把内存吃穿</text>

  <text x="40" y="556" font-size="12.5" fill="#0f172a">⭐ 官方：最常见的 churn 来源是「值频繁变化的 label」（如 timestamp、session_id），并明确建议避免这类 label。</text>
  <text x="40" y="582" font-size="12" fill="#64748b">🔎 抓手：cardinality explorer 定位源头；-storage.maxHourlySeries / -storage.maxDailySeries 兜底；slow inserts 持续 10 分钟 &gt; 5% 多指向内存不足。</text>
</svg>
