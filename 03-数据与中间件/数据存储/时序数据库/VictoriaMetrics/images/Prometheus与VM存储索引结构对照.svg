<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">同一协议、两种引擎：Prometheus 与 VictoriaMetrics 的结构对照</text>
  <text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">条目全部取自本篇 2.1 / 2.2 / 2.3 / 2.4 / 2.5 与 1.1，本轮未起 Prometheus 容器做同负载对照</text>
  <text x="500" y="70" text-anchor="middle" font-size="12.5" fill="#64748b">所以两侧都是各自的官方口径，不是同一台机器上量出来的差值</text>

  <rect x="40" y="82" width="170" height="32" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="125" y="103" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">对照维度（出处）</text>
  <rect x="224" y="82" width="356" height="32" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="402" y="103" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">Prometheus 本体（单机 TSDB）</text>
  <rect x="596" y="82" width="364" height="32" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="778" y="103" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">VictoriaMetrics</text>

  <rect x="40" y="122" width="170" height="52" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="125" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">存储组织</text>
  <text x="125" y="162" text-anchor="middle" font-size="11.5" fill="#64748b">（2.1）</text>
  <rect x="224" y="122" width="356" height="52" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="236" y="144" font-size="11.5" fill="#334155">2h block</text>
  <text x="236" y="162" font-size="11.5" fill="#334155">块内 row-group chunks</text>
  <rect x="596" y="122" width="364" height="52" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="608" y="144" font-size="11.5" fill="#334155">按月分区 + 按 TSID 排序的 part</text>
  <text x="608" y="162" font-size="11.5" fill="#334155">LSM 风格</text>

  <rect x="40" y="178" width="170" height="52" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="125" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">索引</text>
  <text x="125" y="218" text-anchor="middle" font-size="11.5" fill="#64748b">（2.1）</text>
  <rect x="224" y="178" width="356" height="52" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="236" y="200" font-size="11.5" fill="#334155">每块重复一份倒排索引</text>
  <text x="236" y="218" font-size="11.5" fill="#991b1b">索引成本随块数量线性重复</text>
  <rect x="596" y="178" width="364" height="52" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="608" y="200" font-size="11.5" fill="#334155">全局 + 每日两套倒排索引</text>
  <text x="608" y="218" font-size="11.5" fill="#166534">跨块复用，这是结构分水岭</text>

  <rect x="40" y="234" width="170" height="52" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="125" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">样本压缩</text>
  <text x="125" y="274" text-anchor="middle" font-size="11.5" fill="#64748b">（2.1）</text>
  <rect x="224" y="234" width="356" height="52" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="236" y="256" font-size="11.5" fill="#334155">约 1.5 字节/样本</text>
  <text x="236" y="274" font-size="11.5" fill="#334155">Gorilla 类</text>
  <rect x="596" y="234" width="364" height="52" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="608" y="256" font-size="11.5" fill="#334155">官方称更省：额外编码</text>
  <text x="608" y="274" font-size="11.5" fill="#334155">再叠一层通用压缩</text>

  <rect x="40" y="290" width="170" height="52" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="125" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">高 churn 落点</text>
  <text x="125" y="330" text-anchor="middle" font-size="11.5" fill="#64748b">（2.1）</text>
  <rect x="224" y="290" width="356" height="52" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="236" y="312" font-size="11.5" fill="#334155">本地块膨胀</text>
  <text x="236" y="330" font-size="11.5" fill="#334155">内存与合并压力一起上来</text>
  <rect x="596" y="290" width="364" height="52" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="608" y="312" font-size="11.5" fill="#334155">影响主要落在 per-day 索引</text>
  <text x="608" y="330" font-size="11.5" fill="#991b1b">基数爆炸同样会拉爆内存</text>

  <rect x="40" y="346" width="170" height="52" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="125" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">组件数</text>
  <text x="125" y="386" text-anchor="middle" font-size="11.5" fill="#64748b">（2.4）</text>
  <rect x="224" y="346" width="356" height="52" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="236" y="368" font-size="11.5" fill="#334155">单进程；本身不做水平扩展</text>
  <text x="236" y="386" font-size="11.5" fill="#334155">长保留要靠外挂方案</text>
  <rect x="596" y="346" width="364" height="52" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="608" y="368" font-size="11.5" fill="#334155">单机版 1 个；集群版 3 类</text>
  <text x="608" y="386" font-size="11.5" fill="#334155">vminsert / vmstorage / vmselect</text>

  <rect x="40" y="402" width="170" height="52" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="125" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">语言与许可</text>
  <text x="125" y="442" text-anchor="middle" font-size="11.5" fill="#64748b">（2.2 / 2.5）</text>
  <rect x="224" y="402" width="356" height="52" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="236" y="424" font-size="11.5" fill="#334155">PromQL；Apache 2.0</text>
  <text x="236" y="442" font-size="11.5" fill="#334155">成本重心在内存 + 本地盘</text>
  <rect x="596" y="402" width="364" height="52" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="608" y="424" font-size="11.5" fill="#334155">MetricsQL，官方对照 385 / 529（约 72.78%）</text>
  <text x="608" y="442" font-size="11.5" fill="#334155">Apache 2.0；企业能力另售</text>

  <rect x="40" y="466" width="920" height="54" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="500" y="488" text-anchor="middle" font-size="12" fill="#78350f">量级门槛（1.1）：十万级单实例 Prometheus 从容 → 百万级吃紧 → 千万级以上要专为高基数设计的后端</text>
  <text x="500" y="508" text-anchor="middle" font-size="12" fill="#78350f">VM 的官方容量口径（2.3）：百万级 samples/s、千万级活跃序列</text>

  <rect x="40" y="532" width="920" height="54" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="500" y="554" text-anchor="middle" font-size="12" fill="#0f172a">要点：左列每一行都在「块」这个单位上重复付一次索引成本，右列把索引挪到块外复用</text>
  <text x="500" y="574" text-anchor="middle" font-size="12" fill="#475569">所以高基数下两边表现的差，来源是结构而不是「谁更新」</text>

  <rect x="40" y="598" width="920" height="62" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="622" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">换后端不是终点：先按 1.1 量活跃序列的增长斜率，再按 2.6 的口径去 6.3 实测那类差异</text>
  <text x="500" y="644" text-anchor="middle" font-size="11.5" fill="#1d4ed8">基数没降下来，换谁只是把 OOM 从一个组件搬到另一个组件</text>
</svg>
