<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="bhA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">直方图的两套桶形态：vmrange 区间桶（非累积）与 le 上界桶（累积）</text>
  <text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">全部读数取自本篇 6.3 实测（v1.118.0 / buildinfo 2.24.0 单机版，连跑 3 轮逐字相同）</text>

  <rect x="40" y="70" width="920" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="60" y="96" font-size="12.5" fill="#334155">输入：temperature{city="hz"} 的 10 个点，值 10、13.5、17、20.5、24 各两次；窗口写 [30m] 以覆盖全部样本</text>

  <rect x="40" y="132" width="420" height="262" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="250" y="158" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">histogram_over_time(m[30m])</text>
  <text x="250" y="180" text-anchor="middle" font-size="12" fill="#1d4ed8">VM 形态：标签是 vmrange，区间各自计数</text>
  <line x1="56" y1="192" x2="444" y2="192" stroke="#2563eb" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="62" y="212" font-size="12" fill="#0f172a">8.799e+00...1.000e+01</text>
  <text x="438" y="212" text-anchor="end" font-size="12" font-weight="bold" fill="#1e3a8a">2</text>
  <text x="62" y="234" font-size="12" fill="#0f172a">1.292e+01...1.468e+01</text>
  <text x="438" y="234" text-anchor="end" font-size="12" font-weight="bold" fill="#1e3a8a">2</text>
  <text x="62" y="256" font-size="12" fill="#0f172a">1.668e+01...1.896e+01</text>
  <text x="438" y="256" text-anchor="end" font-size="12" font-weight="bold" fill="#1e3a8a">2</text>
  <text x="62" y="278" font-size="12" fill="#0f172a">1.896e+01...2.154e+01</text>
  <text x="438" y="278" text-anchor="end" font-size="12" font-weight="bold" fill="#1e3a8a">2</text>
  <text x="62" y="300" font-size="12" fill="#0f172a">2.154e+01...2.448e+01</text>
  <text x="438" y="300" text-anchor="end" font-size="12" font-weight="bold" fill="#1e3a8a">2</text>
  <text x="250" y="336" text-anchor="middle" font-size="12" fill="#1d4ed8">5 条序列，每条计数都是 2</text>
  <text x="250" y="360" text-anchor="middle" font-size="12" fill="#1d4ed8">合计 10 个样本：区间只数自己，不累加</text>

  <line x1="460" y1="263" x2="536" y2="263" stroke="#334155" stroke-width="1.6" marker-end="url(#bhA)"/>
  <text x="498" y="254" text-anchor="middle" font-size="11.5" fill="#334155">转换</text>

  <rect x="540" y="132" width="420" height="262" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="750" y="158" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">prometheus_buckets(…)</text>
  <text x="750" y="180" text-anchor="middle" font-size="12" fill="#166534">Prometheus 形态：标签是 le，值随上界累加</text>
  <line x1="556" y1="192" x2="944" y2="192" stroke="#16a34a" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="562" y="208" font-size="11.5" fill="#0f172a">le="8.799e+00"</text>
  <text x="938" y="208" text-anchor="end" font-size="11.5" font-weight="bold" fill="#14532d">0</text>
  <text x="562" y="226" font-size="11.5" fill="#0f172a">le="1.000e+01"</text>
  <text x="938" y="226" text-anchor="end" font-size="11.5" font-weight="bold" fill="#14532d">2</text>
  <text x="562" y="244" font-size="11.5" fill="#0f172a">le="1.292e+01"</text>
  <text x="938" y="244" text-anchor="end" font-size="11.5" font-weight="bold" fill="#14532d">2</text>
  <text x="562" y="262" font-size="11.5" fill="#0f172a">le="1.468e+01"</text>
  <text x="938" y="262" text-anchor="end" font-size="11.5" font-weight="bold" fill="#14532d">4</text>
  <text x="562" y="280" font-size="11.5" fill="#0f172a">le="1.668e+01"</text>
  <text x="938" y="280" text-anchor="end" font-size="11.5" font-weight="bold" fill="#14532d">4</text>
  <text x="562" y="298" font-size="11.5" fill="#0f172a">le="1.896e+01"</text>
  <text x="938" y="298" text-anchor="end" font-size="11.5" font-weight="bold" fill="#14532d">6</text>
  <text x="562" y="316" font-size="11.5" fill="#0f172a">le="2.154e+01"</text>
  <text x="938" y="316" text-anchor="end" font-size="11.5" font-weight="bold" fill="#14532d">8</text>
  <text x="562" y="334" font-size="11.5" fill="#0f172a">le="2.448e+01"</text>
  <text x="938" y="334" text-anchor="end" font-size="11.5" font-weight="bold" fill="#14532d">10</text>
  <text x="562" y="352" font-size="11.5" fill="#0f172a">le="+Inf"</text>
  <text x="938" y="352" text-anchor="end" font-size="11.5" font-weight="bold" fill="#14532d">10</text>
  <text x="750" y="378" text-anchor="middle" font-size="12" fill="#166534">9 条 = 5 个区间的上下界去重成 8 个 + Inf</text>

  <rect x="40" y="414" width="920" height="118" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="500" y="438" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">压桶与分位数：同一条直方图上的三种规模</text>
  <text x="60" y="464" font-size="12" fill="#334155">buckets_limit(3, histogram_over_time(…)) → 3 条 le 序列：8.799e+00 记 0、2.448e+01 记 10、+Inf 记 10</text>
  <text x="60" y="488" font-size="12" fill="#334155">histogram_quantile(0.5, sum(…) by (vmrange)) → 1 条序列，中位数 17.82</text>
  <text x="60" y="512" font-size="12" fill="#991b1b">分组标签换成 vmbucket → 0 条序列：实测 histogram_over_time 只产出 vmrange，没有 vmbucket</text>

  <rect x="40" y="548" width="920" height="54" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="60" y="570" font-size="11.5" fill="#7c2d12">注意：以上是同一份 10 点样本、窗口 [30m] 的返回；原生 le 直方图则原样存，VM 不校验 le 是否累加单调。</text>
  <text x="60" y="590" font-size="11.5" fill="#7c2d12">未复现：rollup 结果缓存命中数没动起来（full_hits 0、miss 2、partial_hits 0），原因本轮未定位。</text>
</svg>
