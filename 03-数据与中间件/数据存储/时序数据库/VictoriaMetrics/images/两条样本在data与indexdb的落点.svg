<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="40" y="36" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">两条样本落进 VM：data 存样本，indexdb 存标签键</text>
  <text x="40" y="58" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">VictoriaMetrics 单机 v1.118.0（buildinfo 报 2.24.0），2 条 user_info 样本 + force_flush 之后实测</text>

  <rect x="20" y="76" width="290" height="384" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="34" y="100" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">原始样本 data/small/2026_11/part/</text>
  <text x="36" y="130" font-family="Consolas, monospace" font-size="12" fill="#1e293b">index.bin</text>
  <text x="296" y="130" font-family="Consolas, monospace" font-size="12" fill="#1e293b" text-anchor="end">88 B</text>
  <text x="36" y="154" font-family="Consolas, monospace" font-size="12" fill="#1e293b">metaindex.bin</text>
  <text x="296" y="154" font-family="Consolas, monospace" font-size="12" fill="#1e293b" text-anchor="end">65 B</text>
  <text x="36" y="178" font-family="Consolas, monospace" font-size="12" fill="#1e293b">metadata.json</text>
  <text x="296" y="178" font-family="Consolas, monospace" font-size="12" fill="#1e293b" text-anchor="end">110 B</text>
  <text x="36" y="202" font-family="Consolas, monospace" font-size="12" fill="#1e293b">timestamps.bin</text>
  <text x="296" y="202" font-family="Consolas, monospace" font-size="12" fill="#1e293b" text-anchor="end">0 B</text>
  <text x="36" y="226" font-family="Consolas, monospace" font-size="12" fill="#1e293b">values.bin</text>
  <text x="296" y="226" font-family="Consolas, monospace" font-size="12" fill="#1e293b" text-anchor="end">0 B</text>

  <rect x="34" y="244" width="262" height="86" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="46" y="266" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#1e3a8a">RowsCount 2 ｜ BlocksCount 2</text>
  <text x="46" y="286" font-family="Consolas, monospace" font-size="11" fill="#1e3a8a">Min = Max = 1793863800000</text>
  <text x="46" y="306" font-family="Consolas, monospace" font-size="11" fill="#1e3a8a">vm_rows{storage/small} = 2</text>
  <text x="46" y="324" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#1e3a8a">一个 TSID 一个块，块按 TSID 排序</text>

  <text x="36" y="356" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#334155">压缩列：3 条同样本 → 两列各 0 B</text>
  <text x="36" y="374" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#334155">975 条随机样本 → 2904 B / 5810 B</text>
  <text x="36" y="392" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#b91c1c">行数看 metadata.json，不看文件大小</text>

  <rect x="350" y="76" width="300" height="384" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="364" y="100" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">标签索引 indexdb/世代/part/</text>
  <text x="366" y="130" font-family="Consolas, monospace" font-size="12" fill="#1e293b">index.bin</text>
  <text x="636" y="130" font-family="Consolas, monospace" font-size="12" fill="#1e293b" text-anchor="end">52 B</text>
  <text x="366" y="154" font-family="Consolas, monospace" font-size="12" fill="#1e293b">items.bin</text>
  <text x="636" y="154" font-family="Consolas, monospace" font-size="12" fill="#1e293b" text-anchor="end">472 B</text>
  <text x="366" y="178" font-family="Consolas, monospace" font-size="12" fill="#1e293b">lens.bin</text>
  <text x="636" y="178" font-family="Consolas, monospace" font-size="12" fill="#1e293b" text-anchor="end">136 B</text>
  <text x="366" y="202" font-family="Consolas, monospace" font-size="12" fill="#1e293b">metaindex.bin</text>
  <text x="636" y="202" font-family="Consolas, monospace" font-size="12" fill="#1e293b" text-anchor="end">46 B</text>
  <text x="366" y="226" font-family="Consolas, monospace" font-size="12" fill="#1e293b">metadata.json</text>
  <text x="636" y="226" font-family="Consolas, monospace" font-size="12" fill="#1e293b" text-anchor="end">436 B</text>

  <rect x="364" y="244" width="272" height="66" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="376" y="266" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#7c2d12">ItemsCount 63 ｜ BlocksCount 1</text>
  <text x="376" y="286" font-family="Consolas, monospace" font-size="11" fill="#7c2d12">FirstItem 01 01 user_info 01 …0129</text>
  <text x="376" y="304" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#7c2d12">键尾是定长 ID 段，指向序列</text>

  <text x="366" y="336" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#334155">一项 = 标签对排序后拼成的有序键：</text>
  <text x="366" y="356" font-family="Consolas, monospace" font-size="11" fill="#1e293b">07 (8B) user_info name 李四 addr …</text>
  <text x="366" y="374" font-family="Consolas, monospace" font-size="11" fill="#1e293b">age 19 hobby 唱、跳、rap … remark</text>
  <text x="366" y="396" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#b91c1c">ItemsCount 不是序列数：追加一条序列后是 34</text>

  <rect x="690" y="76" width="290" height="384" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="704" y="100" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">查询：trace 里的三段链路</text>

  <rect x="704" y="116" width="262" height="70" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="716" y="138" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">① 标签 → metricID</text>
  <text x="716" y="158" font-family="Consolas, monospace" font-size="11" fill="#1e3a8a">composite(user_info,phone)</text>
  <text x="716" y="176" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#1e3a8a">日索引 date=2026-11-05</text>

  <line x1="835" y1="188" x2="835" y2="206" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="835,210 831,202 839,202" fill="#64748b"/>

  <rect x="704" y="212" width="262" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="716" y="234" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">② metricID → TSID</text>
  <text x="716" y="252" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#1e3a8a">跨 current / previous 两代索引</text>

  <line x1="835" y1="266" x2="835" y2="284" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="835,288 831,280 839,280" fill="#64748b"/>

  <rect x="704" y="290" width="262" height="66" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="716" y="312" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">③ TSID → part / block</text>
  <text x="716" y="332" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#1e3a8a">此时才按时间范围取块</text>
  <text x="716" y="350" font-family="Consolas, monospace" font-size="11" fill="#1e3a8a">fetch series=1 blocks=3</text>

  <text x="704" y="380" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">同一批数据的索引搜索代价</text>
  <text x="704" y="402" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#166534">phone 等值 → exact，1 次循环</text>
  <text x="704" y="422" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#a16207">打.* → prefix，11 次</text>
  <text x="704" y="442" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#b91c1c">.*爬山.* → 183 次（扫描）</text>

  <line x1="310" y1="300" x2="344" y2="300" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="348,300 340,296 340,304" fill="#64748b"/>
  <text x="312" y="292" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#475569">刷盘</text>

  <line x1="650" y1="150" x2="684" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="688,150 680,146 680,154" fill="#64748b"/>
  <text x="652" y="142" font-family="Consolas, monospace" font-size="10" fill="#475569">TSID</text>

  <rect x="20" y="478" width="960" height="160" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="36" y="504" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">写一条新样本，两边各改什么</text>
  <text x="36" y="532" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1e293b">追加 id=3 → 新 index part ItemsCount 34，新 data part RowsCount 1；/series 从 2 条变 3 条</text>
  <text x="36" y="558" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1e293b">覆盖 id=1 的同时间戳 → export 返回三份同样本、values 为 [1,2,3]，不产生新 TSID，查询只取一条</text>
  <text x="36" y="584" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#b91c1c">边界：25 条样本落在未来过远，被拒收并记入 vm_rows_ignored_total{reason="big_timestamp"}</text>
  <text x="36" y="612" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">结论：索引只回答「哪些 TSID」，时间范围要到取 part 时才生效；VM 没有按主键更新的语义</text>
</svg>
