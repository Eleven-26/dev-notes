<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="d4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">调优决策流程：先量基数，再分路</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">参数是最后一步；基数不治，改任何参数都只是把问题往后挪</text>

  <rect x="310" y="88" width="380" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="500" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7f1d1d">现象：写入慢 / 查询慢 / 内存占用高</text>

  <line x1="500" y1="148" x2="500" y2="182" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#d4)"/>

  <rect x="250" y="186" width="500" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="222" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">第一步：先量基数（活跃序列数 + churn）</text>

  <line x1="500" y1="246" x2="500" y2="280" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#d4)"/>

  <rect x="340" y="284" width="320" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="500" y="319" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">基数是不是主要矛盾？</text>

  <line x1="440" y1="342" x2="250" y2="376" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#d4)"/>
  <line x1="560" y1="342" x2="750" y2="376" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#d4)"/>

  <rect x="40" y="380" width="400" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="240" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">是 → 治基数（收益最大）</text>
  <text x="240" y="442" text-anchor="middle" font-size="12" fill="#166534">① 把值频繁变化的 label 拿掉</text>
  <text x="240" y="468" text-anchor="middle" font-size="12" fill="#166534">② 兜底限流：</text>
  <text x="240" y="492" text-anchor="middle" font-size="12" fill="#166534">-storage.maxHourlySeries</text>
  <text x="240" y="514" text-anchor="middle" font-size="12" fill="#166534">/ -storage.maxDailySeries</text>

  <rect x="480" y="380" width="480" height="60" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="720" y="406" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">写入慢（slow inserts 高）→ 多指内存不足</text>
  <text x="720" y="428" text-anchor="middle" font-size="11.5" fill="#9a3412">治基数或换更大内存；必要时调大 -cacheExpireDuration</text>

  <rect x="480" y="448" width="480" height="60" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="720" y="474" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">查询慢 / 超时 → 先改查询写法</text>
  <text x="720" y="496" text-anchor="middle" font-size="11.5" fill="#9a3412">缩短 lookbehind、改子查询、拉长求值间隔；给 vmselect 加 CPU</text>

  <rect x="480" y="516" width="480" height="60" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="720" y="542" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">内存占用高 → 看参数是否被改过</text>
  <text x="720" y="564" text-anchor="middle" font-size="11.5" fill="#9a3412">-memory.allowedPercent（默认 60）；留 50% 空闲内存</text>

  <text x="40" y="576" font-size="11.5" fill="#64748b">GC 偏高可把 GOGC 30 → 100</text>

  <text x="40" y="620" font-size="12" fill="#0f172a">护栏默认值：-search.maxQueryDuration 30s ｜ -search.maxSeries 30000 ｜ -search.maxConcurrentRequests 2×CPU（≤16）</text>
  <text x="40" y="646" font-size="12.5" fill="#b91c1c">⚠️ 组件只在启动时读一次资源上限：改 CPU / 内存后必须重启才生效；-search.logSlowQueryDuration 默认 5s 记录慢查询。</text>
</svg>
