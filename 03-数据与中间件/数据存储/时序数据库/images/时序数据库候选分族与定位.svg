<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">时序数据库候选的五族划分</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">同一个「时序库」标签下其实是五条技术路线；先认族，再比产品</text>

  <text x="115" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748b">路线</text>
  <text x="415" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748b">代表产品与形态</text>
  <text x="802" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748b">主战场</text>

  <g>
    <rect x="30" y="110" width="170" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="115" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">指标专精族</text>
    <text x="115" y="164" text-anchor="middle" font-size="11.5" fill="#1d4ed8">为监控指标而生</text>

    <rect x="215" y="110" width="400" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="415" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Prometheus · VictoriaMetrics</text>
    <text x="415" y="164" text-anchor="middle" font-size="12" fill="#334155">长期存储：Thanos / Mimir</text>

    <rect x="635" y="110" width="335" height="80" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="802" y="146" text-anchor="middle" font-size="12.5" fill="#334155">监控指标：高基数、长保留、多集群汇聚</text>
    <text x="802" y="168" text-anchor="middle" font-size="11.5" fill="#64748b">PromQL 是这一族的共同语言</text>

    <rect x="30" y="202" width="170" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
    <text x="115" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">通用时序族</text>
    <text x="115" y="256" text-anchor="middle" font-size="11.5" fill="#166534">任何随时间变化的数据</text>

    <rect x="215" y="202" width="400" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="415" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">InfluxDB · TimescaleDB · QuestDB</text>
    <text x="415" y="256" text-anchor="middle" font-size="12" fill="#334155">自研引擎 / PG 扩展 / 列存 三条路</text>

    <rect x="635" y="202" width="335" height="80" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="802" y="238" text-anchor="middle" font-size="12.5" fill="#334155">IoT 传感、金融 tick、业务自定义指标</text>
    <text x="802" y="260" text-anchor="middle" font-size="11.5" fill="#64748b">要 SQL 分析与通用性</text>

    <rect x="30" y="294" width="170" height="80" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
    <text x="115" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">设备模型族</text>
    <text x="115" y="348" text-anchor="middle" font-size="11.5" fill="#9a3412">一个采集点一张表</text>

    <rect x="215" y="294" width="400" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="415" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">TDengine</text>
    <text x="415" y="348" text-anchor="middle" font-size="12" fill="#334155">超级表 + 标签，元数据与时序数据分离</text>

    <rect x="635" y="294" width="335" height="80" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="802" y="330" text-anchor="middle" font-size="12.5" fill="#334155">工业 IoT、车联网、能源</text>
    <text x="802" y="352" text-anchor="middle" font-size="11.5" fill="#64748b">海量同构设备</text>

    <rect x="30" y="386" width="170" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="115" y="418" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">一库多信号族</text>
    <text x="115" y="440" text-anchor="middle" font-size="11.5" fill="#1d4ed8">指标 + 日志 + 链路</text>

    <rect x="215" y="386" width="400" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="415" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">GreptimeDB</text>
    <text x="415" y="440" text-anchor="middle" font-size="12" fill="#334155">SQL + PromQL 双查询，三信号同库</text>

    <rect x="635" y="386" width="335" height="80" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="802" y="422" text-anchor="middle" font-size="12.5" fill="#334155">想用一套存储替掉三套后端</text>
    <text x="802" y="444" text-anchor="middle" font-size="11.5" fill="#64748b">代价：查询隔离要自己设计</text>

    <rect x="30" y="478" width="170" height="80" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
    <text x="115" y="510" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">通用列存自建族</text>
    <text x="115" y="532" text-anchor="middle" font-size="11.5" fill="#475569">不是时序库，是 OLAP</text>

    <rect x="215" y="478" width="400" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="415" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">ClickHouse + 自建时序语义</text>
    <text x="415" y="532" text-anchor="middle" font-size="12" fill="#334155">分区 · 物化视图 · TTL 都要自己搭</text>

    <rect x="635" y="478" width="335" height="80" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="802" y="514" text-anchor="middle" font-size="12.5" fill="#334155">已有数仓，只缺时序聚合能力</text>
    <text x="802" y="536" text-anchor="middle" font-size="11.5" fill="#64748b">成本低，但工程成本自担</text>
  </g>

  <text x="30" y="596" font-size="12.5" fill="#64748b">⭐ 五族的差别不在「快慢」，而在数据模型、查询语言与扩展方式 —— 这三项决定迁移与运维成本</text>
</svg>
