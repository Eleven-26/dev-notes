<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">时序库选型：按「起点资产」分派</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">选型不是从空白开始，而是从「你手里已经有什么」开始</text>

  <rect x="330" y="84" width="340" height="52" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="500" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">先问：起点资产是什么？</text>

  <path d="M500,136 V152 H175 V166" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M500,136 V166" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M500,136 V152 H825 V166" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="30" y="170" width="290" height="326" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="355" y="170" width="290" height="326" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="680" y="170" width="290" height="326" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 3"/>

  <g>
    <rect x="45" y="184" width="260" height="52" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="175" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">A · 已在用 Prometheus</text>
    <text x="175" y="225" text-anchor="middle" font-size="11.5" fill="#1d4ed8">PromQL 资产要尽量不动</text>

    <rect x="45" y="256" width="260" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="175" y="283" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">保留期 / 容量不够</text>
    <text x="175" y="304" text-anchor="middle" font-size="11.5" fill="#1d4ed8">→ 加兼容 PromQL 的长期存储</text>

    <rect x="45" y="344" width="260" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="175" y="371" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">单机写入 / 查询吃力</text>
    <text x="175" y="392" text-anchor="middle" font-size="11.5" fill="#1d4ed8">→ 换可水平扩展的指标库</text>

    <rect x="45" y="432" width="260" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="175" y="464" text-anchor="middle" font-size="12" fill="#1e3a8a">还要日志与链路 → 一库多信号</text>

    <path d="M175,322 V340" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>
    <path d="M175,410 V428" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

    <rect x="370" y="184" width="260" height="52" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
    <text x="500" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">B · 已有 Postgres</text>
    <text x="500" y="225" text-anchor="middle" font-size="11.5" fill="#166534">技能栈与工具链都是资产</text>

    <rect x="370" y="256" width="260" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="500" y="283" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">量级中等</text>
    <text x="500" y="304" text-anchor="middle" font-size="11.5" fill="#166534">→ Postgres 时序扩展（不换 SQL）</text>

    <rect x="370" y="344" width="260" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="500" y="371" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">超出单实例舒适区</text>
    <text x="500" y="392" text-anchor="middle" font-size="11.5" fill="#166534">→ 专用时序库 + PG 保留业务表</text>

    <rect x="370" y="432" width="260" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="500" y="464" text-anchor="middle" font-size="12" fill="#14532d">只有 MySQL → 直接进专用库分支</text>

    <path d="M500,322 V340" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>
    <path d="M500,410 V428" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

    <rect x="695" y="184" width="260" height="52" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
    <text x="825" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">C · 从零开始</text>
    <text x="825" y="225" text-anchor="middle" font-size="11.5" fill="#9a3412">按三个问题依次筛</text>

    <rect x="695" y="256" width="260" height="66" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
    <text x="825" y="283" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">只有指标</text>
    <text x="825" y="304" text-anchor="middle" font-size="11.5" fill="#9a3412">→ 指标专精族（最省资源）</text>

    <rect x="695" y="344" width="260" height="66" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
    <text x="825" y="371" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">要 SQL 分析 / 三信号</text>
    <text x="825" y="392" text-anchor="middle" font-size="11.5" fill="#9a3412">→ 原生 SQL 族或一库多信号</text>

    <rect x="695" y="432" width="260" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
    <text x="825" y="464" text-anchor="middle" font-size="12" fill="#7c2d12">设备 × 指标 → 设备模型族</text>

    <path d="M825,322 V340" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>
    <path d="M825,410 V428" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>
  </g>

  <rect x="30" y="508" width="940" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="45" y="530" font-size="12.5" font-weight="bold" fill="#0f172a">另有两条常见起点（都别急着换栈）：</text>
  <text x="45" y="550" font-size="12.5" fill="#334155">已有 ClickHouse 数仓 / 日志平台 → 先评估「自建时序语义」的工程量（分区 · TTL 调度 · 降采样）</text>

  <text x="30" y="588" font-size="12.5" fill="#64748b">⭐ 判据：能在不改动 Dashboard 与告警规则的前提下落地的方案，通常胜出</text>
  <text x="30" y="610" font-size="12.5" fill="#64748b">⚠️ 已有 InfluxDB 1.x / 2.x 的团队先做代际迁移评估（引擎与查询 API 都换过）；无论走哪条线，POC 都要用自己的基数与查询组合</text>
</svg>
