<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 732" width="1000" height="732" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="obs-arw-org" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/>
    </marker>
    <marker id="obs-arw-gry" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="obs-arw-grn" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="obs-arw-blu" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="732" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">可观测性数据流：采集端 → GreptimeDB 统一存储 → 消费端</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">GreptimeDB 替换的是存储与查询层；采集端与消费端各司其职，不必更换</text>

  <rect x="30" y="86" width="940" height="154" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="48" y="110" font-size="13" font-weight="bold" fill="#334155">数据采集端</text>

  <rect x="54" y="124" width="205" height="80" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="156" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">Prometheus Remote Write</text>
  <text x="156" y="182" text-anchor="middle" font-size="11" fill="#9a3412">remote_write · Metrics</text>

  <rect x="283" y="124" width="205" height="80" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="385" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">OpenTelemetry Collector</text>
  <text x="385" y="182" text-anchor="middle" font-size="11" fill="#475569">OTLP/HTTP · 三信号</text>

  <rect x="512" y="124" width="205" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="614" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">Vector / Fluent Bit / Kafka</text>
  <text x="614" y="182" text-anchor="middle" font-size="11" fill="#166534">日志链路 · Logs</text>

  <rect x="741" y="124" width="205" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="843" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">Jaeger Client</text>
  <text x="843" y="182" text-anchor="middle" font-size="11" fill="#1d4ed8">OTLP/gRPC · Traces</text>

  <line x1="156" y1="204" x2="156" y2="294" stroke="#ea580c" stroke-width="1.6" marker-end="url(#obs-arw-org)"/>
  <line x1="385" y1="204" x2="385" y2="294" stroke="#64748b" stroke-width="1.6" marker-end="url(#obs-arw-gry)"/>
  <line x1="614" y1="204" x2="614" y2="294" stroke="#16a34a" stroke-width="1.6" marker-end="url(#obs-arw-grn)"/>
  <line x1="843" y1="204" x2="843" y2="294" stroke="#2563eb" stroke-width="1.6" marker-end="url(#obs-arw-blu)"/>

  <text x="168" y="254" font-size="11.5" fill="#9a3412">Metrics</text>
  <text x="397" y="246" font-size="11.5" fill="#475569">Metrics,</text>
  <text x="397" y="264" font-size="11.5" fill="#475569">Logs, Traces</text>
  <text x="626" y="254" font-size="11.5" fill="#166534">Logs</text>
  <text x="855" y="254" font-size="11.5" fill="#1e3a8a">Traces</text>

  <rect x="40" y="300" width="920" height="104" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.8"/>
  <text x="500" y="332" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">GreptimeDB 统一存储</text>

  <rect x="140" y="346" width="220" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="250" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">traces</text>
  <text x="250" y="380" text-anchor="middle" font-size="10.5" fill="#1d4ed8">opentelemetry_traces</text>

  <rect x="390" y="346" width="220" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="500" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">logs</text>
  <text x="500" y="380" text-anchor="middle" font-size="10.5" fill="#166534">opentelemetry_logs</text>

  <rect x="640" y="346" width="220" height="42" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="750" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">metrics</text>
  <text x="750" y="380" text-anchor="middle" font-size="10.5" fill="#9a3412">Metric Engine 物理表</text>

  <line x1="250" y1="404" x2="204" y2="500" stroke="#2563eb" stroke-width="1.6" marker-end="url(#obs-arw-blu)"/>
  <line x1="500" y1="404" x2="508" y2="500" stroke="#16a34a" stroke-width="1.6" marker-end="url(#obs-arw-grn)"/>
  <line x1="750" y1="404" x2="812" y2="500" stroke="#ea580c" stroke-width="1.6" marker-end="url(#obs-arw-org)"/>

  <text x="60" y="470" font-size="11.5" fill="#1e3a8a">PromQL / SQL</text>
  <text x="528" y="478" font-size="11.5" fill="#166534">SQL 告警规则</text>
  <text x="842" y="470" font-size="11.5" fill="#7c2d12">Jaeger API</text>

  <rect x="40" y="462" width="920" height="156" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="58" y="488" font-size="13" font-weight="bold" fill="#334155">数据消费端</text>

  <rect x="64" y="502" width="280" height="88" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="204" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Grafana</text>
  <text x="204" y="554" text-anchor="middle" font-size="11.5" fill="#1d4ed8">可视化与仪表盘</text>
  <text x="204" y="576" text-anchor="middle" font-size="11.5" fill="#1d4ed8">Prometheus 数据源 / 插件</text>

  <rect x="368" y="502" width="280" height="88" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="508" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">GreptimeDB Trigger</text>
  <text x="508" y="554" text-anchor="middle" font-size="11.5" fill="#166534">或 vmalert</text>
  <text x="508" y="576" text-anchor="middle" font-size="11.5" fill="#166534">SQL 告警规则</text>

  <rect x="672" y="502" width="280" height="88" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="812" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Jaeger UI</text>
  <text x="812" y="554" text-anchor="middle" font-size="11.5" fill="#9a3412">Grafana Jaeger 插件</text>
  <text x="812" y="576" text-anchor="middle" font-size="11.5" fill="#9a3412">链路查询</text>

  <rect x="40" y="648" width="920" height="64" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="58" y="674" font-size="12" fill="#0f172a">⭐ 统一发生在「引擎 / 存储 / 查询」三层，不要求三信号共用一张表——按信号分表、按表设 TTL 是常见做法。</text>
  <text x="58" y="696" font-size="12" fill="#0f172a">⚠️ 采集端与消费端都不必换：Prometheus 继续写、Grafana 继续读，只是后端由多套存储收敛成一套。</text>
</svg>
