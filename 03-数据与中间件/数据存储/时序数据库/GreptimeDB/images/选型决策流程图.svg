<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="pickArw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">选型决策流程：四问收敛到候选</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">「是」走左侧候选，「否」继续下一问；判据只收敛候选，不替代验证（方法示意，非实测）</text>

  <rect x="430" y="96" width="470" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="665" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">① 数据是不是纯指标（不用日志与链路）？</text>
  <text x="665" y="148" text-anchor="middle" font-size="11" fill="#1d4ed8">只要指标 → 优先考虑专精工具</text>

  <rect x="430" y="186" width="470" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="665" y="218" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">② 是否要强 SQL 分析（join / 复杂聚合）？</text>
  <text x="665" y="238" text-anchor="middle" font-size="11" fill="#1d4ed8">要通用列存分析 → 看重分析引擎</text>

  <rect x="430" y="276" width="470" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="665" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">③ 是否要一个库同时承载三信号？</text>
  <text x="665" y="328" text-anchor="middle" font-size="11" fill="#1d4ed8">指标 + 日志 + 链路统一存储</text>

  <rect x="430" y="366" width="470" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="665" y="398" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">④ 是否已有 Postgres 且单机够用？</text>
  <text x="665" y="418" text-anchor="middle" font-size="11" fill="#1d4ed8">沿用既有关系型资产</text>

  <rect x="40" y="96" width="340" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="210" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">VictoriaMetrics</text>
  <text x="210" y="146" text-anchor="middle" font-size="11.5" fill="#166534">指标专精 · 单二进制、运维极简</text>

  <rect x="40" y="186" width="340" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="210" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">ClickHouse</text>
  <text x="210" y="236" text-anchor="middle" font-size="11.5" fill="#166534">通用列存 · 需自建时序语义</text>

  <rect x="40" y="276" width="340" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="210" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">GreptimeDB</text>
  <text x="210" y="326" text-anchor="middle" font-size="11.5" fill="#166534">SQL + PromQL · 对象存储原生</text>

  <rect x="40" y="366" width="340" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="210" y="394" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">TimescaleDB</text>
  <text x="210" y="416" text-anchor="middle" font-size="11.5" fill="#166534">Postgres 扩展 · 单机为主</text>

  <line x1="428" y1="128" x2="384" y2="128" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pickArw)"/>
  <line x1="428" y1="218" x2="384" y2="218" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pickArw)"/>
  <line x1="428" y1="308" x2="384" y2="308" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pickArw)"/>
  <line x1="428" y1="398" x2="384" y2="398" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pickArw)"/>
  <text x="404" y="122" text-anchor="middle" font-size="10" fill="#16a34a">是</text>
  <text x="404" y="212" text-anchor="middle" font-size="10" fill="#16a34a">是</text>
  <text x="404" y="302" text-anchor="middle" font-size="10" fill="#16a34a">是</text>
  <text x="404" y="392" text-anchor="middle" font-size="10" fill="#16a34a">是</text>

  <line x1="665" y1="160" x2="665" y2="184" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pickArw)"/>
  <line x1="665" y1="250" x2="665" y2="274" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pickArw)"/>
  <line x1="665" y1="340" x2="665" y2="364" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pickArw)"/>
  <line x1="665" y1="430" x2="665" y2="454" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pickArw)"/>
  <text x="677" y="175" font-size="10" fill="#64748b">否</text>
  <text x="677" y="265" font-size="10" fill="#64748b">否</text>
  <text x="677" y="355" font-size="10" fill="#64748b">否</text>
  <text x="677" y="445" font-size="10" fill="#64748b">否</text>

  <rect x="430" y="456" width="470" height="64" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="665" y="484" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">以上均否：IoT 设备模板建模 → 评估 TDengine</text>
  <text x="665" y="506" text-anchor="middle" font-size="11" fill="#9a3412">注意 AGPL v3 在可网络访问部署下的合规评估</text>

  <text x="30" y="560" font-size="12" fill="#64748b">判据只收敛候选，不替代验证：务必用真实基数与存量数据回放，跑一遍关键查询再决定是否切换。</text>
  <text x="30" y="584" font-size="12" fill="#64748b">纯指标以外的分支若都不成立，也可保留多套专精工具组合 —— 是否单库承载本身就是一个待验证的取舍。</text>
</svg>
