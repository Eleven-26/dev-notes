<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="lpArw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="lpArwG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一行写入报文的字段布局与落库列对照</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">上图：InfluxDB 行协议的四段切分；中图：自动建表 DDL 的列来源；下图：OpenTSDB 路径的列名不同</text>

  <rect x="30" y="82" width="940" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="46" y="111" font-size="13" font-weight="bold" fill="#0f172a">报文布局</text>
  <text x="130" y="111" font-size="13" fill="#1e3a8a">measurement</text>
  <text x="212" y="111" font-size="13" fill="#0f172a">,</text>
  <text x="226" y="111" font-size="13" fill="#7c2d12">tag-set</text>
  <text x="288" y="111" font-size="13" fill="#0f172a">(空格)</text>
  <text x="340" y="111" font-size="13" fill="#14532d">field-set</text>
  <text x="416" y="111" font-size="13" fill="#0f172a">(空格)</text>
  <text x="470" y="111" font-size="13" fill="#78350f">timestamp</text>
  <line x1="556" y1="90" x2="556" y2="120" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="572" y="111" font-size="12" fill="#334155">分隔符：逗号切同段内的键值对，空格切四段</text>

  <rect x="30" y="140" width="940" height="54" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
  <text x="46" y="163" font-size="13.5" fill="#78350f">monitor,host=127.0.0.1 cpu=0.1,memory=0.4 1667446797450</text>
  <text x="46" y="184" font-size="11.5" fill="#92400e">写 3 行、重复写 1 次，POST /v1/influxdb/write?db=public&amp;precision=ms 返回 HTTP/1.1 204 No Content（成功不回 body）</text>

  <line x1="160" y1="194" x2="160" y2="228" stroke="#16a34a" stroke-width="1.8" marker-end="url(#lpArwG)"/>
  <text x="170" y="216" font-size="11.5" fill="#14532d">自动建表</text>

  <rect x="30" y="234" width="940" height="230" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="46" y="258" font-size="13" font-weight="bold" fill="#0f172a">SHOW CREATE TABLE monitor 实测 DDL</text>
  <text x="46" y="284" font-size="12.5" fill="#334155">CREATE TABLE IF NOT EXISTS "monitor" (</text>
  <text x="70" y="306" font-size="12.5" fill="#7c2d12">"host" STRING NULL,                      ← tag-set 落此列</text>
  <text x="70" y="328" font-size="12.5" fill="#14532d">"cpu" DOUBLE NULL,                        ← field-set 第 1 个</text>
  <text x="70" y="350" font-size="12.5" fill="#14532d">"memory" DOUBLE NULL,                     ← field-set 第 2 个</text>
  <text x="70" y="372" font-size="12.5" fill="#78350f">"greptime_timestamp" TIMESTAMP(9) NOT NULL,  ← timestamp 自动补</text>
  <text x="70" y="394" font-size="12.5" fill="#334155">TIME INDEX ("greptime_timestamp"),  PRIMARY KEY ("host")</text>
  <text x="46" y="416" font-size="12.5" fill="#334155">) ENGINE=mito WITH( merge_mode = 'last_non_null' ) —— measurement 即表名</text>
  <text x="46" y="446" font-size="11.5" fill="#991b1b">列名不是官方示例里的 ts：SELECT ts 报 No field named ts，Valid fields 只有上面四列</text>

  <rect x="30" y="478" width="455" height="176" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="52" y="502" font-size="13" font-weight="bold" fill="#1e3a8a">行协议路径（influxdb）</text>
  <text x="52" y="526" font-size="12" fill="#334155">host STRING</text>
  <text x="252" y="526" font-size="12" fill="#334155">cpu / memory DOUBLE</text>
  <text x="52" y="548" font-size="12" fill="#334155">值列 = field 名本身</text>
  <text x="252" y="548" font-size="12" fill="#334155">greptime_value 不出现</text>
  <line x1="52" y1="562" x2="462" y2="562" stroke="#bfdbfe" stroke-width="1.4"/>
  <text x="52" y="584" font-size="12" fill="#334155">时间列 TimestampNanosecond</text>
  <text x="52" y="606" font-size="12" fill="#334155">字面量 1667446797450 + precision=ms</text>
  <text x="252" y="606" font-size="12" fill="#14532d">存 1667446797450000000</text>
  <text x="52" y="628" font-size="12" fill="#334155">不带 precision（默认按 ns 读）</text>
  <text x="252" y="628" font-size="12" fill="#991b1b">存 1667446797450 原样</text>
  <text x="52" y="648" font-size="11.5" fill="#1e3a8a">两次都是 204，不报错，to_unixtime 读数差 1000000 倍</text>

  <rect x="515" y="478" width="455" height="176" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="537" y="502" font-size="13" font-weight="bold" fill="#7c2d12">OpenTSDB 路径（/v1/opentsdb/api/put）</text>
  <text x="537" y="526" font-size="12" fill="#334155">host STRING（PRIMARY KEY(host)）</text>
  <text x="537" y="548" font-size="12" fill="#334155">样本值统一进 greptime_value</text>
  <text x="537" y="570" font-size="12" fill="#334155">时间列 TimestampMillisecond</text>
  <line x1="537" y1="584" x2="948" y2="584" stroke="#fed7aa" stroke-width="1.4"/>
  <text x="537" y="606" font-size="12" fill="#334155">timestamp 给秒 1700000000</text>
  <text x="780" y="606" font-size="12" fill="#14532d">存成 1700000000000</text>
  <text x="537" y="628" font-size="12" fill="#334155">metric=sys_cpu → 表名 sys_cpu</text>
  <text x="537" y="648" font-size="11.5" fill="#991b1b">与行协议的 TIMESTAMP(9) 不是同一类型，同表混用撞类型冲突</text>

  <text x="30" y="688" font-size="12" fill="#334155">落库全貌：SHOW TABLES 共 5 张 —— monitor、monitor_ns、monitor_v2、monitor_append、sys_cpu；</text>
  <text x="30" y="710" font-size="12" fill="#334155">写入行数读数 greptime_table_operator_ingest_rows{db="public"} 167、greptime_mito_write_rows_total{type="put"} 151。</text>
  <text x="30" y="740" font-size="11.5" fill="#64748b">出处：本机 Docker Desktop（Engine 29.7.2）跑 greptime/greptimedb 1.2.1 standalone，宿主 25001 → 容器 4000，见正文第 5.5 节。</text>
</svg>
