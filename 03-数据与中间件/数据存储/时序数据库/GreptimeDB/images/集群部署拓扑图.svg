<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="topoArw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="570" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">GreptimeDB 分布式部署拓扑：三核心组件 + 可选 Flownode</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">计算与存储分离：数据文件落共享对象存储，本地盘做缓存（结构示意，非实测）</text>

  <rect x="340" y="86" width="320" height="58" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="500" y="112" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">客户端 / Grafana / Prometheus remote_write</text>
  <text x="500" y="132" text-anchor="middle" font-size="11" fill="#475569">SQL · PromQL · 多种写入协议</text>

  <line x1="500" y1="146" x2="500" y2="166" stroke="#64748b" stroke-width="1.6" marker-end="url(#topoArw)"/>

  <rect x="40" y="168" width="250" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="165" y="198" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">Metasrv 集群（≥3 节点）</text>
  <text x="165" y="220" text-anchor="middle" font-size="11" fill="#166534">catalog / 表 / Region 路由</text>
  <text x="165" y="240" text-anchor="middle" font-size="11" fill="#166534">Raft 共识；后端 etcd/PG/MySQL</text>

  <rect x="340" y="168" width="300" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="490" y="198" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">Frontend 集群（无状态）</text>
  <text x="490" y="220" text-anchor="middle" font-size="11" fill="#1d4ed8">接收协议 · 鉴权 · 分布式查询规划</text>
  <text x="490" y="240" text-anchor="middle" font-size="11" fill="#1d4ed8">按 Region 路由转发读写</text>

  <rect x="690" y="168" width="270" height="78" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="825" y="198" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">Flownode（可选）</text>
  <text x="825" y="220" text-anchor="middle" font-size="11" fill="#9a3412">运行 Flow 任务</text>
  <text x="825" y="240" text-anchor="middle" font-size="11" fill="#9a3412">物化结果到 sink 表</text>

  <line x1="292" y1="207" x2="336" y2="207" stroke="#64748b" stroke-width="1.6" marker-end="url(#topoArw)"/>
  <text x="314" y="200" text-anchor="middle" font-size="10" fill="#64748b">metadata</text>
  <line x1="642" y1="207" x2="686" y2="207" stroke="#64748b" stroke-width="1.6" marker-end="url(#topoArw)"/>
  <text x="664" y="200" text-anchor="middle" font-size="10" fill="#64748b">Flow</text>

  <rect x="40" y="300" width="280" height="86" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="180" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Datanode</text>
  <text x="180" y="358" text-anchor="middle" font-size="11.5" fill="#9a3412">承载 Region · 读写 · WAL</text>
  <text x="180" y="380" text-anchor="middle" font-size="11.5" fill="#9a3412">compaction · 落盘</text>

  <rect x="360" y="300" width="280" height="86" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="500" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Datanode</text>
  <text x="500" y="358" text-anchor="middle" font-size="11.5" fill="#9a3412">承载 Region · 读写 · WAL</text>
  <text x="500" y="380" text-anchor="middle" font-size="11.5" fill="#9a3412">compaction · 落盘</text>

  <rect x="680" y="300" width="280" height="86" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="820" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Datanode</text>
  <text x="820" y="358" text-anchor="middle" font-size="11.5" fill="#9a3412">承载 Region · 读写 · WAL</text>
  <text x="820" y="380" text-anchor="middle" font-size="11.5" fill="#9a3412">compaction · 落盘</text>

  <line x1="490" y1="248" x2="185" y2="298" stroke="#64748b" stroke-width="1.4" marker-end="url(#topoArw)"/>
  <line x1="490" y1="248" x2="500" y2="298" stroke="#64748b" stroke-width="1.4" marker-end="url(#topoArw)"/>
  <line x1="490" y1="248" x2="815" y2="298" stroke="#64748b" stroke-width="1.4" marker-end="url(#topoArw)"/>

  <rect x="40" y="430" width="920" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="500" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">共享对象存储：S3 / OSS / GCS / Azure Blob / MinIO（S3 兼容）</text>
  <text x="500" y="488" text-anchor="middle" font-size="11.5" fill="#166534">持久化数据文件的最终落点；本地盘仅作缓存 —— 数据文件在 Datanode 间共享</text>

  <line x1="180" y1="386" x2="180" y2="428" stroke="#64748b" stroke-width="1.4" marker-end="url(#topoArw)"/>
  <line x1="500" y1="386" x2="500" y2="428" stroke="#64748b" stroke-width="1.4" marker-end="url(#topoArw)"/>
  <line x1="820" y1="386" x2="820" y2="428" stroke="#64748b" stroke-width="1.4" marker-end="url(#topoArw)"/>

  <text x="30" y="548" font-size="12" fill="#b45309">⚠️ 对象存储不是唯一状态：WAL 记录已接收的写入、Metasrv 管集群元数据、本地盘缓存远端数据 —— 可用性取决于它们的组合。</text>
</svg>
