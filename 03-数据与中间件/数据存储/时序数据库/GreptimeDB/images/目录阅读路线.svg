<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="gpRouteA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">GreptimeDB 目录阅读路线：十二篇、两条线、三收口</text>
  <text x="500" y="55" text-anchor="middle" font-size="13" fill="#64748b">编号与视角取自第三节学习路径表；原理线 / 落地线取自 3.1；三条最短路径取自 3.2；框内小字是各篇视角摘要</text>

  <text x="40" y="92" font-size="13" font-weight="bold" fill="#1e3a8a">原理线 ②→③→④：数据怎么存、查询为什么快</text>
  <rect x="40" y="102" width="290" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="185" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">② 架构与存储引擎</text>
  <text x="185" y="147" text-anchor="middle" font-size="11.5" fill="#1d4ed8">三层组件 · LSM · region 与 SST</text>
  <line x1="334" y1="131" x2="356" y2="131" stroke="#334155" stroke-width="1.8" marker-end="url(#gpRouteA)"/>
  <rect x="360" y="102" width="290" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="505" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">③ 数据模型与写入路径</text>
  <text x="505" y="147" text-anchor="middle" font-size="11.5" fill="#1d4ed8">tag / field · TIME INDEX · PRIMARY KEY</text>
  <line x1="654" y1="131" x2="676" y2="131" stroke="#334155" stroke-width="1.8" marker-end="url(#gpRouteA)"/>
  <rect x="680" y="102" width="280" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="820" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">④ 索引设计与查询优化</text>
  <text x="820" y="147" text-anchor="middle" font-size="11.5" fill="#1d4ed8">三级剪枝 · Puffin · EXPLAIN</text>

  <text x="40" y="196" font-size="13" font-weight="bold" fill="#7c2d12">落地线 ①→⑦→⑧→⑩：怎么把数据接进来、怎么把它跑稳</text>
  <rect x="40" y="206" width="200" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="140" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">① 定位与适用场景</text>
  <text x="140" y="251" text-anchor="middle" font-size="11.5" fill="#9a3412">能力边界 · 该不该用</text>
  <line x1="244" y1="235" x2="266" y2="235" stroke="#334155" stroke-width="1.8" marker-end="url(#gpRouteA)"/>
  <rect x="270" y="206" width="220" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="380" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">⑦ 写入协议与数据接入</text>
  <text x="380" y="251" text-anchor="middle" font-size="11.5" fill="#9a3412">Remote Write / OTLP 等接入</text>
  <line x1="494" y1="235" x2="516" y2="235" stroke="#334155" stroke-width="1.8" marker-end="url(#gpRouteA)"/>
  <rect x="520" y="206" width="220" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="630" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">⑧ 可观测性集成方案</text>
  <text x="630" y="251" text-anchor="middle" font-size="11.5" fill="#9a3412">Grafana · OTel · Jaeger 对接</text>
  <line x1="744" y1="235" x2="766" y2="235" stroke="#334155" stroke-width="1.8" marker-end="url(#gpRouteA)"/>
  <rect x="770" y="206" width="190" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="865" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">⑩ 部署与集群运维</text>
  <text x="865" y="251" text-anchor="middle" font-size="11.5" fill="#9a3412">standalone 与集群 · WAL</text>

  <text x="40" y="302" font-size="12.5" fill="#475569">收口：⑤⑥ 是查询面（两种查询语言），⑨ 是计算面（把聚合预先算好），⑪⑫ 是最终收口</text>
  <rect x="40" y="312" width="176" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="128" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">⑤ SQL查询与</text>
  <text x="128" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">跨信号关联</text>
  <rect x="228" y="312" width="176" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="316" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">⑥ PromQL</text>
  <text x="316" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">兼容查询</text>
  <rect x="416" y="312" width="176" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="504" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">⑨ Flow流计算</text>
  <text x="504" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">引擎</text>
  <rect x="604" y="312" width="176" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="692" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">⑪ 性能调优与</text>
  <text x="692" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">基准测试</text>
  <rect x="792" y="312" width="168" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="876" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">⑫ 选型对比与</text>
  <text x="876" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">落地案例</text>

  <rect x="40" y="400" width="920" height="184" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="428" font-size="13.5" font-weight="bold" fill="#0f172a">三类读者的最短路径（3.2）</text>
  <text x="60" y="458" font-size="12.5" fill="#334155">只做评估（要不要用）：① 定位与适用场景 → ⑫ 选型对比与落地案例</text>
  <text x="60" y="486" font-size="12.5" fill="#334155">负责接入与运维：② 架构与存储引擎 → ⑦ 写入协议与数据接入 → ⑧ 可观测性集成方案 → ⑩ 部署与集群运维</text>
  <text x="60" y="514" font-size="12.5" fill="#334155">负责建模与调优：③ 数据模型与写入路径 → ④ 索引设计与查询优化 → ⑨ Flow流计算引擎 → ⑪ 性能调优与基准测试</text>
  <text x="60" y="542" font-size="12.5" fill="#475569">只想建立总体印象：① → ② 两篇即可（见第一节末尾）</text>
  <text x="60" y="570" font-size="11.5" fill="#94a3b8">三篇地基（1.2 的因果链）：存储布局决定能剪谁，写入语义决定能合并谁，索引决定剩下的怎么快速过滤</text>
</svg>
