<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="sqA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="sqB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="570" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一次写入的调用时序</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">确认发生在 WAL 持久化且内存可见之后；落成 Parquet SST 是后台异步动作</text>

  <rect x="60" y="80" width="160" height="46" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="140" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">客户端</text>
  <rect x="300" y="80" width="160" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="380" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Frontend</text>
  <rect x="540" y="80" width="160" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="620" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Datanode / Region</text>
  <rect x="780" y="80" width="160" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="860" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">WAL</text>

  <line x1="140" y1="126" x2="140" y2="486" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="380" y1="126" x2="380" y2="486" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="620" y1="126" x2="620" y2="486" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="860" y1="126" x2="860" y2="486" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4"/>

  <line x1="140" y1="168" x2="380" y2="168" stroke="#64748b" stroke-width="1.6" marker-end="url(#sqA)"/>
  <text x="260" y="160" text-anchor="middle" font-size="11.5" fill="#334155">① 写入请求（协议解析 / 鉴权）</text>

  <line x1="380" y1="216" x2="620" y2="216" stroke="#64748b" stroke-width="1.6" marker-end="url(#sqA)"/>
  <text x="500" y="208" text-anchor="middle" font-size="11.5" fill="#334155">② 按 Region 路由，拆分并转发</text>

  <line x1="620" y1="264" x2="860" y2="264" stroke="#dc2626" stroke-width="1.8" marker-end="url(#sqA)"/>
  <text x="740" y="256" text-anchor="middle" font-size="11.5" fill="#991b1b">③ append：先持久化</text>

  <path d="M620,306 L700,306 L700,346 L620,346" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <line x1="700" y1="306" x2="626" y2="306" stroke="#2563eb" stroke-width="1.4" marker-end="url(#sqB)"/>
  <text x="712" y="322" font-size="11.5" fill="#1d4ed8">④ 写 mutable memtable</text>
  <text x="712" y="340" font-size="11.5" fill="#1d4ed8">（内存可见）</text>

  <line x1="620" y1="392" x2="380" y2="392" stroke="#64748b" stroke-width="1.6" marker-end="url(#sqA)"/>
  <text x="500" y="384" text-anchor="middle" font-size="11.5" fill="#334155">⑤ 确认</text>

  <line x1="380" y1="440" x2="140" y2="440" stroke="#64748b" stroke-width="1.6" marker-end="url(#sqA)"/>
  <text x="260" y="432" text-anchor="middle" font-size="11.5" fill="#334155">⑥ 返回成功</text>

  <text x="60" y="516" font-size="12" fill="#64748b">⭐ 确认时机 = WAL 持久化 + 内存可见；后续「冻结 memtable → 写 Parquet SST → 在 manifest 记元数据」在后台完成。</text>
  <text x="60" y="538" font-size="12" fill="#64748b">⚠️ 时序口径引自 GreptimeDB 官方文档《架构》与官方博客（2022-12-20）；未做本机实测，省略网络重试等细节。</text>
</svg>
