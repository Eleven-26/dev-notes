<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="mgArw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="mgArwR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="730" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Region 迁移的调用时序：回放 WAL 增量，不搬数据文件</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">步骤口径取自官方博客的 Region Migration（能力自 v0.6.0 引入）；④⑤⑥ 只在分布式 + Remote WAL 下成立</text>

  <rect x="30" y="84" width="140" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="100" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">运维 / Frontend</text>
  <text x="100" y="126" text-anchor="middle" font-size="11" fill="#334155">发起迁移</text>
  <rect x="190" y="84" width="140" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="260" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">Metasrv</text>
  <text x="260" y="126" text-anchor="middle" font-size="11" fill="#1e3a8a">procedure 调度</text>
  <rect x="350" y="84" width="140" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="420" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">Datanode A</text>
  <text x="420" y="126" text-anchor="middle" font-size="11" fill="#7c2d12">原 Leader</text>
  <rect x="510" y="84" width="140" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="580" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">Datanode B</text>
  <text x="580" y="126" text-anchor="middle" font-size="11" fill="#14532d">candidate</text>
  <rect x="670" y="84" width="140" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="740" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">Remote WAL</text>
  <text x="740" y="126" text-anchor="middle" font-size="11" fill="#7f1d1d">Kafka</text>
  <rect x="830" y="84" width="140" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="900" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#78350f">对象存储</text>
  <text x="900" y="126" text-anchor="middle" font-size="11" fill="#78350f">共享数据文件</text>

  <line x1="100" y1="136" x2="100" y2="452" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="260" y1="136" x2="260" y2="452" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="420" y1="136" x2="420" y2="452" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="580" y1="136" x2="580" y2="452" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="740" y1="136" x2="740" y2="452" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="900" y1="136" x2="900" y2="452" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4"/>

  <line x1="100" y1="186" x2="254" y2="186" stroke="#64748b" stroke-width="1.6" marker-end="url(#mgArw)"/>
  <text x="180" y="178" text-anchor="middle" font-size="11.5" fill="#334155">① 发起迁移 procedure</text>

  <line x1="260" y1="226" x2="574" y2="226" stroke="#64748b" stroke-width="1.6" marker-end="url(#mgArw)"/>
  <text x="417" y="218" text-anchor="middle" font-size="11.5" fill="#334155">② 开一个 candidate Region</text>

  <line x1="260" y1="266" x2="414" y2="266" stroke="#dc2626" stroke-width="1.8" marker-end="url(#mgArwR)"/>
  <text x="337" y="258" text-anchor="middle" font-size="11.5" fill="#991b1b">③ 降级：切断写入流量</text>

  <line x1="580" y1="306" x2="894" y2="306" stroke="#b45309" stroke-width="1.6" marker-end="url(#mgArw)"/>
  <text x="737" y="298" text-anchor="middle" font-size="11.5" fill="#78350f">④ 只读共享数据文件，不搬运</text>

  <line x1="580" y1="346" x2="734" y2="346" stroke="#dc2626" stroke-width="1.8" marker-end="url(#mgArwR)"/>
  <text x="657" y="338" text-anchor="middle" font-size="11.5" fill="#991b1b">⑤ 回放该 Region 的 WAL 增量</text>

  <line x1="260" y1="386" x2="574" y2="386" stroke="#16a34a" stroke-width="1.8" marker-end="url(#mgArw)"/>
  <text x="417" y="378" text-anchor="middle" font-size="11.5" fill="#14532d">⑥ 回放成功 → candidate 升为 Leader</text>

  <line x1="100" y1="426" x2="574" y2="426" stroke="#64748b" stroke-width="1.6" marker-end="url(#mgArw)"/>
  <text x="337" y="418" text-anchor="middle" font-size="11.5" fill="#334155">⑦ 写入流量恢复：继续接收写入</text>

  <rect x="30" y="470" width="940" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="46" y="494" font-size="13" font-weight="bold" fill="#0f172a">实测口径：1.2.1 standalone（宿主 25001 → 容器 4000）；①~⑦ 整条链未实测，实读到的是迁移前的 Region 分布</text>
  <text x="46" y="520" font-size="11.5" fill="#334155">· 正文 JOIN 里的 greptime_region_peers 报 Table not found，实表名是 region_peers</text>
  <text x="46" y="542" font-size="11.5" fill="#334155">· 改成 region_peers 后返回 1 行：datanode_id 0、region_id 4445291151360</text>
  <text x="46" y="564" font-size="11.5" fill="#334155">· region_peers 实测 12 行，peer_id 全是 0、is_leader 全 Yes、status 全 ALIVE</text>
  <text x="46" y="586" font-size="11.5" fill="#334155">· region_statistics：written_bytes_since_open 159、memtable_size 159、sst_num 0</text>
  <text x="46" y="608" font-size="11.5" fill="#334155">· procedure_info：procedure_type 形如 metasrv-procedure::CreateFlow，status 读数 Done 或 Failed</text>
  <text x="46" y="630" font-size="11.5" fill="#991b1b">· SELECT migrate_region(1, 1, 2, 30) 报 Unsupported operation migrate_region：④⑤⑥ 需分布式 + Remote WAL</text>
  <text x="46" y="658" font-size="11.5" fill="#334155">· 缩容前先迁走该节点上的 Leader Region；节点间写入不均先调分区，再加节点</text>

  <text x="30" y="708" font-size="12" fill="#64748b">要点：完整 Region 数据 = Remote WAL 中的增量数据 + 对象存储上的数据文件，所以迁移只回放 WAL，不搬整个 Region 文件。</text>
</svg>
