<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">表模型：Tag / Timestamp / Field 三类列</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">概念模型介于 key-value 与表模型之间：tag 与 timestamp 组成排序键，field 是测量值</text>

  <rect x="60" y="92" width="176" height="48" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="236" y="92" width="176" height="48" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="412" y="92" width="176" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <rect x="588" y="92" width="176" height="48" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <rect x="764" y="92" width="176" height="48" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>

  <text x="148" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">host</text>
  <text x="148" y="132" text-anchor="middle" font-size="11" fill="#166534">Tag（PRIMARY KEY）</text>
  <text x="324" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">region</text>
  <text x="324" y="132" text-anchor="middle" font-size="11" fill="#166534">Tag（PRIMARY KEY）</text>
  <text x="500" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">ts</text>
  <text x="500" y="132" text-anchor="middle" font-size="11" fill="#1d4ed8">Timestamp（TIME INDEX）</text>
  <text x="676" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">cpu</text>
  <text x="676" y="132" text-anchor="middle" font-size="11" fill="#9a3412">Field</text>
  <text x="852" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">memory</text>
  <text x="852" y="132" text-anchor="middle" font-size="11" fill="#9a3412">Field</text>

  <rect x="60" y="140" width="176" height="36" fill="#f0fdf4" stroke="#cbd5e1"/>
  <rect x="236" y="140" width="176" height="36" fill="#f0fdf4" stroke="#cbd5e1"/>
  <rect x="412" y="140" width="176" height="36" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="588" y="140" width="176" height="36" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="764" y="140" width="176" height="36" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="148" y="164" text-anchor="middle" font-size="12" fill="#0f172a">host-a</text>
  <text x="324" y="164" text-anchor="middle" font-size="12" fill="#0f172a">us-east</text>
  <text x="500" y="164" text-anchor="middle" font-size="12" fill="#0f172a">10:00</text>
  <text x="676" y="164" text-anchor="middle" font-size="12" fill="#0f172a">0.42</text>
  <text x="852" y="164" text-anchor="middle" font-size="12" fill="#0f172a">27.1</text>

  <rect x="60" y="176" width="176" height="36" fill="#f0fdf4" stroke="#cbd5e1"/>
  <rect x="236" y="176" width="176" height="36" fill="#f0fdf4" stroke="#cbd5e1"/>
  <rect x="412" y="176" width="176" height="36" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="588" y="176" width="176" height="36" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="764" y="176" width="176" height="36" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="148" y="200" text-anchor="middle" font-size="12" fill="#0f172a">host-a</text>
  <text x="324" y="200" text-anchor="middle" font-size="12" fill="#0f172a">us-east</text>
  <text x="500" y="200" text-anchor="middle" font-size="12" fill="#0f172a">10:01</text>
  <text x="676" y="200" text-anchor="middle" font-size="12" fill="#0f172a">0.47</text>
  <text x="852" y="200" text-anchor="middle" font-size="12" fill="#0f172a">27.4</text>

  <rect x="60" y="212" width="176" height="36" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="236" y="212" width="176" height="36" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="412" y="212" width="176" height="36" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="588" y="212" width="176" height="36" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="764" y="212" width="176" height="36" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="148" y="236" text-anchor="middle" font-size="12" fill="#0f172a">host-a</text>
  <text x="324" y="236" text-anchor="middle" font-size="12" fill="#0f172a">us-west</text>
  <text x="500" y="236" text-anchor="middle" font-size="12" fill="#0f172a">10:00</text>
  <text x="676" y="236" text-anchor="middle" font-size="12" fill="#0f172a">0.31</text>
  <text x="852" y="236" text-anchor="middle" font-size="12" fill="#0f172a">26.8</text>

  <rect x="60" y="248" width="176" height="36" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="236" y="248" width="176" height="36" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="412" y="248" width="176" height="36" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="588" y="248" width="176" height="36" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="764" y="248" width="176" height="36" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="148" y="272" text-anchor="middle" font-size="12" fill="#0f172a">host-b</text>
  <text x="324" y="272" text-anchor="middle" font-size="12" fill="#0f172a">us-east</text>
  <text x="500" y="272" text-anchor="middle" font-size="12" fill="#0f172a">10:00</text>
  <text x="676" y="272" text-anchor="middle" font-size="12" fill="#0f172a">0.80</text>
  <text x="852" y="272" text-anchor="middle" font-size="12" fill="#0f172a">28.6</text>

  <line x1="24" y1="142" x2="24" y2="210" stroke="#16a34a" stroke-width="2.4"/>
  <line x1="24" y1="142" x2="34" y2="142" stroke="#16a34a" stroke-width="2.4"/>
  <line x1="24" y1="210" x2="34" y2="210" stroke="#16a34a" stroke-width="2.4"/>
  <text x="52" y="181" text-anchor="middle" font-size="9.5" fill="#15803d">同</text>
  <text x="52" y="196" text-anchor="middle" font-size="9.5" fill="#15803d">主</text>
  <text x="52" y="211" text-anchor="middle" font-size="9.5" fill="#15803d">键</text>

  <rect x="60" y="312" width="880" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="80" y="338" font-size="12" font-weight="bold" fill="#0f172a">模型公式：</text>
  <text x="176" y="338" font-size="12" fill="#334155">tag-1, …, tag-m, timestamp → field-1, …, field-n</text>
  <text x="80" y="362" font-size="12" fill="#334155">· Tag 列（0~m 个，可空）：建表时用 PRIMARY KEY 指定，参与主键，用来组织相关数据行</text>
  <text x="80" y="384" font-size="12" fill="#334155">· Timestamp 列（恰好 1 个，非空）：用 TIME INDEX 指定；Field 列（0~n 个，可空）保存测量值</text>

  <text x="60" y="432" font-size="12" fill="#64748b">⭐ 相同主键的行属于同一条时间线，会连续存储并按时间戳排序 —— 这让扫描单条时间线的成本更低。</text>
  <text x="60" y="456" font-size="12" fill="#64748b">⚠️ 示例数据形态取自 Greptime 官方博客与官方数据模型文档，用于说明语义，非本机实测。</text>
  <text x="60" y="486" font-size="12" fill="#64748b">建表 SQL：host STRING, region STRING, ts TIMESTAMP TIME INDEX, cpu DOUBLE, memory DOUBLE, PRIMARY KEY (host, region)</text>
  <text x="60" y="516" font-size="12" fill="#64748b">说明：存储中主键与时间索引一起构成排序与合并用的存储键，但不强制唯一性；重复行如何合并由 merge mode 决定。</text>
</svg>
