<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">写入吞吐量级对照：本机实测与官方 TSBS 口径</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">横轴为写入吞吐（rows/s，线性刻度，满量程 900,000）；条形长度只在各自组内可比</text>

  <text x="20" y="102" font-size="13" font-weight="bold" fill="#1e3a8a">A 组 · 本机实测（v1.2.1；单条 INSERT ... SELECT，HTTP；可见 4 核 / 5.79 GiB）</text>
  <rect x="310" y="126" width="148" height="32" rx="4" fill="#2563eb"/>
  <rect x="310" y="174" width="456" height="32" rx="4" fill="#2563eb"/>
  <rect x="310" y="222" width="566" height="32" rx="4" fill="#2563eb"/>
  <rect x="310" y="270" width="560" height="32" rx="4" fill="#2563eb"/>
  <text x="296" y="147" text-anchor="end" font-size="12" fill="#1e3a8a">10,000 行 / 48 ms</text>
  <text x="296" y="195" text-anchor="end" font-size="12" fill="#1e3a8a">100,000 行 / 156 ms</text>
  <text x="296" y="243" text-anchor="end" font-size="12" fill="#1e3a8a">1,000,000 行 / 1256 ms</text>
  <text x="296" y="291" text-anchor="end" font-size="12" fill="#1e3a8a">5,000,000 行 / 6350 ms</text>
  <text x="466" y="147" font-size="12" fill="#1e3a8a">208,333 rows/s</text>
  <text x="774" y="195" font-size="12" fill="#1e3a8a">641,026 rows/s</text>
  <text x="884" y="243" font-size="12" fill="#1e3a8a">796,178 rows/s</text>
  <text x="878" y="291" font-size="12" fill="#1e3a8a">787,402 rows/s</text>

  <text x="20" y="324" font-size="13" font-weight="bold" fill="#7c2d12">B 组 · 官方 TSBS 口径（c5d.2xlarge / 8 vCPU；8 worker；batch 10,000）</text>
  <rect x="310" y="346" width="203" height="32" rx="4" fill="#f59e0b"/>
  <rect x="310" y="394" width="232" height="32" rx="4" fill="#f59e0b"/>
  <text x="296" y="367" text-anchor="end" font-size="12" fill="#7c2d12">4,000 host / 3 天（官方博客 2025 年 12 月）</text>
  <text x="296" y="415" text-anchor="end" font-size="12" fill="#7c2d12">v0.12 发布说明记录</text>
  <text x="521" y="367" font-size="12" fill="#7c2d12">285,301 rows/s</text>
  <text x="550" y="415" font-size="12" fill="#7c2d12">326,839 rows/s</text>

  <path d="M 310 110 L 310 436" fill="none" stroke="#334155" stroke-width="1.6"/>
  <path d="M 523 110 L 523 436" fill="none" stroke="#cbd5e1" stroke-width="1.1"/>
  <path d="M 737 110 L 737 436" fill="none" stroke="#cbd5e1" stroke-width="1.1"/>
  <path d="M 950 110 L 950 436" fill="none" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="310" y="458" text-anchor="middle" font-size="11.5" fill="#475569">0</text>
  <text x="523" y="458" text-anchor="middle" font-size="11.5" fill="#475569">300,000</text>
  <text x="737" y="458" text-anchor="middle" font-size="11.5" fill="#475569">600,000</text>
  <text x="950" y="458" text-anchor="middle" font-size="11.5" fill="#475569">900,000</text>

  <text x="20" y="496" font-size="11.5" fill="#475569">⚠️ A 组与 B 组的硬件、版本、批大小与客户端都不同：跨组只看量级差，不把两组差值当结论。</text>
  <text x="20" y="518" font-size="11.5" fill="#475569">A 组每条 = 行数 ÷ wall 秒数（取自同一轮的配对读数）；对照值出处见本篇第八节与 性能调优与基准测试 篇第六节。</text>
</svg>
