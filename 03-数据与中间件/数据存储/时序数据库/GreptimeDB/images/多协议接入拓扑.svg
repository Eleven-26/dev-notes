<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="wpt-arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">多协议接入拓扑：来源 → 端点 → 同一套存储</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">多数来源不需要专用客户端；写入端点按「信号 × 来源」分别映射</text>

  <rect x="30" y="96" width="250" height="84" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="155" y="128" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">已上 OpenTelemetry</text>
  <text x="155" y="152" text-anchor="middle" font-size="11.5" fill="#1d4ed8">OTel SDK / Collector</text>

  <rect x="30" y="196" width="250" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="155" y="228" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">已有 Prometheus 体系</text>
  <text x="155" y="252" text-anchor="middle" font-size="11.5" fill="#166534">Prometheus / Grafana Alloy</text>

  <rect x="30" y="296" width="250" height="84" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="155" y="328" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c2d12">已有 InfluxDB / OpenTSDB</text>
  <text x="155" y="352" text-anchor="middle" font-size="11.5" fill="#9a3412">Telegraf / InfluxDB 客户端</text>

  <rect x="30" y="396" width="250" height="84" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="155" y="428" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">日志与应用</text>
  <text x="155" y="452" text-anchor="middle" font-size="11.5" fill="#475569">Loki / Vector / SDK / SQL 工具</text>

  <line x1="280" y1="138" x2="320" y2="150" stroke="#334155" stroke-width="1.6" marker-end="url(#wpt-arw)"/>
  <line x1="280" y1="238" x2="320" y2="220" stroke="#334155" stroke-width="1.6" marker-end="url(#wpt-arw)"/>
  <line x1="280" y1="338" x2="320" y2="330" stroke="#334155" stroke-width="1.6" marker-end="url(#wpt-arw)"/>
  <line x1="280" y1="438" x2="320" y2="420" stroke="#334155" stroke-width="1.6" marker-end="url(#wpt-arw)"/>

  <rect x="320" y="96" width="350" height="384" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="495" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">HTTP:4000 写入端点</text>
  <text x="336" y="154" font-size="11.5" fill="#1e3a8a">/v1/otlp/v1/metrics|logs|traces</text>
  <text x="336" y="180" font-size="11.5" fill="#14532d">/v1/prometheus/write</text>
  <text x="336" y="206" font-size="11.5" fill="#9a3412">/v1/influxdb/write</text>
  <text x="336" y="226" font-size="11.5" fill="#9a3412">/v1/influxdb/api/v2/write</text>
  <text x="336" y="252" font-size="11.5" fill="#9a3412">/v1/opentsdb/api/put</text>
  <text x="336" y="278" font-size="11.5" fill="#475569">/v1/loki/api/v1/push</text>
  <line x1="336" y1="298" x2="654" y2="298" stroke="#cbd5e1" stroke-width="1"/>
  <text x="336" y="324" font-size="11.5" fill="#0f172a">gRPC：4001</text>
  <text x="336" y="348" font-size="11.5" fill="#0f172a">MySQL：4002</text>
  <text x="336" y="372" font-size="11.5" fill="#0f172a">PostgreSQL：4003</text>
  <line x1="336" y1="392" x2="654" y2="392" stroke="#cbd5e1" stroke-width="1"/>
  <text x="336" y="416" font-size="11.5" fill="#475569">头部控制：x-greptime-db-name</text>
  <text x="336" y="436" font-size="11.5" fill="#475569">x-greptime-pipeline-name</text>
  <text x="336" y="456" font-size="11.5" fill="#475569">x-greptime-hints: ttl=7d</text>

  <line x1="670" y1="288" x2="710" y2="288" stroke="#334155" stroke-width="1.6" marker-end="url(#wpt-arw)"/>

  <rect x="710" y="96" width="260" height="384" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="840" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">GreptimeDB 引擎</text>
  <text x="726" y="156" font-size="11.5" fill="#1e3a8a">列存 + LSM</text>
  <text x="726" y="180" font-size="11.5" fill="#1e3a8a">统一 Tag / Timestamp / Field</text>
  <line x1="726" y1="200" x2="954" y2="200" stroke="#93c5fd" stroke-width="1"/>
  <text x="726" y="226" font-size="11.5" fill="#1e3a8a">持久层：对象存储</text>
  <text x="734" y="246" font-size="11.5" fill="#1d4ed8">S3 / GCS / Azure Blob</text>
  <line x1="726" y1="266" x2="954" y2="266" stroke="#93c5fd" stroke-width="1"/>
  <text x="726" y="292" font-size="11.5" fill="#1e3a8a">Metric Engine 默认开启</text>
  <text x="726" y="312" font-size="11.5" fill="#1d4ed8">多逻辑表 → 共享物理表</text>
  <text x="734" y="332" font-size="11.5" fill="#1d4ed8">greptime_physical_table</text>
  <line x1="726" y1="352" x2="954" y2="352" stroke="#93c5fd" stroke-width="1"/>
  <text x="726" y="378" font-size="11.5" fill="#1e3a8a">自动建表：写入即建表</text>
  <text x="726" y="398" font-size="11.5" fill="#1d4ed8">SQL / Flink / Spark 除外</text>
  <text x="726" y="424" font-size="11.5" fill="#64748b">V1.2：每 region 独立写缓冲</text>
  <text x="726" y="444" font-size="11.5" fill="#64748b">后续：批处理扩到 HTTP</text>

  <rect x="30" y="508" width="940" height="92" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="46" y="534" font-size="12" fill="#0f172a">⭐ 选路：已上 OTel → OTLP；只有 Prometheus → remote write；只有 InfluxDB → line protocol；自研应用 → gRPC / SQL 协议。</text>
  <text x="46" y="556" font-size="12" fill="#0f172a">⚠️ 同一份指标不要同时走 OTLP 与 remote write：写入会报时间戳类型冲突。</text>
  <text x="46" y="578" font-size="12" fill="#0f172a">⚠️ Loki 仅支持 push 写入（无 LogQL）；开源版 ES 仅支持 _bulk 写入（仅插入）。</text>
</svg>
