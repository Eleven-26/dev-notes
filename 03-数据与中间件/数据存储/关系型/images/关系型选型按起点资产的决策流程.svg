<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">关系型选型：按「起点资产」分派，再按台阶演进</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">先用第二节的五个数把候选砍到两三家，再走 A / B / C 三条决策线；单机扛不住才上第七节的台阶</text>

  <rect x="30" y="76" width="940" height="54" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="45" y="96" font-size="12" font-weight="bold" fill="#0f172a">门：五个数先定下来，比任何功能对照表都有效（2.3：不要为了「专业」引进第二个数据库）</text>
  <rect x="45" y="104" width="172" height="20" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="131" y="118" text-anchor="middle" font-size="10" fill="#1e40af">① 单表行数与总数据量</text>
  <rect x="226" y="104" width="172" height="20" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="312" y="118" text-anchor="middle" font-size="10" fill="#1e40af">② 写入 TPS 与更新删除比</text>
  <rect x="407" y="104" width="172" height="20" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="493" y="118" text-anchor="middle" font-size="10" fill="#1e40af">③ 事务与隔离级别要求</text>
  <rect x="588" y="104" width="172" height="20" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="674" y="118" text-anchor="middle" font-size="10" fill="#1e40af">④ 读写比与查询形态</text>
  <rect x="769" y="104" width="172" height="20" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="855" y="118" text-anchor="middle" font-size="10" fill="#1e40af">⑤ 可用性目标与人力</text>

  <path d="M500,130 V146 H178 V166" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M500,130 V166" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M500,130 V146 H822 V166" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="30" y="170" width="296" height="268" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="352" y="170" width="296" height="268" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="674" y="170" width="296" height="268" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 3"/>

  <rect x="42" y="182" width="272" height="42" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="178" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">A · 已经在用 MySQL</text>
  <text x="178" y="218" text-anchor="middle" font-size="10.5" fill="#1d4ed8">第一动作：先做索引与 SQL 重写</text>

  <rect x="42" y="232" width="272" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="52" y="249" font-size="10" font-weight="bold" fill="#1e3a8a">单表变大、查询变慢</text>
  <text x="52" y="266" font-size="9.5" fill="#1d4ed8">→ 索引与 SQL 重写，别动架构</text>
  <rect x="42" y="282" width="272" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="52" y="299" font-size="10" font-weight="bold" fill="#1e3a8a">读扛不住、写还没事</text>
  <text x="52" y="316" font-size="9.5" fill="#1d4ed8">→ 加缓存 + 读写分离，改动面最小</text>
  <rect x="42" y="332" width="272" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="52" y="349" font-size="10" font-weight="bold" fill="#1e3a8a">单实例容量到顶</text>
  <text x="52" y="366" font-size="9.5" fill="#1d4ed8">→ 垂直拆分；一张表大 → 分片中间件</text>
  <rect x="42" y="382" width="272" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="52" y="399" font-size="10" font-weight="bold" fill="#1e3a8a">没有 DBA，但不想换数据库</text>
  <text x="52" y="416" font-size="9.5" fill="#1d4ed8">→ 同引擎云托管，切换与备份交给平台</text>

  <rect x="364" y="182" width="272" height="42" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="500" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">B · 已经在用 PostgreSQL</text>
  <text x="500" y="218" text-anchor="middle" font-size="10.5" fill="#166534">先榨干单机，再谈换库</text>

  <rect x="364" y="234" width="272" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="374" y="252" font-size="10" font-weight="bold" fill="#14532d">复杂查询、报表或特殊类型变多</text>
  <text x="374" y="270" font-size="9.5" fill="#166534">→ 先榨干单机：并行执行、分区表</text>
  <text x="374" y="286" font-size="9.5" fill="#166534">物化视图与扩展（时序 / 地理 / 向量）</text>
  <rect x="364" y="302" width="272" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="374" y="320" font-size="10" font-weight="bold" fill="#14532d">连接数打满</text>
  <text x="374" y="338" font-size="9.5" fill="#166534">→ 先上连接池 / 池化代理再谈换库</text>
  <text x="374" y="354" font-size="9.5" fill="#166534">这是进程模型决定的，不是参数没调好</text>
  <rect x="364" y="370" width="272" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="374" y="388" font-size="10" font-weight="bold" fill="#14532d">单机写确实到顶</text>
  <text x="374" y="406" font-size="9.5" fill="#166534">→ 分片生态比 MySQL 薄</text>
  <text x="374" y="422" font-size="9.5" fill="#166534">优先兼容 PG 方言的分布式 SQL</text>

  <rect x="686" y="182" width="272" height="42" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
  <text x="822" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">C · 从零开始</text>
  <text x="822" y="218" text-anchor="middle" font-size="10.5" fill="#9a3412">6.3 的三问依次筛</text>

  <rect x="686" y="234" width="272" height="58" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="696" y="252" font-size="10" font-weight="bold" fill="#7c2d12">① 主语言是什么？</text>
  <text x="696" y="270" font-size="9.5" fill="#9a3412">→ Go / PHP：MySQL 族阻力最小</text>
  <text x="696" y="286" font-size="9.5" fill="#9a3412">→ Java：两条路都宽</text>
  <rect x="686" y="302" width="272" height="58" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="696" y="320" font-size="10" font-weight="bold" fill="#7c2d12">② 类型与查询复杂度是主要矛盾？</text>
  <text x="696" y="338" font-size="9.5" fill="#9a3412">是 → PostgreSQL（类型、复杂查询、DDL 进事务）</text>
  <text x="696" y="354" font-size="9.5" fill="#9a3412">否 → MySQL 族</text>
  <rect x="686" y="370" width="272" height="58" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="696" y="388" font-size="10" font-weight="bold" fill="#7c2d12">③ 有没有人能运维数据库？</text>
  <text x="696" y="406" font-size="9.5" fill="#9a3412">没有 → 云托管</text>
  <text x="696" y="422" font-size="9.5" fill="#9a3412">只有两三人 → 单机 + 主从，别自评分布式</text>

  <rect x="30" y="448" width="940" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="45" y="468" font-size="11" font-weight="bold" fill="#0f172a">第七节台阶：单机扛不住时按「新增的运维面」从小到大排，一次只上一级；上一级之前先确认索引与缓存已经穷尽</text>
  <rect x="45" y="478" width="190" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="140" y="494" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">⓪ 索引与 SQL 重写</text>
  <text x="140" y="510" text-anchor="middle" font-size="9.5" fill="#1d4ed8">这一步的损失可逆</text>
  <line x1="237" y1="498" x2="273" y2="498" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="275" y="478" width="190" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="370" y="494" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">① 加缓存 + 读写分离</text>
  <text x="370" y="510" text-anchor="middle" font-size="9.5" fill="#166534">先让缓存拦一层</text>
  <line x1="467" y1="498" x2="503" y2="498" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="505" y="478" width="190" height="40" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="600" y="494" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c2d12">② 垂直拆分 → ③ 分片中间件</text>
  <text x="600" y="510" text-anchor="middle" font-size="9.5" fill="#9a3412">路由 / 全局 ID / 跨片事务</text>
  <line x1="697" y1="498" x2="733" y2="498" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="735" y="478" width="190" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="830" y="494" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">④ 才评估分布式 SQL</text>
  <text x="830" y="510" text-anchor="middle" font-size="9.5" fill="#475569">⑤ 或把运维那块外包给托管</text>

  <rect x="30" y="556" width="940" height="88" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="45" y="578" font-size="11.5" fill="#334155">⭐ 台阶不是越高越好：停在 ① 或 ② 很多年完全正常；③ 与 ④ 会永久损失「一条 SQL 表达一切」的便利，顺序不能反</text>
  <text x="45" y="598" font-size="11.5" fill="#334155">⚠️ 退路按三项评（格式开放性 / SQL 方言兼容度 / 迁移工具与 CDC），演练出的代价才算数</text>
  <text x="45" y="618" font-size="11.5" fill="#334155">⚠️ 从零开始最常见的错：按「以后会长多大」选型，而不是按「现在谁能运维」选型</text>
</svg>
