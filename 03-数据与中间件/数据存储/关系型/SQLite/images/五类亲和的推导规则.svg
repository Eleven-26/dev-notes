<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="372" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">列类型只是提示：先推亲和性，再看亲和性怎么转值</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#64748b">本机实测：往声明的类型里塞「不该塞的」，看它到底存成什么</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect x="24" y="84" width="952" height="32" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">声明</text>
  <text x="234" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">推出的亲和性</text>
  <text x="434" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">插入值</text>
  <text x="634" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">存成（typeof）</text>
  <rect x="24" y="116" width="952" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="137" font-size="11.5" fill="#0f172a">INTEGER</text>
  <text x="234" y="137" font-size="11.5" fill="#1d4ed8" font-weight="bold">INTEGER</text>
  <text x="434" y="137" font-size="11.5" fill="#0f172a">'abc'</text>
  <text x="634" y="137" font-size="11.5" fill="#dc2626" font-weight="bold">text</text>
  <rect x="24" y="148" width="952" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="169" font-size="11.5" fill="#0f172a">TEXT</text>
  <text x="234" y="169" font-size="11.5" fill="#1d4ed8" font-weight="bold">TEXT</text>
  <text x="434" y="169" font-size="11.5" fill="#0f172a">123</text>
  <text x="634" y="169" font-size="11.5" fill="#0f172a">text</text>
  <rect x="24" y="180" width="952" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="201" font-size="11.5" fill="#0f172a">REAL</text>
  <text x="234" y="201" font-size="11.5" fill="#1d4ed8" font-weight="bold">REAL</text>
  <text x="434" y="201" font-size="11.5" fill="#0f172a">'xyz'</text>
  <text x="634" y="201" font-size="11.5" fill="#dc2626" font-weight="bold">text</text>
  <rect x="24" y="212" width="952" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="233" font-size="11.5" fill="#0f172a">NUMERIC</text>
  <text x="234" y="233" font-size="11.5" fill="#1d4ed8" font-weight="bold">NUMERIC</text>
  <text x="434" y="233" font-size="11.5" fill="#0f172a">'1.5'</text>
  <text x="634" y="233" font-size="11.5" fill="#047857" font-weight="bold">real</text>
  <rect x="24" y="244" width="952" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="265" font-size="11.5" fill="#0f172a">BLOB / 无类型</text>
  <text x="234" y="265" font-size="11.5" fill="#1d4ed8" font-weight="bold">BLOB</text>
  <text x="434" y="265" font-size="11.5" fill="#0f172a">9</text>
  <text x="634" y="265" font-size="11.5" fill="#0f172a">integer</text>
  <rect x="24" y="276" width="952" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="297" font-size="11.5" fill="#0f172a">INTEGER</text>
  <text x="234" y="297" font-size="11.5" fill="#1d4ed8" font-weight="bold">INTEGER</text>
  <text x="434" y="297" font-size="11.5" fill="#0f172a">1.0</text>
  <text x="634" y="297" font-size="11.5" fill="#b45309" font-weight="bold">integer</text>
  <text x="24" y="332" font-size="11.5" fill="#b45309">⚠️ 最后一行最坑：整数亲和性把 1.0 存成整数 1，于是 SELECT ... WHERE a = '1.0' 查不到、a = 1 能查到。REAL 列想存 1.0 必须写 1.0 且列亲和性不是 INTEGER。</text>
</svg>
