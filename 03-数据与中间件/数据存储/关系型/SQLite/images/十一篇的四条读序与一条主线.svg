<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 443" width="1000" height="443" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="443" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">SQLite 册：一条主线、四条读序、十一篇</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#64748b">主线是「一个进程如何在一个文件上安全地读写」，其余十篇都挂在这条主线的不同位置上</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect x="24" y="76" width="306" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="76" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="36" y="98" font-size="12" font-weight="bold" fill="#0f172a">主线 存储引擎本体</text>
  <rect x="34" y="118" width="286" height="22" rx="4" fill="#eef2ff"/>
  <text x="40" y="134" font-size="11.5" fill="#1d4ed8">架构与执行链路</text>
  <rect x="34" y="144" width="286" height="22" rx="4" fill="#eef2ff"/>
  <text x="40" y="160" font-size="11.5" fill="#1d4ed8">文件格式与页结构</text>
  <text x="36" y="186" font-size="11.5" fill="#64748b">① 从 SQL 到字节码，再到页</text>
  <rect x="346" y="76" width="306" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="346" y="76" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="358" y="98" font-size="12" font-weight="bold" fill="#0f172a">并发 同一文件上的多读者</text>
  <rect x="356" y="118" width="286" height="22" rx="4" fill="#f5f3ff"/>
  <text x="362" y="134" font-size="11.5" fill="#7c3aed">事务与并发控制</text>
  <rect x="356" y="144" width="286" height="22" rx="4" fill="#f5f3ff"/>
  <text x="362" y="160" font-size="11.5" fill="#7c3aed">WAL 模式与检查点</text>
  <text x="358" y="186" font-size="11.5" fill="#64748b">② 锁、快照与 BUSY</text>
  <rect x="668" y="76" width="306" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="668" y="76" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="680" y="98" font-size="12" font-weight="bold" fill="#0f172a">取数 怎么让它走对路</text>
  <rect x="678" y="118" width="286" height="22" rx="4" fill="#ecfdf5"/>
  <text x="684" y="134" font-size="11.5" fill="#047857">索引与查询计划</text>
  <rect x="678" y="144" width="286" height="22" rx="4" fill="#ecfdf5"/>
  <text x="684" y="160" font-size="11.5" fill="#047857">类型系统与数据建模</text>
  <text x="680" y="186" font-size="11.5" fill="#64748b">③ 计划与数据类型</text>
  <rect x="24" y="242" width="306" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="242" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="36" y="264" font-size="12" font-weight="bold" fill="#0f172a">使用 上线前后要调的</text>
  <rect x="34" y="284" width="286" height="22" rx="4" fill="#fffbeb"/>
  <text x="40" y="300" font-size="11.5" fill="#b45309">PRAGMA 与调优</text>
  <rect x="34" y="310" width="286" height="22" rx="4" fill="#fffbeb"/>
  <text x="40" y="326" font-size="11.5" fill="#b45309">备份恢复与迁移</text>
  <rect x="34" y="336" width="286" height="22" rx="4" fill="#fffbeb"/>
  <text x="40" y="352" font-size="11.5" fill="#b45309">观测与诊断</text>
  <text x="36" y="378" font-size="11.5" fill="#64748b">④ 参数、备份、排障</text>
  <rect x="346" y="242" width="306" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="346" y="242" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="358" y="264" font-size="12" font-weight="bold" fill="#0f172a">扩展 不止 B 树</text>
  <rect x="356" y="284" width="286" height="22" rx="4" fill="#ecfeff"/>
  <text x="362" y="300" font-size="11.5" fill="#0e7490">扩展能力与虚拟表</text>
  <text x="358" y="326" font-size="11.5" fill="#64748b">FTS5 / JSON / R*Tree</text>
  <rect x="668" y="242" width="306" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="668" y="242" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="680" y="264" font-size="12" font-weight="bold" fill="#0f172a">边界 什么时候不该用它</text>
  <rect x="678" y="284" width="286" height="22" rx="4" fill="#fef2f2"/>
  <text x="684" y="300" font-size="11.5" fill="#dc2626">应用场景</text>
  <text x="680" y="326" font-size="11.5" fill="#64748b">八个落点与「一个写者」判据</text>
  <text x="24" y="414" font-size="11.5" fill="#b45309">⚠️ 四条读序不是难度顺序：① 是其余三条的前置，③ 只在数据量与查询确定后才有意义，④ 可以倒着读（先看排障现场再回去看机制）。</text>
</svg>
