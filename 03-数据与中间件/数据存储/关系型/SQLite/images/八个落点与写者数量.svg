<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 453" width="1000" height="453" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="453" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">八个落点，按「同时有几个写者」排开</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#64748b">SQLite 的适用边界不是数据量，是有几个进程同时在写同一个文件</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect x="24" y="76" width="306" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="76" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="36" y="98" font-size="12" font-weight="bold" fill="#0f172a">01 移动端 App</text>
  <rect x="34" y="118" width="286" height="22" rx="4" fill="#eef2ff"/>
  <text x="40" y="134" font-size="11.5" fill="#1d4ed8">Android / iOS 本地库</text>
  <text x="36" y="160" font-size="11.5" fill="#64748b">单写者，随应用生命周期</text>
  <rect x="346" y="76" width="306" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="346" y="76" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="358" y="98" font-size="12" font-weight="bold" fill="#0f172a">02 桌面应用</text>
  <rect x="356" y="118" width="286" height="22" rx="4" fill="#eef2ff"/>
  <text x="362" y="134" font-size="11.5" fill="#1d4ed8">浏览器、设计工具、笔记</text>
  <text x="358" y="160" font-size="11.5" fill="#64748b">单进程内多线程</text>
  <rect x="668" y="76" width="306" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="668" y="76" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="680" y="98" font-size="12" font-weight="bold" fill="#0f172a">03 嵌入式与 IoT</text>
  <rect x="678" y="118" width="286" height="22" rx="4" fill="#eef2ff"/>
  <text x="684" y="134" font-size="11.5" fill="#1d4ed8">设备端配置与遥测缓存</text>
  <text x="680" y="160" font-size="11.5" fill="#64748b">单写者，断电要能恢复</text>
  <rect x="24" y="190" width="306" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="190" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="36" y="212" font-size="12" font-weight="bold" fill="#0f172a">04 命令行与分析脚本</text>
  <rect x="34" y="232" width="286" height="22" rx="4" fill="#ecfdf5"/>
  <text x="40" y="248" font-size="11.5" fill="#047857">本地数据集切片</text>
  <text x="36" y="274" font-size="11.5" fill="#64748b">单进程串行</text>
  <rect x="346" y="190" width="306" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="346" y="190" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="358" y="212" font-size="12" font-weight="bold" fill="#0f172a">05 测试与 CI</text>
  <rect x="356" y="232" width="286" height="22" rx="4" fill="#ecfdf5"/>
  <text x="362" y="248" font-size="11.5" fill="#047857">替掉真库，零运维</text>
  <text x="358" y="274" font-size="11.5" fill="#64748b">每用例一个文件</text>
  <rect x="668" y="190" width="306" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="668" y="190" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="680" y="212" font-size="12" font-weight="bold" fill="#0f172a">06 边缘与离线优先</text>
  <rect x="678" y="232" width="286" height="22" rx="4" fill="#f5f3ff"/>
  <text x="684" y="248" font-size="11.5" fill="#7c3aed">本地先写，后台同步</text>
  <text x="680" y="274" font-size="11.5" fill="#64748b">单写者 + 上行推送</text>
  <rect x="24" y="304" width="306" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="304" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="36" y="326" font-size="12" font-weight="bold" fill="#0f172a">07 缓存与本地队列</text>
  <rect x="34" y="346" width="286" height="22" rx="4" fill="#fffbeb"/>
  <text x="40" y="362" font-size="11.5" fill="#b45309">待办、草稿、重试队列</text>
  <text x="36" y="388" font-size="11.5" fill="#64748b">单写者，读多写少</text>
  <rect x="346" y="304" width="306" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="346" y="304" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="358" y="326" font-size="12" font-weight="bold" fill="#0f172a">08 服务端小站</text>
  <rect x="356" y="346" width="286" height="22" rx="4" fill="#fef2f2"/>
  <text x="362" y="362" font-size="11.5" fill="#dc2626">单机低并发 API</text>
  <text x="358" y="388" font-size="11.5" fill="#64748b">多进程则进入红区</text>
  <text x="24" y="424" font-size="11.5" fill="#b45309">⚠️ 01~07 的「单写者」是结构保证；08 一旦开了多进程或多副本，写就成了整库级排队，这不是调参能解决的。</text>
</svg>
