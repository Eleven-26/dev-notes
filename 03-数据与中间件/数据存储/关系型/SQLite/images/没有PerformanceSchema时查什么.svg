<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="340" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">它没有 Performance Schema，只有五类就地取证</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#64748b">服务端数据库靠插桩表，进程内数据库靠调用方自己量</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect x="24" y="84" width="952" height="32" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">想知道</text>
  <text x="294" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">用什么</text>
  <text x="634" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">本机可复现</text>
  <rect x="24" y="116" width="952" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="137" font-size="11.5" fill="#0f172a">这条 SQL 走了什么路</text>
  <text x="294" y="137" font-size="11.5" fill="#0f172a">EXPLAIN QUERY PLAN</text>
  <text x="634" y="137" font-size="11.5" fill="#047857" font-weight="bold">五类输出，见索引篇</text>
  <rect x="24" y="148" width="952" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="169" font-size="11.5" fill="#0f172a">编译出了什么</text>
  <text x="294" y="169" font-size="11.5" fill="#0f172a">EXPLAIN（返回 opcode）</text>
  <text x="634" y="169" font-size="11.5" fill="#0f172a">5~38 条不等</text>
  <rect x="24" y="180" width="952" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="201" font-size="11.5" fill="#0f172a">库有没有坏</text>
  <text x="294" y="201" font-size="11.5" fill="#0f172a">PRAGMA integrity_check / quick_check</text>
  <text x="634" y="201" font-size="11.5" fill="#047857" font-weight="bold">返回 ok</text>
  <rect x="24" y="212" width="952" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="233" font-size="11.5" fill="#0f172a">空间被谁占了</text>
  <text x="294" y="233" font-size="11.5" fill="#0f172a">dbstat 虚拟表</text>
  <text x="634" y="233" font-size="11.5" fill="#0f172a">2159 页逐个归属</text>
  <rect x="24" y="244" width="952" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="265" font-size="11.5" fill="#0f172a">为什么报错</text>
  <text x="294" y="265" font-size="11.5" fill="#0f172a">返回码 + sqlite3_errmsg</text>
  <text x="634" y="265" font-size="11.5" fill="#b45309" font-weight="bold">5 / 517 / 3091 各有含义</text>
  <text x="24" y="300" font-size="11.5" fill="#b45309">⭐ 进程内数据库的「监控」天然属于应用：没有服务端计数器可抓，只能在自己的代码里计时、计数、打点。</text>
</svg>
