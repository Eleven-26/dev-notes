<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 316" width="1000" height="316" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="316" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">PRAGMA 不是「参数」，它分四类，生效范围完全不同</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#64748b">搞错分类是调优最常见的错：把连接级当成全局，或把持久级当成临时</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect x="24" y="84" width="952" height="32" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">类别</text>
  <text x="234" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">典型</text>
  <text x="634" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">作用范围</text>
  <text x="814" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">何时生效</text>
  <rect x="24" y="116" width="952" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="137" font-size="11.5" fill="#dc2626" font-weight="bold">持久（写进库头）</text>
  <text x="234" y="137" font-size="11.5" fill="#0f172a">journal_mode / page_size / auto_vacuum</text>
  <text x="634" y="137" font-size="11.5" fill="#0f172a">跟着文件走</text>
  <text x="814" y="137" font-size="11.5" fill="#0f172a">切换后一直有效</text>
  <rect x="24" y="148" width="952" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="169" font-size="11.5" fill="#b45309" font-weight="bold">连接级</text>
  <text x="234" y="169" font-size="11.5" fill="#0f172a">cache_size / mmap_size / busy_timeout / foreign_keys</text>
  <text x="634" y="169" font-size="11.5" fill="#0f172a">只影响当前连接</text>
  <text x="814" y="169" font-size="11.5" fill="#0f172a">连接关闭即失效</text>
  <rect x="24" y="180" width="952" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="201" font-size="11.5" fill="#1d4ed8" font-weight="bold">查询级/一次性</text>
  <text x="234" y="201" font-size="11.5" fill="#0f172a">optimize / wal_checkpoint / integrity_check</text>
  <text x="634" y="201" font-size="11.5" fill="#0f172a">执行一次</text>
  <text x="814" y="201" font-size="11.5" fill="#0f172a">立即</text>
  <rect x="24" y="212" width="952" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="233" font-size="11.5" fill="#047857" font-weight="bold">危险</text>
  <text x="234" y="233" font-size="11.5" fill="#0f172a">synchronous=OFF / writable_schema / ignore_check_constraints</text>
  <text x="634" y="233" font-size="11.5" fill="#0f172a">当前连接</text>
  <text x="814" y="233" font-size="11.5" fill="#0f172a">立即，且后果不可逆</text>
  <text x="24" y="268" font-size="11.5" fill="#b45309">⭐ 本机读数：cache_size 默认 −2000（负数表示 KiB，即约 2 MB）；mmap_size 默认 0；page_size 默认 4096 —— 前两个是连接级，第三个建库后基本改不动。</text>
</svg>
