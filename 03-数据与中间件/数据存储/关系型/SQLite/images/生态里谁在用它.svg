<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 425" width="1000" height="425" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="425" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">它不是一个「小数据库」，是很多产品的存储层</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#64748b">这些落点的共同点：数据天然属于一个文件、一个进程</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect x="24" y="84" width="952" height="32" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">场景</text>
  <text x="234" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">典型用法</text>
  <text x="654" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">为什么是它</text>
  <rect x="24" y="116" width="952" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="137" font-size="11.5" fill="#0f172a" font-weight="bold">浏览器与客户端</text>
  <text x="234" y="137" font-size="11.5" fill="#0f172a">书签、历史、Cookie、扩展数据</text>
  <text x="654" y="137" font-size="11.5" fill="#0f172a">随应用分发，无需装服务</text>
  <rect x="24" y="148" width="952" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="169" font-size="11.5" fill="#0f172a" font-weight="bold">桌面软件</text>
  <text x="234" y="169" font-size="11.5" fill="#0f172a">工程文件、索引、草稿与撤销栈</text>
  <text x="654" y="169" font-size="11.5" fill="#0f172a">单文件可拷贝、可备份</text>
  <rect x="24" y="180" width="952" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="201" font-size="11.5" fill="#0f172a" font-weight="bold">移动 App</text>
  <text x="234" y="201" font-size="11.5" fill="#0f172a">本地业务库、离线队列</text>
  <text x="654" y="201" font-size="11.5" fill="#0f172a">系统自带，包体零增加</text>
  <rect x="24" y="212" width="952" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="233" font-size="11.5" fill="#0f172a" font-weight="bold">开发工具</text>
  <text x="234" y="233" font-size="11.5" fill="#0f172a">符号索引、构建缓存、测试夹具</text>
  <text x="654" y="233" font-size="11.5" fill="#0f172a">事务 + SQL，比自造格式省事</text>
  <rect x="24" y="244" width="952" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="265" font-size="11.5" fill="#0f172a" font-weight="bold">边缘与 IoT</text>
  <text x="234" y="265" font-size="11.5" fill="#0f172a">配置、遥测缓冲、断网续传</text>
  <text x="654" y="265" font-size="11.5" fill="#0f172a">断电恢复靠 journal</text>
  <rect x="24" y="276" width="952" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="297" font-size="11.5" fill="#0f172a" font-weight="bold">数据分析脚本</text>
  <text x="234" y="297" font-size="11.5" fill="#0f172a">把 CSV 灌进来做多轮 SQL</text>
  <text x="654" y="297" font-size="11.5" fill="#0f172a">比 pandas 省内存，比起库轻</text>
  <rect x="24" y="308" width="952" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="329" font-size="11.5" fill="#0f172a" font-weight="bold">测试替身</text>
  <text x="234" y="329" font-size="11.5" fill="#0f172a">CI 里替代 MySQL / PG</text>
  <text x="654" y="329" font-size="11.5" fill="#0f172a">每个用例一个临时文件</text>
  <rect x="24" y="340" width="952" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="361" font-size="11.5" fill="#0f172a" font-weight="bold">服务端小站</text>
  <text x="234" y="361" font-size="11.5" fill="#0f172a">单机 API 的持久层</text>
  <text x="654" y="361" font-size="11.5" fill="#0f172a">只有单写者时才成立</text>
  <text x="24" y="396" font-size="11.5" fill="#b45309">⭐ 上表没有一行的理由是「它比 MySQL 快」。选它的理由是部署形态，不是性能。</text>
</svg>
