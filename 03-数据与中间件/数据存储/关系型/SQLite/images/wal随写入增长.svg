<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 333" width="1000" height="333" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="333" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">autocheckpoint 关掉后，-wal 一路涨、主库一直是 4 KiB</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#64748b">本机实测：每轮 2 万行，主库 db 文件恒为 4096 字节</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <line x1="80" y1="156" x2="920" y2="156" stroke="#64748b" stroke-width="2"/>
  <line x1="80" y1="161" x2="80" y2="176" stroke="#64748b" stroke-width="2"/>
  <circle cx="80" cy="156" r="5" fill="#1d4ed8"/>
  <rect x="2" y="90" width="156" height="40" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">474 KB</text>
  <text x="80" y="124" text-anchor="middle" font-size="11" fill="#64748b">2 万行</text>
  <rect x="2" y="176" width="156" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="80" y="193" text-anchor="middle" font-size="10.5" fill="#0f172a">2 万行</text>
  <line x1="290" y1="161" x2="290" y2="176" stroke="#64748b" stroke-width="2"/>
  <circle cx="290" cy="156" r="5" fill="#1d4ed8"/>
  <rect x="212" y="90" width="156" height="40" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="290" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">944 KB</text>
  <text x="290" y="124" text-anchor="middle" font-size="11" fill="#64748b">4 万行</text>
  <rect x="212" y="176" width="156" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="290" y="193" text-anchor="middle" font-size="10.5" fill="#0f172a">4 万行</text>
  <line x1="500" y1="161" x2="500" y2="176" stroke="#64748b" stroke-width="2"/>
  <circle cx="500" cy="156" r="5" fill="#7c3aed"/>
  <rect x="422" y="90" width="156" height="40" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="500" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c3aed">1.41 MB</text>
  <text x="500" y="124" text-anchor="middle" font-size="11" fill="#64748b">6 万行</text>
  <rect x="422" y="176" width="156" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="500" y="193" text-anchor="middle" font-size="10.5" fill="#0f172a">6 万行</text>
  <line x1="710" y1="161" x2="710" y2="176" stroke="#64748b" stroke-width="2"/>
  <circle cx="710" cy="156" r="5" fill="#7c3aed"/>
  <rect x="632" y="90" width="156" height="40" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="710" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c3aed">1.88 MB</text>
  <text x="710" y="124" text-anchor="middle" font-size="11" fill="#64748b">8 万行</text>
  <rect x="632" y="176" width="156" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="710" y="193" text-anchor="middle" font-size="10.5" fill="#0f172a">8 万行</text>
  <line x1="920" y1="161" x2="920" y2="176" stroke="#64748b" stroke-width="2"/>
  <circle cx="920" cy="156" r="5" fill="#dc2626"/>
  <rect x="842" y="90" width="156" height="40" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="920" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#dc2626">2.36 MB</text>
  <text x="920" y="124" text-anchor="middle" font-size="11" fill="#64748b">10 万行</text>
  <rect x="842" y="176" width="156" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="920" y="193" text-anchor="middle" font-size="10.5" fill="#0f172a">10 万行</text>
  <text x="60" y="304" font-size="11.5" fill="#b45309">⭐ 默认 wal_autocheckpoint=1000 页（约 4 MB）会自动触发 PASSIVE；把它设成 0 就会出现上图这种「主库不动、wal 一直涨」的形态 —— 长跑进程要盯着 -wal 的大小。</text>
</svg>
