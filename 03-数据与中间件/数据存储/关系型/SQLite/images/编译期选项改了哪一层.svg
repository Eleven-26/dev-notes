<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="372" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">编译期选项改的是「哪一层存在」</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#64748b">本机驱动 modernc.org/sqlite 内嵌 SQLite 3.54.1，编译选项 57 条，下面是最影响行为的六条</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect x="24" y="84" width="952" height="32" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">选项</text>
  <text x="284" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">本机值</text>
  <text x="434" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">改了什么</text>
  <rect x="24" y="116" width="952" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="137" font-size="11.5" fill="#0f172a">THREADSAFE</text>
  <text x="284" y="137" font-size="11.5" fill="#047857" font-weight="bold">1</text>
  <text x="434" y="137" font-size="11.5" fill="#0f172a">1 = 串行化模式，一条连接可跨线程（靠互斥锁）</text>
  <rect x="24" y="148" width="952" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="169" font-size="11.5" fill="#0f172a">DEFAULT_PAGE_SIZE</text>
  <text x="284" y="169" font-size="11.5" fill="#0f172a" font-weight="bold">4096</text>
  <text x="434" y="169" font-size="11.5" fill="#0f172a">新库的页大小；建库后不可改，只能 VACUUM 重建</text>
  <rect x="24" y="180" width="952" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="201" font-size="11.5" fill="#0f172a">MAX_VARIABLE_NUMBER</text>
  <text x="284" y="201" font-size="11.5" fill="#0f172a" font-weight="bold">32766</text>
  <text x="434" y="201" font-size="11.5" fill="#0f172a">一条 SQL 里最多几个绑定参数（3.32 前是 999）</text>
  <rect x="24" y="212" width="952" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="233" font-size="11.5" fill="#0f172a">ENABLE_FTS5</text>
  <text x="284" y="233" font-size="11.5" fill="#047857" font-weight="bold">已开</text>
  <text x="434" y="233" font-size="11.5" fill="#0f172a">全文检索虚拟表在不在，不在就连 CREATE 都报错</text>
  <rect x="24" y="244" width="952" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="265" font-size="11.5" fill="#0f172a">ENABLE_DBSTAT_VTAB</text>
  <text x="284" y="265" font-size="11.5" fill="#047857" font-weight="bold">已开</text>
  <text x="434" y="265" font-size="11.5" fill="#0f172a">dbstat 虚拟表，看每页被谁占用</text>
  <rect x="24" y="276" width="952" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="297" font-size="11.5" fill="#0f172a">ENABLE_RTREE</text>
  <text x="284" y="297" font-size="11.5" fill="#047857" font-weight="bold">已开</text>
  <text x="434" y="297" font-size="11.5" fill="#0f172a">R*Tree 空间索引虚拟表</text>
  <text x="24" y="332" font-size="11.5" fill="#b45309">⚠️ 这六条不是「配置项」，是编译期就定死的。Go 的纯 Go 驱动与 cgo 驱动、以及不同发行版的系统库，这六条可能不一样。</text>
</svg>
