<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 523" width="1000" height="523" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="523" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">调优顺序：先改写法，再改 PRAGMA，最后才碰 synchronous</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#64748b">前两步的收益是数量级，最后一步是常数</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect x="24" y="78" width="640" height="54" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <rect x="24" y="78" width="150" height="54" rx="8" fill="#047857" fill-opacity="0.10"/>
  <text x="38" y="100" font-size="12" font-weight="bold" fill="#047857">先批量化</text>
  <text x="38" y="120" font-size="11" fill="#64748b">step 1</text>
  <text x="190" y="110" font-size="12.5" fill="#0f172a">把 N 次自动提交合成一次事务（本机 278~484 倍）</text>
  <text x="684" y="102" font-size="11.5" fill="#047857">数量级</text>
  <text x="684" y="122" font-size="11" fill="#64748b">先做</text>
  <line x1="344" y1="132" x2="344" y2="152" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <rect x="24" y="158" width="640" height="54" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <rect x="24" y="158" width="150" height="54" rx="8" fill="#047857" fill-opacity="0.10"/>
  <text x="38" y="180" font-size="12" font-weight="bold" fill="#047857">再建索引</text>
  <text x="38" y="200" font-size="11" fill="#64748b">step 2</text>
  <text x="190" y="190" font-size="12.5" fill="#0f172a">用 EQP 确认 SEARCH 而不是 SCAN（本机 611 倍）</text>
  <text x="684" y="182" font-size="11.5" fill="#047857">数量级</text>
  <text x="684" y="202" font-size="11" fill="#64748b">先做</text>
  <line x1="344" y1="212" x2="344" y2="232" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <rect x="24" y="238" width="640" height="54" rx="8" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <rect x="24" y="238" width="150" height="54" rx="8" fill="#1d4ed8" fill-opacity="0.10"/>
  <text x="38" y="260" font-size="12" font-weight="bold" fill="#1d4ed8">再调 cache</text>
  <text x="38" y="280" font-size="11" fill="#64748b">step 3</text>
  <text x="190" y="270" font-size="12.5" fill="#0f172a">cache_size / mmap_size，只影响热集反复访问</text>
  <text x="684" y="262" font-size="11.5" fill="#1d4ed8">百分比</text>
  <text x="684" y="282" font-size="11" fill="#64748b">再看</text>
  <line x1="344" y1="292" x2="344" y2="312" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <rect x="24" y="318" width="640" height="54" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <rect x="24" y="318" width="150" height="54" rx="8" fill="#b45309" fill-opacity="0.10"/>
  <text x="38" y="340" font-size="12" font-weight="bold" fill="#b45309">最后 synchronous</text>
  <text x="38" y="360" font-size="11" fill="#64748b">step 4</text>
  <text x="190" y="350" font-size="12.5" fill="#0f172a">NORMAL 已足够；OFF 只在可重建的数据上</text>
  <text x="684" y="342" font-size="11.5" fill="#b45309">常数</text>
  <text x="684" y="362" font-size="11" fill="#64748b">慎用</text>
  <line x1="344" y1="372" x2="344" y2="392" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <rect x="24" y="398" width="640" height="54" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="24" y="398" width="150" height="54" rx="8" fill="#7c3aed" fill-opacity="0.10"/>
  <text x="38" y="420" font-size="12" font-weight="bold" fill="#7c3aed">收尾 optimize</text>
  <text x="38" y="440" font-size="11" fill="#64748b">step 5</text>
  <text x="190" y="430" font-size="12.5" fill="#0f172a">关闭连接前跑一次 PRAGMA optimize</text>
  <text x="684" y="422" font-size="11.5" fill="#7c3aed">统计信息</text>
  <text x="684" y="442" font-size="11" fill="#64748b">长期</text>
  <text x="24" y="494" font-size="11.5" fill="#b45309">⚠️ 反过来做（先关 synchronous）能立刻看到变快，但那只掩盖了「一次事务一行」这个真问题，而且掉电即丢数据。</text>
</svg>
