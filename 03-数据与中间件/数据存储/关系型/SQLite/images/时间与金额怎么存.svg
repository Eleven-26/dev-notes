<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 339" width="1000" height="339" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="339" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">三个没有原生类型的东西：时间、金额、布尔</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#64748b">SQLite 没有 DATE / DECIMAL / BOOL 类型，只有三种存法可选</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect x="24" y="76" width="306" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="76" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="36" y="98" font-size="12" font-weight="bold" fill="#0f172a">A 时间存 TEXT</text>
  <rect x="34" y="118" width="286" height="22" rx="4" fill="#eef2ff"/>
  <text x="40" y="134" font-size="11.5" fill="#1d4ed8">ISO-8601 字符串</text>
  <text x="36" y="160" font-size="11.5" fill="#64748b">可读、可比较、可排序</text>
  <rect x="346" y="76" width="306" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="346" y="76" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="358" y="98" font-size="12" font-weight="bold" fill="#0f172a">B 时间存 INTEGER</text>
  <rect x="356" y="118" width="286" height="22" rx="4" fill="#eef2ff"/>
  <text x="362" y="134" font-size="11.5" fill="#1d4ed8">Unix 秒 / 毫秒</text>
  <text x="358" y="160" font-size="11.5" fill="#64748b">省空间、时区明确</text>
  <rect x="668" y="76" width="306" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="668" y="76" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="680" y="98" font-size="12" font-weight="bold" fill="#0f172a">C 时间存 REAL</text>
  <rect x="678" y="118" width="286" height="22" rx="4" fill="#f5f3ff"/>
  <text x="684" y="134" font-size="11.5" fill="#7c3aed">Julian day</text>
  <text x="680" y="160" font-size="11.5" fill="#64748b">SQLite 日期函数的原生形态</text>
  <rect x="24" y="190" width="306" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="190" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="36" y="212" font-size="12" font-weight="bold" fill="#0f172a">D 金额</text>
  <rect x="34" y="232" width="286" height="22" rx="4" fill="#ecfdf5"/>
  <text x="40" y="248" font-size="11.5" fill="#047857">一律存整数分</text>
  <text x="36" y="274" font-size="11.5" fill="#64748b">绝不存 REAL</text>
  <rect x="346" y="190" width="306" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="346" y="190" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="358" y="212" font-size="12" font-weight="bold" fill="#0f172a">E 布尔</text>
  <rect x="356" y="232" width="286" height="22" rx="4" fill="#fffbeb"/>
  <text x="362" y="248" font-size="11.5" fill="#b45309">存 INTEGER 0/1</text>
  <text x="358" y="274" font-size="11.5" fill="#64748b">没有 BOOL 类型</text>
  <text x="24" y="310" font-size="11.5" fill="#b45309">⚠️ 金额存 REAL 是最常见的错：0.1 + 0.2 在 REAL 下不等于 0.3，累加后对账必错。存分（整数）或存 TEXT 定点。</text>
</svg>
