<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">边界在哪：写者数量决定它是正解还是错配</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#64748b">同一条判据，沿着并发形态往上走，结论会翻转</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect x="24" y="76" width="952" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <rect x="24" y="76" width="188" height="56" rx="8" fill="#047857" fill-opacity="0.10"/>
  <text x="40" y="100" font-size="13" font-weight="bold" fill="#047857">一个进程内</text>
  <text x="232" y="100" font-size="12.5" fill="#0f172a">多个 goroutine / 线程共用一条连接或一个池</text>
  <text x="232" y="120" font-size="11.5" fill="#64748b">SQLite 内部串行化（THREADSAFE=1），写仍然整库排队</text>
  <rect x="24" y="142" width="952" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <rect x="24" y="142" width="188" height="56" rx="8" fill="#047857" fill-opacity="0.10"/>
  <text x="40" y="166" font-size="13" font-weight="bold" fill="#047857">一个进程 + 一个只读进程</text>
  <text x="232" y="166" font-size="12.5" fill="#0f172a">WAL 模式下读不阻塞写，写不阻塞读</text>
  <text x="232" y="186" font-size="11.5" fill="#64748b">但要保证两个进程在同一台机器、同一个文件系统</text>
  <rect x="24" y="208" width="952" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <rect x="24" y="208" width="188" height="56" rx="8" fill="#b45309" fill-opacity="0.10"/>
  <text x="40" y="232" font-size="13" font-weight="bold" fill="#b45309">多个进程都要写</text>
  <text x="232" y="232" font-size="12.5" fill="#0f172a">BUSY 变成常态，busy_timeout 只是等待不是解决</text>
  <text x="232" y="252" font-size="11.5" fill="#64748b">写吞吐被压成单线程，且随进程数下降</text>
  <rect x="24" y="274" width="952" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="24" y="274" width="188" height="56" rx="8" fill="#dc2626" fill-opacity="0.10"/>
  <text x="40" y="298" font-size="13" font-weight="bold" fill="#dc2626">多台机器 / 多副本</text>
  <text x="232" y="298" font-size="12.5" fill="#0f172a">文件锁跨网络文件系统不可靠，SQLite 明确不建议</text>
  <text x="232" y="318" font-size="11.5" fill="#64748b">这一层只能换引擎或加外部方案（rqlite / LiteFS / 服务端库）</text>
  <text x="24" y="362" font-size="11.5" fill="#b45309">⭐ 判据只有一句话：写者能不能收敛到一个进程。能，SQLite 是正解；不能，别用调参加班。</text>
</svg>
