<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 288" width="1000" height="288" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="288" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">synchronous 的代价，取决于一次事务装多少行</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#64748b">本机实测：每行一事务 vs 500 行一事务，同样的 500 行</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect x="24" y="84" width="952" height="32" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">档位</text>
  <text x="254" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">每行一事务</text>
  <text x="494" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">500 行一事务</text>
  <text x="734" y="105" font-size="11.5" font-weight="bold" fill="#0f172a">倍数</text>
  <rect x="24" y="116" width="952" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="137" font-size="11.5" fill="#dc2626" font-weight="bold">OFF</text>
  <text x="254" y="137" font-size="11.5" fill="#0f172a">1 359.0 ms</text>
  <text x="494" y="137" font-size="11.5" fill="#0f172a">4.88 ms</text>
  <text x="734" y="137" font-size="11.5" fill="#b45309" font-weight="bold">278.6×</text>
  <rect x="24" y="148" width="952" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="169" font-size="11.5" fill="#0f172a" font-weight="bold">NORMAL（默认）</text>
  <text x="254" y="169" font-size="11.5" fill="#0f172a">2 922.2 ms</text>
  <text x="494" y="169" font-size="11.5" fill="#0f172a">6.04 ms</text>
  <text x="734" y="169" font-size="11.5" fill="#b45309" font-weight="bold">483.9×</text>
  <rect x="24" y="180" width="952" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="34" y="201" font-size="11.5" fill="#0f172a" font-weight="bold">FULL</text>
  <text x="254" y="201" font-size="11.5" fill="#0f172a">3 270.7 ms</text>
  <text x="494" y="201" font-size="11.5" fill="#0f172a">7.53 ms</text>
  <text x="734" y="201" font-size="11.5" fill="#b45309" font-weight="bold">434.6×</text>
  <text x="24" y="236" font-size="11.5" fill="#b45309">⭐ 该读的是「同一档位跨行数」：OFF→FULL 在每行一事务下差 2.4 倍，批量事务下只差 1.54 倍。</text>
</svg>
