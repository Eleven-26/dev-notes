<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 431" width="1000" height="431" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="431" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">5 万行短文：MATCH 比 LIKE 快 11.2 倍</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#64748b">本机实测：同样命中 12 500 行，差距来自「扫全表」与「查倒排」</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect x="24" y="80" width="464" height="34" rx="6" fill="#1d4ed8"/>
  <text x="36" y="103" font-size="13" font-weight="bold" fill="#ffffff">LIKE '%gamma%'</text>
  <rect x="24" y="124" width="464" height="30" rx="5" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="36" y="144" font-size="11.5" fill="#0f172a">18.13 ms</text>
  <rect x="24" y="160" width="464" height="30" rx="5" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="36" y="180" font-size="11.5" fill="#0f172a">必须逐行扫，且前缀通配无法用索引</text>
  <rect x="24" y="196" width="464" height="30" rx="5" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="36" y="216" font-size="11.5" fill="#0f172a">命中 12 500 行</text>
  <rect x="24" y="232" width="464" height="30" rx="5" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="36" y="252" font-size="11.5" fill="#0f172a">行数线性增长（O(n)）</text>
  <rect x="24" y="268" width="464" height="30" rx="5" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="36" y="288" font-size="11.5" fill="#0f172a">写时零成本，建表即用</text>
  <rect x="24" y="304" width="464" height="30" rx="5" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="36" y="324" font-size="11.5" fill="#0f172a">适合：低频、小表、临时查询</text>
  <rect x="512" y="80" width="464" height="34" rx="6" fill="#047857"/>
  <text x="524" y="103" font-size="13" font-weight="bold" fill="#ffffff">MATCH 'gamma'</text>
  <rect x="512" y="124" width="464" height="30" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="524" y="144" font-size="11.5" fill="#0f172a">1.61 ms</text>
  <rect x="512" y="160" width="464" height="30" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="524" y="180" font-size="11.5" fill="#0f172a">查倒排索引，直接拿到文档号集合</text>
  <rect x="512" y="196" width="464" height="30" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="524" y="216" font-size="11.5" fill="#0f172a">命中 12 500 行</text>
  <rect x="512" y="232" width="464" height="30" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="524" y="252" font-size="11.5" fill="#0f172a">与总行数弱相关（O(命中)）</text>
  <rect x="512" y="268" width="464" height="30" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="524" y="288" font-size="11.5" fill="#0f172a">写时要维护倒排，占额外空间</text>
  <rect x="512" y="304" width="464" height="30" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="524" y="324" font-size="11.5" fill="#0f172a">适合：搜索框、内容检索</text>
  <text x="24" y="402" font-size="11.5" fill="#b45309">⚠️ 11.2 倍只是 5 万行的数；行数越大差距越大，但 MATCH 的语义不同（按词匹配，不按子串），别拿它替代 LIKE 做任意子串搜索 —— 那要用 trigram 分词器。</text>
</svg>
