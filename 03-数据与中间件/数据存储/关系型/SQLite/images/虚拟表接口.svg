<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 339" width="1000" height="339" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="339" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">虚拟表：把任何数据源伪装成一张表</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#64748b">FTS5、R*Tree、dbstat 都是它；自己写一个也只需要实现几个回调</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect x="24" y="76" width="306" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="76" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="36" y="98" font-size="12" font-weight="bold" fill="#0f172a">A xCreate</text>
  <rect x="34" y="118" width="286" height="22" rx="4" fill="#eef2ff"/>
  <text x="40" y="134" font-size="11.5" fill="#1d4ed8">声明列与参数</text>
  <text x="36" y="160" font-size="11.5" fill="#64748b">CREATE VIRTUAL TABLE 时调</text>
  <rect x="346" y="76" width="306" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="346" y="76" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="358" y="98" font-size="12" font-weight="bold" fill="#0f172a">B xBestIndex</text>
  <rect x="356" y="118" width="286" height="22" rx="4" fill="#f5f3ff"/>
  <text x="362" y="134" font-size="11.5" fill="#7c3aed">告诉优化器怎么用</text>
  <text x="358" y="160" font-size="11.5" fill="#64748b">决定能不能走「索引」</text>
  <rect x="668" y="76" width="306" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="668" y="76" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="680" y="98" font-size="12" font-weight="bold" fill="#0f172a">C xFilter / xNext</text>
  <rect x="678" y="118" width="286" height="22" rx="4" fill="#ecfdf5"/>
  <text x="684" y="134" font-size="11.5" fill="#047857">游标：定位与推进</text>
  <text x="680" y="160" font-size="11.5" fill="#64748b">查询执行时调</text>
  <rect x="24" y="190" width="306" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="190" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="36" y="212" font-size="12" font-weight="bold" fill="#0f172a">D xColumn / xRowid</text>
  <rect x="34" y="232" width="286" height="22" rx="4" fill="#ecfdf5"/>
  <text x="40" y="248" font-size="11.5" fill="#047857">取列值、取 rowid</text>
  <text x="36" y="274" font-size="11.5" fill="#64748b">每行每列调</text>
  <rect x="346" y="190" width="306" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="346" y="190" width="306" height="34" rx="10" fill="#e2e8f0"/>
  <text x="358" y="212" font-size="12" font-weight="bold" fill="#0f172a">E xUpdate</text>
  <rect x="356" y="232" width="286" height="22" rx="4" fill="#fffbeb"/>
  <text x="362" y="248" font-size="11.5" fill="#b45309">增删改都走它</text>
  <text x="358" y="274" font-size="11.5" fill="#64748b">写路径只有这一个入口</text>
  <text x="24" y="310" font-size="11.5" fill="#b45309">⭐ 判据：需要「在库里直接 SQL 查外部数据」（文件、协议、内存结构）时才写虚拟表；只是数据在别处，用 ETL 灌进来更简单。</text>
</svg>
