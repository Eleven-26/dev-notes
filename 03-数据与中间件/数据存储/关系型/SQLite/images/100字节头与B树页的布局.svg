<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 523" width="1000" height="523" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="523" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一个库文件 = 100 字节头 + 若干 4 KiB 页</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#64748b">页是唯一的 I/O 单位，表与索引都是 B 树，都住在这种页里</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect x="24" y="76" width="952" height="56" rx="8" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <rect x="24" y="76" width="188" height="56" rx="8" fill="#1d4ed8" fill-opacity="0.10"/>
  <text x="40" y="100" font-size="13" font-weight="bold" fill="#1d4ed8">偏移 0~99</text>
  <text x="232" y="100" font-size="12.5" fill="#0f172a">数据库头：magic「SQLite format 3」+ 页大小 + 页数 + schema cookie</text>
  <text x="232" y="120" font-size="11.5" fill="#64748b">改了页大小或 schema，这里先变</text>
  <rect x="24" y="142" width="952" height="56" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="24" y="142" width="188" height="56" rx="8" fill="#7c3aed" fill-opacity="0.10"/>
  <text x="40" y="166" font-size="13" font-weight="bold" fill="#7c3aed">页 1</text>
  <text x="232" y="166" font-size="12.5" fill="#0f172a">头部之后紧跟 sqlite_schema 的根页（表名、建表 SQL 都在这）</text>
  <text x="232" y="186" font-size="11.5" fill="#64748b">所以第 1 页永远不是纯数据页</text>
  <rect x="24" y="208" width="952" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <rect x="24" y="208" width="188" height="56" rx="8" fill="#047857" fill-opacity="0.10"/>
  <text x="40" y="232" font-size="13" font-weight="bold" fill="#047857">表 B 树页</text>
  <text x="232" y="232" font-size="12.5" fill="#0f172a">页类型 13 = 叶子，5 = 内部；cell 指针数组从页尾往前长</text>
  <text x="232" y="252" font-size="11.5" fill="#64748b">叶子 cell = 负载长度 + rowid + 负载 + 溢出页号</text>
  <rect x="24" y="274" width="952" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <rect x="24" y="274" width="188" height="56" rx="8" fill="#047857" fill-opacity="0.10"/>
  <text x="40" y="298" font-size="13" font-weight="bold" fill="#047857">索引 B 树页</text>
  <text x="232" y="298" font-size="12.5" fill="#0f172a">页类型 10 = 叶子，2 = 内部；cell 只有「键 + 子页号」</text>
  <text x="232" y="318" font-size="11.5" fill="#64748b">键就是索引列值 + rowid，没有整行</text>
  <rect x="24" y="340" width="952" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <rect x="24" y="340" width="188" height="56" rx="8" fill="#b45309" fill-opacity="0.10"/>
  <text x="40" y="364" font-size="13" font-weight="bold" fill="#b45309">溢出页</text>
  <text x="232" y="364" font-size="12.5" fill="#0f172a">一行装不进一页时，超出部分挂到溢出页链上</text>
  <text x="232" y="384" font-size="11.5" fill="#64748b">长 TEXT / BLOB 都走这条</text>
  <rect x="24" y="406" width="952" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="24" y="406" width="188" height="56" rx="8" fill="#dc2626" fill-opacity="0.10"/>
  <text x="40" y="430" font-size="13" font-weight="bold" fill="#dc2626">freelist</text>
  <text x="232" y="430" font-size="12.5" fill="#0f172a">被释放的页进空闲链，文件不会因此变小</text>
  <text x="232" y="450" font-size="11.5" fill="#64748b">要缩文件只能 VACUUM</text>
  <text x="24" y="494" font-size="11.5" fill="#b45309">⭐ 本机实测：10 万行（每行约 88 字节负载）→ 2159 页 / 8 843 264 字节；dbstat 汇总同样是 2159 页，说明没有溢出页。</text>
</svg>
