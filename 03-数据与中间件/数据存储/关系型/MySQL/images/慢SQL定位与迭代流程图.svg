<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">慢 SQL 的定位与迭代流程：别凭感觉改</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#64748b">节点、症状与手段全部出自本篇第八节正文；排序口径为何用总耗时，见 11.4 节 A/B 例</text>

  <rect x="40" y="76" width="240" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="109" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e40af">① 定位：慢查询日志</text>
  <line x1="280" y1="104" x2="320" y2="104" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="320" y="76" width="240" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="109" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e40af">② 排序：按总耗时</text>
  <line x1="560" y1="104" x2="600" y2="104" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="600" y="76" width="240" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="720" y="109" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e40af">③ 分析：EXPLAIN</text>
  <line x1="720" y1="132" x2="720" y2="172" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="570" y="172" width="300" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="720" y="205" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#92400e">④ 判断层次：瓶颈在哪一层</text>

  <path d="M 720 228 L 720 252 L 185 252 L 185 282" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <path d="M 720 252 L 500 252 L 500 282" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <path d="M 720 252 L 815 252 L 815 282" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="40" y="282" width="290" height="112" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="185" y="306" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">索引问题</text>
  <text x="185" y="330" text-anchor="middle" font-size="11" fill="#14532d">key = NULL、type = ALL</text>
  <text x="185" y="350" text-anchor="middle" font-size="11" fill="#14532d">Extra 里的 Using filesort</text>
  <text x="185" y="376" text-anchor="middle" font-size="11.5" fill="#14532d">手段：加/改索引，改写 SQL</text>

  <rect x="355" y="282" width="290" height="112" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="500" y="306" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9a3412">SQL 问题：索引没错但量就大</text>
  <text x="500" y="330" text-anchor="middle" font-size="11" fill="#9a3412">深分页、全表 COUNT、大结果集</text>
  <text x="500" y="350" text-anchor="middle" font-size="11" fill="#9a3412">改写法：游标分页、延迟关联</text>
  <text x="500" y="376" text-anchor="middle" font-size="11.5" fill="#9a3412">只判断"是否超过 N"即可</text>

  <rect x="670" y="282" width="290" height="112" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="815" y="306" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#991b1b">架构问题：单条 SQL 已最优</text>
  <text x="815" y="330" text-anchor="middle" font-size="11" fill="#991b1b">热点行、超大表、强一致读</text>
  <text x="815" y="350" text-anchor="middle" font-size="11" fill="#991b1b">缓存、读写分离、分表、预计算</text>
  <text x="815" y="376" text-anchor="middle" font-size="11.5" fill="#991b1b">量级问题不是索引问题</text>

  <path d="M 185 394 L 185 414 L 500 414" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 815 394 L 815 414 L 500 414" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="500" y1="394" x2="500" y2="428" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="300" y="428" width="400" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="461" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e40af">⑤ 改一处：EXPLAIN + 计时复测</text>

  <path d="M 700 456 L 982 456 L 982 200 L 874 200" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <text x="846" y="444" text-anchor="middle" font-size="11" fill="#2563eb">复测后回 ④ 继续迭代</text>

  <rect x="40" y="508" width="920" height="76" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="500" y="536" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">纪律一：一次只改一处，否则不知道是谁起的作用；纪律二：用数据说话，改前改后都要 EXPLAIN + 计时</text>
  <text x="500" y="562" text-anchor="middle" font-size="12.5" fill="#92400e">用架构手段解索引问题、或用索引手段解架构问题，都是白费力气</text>
</svg>
