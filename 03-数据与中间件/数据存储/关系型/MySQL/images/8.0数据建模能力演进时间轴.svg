<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">MySQL 8.0 数据建模能力演进时间轴</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">按小版本发布顺序排列；判断某个能力要哪个版本才有，沿轴从左往右找对应节点</text>

  <text x="38" y="104" font-size="12.5" fill="#16a34a">上排：让"冗余列 / 应用层计算"变得不必要的能力</text>

  <line x1="30" y1="300" x2="970" y2="300" stroke="#64748b" stroke-width="2"/>

  <rect x="153" y="120" width="104" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="205" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">8.0.1</text>
  <text x="205" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">CTE / 递归</text>
  <text x="205" y="192" text-anchor="middle" font-size="11" fill="#14532d">树形层级直查</text>
  <line x1="205" y1="204" x2="205" y2="300" stroke="#16a34a" stroke-width="1.5"/>

  <rect x="268" y="120" width="104" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">8.0.2</text>
  <text x="320" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">窗口函数</text>
  <text x="320" y="192" text-anchor="middle" font-size="11" fill="#14532d">组内排名免冗余</text>
  <line x1="320" y1="204" x2="320" y2="300" stroke="#16a34a" stroke-width="1.5"/>

  <rect x="583" y="120" width="104" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="635" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">8.0.13</text>
  <text x="635" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">函数索引</text>
  <text x="635" y="192" text-anchor="middle" font-size="11" fill="#14532d">表达式进索引</text>
  <line x1="635" y1="204" x2="635" y2="300" stroke="#16a34a" stroke-width="1.5"/>

  <rect x="698" y="120" width="104" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="750" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">8.0.17</text>
  <text x="750" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">多值索引</text>
  <text x="750" y="192" text-anchor="middle" font-size="11" fill="#14532d">数组逐元素入索</text>
  <line x1="750" y1="204" x2="750" y2="300" stroke="#16a34a" stroke-width="1.5"/>

  <rect x="38" y="396" width="104" height="84" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="90" y="419" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">8.0</text>
  <text x="90" y="444" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">降序索引</text>
  <text x="90" y="468" text-anchor="middle" font-size="11" fill="#9a3412">不可见索引留退路</text>
  <line x1="90" y1="300" x2="90" y2="396" stroke="#ea580c" stroke-width="1.5"/>

  <rect x="383" y="396" width="104" height="84" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="435" y="419" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">8.0.12</text>
  <text x="435" y="444" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">INSTANT 加列</text>
  <text x="435" y="468" text-anchor="middle" font-size="11" fill="#9a3412">只改字典元数据</text>
  <line x1="435" y1="300" x2="435" y2="396" stroke="#ea580c" stroke-width="1.5"/>

  <rect x="728" y="396" width="104" height="84" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="780" y="419" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">8.0.18</text>
  <text x="780" y="444" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">Hash Join</text>
  <text x="780" y="468" text-anchor="middle" font-size="11" fill="#9a3412">哈希兜底等值联接</text>
  <line x1="780" y1="300" x2="780" y2="396" stroke="#ea580c" stroke-width="1.5"/>

  <rect x="843" y="396" width="104" height="84" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="895" y="419" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">8.0.20</text>
  <text x="895" y="444" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">BNL 退场</text>
  <text x="895" y="468" text-anchor="middle" font-size="11" fill="#9a3412">全部改走哈希</text>
  <line x1="895" y1="300" x2="895" y2="396" stroke="#ea580c" stroke-width="1.5"/>

  <circle cx="205" cy="300" r="6" fill="#16a34a"/>
  <circle cx="320" cy="300" r="6" fill="#16a34a"/>
  <circle cx="635" cy="300" r="6" fill="#16a34a"/>
  <circle cx="750" cy="300" r="6" fill="#16a34a"/>
  <circle cx="90" cy="300" r="6" fill="#ea580c"/>
  <circle cx="435" cy="300" r="6" fill="#ea580c"/>
  <circle cx="780" cy="300" r="6" fill="#ea580c"/>
  <circle cx="895" cy="300" r="6" fill="#ea580c"/>

  <text x="970" y="288" text-anchor="end" font-size="11" fill="#94a3b8">顺序示意，间距非等比时间刻度</text>
  <text x="38" y="520" font-size="12.5" fill="#ea580c">下排：改变建模与执行方式的能力（索引、在线 DDL、联接算法）</text>
  <text x="500" y="556" text-anchor="middle" font-size="11.5" fill="#64748b">版本与能力名均出自本篇第八节能力表；INSTANT 见 4.5 节、BNL 退场见 6.1 节，均为小版本号而非实测读数</text>
</svg>
