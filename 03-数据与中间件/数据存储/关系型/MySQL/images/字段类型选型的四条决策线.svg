<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="820" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">字段类型怎么选：三条决策线与字符集这个总开关</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">口径：本机 Docker Desktop 的 mysql:8.0（8.0.46），utf8mb4 + DYNAMIC 行格式；图内数字全部出自本篇实测块</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="470" height="296" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">A. 时间：先定时区语义，再定范围</text>
    <text x="16" y="48" font-size="10.5" fill="#64748b">8.0 的 TIMESTAMP 仍是 4 字节，2038 上限没有扩展</text>

    <rect x="16" y="60" width="438" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="30" y="80" font-size="12" font-weight="bold" fill="#14532d">TIMESTAMP｜4 字节｜内部存 UTC 纪元秒</text>
    <text x="30" y="99" font-size="10.5" fill="#14532d">1970-01-01 00:00:01 UTC ~ 2038-01-19 03:14:07 UTC</text>
    <text x="30" y="114" font-size="10.5" fill="#14532d">同一个值换会话时区读出来就变：SET time_zone 之后显示跟着漂</text>

    <rect x="16" y="126" width="438" height="58" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <text x="30" y="146" font-size="12" font-weight="bold" fill="#9a3412">DATETIME｜5 字节｜写进去的那串字面值</text>
    <text x="30" y="165" font-size="10.5" fill="#9a3412">1000-01-01 00:00:00 ~ 9999-12-31 23:59:59｜不随时区换算</text>
    <text x="30" y="180" font-size="10.5" fill="#9a3412">注意：没有 2038 上限，但时区设错的值没法自己纠正</text>

    <rect x="16" y="192" width="438" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="30" y="212" font-size="12" font-weight="bold" fill="#1e40af">BIGINT｜8 字节｜毫秒时间戳</text>
    <text x="30" y="231" font-size="10.5" fill="#1e40af">无时区歧义；可读性差、不能直接用 SQL 时间函数</text>
    <text x="30" y="246" font-size="10.5" fill="#1e40af">全链路锁死 UTC 时的第三选项（极限用 2038 之后）</text>

    <text x="30" y="272" font-size="10.5" fill="#ea580c">要点：强烈建议 TIMESTAMP；不能用就退到 BIGINT</text>
    <text x="30" y="288" font-size="10.5" fill="#ea580c">　　DATETIME 只在全链路时区统一时才可信</text>
  </g>

  <g transform="translate(510,74)">
    <rect x="0" y="0" width="470" height="296" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">B. 数值：宽度看字节，金额不能用浮点</text>
    <text x="16" y="48" font-size="10.5" fill="#64748b">显示宽度、UNSIGNED、金额误差，是三个各自独立的坑</text>

    <rect x="16" y="60" width="438" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="80" font-size="11.5" font-weight="bold" fill="#0f172a">整数存储：TINYINT 1｜SMALLINT 2｜MEDIUMINT 3｜INT 4｜BIGINT 8</text>
    <text x="30" y="99" font-size="10.5" fill="#334155">范围：TINYINT -128 ~ 127｜INT ±21 亿｜BIGINT ±9.2×10¹⁸</text>
    <text x="30" y="117" font-size="10.5" fill="#ea580c">注意：int(11) 的 11 是显示宽度（Warning 1681），不限制范围也不限制写入</text>

    <rect x="16" y="132" width="438" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="30" y="152" font-size="12" font-weight="bold" fill="#991b1b">金额：FLOAT / DOUBLE 不可用</text>
    <text x="30" y="171" font-size="10.5" fill="#991b1b">二进制浮点表示不了 0.1，累加会漂移、比较不能用 =</text>

    <rect x="16" y="192" width="438" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <text x="30" y="212" font-size="12" font-weight="bold" fill="#9a3412">DECIMAL(M,D)：要在库内做金额运算时才用</text>
    <text x="30" y="231" font-size="10.5" fill="#9a3412">精确十进制可直接算；占用随位数增长，除法乘法的 scale 变化要留意</text>

    <rect x="16" y="252" width="438" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="30" y="271" font-size="12" font-weight="bold" fill="#14532d">BIGINT 存最小货币单位（分）：推荐做法</text>
    <text x="30" y="289" font-size="10.5" fill="#14532d">整数运算最快且无精度问题，应用层负责单位换算与展示</text>
  </g>

  <g transform="translate(20,390)">
    <rect x="0" y="0" width="470" height="276" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">C. 字符串：长度是字符数，索引上限是字节</text>
    <text x="16" y="48" font-size="10.5" fill="#64748b">utf8mb4 每字符最多 4 字节 → VARCHAR(255) 最坏占 1020 字节</text>

    <rect x="16" y="60" width="209" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="30" y="80" font-size="11.5" font-weight="bold" fill="#1e40af">CHAR(n) 定长</text>
    <text x="30" y="99" font-size="10" fill="#1e40af">不足补空格，取出时丢掉尾随空格</text>
    <text x="30" y="115" font-size="10" fill="#1e40af">适合 MD5、国家码等固定长度</text>
    <text x="30" y="131" font-size="10" fill="#1e40af">注意：末尾有空格这件事存不下来</text>

    <rect x="245" y="60" width="209" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="259" y="80" font-size="11.5" font-weight="bold" fill="#14532d">VARCHAR(n) 变长</text>
    <text x="259" y="99" font-size="10" fill="#14532d">额外 1~2 字节存实际长度</text>
    <text x="259" y="115" font-size="10" fill="#14532d">绝大多数业务字段的选择</text>
    <text x="259" y="131" font-size="10" fill="#14532d">实际长度超过 255 时前缀变 2 字节</text>

    <rect x="16" y="146" width="438" height="86" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="30" y="166" font-size="11.5" font-weight="bold" fill="#991b1b">索引键长度上限随行格式变（8.0.46 实测）</text>
    <text x="30" y="185" font-size="10.5" fill="#991b1b">DYNAMIC：3072 字节 — VARCHAR(768) 通过、769 报 ERROR 1071</text>
    <text x="30" y="203" font-size="10.5" fill="#991b1b">COMPACT / REDUNDANT：767 字节 — VARCHAR(192) 就报 ERROR 1071</text>
    <text x="30" y="221" font-size="10.5" fill="#991b1b">解法：DYNAMIC 行格式 / 前缀索引 / 缩短列长</text>

    <text x="30" y="248" font-size="10.5" fill="#ea580c">注意：前缀索引不能用于覆盖索引，区分度受前缀长度影响</text>
    <text x="30" y="266" font-size="10.5" fill="#334155">TEXT / BLOB：无默认值、只能前缀索引、行溢出多一次 IO</text>
  </g>

  <g transform="translate(510,390)">
    <rect x="0" y="0" width="470" height="276" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">D. 字符集与排序规则：它决定什么算相等</text>
    <text x="16" y="48" font-size="10.5" fill="#64748b">实测默认 utf8mb4 + utf8mb4_0900_ai_ci（实例级，my.cnf 一改全实例跟着变）</text>

    <rect x="16" y="60" width="438" height="66" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <text x="30" y="80" font-size="11.5" font-weight="bold" fill="#9a3412">写 CHARACTER SET utf8 得到的是 utf8mb3</text>
    <text x="30" y="99" font-size="10.5" fill="#9a3412">Maxlen 只有 3 → Warning 3719，表定义落下来是 CHARSET=utf8mb3</text>
    <text x="30" y="117" font-size="10.5" fill="#9a3412">塞 emoji 报 ERROR 1366；非严格模式改成 Warning 并替换成 ?（0x3F）</text>

    <rect x="16" y="134" width="438" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="30" y="154" font-size="11.5" font-weight="bold" fill="#1e40af">排序规则决定等值判断与索引顺序</text>
    <text x="30" y="173" font-size="10.5" fill="#1e40af">é 与 e 在 0900_ai_ci 下判等为 1，在 utf8mb4_bin 下为 0</text>

    <rect x="16" y="192" width="438" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="30" y="212" font-size="11.5" font-weight="bold" fill="#991b1b">关联列排序规则不一致的两条出路</text>
    <text x="30" y="231" font-size="10.5" fill="#991b1b">不写 COLLATE 直接 join → ERROR 1267 Illegal mix of collations</text>
    <text x="30" y="246" font-size="10.5" fill="#991b1b">COLLATE 强转 → type 从 ref 退化成 index（key_len 82 没变）</text>

    <text x="30" y="270" font-size="10.5" fill="#ea580c">要点：建表显式写 CHARACTER SET 与 COLLATE，别依赖默认值</text>
  </g>

  <g transform="translate(20,686)">
    <rect x="0" y="0" width="960" height="126" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">要点：三条写进建表规范的硬约束</text>
    <text x="30" y="54" font-size="11.5" fill="#0f172a">① 时间：全链路只留一种时间语义 —— UTC 的 TIMESTAMP 或 BIGINT，时区转换只在展示层做</text>
    <text x="30" y="78" font-size="11.5" fill="#0f172a">② 关联列：类型 + 字符集 + 排序规则三件必须一致；不一致先报 ERROR 1267，强转后退化成扫整棵索引</text>
    <text x="30" y="102" font-size="11.5" fill="#0f172a">③ 金额与主键：金额用 BIGINT 存分；自增主键用 BIGINT UNSIGNED，不要用 UUID</text>
  </g>

</svg>
