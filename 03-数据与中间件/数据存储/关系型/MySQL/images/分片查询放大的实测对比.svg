  <text x="500" y="596" text-anchor="middle" font-size="11.5" fill="#64748b">出处：本机 Docker Desktop 容器 w7m2-m1（端口 25301）、mysql:8.0 = 8.0.46，库 w7m2_shard 的 16 张 user_0000 ~ user_0015（每片 50000 行）</text>
  <text x="500" y="616" text-anchor="middle" font-size="11.5" fill="#64748b">未实测：跨实例的中间件分片（ShardingSphere / MyCat）本机无镜像，读数只反映片数本身的放大</text>
