<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 596" width="1000" height="596" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="596" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">复制五种拓扑的连接关系与本机实测连线</text>
  <text x="500" y="48" text-anchor="middle" font-size="13" fill="#64748b">方框 = 实例，箭头 = 谁向谁拉 binlog（复制是「拉」不是「推」）；蓝 = 源库，绿 = 副本，橙 = 会写的一端，红 = 风险点</text>

  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arwR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="14" y="60" width="318" height="188" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="28" y="82" font-size="13" font-weight="bold" fill="#0f172a">① 一主多从</text>
  <rect x="141" y="94" width="64" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="173" y="110" text-anchor="middle" font-size="11.5" fill="#1e40af">主库</text>
  <rect x="38" y="172" width="64" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="70" y="188" text-anchor="middle" font-size="11.5" fill="#065f46">从库 1</text>
  <rect x="141" y="172" width="64" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="173" y="188" text-anchor="middle" font-size="11.5" fill="#065f46">从库 2</text>
  <rect x="244" y="172" width="64" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="276" y="188" text-anchor="middle" font-size="11.5" fill="#065f46">从库 3</text>
  <line x1="154" y1="118" x2="70" y2="172" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="173" y1="118" x2="173" y2="172" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="192" y1="118" x2="276" y2="172" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="28" y="148" font-size="11.5" fill="#334155">主库为每个从库开 1 个 dump 线程</text>
  <text x="28" y="220" font-size="11.5" fill="#334155">适用：读写分离、备份、报表</text>
  <text x="28" y="238" font-size="11.5" fill="#dc2626">注意：主库带宽与连接数随从库数增长</text>

  <rect x="355" y="60" width="318" height="188" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="369" y="82" font-size="13" font-weight="bold" fill="#0f172a">② 级联复制</text>
  <rect x="468" y="92" width="64" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="500" y="108" text-anchor="middle" font-size="11.5" fill="#1e40af">主库</text>
  <rect x="468" y="142" width="76" height="24" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="506" y="158" text-anchor="middle" font-size="11.5" fill="#7c2d12">中继从库</text>
  <rect x="395" y="192" width="64" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="413" y="208" text-anchor="middle" font-size="11.5" fill="#065f46">从库 1</text>
  <rect x="565" y="192" width="64" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="583" y="208" text-anchor="middle" font-size="11.5" fill="#065f46">从库 2</text>
  <line x1="500" y1="116" x2="500" y2="142" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="486" y1="166" x2="421" y2="192" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="526" y1="166" x2="577" y2="192" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="369" y="132" font-size="11.5" fill="#334155">主库只养 1 个</text>
  <text x="369" y="230" font-size="11.5" fill="#334155">适用：从库很多时减轻主库压力</text>
  <text x="521" y="132" font-size="11.5" fill="#dc2626">中继落后</text>
  <text x="521" y="148" font-size="11.5" fill="#dc2626">下游全落后</text>

  <rect x="682" y="60" width="318" height="188" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="696" y="82" font-size="13" font-weight="bold" fill="#0f172a">③ 双主（主主）</text>
  <rect x="708" y="132" width="76" height="28" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="746" y="150" text-anchor="middle" font-size="11.5" fill="#7c2d12">节点 A</text>
  <rect x="868" y="132" width="76" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="906" y="150" text-anchor="middle" font-size="11.5" fill="#1e40af">节点 B</text>
  <line x1="784" y1="138" x2="868" y2="138" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="868" y1="154" x2="784" y2="154" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="696" y="112" font-size="11.5" fill="#334155">互为主从，双向都有 dump 与 IO 线程</text>
  <text x="788" y="124" font-size="11.5" fill="#64748b">A 写 → B 追</text>
  <text x="794" y="172" font-size="11.5" fill="#64748b">B 写 → A 追</text>
  <text x="696" y="200" font-size="11.5" fill="#334155">自增靠 increment 与 offset 错开</text>
  <text x="696" y="220" font-size="11.5" fill="#dc2626">双主不是双写：同一行两边都改</text>
  <text x="696" y="238" font-size="11.5" fill="#dc2626">谁也覆盖不了谁，多用于快速切换</text>

  <rect x="14" y="258" width="318" height="188" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="28" y="280" font-size="13" font-weight="bold" fill="#0f172a">④ 环形 / 多主</text>
  <rect x="48" y="310" width="64" height="24" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="80" y="326" text-anchor="middle" font-size="11.5" fill="#7c2d12">节点 A</text>
  <rect x="234" y="310" width="64" height="24" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="266" y="326" text-anchor="middle" font-size="11.5" fill="#7c2d12">节点 B</text>
  <rect x="234" y="380" width="64" height="24" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="266" y="396" text-anchor="middle" font-size="11.5" fill="#7c2d12">节点 C</text>
  <rect x="48" y="380" width="64" height="24" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="80" y="396" text-anchor="middle" font-size="11.5" fill="#7c2d12">节点 D</text>
  <line x1="112" y1="322" x2="234" y2="322" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="266" y1="334" x2="266" y2="380" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="234" y1="392" x2="112" y2="392" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="80" y1="380" x2="80" y2="334" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="130" y="314" font-size="11.5" fill="#64748b">拉</text>
  <text x="28" y="368" font-size="11.5" fill="#dc2626">首尾相连：任一节点断链</text>
  <text x="28" y="428" font-size="11.5" fill="#dc2626">冲突检测复杂、延迟叠加</text>
  <text x="164" y="428" font-size="11.5" fill="#334155">表里标「几乎不用」</text>

  <rect x="355" y="258" width="318" height="188" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="369" y="280" font-size="13" font-weight="bold" fill="#0f172a">⑤ 多源复制（8.0）</text>
  <rect x="365" y="304" width="64" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="397" y="320" text-anchor="middle" font-size="11.5" fill="#1e40af">主库 1</text>
  <rect x="365" y="346" width="64" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="397" y="362" text-anchor="middle" font-size="11.5" fill="#1e40af">主库 2</text>
  <rect x="365" y="388" width="64" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="397" y="404" text-anchor="middle" font-size="11.5" fill="#1e40af">主库 3</text>
  <rect x="555" y="346" width="88" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="613" y="362" text-anchor="middle" font-size="11.5" fill="#065f46">汇总从库</text>
  <line x1="429" y1="316" x2="555" y2="350" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="429" y1="358" x2="555" y2="358" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="429" y1="400" x2="555" y2="366" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="453" y="310" font-size="11.5" fill="#64748b">FOR CHANNEL</text>
  <text x="449" y="428" font-size="11.5" fill="#334155">一个从库接多个主库</text>
  <text x="555" y="330" font-size="11.5" fill="#334155">适用：多业务库</text>
  <text x="555" y="390" font-size="11.5" fill="#dc2626">任一主库的大事务</text>
  <text x="555" y="406" font-size="11.5" fill="#dc2626">都会影响它</text>

  <rect x="682" y="258" width="318" height="188" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
  <text x="696" y="280" font-size="13" font-weight="bold" fill="#7c2d12">本机这次真搭的是 ①</text>
  <rect x="692" y="302" width="118" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="751" y="320" text-anchor="middle" font-size="11.5" fill="#1e40af">w7m2-m1 源库</text>
  <rect x="844" y="302" width="118" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="903" y="320" text-anchor="middle" font-size="11.5" fill="#065f46">w7m2-m2 副本</text>
  <line x1="810" y1="316" x2="844" y2="316" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arwR)"/>
  <text x="692" y="350" font-size="11.5" fill="#334155">端口 25301 → 25302</text>
  <text x="692" y="368" font-size="11.5" fill="#334155">GTID 自动定位（AUTO_POSITION = 1）</text>
  <text x="692" y="386" font-size="11.5" fill="#334155">副本 4 个重放线程、保提交顺序</text>
  <text x="692" y="406" font-size="11.5" fill="#334155">停 IO 线程差 20 笔 = 少 20000 行，</text>
  <text x="692" y="424" font-size="11.5" fill="#334155">恢复后 3~4 秒追平（3 轮读数见 6.5 节）</text>
  <text x="692" y="440" font-size="11.5" fill="#dc2626">②③④⑤ 未搭建，只给结构不给数字</text>

  <text x="500" y="474" text-anchor="middle" font-size="11.5" fill="#334155">三条结构规律：一个从库就等于上游一个 dump 线程；从库链越长延迟越会叠加；写入口越多冲突面越大。</text>
  <text x="500" y="494" text-anchor="middle" font-size="11.5" fill="#64748b">出处：本机 Docker Desktop，mysql:8.0 = 8.0.46，容器 w7m2-m1（25301）→ w7m2-m2（25302）、w7m2-m4（25304）</text>
  <text x="500" y="514" text-anchor="middle" font-size="11.5" fill="#64748b">未实测：半同步插件 rpl_semi_sync_*、MGR / Orchestrator、pt-table-checksum（本机未安装），切换丢失量未做故障注入</text>
  <text x="500" y="534" text-anchor="middle" font-size="11.5" fill="#64748b">单主从内部的三个线程与 relay log 时序见同目录 复制的三个线程与同步模式.svg，本图不重画</text>
</svg>
