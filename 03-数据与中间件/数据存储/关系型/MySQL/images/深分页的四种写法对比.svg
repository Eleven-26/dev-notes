<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 818" width="1000" height="818" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="818" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">深分页的四种写法：两笔账，分开算</text>
  <text x="500" y="50" text-anchor="middle" font-size="13" fill="#64748b">50 万行、页大小 20、ORDER BY created_at, id 的本机实测</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="960" height="292" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" font-size="14" font-weight="bold" fill="#0f172a">四种写法随 OFFSET 增长的耗时</text>

    <rect x="16" y="38" width="928" height="26" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="56" font-size="11.5" font-weight="bold" fill="#0f172a">OFFSET</text>
    <text x="360" y="56" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#dc2626">① SELECT * 直接翻</text>
    <text x="520" y="56" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">② 只查主键</text>
    <text x="680" y="56" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">③ 延迟关联</text>
    <text x="840" y="56" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#047857">④ 游标</text>

    <rect x="16" y="64" width="928" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="83" font-size="11.5" font-family="Consolas, monospace" fill="#334155">0</text>
    <text x="360" y="83" text-anchor="middle" font-size="11.5" fill="#64748b">0 ms</text>
    <text x="520" y="83" text-anchor="middle" font-size="11.5" fill="#64748b">0 ms</text>
    <text x="680" y="83" text-anchor="middle" font-size="11.5" fill="#64748b">0 ms</text>
    <text x="840" y="83" text-anchor="middle" font-size="11.5" fill="#64748b">0 ms</text>

    <rect x="16" y="92" width="928" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="111" font-size="11.5" font-family="Consolas, monospace" fill="#334155">10000</text>
    <text x="360" y="111" text-anchor="middle" font-size="11.5" fill="#334155">1 ms</text>
    <text x="520" y="111" text-anchor="middle" font-size="11.5" fill="#334155">0 ms</text>
    <text x="680" y="111" text-anchor="middle" font-size="11.5" fill="#334155">1 ms</text>
    <text x="840" y="111" text-anchor="middle" font-size="11.5" fill="#047857">0 ms</text>

    <rect x="16" y="120" width="928" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="139" font-size="11.5" font-family="Consolas, monospace" fill="#334155">50000</text>
    <text x="360" y="139" text-anchor="middle" font-size="11.5" fill="#334155">7 ms</text>
    <text x="520" y="139" text-anchor="middle" font-size="11.5" fill="#334155">2 ms</text>
    <text x="680" y="139" text-anchor="middle" font-size="11.5" fill="#334155">3 ms</text>
    <text x="840" y="139" text-anchor="middle" font-size="11.5" fill="#047857">0 ms</text>

    <rect x="16" y="148" width="928" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="167" font-size="11.5" font-family="Consolas, monospace" fill="#334155">100000</text>
    <text x="360" y="167" text-anchor="middle" font-size="11.5" fill="#334155">15 ms</text>
    <text x="520" y="167" text-anchor="middle" font-size="11.5" fill="#334155">5 ms</text>
    <text x="680" y="167" text-anchor="middle" font-size="11.5" fill="#334155">9 ms</text>
    <text x="840" y="167" text-anchor="middle" font-size="11.5" fill="#047857">0 ms</text>

    <rect x="16" y="176" width="928" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="195" font-size="11.5" font-family="Consolas, monospace" fill="#334155">250000</text>
    <text x="360" y="195" text-anchor="middle" font-size="11.5" fill="#334155">33 ms</text>
    <text x="520" y="195" text-anchor="middle" font-size="11.5" fill="#334155">14 ms</text>
    <text x="680" y="195" text-anchor="middle" font-size="11.5" fill="#334155">15 ms</text>
    <text x="840" y="195" text-anchor="middle" font-size="11.5" fill="#047857">0 ms</text>

    <rect x="16" y="204" width="928" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="223" font-size="11.5" font-family="Consolas, monospace" fill="#334155">499979</text>
    <text x="360" y="223" text-anchor="middle" font-size="11.5" fill="#dc2626">66 ms</text>
    <text x="520" y="223" text-anchor="middle" font-size="11.5" fill="#b45309">29 ms</text>
    <text x="680" y="223" text-anchor="middle" font-size="11.5" fill="#b45309">33 ms</text>
    <text x="840" y="223" text-anchor="middle" font-size="11.5" fill="#047857">0 ms</text>

    <text x="16" y="256" font-size="11.5" fill="#64748b">（单次读数，重复跑在 ±40% 内波动；「①③② 随 OFFSET 增长」与「④ 与页码无关」是稳定结论）</text>
    <text x="16" y="278" font-size="11.5" fill="#334155">⭐ ① 两笔账都欠着；②③ 免了回表但仍要扫过前面 N 行；④ 直接从索引定位起点，两笔一起清掉。</text>
  </g>

  <g transform="translate(20,382)">
    <rect x="0" y="0" width="960" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" font-size="14" font-weight="bold" fill="#0f172a">深分页贵在两笔账上，要分开算</text>

    <rect x="16" y="40" width="456" height="102" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
    <text x="32" y="64" font-size="12" font-weight="bold" fill="#b45309">第一笔：扫过前面 N 行（O(offset)）</text>
    <text x="32" y="90" font-size="11.5" fill="#334155">来自 OFFSET 的语义 —— 「扫描并丢弃前 N 行」</text>
    <text x="32" y="116" font-size="11.5" fill="#b45309">谁能治：只有游标</text>
    <text x="32" y="136" font-size="11" font-family="Consolas, monospace" fill="#334155">WHERE (k, id) &gt; (?, ?)</text>

    <rect x="488" y="40" width="456" height="102" rx="8" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="504" y="64" font-size="12" font-weight="bold" fill="#1d4ed8">第二笔：每条都回表（O(offset) 次）</text>
    <text x="504" y="90" font-size="11.5" fill="#334155">来自：用二级索引排序时索引里没有整行</text>
    <text x="504" y="116" font-size="11.5" fill="#1d4ed8">谁能治：延迟关联 / 覆盖索引</text>
    <text x="504" y="136" font-size="11.5" fill="#334155">回表次数从 OFFSET + LIMIT 降到 LIMIT</text>

    <text x="16" y="172" font-size="11.5" fill="#b45309">⚠️ 把两笔账混在一起谈，是这类问题最常见的答错方式 —— 必须支持跳页时，只能治第二笔。</text>
  </g>

  <g transform="translate(20,592)">
    <rect x="0" y="0" width="960" height="206" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" font-size="14" font-weight="bold" fill="#0f172a">线上加索引的四步：别让 DDL 把库堵死</text>

    <rect x="16" y="38" width="928" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="60" font-size="11.5" fill="#dc2626">① 先查长事务（processlist 里 time &gt; 10 + innodb_trx），有就别动手</text>

    <rect x="16" y="76" width="928" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="98" font-size="11" font-family="Consolas, monospace" fill="#1d4ed8">② ALTER TABLE ... ALGORITHM=INPLACE, LOCK=NONE</text>

    <rect x="16" y="114" width="928" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="136" font-size="11.5" fill="#334155">③ 改前改后各跑一次 EXPLAIN，对比 type / key / rows / Extra</text>

    <rect x="16" y="152" width="928" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="174" font-size="11.5" fill="#334155">④ 删索引前查 sys.schema_unused_indexes / schema_redundant_indexes</text>

    <text x="16" y="200" font-size="11.5" fill="#b45309">⚠️ 回滚不对称：DROP INDEX 基本是元数据操作、秒级完成，加索引才是慢的那个 —— 过渡方案一定要收尾。</text>
  </g>
</svg>
