<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <rect x="30" y="14" width="940" height="52" rx="8" fill="#f4f6f9" stroke="#d5dbe3"/>
  <text x="50" y="46" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1f2937">两条记录在 InnoDB 里占的四个页</text>

  <rect x="30" y="80" width="940" height="440" rx="10" fill="#fbfcfd" stroke="#d5dbe3"/>

  <rect x="50" y="150" width="330" height="310" rx="8" fill="#f7fafd" stroke="#2f6fb2"/>
  <text x="62" y="174" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">第 4 页 · PRIMARY 叶子（level 0）</text>
  <text x="62" y="194" font-family="sans-serif" font-size="12" fill="#6b7280">两条记录，整行都在这页</text>

  <rect x="62" y="206" width="306" height="110" rx="6" fill="#fdf1e3" stroke="#c07a2d"/>
  <text x="72" y="226" font-family="monospace" font-size="11" fill="#334155">id=1 name=张三 age=18</text>
  <text x="72" y="246" font-family="monospace" font-size="11" fill="#334155">phone=13700000000</text>
  <text x="72" y="266" font-family="monospace" font-size="11" fill="#334155">addr=广东省深圳 hobby=打游戏，爬山</text>
  <text x="72" y="286" font-family="monospace" font-size="11" fill="#334155">remark=这是张三备注</text>

  <rect x="62" y="326" width="306" height="110" rx="6" fill="#fdf1e3" stroke="#c07a2d"/>
  <text x="72" y="346" font-family="monospace" font-size="11" fill="#334155">id=2 name=李四 age=19</text>
  <text x="72" y="366" font-family="monospace" font-size="11" fill="#334155">phone=13800000000</text>
  <text x="72" y="386" font-family="monospace" font-size="11" fill="#334155">addr=广东省深圳 hobby=唱、跳、rap、打蓝球</text>
  <text x="72" y="406" font-family="monospace" font-size="11" fill="#334155">remark=这是李四备注</text>

  <rect x="560" y="150" width="380" height="90" rx="8" fill="#e8f1fb" stroke="#2f6fb2"/>
  <text x="572" y="174" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">第 5 页 · idx_phone 叶子</text>
  <text x="572" y="198" font-family="monospace" font-size="11" fill="#334155">13700000000 → 1</text>
  <text x="572" y="220" font-family="monospace" font-size="11" fill="#334155">13800000000 → 2</text>

  <rect x="560" y="250" width="380" height="90" rx="8" fill="#e8f1fb" stroke="#2f6fb2"/>
  <text x="572" y="274" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">第 6 页 · idx_hobby 叶子</text>
  <text x="572" y="298" font-family="monospace" font-size="11" fill="#334155">打游戏，爬山 → 1</text>
  <text x="572" y="320" font-family="monospace" font-size="11" fill="#334155">唱、跳、rap、打蓝球 → 2</text>

  <rect x="560" y="350" width="380" height="90" rx="8" fill="#e8f1fb" stroke="#2f6fb2"/>
  <text x="572" y="374" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">第 7 页 · idx_remark 叶子</text>
  <text x="572" y="398" font-family="monospace" font-size="11" fill="#334155">这是张三备注 → 1</text>
  <text x="572" y="420" font-family="monospace" font-size="11" fill="#334155">这是李四备注 → 2</text>

  <line x1="555" y1="195" x2="392" y2="195" stroke="#444444" stroke-width="1.5"/>
  <polygon points="384,195 394,190 394,200" fill="#444444"/>
  <text x="430" y="187" font-family="sans-serif" font-size="12" fill="#6b7280">键 → 主键 → 回表</text>

  <line x1="555" y1="295" x2="392" y2="295" stroke="#444444" stroke-width="1.5"/>
  <polygon points="384,295 394,290 394,300" fill="#444444"/>
  <text x="430" y="287" font-family="sans-serif" font-size="12" fill="#6b7280">键 → 主键 → 回表</text>

  <line x1="555" y1="395" x2="392" y2="395" stroke="#444444" stroke-width="1.5"/>
  <polygon points="384,395 394,390 394,400" fill="#444444"/>
  <text x="430" y="387" font-family="sans-serif" font-size="12" fill="#6b7280">键 → 主键 → 回表</text>

  <rect x="560" y="452" width="380" height="56" rx="6" fill="#fdecea" stroke="#e0a29a"/>
  <text x="572" y="474" font-family="sans-serif" font-size="12" fill="#a33a2f">索引叶子里没有 name / addr / remark 全文</text>
  <text x="572" y="496" font-family="sans-serif" font-size="12" fill="#a33a2f">取整行必须回到第 4 页</text>

  <rect x="30" y="540" width="940" height="60" rx="8" fill="#eef4fb" stroke="#c9d9ea"/>
  <text x="50" y="564" font-family="sans-serif" font-size="14" fill="#1f2937">两条记录也占 4 个页：每棵树至少一页；Data_length 16384 + Index_length 49152。</text>
  <text x="50" y="588" font-family="sans-serif" font-size="14" fill="#1f2937">写一条新记录要改 4 处，这就是「写放大 = 1 + N」。</text>
</svg>
