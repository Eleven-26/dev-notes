<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 736" width="1080" height="736" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="736" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="bold" fill="#12314f">五类问题到消费者表的路由，与一次现场采样的读数</text>
  <rect x="24" y="46" width="1032" height="62" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.5"/>
  <text x="40" y="70" font-size="13" font-weight="bold" fill="#12314f">值班顺序：先按症状落到一张表，再看这张表对应的开关开没开，最后才读它的内容</text>
  <text x="40" y="92" font-size="12" fill="#12314f">同一次采样、默认实例、重启后空载只挂 1 个客户端连接；三级细度为 current / history / summary</text>

  <rect x="24" y="146" width="248" height="76" fill="#f2edfa" stroke="#6b4b9a" stroke-width="1.4"/>
  <text x="38" y="170" font-size="12.5" font-weight="bold" fill="#3a2560">症状 1：哪条在跑</text>
  <text x="38" y="190" font-size="12" fill="#3a2560">跑了多久</text>
  <rect x="292" y="146" width="400" height="76" fill="#ffffff" stroke="#6b4b9a" stroke-width="1.4"/>
  <text x="306" y="176" font-size="12.5" fill="#12314f">events_statements_current</text>
  <text x="306" y="200" font-size="11.5" fill="#5a6b7c">此刻正在发生的那一条，按线程一行</text>
  <rect x="712" y="146" width="344" height="76" fill="#f0f2f5" stroke="#5a6b7c" stroke-width="1.2"/>
  <text x="726" y="170" font-size="12" fill="#12314f">现场：1 行（就是这条查询自己）</text>
  <text x="726" y="190" font-size="12" fill="#12314f">前提：该消费者 YES</text>
  <path d="M 272 184 L 290 184" stroke="#6b4b9a" stroke-width="1.8"/>
  <path d="M 282 179 L 291 184 L 282 189" fill="none" stroke="#6b4b9a" stroke-width="1.8"/>
  <path d="M 692 184 L 710 184" stroke="#6b4b9a" stroke-width="1.8"/>
  <path d="M 702 179 L 711 184 L 702 189" fill="none" stroke="#6b4b9a" stroke-width="1.8"/>

  <rect x="24" y="232" width="248" height="88" fill="#f2edfa" stroke="#6b4b9a" stroke-width="1.4"/>
  <text x="38" y="256" font-size="12.5" font-weight="bold" fill="#3a2560">症状 2：最近执行过的</text>
  <text x="38" y="276" font-size="12" fill="#3a2560">要翻历史</text>
  <rect x="292" y="232" width="400" height="88" fill="#ffffff" stroke="#6b4b9a" stroke-width="1.4"/>
  <text x="306" y="258" font-size="12.5" fill="#12314f">events_statements_history</text>
  <text x="306" y="276" font-size="12.5" fill="#12314f">events_statements_history_long</text>
  <text x="306" y="300" font-size="11.5" fill="#5a6b7c">前者每线程 10 条，后者是全局环形缓冲</text>
  <rect x="712" y="232" width="344" height="88" fill="#fbeaea" stroke="#a84040" stroke-width="1.2"/>
  <text x="726" y="254" font-size="12" fill="#6d1f1f">现场：history 1 行；history_long 0 行</text>
  <text x="726" y="274" font-size="12" fill="#6d1f1f">0 行是消费者默认 NO 造成的</text>
  <text x="726" y="294" font-size="12" fill="#6d1f1f">容量本身是 10000，不是写满了</text>
  <path d="M 272 276 L 290 276" stroke="#6b4b9a" stroke-width="1.8"/>
  <path d="M 282 271 L 291 276 L 282 281" fill="none" stroke="#6b4b9a" stroke-width="1.8"/>
  <path d="M 692 276 L 710 276" stroke="#6b4b9a" stroke-width="1.8"/>
  <path d="M 702 271 L 711 276 L 702 281" fill="none" stroke="#6b4b9a" stroke-width="1.8"/>

  <rect x="24" y="330" width="248" height="76" fill="#f2edfa" stroke="#6b4b9a" stroke-width="1.4"/>
  <text x="38" y="354" font-size="12.5" font-weight="bold" fill="#3a2560">症状 3：谁累计最耗资源</text>
  <text x="38" y="374" font-size="12" fill="#3a2560">平均慢还是总量大</text>
  <rect x="292" y="330" width="400" height="76" fill="#ffffff" stroke="#6b4b9a" stroke-width="1.4"/>
  <text x="306" y="360" font-size="12.5" fill="#12314f">events_statements_summary_by_digest</text>
  <text x="306" y="384" font-size="11.5" fill="#5a6b7c">指纹级聚合，Top 慢语句的主战场</text>
  <rect x="712" y="330" width="344" height="76" fill="#f0f2f5" stroke="#5a6b7c" stroke-width="1.2"/>
  <text x="726" y="354" font-size="12" fill="#12314f">现场：30 行指纹</text>
  <text x="726" y="374" font-size="12" fill="#12314f">前提：statements_digest YES</text>
  <text x="726" y="394" font-size="11.5" fill="#5a6b7c">行少不等于占得少，见底栏</text>
  <path d="M 272 368 L 290 368" stroke="#6b4b9a" stroke-width="1.8"/>
  <path d="M 282 363 L 291 368 L 282 373" fill="none" stroke="#6b4b9a" stroke-width="1.8"/>
  <path d="M 692 368 L 710 368" stroke="#6b4b9a" stroke-width="1.8"/>
  <path d="M 702 363 L 711 368 L 702 373" fill="none" stroke="#6b4b9a" stroke-width="1.8"/>

  <rect x="24" y="416" width="248" height="88" fill="#f2edfa" stroke="#6b4b9a" stroke-width="1.4"/>
  <text x="38" y="440" font-size="12.5" font-weight="bold" fill="#3a2560">症状 4：时间花在哪层</text>
  <text x="38" y="460" font-size="12" fill="#3a2560">等锁 / 读盘 / 排序</text>
  <text x="38" y="480" font-size="11.5" fill="#a84040">最容易误判成"没问题"</text>
  <rect x="292" y="416" width="400" height="88" fill="#ffffff" stroke="#6b4b9a" stroke-width="1.4"/>
  <text x="306" y="442" font-size="12.5" fill="#12314f">events_waits_current</text>
  <text x="306" y="460" font-size="12.5" fill="#12314f">events_waits_history / summary 一族</text>
  <text x="306" y="484" font-size="11.5" fill="#5a6b7c">stage 一族三个消费者也全关</text>
  <rect x="712" y="416" width="344" height="88" fill="#fbeaea" stroke="#a84040" stroke-width="1.2"/>
  <text x="726" y="438" font-size="12" font-weight="bold" fill="#6d1f1f">现场：0 行</text>
  <text x="726" y="458" font-size="12" fill="#6d1f1f">events_waits_current 默认 NO</text>
  <text x="726" y="478" font-size="12" fill="#6d1f1f">表空是默认配置的结果</text>
  <text x="726" y="496" font-size="11.5" fill="#6d1f1f">不是"没有发生过等待"</text>
  <path d="M 272 460 L 290 460" stroke="#6b4b9a" stroke-width="1.8"/>
  <path d="M 282 455 L 291 460 L 282 465" fill="none" stroke="#6b4b9a" stroke-width="1.8"/>
  <path d="M 692 460 L 710 460" stroke="#6b4b9a" stroke-width="1.8"/>
  <path d="M 702 455 L 711 460 L 702 465" fill="none" stroke="#6b4b9a" stroke-width="1.8"/>

  <rect x="24" y="514" width="248" height="88" fill="#f2edfa" stroke="#6b4b9a" stroke-width="1.4"/>
  <text x="38" y="538" font-size="12.5" font-weight="bold" fill="#3a2560">症状 5：事务、内存、锁</text>
  <text x="38" y="558" font-size="12" fill="#3a2560">回滚量 / 常驻大头</text>
  <text x="38" y="578" font-size="11.5" fill="#3a2560">谁挡住谁</text>
  <rect x="292" y="514" width="400" height="88" fill="#ffffff" stroke="#6b4b9a" stroke-width="1.4"/>
  <text x="306" y="538" font-size="12.5" fill="#12314f">events_transactions_current</text>
  <text x="306" y="558" font-size="12.5" fill="#12314f">memory_summary_global_by_event_name</text>
  <text x="306" y="578" font-size="12.5" fill="#12314f">data_lock_waits 关联 data_locks</text>
  <text x="306" y="596" font-size="11.5" fill="#5a6b7c">行锁一族不在插桩表里；MDL 与表锁那两项默认 YES</text>
  <rect x="712" y="514" width="344" height="88" fill="#f0f2f5" stroke="#5a6b7c" stroke-width="1.2"/>
  <text x="726" y="538" font-size="12" fill="#12314f">现场：transactions 3 行</text>
  <text x="726" y="558" font-size="12" fill="#12314f">空载，无锁等待样本</text>
  <text x="726" y="578" font-size="12" fill="#12314f">内存按当前占用倒序前三</text>
  <text x="726" y="596" font-size="11.5" fill="#5a6b7c">见正文的三条常驻读数</text>
  <path d="M 272 558 L 290 558" stroke="#6b4b9a" stroke-width="1.8"/>
  <path d="M 282 553 L 291 558 L 282 563" fill="none" stroke="#6b4b9a" stroke-width="1.8"/>
  <path d="M 692 558 L 710 558" stroke="#6b4b9a" stroke-width="1.8"/>
  <path d="M 702 553 L 711 558 L 702 563" fill="none" stroke="#6b4b9a" stroke-width="1.8"/>

  <rect x="24" y="622" width="1032" height="84" fill="#fff6e8" stroke="#b07d2a" stroke-width="1.4"/>
  <text x="40" y="646" font-size="13" font-weight="bold" fill="#6b4708">两级开关与一条同源判据：决定"能不能查到"的是这两张表，不是被查的那张</text>
  <text x="40" y="668" font-size="12" fill="#6b4708">插桩侧实测共 1250 行，ENABLED 为 YES 的 773 行；消费者侧共 16 项，ENABLED 为 YES 的只有 7 项</text>
  <text x="40" y="690" font-size="12" fill="#6b4708">同项对不齐的真相：同一条语句里对同一列求值两次读出 473412057 与 473412169；视图列名也不同，照原表列名查报 ERROR 1054</text>

  <text x="24" y="726" font-size="11.5" fill="#8a99a8">判据收成一句：任何一张表读到空，先回来看它的消费者在不在那 7 项里；在，才轮到判断"确实没发生"</text>
</svg>
