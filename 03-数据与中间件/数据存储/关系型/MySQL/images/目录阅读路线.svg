<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="myRouteA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">MySQL 目录阅读路线：十四篇、两条主轴、两条线</text>
  <text x="500" y="55" text-anchor="middle" font-size="13" fill="#64748b">编号与视角取自第三节学习路径表；两条线与「②③ / ⑤⑥⑦ 成对读」取自第三节引言；域归属取自第一节表；框内小字是视角摘要</text>

  <text x="40" y="92" font-size="13" font-weight="bold" fill="#1e3a8a">用法线 ①→③→⑤：解决"怎么写"</text>
  <rect x="40" y="102" width="200" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="140" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">① 架构与执行链路</text>
  <text x="140" y="147" text-anchor="middle" font-size="11" fill="#1d4ed8">分层 · 一条 SQL 链路 · 连接池</text>
  <line x1="244" y1="131" x2="391" y2="131" stroke="#334155" stroke-width="1.8" marker-end="url(#myRouteA)"/>
  <rect x="395" y="102" width="200" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="495" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">③ 查询优化</text>
  <text x="495" y="147" text-anchor="middle" font-size="11" fill="#1d4ed8">选计划 · COUNT/排序/JOIN</text>
  <line x1="599" y1="131" x2="746" y2="131" stroke="#334155" stroke-width="1.8" marker-end="url(#myRouteA)"/>
  <rect x="750" y="102" width="200" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="850" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">⑤ 事务与隔离级别</text>
  <text x="850" y="147" text-anchor="middle" font-size="11" fill="#1d4ed8">ACID · 隔离级别 · 死锁</text>

  <text x="40" y="196" font-size="12.5" fill="#475569">两条主轴（成对读）：②③ 一对（索引与查询优化域）；⑤⑥⑦ 一对（事务与并发控制域）</text>
  <rect x="395" y="206" width="200" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="495" y="227" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">② 索引设计与EXPLAIN</text>
  <text x="495" y="247" text-anchor="middle" font-size="10.5" fill="#475569">B+Tree · 回表 · EXPLAIN 逐列</text>
  <line x1="495" y1="160" x2="495" y2="202" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="600" y="206" width="160" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="680" y="227" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">⑥ 并发控制实现</text>
  <text x="680" y="247" text-anchor="middle" font-size="10.5" fill="#475569">MVCC · ReadView · 锁体系</text>
  <line x1="764" y1="232" x2="786" y2="232" stroke="#334155" stroke-width="1.8" marker-end="url(#myRouteA)"/>
  <rect x="790" y="206" width="160" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="870" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">⑦ 锁等待与死锁排查</text>
  <text x="870" y="247" text-anchor="middle" font-size="10.5" fill="#475569">lock_waits · 死锁日志</text>
  <line x1="850" y1="160" x2="850" y2="202" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="40" y="300" font-size="13" font-weight="bold" fill="#7c2d12">运维线 ⑧⑨⑩⑬⑭：回答"上线后怎么不出事"</text>
  <rect x="40" y="310" width="176" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="128" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">⑧ 日志与持久化</text>
  <text x="128" y="355" text-anchor="middle" font-size="10.5" fill="#9a3412">redo/undo/binlog · 2PC</text>
  <line x1="220" y1="339" x2="242" y2="339" stroke="#334155" stroke-width="1.8" marker-end="url(#myRouteA)"/>
  <rect x="246" y="310" width="176" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="334" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">⑨ 复制与高可用</text>
  <text x="334" y="355" text-anchor="middle" font-size="10.5" fill="#9a3412">复制线程 · GTID · 半同步</text>
  <line x1="426" y1="339" x2="448" y2="339" stroke="#334155" stroke-width="1.8" marker-end="url(#myRouteA)"/>
  <rect x="452" y="310" width="190" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="547" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">⑩ 数据迁移与备份恢复</text>
  <text x="547" y="355" text-anchor="middle" font-size="10.5" fill="#9a3412">大表搬迁 · 不停服切 GTID · PITR</text>
  <line x1="646" y1="339" x2="668" y2="339" stroke="#334155" stroke-width="1.8" marker-end="url(#myRouteA)"/>
  <rect x="672" y="310" width="140" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="742" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">⑬ 参数调优</text>
  <text x="742" y="355" text-anchor="middle" font-size="10.5" fill="#9a3412">先判瓶颈 · 内存账 I/O 账</text>
  <line x1="816" y1="339" x2="838" y2="339" stroke="#334155" stroke-width="1.8" marker-end="url(#myRouteA)"/>
  <rect x="842" y="310" width="140" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="912" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">⑭ 观测与诊断</text>
  <text x="912" y="355" text-anchor="middle" font-size="10.5" fill="#9a3412">SLI/SLO · P_S 查表</text>

  <text x="40" y="406" font-size="12.5" fill="#475569">其余篇目按第一节的域归属挂接：</text>
  <rect x="240" y="386" width="220" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="350" y="407" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">④ 深分页与索引变更</text>
  <text x="350" y="426" text-anchor="middle" font-size="10.5" fill="#475569">索引与查询优化域 · 游标分页</text>
  <rect x="476" y="386" width="200" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="576" y="407" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">⑪ 数据建模</text>
  <text x="576" y="426" text-anchor="middle" font-size="10.5" fill="#475569">数据建模域 · 类型选型 · 反范式</text>
  <rect x="692" y="386" width="200" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="792" y="407" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">⑫ 分表与路由</text>
  <text x="792" y="426" text-anchor="middle" font-size="10.5" fill="#475569">数据建模域 · 分表键 · 扩容</text>

  <rect x="40" y="464" width="920" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="492" font-size="13.5" font-weight="bold" fill="#0f172a">读图前先记住的两条约定</text>
  <text x="60" y="522" font-size="12" fill="#334155">七域（第一节）：架构与执行链路 · 索引与查询优化 · 事务与并发控制 · 日志与持久化 · 复制与高可用 · 数据建模 · 运维与调优</text>
  <text x="60" y="550" font-size="12" fill="#334155">边界（第三节引言）：本目录只放 InnoDB 专属机制；乐观锁/悲观锁、MVCC 原理、隔离级别标准等跨产品通用理论在「并发控制」目录</text>
  <text x="60" y="578" font-size="11.5" fill="#94a3b8">版本坐标：CTE、窗口函数、Hash Join、降序索引、不可见索引、多值索引、Clone、MGR 等均为《高性能 MySQL》第 4 版没有的内容（第二节表）</text>
</svg>
