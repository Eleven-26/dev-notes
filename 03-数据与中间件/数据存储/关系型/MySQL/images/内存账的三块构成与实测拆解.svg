<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 754" width="1000" height="754" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="754" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">内存账：buffer pool 只是其中一块</text>
  <text x="500" y="50" text-anchor="middle" font-size="12.5" fill="#64748b">MySQL 8.0.46 默认配置实例（128 MB 池、max_connections = 151）的构成与实测拆解</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="960" height="178" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" font-size="14" font-weight="bold" fill="#0f172a">A. 峰值内存由三块组成，buffer pool 只是第一块</text>

    <rect x="16" y="40" width="300" height="88" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="30" y="62" font-size="12" font-weight="bold" fill="#1e40af">① buffer pool（固定池子）</text>
    <text x="30" y="84" font-size="10.5" fill="#1e40af">默认 134217728 B = 128 MB</text>
    <text x="30" y="104" font-size="10.5" fill="#334155">按工作集给足，专用实例常配到内存的 50%~75%</text>
    <text x="30" y="122" font-size="10.5" fill="#334155">Dynamic=Yes，按 chunk 在线扩缩</text>

    <rect x="332" y="40" width="300" height="88" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
    <text x="346" y="62" font-size="12" font-weight="bold" fill="#9a3412">② 连接级缓冲（每连接一份）</text>
    <text x="346" y="84" font-size="10.5" fill="#334155">sort 256 KB + join 256 KB</text>
    <text x="346" y="104" font-size="10.5" fill="#334155">read 128 KB + read_rnd 256 KB = 896 KB</text>
    <text x="346" y="122" font-size="10.5" font-weight="bold" fill="#9a3412">最坏值 = max_connections × 896 KB</text>

    <rect x="648" y="40" width="296" height="88" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="662" y="62" font-size="12" font-weight="bold" fill="#991b1b">③ OS 页缓存 + 监控 / 备份</text>
    <text x="662" y="84" font-size="10.5" fill="#334155">InnoDB 读写默认仍经过 OS page cache</text>
    <text x="662" y="104" font-size="10.5" fill="#334155">内存全给 buffer pool → 全表扫与备份读盘变慢</text>

    <text x="16" y="150" font-size="11.5" fill="#334155">公式：峰值内存 ≈ innodb_buffer_pool_size + max_connections × Σ(会话级缓冲) + OS 页缓存 + 监控/备份进程</text>
    <text x="16" y="170" font-size="11.5" fill="#9a3412">要点：max_connections 从 151 调到 5000，连接级最坏内存从 132 MB 涨到约 4400 MB —— 它不是「允许更多连接」。</text>
  </g>

  <g transform="translate(20,268)">
    <rect x="0" y="0" width="960" height="306" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" font-size="14" font-weight="bold" fill="#0f172a">B. 实测：RSS 466408 kB 里，buffer pool 只占 130.88 MiB</text>
    <text x="16" y="44" font-size="10.5" fill="#64748b">memory_summary_global_by_event_name 的 Top 项，条形按 MiB 等比（满格 218.76 MiB）</text>

    <rect x="300" y="62" width="480" height="18" rx="3" fill="#ea580c" stroke="#ea580c" stroke-width="1"/>
    <text x="16" y="75" font-size="10.5" font-weight="bold" fill="#0f172a">memory/performance_schema/* 合计</text>
    <text x="788" y="75" font-size="10" font-weight="bold" fill="#ea580c">218.76 MiB（229383592 B）</text>

    <rect x="300" y="92" width="287" height="18" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
    <text x="16" y="105" font-size="10.5" font-weight="bold" fill="#0f172a">memory/innodb/buf_buf_pool</text>
    <text x="595" y="105" font-size="10" font-weight="bold" fill="#2563eb">130.88 MiB（137236480 B）</text>

    <rect x="300" y="122" width="88" height="18" rx="3" fill="#fdba74" stroke="#ea580c" stroke-width="1"/>
    <text x="16" y="135" font-size="10.5" fill="#334155">其中 digest 表（10000 容量 / 6 行）</text>
    <text x="396" y="135" font-size="10" fill="#9a3412">40.28 MiB（42240000 B）</text>

    <rect x="300" y="152" width="32" height="18" rx="3" fill="#fdba74" stroke="#ea580c" stroke-width="1"/>
    <text x="16" y="165" font-size="10.5" fill="#334155">其中 events_statements_history_long</text>
    <text x="340" y="165" font-size="10" fill="#9a3412">14.42 MiB</text>

    <rect x="300" y="182" width="53" height="18" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <text x="16" y="195" font-size="10.5" fill="#334155">memory/innodb/ut0link_buf</text>
    <text x="361" y="195" font-size="10" fill="#475569">24.00 MiB</text>

    <rect x="300" y="212" width="35" height="18" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <text x="16" y="225" font-size="10.5" fill="#334155">memory/innodb/log_buffer_memory</text>
    <text x="343" y="225" font-size="10" fill="#475569">16.00 MiB</text>

    <rect x="300" y="242" width="18" height="18" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <text x="16" y="255" font-size="10.5" fill="#334155">memory/mysys/KEY_CACHE</text>
    <text x="326" y="255" font-size="10" fill="#475569">8.00 MiB</text>

    <text x="16" y="282" font-size="11.5" fill="#334155">要点：performance_schema 自己的常驻内存 218.76 MiB 比 buffer pool 的 128 MiB 还大 —— 它启动时按容量参数预分配，跟库里放几行数据无关。</text>
    <text x="16" y="300" font-size="11.5" fill="#9a3412">注意：RSS 随负载涨落（同一容器两个时刻实测 398256 kB 与 466408 kB），只有「PS 常驻 &gt; buffer pool」这个结构性结论是稳的。</text>
  </g>

  <g transform="translate(20,594)">
    <rect x="0" y="0" width="960" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" font-size="14" font-weight="bold" fill="#0f172a">C. 三块各自怎么定大小</text>

    <rect x="16" y="38" width="928" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="32" y="57" font-size="11.5" font-weight="bold" fill="#1e40af">① buffer pool</text>
    <text x="200" y="57" font-size="11.5" fill="#334155">按工作集定，不是按数据总量：数据 500 GB、热点 60 GB 时，给到 64 GB 就够</text>

    <rect x="16" y="70" width="928" height="28" rx="4" fill="#ffedd5" stroke="#fdba74" stroke-width="1"/>
    <text x="32" y="89" font-size="11.5" font-weight="bold" fill="#9a3412">② 连接级缓冲</text>
    <text x="200" y="89" font-size="11.5" fill="#334155">只在单条语句出现 Sort_merge_passes 增长时用 hint / session 局部调，不要全局调大</text>

    <rect x="16" y="102" width="928" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="32" y="121" font-size="11.5" font-weight="bold" fill="#991b1b">③ OS 页缓存</text>
    <text x="200" y="121" font-size="11.5" fill="#334155">宁可 buffer pool 小一点，也不要让系统进到 swap 或 OOM —— OOM killer 挑的是 mysqld</text>
  </g>
</svg>
