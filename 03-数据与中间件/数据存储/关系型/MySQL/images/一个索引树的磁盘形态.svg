  <line x1="355" y1="180" x2="400" y2="210" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arw)"/>
  <line x1="94" y1="252" x2="408" y2="252" stroke="#ea580c" stroke-width="1.4" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <line x1="94" y1="244" x2="94" y2="252" stroke="#ea580c" stroke-width="1.1"/>
  <line x1="196" y1="244" x2="196" y2="252" stroke="#ea580c" stroke-width="1.1"/>
  <line x1="306" y1="244" x2="306" y2="252" stroke="#ea580c" stroke-width="1.1"/>
  <line x1="408" y1="244" x2="408" y2="252" stroke="#ea580c" stroke-width="1.1"/>
  <text x="255" y="268" font-size="9.6" fill="#ea580c" text-anchor="middle">叶子层双向链表（PREV / NEXT 页号）：范围扫描顺着它走，不回头根</text>
  <text x="255" y="284" font-size="9.4" fill="#64748b" text-anchor="middle">（只画 4 片叶子；实际成百上千，页号在右边都能找到）</text>
  <text x="30" y="308" font-size="9.6" fill="#64748b" text-anchor="start">树高 = 根到叶经过的页数；根页几乎总在内存里 → 一次查询 2~3 次 IO（1.2）</text>
  <text x="520" y="84" font-size="12" fill="#ea580c" text-anchor="start" font-weight="bold">② 物理上：散落在表空间里的一堆页</text>
  <rect x="520" y="94" width="450" height="216" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="536" y="114" font-size="9.6" fill="#64748b" text-anchor="start">一个 .ibd 文件（或系统表空间）—— 所有索引都住在这里</text>
  <rect x="536" y="128" width="60" height="24" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="566" y="144" font-size="9" fill="#cbd5e1" text-anchor="middle">…</text>
