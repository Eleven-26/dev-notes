  <rect x="604" y="256" width="60" height="24" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.1"/>
  <text x="634" y="272" font-size="9" fill="#ea580c" text-anchor="middle" font-weight="bold" font-family="Consolas, Menlo, monospace">#129</text>
  <rect x="672" y="256" width="60" height="24" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="702" y="272" font-size="9" fill="#cbd5e1" text-anchor="middle">…</text>
  <rect x="740" y="256" width="60" height="24" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="770" y="272" font-size="9" fill="#cbd5e1" text-anchor="middle">…</text>
  <rect x="808" y="256" width="60" height="24" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="838" y="272" font-size="9" fill="#cbd5e1" text-anchor="middle">…</text>
  <rect x="876" y="256" width="60" height="24" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.1"/>
  <text x="906" y="272" font-size="9" fill="#ea580c" text-anchor="middle" font-weight="bold" font-family="Consolas, Menlo, monospace">#201</text>
  <rect x="520" y="326" width="12" height="10" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="538" y="335" font-size="9.6" fill="#64748b" text-anchor="start">非叶段的页</text>
  <rect x="646" y="326" width="12" height="10" rx="2" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="664" y="335" font-size="9.6" fill="#64748b" text-anchor="start">叶段的页</text>
  <rect x="772" y="326" width="12" height="10" rx="2" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="790" y="335" font-size="9.6" fill="#64748b" text-anchor="start">别的索引 / 别的表占的页</text>
  <text x="520" y="356" font-size="9.6" fill="#64748b" text-anchor="start">区（extent）= 1 MB = 64 个 16 KB 页；段按区扩容，区与区不保证相邻</text>
  <text x="520" y="374" font-size="9.6" fill="#ea580c" text-anchor="start">→ 同一个段的两页，可能隔着半个文件，全靠页号串着</text>
  <text x="30" y="398" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="bold">所以多一棵索引树，同时多付这几笔账：</text>
  <rect x="30" y="408" width="224" height="66" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="44" y="428" font-size="11" fill="#2563eb" text-anchor="start" font-weight="bold">写放大</text>
  <text x="44" y="448" font-size="9.4" fill="#0f172a" text-anchor="start">INSERT 一行要写 N+1 棵树</text>
  <text x="44" y="465" font-size="9.4" fill="#64748b" text-anchor="start">改索引列＝标记删＋插新</text>
  <rect x="266" y="408" width="224" height="66" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.1"/>
  <text x="280" y="428" font-size="11" fill="#ea580c" text-anchor="start" font-weight="bold">空间</text>
  <text x="280" y="448" font-size="9.4" fill="#0f172a" text-anchor="start">每棵树两个段起步</text>
  <text x="280" y="465" font-size="9.4" fill="#64748b" text-anchor="start">叶子还塞主键，主键越长越胖</text>
  <rect x="502" y="408" width="224" height="66" rx="7" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.1"/>
  <text x="516" y="428" font-size="11" fill="#7e22ce" text-anchor="start" font-weight="bold">缓冲池</text>
  <text x="516" y="448" font-size="9.4" fill="#0f172a" text-anchor="start">所有索引页抢一块 buffer pool</text>
  <text x="516" y="465" font-size="9.4" fill="#64748b" text-anchor="start">多一棵树＝少一份热数据</text>
  <rect x="738" y="408" width="224" height="66" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.1"/>
  <text x="752" y="428" font-size="11" fill="#dc2626" text-anchor="start" font-weight="bold">DDL 与锁</text>
  <text x="752" y="448" font-size="9.4" fill="#0f172a" text-anchor="start">加索引＝扫全表建一棵新树</text>
  <text x="752" y="465" font-size="9.4" fill="#64748b" text-anchor="start">改索引列，新老索引项都要锁</text>
  <rect x="24" y="480" width="952" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="496" font-size="10.4" fill="#0f172a" text-anchor="start">每建一个索引，是在问「这条查询值不值得一棵树」——树要跟着每次写入一起长、一起锁、一起抢缓冲池。</text>
  <text x="40" y="511" font-size="10.4" fill="#64748b" text-anchor="start">「先建上，说不定以后用得上」是纯负债：空间、写放大、缓冲池全在付，收益为零。</text>
</svg>
