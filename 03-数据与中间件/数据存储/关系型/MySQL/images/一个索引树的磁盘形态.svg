  <rect x="808" y="192" width="60" height="24" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="838" y="208" font-size="9" fill="#cbd5e1" text-anchor="middle">…</text>
  <rect x="876" y="192" width="60" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="906" y="208" font-size="9" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, Menlo, monospace">#9</text>
  <rect x="536" y="224" width="60" height="24" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="566" y="240" font-size="9" fill="#cbd5e1" text-anchor="middle">…</text>
  <rect x="604" y="224" width="60" height="24" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="634" y="240" font-size="9" fill="#cbd5e1" text-anchor="middle">…</text>
  <rect x="672" y="224" width="60" height="24" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.1"/>
  <text x="702" y="240" font-size="9" fill="#ea580c" text-anchor="middle" font-weight="bold" font-family="Consolas, Menlo, monospace">#77</text>
  <rect x="740" y="224" width="60" height="24" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
