<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 522" width="1000" height="522" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="522" fill="#ffffff"/>
  <text x="500" y="30" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">一个索引 = 一棵树，但「一棵」不等于「一块」</text>
  <text x="500" y="52" font-size="12.2" fill="#64748b" text-anchor="middle">逻辑上从 1 个根页往下分叉；物理上是 2 个段、若干 1 MB 的区、靠页号串起来的一堆 16 KB 页</text>
  <text x="30" y="84" font-size="12" fill="#2563eb" text-anchor="start" font-weight="bold">① 逻辑上：一棵从根页分叉的树</text>
  <rect x="195" y="94" width="120" height="32" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="255" y="115" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, Menlo, monospace">root  #4</text>
  <text x="325" y="108" font-size="9.4" fill="#64748b" text-anchor="start">根页号记在数据字典里</text>
  <text x="325" y="121" font-size="9.4" fill="#64748b" text-anchor="start">（不是文件路径）</text>
  <rect x="120" y="152" width="100" height="28" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="170" y="171" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, Menlo, monospace">分支  #7</text>
  <rect x="285" y="152" width="100" height="28" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="335" y="171" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, Menlo, monospace">分支  #9</text>
  <line x1="245" y1="126" x2="175" y2="150" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arw)"/>
  <line x1="265" y1="126" x2="330" y2="150" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="50" y="212" width="88" height="32" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="1"/>
  <text x="94" y="232" font-size="10.2" fill="#0f172a" text-anchor="middle" font-family="Consolas, Menlo, monospace">叶子 #31</text>
  <rect x="152" y="212" width="88" height="32" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="1"/>
  <text x="196" y="232" font-size="10.2" fill="#0f172a" text-anchor="middle" font-family="Consolas, Menlo, monospace">叶子 #52</text>
