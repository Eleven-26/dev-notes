  <text x="838" y="240" font-size="9" fill="#ea580c" text-anchor="middle" font-weight="bold" font-family="Consolas, Menlo, monospace">#108</text>
  <rect x="876" y="224" width="60" height="24" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
