  <rect x="876" y="160" width="60" height="24" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="906" y="176" font-size="9" fill="#cbd5e1" text-anchor="middle">…</text>
  <rect x="536" y="192" width="60" height="24" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.1"/>
  <text x="566" y="208" font-size="9" fill="#ea580c" text-anchor="middle" font-weight="bold" font-family="Consolas, Menlo, monospace">#52</text>
  <rect x="604" y="192" width="60" height="24" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="634" y="208" font-size="9" fill="#cbd5e1" text-anchor="middle">…</text>
  <rect x="672" y="192" width="60" height="24" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="702" y="208" font-size="9" fill="#cbd5e1" text-anchor="middle">…</text>
