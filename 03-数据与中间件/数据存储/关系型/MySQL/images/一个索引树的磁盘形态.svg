  <text x="408" y="232" font-size="10.2" fill="#0f172a" text-anchor="middle" font-family="Consolas, Menlo, monospace">叶子 #108</text>
  <line x1="150" y1="180" x2="100" y2="210" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arw)"/>
  <line x1="190" y1="180" x2="190" y2="210" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arw)"/>
