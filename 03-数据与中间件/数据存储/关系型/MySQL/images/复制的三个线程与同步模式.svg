<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 776" width="1000" height="776" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="776" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">复制的三个线程与同步模式</text>
  <text x="500" y="50" text-anchor="middle" font-size="13" fill="#64748b">主库把 binlog 发给从库，从库重放它</text>

  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="960" height="306" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" font-size="14" font-weight="bold" fill="#0f172a">三个线程 + 一条 relay log：完整时序</text>

    <rect x="160" y="40" width="180" height="34" rx="6" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="250" y="62" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">主库（source）</text>

    <rect x="660" y="40" width="180" height="34" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
    <text x="750" y="62" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#047857">从库（replica）</text>

    <line x1="250" y1="76" x2="250" y2="252" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
    <line x1="750" y1="76" x2="750" y2="252" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>

    <text x="40" y="112" font-size="11.5" fill="#1d4ed8">应用提交事务 →</text>
    <text x="40" y="132" font-size="11.5" fill="#1d4ed8">主库写 binlog</text>

    <line x1="746" y1="120" x2="256" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
    <text x="500" y="112" text-anchor="middle" font-size="11.5" fill="#334155">① IO 线程：请求「某位点之后的事件」</text>

    <line x1="254" y1="192" x2="744" y2="192" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
    <text x="500" y="184" text-anchor="middle" font-size="11.5" fill="#334155">② dump 线程：读 binlog，推送事件给从库</text>

    <text x="770" y="118" font-size="11.5" fill="#047857">③ IO 线程写 relay log</text>
    <text x="770" y="138" font-size="11.5" fill="#047857">　 并更新 master_info</text>
    <text x="770" y="186" font-size="11.5" fill="#047857">④ SQL 线程读 relay log</text>
    <text x="770" y="206" font-size="11.5" fill="#047857">　 重放 + 更新 relay_log_info</text>

    <text x="16" y="278" font-size="11.5" fill="#334155">⭐ 复制完全是「拉」的：主库并不知道从库同步到哪（异步下），它只是被动响应请求 —— 这是主库挂了可能丢数据的机制性原因。</text>
    <text x="16" y="298" font-size="11.5" fill="#334155">位点信息有两份：master_info（收到哪）与 relay_log_info（重放到哪），Seconds_Behind_Master 本质是这两者的差距。</text>
  </g>

  <g transform="translate(20,396)">
    <rect x="0" y="0" width="960" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" font-size="14" font-weight="bold" fill="#0f172a">异步 / 半同步 / 全同步：主库什么时候算「提交成功」</text>

    <rect x="16" y="40" width="296" height="136" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="164" y="64" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#dc2626">异步（默认）</text>
    <text x="32" y="92" font-size="11.5" fill="#334155">写完自己的 binlog 就返回</text>
    <text x="32" y="118" font-size="11.5" fill="#dc2626">风险：主库宕机可能丢已提交数据</text>
    <text x="32" y="144" font-size="11.5" fill="#334155">延迟影响：最小</text>

    <rect x="332" y="40" width="296" height="136" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
    <text x="480" y="64" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b45309">半同步</text>
    <text x="348" y="92" font-size="11.5" fill="#334155">等至少 N 个从库「收到」（不要求重放完）</text>
    <text x="348" y="118" font-size="11.5" fill="#b45309">风险：大幅降低</text>
    <text x="348" y="144" font-size="11.5" fill="#334155">延迟影响：多一个网络往返</text>

    <rect x="648" y="40" width="296" height="136" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
    <text x="796" y="64" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#047857">全同步 / 组复制（MGR）</text>
    <text x="664" y="92" font-size="11.5" fill="#334155">等多数派「应用」完成</text>
    <text x="664" y="118" font-size="11.5" fill="#047857">风险：基本不丢</text>
    <text x="664" y="144" font-size="11.5" fill="#334155">延迟影响：最大（受最慢节点影响）</text>
  </g>

  <g transform="translate(20,606)">
    <rect x="0" y="0" width="960" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" font-size="14" font-weight="bold" fill="#0f172a">半同步的等待点：5.6 与 5.7+ 是两回事</text>

    <rect x="16" y="40" width="456" height="94" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="64" font-size="12" font-weight="bold" fill="#64748b">5.6：AFTER_COMMIT</text>
    <text x="32" y="90" font-size="11.5" fill="#334155">先提交事务、再等从库 ACK</text>
    <text x="32" y="114" font-size="11.5" fill="#dc2626">等待期间别人已能读到 → 存在「幻读已提交数据」的窗口</text>

    <rect x="488" y="40" width="456" height="94" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
    <text x="504" y="64" font-size="12" font-weight="bold" fill="#047857">5.7+：AFTER_SYNC（默认）</text>
    <text x="504" y="90" font-size="11.5" fill="#334155">先等从库 ACK、再提交</text>
    <text x="504" y="114" font-size="11.5" fill="#047857">等待期间别人看不到 → 一致性更好</text>
  </g>
</svg>
