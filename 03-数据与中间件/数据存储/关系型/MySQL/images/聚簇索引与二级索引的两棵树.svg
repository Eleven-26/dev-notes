<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 516" width="1000" height="516" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="arwR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="516" fill="#ffffff"/>
  <text x="500" y="32" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">一张表就是一棵树：主键索引的叶子是数据，二级索引的叶子是主键</text>
  <text x="500" y="54" font-size="12.5" fill="#64748b" text-anchor="middle">所以按主键查只走一棵树，按二级索引查要走两棵 —— 多出来的那一次叫回表</text>
  <text x="40" y="88" font-size="12.5" fill="#2563eb" text-anchor="start" font-weight="bold">聚簇索引（clustered）：主键 B+Tree</text>
  <text x="40" y="106" font-size="10.8" fill="#64748b" text-anchor="start">叶子页 = 数据页，整行就住在这里</text>
  <rect x="150" y="118" width="210" height="40" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="158" y="124" width="58" height="28" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="187" y="143" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, Menlo, monospace">10</text>
  <rect x="224" y="124" width="58" height="28" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="253" y="143" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, Menlo, monospace">11</text>
  <rect x="290" y="124" width="58" height="28" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="319" y="143" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Consolas, Menlo, monospace">12</text>
  <text x="370" y="130" font-size="9.6" fill="#64748b" text-anchor="start">根页：只存键 +</text>
  <text x="370" y="144" font-size="9.6" fill="#64748b" text-anchor="start">4B 页号，不存行</text>
  <line x1="255" y1="158" x2="255" y2="182" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arw)"/>
  <rect x="40" y="184" width="430" height="152" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="40" y="184" width="430" height="24" rx="9" fill="#dbeafe" stroke="none" stroke-width="1"/>
  <text x="54" y="200" font-size="10.5" fill="#2563eb" text-anchor="start" font-weight="bold">叶子页（16 KB）—— 页头 · 记录 · 空闲 · 页目录</text>
  <rect x="52" y="216" width="406" height="25" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="62" y="232" font-size="10.5" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="Consolas, Menlo, monospace">id=10</text>
  <text x="124" y="232" font-size="10.5" fill="#0f172a" text-anchor="start">张伟</text>
  <text x="196" y="232" font-size="10.5" fill="#0f172a" text-anchor="start" font-family="Consolas, Menlo, monospace">BJ</text>
  <text x="246" y="232" font-size="10.5" fill="#0f172a" text-anchor="start" font-family="Consolas, Menlo, monospace">28</text>
  <text x="300" y="232" font-size="9.4" fill="#64748b" text-anchor="start">…其余列也在这行里…</text>
  <rect x="52" y="245" width="406" height="25" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="62" y="261" font-size="10.5" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="Consolas, Menlo, monospace">id=11</text>
  <text x="124" y="261" font-size="10.5" fill="#0f172a" text-anchor="start">王芳</text>
  <text x="196" y="261" font-size="10.5" fill="#0f172a" text-anchor="start" font-family="Consolas, Menlo, monospace">SH</text>
  <text x="246" y="261" font-size="10.5" fill="#0f172a" text-anchor="start" font-family="Consolas, Menlo, monospace">31</text>
  <text x="300" y="261" font-size="9.4" fill="#64748b" text-anchor="start">…其余列也在这行里…</text>
  <rect x="52" y="274" width="406" height="25" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="62" y="290" font-size="10.5" fill="#2563eb" text-anchor="start" font-weight="bold" font-family="Consolas, Menlo, monospace">id=12</text>
  <text x="124" y="290" font-size="10.5" fill="#0f172a" text-anchor="start">李娜</text>
  <text x="196" y="290" font-size="10.5" fill="#0f172a" text-anchor="start" font-family="Consolas, Menlo, monospace">GZ</text>
  <text x="246" y="290" font-size="10.5" fill="#0f172a" text-anchor="start" font-family="Consolas, Menlo, monospace">24</text>
  <text x="300" y="290" font-size="9.4" fill="#64748b" text-anchor="start">…其余列也在这行里…</text>
  <text x="54" y="328" font-size="9.6" fill="#64748b" text-anchor="start">页内记录按主键有序，页目录（slot）指向每 4~8 条记录 → 页内可二分</text>
  <text x="560" y="88" font-size="12.5" fill="#ea580c" text-anchor="start" font-weight="bold">二级索引（secondary）：idx_city 的 B+Tree</text>
  <text x="560" y="106" font-size="10.8" fill="#64748b" text-anchor="start">叶子页只有索引列 + 主键，没有 name / age</text>
  <rect x="620" y="118" width="210" height="40" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <rect x="628" y="124" width="58" height="28" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1"/>
  <text x="657" y="143" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="bold" font-family="Consolas, Menlo, monospace">BJ</text>
  <rect x="694" y="124" width="58" height="28" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1"/>
  <text x="723" y="143" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="bold" font-family="Consolas, Menlo, monospace">GZ</text>
  <rect x="760" y="124" width="58" height="28" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1"/>
  <text x="789" y="143" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="bold" font-family="Consolas, Menlo, monospace">SH</text>
  <text x="840" y="130" font-size="9.6" fill="#64748b" text-anchor="start">根页：只存键 +</text>
  <text x="840" y="144" font-size="9.6" fill="#64748b" text-anchor="start">4B 页号，不存行</text>
  <line x1="725" y1="158" x2="725" y2="182" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arw)"/>
  <rect x="530" y="184" width="440" height="152" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="530" y="184" width="440" height="24" rx="9" fill="#ffedd5" stroke="none" stroke-width="1"/>
  <text x="544" y="200" font-size="10.5" fill="#ea580c" text-anchor="start" font-weight="bold">叶子页（同样是 16 KB）—— 但每条记录只两列</text>
  <rect x="542" y="216" width="416" height="23" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="552" y="232" font-size="10.5" fill="#ea580c" text-anchor="start" font-weight="bold" font-family="Consolas, Menlo, monospace">city=BJ</text>
  <text x="618" y="232" font-size="10.5" fill="#64748b" text-anchor="start">→</text>
  <text x="636" y="232" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="bold" font-family="Consolas, Menlo, monospace">id=10</text>
  <text x="700" y="232" font-size="9.4" fill="#64748b" text-anchor="start">（主键，不是行地址）</text>
  <rect x="542" y="243" width="416" height="23" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="552" y="259" font-size="10.5" fill="#ea580c" text-anchor="start" font-weight="bold" font-family="Consolas, Menlo, monospace">city=GZ</text>
  <text x="618" y="259" font-size="10.5" fill="#64748b" text-anchor="start">→</text>
  <text x="636" y="259" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="bold" font-family="Consolas, Menlo, monospace">id=12</text>
  <text x="700" y="259" font-size="9.4" fill="#64748b" text-anchor="start">（主键，不是行地址）</text>
  <rect x="542" y="270" width="416" height="23" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="552" y="286" font-size="10.5" fill="#ea580c" text-anchor="start" font-weight="bold" font-family="Consolas, Menlo, monospace">city=SH</text>
  <text x="618" y="286" font-size="10.5" fill="#64748b" text-anchor="start">→</text>
  <text x="636" y="286" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="bold" font-family="Consolas, Menlo, monospace">id=11</text>
  <text x="700" y="286" font-size="9.4" fill="#64748b" text-anchor="start">（主键，不是行地址）</text>
  <text x="544" y="328" font-size="9.6" fill="#64748b" text-anchor="start">按 city 只够定位到主键，拿不到整行 → 必须回表</text>
  <polyline points="750,336 750,352 255,352 255,342" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arwR)"/>
  <text x="495" y="378" font-size="10.8" fill="#dc2626" text-anchor="middle" font-weight="bold">回表：拿 id=10 回到左边这棵树，从头再下降一次</text>
  <rect x="24" y="396" width="952" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="418" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">三条推论，比图本身值钱：</text>
  <text x="40" y="440" font-size="10.8" fill="#64748b" text-anchor="start">① 一次二级索引查询的代价 = 两棵树的高度之和；覆盖索引的作用就是砍掉第二棵树（见 5.1）。</text>
  <text x="40" y="462" font-size="10.8" fill="#64748b" text-anchor="start">② 主键多长，每个二级索引的叶子就跟着变多长 —— 这是「UUID 当主键」最容易被忽略的代价。</text>
  <text x="40" y="484" font-size="10.8" fill="#64748b" text-anchor="start">③ 超长变长列（BLOB / TEXT）不在叶子页里：DYNAMIC 行格式下行内只留 20 B 指针，正文放在溢出页。</text>
</svg>
