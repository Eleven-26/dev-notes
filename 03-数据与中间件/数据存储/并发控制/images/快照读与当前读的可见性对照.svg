<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwA" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">快照读与当前读的可见性对照</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">同一事务、同一条记录：快照读停在快照那一刻，当前读跳到最新已提交版本</text>

  <line x1="70" y1="150" x2="930" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <path d="M930,150 L918,146 L918,154 Z" fill="#94a3b8"/>
  <text x="945" y="154" font-size="11" fill="#64748b">时间</text>

  <rect x="100" y="96" width="140" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" rx="6"/>
  <text x="170" y="115" font-size="11.5" font-weight="bold" fill="#1e40af" text-anchor="middle">① A：BEGIN</text>
  <text x="170" y="131" font-size="11" fill="#1e40af" text-anchor="middle">建立快照 stock=100</text>
  <line x1="170" y1="140" x2="170" y2="148" stroke="#2563eb" stroke-width="1.4"/>

  <rect x="360" y="96" width="140" height="44" fill="#fef3c7" stroke="#b45309" stroke-width="1.2" rx="6"/>
  <text x="430" y="115" font-size="11.5" font-weight="bold" fill="#92400e" text-anchor="middle">② B：UPDATE → 99</text>
  <text x="430" y="131" font-size="11" fill="#92400e" text-anchor="middle">直接提交，未被阻塞</text>
  <line x1="430" y1="140" x2="430" y2="148" stroke="#b45309" stroke-width="1.4"/>

  <rect x="590" y="96" width="150" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="6"/>
  <text x="665" y="115" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">③ A：SELECT</text>
  <text x="665" y="131" font-size="11" fill="#14532d" text-anchor="middle">读到 100（旧值）</text>
  <line x1="665" y1="140" x2="665" y2="148" stroke="#16a34a" stroke-width="1.4"/>

  <rect x="800" y="96" width="150" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" rx="6"/>
  <text x="875" y="115" font-size="11.5" font-weight="bold" fill="#991b1b" text-anchor="middle">④ A：FOR UPDATE</text>
  <text x="875" y="131" font-size="11" fill="#991b1b" text-anchor="middle">读到 99 并加锁</text>
  <line x1="875" y1="140" x2="875" y2="148" stroke="#dc2626" stroke-width="1.4"/>

  <rect x="70" y="164" width="860" height="66" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.1" rx="8"/>
  <text x="90" y="186" font-size="12.5" font-weight="bold" fill="#14532d">快照读（普通 SELECT）</text>
  <text x="90" y="208" font-size="11.5" fill="#334155">从 ① 建立的快照读 → ② 的提交对它不可见 → ③ 仍然读到 100；同时它不加任何行锁，所以 ② 不会被它挡住。</text>
  <line x1="170" y1="196" x2="660" y2="196" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwA)"/>

  <rect x="70" y="240" width="860" height="66" fill="#fef2f2" stroke="#dc2626" stroke-width="1.1" rx="8"/>
  <text x="90" y="262" font-size="12.5" font-weight="bold" fill="#991b1b">当前读（FOR UPDATE / UPDATE / DELETE）</text>
  <text x="90" y="284" font-size="11.5" fill="#334155">绕开快照，直接读最新已提交版本 → ④ 读到 99，并加上排他锁；它的行为与隔离级别无关。</text>
  <line x1="430" y1="272" x2="870" y2="272" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arwA)"/>

  <rect x="70" y="320" width="860" height="170" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="90" y="346" font-size="13" font-weight="bold" fill="#0f172a">三条结论</text>
  <text x="90" y="372" font-size="12" fill="#334155">① ② 没被阻塞、③ 与 ④ 不一致，都是预期行为：两种读法定义不同，不是 bug。</text>
  <text x="90" y="396" font-size="12" fill="#334155">② 换成 RC 时，③ 也会读到 99 —— 差别只在「快照每条语句建一次」还是「每个事务建一次」。</text>
  <text x="90" y="420" font-size="12" fill="#334155">③ 幻读只被快照读规避：新插入的行不在旧快照里，看不见自然不会幻；当前读要靠间隙锁挡住插入。</text>
  <text x="90" y="450" font-size="11.5" fill="#b45309">工程纪律：事务里前面读到的值不能默认后面还有效 —— 判断与修改要压进一条带条件的语句，或对读到的行显式加锁。</text>
  <text x="90" y="474" font-size="11.5" fill="#b45309">线程/事务越长，快照被钉得越久，旧版本越不能回收 —— 读变慢与空间膨胀都从这里来。</text>
</svg>
