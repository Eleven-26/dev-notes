<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">并发控制目录的分层地图与边界</text>
  <text x="500" y="54" font-size="12.5" fill="#64748b" text-anchor="middle">通用理论只取「思想 → 锁机制 → 机制 → 标准」四段；引擎专属向下沉，多机协调在目录之外</text>

  <rect x="180" y="70" width="640" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="500" y="90" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">上一层：存储架构与场景 —— 不同形态的数据该怎么存、怎么组合</text>
  <text x="500" y="108" font-size="10.5" fill="#64748b" text-anchor="middle">本目录只回答：同一份数据被并发读写时怎么办</text>

  <line x1="500" y1="116" x2="500" y2="136" stroke="#334155" stroke-width="1.5" marker-end="url(#a4)"/>

  <rect x="270" y="140" width="460" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="500" y="164" font-size="12.5" font-weight="bold" fill="#1e40af" text-anchor="middle">思想层：乐观锁与悲观锁</text>
  <text x="500" y="184" font-size="10.5" fill="#1e3a8a" text-anchor="middle">冲突是小概率还是常态？靠校验还是靠锁？</text>

  <rect x="270" y="206" width="460" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="500" y="230" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">锁机制层（通用）：锁的粒度与模式 · 死锁原理与防治</text>
  <text x="500" y="250" font-size="10.5" fill="#166534" text-anchor="middle">锁加在什么粒度？S / X 怎么兼容？死锁为什么会形成？</text>

  <rect x="270" y="272" width="460" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="500" y="296" font-size="12.5" font-weight="bold" fill="#9a3412" text-anchor="middle">机制层（通用）：MVCC 多版本并发控制 · 快照读与当前读</text>
  <text x="500" y="316" font-size="10.5" fill="#92400e" text-anchor="middle">多版本如何让读写不互斥？可见性怎么判？当前的读是哪一种？</text>

  <rect x="270" y="338" width="460" height="58" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="500" y="362" font-size="12.5" font-weight="bold" fill="#991b1b" text-anchor="middle">标准层：标准隔离级别与产品实现差异</text>
  <text x="500" y="382" font-size="10.5" fill="#7f1d1d" text-anchor="middle">标准的四个级别各自允许哪些异常？产品实现差在哪？</text>

  <line x1="500" y1="396" x2="500" y2="414" stroke="#334155" stroke-width="1.5"/>
  <line x1="260" y1="414" x2="740" y2="414" stroke="#334155" stroke-width="1.5"/>
  <line x1="260" y1="414" x2="260" y2="434" stroke="#334155" stroke-width="1.5" marker-end="url(#a4)"/>
  <line x1="740" y1="414" x2="740" y2="434" stroke="#334155" stroke-width="1.5" marker-end="url(#a4)"/>

  <rect x="60" y="438" width="400" height="76" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="260" y="460" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">引擎实现层（MySQL 目录 · 不提层）</text>
  <text x="260" y="480" font-size="10.5" fill="#334155" text-anchor="middle">InnoDB：意向锁 · 间隙锁 · 临键锁 · MDL</text>
  <text x="260" y="500" font-size="10.5" fill="#b91c1c" text-anchor="middle">只对某一个引擎成立的机制，不进本目录</text>

  <rect x="540" y="438" width="400" height="76" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="740" y="460" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">语言落地层（01-编程语言 分册）</text>
  <text x="740" y="480" font-size="10.5" fill="#334155" text-anchor="middle">Go：版本号 / 条件更新 / FOR UPDATE / 唯一索引</text>
  <text x="740" y="500" font-size="10.5" fill="#334155" text-anchor="middle">Java：JPA @Version / 锁提示 / 幂等</text>

  <rect x="30" y="526" width="940" height="56" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.1"/>
  <text x="46" y="548" font-size="12" font-weight="bold" fill="#3730a3">单机之外（不属于本目录）：多机之后，问题从「怎么并发读」变成「由谁负责写」</text>
  <text x="46" y="568" font-size="11" fill="#3730a3">谁写 → 选主（Raft / Paxos）；互斥 → 分布式锁；一组写要么全成要么全败 → 分布式事务；等级取舍 → 一致性与 CAP</text>

  <rect x="30" y="594" width="940" height="46" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="613" font-size="11.5" fill="#1e3a8a">收篇判据：间隙锁 / SKIP LOCKED / DB_TRX_ID 留 MySQL；版本链 / 快照隔离 / 写偏斜这类跨产品成立的概念才收进来。</text>
  <text x="46" y="632" font-size="11.5" fill="#1e3a8a">CAS、ABA、自旋与内存屏障在语言侧已有专门篇目（atomic操作.md 等），本目录只做指路，不重复成篇。</text>
</svg>
