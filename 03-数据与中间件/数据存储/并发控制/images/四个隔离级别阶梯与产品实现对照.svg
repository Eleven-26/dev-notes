<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">四个隔离级别阶梯与产品实现对照</text>
  <text x="500" y="54" font-size="12.5" fill="#64748b" text-anchor="middle">标准用「至少禁止哪些现象」定级别；产品卡钉在各自默认级别上（文档口径，非本机实测）</text>

  <rect x="30" y="76" width="940" height="252" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="31" y="77" width="948" height="32" rx="9" fill="#e2e8f0"/>
  <text x="46" y="99" font-size="13" font-weight="bold" fill="#0f172a">A 标准阶梯：级别 = 至少禁止哪些读异常（SQL-92；P1 脏读 / P2 不可重复读 / P3 幻读）</text>

  <rect x="50" y="240" width="210" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="155" y="266" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">READ UNCOMMITTED</text>
  <text x="155" y="288" font-size="11" fill="#64748b" text-anchor="middle">P1 P2 P3 全都允许</text>

  <rect x="280" y="200" width="210" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="385" y="226" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">READ COMMITTED</text>
  <text x="385" y="248" font-size="11" fill="#1e40af" text-anchor="middle">禁 P1；允许 P2 P3</text>

  <rect x="510" y="160" width="210" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="615" y="186" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">REPEATABLE READ</text>
  <text x="615" y="208" font-size="11" fill="#14532d" text-anchor="middle">禁 P1 P2；标准允许 P3</text>

  <rect x="740" y="120" width="210" height="64" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="845" y="146" font-size="12" font-weight="bold" fill="#9a3412" text-anchor="middle">SERIALIZABLE</text>
  <text x="845" y="168" font-size="11" fill="#9a3412" text-anchor="middle">P1 P2 P3 全禁止</text>

  <text x="46" y="316" font-size="11.5" fill="#334155">读法：标准说的是「至少要禁止这些」→ 允许实现更严格。所以「MySQL 的 RR 没有幻读」不违反标准，只是超出了对 RR 的最低要求。</text>

  <rect x="30" y="344" width="940" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="31" y="345" width="938" height="32" rx="9" fill="#e2e8f0"/>
  <text x="46" y="367" font-size="13" font-weight="bold" fill="#0f172a">B 产品：默认级别钉在哪一级、实现路线各是什么（文档口径）</text>

  <rect x="45" y="396" width="215" height="88" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="152" y="416" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">MySQL（InnoDB）</text>
  <text x="152" y="436" font-size="11" fill="#14532d" text-anchor="middle">默认 REPEATABLE READ</text>
  <text x="152" y="454" font-size="11" fill="#334155" text-anchor="middle">MVCC 快照 + 间隙锁</text>
  <text x="152" y="472" font-size="11" fill="#334155" text-anchor="middle">快照读旧版本 · 当前读加锁</text>

  <rect x="280" y="396" width="215" height="88" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="387" y="416" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">PostgreSQL</text>
  <text x="387" y="436" font-size="11" fill="#1e40af" text-anchor="middle">默认 READ COMMITTED</text>
  <text x="387" y="454" font-size="11" fill="#334155" text-anchor="middle">元组 xmin/xmax 的 MVCC</text>
  <text x="387" y="472" font-size="11" fill="#334155" text-anchor="middle">RR 即快照隔离 · S 用 SSI</text>

  <rect x="515" y="396" width="215" height="88" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="622" y="416" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Oracle</text>
  <text x="622" y="436" font-size="11" fill="#1e40af" text-anchor="middle">默认 READ COMMITTED</text>
  <text x="622" y="454" font-size="11" fill="#334155" text-anchor="middle">语句级读一致性 + 回滚段</text>
  <text x="622" y="472" font-size="11" fill="#334155" text-anchor="middle">SERIALIZABLE 走快照路线</text>

  <rect x="750" y="396" width="215" height="88" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
  <text x="857" y="416" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">SQL Server</text>
  <text x="857" y="436" font-size="11" fill="#1e40af" text-anchor="middle">默认 READ COMMITTED</text>
  <text x="857" y="454" font-size="11" fill="#334155" text-anchor="middle">默认加锁读</text>
  <text x="857" y="472" font-size="11" fill="#334155" text-anchor="middle">可选 RCSI 改变读写互斥</text>

  <rect x="30" y="510" width="940" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="532" font-size="13" font-weight="bold" fill="#0f172a">C SERIALIZABLE 的两条实现路线（并发度差别由此而来，而不是由级别名字决定）</text>
  <rect x="46" y="544" width="430" height="42" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="261" y="561" font-size="11.5" font-weight="bold" fill="#991b1b" text-anchor="middle">纯锁路线：严格两阶段锁（2PL）</text>
  <text x="261" y="578" font-size="10.5" fill="#7f1d1d" text-anchor="middle">读也要加锁 → 并发度低</text>
  <rect x="524" y="544" width="430" height="42" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="739" y="561" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">快照隔离 + 冲突检测（SSI）</text>
  <text x="739" y="578" font-size="10.5" fill="#166534" text-anchor="middle">不靠读锁、只在中冲突时中止 → 读多写少时并发高得多</text>

  <rect x="30" y="604" width="940" height="44" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="630" font-size="12" fill="#1e3a8a">三条结论：① 默认级别不同，同一段业务代码在两个库上的行为可能不同；② PG 的 RR 比标准更严（快照隔离无幻读）；③ 判级别不看名字，看它在哪种读法下禁了什么</text>
</svg>
