<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="g1" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">锁的粒度层级与意向锁的作用</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">粒度越细并发越高、锁管理越贵；意向锁让「表级锁」不必逐行扫描</text>

  <rect x="30" y="80" width="940" height="118" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="50" y="106" font-size="14" font-weight="bold" fill="#0f172a">三种粒度（由粗到细）</text>

  <rect x="60" y="120" width="250" height="52" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" rx="6"/>
  <text x="185" y="142" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">表锁：锁整张表</text>
  <text x="185" y="160" font-size="10.5" fill="#991b1b" text-anchor="middle">开销最小 · 并发最低</text>

  <rect x="375" y="120" width="250" height="52" fill="#fef3c7" stroke="#b45309" stroke-width="1.2" rx="6"/>
  <text x="500" y="142" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">页锁：锁一个数据页</text>
  <text x="500" y="160" font-size="10.5" fill="#92400e" text-anchor="middle">折中：粒度与开销之间</text>

  <rect x="690" y="120" width="250" height="52" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="6"/>
  <text x="815" y="142" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">行锁：锁单行</text>
  <text x="815" y="160" font-size="10.5" fill="#14532d" text-anchor="middle">并发最高 · 开销最大</text>

  <line x1="312" y1="146" x2="371" y2="146" stroke="#475569" stroke-width="1.5" marker-end="url(#g1)"/>
  <line x1="627" y1="146" x2="686" y2="146" stroke="#475569" stroke-width="1.5" marker-end="url(#g1)"/>
  <text x="500" y="190" font-size="11.5" fill="#64748b" text-anchor="middle">粒度越细 → 并发越高、锁管理开销越大；两层之间靠「意向锁」协调</text>

  <rect x="30" y="212" width="940" height="176" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="50" y="238" font-size="14" font-weight="bold" fill="#0f172a">意向锁解决了什么</text>

  <rect x="55" y="258" width="250" height="112" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2" rx="8"/>
  <text x="180" y="296" font-size="12.5" font-weight="bold" fill="#3730a3" text-anchor="middle">表级锁请求</text>
  <text x="180" y="318" font-size="11" fill="#3730a3" text-anchor="middle">要判断：表里还有行锁吗？</text>
  <text x="180" y="340" font-size="11" fill="#3730a3" text-anchor="middle">LOCK TABLES ... WRITE</text>

  <line x1="307" y1="314" x2="345" y2="314" stroke="#475569" stroke-width="1.5" marker-end="url(#g1)"/>

  <rect x="350" y="252" width="600" height="56" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" rx="8"/>
  <text x="368" y="276" font-size="12" font-weight="bold" fill="#991b1b">没有意向锁</text>
  <text x="368" y="295" font-size="11" fill="#334155">必须逐行扫描全部行锁 → O(行数)；上万把行锁时不可行</text>

  <rect x="350" y="318" width="600" height="56" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" rx="8"/>
  <text x="368" y="342" font-size="12" font-weight="bold" fill="#14532d">有意向锁</text>
  <text x="368" y="361" font-size="11" fill="#334155">只看表上那把 IS / IX → O(1) 直接判定</text>

  <rect x="30" y="404" width="940" height="76" fill="#fff7ed" stroke="#b45309" stroke-width="1.1" rx="10"/>
  <text x="50" y="428" font-size="12.5" fill="#334155">① 行上加锁前，先在表上加一把意向锁：IS = 打算加共享锁，IX = 打算加排他锁。</text>
  <text x="50" y="450" font-size="12.5" fill="#334155">② 意向锁之间互相兼容（IS 与 IX 不冲突），只用来拦表级锁，不拦行级锁。</text>
  <text x="50" y="472" font-size="12.5" fill="#b45309">③ 所以「两人各改一行」不会因为对方持了 IX 而互相阻塞 —— 意向锁不保护数据，保护的是判断效率。</text>
</svg>
