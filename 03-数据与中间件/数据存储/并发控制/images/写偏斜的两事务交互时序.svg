<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">写偏斜：两事务各读同一集合、各写不同行的交互时序</text>
  <text x="500" y="54" font-size="12.5" fill="#64748b" text-anchor="middle">值班医生场景示意（本篇第四节）——每一步单看都合法，合起来破坏「至少一名医生在岗」的跨行不变量</text>

  <rect x="60" y="72" width="180" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="150" y="97" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">事务 A（医生 A）</text>
  <rect x="410" y="72" width="180" height="40" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="500" y="90" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">在岗状态表</text>
  <text x="500" y="106" font-size="10" fill="#64748b" text-anchor="middle">约束：至少 1 人在岗</text>
  <rect x="760" y="72" width="180" height="40" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="850" y="97" font-size="13" font-weight="bold" fill="#9a3412" text-anchor="middle">事务 B（医生 B）</text>

  <line x1="150" y1="112" x2="150" y2="416" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="500" y1="112" x2="500" y2="416" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="850" y1="112" x2="850" y2="416" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>

  <line x1="150" y1="146" x2="460" y2="146" stroke="#334155" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="305" y="140" font-size="11.5" fill="#1e40af" text-anchor="middle">① 读：SELECT 在岗人数 = 2</text>

  <line x1="850" y1="192" x2="540" y2="192" stroke="#334155" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="695" y="186" font-size="11.5" fill="#9a3412" text-anchor="middle">② 读：同样查到 2 人在岗（合法快照）</text>

  <line x1="150" y1="238" x2="460" y2="238" stroke="#334155" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="305" y="232" font-size="11.5" fill="#1e40af" text-anchor="middle">③ 写：把自己那行改成「不在岗」</text>

  <line x1="850" y1="284" x2="540" y2="284" stroke="#334155" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="695" y="278" font-size="11.5" fill="#9a3412" text-anchor="middle">④ 写：把另一行改成「不在岗」（不同行，不冲突）</text>

  <line x1="150" y1="330" x2="460" y2="330" stroke="#334155" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="305" y="324" font-size="11.5" fill="#15803d" text-anchor="middle">⑤ COMMIT 成功</text>

  <line x1="850" y1="376" x2="540" y2="376" stroke="#334155" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="695" y="370" font-size="11.5" fill="#15803d" text-anchor="middle">⑥ COMMIT 成功：「先提交者获胜」不触发——没碰同一行</text>

  <line x1="500" y1="388" x2="500" y2="412" stroke="#334155" stroke-width="1.5" marker-end="url(#a3)"/>
  <rect x="360" y="416" width="280" height="42" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="500" y="434" font-size="12.5" font-weight="bold" fill="#991b1b" text-anchor="middle">0 人在岗</text>
  <text x="500" y="451" font-size="10.5" fill="#991b1b" text-anchor="middle">两次提交都合法，跨行不变量被破坏</text>

  <rect x="30" y="476" width="940" height="94" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="500" font-size="13" font-weight="bold" fill="#0f172a">为什么快照隔离挡不住</text>
  <text x="46" y="522" font-size="11.5" fill="#334155">它对「同一行的写写冲突」用先提交者获胜，可这里两个事务写的是不同的行；而它们各自的读都是合法快照。</text>
  <text x="46" y="542" font-size="11.5" fill="#334155">这类异常只有可串行化才能禁止——PostgreSQL 用 SSI 在快照隔离之上检测「读-写依赖环」，发现环就中止其中一个事务。</text>
  <text x="46" y="562" font-size="11.5" fill="#b91c1c">注意：把隔离级别从 RC 提到 RR 修不了它；「读出来判断再改」的非原子逻辑要靠自己兜。</text>

  <rect x="30" y="582" width="940" height="44" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="608" font-size="12" fill="#1e3a8a">记忆点：前三类异常是「读得不一致」，写偏斜是「读得一致但组合后不一致」——前者靠快照能解，后者必须靠可串行化。</text>
</svg>
