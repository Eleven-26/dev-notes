<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwA" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#475569"/>
    </marker>
    <marker id="arwG" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#16a34a"/>
    </marker>
    <marker id="arwR" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">MVCC 的可见性判定与两种快照时机</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">读取不是「拿最新」，而是从最新版本往回找第一个对本事务快照可见的版本</text>

  <rect x="30" y="80" width="450" height="230" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="255" y="106" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">一行数据的版本链</text>

  <rect x="60" y="128" width="120" height="52" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" rx="6"/>
  <text x="120" y="150" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">最新版本</text>
  <text x="120" y="170" font-size="11" fill="#991b1b" text-anchor="middle">trx 105</text>

  <line x1="182" y1="154" x2="214" y2="154" stroke="#475569" stroke-width="1.5" marker-end="url(#arwA)"/>

  <rect x="216" y="128" width="120" height="52" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2" rx="6"/>
  <text x="276" y="150" font-size="12" font-weight="bold" fill="#3730a3" text-anchor="middle">上一版本</text>
  <text x="276" y="170" font-size="11" fill="#3730a3" text-anchor="middle">trx 103</text>

  <line x1="338" y1="154" x2="370" y2="154" stroke="#475569" stroke-width="1.5" marker-end="url(#arwA)"/>

  <rect x="372" y="128" width="90" height="52" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="6"/>
  <text x="417" y="150" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">更早版本</text>
  <text x="417" y="170" font-size="11" fill="#14532d" text-anchor="middle">trx 99</text>

  <text x="255" y="206" font-size="12" fill="#334155" text-anchor="middle">每行带一个「最后修改它的事务号」和一个</text>
  <text x="255" y="226" font-size="12" fill="#334155" text-anchor="middle">指向旧版本的回滚指针，旧版本由此串成链</text>

  <rect x="60" y="244" width="390" height="50" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.1" rx="6"/>
  <text x="255" y="264" font-size="11.5" fill="#3730a3" text-anchor="middle">判定：沿链回溯，跳过「比本事务快照更新」与</text>
  <text x="255" y="282" font-size="11.5" fill="#3730a3" text-anchor="middle">「当时尚未提交」的版本，取第一个可见版本</text>

  <rect x="520" y="80" width="450" height="230" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="745" y="106" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">快照什么时候建立</text>

  <rect x="540" y="122" width="410" height="86" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" rx="8"/>
  <text x="556" y="144" font-size="12.5" font-weight="bold" fill="#1e40af">读已提交（RC）</text>
  <text x="556" y="166" font-size="11" fill="#334155">每条 SELECT 都重新建立快照。</text>
  <text x="556" y="186" font-size="11" fill="#334155">别人已提交的新值，下一次读就能看到。</text>
  <text x="556" y="203" font-size="11" fill="#2563eb">→ 可能出现不可重复读</text>

  <rect x="540" y="218" width="410" height="86" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" rx="8"/>
  <text x="556" y="240" font-size="12.5" font-weight="bold" fill="#14532d">可重复读（RR）</text>
  <text x="556" y="262" font-size="11" fill="#334155">事务内第一次 SELECT 建立一次，之后复用。</text>
  <text x="556" y="282" font-size="11" fill="#334155">整个事务看到同一个快照。</text>
  <text x="556" y="299" font-size="11" fill="#16a34a">→ 同一事务多次读结果一致</text>

  <rect x="30" y="330" width="940" height="160" fill="#fff7ed" stroke="#b45309" stroke-width="1.1" rx="10"/>
  <text x="50" y="356" font-size="13" font-weight="bold" fill="#92400e">三条容易记错的边界</text>
  <text x="50" y="382" font-size="12" fill="#334155">① 「无锁读取」只针对读：写与写之间仍然靠锁，MVCC 解决的是读写冲突，不是写写冲突。</text>
  <text x="50" y="406" font-size="12" fill="#334155">② 快照只对普通 SELECT（快照读）生效；FOR UPDATE / UPDATE / DELETE 是当前读，读最新值并加锁。</text>
  <text x="50" y="430" font-size="12" fill="#334155">③ 长事务会把快照钉住 → 旧版本无法回收、链越来越长，这是 MVCC 最真实的代价。</text>
  <text x="50" y="460" font-size="11.5" fill="#b45309">注：Read View 是 InnoDB 的术语，它不是 MVCC 的通用叫法；PostgreSQL 用元组自身的事务号判断可见性。</text>
</svg>
