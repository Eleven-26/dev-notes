<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">手段阶梯（从便宜到贵）与每一层都要过的兜底四问</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">左栏是加手段的顺序和它的代价，右栏是对任意一层都要问的四遍 —— 两栏要配对使用</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="470" height="390" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 手段阶梯：能轻不重</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">顺序来自 5.1，代价来自 5.2；起点是「单机」，一行未加手段</text>

    <rect x="14" y="58" width="442" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="26" y="76" font-size="11.5" font-weight="bold" fill="#1e40af">① 加缓存</text>
    <text x="120" y="76" font-size="10" fill="#1e40af">换来读变快</text>
    <text x="26" y="96" font-size="10" fill="#1e40af">代价：一致性窗口、穿透 / 击穿 / 雪崩</text>

    <rect x="14" y="112" width="442" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="26" y="130" font-size="11.5" font-weight="bold" fill="#1e40af">② 异步 / 队列</text>
    <text x="150" y="130" font-size="10" fill="#1e40af">换来削峰、解耦</text>
    <text x="26" y="150" font-size="10" fill="#1e40af">代价：端到端延迟变大、可能丢、要幂等</text>

    <rect x="14" y="166" width="442" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="26" y="184" font-size="11.5" font-weight="bold" fill="#1e40af">③ 读写分离</text>
    <text x="130" y="184" font-size="10" fill="#1e40af">换来分摊读</text>
    <text x="26" y="204" font-size="10" fill="#1e40af">代价：复制延迟</text>

    <rect x="14" y="220" width="442" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="26" y="238" font-size="11.5" font-weight="bold" fill="#1e40af">④ 分片</text>
    <text x="100" y="238" font-size="10" fill="#1e40af">换来写与容量水平扩展</text>
    <text x="26" y="258" font-size="10" fill="#1e40af">代价：跨片查询要广播、扩容要再平衡</text>

    <rect x="14" y="274" width="442" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="26" y="292" font-size="11.5" font-weight="bold" fill="#1e40af">⑤ 多副本</text>
    <text x="130" y="292" font-size="10" fill="#1e40af">换来读扩展、容灾</text>
    <text x="26" y="312" font-size="10" fill="#1e40af">代价：复制延迟、写放大</text>

    <rect x="14" y="328" width="442" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="26" y="346" font-size="11.5" font-weight="bold" fill="#1e40af">⑥ 多级 / 多机房</text>
    <text x="170" y="346" font-size="10" fill="#1e40af">换来容灾与就近</text>
    <text x="26" y="366" font-size="10" fill="#1e40af">代价：一致性、运维复杂度</text>
  </g>

  <g transform="translate(510,74)">
    <rect x="0" y="0" width="470" height="390" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 兜底四问：对每一层各问一遍</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">正常路径设计完，接着补异常路径 —— 这四问就是「兜底」的全部</text>

    <rect x="14" y="58" width="442" height="74" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="26" y="78" font-size="11.5" font-weight="bold" fill="#92400e">① 它挂了 —— 这层不可用，降级到哪？</text>
    <text x="26" y="98" font-size="10" fill="#92400e">渠道挂了切哪个渠道？</text>
    <text x="26" y="118" font-size="10" fill="#92400e">缓存挂了是不是直接读库？</text>

    <rect x="14" y="142" width="442" height="74" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="26" y="162" font-size="11.5" font-weight="bold" fill="#92400e">② 它慢了 —— 慢连接 / 慢查询怎么隔离？</text>
    <text x="26" y="182" font-size="10" fill="#92400e">非阻塞投递、超时、熔断</text>
    <text x="26" y="202" font-size="10" fill="#92400e">别让一个慢客户端拖垮整条循环</text>

    <rect x="14" y="226" width="442" height="74" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="26" y="246" font-size="11.5" font-weight="bold" fill="#92400e">③ 它丢了 —— 能容忍丢多少？丢了怎么补？</text>
    <text x="26" y="266" font-size="10" fill="#92400e">Pub/Sub 不保留消息</text>
    <text x="26" y="286" font-size="10" fill="#92400e">所以要配落库补齐</text>

    <rect x="14" y="310" width="442" height="74" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="26" y="330" font-size="11.5" font-weight="bold" fill="#92400e">④ 它错了 —— 数据不一致怎么发现？</text>
    <text x="26" y="350" font-size="10" fill="#92400e">对账任务、监控告警</text>
    <text x="26" y="370" font-size="10" fill="#92400e">「没人报障」不等于「没出错」</text>
  </g>

  <g transform="translate(20,480)">
    <rect x="0" y="0" width="960" height="64" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="11.5" font-weight="bold" fill="#991b1b">加手段的两条前提（5.4）</text>
    <text x="180" y="24" font-size="10.5" fill="#991b1b">一、这一环确实是瓶颈（第四节已定位）；二、上一层手段已经不够用（能轻不重）</text>
    <text x="14" y="48" font-size="10.5" fill="#991b1b">每多一层手段就多一个故障面、多一处一致性窗口、多一份运维成本 —— 最贵的不是组件，是组件之间的边界</text>
  </g>
</svg>
