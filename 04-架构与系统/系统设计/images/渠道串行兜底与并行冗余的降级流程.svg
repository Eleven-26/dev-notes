<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="sans-serif">
  <defs>
    <marker id="chB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="chO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">渠道互备与降级：串行兜底、并行冗余、失败隔离</text>
  <text x="30" y="63" font-size="13" fill="#64748b">对应正文第五节：给每类事件配一组有序渠道，一个渠道挂了不等于通知发不出</text>

  <g transform="translate(20,80)">
    <rect x="0" y="0" width="960" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 两种互备</text>

    <text x="18" y="52" font-size="12" font-weight="bold" fill="#0f172a">串行兜底（事务类）：前一个失败才试后一个，省成本</text>

    <rect x="20" y="64" width="150" height="50" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="95" y="94" font-size="11.5" fill="#1e3a8a" text-anchor="middle">App 推送</text>
    <rect x="250" y="64" width="150" height="50" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="325" y="94" font-size="11.5" fill="#1e3a8a" text-anchor="middle">短信</text>
    <rect x="480" y="64" width="150" height="50" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="555" y="94" font-size="11.5" fill="#1e3a8a" text-anchor="middle">站内信</text>

    <line x1="170" y1="89" x2="244" y2="89" stroke="#2563eb" stroke-width="1.6" marker-end="url(#chB)"/>
    <line x1="400" y1="89" x2="474" y2="89" stroke="#2563eb" stroke-width="1.6" marker-end="url(#chB)"/>
    <text x="207" y="132" font-size="9.5" fill="#2563eb" text-anchor="middle">失败则下一个</text>
    <text x="437" y="132" font-size="9.5" fill="#2563eb" text-anchor="middle">仍失败再兜底</text>

    <text x="660" y="82" font-size="10.5" fill="#334155">Send 成功即止：</text>
    <text x="660" y="102" font-size="10.5" fill="#334155">任一渠道成功就不再</text>
    <text x="660" y="122" font-size="10.5" fill="#334155">打扰用户，全败才返错</text>

    <text x="18" y="164" font-size="12" font-weight="bold" fill="#0f172a">并行冗余（验证类）：两路同时发，保时效</text>

    <rect x="20" y="176" width="150" height="56" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="95" y="210" font-size="11.5" fill="#92400e" text-anchor="middle">同一次验证</text>
    <rect x="300" y="162" width="140" height="40" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="370" y="187" font-size="11.5" fill="#1e3a8a" text-anchor="middle">短信</text>
    <rect x="300" y="212" width="140" height="40" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="370" y="237" font-size="11.5" fill="#1e3a8a" text-anchor="middle">邮件</text>
    <line x1="170" y1="198" x2="294" y2="182" stroke="#b45309" stroke-width="1.5" marker-end="url(#chO)"/>
    <line x1="170" y1="210" x2="294" y2="230" stroke="#b45309" stroke-width="1.5" marker-end="url(#chO)"/>

    <text x="470" y="180" font-size="10.5" fill="#334155">营销类：站内信 → App 推送，不发短信（控成本）。</text>
    <text x="470" y="232" font-size="10.5" fill="#64748b">路由是配置：有序渠道列表，不是硬编码在业务里。</text>
  </g>

  <g transform="translate(20,350)">
    <rect x="0" y="0" width="960" height="216" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 降级：每种故障都有对应的动作</text>

    <rect x="20" y="46" width="290" height="32" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="34" y="67" font-size="11.5" font-weight="bold" fill="#92400e">某渠道整体不可用</text>
    <line x1="310" y1="62" x2="336" y2="62" stroke="#b45309" stroke-width="1.5" marker-end="url(#chO)"/>
    <text x="344" y="67" font-size="11" fill="#334155">路由里摘掉该渠道，转向备选</text>

    <rect x="20" y="88" width="290" height="32" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="34" y="109" font-size="11.5" font-weight="bold" fill="#92400e">短信额度用尽</text>
    <line x1="310" y1="104" x2="336" y2="104" stroke="#b45309" stroke-width="1.5" marker-end="url(#chO)"/>
    <text x="344" y="109" font-size="11" fill="#334155">降到站内信，重要事件另走人工</text>

    <rect x="20" y="130" width="290" height="32" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="34" y="151" font-size="11.5" font-weight="bold" fill="#92400e">渠道大面积超时</text>
    <line x1="310" y1="146" x2="336" y2="146" stroke="#b45309" stroke-width="1.5" marker-end="url(#chO)"/>
    <text x="344" y="151" font-size="11" fill="#334155">熔断该渠道，避免拖垮投递线程池</text>

    <rect x="20" y="172" width="290" height="32" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="34" y="193" font-size="11.5" font-weight="bold" fill="#92400e">通知系统整体过载</text>
    <line x1="310" y1="188" x2="336" y2="188" stroke="#b45309" stroke-width="1.5" marker-end="url(#chO)"/>
    <text x="344" y="193" font-size="11" fill="#334155">入口限流 + 只留事务类，营销类整体延后</text>
  </g>

  <g transform="translate(20,586)">
    <rect x="0" y="0" width="960" height="126" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="24" font-size="15" font-weight="bold" fill="#0f172a">C. 三件套：把失败关在渠道内部</text>

    <rect x="20" y="36" width="300" height="44" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="34" y="54" font-size="10.5" font-weight="bold" fill="#991b1b">熔断：错误率超阈值自动断开</text>
    <text x="34" y="72" font-size="10.5" fill="#991b1b">过一段时间半开试探</text>

    <rect x="330" y="36" width="300" height="44" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="344" y="54" font-size="10.5" font-weight="bold" fill="#991b1b">隔离舱：不同渠道不同线程池</text>
    <text x="344" y="72" font-size="10.5" fill="#991b1b">慢渠道不堵别的渠道</text>

    <rect x="640" y="36" width="300" height="44" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="654" y="54" font-size="10.5" font-weight="bold" fill="#991b1b">硬超时：每次调用都必须有</text>
    <text x="654" y="72" font-size="10.5" fill="#991b1b">不能无限等</text>

    <text x="18" y="96" font-size="11" fill="#475569">降级要提前配置好、能一键打开；开关本身也要有监控——「开关一直开着」也是一种事故。</text>
    <text x="18" y="114" font-size="11" fill="#475569">一个短信通道超时，不该让 App 推送跟着延迟：失败必须被限制在渠道内部。</text>
  </g>
</svg>
