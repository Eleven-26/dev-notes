<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ahm" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="590" fill="#ffffff"/>
  <text x="30" y="32" font-size="19" font-weight="bold" fill="#0f172a">瓶颈怎么判：把估算值和单机上限摆在一起比，最先逼近上限的那一项就是瓶颈</text>
  <text x="30" y="56" font-size="12.5" fill="#475569">瓶颈 = 最先把某个受限资源打满的那一环；手段要加在瓶颈上，加在别处就是浪费，甚至引入新的故障面</text>

  <text x="30" y="84" font-size="14" font-weight="bold" fill="#1e40af">A 第二节估算值 对 4.1 上限表（三行取自 4.2 那张对照）</text>

  <rect x="30" y="96" width="250" height="46" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" rx="6"/>
  <text x="155" y="124" font-size="13" fill="#1e40af" text-anchor="middle">① 峰值 580 QPS</text>
  <text x="305" y="124" font-size="12" fill="#64748b" text-anchor="middle">vs</text>
  <rect x="340" y="96" width="250" height="46" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" rx="6"/>
  <text x="465" y="124" font-size="13" fill="#334155" text-anchor="middle">单机数千 QPS</text>
  <line x1="594" y1="119" x2="640" y2="119" stroke="#475569" stroke-width="1.6" marker-end="url(#ahm)"/>
  <rect x="646" y="96" width="324" height="46" fill="#dcfce7" stroke="#166534" stroke-width="1.4" rx="6"/>
  <text x="808" y="124" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">不是瓶颈</text>

  <rect x="30" y="154" width="250" height="46" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" rx="6"/>
  <text x="155" y="182" font-size="13" fill="#1e40af" text-anchor="middle">② 出带宽约 1.2 Gbit/s</text>
  <text x="305" y="182" font-size="12" fill="#64748b" text-anchor="middle">vs</text>
  <rect x="340" y="154" width="250" height="46" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" rx="6"/>
  <text x="465" y="182" font-size="13" fill="#334155" text-anchor="middle">千兆网卡约 1 Gbit/s</text>
  <line x1="594" y1="177" x2="640" y2="177" stroke="#475569" stroke-width="1.6" marker-end="url(#ahm)"/>
  <rect x="646" y="154" width="324" height="46" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4" rx="6"/>
  <text x="808" y="182" font-size="13" font-weight="bold" fill="#7f1d1d" text-anchor="middle">瓶颈：网络出带宽</text>

  <rect x="30" y="212" width="250" height="46" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" rx="6"/>
  <text x="155" y="240" font-size="13" fill="#1e40af" text-anchor="middle">③ 在线连接 50 万</text>
  <text x="305" y="240" font-size="12" fill="#64748b" text-anchor="middle">vs</text>
  <rect x="340" y="212" width="250" height="46" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" rx="6"/>
  <text x="465" y="240" font-size="13" fill="#334155" text-anchor="middle">单机数万连接</text>
  <line x1="594" y1="235" x2="640" y2="235" stroke="#475569" stroke-width="1.6" marker-end="url(#ahm)"/>
  <rect x="646" y="212" width="324" height="46" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4" rx="6"/>
  <text x="808" y="240" font-size="13" font-weight="bold" fill="#7f1d1d" text-anchor="middle">瓶颈：连接数，决定网关台数</text>

  <text x="30" y="282" font-size="12" fill="#475569">第②行的来源是 4.1 的例子：一次广播要复制给 50 万连接、单条 3KB，出带宽约 1.2 Gbit/s，已超千兆网卡上限</text>

  <text x="30" y="310" font-size="14" font-weight="bold" fill="#1e40af">B 五类受限资源各自的单机上限，与它什么时候成为瓶颈</text>
  <rect x="30" y="322" width="180" height="78" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" rx="6"/>
  <text x="120" y="344" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">CPU</text>
  <text x="120" y="366" font-size="10.5" fill="#475569" text-anchor="middle">每秒几十万次简单计算</text>
  <text x="120" y="386" font-size="10.5" fill="#475569" text-anchor="middle">计算密集：序列化</text>
  <rect x="220" y="322" width="180" height="78" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" rx="6"/>
  <text x="310" y="344" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">网络出带宽</text>
  <text x="310" y="366" font-size="10.5" fill="#475569" text-anchor="middle">千兆约 1 Gbit/s，万兆 10</text>
  <text x="310" y="386" font-size="10.5" fill="#475569" text-anchor="middle">广播推送：载荷乘连接数</text>
  <rect x="410" y="322" width="180" height="78" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" rx="6"/>
  <text x="500" y="344" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">内存</text>
  <text x="500" y="366" font-size="10.5" fill="#475569" text-anchor="middle">单机百 GB 级</text>
  <text x="500" y="386" font-size="10.5" fill="#475569" text-anchor="middle">长连接、大缓存</text>
  <rect x="600" y="322" width="180" height="78" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" rx="6"/>
  <text x="690" y="344" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">单行 / 单分片</text>
  <text x="690" y="366" font-size="10.5" fill="#475569" text-anchor="middle">一行一锁、一分片一主</text>
  <text x="690" y="386" font-size="10.5" fill="#475569" text-anchor="middle">热点键：同一行库存</text>
  <rect x="790" y="322" width="180" height="78" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" rx="6"/>
  <text x="880" y="344" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">单连接</text>
  <text x="880" y="366" font-size="10.5" fill="#475569" text-anchor="middle">一条连接的读写队列</text>
  <text x="880" y="386" font-size="10.5" fill="#475569" text-anchor="middle">慢客户端拖垮广播循环</text>

  <text x="30" y="432" font-size="14" font-weight="bold" fill="#7f1d1d">C 没定位就加手段，是最常见的浪费</text>
  <rect x="30" y="444" width="300" height="62" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2" rx="6"/>
  <text x="180" y="468" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">瓶颈在单行热点，却去加缓存</text>
  <text x="180" y="492" font-size="11" fill="#7f1d1d" text-anchor="middle">缓存也救不了那一行，白加</text>
  <rect x="350" y="444" width="300" height="62" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2" rx="6"/>
  <text x="500" y="468" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">瓶颈在出带宽，却去加 CPU 核</text>
  <text x="500" y="492" font-size="11" fill="#7f1d1d" text-anchor="middle">带宽不够，加核没用</text>
  <rect x="670" y="444" width="300" height="62" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2" rx="6"/>
  <text x="820" y="468" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">瓶颈在队列消费慢，却加大队列</text>
  <text x="820" y="492" font-size="11" fill="#7f1d1d" text-anchor="middle">只会更晚满，不解决消费慢</text>

  <rect x="30" y="518" width="940" height="62" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" rx="8"/>
  <text x="500" y="542" font-size="12.5" fill="#334155" text-anchor="middle">要点：先回答「瓶颈在哪」，再回答「用什么手段」，顺序不能反；出带宽这类瓶颈该做的是少发与分片网关</text>
  <text x="500" y="566" font-size="11.5" fill="#b45309" text-anchor="middle">注意：580 QPS、50 万连接、1.2 Gbit/s 都是第二节按假设算出的量级，不是实测读数；本图只画「怎么比」这个判据</text>
</svg>
