<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwY" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#b45309"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="570" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">六类数据形态 → 读写特征 → 第一性问题 → 对症手段</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">形态决定结构，结构决定代价；「对症手段」一列只收 3.3 表里给了手段的那五行</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="340" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 先把数据摊开分类（按形态，不按功能）</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">同一份数据被多少人同时读、同时改，决定它属于哪一类</text>

    <rect x="14" y="56" width="932" height="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="24" y="74" font-size="10.5" font-weight="bold" fill="#334155">形态</text>
    <text x="128" y="74" font-size="10.5" font-weight="bold" fill="#334155">读特征</text>
    <text x="316" y="74" font-size="10.5" font-weight="bold" fill="#334155">写特征</text>
    <text x="484" y="74" font-size="10.5" font-weight="bold" fill="#334155">常见第一性问题</text>
    <text x="742" y="74" font-size="10.5" font-weight="bold" fill="#334155">对症手段</text>

    <rect x="14" y="90" width="104" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="24" y="112" font-size="11" font-weight="bold" fill="#1e40af">计数器</text>
    <text x="128" y="112" font-size="10" fill="#334155">读极多、期望 O(1)</text>
    <text x="316" y="112" font-size="10" fill="#334155">写多、要原子</text>
    <text x="484" y="112" font-size="10" fill="#334155">原子性与读放大</text>
    <text x="742" y="112" font-size="10" fill="#14532d">原子命令 / Lua / 攒批</text>

    <rect x="14" y="130" width="104" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="24" y="152" font-size="11" font-weight="bold" fill="#1e40af">有序集合</text>
    <text x="128" y="152" font-size="10" fill="#334155">范围读、要按序</text>
    <text x="316" y="152" font-size="10" fill="#334155">改分多</text>
    <text x="484" y="152" font-size="10" fill="#334155">分页一致性</text>
    <text x="742" y="152" font-size="10" fill="#14532d">游标分页 / 快照</text>

    <rect x="14" y="170" width="104" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="24" y="192" font-size="11" font-weight="bold" fill="#1e40af">关系</text>
    <text x="128" y="192" font-size="10" fill="#334155">两个方向都要查</text>
    <text x="316" y="192" font-size="10" fill="#334155">成对写</text>
    <text x="484" y="192" font-size="10" fill="#334155">分片键选谁</text>
    <text x="742" y="192" font-size="10" fill="#14532d">双写双索引 / 广播合并</text>

    <rect x="14" y="210" width="104" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="24" y="232" font-size="11" font-weight="bold" fill="#1e40af">内容</text>
    <text x="128" y="232" font-size="10" fill="#334155">分页读</text>
    <text x="316" y="232" font-size="10" fill="#334155">低频、要持久</text>
    <text x="484" y="232" font-size="10" fill="#334155">存储与检索</text>
    <text x="742" y="232" font-size="10" fill="#94a3b8">3.3 表未列手段</text>

    <rect x="14" y="250" width="104" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="24" y="272" font-size="11" font-weight="bold" fill="#1e40af">事件流</text>
    <text x="128" y="272" font-size="10" fill="#334155">追加读</text>
    <text x="316" y="272" font-size="10" fill="#334155">写极多、可丢</text>
    <text x="484" y="272" font-size="10" fill="#334155">扇出与背压</text>
    <text x="742" y="272" font-size="10" fill="#14532d">削峰 + 丢弃 + 背压</text>

    <rect x="14" y="290" width="104" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="24" y="312" font-size="11" font-weight="bold" fill="#1e40af">大对象</text>
    <text x="128" y="312" font-size="10" fill="#334155">直传直读</text>
    <text x="316" y="312" font-size="10" fill="#334155">一次写</text>
    <text x="484" y="312" font-size="10" fill="#334155">存储与元数据分离</text>
    <text x="742" y="312" font-size="10" fill="#14532d">直传 + 中心化存储</text>
  </g>

  <g transform="translate(20,434)">
    <rect x="0" y="0" width="470" height="120" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#92400e">B. 判据只有一句话</text>
    <text x="14" y="46" font-size="10.5" fill="#92400e">如果这一环做到无限快，系统还慢不慢？</text>
    <rect x="14" y="58" width="442" height="24" fill="#ffffff" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="24" y="75" font-size="10" fill="#92400e">还慢 → 瓶颈不在这里，优化的是次要矛盾</text>
    <rect x="14" y="88" width="442" height="24" fill="#ffffff" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="24" y="105" font-size="10" fill="#92400e">不慢了 → 这就是第一性问题，先把全部资源砸它</text>
  </g>

  <g transform="translate(510,434)">
    <rect x="0" y="0" width="470" height="120" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#14532d">C. 顺序不能反：形态 → 第一问题 → 手段</text>
    <text x="14" y="46" font-size="10.5" fill="#14532d">例：点赞（3.5）—— 记录是关系，计数是计数器</text>
    <text x="14" y="66" font-size="10" fill="#14532d">① 第一问题：共享可变量被无数请求同时 +1</text>
    <text x="14" y="86" font-size="10" fill="#14532d">② 手段：原子命令 / Lua，计数用单独状态</text>
    <text x="14" y="106" font-size="10" fill="#14532d">③ 代价：缓存与 DB 有窗口 → 攒批落库 + 对账</text>
  </g>
</svg>
