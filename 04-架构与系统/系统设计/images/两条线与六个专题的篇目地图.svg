<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">系统设计目录：两条线、七个散篇、六个专题</text>
  <text x="30" y="62" font-size="13" fill="#64748b">散篇讲共性零件，专题把一道完整场景拆成「总纲 + 零件」；先选线，再按序读</text>

  <g transform="translate(20,80)">
    <rect x="0" y="0" width="450" height="482" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">线一：通用场景（根目录散篇，按推荐读序）</text>

    <rect x="18" y="44" width="414" height="48" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="34" y="64" font-size="12" font-weight="bold" fill="#1e3a8a">① 文件存储与上传架构</text>
    <text x="34" y="81" font-size="10.5" fill="#334155">选型方法 + 直传 vs 中转（业务节点无状态化）</text>

    <rect x="18" y="102" width="414" height="48" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="34" y="122" font-size="12" font-weight="bold" fill="#1e3a8a">② 数据导入导出设计</text>
    <text x="34" y="139" font-size="10.5" fill="#334155">同步/异步四形态、导出三路线、导入五环节、状态机</text>

    <rect x="18" y="160" width="414" height="48" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="34" y="180" font-size="12" font-weight="bold" fill="#1e3a8a">③ 统计页提速</text>
    <text x="34" y="197" font-size="10.5" fill="#334155">少查询、把统计前移（预聚合结果表）</text>

    <rect x="18" y="218" width="414" height="48" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="34" y="238" font-size="12" font-weight="bold" fill="#1e3a8a">④ 海量数据存储设计</text>
    <text x="34" y="255" font-size="10.5" fill="#334155">按数据类型选存储 + 分布式分层两条突破路线</text>

    <rect x="18" y="276" width="414" height="48" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="34" y="296" font-size="12" font-weight="bold" fill="#1e3a8a">⑤ 通知系统设计</text>
    <text x="34" y="313" font-size="10.5" fill="#334155">渠道抽象 / 模板 / 去重合并与频控 / 回执 / 降级</text>

    <rect x="18" y="334" width="414" height="48" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="34" y="354" font-size="12" font-weight="bold" fill="#312e81">⑥ 系统设计方法论</text>
    <text x="34" y="371" font-size="10.5" fill="#334155">量级估算 → 找第一性问题 → 定位瓶颈 → 分层与兜底</text>

    <rect x="18" y="392" width="414" height="48" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="34" y="412" font-size="12" font-weight="bold" fill="#312e81">⑦ 存储选型与组合</text>
    <text x="34" y="429" font-size="10.5" fill="#334155">数据角色 + 权威源与副本 + 冷热分层 + 多存储同步</text>

    <text x="18" y="458" font-size="11" fill="#475569">靛蓝两块是方法论与公共视角，读专题前先打底；</text>
    <text x="18" y="474" font-size="11" fill="#475569">蓝色五块各是一道共性场景，彼此不重复。</text>
  </g>

  <g transform="translate(490,80)">
    <rect x="0" y="0" width="490" height="482" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">线二：六个专题系统，各成一套「总纲 + 零件」</text>

    <rect x="18" y="44" width="454" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="34" y="67" font-size="12" font-weight="bold" fill="#14532d">① 秒杀系统</text>
    <text x="34" y="88" font-size="10.5" fill="#334155">写侧：稀缺资源扣减 / 削峰 / 瓶颈是「同一行」</text>

    <rect x="18" y="114" width="454" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="34" y="137" font-size="12" font-weight="bold" fill="#14532d">② 弹幕系统</text>
    <text x="34" y="158" font-size="10.5" fill="#334155">扇出：海量低价值数据广播（限流 / 双路径 / 缓存 / 订阅）</text>

    <rect x="18" y="184" width="454" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="34" y="207" font-size="12" font-weight="bold" fill="#14532d">③ 社交互动系统</text>
    <text x="34" y="228" font-size="10.5" fill="#334155">互动层：计数 / 榜单 / 关系 / 内容四类数据形态</text>

    <rect x="18" y="254" width="454" height="60" rx="8" fill="#cffafe" stroke="#0891b2"/>
    <text x="34" y="277" font-size="12" font-weight="bold" fill="#155e75">④ IM 系统</text>
    <text x="34" y="298" font-size="10.5" fill="#334155">长连接：消息不丢不乱 + 多端同步</text>

    <rect x="18" y="324" width="454" height="60" rx="8" fill="#cffafe" stroke="#0891b2"/>
    <text x="34" y="347" font-size="12" font-weight="bold" fill="#155e75">⑤ Feed 流系统</text>
    <text x="34" y="368" font-size="10.5" fill="#334155">时间线：写扩散 vs 读扩散 + 稳定分页</text>

    <rect x="18" y="394" width="454" height="60" rx="8" fill="#cffafe" stroke="#0891b2"/>
    <text x="34" y="417" font-size="12" font-weight="bold" fill="#155e75">⑥ 推荐系统</text>
    <text x="34" y="438" font-size="10.5" fill="#334155">工程视角：召回 → 粗排 → 精排 → 重排</text>

    <text x="18" y="472" font-size="11" fill="#475569">进任一专题先读它的 README.md 总纲，再按零件篇顺序展开。</text>
  </g>
</svg>
