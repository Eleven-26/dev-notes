<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="sans-serif">
  <defs>
    <marker id="ar4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#2563eb"/>
    </marker>
    <marker id="ar4g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">直传还是中转：文件是否经过业务服务器，差的是「几次网络」</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">判据：上传到业务服务器后「什么都不做」、只是原样转发 —— 那就没有理由经过它</text>

  <rect x="30" y="88" width="455" height="220" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3" rx="10"/>
  <text x="46" y="114" font-size="14" font-weight="bold" fill="#7c2d12">中转：经过业务服务器（走两次网络）</text>

  <rect x="46" y="130" width="110" height="44" fill="#ffffff" stroke="#ea580c" stroke-width="1" rx="8"/>
  <text x="101" y="157" font-size="12" fill="#7c2d12" text-anchor="middle">客户端</text>
  <line x1="158" y1="152" x2="180" y2="152" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar4)"/>
  <rect x="182" y="130" width="124" height="44" fill="#ffffff" stroke="#ea580c" stroke-width="1" rx="8"/>
  <text x="244" y="157" font-size="12" fill="#7c2d12" text-anchor="middle">业务服务器</text>
  <line x1="308" y1="152" x2="330" y2="152" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar4)"/>
  <rect x="332" y="130" width="136" height="44" fill="#ffffff" stroke="#ea580c" stroke-width="1" rx="8"/>
  <text x="400" y="157" font-size="12" fill="#7c2d12" text-anchor="middle">对象存储</text>

  <text x="46" y="216" font-size="11.5" fill="#7c2d12">走两次网络：消耗两次带宽，也消耗两倍时间</text>
  <text x="46" y="242" font-size="11.5" fill="#7c2d12">中间节点只是原样转发时，这两次网络是纯浪费</text>
  <text x="46" y="276" font-size="11.5" font-weight="bold" fill="#7c2d12">例外：文件需要在业务侧处理（如报表导入数据库）才必须中转</text>

  <rect x="515" y="88" width="455" height="220" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" rx="10"/>
  <text x="531" y="114" font-size="14" font-weight="bold" fill="#14532d">直传：前端 → 对象存储（只走一次）</text>

  <rect x="531" y="130" width="120" height="44" fill="#ffffff" stroke="#16a34a" stroke-width="1" rx="8"/>
  <text x="591" y="157" font-size="12" fill="#14532d" text-anchor="middle">客户端</text>
  <line x1="653" y1="152" x2="836" y2="152" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar4g)"/>
  <text x="744" y="144" font-size="11" fill="#14532d" text-anchor="middle">一次上传</text>
  <rect x="838" y="130" width="120" height="44" fill="#ffffff" stroke="#16a34a" stroke-width="1" rx="8"/>
  <text x="898" y="157" font-size="12" fill="#14532d" text-anchor="middle">对象存储</text>

  <text x="531" y="216" font-size="11.5" fill="#14532d">只有一次上传：减少一次上传时间</text>
  <text x="531" y="242" font-size="11.5" fill="#14532d">同时大幅降低业务服务器的负载</text>
  <text x="531" y="276" font-size="11.5" font-weight="bold" fill="#14532d">代价：校验与授权要前移 —— 靠临时凭证与文件头校验补上</text>

  <rect x="30" y="328" width="940" height="212" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="46" y="354" font-size="13.5" font-weight="bold" fill="#0f172a">直传的三步（以腾讯云 COS 为例）</text>

  <rect x="46" y="370" width="296" height="104" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="60" y="394" font-size="12.5" font-weight="bold" fill="#1e3a8a">① 换临时密钥（后端）</text>
  <text x="60" y="418" font-size="11" fill="#1e3a8a">用永久密钥换取临时密钥，</text>
  <text x="60" y="438" font-size="11" fill="#1e3a8a">临时密钥有有效期</text>
  <text x="60" y="458" font-size="11" fill="#1e3a8a">（如 30 分钟 / 1 小时）</text>

  <rect x="352" y="370" width="296" height="104" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="366" y="394" font-size="12.5" font-weight="bold" fill="#1e3a8a">② 生成预签名 URL（后端）</text>
  <text x="366" y="418" font-size="11" fill="#1e3a8a">根据文件名等信息签名，</text>
  <text x="366" y="438" font-size="11" fill="#1e3a8a">下发预签名上传地址</text>
  <text x="366" y="458" font-size="11" fill="#1e3a8a">和访问地址</text>

  <rect x="658" y="370" width="296" height="104" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="672" y="394" font-size="12.5" font-weight="bold" fill="#1e3a8a">③ 上传（前端）</text>
  <text x="672" y="418" font-size="11" fill="#1e3a8a">对预签名 URL 发 PUT，</text>
  <text x="672" y="438" font-size="11" fill="#1e3a8a">以二进制方式传输</text>
  <text x="672" y="458" font-size="11" fill="#1e3a8a">文件内容</text>

  <text x="46" y="502" font-size="11.5" fill="#334155">上传返回 HTTP 200 即表示成功；前端永远拿不到永久密钥，只拿到有时效的临时凭证和预签名 URL</text>
  <text x="46" y="524" font-size="11.5" fill="#334155">因此即使凭证泄露，也只在有效期内可用 —— 授权范围（键名 / 大小 / 类型 / 有效期）要全部签进签名里</text>
</svg>
