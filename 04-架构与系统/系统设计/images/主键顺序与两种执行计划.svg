<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一张表、同一条 SQL，只把主键两列调个顺序，执行计划就换了一档</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">读数来自本机 Docker Desktop 的 mysql:8.0.46 隔离实例（容器 docs-verify-mysql、端口 13306），键条里的组合是示意</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="470" height="336" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 主键 (day, kind) —— 走索引</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">先按 day 排，同一天内再按 kind 排，所以按天取是一段连续区间</text>

    <rect x="14" y="56" width="140" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="24" y="76" font-size="10.5" font-weight="bold" fill="#1e40af">day = 09-22</text>
    <text x="24" y="98" font-size="10" fill="#1e40af">click · view</text>

    <rect x="164" y="56" width="140" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="174" y="76" font-size="10.5" font-weight="bold" fill="#1e40af">day = 09-23</text>
    <text x="174" y="98" font-size="10" fill="#1e40af">view</text>

    <rect x="314" y="56" width="140" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="324" y="76" font-size="10.5" font-weight="bold" fill="#1e40af">day = 09-24</text>
    <text x="324" y="98" font-size="10" fill="#1e40af">click · view</text>

    <line x1="14" y1="124" x2="454" y2="124" stroke="#2563eb" stroke-width="1.5"/>
    <text x="14" y="144" font-size="10" fill="#334155">WHERE day BETWEEN 09-22 AND 09-24 —— 落在主键的一段连续区间上</text>

    <rect x="14" y="156" width="442" height="92" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="26" y="176" font-size="10.5" font-weight="bold" fill="#14532d">EXPLAIN 实测原文</text>
    <text x="26" y="196" font-size="10" fill="#14532d">type: range   key: PRIMARY   key_len: 3   rows: 3</text>
    <text x="26" y="216" font-size="10" fill="#14532d">Extra: Using where; Backward index scan</text>
    <text x="26" y="236" font-size="10" fill="#14532d">Extra 里没有 Using filesort</text>

    <text x="14" y="272" font-size="10.5" fill="#334155">页面要的是「按日期倒序 + LIMIT 20」，主键本来就是按天排的，</text>
    <text x="14" y="292" font-size="10.5" fill="#334155">所以 8.0 反向扫这段索引就能拿到倒序结果，天然不需要再排序。</text>
    <text x="14" y="316" font-size="10.5" font-weight="bold" fill="#92400e">前提是排序列就是主键前缀 —— 换成非主键列照样要 filesort。</text>
  </g>

  <g transform="translate(510,74)">
    <rect x="0" y="0" width="470" height="336" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 主键 (kind, day) —— 全表扫</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">先按 kind 排，同一个 kind 内部的 day 才有序；按天筛就散了</text>

    <rect x="14" y="56" width="140" height="56" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="8"/>
    <text x="24" y="76" font-size="10.5" font-weight="bold" fill="#334155">kind = click</text>
    <text x="24" y="98" font-size="10" fill="#334155">09-22 · 09-24</text>

    <rect x="164" y="56" width="140" height="56" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="8"/>
    <text x="174" y="76" font-size="10.5" font-weight="bold" fill="#334155">kind = publish</text>
    <text x="174" y="98" font-size="10" fill="#334155">09-22 · 09-23</text>

    <rect x="314" y="56" width="140" height="56" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="8"/>
    <text x="324" y="76" font-size="10.5" font-weight="bold" fill="#334155">kind = view</text>
    <text x="324" y="98" font-size="10" fill="#334155">09-22 · 09-23 · 09-24</text>

    <line x1="14" y1="124" x2="454" y2="124" stroke="#dc2626" stroke-dasharray="4 4" stroke-width="1.5"/>
    <text x="14" y="144" font-size="10" fill="#334155">同一条 WHERE day BETWEEN —— 落点散在每个 kind 里，定不出起点</text>

    <rect x="14" y="156" width="442" height="92" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="26" y="176" font-size="10.5" font-weight="bold" fill="#991b1b">EXPLAIN 实测原文</text>
    <text x="26" y="196" font-size="10" fill="#991b1b">type: ALL   possible_keys: NULL   key: NULL</text>
    <text x="26" y="216" font-size="10" fill="#991b1b">Extra: Using where; Using filesort</text>
    <text x="26" y="236" font-size="10" fill="#991b1b">数据一样、SQL 一样，只换了主键里两列的顺序</text>

    <text x="14" y="272" font-size="10.5" fill="#334155">这一档就是正文那句「主键顺序反了就走不了索引」的实测证据：</text>
    <text x="14" y="292" font-size="10.5" fill="#334155">既没有可用索引（possible_keys 为空），又要额外排序（filesort）。</text>
    <text x="14" y="316" font-size="10.5" font-weight="bold" fill="#92400e">真要常态按 kind 查，就该另建索引，而不是把主键倒过来。</text>
  </g>

  <g transform="translate(20,430)">
    <rect x="0" y="0" width="960" height="94" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="11.5" font-weight="bold" fill="#92400e">一句判据</text>
    <text x="80" y="24" font-size="10.5" fill="#92400e">主键里列的顺序，就是这份数据在磁盘上的排列顺序 —— 查询要落在这段的连续区间上，索引才走得动。</text>
    <text x="14" y="48" font-size="10.5" fill="#92400e">套到统计页上：页面的查询粒度是「一段日期区间 + 按天倒序分页」，所以主键写成 (day, kind)，DDL 注释里那句</text>
    <text x="14" y="72" font-size="10.5" fill="#92400e">「主键就是页面的查询粒度：维度 + 日期，顺序反了就走不了索引」指的就是这两条实测的差别。</text>
  </g>
</svg>
