<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">影子链路的三处隔离与三个静默丢失点</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">同一笔压测请求要同时在流量、数据、消息三处被拦住，任何一处漏掉都不报错</text>

  <rect x="30" y="88" width="150" height="56" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="105" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">压测流量</text>
  <text x="105" y="132" text-anchor="middle" font-size="11" fill="#475569">X-Shadow 与 pt 标记</text>

  <rect x="220" y="88" width="150" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="295" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">入口代理</text>
  <text x="295" y="132" text-anchor="middle" font-size="11" fill="#1d4ed8">读头决定去哪个池</text>

  <rect x="410" y="88" width="150" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="485" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">服务 A</text>
  <text x="485" y="132" text-anchor="middle" font-size="11" fill="#1d4ed8">上下文向下传</text>

  <rect x="600" y="88" width="150" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="675" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">服务 B</text>
  <text x="675" y="132" text-anchor="middle" font-size="11" fill="#1d4ed8">同线程同上下文</text>

  <line x1="182" y1="116" x2="216" y2="116" stroke="#334155" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="372" y1="116" x2="406" y2="116" stroke="#334155" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="562" y1="116" x2="596" y2="116" stroke="#334155" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="410" y="196" width="150" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="485" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">写入</text>
  <text x="485" y="236" text-anchor="middle" font-size="11" fill="#166534">按标记选真实库或影子库</text>
  <line x1="485" y1="146" x2="485" y2="192" stroke="#334155" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="230" y="284" width="170" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="315" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">app 真实库</text>
  <text x="315" y="324" text-anchor="middle" font-size="11" fill="#166534">业务读写</text>
  <rect x="580" y="284" width="170" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="665" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">app_shadow 影子库</text>
  <text x="665" y="324" text-anchor="middle" font-size="11" fill="#166534">压测读写，用完即清</text>
  <line x1="452" y1="248" x2="330" y2="280" stroke="#334155" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="518" y1="248" x2="650" y2="280" stroke="#334155" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="790" y="196" width="180" height="52" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4"/>
  <text x="880" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">消息队列</text>
  <text x="880" y="236" text-anchor="middle" font-size="11" fill="#713f12">影子 topic 与影子消费组</text>
    <path d="M 752 120 H 878 V 192" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <rect x="790" y="284" width="180" height="52" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4"/>
  <text x="880" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#854d0e">影子消费者</text>
  <text x="880" y="324" text-anchor="middle" font-size="11" fill="#713f12">只处理影子 topic</text>
  <line x1="880" y1="250" x2="880" y2="280" stroke="#334155" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="30" y="368" width="940" height="150" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="48" y="392" font-size="13" font-weight="bold" fill="#991b1b">三个静默丢失点：都不报错，只有库里多出来的数据</text>

  <circle cx="60" cy="418" r="4" fill="#dc2626"/>
  <text x="76" y="423" font-size="11.5" fill="#7f1d1d">代理层覆盖了 X-Shadow：实测 1000 条压测请求全部以真实身份写进真实库，服务端日志全绿</text>
  <circle cx="60" cy="446" r="4" fill="#dc2626"/>
  <text x="76" y="451" font-size="11.5" fill="#7f1d1d">标记放在数据库连接的 session 变量上：连接池复用后，100 条真实请求全部写进影子库</text>
  <circle cx="60" cy="474" r="4" fill="#dc2626"/>
  <text x="76" y="479" font-size="11.5" fill="#7f1d1d">消息只序列化业务字段：染色断在发送那一刻，消费端按真实流量处理</text>
  <text x="76" y="503" font-size="11.5" fill="#7f1d1d">判据：标记必须挂在请求级上下文上，且随上下文跨线程、跨进程、跨消息传递</text>

  <rect x="30" y="534" width="940" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="554" font-size="12" fill="#334155">要点：隔离做对的标志不是「压测跑通了」，而是「压测结束后真实库的计数一条都没变」。</text>
  <text x="46" y="572" font-size="12" fill="#334155">所以压测前后都要对真实库做一次计数对账，而不是相信染色逻辑写对了。</text>
</svg>
