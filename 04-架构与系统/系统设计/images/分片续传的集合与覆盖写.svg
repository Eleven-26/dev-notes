<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">分片续传：存「已收到的集合」，落盘用覆盖写</text>
  <text x="30" y="63" font-size="13" fill="#64748b">对应正文 4.3 与 5.3，数字取自本机 transferlab/resume 的实测块（含 4 次重传的同一串事件）</text>

  <g transform="translate(20,80)">
    <rect x="0" y="0" width="960" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 乱序到达时，两种进度算法给出不同答案</text>

    <rect x="30" y="40" width="80" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="70" y="65" font-size="10" fill="#1e3a8a" text-anchor="middle">片 0 已到</text>
    <rect x="118" y="40" width="80" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="158" y="65" font-size="10" fill="#1e3a8a" text-anchor="middle">片 1 已到</text>
    <rect x="206" y="40" width="80" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="246" y="65" font-size="10" fill="#64748b" text-anchor="middle">缺</text>
    <rect x="294" y="40" width="80" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="334" y="65" font-size="10" fill="#64748b" text-anchor="middle">缺</text>
    <rect x="382" y="40" width="80" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="422" y="65" font-size="10" fill="#64748b" text-anchor="middle">缺</text>
    <rect x="470" y="40" width="80" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="510" y="65" font-size="10" fill="#1e3a8a" text-anchor="middle">片 5 已到</text>
    <rect x="558" y="40" width="80" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="598" y="65" font-size="10" fill="#64748b" text-anchor="middle">缺</text>
    <rect x="646" y="40" width="80" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="686" y="65" font-size="10" fill="#64748b" text-anchor="middle">缺</text>
    <rect x="734" y="40" width="80" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="774" y="65" font-size="10" fill="#64748b" text-anchor="middle">缺</text>
    <rect x="822" y="40" width="80" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="862" y="65" font-size="10" fill="#64748b" text-anchor="middle">缺</text>

    <text x="18" y="106" font-size="11" fill="#334155">分片是并发上传的，必然乱序到达：收到 0、1、5 之后，缺的是 [2 3 4 6 7 8 9]。</text>

    <rect x="20" y="118" width="450" height="58" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="34" y="140" font-size="11" font-weight="bold" fill="#14532d">按分片集合算：真实进度 3 / 10</text>
    <text x="34" y="162" font-size="10.5" fill="#14532d">元数据存「已收到的集合」，客户端补传缺的那几片</text>

    <rect x="490" y="118" width="450" height="58" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="504" y="140" font-size="11" font-weight="bold" fill="#991b1b">按连续 offset 算：offset 报 5，进度当成 2 / 10</text>
    <text x="504" y="162" font-size="10.5" fill="#991b1b">客户端从 6 继续，2 ~ 4 永远补不上</text>
  </g>

  <g transform="translate(20,290)">
    <rect x="0" y="0" width="960" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 落盘方式：实测两种写法的结果</text>

    <rect x="20" y="42" width="450" height="110" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="34" y="66" font-size="11.5" font-weight="bold" fill="#14532d">按分片序号写到固定偏移（覆盖写）</text>
    <text x="34" y="88" font-size="10.5" fill="#14532d">结果 40960 字节，与源文件同大小</text>
    <text x="34" y="108" font-size="10.5" fill="#14532d">sha256 前 16 位 dfb4847de067bacf，一致 = true</text>
    <text x="34" y="128" font-size="10.5" fill="#14532d">同一片传 N 次结果一样：天然幂等</text>

    <rect x="490" y="42" width="450" height="110" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="504" y="66" font-size="11.5" font-weight="bold" fill="#991b1b">往文件尾追加写</text>
    <text x="504" y="88" font-size="10.5" fill="#991b1b">膨胀到 57344 字节，多出 16384 字节</text>
    <text x="504" y="108" font-size="10.5" fill="#991b1b">sha256 前 16 位 0144f33e4e31e225，一致 = false</text>
    <text x="504" y="128" font-size="10.5" fill="#991b1b">重传让内容整体错位</text>

    <text x="18" y="168" font-size="10.5" fill="#64748b">重传是必然发生的：网络抖动、客户端重试、用户刷新——所以落盘不能 append。</text>
  </g>

  <g transform="translate(20,490)">
    <rect x="0" y="0" width="960" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">C. 合并：幂等，但仍要挡住三件事</text>

    <text x="18" y="50" font-size="11" fill="#334155">三次合并的 sha 都是 dfb4847de067bacf（三次一致 = true）——前提是「按偏移整体重写」，不是追加。</text>

    <rect x="20" y="62" width="300" height="58" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="34" y="84" font-size="10.5" font-weight="bold" fill="#92400e">分片没齐就合并</text>
    <text x="34" y="106" font-size="10.5" fill="#92400e">先校验缺的集合为空</text>

    <rect x="330" y="62" width="300" height="58" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="344" y="84" font-size="10.5" font-weight="bold" fill="#92400e">已合并后又有新分片到达</text>
    <text x="344" y="106" font-size="10.5" fill="#92400e">拒绝，或标记为需重建</text>

    <rect x="640" y="62" width="300" height="58" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="654" y="84" font-size="10.5" font-weight="bold" fill="#92400e">同一个 upload_id 两端同时合并</text>
    <text x="654" y="106" font-size="10.5" fill="#92400e">靠状态机 + 唯一键，不靠算法</text>

    <text x="18" y="142" font-size="11" fill="#475569">这三条都不是算法问题，是状态机问题——状态与合法转移见 4.1 的异步任务状态机图。</text>
    <text x="18" y="166" font-size="11" fill="#475569">秒传先算内容 SHA-256，命中就只建引用；分片大小通常 1~5 MB：太小元数据爆炸，太大重传代价高。</text>
    <text x="18" y="184" font-size="11" fill="#475569">中断留下的分片与导出结果文件都要有「超过 N 小时未完成/未下载就删」的清理任务。</text>
  </g>
</svg>
