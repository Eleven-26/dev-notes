<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="40" y="42" font-size="19" fill="#0f172a">存储角色分工全景：一个权威源，N 个派生副本</text>
  <text x="40" y="70" font-size="13" fill="#64748b">判据：这份数据丢了能不能重建？不能 → 权威源；能 → 副本（可丢、可重建）</text>

  <!-- 权威源 -->
  <rect x="340" y="100" width="320" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="126" font-size="15" fill="#1e3a8a" text-anchor="middle">权威源：MySQL</text>
  <text x="500" y="148" font-size="12" fill="#1e3a8a" text-anchor="middle">唯一真相 · 必须持久 · 不许丢</text>

  <!-- 四路连接 -->
  <line x1="500" y1="164" x2="155" y2="248" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="500" y1="164" x2="385" y2="248" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="500" y1="164" x2="615" y2="248" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="500" y1="164" x2="845" y2="248" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- 四个派生副本 -->
  <rect x="50" y="248" width="210" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="155" y="276" font-size="14" fill="#1e3a8a" text-anchor="middle">缓存</text>
  <text x="155" y="300" font-size="12" fill="#334155" text-anchor="middle">Redis / 本地缓存</text>
  <text x="155" y="322" font-size="11" fill="#64748b" text-anchor="middle">派生 · 可丢 · 高频随机读</text>

  <rect x="280" y="248" width="210" height="96" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="385" y="276" font-size="14" fill="#7c2d12" text-anchor="middle">检索副本</text>
  <text x="385" y="300" font-size="12" fill="#334155" text-anchor="middle">Elasticsearch</text>
  <text x="385" y="322" font-size="11" fill="#64748b" text-anchor="middle">派生 · 可丢 · 按词检索</text>

  <rect x="510" y="248" width="210" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="615" y="276" font-size="14" fill="#14532d" text-anchor="middle">分析副本</text>
  <text x="615" y="300" font-size="12" fill="#334155" text-anchor="middle">ClickHouse</text>
  <text x="615" y="322" font-size="11" fill="#64748b" text-anchor="middle">派生 · 可丢 · 扫描聚合</text>

  <rect x="740" y="248" width="210" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="845" y="276" font-size="14" fill="#334155" text-anchor="middle">归档 / 冷数据</text>
  <text x="845" y="300" font-size="12" fill="#334155" text-anchor="middle">对象存储 + 列存文件</text>
  <text x="845" y="322" font-size="11" fill="#64748b" text-anchor="middle">派生 · 可丢 · 罕见读出</text>

  <!-- 小结 -->
  <rect x="40" y="372" width="920" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="398" font-size="13" fill="#0f172a">要点：权威源只有一个，其余全是它的派生 —— 派生副本都可以丢、可以重算；</text>
  <text x="60" y="420" font-size="13" fill="#0f172a">真正的边界是「丢了能不能重建」，不是「数据重不重要」。</text>
</svg>
