<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="40" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">系统设计方法论：一条七步工作流</text>
  <text x="500" y="64" font-size="13" fill="#64748b" text-anchor="middle">先定边界与量级，再找第一性问题与瓶颈，然后分层加手段、说清代价，最后规划演进</text>

  <g transform="translate(20,84)">
    <rect x="0" y="0" width="960" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

    <rect x="20" y="40" width="205" height="66" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="122.5" y="68" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">① 澄清边界</text>
    <text x="122.5" y="88" font-size="10.5" fill="#1e3a8a" text-anchor="middle">范围 / 量级 / 约束</text>

    <rect x="245" y="40" width="205" height="66" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="347.5" y="68" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">② 量级估算</text>
    <text x="347.5" y="88" font-size="10.5" fill="#1e3a8a" text-anchor="middle">QPS / 存储 / 带宽 / 连接</text>

    <rect x="470" y="40" width="205" height="66" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="572.5" y="68" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">③ 找第一性问题</text>
    <text x="572.5" y="88" font-size="10.5" fill="#1e3a8a" text-anchor="middle">不解决它其它都白搭</text>

    <rect x="695" y="40" width="205" height="66" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="797.5" y="68" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">④ 定位瓶颈</text>
    <text x="797.5" y="88" font-size="10.5" fill="#1e3a8a" text-anchor="middle">哪个资源最先打满</text>

    <line x1="225" y1="73" x2="243" y2="73" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arw)"/>
    <line x1="450" y1="73" x2="468" y2="73" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arw)"/>
    <line x1="675" y1="73" x2="693" y2="73" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="735" y="190" width="205" height="66" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="837.5" y="218" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">⑤ 分层加手段</text>
    <text x="837.5" y="238" font-size="10.5" fill="#14532d" text-anchor="middle">缓存 / 异步 / 分片 / 多级</text>

    <rect x="510" y="190" width="205" height="66" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="612.5" y="218" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">⑥ 说清代价与兜底</text>
    <text x="612.5" y="238" font-size="10.5" fill="#14532d" text-anchor="middle">每层都假设它会挂</text>

    <rect x="285" y="190" width="205" height="66" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="387.5" y="218" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">⑦ 演进路线</text>
    <text x="387.5" y="238" font-size="10.5" fill="#14532d" text-anchor="middle">被瓶颈推着走</text>

    <line x1="797.5" y1="106" x2="797.5" y2="188" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arw)"/>
    <line x1="735" y1="223" x2="717" y2="223" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arwG)"/>
    <line x1="510" y1="223" x2="492" y2="223" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arwG)"/>

    <text x="18" y="284" font-size="11.5" fill="#475569">核心顺序：先想清楚「有什么、多大、第一问题是什么」，再决定「用什么手段」；顺序反了就是背组件清单。</text>
  </g>

  <g transform="translate(20,404)">
    <rect x="0" y="0" width="960" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

    <rect x="20" y="20" width="300" height="92" rx="8" fill="#ffedd5" stroke="#ea580c"/>
    <text x="34" y="48" font-size="12" font-weight="bold" fill="#7c2d12">估算是判量级</text>
    <text x="34" y="72" font-size="10.5" fill="#7c2d12">给区间、标假设、量级优先</text>
    <text x="34" y="92" font-size="10.5" fill="#7c2d12">一百与一百万才是两套方案</text>

    <rect x="340" y="20" width="300" height="92" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="354" y="48" font-size="12" font-weight="bold" fill="#1e3a8a">手段要带代价</text>
    <text x="354" y="72" font-size="10.5" fill="#1e3a8a">换来了什么</text>
    <text x="354" y="92" font-size="10.5" fill="#1e3a8a">付出了什么</text>

    <rect x="660" y="20" width="300" height="92" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="674" y="48" font-size="12" font-weight="bold" fill="#14532d">兜底四问</text>
    <text x="674" y="72" font-size="10.5" fill="#14532d">挂了 / 慢了 / 丢了 / 错了</text>
    <text x="674" y="92" font-size="10.5" fill="#14532d">每层都要能回答</text>
  </g>
</svg>
