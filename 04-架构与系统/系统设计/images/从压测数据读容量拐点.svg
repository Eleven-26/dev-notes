<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">两种发压模型读出的两条曲线：一条伪装健康，一条直接摊牌</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">被测服务固定 8 worker + 20ms 下游延迟，理论上限 400 QPS，每档 15 秒</text>

  <text x="30" y="94" font-size="13.5" font-weight="bold" fill="#0f172a">固定并发（closed）：吞吐锁死，延迟线性上升，错误率几乎为零</text>

  <line x1="140" y1="270" x2="700" y2="270" stroke="#334155" stroke-width="1.3"/>
  <line x1="140" y1="120" x2="140" y2="270" stroke="#334155" stroke-width="1.3"/>
  <text x="128" y="274" text-anchor="end" font-size="11" fill="#64748b">0</text>
  <text x="128" y="196" text-anchor="end" font-size="11" fill="#64748b">200</text>
  <text x="128" y="122" text-anchor="end" font-size="11" fill="#64748b">400</text>
  <text x="96" y="110" text-anchor="middle" font-size="11" fill="#1d4ed8">QPS</text>

  <polyline points="168,201.5 262,133.4 356,140.1 450,126.0 544,126.6 638,126.3 690,121.3"
            fill="none" stroke="#2563eb" stroke-width="2.6"/>
  <circle cx="168" cy="201.5" r="4" fill="#2563eb"/>
  <circle cx="262" cy="133.4" r="4" fill="#2563eb"/>
  <circle cx="356" cy="140.1" r="4" fill="#2563eb"/>
  <circle cx="450" cy="126" r="4" fill="#2563eb"/>
  <circle cx="544" cy="126.6" r="4" fill="#2563eb"/>
  <circle cx="638" cy="126.3" r="4" fill="#2563eb"/>
  <circle cx="690" cy="121.3" r="4" fill="#2563eb"/>
  <line x1="262" y1="120" x2="262" y2="270" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="270" y="112" font-size="11" fill="#1d4ed8">c=8 之后吞吐就锁在 370 到 400</text>

  <text x="168" y="286" text-anchor="middle" font-size="11" fill="#64748b">4</text>
  <text x="262" y="286" text-anchor="middle" font-size="11" fill="#64748b">8</text>
  <text x="356" y="286" text-anchor="middle" font-size="11" fill="#64748b">16</text>
  <text x="450" y="286" text-anchor="middle" font-size="11" fill="#64748b">32</text>
  <text x="544" y="286" text-anchor="middle" font-size="11" fill="#64748b">64</text>
  <text x="638" y="286" text-anchor="middle" font-size="11" fill="#64748b">128</text>
  <text x="690" y="286" text-anchor="middle" font-size="11" fill="#64748b">256</text>
  <text x="420" y="304" text-anchor="middle" font-size="11.5" fill="#334155">并发数</text>

  <line x1="700" y1="120" x2="700" y2="270" stroke="#dc2626" stroke-width="1.2"/>
  <text x="708" y="124" font-size="11" fill="#b91c1c">700ms</text>
  <text x="708" y="270" font-size="11" fill="#b91c1c">0</text>
  <text x="708" y="200" font-size="11" fill="#b91c1c">P50</text>

  <polyline points="168,265.5 262,265.5 356,261.2 450,252.4 544,234.9 638,199.9 690,130.9"
            fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="7 4"/>
  <text x="560" y="228" font-size="11" fill="#b91c1c">P50 随并发线性上升</text>
  <text x="470" y="312" font-size="11" fill="#b91c1c">256 并发时 P50 达 648.8ms，是 c=4 时的 30 倍</text>

  <rect x="30" y="322" width="940" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="46" y="342" font-size="11.5" fill="#991b1b">读法：256 并发时报告会写「400 QPS、P99 一秒、错误率 3.6%，建议扩容」，但一半用户已在等 648 毫秒以上</text>

  <text x="30" y="386" font-size="13.5" font-weight="bold" fill="#0f172a">固定速率（open）：成功、被拒、超时三种结局的构成</text>

  <line x1="150" y1="560" x2="912" y2="560" stroke="#334155" stroke-width="1.3"/>
  <line x1="150" y1="400" x2="150" y2="560" stroke="#334155" stroke-width="1.3"/>
  <text x="138" y="404" text-anchor="end" font-size="11" fill="#64748b">100%</text>
  <text x="138" y="484" text-anchor="end" font-size="11" fill="#64748b">50%</text>
  <text x="138" y="564" text-anchor="end" font-size="11" fill="#64748b">0</text>

  <rect x="176" y="400" width="100" height="160" fill="#16a34a"/>
  <rect x="328" y="400" width="100" height="159.8" fill="#16a34a"/>
  <rect x="328" y="559.8" width="100" height="0.2" fill="#ca8a04"/>
  <rect x="480" y="542.2" width="100" height="17.8" fill="#16a34a"/>
  <rect x="480" y="490.2" width="100" height="52" fill="#ca8a04"/>
  <rect x="480" y="400" width="100" height="90.2" fill="#dc2626"/>
  <rect x="632" y="551.8" width="100" height="8.2" fill="#16a34a"/>
  <rect x="632" y="503" width="100" height="48.8" fill="#ca8a04"/>
  <rect x="632" y="400" width="100" height="103" fill="#dc2626"/>
  <rect x="784" y="558.7" width="100" height="1.3" fill="#16a34a"/>
  <rect x="784" y="535.7" width="100" height="23" fill="#ca8a04"/>
  <rect x="784" y="400" width="100" height="135.7" fill="#dc2626"/>

  <text x="226" y="578" text-anchor="middle" font-size="11.5" fill="#334155">200</text>
  <text x="378" y="578" text-anchor="middle" font-size="11.5" fill="#334155">400</text>
  <text x="530" y="578" text-anchor="middle" font-size="11.5" fill="#334155">600</text>
  <text x="682" y="578" text-anchor="middle" font-size="11.5" fill="#334155">800</text>
  <text x="834" y="578" text-anchor="middle" font-size="11.5" fill="#334155">1200</text>
  <text x="520" y="596" text-anchor="middle" font-size="11.5" fill="#334155">发压端目标 QPS</text>

  <rect x="620" y="398" width="14" height="10" fill="#16a34a"/>
  <text x="640" y="407" font-size="11" fill="#166534">200 成功</text>
  <rect x="720" y="398" width="14" height="10" fill="#ca8a04"/>
  <text x="740" y="407" font-size="11" fill="#854d0e">503 被拒</text>
  <rect x="820" y="398" width="14" height="10" fill="#dc2626"/>
  <text x="840" y="407" font-size="11" fill="#991b1b">客户端超时</text>

  <rect x="30" y="610" width="940" height="22" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="626" font-size="12" fill="#334155">要点：400 与容量相等时延迟先塌 14 倍、错误几乎为零；600 起被拒与超时同时出现；1200 时 84.8% 连响应都没拿到。</text>
</svg>
