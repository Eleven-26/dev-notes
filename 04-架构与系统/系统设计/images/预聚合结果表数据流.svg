<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="sans-serif">
  <defs>
    <marker id="ar7" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#64748b"/>
    </marker>
    <marker id="ar7b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">预聚合结果表：把统计从「查询时算」前移到「定时算」</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">统计页慢，就慢在每次打开都在重新算一遍 —— 快起来的唯一有效办法是不在查询时做统计</text>

  <rect x="30" y="80" width="940" height="278" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>

  <rect x="44" y="110" width="200" height="100" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" rx="8"/>
  <text x="144" y="138" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">原始明细</text>
  <text x="144" y="160" font-size="11" fill="#334155" text-anchor="middle">要扫全量、要聚合、要排序</text>
  <text x="144" y="180" font-size="11" fill="#334155" text-anchor="middle">每次查询都重算一遍</text>

  <line x1="246" y1="160" x2="286" y2="160" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar7)"/>

  <rect x="290" y="98" width="300" height="124" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3" rx="8"/>
  <text x="440" y="124" font-size="13" font-weight="bold" fill="#7c2d12" text-anchor="middle">定时任务（每天 / 每小时）</text>
  <text x="306" y="150" font-size="11" fill="#7c2d12">① 筛窗口：回刷最近 N 天（不只算昨天）</text>
  <text x="306" y="172" font-size="11" fill="#7c2d12">② 纯函数聚合：同一份明细跑几次都一样</text>
  <text x="306" y="194" font-size="11" fill="#7c2d12">③ 整行覆盖 upsert（绝不累加，重跑不翻倍）</text>
  <text x="306" y="214" font-size="11" fill="#7c2d12">④ 结果按 (day, kind) 排序后写入</text>

  <line x1="592" y1="160" x2="636" y2="160" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar7)"/>

  <rect x="640" y="110" width="316" height="100" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" rx="8"/>
  <text x="798" y="138" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">结果表 stat_daily</text>
  <text x="656" y="160" font-size="11" fill="#14532d">主键就是查询粒度：(day, kind)</text>
  <text x="656" y="180" font-size="11" fill="#14532d">页面的读路径：WHERE + ORDER BY DESC + LIMIT</text>
  <text x="656" y="200" font-size="11" fill="#14532d">不含任何聚合、没有排序计算</text>

  <rect x="640" y="248" width="316" height="86" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" rx="8"/>
  <text x="798" y="276" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">用户打开统计页面</text>
  <text x="656" y="300" font-size="11" fill="#1e3a8a">直接查结果表，分页读（如每次 10 / 20 条）</text>
  <text x="656" y="320" font-size="11" fill="#1e3a8a">结果表外还可再套一层缓存（Redis / 本地）</text>

  <line x1="798" y1="246" x2="798" y2="214" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar7b)"/>
  <text x="812" y="236" font-size="10.5" fill="#1e3a8a">查结果表</text>

  <rect x="30" y="372" width="940" height="152" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="46" y="398" font-size="13.5" font-weight="bold" fill="#0f172a">预聚合 vs 实时聚合（实测对照：一次页面加载，3 天 × 2 指标）</text>

  <rect x="46" y="412" width="908" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="440" font-size="11.5" fill="#334155">实时聚合：扫 7 条明细 + 内存分组 —— 明细规模放大 100 倍时线性变贵</text>

  <rect x="46" y="462" width="908" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="490" font-size="11.5" fill="#334155">查结果表：5 次主键命中 —— 明细规模放大 100 倍时它不变</text>
</svg>
