<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#2563eb"/>
    </marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">异步任务状态机：只允许这些转移，转移本身也要幂等</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">转移靠 CAS 式 UPDATE（带旧状态），幂等靠 uk_idem 唯一索引，都不靠应用层 check</text>

  <rect x="130" y="110" width="175" height="60" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4" rx="10"/>
  <text x="217" y="146" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">pending</text>

  <rect x="430" y="110" width="175" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4" rx="10"/>
  <text x="517" y="146" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">running</text>

  <rect x="755" y="110" width="205" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" rx="10"/>
  <text x="857" y="146" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">succeeded</text>

  <rect x="430" y="250" width="175" height="60" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4" rx="10"/>
  <text x="517" y="286" font-size="15" font-weight="bold" fill="#7c2d12" text-anchor="middle">failed</text>

  <rect x="130" y="250" width="175" height="60" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" rx="10"/>
  <text x="217" y="286" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">canceled</text>

  <line x1="305" y1="140" x2="424" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#ah)"/>
  <text x="364" y="130" font-size="11.5" fill="#1e3a8a" text-anchor="middle">CAS 抢任务</text>

  <line x1="605" y1="140" x2="749" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#ah)"/>
  <text x="677" y="130" font-size="11.5" fill="#1e3a8a" text-anchor="middle">全部完成</text>

  <line x1="517" y1="170" x2="517" y2="244" stroke="#2563eb" stroke-width="2" marker-end="url(#ah)"/>
  <text x="530" y="218" font-size="11.5" fill="#1e3a8a">出错 / 有失败行</text>

  <line x1="217" y1="170" x2="217" y2="244" stroke="#2563eb" stroke-width="2" marker-end="url(#ah)"/>
  <text x="230" y="218" font-size="11.5" fill="#1e3a8a">未开始即取消</text>

  <path d="M480,310 L480,395 L40,395 L40,140 L124,140" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ahr)"/>
  <text x="250" y="412" font-size="11.5" fill="#334155">失败可被重试拉回 pending（虚线）</text>

  <rect x="30" y="432" width="940" height="112" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="46" y="456" font-size="13" font-weight="bold" fill="#0f172a">两个设计要点</text>
  <text x="46" y="480" font-size="11.5" fill="#334155">① 状态转移用 CAS 式 UPDATE：SET state='running' WHERE id=? AND state='pending'，看 RowsAffected——顺手挡住两个 worker 抢同一任务</text>
  <text x="46" y="502" font-size="11.5" fill="#334155">② 幂等落点是 uk_idem 唯一索引 (company_id, idem_key)：并发提交只有一条能插入，另一条直接返回已存在的任务，不需要分布式锁</text>
  <text x="46" y="524" font-size="11.5" fill="#334155">③ 只允许这些转移：pending→running→succeeded；running→failed（可重试）/ canceled；pending→canceled</text>
</svg>
