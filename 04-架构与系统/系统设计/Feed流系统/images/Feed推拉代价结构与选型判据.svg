<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="sans-serif">
  <defs>
    <marker id="arwS" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#94a3b8"/></marker>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwO" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#ea580c"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="30" y="42" font-size="19" fill="#0f172a">写扩散与读扩散：成本放在写侧还是读侧</text>
  <text x="30" y="68" font-size="13" fill="#64748b">推的扇出 = 作者的粉丝数 F；拉的合并路数 = 读者的关注数 M —— F 与 M 分属两个角色</text>

  <!-- 左上：推 -->
  <rect x="30" y="88" width="455" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="116" font-size="14" fill="#0f172a">推（写扩散）：成本压在发布那一下</text>
  <text x="50" y="138" font-size="11.5" fill="#64748b">A 发布 → 遍历粉丝列表 [f1, f2, ... , fN]，各追加一条</text>

  <rect x="50" y="152" width="140" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="120" y="177" font-size="13" fill="#1e3a8a" text-anchor="middle">用户 A</text>
  <text x="120" y="198" font-size="11.5" fill="#1e3a8a" text-anchor="middle">发布 1 条内容</text>

  <line x1="190" y1="170" x2="270" y2="166" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
  <line x1="190" y1="181" x2="270" y2="216" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
  <line x1="190" y1="192" x2="270" y2="266" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

  <rect x="270" y="146" width="200" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="284" y="163" font-size="12" fill="#1e3a8a">粉丝 f1 的时间线 inbox</text>
  <text x="284" y="179" font-size="10.5" fill="#1e3a8a">{ 内容 ID, 排序键 }</text>

  <rect x="270" y="196" width="200" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="284" y="213" font-size="12" fill="#1e3a8a">粉丝 f2 的时间线 inbox</text>
  <text x="284" y="229" font-size="10.5" fill="#1e3a8a">{ 内容 ID, 排序键 }</text>

  <rect x="270" y="246" width="200" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="284" y="263" font-size="12" fill="#334155">… 直到粉丝 fN 的 inbox</text>
  <text x="284" y="279" font-size="10.5" fill="#64748b">共写 F 条，扇出 = F</text>

  <text x="50" y="308" font-size="11.5" fill="#475569">写放大：1 条内容 → 产生 F 条时间线条目</text>
  <text x="50" y="328" font-size="11.5" fill="#475569">读取只读自己这一条线：O(1) + 取一页</text>

  <!-- 右上：拉 -->
  <rect x="505" y="88" width="465" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="525" y="116" font-size="14" fill="#0f172a">拉（读扩散）：成本压在每次读取</text>
  <text x="525" y="138" font-size="11.5" fill="#64748b">A 发布只写自己一份；B 读取时遍历 [u1, u2, ... , uM]</text>

  <rect x="525" y="146" width="200" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="539" y="163" font-size="12" fill="#334155">关注对象 u1 的 outbox</text>
  <text x="539" y="179" font-size="10.5" fill="#475569">各拉最近若干条</text>

  <rect x="525" y="196" width="200" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="539" y="213" font-size="12" fill="#334155">关注对象 u2 的 outbox</text>
  <text x="539" y="229" font-size="10.5" fill="#475569">各拉最近若干条</text>

  <rect x="525" y="246" width="200" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="539" y="263" font-size="12" fill="#334155">… 直到 uM 的 outbox</text>
  <text x="539" y="279" font-size="10.5" fill="#64748b">路数 = 关注数 M</text>

  <line x1="725" y1="166" x2="770" y2="200" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arwO)"/>
  <line x1="725" y1="216" x2="770" y2="220" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arwO)"/>
  <line x1="725" y1="266" x2="770" y2="240" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arwO)"/>

  <rect x="770" y="180" width="180" height="80" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="860" y="206" font-size="12.5" fill="#7c2d12" text-anchor="middle">合并 + 排序</text>
  <text x="860" y="226" font-size="11.5" fill="#9a3412" text-anchor="middle">按内容 ID 去重</text>
  <text x="860" y="248" font-size="11.5" fill="#9a3412" text-anchor="middle">取够一页返回</text>

  <text x="525" y="308" font-size="11.5" fill="#475569">发布成本 O(1)，与粉丝数无关</text>
  <text x="525" y="328" font-size="11.5" fill="#475569">读放大：一次读取要合并的路数 ∝ 关注数 M</text>

  <!-- 下：判据 -->
  <rect x="30" y="358" width="940" height="252" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="386" font-size="14" fill="#0f172a">选择判据：比总写放大 F × P 与总读放大 M × R</text>
  <text x="50" y="408" font-size="11.5" fill="#64748b">P = 发帖频次，R = 读频次；让总放大更大的那一侧，把成本推给另一侧</text>

  <rect x="50" y="428" width="164" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="62" y="450" font-size="12" fill="#0f172a">读远多于写</text>
  <text x="62" y="472" font-size="12" fill="#1e3a8a">→ 偏推</text>
  <text x="62" y="494" font-size="10.5" fill="#1e3a8a">写少：摊在少数写上</text>
  <text x="62" y="512" font-size="10.5" fill="#1e3a8a">读侧 O(1)</text>

  <rect x="234" y="428" width="164" height="96" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="246" y="450" font-size="12" fill="#0f172a">写远多于读</text>
  <text x="246" y="472" font-size="12" fill="#14532d">→ 偏拉</text>
  <text x="246" y="494" font-size="10.5" fill="#14532d">读少：摊在读侧</text>
  <text x="246" y="512" font-size="10.5" fill="#14532d">写侧 O(1)</text>

  <rect x="418" y="428" width="164" height="96" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="430" y="450" font-size="12" fill="#0f172a">粉丝数 &gt;&gt; 关注数</text>
  <text x="430" y="472" font-size="12" fill="#14532d">→ 该作者走拉</text>
  <text x="430" y="494" font-size="10.5" fill="#14532d">扇出 ∝ F，F 以百万计</text>
  <text x="430" y="512" font-size="10.5" fill="#14532d">一次发布即百万次写</text>

  <rect x="602" y="428" width="164" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="614" y="450" font-size="12" fill="#0f172a">关注数 &gt;&gt; 粉丝数</text>
  <text x="614" y="472" font-size="12" fill="#1e3a8a">→ 推，写侧便宜</text>
  <text x="614" y="494" font-size="10.5" fill="#1e3a8a">扇出小，发布成本低</text>
  <text x="614" y="512" font-size="10.5" fill="#1e3a8a">M 大要另想办法</text>

  <rect x="786" y="428" width="164" height="96" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="798" y="450" font-size="12" fill="#0f172a">活跃粉丝占比低</text>
  <text x="798" y="472" font-size="12" fill="#9a3412">→ 推拉结合</text>
  <text x="798" y="494" font-size="10.5" fill="#9a3412">只推在线活跃粉丝</text>
  <text x="798" y="512" font-size="10.5" fill="#9a3412">其余读取时现场拉</text>

  <text x="50" y="550" font-size="11.5" fill="#64748b">配色就是结论：蓝 = 推（写扩散），绿 = 拉（读扩散），橙 = 推拉结合。</text>
  <text x="50" y="574" font-size="11.5" fill="#64748b">这是方向性判据，不是「哪个一定好」：F、M、P、R 要落到具体业务里才有值。</text>
  <text x="50" y="598" font-size="11.5" fill="#64748b">两道压测线：发帖峰值 QPS × 粉丝数 超出可接受写吞吐就转拉或异步；关注数无上限就压不住合并路数。</text>
</svg>
