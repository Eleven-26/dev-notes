<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" font-weight="bold" fill="#0f172a">三个决策点的牵制链、接缝，与一次刷屏七步的落点</text>
  <text x="24" y="48" font-size="11" fill="#64748b">上半是 3.1 的依赖链与 3.2 的接缝，下半是第四节的七步与零件篇归属；整张图不含读数</text>

  <rect x="40" y="64" width="250" height="80" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="165" y="86" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">① 拉取模型</text>
  <text x="165" y="108" font-size="10" fill="#1e3a8a" text-anchor="middle">按阈值分流：普通用户推</text>
  <text x="165" y="126" font-size="10" fill="#1e3a8a" text-anchor="middle">大 V 只拉自己的发件箱</text>

  <rect x="375" y="64" width="250" height="80" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="500" y="86" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">② 存储形态</text>
  <text x="500" y="108" font-size="10" fill="#1e3a8a" text-anchor="middle">推 → 一人一条专属 inbox</text>
  <text x="500" y="126" font-size="10" fill="#1e3a8a" text-anchor="middle">拉 → 只有各人 outbox</text>

  <rect x="710" y="64" width="250" height="80" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="835" y="86" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">③ 分页方式</text>
  <text x="835" y="108" font-size="10" fill="#1e3a8a" text-anchor="middle">边翻边变 → 用游标</text>
  <text x="835" y="126" font-size="10" fill="#1e3a8a" text-anchor="middle">代价是失去跳页能力</text>

  <line x1="290" y1="104" x2="375" y2="104" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrD)"/>
  <line x1="625" y1="104" x2="710" y2="104" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrD)"/>

  <rect x="470" y="194" width="380" height="60" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="660" y="216" font-size="12" font-weight="bold" fill="#7c2d12" text-anchor="middle">接缝：多路合并去重</text>
  <text x="660" y="238" font-size="10" fill="#7c2d12" text-anchor="middle">同属问题②与③ · 去重键 = 内容 ID</text>

  <line x1="560" y1="194" x2="560" y2="149" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrD)"/>
  <line x1="800" y1="194" x2="800" y2="149" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrD)"/>
  <text x="680" y="178" font-size="10" fill="#ea580c" text-anchor="middle">两条短竖线 = 同属</text>

  <rect x="470" y="300" width="430" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="685" y="322" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">排序键：写入时就算好并冻结的那把分数</text>
  <text x="685" y="344" font-size="10" fill="#1e3a8a" text-anchor="middle">唯一（复合键破平）· 稳定（写入时算，读取只读不算）</text>

  <line x1="875" y1="300" x2="875" y2="149" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrD)"/>
  <text x="886" y="232" font-size="10" fill="#2563eb">唯一才能</text>
  <text x="886" y="248" font-size="10" fill="#2563eb">当游标</text>

  <path d="M 470,330 L 200,330 L 200,148" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#arrB)"/>
  <text x="212" y="322" font-size="10" fill="#2563eb">来回收敛：定完排序键常回头改模型与存储的假设</text>

  <rect x="40" y="390" width="920" height="224" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="54" y="412" font-size="12" font-weight="bold" fill="#0f172a">一次刷屏的七步，每步落在哪个零件篇</text>

  <rect x="60" y="424" width="200" height="60" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="160" y="446" font-size="11" fill="#334155" text-anchor="middle">① 落库</text>
  <text x="160" y="468" font-size="9.5" fill="#64748b" text-anchor="middle">存储全景 二</text>
  <rect x="290" y="424" width="200" height="60" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="390" y="446" font-size="11" fill="#334155" text-anchor="middle">② 判推 / 拉</text>
  <text x="390" y="468" font-size="9.5" fill="#64748b" text-anchor="middle">写扩散与读扩散 二</text>
  <rect x="520" y="424" width="200" height="60" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="620" y="446" font-size="11" fill="#334155" text-anchor="middle">③ 算排序键并写入</text>
  <text x="620" y="468" font-size="9.5" fill="#64748b" text-anchor="middle">排序与去重 二</text>
  <line x1="260" y1="454" x2="290" y2="454" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrD)"/>
  <line x1="490" y1="454" x2="520" y2="454" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrD)"/>
  <text x="760" y="448" font-size="11" fill="#475569">发布侧三步</text>
  <text x="760" y="468" font-size="10" fill="#94a3b8">写路径</text>

  <rect x="60" y="506" width="150" height="60" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="135" y="528" font-size="11" fill="#334155" text-anchor="middle">④ 取游标</text>
  <text x="135" y="550" font-size="9.5" fill="#64748b" text-anchor="middle">时间线存储与分页 二</text>
  <rect x="240" y="506" width="150" height="60" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="315" y="528" font-size="11" fill="#334155" text-anchor="middle">⑤ 读多路指针</text>
  <text x="315" y="550" font-size="9.5" fill="#64748b" text-anchor="middle">存储与分页 一、三</text>
  <rect x="420" y="506" width="150" height="60" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="495" y="528" font-size="11" fill="#334155" text-anchor="middle">⑥ 归并去重</text>
  <text x="495" y="550" font-size="9.5" fill="#64748b" text-anchor="middle">排序与去重 三</text>
  <rect x="600" y="506" width="150" height="60" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="675" y="528" font-size="11" fill="#334155" text-anchor="middle">⑦ 截断回带游标</text>
  <text x="675" y="550" font-size="9.5" fill="#64748b" text-anchor="middle">存储与分页 二、四</text>

  <line x1="210" y1="536" x2="240" y2="536" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrD)"/>
  <line x1="390" y1="536" x2="420" y2="536" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrD)"/>
  <line x1="570" y1="536" x2="600" y2="536" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrD)"/>
  <text x="790" y="530" font-size="11" fill="#475569">读取侧四步</text>
  <text x="790" y="550" font-size="10" fill="#94a3b8">读路径</text>

  <text x="60" y="594" font-size="10" fill="#475569">④⑤ 归「时间线存储与分页」　⑥⑦ 归「排序与去重」　每步下那行小字就是正文「落点」列的篇名与节号</text>
</svg>
