<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="sans-serif">
  <defs>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwG" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
    <marker id="arwR" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="30" y="42" font-size="19" fill="#0f172a">翻页稳定性：中途插入新内容，与降级兜底的两条时序</text>
  <text x="30" y="68" font-size="13" fill="#64748b">左：一次翻页会话的三个时刻（服务第四节）；右：一次取数调用的正常与降级路径（服务第五节）</text>

  <!-- 左：翻页会话 -->
  <rect x="30" y="88" width="455" height="460" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="116" font-size="14" fill="#0f172a">翻页会话：中途插入新内容怎么办</text>
  <text x="50" y="138" font-size="11.5" fill="#64748b">时间倒序天然不乱；乱的是综合排序 + 每次读取重算分数</text>

  <line x1="68" y1="152" x2="68" y2="300" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="68" y1="174" x2="90" y2="174" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
  <line x1="68" y1="230" x2="90" y2="230" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
  <line x1="68" y1="286" x2="90" y2="286" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

  <rect x="90" y="152" width="380" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="104" y="170" font-size="11.5" fill="#1e3a8a">t1：取第 1 页，末条分数 = s → 游标 cursor = s</text>
  <text x="104" y="188" font-size="10.5" fill="#1e3a8a">第 2 页取「分数 &lt; s」的（左开区间，s 那条不再读出）</text>

  <rect x="90" y="208" width="380" height="44" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="104" y="226" font-size="11.5" fill="#7c2d12">t2：会话进行中来了新内容 N</text>
  <text x="104" y="244" font-size="10.5" fill="#9a3412">综合排序下 N 的分数可能落在 s 之下（新但热度低）</text>

  <rect x="90" y="264" width="380" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="104" y="282" font-size="11.5" fill="#1e3a8a">t3：取第 2 页，请求仍带 cursor = s</text>
  <text x="104" y="300" font-size="10.5" fill="#1e3a8a">时间倒序：N 只会出现在下次刷新的顶部</text>

  <text x="50" y="326" font-size="12" fill="#0f172a">三种处理策略</text>

  <rect x="50" y="338" width="130" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="60" y="358" font-size="11.5" fill="#14532d">① 冻结排序键</text>
  <text x="60" y="378" font-size="10.5" fill="#14532d">写入时算好</text>
  <text x="60" y="396" font-size="10.5" fill="#14532d">读取只读不算</text>
  <text x="60" y="414" font-size="10.5" fill="#14532d">会话不受影响</text>
  <text x="60" y="430" font-size="10.5" fill="#166534">推荐</text>

  <rect x="192" y="338" width="130" height="100" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="202" y="358" font-size="11.5" fill="#92400e">② 会话快照</text>
  <text x="202" y="378" font-size="10.5" fill="#92400e">开始时固定</text>
  <text x="202" y="396" font-size="10.5" fill="#92400e">一个排序版本</text>
  <text x="202" y="414" font-size="10.5" fill="#92400e">整会话一致</text>
  <text x="202" y="430" font-size="10.5" fill="#b45309">代价：要维护快照</text>

  <rect x="335" y="338" width="130" height="100" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="345" y="358" font-size="11.5" fill="#334155">③ 允许插入</text>
  <text x="345" y="378" font-size="10.5" fill="#334155">新内容照插</text>
  <text x="345" y="396" font-size="10.5" fill="#334155">靠内容 ID 去重</text>
  <text x="345" y="414" font-size="10.5" fill="#334155">实现最简单</text>
  <text x="345" y="430" font-size="10.5" fill="#991b1b">代价：顺序会跳动</text>

  <text x="50" y="464" font-size="11" fill="#64748b">最糟的是分数漂移：分数每次都重算，now 变了，</text>
  <text x="50" y="484" font-size="11" fill="#64748b">同一内容两次读数不同 → 游标对不上（时间倒序无此问题）。</text>
  <text x="50" y="508" font-size="11" fill="#64748b">策略①是默认解：写入时确定、读取只读；只有「会话内</text>
  <text x="50" y="528" font-size="11" fill="#64748b">排序必须完全一致」是硬要求时，才值得为②付快照成本。</text>

  <!-- 右：降级调用 -->
  <rect x="505" y="88" width="465" height="460" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="525" y="116" font-size="14" fill="#0f172a">降级调用：退回时间倒序这条默认序</text>
  <text x="525" y="138" font-size="11.5" fill="#64748b">排序与特征服务只决定好不好看，不是真相；它挂了也要出结果</text>

  <text x="580" y="166" font-size="11.5" fill="#0f172a" text-anchor="middle">客户端</text>
  <text x="760" y="166" font-size="11.5" fill="#0f172a" text-anchor="middle">Feed 服务</text>
  <text x="922" y="166" font-size="11.5" fill="#0f172a" text-anchor="middle">排序 / 特征服务</text>

  <line x1="580" y1="176" x2="580" y2="306" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="760" y1="176" x2="760" y2="306" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="922" y1="176" x2="922" y2="306" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <line x1="580" y1="200" x2="760" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
  <text x="590" y="194" font-size="10.5" fill="#2563eb">取一页（带 cursor）</text>

  <line x1="760" y1="232" x2="922" y2="232" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
  <text x="770" y="226" font-size="10.5" fill="#2563eb">Rank：设短超时</text>

  <line x1="922" y1="264" x2="760" y2="264" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>
  <text x="770" y="258" font-size="10.5" fill="#16a34a">正常：返回综合分序</text>

  <line x1="760" y1="296" x2="580" y2="296" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>
  <text x="588" y="290" font-size="10.5" fill="#dc2626">超时 / 报错 / 特征缺失 → 降级</text>

  <rect x="525" y="318" width="425" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="539" y="340" font-size="11.5" fill="#991b1b">兜底默认序 = 时间倒序（发号器 ID 从大到小）</text>
  <text x="539" y="360" font-size="11" fill="#991b1b">唯一、单调、可游标；依赖最少（只要有发布时间的记录）</text>

  <rect x="525" y="382" width="425" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="539" y="404" font-size="11.5" fill="#14532d">不返回空、不返回随机；和主链路共用同一套时间线存储，</text>
  <text x="539" y="424" font-size="11" fill="#14532d">只是把分数换成纯时间戳或 ID。</text>

  <text x="525" y="458" font-size="11" fill="#64748b">超时预算要短：别让首屏被一个慢依赖拖死。</text>
  <text x="525" y="478" font-size="11" fill="#64748b">降级开关：能一键切到默认序，故障时快速恢复。</text>
  <text x="525" y="498" font-size="11" fill="#64748b">降级要可观测：必须有降级率指标，否则会长期静默降级。</text>
  <text x="525" y="518" font-size="11" fill="#64748b">冷启动：新用户没有行为特征，个性化无从谈起，直接走默认序。</text>
</svg>
