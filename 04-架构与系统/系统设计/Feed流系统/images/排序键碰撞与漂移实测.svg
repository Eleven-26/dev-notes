<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="690" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">排序键两条硬要求的实测后果：同秒碰撞整档跳过，每页重算既重复又漏</text>
  <text x="30" y="62" font-size="13" fill="#64748b">上两区是 6.1 的真实翻页读数，下区是 6.2 的五页会话读数；同一次实测里重复条数始终等于漏条数</text>

  <rect x="20" y="78" width="960" height="208" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="100" font-size="15" font-weight="bold" fill="#0f172a">① 不唯一：c05 至 c09 五条同秒，游标落到这一档就整档跳过</text>

  <rect x="52" y="112" width="66" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="85" y="137" font-size="12" fill="#1e3a8a" text-anchor="middle">c01</text>
  <rect x="124" y="112" width="66" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="157" y="137" font-size="12" fill="#1e3a8a" text-anchor="middle">c02</text>
  <rect x="196" y="112" width="66" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="229" y="137" font-size="12" fill="#1e3a8a" text-anchor="middle">c03</text>
  <rect x="268" y="112" width="66" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="301" y="137" font-size="12" fill="#1e3a8a" text-anchor="middle">c04</text>

  <rect x="340" y="106" width="366" height="66" rx="8" fill="none" stroke="#ea580c" stroke-dasharray="5 4"/>
  <text x="340" y="196" font-size="10.5" fill="#ea580c">同秒档：五条分数都是 1700000008，档内按成员名逆序排</text>
  <rect x="340" y="112" width="66" height="40" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="373" y="137" font-size="12" fill="#7c2d12" text-anchor="middle">c09</text>
  <rect x="412" y="112" width="66" height="40" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="445" y="137" font-size="12" fill="#7c2d12" text-anchor="middle">c08</text>
  <rect x="484" y="112" width="66" height="40" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="517" y="137" font-size="12" fill="#7c2d12" text-anchor="middle">c07</text>
  <rect x="556" y="112" width="66" height="40" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="589" y="137" font-size="12" fill="#7c2d12" text-anchor="middle">c06</text>
  <rect x="628" y="112" width="66" height="40" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="661" y="137" font-size="12" fill="#991b1b" text-anchor="middle">c05</text>

  <rect x="698" y="112" width="66" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="731" y="137" font-size="12" fill="#1e3a8a" text-anchor="middle">c10</text>
  <rect x="770" y="112" width="66" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="803" y="137" font-size="12" fill="#1e3a8a" text-anchor="middle">c11</text>
  <rect x="842" y="112" width="66" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="875" y="137" font-size="12" fill="#1e3a8a" text-anchor="middle">c12</text>

  <text x="85" y="172" font-size="9" fill="#64748b" text-anchor="middle">1700000012</text>
  <text x="157" y="172" font-size="9" fill="#64748b" text-anchor="middle">1700000011</text>
  <text x="229" y="172" font-size="9" fill="#64748b" text-anchor="middle">1700000010</text>
  <text x="301" y="172" font-size="9" fill="#64748b" text-anchor="middle">1700000009</text>
  <text x="373" y="172" font-size="9" fill="#ea580c" text-anchor="middle">1700000008</text>
  <text x="445" y="172" font-size="9" fill="#ea580c" text-anchor="middle">1700000008</text>
  <text x="517" y="172" font-size="9" fill="#ea580c" text-anchor="middle">1700000008</text>
  <text x="589" y="172" font-size="9" fill="#ea580c" text-anchor="middle">1700000008</text>
  <text x="661" y="172" font-size="9" fill="#dc2626" text-anchor="middle">1700000008</text>
  <text x="731" y="172" font-size="9" fill="#64748b" text-anchor="middle">1700000007</text>
  <text x="803" y="172" font-size="9" fill="#64748b" text-anchor="middle">1700000006</text>
  <text x="875" y="172" font-size="9" fill="#64748b" text-anchor="middle">1700000005</text>

  <rect x="624" y="98" width="2" height="86" fill="#dc2626"/>
  <text x="612" y="220" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="end">第 2 页用完，游标 cursor = 1700000008</text>
  <line x1="624" y1="224" x2="624" y2="238" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrK)"/>

  <text x="36" y="250" font-size="11.5" fill="#334155">pageSize=4：收到 11 条 · 漏 1 条（c05）</text>
  <text x="36" y="268" font-size="11.5" fill="#334155">pageSize=3：收到 9 条 · 漏 3 条（c05 c06 c07）</text>
  <text x="36" y="286" font-size="11.5" fill="#334155">pageSize=5：收到 8 条 · 漏 4 条（c05 c06 c07 c08）</text>
  <text x="470" y="250" font-size="11.5" fill="#334155">左开区间按分数排除，同档没展示完的一律取不到；三档重复都是 0 条</text>
  <text x="470" y="268" font-size="11.5" fill="#334155">同一路内的重试另算：同一成员连同分数再写两次，ZCARD 12 → 12</text>
  <text x="470" y="286" font-size="11.5" fill="#334155">破平办法：分数写成时间戳 × 1000 加发号器低位，见第二区</text>

  <rect x="20" y="296" width="960" height="108" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="36" y="318" font-size="15" font-weight="bold" fill="#14532d">② 破平后：12 个分数互不相同，游标只排除「严格小于」的部分</text>
  <text x="36" y="348" font-size="11" fill="#334155">分数：170000012000 · 170000011000 · 170000010000 · 170000009000 · 170000008050 · 170000008040 · 170000008030</text>
  <text x="36" y="368" font-size="11" fill="#334155">　　　170000008020 · 170000008010 · 170000007000 · 170000006000 · 170000005000</text>
  <text x="36" y="392" font-size="11.5" font-weight="bold" fill="#14532d">实测：pageSize 取 4 / 3 / 5 都是 收到 12 条 · 重复 0 · 漏 0；连跑三轮读数完全一致</text>

  <rect x="20" y="414" width="960" height="256" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="436" font-size="15" font-weight="bold" fill="#0f172a">③ 不稳定：每页重算分数，游标用的刻度和集合里的刻度错开</text>
  <text x="36" y="456" font-size="11.5" fill="#64748b">候选 200 条、每页 20 条、翻 5 页，期望展示 100 条；横条长度等于漏的条数（实测里它与重复条数相等）</text>

  <text x="36" y="496" font-size="12" fill="#334155">页间隔 1 小时</text>
  <text x="210" y="496" font-size="11.5" fill="#16a34a">冻结：重复 0 · 漏 0</text>
  <rect x="470" y="484" width="50" height="14" rx="3" fill="#fee2e2" stroke="#dc2626"/>
  <text x="530" y="496" font-size="11.5" fill="#991b1b">重算：重复 5 · 漏 5</text>
  <text x="210" y="516" font-size="10.5" fill="#64748b">两次读数：冻结 4.174568491 / 4.174568491　重算 4.174568491 → 4.172355343</text>

  <text x="36" y="552" font-size="12" fill="#334155">页间隔 6 小时</text>
  <text x="210" y="552" font-size="11.5" fill="#16a34a">冻结：重复 0 · 漏 0</text>
  <rect x="470" y="540" width="100" height="14" rx="3" fill="#fee2e2" stroke="#dc2626"/>
  <text x="580" y="552" font-size="11.5" fill="#991b1b">重算：重复 10 · 漏 10</text>
  <text x="210" y="572" font-size="10.5" fill="#64748b">两次读数：冻结 4.174568491 / 4.174568491　重算 4.174568491 → 4.161474144</text>

  <text x="36" y="608" font-size="12" fill="#334155">页间隔 24 小时</text>
  <text x="210" y="608" font-size="11.5" fill="#16a34a">冻结：重复 0 · 漏 0</text>
  <rect x="470" y="596" width="290" height="14" rx="3" fill="#fee2e2" stroke="#dc2626"/>
  <text x="770" y="608" font-size="11.5" fill="#991b1b">重算：重复 29 · 漏 29</text>
  <text x="210" y="628" font-size="10.5" fill="#64748b">两次读数：冻结 4.174568491 / 4.174568491　重算 4.174568491 → 4.124686729</text>

  <text x="36" y="656" font-size="11" fill="#475569">只断言趋势：页间隔越长，重复与漏越多。输入是确定性的，连跑四轮读数完全相同，所以这里报多轮一致而不是波动范围。</text>
</svg>
