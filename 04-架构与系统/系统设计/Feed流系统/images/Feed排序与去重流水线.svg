<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>
  <text x="30" y="42" font-size="19" fill="#0f172a">Feed 排序与去重流水线：一个排序键 + 一次归并去重</text>
  <text x="30" y="68" font-size="13" fill="#64748b">排序键要求唯一且稳定；去重键用内容 ID；兜底退回时间倒序</text>

  <!-- ① 排序键 -->
  <text x="30" y="96" font-size="14" fill="#0f172a">① 排序键：多个信号加权求和，写入时算好并冻结</text>

  <rect x="30" y="110" width="200" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="130" y="135" font-size="13" fill="#1e3a8a" text-anchor="middle">时间衰减</text>
  <text x="130" y="154" font-size="12" fill="#1e3a8a" text-anchor="middle">越新越大</text>

  <rect x="250" y="110" width="200" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="350" y="135" font-size="13" fill="#1e3a8a" text-anchor="middle">热度（互动量）</text>
  <text x="350" y="154" font-size="12" fill="#1e3a8a" text-anchor="middle">取对数压量纲</text>

  <rect x="470" y="110" width="200" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="570" y="135" font-size="13" fill="#1e3a8a" text-anchor="middle">亲密度</text>
  <text x="570" y="154" font-size="12" fill="#1e3a8a" text-anchor="middle">归一化到 0~1</text>

  <rect x="690" y="110" width="200" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="790" y="135" font-size="13" fill="#1e3a8a" text-anchor="middle">兴趣匹配</text>
  <text x="790" y="154" font-size="12" fill="#1e3a8a" text-anchor="middle">预估点击率</text>

  <line x1="130" y1="166" x2="130" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="350" y1="166" x2="350" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="570" y1="166" x2="570" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="790" y1="166" x2="790" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="130" y1="180" x2="790" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="460" y1="180" x2="460" y2="196" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="260" y="196" width="400" height="54" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="460" y="222" font-size="13" fill="#7c2d12" text-anchor="middle">加权求和，写入时算好并冻结</text>
  <text x="460" y="242" font-size="12" fill="#9a3412" text-anchor="middle">排序键 = (score, 内容 ID) 复合键</text>

  <!-- ② 多路合并去重 -->
  <text x="30" y="286" font-size="14" fill="#0f172a">② 多路合并去重：惰性归并 + 按内容 ID 去重</text>

  <rect x="30" y="300" width="260" height="56" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="160" y="334" font-size="13" fill="#334155" text-anchor="middle">自己的 inbox（推来的）</text>

  <rect x="370" y="300" width="260" height="56" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="500" y="334" font-size="13" fill="#334155" text-anchor="middle">关注大 V 的 outbox（现场拉的）</text>

  <rect x="710" y="300" width="260" height="56" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="840" y="334" font-size="13" fill="#334155" text-anchor="middle">推荐 / 广告插入</text>

  <line x1="160" y1="356" x2="160" y2="370" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="500" y1="356" x2="500" y2="370" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="840" y1="356" x2="840" y2="370" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="160" y1="370" x2="840" y2="370" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="500" y1="370" x2="500" y2="386" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="230" y="386" width="540" height="54" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="500" y="412" font-size="13" fill="#7c2d12" text-anchor="middle">惰性 k 路归并：每路只取当前头部，堆顶取最大</text>
  <text x="500" y="432" font-size="12" fill="#9a3412" text-anchor="middle">取够一页即停，避免某一路先取满整页再被丢弃</text>

  <line x1="500" y1="440" x2="500" y2="456" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="300" y="456" width="400" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="500" y="487" font-size="13" fill="#14532d" text-anchor="middle">按内容 ID 去重：跨路同一内容只留一条</text>

  <line x1="500" y1="506" x2="500" y2="522" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="340" y="522" width="320" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="552" font-size="13" fill="#1e3a8a" text-anchor="middle">返回一页，并回带新游标</text>

  <!-- 注记 -->
  <text x="30" y="614" font-size="12" fill="#64748b">分页中途插入新内容：排序键写入时冻结 + 游标左开区间，新内容只出现在下次刷新的顶部。</text>
  <text x="30" y="638" font-size="12" fill="#64748b">兜底：个性化不可用时退回时间倒序（发号器 ID 倒序）—— 依赖最少（只需发布时间），永远可用。</text>
  <text x="30" y="662" font-size="12" fill="#94a3b8">排序键唯一靠复合键破平；稳定靠「写入算好、读取只读」，否则 now 变化会让分数漂移、游标失效。</text>
</svg>
