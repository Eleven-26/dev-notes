<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="570" fill="#ffffff"/>

  <text x="30" y="40" font-size="21" font-weight="bold" fill="#0f172a">缓冲五档下慢连接丢弃与快连接收到的对照</text>
  <text x="30" y="68" font-size="13" fill="#475569">一次广播 1000 条，两个订阅者：慢的不消费、快的正常消费；每档缓冲各测一次</text>

  <text x="460" y="96" font-size="12" fill="#9a3412">慢连接丢弃 = 1000 减去慢连接收到</text>
  <text x="460" y="114" font-size="12" fill="#1e3a8a">缓冲 1024 时慢连接全部收到，丢弃归零</text>

  <rect x="130" y="106" width="14" height="14" fill="#fed7aa" stroke="#ea580c" stroke-width="1.2"/>
  <text x="150" y="118" font-size="12" fill="#334155">慢连接丢弃</text>
  <rect x="250" y="106" width="14" height="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="270" y="118" font-size="12" fill="#334155">快连接收到</text>

  <line x1="120" y1="145" x2="120" y2="430" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="120" y1="430" x2="930" y2="430" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="110" y1="150" x2="119" y2="150" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="104" y="154" font-size="11" fill="#64748b" text-anchor="end">1000</text>
  <text x="104" y="434" font-size="11" fill="#64748b" text-anchor="end">0</text>
  <text x="40" y="140" font-size="11" fill="#64748b">条数</text>

  <rect x="130" y="150" width="62" height="280" fill="#fed7aa" stroke="#ea580c" stroke-width="1.3"/>
  <rect x="204" y="150" width="62" height="280" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <rect x="290" y="150.3" width="62" height="279.7" fill="#fed7aa" stroke="#ea580c" stroke-width="1.3"/>
  <rect x="364" y="150" width="62" height="280" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <rect x="450" y="152.2" width="62" height="277.8" fill="#fed7aa" stroke="#ea580c" stroke-width="1.3"/>
  <rect x="524" y="150" width="62" height="280" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <rect x="610" y="167.9" width="62" height="262.1" fill="#fed7aa" stroke="#ea580c" stroke-width="1.3"/>
  <rect x="684" y="150" width="62" height="280" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <rect x="770" y="414" width="62" height="14" fill="#f8fafc" stroke="#ea580c" stroke-width="1.3"/>
  <rect x="844" y="150" width="62" height="280" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>

  <text x="161" y="144" font-size="11" fill="#9a3412" text-anchor="middle">1000</text>
  <text x="235" y="144" font-size="11" fill="#1e3a8a" text-anchor="middle">1000</text>
  <text x="321" y="144" font-size="11" fill="#9a3412" text-anchor="middle">999</text>
  <text x="395" y="144" font-size="11" fill="#1e3a8a" text-anchor="middle">1000</text>
  <text x="481" y="146" font-size="11" fill="#9a3412" text-anchor="middle">992</text>
  <text x="555" y="144" font-size="11" fill="#1e3a8a" text-anchor="middle">1000</text>
  <text x="641" y="162" font-size="11" fill="#9a3412" text-anchor="middle">936</text>
  <text x="715" y="144" font-size="11" fill="#1e3a8a" text-anchor="middle">1000</text>
  <text x="801" y="425" font-size="11" fill="#9a3412" text-anchor="middle">0</text>
  <text x="875" y="144" font-size="11" fill="#1e3a8a" text-anchor="middle">1000</text>

  <text x="198" y="452" font-size="11" fill="#334155" text-anchor="middle">缓冲 0</text>
  <text x="358" y="452" font-size="11" fill="#334155" text-anchor="middle">缓冲 1</text>
  <text x="518" y="452" font-size="11" fill="#334155" text-anchor="middle">缓冲 8</text>
  <text x="678" y="452" font-size="11" fill="#334155" text-anchor="middle">缓冲 64</text>
  <text x="838" y="452" font-size="11" fill="#334155" text-anchor="middle">缓冲 1024</text>

  <rect x="50" y="476" width="900" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="70" y="500" font-size="13" font-weight="bold" fill="#0f172a">要点：缓冲从 0 加到 1024，慢连接的丢弃从 1000 一路降到 0；同一时间快连接始终收到 1000 条。</text>
  <text x="70" y="524" font-size="12" fill="#334155">所以缓冲买的是「这一个连接能容忍卡多久」，不是「整房间的稳定」——慢连接的丢弃不传染别人。</text>
  <text x="70" y="546" font-size="12" fill="#64748b">注意：以上是 go test 的真实输出（本机单进程、内存版 Bus），不是理想值。</text>
</svg>
