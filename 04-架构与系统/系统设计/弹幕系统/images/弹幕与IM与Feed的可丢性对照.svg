<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680">
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">弹幕 / IM / Feed 流对照：可丢性决定落库方式与降级方向</text>
  <text x="500" y="56" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#475569">六行判据逐格抄自正文第四节的对比表，角色口径见第一节、派生判据见第三节</text>

  <rect x="30" y="78" width="160" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="110" y="102" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="bold" fill="#334155">对比项</text>
  <rect x="196" y="78" width="252" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="322" y="102" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">弹幕系统</text>
  <rect x="456" y="78" width="252" height="36" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="582" y="102" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">IM</text>
  <rect x="716" y="78" width="252" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="842" y="102" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="bold" fill="#14532d">Feed 流</text>

  <rect x="30" y="122" width="160" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="110" y="164" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">数据可丢吗</text>
  <rect x="196" y="122" width="252" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="322" y="150" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#1e3a8a">可丢：走内存 Pub/Sub</text>
  <text x="322" y="172" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#1e3a8a">丢了不影响核心体验</text>
  <rect x="456" y="122" width="252" height="72" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="582" y="150" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#991b1b">不能丢</text>
  <text x="582" y="172" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#991b1b">必须落库 + ACK + 补拉</text>
  <rect x="716" y="122" width="252" height="72" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="842" y="150" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#166534">时间线副本可丢</text>
  <text x="842" y="172" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#166534">内容本体不可丢</text>

  <rect x="30" y="198" width="160" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="110" y="240" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">权威源</text>
  <rect x="196" y="198" width="252" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="322" y="226" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#1e3a8a">MySQL（弹幕本体）</text>
  <text x="322" y="248" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#1e3a8a">量再大转列存 / 日志</text>
  <rect x="456" y="198" width="252" height="72" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="582" y="240" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#991b1b">MySQL（会话 + 消息）</text>
  <rect x="716" y="198" width="252" height="72" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="842" y="240" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#166534">MySQL（内容本体）</text>

  <rect x="30" y="274" width="160" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="110" y="316" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">热副本的角色</text>
  <rect x="196" y="274" width="252" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="322" y="302" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#1e3a8a">写入口 + 扇出（Pub/Sub）</text>
  <text x="322" y="324" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#1e3a8a">兼作读加速</text>
  <rect x="456" y="274" width="252" height="72" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="582" y="302" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#991b1b">读加速</text>
  <text x="582" y="324" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#991b1b">近期消息热窗口</text>
  <rect x="716" y="274" width="252" height="72" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="842" y="302" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#166534">读加速</text>
  <text x="842" y="324" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#166534">时间线 ZSet</text>

  <rect x="30" y="350" width="160" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="110" y="392" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">落库方式</text>
  <rect x="196" y="350" width="252" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="322" y="378" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#1e3a8a">先写内存</text>
  <text x="322" y="400" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#1e3a8a">异步批量落库</text>
  <rect x="456" y="350" width="252" height="72" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="582" y="392" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#991b1b">写时同步落库</text>
  <rect x="716" y="350" width="252" height="72" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="842" y="392" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#166534">主要写内容本体</text>

  <rect x="30" y="426" width="160" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="110" y="468" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">必须做的事</text>
  <rect x="196" y="426" width="252" height="72" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="322" y="468" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="bold" fill="#7c2d12">⭐ 实时链 / 历史链分开</text>
  <rect x="456" y="426" width="252" height="72" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="582" y="468" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#991b1b">断线补拉</text>
  <rect x="716" y="426" width="252" height="72" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="842" y="468" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#166534">翻页时回源</text>

  <rect x="30" y="502" width="160" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="110" y="544" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">降级方向</text>
  <rect x="196" y="502" width="252" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="322" y="530" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#1e3a8a">宁可丢掉几条</text>
  <text x="322" y="552" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#1e3a8a">不可拖垮直播（fail-open）</text>
  <rect x="456" y="502" width="252" height="72" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="582" y="530" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#991b1b">宁可晚到</text>
  <text x="582" y="552" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#991b1b">不可丢消息</text>
  <rect x="716" y="502" width="252" height="72" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="842" y="530" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#166534">宁可空一屏</text>
  <text x="842" y="552" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#166534">不可错序</text>

  <text x="30" y="604" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#64748b">一句话：别处的热副本丢了是「变慢」或「要补」，弹幕的热副本丢了就是丢了、也不打算补，这正是它敢用最轻方案的底气。</text>
  <text x="30" y="628" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#64748b">判据只有一句：丢了能不能从别处重建。权威源只有一个，其余全是它的派生，派生载体可以丢、可以换、可以重建。</text>
  <text x="30" y="652" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#64748b">边界：本图只对照存储角色与降级方向，弹幕侧的链路细节见总体设计与编排与落库两篇，IM 与 Feed 侧不在本篇范围。</text>
</svg>
