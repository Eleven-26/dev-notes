<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="400" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">一条弹幕在推送链路上的字节流转，与链上仅有的两个丢弃点</text>

  <rect x="45" y="80" width="170" height="85" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="130" y="105" font-size="13" fill="#1e3a8a" text-anchor="middle">Publish(topic, m)</text>
  <text x="130" y="127" font-size="12" fill="#1e40af" text-anchor="middle">m.Encode() 拼四段</text>
  <text x="130" y="148" font-size="12" fill="#1e40af" text-anchor="middle">48 字节（实测）</text>

  <path d="M 215 122 L 230 122" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="230" y="80" width="170" height="85" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="315" y="105" font-size="13" fill="#0f172a" text-anchor="middle">Redis 主题 topic</text>
  <text x="315" y="127" font-size="12" fill="#475569" text-anchor="middle">载荷仍是一行文本</text>
  <text x="315" y="148" font-size="12" fill="#475569" text-anchor="middle">所有节点订同一主题</text>

  <path d="M 400 122 L 415 122" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="415" y="80" width="170" height="85" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="500" y="105" font-size="13" fill="#7c2d12" text-anchor="middle">Channel(1024) 有界</text>
  <text x="500" y="127" font-size="12" fill="#9a3412" text-anchor="middle">慢消费者在这里丢</text>
  <text x="500" y="148" font-size="12" fill="#9a3412" text-anchor="middle">而不是打爆内存</text>

  <path d="M 585 122 L 600 122" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="600" y="80" width="170" height="85" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="685" y="105" font-size="13" fill="#1e3a8a" text-anchor="middle">订阅协程</text>
  <text x="685" y="127" font-size="12" fill="#1e40af" text-anchor="middle">for s := range ch</text>
  <text x="685" y="148" font-size="12" fill="#1e40af" text-anchor="middle">逐条交给 handler</text>

  <path d="M 770 122 L 785 122" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="785" y="80" width="170" height="85" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="870" y="105" font-size="13" fill="#14532d" text-anchor="middle">Decode 校验</text>
  <text x="870" y="127" font-size="12" fill="#166534" text-anchor="middle">SplitN 切 4 段</text>
  <text x="870" y="148" font-size="12" fill="#166534" text-anchor="middle">不足 4 段返回 false</text>

  <text x="500" y="185" font-size="12" fill="#b91c1c" text-anchor="middle">丢弃点一：通道满</text>
  <text x="130" y="185" font-size="12" fill="#b91c1c" text-anchor="middle">丢弃点零：入口限流命中</text>

  <rect x="45" y="210" width="280" height="95" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="185" y="235" font-size="13" fill="#7f1d1d" text-anchor="middle">Pub/Sub 不保留消息</text>
  <text x="185" y="259" font-size="12" fill="#b91c1c" text-anchor="middle">节点订阅之前发的永久丢失</text>
  <text x="185" y="281" font-size="12" fill="#b91c1c" text-anchor="middle">重连后要按 Seq 从落库链路补齐</text>

  <rect x="355" y="210" width="280" height="95" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="495" y="235" font-size="13" fill="#7c2d12" text-anchor="middle">Seq = INCR(topic:seq)</text>
  <text x="495" y="259" font-size="12" fill="#9a3412" text-anchor="middle">它是补漏的依据</text>
  <text x="495" y="281" font-size="12" fill="#9a3412" text-anchor="middle">不只是用来排序</text>

  <rect x="665" y="210" width="290" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="810" y="235" font-size="13" fill="#0f172a" text-anchor="middle">Client 单例，订阅独占连接</text>
  <text x="810" y="259" font-size="12" fill="#475569" text-anchor="middle">每房间每连接各建 client</text>
  <text x="810" y="281" font-size="12" fill="#475569" text-anchor="middle">等于把连接池按请求数放大</text>

  <text x="30" y="340" font-size="12" fill="#64748b">要点：省的不是 CPU，是每台机器每秒几万条乘以连接数的那份带宽；这条链上每加一次序列化，成本都乘在扇出上。</text>
  <text x="30" y="362" font-size="12" fill="#64748b">丢弃只发生在两处（入口限流、有界通道满），中间环节一律只做搬运与校验，脏数据在 Decode 处就被挡回去。</text>
</svg>
