<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">弹幕数据面：tab 线格式的体积账，与 Publisher 的两个实现</text>

  <g transform="translate(20,58)">
    <rect x="0" y="0" width="960" height="238" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 一条弹幕在网络上长什么样：四段 tab 分隔</text>
    <text x="18" y="46" font-size="10.5" fill="#64748b">Encode 用 strings.Join 拼三段再补 tab 与序号；Decode 用 SplitN 切 4 段</text>

    <rect x="18" y="62" width="140" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="88" y="86" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">room</text>
    <text x="88" y="110" font-size="10" fill="#1e40af" text-anchor="middle">房间名</text>

    <text x="174" y="98" font-size="10" fill="#64748b" text-anchor="middle">tab</text>

    <rect x="190" y="62" width="120" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="250" y="86" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">uid</text>
    <text x="250" y="110" font-size="10" fill="#1e40af" text-anchor="middle">发送者</text>

    <text x="326" y="98" font-size="10" fill="#64748b" text-anchor="middle">tab</text>

    <rect x="342" y="62" width="200" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="442" y="86" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">text</text>
    <text x="442" y="110" font-size="10" fill="#1e40af" text-anchor="middle">弹幕正文，宽度不定</text>

    <text x="558" y="98" font-size="10" fill="#64748b" text-anchor="middle">tab</text>

    <rect x="574" y="62" width="120" height="64" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="634" y="86" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">seq</text>
    <text x="634" y="110" font-size="10" fill="#475569" text-anchor="middle">服务端发号</text>

    <rect x="710" y="62" width="232" height="64" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="826" y="82" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">实测：同一条弹幕</text>
    <text x="826" y="102" font-size="10.5" fill="#166534" text-anchor="middle">线格式 48 字节 · JSON 82 字节</text>
    <text x="826" y="120" font-size="10.5" fill="#166534" text-anchor="middle">省 1.7 倍</text>

    <text x="18" y="152" font-size="11" fill="#334155">一句话：这里省的不是 CPU，是每台机器每秒几万条 × 连接数的那份带宽；换成 Protobuf 还能再小一半以上（字段名不进载荷）。</text>
    <text x="18" y="174" font-size="11" fill="#334155">Decode 是入口的第一道校验：切不出 4 段就返回 false，脏数据不进后面的任何链路。</text>
    <text x="18" y="196" font-size="11" fill="#991b1b">契约缺口：现有 Msg 只有 Seq、没有视频时间戳，客户端同步要补 offset_ms（详见弹幕渲染与同步篇）。</text>
    <text x="18" y="218" font-size="11" fill="#64748b">线格式与这个 Msg 类型是地基，第 1 层限流与第 4 层抽象都建立在它上面。</text>
  </g>

  <g transform="translate(20,314)">
    <rect x="0" y="0" width="960" height="206" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 两个接入点：Limiter 挡在入口，Publisher 抽象跨节点扇出</text>

    <rect x="18" y="46" width="210" height="50" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="123" y="68" font-size="11.5" font-weight="bold" fill="#92400e" text-anchor="middle">Limiter 接口</text>
    <text x="123" y="88" font-size="10" fill="#92400e" text-anchor="middle">Allow(ctx, uid) bool</text>

    <line x1="123" y1="98" x2="123" y2="110" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="18" y="112" width="210" height="50" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="123" y="134" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">FixedWindow 占位实现</text>
    <text x="123" y="154" font-size="10" fill="#1e40af" text-anchor="middle">seen map + dur 窗口</text>

    <text x="244" y="68" font-size="11" fill="#92400e">窗口内已见过 → 直接丢弃</text>
    <text x="244" y="88" font-size="11" fill="#92400e">不进入后面任何一条链路</text>
    <text x="244" y="134" font-size="11" fill="#991b1b">多节点各放一遍 = 配置值的 N 倍</text>
    <text x="244" y="154" font-size="11" fill="#991b1b">多节点部署必须换成共享计数</text>
    <text x="244" y="180" font-size="10.5" fill="#64748b">算法细节在稳定性三件套篇已写透，这里只留接入点</text>

    <rect x="500" y="46" width="240" height="50" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="620" y="68" font-size="11.5" font-weight="bold" fill="#334155" text-anchor="middle">Publisher 接口</text>
    <text x="620" y="88" font-size="10" fill="#475569" text-anchor="middle">Publish / Subscribe / Seq</text>

    <path d="M 560 96 L 560 108" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 700 96 L 700 108" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="500" y="112" width="200" height="50" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="600" y="134" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">RedisPublisher（生产）</text>
    <text x="600" y="154" font-size="9.5" fill="#1e40af" text-anchor="middle">PUBLISH + SUBSCRIBE + INCR</text>

    <rect x="740" y="112" width="200" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="840" y="134" font-size="11.5" font-weight="bold" fill="#334155" text-anchor="middle">Bus（本机实验）</text>
    <text x="840" y="154" font-size="10" fill="#475569" text-anchor="middle">单进程，只证逻辑对不对</text>

    <text x="500" y="182" font-size="10.5" fill="#991b1b">坑①：Subscribe 独占一条连接</text>
    <text x="712" y="182" font-size="10.5" fill="#991b1b">坑②：不保留消息，重连后用 Seq 补齐</text>
    <text x="18" y="200" font-size="10.5" fill="#64748b">Client 单例：每个房间、每条连接各建一个 client，等于把连接池按请求数放大</text>
  </g>
</svg>
