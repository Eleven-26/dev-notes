<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="sans-serif">
  <defs>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">客户端取数与绘制：三条数据源汇入时间轴队列，历史按区间预拉</text>

  <g transform="translate(20,58)">
    <rect x="0" y="0" width="960" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 渲染循环与数据源解耦：每帧只从队列里取</text>

    <rect x="18" y="48" width="190" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="113" y="75" font-size="11" fill="#1e3a8a" text-anchor="middle">历史拉取（按区间）</text>
    <rect x="18" y="102" width="190" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="113" y="129" font-size="11" fill="#14532d" text-anchor="middle">实时推送（服务端扇出）</text>
    <rect x="18" y="156" width="190" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="113" y="183" font-size="11" fill="#334155" text-anchor="middle">本地发送后回显</text>

    <path d="M 208 70 L 296 108" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrT)"/>
    <path d="M 208 124 L 296 124" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrT)"/>
    <path d="M 208 178 L 296 142" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrT)"/>

    <rect x="300" y="76" width="230" height="96" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="415" y="102" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">时间轴队列</text>
    <text x="415" y="126" font-size="10.5" fill="#92400e" text-anchor="middle">按 offset_ms 排序</text>
    <text x="415" y="148" font-size="10.5" fill="#92400e" text-anchor="middle">按 Seq 去重、乱序重排</text>

    <path d="M 530 124 L 566 124" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrT)"/>

    <rect x="570" y="98" width="150" height="52" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="645" y="120" font-size="11.5" font-weight="bold" fill="#334155" text-anchor="middle">渲染循环</text>
    <text x="645" y="140" font-size="10" fill="#475569" text-anchor="middle">每帧一次</text>

    <path d="M 720 124 L 746 124" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrT)"/>

    <rect x="750" y="98" width="190" height="52" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="845" y="120" font-size="11" fill="#1e3a8a" text-anchor="middle">取「该显示且未过期」的</text>
    <text x="845" y="140" font-size="10" fill="#1e40af" text-anchor="middle">分配轨道 → 绘制</text>

    <text x="18" y="212" font-size="11" fill="#334155">好处：新增一个数据源（比如「只看某人」的过滤）不用碰渲染代码——三条来源都不直接改渲染。</text>
    <text x="18" y="234" font-size="11" fill="#64748b">队列同时负责去重与乱序重排：历史与实时的重叠区间靠服务端分配的 Seq 判定，不要用文本当键。</text>
  </g>

  <g transform="translate(20,326)">
    <rect x="0" y="0" width="960" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 历史弹幕按需拉：一次一个时间区间，进度快到头就预拉下一段</text>

    <rect x="40" y="56" width="196" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="138" y="83" font-size="11" fill="#14532d" text-anchor="middle">首屏 [0s, 10s]</text>
    <rect x="246" y="56" width="196" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="344" y="83" font-size="11" fill="#1e3a8a" text-anchor="middle">预拉 [10s, 20s]</text>
    <rect x="452" y="56" width="196" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="550" y="83" font-size="11" fill="#475569" text-anchor="middle">这一段还没拉</text>
    <rect x="690" y="56" width="250" height="44" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="815" y="83" font-size="11" fill="#991b1b" text-anchor="middle">seek → 丢弃 + 重取 + 重置轨道</text>

    <line x1="240" y1="50" x2="240" y2="106" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="240" y="44" font-size="10" fill="#991b1b" text-anchor="middle">播放进度</text>

    <text x="18" y="130" font-size="11" fill="#334155">① 进入房间拉「当前进度附近的一段」作首屏，同时订阅实时推送，把新弹幕接到时间轴上。</text>
    <text x="18" y="152" font-size="11" fill="#334155">② 进度接近已拉区间尾部时异步预拉下一段，避免「播到了还没拉到」的空窗。</text>
    <text x="18" y="174" font-size="11" fill="#334155">③ 拖动要节流：只在松手后按最终位置发一次请求，不每移动一像素发一次；回退到已拉过的区间可用本地缓存。</text>
    <text x="18" y="196" font-size="11" fill="#334155">④ 响应可能比请求区间略大，按当前进度裁掉过期的再入队；接口最好带上该区间的 Seq 起止范围，拉全没有可判定。</text>
    <text x="18" y="222" font-size="11" fill="#991b1b">满屏取舍：单连接收到的量仍可能远超屏幕能显示的条数，轨道分配是最后一层「丢掉画不下的」。</text>
  </g>
</svg>
