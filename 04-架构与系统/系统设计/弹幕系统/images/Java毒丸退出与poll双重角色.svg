<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" font-family="sans-serif">
  <defs>
    <marker id="arrJ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="570" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">Java 侧两处最容易走样的机制：毒丸退出与 poll 的双重角色</text>

  <g transform="translate(20,58)">
    <rect x="0" y="0" width="960" height="272" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 关闭一条连接：Java 没有 close(chan)，只能塞毒丸</text>

    <rect x="80" y="44" width="180" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="170" y="66" font-size="11.5" fill="#1e3a8a" text-anchor="middle">写侧 broadcast 线程</text>
    <rect x="380" y="44" width="220" height="34" rx="6" fill="#fef3c7" stroke="#b45309"/>
    <text x="490" y="66" font-size="11.5" fill="#92400e" text-anchor="middle">ArrayBlockingQueue 有界</text>
    <rect x="700" y="44" width="200" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="800" y="66" font-size="11.5" fill="#14532d" text-anchor="middle">drain 消费线程</text>

    <line x1="170" y1="78" x2="170" y2="240" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="490" y1="78" x2="490" y2="240" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="800" y1="78" x2="800" y2="240" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

    <line x1="170" y1="100" x2="486" y2="100" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrJ)"/>
    <text x="328" y="94" font-size="10" fill="#1e3a8a" text-anchor="middle">① trySend：out.offer(m)</text>
    <text x="170" y="122" font-size="10" fill="#92400e">② 队列满 → offer 返回 false → dropped++，绝不阻塞调用方</text>

    <line x1="800" y1="146" x2="494" y2="146" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrK)"/>
    <text x="650" y="140" font-size="10" fill="#14532d" text-anchor="middle">③ out.take() 无限期等待</text>
    <text x="500" y="168" font-size="10" fill="#64748b">不用 poll(超时)：1000 个连接各自每 20ms 醒一次会变成空转开销</text>

    <line x1="170" y1="192" x2="486" y2="192" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrJ)"/>
    <text x="328" y="186" font-size="10" fill="#1e3a8a" text-anchor="middle">④ close()：closed 置位后 offer(POISON)</text>

    <line x1="494" y1="216" x2="796" y2="216" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrK)"/>
    <text x="650" y="210" font-size="10" fill="#14532d" text-anchor="middle">⑤ 取到 POISON（seq = -1）→ return</text>

    <text x="18" y="240" font-size="10.5" fill="#991b1b">真差异：队列满时毒丸也可能塞不进，消费线程就不退出；这里接受不完美（daemon 线程，进程退出自然回收），</text>
    <text x="18" y="260" font-size="10.5" fill="#991b1b">生产做法是给出队侧预留一个空位，或改成 poll 超时轮询 closed 标志。</text>
  </g>

  <g transform="translate(20,346)">
    <rect x="0" y="0" width="960" height="204" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 消费循环：poll 的超时同时充当「取数据」和「定时」</text>

    <rect x="18" y="44" width="180" height="52" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="108" y="66" font-size="10.5" fill="#1e3a8a" text-anchor="middle">queue.poll(flushMillis)</text>
    <text x="108" y="86" font-size="10" fill="#1e40af" text-anchor="middle">拿到 m 还是 null？</text>

    <path d="M 198 58 L 276 56" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrJ)"/>
    <path d="M 198 82 L 276 118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrJ)"/>

    <rect x="280" y="36" width="250" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="405" y="56" font-size="10.5" fill="#14532d" text-anchor="middle">m != null：batch.add(m)</text>
    <text x="405" y="74" font-size="10" fill="#166534" text-anchor="middle">batch.size() ≥ max 就写</text>

    <rect x="280" y="96" width="250" height="44" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="405" y="116" font-size="10.5" fill="#92400e" text-anchor="middle">m == null：timeUp</text>
    <text x="405" y="134" font-size="10" fill="#92400e" text-anchor="middle">batch 非空也要写掉</text>

    <path d="M 530 58 L 616 58" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrJ)"/>
    <path d="M 530 118 L 616 118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrJ)"/>

    <rect x="620" y="36" width="310" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="775" y="56" font-size="10.5" fill="#14532d" text-anchor="middle">sink.write(new ArrayList(batch))</text>
    <text x="775" y="74" font-size="10" fill="#166534" text-anchor="middle">flushed.addAndGet(batch.size())</text>

    <rect x="620" y="96" width="310" height="44" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="775" y="116" font-size="10.5" fill="#991b1b" text-anchor="middle">stop 且队列空 → break</text>
    <text x="775" y="134" font-size="10" fill="#991b1b" text-anchor="middle">退出前把剩下的 batch 写掉</text>

    <text x="18" y="168" font-size="10.5" fill="#334155">Go 用 select{case ch / case ticker / case ctx.Done}；Java 少一个 ticker，语义等价：拿到就攒批，等不到就把已有的写掉。</text>
    <text x="18" y="190" font-size="10.5" fill="#64748b">对照实测：①②③结论逐格相同；③ 队列 500 / 入队 2000 时 Java 浮动更大（600~1461），消费者线程启动时机决定它抢到多少条。</text>
  </g>
</svg>
