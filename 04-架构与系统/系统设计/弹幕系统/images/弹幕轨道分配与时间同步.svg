<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="sans-serif">
  <defs>
    <marker id="dArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="dArrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">弹幕渲染与同步：轨道分配（结构）与时间对齐（时序）</text>
  <text x="30" y="63" font-size="13" fill="#64748b">轨道＝碰撞判定；时间＝把服务端 offset 校准到播放进度，seek 后必须重拉</text>

  <g transform="translate(20,84)">
    <rect x="0" y="0" width="960" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 轨道分配：新弹幕要放进哪一条轨？</text>

    <line x1="880" y1="54" x2="880" y2="170" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="880" y="46" font-size="10" fill="#64748b" text-anchor="middle">入口（右边界）</text>

    <rect x="60" y="56" width="820" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <rect x="600" y="58" width="200" height="28" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="700" y="76" font-size="10.5" fill="#991b1b" text-anchor="middle">① 尾端未离开入口</text>

    <rect x="60" y="100" width="820" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <rect x="200" y="102" width="200" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="300" y="120" font-size="10.5" fill="#14532d" text-anchor="middle">② 尾端已离开入口</text>

    <rect x="60" y="144" width="820" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="80" y="164" font-size="10.5" fill="#64748b">③ 空闲 → 直接可用</text>

    <rect x="60" y="190" width="820" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="470" y="217" font-size="12" fill="#1e3a8a" text-anchor="middle">该轨可用 ⇔ (t_now − t_prev) × 速度 ≥ 上一条宽度 + 最小间距</text>
  </g>

  <g transform="translate(20,354)">
    <rect x="0" y="0" width="960" height="246" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 时间同步：把弹幕 offset 映射到本次播放进度</text>

    <rect x="60" y="44" width="140" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
    <text x="130" y="65" font-size="11.5" fill="#334155" text-anchor="middle">服务端</text>
    <rect x="400" y="44" width="160" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="480" y="65" font-size="11.5" fill="#1e3a8a" text-anchor="middle">客户端播放器</text>
    <rect x="740" y="44" width="140" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="810" y="65" font-size="11.5" fill="#14532d" text-anchor="middle">弹幕渲染</text>

    <line x1="130" y1="76" x2="130" y2="214" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="480" y1="76" x2="480" y2="214" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="810" y1="76" x2="810" y2="214" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

    <line x1="130" y1="98" x2="476" y2="98" stroke="#2563eb" stroke-width="1.6" marker-end="url(#dArr)"/>
    <text x="303" y="92" font-size="10.5" fill="#1e3a8a" text-anchor="middle">① 返回 {serverTs, 弹幕[offset_ms]}</text>

    <path d="M480,112 L520,112 L520,128 L484,128" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#dArr)"/>
    <text x="498" y="124" font-size="10.5" fill="#1e3a8a">② 记 offset = serverTs − 本地时钟</text>

    <line x1="480" y1="152" x2="806" y2="152" stroke="#16a34a" stroke-width="1.6" marker-end="url(#dArrg)"/>
    <text x="643" y="146" font-size="10.5" fill="#14532d" text-anchor="middle">③ 按当前进度选中该时刻弹幕</text>

    <path d="M810,166 L770,166 L770,182 L808,182" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#dArr)"/>
    <text x="806" y="178" font-size="10.5" fill="#475569" text-anchor="end">④ seek / 倍速 → 重算并重拉</text>

    <line x1="130" y1="206" x2="806" y2="206" stroke="#2563eb" stroke-width="1.6" marker-end="url(#dArr)"/>
    <text x="470" y="200" font-size="10.5" fill="#1e3a8a" text-anchor="middle">⑤ 实时弹幕补 offset 后入轴</text>

    <text x="18" y="232" font-size="11" fill="#475569">漂移：定期用一次往返取半重估 offset；seek 后按新进度重拉，不能沿用旧时间轴。</text>
  </g>
</svg>
