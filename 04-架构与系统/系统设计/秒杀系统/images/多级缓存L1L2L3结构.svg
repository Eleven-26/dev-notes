<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="sans-serif">
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrGg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">多级缓存 L1 / L2 / L3：每往左挪一层，成本差一个数量级</text>
  <text x="30" y="63" font-size="13" fill="#64748b">L1 本地（进程内）→ L2 Redis → L3 MySQL；miss 才往下走，命中就原路返回</text>

  <g transform="translate(20,82)">
    <rect x="0" y="0" width="960" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

    <rect x="20" y="76" width="96" height="52" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <text x="68" y="107" font-size="12" fill="#334155" text-anchor="middle">读请求</text>

    <path d="M 116 102 L 158 102" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrG)"/>

    <rect x="160" y="58" width="180" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="250" y="86" font-size="13" fill="#1e3a8a" text-anchor="middle">L1 本地缓存</text>
    <text x="250" y="106" font-size="10.5" fill="#2563eb" text-anchor="middle">进程内 · TTL 1s / 3s</text>
    <text x="250" y="124" font-size="10.5" fill="#2563eb" text-anchor="middle">~20ns</text>
    <text x="250" y="140" font-size="10.5" fill="#1e3a8a" text-anchor="middle">别的进程删不掉它</text>

    <text x="362" y="50" font-size="10.5" fill="#64748b" text-anchor="middle">miss</text>
    <path d="M 340 102 L 382 102" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrG)"/>

    <rect x="384" y="58" width="180" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="474" y="86" font-size="13" fill="#1e3a8a" text-anchor="middle">L2 Redis</text>
    <text x="474" y="108" font-size="10.5" fill="#2563eb" text-anchor="middle">~200µs</text>
    <text x="474" y="126" font-size="10.5" fill="#2563eb" text-anchor="middle">「打 Redis 次数」可直接数</text>

    <text x="586" y="50" font-size="10.5" fill="#64748b" text-anchor="middle">miss → singleflight</text>
    <path d="M 564 102 L 606 102" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrG)"/>

    <rect x="608" y="58" width="180" height="92" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <text x="698" y="86" font-size="13" fill="#334155" text-anchor="middle">L3 MySQL</text>
    <text x="698" y="108" font-size="10.5" fill="#64748b" text-anchor="middle">~1ms</text>
    <text x="698" y="126" font-size="10.5" fill="#64748b" text-anchor="middle">回源即「打 DB 次数」</text>

    <path d="M 698 150 L 698 178 L 250 178 L 250 150" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrGg)"/>
    <text x="474" y="196" font-size="10.5" fill="#64748b" text-anchor="middle">回填：查到的新值再写回 L2 / L1</text>

    <text x="18" y="200" font-size="11.5" fill="#475569">成本链（正文口径）：CDN ~0 → Nginx ~50µs → L1 ~20ns → L2 ~200µs → L3 ~1ms；读侧目标是把请求挡在越靠前越好。</text>
  </g>

  <g transform="translate(20,306)">
    <rect x="0" y="0" width="960" height="182" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">三组对照（20000 次读、200 并发，热点集中在 100 个商品上）</text>

    <rect x="18" y="40" width="924" height="26" rx="5" fill="#e2e8f0"/>
    <text x="30" y="58" font-size="11" fill="#334155">策略</text>
    <text x="400" y="58" font-size="11" fill="#334155">总耗时</text>
    <text x="500" y="58" font-size="11" fill="#334155">本地命中</text>
    <text x="620" y="58" font-size="11" fill="#334155">打 Redis</text>
    <text x="740" y="58" font-size="11" fill="#334155">打 DB</text>

    <text x="30" y="88" font-size="11" fill="#334155">A 只用 L2（Redis）</text>
    <text x="400" y="88" font-size="11" fill="#991b1b">10.619s</text>
    <text x="500" y="88" font-size="11" fill="#334155">0</text>
    <text x="620" y="88" font-size="11" fill="#991b1b">20000</text>
    <text x="740" y="88" font-size="11" fill="#334155">323</text>

    <text x="30" y="114" font-size="11" fill="#334155">B L1(本地 1s) + L2(Redis)</text>
    <text x="400" y="114" font-size="11" fill="#334155">2.778s</text>
    <text x="500" y="114" font-size="11" fill="#334155">19403</text>
    <text x="620" y="114" font-size="11" fill="#14532d">597</text>
    <text x="740" y="114" font-size="11" fill="#334155">433</text>

    <text x="30" y="140" font-size="11" fill="#334155">C L1(3s) + L2 + singleflight</text>
    <text x="400" y="140" font-size="11" fill="#334155">501ms</text>
    <text x="500" y="140" font-size="11" fill="#334155">19181</text>
    <text x="620" y="140" font-size="11" fill="#14532d">101</text>
    <text x="740" y="140" font-size="11" fill="#14532d">100</text>

    <text x="18" y="164" font-size="11.5" fill="#475569">确定量是「打 Redis / 打 DB 次数」：A→B 打 Redis 降约 33 倍，B→C 再降约 6 倍（打 DB = 100 = 商品种类数）。</text>
    <text x="18" y="178" font-size="11" fill="#94a3b8">注意：总耗时这一列不稳（A 组跑过 2.99s / 3.43s / 10.62s），别当结论 —— 主张的是「下游被访问的次数降下来了」。</text>
  </g>
</svg>
