<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">红包拆分：总额 100 元、100 个红包的两种拆法</text>
  <text x="30" y="63" font-size="13" fill="#64748b">稀缺资源不是「份数」而是「金额」—— 用拆分模型，不是库存模型</text>

  <!-- 二倍均值 -->
  <g transform="translate(20,82)">
    <rect x="0" y="0" width="960" height="170" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="16" y="26" font-size="15" fill="#0f172a">二倍均值法（每次在 [1, 2×剩余均值] 里随机取，单位：分）</text>

    <line x1="40" y1="150" x2="720" y2="150" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="56" y="144" width="44" height="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <rect x="142" y="68" width="44" height="82" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <rect x="228" y="103" width="44" height="47" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <rect x="314" y="91" width="44" height="59" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <rect x="400" y="135" width="44" height="15" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <rect x="486" y="142" width="44" height="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <rect x="572" y="63" width="44" height="87" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <rect x="658" y="117" width="44" height="33" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>

    <text x="78" y="140" font-size="9.5" fill="#1e3a8a" text-anchor="middle">14</text>
    <text x="164" y="64" font-size="9.5" fill="#1e3a8a" text-anchor="middle">181</text>
    <text x="250" y="99" font-size="9.5" fill="#1e3a8a" text-anchor="middle">103</text>
    <text x="336" y="87" font-size="9.5" fill="#1e3a8a" text-anchor="middle">129</text>
    <text x="422" y="131" font-size="9.5" fill="#1e3a8a" text-anchor="middle">33</text>
    <text x="508" y="138" font-size="9.5" fill="#1e3a8a" text-anchor="middle">17</text>
    <text x="594" y="59" font-size="9.5" fill="#1e3a8a" text-anchor="middle">191</text>
    <text x="680" y="113" font-size="9.5" fill="#1e3a8a" text-anchor="middle">72</text>
    <text x="380" y="168" font-size="10" fill="#64748b" text-anchor="middle">前 8 个红包金额（分）</text>

    <text x="748" y="42" font-size="12" fill="#0f172a">总额 10000 分</text>
    <text x="748" y="66" font-size="12" fill="#0f172a">最小值 1 / 最大值 193</text>
    <text x="748" y="90" font-size="11.5" fill="#475569">平均 100 分</text>
    <text x="748" y="114" font-size="11.5" fill="#14532d">参差但期望相等</text>
    <text x="748" y="138" font-size="11.5" fill="#14532d">总额恒等于 10000 分</text>
  </g>

  <!-- 固定均分 -->
  <g transform="translate(20,262)">
    <rect x="0" y="0" width="960" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="16" y="26" font-size="15" fill="#0f172a">固定均分（每份都是总额 / 份数）</text>

    <line x1="40" y1="84" x2="720" y2="84" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="56" y="38" width="44" height="46" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <rect x="142" y="38" width="44" height="46" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <rect x="228" y="38" width="44" height="46" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <rect x="314" y="38" width="44" height="46" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <rect x="400" y="38" width="44" height="46" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <rect x="486" y="38" width="44" height="46" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <rect x="572" y="38" width="44" height="46" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <rect x="658" y="38" width="44" height="46" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <text x="380" y="102" font-size="10" fill="#64748b" text-anchor="middle">前 8 个：每份都是 100</text>

    <text x="748" y="42" font-size="12" fill="#0f172a">总额 10000 分</text>
    <text x="748" y="66" font-size="12" fill="#0f172a">最小值 100 / 最大值 100</text>
    <text x="748" y="90" font-size="11.5" fill="#7c2d12">先抢和后抢一样多 —— 少了「抢」的乐趣</text>
  </g>

  <!-- 拆分形态 -->
  <g transform="translate(20,382)">
    <rect x="0" y="0" width="960" height="108" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="16" y="26" font-size="15" fill="#0f172a">拆分不用每次保证原子：预先拆好，领取只 LPOP</text>
    <text x="16" y="52" font-size="11.5" fill="#334155">发红包时一次性拆完（100 个金额算好，写进列表 / Redis List）；领的时候只 LPOP 一次（原子、O(1)）。</text>
    <text x="16" y="74" font-size="11.5" fill="#334155">对比：每次领取时现场算金额 —— 需要保证「剩余金额 / 剩余人数」的读改是原子的（要加锁或 Lua）。</text>
    <text x="16" y="96" font-size="11.5" fill="#14532d">与库存模型一致：最终的发放动作都是一次原子操作（DECR / LPOP），差别只在「份额怎么产生」。</text>
  </g>
</svg>
