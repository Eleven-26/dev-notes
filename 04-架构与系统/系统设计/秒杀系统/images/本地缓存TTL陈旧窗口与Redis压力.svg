<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">本地缓存 TTL 是同一个旋钮的两个方向</text>
  <text x="30" y="61" font-size="13" fill="#64748b">构造：固定 1000 QPS 持续 8 秒，第 1 秒改掉商品 1 的价格（改 DB + 删 Redis，但动不了本地缓存）；本机实测 Redis 7.4.11 + MySQL 8.0.46</text>

  <g transform="translate(20,80)">
    <rect x="0" y="0" width="960" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">四档 TTL：一边是 Redis 压力，一边是「多久能看到新数据」</text>

    <rect x="18" y="46" width="226" height="192" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="131" y="70" font-size="12" fill="#334155" text-anchor="middle">无 L1</text>
    <text x="32" y="98" font-size="10.5" fill="#991b1b">每秒打 Redis 2678 次</text>
    <text x="32" y="120" font-size="10.5" fill="#14532d">看到新值需等 5 ms</text>
    <text x="32" y="142" font-size="10.5" fill="#334155">打 DB 1 次</text>
    <text x="32" y="172" font-size="10.5" fill="#475569">适合：价格、库存、</text>
    <text x="32" y="192" font-size="10.5" fill="#475569">开抢状态</text>
    <text x="32" y="220" font-size="10" fill="#94a3b8">每次都实时读 Redis</text>

    <rect x="250" y="46" width="226" height="192" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="363" y="70" font-size="12" fill="#334155" text-anchor="middle">200ms</text>
    <text x="264" y="98" font-size="10.5" fill="#991b1b">每秒打 Redis 39 次</text>
    <text x="264" y="120" font-size="10.5" fill="#14532d">看到新值需等 199 ms</text>
    <text x="264" y="142" font-size="10.5" fill="#334155">打 DB 1 次</text>
    <text x="264" y="172" font-size="10.5" fill="#475569">适合：销量、评价数 ——</text>
    <text x="264" y="192" font-size="10.5" fill="#475569">变化较快但能容忍 0.2s</text>
    <text x="264" y="220" font-size="10" fill="#94a3b8">199ms ≈ 200ms</text>

    <rect x="482" y="46" width="226" height="192" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <text x="595" y="70" font-size="12" fill="#92400e" text-anchor="middle">1s</text>
    <text x="496" y="98" font-size="10.5" fill="#92400e">每秒打 Redis 8 次</text>
    <text x="496" y="120" font-size="10.5" fill="#92400e">看到新值需等 999 ms</text>
    <text x="496" y="142" font-size="10.5" fill="#334155">打 DB 1 次</text>
    <text x="496" y="172" font-size="10.5" fill="#475569">适合：标题、主图 URL</text>
    <text x="496" y="220" font-size="10" fill="#94a3b8">999ms ≈ 1s（几乎等于 TTL）</text>

    <rect x="714" y="46" width="228" height="192" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="828" y="70" font-size="12" fill="#991b1b" text-anchor="middle">5s</text>
    <text x="728" y="98" font-size="10.5" fill="#991b1b">每秒打 Redis 2 次</text>
    <text x="728" y="120" font-size="10.5" fill="#991b1b">看到新值需等 3954 ms</text>
    <text x="728" y="142" font-size="10.5" fill="#334155">打 DB 1 次</text>
    <text x="728" y="172" font-size="10.5" fill="#475569">适合：详情描述、参数表、</text>
    <text x="728" y="192" font-size="10.5" fill="#475569">店铺信息</text>
    <text x="728" y="220" font-size="10" fill="#94a3b8">3954ms 已经接近 4s</text>

    <text x="18" y="256" font-size="11" fill="#334155">往左：一致性好、下游压力大　　往右：省下游、但一定会陈旧 —— 「看到新值需等」这一列几乎就等于 TTL。</text>
  </g>

  <g transform="translate(20,366)">
    <rect x="0" y="0" width="960" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">这条曲线读出来的两件事</text>
    <text x="18" y="56" font-size="11" fill="#334155">① 只要 TTL 是 1 秒，改完数据后的 1 秒内读请求一定拿到旧值 —— 这不是 bug，是你自己选的。</text>
    <text x="18" y="78" font-size="11" fill="#14532d">② 「无 L1」那行的 5ms 说明：删了 Redis 之后新值几乎立刻可见 —— 「DB + 删缓存」这套组合本身是对的。</text>
    <text x="18" y="100" font-size="11" fill="#991b1b">出问题的只是进程内那一层：L1 在进程内，别的进程删不掉它，所以它的 TTL 就等于「最多能陈旧多久」。</text>
    <text x="18" y="124" font-size="11" fill="#334155">本地缓存只适合「允许秒级陈旧」的数据（标题、图片、描述、参数表）；库存、价格、开抢状态不该享受它。</text>
    <text x="18" y="144" font-size="10.5" fill="#94a3b8">口径承接第二节：B 组加 L1（TTL 1s）把打 Redis 从 20000 降到 597 —— 省下来的那部分，代价就是这张表的陈旧列。</text>
  </g>

  <g transform="translate(20,532)">
    <rect x="0" y="0" width="960" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" fill="#0f172a">想让本地缓存「能被删掉」，只有两种做法，都不为零代价</text>
    <text x="18" y="50" font-size="11" fill="#334155">Pub/Sub 广播失效（广播可能丢，Redis Pub/Sub 不保证送达）／版本号比对或把 TTL 压到几百毫秒（等于几乎没缓存）。</text>
    <text x="18" y="66" font-size="10.5" fill="#94a3b8">⭐ 广播失效只是把不一致窗口从「TTL」压到「广播延迟」，压不到零。</text>
  </g>
</svg>
