<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="720" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">异步发放：请求路径上只剩一次入队，落库交给后台攒批</text>
  <text x="30" y="62" font-size="13" fill="#64748b">构造：1000 次领取，A 组每次直接 INSERT，B 组只入队、由消费者攒批写（本机 Redis 7.4.11 + MySQL 8.0.46 实测）</text>

  <g transform="translate(20,80)">
    <rect x="0" y="0" width="960" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">① 同一个 1000 次领取，两条请求路径</text>

    <rect x="24" y="44" width="912" height="84" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    <text x="40" y="68" font-size="12" fill="#991b1b">A 同步：每单一次 INSERT</text>
    <text x="40" y="92" font-size="11.5" fill="#334155">用户点领取 → Lua 判重 + 扣减 → 直接写库 → 等写完才返回</text>
    <text x="40" y="114" font-size="11.5" fill="#991b1b">读数：总耗时 1.203s ｜ 平均每单 1.203ms</text>

    <rect x="24" y="140" width="912" height="96" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
    <text x="40" y="164" font-size="12" fill="#14532d">B 异步：只入队，由消费者攒批写</text>
    <text x="40" y="188" font-size="11.5" fill="#334155">用户点领取 → Lua 判重 + 扣减 → RPUSH 入队 → 返回「发放中」</text>
    <text x="40" y="208" font-size="11.5" fill="#334155">后台：攒批 → 一条 INSERT 带多个 values，把 1000 次往返压成几次</text>
    <text x="40" y="228" font-size="11.5" fill="#14532d">读数：总耗时 262ms ｜ 平均每单 262µs ｜ 已落库 1000 条 → 请求侧快约 5 倍</text>
  </g>

  <g transform="translate(20,344)">
    <rect x="0" y="0" width="960" height="152" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">② 快的原因，以及别读错的地方</text>
    <text x="24" y="52" font-size="11.5" fill="#334155">快的原因有两层：① 请求路径上只剩一次 RPUSH；② 消费者攒批写（一条 INSERT 带多个 values）。</text>
    <text x="24" y="74" font-size="11.5" fill="#991b1b">⚠️ 倍数别当成结论：每单 1.2ms 里绝大部分是网络往返，不是 MySQL 慢 —— 换台机器、换个网络这个倍数就会变。</text>
    <text x="24" y="96" font-size="11.5" fill="#334155">要主张的方向只有一个：请求路径变短了；落库仍在做，只是挪到了后台。</text>
    <text x="24" y="118" font-size="11.5" fill="#475569">注意：这里的 B 组只入队，不含第一、二节那次 Lua 判重扣减 —— 原子判定仍在请求路径上，异步掉的只是「写库 + 等落库」。</text>
    <text x="24" y="140" font-size="10.5" fill="#94a3b8">组件层的通用同步 / 异步链路对照见《消息队列选型对比》篇；本图只记券侧读数与下面三个代价。</text>
  </g>

  <g transform="translate(20,510)">
    <rect x="0" y="0" width="960" height="196" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">③ 异步要付的三个代价 —— 以及什么时候必须同步</text>

    <rect x="24" y="40" width="912" height="36" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <text x="38" y="63" font-size="11.5" fill="#9a3412">中间态：用户点完「领取」不知道成没成 → 前端显示「发放中」，并提供「我的券」列表查询</text>

    <rect x="24" y="80" width="912" height="36" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <text x="38" y="103" font-size="11.5" fill="#9a3412">队列可靠性：本机用的是 Redis List，Redis 挂了或消费者崩了就丢 → 生产用 Stream（XADD + 消费组 + XACK）或 MQ</text>

    <rect x="24" y="120" width="912" height="36" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <text x="38" y="143" font-size="11.5" fill="#9a3412">幂等消费：队列可能重投，同一条被消费两次 → 发两张 → 靠唯一索引 uk(coupon_id, uid) + 消费端幂等</text>

    <text x="24" y="180" font-size="11.5" fill="#334155">判据：用户能不能接受一件事「稍后完成」—— 秒杀的「抢到了」不能（走同步），「券记到账户上」可以（走异步）。</text>
  </g>
</svg>
