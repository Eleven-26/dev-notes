<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="sans-serif">
  <defs>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrDr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">Redis 预扣 + 异步落库：预扣只做一件事</text>
  <text x="30" y="63" font-size="13" fill="#64748b">预扣阶段只回答「这个人能不能买到」，并把它变成 Redis 上一次原子判定</text>

  <g transform="translate(20,82)">
    <rect x="0" y="0" width="960" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

    <rect x="20" y="62" width="110" height="52" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <text x="75" y="93" font-size="12" fill="#334155" text-anchor="middle">客户端请求</text>

    <path d="M 130 88 L 180 88" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrD)"/>

    <rect x="180" y="46" width="170" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="265" y="72" font-size="12.5" fill="#1e3a8a" text-anchor="middle">Redis Lua 原子判定</text>
    <text x="265" y="92" font-size="10.5" fill="#2563eb" text-anchor="middle">读-判-写 一次执行</text>
    <text x="265" y="110" font-size="10.5" fill="#2563eb" text-anchor="middle">返回 &gt;= 0 = 抢到，-2 = 不足</text>

    <path d="M 350 88 L 400 88" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrD)"/>

    <rect x="400" y="62" width="120" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="460" y="93" font-size="12" fill="#7c2d12" text-anchor="middle">消息队列</text>

    <path d="M 520 88 L 580 88" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrD)"/>

    <rect x="580" y="62" width="120" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="640" y="93" font-size="12" fill="#14532d" text-anchor="middle">消费者</text>

    <path d="M 700 88 L 760 88" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrD)"/>

    <rect x="760" y="62" width="180" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="850" y="84" font-size="12" fill="#1e3a8a" text-anchor="middle">DB 落库（最终落账）</text>
    <text x="850" y="103" font-size="10.5" fill="#2563eb" text-anchor="middle">扣积分 / 发券也在这里做</text>

    <path d="M 265 126 L 265 146" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrDr)"/>
    <rect x="180" y="146" width="170" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="265" y="172" font-size="11" fill="#991b1b" text-anchor="middle">库存不足 → 直接返回售罄</text>

    <text x="380" y="180" font-size="11.5" fill="#475569">抢到后立刻把订单请求丢进队列；Redis 与 DB 之间必然存在一段不一致窗口 —— 这是换吞吐的前提代价。</text>
  </g>

  <g transform="translate(20,294)">
    <rect x="0" y="0" width="960" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">预扣的代价与底线</text>

    <rect x="18" y="40" width="298" height="94" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <text x="30" y="62" font-size="11.5" fill="#7c2d12">占位泄漏</text>
    <text x="30" y="84" font-size="11" fill="#7c2d12">抢到占位却没付款 → 占位挂住，</text>
    <text x="30" y="102" font-size="11" fill="#7c2d12">「看起来卖完、其实没人买」。</text>
    <text x="30" y="124" font-size="11" fill="#7c2d12">兜底：超时归还 + 幂等标记。</text>

    <rect x="331" y="40" width="298" height="94" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <text x="343" y="62" font-size="11.5" fill="#7c2d12">回补成本</text>
    <text x="343" y="84" font-size="11" fill="#7c2d12">判定失败多扣的那部分要再花一次</text>
    <text x="343" y="102" font-size="11" fill="#7c2d12">往返补回来，期间账是错的。</text>
    <text x="343" y="124" font-size="11" fill="#7c2d12">兜底：把「判」和「改」压进一次原子操作。</text>

    <rect x="644" y="40" width="298" height="94" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="656" y="62" font-size="11.5" fill="#1e3a8a">底线：必须能对账</text>
    <text x="656" y="84" font-size="11" fill="#1e3a8a">比对「Redis 剩余 + 已下单占用量」</text>
    <text x="656" y="102" font-size="11" fill="#1e3a8a">与「DB 库存 + 订单表」；</text>
    <text x="656" y="124" font-size="11" fill="#1e3a8a">对不上先告警、不自动改。</text>
  </g>
</svg>
