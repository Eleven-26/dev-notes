<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="710" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">动静分离：静态骨架共用一份字节，只有动态字段回到应用</text>
  <text x="30" y="61" font-size="13" fill="#64748b">同一个详情页两种实现各跑 3 万次（50 并发、直接调 handler、不走网络）：动态渲染单次约 320µs，静态化单次约 50ns</text>

  <g transform="translate(20,80)">
    <rect x="0" y="0" width="960" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">一页详情页按「下一次请求会不会不同」切成两块</text>

    <rect x="18" y="46" width="452" height="160" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="30" y="70" font-size="12" fill="#14532d">可静态化：秒杀期间根本不变</text>
    <text x="30" y="96" font-size="10.5" fill="#14532d">标题 / 主图 / 描述 / 参数表 / 店铺信息</text>
    <text x="30" y="118" font-size="10.5" fill="#14532d">生成一次就推到 CDN，所有用户共用同一份字节</text>
    <text x="30" y="140" font-size="10.5" fill="#14532d">HTML 里给动态字段留占位符，接口单独拉取</text>
    <text x="30" y="166" font-size="10.5" fill="#14532d">静态资源（图片、JS）可以长缓存</text>
    <text x="30" y="190" font-size="10.5" fill="#94a3b8">对应骨架第三段：一次内存拷贝直出</text>

    <rect x="490" y="46" width="452" height="160" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="502" y="70" font-size="12" fill="#991b1b">必须动态：每笔都在变，且每个用户看到的不一样</text>
    <text x="502" y="96" font-size="10.5" fill="#991b1b">剩余库存 / 是否开抢 / 当前价格 / 用户是否能买</text>
    <text x="502" y="118" font-size="10.5" fill="#991b1b">由 AJAX / ESI / 边缘计算单独拉取</text>
    <text x="502" y="140" font-size="10.5" fill="#991b1b">这个接口必须 no-store 或极短 max-age</text>
    <text x="502" y="166" font-size="10.5" fill="#991b1b">⚠️ 库存数字进了静态页，CDN 缓存一分钟就是灾难</text>
    <text x="502" y="190" font-size="10.5" fill="#991b1b">（用户看到有货、点进去发现抢完了）</text>

    <text x="18" y="232" font-size="11.5" fill="#334155">静态骨架（CDN 上的一份 HTML）+ 一小段动态数据 = 用户看到的完整详情页；别试图把整页静态化。</text>
  </g>

  <g transform="translate(20,346)">
    <rect x="0" y="0" width="960" height="160" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" fill="#0f172a">实测读数：去掉的是 I/O，不是渲染逻辑</text>
    <text x="18" y="54" font-size="11" fill="#991b1b">动态渲染（查缓存 + 拼 HTML）：总耗时 9593922600ns，单次约 320µs，打 Redis 30000 次（校验和 7920000）</text>
    <text x="18" y="76" font-size="11" fill="#14532d">静态化（预生成字节直出）：总耗时 1521700ns，单次约 50ns，打 Redis 0 次（校验和 7920000，内容相同）</text>
    <text x="18" y="100" font-size="11" fill="#92400e">⚠️ 别把这个倍数读成「模板渲染慢 6400 倍」：那 320µs 里绝大部分是一次 Redis 往返 + 50 并发下的排队（往返约 200µs）。</text>
    <text x="18" y="124" font-size="11" fill="#334155">⭐ 静态化值钱的地方：把 I/O 从请求路径上整个搬走 —— 成本从「一次网络往返」变成「一次内存拷贝」，三个数量级。</text>
    <text x="18" y="148" font-size="10.5" fill="#94a3b8">口径与第二、三节一致：那两组测的是「打下游的次数」，这一组测的是「请求路径上有没有下游」。</text>
  </g>

  <g transform="translate(20,522)">
    <rect x="0" y="0" width="960" height="170" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">CDN 的角色：把静态部分的请求从机房移到离用户最近的边缘节点</text>
    <text x="18" y="56" font-size="11" fill="#334155">它解决地理距离（北京用户不必连到广州的机房），顺带解决回源量 —— 100 万次请求里可能只有 1 次落到源站。</text>

    <rect x="18" y="70" width="298" height="66" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <text x="30" y="92" font-size="11" fill="#92400e">① 秒杀前必须预热</text>
    <text x="30" y="112" font-size="10.5" fill="#92400e">否则开抢瞬间大量同时回源 ——</text>
    <text x="30" y="130" font-size="10.5" fill="#92400e">CDN 只把击穿推迟到回源那一刻</text>

    <rect x="331" y="70" width="298" height="66" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <text x="343" y="92" font-size="11" fill="#92400e">② 刷新要快</text>
    <text x="343" y="112" font-size="10.5" fill="#92400e">改了价格 / 活动信息要让 CDN 立刻失效</text>
    <text x="343" y="130" font-size="10.5" fill="#92400e">否则用户看到的是上一版页面</text>

    <rect x="644" y="70" width="298" height="66" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <text x="656" y="92" font-size="11" fill="#92400e">③ 并发回源要收敛</text>
    <text x="656" y="112" font-size="10.5" fill="#92400e">节点很多，要在源站侧做一次合并</text>
    <text x="656" y="130" font-size="10.5" fill="#92400e">与第三节的 singleflight 是同一个思路</text>

    <text x="18" y="158" font-size="10.5" fill="#94a3b8">⚠️ 这三条属部署经验，本机无法实测；能静态化与否只由上面那条判据决定，与 CDN 无关。</text>
  </g>
</svg>
