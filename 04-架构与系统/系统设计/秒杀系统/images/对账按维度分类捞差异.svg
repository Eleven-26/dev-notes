<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">对账不是「查总额」，而是按维度分类把差异捞出来</text>
  <text x="30" y="63" font-size="13" fill="#64748b">构造：订单 10 笔（每笔 100 元）+ 四处人为异常 → 对账输出 5 条差异</text>

  <!-- 构造 -->
  <g transform="translate(20,82)">
    <rect x="0" y="0" width="352" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="16" y="28" font-size="15" fill="#0f172a">构造（人为埋 4 处异常）</text>
    <text x="16" y="54" font-size="11.5" fill="#334155">订单 10 笔，每笔 100 元</text>
    <text x="16" y="82" font-size="11" fill="#334155">order_no=3   平台流水缺失</text>
    <text x="16" y="106" font-size="11" fill="#334155">order_no=5   流水金额 90（少付）</text>
    <text x="16" y="130" font-size="11" fill="#334155">order_no=7   渠道成功 / 平台记失败</text>
    <text x="16" y="154" font-size="11" fill="#334155">order_no=99  流水多出（无对应订单）</text>
    <text x="16" y="182" font-size="11" fill="#64748b">对账任务逐笔比对渠道对账单与平台流水</text>
  </g>

  <!-- 输出 -->
  <g transform="translate(392,82)">
    <rect x="0" y="0" width="568" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="16" y="28" font-size="15" fill="#0f172a">对账输出：共 5 条差异</text>

    <rect x="16" y="40" width="536" height="28" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <text x="26" y="59" font-size="11" fill="#92400e">[金额不符]</text>
    <text x="140" y="59" font-size="11" fill="#334155">SO-05 渠道=100 平台=90</text>

    <rect x="16" y="72" width="536" height="28" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <text x="26" y="91" font-size="11" fill="#92400e">[状态不符]</text>
    <text x="140" y="91" font-size="11" fill="#334155">SO-07 渠道=SUCCESS 平台=FAILED</text>

    <rect x="16" y="104" width="536" height="28" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="26" y="123" font-size="11" fill="#991b1b">[多记]</text>
    <text x="140" y="123" font-size="11" fill="#334155">SO-99 平台有流水但渠道对账单里没有</text>

    <rect x="16" y="136" width="536" height="28" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    <text x="26" y="155" font-size="11" fill="#334155">[内部不一致]</text>
    <text x="140" y="155" font-size="11" fill="#334155">SO-03 订单=PAID 而流水=空</text>

    <rect x="16" y="168" width="536" height="28" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    <text x="26" y="187" font-size="11" fill="#334155">[内部不一致]</text>
    <text x="140" y="187" font-size="11" fill="#334155">SO-07 订单=PAID 而流水=FAILED</text>
  </g>

  <!-- 分类与处置 -->
  <g transform="translate(20,294)">
    <rect x="0" y="0" width="960" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">按维度分类 → 每一类都有自己的处置动作</text>

    <rect x="18" y="38" width="924" height="26" rx="5" fill="#e2e8f0"/>
    <text x="28" y="56" font-size="11" fill="#334155">类别</text>
    <text x="180" y="56" font-size="11" fill="#334155">含义</text>
    <text x="500" y="56" font-size="11" fill="#334155">处置动作</text>

    <text x="28" y="86" font-size="11" fill="#0f172a">金额不符</text>
    <text x="180" y="86" font-size="11" fill="#334155">渠道与平台的金额不一致</text>
    <text x="500" y="86" font-size="11" fill="#334155">人工核对 + 差额定责（我方 or 渠道）</text>

    <text x="28" y="110" font-size="11" fill="#0f172a">状态不符</text>
    <text x="180" y="110" font-size="11" fill="#334155">渠道与平台的结果不一致</text>
    <text x="500" y="110" font-size="11" fill="#334155">以渠道为准修正平台状态（修正要留痕）</text>

    <text x="28" y="134" font-size="11" fill="#0f172a">多记</text>
    <text x="180" y="134" font-size="11" fill="#334155">平台有、渠道没有</text>
    <text x="500" y="134" font-size="11" fill="#334155">人工确认后冲正，不自动删</text>

    <text x="28" y="158" font-size="11" fill="#0f172a">漏记</text>
    <text x="180" y="158" font-size="11" fill="#334155">渠道有、平台没有</text>
    <text x="500" y="158" font-size="11" fill="#334155">补录流水 + 补触发后续动作（幂等）</text>

    <text x="28" y="182" font-size="11" fill="#0f172a">内部不一致</text>
    <text x="180" y="182" font-size="11" fill="#334155">订单表与流水表打架</text>
    <text x="500" y="182" font-size="11" fill="#334155">不需要渠道对账单就能发现；修正要留痕</text>

    <line x1="18" y1="194" x2="942" y2="194" stroke="#e2e8f0" stroke-width="1"/>
    <text x="18" y="214" font-size="11.5" fill="#991b1b">要点：漏记与多记可以互相抵消 —— 渠道多一笔 100、平台多记一笔 100，总额完全相等，却是两件真实事故。</text>
    <text x="18" y="230" font-size="11" fill="#94a3b8">注意：对账至少两层 —— 内部对账（订单表 vs 流水表，准实时）+ 外部对账（平台流水 vs 渠道对账单，T+1），两者都要有。</text>
  </g>
</svg>
