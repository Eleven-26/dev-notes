<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="780" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">分段库存：把「同一行」拆成多段，段数不是越细越好</text>
  <text x="30" y="62" font-size="13" fill="#64748b">口径：Go 内存侧 10000 并发请求 / 1000 库存，每种写法跑 3 轮；MySQL 8.0.46 单行 UPDATE 上限约 833 次/秒</text>

  <g transform="translate(20,80)">
    <rect x="0" y="0" width="960" height="214" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">① 拆法：1000 件全在一行 → 拆成 16 段，起点按请求散列 + 轮询其他段</text>

    <rect x="30" y="44" width="250" height="34" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="155" y="66" font-size="11.5" fill="#991b1b" text-anchor="middle">单行库存 1000 件</text>
    <text x="300" y="66" font-size="11.5" fill="#991b1b">同一行的排他锁 → 必须串行；本机单条 UPDATE ... WHERE stock &gt; 0 只有约 833 次/秒</text>

    <text x="30" y="100" font-size="11.5" fill="#475569">拆成 16 段（④ 分段 CAS：起点 = 请求散列到某一段，扣不动就轮询其他段）</text>
    <rect x="30" y="110" width="52" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="56" y="127" font-size="10.5" fill="#1e3a8a" text-anchor="middle">段0</text>
    <rect x="86" y="110" width="52" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="112" y="127" font-size="10.5" fill="#1e3a8a" text-anchor="middle">段1</text>
    <rect x="142" y="110" width="52" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="168" y="127" font-size="10.5" fill="#1e3a8a" text-anchor="middle">段2</text>
    <rect x="198" y="110" width="52" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="224" y="127" font-size="10.5" fill="#1e3a8a" text-anchor="middle">段3</text>
    <rect x="254" y="110" width="52" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="280" y="127" font-size="10.5" fill="#1e3a8a" text-anchor="middle">段4</text>
    <rect x="310" y="110" width="52" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="336" y="127" font-size="10.5" fill="#1e3a8a" text-anchor="middle">段5</text>
    <rect x="366" y="110" width="52" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="392" y="127" font-size="10.5" fill="#1e3a8a" text-anchor="middle">段6</text>
    <rect x="422" y="110" width="52" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="448" y="127" font-size="10.5" fill="#1e3a8a" text-anchor="middle">段7</text>
    <rect x="478" y="110" width="52" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="504" y="127" font-size="10.5" fill="#1e3a8a" text-anchor="middle">段8</text>
    <rect x="534" y="110" width="52" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="560" y="127" font-size="10.5" fill="#1e3a8a" text-anchor="middle">段9</text>
    <rect x="590" y="110" width="52" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="616" y="127" font-size="10.5" fill="#1e3a8a" text-anchor="middle">段10</text>
    <rect x="646" y="110" width="52" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="672" y="127" font-size="10.5" fill="#1e3a8a" text-anchor="middle">段11</text>
    <rect x="702" y="110" width="52" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="728" y="127" font-size="10.5" fill="#1e3a8a" text-anchor="middle">段12</text>
    <rect x="758" y="110" width="52" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="784" y="127" font-size="10.5" fill="#1e3a8a" text-anchor="middle">段13</text>
    <rect x="814" y="110" width="52" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="840" y="127" font-size="10.5" fill="#1e3a8a" text-anchor="middle">段14</text>
    <rect x="870" y="110" width="52" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="896" y="127" font-size="10.5" fill="#1e3a8a" text-anchor="middle">段15</text>

    <rect x="30" y="148" width="900" height="54" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    <text x="44" y="168" font-size="11.5" fill="#991b1b">坑一：起点倾斜（都从段 0 起）且「只试自己那一段」→ 段 0 卖光后其余请求全被拒</text>
    <text x="44" y="190" font-size="11.5" fill="#334155">读数：成功 63 / 剩余 937（漏卖 937）；起点均匀 + 轮询其他段 → 成功 1000 / 剩余 0</text>
  </g>

  <g transform="translate(20,308)">
    <rect x="0" y="0" width="960" height="216" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">② 段数扫描（每种段数跑 5 轮）：重试次数降下来了，耗时却从 256 段开始回升</text>
    <text x="24" y="48" font-size="10.5" fill="#64748b">段数</text>
    <text x="150" y="48" font-size="10.5" fill="#64748b">CAS 失败重试（5 轮区间）</text>
    <text x="300" y="48" font-size="10.5" fill="#64748b">耗时区间（横条 = 最小 ~ 最大，单位 ms）</text>

    <text x="24" y="69" font-size="11" fill="#334155">1</text>
    <text x="150" y="69" font-size="11" fill="#334155">50~203 次</text>
    <rect x="331" y="58" width="53" height="14" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="750" y="69" font-size="11" fill="#334155">3.107 ~ 8.196</text>

    <text x="24" y="99" font-size="11" fill="#334155">8</text>
    <text x="150" y="99" font-size="11" fill="#334155">6~30 次</text>
    <rect x="335" y="88" width="42" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="750" y="99" font-size="11" fill="#334155">3.533 ~ 7.509</text>

    <text x="24" y="129" font-size="11" fill="#334155">64</text>
    <text x="150" y="129" font-size="11" fill="#334155">1~8 次</text>
    <rect x="347" y="118" width="15" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="750" y="129" font-size="11" fill="#334155">4.814 ~ 6.267</text>

    <text x="24" y="159" font-size="11" fill="#334155">256</text>
    <text x="150" y="159" font-size="11" fill="#334155">1~5 次</text>
    <rect x="403" y="148" width="22" height="14" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <text x="750" y="159" font-size="11" fill="#334155">10.509 ~ 12.737</text>

    <text x="24" y="189" font-size="11" fill="#991b1b">1024</text>
    <text x="150" y="189" font-size="11" fill="#991b1b">0~5 次</text>
    <rect x="665" y="178" width="79" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="750" y="189" font-size="11" fill="#991b1b">37.142 ~ 44.728</text>

    <text x="24" y="206" font-size="11.5" fill="#475569">要点：收益在 16~64 段已经拿满（重试降到 10 次以内）；段数从 256 开始耗时反而上升 —— 1024 段 37~44ms，比 16 段慢 10 倍（起点散列后要扫段，段越多扫的段越多）</text>
  </g>

  <g transform="translate(20,538)">
    <rect x="0" y="0" width="960" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">③ 要不要分段：只看争用能不能挪到不同的物理资源上</text>

    <rect x="24" y="40" width="912" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="38" y="66" font-size="11.5" fill="#14532d">Go 内存（多核 CAS）→ 有用</text>
    <text x="300" y="66" font-size="11.5" fill="#334155">核之间真的在抢同一个内存地址，分段能减少自旋（单 key 重试 237~313 次 → 16 段 9~14 次）</text>

    <rect x="24" y="88" width="912" height="42" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="38" y="114" font-size="11.5" fill="#991b1b">单机 Redis / 单机 MySQL 单行 → 反而更慢</text>
    <text x="300" y="114" font-size="11.5" fill="#334155">服务端本来就串行：16 段 + 轮询要 6.1~7.0s，单 key 只要 432~450ms（约 14 倍）</text>

    <rect x="24" y="136" width="912" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="38" y="162" font-size="11.5" fill="#14532d">Redis Cluster / 分片 MySQL → 有用</text>
    <text x="300" y="162" font-size="11.5" fill="#334155">不同段的 key 落在不同分片上，行锁与单线程争用被真正分散</text>

    <text x="24" y="192" font-size="11.5" fill="#334155">一句话：分段的本质是把争用挪到不同的物理资源上 —— 物理资源只有一个时，分段只是把「排队」换成「多跑几趟」。</text>
  </g>
</svg>
