<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="sans-serif">
  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">秒杀系统的存储全景：库存与订单是权威源，Redis 只是加速器</text>
  <text x="30" y="62" font-size="13" fill="#64748b">写路径先在权威源成功、再异步派生；读路径按热到温再到冷逐级查</text>

  <g transform="translate(20,80)">
    <rect x="0" y="0" width="460" height="460" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">① 数据角色与载体</text>

    <rect x="18" y="44" width="424" height="120" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="34" y="66" font-size="11.5" font-weight="bold" fill="#7f1d1d">权威源 · MySQL</text>
    <text x="34" y="90" font-size="10" fill="#334155">订单 / 库存：数量等于库存，状态与金额靠事务保证</text>
    <text x="34" y="110" font-size="10" fill="#334155">支付流水：资金账目，丢了不可重建，也是对账基准</text>
    <text x="34" y="130" font-size="10" fill="#334155">商品：商品与价格是真相，读多写少，图只留 URL</text>
    <text x="34" y="152" font-size="10.5" font-weight="bold" fill="#991b1b">不能丢：对账一律以 DB 为准</text>

    <rect x="18" y="176" width="424" height="114" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="34" y="198" font-size="11.5" font-weight="bold" fill="#14532d">派生副本 · Redis（可重建）</text>
    <text x="34" y="222" font-size="10" fill="#334155">库存预扣：Lua 原子扣减，挡住瞬时扣减流量</text>
    <text x="34" y="242" font-size="10" fill="#334155">详情页缓存 / 会话：纯读加速，丢了只是变慢</text>
    <text x="34" y="262" font-size="10" fill="#334155">可从 MySQL 库存与商品库重算，不承担「真相」</text>
    <text x="34" y="282" font-size="10.5" font-weight="bold" fill="#14532d">能丢：降级时宁可少卖不可超卖</text>

    <rect x="18" y="302" width="424" height="96" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="34" y="324" font-size="11.5" font-weight="bold" fill="#1e3a8a">分析副本与归档 · 列存 + 对象存储</text>
    <text x="34" y="348" font-size="10" fill="#334155">交易分析：大范围聚合并发，由订单流水派生</text>
    <text x="34" y="368" font-size="10" fill="#334155">商品图：体积大、走 CDN，不进业务库</text>
    <text x="34" y="388" font-size="10.5" font-weight="bold" fill="#1e3a8a">最便宜介质承载最低频的读</text>

    <text x="18" y="420" font-size="11" fill="#475569">先分角色，再选存储：判据只有一句 ——</text>
    <text x="18" y="436" font-size="11" fill="#475569">丢了能不能从 DB 重算出来。</text>
  </g>

  <g transform="translate(500,80)">
    <rect x="0" y="0" width="480" height="460" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">② 写路径与读路径的落点</text>

    <text x="18" y="50" font-size="12" font-weight="bold" fill="#0f172a">写：抢一件商品</text>

    <rect x="18" y="60" width="444" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="34" y="87" font-size="10.5" fill="#334155">① 准入限流：用户 ID 优先、IP 兜底，无持久化落点</text>

    <line x1="240" y1="104" x2="240" y2="114" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrS)"/>

    <rect x="18" y="118" width="444" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="34" y="145" font-size="10.5" fill="#14532d">② Redis Lua 原子预扣：读-判-写压成一次服务端执行</text>

    <line x1="240" y1="162" x2="240" y2="172" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrS)"/>

    <rect x="18" y="176" width="444" height="44" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="34" y="203" font-size="10.5" fill="#312e81">③ 异步入队 → 订单落 MySQL、带条件 UPDATE 扣库存</text>

    <text x="18" y="248" font-size="12" font-weight="bold" fill="#0f172a">读：打开商品详情页</text>

    <rect x="18" y="258" width="444" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="34" y="285" font-size="10.5" fill="#14532d">① 先读 Redis 详情页缓存（静态骨架 + 预热数据）</text>

    <line x1="240" y1="302" x2="240" y2="312" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrS)"/>

    <rect x="18" y="316" width="444" height="44" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="34" y="343" font-size="10.5" fill="#312e81">② 未命中 → 回源 MySQL 的商品与库存（温层）</text>

    <line x1="240" y1="360" x2="240" y2="370" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrS)"/>

    <rect x="18" y="374" width="444" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="34" y="401" font-size="10.5" fill="#1e3a8a">③ 大范围聚合 → 列存分析副本，不回灌热层</text>

    <text x="18" y="440" font-size="11" fill="#475569">写入必须先在权威源成功，副本才有意义；预扣与缓存都可丢。</text>
  </g>
</svg>
