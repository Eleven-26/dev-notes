<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="sans-serif">
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrOr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">幂等落库：判据是「数据库不让我做第二次」，不是「我检查过了」</text>
  <text x="30" y="61" font-size="13" fill="#64748b">同一个 request_id 被并发重放 2000 次；本机实测（MySQL 8.0.46）：A 先查后插落库 87 条，B INSERT IGNORE 恰好 1 条</text>

  <g transform="translate(20,80)">
    <rect x="0" y="0" width="960" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">A 先查后插：两个重放请求都查到「没有」，然后各插一条</text>

    <rect x="40" y="44" width="200" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="140" y="65" font-size="11.5" fill="#1e3a8a" text-anchor="middle">请求 1（同一次提交）</text>
    <rect x="280" y="44" width="200" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="380" y="65" font-size="11.5" fill="#1e3a8a" text-anchor="middle">请求 2（重放的那一次）</text>
    <rect x="560" y="44" width="220" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <text x="670" y="65" font-size="11.5" fill="#334155" text-anchor="middle">MySQL（只有普通索引）</text>

    <rect x="40" y="90" width="200" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="140" y="111" font-size="11" fill="#334155" text-anchor="middle">① SELECT 查有没有</text>
    <rect x="280" y="90" width="200" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="380" y="111" font-size="11" fill="#334155" text-anchor="middle">① SELECT 查有没有</text>
    <path d="M 240 106 L 278 106" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrO)"/>
    <rect x="560" y="90" width="220" height="32" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <text x="670" y="111" font-size="11" fill="#92400e" text-anchor="middle">两次都返回「没有」</text>
    <path d="M 480 106 L 558 106" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrO)"/>

    <rect x="30" y="130" width="750" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <text x="44" y="155" font-size="11.5" fill="#92400e">竞态窗口：「查」与「改」之间隔着一次网络往返 —— 无论你在客户端写得多小心，这个间隙都存在。</text>

    <rect x="40" y="182" width="200" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="140" y="203" font-size="11" fill="#334155" text-anchor="middle">② INSERT 插入</text>
    <rect x="280" y="182" width="200" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="380" y="203" font-size="11" fill="#334155" text-anchor="middle">② INSERT 插入</text>
    <rect x="560" y="182" width="220" height="32" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="670" y="203" font-size="11" fill="#991b1b" text-anchor="middle">落库 87 条（期望 1 条）</text>
    <path d="M 480 198 L 558 198" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrOr)"/>
  </g>

  <g transform="translate(20,336)">
    <rect x="0" y="0" width="960" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">B 唯一索引 + INSERT IGNORE：让数据库自己判重</text>
    <text x="18" y="56" font-size="11" fill="#14532d">UNIQUE KEY uk_order_no (order_no)、uk_user_sku (user_id, sku_id) 建在表上；重复那次命中唯一键 → 影响 0 行，而不是报错。</text>
    <text x="18" y="78" font-size="11" fill="#334155">调用侧只看 RowsAffected：1 = 首次落库；0 = 重复提交，直接返回已存在的订单，不再做任何有副作用的动作。</text>
    <text x="18" y="102" font-size="10.5" fill="#94a3b8">「不要重复扣任何东西」指的是：扣库存、发消息、发券都不能再来一遍 —— 87 条若各触发一次扣减，就是超卖。</text>
  </g>

  <g transform="translate(20,472)">
    <rect x="0" y="0" width="960" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">三层幂等键不是替代关系，是三层</text>

    <rect x="18" y="46" width="290" height="112" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="32" y="72" font-size="12" fill="#1e3a8a">request_id</text>
    <text x="32" y="98" font-size="10.5" fill="#1e3a8a">管「同一次请求被重放」</text>
    <text x="32" y="120" font-size="10.5" fill="#1e3a8a">用在哪：网关 / 提交入口</text>
    <text x="32" y="144" font-size="10.5" fill="#92400e">⚠️ 重试时必须沿用同一个 id</text>

    <rect x="332" y="46" width="290" height="112" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="346" y="72" font-size="12" fill="#1e3a8a">order_no</text>
    <text x="346" y="98" font-size="10.5" fill="#1e3a8a">管「同一次业务被重复落库」</text>
    <text x="346" y="120" font-size="10.5" fill="#1e3a8a">用在哪：消费落库 / 支付回调</text>
    <text x="346" y="144" font-size="10.5" fill="#92400e">趋势递增、可带分片基因</text>

    <rect x="646" y="46" width="290" height="112" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="660" y="72" font-size="12" fill="#1e3a8a">(user_id, sku_id)</text>
    <text x="660" y="98" font-size="10.5" fill="#1e3a8a">管「同一个人反复抢」</text>
    <text x="660" y="120" font-size="10.5" fill="#1e3a8a">用在哪：秒杀一人一单兜底</text>
    <text x="660" y="144" font-size="10.5" fill="#92400e">Redis 名单被绕过时靠它</text>

    <text x="18" y="180" font-size="11" fill="#475569">判据：三者各挡一层，缺任一层重放就会留下多余记录；订单号怎么生成见分布式 ID 那篇，本篇只定「谁管哪一层」。</text>
    <text x="18" y="200" font-size="10.5" fill="#94a3b8">状态型副作用另有一套写法：带旧状态的 UPDATE（见「订单状态机与合法转移」那张图），插入型才用唯一索引。</text>
  </g>
</svg>
