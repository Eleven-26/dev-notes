<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#2563eb"/>
    </marker>
    <marker id="aho" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="30" y="32" font-size="19" font-weight="bold" fill="#0f172a">支付回调重放：三类来源、两道幂等判据、影响 0 行之后的分流</text>
  <text x="30" y="56" font-size="13" fill="#475569">判据只有两条：插入型靠唯一索引，状态型靠带旧状态的 UPDATE —— 都不是「先查一下再决定」</text>

  <rect x="30" y="80" width="300" height="54" fill="#ffedd5" stroke="#b45309" stroke-width="1.4" rx="8"/>
  <text x="44" y="102" font-size="14" font-weight="bold" fill="#78350f">一 渠道重试</text>
  <text x="44" y="122" font-size="12" fill="#78350f">没按时回 SUCCESS，同一条内容重发</text>
  <rect x="30" y="146" width="300" height="54" fill="#ffedd5" stroke="#b45309" stroke-width="1.4" rx="8"/>
  <text x="44" y="168" font-size="14" font-weight="bold" fill="#78350f">二 用户刷新</text>
  <text x="44" y="188" font-size="12" fill="#78350f">结果页 F5 或回退再进，可能绕过渠道</text>
  <rect x="30" y="212" width="300" height="54" fill="#ffedd5" stroke="#b45309" stroke-width="1.4" rx="8"/>
  <text x="44" y="234" font-size="14" font-weight="bold" fill="#78350f">三 消息重投</text>
  <text x="44" y="254" font-size="12" fill="#78350f">回调转 MQ 后消费失败，至少一次语义</text>

  <line x1="330" y1="107" x2="380" y2="107" stroke="#b45309" stroke-width="1.6"/>
  <line x1="330" y1="173" x2="380" y2="173" stroke="#b45309" stroke-width="1.6"/>
  <line x1="330" y1="239" x2="380" y2="239" stroke="#b45309" stroke-width="1.6"/>
  <line x1="380" y1="107" x2="380" y2="239" stroke="#b45309" stroke-width="1.6"/>
  <line x1="380" y1="173" x2="414" y2="173" stroke="#b45309" stroke-width="1.6" marker-end="url(#aho)"/>

  <rect x="420" y="140" width="250" height="86" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4" rx="8"/>
  <text x="545" y="172" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">同一件事重放到处理入口</text>
  <text x="545" y="200" font-size="12" fill="#1e40af" text-anchor="middle">副作用只发生一次</text>

  <line x1="545" y1="226" x2="545" y2="272" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="255" y1="272" x2="745" y2="272" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="255" y1="272" x2="255" y2="286" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ahb)"/>
  <line x1="745" y1="272" x2="745" y2="286" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ahb)"/>

  <rect x="30" y="290" width="450" height="150" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4" rx="8"/>
  <text x="44" y="316" font-size="14" font-weight="bold" fill="#1e40af">插入型副作用：落支付流水 / 通知记录</text>
  <text x="44" y="344" font-size="12" fill="#1e40af">写法：唯一索引 + INSERT IGNORE</text>
  <text x="44" y="368" font-size="12" fill="#1e40af">判据：RowsAffected 等于 1 是首次，等于 0 是重复</text>
  <text x="44" y="392" font-size="12" fill="#1e40af">键：uk_channel_trade_no，重复那次影响 0 行</text>
  <text x="44" y="418" font-size="12" fill="#475569">重复的这一次不再触发任何有副作用的动作</text>

  <rect x="520" y="290" width="450" height="150" fill="#dcfce7" stroke="#166534" stroke-width="1.4" rx="8"/>
  <text x="534" y="316" font-size="14" font-weight="bold" fill="#14532d">状态型副作用：订单待支付改为已支付</text>
  <text x="534" y="344" font-size="12" fill="#14532d">写法：带旧状态 UPDATE，把 status 写进 WHERE</text>
  <text x="534" y="368" font-size="12" fill="#14532d">判据：1 是本次生效，0 是别人已经改过</text>
  <text x="534" y="392" font-size="12" fill="#14532d">0 行的含义：这条订单已不在待支付状态</text>
  <text x="534" y="418" font-size="12" fill="#475569">它只回答「我改到了没有」，不解释「为什么没改到」</text>

  <text x="30" y="470" font-size="14" font-weight="bold" fill="#0f172a">影响 0 行的两种来源，处置完全不同</text>
  <text x="970" y="470" font-size="13" fill="#b91c1c" text-anchor="end">拿到 0 之后必须再查一次当前状态</text>

  <rect x="30" y="482" width="460" height="72" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4" rx="8"/>
  <text x="260" y="510" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">来源一：上次回调已经改过 = 重复回调</text>
  <text x="260" y="536" font-size="12" fill="#334155" text-anchor="middle">处置：直接回 ack，不重复触发后续动作</text>
  <rect x="510" y="482" width="460" height="72" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4" rx="8"/>
  <text x="740" y="510" font-size="13" font-weight="bold" fill="#7f1d1d" text-anchor="middle">来源二：被超时关单改走 = 迟到回调</text>
  <text x="740" y="536" font-size="12" fill="#7f1d1d" text-anchor="middle">处置：发起退款，不能一律当成重复</text>

  <rect x="30" y="566" width="940" height="56" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" rx="8"/>
  <text x="500" y="588" font-size="13" fill="#334155" text-anchor="middle">要点：「我检查过了」不是判据 —— 检查与动作之间隔着时间，判据必须是「数据库不让我做第二次」</text>
  <text x="500" y="610" font-size="12" fill="#64748b" text-anchor="middle">先查后插的竞态窗口与并发重放读数，见同目录「幂等三层键与先查后插竞态」那张图，本篇不重画</text>
</svg>
