<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 830" width="1000" height="830" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="830" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">防超卖只有一条路：把判定与执行压进同一个原子操作</text>
  <text x="30" y="62" font-size="13" fill="#64748b">口径：1000 库存 / 5000 并发（每个请求买 1 件）；三种原子手段的读数都是成功 1000 / 库存 0，差别在代价</text>

  <g transform="translate(20,80)">
    <rect x="0" y="0" width="960" height="278" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">① 三种原子手段：原子性从哪来、判据看什么、代价付在哪</text>

    <rect x="24" y="42" width="300" height="180" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="174" y="66" font-size="12" fill="#1e3a8a" text-anchor="middle">Redis Lua</text>
    <text x="38" y="90" font-size="11" fill="#1e3a8a">原子性来自：服务端单线程</text>
    <text x="38" y="108" font-size="11" fill="#334155">把读-判-写一次执行完</text>
    <text x="38" y="132" font-size="11" fill="#1e3a8a">判据：返回值 &gt;= 0 才算抢到</text>
    <text x="38" y="150" font-size="11" fill="#334155">执行期间不插入其他命令</text>
    <text x="38" y="174" font-size="11" fill="#334155">读数：成功 1000 / 库存 0</text>
    <text x="38" y="192" font-size="11" fill="#1e3a8a">代价：一次网络往返</text>

    <rect x="328" y="42" width="300" height="180" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="478" y="66" font-size="12" fill="#14532d" text-anchor="middle">带条件 UPDATE</text>
    <text x="342" y="90" font-size="11" fill="#14532d">原子性来自：行锁 + 当前读</text>
    <text x="342" y="108" font-size="11" fill="#334155">判断写进 WHERE 里</text>
    <text x="342" y="132" font-size="11" fill="#14532d">判据：看 RowsAffected</text>
    <text x="342" y="150" font-size="11" fill="#334155">1 = 生效，0 = 空操作</text>
    <text x="342" y="174" font-size="11" fill="#334155">读数：成功 1000 / 库存 0</text>
    <text x="342" y="192" font-size="11" fill="#14532d">代价：同一行串行，约 833 次/秒</text>

    <rect x="632" y="42" width="300" height="180" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <text x="782" y="66" font-size="12" fill="#9a3412" text-anchor="middle">CAS（内存 / 乐观锁）</text>
    <text x="646" y="90" font-size="11" fill="#9a3412">原子性来自：比较并交换</text>
    <text x="646" y="108" font-size="11" fill="#334155">失败就重读、重试</text>
    <text x="646" y="132" font-size="11" fill="#9a3412">判据：冲突少时才好；</text>
    <text x="646" y="150" font-size="11" fill="#9a3412">热点行上是负优化</text>
    <text x="646" y="174" font-size="11" fill="#334155">读数：成功 1000 / 库存 0</text>
    <text x="646" y="192" font-size="11" fill="#9a3412">自旋 237~313 次；漏卖 + 重试 9.2 万次</text>

    <text x="18" y="248" font-size="11.5" fill="#334155">⭐ 三种手段的读数在本机都是成功 1000 / 库存 0 —— 真正的差别在代价，而不是「对不对」。</text>
    <text x="18" y="268" font-size="11" fill="#64748b">同一构造在券侧的读数（100 张 / 5000 人）见 优惠券系统设计.md 第一节的对照图；四类错误写法的全表见 总体设计.md 2.1，本图只比三种手段的代价。</text>
  </g>

  <g transform="translate(20,372)">
    <rect x="0" y="0" width="960" height="248" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">② 最值钱的一组对照：同一段代码，差别只在它跑在谁的进程里</text>

    <rect x="24" y="40" width="912" height="40" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <text x="38" y="66" font-size="12" fill="#92400e">原子性的边界在服务端 —— 「读」和「写」之间隔着一次网络往返（或一次函数返回），那个间隙就是竞态窗口。</text>

    <text x="18" y="104" font-size="13" fill="#0f172a">同一段「先减再判 + 为负就回补」，命令顺序一模一样：</text>

    <rect x="24" y="114" width="912" height="58" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    <text x="38" y="136" font-size="11.5" fill="#991b1b">放客户端：DECR 之后隔一次网络往返才判断 —— 成功数 1000 是对的，库存却扣成 -4000</text>
    <text x="38" y="158" font-size="11.5" fill="#334155">还得再写一次 INCR 回补：回补本身又是一次往返，期间别人看到的可用量是错的，甚至会再放大一波流量</text>

    <rect x="24" y="182" width="912" height="58" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
    <text x="38" y="204" font-size="11.5" fill="#14532d">放 Lua：读 → 判 → 扣 在服务端连续执行，中间不插入其他命令 —— 间隙为 0，完全正确</text>
    <text x="38" y="226" font-size="11.5" fill="#334155">读数：成功 1000 / 库存 0 —— 不是「记住用 Lua」，是「别让读和写之间隔着往返」</text>
  </g>

  <g transform="translate(20,634)">
    <rect x="0" y="0" width="960" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" fill="#0f172a">③ 写法清单：哪些一定错、哪些可用、哪种要看场景</text>

    <rect x="24" y="38" width="912" height="23" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="38" y="54" font-size="11" fill="#991b1b">❌ 先查再改（客户端两步）—— 两次往返之间就是竞态窗口</text>

    <rect x="24" y="65" width="912" height="23" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="38" y="81" font-size="11" fill="#991b1b">❌ 先减再判 + 客户端回补 —— 成功数对，但账中间是错的，回补又要一次往返</text>

    <rect x="24" y="92" width="912" height="23" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="38" y="108" font-size="11" fill="#14532d">✅ Lua 服务端读-判-写 —— 服务端一次执行，无间隙</text>

    <rect x="24" y="119" width="912" height="23" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="38" y="135" font-size="11" fill="#14532d">✅ 带条件 UPDATE + 看 RowsAffected —— 行锁 + 当前读，让数据库自己判</text>

    <rect x="24" y="146" width="912" height="23" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
    <text x="38" y="162" font-size="11" fill="#9a3412">⚠️ CAS 自旋 —— 安全但看场景：冲突少时好，热点行上重试爆炸、还会漏卖</text>
  </g>
</svg>
