<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">「先查后扣」把 100 张券发成了 5000 张</text>
  <text x="30" y="63" font-size="13" fill="#64748b">券总量 100、5000 人并发抢（每人限领 1 张）；判定标准：领到数 == 100 且库存 == 0</text>

  <!-- A -->
  <rect x="30" y="82" width="300" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="110" font-size="15" fill="#0f172a">A 先查后扣</text>
  <text x="46" y="132" font-size="11" fill="#475569">GET → 判断 → DECR，不看返回值</text>
  <text x="46" y="162" font-size="11.5" fill="#334155">领到 5000</text>
  <text x="46" y="186" font-size="11.5" fill="#334155">Redis 剩余 -4900</text>
  <text x="46" y="210" font-size="11.5" fill="#334155">DB 剩余 -1538</text>
  <rect x="46" y="222" width="268" height="38" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="58" y="246" font-size="11" fill="#991b1b">券只有 100 张，实际发了 5000 张。</text>

  <!-- B -->
  <rect x="345" y="82" width="300" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="361" y="110" font-size="15" fill="#0f172a">B Lua 原子</text>
  <text x="361" y="132" font-size="11" fill="#475569">读-判-扣在服务端一次执行</text>
  <text x="361" y="162" font-size="11.5" fill="#334155">领到 100</text>
  <text x="361" y="186" font-size="11.5" fill="#334155">Redis 剩余 0</text>
  <text x="361" y="210" font-size="11.5" fill="#334155">DB 剩余 0</text>
  <rect x="361" y="222" width="268" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="373" y="246" font-size="11" fill="#14532d">精确；库存恰好归零。</text>

  <!-- C -->
  <rect x="660" y="82" width="300" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="676" y="110" font-size="15" fill="#0f172a">C 条件 UPDATE</text>
  <text x="676" y="132" font-size="11" fill="#475569">MySQL 带条件 UPDATE（remain&gt;0）</text>
  <text x="676" y="162" font-size="11.5" fill="#334155">领到 100</text>
  <text x="676" y="186" font-size="11.5" fill="#334155">DB 剩余 0</text>
  <text x="676" y="210" font-size="11.5" fill="#334155">不用 Redis 也能对</text>
  <rect x="676" y="222" width="268" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="688" y="246" font-size="11" fill="#14532d">把判断条件写进 WHERE，交给行锁。</text>

  <!-- 底部：A 组 5 轮 -->
  <g transform="translate(20,284)">
    <rect x="0" y="0" width="960" height="224" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">A 组连跑 5 轮：这个错误是稳定的，不是偶发</text>

    <line x1="80" y1="152" x2="520" y2="152" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="80" y1="42" x2="80" y2="152" stroke="#cbd5e1" stroke-width="1"/>

    <rect x="96" y="42" width="54" height="110" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <rect x="186" y="43" width="54" height="109" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <rect x="276" y="42" width="54" height="110" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <rect x="366" y="42" width="54" height="110" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <rect x="456" y="42" width="54" height="110" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>

    <text x="123" y="168" font-size="10.5" fill="#334155" text-anchor="middle">第 1 轮</text>
    <text x="213" y="168" font-size="10.5" fill="#334155" text-anchor="middle">第 2 轮</text>
    <text x="303" y="168" font-size="10.5" fill="#334155" text-anchor="middle">第 3 轮</text>
    <text x="393" y="168" font-size="10.5" fill="#334155" text-anchor="middle">第 4 轮</text>
    <text x="483" y="168" font-size="10.5" fill="#334155" text-anchor="middle">第 5 轮</text>

    <text x="123" y="57" font-size="10.5" fill="#991b1b" text-anchor="middle">5000</text>
    <text x="213" y="57" font-size="10.5" fill="#991b1b" text-anchor="middle">4971</text>
    <text x="303" y="57" font-size="10.5" fill="#991b1b" text-anchor="middle">5000</text>
    <text x="393" y="57" font-size="10.5" fill="#991b1b" text-anchor="middle">5000</text>
    <text x="483" y="57" font-size="10.5" fill="#991b1b" text-anchor="middle">5000</text>

    <line x1="80" y1="148" x2="520" y2="148" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="528" y="163" font-size="10" fill="#14532d">正确值 100</text>

    <text x="560" y="70" font-size="12" fill="#0f172a">最坏超发 4900 张</text>
    <text x="560" y="94" font-size="12" fill="#0f172a">平均超发 4894 张</text>
    <text x="560" y="124" font-size="11.5" fill="#475569">5 轮里有 4 轮「一个不漏地全放行」</text>
    <text x="560" y="146" font-size="11.5" fill="#475569">只有第 2 轮少放 29 个</text>

    <line x1="18" y1="184" x2="942" y2="184" stroke="#e2e8f0" stroke-width="1"/>
    <text x="18" y="204" font-size="11.5" fill="#991b1b">要点：判据不能只看「成功数」，要连「库存键的值」一起看 —— 不改这个写法，库存照样被扣穿。</text>
    <text x="18" y="220" font-size="11" fill="#94a3b8">注意：并发不够高时，看 DECR 返回值的变体会输出「领到 100」看似正确，但 Redis 里的库存依旧被扣穿。</text>
  </g>
</svg>
