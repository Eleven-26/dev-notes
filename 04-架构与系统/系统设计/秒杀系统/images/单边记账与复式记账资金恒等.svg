<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">资金安全：单边记账会凭空吃掉 39200 元，而且账面上看不出来</text>
  <text x="30" y="61" font-size="13" fill="#64748b">本机实测（MySQL 8.0.46 + Go）：100 个账户、每人 1000 元；复式记账借贷成对，总额 100000 → 100000 守恒</text>

  <g transform="translate(20,80)">
    <rect x="0" y="0" width="960" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">同一笔「A 转 B 100 元」，两种记账各写下什么</text>

    <rect x="18" y="44" width="452" height="186" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="30" y="68" font-size="12" fill="#991b1b">单边记账：每笔操作只记一个账户的变化</text>
    <text x="30" y="96" font-size="10.5" fill="#991b1b">分录 1：A 账户 —— 扣款 100（这一行在）</text>
    <text x="30" y="122" font-size="10.5" fill="#991b1b">分录 2：B 账户 ——（没有任何一行）</text>
    <text x="30" y="148" font-size="10.5" fill="#991b1b">漏掉另一边的机会：异常、并发、重试、部分成功</text>
    <text x="30" y="174" font-size="10.5" fill="#991b1b">结果：钱从总额里蒸发，但单边账里没有一行数据</text>
    <text x="30" y="196" font-size="10.5" fill="#991b1b">能证明它蒸发过 —— 只表现为「账对不上、说不清」。</text>

    <rect x="490" y="44" width="452" height="186" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="502" y="68" font-size="12" fill="#14532d">复式记账：每笔变动至少写成两条分录</text>
    <text x="502" y="96" font-size="10.5" fill="#14532d">分录 1：A 账户 —— 借出 100</text>
    <text x="502" y="122" font-size="10.5" fill="#14532d">分录 2：B 账户 —— 收入 100</text>
    <text x="502" y="148" font-size="10.5" fill="#14532d">金额相等、方向相反 → 两条要么都在、要么都不在</text>
    <text x="502" y="174" font-size="10.5" fill="#14532d">于是一条恒等式可以自动校验：</text>
    <text x="502" y="196" font-size="10.5" fill="#14532d">Σ 所有账户余额 = 初始总额</text>
  </g>

  <g transform="translate(20,346)">
    <rect x="0" y="0" width="960" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" fill="#0f172a">实测读数</text>
    <text x="18" y="52" font-size="11" fill="#991b1b">单边记账（只改付款方）：初始总额 100000 → 最终总额 60800 —— 不守恒，凭空少了 39200 元</text>
    <text x="18" y="74" font-size="11" fill="#14532d">复式记账（借贷成对）：初始总额 100000 → 最终总额 100000 —— 守恒</text>
    <text x="18" y="98" font-size="10.5" fill="#475569">这个和一旦不等于初始值，就说明有单边分录被写进去了 —— 系统自己就能发现，不必等对账、更不必等人工。</text>
  </g>

  <g transform="translate(20,474)">
    <rect x="0" y="0" width="960" height="146" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" fill="#0f172a">双保险：复式 + 对账，缺一不可</text>

    <rect x="18" y="44" width="452" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="30" y="66" font-size="11.5" fill="#1e3a8a">复式记账 —— 保证平台内部金额恒等</text>
    <text x="30" y="86" font-size="10.5" fill="#1e3a8a">挡的是：内部漏记一边、写错金额</text>

    <rect x="490" y="44" width="452" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="502" y="66" font-size="11.5" fill="#1e3a8a">对账 —— 保证平台与外部渠道一致</text>
    <text x="502" y="86" font-size="10.5" fill="#1e3a8a">挡的是：回调丢失、渠道与平台结果不符</text>

    <text x="18" y="120" font-size="11" fill="#334155">只有对账没有复式：内部错了却与渠道总额碰巧相等，查不出来；只有复式没有对账：渠道根本没收到这笔钱也发现不了。</text>
    <text x="18" y="140" font-size="10.5" fill="#94a3b8">⚠️ 未实测：手续费、退款、冻结的完整分录设计依赖具体业务，本篇只给「借贷成对 + 恒等校验」这条底线。</text>
  </g>
</svg>
