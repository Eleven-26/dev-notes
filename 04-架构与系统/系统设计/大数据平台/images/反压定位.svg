<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">反压从最下游的算子开始，往上游一路传</text>
  <text x="500" y="56" font-size="12" fill="#64748b" text-anchor="middle">示意图按生产形态画；本机那个 6 条消息的作业 alignment_buffered = 0，没有反压</text>

  <rect x="24" y="80" width="952" height="220" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="106" font-size="12" fill="#0f172a" font-weight="bold">一、堵点先出现在 sink，source 的背压只是被传导的结果</text>

  <rect x="60" y="120" width="170" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="145" y="145" font-size="11" fill="#1e40af" text-anchor="middle">Kafka source</text>
  <text x="145" y="165" font-size="9.5" fill="#1e40af" text-anchor="middle">消费位点推进变慢</text>

  <rect x="390" y="120" width="190" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="485" y="145" font-size="11" fill="#1e40af" text-anchor="middle">窗口聚合（有 shuffle）</text>
  <text x="485" y="165" font-size="9.5" fill="#1e40af" text-anchor="middle">输出缓冲堆积</text>

  <rect x="720" y="120" width="190" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="815" y="145" font-size="11" fill="#1e40af" text-anchor="middle">Iceberg sink</text>
  <text x="815" y="165" font-size="9.5" fill="#1e40af" text-anchor="middle">小文件多、提交慢</text>

  <path d="M 230 150 L 382 150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#c1)"/>
  <path d="M 580 150 L 712 150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#c1)"/>

  <rect x="60" y="192" width="170" height="14" rx="3" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
  <rect x="390" y="192" width="190" height="14" rx="3" fill="#f87171" stroke="#ef4444" stroke-width="1"/>
  <rect x="720" y="192" width="190" height="14" rx="3" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>

  <text x="145" y="222" font-size="9.5" fill="#b91c1c" text-anchor="middle">最后被传导到</text>
  <text x="485" y="222" font-size="9.5" fill="#b91c1c" text-anchor="middle">被传导到</text>
  <text x="815" y="222" font-size="9.5" fill="#b91c1c" text-anchor="middle">堵点起点</text>

  <path d="M 800 244 L 300 244" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#c2)"/>
  <text x="550" y="240" font-size="9.5" fill="#b91c1c" text-anchor="middle">背压传导方向</text>
  <text x="44" y="268" font-size="10" fill="#334155">排查起点是最右侧第一个变红的算子，不是最左侧报背压的那个；找到它之后，从它的输出端往下游查。</text>
  <text x="44" y="288" font-size="9.5" fill="#94a3b8">颜色深浅只表示被覆盖的先后，不代表实测占比；本机作业没有反压，拿不到占比读数。</text>

  <rect x="24" y="316" width="952" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="342" font-size="12" fill="#0f172a" font-weight="bold">二、三个可观测点（都不需要看日志）</text>

  <text x="44" y="372" font-size="10" fill="#1e40af">backPressuredTimeMsPerSecond / soft...</text>
  <text x="470" y="372" font-size="10" fill="#334155">每个算子的反压时间占比；持续接近 1000 ms/s 就是背压</text>

  <text x="44" y="400" font-size="10" fill="#1e40af">mailboxLatencyMs_p99</text>
  <text x="470" y="400" font-size="10" fill="#334155">算子处理单条记录的排队延迟；应与业务延迟同一量级</text>

  <text x="44" y="428" font-size="10" fill="#1e40af">checkpoint 的 alignment_buffered</text>
  <text x="470" y="428" font-size="10" fill="#334155">反压会让位对齐变慢；正常接近 0、耗时不涨（实测 0 与 10～147 ms）</text>

  <text x="44" y="454" font-size="9.5" fill="#94a3b8">前两个按算子查：先取 /jobs/&lt;id&gt;/plan 拿到 vertex id，再查 /jobs/&lt;id&gt;/vertices/&lt;vid&gt;/metrics。</text>

  <rect x="24" y="482" width="952" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="508" font-size="12" fill="#0f172a" font-weight="bold">三、四类成因与对应处置</text>
  <text x="44" y="530" font-size="10" fill="#334155">sink 背压：小文件太多、对象存储慢、单文件提交慢 → 调 checkpoint 间隔、增大目标文件、换 upsert 批量</text>
  <text x="44" y="552" font-size="10" fill="#334155">聚合背压：某个 key 特别热 → 加盐打散、拆两阶段聚合</text>
  <text x="44" y="574" font-size="10" fill="#334155">全链背压且 CPU 打满：并行度不够或单条处理太慢 → 先对齐分区数，再优化 UDF；间隙性背压：上游突发，上游限流或靠 Kafka 缓冲</text>

  <rect x="24" y="604" width="952" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="44" y="631" font-size="10" fill="#b91c1c">判据：反压是一条链而不是一个指标 —— 先定位最下游那个开始背压的算子，再决定是限上游、扩并行度，还是改 sink 的写文件姿势。</text>

  <defs>
    <marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
