<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">四个输入量，推成六项可采购的规格</text>
  <text x="500" y="56" font-size="12" fill="#64748b" text-anchor="middle">输入是自变量，事后调不了；六项规格是结果；中间的系数可以边跑边调</text>

  <text x="24" y="90" font-size="12" fill="#334155" font-weight="bold">输入（自变量）</text>
  <text x="620" y="90" font-size="12" fill="#334155" font-weight="bold">规格（可采购）</text>

  <rect x="24" y="100" width="300" height="74" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <rect x="24" y="100" width="4" height="74" rx="2" fill="#1e40af"/>
  <text x="40" y="122" font-size="12" fill="#1e40af" font-weight="bold">D · 日增原始字节 200 GB/天</text>
  <text x="40" y="142" font-size="9.5" fill="#334155">JSON 行、日志原文，不是压缩后的 Parquet</text>
  <text x="40" y="160" font-size="9.5" fill="#b45309">用压缩后大小算分区会低估 3–5 倍</text>

  <rect x="24" y="192" width="300" height="74" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <rect x="24" y="192" width="4" height="74" rx="2" fill="#b45309"/>
  <text x="40" y="214" font-size="12" fill="#b45309" font-weight="bold">E · 峰值事件率 10 万条/秒</text>
  <text x="40" y="234" font-size="9.5" fill="#334155">0.5 KB/条 → 48.8 MB/s</text>
  <text x="40" y="252" font-size="9.5" fill="#334155">直接定 Kafka 分区与 Flink 并行度</text>

  <rect x="24" y="284" width="300" height="74" rx="7" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
  <rect x="24" y="284" width="4" height="74" rx="2" fill="#047857"/>
  <text x="40" y="306" font-size="12" fill="#047857" font-weight="bold">R · 保留期（三种介质各不相同）</text>
  <text x="40" y="326" font-size="9.5" fill="#334155">Kafka 7 天 · 湖表 3 年 · OLAP 30 天</text>
  <text x="40" y="344" font-size="9.5" fill="#334155">存储成本随它线性增长</text>

  <rect x="24" y="376" width="300" height="74" rx="7" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <rect x="24" y="376" width="4" height="74" rx="2" fill="#7c3aed"/>
  <text x="40" y="398" font-size="12" fill="#7c3aed" font-weight="bold">Q · 查询并发</text>
  <text x="40" y="418" font-size="9.5" fill="#334155">50 QPS 点查 + 5 个 ad-hoc</text>
  <text x="40" y="436" font-size="9.5" fill="#334155">内存按并发 × 单查询内存定，不按数据量</text>

  <rect x="620" y="100" width="356" height="54" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="632" y="120" font-size="11.5" fill="#1e40af" font-weight="bold">Kafka：24 分区 / 2,730 GB</text>
  <text x="632" y="139" font-size="9.5" fill="#334155">max(带宽下限 10, 并行度 24)；每 broker 910 GB</text>

  <rect x="620" y="166" width="356" height="54" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="632" y="186" font-size="11.5" fill="#1e40af" font-weight="bold">Flink：30 slot / 120 GB</text>
  <text x="632" y="205" font-size="9.5" fill="#334155">状态 19 GB · checkpoint 46 GB（保留 2 份）</text>

  <rect x="620" y="232" width="356" height="54" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="632" y="252" font-size="11.5" fill="#b45309" font-weight="bold">Spark：23 core·h/天，微批 39 秒</text>
  <text x="632" y="271" font-size="9.5" fill="#334155">回填 3 年约 5,900 core·h，200 核跑 30 小时</text>

  <rect x="620" y="298" width="356" height="54" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="632" y="318" font-size="11.5" fill="#047857" font-weight="bold">湖表：逻辑 42.8 TB</text>
  <text x="632" y="337" font-size="9.5" fill="#334155">200 GB × 365 天 × 3 年 ÷ 压缩比 5</text>

  <rect x="620" y="364" width="356" height="54" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="632" y="384" font-size="11.5" fill="#047857" font-weight="bold">MinIO 裸盘：83.4 TB</text>
  <text x="632" y="403" font-size="9.5" fill="#334155">物理 55.6 TB × 1.5（纠删码 4+2）</text>

  <rect x="620" y="430" width="356" height="54" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="632" y="450" font-size="11.5" fill="#7c3aed" font-weight="bold">OLAP：0.55 TB，3 × 16c64G</text>
  <text x="632" y="469" font-size="9.5" fill="#334155">ADS 全量 + 7 天明细，副本 2，每节点 1 TB SSD</text>

  <path d="M 324 137 H 345 V 259 H 616" fill="none" stroke="#1e40af" stroke-width="1.4" marker-end="url(#c1)"/>
  <path d="M 324 137 H 345 V 316 H 616" fill="none" stroke="#1e40af" stroke-width="1.4" marker-end="url(#c1)"/>
  <path d="M 324 137 H 345 V 382 H 616" fill="none" stroke="#1e40af" stroke-width="1.4" marker-end="url(#c1)"/>

  <path d="M 324 229 H 415 V 118 H 616" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#c2)"/>
  <path d="M 324 229 H 415 V 193 H 616" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#c2)"/>

  <path d="M 324 321 H 485 V 136 H 616" fill="none" stroke="#047857" stroke-width="1.4" marker-end="url(#c3)"/>
  <path d="M 324 321 H 485 V 334 H 616" fill="none" stroke="#047857" stroke-width="1.4" marker-end="url(#c3)"/>
  <path d="M 324 321 H 485 V 400 H 616" fill="none" stroke="#047857" stroke-width="1.4" marker-end="url(#c3)"/>

  <path d="M 324 413 H 555 V 457 H 616" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#c4)"/>

  <rect x="24" y="510" width="14" height="10" fill="#1e40af"/>
  <text x="44" y="520" font-size="10" fill="#334155">D 日增字节</text>
  <rect x="160" y="510" width="14" height="10" fill="#b45309"/>
  <text x="180" y="520" font-size="10" fill="#334155">E 峰值事件率</text>
  <rect x="300" y="510" width="14" height="10" fill="#047857"/>
  <text x="320" y="520" font-size="10" fill="#334155">R 保留期</text>
  <rect x="420" y="510" width="14" height="10" fill="#7c3aed"/>
  <text x="440" y="520" font-size="10" fill="#334155">Q 查询并发</text>
  <text x="560" y="520" font-size="10" fill="#64748b">连线只表示「被谁决定」，精确算式见正文第二至六节</text>

  <defs>
    <marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e40af"/>
    </marker>
    <marker id="c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="c3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <marker id="c4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>
</svg>
