<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">扩容是最后一步：先确认超标，再做优化，最后才按台加资源</text>
  <text x="500" y="56" font-size="12" fill="#64748b" text-anchor="middle">单次尖峰不算；只看持续超阈值的信号，按台算增量，再决定加不加</text>

  <rect x="40" y="96" width="280" height="56" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="180" y="120" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="bold">指标持续超阈值？</text>
  <text x="180" y="140" font-size="10.5" fill="#1e40af" text-anchor="middle">持续一周，或持续 10 分钟</text>

  <line x1="180" y1="152" x2="180" y2="182" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="176" x2="200" y2="176" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="40" y="184" width="280" height="56" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="180" y="208" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="bold">优化清单做完了？</text>
  <text x="180" y="228" font-size="10.5" fill="#1e40af" text-anchor="middle">排序键 / 物化视图 / 压缩 / 并行度</text>

  <line x1="180" y1="240" x2="180" y2="270" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="272" width="280" height="56" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="180" y="296" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="bold">按台算过扩容账？</text>
  <text x="180" y="316" font-size="10.5" fill="#1e40af" text-anchor="middle">月摊销增量对比优化收益</text>

  <line x1="180" y1="328" x2="180" y2="358" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="360" width="280" height="56" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
  <text x="180" y="384" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">扩容：加盘、加 TM、加 BE</text>
  <text x="180" y="404" font-size="10.5" fill="#b91c1c" text-anchor="middle">一次只动一类，扩完复测同一读数</text>

  <line x1="320" y1="124" x2="350" y2="124" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="352" y="96" width="300" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="366" y="120" font-size="11.5" fill="#334155" font-weight="bold">先不改，记录基线</text>
  <text x="366" y="140" font-size="10.5" fill="#64748b">尖峰不等于容量不足，噪声先排除</text>

  <line x1="320" y1="212" x2="350" y2="212" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="352" y="184" width="300" height="56" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="366" y="208" font-size="11.5" fill="#047857" font-weight="bold">先优化：通常能解决一半以上</text>
  <text x="366" y="228" font-size="10.5" fill="#047857">读行数 262,144 降到 32,768（实测）</text>

  <line x1="320" y1="300" x2="350" y2="300" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="352" y="272" width="300" height="56" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="366" y="296" font-size="11.5" fill="#92400e" font-weight="bold">先算账再动手</text>
  <text x="366" y="316" font-size="10.5" fill="#92400e">加一台的月摊销，换得回多少余量</text>

  <rect x="676" y="84" width="300" height="200" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="826" y="108" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold">扩容按台算：月摊销（元）</text>
  <text x="692" y="138" font-size="10.5" fill="#334155">Kafka broker</text>
  <text x="960" y="138" font-size="10.5" fill="#334155" text-anchor="end">800</text>
  <line x1="692" y1="150" x2="960" y2="150" stroke="#e2e8f0" stroke-width="1"/>
  <text x="692" y="172" font-size="10.5" fill="#334155">Flink TaskManager</text>
  <text x="960" y="172" font-size="10.5" fill="#334155" text-anchor="end">800</text>
  <line x1="692" y1="184" x2="960" y2="184" stroke="#e2e8f0" stroke-width="1"/>
  <text x="692" y="206" font-size="10.5" fill="#334155">批池节点（16 核）</text>
  <text x="960" y="206" font-size="10.5" fill="#334155" text-anchor="end">1,200</text>
  <line x1="692" y1="218" x2="960" y2="218" stroke="#e2e8f0" stroke-width="1"/>
  <text x="692" y="240" font-size="10.5" fill="#334155">OLAP BE（1 TB SSD）</text>
  <text x="960" y="240" font-size="10.5" fill="#334155" text-anchor="end">1,500</text>
  <text x="692" y="266" font-size="9.5" fill="#64748b">由容量篇月摊销表按节点数折算</text>

  <rect x="676" y="300" width="300" height="116" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
  <text x="692" y="324" font-size="11" fill="#b91c1c" font-weight="bold">批池最后扩</text>
  <text x="692" y="346" font-size="10.5" fill="#b91c1c">批池月摊销 9,600 元，占 36%</text>
  <text x="692" y="366" font-size="10.5" fill="#b91c1c">但日常只用 6–10 核</text>
  <text x="692" y="388" font-size="10.5" fill="#b91c1c">先弹性化，再谈加机器</text>
  <text x="692" y="406" font-size="9.5" fill="#64748b">利用率从 5% 到 40%，省六成</text>

  <rect x="24" y="440" width="952" height="64" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="462" font-size="10.5" fill="#334155">阈值看持续：Kafka 磁盘 > 70%、slot > 80% 一周、BE CPU > 70% 十分钟或 P95 > 3 秒、批等待 > 出数窗口一半。</text>
  <text x="44" y="484" font-size="10.5" fill="#b91c1c">按 5 分钟峰值扩容是最常见的浪费：副本追赶、每日发布、一次回填都会把 CPU 打满，买回来的容量一年用不到几次。</text>
</svg>
