<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">自建 K8s 上的三个节点池与组件落位</text>
  <text x="500" y="56" font-size="12" fill="#64748b" text-anchor="middle">三列是三个节点池，不是三个 namespace：常驻、弹性、存储三类负载的调度目标不同</text>

  <rect x="24" y="76" width="952" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="102" font-size="13.5" fill="#334155" font-weight="bold">控制面：只发指令，不搬数据（独立 namespace，依赖 PG 与对象存储）</text>

  <rect x="44" y="116" width="217" height="64" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="56" y="138" font-size="11" fill="#1e40af" font-weight="bold">Iceberg REST Catalog</text>
  <text x="56" y="158" font-size="9.5" fill="#475569">REST 服务 + PG 元数据库</text>
  <text x="56" y="175" font-size="9.5" fill="#475569">表注册的唯一入口</text>

  <rect x="275" y="116" width="217" height="64" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="287" y="138" font-size="11" fill="#1e40af" font-weight="bold">调度：DolphinScheduler</text>
  <text x="287" y="158" font-size="9.5" fill="#475569">DAG · 补数 · SLA</text>
  <text x="287" y="175" font-size="9.5" fill="#475569">或 Airflow / Argo Workflows</text>

  <rect x="506" y="116" width="217" height="64" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="518" y="138" font-size="11" fill="#1e40af" font-weight="bold">元数据：DataHub</text>
  <text x="518" y="158" font-size="9.5" fill="#475569">自动解析表与血缘</text>
  <text x="518" y="175" font-size="9.5" fill="#475569">或 OpenMetadata</text>

  <rect x="737" y="116" width="217" height="64" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="749" y="138" font-size="11" fill="#1e40af" font-weight="bold">监控：Prometheus + Grafana</text>
  <text x="749" y="158" font-size="9.5" fill="#475569">指标 + 看板 + 告警</text>
  <text x="749" y="175" font-size="9.5" fill="#475569">日志：Loki</text>

  <text x="44" y="200" font-size="10.5" fill="#334155">Operator 编排：Strimzi（Kafka）· Flink Kubernetes Operator · Spark Kubernetes Operator · Doris Operator</text>

  <path d="M 174 216 L 174 236" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#k1)"/>
  <text x="186" y="232" font-size="9.5" fill="#64748b">CRD 下发</text>
  <path d="M 490 216 L 490 236" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#k1)"/>
  <path d="M 816 216 L 816 236" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#k1)"/>

  <rect x="24" y="240" width="300" height="300" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="44" y="266" font-size="13" fill="#1e40af" font-weight="bold">streaming 池：常驻、固定配额</text>
  <rect x="40" y="284" width="268" height="76" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="52" y="306" font-size="11" fill="#1e40af" font-weight="bold">Kafka ×3（Strimzi）</text>
  <text x="52" y="326" font-size="9.5" fill="#334155">每 broker 独立 PVC · 2 TB NVMe</text>
  <text x="52" y="344" font-size="9.5" fill="#334155">副本 3 · min.insync.replicas=2</text>
  <rect x="40" y="372" width="268" height="52" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="52" y="394" font-size="11" fill="#1e40af" font-weight="bold">Flink JobManager ×1</text>
  <text x="52" y="412" font-size="9.5" fill="#334155">checkpoint 落对象存储，不落本地盘</text>
  <rect x="40" y="434" width="268" height="84" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="52" y="456" font-size="11" fill="#1e40af" font-weight="bold">Flink TaskManager ×6</text>
  <text x="52" y="476" font-size="9.5" fill="#334155">30 slot × 4 GB = 120 GB</text>
  <text x="52" y="494" font-size="9.5" fill="#334155">RocksDB 状态后端 · 增量 checkpoint</text>

  <rect x="340" y="240" width="300" height="300" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="360" y="266" font-size="13" fill="#b45309" font-weight="bold">batch 池：弹性、可中断</text>
  <rect x="356" y="284" width="268" height="52" rx="7" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <text x="368" y="306" font-size="11" fill="#b45309" font-weight="bold">Spark Driver ×1 / 作业</text>
  <text x="368" y="326" font-size="9.5" fill="#334155">提交入口：调度器或回填脚本</text>
  <rect x="356" y="346" width="268" height="76" rx="7" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <text x="368" y="368" font-size="11" fill="#b45309" font-weight="bold">Spark Executor ×8 → 16</text>
  <text x="368" y="388" font-size="9.5" fill="#334155">16c64G · 动态资源分配</text>
  <text x="368" y="406" font-size="9.5" fill="#334155">executor 上限按队列设</text>
  <rect x="356" y="432" width="268" height="86" rx="7" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <text x="368" y="454" font-size="11" fill="#b45309" font-weight="bold">回填 / 合并 / 对账</text>
  <text x="368" y="474" font-size="9.5" fill="#334155">夜间放开上限，可用竞价实例</text>
  <text x="368" y="492" font-size="9.5" fill="#334155">可被打断，任务必须能重跑</text>

  <rect x="656" y="240" width="320" height="300" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="676" y="266" font-size="13" fill="#047857" font-weight="bold">storage 池：大磁盘、内存敏感</text>
  <rect x="672" y="284" width="288" height="76" rx="7" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="684" y="306" font-size="11" fill="#047857" font-weight="bold">MinIO 分布式 4 节点</text>
  <text x="684" y="326" font-size="9.5" fill="#334155">83.4 TB 裸盘 · 纠删码 4+2</text>
  <text x="684" y="344" font-size="9.5" fill="#334155">Iceberg 数据、快照与 checkpoint 落点</text>
  <rect x="672" y="370" width="288" height="76" rx="7" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="684" y="392" font-size="11" fill="#047857" font-weight="bold">Doris BE ×3 / FE ×3</text>
  <text x="684" y="412" font-size="9.5" fill="#334155">BE 16c64G + 1 TB SSD · 副本 2</text>
  <text x="684" y="430" font-size="9.5" fill="#334155">ADS 全量 + 7 天明细（可重建）</text>
  <rect x="672" y="456" width="288" height="62" rx="7" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="684" y="478" font-size="11" fill="#047857" font-weight="bold">Trino worker ×3（按需扩）</text>
  <text x="684" y="498" font-size="9.5" fill="#334155">直查 Iceberg 湖表，不搬数</text>

  <rect x="24" y="560" width="952" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="586" font-size="11.5" fill="#334155" font-weight="bold">混部反例：Kafka 与 Spark 同池 → 批高峰把 ISR 打掉；storage 与计算同池 → 磁盘 IO 与内存互相拖</text>
  <text x="44" y="610" font-size="11" fill="#475569">起组件顺序由依赖决定：MinIO → Catalog → Kafka → 计算 Operator → 调度 → OLAP 与元数据</text>

  <defs>
    <marker id="k1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
