<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">水位线延迟决定窗口何时关闭，窗口关闭才决定谁被丢</text>
  <text x="500" y="56" font-size="12" fill="#64748b" text-anchor="middle">同一组六条消息、同一个十秒窗口；圆圈里的数字是到达顺序</text>

  <rect x="24" y="84" width="952" height="216" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="36" y="100" width="72" height="54" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="72" y="124" font-size="11" fill="#1e40af" text-anchor="middle">延迟</text>
  <text x="72" y="144" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="bold">5 秒</text>
  <text x="122" y="108" font-size="10" fill="#b91c1c">00:00:50 到达后水位线推到 00:00:45，两个窗口当场关闭</text>

  <line x1="110" y1="196" x2="960" y2="196" stroke="#334155" stroke-width="1.5"/>
  <g font-size="9.5" fill="#64748b" text-anchor="middle">
    <text x="110" y="248">00:00</text>
    <text x="252" y="248">00:20</text>
    <text x="393" y="248">00:40</text>
    <text x="535" y="248">01:00</text>
    <text x="677" y="248">01:20</text>
    <text x="818" y="248">01:40</text>
    <text x="960" y="248" font-size="9.5" text-anchor="middle">02:00</text>
  </g>

  <rect x="110" y="196" width="71" height="34" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="145" y="218" font-size="10" fill="#991b1b" text-anchor="middle">[0,10) 计 1</text>
  <rect x="181" y="196" width="71" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="216" y="218" font-size="10" fill="#64748b" text-anchor="middle">[10,20) 空</text>
  <rect x="464" y="196" width="71" height="34" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="499" y="218" font-size="10" fill="#1e40af" text-anchor="middle">[50,60) 计 2</text>

  <line x1="428" y1="118" x2="428" y2="190" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="436" y="114" font-size="9.5" fill="#b91c1c" text-anchor="start">水位线 = 00:00:45</text>

  <g>
    <circle cx="174" cy="136" r="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.2"/>
    <text x="174" y="140" font-size="10" fill="#1e40af" text-anchor="middle">1</text>
    <circle cx="464" cy="136" r="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.2"/>
    <text x="464" y="140" font-size="10" fill="#1e40af" text-anchor="middle">2</text>
    <circle cx="960" cy="136" r="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.2"/>
    <text x="960" y="140" font-size="10" fill="#1e40af" text-anchor="middle">6</text>
    <circle cx="117" cy="166" r="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="117" y="170" font-size="10" fill="#b91c1c" text-anchor="middle">3</text>
    <circle cx="471" cy="166" r="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.2"/>
    <text x="471" y="170" font-size="10" fill="#1e40af" text-anchor="middle">4</text>
    <circle cx="195" cy="166" r="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="195" y="170" font-size="10" fill="#b91c1c" text-anchor="middle">5</text>
  </g>
  <text x="117" y="192" font-size="9" fill="#b91c1c" text-anchor="middle">丢</text>
  <text x="195" y="192" font-size="9" fill="#b91c1c" text-anchor="middle">丢</text>
  <text x="620" y="166" font-size="10" fill="#b91c1c">3 与 5 落在已关闭的窗口上，直接丢弃</text>
  <text x="620" y="186" font-size="10" fill="#334155">numLateRecordsDropped = 2</text>

  <rect x="24" y="312" width="952" height="216" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="36" y="328" width="72" height="54" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="72" y="352" font-size="11" fill="#047857" text-anchor="middle">延迟</text>
  <text x="72" y="372" font-size="12" fill="#047857" text-anchor="middle" font-weight="bold">60 秒</text>
  <text x="122" y="336" font-size="10" fill="#047857">水位线始终比最大事件时间慢 60 秒，直到 00:02:00 到达才关窗</text>

  <line x1="110" y1="424" x2="960" y2="424" stroke="#334155" stroke-width="1.5"/>
  <g font-size="9.5" fill="#64748b" text-anchor="middle">
    <text x="110" y="476">00:00</text>
    <text x="252" y="476">00:20</text>
    <text x="393" y="476">00:40</text>
    <text x="535" y="476">01:00</text>
    <text x="677" y="476">01:20</text>
    <text x="818" y="476">01:40</text>
    <text x="960" y="476" font-size="9.5" text-anchor="middle">02:00</text>
  </g>

  <rect x="110" y="424" width="71" height="34" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="145" y="446" font-size="10" fill="#047857" text-anchor="middle">[0,10) 计 2</text>
  <rect x="181" y="424" width="71" height="34" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="216" y="446" font-size="10" fill="#047857" text-anchor="middle">[10,20) 计 1</text>
  <rect x="464" y="424" width="71" height="34" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="499" y="446" font-size="10" fill="#047857" text-anchor="middle">[50,60) 计 2</text>

  <line x1="535" y1="346" x2="535" y2="418" stroke="#047857" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="531" y="342" font-size="9.5" fill="#047857" text-anchor="end">水位线 = 00:01:00</text>

  <g>
    <circle cx="174" cy="364" r="10" fill="#bbf7d0" stroke="#047857" stroke-width="1.2"/>
    <text x="174" y="368" font-size="10" fill="#047857" text-anchor="middle">1</text>
    <circle cx="464" cy="364" r="10" fill="#bbf7d0" stroke="#047857" stroke-width="1.2"/>
    <text x="464" y="368" font-size="10" fill="#047857" text-anchor="middle">2</text>
    <circle cx="960" cy="364" r="10" fill="#bbf7d0" stroke="#047857" stroke-width="1.2"/>
    <text x="960" y="368" font-size="10" fill="#047857" text-anchor="middle">6</text>
    <circle cx="117" cy="394" r="10" fill="#bbf7d0" stroke="#047857" stroke-width="1.2"/>
    <text x="117" y="398" font-size="10" fill="#047857" text-anchor="middle">3</text>
    <circle cx="471" cy="394" r="10" fill="#bbf7d0" stroke="#047857" stroke-width="1.2"/>
    <text x="471" y="398" font-size="10" fill="#047857" text-anchor="middle">4</text>
    <circle cx="195" cy="394" r="10" fill="#bbf7d0" stroke="#047857" stroke-width="1.2"/>
    <text x="195" y="398" font-size="10" fill="#047857" text-anchor="middle">5</text>
  </g>
  <text x="620" y="394" font-size="10" fill="#047857">六个都在窗口关闭前到达，全部入窗</text>
  <text x="620" y="414" font-size="10" fill="#334155">numLateRecordsDropped = 0</text>

  <rect x="24" y="542" width="952" height="62" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="44" y="564" font-size="10" fill="#334155">结论一：乱序本身不丢数据 —— 只要窗口还开着，晚到的记录照样入窗（第一版实验里五条全计入）。</text>
  <text x="44" y="586" font-size="10" fill="#b91c1c">结论二：延迟买的是「允许迟到多久」，代价是结果定稿更晚；取值按上游 p99 乱序加一个上报周期，用丢弃计数校验。</text>
</svg>
