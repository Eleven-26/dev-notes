<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="arw_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">五处落点，只有 raw 不可再生</text>
  <text x="500" y="58" font-size="12.2" fill="#64748b" text-anchor="middle">实线是写入方向；虚线是从 raw 重放的路径 —— 它能重建湖表与 OLAP，反过来不行</text>
  <rect x="40" y="96" width="180" height="104" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="54" y="122" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="bold">业务源库</text>
  <text x="54" y="144" font-size="10.6" fill="#dc2626" text-anchor="start" font-family="Consolas, Menlo, monospace">MySQL，权威值</text>
  <text x="54" y="164" font-size="10.6" fill="#64748b" text-anchor="start">上游，不在平台内</text>
  <rect x="54" y="174" width="96" height="18" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="102" y="187" font-size="9.6" fill="#dc2626" text-anchor="middle" font-weight="bold">不可重建</text>
  <rect x="260" y="96" width="180" height="104" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="274" y="122" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="bold">raw 层</text>
  <text x="274" y="144" font-size="10.6" fill="#dc2626" text-anchor="start" font-family="Consolas, Menlo, monospace">bdp-raw，永久</text>
  <text x="274" y="164" font-size="10.6" fill="#64748b" text-anchor="start">未解析字节</text>
  <rect x="274" y="174" width="96" height="18" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="322" y="187" font-size="9.6" fill="#dc2626" text-anchor="middle" font-weight="bold">不可重建</text>
  <rect x="480" y="96" width="180" height="104" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
  <text x="494" y="122" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="bold">湖表</text>
  <text x="494" y="144" font-size="10.6" fill="#15803d" text-anchor="start" font-family="Consolas, Menlo, monospace">bdp-lake，3 年分层</text>
  <text x="494" y="164" font-size="10.6" fill="#64748b" text-anchor="start">Iceberg warehouse</text>
  <rect x="494" y="174" width="96" height="18" rx="4" fill="#ffffff" stroke="#15803d" stroke-width="1"/>
  <text x="542" y="187" font-size="9.6" fill="#15803d" text-anchor="middle" font-weight="bold">可从 raw 重放</text>
  <rect x="700" y="96" width="180" height="104" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
  <text x="714" y="122" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="bold">OLAP</text>
  <text x="714" y="144" font-size="10.6" fill="#15803d" text-anchor="start" font-family="Consolas, Menlo, monospace">本地盘，TTL 90 天</text>
  <text x="714" y="164" font-size="10.6" fill="#64748b" text-anchor="start">ADS + 近 90 天明细</text>
  <rect x="714" y="174" width="96" height="18" rx="4" fill="#ffffff" stroke="#15803d" stroke-width="1"/>
  <text x="762" y="187" font-size="9.6" fill="#15803d" text-anchor="middle" font-weight="bold">可从湖表重刷</text>
  <path d="M 220 136 L 256 136" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 440 136 L 476 136" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 660 136 L 696 136" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 350.0 206 C 350.0 252, 790.0 252, 790.0 208" fill="none" stroke="#15803d" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arw_g)"/>
  <text x="500" y="268" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">要重算就回到 raw 重放，再写一遍湖表与 OLAP；反过来退不回去</text>
  <text x="40" y="268" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="bold">通道与临时态（不在这条重建链上）</text>
  <rect x="40" y="282" width="430" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="56" y="306" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">Kafka</text>
  <text x="56" y="327" font-size="10.6" fill="#64748b" text-anchor="start" font-family="Consolas, Menlo, monospace">broker 本地盘，retention.ms = 7 天</text>
  <text x="56" y="347" font-size="10.8" fill="#dc2626" text-anchor="start">段到期直接删，位点前移 —— 它不是备份，是通道</text>
  <rect x="490" y="282" width="470" height="86" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="506" y="306" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">平台状态（丢了先瘫痪的是作业）</text>
  <text x="506" y="327" font-size="10.6" fill="#ea580c" text-anchor="start" font-family="Consolas, Menlo, monospace">bdp-state：checkpoint 7 天 / savepoint 30 天</text>
  <text x="506" y="347" font-size="10.8" fill="#64748b" text-anchor="start">Catalog 的 PG + 调度库：记的是「数据在哪」，必须单独备份</text>
  <rect x="40" y="396" width="920" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="424" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="bold">判据只有一句：把它删了，能不能从别处算出同一份东西。</text>
  <text x="60" y="448" font-size="11.4" fill="#64748b" text-anchor="start">能 → 不备份，靠重算；不能（raw、源库、Catalog 元数据库）→ 进备份清单，并按季度演练恢复。</text>
  <text x="40" y="505" font-size="10.4" fill="#64748b" text-anchor="start" font-family="Consolas, Menlo, monospace">本机实测：dwd.event_log 写 6000 行 → 48 个 parquet，目录按 days(event_time) / bucket(16, user_id) 自动分层</text>
  <text x="40" y="522" font-size="10.4" fill="#64748b" text-anchor="start" font-family="Consolas, Menlo, monospace">同批数据的 OLAP 侧 TTL 实测：90 天规则把 300 天的历史数据当场删到 53,946 行</text>
</svg>