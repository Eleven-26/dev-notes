<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">两条链路，一份湖表</text>
  <text x="500" y="58" font-size="12" fill="#64748b" text-anchor="middle">Flink 管持续修正，Spark 管扫历史；两者读写同一张 Iceberg 表</text>

  <rect x="24" y="88" width="456" height="368" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
  <text x="44" y="116" font-size="14" fill="#047857" font-weight="bold">近实时链（Flink）：持续修正</text>

  <rect x="44" y="130" width="416" height="46" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
  <text x="56" y="158" font-size="11" fill="#334155">Kafka raw：原样事件，按主键分区</text>
  <rect x="44" y="190" width="416" height="46" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
  <text x="56" y="218" font-size="11" fill="#334155">清洗与规范化：逐条处理，无历史依赖</text>
  <rect x="44" y="250" width="416" height="46" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
  <text x="56" y="278" font-size="11" fill="#334155">CDC merge：按主键持续合并变更</text>
  <rect x="44" y="310" width="416" height="46" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
  <text x="56" y="338" font-size="11" fill="#334155">1 / 5 / 15 分钟窗口聚合</text>
  <text x="56" y="384" font-size="10" fill="#047857">输出：cleaned topic、湖表 append、OLAP ADS</text>
  <text x="56" y="404" font-size="10" fill="#64748b">迟到数据可在允许延迟内重算窗口</text>

  <path d="M 252 176 L 252 188" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#f1)"/>
  <path d="M 252 236 L 252 248" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#f1)"/>
  <path d="M 252 296 L 252 308" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#f1)"/>

  <rect x="520" y="88" width="456" height="368" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="540" y="116" font-size="14" fill="#1e40af" font-weight="bold">历史链（Spark）：扫历史</text>

  <rect x="540" y="130" width="416" height="46" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="552" y="158" font-size="11" fill="#334155">读同一张湖表：按分区扫描</text>
  <rect x="540" y="190" width="416" height="46" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="552" y="218" font-size="11" fill="#334155">宽表重建 / 大维表 join（全量 shuffle）</text>
  <rect x="540" y="250" width="416" height="46" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="552" y="278" font-size="11" fill="#334155">回填与修数：历史分区覆盖写</text>
  <rect x="540" y="310" width="416" height="46" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="552" y="338" font-size="11" fill="#334155">对账 / 小文件合并 / 快照过期</text>
  <text x="552" y="384" font-size="10" fill="#1e40af">输出：湖表 DWD / DWS、对账报告、ADS 修正</text>
  <text x="552" y="404" font-size="10" fill="#64748b">同一份 SQL 既跑日常批，也跑回填</text>

  <path d="M 748 176 L 748 188" fill="none" stroke="#1e40af" stroke-width="1.6" marker-end="url(#f2)"/>
  <path d="M 748 236 L 748 248" fill="none" stroke="#1e40af" stroke-width="1.6" marker-end="url(#f2)"/>
  <path d="M 748 296 L 748 308" fill="none" stroke="#1e40af" stroke-width="1.6" marker-end="url(#f2)"/>

  <rect x="250" y="486" width="500" height="72" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="500" y="512" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">Iceberg 湖表</text>
  <text x="500" y="536" font-size="10.5" fill="#334155" text-anchor="middle">一份存储、一份表定义：两个引擎读写同一张表，口径只定义一次</text>

  <path d="M 252 456 L 330 484" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#f1)"/>
  <path d="M 748 456 L 670 484" fill="none" stroke="#1e40af" stroke-width="1.6" marker-end="url(#f2)"/>

  <rect x="24" y="580" width="952" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="606" font-size="11.5" fill="#334155">判断归属只问两句：要不要持续修正 → Flink；要不要扫历史 → Spark。</text>
  <text x="44" y="628" font-size="11.5" fill="#475569">15 分钟 SLA 用微批即可兑现；流的价值在 CDC merge、迟到修正与亚分钟告警。</text>

  <defs>
    <marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e40af"/>
    </marker>
  </defs>
</svg>
