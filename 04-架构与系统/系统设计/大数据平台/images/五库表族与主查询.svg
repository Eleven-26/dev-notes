  <text x="838" y="264" font-size="11" fill="#ea580c" text-anchor="start" font-weight="bold">⑤</text>
  <text x="856" y="264" font-size="10.2" fill="#0f172a" text-anchor="start">昨日渠道对账</text>
  <text x="838" y="295" font-size="11" fill="#ea580c" text-anchor="start" font-weight="bold">⑥</text>
  <text x="856" y="295" font-size="10.2" fill="#0f172a" text-anchor="start">用户等级历史</text>
  <text x="838" y="326" font-size="11" fill="#ea580c" text-anchor="start" font-weight="bold">⑦</text>
  <text x="856" y="326" font-size="10.2" fill="#0f172a" text-anchor="start">事件序列回放</text>
  <text x="838" y="357" font-size="11" fill="#ea580c" text-anchor="start" font-weight="bold">⑧</text>
  <text x="856" y="357" font-size="10.2" fill="#0f172a" text-anchor="start">行数巡检（读元数据）</text>
  <text x="30" y="550" font-size="10.4" fill="#64748b" text-anchor="start" font-family="Consolas, Menlo, monospace">本机实测：13 张表 DDL 全部执行通过；dwd.event_log 写 6000 行 → 48 个文件（3 天 × 16 桶），平均 125 行/文件</text>
  <text x="30" y="568" font-size="10.4" fill="#64748b" text-anchor="start" font-family="Consolas, Menlo, monospace">排序键对照：200 万行下，只按 metric 查询，(metric_code, stat_date) 读 114,689 行，(stat_date, metric_code) 读 2,000,000 行</text>
  <text x="30" y="586" font-size="10.4" fill="#64748b" text-anchor="start">第 ⑧ 条不读 parquet：行数在 &lt;表&gt;.files 的 record_count 里，只扫元数据</text>
