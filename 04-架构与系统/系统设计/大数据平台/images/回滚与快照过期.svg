<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">回滚只移动指针，过期才删快照</text>
  <text x="500" y="56" font-size="12" fill="#64748b" text-anchor="middle">实测表 t_cmp：S1–S5 为单行插入，S6 为合并产生的 replace 快照</text>

  <text x="60" y="100" font-size="11" fill="#334155" font-weight="bold">回滚前：6 个快照，当前指向 S6（5 行数据、1 个文件）</text>
  <path d="M 100 150 L 900 150" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="100" cy="150" r="7" fill="#1e40af"/>
  <circle cx="260" cy="150" r="7" fill="#1e40af"/>
  <circle cx="420" cy="150" r="7" fill="#1e40af"/>
  <circle cx="580" cy="150" r="7" fill="#1e40af"/>
  <circle cx="740" cy="150" r="7" fill="#1e40af"/>
  <circle cx="900" cy="150" r="7" fill="#b45309"/>
  <text x="100" y="136" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="bold">S1</text>
  <text x="260" y="136" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="bold">S2</text>
  <text x="420" y="136" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="bold">S3</text>
  <text x="580" y="136" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="bold">S4</text>
  <text x="740" y="136" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="bold">S5</text>
  <text x="900" y="136" font-size="10" fill="#b45309" text-anchor="middle" font-weight="bold">S6</text>
  <text x="100" y="172" font-size="9.5" fill="#64748b" text-anchor="middle">append</text>
  <text x="260" y="172" font-size="9.5" fill="#64748b" text-anchor="middle">append</text>
  <text x="420" y="172" font-size="9.5" fill="#64748b" text-anchor="middle">append</text>
  <text x="580" y="172" font-size="9.5" fill="#64748b" text-anchor="middle">append</text>
  <text x="740" y="172" font-size="9.5" fill="#64748b" text-anchor="middle">append</text>
  <text x="900" y="172" font-size="9.5" fill="#b45309" text-anchor="middle">replace</text>

  <path d="M 892 178 Q 500 232 108 178" fill="none" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#r1)"/>
  <text x="500" y="246" font-size="10.5" fill="#1e40af" text-anchor="middle">rollback_to_snapshot(S1)：数据回到 1 行，但 snapshots 仍是 6 个</text>
  <text x="500" y="266" font-size="10" fill="#334155" text-anchor="middle">时间旅行到 S6 仍读到 5 行 —— 回滚没有动 S6 的数据文件</text>

  <text x="60" y="304" font-size="11" fill="#334155" font-weight="bold">过期后：只剩 1 个快照、1 条 history，行数仍是 1</text>
  <path d="M 100 350 L 900 350" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="100" cy="350" r="7" fill="#1e40af"/>
  <circle cx="260" cy="350" r="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="420" cy="350" r="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="580" cy="350" r="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="740" cy="350" r="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="900" cy="350" r="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="100" y="336" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="bold">S1</text>
  <text x="260" y="336" font-size="9.5" fill="#94a3b8" text-anchor="middle">S2</text>
  <text x="420" y="336" font-size="9.5" fill="#94a3b8" text-anchor="middle">S3</text>
  <text x="580" y="336" font-size="9.5" fill="#94a3b8" text-anchor="middle">S4</text>
  <text x="740" y="336" font-size="9.5" fill="#94a3b8" text-anchor="middle">S5</text>
  <text x="900" y="336" font-size="9.5" fill="#94a3b8" text-anchor="middle">S6</text>
  <text x="500" y="376" font-size="10" fill="#94a3b8" text-anchor="middle">虚线点：非当前快照祖先，已被 expire_snapshots 清掉</text>
  <text x="500" y="398" font-size="10.5" fill="#b91c1c" text-anchor="middle">VERSION AS OF S6 → IllegalArgumentException: Cannot find snapshot with ID 8782198088955517158</text>

  <rect x="24" y="420" width="952" height="112" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="44" y="446" font-size="11" fill="#1e40af" font-weight="bold">回滚与过期是两把锁，顺序不能反</text>
  <text x="44" y="472" font-size="10.5" fill="#334155">回滚（rollback_to_snapshot）只移动 current snapshot，快照与文件都留着 —— 它决定「现在的数据长什么样」</text>
  <text x="44" y="496" font-size="10.5" fill="#334155">过期（expire_snapshots）删掉非祖先快照 —— 它决定「历史还剩多长」，删完时间旅行就直接报找不到快照</text>
  <text x="44" y="520" font-size="10.5" fill="#b45309">先回滚、用 count(*) 确认、留一天再过期；反过来做，出问题时已经没有可回滚的点</text>

  <defs>
    <marker id="r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e40af"/>
    </marker>
  </defs>
</svg>
