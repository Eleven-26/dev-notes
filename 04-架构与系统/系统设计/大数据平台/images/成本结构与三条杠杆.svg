<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">成本结构与三条杠杆</text>
  <text x="500" y="56" font-size="12" fill="#64748b" text-anchor="middle">自建硬件 36 个月摊销、不含机房与电费；结构示意，不是报价</text>

  <text x="60" y="96" font-size="12" fill="#334155" font-weight="bold">月摊销（元/月）</text>

  <line x1="60" y1="142" x2="600" y2="142" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="60" y1="251" x2="600" y2="251" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="60" y1="361" x2="600" y2="361" stroke="#e2e8f0" stroke-width="1"/>
  <text x="54" y="146" font-size="9.5" fill="#94a3b8" text-anchor="end">9,000</text>
  <text x="54" y="255" font-size="9.5" fill="#94a3b8" text-anchor="end">6,000</text>
  <text x="54" y="365" font-size="9.5" fill="#94a3b8" text-anchor="end">3,000</text>
  <line x1="60" y1="470" x2="600" y2="470" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="54" y="474" font-size="9.5" fill="#94a3b8" text-anchor="end">0</text>

  <rect x="71" y="382" width="68" height="88" fill="#1e40af"/>
  <text x="105" y="374" font-size="10.5" fill="#1e40af" text-anchor="middle" font-weight="bold">2,400</text>
  <text x="105" y="490" font-size="10.5" fill="#334155" text-anchor="middle">Kafka · 9%</text>

  <rect x="161" y="295" width="68" height="175" fill="#2563eb"/>
  <text x="195" y="287" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="bold">4,800</text>
  <text x="195" y="490" font-size="10.5" fill="#334155" text-anchor="middle">Flink · 18%</text>

  <rect x="251" y="120" width="68" height="350" fill="#b45309"/>
  <text x="285" y="112" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="bold">9,600</text>
  <text x="285" y="490" font-size="10.5" fill="#334155" text-anchor="middle">Spark 批池 · 36%</text>

  <rect x="341" y="372" width="68" height="98" fill="#047857"/>
  <text x="375" y="364" font-size="10.5" fill="#047857" text-anchor="middle" font-weight="bold">2,700</text>
  <text x="375" y="490" font-size="10.5" fill="#334155" text-anchor="middle">MinIO · 10%</text>

  <rect x="431" y="306" width="68" height="164" fill="#7c3aed"/>
  <text x="465" y="298" font-size="10.5" fill="#7c3aed" text-anchor="middle" font-weight="bold">4,500</text>
  <text x="465" y="490" font-size="10.5" fill="#334155" text-anchor="middle">OLAP · 17%</text>

  <rect x="521" y="382" width="68" height="88" fill="#64748b"/>
  <text x="555" y="374" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="bold">2,400</text>
  <text x="555" y="490" font-size="10.5" fill="#334155" text-anchor="middle">控制面 · 9%</text>

  <rect x="630" y="112" width="346" height="358" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="650" y="138" font-size="13" fill="#334155" font-weight="bold">三条杠杆：按回报从高到低</text>

  <rect x="646" y="150" width="314" height="96" rx="7" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="660" y="174" font-size="11.5" fill="#b45309" font-weight="bold">① 批池弹性化（回报最高）</text>
  <text x="660" y="196" font-size="9.5" fill="#334155">按需申请 + 竞价实例 + 夜间放开回填</text>
  <text x="660" y="216" font-size="9.5" fill="#334155">打 batch 池 60%，代价是回填排队</text>
  <text x="660" y="234" font-size="9.5" fill="#334155">需按 SLA 给回填分级</text>

  <rect x="646" y="258" width="314" height="96" rx="7" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
  <text x="660" y="282" font-size="11.5" fill="#047857" font-weight="bold">② 存储生命周期</text>
  <text x="660" y="304" font-size="9.5" fill="#334155">90 天转低频、1 年归档、快照 7 天过期</text>
  <text x="660" y="324" font-size="9.5" fill="#334155">打存储 25–40%，代价是冷查询变慢</text>
  <text x="660" y="342" font-size="9.5" fill="#334155">需要预热机制配合</text>

  <rect x="646" y="366" width="314" height="96" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="660" y="390" font-size="11.5" fill="#1e40af" font-weight="bold">③ 小文件合并</text>
  <text x="660" y="412" font-size="9.5" fill="#334155">每日低峰合并到 128–512 MB</text>
  <text x="660" y="432" font-size="9.5" fill="#334155">打存储 10–20% 与查询 CPU</text>
  <text x="660" y="450" font-size="9.5" fill="#334155">代价是占用批池窗口</text>

  <rect x="24" y="510" width="952" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="536" font-size="11.5" fill="#334155" font-weight="bold">合计 26,400 元/月：批池占 36% 却只跑 6–10 核；存储占 10%，却只涨不跌</text>
  <text x="44" y="560" font-size="11" fill="#475569">第 3 年数据量是第 1 年的 3 倍，而压缩比与膨胀系数基本不变 —— 计算可以弹性，存储不能</text>
</svg>
