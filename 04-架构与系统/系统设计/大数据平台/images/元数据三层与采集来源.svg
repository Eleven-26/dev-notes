<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">三层元数据各回答一类问题，而且全靠采集而不是填表</text>
  <text x="500" y="56" font-size="12" fill="#64748b" text-anchor="middle">技术元数据来自 DDL 与 commit，运行元数据来自作业与查询日志，人工只补业务含义与责任人</text>

  <rect x="24" y="84" width="320" height="204" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <rect x="24" y="84" width="320" height="36" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="184" y="108" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="bold">技术元数据</text>
  <text x="40" y="148" font-size="11" fill="#1e293b">回答：数据长什么样</text>
  <text x="40" y="176" font-size="11" fill="#1e293b">记：列名与类型、分区、文件数、快照 id</text>
  <text x="40" y="204" font-size="11" fill="#334155">来源：DDL、Catalog commit</text>
  <text x="40" y="236" font-size="11" fill="#b91c1c">缺了：建表失败、查询打不开表</text>
  <text x="40" y="268" font-size="10.5" fill="#64748b">权威副本，必须备份</text>

  <rect x="360" y="84" width="280" height="204" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <rect x="360" y="84" width="280" height="36" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="500" y="108" font-size="13" fill="#5b21b6" text-anchor="middle" font-weight="bold">业务元数据</text>
  <text x="376" y="148" font-size="11" fill="#1e293b">回答：数据是什么意思</text>
  <text x="376" y="176" font-size="11" fill="#1e293b">记：owner、主题域、敏感级别、口径版本</text>
  <text x="376" y="204" font-size="11" fill="#334155">来源：人工登记 + 指标字典</text>
  <text x="376" y="236" font-size="11" fill="#b91c1c">缺了：同名表说不清谁对</text>
  <text x="376" y="268" font-size="10.5" fill="#64748b">唯一必须人工的一层</text>

  <rect x="656" y="84" width="320" height="204" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <rect x="656" y="84" width="320" height="36" rx="8" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="816" y="108" font-size="13" fill="#047857" text-anchor="middle" font-weight="bold">运行元数据</text>
  <text x="672" y="148" font-size="11" fill="#1e293b">回答：数据被怎么用</text>
  <text x="672" y="176" font-size="11" fill="#1e293b">记：作业、耗时、读写行数、查询用户</text>
  <text x="672" y="204" font-size="11" fill="#334155">来源：调度、query_log、metrics</text>
  <text x="672" y="236" font-size="11" fill="#b91c1c">缺了：不知道谁在用、贵不贵</text>
  <text x="672" y="268" font-size="10.5" fill="#64748b">成本归因与审计的原料</text>

  <line x1="184" y1="306" x2="184" y2="290" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="306" x2="500" y2="290" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="816" y1="306" x2="816" y2="290" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="24" y="308" width="952" height="48" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="500" y="330" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="bold">统一采集与归一化：解析 → 按表关联 → 写入元数据库</text>
  <text x="500" y="348" font-size="10.5" fill="#475569" text-anchor="middle">表名与快照以 Catalog 为准，其余层都挂到同一个表标识上</text>

  <line x1="137" y1="384" x2="137" y2="358" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="377" y1="384" x2="377" y2="358" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="617" y1="384" x2="617" y2="358" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="860" y1="384" x2="860" y2="358" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="18" y="366" width="112" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="74" y="381" font-size="11" fill="#475569" text-anchor="middle" font-weight="bold">四个采集点</text>

  <rect x="24" y="388" width="226" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="137" y="416" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold">调度提交的 SQL</text>
  <text x="137" y="438" font-size="10.5" fill="#475569" text-anchor="middle">AST 解析出表级与列级</text>
  <text x="137" y="456" font-size="10.5" fill="#b91c1c" text-anchor="middle">SELECT * 解析不出列</text>

  <rect x="264" y="388" width="226" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="377" y="416" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold">Spark / Flink 运行时</text>
  <text x="377" y="438" font-size="10.5" fill="#475569" text-anchor="middle">Listener 与 plan 出表级</text>
  <text x="377" y="456" font-size="10.5" fill="#b91c1c" text-anchor="middle">拿不到列级</text>

  <rect x="504" y="388" width="226" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="617" y="416" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold">Catalog commit 事件</text>
  <text x="617" y="438" font-size="10.5" fill="#475569" text-anchor="middle">表级血缘的最低保证</text>
  <text x="617" y="456" font-size="10.5" fill="#047857" text-anchor="middle">最可靠，但不知道上游</text>

  <rect x="744" y="388" width="232" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="860" y="416" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold">查询网关 query_log</text>
  <text x="860" y="438" font-size="10.5" fill="#475569" text-anchor="middle">谁查了什么、读多少行</text>
  <text x="860" y="456" font-size="10.5" fill="#b91c1c" text-anchor="middle">被拒的查询也留痕</text>

  <rect x="24" y="492" width="952" height="52" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="44" y="514" font-size="10.5" fill="#334155">缺一层的后果各不相同：技术层缺了打不开表，业务层缺了说不清口径，运行层缺了算不清成本与影响。</text>
  <text x="44" y="533" font-size="10.5" fill="#b91c1c">判据：人工要填的字段超过两个，覆盖率一定掉下来 —— 只让 owner 填业务含义与敏感级别，其余自动采集。</text>
</svg>
