<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">Pod 状态决定先查哪里，而不是一上来就 kubectl logs</text>
  <text x="500" y="56" font-size="12" fill="#64748b" text-anchor="middle">五种状态分四类面向：调度、镜像、启动、资源；状态决定看 Events、看日志还是看 limits</text>

  <rect x="24" y="84" width="952" height="432" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="288" y="106" font-size="11" fill="#475569" text-anchor="middle" font-weight="bold">状态（kubectl get pod 的 STATUS）</text>
  <text x="524" y="106" font-size="11" fill="#475569" text-anchor="middle" font-weight="bold">首先看哪里</text>
  <text x="822" y="106" font-size="11" fill="#475569" text-anchor="middle" font-weight="bold">常见原因</text>

  <rect x="28" y="266" width="128" height="80" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
  <text x="92" y="300" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Pod 异常</text>
  <text x="92" y="322" font-size="11" fill="#cbd5e1" text-anchor="middle">先取状态再分流</text>

  <line x1="156" y1="306" x2="168" y2="306" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="172" y1="154" x2="172" y2="458" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="172" y1="154" x2="200" y2="154" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="172" y1="230" x2="200" y2="230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="172" y1="306" x2="200" y2="306" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="172" y1="382" x2="200" y2="382" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="172" y1="458" x2="200" y2="458" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="204" y="124" width="168" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="288" y="158" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="bold">Pending</text>
  <rect x="204" y="200" width="168" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="288" y="234" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="bold">ImagePullBackOff</text>
  <rect x="204" y="276" width="168" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="288" y="310" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="bold">CrashLoopBackOff</text>
  <rect x="204" y="352" width="168" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="288" y="386" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="bold">Running 但未就绪</text>
  <rect x="204" y="428" width="168" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="288" y="462" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="bold">Evicted / OOMKilled</text>

  <line x1="374" y1="154" x2="398" y2="154" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="374" y1="230" x2="398" y2="230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="374" y1="306" x2="398" y2="306" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="374" y1="382" x2="398" y2="382" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="374" y1="458" x2="398" y2="458" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="400" y="124" width="248" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="524" y="158" font-size="11.5" fill="#334155" text-anchor="middle">kubectl describe pod 的 Events</text>
  <rect x="400" y="200" width="248" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="524" y="234" font-size="11.5" fill="#334155" text-anchor="middle">镜像名与仓库凭据</text>
  <rect x="400" y="276" width="248" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="524" y="310" font-size="11.5" fill="#334155" text-anchor="middle">kubectl logs --previous</text>
  <rect x="400" y="352" width="248" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="524" y="386" font-size="11.5" fill="#334155" text-anchor="middle">readiness 探针的输出</text>
  <rect x="400" y="428" width="248" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="524" y="462" font-size="11.5" fill="#334155" text-anchor="middle">limits 与节点 Allocated resources</text>

  <line x1="650" y1="154" x2="674" y2="154" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="230" x2="674" y2="230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="306" x2="674" y2="306" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="382" x2="674" y2="382" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="458" x2="674" y2="458" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="676" y="124" width="292" height="60" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="688" y="158" font-size="11.5" fill="#92400e">资源不足、污点不匹配、PVC 未绑定</text>
  <rect x="676" y="200" width="292" height="60" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="688" y="234" font-size="11.5" fill="#92400e">私有仓库缺 imagePullSecret</text>
  <rect x="676" y="276" width="292" height="60" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="688" y="310" font-size="11.5" fill="#92400e">配置错误、依赖地址不可达</text>
  <rect x="676" y="352" width="292" height="60" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="688" y="386" font-size="11.5" fill="#92400e">初始化慢、依赖未就绪</text>
  <rect x="676" y="428" width="292" height="60" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="688" y="462" font-size="11.5" fill="#92400e">requests 定低、超卖、内存泄漏</text>

  <rect x="24" y="536" width="952" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="557" font-size="10.5" fill="#334155">判据：状态决定看哪里 —— Pending 的 Pod 根本没有日志，先 describe 看 Events；只有 CrashLoop 才需要 --previous 的旧日志。</text>
  <text x="44" y="576" font-size="10.5" fill="#b91c1c">同构现象（单容器实测）：只有一个 slot 时提交第二个 Flink 作业，它停在 RESTARTING 反复重试，日志里没有根因，要去看资源总量。</text>
</svg>
