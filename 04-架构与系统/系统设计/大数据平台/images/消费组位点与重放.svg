<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="32" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">消费组位点的三个数字：写到哪、读到哪、差多少</text>
  <text x="500" y="56" font-size="12" fill="#64748b" text-anchor="middle">实测 24 分区 dwd_orders 共 3000 条；重置位点只改变读的位置，数据一条不动</text>

  <text x="40" y="100" font-size="11.5" fill="#0f172a" font-weight="bold">重置前　committed=2400 · log-end=3000 · LAG=600</text>
  <rect x="120" y="120" width="800" height="34" rx="4" fill="#e2e8f0"/>
  <rect x="760" y="120" width="160" height="34" rx="4" fill="#fecaca"/>
  <text x="840" y="142" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="bold">LAG 600</text>
  <path d="M 760 108 L 760 166" fill="none" stroke="#1e40af" stroke-width="2"/>
  <path d="M 920 108 L 920 166" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="120" y="184" font-size="10" fill="#64748b" text-anchor="middle">0</text>
  <text x="752" y="184" font-size="10" fill="#1e40af" text-anchor="end">committed 2400</text>
  <text x="920" y="184" font-size="10" fill="#b91c1c" text-anchor="end">log-end 3000</text>

  <text x="500" y="222" font-size="11" fill="#475569" text-anchor="middle">reset-offsets --to-earliest --execute：位点回退，数据没动</text>
  <path d="M 500 232 L 500 252" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#d1)"/>

  <text x="40" y="282" font-size="11.5" fill="#0f172a" font-weight="bold">重置后　committed=0 · log-end=3000 · LAG=3000</text>
  <rect x="120" y="302" width="800" height="34" rx="4" fill="#fecaca"/>
  <text x="520" y="324" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="bold">LAG 3000（整段重放）</text>
  <path d="M 120 290 L 120 348" fill="none" stroke="#1e40af" stroke-width="2"/>
  <path d="M 920 290 L 920 348" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="120" y="366" font-size="10" fill="#1e40af" text-anchor="middle">0</text>
  <text x="920" y="366" font-size="10" fill="#b91c1c" text-anchor="middle">3000</text>
  <text x="500" y="392" font-size="11" fill="#0f172a" text-anchor="middle">两条轨道的 log-end 相同：数据没回来，只是读的位置回到了 0</text>

  <rect x="24" y="416" width="952" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="444" font-size="12" fill="#0f172a" font-weight="bold">重放成立的四个前提</text>
  <text x="44" y="474" font-size="10.5" fill="#334155">① 数据还在保留期内：位点能回退，但它指向的数据可能已被段级删除，lag 会变成「永远追不上的空洞」</text>
  <text x="44" y="502" font-size="10.5" fill="#334155">② 用新的只读消费组（如 replay_20261025），不要动线上组的 committed offset</text>
  <text x="44" y="530" font-size="10.5" fill="#334155">③ 下游必须幂等：湖表按主键覆盖写；追加型与自增计数型下游，重放一次就错一次</text>
  <text x="44" y="558" font-size="10.5" fill="#334155">④ 按时间点重置（--to-datetime）比数 offset 可靠：offset 会随段删除前移</text>
  <text x="44" y="584" font-size="10.5" fill="#b91c1c">LAG 衡量的是「还没读」，不是「丢了」；把它当丢包指标去扩容，方向就错了</text>

  <defs>
    <marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
