<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="610" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">重排的三道闸门：硬约束过滤 → 滑动窗口打散 → 广告按密度插位</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">输入 = 精排输出的前 12 条（类目 A~E 为示意）；逐位结果与规则参数取自本篇 4.4 节</text>
  <text x="500" y="80" text-anchor="middle" font-size="13" fill="#64748b">窗口 window=2 只记最近放入的两个类目；首屏取 8 个自然位；每 5 个自然位插 1 条广告</text>

  <text x="24" y="106" font-size="15" font-weight="bold" fill="#0f172a">① 精排输入的前 12 条：逐位判定</text>

  <rect x="24" y="120" width="74" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/>
