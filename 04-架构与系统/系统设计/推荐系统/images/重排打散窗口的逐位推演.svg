  <text x="930" y="190" text-anchor="middle" font-size="10.5" fill="#16a34a">第8位</text>

  <text x="24" y="216" font-size="15" font-weight="bold" fill="#0f172a">② 窗口只记最近放入的两个类目（每放入一次，左端滑出一个）</text>

  <rect x="30" y="232" width="76" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="68" y="252" text-anchor="middle" font-size="13" fill="#334155">[A]</text>
  <rect x="112" y="232" width="76" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="150" y="252" text-anchor="middle" font-size="13" fill="#334155">[A B]</text>
  <rect x="194" y="232" width="76" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="232" y="252" text-anchor="middle" font-size="13" fill="#334155">[B C]</text>
  <rect x="276" y="232" width="76" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="314" y="252" text-anchor="middle" font-size="13" fill="#334155">[C A]</text>
  <rect x="358" y="232" width="76" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="396" y="252" text-anchor="middle" font-size="13" fill="#334155">[A B]</text>
  <rect x="440" y="232" width="76" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="478" y="252" text-anchor="middle" font-size="13" fill="#334155">[B C]</text>
  <rect x="522" y="232" width="76" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="560" y="252" text-anchor="middle" font-size="13" fill="#334155">[C E]</text>
  <rect x="604" y="232" width="76" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="642" y="252" text-anchor="middle" font-size="13" fill="#334155">[E A]</text>

  <text x="68" y="282" text-anchor="middle" font-size="10.5" fill="#64748b">放候选01</text>
  <text x="150" y="282" text-anchor="middle" font-size="10.5" fill="#64748b">放候选03</text>
  <text x="232" y="282" text-anchor="middle" font-size="10.5" fill="#64748b">放候选04</text>
  <text x="314" y="282" text-anchor="middle" font-size="10.5" fill="#64748b">放候选05</text>
  <text x="396" y="282" text-anchor="middle" font-size="10.5" fill="#64748b">放候选06</text>
  <text x="478" y="282" text-anchor="middle" font-size="10.5" fill="#64748b">放候选09</text>
  <text x="560" y="282" text-anchor="middle" font-size="10.5" fill="#64748b">放候选11</text>
  <text x="642" y="282" text-anchor="middle" font-size="10.5" fill="#64748b">放候选12</text>

  <text x="740" y="246" font-size="12" fill="#475569">候选02 撞窗口 [A]</text>
  <text x="740" y="266" font-size="12" fill="#475569">候选12 等 A 滑出 [C E]</text>

  <text x="24" y="308" font-size="12.5" fill="#334155">读法：窗口挡下的是「同类目挤在一起」，不是「分数低」——候选02 分数高于候选03，仍被推到本轮之外。</text>

  <text x="24" y="336" font-size="15" font-weight="bold" fill="#0f172a">③ 重排输出：8 个自然位 + 1 条广告 = 首屏 9 条</text>

  <rect x="26" y="348" width="100" height="76" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="76" y="370" text-anchor="middle" font-size="11" fill="#334155">展示位01</text>
  <text x="76" y="394" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">A</text>
  <text x="76" y="416" text-anchor="middle" font-size="10.5" fill="#334155">自然 候选01</text>
  <rect x="132" y="348" width="100" height="76" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="182" y="370" text-anchor="middle" font-size="11" fill="#334155">展示位02</text>
  <text x="182" y="394" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">B</text>
  <text x="182" y="416" text-anchor="middle" font-size="10.5" fill="#334155">自然 候选03</text>
  <rect x="238" y="348" width="100" height="76" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="288" y="370" text-anchor="middle" font-size="11" fill="#334155">展示位03</text>
  <text x="288" y="394" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">C</text>
  <text x="288" y="416" text-anchor="middle" font-size="10.5" fill="#334155">自然 候选04</text>
  <rect x="344" y="348" width="100" height="76" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="394" y="370" text-anchor="middle" font-size="11" fill="#334155">展示位04</text>
  <text x="394" y="394" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">A</text>
  <text x="394" y="416" text-anchor="middle" font-size="10.5" fill="#334155">自然 候选05</text>
  <rect x="450" y="348" width="100" height="76" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="370" text-anchor="middle" font-size="11" fill="#334155">展示位05</text>
  <text x="500" y="394" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">B</text>
  <text x="500" y="416" text-anchor="middle" font-size="10.5" fill="#334155">自然 候选06</text>
  <rect x="556" y="348" width="100" height="76" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="606" y="370" text-anchor="middle" font-size="11" fill="#334155">展示位06</text>
  <text x="606" y="394" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">广告</text>
  <text x="606" y="416" text-anchor="middle" font-size="10.5" fill="#334155">每 5 位插 1 条</text>
  <rect x="662" y="348" width="100" height="76" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="712" y="370" text-anchor="middle" font-size="11" fill="#334155">展示位07</text>
  <text x="712" y="394" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">C</text>
  <text x="712" y="416" text-anchor="middle" font-size="10.5" fill="#334155">自然 候选09</text>
  <rect x="768" y="348" width="100" height="76" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="818" y="370" text-anchor="middle" font-size="11" fill="#334155">展示位08</text>
  <text x="818" y="394" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">E</text>
  <text x="818" y="416" text-anchor="middle" font-size="10.5" fill="#334155">自然 候选11</text>
  <rect x="874" y="348" width="100" height="76" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="924" y="370" text-anchor="middle" font-size="11" fill="#334155">展示位09</text>
  <text x="924" y="394" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">A</text>
  <text x="924" y="416" text-anchor="middle" font-size="10.5" fill="#334155">自然 候选12</text>

  <text x="24" y="444" font-size="12.5" fill="#334155">注意：广告插在自然位取满之后，不进打散窗口，所以第 06 位两侧的自然类目仍按窗口规则判定。</text>

  <rect x="26" y="458" width="948" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="484" font-size="12.5" fill="#334155">要点：闸门顺序是 硬约束过滤 → 窗口打散 → 取满首屏 → 插广告，与本篇「使用」第三段 rerank 的代码顺序一致，不能换。</text>
  <text x="44" y="510" font-size="12.5" fill="#334155">对照：12 条输入放入 8 条、跳过 4 条（02、08、10 被窗口挡，07 被硬约束挡）；类目 A 从输入的 5 条压到 3 条，落在展示位 1、4、9。</text>
  <text x="44" y="536" font-size="12.5" fill="#334155">窗口越大挡得越多：把 window 从 2 调到 3，候选05 与候选06 也一起被挡，同样 12 条输入只凑出 5 个自然位，首屏 8 条取不满。</text>
  <text x="44" y="566" font-size="11.5" fill="#94a3b8">出处：输入编排、规则参数与逐位结果均取自本篇 4.4 节的表格与容器实测输出；类目 A~E 是示意标签，不是真实业务类目。</text>
</svg>
