  <text x="298" y="162" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">C</text>
  <rect x="340" y="120" width="74" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="377" y="140" text-anchor="middle" font-size="11" fill="#334155">候选05</text>
  <text x="377" y="162" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">A</text>
  <rect x="419" y="120" width="74" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="456" y="140" text-anchor="middle" font-size="11" fill="#334155">候选06</text>
  <text x="456" y="162" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">B</text>
  <rect x="498" y="120" width="74" height="52" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="535" y="140" text-anchor="middle" font-size="11" fill="#334155">候选07</text>
  <text x="535" y="162" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">D</text>
  <rect x="577" y="120" width="74" height="52" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="614" y="140" text-anchor="middle" font-size="11" fill="#334155">候选08</text>
  <text x="614" y="162" text-anchor="middle" font-size="17" font-weight="bold" fill="#9a3412">A</text>
  <rect x="656" y="120" width="74" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="693" y="140" text-anchor="middle" font-size="11" fill="#334155">候选09</text>
  <text x="693" y="162" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">C</text>
  <rect x="735" y="120" width="74" height="52" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="772" y="140" text-anchor="middle" font-size="11" fill="#334155">候选10</text>
  <text x="772" y="162" text-anchor="middle" font-size="17" font-weight="bold" fill="#9a3412">B</text>
  <rect x="814" y="120" width="74" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="851" y="140" text-anchor="middle" font-size="11" fill="#334155">候选11</text>
  <text x="851" y="162" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">E</text>
  <rect x="893" y="120" width="74" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="930" y="140" text-anchor="middle" font-size="11" fill="#334155">候选12</text>
  <text x="930" y="162" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">A</text>

  <text x="61" y="190" text-anchor="middle" font-size="10.5" fill="#16a34a">第1位</text>
  <text x="140" y="190" text-anchor="middle" font-size="10.5" fill="#ea580c">窗口挡</text>
