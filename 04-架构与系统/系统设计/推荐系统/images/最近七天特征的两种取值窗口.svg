<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="500" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">同一个「最近 7 天点击次数」，训练与线上各取哪个窗口</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">样本日 T=06-08：训练按 T-1 的离线快照取值，线上按近线实时滚动窗口取值，两个窗口整体错开一天</text>

  <rect x="40" y="84" width="104" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="92" y="104" text-anchor="middle" font-size="11.5" fill="#334155">06-01</text>
  <text x="92" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">5</text>
  <rect x="152" y="84" width="104" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="204" y="104" text-anchor="middle" font-size="11.5" fill="#334155">06-02</text>
  <text x="204" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">3</text>
  <rect x="264" y="84" width="104" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="316" y="104" text-anchor="middle" font-size="11.5" fill="#334155">06-03</text>
  <text x="316" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">0</text>
  <rect x="376" y="84" width="104" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="428" y="104" text-anchor="middle" font-size="11.5" fill="#334155">06-04</text>
  <text x="428" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">8</text>
  <rect x="488" y="84" width="104" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="540" y="104" text-anchor="middle" font-size="11.5" fill="#334155">06-05</text>
  <text x="540" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">2</text>
  <rect x="600" y="84" width="104" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="652" y="104" text-anchor="middle" font-size="11.5" fill="#334155">06-06</text>
  <text x="652" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">6</text>
  <rect x="712" y="84" width="104" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="764" y="104" text-anchor="middle" font-size="11.5" fill="#334155">06-07（T-1）</text>
  <text x="764" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">1</text>
  <rect x="824" y="84" width="104" height="54" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="876" y="104" text-anchor="middle" font-size="11.5" fill="#78350f">06-08（T）</text>
  <text x="876" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#78350f">9</text>

  <rect x="40" y="152" width="776" height="36" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="428" y="176" text-anchor="middle" font-size="13" fill="#1e3a8a">训练取值窗口 06-01 ~ 06-07（T-1 日终快照）：合计 25</text>
  <rect x="152" y="196" width="776" height="36" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="540" y="220" text-anchor="middle" font-size="13" fill="#9a3412">线上取值窗口 06-02 ~ 06-08（实时滚动）：合计 29</text>

  <text x="40" y="256" font-size="13" fill="#334155">两个窗口重叠 6 天（合计 20）：训练独有 06-01 的 5，线上独有 06-08 的 9，所以差值 = 9 - 5 = +4，相对偏差 16.0%</text>
  <text x="40" y="280" font-size="13" fill="#334155">同一个用户在训练里被读成 25、在线上被读成 29——模型学的权重和喂进去的值不是同一个分布，这就是训练-服务偏差</text>

  <rect x="40" y="294" width="888" height="164" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="320" font-size="13" font-weight="bold" fill="#0f172a">对照一：线上也按 T-1 快照取值（统一取值时间点）→ 线上 25、训练 25、差值 +0</text>
  <text x="58" y="346" font-size="13" fill="#334155">对照二：当天 06-08 一次点击都没有 → 线上 20、训练 25、差值 -5：滑出的 06-01 没有等量补回，偏差方向不由当天决定</text>
  <text x="58" y="372" font-size="13" fill="#334155">对照三：窗口换成 1 天的短窗 → 线上 9、训练 1、差 +8：窗口越短，同一天错位带来的偏差越明显</text>
  <text x="58" y="404" font-size="12" fill="#475569">做法（本篇 2.3 节）：训练与线上共用同一份生成逻辑；样本带上样本时间，特征按该时间点取值；</text>
  <text x="58" y="426" font-size="12" fill="#475569">训练用特征存储的历史快照回填，而不是另拿一套离线表；上线前比对线上取到的值与离线预期值，差异报警。</text>

  <text x="40" y="480" font-size="11.5" fill="#94a3b8">出处：每日点击数是示意样本（不是线上数据）；两窗口合计与三个对照的读数取自本篇 2.5 节的容器实测输出。</text>
</svg>
