<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="30" y="42" font-size="19" fill="#0f172a">多路召回与合并：四路各捞一批，去重归一化后加权融合</text>

  <!-- 左：四路召回 -->
  <rect x="40" y="96" width="200" height="56" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="58" y="120" font-size="14" fill="#334155">热门 / 趋势</text>
  <text x="58" y="140" font-size="11" fill="#64748b">全局统计，兜底</text>

  <rect x="40" y="176" width="200" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="200" font-size="14" fill="#1e3a8a">协同过滤</text>
  <text x="58" y="220" font-size="11" fill="#2563eb">和你像的人也喜欢</text>

  <rect x="40" y="256" width="200" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="58" y="280" font-size="14" fill="#14532d">内容标签</text>
  <text x="58" y="300" font-size="11" fill="#16a34a">类目 / 标签匹配</text>

  <rect x="40" y="336" width="200" height="56" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="58" y="360" font-size="14" fill="#7c2d12">向量近邻</text>
  <text x="58" y="380" font-size="11" fill="#ea580c">语义相似 / ANN</text>

  <!-- 汇入箭头 -->
  <path d="M 240 124 L 393 124" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 240 204 L 393 204" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 240 284 L 393 284" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 240 364 L 393 364" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 中：合并 -->
  <rect x="400" y="96" width="230" height="296" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="515" y="128" font-size="16" fill="#0f172a" text-anchor="middle">合并</text>
  <text x="420" y="166" font-size="13" fill="#334155">① 去重（按物品 ID）</text>
  <text x="420" y="200" font-size="13" fill="#334155">② 分数归一化</text>
  <text x="420" y="234" font-size="13" fill="#334155">③ 加权融合 / 配额</text>
  <text x="420" y="272" font-size="11" fill="#64748b">各路口径不同，位次分</text>
  <text x="420" y="292" font-size="11" fill="#64748b">比原始分更可比</text>
  <text x="420" y="332" font-size="11" fill="#64748b">配额：每路保底出 N 条</text>
  <text x="420" y="352" font-size="11" fill="#64748b">防止某路被完全压制</text>

  <!-- 输出箭头 -->
  <path d="M 630 244 L 683 244" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 右：候选集 -->
  <rect x="690" y="180" width="270" height="128" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="825" y="212" font-size="15" fill="#1e3a8a" text-anchor="middle">召回候选集</text>
  <text x="710" y="244" font-size="13" fill="#1e3a8a">数千条，按合并分排序</text>
  <text x="710" y="272" font-size="12" fill="#2563eb">只保证「不漏」，不求排准</text>

  <!-- 注记 -->
  <text x="30" y="440" font-size="13" fill="#64748b">要点：单路必有盲区——热门只覆盖大众、协同对新用户无解、内容抓不住跨域、向量受索引质量影响；多路同时失效概率低。</text>
  <text x="30" y="464" font-size="13" fill="#64748b">读法：四路彼此独立可并行，总耗时取最慢的一路（详见正文第一节）。</text>
  <text x="30" y="488" font-size="12" fill="#94a3b8">注：四路权重按效果调；为避免某一路长期压制其他路，也可改用「按路保底配额」。</text>
</svg>
