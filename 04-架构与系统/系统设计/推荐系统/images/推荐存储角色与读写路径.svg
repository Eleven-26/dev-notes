<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="sans-serif">
  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">推荐的存储全景：行为与互动是权威源，特征与样本都是它的派生</text>
  <text x="30" y="62" font-size="13" fill="#64748b">写路径先落行为、再异步派生特征与模型；读路径按在线特征到离线快照逐级查</text>

  <g transform="translate(20,80)">
    <rect x="0" y="0" width="460" height="460" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">① 数据角色与载体</text>

    <rect x="18" y="44" width="424" height="120" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="34" y="66" font-size="11.5" font-weight="bold" fill="#7f1d1d">权威源 · MySQL</text>
    <text x="34" y="90" font-size="10" fill="#334155">用户 / 物品 / 互动：唯一真相，特征与样本都从它派生</text>
    <text x="34" y="110" font-size="10" fill="#334155">行为与互动一旦丢了，再也重算不出特征与样本</text>
    <text x="34" y="130" font-size="10" fill="#334155">派生链最长：行为 → 特征 → 样本 → 模型 → 向量</text>
    <text x="34" y="154" font-size="10.5" font-weight="bold" fill="#991b1b">不能丢：丢了不可重建</text>

    <rect x="18" y="176" width="424" height="114" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="34" y="198" font-size="11.5" font-weight="bold" fill="#14532d">副本 · 特征存储（Redis / 在线特征库）</text>
    <text x="34" y="222" font-size="10" fill="#334155">在线特征：请求时毫秒级读，可从行为流重算</text>
    <text x="34" y="242" font-size="10" fill="#334155">召回向量：供近邻检索，模型重训即可整体重建</text>
    <text x="34" y="262" font-size="10" fill="#334155">模型文件：由离线样本训练产出，可重训重建</text>
    <text x="34" y="282" font-size="10.5" font-weight="bold" fill="#14532d">能丢：丢了只是这一轮变差</text>

    <rect x="18" y="302" width="424" height="96" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="34" y="324" font-size="11.5" font-weight="bold" fill="#1e3a8a">分析副本与归档 · 列存 + 对象存储</text>
    <text x="34" y="348" font-size="10" fill="#334155">离线样本 / 特征快照：训练用大宽表，按天重刷</text>
    <text x="34" y="368" font-size="10" fill="#334155">历史行为日志：体量最大，是重刷样本的最后退路</text>
    <text x="34" y="388" font-size="10.5" font-weight="bold" fill="#1e3a8a">最低频的读交给最便宜的介质</text>

    <text x="18" y="420" font-size="11" fill="#475569">先分角色，再选存储：判据只有一句 ——</text>
    <text x="18" y="436" font-size="11" fill="#475569">丢了能不能从别处重建。</text>
  </g>

  <g transform="translate(500,80)">
    <rect x="0" y="0" width="480" height="460" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">② 写路径与读路径的落点</text>

    <text x="18" y="50" font-size="12" font-weight="bold" fill="#0f172a">写：用户产生一次行为</text>

    <rect x="18" y="58" width="444" height="36" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="34" y="81" font-size="10.5" fill="#312e81">① 行为 / 互动落 MySQL（权威源，唯一真相）</text>

    <line x1="240" y1="94" x2="240" y2="102" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrS)"/>

    <rect x="18" y="102" width="444" height="36" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="34" y="125" font-size="10.5" fill="#14532d">② 行为日志流入近线：秒级到分钟级算中间特征</text>

    <line x1="240" y1="138" x2="240" y2="146" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrS)"/>

    <rect x="18" y="146" width="444" height="36" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="34" y="169" font-size="10.5" fill="#14532d">③ 中间特征写特征存储，供在线请求毫秒级读</text>

    <line x1="240" y1="182" x2="240" y2="190" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrS)"/>

    <rect x="18" y="190" width="444" height="36" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="34" y="213" font-size="10.5" fill="#312e81">④ 按天离线跑批：样本 → 训练 → 模型 + 特征快照</text>

    <text x="18" y="248" font-size="12" font-weight="bold" fill="#0f172a">读：一次下拉刷新</text>

    <rect x="18" y="256" width="444" height="36" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="34" y="279" font-size="10.5" fill="#14532d">① 读在线特征（特征存储，毫秒级）</text>

    <line x1="240" y1="292" x2="240" y2="300" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrS)"/>

    <rect x="18" y="300" width="444" height="36" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="34" y="323" font-size="10.5" fill="#312e81">② 多路召回 → 向量索引 / ES 近邻检索</text>

    <line x1="240" y1="336" x2="240" y2="344" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrS)"/>

    <rect x="18" y="344" width="444" height="36" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="34" y="367" font-size="10.5" fill="#312e81">③ 精排读离线快照 + 实时信号打分</text>

    <line x1="240" y1="380" x2="240" y2="388" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrS)"/>

    <rect x="18" y="388" width="444" height="36" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="34" y="411" font-size="10.5" fill="#1e3a8a">④ 缺特征 / 超时 → 退兜底（热门 / 统计）</text>

    <text x="18" y="442" font-size="11" fill="#475569">写入必须先在权威源成功；线上只读已算好的特征，不在请求路径里重算大特征。</text>
  </g>
</svg>
