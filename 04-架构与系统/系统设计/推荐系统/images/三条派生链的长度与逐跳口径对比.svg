<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="570" fill="#ffffff"/>

  <defs>
    <marker id="arrW4c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">派生链长度对比：推荐 4 次派生，Feed 与秒杀各 1 次</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">节点与载体取自本篇第一节角色表；三系统对照取自第四节表；每跳的错位形态取自 4.1 节逐跳口径表</text>

  <text x="24" y="88" font-size="15" font-weight="bold" fill="#0f172a">推荐系统：5 个节点、4 次派生（一跳 = 一次派生）</text>

  <rect x="20" y="100" width="160" height="74" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="100" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">行为 / 互动</text>
  <text x="100" y="150" text-anchor="middle" font-size="11" fill="#7f1d1d">MySQL 权威源</text>
  <line x1="184" y1="137" x2="214" y2="137" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrW4c)"/>
  <rect x="220" y="100" width="160" height="74" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="300" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">在线特征</text>
  <text x="300" y="150" text-anchor="middle" font-size="11" fill="#14532d">特征存储 Redis</text>
  <line x1="384" y1="137" x2="414" y2="137" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrW4c)"/>
  <rect x="420" y="100" width="160" height="74" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="500" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">离线样本</text>
  <text x="500" y="150" text-anchor="middle" font-size="11" fill="#1e3a8a">列存 Parquet</text>
  <line x1="584" y1="137" x2="614" y2="137" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrW4c)"/>
  <rect x="620" y="100" width="160" height="74" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="700" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">模型文件</text>
  <text x="700" y="150" text-anchor="middle" font-size="11" fill="#14532d">对象存储 版本仓</text>
  <line x1="784" y1="137" x2="814" y2="137" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrW4c)"/>
  <rect x="820" y="100" width="160" height="74" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="900" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">召回向量</text>
  <text x="900" y="150" text-anchor="middle" font-size="11" fill="#14532d">向量索引 ES</text>

  <text x="200" y="192" text-anchor="middle" font-size="11" fill="#b45309">跳1 窗口口径</text>
  <text x="400" y="192" text-anchor="middle" font-size="11" fill="#b45309">跳2 回填时点</text>
  <text x="600" y="192" text-anchor="middle" font-size="11" fill="#b45309">跳3 版本配对</text>
  <text x="800" y="192" text-anchor="middle" font-size="11" fill="#b45309">跳4 索引重建</text>

  <text x="24" y="222" font-size="15" font-weight="bold" fill="#0f172a">Feed 流：2 个节点、1 次派生</text>
  <rect x="20" y="234" width="160" height="74" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="100" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">内容本体</text>
  <text x="100" y="284" text-anchor="middle" font-size="11" fill="#7f1d1d">MySQL 权威源</text>
  <line x1="184" y1="271" x2="214" y2="271" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrW4c)"/>
  <rect x="220" y="234" width="160" height="74" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="300" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">时间线</text>
  <text x="300" y="284" text-anchor="middle" font-size="11" fill="#14532d">ZSet 读加速副本</text>
  <text x="440" y="258" font-size="12.5" fill="#334155">必须做的事：翻页时回源；最怕翻页错序。</text>
  <text x="440" y="282" font-size="12.5" fill="#334155">降级方向：宁可空一屏，不可错序。</text>

  <text x="24" y="342" font-size="15" font-weight="bold" fill="#0f172a">秒杀系统：2 个节点、1 次派生</text>
  <rect x="20" y="354" width="160" height="74" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="100" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">库存</text>
  <text x="100" y="404" text-anchor="middle" font-size="11" fill="#7f1d1d">MySQL 权威源</text>
  <line x1="184" y1="391" x2="214" y2="391" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrW4c)"/>
  <rect x="220" y="354" width="160" height="74" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="300" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">预扣</text>
  <text x="300" y="404" text-anchor="middle" font-size="11" fill="#14532d">Redis 写入口</text>
  <text x="440" y="378" font-size="12.5" fill="#334155">必须做的事：对账；预扣可丢，但账要对上。</text>
  <text x="440" y="402" font-size="12.5" fill="#334155">降级方向：宁可不卖，不可超卖。</text>

  <text x="24" y="436" font-size="11.5" fill="#94a3b8">红 = 权威源，丢了不可重建｜绿 = 副本，可重算或重训重建｜蓝 = 分析副本，按天重刷</text>

  <rect x="20" y="446" width="960" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="38" y="472" font-size="12.5" fill="#334155">要点：推荐每多一跳，就多一处「上下游各算各的、而且不报错」的口径；Feed 与秒杀只在同步延迟这一处出错。</text>
  <text x="38" y="496" font-size="12.5" fill="#334155">最怕：推荐 = 口径对不上（特征穿越、线上线下一致性）；Feed = 错序；秒杀 = 超卖。</text>
  <text x="38" y="520" font-size="12.5" fill="#334155">结论：别处的派生链只有一环，推荐是一整条流水线——副本丢了重刷即可，口径错了模型就是错的。</text>
  <text x="38" y="546" font-size="11.5" fill="#94a3b8">出处：节点与载体见本篇第一节角色表；三系统对照见第四节表；逐跳错位形态见 4.1 节表。</text>
</svg>
