<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="30" y="42" font-size="19" fill="#0f172a">推荐系统的四层流水线：候选逐层变少，延迟逐层变紧</text>
  <text x="30" y="68" font-size="12" fill="#64748b">一次请求 = 召回 → 粗排 → 精排 → 重排，整条链路要在几十毫秒量级跑完。</text>

  <!-- 第 1 层：召回 -->
  <text x="30" y="144" font-size="16" fill="#0f172a">召回</text>
  <text x="30" y="164" font-size="11" fill="#64748b">并行多路</text>
  <rect x="160" y="110" width="520" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="143" font-size="14" fill="#1e3a8a">多路并行召回：热门 / 协同 / 内容 / 向量</text>
  <text x="180" y="165" font-size="12" fill="#1e3a8a">目标：召回率（别漏）</text>
  <text x="720" y="142" font-size="13" fill="#0f172a">输入 百万~亿 → 输出 数千</text>
  <text x="720" y="164" font-size="12" fill="#64748b">延迟预算：几毫秒（取最慢一路）</text>

  <!-- 第 2 层：粗排 -->
  <text x="30" y="234" font-size="16" fill="#0f172a">粗排</text>
  <text x="30" y="254" font-size="11" fill="#64748b">轻量预筛</text>
  <rect x="160" y="200" width="360" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="180" y="233" font-size="14" fill="#14532d">轻量模型 / 规则：几千 → 几百</text>
  <text x="180" y="255" font-size="12" fill="#14532d">目标：省算力（别太贵）</text>
  <text x="720" y="232" font-size="13" fill="#0f172a">输入 数千 → 输出 数百</text>
  <text x="720" y="254" font-size="12" fill="#64748b">延迟预算：几毫秒</text>

  <!-- 第 3 层：精排 -->
  <text x="30" y="324" font-size="16" fill="#0f172a">精排</text>
  <text x="30" y="344" font-size="11" fill="#64748b">模型打分</text>
  <rect x="160" y="290" width="240" height="76" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="180" y="323" font-size="14" fill="#7c2d12">模型打分：几百 → 有序几百</text>
  <text x="180" y="345" font-size="12" fill="#7c2d12">目标：精度（排得准）</text>
  <text x="720" y="322" font-size="13" fill="#0f172a">输入 数百 → 输出 数百（有序）</text>
  <text x="720" y="344" font-size="12" fill="#64748b">延迟预算：十几毫秒（最贵）</text>

  <!-- 第 4 层：重排 -->
  <text x="30" y="414" font-size="16" fill="#0f172a">重排</text>
  <text x="30" y="434" font-size="11" fill="#64748b">规则后处理</text>
  <rect x="160" y="380" width="140" height="76" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="230" y="423" font-size="13" fill="#334155" text-anchor="middle">重排</text>
  <text x="320" y="417" font-size="13" fill="#334155">多样性 / 打散 / 业务规则 → 数十条</text>
  <text x="320" y="439" font-size="12" fill="#64748b">目标：体验与业务规则</text>
  <text x="720" y="412" font-size="13" fill="#0f172a">输入 数百 → 输出 数十</text>
  <text x="720" y="434" font-size="12" fill="#64748b">延迟预算：一两毫秒</text>

  <!-- 注记 -->
  <text x="30" y="500" font-size="13" fill="#64748b">要点：四层是一条漏斗——候选逐层变少、打分逐层变准、延迟逐层变紧。</text>
  <text x="30" y="524" font-size="12" fill="#94a3b8">注：候选量级与延迟预算均为常见工程设计量级，非实测读数；召回多路可并行（总耗时看最慢一路）。</text>
</svg>
