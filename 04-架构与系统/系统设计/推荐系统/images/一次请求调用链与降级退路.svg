<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="sans-serif">
  <defs>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrQ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">一次推荐请求的调用时序：deadline 逐层收紧，每层留一条退路</text>

  <g transform="translate(20,58)">
    <rect x="0" y="0" width="960" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 调用链：入口把剩余预算切成 deadline 往下发</text>
    <text x="600" y="26" font-size="10.5" fill="#94a3b8" text-anchor="middle">数字是正文示例，非实测</text>

    <rect x="30" y="44" width="180" height="34" rx="6" fill="#e2e8f0" stroke="#64748b"/>
    <text x="120" y="66" font-size="11.5" fill="#334155" text-anchor="middle">入口：总预算 50ms</text>
    <rect x="240" y="44" width="180" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="330" y="66" font-size="11.5" fill="#1e3a8a" text-anchor="middle">召回：多路并行</text>
    <rect x="460" y="44" width="140" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="530" y="66" font-size="11.5" fill="#14532d" text-anchor="middle">粗排</text>
    <rect x="610" y="44" width="140" height="34" rx="6" fill="#ffedd5" stroke="#ea580c"/>
    <text x="680" y="66" font-size="11.5" fill="#7c2d12" text-anchor="middle">精排</text>
    <rect x="760" y="44" width="140" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="830" y="66" font-size="11.5" fill="#334155" text-anchor="middle">重排</text>

    <line x1="120" y1="78" x2="120" y2="260" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="330" y1="78" x2="330" y2="260" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="530" y1="78" x2="530" y2="260" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="680" y1="78" x2="680" y2="260" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="830" y1="78" x2="830" y2="260" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

    <line x1="120" y1="100" x2="326" y2="100" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrP)"/>
    <text x="223" y="94" font-size="10" fill="#1e3a8a" text-anchor="middle">① deadline 10ms</text>

    <path d="M 330 114 L 372 114 L 372 130 L 334 130" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrL)"/>
    <text x="386" y="126" font-size="10" fill="#64748b">② 各路同时发起，总耗时取最慢一路</text>

    <line x1="330" y1="152" x2="526" y2="152" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrP)"/>
    <text x="428" y="146" font-size="10" fill="#1e3a8a" text-anchor="middle">③ 候选数千，去重归一化后给粗排</text>

    <line x1="530" y1="182" x2="676" y2="182" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrP)"/>
    <text x="603" y="176" font-size="10" fill="#1e3a8a" text-anchor="middle">④ 截到几百，deadline 25ms</text>

    <line x1="680" y1="212" x2="826" y2="212" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrP)"/>
    <text x="753" y="206" font-size="10" fill="#1e3a8a" text-anchor="middle">⑤ 有序几百，deadline 3ms</text>

    <line x1="830" y1="242" x2="124" y2="242" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrP)"/>
    <text x="470" y="236" font-size="10" fill="#1e3a8a" text-anchor="middle">⑥ 数十条返回；剩余约 12ms 留给序列化与网络</text>

    <text x="18" y="266" font-size="10.5" fill="#334155">原则：上游给下游的 deadline 必须小于上游自己的剩余预算，否则下游还没超时、上游先超时。</text>
    <text x="18" y="288" font-size="10.5" fill="#64748b">精排只输出有序 ID 与分数；标题、封面、价格由后续取详情补齐——先排序、后填充，两侧可各自缓存与降级。</text>
  </g>

  <g transform="translate(20,374)">
    <rect x="0" y="0" width="960" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 降级退路：哪一层挂了，就从它的上一层结果继续</text>

    <rect x="18" y="44" width="240" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="138" y="66" font-size="11" fill="#991b1b" text-anchor="middle">某一路召回超时</text>
    <line x1="258" y1="61" x2="292" y2="61" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrQ)"/>
    <rect x="296" y="44" width="644" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="310" y="66" font-size="10.5" fill="#14532d">丢掉这一路，用其余路的结果继续——这正是多路并行的意义之一</text>

    <rect x="18" y="88" width="240" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="138" y="110" font-size="11" fill="#991b1b" text-anchor="middle">精排超时</text>
    <line x1="258" y1="105" x2="292" y2="105" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrQ)"/>
    <rect x="296" y="88" width="644" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="310" y="110" font-size="10.5" fill="#14532d">用粗排分数当最终序，或退回召回合成分（召回分本来只用于合并与截断）</text>

    <rect x="18" y="132" width="240" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="138" y="154" font-size="11" fill="#991b1b" text-anchor="middle">重排挂了</text>
    <line x1="258" y1="149" x2="292" y2="149" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrQ)"/>
    <rect x="296" y="132" width="644" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="310" y="154" font-size="10.5" fill="#14532d">直接用精排结果：牺牲多样性与打散，保证页面能出得来</text>

    <rect x="18" y="176" width="240" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="138" y="198" font-size="11" fill="#991b1b" text-anchor="middle">整条链路挂了</text>
    <line x1="258" y1="193" x2="292" y2="193" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrQ)"/>
    <rect x="296" y="176" width="644" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="310" y="198" font-size="10.5" fill="#14532d">退到不依赖模型的兜底：热门 / 缓存 / 运营位（三级兜底见特征与冷启动篇）</text>

    <text x="18" y="228" font-size="10.5" fill="#334155">两条纪律：降级要能在预算内快速判定（超时判定本身不能慢）；降级结果要可观测，降级率是核心监控指标。</text>
  </g>
</svg>
