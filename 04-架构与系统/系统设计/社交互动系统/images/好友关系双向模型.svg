<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="sans-serif">
  <defs>
    <marker id="arrFd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrFdg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrFdgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">好友关系双向模型：一条无向边落成两行；状态机覆盖申请到拉黑</text>
  <text x="30" y="63" font-size="13" fill="#64748b">双向好友是「两个人的关系」：存储要成对写、状态有生命周期——这是它与单向关注的根本区别</text>

  <g transform="translate(20,84)">
    <rect x="0" y="0" width="960" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-size="15" font-weight="bold" fill="#0f172a">存储：无向的好友边，落成 friend_edge 表里两行</text>

    <rect x="60" y="80" width="170" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="145" y="112" font-size="14" fill="#1e3a8a" text-anchor="middle">用户 A</text>
    <text x="145" y="134" font-size="10.5" fill="#2563eb" text-anchor="middle">uid = 1</text>

    <rect x="730" y="80" width="170" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="815" y="112" font-size="14" fill="#1e3a8a" text-anchor="middle">用户 B</text>
    <text x="815" y="134" font-size="10.5" fill="#2563eb" text-anchor="middle">uid = 2</text>

    <line x1="230" y1="100" x2="726" y2="100" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrFd)"/>
    <text x="479" y="92" font-size="10.5" fill="#1e3a8a" text-anchor="middle">① friend_edge(1,2)：A 的好友里有 B</text>

    <line x1="730" y1="136" x2="232" y2="136" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrFdg)"/>
    <text x="479" y="158" font-size="10.5" fill="#14532d" text-anchor="middle">② friend_edge(2,1)：B 的好友里有 A</text>

    <text x="479" y="122" font-size="10.5" fill="#475569" text-anchor="middle">同一事务写两行，互为镜像</text>

    <text x="18" y="205" font-size="11" fill="#475569">两行必须同事务写 / 同事务删；任一行缺失 = 单向好友（脏数据）。</text>
  </g>

  <g transform="translate(20,334)">
    <rect x="0" y="0" width="960" height="226" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="24" font-size="15" font-weight="bold" fill="#0f172a">状态机：申请 / 通过 / 拒绝 / 删除 / 拉黑</text>

    <rect x="30" y="70" width="140" height="56" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.3"/>
    <text x="100" y="102" font-size="12" fill="#334155" text-anchor="middle">无关系</text>

    <rect x="250" y="70" width="140" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="320" y="102" font-size="12" fill="#1e3a8a" text-anchor="middle">待验证</text>

    <rect x="470" y="70" width="140" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="540" y="102" font-size="12" fill="#14532d" text-anchor="middle">已同意</text>

    <rect x="740" y="70" width="180" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="830" y="102" font-size="12" fill="#991b1b" text-anchor="middle">拉黑</text>

    <line x1="170" y1="98" x2="248" y2="98" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrFd)"/>
    <text x="209" y="90" font-size="10" fill="#1e3a8a" text-anchor="middle">发起申请</text>

    <line x1="390" y1="98" x2="468" y2="98" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrFd)"/>
    <text x="429" y="90" font-size="10" fill="#1e3a8a" text-anchor="middle">对方同意</text>

    <line x1="610" y1="98" x2="738" y2="98" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrFdgr)"/>
    <text x="674" y="90" font-size="10" fill="#991b1b" text-anchor="middle">任一方拉黑</text>

    <path d="M320,126 L320,160 L100,160 L100,128" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrFdgr)"/>
    <text x="210" y="152" font-size="10" fill="#64748b" text-anchor="middle">拒绝 / 撤回</text>

    <path d="M540,126 L540,182 L140,182 L140,128" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrFdgr)"/>
    <text x="340" y="176" font-size="10" fill="#64748b" text-anchor="middle">删除</text>

    <path d="M830,70 L830,44 L100,44 L100,68" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrFdgr)"/>
    <text x="465" y="38" font-size="10" fill="#64748b" text-anchor="middle">解除拉黑</text>

    <text x="18" y="214" font-size="11" fill="#475569">拒绝只撤回本次申请；拉黑是长期屏蔽，解除后回到「无关系」——三者不能混成一个状态。</text>
  </g>
</svg>
