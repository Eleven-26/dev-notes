<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="40" y="44" font-size="19" fill="#0f172a">热 key 计数拆分：收益只来自跨实例，不来自拆 key 本身</text>
  <text x="40" y="72" font-size="13" fill="#64748b">10 万次 INCR，管道批量 50，预热后连跑 5 次取区间；redis-benchmark（各 20 万次、50 连接、管道 16）交叉核对。</text>

  <!-- A. 三种分法 -->
  <rect x="40" y="96" width="500" height="248" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="122" font-size="15" fill="#0f172a">A. 三种分法，先看实测</text>

  <text x="60" y="150" font-size="12" fill="#334155">单实例 · 单 key：173ms ~ 496ms（≈201713 ~ 577079 次/秒）</text>
  <text x="60" y="174" font-size="12" fill="#92400e">单实例 · 分 8 个子 key：174ms ~ 285ms —— 最快值与单 key 相同</text>
  <text x="60" y="196" font-size="11" fill="#92400e">原因：Redis 单线程，所有命令串行执行；单 key 查找本身 O(1)，</text>
  <text x="60" y="214" font-size="11" fill="#92400e">key 数量不改变单实例 CPU 上限 —— 拆 key 本身零收益</text>
  <text x="60" y="242" font-size="12" fill="#14532d">两实例 · 分片到 2 实例：142ms ~ 179ms —— 那才是「两个 CPU 核心」</text>
  <text x="60" y="268" font-size="11.5" fill="#334155">benchmark 核对：单 key 280505 次/秒，多 key 329489 次/秒，</text>
  <text x="60" y="288" font-size="11.5" fill="#334155">两实例并发合计 211193 + 185701 = 396894 次/秒（约 1.2 ~ 1.4 倍）</text>
  <text x="60" y="316" font-size="11" fill="#92400e">⚠️ 本机远达不到「2 倍」：瓶颈先落在容器网络与客户端，不是 Redis 的 CPU</text>

  <!-- B. 读代价 -->
  <rect x="560" y="96" width="400" height="248" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="580" y="122" font-size="15" fill="#0f172a">B. 拆完的读代价：聚合 N 个子 key</text>

  <text x="580" y="150" font-size="12" fill="#334155">聚合 1 个 key 的计数：130µs</text>
  <text x="580" y="174" font-size="12" fill="#334155">聚合 4 / 8 / 16 个：318 / 205 / 214µs</text>
  <text x="580" y="198" font-size="12" fill="#334155">聚合读落在 205~318µs，约单 key 的 1.6~2.4 倍</text>
  <text x="580" y="218" font-size="10.5" fill="#64748b">（用管道取值，所以不是线性叠加）</text>

  <rect x="580" y="234" width="360" height="86" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="594" y="256" font-size="11.5" font-weight="bold" fill="#991b1b">这还只是读取代价，没算：</text>
  <text x="594" y="278" font-size="11" fill="#991b1b">① 某个子 key 写失败 → 计数少算，需要补偿</text>
  <text x="594" y="300" font-size="11" fill="#991b1b">② 聚合逻辑污染业务代码 ③ 子 key 数与分片数耦合</text>

  <text x="580" y="336" font-size="10.5" fill="#64748b">分片数要与子 key 数对齐，否则某个分片仍会热</text>

  <!-- C. 判据 -->
  <rect x="40" y="360" width="920" height="150" rx="12" fill="#fffbeb" stroke="#b45309"/>
  <text x="60" y="388" font-size="15" fill="#92400e">C. 判据顺序：先看单节点是否被打满，再谈拆</text>
  <line x1="60" y1="398" x2="940" y2="398" stroke="#fde68a"/>

  <text x="60" y="422" font-size="12" fill="#334155">打满观测口径：redis-cli --latency、节点 CPU、INFO stats 的 instantaneous_ops_per_sec —— 打不满就别拆</text>
  <text x="60" y="446" font-size="12" fill="#334155">更省事的前三招：① 本地缓存 + 合并写入（同一 key 的 N 次 INCR 在应用侧合并成 1 次）</text>
  <text x="60" y="468" font-size="12" fill="#334155">② 读写分离 + 从节点分担读 ③ 热点内容下沉到本地（多级缓存）</text>
  <text x="60" y="494" font-size="11.5" fill="#92400e">⚠️ 热 key 是一种现象，不是一个固定名单 —— 要靠 --hotkeys 或采样持续发现新热点，而不是一次性拆完</text>
</svg>
