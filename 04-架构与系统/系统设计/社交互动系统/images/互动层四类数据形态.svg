<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="40" y="44" font-size="19" fill="#0f172a">互动层四类数据形态：先分清形态，再选结构与说痛点</text>
  <text x="40" y="74" font-size="13" fill="#64748b">分类轴是「数据形态」，不是功能 —— 四类的代价结构完全不同，所以三篇要分开写。</text>

  <!-- 计数器 -->
  <rect x="40" y="104" width="224" height="310" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <rect x="40" y="104" width="224" height="40" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="152" y="130" font-size="15" fill="#1e3a8a" text-anchor="middle">① 计数器</text>
  <text x="54" y="176" font-size="12" fill="#334155">例：点赞数、粉丝数</text>
  <text x="54" y="202" font-size="12" fill="#334155">读：极高频、期望 O(1)</text>
  <text x="54" y="228" font-size="12" fill="#334155">写：高频、必须原子</text>
  <text x="54" y="254" font-size="12" fill="#1e3a8a">首选：Redis INCR</text>
  <text x="54" y="280" font-size="12" fill="#1e3a8a">HINCRBY</text>
  <line x1="54" y1="298" x2="250" y2="298" stroke="#e2e8f0"/>
  <text x="54" y="326" font-size="12" fill="#7c2d12">痛点：</text>
  <text x="54" y="348" font-size="12" fill="#7c2d12">原子性与读放大</text>
  <text x="54" y="378" font-size="11" fill="#64748b">压成一个数字，别每次去数</text>

  <!-- 有序集合 -->
  <rect x="272" y="104" width="224" height="310" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <rect x="272" y="104" width="224" height="40" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="384" y="130" font-size="15" fill="#1e3a8a" text-anchor="middle">② 有序集合</text>
  <text x="286" y="176" font-size="12" fill="#334155">例：热度榜、时间线</text>
  <text x="286" y="202" font-size="12" fill="#334155">读：范围读、要按序</text>
  <text x="286" y="228" font-size="12" fill="#334155">写：高频改分</text>
  <text x="286" y="254" font-size="12" fill="#1e3a8a">首选：Redis ZSET</text>
  <line x1="286" y1="298" x2="482" y2="298" stroke="#e2e8f0"/>
  <text x="286" y="326" font-size="12" fill="#7c2d12">痛点：</text>
  <text x="286" y="348" font-size="12" fill="#7c2d12">翻页一致性</text>
  <text x="286" y="378" font-size="11" fill="#64748b">深分页不慢，offset 会重复</text>

  <!-- 关系图 -->
  <rect x="504" y="104" width="224" height="310" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <rect x="504" y="104" width="224" height="40" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="616" y="130" font-size="15" fill="#1e3a8a" text-anchor="middle">③ 关系图</text>
  <text x="518" y="176" font-size="12" fill="#334155">例：关注、粉丝</text>
  <text x="518" y="202" font-size="12" fill="#334155">读：双向查询</text>
  <text x="518" y="228" font-size="12" fill="#334155">写：中频、成对写</text>
  <text x="518" y="254" font-size="12" fill="#1e3a8a">首选：邻接表双索引</text>
  <text x="518" y="280" font-size="12" fill="#1e3a8a">/ Redis SET</text>
  <line x1="518" y1="298" x2="714" y2="298" stroke="#e2e8f0"/>
  <text x="518" y="326" font-size="12" fill="#7c2d12">痛点：</text>
  <text x="518" y="348" font-size="12" fill="#7c2d12">分片键选谁</text>
  <text x="518" y="378" font-size="11" fill="#64748b">一个方向单分片，另一个广播</text>

  <!-- 内容本身 -->
  <rect x="736" y="104" width="224" height="310" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <rect x="736" y="104" width="224" height="40" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="848" y="130" font-size="15" fill="#1e3a8a" text-anchor="middle">④ 内容本身</text>
  <text x="750" y="176" font-size="12" fill="#334155">例：评论正文</text>
  <text x="750" y="202" font-size="12" fill="#334155">读：分页读</text>
  <text x="750" y="228" font-size="12" fill="#334155">写：低频、要持久</text>
  <text x="750" y="254" font-size="12" fill="#1e3a8a">首选：DB / 文档库</text>
  <line x1="750" y1="298" x2="946" y2="298" stroke="#e2e8f0"/>
  <text x="750" y="326" font-size="12" fill="#7c2d12">痛点：</text>
  <text x="750" y="348" font-size="12" fill="#7c2d12">存储与检索</text>
  <text x="750" y="378" font-size="11" fill="#64748b">一条一写，互不影响</text>

  <!-- 底部注记 -->
  <rect x="40" y="438" width="920" height="58" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="464" font-size="13" fill="#334155">计数器的痛点是原子性与读放大、有序集合是翻页一致性、关系图是分片键、内容本身是存储与检索。</text>
  <text x="60" y="486" font-size="12" fill="#64748b">分清形态 → 判它是不是共享可变量 → 选原子手段 → 说清代价落点，这条顺序对四类都成立。</text>
</svg>
