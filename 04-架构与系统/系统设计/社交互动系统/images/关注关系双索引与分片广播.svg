<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="40" y="44" font-size="19" fill="#0f172a">关注关系：双索引挡扫描，分片键决定广播</text>
  <text x="40" y="72" font-size="13" fill="#64748b">样例：5 万用户 / 15.2 万条边，查 uid=0 的两个方向；分片按 follower_id 切成 4 片。</text>

  <!-- A. 双索引 -->
  <rect x="40" y="96" width="470" height="262" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="122" font-size="15" fill="#0f172a">A. 单表双索引（邻接表）</text>

  <rect x="60" y="138" width="430" height="52" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="74" y="158" font-size="11.5" fill="#1e3a8a">PRIMARY (follower_id, followee_id) → 查「我关注了谁」</text>
  <text x="74" y="178" font-size="11.5" fill="#1e3a8a">KEY idx_followee (followee_id) → 查「谁关注了我」</text>

  <text x="60" y="214" font-size="11.5" fill="#14532d">我关注了谁：type=ref key=PRIMARY rows=3，0.60ms</text>
  <text x="60" y="236" font-size="11.5" fill="#14532d">谁关注了我：type=ref key=idx_followee rows=2003，1.79ms</text>
  <text x="60" y="256" font-size="10.5" fill="#64748b">估算行数 = 结果行数 → 直接命中</text>

  <rect x="60" y="268" width="430" height="56" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="74" y="288" font-size="11" fill="#991b1b">缺反向索引：同一查询 type=index rows=152000，39.21ms</text>
  <text x="74" y="308" font-size="11" fill="#991b1b">沿主键索引整条扫过去挑 2003 行 —— 对 1.79ms 约 22 倍</text>

  <text x="60" y="346" font-size="10.5" fill="#64748b">Redis SET 双向各存：0.31ms / 1.44ms，代价是内存与双写一致性</text>

  <!-- B. 分片 -->
  <rect x="530" y="96" width="430" height="262" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="550" y="122" font-size="15" fill="#0f172a">B. 按 follower_id 分 4 片</text>

  <rect x="550" y="138" width="190" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="645" y="163" font-size="11.5" fill="#14532d" text-anchor="middle">follow_0（0 % 4 = 0）</text>
  <rect x="756" y="138" width="190" height="40" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="851" y="163" font-size="11.5" fill="#334155" text-anchor="middle">follow_1</text>
  <rect x="550" y="186" width="190" height="40" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="645" y="211" font-size="11.5" fill="#334155" text-anchor="middle">follow_2</text>
  <rect x="756" y="186" width="190" height="40" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="851" y="211" font-size="11.5" fill="#334155" text-anchor="middle">follow_3</text>

  <text x="550" y="248" font-size="11.5" fill="#14532d">查「我关注了谁」：命中 1 片（follow_0）0.53ms（3 行）</text>
  <text x="550" y="272" font-size="11.5" fill="#991b1b">查「谁关注了我」：2003 条边按各自 follower_id</text>
  <text x="550" y="292" font-size="11.5" fill="#991b1b">散在 4 片 → 必须广播全部 4 片 6.16ms（2003 行）</text>
  <text x="550" y="316" font-size="10.5" fill="#64748b">约单片的 12 倍 = 4 次查询/网络往返（各约 0.5ms）</text>
  <text x="550" y="336" font-size="10.5" fill="#991b1b">+ 4 次索引扫描；分片数越多，广播越贵</text>

  <!-- C. 出路 -->
  <rect x="40" y="374" width="920" height="146" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="400" font-size="15" fill="#0f172a">C. 两条出路：双写两份，或接受广播 + 合并</text>
  <line x1="60" y1="410" x2="940" y2="410" stroke="#e2e8f0"/>

  <rect x="60" y="424" width="430" height="72" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="74" y="444" font-size="11.5" fill="#1e3a8a">双写两份（正排 + 倒排）：一份按 follower_id 分片，</text>
  <text x="74" y="464" font-size="11.5" fill="#1e3a8a">一份按 followee_id 分片 → 两个方向都不广播</text>
  <text x="74" y="484" font-size="11" fill="#1e40af">代价：写放大 2 倍，两份数据要保证一致</text>

  <rect x="510" y="424" width="430" height="72" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="524" y="444" font-size="11.5" fill="#334155">接受广播 + 合并：查粉丝时并发打所有分片，</text>
  <text x="524" y="464" font-size="11.5" fill="#334155">应用层归并 → 分片数受限，尾延迟由最慢分片决定</text>
  <text x="524" y="484" font-size="11" fill="#64748b">判据：高频方向单分片，低频方向接受广播</text>

  <text x="60" y="514" font-size="11" fill="#14532d">⭐ 大型社交系统几乎都走第一条：存两份、按两个维度各分一次片 —— 用写放大换两个方向都不广播，这也解释了「为什么关注 / 取关是重操作」。</text>

  <!-- 底部注记 -->
  <rect x="40" y="536" width="920" height="32" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="557" font-size="11.5" fill="#334155">验证索引真的用上：看 EXPLAIN 的 type 与 rows —— ref + rows≈结果行数才对；index/ALL 且 rows 远大于结果行数就是漏索引。</text>
</svg>
