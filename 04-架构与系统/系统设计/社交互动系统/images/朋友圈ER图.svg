<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="566" fill="#ffffff"/>
  <text x="40" y="44" font-size="19" fill="#0f172a">朋友圈 ER 图：五张表与三组关系</text>
  <text x="40" y="72" font-size="13" fill="#64748b">重点在「用户-动态」多对多关系表 —— 它决定「这个用户能看到哪些动态」，是发布时维护、查看时直取的关键。</text>

  <!-- 用户表 -->
  <rect x="60" y="126" width="200" height="118" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <rect x="60" y="126" width="200" height="34" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="160" y="149" font-size="13" fill="#1e3a8a" text-anchor="middle">用户表</text>
  <text x="74" y="184" font-size="12" fill="#334155">uid（主键）</text>
  <text x="74" y="208" font-size="12" fill="#334155">昵称</text>
  <text x="74" y="232" font-size="12" fill="#334155">头像</text>

  <!-- 朋友表 -->
  <rect x="60" y="322" width="200" height="118" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="60" y="322" width="200" height="34" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="160" y="345" font-size="13" fill="#14532d" text-anchor="middle">朋友表（通讯录）</text>
  <text x="74" y="380" font-size="12" fill="#334155">uid</text>
  <text x="74" y="404" font-size="12" fill="#334155">friend_uid</text>
  <text x="74" y="428" font-size="12" fill="#64748b">双向：互为朋友</text>

  <!-- 动态表 -->
  <rect x="390" y="126" width="210" height="118" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <rect x="390" y="126" width="210" height="34" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="495" y="149" font-size="13" fill="#1e3a8a" text-anchor="middle">动态表</text>
  <text x="404" y="184" font-size="12" fill="#334155">post_id（主键）</text>
  <text x="404" y="208" font-size="12" fill="#334155">author_uid</text>
  <text x="404" y="232" font-size="12" fill="#334155">内容 / 类型</text>

  <!-- 用户-动态关系表 -->
  <rect x="378" y="322" width="234" height="118" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <rect x="378" y="322" width="234" height="34" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="495" y="345" font-size="13" fill="#7c2d12" text-anchor="middle">用户-动态关系表 ★</text>
  <text x="392" y="380" font-size="12" fill="#7c2d12">uid</text>
  <text x="392" y="404" font-size="12" fill="#7c2d12">post_id</text>
  <text x="392" y="428" font-size="11" fill="#64748b">决定「能看到哪些动态」</text>

  <!-- 评论表 -->
  <rect x="720" y="120" width="220" height="96" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/>
  <rect x="720" y="120" width="220" height="34" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="830" y="143" font-size="13" fill="#334155" text-anchor="middle">评论表</text>
  <text x="734" y="176" font-size="12" fill="#334155">comment_id / post_id</text>
  <text x="734" y="200" font-size="12" fill="#334155">uid / 内容</text>

  <!-- 点赞表 -->
  <rect x="720" y="246" width="220" height="96" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/>
  <rect x="720" y="246" width="220" height="34" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="830" y="269" font-size="13" fill="#334155" text-anchor="middle">点赞表</text>
  <text x="734" y="302" font-size="12" fill="#334155">post_id</text>
  <text x="734" y="326" font-size="12" fill="#334155">uid</text>

  <!-- 关系连线 -->
  <line x1="260" y1="185" x2="388" y2="185" stroke="#64748b" stroke-width="1.6"/>
  <text x="324" y="178" font-size="11" fill="#2563eb" text-anchor="middle">1 : N 发布</text>

  <line x1="160" y1="244" x2="160" y2="320" stroke="#16a34a" stroke-width="1.6"/>
  <text x="172" y="288" font-size="11" fill="#14532d">N : N 互为朋友</text>

  <line x1="495" y1="244" x2="495" y2="320" stroke="#ea580c" stroke-width="1.6"/>
  <text x="507" y="288" font-size="11" fill="#7c2d12">N : N</text>

  <line x1="378" y1="394" x2="262" y2="394" stroke="#ea580c" stroke-width="1.6"/>
  <text x="320" y="386" font-size="11" fill="#7c2d12" text-anchor="middle">N : N</text>

  <line x1="600" y1="168" x2="718" y2="166" stroke="#64748b" stroke-width="1.4"/>
  <text x="659" y="158" font-size="11" fill="#334155" text-anchor="middle">1 : N</text>

  <line x1="600" y1="212" x2="718" y2="284" stroke="#64748b" stroke-width="1.4"/>
  <text x="668" y="256" font-size="11" fill="#334155" text-anchor="middle">1 : N</text>

  <!-- 底部注记 -->
  <rect x="40" y="466" width="920" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="492" font-size="13" fill="#334155">★ 为什么一定要建「用户-动态」多对多关系表：朋友圈的「发布量」远小于「查看量」。</text>
  <text x="60" y="516" font-size="12" fill="#64748b">在「发布」时维护这份关系（写少、代价可控），避免在「查看」时再关联查找（读多、必须快）—— 本质是用空间换时间。</text>
  <text x="60" y="538" font-size="12" fill="#64748b">朋友表是一张独立表表达的自关联多对多：A 加 B 与 B 加 A 相互对应，反查「谁加了我」也靠它。</text>
</svg>
