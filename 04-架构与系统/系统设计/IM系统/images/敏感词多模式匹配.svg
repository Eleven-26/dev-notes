<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- ===== 所有矩形 ===== -->
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <rect x="58" y="283" width="64" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="198" y="183" width="64" height="34" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="198" y="383" width="64" height="34" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="338" y="123" width="64" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="338" y="243" width="64" height="34" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="338" y="383" width="64" height="34" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="478" y="123" width="64" height="34" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="478" y="243" width="64" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="478" y="383" width="64" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="618" y="123" width="64" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>

  <rect x="760" y="110" width="210" height="400" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="50" y="520" width="920" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ===== Trie 的边（实线）===== -->
  <path d="M 122 292 L 198 210" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 122 308 L 198 390" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 262 195 L 338 150" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 262 205 L 338 255" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 262 400 L 338 400" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 402 140 L 478 140" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 402 260 L 478 260" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 402 400 L 478 400" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 542 140 L 618 140" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== fail 指针（虚线）===== -->
  <path d="M 500 383 C 452 322 402 238 386 158" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrO)"/>
  <path d="M 490 266 C 420 282 318 322 250 384" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrO)"/>
  <path d="M 350 400 C 312 380 272 302 242 219" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrO)"/>

  <!-- ===== 标题 ===== -->
  <text x="30" y="40" font-size="21" font-weight="bold" fill="#0f172a">敏感词的多模式匹配：Trie + fail 指针</text>
  <text x="30" y="68" font-size="13" fill="#475569">把所有敏感词压成一棵树，主串只扫一遍就能同时匹配全部模式（Aho-Corasick）。</text>

  <!-- ===== 树节点标签 ===== -->
  <text x="90" y="305" font-size="12" fill="#1e3a8a" text-anchor="middle">root</text>
  <text x="230" y="205" font-size="12" fill="#334155" text-anchor="middle">h</text>
  <text x="230" y="405" font-size="12" fill="#334155" text-anchor="middle">s</text>
  <text x="370" y="145" font-size="12" fill="#14532d" text-anchor="middle">e</text>
  <text x="370" y="265" font-size="12" fill="#334155" text-anchor="middle">i</text>
  <text x="370" y="405" font-size="12" fill="#334155" text-anchor="middle">h</text>
  <text x="510" y="145" font-size="12" fill="#334155" text-anchor="middle">r</text>
  <text x="510" y="265" font-size="12" fill="#14532d" text-anchor="middle">s</text>
  <text x="510" y="405" font-size="12" fill="#14532d" text-anchor="middle">e</text>
  <text x="650" y="145" font-size="12" fill="#14532d" text-anchor="middle">s</text>

  <!-- ===== 终态词标签 ===== -->
  <text x="370" y="176" font-size="12" fill="#14532d" text-anchor="middle">命中 he</text>
  <text x="510" y="296" font-size="12" fill="#14532d" text-anchor="middle">命中 his</text>
  <text x="510" y="436" font-size="12" fill="#14532d" text-anchor="middle">命中 she</text>
  <text x="650" y="176" font-size="12" fill="#14532d" text-anchor="middle">命中 hers</text>

  <!-- ===== 图例 ===== -->
  <text x="60" y="470" font-size="12" fill="#334155">实线：Trie 的边（一个字符走一步）</text>
  <text x="60" y="494" font-size="12" fill="#ea580c">虚线：fail 指针（失配时跳到最长可复用后缀）</text>

  <!-- ===== 右侧要点面板 ===== -->
  <text x="778" y="140" font-size="14" font-weight="bold" fill="#0f172a">Aho-Corasick 要点</text>
  <text x="778" y="172" font-size="12" fill="#334155">① 全部模式串建成 Trie</text>
  <text x="778" y="198" font-size="12" fill="#334155">② BFS 求每个节点的 fail 指针</text>
  <text x="778" y="230" font-size="12" fill="#334155">③ 主串从左到右扫一遍</text>
  <text x="778" y="256" font-size="12" fill="#475569">     失配就沿 fail 跳</text>
  <text x="778" y="288" font-size="12" fill="#334155">④ 命中时沿 fail 链回溯</text>
  <text x="778" y="314" font-size="12" fill="#475569">     找出所有出现的模式</text>
  <text x="778" y="346" font-size="12" fill="#334155">⑤ 扫描成本与模式总数无关</text>
  <text x="778" y="372" font-size="12" fill="#475569">     整体接近线性</text>
  <text x="778" y="404" font-size="12" fill="#7c2d12">用途：敏感词多模式匹配</text>
  <text x="778" y="434" font-size="12" fill="#7c2d12">变体先归一化再匹配</text>

  <!-- ===== 底部要点 ===== -->
  <text x="70" y="548" font-size="13" font-weight="bold" fill="#0f172a">要点：Trie 把「所有敏感词」压成一棵树；fail 指针让失配时跳到最长可复用后缀，主串只扫一遍。</text>
  <text x="70" y="576" font-size="12" fill="#334155">敏感词变体（拼音、拆字、同音字）必须在进入匹配前先归一化，否则词表覆盖不到变体。</text>
  <text x="70" y="602" font-size="12" fill="#64748b">注意：本篇未做实测，无读数；本图以模式串 {he, she, his, hers} 示意结构，中文词库同理。</text>
</svg>
