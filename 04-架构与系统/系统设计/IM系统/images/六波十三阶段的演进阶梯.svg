<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 476" width="1000" height="476" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="476" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">六波十三个阶段：每一波都是被上一波逼出来的</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">左侧色条分三档：灰=起点，绿=加机器可解，橙=加手段（改协议 / 模型 / 路由），红=只能换算法</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect x="22" y="76" width="5" height="268" rx="2" fill="#64748b" stroke="#64748b" stroke-width="1.2"/>
  <text x="37" y="94" font-size="10" fill="#64748b" text-anchor="start">第一波</text>
  <text x="37" y="112" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="bold">让它能跑</text>
  <rect x="37" y="130" width="135" height="52" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.1"/>
  <text x="48" y="151" font-size="10.4" fill="#64748b" text-anchor="start" font-weight="bold">A 一进程一张表</text>
  <text x="48" y="169" font-size="9.8" fill="#0f172a" text-anchor="start">单机能收发</text>
  <text x="37" y="352" font-size="9.6" fill="#64748b" text-anchor="start">停下来时：</text>
  <text x="37" y="370" font-size="10" fill="#0f172a" text-anchor="start" font-weight="bold">一个进程能收发</text>
  <rect x="184" y="76" width="5" height="268" rx="2" fill="#15803d" stroke="#15803d" stroke-width="1.2"/>
  <text x="199" y="94" font-size="10" fill="#64748b" text-anchor="start">第二波</text>
  <text x="199" y="112" font-size="11.5" fill="#15803d" text-anchor="start" font-weight="bold">连接撑不住</text>
  <rect x="199" y="130" width="135" height="52" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.1"/>
  <text x="210" y="151" font-size="10.4" fill="#15803d" text-anchor="start" font-weight="bold">B fd 撞墙</text>
  <text x="210" y="169" font-size="9.8" fill="#0f172a" text-anchor="start">网关独立成层</text>
  <rect x="199" y="192" width="135" height="52" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.1"/>
  <text x="210" y="213" font-size="10.4" fill="#15803d" text-anchor="start" font-weight="bold">C 网关不够</text>
  <text x="210" y="231" font-size="9.8" fill="#0f172a" text-anchor="start">连接路由表</text>
  <text x="199" y="352" font-size="9.6" fill="#64748b" text-anchor="start">停下来时：</text>
  <text x="199" y="370" font-size="10" fill="#0f172a" text-anchor="start" font-weight="bold">十万人同时在线</text>
  <rect x="346" y="76" width="5" height="268" rx="2" fill="#b45309" stroke="#b45309" stroke-width="1.2"/>
  <text x="361" y="94" font-size="10" fill="#64748b" text-anchor="start">第三波</text>
  <text x="361" y="112" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="bold">消息会丢</text>
  <rect x="361" y="130" width="135" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.1"/>
  <text x="372" y="151" font-size="10.4" fill="#b45309" text-anchor="start" font-weight="bold">D 网关重启</text>
  <text x="372" y="169" font-size="9.8" fill="#0f172a" text-anchor="start">落库 + SendAck</text>
  <rect x="361" y="192" width="135" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.1"/>
  <text x="372" y="213" font-size="10.4" fill="#b45309" text-anchor="start" font-weight="bold">E 对端没收到</text>
  <text x="372" y="231" font-size="9.8" fill="#0f172a" text-anchor="start">收件箱 + 补拉</text>
  <rect x="361" y="254" width="135" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.1"/>
  <text x="372" y="275" font-size="10.4" fill="#b45309" text-anchor="start" font-weight="bold">F 补拉补重</text>
  <text x="372" y="293" font-size="9.8" fill="#0f172a" text-anchor="start">msgID 幂等</text>
  <text x="361" y="352" font-size="9.6" fill="#64748b" text-anchor="start">停下来时：</text>
  <text x="361" y="370" font-size="10" fill="#0f172a" text-anchor="start" font-weight="bold">不丢、可补、不重</text>
  <rect x="508" y="76" width="5" height="268" rx="2" fill="#ea580c" stroke="#ea580c" stroke-width="1.2"/>
  <text x="523" y="94" font-size="10" fill="#64748b" text-anchor="start">第四波</text>
  <text x="523" y="112" font-size="11.5" fill="#ea580c" text-anchor="start" font-weight="bold">顺序与多端</text>
  <rect x="523" y="130" width="135" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.1"/>
  <text x="534" y="151" font-size="10.4" fill="#ea580c" text-anchor="start" font-weight="bold">G 顺序乱</text>
  <text x="534" y="169" font-size="9.8" fill="#0f172a" text-anchor="start">会话 seq 单点</text>
  <rect x="523" y="192" width="135" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.1"/>
  <text x="534" y="213" font-size="10.4" fill="#ea580c" text-anchor="start" font-weight="bold">H 多端打架</text>
  <text x="534" y="231" font-size="9.8" fill="#0f172a" text-anchor="start">位点 + 单调收敛</text>
  <text x="523" y="352" font-size="9.6" fill="#64748b" text-anchor="start">停下来时：</text>
  <text x="523" y="370" font-size="10" fill="#0f172a" text-anchor="start" font-weight="bold">多个端说的是同一件事</text>
  <rect x="670" y="76" width="5" height="268" rx="2" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/>
  <text x="685" y="94" font-size="10" fill="#64748b" text-anchor="start">第五波</text>
  <text x="685" y="112" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="bold">群与规模</text>
  <rect x="685" y="130" width="135" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.1"/>
  <text x="696" y="151" font-size="10.4" fill="#dc2626" text-anchor="start" font-weight="bold">I 群大了</text>
  <text x="696" y="169" font-size="9.8" fill="#0f172a" text-anchor="start">写扩散转读扩散</text>
  <rect x="685" y="192" width="135" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.1"/>
  <text x="696" y="213" font-size="10.4" fill="#dc2626" text-anchor="start" font-weight="bold">J 未读算不动</text>
  <text x="696" y="231" font-size="9.8" fill="#0f172a" text-anchor="start">位点差替计数</text>
  <rect x="685" y="254" width="135" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.1"/>
  <text x="696" y="275" font-size="10.4" fill="#dc2626" text-anchor="start" font-weight="bold">K 单库满了</text>
  <text x="696" y="293" font-size="9.8" fill="#0f172a" text-anchor="start">convID 分片</text>
  <text x="685" y="352" font-size="9.6" fill="#64748b" text-anchor="start">停下来时：</text>
  <text x="685" y="370" font-size="10" fill="#0f172a" text-anchor="start" font-weight="bold">千人群不塌，单库能扩</text>
  <rect x="832" y="76" width="5" height="268" rx="2" fill="#b45309" stroke="#b45309" stroke-width="1.2"/>
  <text x="847" y="94" font-size="10" fill="#64748b" text-anchor="start">第六波</text>
  <text x="847" y="112" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="bold">地域与合规</text>
  <rect x="847" y="130" width="135" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.1"/>
  <text x="858" y="151" font-size="10.4" fill="#b45309" text-anchor="start" font-weight="bold">L 跨地域</text>
  <text x="858" y="169" font-size="9.8" fill="#0f172a" text-anchor="start">会话 pin + 本地写</text>
  <rect x="847" y="192" width="135" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.1"/>
  <text x="858" y="213" font-size="10.4" fill="#b45309" text-anchor="start" font-weight="bold">M 要合规 / E2EE</text>
  <text x="858" y="231" font-size="9.8" fill="#0f172a" text-anchor="start">改「能不能读明文」</text>
  <text x="847" y="352" font-size="9.6" fill="#64748b" text-anchor="start">停下来时：</text>
  <text x="847" y="370" font-size="10" fill="#0f172a" text-anchor="start" font-weight="bold">跨地域可切，合规可审</text>
  <rect x="22" y="420" width="952" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="38" y="445" font-size="11" fill="#0f172a" text-anchor="start">同一列里从上往下是「前一个问题解决了、才出现下一个」；换一列就是「上一波把这一波逼出来了」。</text>
  <text x="700" y="445" font-size="11" fill="#64748b" text-anchor="start">没有哪一波能跳过：跳过 E 就永远测不出 F。</text>
</svg>
