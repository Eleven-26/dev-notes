<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <!-- ===== 标题 ===== -->
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#0f172a">IM 三条通信路径的协议栈</text>
  <text x="30" y="66" font-size="13" fill="#475569">自下而上，下层为上层提供能力；三条路径的同名层次解决同样的通用问题，但各自「已经给你什么」并不相同。</text>

  <!-- ===== 面板标题条（先画所有矩形）===== -->
  <rect x="30" y="92" width="290" height="42" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="355" y="92" width="290" height="42" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="680" y="92" width="290" height="42" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>

  <!-- ===== 路径 ① ===== -->
  <rect x="42" y="150" width="266" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="42" y="214" width="266" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="42" y="278" width="266" height="56" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="42" y="342" width="266" height="56" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="42" y="406" width="266" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ===== 路径 ② ===== -->
  <rect x="367" y="150" width="266" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="367" y="214" width="266" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="367" y="278" width="266" height="56" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="367" y="342" width="266" height="56" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="367" y="406" width="266" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ===== 路径 ③ ===== -->
  <rect x="692" y="150" width="266" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="692" y="214" width="266" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="692" y="278" width="266" height="56" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="692" y="342" width="266" height="56" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="692" y="406" width="266" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ===== 底部图例与小结（矩形）===== -->
  <rect x="30" y="484" width="940" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="60" y="500" width="16" height="16" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="230" y="500" width="16" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="400" y="500" width="16" height="16" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="570" y="500" width="16" height="16" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

  <!-- ===== 面板标题文字 ===== -->
  <text x="175" y="119" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">路径 ① 客户端 ↔ 网关</text>
  <text x="500" y="119" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">路径 ② 网关 ↔ 逻辑服务</text>
  <text x="825" y="119" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">路径 ③ 逻辑服务 ↔ 下游</text>

  <!-- ===== 路径 ① 图层文字 ===== -->
  <text x="175" y="174" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">应用层协议（自研）</text>
  <text x="175" y="194" font-size="12" fill="#166534" text-anchor="middle">消息类型 · 版本 · 能力协商</text>
  <text x="175" y="238" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">WebSocket / 自定义二进制</text>
  <text x="175" y="258" font-size="12" fill="#1d4ed8" text-anchor="middle">帧定界（自定义要自己切）</text>
  <text x="175" y="302" font-size="13" font-weight="bold" fill="#7c2d12" text-anchor="middle">TLS</text>
  <text x="175" y="322" font-size="12" fill="#9a3412" text-anchor="middle">加密 · 握手</text>
  <text x="175" y="366" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">TCP（或 QUIC / UDP）</text>
  <text x="175" y="386" font-size="12" fill="#475569" text-anchor="middle">可靠有序字节流</text>
  <text x="175" y="430" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">IP / 链路层</text>
  <text x="175" y="450" font-size="12" fill="#64748b" text-anchor="middle">网络</text>

  <!-- ===== 路径 ② 图层文字 ===== -->
  <text x="500" y="174" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">服务契约（IDL）</text>
  <text x="500" y="194" font-size="12" fill="#166534" text-anchor="middle">.proto：服务 · 方法 · 错误码</text>
  <text x="500" y="238" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">gRPC / HTTP-2</text>
  <text x="500" y="258" font-size="12" fill="#1d4ed8" text-anchor="middle">多路复用 · deadline · metadata</text>
  <text x="500" y="302" font-size="13" font-weight="bold" fill="#7c2d12" text-anchor="middle">TLS / mTLS（可选）</text>
  <text x="500" y="322" font-size="12" fill="#9a3412" text-anchor="middle">加密 · 双向认证</text>
  <text x="500" y="366" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">TCP</text>
  <text x="500" y="386" font-size="12" fill="#475569" text-anchor="middle">可靠有序字节流</text>
  <text x="500" y="430" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">IP / 链路层</text>
  <text x="500" y="450" font-size="12" fill="#64748b" text-anchor="middle">网络</text>

  <!-- ===== 路径 ③ 图层文字 ===== -->
  <text x="825" y="174" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">应用语义</text>
  <text x="825" y="194" font-size="12" fill="#166534" text-anchor="middle">事件 · 命令 · KV 读写 · SQL</text>
  <text x="825" y="238" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">MQ / Redis / SQL 协议</text>
  <text x="825" y="258" font-size="12" fill="#1d4ed8" text-anchor="middle">投递 · 命令 · 事务语义</text>
  <text x="825" y="302" font-size="13" font-weight="bold" fill="#7c2d12" text-anchor="middle">内网隔离</text>
  <text x="825" y="322" font-size="12" fill="#9a3412" text-anchor="middle">通常不单独加密</text>
  <text x="825" y="366" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">TCP（长连接 / 连接池）</text>
  <text x="825" y="386" font-size="12" fill="#475569" text-anchor="middle">连接复用</text>
  <text x="825" y="430" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">IP / 链路层</text>
  <text x="825" y="450" font-size="12" fill="#64748b" text-anchor="middle">网络</text>

  <!-- ===== 图例文字 ===== -->
  <text x="84" y="513" font-size="12" fill="#334155">应用层：必须自己做</text>
  <text x="254" y="513" font-size="12" fill="#334155">中间层：协议已给</text>
  <text x="424" y="513" font-size="12" fill="#334155">安全层：TLS</text>
  <text x="594" y="513" font-size="12" fill="#334155">传输 / 网络层</text>
  <text x="60" y="545" font-size="13" font-weight="bold" fill="#0f172a">要点：越靠客户端，协议越贫瘠、要自己补的越多；越靠下游，可靠性语义由下游给定。</text>
  <text x="60" y="565" font-size="12" fill="#64748b">注意：本篇未做实测，无读数；具体帧格式与连接细节见 IM 目录的 协议设计.md / 在线状态与推送.md。</text>
</svg>
