<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="sans-serif">
  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#0f172a">IM 的存储全景：一份权威源，其余全是它的派生</text>
  <text x="30" y="62" font-size="13" fill="#64748b">写路径先在权威源成功、再异步派生；读路径按热到温再到冷逐级查</text>

  <g transform="translate(20,80)">
    <rect x="0" y="0" width="460" height="460" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">① 数据角色与载体</text>

    <rect x="18" y="44" width="424" height="120" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="34" y="66" font-size="11.5" font-weight="bold" fill="#7f1d1d">权威源 · MySQL（按 convID 分库分表）</text>
    <text x="34" y="90" font-size="10" fill="#334155">会话表 / 成员表：会话归属与成员是唯一真相</text>
    <text x="34" y="110" font-size="10" fill="#334155">消息流（含会话内 seq）：要持久、要按 seq 有序读</text>
    <text x="34" y="130" font-size="10" fill="#334155">消息写入与成员位点更新在同一个事务里生效</text>
    <text x="34" y="152" font-size="10.5" font-weight="bold" fill="#991b1b">不能丢：丢了无法重建</text>

    <rect x="18" y="176" width="424" height="114" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="34" y="198" font-size="11.5" font-weight="bold" fill="#14532d">副本 · Redis（可重建）</text>
    <text x="34" y="222" font-size="10" fill="#334155">近期消息热窗口：高频读，加速漫游与拉取</text>
    <text x="34" y="242" font-size="10" fill="#334155">未读计数：由消息与已读回执重算，计数只是加速</text>
    <text x="34" y="262" font-size="10" fill="#334155">在线状态与连接路由：带 TTL，连接断了即失效</text>
    <text x="34" y="282" font-size="10.5" font-weight="bold" fill="#14532d">能丢：从权威源重建</text>

    <rect x="18" y="302" width="424" height="96" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="34" y="324" font-size="11.5" font-weight="bold" fill="#1e3a8a">归档 / 静态资源 · 对象存储</text>
    <text x="34" y="348" font-size="10" fill="#334155">历史消息：极少回读，按产品策略下沉，仍可查</text>
    <text x="34" y="368" font-size="10" fill="#334155">图片 / 语音 / 文件：走 CDN，消息库里只留 URL</text>
    <text x="34" y="388" font-size="10.5" font-weight="bold" fill="#1e3a8a">最便宜介质承载最低频的读</text>

    <text x="18" y="420" font-size="11" fill="#475569">先分角色，再选存储：判据只有一句 ——</text>
    <text x="18" y="436" font-size="11" fill="#475569">丢了能不能从别处重建。</text>
  </g>

  <g transform="translate(500,80)">
    <rect x="0" y="0" width="480" height="460" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="26" font-size="15" font-weight="bold" fill="#0f172a">② 写路径与读路径的落点</text>

    <text x="18" y="50" font-size="12" font-weight="bold" fill="#0f172a">写：发一条消息</text>

    <rect x="18" y="60" width="444" height="44" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="34" y="87" font-size="10.5" fill="#312e81">① 同一个事务里写 MySQL：消息本体 + 成员位点 lastMsgSeq</text>

    <line x1="240" y1="104" x2="240" y2="114" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrS)"/>

    <rect x="18" y="118" width="444" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="34" y="145" font-size="10.5" fill="#14532d">② 异步扇出：写对端的 inbox（Redis ZSet）</text>

    <line x1="240" y1="162" x2="240" y2="172" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrS)"/>

    <rect x="18" y="176" width="444" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="34" y="203" font-size="10.5" fill="#14532d">③ 未读由位点差派生：Redis 计数 + 定期落库</text>

    <text x="18" y="248" font-size="12" font-weight="bold" fill="#0f172a">读：打开一个会话</text>

    <rect x="18" y="258" width="444" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="34" y="285" font-size="10.5" fill="#14532d">① 先读 Redis 热窗口（最近一批消息）</text>

    <line x1="240" y1="302" x2="240" y2="312" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrS)"/>

    <rect x="18" y="316" width="444" height="44" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="34" y="343" font-size="10.5" fill="#312e81">② 翻出热窗口 → 回源 MySQL（温层）</text>

    <line x1="240" y1="360" x2="240" y2="370" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrS)"/>

    <rect x="18" y="374" width="444" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="34" y="401" font-size="10.5" fill="#1e3a8a">③ 再往前 → 冷层按需回捞，查到后限频回填</text>

    <text x="18" y="440" font-size="11" fill="#475569">写入必须先在权威源成功，副本才有意义；读回到冷层时不要把冷数据灌回热层。</text>
  </g>
</svg>
