<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <text x="30" y="34" font-size="20" font-weight="bold" fill="#0f172a">大群处理的三问决策树：先定档位，再裁随 N 增长的数据，最后看单个动作</text>
  <text x="30" y="56" font-size="12.5" fill="#475569">三问分别取自正文 4.1、4.4 的判据与 4.3；「几百人 / 十万人」「已读 1.2 万」是正文示例规模，本篇未做实测，图中不含阈值与扇出倍数</text>

  <rect x="40" y="162" width="250" height="64" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="165" y="188" font-size="12" fill="#92400e" text-anchor="middle">第一问（4.1）</text>
  <text x="165" y="208" font-size="12" fill="#92400e" text-anchor="middle">群规模是哪个档位？</text>

  <rect x="360" y="76" width="290" height="76" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="505" y="98" font-size="12" fill="#14532d" text-anchor="middle">几百人级 → 沿用单聊式做法</text>
  <text x="505" y="118" font-size="12" fill="#14532d" text-anchor="middle">写扩散 + 全量成员表一次下发</text>
  <text x="505" y="138" font-size="12" fill="#14532d" text-anchor="middle">逐人已读回执也可保留</text>

  <rect x="360" y="188" width="290" height="76" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="505" y="210" font-size="12" fill="#92400e" text-anchor="middle">万人 / 十万人级 → 架构必须改</text>
  <text x="505" y="230" font-size="12" fill="#92400e" text-anchor="middle">第二问（4.4 判据）：这份数据 / 动作</text>
  <text x="505" y="250" font-size="12" fill="#92400e" text-anchor="middle">是否随成员数 N 线性增长？</text>

  <rect x="700" y="76" width="270" height="76" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="835" y="98" font-size="12" fill="#1e3a8a" text-anchor="middle">扇出到各成员收件箱</text>
  <text x="835" y="118" font-size="12" fill="#1e3a8a" text-anchor="middle">转读扩散：只写 1 份到会话流</text>
  <text x="835" y="138" font-size="12" fill="#1e3a8a" text-anchor="middle">读取时按成员表扇出（4.2）</text>

  <rect x="700" y="172" width="270" height="76" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="835" y="194" font-size="12" fill="#1e3a8a" text-anchor="middle">成员表</text>
  <text x="835" y="214" font-size="12" fill="#1e3a8a" text-anchor="middle">分页拉取 + 热群成员表缓存</text>
  <text x="835" y="234" font-size="12" fill="#1e3a8a" text-anchor="middle">缓存失效靠 Version（4.4）</text>

  <rect x="700" y="268" width="270" height="76" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="835" y="290" font-size="12" fill="#1e3a8a" text-anchor="middle">通知目标</text>
  <text x="835" y="310" font-size="12" fill="#1e3a8a" text-anchor="middle">一条公告 = N 条离线推送</text>
  <text x="835" y="330" font-size="12" fill="#1e3a8a" text-anchor="middle">必须削峰与合并（4.3）</text>

  <rect x="700" y="364" width="270" height="76" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="835" y="386" font-size="12" fill="#1e3a8a" text-anchor="middle">逐人已读回执</text>
  <text x="835" y="406" font-size="12" fill="#1e3a8a" text-anchor="middle">放弃明细，只留聚合值</text>
  <text x="835" y="426" font-size="12" fill="#1e3a8a" text-anchor="middle">如「已读 1.2 万」（4.5）</text>

  <rect x="360" y="312" width="290" height="76" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="505" y="334" font-size="12" fill="#334155" text-anchor="middle">不随 N 增长 → 群级配置就够</text>
  <text x="505" y="354" font-size="12" fill="#334155" text-anchor="middle">角色 / 全体禁言 / 入群策略</text>
  <text x="505" y="374" font-size="12" fill="#334155" text-anchor="middle">留在群表，无需特殊处理（3.1 / 3.2）</text>

  <rect x="40" y="442" width="250" height="76" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="165" y="466" font-size="12" fill="#92400e" text-anchor="middle">第三问（4.3）</text>
  <text x="165" y="486" font-size="12" fill="#92400e" text-anchor="middle">这个动作会不会</text>
  <text x="165" y="506" font-size="12" fill="#92400e" text-anchor="middle">同时打扰全群？</text>

  <rect x="360" y="430" width="290" height="64" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="505" y="456" font-size="12" fill="#7f1d1d" text-anchor="middle">是：一条消息打扰全群 —— @所有人</text>
  <text x="505" y="476" font-size="12" fill="#7f1d1d" text-anchor="middle">限频 + 限角色，大群可直接禁用</text>

  <rect x="360" y="512" width="290" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="505" y="538" font-size="12" fill="#334155" text-anchor="middle">否：只是普通发言</text>
  <text x="505" y="558" font-size="12" fill="#334155" text-anchor="middle">仍按每人在群内的发送频率限（4.3）</text>

  <line x1="290" y1="180" x2="350" y2="122" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="290" y1="206" x2="350" y2="222" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="650" y1="226" x2="690" y2="118" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="650" y1="226" x2="690" y2="210" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="650" y1="226" x2="690" y2="302" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="650" y1="226" x2="690" y2="398" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="505" y1="264" x2="505" y2="304" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#arr)"/>
  <line x1="290" y1="466" x2="350" y2="462" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="290" y1="494" x2="350" y2="540" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <text x="30" y="612" font-size="11.5" fill="#475569">连线口径：黄色 = 判据节点，绿色 = 小档出口，蓝色四块 = 第二问「是（随 N 线性增长）」的四个出口，灰色 = 否出口，红色 = 要限频的动作。</text>
  <text x="30" y="634" font-size="11.5" fill="#475569">三个黄色问句按 4.1 → 4.4 → 4.3 依次问，彼此独立成树；顺序反了就是 4.1 说的「只把上限设成一个很大的数而不改架构」。</text>
</svg>
