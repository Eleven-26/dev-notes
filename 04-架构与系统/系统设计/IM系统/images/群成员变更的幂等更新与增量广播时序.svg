<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="30" y="36" font-size="20" font-weight="bold" fill="#0f172a">群成员变更：幂等写入、版本失效与增量广播</text>
  <text x="30" y="58" font-size="12.5" fill="#475569">一次「踢出 / 加入」从请求到各端收敛的时序；重复事件不产生副作用，全量成员表不下发</text>

  <rect x="24" y="76" width="952" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

  <rect x="70" y="92" width="180" height="38" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="390" y="92" width="220" height="38" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="700" y="92" width="260" height="38" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="160" y="116" font-size="13" fill="#1e3a8a" text-anchor="middle">操作者客户端</text>
  <text x="500" y="116" font-size="13" fill="#1e3a8a" text-anchor="middle">群服务（成员表）</text>
  <text x="830" y="116" font-size="13" fill="#1e3a8a" text-anchor="middle">其他成员端：本地表 / 权限缓存</text>

  <line x1="160" y1="130" x2="160" y2="376" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="500" y1="130" x2="500" y2="376" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="830" y1="130" x2="830" y2="376" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>

  <line x1="160" y1="156" x2="488" y2="156" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="324" y="150" font-size="11" fill="#334155" text-anchor="middle">① 变更请求，带幂等键</text>

  <rect x="378" y="176" width="244" height="30" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="500" y="196" font-size="11" fill="#92400e" text-anchor="middle">② 更新到目标状态：重复事件无副作用</text>

  <rect x="378" y="216" width="244" height="46" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="234" font-size="11" fill="#14532d" text-anchor="middle">③ 与成员变更放在同一事务里</text>
  <text x="500" y="253" font-size="11" fill="#14532d" text-anchor="middle">成员行增删、计数加减、Version++</text>

  <line x1="500" y1="286" x2="818" y2="286" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr2)"/>
  <text x="659" y="280" font-size="11" fill="#1e3a8a" text-anchor="middle">④ 只推增量事件（谁进 / 谁出）</text>

  <rect x="706" y="306" width="248" height="30" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="830" y="326" font-size="11" fill="#334155" text-anchor="middle">⑤ 本地表只用于展示，判定回服务端</text>

  <line x1="830" y1="360" x2="512" y2="360" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="671" y="354" font-size="11" fill="#334155" text-anchor="middle">⑥ 带本地 Version 问缓存，版本更新则回增量</text>

  <text x="44" y="404" font-size="11.5" fill="#991b1b">转让群主必须是一次事务改两行：新群主就位与旧群主降级同时生效，否则出现两个群主或没有群主</text>
  <text x="44" y="430" font-size="11.5" fill="#334155">重复入群不能重复计数；拉人入群会短时间产生大量进退群事件，广播前要防抖合并，全量下发会打爆下行</text>
  <text x="44" y="456" font-size="11.5" fill="#334155">权限缓存的失效靠成员表 Version：缓存不随版本失效，就会出现「刚被踢的人还能发言」</text>

  <rect x="24" y="496" width="952" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="522" font-size="12" fill="#0f172a">要点：把每个成员操作写成「把成员表变成目标状态」的幂等更新，而不是「执行一个动作」，重复事件就自然无害。</text>
  <text x="44" y="548" font-size="12" fill="#475569">变更只推增量事件由客户端本地应用，不推全量成员表；客户端本地表只用于展示，权限判定一律回服务端。</text>
  <text x="44" y="574" font-size="12" fill="#94a3b8">注意：本篇未做实测，无读数；本图为时序示意，不含任何耗时或人数数字。</text>
</svg>
