<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="840" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一条消息跨三条路径：从 Send 到送达位点</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#475569">以「A 给 B 发消息」为例共十步，每个框标出它发生在哪条路径上（流程示意，不含任何延迟数字）</text>

  <!-- 三条泳道 -->
  <rect x="24" y="78" width="300" height="30" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="174" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">路径① 客户端 ↔ 网关（公网·长连接）</text>
  <rect x="350" y="78" width="300" height="30" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">路径② 网关 ↔ 逻辑服务（内网·请求-响应）</text>
  <rect x="676" y="78" width="296" height="30" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="824" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">路径③ 逻辑服务 ↔ 下游（KV·DB·MQ）</text>

  <rect x="24" y="112" width="300" height="590" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="350" y="112" width="300" height="590" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="676" y="112" width="296" height="590" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- ① Send -->
  <rect x="38" y="126" width="272" height="58" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="174" y="148" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">① Send 报文（路径①）</text>
  <text x="174" y="166" text-anchor="middle" font-size="9.5" fill="#1e3a8a">convID + clientMsgID + 内容</text>
  <text x="174" y="180" text-anchor="middle" font-size="9.5" fill="#1e3a8a">WebSocket 承载，此时未分配 seq</text>
  <path d="M 310 168 L 364 216" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ② gRPC -->
  <rect x="364" y="200" width="272" height="58" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="222" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">② gRPC 调 SendMessage（路径②）</text>
  <text x="500" y="240" text-anchor="middle" font-size="9.5" fill="#14532d">走 .proto 契约</text>
  <text x="500" y="254" text-anchor="middle" font-size="9.5" fill="#14532d">metadata 带来源网关与 trace id</text>
  <line x1="500" y1="258" x2="500" y2="272" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ③ 去重分配 seq -->
  <rect x="364" y="272" width="272" height="58" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="294" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">③ 去重后分配会话 seq（路径②产生）</text>
  <text x="500" y="312" text-anchor="middle" font-size="9.5" fill="#14532d">按 clientMsgID 判重</text>
  <text x="500" y="326" text-anchor="middle" font-size="9.5" fill="#14532d">先判重、后占号</text>
  <line x1="636" y1="301" x2="690" y2="301" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 430 330 L 310 356" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ③ 存储 -->
  <rect x="690" y="272" width="268" height="58" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="824" y="294" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">③ 存储（路径③）</text>
  <text x="824" y="312" text-anchor="middle" font-size="9.5" fill="#92400e">消息落库 MySQL / 对象存储</text>
  <text x="824" y="326" text-anchor="middle" font-size="9.5" fill="#92400e">更新成员 lastMsgSeq（KV）</text>
  <line x1="824" y1="330" x2="824" y2="346" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ④⑤ SendAck -->
  <rect x="38" y="346" width="272" height="52" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="174" y="368" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">④⑤ SendAck 回客户端（msgID+seq）</text>
  <text x="174" y="386" text-anchor="middle" font-size="9.5" fill="#1e3a8a">客户端显示「已发送」</text>

  <!-- ⑥ 查在线 -->
  <rect x="690" y="346" width="268" height="52" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="824" y="368" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">⑥ 查在线状态（路径③ KV）</text>
  <text x="824" y="386" text-anchor="middle" font-size="9.5" fill="#92400e">消息服务异步扇出</text>

  <!-- 在线 / 离线 分支 -->
  <path d="M 760 398 L 636 442" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="860" y1="398" x2="860" y2="430" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="364" y="430" width="272" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="456" text-anchor="middle" font-size="10.5" fill="#14532d">在线：把推送交给网关（路径②）</text>
  <rect x="690" y="430" width="268" height="44" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="824" y="449" text-anchor="middle" font-size="10.5" fill="#92400e">离线：落收件箱 / 走系统推送</text>
  <text x="824" y="466" text-anchor="middle" font-size="9" fill="#92400e">唤起后仍靠上线按位点拉取补齐</text>

  <!-- ⑦⑧ Push / PushAck -->
  <path d="M 364 468 L 310 494" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="38" y="502" width="272" height="52" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="174" y="524" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">⑦ Push 报文 → ⑧ 对端回 PushAck</text>
  <text x="174" y="542" text-anchor="middle" font-size="9.5" fill="#1e3a8a">下行推送 + 上行确认，都走路径①</text>
  <path d="M 310 554 L 364 582" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ⑨ ReportDelivered -->
  <rect x="364" y="572" width="272" height="48" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="592" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">⑨ ReportDelivered（路径②）</text>
  <text x="500" y="610" text-anchor="middle" font-size="9.5" fill="#14532d">网关 → 消息服务 gRPC 调用</text>
  <path d="M 636 606 L 690 650" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ⑩ 送达位点 -->
  <rect x="690" y="644" width="268" height="44" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="824" y="664" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">⑩ 更新送达位点（路径③）</text>
  <text x="824" y="681" text-anchor="middle" font-size="9.5" fill="#92400e">链路收尾，闭环完成</text>

  <!-- 底部注记 -->
  <rect x="24" y="716" width="952" height="104" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="740" font-size="11" fill="#334155">关键观察：seq 在路径②生成、却在路径①被使用——「客户端不认识 seq 的生产者」这件事必须在协议里被容忍</text>
  <text x="44" y="764" font-size="10.5" fill="#334155">状态落点：送达/已读位点＝路径①产生、路径③消费；在线状态＝路径①建立、路径③查询；推送路由＝路径③查表、路径①落地</text>
  <text x="44" y="788" font-size="10.5" fill="#334155">衔接：trace id 在路径②入口生成并一路带进 MQ 与 DB 日志；身份与「来源网关」要逐跳转换、不能丢</text>
</svg>
