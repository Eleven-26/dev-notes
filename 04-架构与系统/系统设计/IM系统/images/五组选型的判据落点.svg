<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 522" width="1000" height="522" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="522" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">五组选型：直觉选的和实际选的，差在哪</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">每一行左边的答案都不算错，只是判据落在另一边</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <text x="30" y="84" font-size="11" fill="#64748b" text-anchor="start" font-weight="bold">选型组</text>
  <text x="178" y="84" font-size="11" fill="#64748b" text-anchor="start" font-weight="bold">看起来该选的</text>
  <text x="424" y="84" font-size="11" fill="#64748b" text-anchor="start" font-weight="bold">判据一句话</text>
  <text x="716" y="84" font-size="11" fill="#64748b" text-anchor="start" font-weight="bold">实际选的</text>
  <text x="30" y="128" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">消息存储</text>
  <rect x="178" y="96" width="236" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="192" y="126" font-size="10.5" fill="#64748b" text-anchor="start">HBase：容量能线性扩</text>
  <text x="192" y="146" font-size="9.5" fill="#94a3b8" text-anchor="start">（不是错，是不够）</text>
  <line x1="678" y1="129" x2="708" y2="129" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <text x="424" y="120" font-size="10.5" fill="#0f172a" text-anchor="start">消息本体与成员位点要在一个事务里落地</text>
  <rect x="716" y="96" width="260" height="66" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.2"/>
  <text x="730" y="126" font-size="11" fill="#7e22ce" text-anchor="start" font-weight="bold">MySQL 按 convID 分表</text>
  <text x="730" y="146" font-size="9.6" fill="#7e22ce" text-anchor="start">本目录的结论</text>
  <text x="30" y="202" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">扇出通道</text>
  <rect x="178" y="170" width="236" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="192" y="200" font-size="10.5" fill="#64748b" text-anchor="start">Kafka：不丢、有序</text>
  <text x="192" y="220" font-size="9.5" fill="#94a3b8" text-anchor="start">（不是错，是不够）</text>
  <line x1="678" y1="203" x2="708" y2="203" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <text x="424" y="194" font-size="10.5" fill="#0f172a" text-anchor="start">推送可以丢 —— 补拉已经兜住了可靠性</text>
  <rect x="716" y="170" width="260" height="66" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="730" y="200" font-size="11" fill="#b45309" text-anchor="start" font-weight="bold">Redis Pub/Sub</text>
  <text x="730" y="220" font-size="9.6" fill="#b45309" text-anchor="start">本目录的结论</text>
  <text x="30" y="276" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">接入层</text>
  <rect x="178" y="244" width="236" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="192" y="274" font-size="10.5" fill="#64748b" text-anchor="start">nginx：现成、稳、扛得住</text>
  <text x="192" y="294" font-size="9.5" fill="#94a3b8" text-anchor="start">（不是错，是不够）</text>
  <line x1="678" y1="277" x2="708" y2="277" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <text x="424" y="268" font-size="10.5" fill="#0f172a" text-anchor="start">它不认你的帧，注册不了「谁在哪台机」</text>
  <rect x="716" y="244" width="260" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="730" y="274" font-size="11" fill="#2563eb" text-anchor="start" font-weight="bold">自研网关（Go / Netty）</text>
  <text x="730" y="294" font-size="9.6" fill="#2563eb" text-anchor="start">本目录的结论</text>
  <text x="30" y="350" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">会话 seq</text>
  <rect x="178" y="318" width="236" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="192" y="348" font-size="10.5" fill="#64748b" text-anchor="start">Redis INCR：最快</text>
  <text x="192" y="368" font-size="9.5" fill="#94a3b8" text-anchor="start">（不是错，是不够）</text>
  <line x1="678" y1="351" x2="708" y2="351" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <text x="424" y="342" font-size="10.5" fill="#0f172a" text-anchor="start">跳号无害，回退致命 —— 位点会跟着回退</text>
  <rect x="716" y="318" width="260" height="66" rx="8" fill="#cffafe" stroke="#0e7490" stroke-width="1.2"/>
  <text x="730" y="348" font-size="11" fill="#0e7490" text-anchor="start" font-weight="bold">事务内自增，撞上限换号段</text>
  <text x="730" y="368" font-size="9.6" fill="#0e7490" text-anchor="start">本目录的结论</text>
  <text x="30" y="424" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">推送通道</text>
  <rect x="178" y="392" width="236" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="192" y="422" font-size="10.5" fill="#64748b" text-anchor="start">正文塞进 payload，省一次拉取</text>
  <text x="192" y="442" font-size="9.5" fill="#94a3b8" text-anchor="start">（不是错，是不够）</text>
  <line x1="678" y1="425" x2="708" y2="425" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <text x="424" y="416" font-size="10.5" fill="#0f172a" text-anchor="start">系统通道只保证「该醒了」，不保证内容</text>
  <rect x="716" y="392" width="260" height="66" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="730" y="422" font-size="11" fill="#15803d" text-anchor="start" font-weight="bold">三级降级，只带提醒</text>
  <text x="730" y="442" font-size="9.6" fill="#15803d" text-anchor="start">本目录的结论</text>
  <text x="30" y="480" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">五组共用同一句问法：这东西的失败模式是什么？</text>
  <text x="316" y="480" font-size="11" fill="#0f172a" text-anchor="start">失败模式是「跳一下」的可以赌，是「退回去」的不能赌；是「少一条」的可以放，是「看到错」的必须拦。</text>
</svg>
