<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="30" y="34" font-size="20" font-weight="bold" fill="#0f172a">多端已读收敛：取 max 让位点只前进</text>
  <text x="30" y="56" font-size="12.5" fill="#475569">两条上报谁先到不确定；seq 数字取自正文 4.1 与 5.3 的示例值，真实并发到达顺序未实测</text>

  <rect x="10" y="72" width="980" height="352" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

  <rect x="80" y="86" width="180" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="400" y="86" width="200" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="740" y="86" width="180" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="170" y="107" font-size="12.5" fill="#1e3a8a" text-anchor="middle">手机端</text>
  <text x="500" y="107" font-size="12.5" fill="#14532d" text-anchor="middle">服务端成员行 lastReadSeq</text>
  <text x="830" y="107" font-size="12.5" fill="#1e3a8a" text-anchor="middle">桌面端</text>

  <line x1="170" y1="120" x2="170" y2="410" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="500" y1="120" x2="500" y2="410" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="830" y1="120" x2="830" y2="410" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>

  <line x1="170" y1="152" x2="488" y2="152" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="330" y="146" font-size="11.5" fill="#334155" text-anchor="middle">① 手机读到 seq 100，上报 lastReadSeq = 100</text>

  <rect x="378" y="176" width="244" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="196" font-size="11.5" fill="#14532d" text-anchor="middle">② max(旧值, 100) = 100</text>

  <line x1="500" y1="232" x2="818" y2="232" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr2)"/>
  <text x="660" y="226" font-size="11.5" fill="#1e3a8a" text-anchor="middle">③ 广播「已读变更」给其他端（见 5.2）</text>

  <line x1="830" y1="268" x2="512" y2="268" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="670" y="262" font-size="11.5" fill="#334155" text-anchor="middle">④ 桌面只读到 seq 80，稍后才上报（顺序不定）</text>

  <rect x="358" y="292" width="284" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="312" font-size="11.5" fill="#14532d" text-anchor="middle">⑤ max(100, 80) = 100：位点不回退</text>

  <line x1="830" y1="348" x2="512" y2="348" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="670" y="342" font-size="11.5" fill="#334155" text-anchor="middle">⑥ 桌面继续读到 seq 120，再次上报</text>

  <rect x="348" y="372" width="304" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="392" font-size="11.5" fill="#14532d" text-anchor="middle">⑦ max(100, 120) = 120：位点继续前进</text>

  <rect x="30" y="440" width="450" height="72" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="255" y="462" font-size="11.5" fill="#7f1d1d" text-anchor="middle">反例：后写覆盖。第 ④ 步直接把 100 冲成 80，</text>
  <text x="255" y="480" font-size="11.5" fill="#7f1d1d" text-anchor="middle">于是 100 − 80 = 20 条被重新标成未读——未读反弹。</text>
  <text x="255" y="498" font-size="11.5" fill="#7f1d1d" text-anchor="middle">已读的语义是「至少读到哪」，不是「这一刻读到哪」</text>

  <rect x="510" y="440" width="460" height="72" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="740" y="462" font-size="11.5" fill="#1e3a8a" text-anchor="middle">别把两种位点混在一起：接收位点分端各存。</text>
  <text x="740" y="480" font-size="11.5" fill="#1e3a8a" text-anchor="middle">手机拉到 seq 90、桌面拉到 seq 120，互不影响；</text>
  <text x="740" y="498" font-size="11.5" fill="#1e3a8a" text-anchor="middle">只有已读位点参与跨端合并（见 5.3）</text>

  <text x="30" y="536" font-size="11.5" fill="#475569">要点：上报是「多端 → 服务端」的汇聚（取 max），同步是「服务端 → 多端」的广播，接收位点是每端自己往前推——三个方向规则相反，不能合并。</text>
</svg>
