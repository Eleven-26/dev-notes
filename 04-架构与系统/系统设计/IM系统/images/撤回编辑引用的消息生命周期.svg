<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <rect x="24" y="86" width="952" height="104" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="40" y="104" width="140" height="40" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <rect x="190" y="104" width="150" height="40" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <rect x="398" y="104" width="150" height="40" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <rect x="606" y="104" width="150" height="40" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <rect x="814" y="104" width="150" height="40" rx="6" fill="#ffedd5" stroke="#ea580c"/>

  <rect x="24" y="206" width="952" height="104" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="40" y="224" width="140" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="190" y="224" width="150" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="398" y="224" width="150" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="606" y="224" width="150" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="814" y="224" width="150" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>

  <rect x="24" y="326" width="952" height="104" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="40" y="344" width="140" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="190" y="344" width="150" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="398" y="344" width="150" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="606" y="344" width="150" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="814" y="344" width="150" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>

  <rect x="24" y="446" width="952" height="76" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">撤回 / 编辑 / 引用：三种操作的消息生命周期</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#475569">三者都不改写已经下发的原消息，而是追加一条新报文去覆盖本地渲染</text>

  <text x="110" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">撤回 Recall</text>
  <text x="265" y="129" text-anchor="middle" font-size="12" fill="#7c2d12">发出（seq = n）</text>
  <text x="473" y="129" text-anchor="middle" font-size="12" fill="#7c2d12">时间窗内可撤</text>
  <text x="681" y="129" text-anchor="middle" font-size="12" fill="#7c2d12">写撤回标记</text>
  <text x="889" y="129" text-anchor="middle" font-size="12" fill="#7c2d12">渲染为墓碑</text>
  <text x="369" y="129" text-anchor="middle" font-size="14" fill="#64748b">→</text>
  <text x="577" y="129" text-anchor="middle" font-size="14" fill="#64748b">→</text>
  <text x="785" y="129" text-anchor="middle" font-size="14" fill="#64748b">→</text>

  <text x="110" y="249" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">编辑 Edit</text>
  <text x="265" y="249" text-anchor="middle" font-size="12" fill="#1e3a8a">发出版本 v1</text>
  <text x="473" y="249" text-anchor="middle" font-size="12" fill="#1e3a8a">编辑生成 v2</text>
  <text x="681" y="249" text-anchor="middle" font-size="12" fill="#1e3a8a">只接受更大版本</text>
  <text x="889" y="249" text-anchor="middle" font-size="12" fill="#1e3a8a">按最新版本渲染</text>
  <text x="369" y="249" text-anchor="middle" font-size="14" fill="#64748b">→</text>
  <text x="577" y="249" text-anchor="middle" font-size="14" fill="#64748b">→</text>
  <text x="785" y="249" text-anchor="middle" font-size="14" fill="#64748b">→</text>

  <text x="110" y="369" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">引用 Quote</text>
  <text x="265" y="369" text-anchor="middle" font-size="12" fill="#14532d">锚点 msgID</text>
  <text x="473" y="369" text-anchor="middle" font-size="12" fill="#14532d">加快照 display</text>
  <text x="681" y="369" text-anchor="middle" font-size="12" fill="#14532d">原文撤回则提示</text>
  <text x="889" y="369" text-anchor="middle" font-size="12" fill="#14532d">转发 = 复制一份</text>
  <text x="369" y="369" text-anchor="middle" font-size="14" fill="#64748b">→</text>
  <text x="577" y="369" text-anchor="middle" font-size="14" fill="#64748b">→</text>
  <text x="785" y="369" text-anchor="middle" font-size="14" fill="#64748b">→</text>

  <text x="40" y="478" font-size="12" fill="#334155">注意：撤回报文可能先于原消息到达；收到「撤回一条还没到的消息」应打撤回标记，</text>
  <text x="40" y="502" font-size="12" fill="#334155">等消息本体到达后再渲染为墓碑。三者都要处理乱序与幂等，且都是命令类报文。</text>

  <text x="500" y="546" text-anchor="middle" font-size="11" fill="#64748b">要点：撤回是命令、编辑是版本链、引用是锚点 + 快照 —— 都靠「追加新报文」而非改写原文</text>
</svg>
