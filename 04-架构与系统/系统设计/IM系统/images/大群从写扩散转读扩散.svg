<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <rect x="24" y="86" width="464" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="24" y="86" width="464" height="36" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="48" y="138" width="416" height="48" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="48" y="210" width="416" height="48" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="48" y="282" width="416" height="48" rx="6" fill="#dbeafe" stroke="#2563eb"/>

  <rect x="512" y="86" width="464" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="512" y="86" width="464" height="36" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="536" y="138" width="416" height="48" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="536" y="210" width="416" height="48" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="536" y="282" width="416" height="48" rx="6" fill="#dcfce7" stroke="#16a34a"/>

  <rect x="24" y="404" width="952" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">大群从写扩散转读扩散</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#475569">扇出量随成员数线性放大：成员少用写扩散，成员多用读扩散把成本移到读侧</text>

  <text x="40" y="110" font-size="13" font-weight="700" fill="#1e3a8a">小群：写扩散（fan-out on write）</text>
  <text x="256" y="167" text-anchor="middle" font-size="12" fill="#1e3a8a">1 条消息只写 1 次</text>
  <text x="256" y="200" text-anchor="middle" font-size="14" fill="#64748b">↓</text>
  <text x="256" y="239" text-anchor="middle" font-size="12" fill="#1e3a8a">服务端扇出 N 份到各成员收件箱</text>
  <text x="256" y="271" text-anchor="middle" font-size="14" fill="#64748b">↓</text>
  <text x="256" y="311" text-anchor="middle" font-size="12" fill="#1e3a8a">成员读自己的收件箱（读 1 次）</text>
  <text x="48" y="362" font-size="11" fill="#475569">写放大：N 倍；读放大：1 倍</text>

  <text x="528" y="110" font-size="13" font-weight="700" fill="#14532d">大群：读扩散（fan-out on read）</text>
  <text x="744" y="167" text-anchor="middle" font-size="12" fill="#14532d">1 条消息只写 1 份到会话流</text>
  <text x="744" y="200" text-anchor="middle" font-size="14" fill="#64748b">↓</text>
  <text x="744" y="239" text-anchor="middle" font-size="12" fill="#14532d">读取时按成员表扇出</text>
  <text x="744" y="271" text-anchor="middle" font-size="14" fill="#64748b">↓</text>
  <text x="744" y="311" text-anchor="middle" font-size="12" fill="#14532d">成员各自按时序拉取</text>
  <text x="536" y="362" font-size="11" fill="#475569">写放大：1 倍；读放大：N 倍</text>

  <text x="40" y="432" font-size="12" fill="#334155">判据：比「写放大」与「读放大」哪个更贵 —— 成员多且活跃少 → 读扩散；成员少且读多 → 写扩散</text>
  <text x="40" y="456" font-size="12" fill="#334155">大群特有限制：成员上限 / @所有人 限频或限角色 / 群消息频率限流</text>
  <text x="40" y="480" font-size="12" fill="#334155">成员缓存：热群成员表缓存 + 成员变更时失效；成员多时「分页拉取」而非全量下发</text>
  <text x="40" y="504" font-size="12" fill="#334155">已读回执：大群通常只保留「已读人数」聚合，不保留逐人明细（回执扇出同样爆炸）</text>
  <text x="40" y="528" font-size="12" fill="#64748b">写扩散 / 读扩散的判据与代价见 消息可靠投递.md 第三节，本篇不复述</text>
</svg>
