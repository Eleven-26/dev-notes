<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <rect x="40" y="80" width="430" height="490" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="530" y="80" width="430" height="490" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <rect x="70" y="140" width="370" height="110" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <rect x="70" y="290" width="370" height="110" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="70" y="440" width="370" height="110" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>

  <rect x="560" y="140" width="360" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <rect x="560" y="270" width="360" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="560" y="400" width="360" height="90" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>

  <path d="M 560 185 L 450 195" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 560 315 L 450 345" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 560 445 L 450 495" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <text x="30" y="42" font-size="19" fill="#0f172a">历史消息冷热分层与按需拉取：只取所需的那一层</text>

  <text x="64" y="112" font-size="15" fill="#1e3a8a">存储分层：按「会不会被再读」逐层下沉</text>
  <text x="255" y="180" font-size="15" fill="#1e3a8a" text-anchor="middle">热层：最近一段消息</text>
  <text x="255" y="212" font-size="13" fill="#334155" text-anchor="middle">Redis / 库中近期，漫游与首屏都读它</text>
  <text x="255" y="330" font-size="15" fill="#14532d" text-anchor="middle">温层：较长一段时间的历史</text>
  <text x="255" y="362" font-size="13" fill="#334155" text-anchor="middle">MySQL 分库分表，按 seq 游标读</text>
  <text x="255" y="480" font-size="15" fill="#334155" text-anchor="middle">冷层：更久远的归档</text>
  <text x="255" y="512" font-size="13" fill="#334155" text-anchor="middle">对象存储 / 列存文件，极少回读</text>

  <text x="554" y="112" font-size="15" fill="#7c2d12">按需拉取：三条路径各自只取一层</text>
  <text x="740" y="180" font-size="14" fill="#1e3a8a" text-anchor="middle">① 进入会话 → 拉最近一屏</text>
  <text x="740" y="208" font-size="12" fill="#334155" text-anchor="middle">游标取最新，只拉一屏</text>
  <text x="740" y="310" font-size="14" fill="#14532d" text-anchor="middle">② 上翻历史 → 游标向旧推进</text>
  <text x="740" y="338" font-size="12" fill="#334155" text-anchor="middle">不重不漏，见会话与未读篇</text>
  <text x="740" y="440" font-size="14" fill="#334155" text-anchor="middle">③ 搜索命中 → 按 seq 直达定位</text>
  <text x="740" y="468" font-size="12" fill="#334155" text-anchor="middle">跳转后上下各取一屏上下文</text>

  <text x="40" y="598" font-size="12" fill="#64748b">说明：本图为结构示意，非实测；未标注任何冷热分界的条数或时间窗口。</text>
</svg>
