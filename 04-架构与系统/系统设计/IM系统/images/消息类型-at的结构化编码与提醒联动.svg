<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">@ 的编码：结构化进 payload，而不是靠文本匹配</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#475569">字段取自 6.1 的 payload.mentions（示例值同正文）；判据来自 6.2 / 6.3，图中不含任何频率数字</text>

  <!-- 左上：编码形态 -->
  <rect x="24" y="82" width="600" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="108" font-size="14" font-weight="bold" fill="#334155">payload.mentions：userID + offset / len</text>
  <text x="44" y="128" font-size="10.5" fill="#64748b">文本只是字符序列；高亮与跳转全靠结构化偏移</text>

  <rect x="44" y="142" width="560" height="52" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="60" y="164" font-size="11" font-weight="bold" fill="#1e3a8a">mentions[0]：userID = u1001</text>
  <text x="60" y="182" font-size="9.5" fill="#1e3a8a">offset = 0，len = 3 —— 文本第 0~3 字是 @u1001</text>

  <rect x="44" y="202" width="560" height="52" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="60" y="224" font-size="11" font-weight="bold" fill="#7c2d12">mentions[1]：userID = all（保留 ID）</text>
  <text x="60" y="242" font-size="9.5" fill="#7c2d12">offset = 12，len = 4 —— @所有人，不塞进普通成员列表</text>

  <text x="44" y="272" font-size="10" fill="#334155">为什么：昵称可改、可重名，只有 userID 稳定</text>
  <text x="44" y="292" font-size="10" fill="#334155">带 offset/len：渲染时才能高亮成蓝色可点区域，否则整段当普通文本</text>
  <text x="44" y="312" font-size="10" fill="#334155">服务端落库时索引「这条消息 @了谁」，不让客户端从文本里猜</text>

  <!-- 右上：我未读联动 -->
  <rect x="640" y="82" width="336" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="660" y="108" font-size="14" font-weight="bold" fill="#334155">@我：独立计数，一起清</text>
  <text x="660" y="132" font-size="10.5" fill="#334155">群免打扰时，「@我」仍能提醒</text>

  <rect x="660" y="146" width="296" height="48" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="676" y="166" font-size="10" fill="#14532d">群里 100 条未读里，有 2 条 @我</text>
  <text x="676" y="184" font-size="10" fill="#14532d">列表显示「[2 条@我]」，独立于群未读</text>

  <rect x="660" y="202" width="296" height="48" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="676" y="222" font-size="10" fill="#14532d">它仍是同一条消息：已读时</text>
  <text x="676" y="240" font-size="10" fill="#14532d">群未读与 @我计数一起清，不错位</text>

  <text x="660" y="276" font-size="10" fill="#64748b">收敛规则见「会话与未读」第四节</text>
  <text x="660" y="296" font-size="10" fill="#64748b">@ 是消息的属性，不是另一条消息</text>

  <!-- 底：at所有人限制 + 反例 -->
  <rect x="24" y="348" width="952" height="190" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="372" font-size="14" font-weight="bold" fill="#334155">@所有人 = 一条受权限与频率限制的特殊 @</text>

  <rect x="44" y="386" width="292" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="60" y="404" font-size="10.5" font-weight="bold" fill="#1e3a8a">角色限制</text>
  <text x="60" y="422" font-size="9.5" fill="#1e3a8a">只有群主 / 管理员可 @所有人</text>

  <rect x="352" y="386" width="292" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="368" y="404" font-size="10.5" font-weight="bold" fill="#1e3a8a">频率限制</text>
  <text x="368" y="422" font-size="9.5" fill="#1e3a8a">服务端限频 / 限每日次数</text>

  <rect x="660" y="386" width="292" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="676" y="404" font-size="10.5" font-weight="bold" fill="#1e3a8a">规模相关</text>
  <text x="676" y="422" font-size="9.5" fill="#1e3a8a">成员越多扇出越大，大群可能直接不允许</text>

  <text x="44" y="480" font-size="10.5" fill="#7c2d12">反例：把「@你」做成第二条消息——未读、排序、去重全部对不上</text>
  <text x="44" y="512" font-size="11" fill="#64748b">要点：先结构化编码目标，再按保留 ID 走特殊权限——普通 @ 与 @所有人 共用一个 mentions 列表</text>
</svg>
