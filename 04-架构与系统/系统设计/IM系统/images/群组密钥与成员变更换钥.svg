<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ===== 所有矩形 ===== -->
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <rect x="50" y="96" width="900" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="50" y="196" width="900" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="50" y="286" width="900" height="70" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="50" y="376" width="900" height="70" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="50" y="466" width="440" height="76" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="510" y="466" width="440" height="76" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="50" y="562" width="900" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ===== 阶段箭头 ===== -->
  <path d="M 120 177 L 120 194" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 120 267 L 120 284" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 120 357 L 120 374" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 120 447 L 120 464" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== 标题 ===== -->
  <text x="30" y="40" font-size="21" font-weight="bold" fill="#0f172a">群组密钥与成员变更换钥</text>
  <text x="30" y="68" font-size="13" fill="#475569">群组密钥是一次群发、N 人共享的一把钥匙；成员一变，共享范围就变，必须换钥。</text>

  <!-- ===== 阶段一 ===== -->
  <text x="70" y="126" font-size="14" font-weight="bold" fill="#1e3a8a">初始状态：群组密钥 GK1 分发给成员 A / B / C</text>
  <text x="70" y="150" font-size="12" fill="#1e3a8a">每个成员各自持有一份发送链密钥（Sender Key），用于加密自己发出的消息</text>

  <!-- ===== 阶段二 ===== -->
  <text x="70" y="226" font-size="14" font-weight="bold" fill="#14532d">正常收发：服务器按「谁在群里」把密文分发给 N 个成员</text>
  <text x="70" y="250" font-size="12" fill="#166534">服务器只转发密文，既不持有 GK1，也不需要解密</text>

  <!-- ===== 阶段三 ===== -->
  <text x="70" y="316" font-size="14" font-weight="bold" fill="#7c2d12">成员变更：新成员 D 加入 / 成员 C 退出</text>
  <text x="70" y="340" font-size="12" fill="#9a3412">成员集合变了 → 旧 GK1 的「可见范围」与新的安全边界对不上</text>

  <!-- ===== 阶段四 ===== -->
  <text x="70" y="406" font-size="14" font-weight="bold" fill="#7c2d12">换钥：生成 GK2，只发给变更后的成员集合</text>
  <text x="70" y="430" font-size="12" fill="#9a3412">退出的 C 不在接收名单里；加入的 D 只拿到 GK2，拿不到 GK1</text>

  <!-- ===== 两条路线 ===== -->
  <text x="70" y="496" font-size="13" font-weight="bold" fill="#1e3a8a">路线一：Sender Keys</text>
  <text x="70" y="520" font-size="12" fill="#1e3a8a">成员各维护自己的发送链，逐条派生消息密钥；</text>
  <text x="70" y="538" font-size="12" fill="#1e3a8a">换钥即更换自己的发送链</text>

  <text x="530" y="496" font-size="13" font-weight="bold" fill="#14532d">路线二：群组密钥协商（MLS）</text>
  <text x="530" y="520" font-size="12" fill="#166534">成员共同维护一棵密钥树，成员变更只更新树的一支；</text>
  <text x="530" y="538" font-size="12" fill="#166534">重新分发的范围更小</text>

  <!-- ===== 底部要点 ===== -->
  <text x="70" y="588" font-size="13" font-weight="bold" fill="#0f172a">要点：成员一变，共享范围就变 → 必须换钥；换钥保护的是「之后」的消息。</text>
  <text x="70" y="610" font-size="12" fill="#334155">历史可读性：新人能否看到入群前的历史、退出者能否再解旧密文，取决于是否用新钥重加密历史，代价是重加密成本。</text>
  <text x="70" y="628" font-size="12" fill="#64748b">注意：本篇未做实测，无读数；两条路线只讲取舍，不展开算法细节。</text>
</svg>
