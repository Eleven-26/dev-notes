<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="444" viewBox="0 0 1000 444" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="444" fill="#ffffff"/>
  <text x="24" y="32" font-size="19" font-weight="bold" fill="#0f172a">富媒体各模态的异步机审通道与统一下游</text>
  <text x="24" y="56" font-size="12" fill="#475569">横看一行是一个模态从取内容到出判定；五个模态的差别止于识别方式，之后汇入右侧同一条下游。</text>

  <text x="24" y="70" font-size="10.5" fill="#64748b">模态</text>
  <text x="124" y="70" font-size="10.5" fill="#64748b">第一步：取出待审对象</text>
  <text x="350" y="70" font-size="10.5" fill="#64748b">第二步：识别与判定</text>
  <text x="672" y="70" font-size="10.5" fill="#64748b">共用的下游</text>

  <rect x="24" y="78" width="84" height="52" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <rect x="24" y="140" width="84" height="52" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <rect x="24" y="202" width="84" height="52" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <rect x="24" y="264" width="84" height="52" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <rect x="24" y="326" width="84" height="52" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <rect x="124" y="78" width="210" height="52" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.2"/>
  <rect x="124" y="140" width="210" height="52" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.2"/>
  <rect x="124" y="202" width="210" height="52" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.2"/>
  <rect x="124" y="264" width="210" height="52" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.2"/>
  <rect x="124" y="326" width="210" height="52" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.2"/>
  <rect x="350" y="78" width="282" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="350" y="140" width="282" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="350" y="202" width="282" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="350" y="264" width="282" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="350" y="326" width="282" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="672" y="78" width="298" height="300" rx="6" fill="#ffedd5" stroke="#b45309" stroke-width="1.5"/>
  <rect x="690" y="162" width="262" height="1" fill="#b45309"/>
  <rect x="690" y="266" width="262" height="1" fill="#b45309"/>

  <text x="66" y="109" font-size="13" fill="#475569" text-anchor="middle">图片</text>
  <text x="66" y="171" font-size="13" fill="#475569" text-anchor="middle">音频</text>
  <text x="66" y="233" font-size="13" fill="#475569" text-anchor="middle">视频</text>
  <text x="66" y="295" font-size="13" fill="#475569" text-anchor="middle">文件</text>
  <text x="66" y="357" font-size="13" fill="#475569" text-anchor="middle">链接</text>

  <text x="229" y="109" font-size="12" fill="#14532d" text-anchor="middle">下载并解码出像素</text>
  <text x="229" y="171" font-size="12" fill="#14532d" text-anchor="middle">ASR 转成文本</text>
  <text x="229" y="233" font-size="12" fill="#14532d" text-anchor="middle">抽帧取画面、分离音轨</text>
  <text x="229" y="295" font-size="12" fill="#14532d" text-anchor="middle">解包并按类型分流</text>
  <text x="229" y="357" font-size="12" fill="#14532d" text-anchor="middle">抓取落地页内容</text>

  <text x="491" y="100" font-size="12" fill="#1e40af" text-anchor="middle">图像模型打分</text>
  <text x="491" y="119" font-size="10.5" fill="#64748b" text-anchor="middle">难点：变体多、对抗样本</text>
  <text x="491" y="162" font-size="12" fill="#1e40af" text-anchor="middle">转文本后走文本审核，叠加声学特征</text>
  <text x="491" y="181" font-size="10.5" fill="#64748b" text-anchor="middle">难点：转写误差、方言与噪声</text>
  <text x="491" y="224" font-size="12" fill="#1e40af" text-anchor="middle">抽帧审画面、音轨审声音、审字幕</text>
  <text x="491" y="243" font-size="10.5" fill="#64748b" text-anchor="middle">难点：数据量大、时序长、成本高</text>
  <text x="491" y="286" font-size="12" fill="#1e40af" text-anchor="middle">按内容类型进对应通道</text>
  <text x="491" y="305" font-size="10.5" fill="#64748b" text-anchor="middle">难点：格式杂、可能恶意构造</text>
  <text x="491" y="348" font-size="12" fill="#1e40af" text-anchor="middle">审抓取到的页面内容</text>
  <text x="491" y="367" font-size="10.5" fill="#64748b" text-anchor="middle">难点：落地页可变、短链跳转、防 SSRF</text>

  <text x="821" y="104" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">五个模态汇入同一条下游</text>
  <text x="821" y="128" font-size="11.5" fill="#78350f" text-anchor="middle">① 与发送主链路并行，不阻塞投递</text>
  <text x="821" y="150" font-size="11.5" fill="#78350f" text-anchor="middle">② 结果事后补，不写进上行 ACK</text>
  <text x="821" y="188" font-size="11.5" fill="#78350f" text-anchor="middle">③ 命中分级：放行 / 疑似 / 确定</text>
  <text x="821" y="210" font-size="11.5" fill="#78350f" text-anchor="middle">④ 高疑似进抽样人审</text>
  <text x="821" y="232" font-size="11.5" fill="#78350f" text-anchor="middle">⑤ 滞后命中走回溯处置</text>
  <text x="821" y="254" font-size="11.5" fill="#78350f" text-anchor="middle">⑥ 撤回 / 删除 / 限权</text>
  <text x="821" y="290" font-size="10.5" fill="#78350f" text-anchor="middle">分级的完整口径与申诉通道</text>
  <text x="821" y="308" font-size="10.5" fill="#78350f" text-anchor="middle">已由机审人审链路图承载</text>
  <text x="821" y="344" font-size="10.5" fill="#78350f" text-anchor="middle">差别止于识别，处置口径相同</text>

  <line x1="108" y1="104" x2="122" y2="104" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="108" y1="166" x2="122" y2="166" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="108" y1="228" x2="122" y2="228" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="108" y1="290" x2="122" y2="290" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="108" y1="352" x2="122" y2="352" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="334" y1="104" x2="348" y2="104" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="334" y1="166" x2="348" y2="166" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="334" y1="228" x2="348" y2="228" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="334" y1="290" x2="348" y2="290" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="334" y1="352" x2="348" y2="352" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="632" y1="104" x2="670" y2="104" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="632" y1="166" x2="670" y2="166" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="632" y1="228" x2="670" y2="228" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="632" y1="290" x2="670" y2="290" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="632" y1="352" x2="670" y2="352" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr2)"/>

  <text x="24" y="404" font-size="11.5" fill="#475569">要点：富媒体审核的每一步都是慢操作——下载、解码、推理、必要时人工；同步进发送链路会把审核服务的抖动放大成发送故障。</text>
  <text x="24" y="426" font-size="11.5" fill="#64748b">例外：陌生人首条等高风险场景才局部用先审后发。本篇未做实测，本图不含识别准确率、延迟或成本数字。</text>
</svg>
