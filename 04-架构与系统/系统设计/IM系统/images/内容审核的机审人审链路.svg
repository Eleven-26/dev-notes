<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ===== 所有矩形 ===== -->
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <!-- 主链路 -->
  <rect x="50" y="118" width="205" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="275" y="118" width="205" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="500" y="118" width="205" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="725" y="118" width="225" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>

  <!-- 审核旁路 -->
  <rect x="50" y="230" width="205" height="64" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="275" y="230" width="205" height="64" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="500" y="230" width="205" height="64" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="725" y="230" width="225" height="64" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>

  <!-- 处置动作 -->
  <rect x="50" y="340" width="205" height="64" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="275" y="340" width="205" height="64" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="500" y="340" width="205" height="64" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="725" y="340" width="225" height="64" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

  <!-- 申诉 -->
  <rect x="50" y="440" width="900" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 底部要点 -->
  <rect x="50" y="520" width="920" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ===== 箭头 ===== -->
  <path d="M 256 150 L 273 150" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 481 150 L 498 150" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 706 150 L 723 150" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <path d="M 256 262 L 273 262" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 481 262 L 498 262" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 706 262 L 723 262" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <path d="M 256 372 L 273 372" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 481 372 L 498 372" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 706 372 L 723 372" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <path d="M 152 183 L 152 228" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M 152 295 L 152 338" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M 152 405 L 152 438" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ===== 标题 ===== -->
  <text x="30" y="40" font-size="21" font-weight="bold" fill="#0f172a">内容审核的机审人审链路</text>
  <text x="30" y="68" font-size="13" fill="#475569">审核发生在「消息已经发出去之后」：主链路先发后审，审核挂在异步旁路上。</text>

  <!-- ===== 主链路 ===== -->
  <text x="50" y="110" font-size="13" font-weight="bold" fill="#1e3a8a">主链路：先发后审，发送不被审核阻塞</text>
  <text x="152" y="146" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">① 用户发送</text>
  <text x="152" y="168" font-size="11.5" fill="#1d4ed8" text-anchor="middle">客户端乐观上屏</text>
  <text x="377" y="146" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">② 服务端接收</text>
  <text x="377" y="168" font-size="11.5" fill="#1d4ed8" text-anchor="middle">立即回上行 ACK</text>
  <text x="602" y="146" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">③ 落库 + 投递</text>
  <text x="602" y="168" font-size="11.5" fill="#1d4ed8" text-anchor="middle">分配 seq 后存储转发</text>
  <text x="837" y="146" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">④ 对端可见</text>
  <text x="837" y="168" font-size="11.5" fill="#1d4ed8" text-anchor="middle">此时审核可能还没跑完</text>

  <!-- ===== 审核旁路 ===== -->
  <text x="300" y="222" font-size="13" font-weight="bold" fill="#14532d">审核旁路：异步执行，与发送主链路解耦</text>
  <text x="152" y="258" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">⑤ 审核任务入队</text>
  <text x="152" y="280" font-size="11.5" fill="#166534" text-anchor="middle">与投递同一份内容</text>
  <text x="377" y="258" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">⑥ 机审</text>
  <text x="377" y="272" font-size="10.5" fill="#166534" text-anchor="middle">文本 / 图片 / 音频</text>
  <text x="377" y="287" font-size="10.5" fill="#166534" text-anchor="middle">视频 / 文件 / 链接</text>
  <text x="602" y="258" font-size="13" font-weight="bold" fill="#7c2d12" text-anchor="middle">⑦ 命中分级</text>
  <text x="602" y="280" font-size="11.5" fill="#9a3412" text-anchor="middle">放行 / 疑似 / 确定</text>
  <text x="837" y="258" font-size="13" font-weight="bold" fill="#7c2d12" text-anchor="middle">⑧ 抽样人审</text>
  <text x="837" y="280" font-size="11.5" fill="#9a3412" text-anchor="middle">高疑似与申诉队列</text>

  <!-- ===== 处置 ===== -->
  <text x="300" y="332" font-size="13" font-weight="bold" fill="#334155">命中后的处置动作：按严重程度分级，逐级加码</text>
  <text x="152" y="378" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">警告 / 提醒</text>
  <text x="377" y="378" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">禁言（限时 / 永久）</text>
  <text x="602" y="378" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">删除内容 / 撤回</text>
  <text x="837" y="378" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">封禁账号</text>

  <!-- ===== 申诉 ===== -->
  <text x="500" y="474" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">⑨ 用户申诉 → 人工复核 → 撤销处置 / 维持处置</text>

  <!-- ===== 底部要点 ===== -->
  <text x="70" y="548" font-size="13" font-weight="bold" fill="#0f172a">要点：主链路先发后审，审核挂在异步旁路，绝不阻塞发送；命中分级后再决定处置。</text>
  <text x="70" y="576" font-size="12" fill="#334155">处置要分级并可申诉：先警告与限流，再禁言，最后封禁；没有申诉入口，误伤就无法纠正。</text>
  <text x="70" y="602" font-size="12" fill="#64748b">注意：本篇未做实测，无读数；本图为流程示意，不含任何拦截率或准确率数字。</text>
</svg>
