<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <rect x="40" y="72" width="920" height="230" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="80" y="150" width="190" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="390" y="150" width="190" height="58" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="700" y="150" width="190" height="58" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <rect x="40" y="342" width="920" height="230" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="80" y="430" width="210" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="375" y="430" width="190" height="58" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="690" y="430" width="190" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>

  <path d="M 274 179 L 386 179" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 584 179 L 696 179" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 294 459 L 371 459" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 569 459 L 686 459" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 485 208 L 485 426" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>

  <text x="30" y="42" font-size="19" fill="#0f172a">富媒体上传与发送解耦：字节走一条路，消息走另一条路</text>

  <text x="64" y="106" font-size="15" fill="#1e3a8a">① 上传路径：字节直连对象存储，业务节点不背数据流</text>
  <text x="175" y="184" font-size="15" fill="#1e3a8a" text-anchor="middle">客户端上传</text>
  <text x="485" y="184" font-size="15" fill="#14532d" text-anchor="middle">对象存储</text>
  <text x="795" y="184" font-size="15" fill="#334155" text-anchor="middle">CDN 边缘节点</text>
  <text x="328" y="170" font-size="12" fill="#334155" text-anchor="middle">凭短期凭证直传</text>
  <text x="640" y="170" font-size="12" fill="#334155" text-anchor="middle">按读缓存分发</text>
  <text x="80" y="270" font-size="13" fill="#334155">分片上传、断点续传、秒传都发生在这一侧。</text>

  <text x="64" y="376" font-size="15" fill="#7c2d12">② 发消息路径：消息体只放 URL + 元数据，走正常投递</text>
  <text x="185" y="464" font-size="15" fill="#1e3a8a" text-anchor="middle">客户端发消息</text>
  <text x="470" y="464" font-size="15" fill="#7c2d12" text-anchor="middle">消息服务</text>
  <text x="785" y="464" font-size="15" fill="#1e3a8a" text-anchor="middle">接收方客户端</text>
  <text x="80" y="540" font-size="13" fill="#334155">消息本体和文本消息一样小，可靠投递与多端同步都复用它。</text>

  <text x="505" y="330" font-size="13" fill="#14532d">③ 上传成功 → 拿到 URL + 元数据，再组装消息体投递</text>

  <text x="40" y="608" font-size="12" fill="#64748b">说明：本图为结构示意，非真实抓包；未标注任何上传速度、转码耗时或 CDN 命中率数字。</text>
</svg>
