<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Redis 的键空间：五个前缀、四种结构、三档 TTL</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">带 TTL 的可以丢，不带 TTL 的必须能从 MySQL 重建</text>
  <line x1="120" y1="215" x2="168" y2="100" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="168" y="74" width="152" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="182" y="96" font-size="12.5" font-weight="bold" fill="#ea580c">route:</text>
  <text x="182" y="114" font-size="10.5" fill="#0f172a">连接路由</text>
  <line x1="320" y1="100" x2="372" y2="100" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="372" y="87" width="604" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="384" y="105" font-size="10.8" fill="#0f172a">im:route:{uid}</text>
  <text x="620" y="105" font-size="10.2" font-weight="bold" fill="#ea580c">Hash</text>
  <text x="684" y="105" font-size="10.2" fill="#64748b">connID → gateway|ts</text>
  <text x="916" y="105" font-size="10.2" fill="#b45309">90s 续期</text>
  <line x1="120" y1="215" x2="168" y2="176" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="168" y="142" width="152" height="68" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="182" y="164" font-size="12.5" font-weight="bold" fill="#2563eb">conv:</text>
  <text x="182" y="182" font-size="10.5" fill="#0f172a">会话热数据</text>
  <line x1="320" y1="176" x2="372" y2="161" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="372" y="148" width="604" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="384" y="166" font-size="10.8" fill="#0f172a">im:conv:msg:{convID}</text>
  <text x="620" y="166" font-size="10.2" font-weight="bold" fill="#2563eb">ZSet</text>
  <text x="684" y="166" font-size="10.2" fill="#64748b">score=seq, member=msgID</text>
  <text x="916" y="166" font-size="10.2" fill="#b45309">7d</text>
  <line x1="320" y1="176" x2="372" y2="191" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="372" y="178" width="604" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="384" y="196" font-size="10.8" fill="#0f172a">im:seq:{convID}</text>
  <text x="620" y="196" font-size="10.2" font-weight="bold" fill="#2563eb">Hash</text>
  <text x="684" y="196" font-size="10.2" fill="#64748b">号段 {cur, max}（仅号段档）</text>
  <text x="916" y="196" font-size="10.2" fill="#b45309">无</text>
  <line x1="120" y1="215" x2="168" y2="275" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="168" y="226" width="152" height="98" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="182" y="248" font-size="12.5" font-weight="bold" fill="#15803d">user:</text>
  <text x="182" y="266" font-size="10.5" fill="#0f172a">用户侧</text>
  <line x1="320" y1="275" x2="372" y2="245" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="372" y="232" width="604" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="384" y="250" font-size="10.8" fill="#0f172a">im:inbox:{uid}</text>
  <text x="620" y="250" font-size="10.2" font-weight="bold" fill="#15803d">ZSet</text>
  <text x="684" y="250" font-size="10.2" fill="#64748b">score=seq, member=convID:seq</text>
  <text x="916" y="250" font-size="10.2" fill="#b45309">7d</text>
  <line x1="320" y1="275" x2="372" y2="275" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="372" y="262" width="604" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="384" y="280" font-size="10.8" fill="#0f172a">im:unread:{uid}</text>
  <text x="620" y="280" font-size="10.2" font-weight="bold" fill="#15803d">Hash</text>
  <text x="684" y="280" font-size="10.2" fill="#64748b">convID → 计数（可重算）</text>
  <text x="916" y="280" font-size="10.2" fill="#b45309">无</text>
  <line x1="320" y1="275" x2="372" y2="305" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="372" y="292" width="604" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="384" y="310" font-size="10.8" fill="#0f172a">im:cursor:{uid}:{convID}</text>
  <text x="620" y="310" font-size="10.2" font-weight="bold" fill="#15803d">Hash</text>
  <text x="684" y="310" font-size="10.2" fill="#64748b">deviceID → 每端已同步 seq</text>
  <text x="916" y="310" font-size="10.2" fill="#b45309">30d</text>
  <line x1="120" y1="215" x2="168" y2="366" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="168" y="340" width="152" height="52" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.2"/>
  <text x="182" y="362" font-size="12.5" font-weight="bold" fill="#7e22ce">group:</text>
  <text x="182" y="380" font-size="10.5" fill="#0f172a">群成员缓存</text>
  <line x1="320" y1="366" x2="372" y2="366" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="372" y="353" width="604" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="384" y="371" font-size="10.8" fill="#0f172a">im:group:members:{gid}</text>
  <text x="620" y="371" font-size="10.2" font-weight="bold" fill="#7e22ce">Set</text>
  <text x="684" y="371" font-size="10.2" fill="#64748b">超阈值要分桶或本地缓存</text>
  <text x="916" y="371" font-size="10.2" fill="#b45309">1h</text>
  <line x1="120" y1="215" x2="168" y2="434" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="168" y="408" width="152" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="182" y="430" font-size="12.5" font-weight="bold" fill="#dc2626">dedup:</text>
  <text x="182" y="448" font-size="10.5" fill="#0f172a">幂等第一道</text>
  <line x1="320" y1="434" x2="372" y2="434" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="372" y="421" width="604" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="384" y="439" font-size="10.8" fill="#0f172a">im:dedup:{conv}:{cmid}</text>
  <text x="620" y="439" font-size="10.2" font-weight="bold" fill="#dc2626">String</text>
  <text x="684" y="439" font-size="10.2" fill="#64748b">SET NX PX 600000</text>
  <text x="916" y="439" font-size="10.2" fill="#b45309">10min</text>
  <rect x="24" y="193" width="96" height="44" rx="8" fill="#0f172a" stroke="#0f172a"/>
  <text x="72" y="221" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">im:</text>
  <rect x="24" y="470" width="952" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="492" font-size="11" fill="#0f172a">写成 {convID} 这种花括号是 Cluster 的 hash tag：ZADD 与 EXPIRE 要落同一个 slot，否则 Lua 脚本会被拒绝。</text>
</svg>
