<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>
  <rect x="80" y="70" width="200" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="400" y="70" width="200" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="720" y="70" width="200" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>

  <line x1="180" y1="114" x2="180" y2="610" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="500" y1="114" x2="500" y2="610" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="820" y1="114" x2="820" y2="610" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>

  <path d="M 180 150 L 500 150" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 500 195 L 820 195" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 820 240 L 500 240" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 500 280 L 180 280" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 820 330 L 500 330" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 500 370 L 180 370" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 180 425 L 500 425" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr2)"/>
  <path d="M 500 455 L 820 455" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr2)"/>
  <path d="M 820 492 L 500 492" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr2)"/>
  <path d="M 500 522 L 180 522" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr2)"/>
  <path d="M 180 560 L 500 560" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 500 588 L 820 588" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <text x="30" y="40" font-size="19" fill="#0f172a">一次呼叫的信令时序：全部走 IM 的可靠有序通道</text>

  <text x="180" y="98" font-size="13" fill="#1e3a8a" text-anchor="middle">主叫 A（客户端）</text>
  <text x="500" y="98" font-size="13" fill="#14532d" text-anchor="middle">IM 服务（信令通道）</text>
  <text x="820" y="98" font-size="13" fill="#1e3a8a" text-anchor="middle">被叫 B（客户端）</text>

  <text x="340" y="144" font-size="12" fill="#334155" text-anchor="middle">① 邀请 invite（带呼叫 ID）</text>
  <text x="660" y="189" font-size="12" fill="#334155" text-anchor="middle">② 呼叫推送 / 来电通知</text>
  <text x="660" y="234" font-size="12" fill="#334155" text-anchor="middle">③ 振铃 ringing</text>
  <text x="340" y="274" font-size="12" fill="#334155" text-anchor="middle">④ 转发振铃</text>
  <text x="660" y="324" font-size="12" fill="#334155" text-anchor="middle">⑤ 接听 answer</text>
  <text x="340" y="364" font-size="12" fill="#334155" text-anchor="middle">⑥ 转发接听</text>
  <text x="340" y="419" font-size="12" fill="#1e3a8a" text-anchor="middle">⑦ offer / answer 交换</text>
  <text x="660" y="449" font-size="12" fill="#1e3a8a" text-anchor="middle">转发 offer / answer</text>
  <text x="660" y="486" font-size="12" fill="#1e3a8a" text-anchor="middle">⑧ ICE candidate 交换</text>
  <text x="340" y="516" font-size="12" fill="#1e3a8a" text-anchor="middle">转发 candidate</text>
  <text x="340" y="554" font-size="12" fill="#334155" text-anchor="middle">⑨ 挂断 bye</text>
  <text x="660" y="582" font-size="12" fill="#334155" text-anchor="middle">转发挂断</text>

  <text x="30" y="646" font-size="12" fill="#94a3b8">说明：本图为信令时序示意，不含接通耗时、媒体时延等任何数字；真实行为依赖网络与终端，正文均标为「未实测」。</text>
  <text x="30" y="672" font-size="12" fill="#94a3b8">要点：信令必须可靠有序，故走 IM 的可靠报文而非 Pub/Sub；媒体面（SRTP）不在本图范围内。</text>
</svg>
