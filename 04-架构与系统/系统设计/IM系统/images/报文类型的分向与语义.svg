<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="508" viewBox="0 0 1000 508" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="508" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">报文类型：按方向 × 按语义</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#475569">方向决定谁处理；语义决定要不要落库、要不要 ACK、能不能丢</text>

  <rect x="24" y="86" width="452" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="44" y="126" width="196" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="252" y="126" width="196" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="44" y="176" width="196" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="252" y="176" width="196" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="44" y="112" font-size="14" font-weight="700" fill="#334155">上行（客户端 → 服务端）</text>
  <text x="142" y="152" text-anchor="middle" font-size="12" fill="#1e3a8a">Send（上行消息）</text>
  <text x="350" y="152" text-anchor="middle" font-size="12" fill="#1e3a8a">PushAck（收件确认）</text>
  <text x="142" y="202" text-anchor="middle" font-size="12" fill="#1e3a8a">ReadReceipt（已读）</text>
  <text x="350" y="202" text-anchor="middle" font-size="12" fill="#1e3a8a">Hello（能力协商）</text>

  <rect x="512" y="86" width="464" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="532" y="126" width="200" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="748" y="126" width="200" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="532" y="176" width="200" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="748" y="176" width="200" height="40" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="532" y="112" font-size="14" font-weight="700" fill="#334155">下行（服务端 → 客户端）</text>
  <text x="632" y="152" text-anchor="middle" font-size="12" fill="#14532d">SendAck / PushAck</text>
  <text x="848" y="152" text-anchor="middle" font-size="12" fill="#14532d">Push（下行消息）</text>
  <text x="632" y="202" text-anchor="middle" font-size="12" fill="#14532d">PresenceChange（在线）</text>
  <text x="848" y="202" text-anchor="middle" font-size="12" fill="#7c2d12">Recall（撤回，双向）</text>

  <text x="500" y="256" text-anchor="middle" font-size="11" fill="#64748b">心跳（Ping / Pong）双向、走控制类；命令类报文（撤回 / 删除 / 置顶）双向、走命令类 —— 见下方三张卡</text>

  <rect x="24" y="274" width="304" height="34" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="40" y="297" font-size="13" font-weight="700" fill="#1e3a8a">数据类（Send / Push）</text>
  <rect x="24" y="316" width="304" height="154" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="346" font-size="12" fill="#334155">落库：是（丢了没法补）</text>
  <text x="40" y="372" font-size="12" fill="#334155">需要 ACK：是</text>
  <text x="40" y="398" font-size="12" fill="#334155">会话 seq：需要（排序与补齐）</text>
  <text x="40" y="424" font-size="12" fill="#334155">能否丢弃：不能</text>
  <text x="40" y="450" font-size="12" fill="#1e3a8a">典型：Send / Push</text>

  <rect x="348" y="274" width="304" height="34" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="364" y="297" font-size="13" font-weight="700" fill="#14532d">控制类（心跳 / ACK / Hello）</text>
  <rect x="348" y="316" width="304" height="154" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="364" y="346" font-size="12" fill="#334155">落库：否</text>
  <text x="364" y="372" font-size="12" fill="#334155">需要 ACK：否（自身即确认）</text>
  <text x="364" y="398" font-size="12" fill="#334155">会话 seq：不需要</text>
  <text x="364" y="424" font-size="12" fill="#334155">能否丢弃：能（重发即可）</text>
  <text x="364" y="450" font-size="12" fill="#14532d">典型：心跳 / SendAck</text>

  <rect x="672" y="274" width="304" height="34" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="688" y="297" font-size="13" font-weight="700" fill="#7c2d12">命令类（撤回 / 删除 / 置顶）</text>
  <rect x="672" y="316" width="304" height="154" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="688" y="346" font-size="12" fill="#334155">落库：是（状态变更要持久）</text>
  <text x="688" y="372" font-size="12" fill="#334155">需要 ACK：是</text>
  <text x="688" y="398" font-size="12" fill="#334155">会话 seq：不需要（但要幂等）</text>
  <text x="688" y="424" font-size="12" fill="#334155">能否丢弃：不能</text>
  <text x="688" y="450" font-size="12" fill="#7c2d12">典型：Recall / Edit</text>

  <text x="500" y="492" text-anchor="middle" font-size="11" fill="#94a3b8">要点：先给报文定「方向 + 语义」，可靠性要求（落库 / ACK / seq / 可否丢）就随之确定</text>
</svg>
