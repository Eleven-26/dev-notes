<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 496" width="1000" height="496" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="496" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">六个输入数字，推出三条硬约束</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">同一套架构，六个数字一变，先撞墙的就是另一条约束</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect x="24" y="82" width="212" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="38" y="99" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">日活设备数</text>
  <text x="38" y="114" font-size="9.8" fill="#64748b" text-anchor="start">装机口径，不是注册数</text>
  <rect x="24" y="124" width="212" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="38" y="141" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">峰值同时在线比例</text>
  <text x="38" y="156" font-size="9.8" fill="#64748b" text-anchor="start">同一时刻有多少端挂着</text>
  <rect x="24" y="166" width="212" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="38" y="183" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">人均日发条数</text>
  <text x="38" y="198" font-size="9.8" fill="#64748b" text-anchor="start">决定上行 QPS</text>
  <rect x="24" y="208" width="212" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="38" y="225" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">群规模分布</text>
  <text x="38" y="240" font-size="9.8" fill="#64748b" text-anchor="start">决定扇出倍数的中位数与长尾</text>
  <rect x="24" y="250" width="212" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="38" y="267" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">消息留存期</text>
  <text x="38" y="282" font-size="9.8" fill="#64748b" text-anchor="start">产品承诺，不是存储能力</text>
  <rect x="24" y="292" width="212" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="38" y="309" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">人均端数</text>
  <text x="38" y="324" font-size="9.8" fill="#64748b" text-anchor="start">手机 + 平板 + 桌面，决定扇出端数</text>
  <line x1="248" y1="98" x2="248" y2="326" stroke="#64748b" stroke-width="1.4"/>
  <line x1="248" y1="134" x2="272" y2="134" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <line x1="248" y1="234" x2="272" y2="234" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <line x1="248" y1="334" x2="272" y2="334" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="272" y="92" width="452" height="84" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="290" y="116" font-size="13.5" fill="#2563eb" text-anchor="start" font-weight="bold">连接数</text>
  <text x="290" y="138" font-size="11" fill="#0f172a" text-anchor="start">日活设备 × 同时在线比例</text>
  <text x="290" y="158" font-size="10.5" fill="#64748b" text-anchor="start">1 亿 × 20% = 2000 万条长连接</text>
  <rect x="740" y="92" width="236" height="84" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="756" y="116" font-size="12" fill="#15803d" text-anchor="start" font-weight="bold">加机器能解决</text>
  <text x="756" y="138" font-size="10.5" fill="#0f172a" text-anchor="start">拆网关：一条连接只属一台机器</text>
  <rect x="272" y="192" width="452" height="84" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="290" y="216" font-size="13.5" fill="#2563eb" text-anchor="start" font-weight="bold">扇出倍数</text>
  <text x="290" y="238" font-size="11" fill="#0f172a" text-anchor="start">每条消息 × 平均成员数</text>
  <text x="290" y="258" font-size="10.5" fill="#64748b" text-anchor="start">500 人群走写扩散 = 500 次投递</text>
  <rect x="740" y="192" width="236" height="84" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="756" y="216" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">加机器救不了</text>
  <text x="756" y="238" font-size="10.5" fill="#0f172a" text-anchor="start">换扩散方式：写扩散 → 读扩散</text>
  <rect x="272" y="292" width="452" height="84" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="290" y="316" font-size="13.5" fill="#2563eb" text-anchor="start" font-weight="bold">存储增长</text>
  <text x="290" y="338" font-size="11" fill="#0f172a" text-anchor="start">日增条数 × 单条字节 × 留存</text>
  <text x="290" y="358" font-size="10.5" fill="#64748b" text-anchor="start">100 亿 × 200 B × 30 天 ≈ 60 TB</text>
  <rect x="740" y="292" width="236" height="84" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="756" y="316" font-size="12" fill="#15803d" text-anchor="start" font-weight="bold">加机器能解决</text>
  <text x="756" y="338" font-size="10.5" fill="#0f172a" text-anchor="start">冷热分层 + 归档下沉</text>
  <rect x="24" y="402" width="952" height="78" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="40" y="424" font-size="12" fill="#b45309" text-anchor="start" font-weight="bold">判据：能被加机器解决的，晚做；只能换算法的，早做。</text>
  <text x="40" y="446" font-size="11" fill="#0f172a" text-anchor="start">三条约束里只有「扇出倍数」属于后者 —— 它的分母是一次发送、分子是成员数，加多少台机器都不改变这个比值。</text>
  <text x="40" y="466" font-size="11" fill="#64748b" text-anchor="start">所以演进顺序里「大群换扩散方式」必须早于「分库分表」：分片救不了算法问题，只会把同一个问题摊到更多机器上。</text>
</svg>
