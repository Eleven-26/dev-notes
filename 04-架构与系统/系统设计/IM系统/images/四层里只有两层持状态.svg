<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 476" width="1000" height="476" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="476" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">四层里只有两层持状态</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">切层的判据不是「职责像不像」，而是「这份状态归谁持有、变得有多快」</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <text x="40" y="86" font-size="11" fill="#64748b" text-anchor="start" font-weight="bold">层</text>
  <text x="210" y="86" font-size="11" fill="#64748b" text-anchor="start" font-weight="bold">它持有什么状态</text>
  <text x="560" y="86" font-size="11" fill="#64748b" text-anchor="start" font-weight="bold">变化有多快</text>
  <text x="760" y="86" font-size="11" fill="#64748b" text-anchor="start" font-weight="bold">这一层挂了会怎样</text>
  <rect x="24" y="98" width="952" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="40" y="126" font-size="12.5" fill="#2563eb" text-anchor="start" font-weight="bold">接入层</text>
  <text x="40" y="146" font-size="10" fill="#64748b" text-anchor="start">网关</text>
  <text x="210" y="128" font-size="11" fill="#0f172a" text-anchor="start">公网长连接、uid → 网关实例的映射</text>
  <text x="210" y="148" font-size="9.8" fill="#64748b" text-anchor="start">（唯一持有者）</text>
  <text x="560" y="136" font-size="11" fill="#0f172a" text-anchor="start">毫秒级：连上、断开、心跳</text>
  <text x="760" y="136" font-size="11" fill="#0f172a" text-anchor="start">该机上的连接全断，客户端重连到别处</text>
  <rect x="24" y="184" width="952" height="76" rx="10" fill="#cffafe" stroke="#0e7490" stroke-width="1.2"/>
  <text x="40" y="212" font-size="12.5" fill="#0e7490" text-anchor="start" font-weight="bold">逻辑层</text>
  <text x="40" y="232" font-size="10" fill="#64748b" text-anchor="start">消息服务</text>
  <text x="210" y="214" font-size="11" fill="#0f172a" text-anchor="start">不持有状态，只处理一次请求</text>
  <text x="210" y="234" font-size="9.8" fill="#64748b" text-anchor="start">（可随时重建）</text>
  <text x="560" y="222" font-size="11" fill="#0f172a" text-anchor="start">—</text>
  <text x="760" y="222" font-size="11" fill="#0f172a" text-anchor="start">这次请求失败，重试即可</text>
  <rect x="24" y="270" width="952" height="76" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.2"/>
  <text x="40" y="298" font-size="12.5" fill="#7e22ce" text-anchor="start" font-weight="bold">存储层</text>
  <text x="40" y="318" font-size="10" fill="#64748b" text-anchor="start">MySQL / Redis / 对象存储</text>
  <text x="210" y="300" font-size="11" fill="#0f172a" text-anchor="start">会话、消息、成员位点（权威源只有一个）</text>
  <text x="210" y="320" font-size="9.8" fill="#64748b" text-anchor="start">（唯一持有者）</text>
  <text x="560" y="308" font-size="11" fill="#0f172a" text-anchor="start">秒级：每次发送都写</text>
  <text x="760" y="308" font-size="11" fill="#0f172a" text-anchor="start">消息不可写，全站停摆</text>
  <rect x="24" y="356" width="952" height="76" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="40" y="384" font-size="12.5" fill="#b45309" text-anchor="start" font-weight="bold">推送通道</text>
  <text x="40" y="404" font-size="10" fill="#64748b" text-anchor="start">Pub/Sub + 系统通道</text>
  <text x="210" y="386" font-size="11" fill="#0f172a" text-anchor="start">订阅关系、在途投递（丢了不可惜）</text>
  <text x="210" y="406" font-size="9.8" fill="#64748b" text-anchor="start">（可随时重建）</text>
  <text x="560" y="394" font-size="11" fill="#0f172a" text-anchor="start">毫秒级：发布即过</text>
  <text x="760" y="394" font-size="11" fill="#0f172a" text-anchor="start">在线推送丢失，靠上线补拉兜底</text>
  <rect x="24" y="442" width="952" height="24" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="459" font-size="10.8" fill="#0f172a" text-anchor="start">蓝、紫两层持状态 → 只能横向拆、不能随意扩缩；青、橙两层无状态 → 想加几台加几台。这就是「有状态收拢、共享状态选一份权威」的全部内容。</text>
</svg>
