<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 462" width="1000" height="462" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="462" fill="#ffffff"/>
  <text x="500" y="34" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">两张表分片键不同，过滤只能落在应用层</text>
  <text x="500" y="58" font-size="12.2" fill="#64748b" text-anchor="middle">同一屏 10 条里，这个人删过 4 条；过滤后不足一屏，只能补读</text>
  <rect x="40" y="84" width="292" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="40" y="84" width="292" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="40" y="116" width="292" height="12" rx="0" fill="#dbeafe" stroke="none" stroke-width="1"/>
  <text x="54" y="104" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold" font-family="Consolas, Menlo, monospace">im_message_07</text>
  <text x="54" y="120" font-size="10.2" fill="#64748b" text-anchor="start">按 conv_id 分片 · 读到 10 行</text>
  <rect x="354" y="84" width="292" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="354" y="84" width="292" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="354" y="116" width="292" height="12" rx="0" fill="#fee2e2" stroke="none" stroke-width="1"/>
  <text x="368" y="104" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold" font-family="Consolas, Menlo, monospace">im_msg_deleted_07</text>
  <text x="368" y="120" font-size="10.2" fill="#64748b" text-anchor="start">按 uid 分片 · 2 段区间共 4 条</text>
  <rect x="668" y="84" width="292" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="668" y="84" width="292" height="44" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <rect x="668" y="116" width="292" height="12" rx="0" fill="#dcfce7" stroke="none" stroke-width="1"/>
  <text x="682" y="104" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold" font-family="Consolas, Menlo, monospace">应用层过滤结果</text>
  <text x="682" y="120" font-size="10.2" fill="#64748b" text-anchor="start">可见 6 条 · 还差 4 条</text>
  <rect x="54" y="160" width="22" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="80" y="160" width="22" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="106" y="160" width="22" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="132" y="160" width="22" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="158" y="160" width="22" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="184" y="160" width="22" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="210" y="160" width="22" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="236" y="160" width="22" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="262" y="160" width="22" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="288" y="160" width="22" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="54" y="212" font-size="9.4" fill="#64748b" text-anchor="start" font-family="Consolas, Menlo, monospace">seq 1090</text>
  <text x="310" y="212" font-size="9.4" fill="#64748b" text-anchor="end" font-family="Consolas, Menlo, monospace">1099</text>
  <rect x="498" y="160" width="74" height="34" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="535.0" y="183" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">×</text>
  <text x="535.0" y="212" font-size="9.4" fill="#dc2626" text-anchor="middle" font-family="Consolas, Menlo, monospace">1095–1097</text>
  <rect x="602" y="160" width="22" height="34" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="613.0" y="183" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">×</text>
  <text x="613.0" y="212" font-size="9.4" fill="#dc2626" text-anchor="middle" font-family="Consolas, Menlo, monospace">1099</text>
  <text x="368" y="152" font-size="9.4" fill="#64748b" text-anchor="start">闭区间 seq_lo..seq_hi，一段一行</text>
  <rect x="682" y="160" width="22" height="34" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <rect x="708" y="160" width="22" height="34" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <rect x="734" y="160" width="22" height="34" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <rect x="760" y="160" width="22" height="34" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <rect x="786" y="160" width="22" height="34" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <rect x="812" y="160" width="22" height="34" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="838" y="160" width="22" height="34" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="864" y="160" width="22" height="34" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="890" y="160" width="22" height="34" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <rect x="916" y="160" width="22" height="34" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="682" y="212" font-size="9.4" fill="#64748b" text-anchor="start">4 个空位 = 被删掉的</text>
  <line x1="334" y1="177" x2="350" y2="177" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="648" y1="177" x2="664" y2="177" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <rect x="40" y="256" width="920" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="62" y="288" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="bold">①</text>
  <text x="92" y="288" font-size="11.6" fill="#dc2626" text-anchor="start" font-weight="bold">两个 _07 不是同一个分片</text>
  <text x="352" y="288" font-size="11.2" fill="#64748b" text-anchor="start">· 左边由 conv_id 算出、右边由 uid 算出 —— 两张表 join 不到，过滤没法下推给 SQL</text>
  <text x="62" y="326" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">②</text>
  <text x="92" y="326" font-size="11.6" fill="#0f172a" text-anchor="start" font-weight="bold">所以只能四步走</text>
  <text x="352" y="326" font-size="11.2" fill="#64748b" text-anchor="start">· 取一屏 → 取本页 seq 范围相交的删除区间 → 应用层过滤 → 不够再取一屏</text>
  <text x="62" y="364" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">③</text>
  <text x="92" y="364" font-size="11.6" fill="#0f172a" text-anchor="start" font-weight="bold">每轮固定 20 条，不按删除率放大</text>
  <text x="352" y="364" font-size="11.2" fill="#64748b" text-anchor="start">· 删除率是会话级长尾（0% 到 30%），放大成 21 条撞上三成的会话照样不够</text>
  <text x="62" y="402" font-size="12.5" fill="#ea580c" text-anchor="start" font-weight="bold">④</text>
  <text x="92" y="402" font-size="11.6" fill="#ea580c" text-anchor="start" font-weight="bold">游标停在本页最后一条「读到」的 seq</text>
  <text x="352" y="402" font-size="11.2" fill="#64748b" text-anchor="start">· 不是最后一条「可见」的 —— 停在可见的上，页尾是删除段时会原地打转</text>
</svg>