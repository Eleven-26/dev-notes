<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <rect x="60" y="120" width="160" height="56" rx="26" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <rect x="290" y="120" width="160" height="56" rx="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="520" y="120" width="160" height="56" rx="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="750" y="120" width="160" height="56" rx="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="520" y="300" width="160" height="56" rx="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="290" y="300" width="160" height="56" rx="26" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>

  <rect x="30" y="420" width="940" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="45" y="455" width="210" height="90" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <rect x="275" y="455" width="210" height="90" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <rect x="505" y="455" width="210" height="90" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <rect x="735" y="455" width="210" height="90" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>

  <path d="M 220 148 L 290 148" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 450 148 L 520 148" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 680 148 L 750 148" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 762 176 L 662 300" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 520 328 L 450 328" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 545 176 L 420 300" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 360 176 L 352 300" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 290 322 L 196 176" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <text x="30" y="40" font-size="19" fill="#0f172a">呼叫状态机：正常转移与四类异常转移</text>

  <text x="140" y="153" font-size="13" fill="#334155" text-anchor="middle">空闲 Idle</text>
  <text x="370" y="153" font-size="13" fill="#1e3a8a" text-anchor="middle">呼叫中（邀请已发）</text>
  <text x="600" y="153" font-size="13" fill="#1e3a8a" text-anchor="middle">振铃中（对端振铃）</text>
  <text x="830" y="153" font-size="13" fill="#1e3a8a" text-anchor="middle">接通中（媒体协商）</text>
  <text x="600" y="333" font-size="13" fill="#14532d" text-anchor="middle">通话中（媒体已通）</text>
  <text x="370" y="333" font-size="13" fill="#334155" text-anchor="middle">结束（释放资源）</text>

  <text x="255" y="140" font-size="11" fill="#64748b" text-anchor="middle">发起</text>
  <text x="485" y="140" font-size="11" fill="#64748b" text-anchor="middle">对端可达</text>
  <text x="715" y="140" font-size="11" fill="#64748b" text-anchor="middle">接听</text>
  <text x="742" y="248" font-size="11" fill="#64748b" text-anchor="middle">媒体连通</text>
  <text x="485" y="320" font-size="11" fill="#64748b" text-anchor="middle">挂断</text>
  <text x="492" y="236" font-size="11" fill="#64748b" text-anchor="middle">拒接 / 取消 / 超时</text>
  <text x="332" y="236" font-size="11" fill="#64748b" text-anchor="middle">不可达 / 超时</text>
  <text x="198" y="252" font-size="11" fill="#64748b" text-anchor="middle">释放</text>

  <text x="50" y="444" font-size="14" fill="#0f172a">异常转移的四种情形：都要能收敛到「结束」</text>

  <text x="150" y="486" font-size="12" fill="#7c2d12" text-anchor="middle">超时：无响应</text>
  <text x="150" y="512" font-size="11" fill="#7c2d12" text-anchor="middle">呼叫中 / 振铃中 → 结束</text>
  <text x="380" y="486" font-size="12" fill="#7c2d12" text-anchor="middle">忙线：对端已在通话</text>
  <text x="380" y="512" font-size="11" fill="#7c2d12" text-anchor="middle">立即回忙线 → 结束</text>
  <text x="610" y="486" font-size="12" fill="#7c2d12" text-anchor="middle">取消：主叫撤回</text>
  <text x="610" y="512" font-size="11" fill="#7c2d12" text-anchor="middle">接通前撤回 → 结束</text>
  <text x="840" y="486" font-size="12" fill="#7c2d12" text-anchor="middle">同时呼叫</text>
  <text x="840" y="512" font-size="11" fill="#7c2d12" text-anchor="middle">按规则择一（如 ID 小者优先）</text>

  <text x="30" y="588" font-size="12" fill="#94a3b8">说明：本图为状态与转移示意，不含接通的任何耗时数字；真实行为依赖终端与网络，正文均标为「未实测」。</text>
  <text x="30" y="610" font-size="12" fill="#94a3b8">要点：把超时、忙线、取消、同时呼叫显式建模，才能让「非正常路径」收敛到同一套转移里。</text>
</svg>
