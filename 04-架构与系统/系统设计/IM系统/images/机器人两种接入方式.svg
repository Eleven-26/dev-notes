<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <rect x="40" y="90" width="440" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="520" y="90" width="440" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

  <rect x="70" y="140" width="180" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="270" y="140" width="180" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="70" y="240" width="380" height="80" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <rect x="70" y="350" width="380" height="110" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>

  <rect x="550" y="140" width="180" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="750" y="140" width="180" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="550" y="240" width="380" height="80" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <rect x="550" y="350" width="380" height="110" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>

  <path d="M 250 168 L 270 168" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M 730 168 L 750 168" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <text x="30" y="40" font-size="19" fill="#0f172a">机器人的两种接入方式：Webhook 回调 vs 长连接订阅</text>

  <text x="60" y="120" font-size="14" fill="#0f172a">方式一：Webhook 回调（平台推给你）</text>
  <text x="540" y="120" font-size="14" fill="#0f172a">方式二：长连接订阅（你连过去）</text>

  <text x="160" y="164" font-size="13" fill="#1e3a8a" text-anchor="middle">IM 平台</text>
  <text x="160" y="184" font-size="12" fill="#1e3a8a" text-anchor="middle">（事件源）</text>
  <text x="360" y="164" font-size="13" fill="#14532d" text-anchor="middle">你的 HTTP 服务</text>
  <text x="360" y="184" font-size="12" fill="#14532d" text-anchor="middle">（公网端点）</text>
  <text x="260" y="134" font-size="11" fill="#64748b" text-anchor="middle">推送事件（HTTP POST）</text>

  <text x="260" y="270" font-size="13" fill="#7c2d12" text-anchor="middle">回调的可靠性与幂等</text>
  <text x="260" y="296" font-size="12" fill="#7c2d12" text-anchor="middle">失败按退避策略重发</text>
  <text x="260" y="314" font-size="12" fill="#7c2d12" text-anchor="middle">消费端按 event ID 去重</text>

  <text x="260" y="382" font-size="12" fill="#334155" text-anchor="middle">优点：无需常驻连接</text>
  <text x="260" y="406" font-size="12" fill="#334155" text-anchor="middle">缺点：需要一个公网入口</text>
  <text x="260" y="430" font-size="12" fill="#334155" text-anchor="middle">且要自己处理重试与去重</text>

  <text x="640" y="164" font-size="13" fill="#1e3a8a" text-anchor="middle">IM 平台</text>
  <text x="640" y="184" font-size="12" fill="#1e3a8a" text-anchor="middle">（事件源）</text>
  <text x="840" y="164" font-size="13" fill="#14532d" text-anchor="middle">你的常驻客户端</text>
  <text x="840" y="184" font-size="12" fill="#14532d" text-anchor="middle">（长连接订阅）</text>
  <text x="740" y="134" font-size="11" fill="#64748b" text-anchor="middle">订阅 + 推送</text>

  <text x="740" y="270" font-size="13" fill="#334155" text-anchor="middle">连接与鉴权</text>
  <text x="740" y="296" font-size="12" fill="#334155" text-anchor="middle">AppID + 密钥签名 / OAuth 令牌</text>
  <text x="740" y="314" font-size="12" fill="#334155" text-anchor="middle">断线要重连并重新订阅</text>

  <text x="740" y="382" font-size="12" fill="#7c2d12" text-anchor="middle">优点：无需公网入口</text>
  <text x="740" y="406" font-size="12" fill="#7c2d12" text-anchor="middle">缺点：要维护连接与重连</text>
  <text x="740" y="430" font-size="12" fill="#7c2d12" text-anchor="middle">实时性好，但连接是长期成本</text>

  <text x="30" y="515" font-size="12" fill="#94a3b8">说明：本图为两种接入方式的结构示意，不含任何吞吐、QPS 或延迟数字；真实行为依赖部署环境，正文均标为「未实测」。</text>
  <text x="30" y="543" font-size="12" fill="#94a3b8">要点：Webhook 是「平台推给你」，要求你有公网入口并处理重试；长连接订阅是「你连过去」，你侧维护连接与重连。</text>
  <text x="30" y="571" font-size="12" fill="#94a3b8">共同点：两者都要鉴权，回调或推送都可能重复，消费端必须靠事件 ID 做幂等。</text>
</svg>
