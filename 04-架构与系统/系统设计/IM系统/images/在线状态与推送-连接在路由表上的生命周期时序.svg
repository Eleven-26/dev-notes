<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="30" y="34" font-size="20" font-weight="bold" fill="#0f172a">一条连接在路由表上的生命周期</text>
  <text x="30" y="56" font-size="12.5" fill="#475569">建连 → 注册 → 续期 → 查表推送 → 断开 → 跨实例重连；只画阶段与骨架接口名，不含任何耗时数字</text>

  <rect x="10" y="72" width="980" height="520" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

  <rect x="20" y="86" width="170" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="220" y="86" width="170" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="420" y="86" width="170" height="34" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <rect x="620" y="86" width="170" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="820" y="86" width="170" height="34" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="105" y="107" font-size="12.5" fill="#1e3a8a" text-anchor="middle">客户端</text>
  <text x="305" y="107" font-size="12.5" fill="#1e3a8a" text-anchor="middle">网关 A（本机持有）</text>
  <text x="505" y="107" font-size="12.5" fill="#3730a3" text-anchor="middle">网关 B（重连落点）</text>
  <text x="705" y="107" font-size="12.5" fill="#14532d" text-anchor="middle">路由表（共享存储）</text>
  <text x="905" y="107" font-size="12.5" fill="#92400e" text-anchor="middle">消息服务（扇出）</text>

  <line x1="105" y1="120" x2="105" y2="496" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="305" y1="120" x2="305" y2="496" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="505" y1="120" x2="505" y2="496" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="705" y1="120" x2="705" y2="496" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="905" y1="120" x2="905" y2="496" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>

  <line x1="105" y1="144" x2="293" y2="144" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="200" y="138" font-size="11.5" fill="#334155" text-anchor="middle">① 建连：握手 + 鉴权通过</text>

  <line x1="305" y1="180" x2="693" y2="180" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr3)"/>
  <text x="500" y="174" font-size="11.5" fill="#14532d" text-anchor="middle">② Register：ConnID → 网关 A，带 Expire</text>

  <line x1="305" y1="214" x2="693" y2="214" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#arr3)"/>
  <text x="500" y="208" font-size="11.5" fill="#14532d" text-anchor="middle">③ 周期性 Renew：只把 Expire 往后推</text>

  <line x1="905" y1="252" x2="717" y2="252" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="810" y="246" font-size="11.5" fill="#334155" text-anchor="middle">④ Lookup(uid)</text>

  <line x1="705" y1="286" x2="893" y2="286" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#arr)"/>
  <text x="800" y="280" font-size="11.5" fill="#334155" text-anchor="middle">⑤ 返回全部有效连接</text>

  <line x1="905" y1="324" x2="317" y2="324" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr2)"/>
  <text x="610" y="318" font-size="11.5" fill="#1e3a8a" text-anchor="middle">⑥ 本机连接写入发送队列；慢连接非阻塞跳过这一份</text>

  <line x1="905" y1="360" x2="517" y2="360" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#arr2)"/>
  <text x="710" y="354" font-size="11.5" fill="#1e3a8a" text-anchor="middle">⑦ 不在本机的实例：靠发布订阅广播各自查本地 map</text>

  <line x1="305" y1="398" x2="693" y2="398" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr3)"/>
  <text x="500" y="392" font-size="11.5" fill="#14532d" text-anchor="middle">⑧ Remove：断连即删，异常关闭靠 TTL 过期兜底</text>

  <line x1="105" y1="438" x2="493" y2="438" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="300" y="432" font-size="11.5" fill="#334155" text-anchor="middle">⑨ 指数退避 + 抖动后重连，落在网关 B</text>

  <line x1="505" y1="474" x2="693" y2="474" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr3)"/>
  <text x="600" y="468" font-size="11.5" fill="#14532d" text-anchor="middle">⑩ B 重新 Register（重连三件事之一）</text>

  <rect x="30" y="512" width="450" height="70" rx="8" fill="#fff7ed" stroke="#b45309"/>
  <text x="255" y="532" font-size="11.5" fill="#92400e" text-anchor="middle">边界一：Lookup 无有效记录时返回 ErrNoRoute，</text>
  <text x="255" y="550" font-size="11.5" fill="#92400e" text-anchor="middle">转入离线降级——系统推送只做唤起，</text>
  <text x="255" y="568" font-size="11.5" fill="#92400e" text-anchor="middle">真正的送达仍靠上线后按位点拉取补齐</text>

  <rect x="510" y="512" width="460" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="740" y="532" font-size="11.5" fill="#334155" text-anchor="middle">第 ⑨⑩ 步之后还有两件配套动作（见第三节）：</text>
  <text x="740" y="550" font-size="11.5" fill="#334155" text-anchor="middle">带上位点补齐断线期间的消息、恢复会话订阅</text>
  <text x="740" y="568" font-size="11.5" fill="#334155" text-anchor="middle">心跳间隔、续期周期与查表耗时正文标为未实测</text>

  <text x="30" y="606" font-size="11.5" fill="#475569">要点：注册、续期、查询、删除四步就是路由表的全部动作；记录只回答「连在哪台网关」，不回答「消息推成功没有」。本图为时序示意，不含任何耗时或连接数数字。</text>
</svg>
