<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <rect x="24" y="86" width="952" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="40" y="104" width="150" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="220" y="104" width="170" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="406" y="104" width="170" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="592" y="104" width="170" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="778" y="104" width="170" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>

  <rect x="24" y="212" width="952" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="40" y="230" width="150" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="220" y="230" width="170" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="406" y="230" width="170" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="592" y="230" width="170" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="778" y="230" width="170" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>

  <rect x="24" y="338" width="952" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="40" y="356" width="150" height="44" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <rect x="220" y="356" width="170" height="44" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <rect x="406" y="356" width="170" height="44" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <rect x="592" y="356" width="170" height="44" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <rect x="778" y="356" width="170" height="44" rx="6" fill="#e2e8f0" stroke="#64748b"/>

  <rect x="24" y="464" width="952" height="96" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">群聊三层权限模型与判定落点</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#475569">角色只设三层；禁言与入群策略是群级配置，判定一律落在服务端写入口</text>

  <text x="115" y="131" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">群主 Owner</text>
  <text x="305" y="131" text-anchor="middle" font-size="12" fill="#1e3a8a">任免管理员</text>
  <text x="491" y="131" text-anchor="middle" font-size="12" fill="#1e3a8a">@所有人</text>
  <text x="677" y="131" text-anchor="middle" font-size="12" fill="#1e3a8a">改名 / 公告</text>
  <text x="863" y="131" text-anchor="middle" font-size="12" fill="#1e3a8a">转让 / 解散</text>

  <text x="115" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">管理员 Admin</text>
  <text x="305" y="257" text-anchor="middle" font-size="12" fill="#14532d">邀请 / 审批</text>
  <text x="491" y="257" text-anchor="middle" font-size="12" fill="#14532d">踢人</text>
  <text x="677" y="257" text-anchor="middle" font-size="12" fill="#14532d">禁言他人</text>
  <text x="863" y="257" text-anchor="middle" font-size="12" fill="#14532d">撤回他人消息</text>

  <text x="115" y="383" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">普通成员 Member</text>
  <text x="305" y="383" text-anchor="middle" font-size="12" fill="#334155">发消息</text>
  <text x="491" y="383" text-anchor="middle" font-size="12" fill="#334155">退群</text>
  <text x="677" y="383" text-anchor="middle" font-size="12" fill="#334155">消息免打扰</text>
  <text x="863" y="383" text-anchor="middle" font-size="12" fill="#334155">视策略邀请</text>

  <text x="40" y="490" font-size="12" fill="#334155">判定输入：操作者角色 + 目标成员角色 + 群级配置（禁言 / 入群策略 / 是否允许 @所有人）+ 服务端时间</text>
  <text x="40" y="514" font-size="12" fill="#334155">判定落点：服务端写入口 —— 客户端隐藏按钮、置灰输入框只是体验，不构成任何安全边界</text>
  <text x="40" y="538" font-size="12" fill="#334155">缓存：权限可缓存，但必须在成员 / 权限变更（成员表 Version++）时失效，否则「刚被踢的人还能发言」</text>

  <text x="500" y="584" text-anchor="middle" font-size="11" fill="#64748b">要点：三层角色表达「权限可枚举」的边界；禁言、审批、@所有人 属群级配置，不该再发明新角色</text>
</svg>
