<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <text x="30" y="36" font-size="20" font-weight="bold" fill="#0f172a">一条消息投影成一个扁平索引文档</text>
  <text x="30" y="58" font-size="12.5" fill="#475569">消息本体按会话分片存，跨会话全文搜很慢，于是另建一份面向检索的读侧副本</text>

  <rect x="24" y="76" width="952" height="252" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="38" y="100" font-size="15" font-weight="bold" fill="#0f172a">存储形态：消息库（权威源）→ 索引文档（可重建副本）→ 倒排索引</text>

  <rect x="40" y="116" width="260" height="190" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="54" y="138" font-size="11.5" font-weight="bold" fill="#1e3a8a">消息本体（按会话分片）</text>
  <text x="54" y="160" font-size="10.5" fill="#1e3a8a">msgID · convID · seq</text>
  <text x="54" y="182" font-size="10.5" fill="#1e3a8a">正文 Text</text>
  <text x="54" y="204" font-size="10.5" fill="#1e3a8a">From · SentAt</text>
  <text x="54" y="226" font-size="10.5" fill="#1e3a8a">Kind 消息类型</text>
  <text x="54" y="248" font-size="10.5" fill="#1e3a8a">Members 可见范围</text>
  <text x="54" y="270" font-size="10.5" fill="#991b1b">二进制 / 状态位：不进索引</text>
  <text x="54" y="294" font-size="10.5" fill="#1e40af">按会话查很快，跨会话全文搜很慢</text>

  <line x1="300" y1="210" x2="352" y2="210" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="326" y="204" font-size="10" fill="#334155" text-anchor="middle">异步投影</text>

  <rect x="356" y="116" width="300" height="190" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="370" y="138" font-size="11.5" font-weight="bold" fill="#14532d">IndexDoc：为检索裁剪的投影</text>
  <text x="370" y="160" font-size="10.5" fill="#14532d">DocID = 消息 ID（撤回时对齐删）</text>
  <text x="370" y="180" font-size="10.5" fill="#14532d">ConvID：按会话搜 + 权限域过滤</text>
  <text x="370" y="200" font-size="10.5" fill="#14532d">From：按人搜、显示谁说的</text>
  <text x="370" y="220" font-size="10.5" fill="#14532d">SentAt：排序与范围过滤</text>
  <text x="370" y="240" font-size="10.5" fill="#14532d">Kind：结果行怎么渲染</text>
  <text x="370" y="260" font-size="10.5" fill="#14532d">Text：参与全文检索的正文</text>
  <text x="370" y="280" font-size="10.5" fill="#92400e">Members：权限域快照，可能是旧的</text>
  <text x="370" y="298" font-size="10.5" fill="#14532d">进索引的字段要么能搜，要么能过滤、能排序</text>

  <line x1="656" y1="210" x2="696" y2="210" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="676" y="204" font-size="10" fill="#334155" text-anchor="middle">建倒排</text>

  <rect x="700" y="116" width="240" height="190" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="714" y="138" font-size="11.5" font-weight="bold" fill="#92400e">倒排：词 → 文档</text>
  <text x="714" y="162" font-size="10.5" fill="#92400e">先在词典定位这个词</text>
  <text x="714" y="184" font-size="10.5" fill="#92400e">再取倒排表求交并</text>
  <text x="714" y="206" font-size="10.5" fill="#92400e">避免扫全表</text>
  <text x="714" y="232" font-size="10.5" fill="#991b1b">写入不等于立刻可搜</text>
  <text x="714" y="254" font-size="10.5" fill="#991b1b">近实时刷新有滞后窗口</text>
  <text x="714" y="280" font-size="10.5" fill="#92400e">滞后是「搜不到」的根因，</text>
  <text x="714" y="298" font-size="10.5" fill="#92400e">也是命中后要校验的根因</text>

  <rect x="24" y="348" width="460" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="38" y="372" font-size="15" font-weight="bold" fill="#0f172a">三种搜只是过滤条件的组合</text>
  <text x="38" y="398" font-size="11" fill="#334155">按会话搜：ConvID = 该会话，且我在该会话内</text>
  <text x="38" y="420" font-size="11" fill="#334155">按人搜：From = 某人，交上 ConvID 属于我的会话</text>
  <text x="38" y="442" font-size="11" fill="#334155">跨会话全局搜：ConvID 属于我的会话 + 关键词命中</text>
  <text x="38" y="462" font-size="11" fill="#92400e">权限域由会话侧（成员表）给出，不由索引说了算</text>

  <rect x="516" y="348" width="460" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="530" y="372" font-size="15" font-weight="bold" fill="#0f172a">副本要还的三笔账</text>
  <text x="530" y="398" font-size="11" fill="#334155">滞后：刚发的消息可能搜不到，等索引追上会自愈</text>
  <text x="530" y="420" font-size="11" fill="#334155">清除：撤回 / 删除必须同步删索引，否则点开看不见</text>
  <text x="530" y="442" font-size="11" fill="#334155">重建：字段变更要从消息库回放、新索引原子切换</text>
  <text x="530" y="462" font-size="11" fill="#14532d">回放期间新旧并存，搜索不中断</text>

  <rect x="24" y="488" width="952" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="512" font-size="12" fill="#0f172a">要点：权威源永远是消息库，索引是可重建的读侧副本，所以它既不是真相的来源，也不能当权限边界。</text>
  <text x="44" y="534" font-size="12" fill="#94a3b8">注意：本篇未做实测，无读数；本图为结构示意，不含索引体积、滞后窗口或召回率数字。</text>
</svg>
