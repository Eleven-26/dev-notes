<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 526" width="1000" height="526" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="526" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">同一份消息，两种排序键：一个只读 1 段，一个要读全部 8 段</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">粒度假定为默认的 8192 行；这一段就是 ClickHouse 一级索引的最小跳过单位</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker><marker id="arwB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <text x="40" y="84" font-size="12.5" fill="#2563eb" text-anchor="start" font-weight="bold">ORDER BY (conv_id, seq)</text>
  <text x="40" y="104" font-size="10.8" fill="#64748b" text-anchor="start">查询：WHERE conv_id = 7 AND seq BETWEEN 1000 AND 1100</text>
  <rect x="40" y="118" width="50" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="65" y="140" font-size="10" fill="#64748b" text-anchor="middle">c0</text>
  <text x="65" y="156" font-size="9" fill="#64748b" text-anchor="middle">8192</text>
  <rect x="98" y="118" width="50" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="123" y="140" font-size="10" fill="#64748b" text-anchor="middle">c1</text>
  <text x="123" y="156" font-size="9" fill="#64748b" text-anchor="middle">8192</text>
  <rect x="156" y="118" width="50" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="181" y="140" font-size="10" fill="#64748b" text-anchor="middle">c2</text>
  <text x="181" y="156" font-size="9" fill="#64748b" text-anchor="middle">8192</text>
  <rect x="214" y="118" width="50" height="44" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="239" y="140" font-size="10" fill="#64748b" text-anchor="middle">c3</text>
  <text x="239" y="156" font-size="9" fill="#15803d" text-anchor="middle">8192</text>
  <rect x="272" y="118" width="50" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="297" y="140" font-size="10" fill="#64748b" text-anchor="middle">c4</text>
  <text x="297" y="156" font-size="9" fill="#64748b" text-anchor="middle">8192</text>
  <rect x="330" y="118" width="50" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="355" y="140" font-size="10" fill="#64748b" text-anchor="middle">c5</text>
  <text x="355" y="156" font-size="9" fill="#64748b" text-anchor="middle">8192</text>
  <rect x="388" y="118" width="50" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="413" y="140" font-size="10" fill="#64748b" text-anchor="middle">c6</text>
  <text x="413" y="156" font-size="9" fill="#64748b" text-anchor="middle">8192</text>
  <rect x="446" y="118" width="50" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="471" y="140" font-size="10" fill="#64748b" text-anchor="middle">c7</text>
  <text x="471" y="156" font-size="9" fill="#64748b" text-anchor="middle">8192</text>
  <text x="40" y="186" font-size="11" fill="#15803d" text-anchor="start" font-weight="bold">命中 1 / 8 段</text>
  <text x="176" y="186" font-size="10.5" fill="#64748b" text-anchor="start">同一 convID 的消息物理相邻，段内按 seq 有序</text>
  <text x="520" y="84" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="bold">ORDER BY (created_at)</text>
  <text x="520" y="104" font-size="10.8" fill="#64748b" text-anchor="start">同一条查询：没有列可用来跳过</text>
  <rect x="520" y="118" width="50" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="545" y="140" font-size="10" fill="#64748b" text-anchor="middle">t0</text>
  <text x="545" y="156" font-size="9" fill="#dc2626" text-anchor="middle">8192</text>
  <rect x="578" y="118" width="50" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="603" y="140" font-size="10" fill="#64748b" text-anchor="middle">t1</text>
  <text x="603" y="156" font-size="9" fill="#dc2626" text-anchor="middle">8192</text>
  <rect x="636" y="118" width="50" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="661" y="140" font-size="10" fill="#64748b" text-anchor="middle">t2</text>
  <text x="661" y="156" font-size="9" fill="#dc2626" text-anchor="middle">8192</text>
  <rect x="694" y="118" width="50" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="719" y="140" font-size="10" fill="#64748b" text-anchor="middle">t3</text>
  <text x="719" y="156" font-size="9" fill="#dc2626" text-anchor="middle">8192</text>
  <rect x="752" y="118" width="50" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="777" y="140" font-size="10" fill="#64748b" text-anchor="middle">t4</text>
  <text x="777" y="156" font-size="9" fill="#dc2626" text-anchor="middle">8192</text>
  <rect x="810" y="118" width="50" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="835" y="140" font-size="10" fill="#64748b" text-anchor="middle">t5</text>
  <text x="835" y="156" font-size="9" fill="#dc2626" text-anchor="middle">8192</text>
  <rect x="868" y="118" width="50" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="893" y="140" font-size="10" fill="#64748b" text-anchor="middle">t6</text>
  <text x="893" y="156" font-size="9" fill="#dc2626" text-anchor="middle">8192</text>
  <rect x="926" y="118" width="50" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="951" y="140" font-size="10" fill="#64748b" text-anchor="middle">t7</text>
  <text x="951" y="156" font-size="9" fill="#dc2626" text-anchor="middle">8192</text>
  <text x="520" y="186" font-size="11" fill="#dc2626" text-anchor="start" font-weight="bold">命中 8 / 8 段</text>
  <text x="628" y="186" font-size="10.5" fill="#64748b" text-anchor="start">按时间排 → 一个会话的消息散在所有段里</text>
  <rect x="24" y="208" width="952" height="130" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="40" y="230" font-size="12" fill="#ea580c" text-anchor="start" font-weight="bold">分区键与 TTL 必须对齐，否则「过期」会退化成重写 part</text>
  <rect x="40" y="242" width="200" height="40" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.1"/>
  <text x="140" y="267" font-size="10.6" fill="#ea580c" text-anchor="middle" font-weight="bold">PARTITION BY toYYYYMM(dt)</text>
  <rect x="256" y="242" width="300" height="40" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.1"/>
  <text x="406" y="267" font-size="10.6" fill="#ea580c" text-anchor="middle" font-weight="bold">TTL dt + INTERVAL 180 DAY DELETE</text>
  <rect x="572" y="242" width="260" height="40" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.1"/>
  <text x="702" y="267" font-size="10.6" fill="#15803d" text-anchor="middle" font-weight="bold">到期：整分区 drop</text>
  <text x="40" y="304" font-size="10.8" fill="#0f172a" text-anchor="start">分区粒度按 TTL 的量级选：按月 TTL 就按月分区；TTL 只有几天就按天分区。</text>
  <text x="40" y="324" font-size="10.8" fill="#64748b" text-anchor="start">时间字段与 TTL 表达式必须是同一列，否则 ClickHouse 只能逐行删、不能删目录。</text>
  <rect x="24" y="352" width="952" height="74" rx="10" fill="#ffffff" stroke="#7e22ce" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="40" y="374" font-size="12" fill="#7e22ce" text-anchor="start" font-weight="bold">分片键：cityHash64(conv_id)</text>
  <text x="300" y="374" font-size="11" fill="#64748b" text-anchor="start">不是 rand()，也不是 uid</text>
  <text x="40" y="396" font-size="10.8" fill="#0f172a" text-anchor="start">同一会话落同一分片，WHERE conv_id = ? 只查一个分片；用 rand() 则每次全分片扇出，结果集还要在协调节点归并。</text>
  <text x="40" y="414" font-size="10.4" fill="#64748b" text-anchor="start">Distributed(im_cluster, default, im_msg_detail, cityHash64(conv_id))</text>
  <rect x="24" y="442" width="952" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="464" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">一句话：ClickHouse 的排序键是「谁能被跳过」的声明，不是「谁更新」的声明。</text>
  <text x="40" y="486" font-size="11" fill="#64748b" text-anchor="start">所以按会话查就 (conv_id, seq)，按人查就得另建一张 (from_uid, created_at) 的表 —— 一张表只能有一个排序键。</text>
</svg>
