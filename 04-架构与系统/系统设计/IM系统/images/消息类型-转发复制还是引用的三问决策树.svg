<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="530" fill="#ffffff"/>
  <text x="24" y="32" font-size="19" font-weight="bold" fill="#0f172a">转发选复制还是引用：三问决策树</text>
  <text x="24" y="56" font-size="12" fill="#475569">从上往下问三个问题，落到的叶子就是数据模型；同一句「转发」在两种模型下代价正好相反。</text>

  <rect x="290" y="72" width="420" height="52" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="70" y="150" width="280" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="540" y="150" width="400" height="52" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="560" y="250" width="380" height="52" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="140" y="352" width="360" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="560" y="352" width="380" height="52" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <rect x="70" y="420" width="870" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <text x="500" y="103" font-size="12.5" fill="#334155" text-anchor="middle">① 转发件要不要在原文消失后继续可见？</text>
  <text x="210" y="172" font-size="12" fill="#1e40af" text-anchor="middle">复制：内容拷一份、新 msgID</text>
  <text x="210" y="190" font-size="10" fill="#64748b" text-anchor="middle">代价：失去溯源、原文撤回后转发件仍在</text>
  <text x="740" y="172" font-size="12" fill="#334155" text-anchor="middle">② 是同会话内、且强调内容来自某处？</text>
  <text x="740" y="190" font-size="10" fill="#64748b" text-anchor="middle">只有同会话才谈得上指向原消息</text>
  <text x="750" y="272" font-size="12" fill="#334155" text-anchor="middle">③ 是不是图片 / 视频这类大文件？</text>
  <text x="750" y="290" font-size="10" fill="#64748b" text-anchor="middle">字节复制一份代价太大</text>
  <text x="320" y="374" font-size="12" fill="#1e40af" text-anchor="middle">引用（指针）：只存原消息 ID</text>
  <text x="320" y="392" font-size="10" fill="#64748b" text-anchor="middle">代价：原文被撤或无权限时渲染不出</text>
  <text x="750" y="374" font-size="12" fill="#14532d" text-anchor="middle">引用 + 共享 URL：字节不复制</text>
  <text x="750" y="392" font-size="10" fill="#64748b" text-anchor="middle">折中：元信息引用原消息</text>

  <text x="90" y="444" font-size="11" fill="#475569">旁支：合并转发（一次带多条）通常选内联快照——打包带出原会话后要能独立展示；只带一批 ID 时，原会话权限一变就渲染不全。</text>
  <text x="90" y="470" font-size="11" fill="#475569">共同前提：转发件不是原文——撤回原消息不会收回转发件里已经拷走的内容，5.2 的快照也是同理。</text>
  <text x="24" y="514" font-size="11" fill="#64748b">注意：本篇未做实测，本图为决策结构示意，不含转发条数上限、消息体积或存储占比数字。</text>

  <text x="380" y="118" font-size="11" fill="#166534">要</text>
  <text x="648" y="118" font-size="11" fill="#475569">不要</text>
  <text x="445" y="166" font-size="10.5" fill="#475569" text-anchor="middle">否：跨会话</text>
  <text x="762" y="230" font-size="10.5" fill="#475569">是</text>
  <text x="762" y="330" font-size="10.5" fill="#475569">是</text>
  <text x="528" y="314" font-size="10.5" fill="#475569">否</text>

  <line x1="500" y1="124" x2="214" y2="148" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr3)"/>
  <line x1="500" y1="124" x2="736" y2="148" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr3)"/>
  <line x1="540" y1="176" x2="354" y2="176" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr3)"/>
  <line x1="740" y1="202" x2="748" y2="248" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr3)"/>
  <line x1="750" y1="302" x2="750" y2="350" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr3)"/>
  <line x1="746" y1="302" x2="324" y2="350" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr3)"/>
</svg>
