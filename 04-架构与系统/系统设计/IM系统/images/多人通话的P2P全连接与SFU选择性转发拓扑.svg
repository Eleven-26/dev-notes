<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <text x="30" y="36" font-size="20" font-weight="bold" fill="#0f172a">多人通话：P2P 全连接与 SFU 选择性转发</text>
  <text x="30" y="58" font-size="12.5" fill="#475569">拓扑一变，信令就从「两方交换一次 offer / answer」变成「持续管理一个成员集合」；图中 N = 4 仅为示意</text>

  <rect x="24" y="76" width="460" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="38" y="100" font-size="15" font-weight="bold" fill="#0f172a">P2P：每两方直连</text>
  <text x="38" y="120" font-size="10.5" fill="#64748b">媒体流条数 = N × (N-1) / 2，四人就是六条</text>

  <line x1="150" y1="171" x2="300" y2="171" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="150" y1="265" x2="300" y2="265" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="115" y1="186" x2="115" y2="250" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="335" y1="186" x2="335" y2="250" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="150" y1="186" x2="300" y2="250" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="300" y1="186" x2="150" y2="250" stroke="#94a3b8" stroke-width="1.4"/>

  <rect x="80" y="156" width="70" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="300" y="156" width="70" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="80" y="250" width="70" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="300" y="250" width="70" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="115" y="176" font-size="11.5" fill="#1e3a8a" text-anchor="middle">端 A</text>
  <text x="335" y="176" font-size="11.5" fill="#1e3a8a" text-anchor="middle">端 B</text>
  <text x="115" y="270" font-size="11.5" fill="#1e3a8a" text-anchor="middle">端 C</text>
  <text x="335" y="270" font-size="11.5" fill="#1e3a8a" text-anchor="middle">端 D</text>

  <text x="38" y="302" font-size="11" fill="#991b1b">每端要同时收发 N-1 路，上行压力随人数爆炸</text>
  <text x="38" y="320" font-size="10.5" fill="#64748b">两人 P2P 够用，三人以上通常要改成 SFU</text>

  <rect x="516" y="76" width="460" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="530" y="100" font-size="15" font-weight="bold" fill="#0f172a">SFU：每端只连中心转发节点</text>
  <text x="530" y="120" font-size="10.5" fill="#64748b">每端只发一路，下行由节点选择性转发</text>

  <line x1="630" y1="154" x2="700" y2="192" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="630" y1="246" x2="700" y2="208" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="870" y1="154" x2="800" y2="192" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="870" y1="246" x2="800" y2="208" stroke="#94a3b8" stroke-width="1.4"/>

  <rect x="540" y="140" width="90" height="28" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="540" y="232" width="90" height="28" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="870" y="140" width="90" height="28" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="870" y="232" width="90" height="28" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="585" y="159" font-size="11" fill="#1e3a8a" text-anchor="middle">端 A</text>
  <text x="585" y="251" font-size="11" fill="#1e3a8a" text-anchor="middle">端 C</text>
  <text x="915" y="159" font-size="11" fill="#1e3a8a" text-anchor="middle">端 B</text>
  <text x="915" y="251" font-size="11" fill="#1e3a8a" text-anchor="middle">端 D</text>

  <rect x="700" y="186" width="100" height="36" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="750" y="209" font-size="11.5" fill="#92400e" text-anchor="middle">SFU 节点</text>

  <text x="530" y="302" font-size="11" fill="#14532d">每端上行恒定为一，扩展性由节点承担</text>
  <text x="530" y="320" font-size="10.5" fill="#64748b">节点要懂「谁订阅谁」，这就是房间信令</text>

  <rect x="24" y="346" width="600" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="38" y="370" font-size="15" font-weight="bold" fill="#0f172a">房间信令管什么</text>
  <text x="38" y="396" font-size="11" fill="#334155">创建 / 加入房间：分配房间 ID，成员登记</text>
  <text x="38" y="418" font-size="11" fill="#334155">成员进出通知：有人进来，其他人要新增一路订阅</text>
  <text x="38" y="440" font-size="11" fill="#334155">发布 / 订阅关系（SFU 的核心信令）、主持人控制：静音 / 踢人 / 结束</text>
  <text x="38" y="462" font-size="11" fill="#334155">房间状态同步：当前有谁、各自媒体状态，供 UI 展示</text>

  <rect x="644" y="346" width="332" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="658" y="370" font-size="15" font-weight="bold" fill="#0f172a">谁是权威</text>
  <text x="658" y="396" font-size="11" fill="#334155">成员集合被多个端并发改写</text>
  <text x="658" y="418" font-size="11" fill="#334155">要么有中心协调者做权威，</text>
  <text x="658" y="440" font-size="11" fill="#334155">要么定一套「以谁为准」的规则</text>
  <text x="658" y="462" font-size="11" fill="#92400e">实时通信偏前者：房间节点为权威</text>

  <rect x="24" y="496" width="952" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="522" font-size="12" fill="#0f172a">要点：从两方交换到房间管理，复杂度来自「成员集合持续变化」——这与群聊的成员管理同源，只是成员换成了媒体流。</text>
  <text x="44" y="546" font-size="12" fill="#475569">边界：信令面走 IM 的可靠通道，媒体面走 SRTP；信令完成不等于媒体连通，媒体失败要能回报到信令侧。</text>
  <text x="44" y="570" font-size="12" fill="#94a3b8">注意：本篇未做实测，无读数；本图为结构示意，不含接通耗时、时延或丢包数字。</text>
</svg>
