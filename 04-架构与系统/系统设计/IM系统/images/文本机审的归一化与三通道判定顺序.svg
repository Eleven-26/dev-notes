<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <text x="30" y="36" font-size="20" font-weight="bold" fill="#0f172a">文本机审的判定顺序：归一化在匹配之前</text>
  <text x="30" y="58" font-size="12.5" fill="#475569">词表抓固定词与变体、正则抓模式、组合规则抓上下文；三者的产出都只是「疑似」，不是判决</text>

  <rect x="24" y="76" width="952" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="38" y="100" font-size="15" font-weight="bold" fill="#0f172a">一条文本消息在机审里的五个阶段</text>

  <rect x="40" y="122" width="140" height="54" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="110" y="144" font-size="11.5" fill="#1e3a8a" text-anchor="middle">① 原始文本</text>
  <text x="110" y="164" font-size="10" fill="#1e3a8a" text-anchor="middle">消息副本进旁路</text>
  <rect x="200" y="122" width="180" height="54" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="290" y="144" font-size="11.5" fill="#92400e" text-anchor="middle">② 归一化（前置）</text>
  <text x="290" y="164" font-size="10" fill="#92400e" text-anchor="middle">可开关、可灰度，前后留痕</text>
  <rect x="400" y="122" width="200" height="54" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="500" y="144" font-size="11.5" fill="#1e3a8a" text-anchor="middle">③ 三条通道并行匹配</text>
  <text x="500" y="164" font-size="10" fill="#1e3a8a" text-anchor="middle">词表 / 正则 / 组合规则</text>
  <rect x="620" y="122" width="150" height="54" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="695" y="144" font-size="11.5" fill="#1e3a8a" text-anchor="middle">④ 命中留痕</text>
  <text x="695" y="164" font-size="10" fill="#1e3a8a" text-anchor="middle">记下命中了哪条规则</text>
  <rect x="790" y="122" width="170" height="54" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="875" y="144" font-size="11.5" fill="#14532d" text-anchor="middle">⑤ 分档</text>
  <text x="875" y="164" font-size="10" fill="#14532d" text-anchor="middle">高危 / 中危 / 放行仍留痕</text>

  <line x1="180" y1="149" x2="196" y2="149" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="380" y1="149" x2="396" y2="149" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="600" y1="149" x2="616" y2="149" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="770" y1="149" x2="786" y2="149" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <text x="38" y="200" font-size="11" fill="#92400e">顺序判据：归一化必须在匹配之前，否则词表再全也覆盖不到变体；但归一化不能过头，过头就是误伤。</text>
  <text x="38" y="226" font-size="11" fill="#334155">规则库要求：服务端可配、热更新、先灰度再全量、命中可解释；阈值与权重不在本篇给数字。</text>
  <text x="38" y="252" font-size="11" fill="#14532d">词表匹配用 Aho-Corasick：主串只扫一遍，扫描成本与词表规模基本无关（结构见敏感词多模式匹配图）。</text>

  <rect x="24" y="286" width="460" height="170" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="38" y="310" font-size="15" font-weight="bold" fill="#0f172a">变体手法与对应归一化</text>
  <text x="38" y="336" font-size="11" fill="#334155">拼音 / 谐音 → 拼音化 + 同音字字典映射</text>
  <text x="38" y="360" font-size="11" fill="#334155">拆字 / 插符号 → 去空白与标点后再匹配</text>
  <text x="38" y="384" font-size="11" fill="#334155">大小写 / 全半角 → 统一大小写与全半角</text>
  <text x="38" y="408" font-size="11" fill="#334155">繁体 / 异体 → 繁简转换、异体字归一</text>
  <text x="38" y="432" font-size="11" fill="#334155">火星文 → 形近字表 + 归一化</text>

  <rect x="516" y="286" width="460" height="170" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="530" y="310" font-size="15" font-weight="bold" fill="#0f172a">词表匹配绕不过去的三个边界</text>
  <text x="530" y="336" font-size="11" fill="#334155">上下文敏感：同一个词换个语境可能是正常表达</text>
  <text x="530" y="360" font-size="11" fill="#334155">表达对抗：说法足够新就抓不住，要靠模型兜底</text>
  <text x="530" y="384" font-size="11" fill="#334155">误伤：正常文本里可能恰好包含敏感子串</text>
  <text x="530" y="412" font-size="11.5" fill="#92400e">结论：词表是高召回、低精度的第一道筛子，</text>
  <text x="530" y="434" font-size="11.5" fill="#92400e">它给出「疑似」，定性要交给模型 + 人审</text>

  <rect x="24" y="476" width="952" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="502" font-size="12" fill="#0f172a">要点：先归一化、再匹配、命中只记「疑似」并留痕，最后按高危 / 中危 / 低危分档决定是否进人审队列。</text>
  <text x="44" y="526" font-size="12" fill="#475569">为什么不能一个词查一次：那是词表规模 × 文本长度的代价；Aho-Corasick 把主串扫描压到只走一遍。</text>
  <text x="44" y="550" font-size="12" fill="#94a3b8">注意：本篇未做实测，无读数；本图只给判定顺序，不含任何阈值、权重、命中率或准确率数字。</text>
</svg>
