<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="880" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#0f172a">IM 方案的前提与边界：先判能不能丢，再判要改造哪一处</text>
  <text x="30" y="64" font-size="13" fill="#64748b">顺着左边一列问题往下问；右边是每一问「是」时的出口 —— 改的都是边界，分层结构不动。</text>

  <rect x="40" y="86" width="920" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="64" y="112" font-size="14" font-weight="bold" fill="#14532d">默认档成立的三条前提（三条要同时满足）</text>
  <text x="64" y="136" font-size="12" fill="#14532d">① 消息不可丢 —— 丢一条就是事故，所以要走「落库 + ACK + 补拉」</text>
  <text x="64" y="158" font-size="12" fill="#14532d">② 连接会断是常态 —— 心跳判死、重连、按位点补拉；③ 状态被多端共享 —— 已读与未读靠位点收敛</text>

  <path d="M 275 166 L 275 188" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 269 188 L 281 188 L 275 196 z" fill="#64748b"/>

  <rect x="40" y="196" width="470" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="275" y="224" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">问：消息可以被丢掉吗？</text>
  <text x="60" y="250" font-size="11.5" fill="#1e3a8a">允许丢的（弹幕 / 在线状态）走内存 Pub/Sub 更划算</text>

  <path d="M 510 232 L 558 232" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr2)"/>

  <rect x="570" y="196" width="390" height="72" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="765" y="224" font-size="13.5" font-weight="bold" fill="#991b1b" text-anchor="middle">这一支不该用本篇</text>
  <text x="590" y="250" font-size="11" fill="#991b1b">换方案：内存 Pub/Sub；见 ../弹幕系统/总体设计.md</text>

  <path d="M 275 268 L 275 332" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 269 332 L 281 332 L 275 340 z" fill="#64748b"/>
  <text x="292" y="308" font-size="11" fill="#64748b">否</text>

  <rect x="40" y="340" width="470" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="275" y="368" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">问：要异地多活吗？</text>
  <text x="60" y="394" font-size="11.5" fill="#1e3a8a">两地同时给同一会话分配 seq，补拉时会出现乱序与空洞</text>

  <path d="M 510 376 L 558 376" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr3)"/>

  <rect x="570" y="340" width="390" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="765" y="368" font-size="13.5" font-weight="bold" fill="#92400e" text-anchor="middle">改造一：长连接 + seq 跨地域</text>
  <text x="590" y="394" font-size="11" fill="#92400e">见 ../跨地域多活.md 第二节</text>

  <path d="M 275 412 L 275 476" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 269 476 L 281 476 L 275 484 z" fill="#64748b"/>
  <text x="292" y="452" font-size="11" fill="#64748b">否</text>

  <rect x="40" y="484" width="470" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="275" y="512" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">问：要 E2EE 或强合规留存吗？</text>
  <text x="60" y="538" font-size="11.5" fill="#1e3a8a">先定服务端还能不能读到明文，再定留存与删除落在哪一层</text>

  <path d="M 510 520 L 558 520" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr3)"/>

  <rect x="570" y="484" width="390" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="765" y="512" font-size="13.5" font-weight="bold" fill="#92400e" text-anchor="middle">改造二：改「服务端能读什么」</text>
  <text x="590" y="538" font-size="11" fill="#92400e">搜索 / 审核 / 漫游另设计；见 端到端加密.md、内容审核与合规.md</text>

  <path d="M 275 556 L 275 620" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 269 620 L 281 620 L 275 628 z" fill="#64748b"/>
  <text x="292" y="596" font-size="11" fill="#64748b">否</text>

  <rect x="40" y="628" width="470" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="275" y="656" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">问：有音视频媒体面吗？</text>
  <text x="60" y="682" font-size="11.5" fill="#1e3a8a">媒体面走 SFU，本目录只收信令面这一层</text>

  <path d="M 510 664 L 558 664" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr2)"/>

  <rect x="570" y="628" width="390" height="72" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="765" y="656" font-size="13.5" font-weight="bold" fill="#991b1b" text-anchor="middle">不在本篇范围</text>
  <text x="590" y="682" font-size="11" fill="#991b1b">只讲信令；见 ../音视频信令.md</text>

  <path d="M 275 700 L 275 764" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 269 764 L 281 764 L 275 772 z" fill="#64748b"/>
  <text x="292" y="740" font-size="11" fill="#64748b">否</text>

  <rect x="40" y="772" width="920" height="72" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="500" y="800" font-size="14" font-weight="bold" fill="#3730a3" text-anchor="middle">四问都「否」→ 默认档：三条路径 + 三件套 + 状态外置</text>
  <text x="64" y="826" font-size="11.5" fill="#3730a3">四个「是」的出口各自成篇；它们改的都是边界，不改分层结构</text>

  <text x="30" y="868" font-size="11" fill="#94a3b8">本图为判据示意，不标任何性能数字；涉及真实长连接与多机的部分均为「未实测」。</text>
</svg>
