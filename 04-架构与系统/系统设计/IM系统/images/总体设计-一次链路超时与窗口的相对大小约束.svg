<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="444" viewBox="0 0 1000 444" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="444" fill="#ffffff"/>
  <text x="30" y="32" font-size="19" font-weight="bold" fill="#0f172a">一次链路的超时与窗口：只比相对大小与覆盖关系</text>
  <text x="30" y="54" font-size="12" fill="#475569">每一行是一条约束（7.4 表里的「小于谁 / 覆盖谁 / 不小于谁」）；条形从同一起点画，长短只表示相对关系。</text>
  <text x="254" y="76" font-size="10.5" fill="#64748b">同一起点，长度即大小</text>

  <line x1="250" y1="80" x2="250" y2="334" stroke="#94a3b8" stroke-width="1.2"/>

  <rect x="250" y="84" width="150" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="250" y="110" width="280" height="22" rx="4" fill="#ffedd5" stroke="#b45309" stroke-width="1"/>
  <rect x="250" y="150" width="180" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="250" y="176" width="300" height="22" rx="4" fill="#ffedd5" stroke="#b45309" stroke-width="1"/>
  <rect x="250" y="216" width="300" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="250" y="242" width="170" height="22" rx="4" fill="#ffedd5" stroke="#b45309" stroke-width="1"/>
  <rect x="250" y="282" width="310" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="250" y="308" width="210" height="22" rx="4" fill="#ffedd5" stroke="#b45309" stroke-width="1"/>

  <text x="244" y="99" font-size="11.5" fill="#1e40af" text-anchor="end">心跳间隔</text>
  <text x="244" y="125" font-size="11.5" fill="#78350f" text-anchor="end">网关判死阈值</text>
  <text x="244" y="165" font-size="11.5" fill="#1e40af" text-anchor="end">gRPC deadline</text>
  <text x="244" y="191" font-size="11.5" fill="#78350f" text-anchor="end">客户端等待上限</text>
  <text x="244" y="231" font-size="11.5" fill="#1e40af" text-anchor="end">幂等窗口（clientMsgID）</text>
  <text x="244" y="257" font-size="11.5" fill="#78350f" text-anchor="end">客户端重传窗口</text>
  <text x="244" y="297" font-size="11.5" fill="#1e40af" text-anchor="end">MQ 保留时长与重试上限</text>
  <text x="244" y="323" font-size="11.5" fill="#78350f" text-anchor="end">最长离线时间</text>

  <text x="650" y="107" font-size="11.5" fill="#0f172a">必须小于</text>
  <text x="650" y="173" font-size="11.5" fill="#0f172a">必须小于</text>
  <text x="650" y="239" font-size="11.5" fill="#0f172a">必须覆盖</text>
  <text x="650" y="305" font-size="11.5" fill="#0f172a">不小于</text>

  <text x="726" y="107" font-size="10.5" fill="#64748b">超了：判死太早频繁重连、太晚消息滞留</text>
  <text x="726" y="173" font-size="10.5" fill="#64748b">不设：请求悬挂、连接与协程一起涨</text>
  <text x="726" y="239" font-size="10.5" fill="#64748b">太短：重传被当成两条新消息</text>
  <text x="726" y="305" font-size="10.5" fill="#64748b">太短：离线久的对端上线后补不全</text>

  <rect x="30" y="352" width="940" height="56" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="44" y="374" font-size="11" fill="#475569">其余三项不比大小，只看有没有：网关单连接发送队列要「有限队列加背压」（无上限则一个慢客户端拖垮网关内存）；</text>
  <text x="44" y="394" font-size="11" fill="#475569">存储层热窗口 TTL 按读写比与成本定；离线降级侧收件箱留存要有上限、系统通道开关要能灰度。</text>

  <text x="30" y="426" font-size="11" fill="#64748b">注意：7.4 只给判据与相对关系，数值必须按业务压测。本图条形长度不对应任何实测数字，本篇未做实测。</text>
</svg>
