<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="830" fill="#ffffff"/>

  <text x="30" y="34" font-size="20" font-weight="bold" fill="#0f172a">跨地域多活的四问决策树</text>
  <text x="30" y="56" font-size="12.5" fill="#475569">值不值得上 → 会话内 seq 归谁 → 跨地域移动时连接怎么办 → 地域故障谁来切；切换耗时、跨域延迟与复制滞后正文标为未实测，本图不含数字</text>

  <rect x="200" y="76" width="600" height="44" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="500" y="104" font-size="13.5" fill="#92400e" text-anchor="middle">第一问 · 用户分布与可用性目标落在哪一档？（判据见 1.1 与 6.2）</text>

  <rect x="40" y="136" width="290" height="84" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="185" y="164" font-size="11.5" fill="#14532d" text-anchor="middle">集中单区域、可接受分钟级中断</text>
  <text x="185" y="188" font-size="11.5" fill="#14532d" text-anchor="middle">→ 不上多活</text>
  <text x="185" y="210" font-size="11.5" fill="#14532d" text-anchor="middle">先做同城多机房 / 主备</text>

  <rect x="355" y="136" width="290" height="84" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="164" font-size="11.5" fill="#14532d" text-anchor="middle">用户跨区域、对可用性要求高</text>
  <text x="500" y="188" font-size="11.5" fill="#14532d" text-anchor="middle">→ 上异地多活</text>
  <text x="500" y="210" font-size="11.5" fill="#14532d" text-anchor="middle">并按会话 pin 定主地域</text>

  <rect x="670" y="136" width="290" height="84" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="815" y="164" font-size="11.5" fill="#334155" text-anchor="middle">有数据驻留 / 合规要求</text>
  <text x="815" y="188" font-size="11.5" fill="#334155" text-anchor="middle">→ 数据按要求分地域存放</text>
  <text x="815" y="210" font-size="11.5" fill="#334155" text-anchor="middle">多活同时承担合规职责</text>

  <line x1="500" y1="120" x2="187" y2="134" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="120" x2="500" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="120" x2="813" y2="134" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="200" y="250" width="600" height="44" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="500" y="278" font-size="13.5" fill="#92400e" text-anchor="middle">第二问 · 会话内 seq 由谁分配？（三种解法见 4.2）</text>

  <rect x="40" y="310" width="290" height="84" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="185" y="338" font-size="11.5" fill="#14532d" text-anchor="middle">首选：会话 pin 主地域</text>
  <text x="185" y="362" font-size="11.5" fill="#14532d" text-anchor="middle">跨地域写转发回主，多一跳</text>
  <text x="185" y="384" font-size="11.5" fill="#14532d" text-anchor="middle">前提：pin 表要多地一致（4.3）</text>

  <rect x="355" y="310" width="290" height="84" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="500" y="338" font-size="11.5" fill="#334155" text-anchor="middle">对照：全局发号器</text>
  <text x="500" y="362" font-size="11.5" fill="#334155" text-anchor="middle">全局唯一好办</text>
  <text x="500" y="384" font-size="11.5" fill="#334155" text-anchor="middle">会话内稠密递增难保证</text>

  <rect x="670" y="310" width="290" height="84" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="815" y="338" font-size="11.5" fill="#7f1d1d" text-anchor="middle">对照：冲突合并</text>
  <text x="815" y="362" font-size="11.5" fill="#7f1d1d" text-anchor="middle">两地各自分配、读时合并</text>
  <text x="815" y="384" font-size="11.5" fill="#7f1d1d" text-anchor="middle">规则复杂，体验最不可控</text>

  <line x1="500" y1="294" x2="187" y2="308" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="294" x2="500" y2="306" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="294" x2="813" y2="308" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="200" y="424" width="600" height="44" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="500" y="452" font-size="13.5" fill="#92400e" text-anchor="middle">第三问 · 用户跨地域移动时，连接怎么办？（判据见 2.2）</text>

  <rect x="40" y="484" width="290" height="84" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="185" y="512" font-size="11.5" fill="#14532d" text-anchor="middle">默认：重连到新地域</text>
  <text x="185" y="536" font-size="11.5" fill="#14532d" text-anchor="middle">断线重连 + 位点补齐本来就有</text>
  <text x="185" y="558" font-size="11.5" fill="#14532d" text-anchor="middle">代价只有一次闪断</text>

  <rect x="355" y="484" width="290" height="84" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="500" y="512" font-size="11.5" fill="#334155" text-anchor="middle">例外：连接迁移</text>
  <text x="500" y="536" font-size="11.5" fill="#334155" text-anchor="middle">只在连接代价极高、闪断代价极大时</text>
  <text x="500" y="558" font-size="11.5" fill="#334155" text-anchor="middle">要跨地域传上下文 + 原子改路由</text>

  <rect x="670" y="484" width="290" height="84" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="815" y="512" font-size="11.5" fill="#1e3a8a" text-anchor="middle">配套的复制口径（3.3）</text>
  <text x="815" y="536" font-size="11.5" fill="#1e3a8a" text-anchor="middle">本地落库即返回上行 ACK</text>
  <text x="815" y="558" font-size="11.5" fill="#1e3a8a" text-anchor="middle">异地异步追，接受滞后窗口</text>

  <line x1="500" y1="468" x2="187" y2="482" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="468" x2="500" y2="480" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="468" x2="813" y2="482" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="200" y="598" width="600" height="44" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="500" y="626" font-size="13.5" fill="#92400e" text-anchor="middle">第四问 · 地域故障，自动切还是人工切？（分级见 5.3）</text>

  <rect x="40" y="658" width="290" height="84" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="185" y="686" font-size="11.5" fill="#14532d" text-anchor="middle">单点 / 单实例故障</text>
  <text x="185" y="710" font-size="11.5" fill="#14532d" text-anchor="middle">→ 交给自动化</text>
  <text x="185" y="732" font-size="11.5" fill="#14532d" text-anchor="middle">本来就有冗余</text>

  <rect x="355" y="658" width="290" height="84" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="500" y="686" font-size="11.5" fill="#92400e" text-anchor="middle">整个地域的切换</text>
  <text x="500" y="710" font-size="11.5" fill="#92400e" text-anchor="middle">→ 先告警，由人或带值守决策</text>
  <text x="500" y="732" font-size="11.5" fill="#92400e" text-anchor="middle">误判代价高，不宜全自动</text>

  <rect x="670" y="658" width="290" height="84" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="815" y="686" font-size="11.5" fill="#334155" text-anchor="middle">先定的前提（5.2 / 5.3）</text>
  <text x="815" y="710" font-size="11.5" fill="#334155" text-anchor="middle">能接受多长的不可用</text>
  <text x="815" y="732" font-size="11.5" fill="#334155" text-anchor="middle">能接受多少重，再定自动化程度</text>

  <line x1="500" y1="642" x2="187" y2="656" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="642" x2="500" y2="654" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="642" x2="813" y2="656" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="30" y="770" font-size="11.5" fill="#475569">顺序不能反：先问值不值得上，再问会话内 seq 归谁，最后才是连接与切换。先上多活、后补 pin 表的多地一致，两地都以为自己是主，就退化成「冲突合并」。</text>
  <text x="30" y="792" font-size="11.5" fill="#475569">门槛是「可用性目标 + 用户分布」而不是「技术看起来很酷」；对大多数系统，「同城双活 + 异地冷备」的性价比高于一步到位的异地多活（6.2）。</text>
  <text x="30" y="814" font-size="11.5" fill="#475569">配色口径：绿色 = 该档下推荐的一支，蓝色 = 必须配套的复制口径，黄色 = 要谨慎的分级切换，灰色 = 对照方案或前提，红色 = 最不想要的一支。</text>
</svg>
