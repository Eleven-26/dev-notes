<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <rect x="380" y="58" width="240" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="320" y="118" width="360" height="44" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>

  <rect x="36" y="188" width="452" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="512" y="188" width="452" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

  <rect x="64" y="228" width="180" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="276" y="228" width="184" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="64" y="294" width="180" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="276" y="294" width="184" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="64" y="360" width="396" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="64" y="426" width="396" height="60" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>

  <rect x="540" y="228" width="180" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="752" y="228" width="184" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="540" y="294" width="180" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="752" y="294" width="184" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="540" y="360" width="396" height="46" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <rect x="540" y="426" width="396" height="60" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>

  <rect x="300" y="548" width="400" height="48" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>

  <path d="M 500 102 L 500 118" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 420 162 L 200 200" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 580 162 L 800 200" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <path d="M 154 274 L 154 294" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 368 274 L 368 294" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 154 340 L 154 360" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 368 340 L 368 360" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 262 406 L 262 426" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <path d="M 630 274 L 630 294" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 844 274 L 844 294" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 630 340 L 630 360" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 844 340 L 844 360" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <path d="M 262 518 L 400 548" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 738 518 L 600 548" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 500 596 L 500 620" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr)"/>

  <text x="30" y="40" font-size="19" fill="#0f172a">IM 异地多活：就近接入的长连接、跨地域复制的消息流</text>
  <text x="500" y="84" font-size="13" fill="#1e3a8a" text-anchor="middle">客户端：按就近原则建立长连接</text>
  <text x="500" y="138" font-size="13" fill="#7c2d12" text-anchor="middle">接入点调度（DNS / GSLB）</text>
  <text x="500" y="156" font-size="12" fill="#7c2d12" text-anchor="middle">按就近原则解析到最近地域</text>

  <text x="58" y="212" font-size="14" fill="#0f172a">地域 A（主）</text>
  <text x="534" y="212" font-size="14" fill="#0f172a">地域 B（备 / 从）</text>

  <text x="154" y="248" font-size="13" fill="#14532d" text-anchor="middle">接入网关（长连接）</text>
  <text x="154" y="266" font-size="12" fill="#14532d" text-anchor="middle">本机持有连接</text>
  <text x="368" y="248" font-size="13" fill="#1e3a8a" text-anchor="middle">连接路由</text>
  <text x="368" y="266" font-size="12" fill="#1e3a8a" text-anchor="middle">uid → 网关</text>
  <text x="154" y="314" font-size="13" fill="#14532d" text-anchor="middle">消息服务</text>
  <text x="154" y="332" font-size="12" fill="#14532d" text-anchor="middle">写：分配 seq</text>
  <text x="368" y="314" font-size="13" fill="#1e3a8a" text-anchor="middle">在线状态</text>
  <text x="368" y="332" font-size="12" fill="#1e3a8a" text-anchor="middle">带 TTL</text>
  <text x="262" y="380" font-size="13" fill="#1e3a8a" text-anchor="middle">会话与消息存储（主库，权威源）</text>
  <text x="262" y="398" font-size="12" fill="#1e3a8a" text-anchor="middle">按会话 ID 分片</text>
  <text x="262" y="450" font-size="13" fill="#7c2d12" text-anchor="middle">会话内 seq：pin 到主地域分配</text>
  <text x="262" y="474" font-size="12" fill="#7c2d12" text-anchor="middle">同一会话只有一个写入方，顺序唯一</text>

  <text x="630" y="248" font-size="13" fill="#14532d" text-anchor="middle">接入网关（长连接）</text>
  <text x="630" y="266" font-size="12" fill="#14532d" text-anchor="middle">本机持有连接</text>
  <text x="844" y="248" font-size="13" fill="#1e3a8a" text-anchor="middle">连接路由</text>
  <text x="844" y="266" font-size="12" fill="#1e3a8a" text-anchor="middle">uid → 网关</text>
  <text x="630" y="314" font-size="13" fill="#14532d" text-anchor="middle">消息服务</text>
  <text x="630" y="332" font-size="12" fill="#14532d" text-anchor="middle">读 / 转发</text>
  <text x="844" y="314" font-size="13" fill="#1e3a8a" text-anchor="middle">在线状态</text>
  <text x="844" y="332" font-size="12" fill="#1e3a8a" text-anchor="middle">带 TTL</text>
  <text x="738" y="380" font-size="13" fill="#334155" text-anchor="middle">会话与消息存储（从副本）</text>
  <text x="738" y="398" font-size="12" fill="#475569" text-anchor="middle">异步复制，存在延迟</text>
  <text x="738" y="450" font-size="13" fill="#334155" text-anchor="middle">不自行分配 seq</text>
  <text x="738" y="474" font-size="12" fill="#475569" text-anchor="middle">高并发写入一律回主地域</text>

  <text x="500" y="576" font-size="13" fill="#7c2d12" text-anchor="middle">跨地域复制：binlog / MQ 异步投递 + 位点对账</text>

  <text x="30" y="640" font-size="12" fill="#94a3b8">说明：本图为结构与流程示意，不含任何吞吐、延迟或 QPS 数字；实际行为依赖真实多地域部署，正文均标为「未实测」。</text>
  <text x="30" y="664" font-size="12" fill="#94a3b8">要点：长连接是有状态的，故按用户就近接入；同一会话必须只有一个写入方，会话内 seq 才唯一。</text>
  <text x="30" y="688" font-size="12" fill="#94a3b8">跨地域复制是异步的，切换窗口内消息可能丢或重，靠位点对账与消息 ID 幂等兜底。</text>
</svg>
