<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="30" y="42" font-size="19" fill="#0f172a">会话与多端同步数据模型：两张表加一条消息流</text>

  <!-- 会话表 -->
  <rect x="40" y="76" width="260" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="104" font-size="15" fill="#1e3a8a" text-anchor="middle">会话表</text>
  <text x="170" y="128" font-size="12" fill="#1e3a8a" text-anchor="middle">convID、类型（与用户无关）</text>
  <text x="170" y="150" font-size="12" fill="#1e3a8a" text-anchor="middle">单聊 / 群聊 / 系统会话</text>

  <!-- 消息流 -->
  <rect x="700" y="76" width="260" height="140" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="830" y="104" font-size="15" fill="#14532d" text-anchor="middle">会话消息流</text>
  <text x="830" y="128" font-size="12" fill="#14532d" text-anchor="middle">按 seq 升序，唯一权威副本</text>
  <text x="830" y="150" font-size="12" fill="#14532d" text-anchor="middle">供漫游与位点补齐</text>
  <text x="830" y="172" font-size="12" fill="#14532d" text-anchor="middle">seq 单调递增，可能有空洞</text>
  <text x="830" y="194" font-size="12" fill="#14532d" text-anchor="middle">排序与去重都靠它</text>

  <!-- 成员表 -->
  <rect x="320" y="250" width="360" height="150" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="500" y="278" font-size="14" fill="#7c2d12" text-anchor="middle">成员表（一行 = 一个用户在一个会话里）</text>
  <text x="500" y="304" font-size="12" fill="#7c2d12" text-anchor="middle">lastReadSeq：我读到哪（已读位点）</text>
  <text x="500" y="326" font-size="12" fill="#7c2d12" text-anchor="middle">lastMsgSeq：会话最新到哪（列表排序键）</text>
  <text x="500" y="348" font-size="12" fill="#7c2d12" text-anchor="middle">置顶 / 免打扰</text>
  <text x="500" y="374" font-size="12" fill="#7c2d12" text-anchor="middle">未读 = 两段位点之间的可见消息数（派生）</text>

  <!-- 关系箭头 -->
  <path d="M 300 150 L 400 246" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="322" y="212" font-size="12" fill="#64748b">1 : N</text>
  <path d="M 700 190 L 600 246" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="672" y="212" font-size="12" fill="#64748b" text-anchor="end">lastMsgSeq 取最新</text>

  <!-- 多端同步 -->
  <rect x="40" y="436" width="920" height="102" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="464" font-size="13" fill="#0f172a">多端同步：只同步位点与配置，不同步消息本体（消息本体按位点去服务端拉）</text>

  <rect x="60" y="480" width="280" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="200" y="506" font-size="12" fill="#1e3a8a" text-anchor="middle">新消息 → 更新 lastMsgSeq、未读 +1</text>
  <rect x="360" y="480" width="280" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="500" y="506" font-size="12" fill="#14532d" text-anchor="middle">已读变更 → 取 max 收敛 lastReadSeq</text>
  <rect x="660" y="480" width="280" height="42" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="800" y="506" font-size="12" fill="#7c2d12" text-anchor="middle">会话变更 → 置顶 / 免打扰 / 成员</text>

  <path d="M 500 400 L 500 432" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 注记 -->
  <text x="30" y="566" font-size="13" fill="#64748b">要点：会话状态全挂在成员表上 —— 会话列表是「查成员表里 uid = 我的行」，未读是「成员行两个位点之间做差」，都已读靠取 max 收敛。</text>
  <text x="30" y="588" font-size="12" fill="#94a3b8">注意：本图为数据模型示意；未读「可见消息数」在 seq 有空洞时与位点差不等，正文第三节有说明，未附任何性能数字。</text>
</svg>
