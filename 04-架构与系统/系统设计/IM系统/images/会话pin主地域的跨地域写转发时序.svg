<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <text x="30" y="36" font-size="20" font-weight="bold" fill="#0f172a">会话 pin 主地域：跨地域写入要转发回主地域分配 seq</text>
  <text x="30" y="58" font-size="12.5" fill="#475569">会话 pin 在 A 地域，用户此刻连着 B 地域——多一跳转发，换来「同一会话只有一个写入方」</text>

  <rect x="24" y="76" width="952" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="38" y="100" font-size="15" font-weight="bold" fill="#0f172a">一次跨地域写消息的时序</text>

  <rect x="60" y="114" width="160" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="300" y="114" width="160" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="540" y="114" width="160" height="34" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <rect x="780" y="114" width="160" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="140" y="135" font-size="11" fill="#1e3a8a" text-anchor="middle">客户端（人在 B 地）</text>
  <text x="380" y="135" font-size="11" fill="#1e3a8a" text-anchor="middle">B 地域网关</text>
  <text x="620" y="135" font-size="11" fill="#334155" text-anchor="middle">会话 pin 目录</text>
  <text x="860" y="135" font-size="11" fill="#14532d" text-anchor="middle">A 地域消息服务</text>

  <line x1="140" y1="148" x2="140" y2="384" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="380" y1="148" x2="380" y2="384" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="620" y1="148" x2="620" y2="384" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="860" y1="148" x2="860" y2="384" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>

  <line x1="140" y1="176" x2="368" y2="176" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="254" y="170" font-size="11" fill="#334155" text-anchor="middle">① 发送消息</text>

  <line x1="380" y1="206" x2="608" y2="206" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="494" y="200" font-size="11" fill="#334155" text-anchor="middle">② 查这个会话的主地域</text>

  <line x1="620" y1="234" x2="392" y2="234" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="494" y="228" font-size="11" fill="#334155" text-anchor="middle">返回：主地域 = A</text>

  <line x1="380" y1="264" x2="848" y2="264" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="614" y="258" font-size="11" fill="#334155" text-anchor="middle">③ 转发回主地域（这一跳是多活的代价）</text>

  <rect x="730" y="280" width="240" height="46" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="850" y="299" font-size="10.5" fill="#14532d" text-anchor="middle">④ 去重 → 分配会话内 seq → 存储</text>
  <text x="850" y="317" font-size="10.5" fill="#14532d" text-anchor="middle">⑤ 异步跨地域复制带回 B</text>

  <line x1="860" y1="346" x2="392" y2="346" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="626" y="340" font-size="11" fill="#14532d" text-anchor="middle">⑥ SendAck（msgID + seq）</text>

  <line x1="380" y1="376" x2="152" y2="376" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="254" y="370" font-size="11" fill="#14532d" text-anchor="middle">⑦ 回客户端</text>

  <rect x="24" y="426" width="460" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="38" y="450" font-size="15" font-weight="bold" fill="#0f172a">为什么必须只有一个写入方</text>
  <text x="38" y="476" font-size="11" fill="#991b1b">两地各自分配 seq，同一会话的顺序就会分叉</text>
  <text x="38" y="498" font-size="11" fill="#334155">对端按 seq 排序、断线按 seq 补齐，分叉会表现为乱序</text>
  <text x="38" y="520" font-size="11" fill="#334155">全局发号器只保证唯一，给不了会话内稠密递增</text>
  <text x="38" y="540" font-size="11" fill="#92400e">大量空洞会让对端误判「丢了很多条」而无意义重拉</text>

  <rect x="516" y="426" width="460" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="530" y="450" font-size="15" font-weight="bold" fill="#0f172a">pin 到哪个地域，以及一个前提</text>
  <text x="530" y="476" font-size="11" fill="#334155">按 convID 哈希：简单稳定，改地域数会大范围重排</text>
  <text x="530" y="498" font-size="11" fill="#334155">按会话创建地：符合「就近创建」的直觉</text>
  <text x="530" y="520" font-size="11" fill="#334155">按成员多数地：群会话少跨地域写</text>
  <text x="530" y="540" font-size="11" fill="#991b1b">前提：pin 表本身要多地一致，否则都以为自己是主</text>

  <rect x="24" y="566" width="952" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="590" font-size="12" fill="#0f172a">要点：pin 把「seq 由这个会话的写入方分配」这条原则原样保留，只是把写入方从一个实例提升为一个地域。</text>
  <text x="44" y="612" font-size="12" fill="#94a3b8">注意：本篇未做实测，无读数；本图为时序示意，不含跨地域延迟、转发耗时或复制滞后数字。</text>
</svg>
