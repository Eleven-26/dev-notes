<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="380" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#0f172a">三种加密各保护哪一段：链条上被加密的区间与服务器可见性</text>
  <text x="30" y="56" font-size="13" fill="#475569">同一条链路画三行，加密覆盖的横条越长、服务器能看到的明文越少；三行防的人也不同。</text>

  <!-- 第一行：传输加密（TLS） -->
  <rect x="220" y="64" width="160" height="16" rx="4" fill="#ffedd5" stroke="#b45309" stroke-width="1"/>
  <text x="300" y="76" font-size="10.5" fill="#78350f" text-anchor="middle">TLS 密文</text>
  <rect x="490" y="64" width="160" height="16" rx="4" fill="#ffedd5" stroke="#b45309" stroke-width="1"/>
  <text x="570" y="76" font-size="10.5" fill="#78350f" text-anchor="middle">TLS 密文</text>
  <rect x="30" y="84" width="170" height="40" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="115" y="108" font-size="12.5" fill="#334155" text-anchor="middle">传输加密（TLS）</text>
  <rect x="220" y="84" width="90" height="40" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.2"/>
  <text x="265" y="108" font-size="12" fill="#14532d" text-anchor="middle">设备 A</text>
  <rect x="380" y="84" width="110" height="40" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="435" y="100" font-size="12" fill="#7f1d1d" text-anchor="middle">服务器</text>
  <text x="435" y="118" font-size="11" fill="#7f1d1d" text-anchor="middle">明文可见</text>
  <rect x="560" y="84" width="90" height="40" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.2"/>
  <text x="605" y="108" font-size="12" fill="#14532d" text-anchor="middle">设备 B</text>
  <text x="690" y="100" font-size="12" fill="#334155">密钥握在客户端与服务器两端</text>
  <text x="690" y="118" font-size="12" fill="#64748b">主要防链路上的窃听者</text>

  <!-- 第二行：静态加密 -->
  <rect x="380" y="156" width="110" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="435" y="168" font-size="10.5" fill="#1e40af" text-anchor="middle">落盘加密</text>
  <rect x="30" y="176" width="170" height="40" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="115" y="200" font-size="12.5" fill="#334155" text-anchor="middle">静态加密（落盘）</text>
  <rect x="220" y="176" width="90" height="40" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.2"/>
  <text x="265" y="200" font-size="12" fill="#14532d" text-anchor="middle">设备 A</text>
  <rect x="380" y="176" width="110" height="40" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="435" y="192" font-size="12" fill="#7f1d1d" text-anchor="middle">服务器</text>
  <text x="435" y="210" font-size="11" fill="#7f1d1d" text-anchor="middle">解密后才落库</text>
  <rect x="560" y="176" width="90" height="40" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.2"/>
  <text x="605" y="200" font-size="12" fill="#14532d" text-anchor="middle">设备 B</text>
  <text x="690" y="192" font-size="12" fill="#334155">密钥握在服务器或密钥管理服务</text>
  <text x="690" y="210" font-size="12" fill="#64748b">主要防拿到磁盘的入侵者</text>

  <!-- 第三行：端到端加密 -->
  <rect x="220" y="248" width="430" height="16" rx="4" fill="#ffedd5" stroke="#b45309" stroke-width="1"/>
  <text x="435" y="260" font-size="10.5" fill="#78350f" text-anchor="middle">端到端密文：覆盖消息内容本身</text>
  <rect x="30" y="268" width="170" height="40" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="115" y="292" font-size="12.5" fill="#334155" text-anchor="middle">端到端加密（E2EE）</text>
  <rect x="220" y="268" width="90" height="40" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.2"/>
  <text x="265" y="285" font-size="12" fill="#14532d" text-anchor="middle">设备 A</text>
  <text x="265" y="302" font-size="11" fill="#14532d" text-anchor="middle">持密钥</text>
  <rect x="380" y="268" width="110" height="40" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="435" y="284" font-size="12" fill="#334155" text-anchor="middle">服务器</text>
  <text x="435" y="302" font-size="11" fill="#475569" text-anchor="middle">只搬密文</text>
  <rect x="560" y="268" width="90" height="40" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.2"/>
  <text x="605" y="285" font-size="12" fill="#14532d" text-anchor="middle">设备 B</text>
  <text x="605" y="302" font-size="11" fill="#14532d" text-anchor="middle">持密钥</text>
  <text x="690" y="284" font-size="12" fill="#7f1d1d">密钥只在用户设备，服务器读不到明文</text>
  <text x="690" y="302" font-size="12" fill="#64748b">防服务器本身；元数据仍然可见</text>

  <text x="30" y="336" font-size="13" font-weight="bold" fill="#0f172a">要点：TLS 的两个端点是客户端与服务器，服务器站在链条中间；E2EE 的两个端点是两台设备，服务器站在链条之外。</text>
  <text x="30" y="360" font-size="12" fill="#64748b">注意：上了 HTTPS 完全不等价于消息对服务器保密；三者是不同层次的保护，谁也不能替代谁。本篇未做实测，本图无读数。</text>
</svg>
