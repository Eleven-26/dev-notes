<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <text x="30" y="36" font-size="20" font-weight="bold" fill="#0f172a">风控五维信号叠加成风险分，再驱动限流额度</text>
  <text x="30" y="58" font-size="12.5" fill="#475569">限流管的是速率维度；防刷还要叠加身份、内容、设备与行为序列，没有任何单一维度能定性黑产</text>

  <rect x="24" y="76" width="952" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="38" y="100" font-size="15" font-weight="bold" fill="#0f172a">五个维度各自给信号，汇总成一个风险分</text>

  <rect x="40" y="118" width="170" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="216" y="118" width="170" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="392" y="118" width="170" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="568" y="118" width="170" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="744" y="118" width="170" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="125" y="138" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">① 速率</text>
  <text x="125" y="158" font-size="10.5" fill="#1e3a8a" text-anchor="middle">单位时间发送量</text>
  <text x="125" y="174" font-size="10.5" fill="#1e40af" text-anchor="middle">限速、排队</text>
  <text x="301" y="138" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">② 身份</text>
  <text x="301" y="158" font-size="10.5" fill="#1e3a8a" text-anchor="middle">账号年龄、信誉分</text>
  <text x="301" y="174" font-size="10.5" fill="#1e40af" text-anchor="middle">新号低额度</text>
  <text x="477" y="138" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">③ 内容</text>
  <text x="477" y="158" font-size="10.5" fill="#1e3a8a" text-anchor="middle">重复文本、链接密度</text>
  <text x="477" y="174" font-size="10.5" fill="#1e40af" text-anchor="middle">拦截、转人工</text>
  <text x="653" y="138" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">④ 设备</text>
  <text x="653" y="158" font-size="10.5" fill="#1e3a8a" text-anchor="middle">指纹、多账号聚集</text>
  <text x="653" y="174" font-size="10.5" fill="#1e40af" text-anchor="middle">提高风控等级</text>
  <text x="829" y="138" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">⑤ 行为序列</text>
  <text x="829" y="158" font-size="10.5" fill="#1e3a8a" text-anchor="middle">注册到加好友发链接</text>
  <text x="829" y="174" font-size="10.5" fill="#1e40af" text-anchor="middle">触发二次验证</text>

  <line x1="125" y1="182" x2="460" y2="214" stroke="#64748b" stroke-width="1.4"/>
  <line x1="301" y1="182" x2="470" y2="214" stroke="#64748b" stroke-width="1.4"/>
  <line x1="477" y1="182" x2="500" y2="214" stroke="#64748b" stroke-width="1.4"/>
  <line x1="653" y1="182" x2="530" y2="214" stroke="#64748b" stroke-width="1.4"/>
  <line x1="829" y1="182" x2="540" y2="214" stroke="#64748b" stroke-width="1.4"/>

  <rect x="390" y="214" width="220" height="36" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="500" y="237" font-size="11.5" fill="#92400e" text-anchor="middle">风险分：叠加，不是替代</text>

  <line x1="500" y1="250" x2="500" y2="262" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="330" y="264" width="340" height="34" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="286" font-size="11" fill="#14532d" text-anchor="middle">风险分高的账号，同样的行为用更严的额度</text>

  <rect x="24" y="326" width="460" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="38" y="350" font-size="15" font-weight="bold" fill="#0f172a">社交动作要双向限流</text>
  <text x="38" y="376" font-size="11" fill="#334155">加的一方：限「这次能加多少」</text>
  <text x="38" y="398" font-size="11" fill="#334155">被加的一方：限「能被多少人加」</text>
  <text x="38" y="424" font-size="11" fill="#991b1b">只限单向，等于把压力全转移给被骚扰的一方</text>
  <text x="38" y="446" font-size="11" fill="#991b1b">防的是「一个号被上万人加」沦为导流靶子</text>

  <rect x="516" y="326" width="460" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="530" y="350" font-size="15" font-weight="bold" fill="#0f172a">不依赖语义的低成本特征</text>
  <text x="530" y="376" font-size="11" fill="#334155">重复文本：同一段内容短时发往多个会话与多人</text>
  <text x="530" y="398" font-size="11" fill="#334155">链接占比过高；短链跳转（目标可变，常见绕过）</text>
  <text x="530" y="424" font-size="11" fill="#92400e">这些特征与内容审核的机审共用同一批信号：</text>
  <text x="530" y="446" font-size="11" fill="#92400e">重复文本既是垃圾特征，也是审核的命中线索</text>

  <rect x="24" y="476" width="952" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="502" font-size="12" fill="#0f172a">要点：五个维度必须叠加成风险分，再由风险分去驱动「用多严的限流键」；单看速率只能挡住傻瓜式的快发。</text>
  <text x="44" y="526" font-size="12" fill="#475569">闭环：限流 → 申诉 → 复核 → 调阈值 → 再观测；只看命中率不看申诉率，就发现不了误伤。</text>
  <text x="44" y="550" font-size="12" fill="#94a3b8">注意：本篇未做实测，无读数；本图只给信号与决策结构，不含任何阈值、风险分或命中量数字。</text>
</svg>
