<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="30" y="42" font-size="19" fill="#0f172a">消息可靠投递时序：两次确认，各自含义不同</text>

  <!-- 参与者 -->
  <rect x="55" y="70" width="150" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="98" font-size="14" fill="#1e3a8a" text-anchor="middle">发送方客户端</text>
  <rect x="315" y="70" width="150" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="390" y="98" font-size="14" fill="#7c2d12" text-anchor="middle">消息服务</text>
  <rect x="555" y="70" width="150" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="630" y="98" font-size="14" fill="#14532d" text-anchor="middle">存储</text>
  <rect x="805" y="70" width="150" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="880" y="98" font-size="14" fill="#1e3a8a" text-anchor="middle">接收方客户端</text>

  <!-- 生命线 -->
  <path d="M 130 114 L 130 580" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <path d="M 390 114 L 390 580" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <path d="M 630 114 L 630 580" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <path d="M 880 114 L 880 580" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>

  <!-- ① 上行 -->
  <path d="M 130 152 L 386 152" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="258" y="144" font-size="12" fill="#334155" text-anchor="middle">① 上行消息（含 clientMsgId）</text>

  <!-- 去重自处理 -->
  <rect x="400" y="172" width="150" height="34" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="475" y="194" font-size="12" fill="#334155" text-anchor="middle">重复则直接丢弃</text>
  <path d="M 470 172 L 470 150 L 470 206 L 400 206" fill="none" stroke="#64748b" stroke-width="1.4"/>

  <!-- ② 落库 -->
  <path d="M 390 246 L 626 246" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="508" y="238" font-size="12" fill="#334155" text-anchor="middle">② 去重通过后分配 seq 并落库</text>

  <!-- ③ 存储成功 -->
  <path d="M 630 292 L 394 292" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="508" y="284" font-size="12" fill="#334155" text-anchor="middle">③ 存储成功</text>

  <!-- ④ 上行 ACK -->
  <path d="M 390 338 L 134 338" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="258" y="330" font-size="12" fill="#1e3a8a" text-anchor="middle">④ 上行 ACK：只代表已发送</text>

  <!-- ⑤ 下行推送 -->
  <path d="M 390 388 L 876 388" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="633" y="380" font-size="12" fill="#334155" text-anchor="middle">⑤ 下行推送（带 seq）</text>

  <!-- ⑥ 下行 ACK -->
  <path d="M 880 434 L 394 434" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="633" y="426" font-size="12" fill="#14532d" text-anchor="middle">⑥ 下行 ACK：已送达</text>

  <!-- ⑦ 已读回执 -->
  <path d="M 880 480 L 394 480" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="633" y="472" font-size="12" fill="#14532d" text-anchor="middle">⑦ 已读回执（convId, lastSeq）</text>

  <!-- ⑧ 已读通知 -->
  <path d="M 390 526 L 134 526" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="258" y="518" font-size="12" fill="#1e3a8a" text-anchor="middle">⑧ 已读通知 → 发送方显示已读</text>

  <!-- 注记 -->
  <text x="30" y="620" font-size="13" fill="#64748b">要点：上行 ACK 只代表「服务端已存」，不等于对方收到；送达由下行 ACK 确认，已读由回执确认 —— 三者不可混为一谈。</text>
  <text x="30" y="644" font-size="13" fill="#64748b">去重必须发生在 seq 分配之前：先判重、后占号，否则重传会占用新 seq，在会话里留下无人认领的空洞。</text>
  <text x="30" y="668" font-size="12" fill="#94a3b8">注意：本图为协议语义示意，非真实抓包；未标注任何延迟或吞吐数字，相关部分正文均标为「未实测」。</text>
</svg>
