<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">长连接状态机：断线是常态，重连要带补偿</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#475569">三态取自本篇「使用」节骨架；心跳与退避参数正文标为未实测，图中不含任何数字</text>

  <!-- 左：状态机 -->
  <rect x="24" y="82" width="560" height="400" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="108" font-size="14" font-weight="bold" fill="#334155">三个状态与四条迁移</text>
  <text x="44" y="128" font-size="10.5" fill="#64748b">StateConnecting / StateConnected / StateReconnecting</text>

  <circle cx="304" cy="152" r="6" fill="#334155"/>
  <line x1="304" y1="158" x2="304" y2="176" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="214" y="178" width="180" height="52" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="304" y="200" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">CONNECTING（连接中）</text>
  <text x="304" y="218" text-anchor="middle" font-size="9.5" fill="#1e3a8a">握手 / 升级请求已发出</text>

  <line x1="280" y1="230" x2="280" y2="282" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="330" y1="282" x2="330" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="272" y="260" text-anchor="end" font-size="9.5" fill="#334155">握手就绪</text>
  <text x="338" y="260" font-size="9.5" fill="#334155">重试也失败</text>

  <rect x="214" y="282" width="180" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="304" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">CONNECTED（在线）</text>
  <text x="304" y="322" text-anchor="middle" font-size="9.5" fill="#14532d">心跳周期性验证连接通不通</text>

  <line x1="280" y1="334" x2="280" y2="384" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="272" y="364" text-anchor="end" font-size="9.5" fill="#334155">心跳连续失败</text>
  <text x="272" y="378" text-anchor="end" font-size="9.5" fill="#334155">达到判死次数</text>

  <rect x="214" y="386" width="180" height="52" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="304" y="408" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">RECONNECTING（退避等待）</text>
  <text x="304" y="426" text-anchor="middle" font-size="9.5" fill="#92400e">指数退避 + 随机抖动</text>

  <path d="M 214 412 L 130 412 L 130 204 L 210 204" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="52" y="290" font-size="9.5" fill="#334155">退避到点</text>
  <text x="52" y="304" font-size="9.5" fill="#334155">再次发起连接</text>

  <path d="M 394 400 L 484 400 L 484 300 L 398 300" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="410" y="352" text-anchor="middle" font-size="9.5" fill="#334155">重连成功</text>
  <text x="410" y="366" text-anchor="middle" font-size="9.5" fill="#334155">补完消息与订阅</text>

  <!-- 右：三件事 -->
  <rect x="600" y="82" width="376" height="290" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="620" y="108" font-size="14" font-weight="bold" fill="#334155">重连后必须一起做的三件事</text>

  <rect x="620" y="126" width="336" height="52" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="636" y="148" font-size="11" font-weight="bold" fill="#1e3a8a">① 重新注册路由</text>
  <text x="636" y="166" font-size="9.5" fill="#1e3a8a">连接可能落在另一台网关，路由表要更新</text>

  <rect x="620" y="186" width="336" height="52" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="636" y="208" font-size="11" font-weight="bold" fill="#1e3a8a">② 带上位点补齐断线期间的消息</text>
  <text x="636" y="226" font-size="9.5" fill="#1e3a8a">去服务端按位点补拉（见消息可靠投递第六节）</text>

  <rect x="620" y="246" width="336" height="52" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="636" y="268" font-size="11" font-weight="bold" fill="#1e3a8a">③ 恢复订阅</text>
  <text x="636" y="286" font-size="9.5" fill="#1e3a8a">重新加入自己相关会话的推送</text>

  <rect x="620" y="306" width="336" height="52" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="636" y="328" font-size="10" fill="#92400e">没有抖动，一批同时断线的客户端会在同一时刻</text>
  <text x="636" y="348" font-size="10" fill="#92400e">集体重连，把刚恢复的服务再打挂</text>

  <!-- 底部注记 -->
  <rect x="24" y="496" width="952" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="520" font-size="11" fill="#334155">为什么必须有心跳：TCP 半开、NAT / 防火墙老化、负载均衡空闲超时、移动网络切 IP——连接「看似还在、实际已死」</text>
  <text x="44" y="544" font-size="10" fill="#64748b">判死看连续失败次数：一次抖动就断会误杀，等太久用户会觉得消息迟迟不来；具体取值必须按真机调，本篇不给数字</text>
</svg>
