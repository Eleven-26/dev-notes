<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <text x="30" y="36" font-size="20" font-weight="bold" fill="#0f172a">公钥分发中间人风险与三种带外核验</text>
  <text x="30" y="58" font-size="12.5" fill="#475569">E2EE 的信任根不在证书链，而在用户能亲自核对的公钥指纹；分发公钥的那一方就是信任的支点</text>

  <rect x="24" y="76" width="952" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="38" y="100" font-size="15" font-weight="bold" fill="#0f172a">偷换公钥：两端各自以为在跟对方通信，实际都在跟服务器通信</text>

  <rect x="90" y="114" width="170" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="415" y="114" width="170" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <rect x="740" y="114" width="170" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="175" y="135" font-size="11.5" fill="#1e3a8a" text-anchor="middle">A（以为在跟 B 通话）</text>
  <text x="500" y="135" font-size="11.5" fill="#991b1b" text-anchor="middle">服务器 S（读明文）</text>
  <text x="825" y="135" font-size="11.5" fill="#1e3a8a" text-anchor="middle">B（以为在跟 A 通话）</text>

  <line x1="175" y1="148" x2="175" y2="272" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="500" y1="148" x2="500" y2="272" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="825" y1="148" x2="825" y2="272" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>

  <line x1="175" y1="176" x2="488" y2="176" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="332" y="170" font-size="11" fill="#334155" text-anchor="middle">① 向服务器取 B 的身份公钥</text>
  <line x1="500" y1="204" x2="187" y2="204" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrR)"/>
  <text x="332" y="198" font-size="11" fill="#991b1b" text-anchor="middle">② 返回的却是 S 自己的公钥</text>
  <line x1="175" y1="232" x2="488" y2="232" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="332" y="226" font-size="11" fill="#334155" text-anchor="middle">③ A 用这把假公钥加密，S 能解开</text>
  <line x1="500" y1="260" x2="813" y2="260" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="657" y="254" font-size="11" fill="#334155" text-anchor="middle">④ S 再用 B 的真公钥加密转发</text>

  <rect x="24" y="306" width="560" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="38" y="330" font-size="15" font-weight="bold" fill="#0f172a">三种带外核验：走服务器控制不了的通道</text>
  <rect x="38" y="342" width="164" height="48" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="120" y="362" font-size="11.5" fill="#14532d" text-anchor="middle">安全码 / 指纹</text>
  <text x="120" y="380" font-size="10" fill="#14532d" text-anchor="middle">两端各算短指纹人工比对</text>
  <rect x="216" y="342" width="164" height="48" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="298" y="362" font-size="11.5" fill="#14532d" text-anchor="middle">扫码</text>
  <text x="298" y="380" font-size="10" fill="#14532d" text-anchor="middle">面对面扫一下自动比对</text>
  <rect x="394" y="342" width="164" height="48" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="476" y="362" font-size="11.5" fill="#14532d" text-anchor="middle">信任关系</text>
  <text x="476" y="380" font-size="10" fill="#14532d" text-anchor="middle">核验过记为已信任并延续</text>
  <text x="38" y="412" font-size="11" fill="#334155">本质：确认「我这边算出的指纹」与「对方那边算出的」一致，一致就排除了偷换</text>
  <text x="38" y="436" font-size="11" fill="#92400e">特点：用户嫌麻烦常常跳过，所以核验要尽量低成本——扫码优于手输指纹</text>

  <rect x="604" y="306" width="372" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="618" y="330" font-size="15" font-weight="bold" fill="#0f172a">公钥变更必须显式报警</text>
  <text x="618" y="356" font-size="11" fill="#334155">对端换设备或重装，身份公钥会变</text>
  <text x="618" y="380" font-size="11" fill="#991b1b">客户端不能静默接受，否则偷换永远无人察觉</text>
  <text x="618" y="404" font-size="11" fill="#334155">提示「对方的安全码已改变」，要用户点确认</text>
  <text x="618" y="432" font-size="11" fill="#334155">对照：PKI 信一条证书链，E2EE 让用户自己核对</text>

  <rect x="24" y="476" width="952" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="502" font-size="12" fill="#0f172a">要点：服务器负责分发身份公钥，它在分发时完全可以把 A 的公钥换成自己的——这和「CA 被冒充」是同一类问题。</text>
  <text x="44" y="526" font-size="12" fill="#475569">判据：只要能「顺手」接受新公钥，中间人就永远有机会；把变更做成阻断式提示，是最小可行的防线。</text>
  <text x="44" y="550" font-size="12" fill="#94a3b8">注意：本篇未做实测，无读数；本图为流程示意，不涉及任何算法、曲线参数或密钥长度。</text>
</svg>
