<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">IM 的两层序号：帧 seq 随连接归零，会话 seq 跨连接持续递增</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">判据只有一句：重连之后还需要它吗 —— 需要就是会话 seq，不需要就是帧 seq</text>

  <text x="40" y="88" font-size="12.5" font-weight="bold" fill="#1e3a8a">帧头 seq（连接内，用于请求-响应配对）</text>

  <rect x="120" y="100" width="450" height="66" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="345" y="122" text-anchor="middle" font-size="11.5" fill="#1e40af">连接 1（TCP 已建立）</text>
  <rect x="136" y="130" width="80" height="26" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="176" y="148" text-anchor="middle" font-size="11" fill="#1e3a8a">seq=1</text>
  <rect x="222" y="130" width="80" height="26" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="262" y="148" text-anchor="middle" font-size="11" fill="#1e3a8a">seq=2</text>
  <rect x="308" y="130" width="80" height="26" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="348" y="148" text-anchor="middle" font-size="11" fill="#1e3a8a">seq=3</text>
  <rect x="394" y="130" width="80" height="26" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="434" y="148" text-anchor="middle" font-size="11" fill="#1e3a8a">seq=4</text>
  <rect x="480" y="130" width="80" height="26" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="520" y="148" text-anchor="middle" font-size="11" fill="#1e3a8a">seq=5</text>

  <line x1="575" y1="100" x2="575" y2="166" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="575" y="186" text-anchor="middle" font-size="11" fill="#b91c1c">断线重连</text>

  <rect x="600" y="100" width="290" height="66" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="745" y="122" text-anchor="middle" font-size="11.5" fill="#1e40af">连接 2（重连后）</text>
  <rect x="616" y="130" width="80" height="26" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="656" y="148" text-anchor="middle" font-size="11" fill="#1e3a8a">seq=1</text>
  <rect x="702" y="130" width="80" height="26" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="742" y="148" text-anchor="middle" font-size="11" fill="#1e3a8a">seq=2</text>
  <rect x="788" y="130" width="80" height="26" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="828" y="148" text-anchor="middle" font-size="11" fill="#1e3a8a">seq=3</text>

  <text x="40" y="228" font-size="12.5" font-weight="bold" fill="#14532d">会话 seq（持久，用于排序 / 补齐 / 去重）</text>

  <rect x="120" y="240" width="770" height="66" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="136" y="270" width="98" height="26" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="185" y="288" text-anchor="middle" font-size="10.5" fill="#14532d">90124</text>
  <rect x="240" y="270" width="98" height="26" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="289" y="288" text-anchor="middle" font-size="10.5" fill="#14532d">90125</text>
  <rect x="344" y="270" width="98" height="26" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="393" y="288" text-anchor="middle" font-size="10.5" fill="#14532d">90126</text>
  <rect x="448" y="270" width="98" height="26" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="497" y="288" text-anchor="middle" font-size="10.5" fill="#14532d">90127</text>
  <rect x="552" y="270" width="98" height="26" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="601" y="288" text-anchor="middle" font-size="10.5" fill="#7f1d1d">90128</text>
  <rect x="656" y="270" width="98" height="26" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="705" y="288" text-anchor="middle" font-size="10.5" fill="#14532d">90129</text>
  <rect x="760" y="270" width="98" height="26" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="809" y="288" text-anchor="middle" font-size="10.5" fill="#14532d">90130</text>
  <text x="136" y="264" font-size="10.5" fill="#166534">连接 1 段</text>
  <text x="560" y="326" font-size="10.5" fill="#b91c1c">断线期间到达的消息（90128）由重连后的补拉补上，序号不回退</text>

  <rect x="40" y="352" width="920" height="152" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="60" y="378" font-size="12.5" font-weight="bold" fill="#0f172a">两层各管一件事，混用就出结构性问题</text>
  <text x="60" y="404" font-size="12" fill="#334155">帧 seq 只管「这条 ACK 对应哪次发送」：重连后归零，不持久，丢了重发即可。</text>
  <text x="60" y="428" font-size="12" fill="#334155">会话 seq 只管「这是会话的第几条」：服务端分配、永不回退、必须落库，靠它排序与补拉。</text>
  <text x="60" y="452" font-size="12" fill="#b91c1c">注意：把帧 seq 当消息 seq，重连后归零会让接收方误判位点回退并重复拉取。</text>
  <text x="60" y="476" font-size="12" fill="#b91c1c">注意：把消息 seq 当帧 seq，客户端发请求时服务端还没分配，字段根本填不出来。</text>
  <text x="60" y="498" font-size="11.5" fill="#64748B">另需一个 msgID（客户端生成）做幂等去重 —— 三个标识各管一件事，谁都不能替代谁。</text>

  <text x="40" y="540" font-size="11.5" fill="#64748B">说明：图中序号为示意值，非实测读数；本篇与通用篇一致，未做容器实测（需两端在线）</text>
</svg>
