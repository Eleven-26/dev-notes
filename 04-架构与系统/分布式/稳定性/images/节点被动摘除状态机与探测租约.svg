<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="590" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">节点级被动摘除：摘除 → 冷却 → 探测 → 回列的状态机</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#64748b">参数出自本篇使用节配置（FailThreshold=3、Cooldown=5s）与 2.2 节本机实测步骤日志</text>

  <!-- 可用 -->
  <rect x="40" y="130" width="230" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="155" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">可用</text>
  <text x="155" y="186" text-anchor="middle" font-size="12" fill="#334155">参与 Pick 候选</text>
  <text x="155" y="206" text-anchor="middle" font-size="12" fill="#334155">成功一次 streak 清零</text>
  <text x="155" y="226" text-anchor="middle" font-size="12" fill="#334155">累计 fail 只进指标不判定</text>

  <!-- 已摘 -->
  <rect x="385" y="130" width="230" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">已摘（冷却中）</text>
  <text x="500" y="186" text-anchor="middle" font-size="12" fill="#334155">Pick 候选中跳过它</text>
  <text x="500" y="206" text-anchor="middle" font-size="12" fill="#334155">冷却 5s 倒计时</text>
  <text x="500" y="226" text-anchor="middle" font-size="12" fill="#334155">全部摘除时 fail-open 照发</text>

  <!-- 探测在飞 -->
  <rect x="720" y="130" width="230" height="120" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="835" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#c2410c">探测在飞</text>
  <text x="835" y="186" text-anchor="middle" font-size="12" fill="#334155">只放行一个探测请求</text>
  <text x="835" y="206" text-anchor="middle" font-size="12" fill="#334155">认领与判定同一临界区</text>
  <text x="835" y="226" text-anchor="middle" font-size="12" fill="#334155">租约 = 一个 Cooldown</text>

  <!-- 可用 -> 已摘 -->
  <line x1="270" y1="170" x2="381" y2="170" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arR)"/>
  <text x="325" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">连续失败 streak ≥ 3</text>

  <!-- 已摘 -> 探测在飞 -->
  <line x1="615" y1="170" x2="716" y2="170" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arO)"/>
  <text x="667" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">冷却到期被认领</text>

  <!-- 探测 -> 已摘（失败续期） -->
  <line x1="720" y1="222" x2="619" y2="222" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arR)"/>
  <text x="667" y="250" text-anchor="middle" font-size="11.5" fill="#b91c1c">探测失败 → 续期</text>

  <!-- 探测 -> 可用（成功回列，走下方回流线） -->
  <path d="M835 250 L835 400 L155 400 L155 254" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arG)"/>
  <text x="495" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">探测成功 → 立即回列（不等冷却走完）</text>

  <!-- 租约旁路：探测丢失 -> 作废 -->
  <path d="M950 200 L975 200 L975 320 L880 320 L880 254" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arS)"/>
  <text x="928" y="344" text-anchor="middle" font-size="11" fill="#64748b">租约超时未结算 → 作废</text>

  <!-- 底部说明 -->
  <rect x="40" y="430" width="920" height="136" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="456" font-size="13" font-weight="bold" fill="#334155">本机实测三处细节（步骤 1～3）：</text>
  <text x="60" y="480" font-size="12.5" fill="#475569">摘除发生在第 7 次 Pick（A 的第 3 次失败那一刻）；之后 5 次落点序列里没有 A；</text>
  <text x="60" y="500" font-size="12.5" fill="#475569">冷却到期后第一次 Pick 按轮询落到 B —— 摘除只是「不再跳过」，轮询真转到 A 时才是那次探测；</text>
  <text x="60" y="520" font-size="12.5" fill="#475569">探测请求 panic 不结算会永久卡住回列，所以租约超一个 Cooldown 未结算就作废（3 节）。</text>
  <text x="60" y="546" font-size="12.5" font-weight="bold" fill="#b91c1c">fail-open：所有节点都在冷却时 Pick 照常返回一个节点赌一把，摘除机制本身不能成为故障源。</text>

  <defs>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
