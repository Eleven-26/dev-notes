<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">并发限制器的两个设计点：许可要不要超时、满了排队还是拒绝</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">信号量本身只是「许可数 = 最大在途数」；真正要决策的是拿不到许可时怎么办</text>
  <defs>
    <marker id="h1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="h2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="40" y="84" width="380" height="210" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="58" y="108" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">许可池：limit = 8</text>
  <text x="58" y="128" font-size="10" fill="#64748B" text-anchor="start">acquire 成功 = 在途 +1，release = 在途 -1</text>
  <rect x="58" y="142" width="80" height="44" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="98" y="169" font-size="9.5" fill="#991b1b" text-anchor="middle">占用</text>
  <rect x="146" y="142" width="80" height="44" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="186" y="169" font-size="9.5" fill="#991b1b" text-anchor="middle">占用</text>
  <rect x="234" y="142" width="80" height="44" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="274" y="169" font-size="9.5" fill="#991b1b" text-anchor="middle">占用</text>
  <rect x="322" y="142" width="80" height="44" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="362" y="169" font-size="9.5" fill="#991b1b" text-anchor="middle">占用</text>
  <rect x="58" y="194" width="80" height="44" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="98" y="221" font-size="9.5" fill="#991b1b" text-anchor="middle">占用</text>
  <rect x="146" y="194" width="80" height="44" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="186" y="221" font-size="9.5" fill="#991b1b" text-anchor="middle">占用</text>
  <rect x="234" y="194" width="80" height="44" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="274" y="221" font-size="9.5" fill="#166534" text-anchor="middle">空闲</text>
  <rect x="322" y="194" width="80" height="44" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="362" y="221" font-size="9.5" fill="#166534" text-anchor="middle">空闲</text>
  <text x="58" y="254" font-size="10" fill="#334155" text-anchor="start">已用 6 / 8，剩 2 个许可</text>
  <text x="58" y="276" font-size="10" fill="#64748B" text-anchor="start">Go 里最常用带缓冲通道：make(chan struct{}, 8)</text>
  <line x1="424" y1="190" x2="460" y2="190" stroke="#334155" stroke-width="1.6" marker-end="url(#h1)"/>
  <rect x="466" y="100" width="494" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="482" y="122" font-size="10.5" fill="#166534" text-anchor="start" font-weight="bold">拿到许可</text>
  <text x="482" y="142" font-size="10" fill="#334155" text-anchor="start">正常执行业务</text>
  <rect x="466" y="168" width="494" height="56" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="482" y="190" font-size="10.5" fill="#92400e" text-anchor="start" font-weight="bold">有限超时（如 50ms）后仍拿不到</text>
  <text x="482" y="210" font-size="10" fill="#334155" text-anchor="start">返回 429 或降级</text>
  <rect x="466" y="236" width="494" height="56" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="482" y="258" font-size="10.5" fill="#991b1b" text-anchor="start" font-weight="bold">一直等（不超时）</text>
  <text x="482" y="278" font-size="10" fill="#334155" text-anchor="start">排队延迟 → W 照样涨</text>
  <text x="44" y="322" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">三种超时策略</text>
  <rect x="40" y="338" width="920" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.1"/>
  <text x="56" y="364" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="bold">不超时（一直等）</text>
  <text x="300" y="364" font-size="10.5" fill="#334155" text-anchor="start">在途数被限住了，但延迟失控</text>
  <text x="700" y="364" font-size="10" fill="#64748B" text-anchor="start">几乎不该用</text>
  <rect x="40" y="386" width="920" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.1"/>
  <text x="56" y="412" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="bold">零超时（TryAcquire）</text>
  <text x="300" y="412" font-size="10.5" fill="#334155" text-anchor="start">拿不到立刻返回 429 或降级</text>
  <text x="700" y="412" font-size="10" fill="#64748B" text-anchor="start">网关层、对延迟敏感</text>
  <rect x="40" y="434" width="920" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.1"/>
  <text x="56" y="460" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="bold">有限超时（如 50ms）</text>
  <text x="300" y="460" font-size="10.5" fill="#334155" text-anchor="start">等一小会儿，还拿不到就失败</text>
  <text x="700" y="460" font-size="10" fill="#64748B" text-anchor="start">大多数服务端场景</text>
  <rect x="40" y="490" width="920" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="56" y="519" font-size="10.5" fill="#991b1b" text-anchor="start">为什么「不超时」很危险：并发限制器的价值是限住延迟，但无限等待会把「在途」换成「排队」，W 照样涨 —— 只是把延迟挪了个地方</text>
  <text x="44" y="566" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">静态 limit 扫描读数（下游容量 2 时，limit 从 1 扫到 32）</text>
  <text x="40" y="588" font-size="9.5" fill="#1e3a8a" text-anchor="start" font-weight="bold">limit 1</text>
  <text x="40" y="606" font-size="9" fill="#334155" text-anchor="start">完成 100 / RTT 1.00</text>
  <text x="40" y="624" font-size="8.5" fill="#64748B" text-anchor="start">容量浪费一半</text>
  <text x="194" y="588" font-size="9.5" fill="#1e3a8a" text-anchor="start" font-weight="bold">limit 2</text>
  <text x="194" y="606" font-size="9" fill="#334155" text-anchor="start">完成 200 / RTT 1.00</text>
  <text x="194" y="624" font-size="8.5" fill="#64748B" text-anchor="start">恰好等于容量</text>
  <text x="348" y="588" font-size="9.5" fill="#1e3a8a" text-anchor="start" font-weight="bold">limit 4</text>
  <text x="348" y="606" font-size="9" fill="#334155" text-anchor="start">完成 200 / RTT 1.99</text>
  <text x="348" y="624" font-size="8.5" fill="#64748B" text-anchor="start">吞吐不变、RTT 翻倍</text>
  <text x="502" y="588" font-size="9.5" fill="#1e3a8a" text-anchor="start" font-weight="bold">limit 8</text>
  <text x="502" y="606" font-size="9" fill="#334155" text-anchor="start">完成 200 / RTT 3.94</text>
  <text x="502" y="624" font-size="8.5" fill="#64748B" text-anchor="start">RTT 继续涨</text>
  <text x="656" y="588" font-size="9.5" fill="#1e3a8a" text-anchor="start" font-weight="bold">limit 16</text>
  <text x="656" y="606" font-size="9" fill="#334155" text-anchor="start">完成 200 / RTT 7.76</text>
  <text x="656" y="624" font-size="8.5" fill="#64748B" text-anchor="start">更差</text>
  <text x="810" y="588" font-size="9.5" fill="#1e3a8a" text-anchor="start" font-weight="bold">limit 32</text>
  <text x="810" y="606" font-size="9" fill="#334155" text-anchor="start">完成 200 / RTT 15.04</text>
  <text x="810" y="624" font-size="8.5" fill="#64748B" text-anchor="start">开始大量超时</text>
</svg>
