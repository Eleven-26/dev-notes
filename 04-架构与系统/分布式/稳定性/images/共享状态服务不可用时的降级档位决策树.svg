<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="780" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">共享状态服务不可用时的降级档位决策树</text>
  <text x="500" y="58" text-anchor="middle" font-size="13.5" fill="#64748b">出处：本篇四节的 fail-open / fail-closed 推演与降级粒度表、使用节 4) 的本地兜底；200ms 超时取自配置表</text>

  <rect x="350" y="84" width="300" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="106" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1d4ed8">① 共享状态服务能不能连通？</text>
  <text x="500" y="128" text-anchor="middle" font-size="11.5" fill="#334155">判定 timeout 200ms，必须远小于请求超时</text>

  <line x1="430" y1="140" x2="176" y2="192" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arG)"/>
  <line x1="570" y1="140" x2="824" y2="192" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arR)"/>
  <text x="292" y="160" text-anchor="middle" font-size="12" fill="#15803d">可用</text>
  <text x="712" y="160" text-anchor="middle" font-size="12" fill="#b91c1c">不可用</text>

  <rect x="40" y="196" width="260" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="170" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">走正常档</text>
  <text x="170" y="240" text-anchor="middle" font-size="11.5" fill="#334155">限流每请求远程判定，配额精确</text>

  <rect x="700" y="196" width="260" height="58" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="830" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">② 先分机制：限流还是熔断</text>
  <text x="830" y="240" text-anchor="middle" font-size="11.5" fill="#475569">这个选择必须显式做，不能默认掉</text>

  <line x1="170" y1="254" x2="170" y2="296" stroke="#94a3b8" stroke-width="2" marker-end="url(#arS)"/>
  <rect x="40" y="300" width="260" height="76" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="170" y="322" text-anchor="middle" font-size="12" fill="#334155">配额精确：一次判定一次往返</text>
  <text x="170" y="344" text-anchor="middle" font-size="12" fill="#334155">熔断结论 1 秒内被其他副本采纳</text>
  <text x="170" y="366" text-anchor="middle" font-size="12" fill="#64748b">这正是开共享要买的东西</text>

  <line x1="780" y1="254" x2="568" y2="306" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arB)"/>
  <line x1="880" y1="254" x2="842" y2="306" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arB)"/>
  <text x="662" y="280" text-anchor="middle" font-size="11.5" fill="#1d4ed8">限流</text>
  <text x="884" y="284" text-anchor="middle" font-size="11.5" fill="#1d4ed8">熔断</text>

  <rect x="430" y="310" width="250" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="555" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">限流：退回本地桶</text>
  <text x="555" y="354" text-anchor="middle" font-size="11.5" fill="#334155">仍在限，只是限额变成每副本一份</text>
  <text x="555" y="376" text-anchor="middle" font-size="11.5" fill="#334155">3 副本 = 3 倍配额，服务不中断</text>

  <rect x="710" y="310" width="250" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="835" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">熔断：退回本地状态机</text>
  <text x="835" y="354" text-anchor="middle" font-size="11.5" fill="#334155">共享本来就只是优化</text>
  <text x="835" y="376" text-anchor="middle" font-size="11.5" fill="#334155">不共享只是多付几次学费</text>

  <line x1="555" y1="390" x2="616" y2="426" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arS)"/>
  <line x1="835" y1="390" x2="774" y2="426" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arS)"/>
  <text x="695" y="412" text-anchor="middle" font-size="11.5" fill="#64748b">本地兜底也不成立时</text>

  <rect x="430" y="430" width="530" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="695" y="452" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">③ 只有「退回本地」也不成立时，才被迫二选一</text>
  <text x="695" y="472" text-anchor="middle" font-size="11.5" fill="#475569">例：这条路由本来就没配本地桶 / 新副本冷启动手里没状态</text>

  <line x1="600" y1="482" x2="428" y2="516" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arR)"/>
  <line x1="760" y1="482" x2="782" y2="516" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arS)"/>
  <text x="470" y="500" text-anchor="middle" font-size="11.5" fill="#b91c1c">默认档</text>

  <rect x="250" y="520" width="330" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="415" y="544" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">fail-open：全部放行</text>
  <text x="415" y="566" text-anchor="middle" font-size="11.5" fill="#475569">限流暂时失效，但服务还活着</text>
  <text x="415" y="588" text-anchor="middle" font-size="11.5" fill="#475569">必须计数：gw_shared_state_errors_total</text>
  <text x="415" y="610" text-anchor="middle" font-size="11.5" fill="#475569">静默放行等于把「限流失效」藏起来</text>

  <rect x="620" y="520" width="330" height="100" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="785" y="544" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">fail-closed：全部拒绝</text>
  <text x="785" y="566" text-anchor="middle" font-size="11.5" fill="#475569">抖动 3 秒 = 把网关打成全站 503</text>
  <text x="785" y="588" text-anchor="middle" font-size="11.5" fill="#475569">比被刷更糟：被刷只是超发，</text>
  <text x="785" y="610" text-anchor="middle" font-size="11.5" fill="#475569">全拒是彻底不可用</text>

  <rect x="40" y="646" width="920" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="670" font-size="13" font-weight="bold" fill="#334155">退档阶梯：跨副本精确配额 → 每副本一份配额（本地桶）→ 压根不限（fail-open）或全站拒绝（fail-closed）</text>
  <text x="60" y="694" font-size="12.5" fill="#475569">要点：「退回本地」不等于「fail-open」—— 本地桶仍然限流，只是限额变成每个副本各一份；状态服务因此从单点开关降级为精度级别。</text>
  <text x="60" y="716" font-size="12.5" fill="#475569">要点：真正的 fail-open 让共享状态服务成为限流的单点开关 —— 谁把它打挂，谁就获得无限配额。</text>
  <text x="60" y="740" font-size="12" fill="#64748b">未实测：需要起「两副本 + 一个状态服务」才能观察的现象（抖动 3 秒期间的实际放行量）本篇未跑，本图只画正文给出的档位。</text>

  <defs>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
