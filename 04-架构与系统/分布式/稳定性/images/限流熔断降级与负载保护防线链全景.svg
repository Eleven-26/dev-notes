<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 980" width="1000" height="980" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="980" fill="#ffffff"/>

  <text x="500" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">限流 / 熔断 / 降级 / 负载保护：防线链全景——分工边界、触发顺序与 reason 码落点</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#64748b">分工边界出自 稳定性/README.md 第一节与本篇第一节对照表、使用 3) 防线表；链顺序与两类 503 出自本篇第四节与 熔断器.md 使用 2)；闸门四层判定出自本篇第二、三节</text>
  <text x="500" y="68" text-anchor="middle" font-size="12" fill="#64748b">熔断三态机与阈值、重试放大链、网关完整流水线不在本图：见 熔断器.md 的状态机图、重试风暴图与 从零实现网关.md，同型不重画</text>

  <!-- ① 分工边界：四件事各管一段 -->
  <text x="20" y="94" font-size="13" font-weight="bold" fill="#0f172a">① 分工边界：四件事各管一段</text>

  <rect x="20" y="100" width="234" height="112" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="137" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">限流：流量防护</text>
  <text x="137" y="147" text-anchor="middle" font-size="10.5" fill="#334155">保护自己，控制「进来多少」</text>
  <text x="137" y="166" text-anchor="middle" font-size="10.5" fill="#334155">判据：入口 QPS / 并发 / 热点参数</text>
  <text x="137" y="185" text-anchor="middle" font-size="10.5" fill="#475569">落点：网关 / 接入层 / 接口入口</text>

  <rect x="262" y="100" width="234" height="112" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="379" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">负载保护：并发闸门</text>
  <text x="379" y="147" text-anchor="middle" font-size="10.5" fill="#334155">护网关自身，管「此刻有多少在飞」</text>
  <text x="379" y="166" text-anchor="middle" font-size="10.5" fill="#334155">典型触发：上游变慢、请求数没涨</text>
  <text x="379" y="185" text-anchor="middle" font-size="10.5" fill="#475569">拒绝：503 + Retry-After</text>

  <rect x="504" y="100" width="234" height="112" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="621" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">熔断：依赖防护</text>
  <text x="621" y="147" text-anchor="middle" font-size="10.5" fill="#334155">不被上游拖死，控制「出去多少」</text>
  <text x="621" y="166" text-anchor="middle" font-size="10.5" fill="#334155">判据：上游错误率 / 慢调用比例</text>
  <text x="621" y="185" text-anchor="middle" font-size="10.5" fill="#475569">落点：RPC/HTTP Client、DAO 层</text>

  <rect x="746" y="100" width="234" height="112" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="863" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">降级：业务取舍</text>
  <text x="863" y="147" text-anchor="middle" font-size="10.5" fill="#334155">决定「放弃什么」，不是第四道自动闸门</text>
  <text x="863" y="166" text-anchor="middle" font-size="10.5" fill="#334155">触发：人工开关 / 熔断 / 限流</text>
  <text x="863" y="185" text-anchor="middle" font-size="10.5" fill="#475569">兜底：默认值/缓存/异步化/关非核心/排队</text>

  <!-- ② 触发顺序：七道关卡 -->
  <text x="30" y="236" font-size="13" font-weight="bold" fill="#0f172a">② 触发顺序：一条请求依次过七道关卡，右侧标拒绝码与 reason</text>

  <rect x="30" y="244" width="440" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="44" y="264" font-size="12" font-weight="bold" fill="#15803d">① self 路由（/healthz 一类）</text>
  <text x="44" y="284" font-size="10.5" fill="#334155">必须先于闸门：健康检查也被拒 → LB 判定整个网关挂了</text>
  <line x1="250" y1="296" x2="250" y2="304" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arS)"/>
  <rect x="482" y="252" width="200" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="582" y="274" text-anchor="middle" font-size="11" fill="#15803d">恒放行，闸门只 shed 业务流量</text>

  <rect x="30" y="304" width="440" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="44" y="324" font-size="12" font-weight="bold" fill="#7c2d12">② 负载保护闸门（并发水位）</text>
  <text x="44" y="344" font-size="10.5" fill="#334155">判据：此刻在飞数；生产示例 128 / 32 / 1s，实测档位 2 / 1 / 200ms</text>
  <line x1="250" y1="356" x2="250" y2="364" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arS)"/>
  <rect x="482" y="304" width="200" height="52" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="582" y="325" text-anchor="middle" font-size="11" fill="#b91c1c">503 + Retry-After</text>
  <text x="582" y="345" text-anchor="middle" font-size="11" fill="#b91c1c">queue_full / queue_timeout</text>

  <rect x="30" y="364" width="440" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="44" y="384" font-size="12" font-weight="bold" fill="#1e40af">③ 鉴权</text>
  <text x="44" y="404" font-size="10.5" fill="#334155">闸门排在它前面：过载时更不该先做昂贵的事（查签名 / 比密钥 / 读缓存）</text>
  <line x1="250" y1="416" x2="250" y2="424" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arS)"/>
  <rect x="482" y="372" width="200" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="582" y="394" text-anchor="middle" font-size="11" fill="#64748b">闸门在前：被拒请求不白付鉴权成本</text>

  <rect x="30" y="424" width="440" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="44" y="444" font-size="12" font-weight="bold" fill="#1e40af">④ 限流（按速率）</text>
  <text x="44" y="464" font-size="10.5" fill="#334155">每秒进来多少；按「谁在用」计数（用户 / IP / 路由），身份来自鉴权之后</text>
  <line x1="250" y1="476" x2="250" y2="484" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arS)"/>
  <rect x="482" y="424" width="200" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="582" y="445" text-anchor="middle" font-size="11" fill="#1d4ed8">429 + Retry-After</text>
  <text x="582" y="465" text-anchor="middle" font-size="11" fill="#1d4ed8">恢复：等下一个窗口</text>

  <rect x="30" y="484" width="440" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="44" y="504" font-size="12" font-weight="bold" fill="#b91c1c">⑤ 熔断检查（必须在选节点之前）</text>
  <text x="44" y="524" font-size="10.5" fill="#334155">顺序反了白算一次 LB、还可能已建到已挂上游的连接；打开期间不进重试链</text>
  <line x1="250" y1="536" x2="250" y2="544" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arS)"/>
  <rect x="482" y="484" width="200" height="52" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="582" y="505" text-anchor="middle" font-size="11" fill="#b91c1c">503 + circuit_open</text>
  <text x="582" y="525" text-anchor="middle" font-size="11" fill="#b91c1c">恢复：冷却 + 半开探测</text>

  <rect x="30" y="544" width="440" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="564" font-size="12" font-weight="bold" fill="#334155">⑥ 选节点（负载均衡 + 被动摘除）</text>
  <text x="44" y="584" font-size="10.5" fill="#334155">摘除发生在这一层：只换节点不拒绝请求；先摘点，整片不行才熔服务</text>
  <line x1="250" y1="596" x2="250" y2="604" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arS)"/>
  <rect x="482" y="552" width="200" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="582" y="574" text-anchor="middle" font-size="11" fill="#64748b">不拒绝请求，只换一个节点</text>

  <rect x="30" y="604" width="440" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="624" font-size="12" font-weight="bold" fill="#334155">⑦ 转发上游，结算后上报</text>
  <text x="44" y="644" font-size="10.5" fill="#334155">一次业务只向熔断器上报一个最终结果；转发完成即归还槽位</text>
  <rect x="482" y="612" width="200" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="582" y="634" text-anchor="middle" font-size="11" fill="#64748b">cb.Report / gate.release</text>

  <!-- ④ 闸门内部四层判定（右列） -->
  <text x="698" y="236" font-size="13" font-weight="bold" fill="#0f172a">④ 闸门内部：四层判定（链第②步展开）</text>

  <rect x="698" y="244" width="282" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="839" y="266" text-anchor="middle" font-size="11.5" fill="#1e40af">Q1  max_inflight = 0 ？</text>
  <text x="839" y="288" text-anchor="middle" font-size="10.5" fill="#475569">是 → 不启用闸门，直接放行（实测 reason 空）</text>
  <line x1="839" y1="304" x2="839" y2="326" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arS)"/>
  <text x="848" y="320" font-size="10" fill="#475569">否</text>

  <rect x="698" y="326" width="282" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="839" y="348" text-anchor="middle" font-size="11.5" fill="#1e40af">Q2  快路径非阻塞拿到槽位？</text>
  <text x="839" y="370" text-anchor="middle" font-size="10.5" fill="#475569">是 → 放行 inflight+1，返回幂等 release（Once）</text>
  <line x1="839" y1="386" x2="839" y2="408" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arS)"/>
  <text x="848" y="402" font-size="10" fill="#475569">否：并发已满</text>

  <rect x="698" y="408" width="282" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="839" y="430" text-anchor="middle" font-size="11.5" fill="#1e40af">Q3  并发已满：waiting+1 &gt; max_queue ？</text>
  <text x="839" y="452" text-anchor="middle" font-size="10.5" fill="#b91c1c">是 → 拒绝 queue_full → 503</text>
  <text x="839" y="472" text-anchor="middle" font-size="10.5" fill="#475569">瞬时争抢太激烈：调大队列或扩容</text>
  <line x1="839" y1="484" x2="839" y2="506" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arS)"/>
  <text x="848" y="500" font-size="10" fill="#475569">否：队列有位</text>

  <rect x="698" y="506" width="282" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="839" y="528" text-anchor="middle" font-size="11.5" fill="#1e40af">Q4  排队中：时限内等到槽位？</text>
  <text x="839" y="550" text-anchor="middle" font-size="10.5" fill="#b91c1c">否（ctx 到期）→ queue_timeout → 503</text>
  <text x="839" y="570" text-anchor="middle" font-size="10.5" fill="#475569">槽位周转太慢：查上游为什么慢</text>
  <line x1="839" y1="582" x2="839" y2="604" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arG)"/>
  <text x="848" y="598" font-size="10" fill="#15803d">是：排到了</text>

  <rect x="698" y="604" width="282" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="839" y="624" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">放行：排到槽位才进入</text>
  <text x="839" y="644" text-anchor="middle" font-size="10.5" fill="#334155">channel 等待队列天然 FIFO；排到后 waiting 立即减回</text>

  <!-- ③ reason 码落点：同为 503 含义不同 -->
  <text x="20" y="682" font-size="13" font-weight="bold" fill="#0f172a">③ reason 码落点：同为 503，含义完全不同</text>

  <rect x="20" y="690" width="300" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="714" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">限流：429 + Retry-After</text>
  <text x="170" y="738" text-anchor="middle" font-size="10.5" fill="#475569">含义：「你超配额了」</text>
  <text x="170" y="758" text-anchor="middle" font-size="10.5" fill="#475569">动作：等下一个窗口 / 排队提示</text>

  <rect x="350" y="690" width="300" height="92" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="500" y="714" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">闸门：queue_full / queue_timeout → 503</text>
  <text x="500" y="738" text-anchor="middle" font-size="10.5" fill="#475569">含义：「我这里忙」，等槽位释放</text>
  <text x="500" y="758" text-anchor="middle" font-size="10.5" fill="#475569">两种拒绝都必须带 Retry-After</text>

  <rect x="680" y="690" width="300" height="92" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="830" y="714" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">熔断：circuit_open → 503</text>
  <text x="830" y="738" text-anchor="middle" font-size="10.5" fill="#475569">含义：「上游不行了」，冷却 + 半开探测</text>
  <text x="830" y="758" text-anchor="middle" font-size="10.5" fill="#475569">恢复方式与闸门完全不同，别混成一个码</text>

  <!-- 闸门口径与实测读数 -->
  <rect x="20" y="792" width="960" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="814" font-size="11.5" fill="#475569">waiting 是准入计数不是精确队列长度：允许轻微超发换掉一把锁，真正的上限由 slots 容量保证；release 必须幂等，漏一次 = 永久少一个并发额度。</text>
  <text x="36" y="836" font-size="11.5" fill="#475569">实测 2 / 1 / 200ms：第 1、2 个拿槽 inflight=2；第 3 个排队 waiting=1；第 4 个 queue_full；释放 1 个槽位后第 3 个放行；</text>
  <text x="36" y="858" font-size="11.5" fill="#475569">释放的槽位被立刻抢走时排队者 queue_timeout；连调 3 次 release 后 inflight 仍为 0，不会把额度还多。</text>

  <!-- 一句话分清 -->
  <rect x="20" y="874" width="960" height="94" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="36" y="898" font-size="12" font-weight="bold" fill="#15803d">限流 =「我扛不住了，少来点」：保护自己，看的是入口流量，通常一直生效；</text>
  <text x="36" y="920" font-size="12" font-weight="bold" fill="#15803d">熔断 =「你（下游）不行了，我先不调你」：保护下游，只在故障期临时生效，看的是调用结果；</text>
  <text x="36" y="942" font-size="12" fill="#334155">降级 =「这个先不做了」：可由开关 / 熔断 / 限流任一触发——拒绝码与 reason 的作用就是让人分清「该重试还是该降级」。</text>
  <text x="36" y="962" font-size="11.5" fill="#475569">降级判据：产生「本该发生但没发生」的副作用就要补偿——写降级落本地消息表 / MQ、恢复后补做对账；读降级可直接丢弃。</text>

  <defs>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
