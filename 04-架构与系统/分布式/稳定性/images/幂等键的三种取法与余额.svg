<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">幂等键取错了会怎样：三种取法的余额</text>
  <text x="500" y="56" text-anchor="middle" font-size="14" fill="#64748b">初始余额 1000、每笔扣 100；重放 3 次 + 一笔真实新单（第五节实测）</text>

  <!-- 判据 -->
  <rect x="270" y="80" width="460" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="500" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">这个键，能不能区分「重试」和「新意图」？</text>
  <text x="500" y="122" text-anchor="middle" font-size="11" fill="#475569">同一意图必须同键（拦得住）· 不同意图必须异键（不误拦）</text>

  <!-- 分支线 -->
  <path d="M500 132 L500 152 L190 152 L190 186" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M500 152 L500 186" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M500 152 L810 152 L810 186" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M184 180 L190 190 L196 180" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M494 180 L500 190 L506 180" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M804 180 L810 190 L816 180" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 卡片 K2 -->
  <rect x="40" y="196" width="300" height="160" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="190" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">K2 服务端每次生成 UUID</text>
  <text x="190" y="248" text-anchor="middle" font-size="11" fill="#7f1d1d">每次重试都是新键</text>
  <text x="190" y="270" text-anchor="middle" font-size="11" fill="#7f1d1d">= 拦不住任何重复</text>
  <text x="190" y="300" text-anchor="middle" font-size="20" font-weight="bold" fill="#b91c1c">700.00</text>
  <text x="190" y="322" text-anchor="middle" font-size="11" fill="#b91c1c">重放 3 次全扣（应 800）</text>
  <text x="190" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">看起来加了幂等，实际没有</text>

  <!-- 卡片 K3 -->
  <rect x="350" y="196" width="300" height="160" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="500" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">K3 用户 + 金额 哈希</text>
  <text x="500" y="248" text-anchor="middle" font-size="11" fill="#78350f">把「意图」和「参数」混为一谈</text>
  <text x="500" y="270" text-anchor="middle" font-size="11" fill="#78350f">重放拦住了，真实第二单也被拦</text>
  <text x="500" y="300" text-anchor="middle" font-size="20" font-weight="bold" fill="#b45309">900.00</text>
  <text x="500" y="322" text-anchor="middle" font-size="11" fill="#b45309">第二笔真实订单没扣款（应 800）</text>
  <text x="500" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">少扣钱≠没问题：用户以为成功了</text>

  <!-- 卡片 K1 -->
  <rect x="660" y="196" width="300" height="160" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="810" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">K1 客户端传 requestId ⭐</text>
  <text x="810" y="248" text-anchor="middle" font-size="11" fill="#047857">发起方才知道「这是同一次重试」</text>
  <text x="810" y="270" text-anchor="middle" font-size="11" fill="#047857">重试同键、新单异键</text>
  <text x="810" y="300" text-anchor="middle" font-size="20" font-weight="bold" fill="#047857">800.00</text>
  <text x="810" y="322" text-anchor="middle" font-size="11" fill="#047857">重放只扣 1 次，新单正常扣</text>
  <text x="810" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">两条要求同时满足</text>

  <!-- 底部 -->
  <line x1="40" y1="384" x2="960" y2="384" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="408" font-size="13" font-weight="bold" fill="#0f172a">对键的三条要求：</text>
  <text x="40" y="432" font-size="12" fill="#334155">① 由发起方生成　② 随重试不变（客户端、网关、MQ 重投都带同一个值）　③ 长度字符集可控（≤64 字符、纯 ASCII）</text>
  <text x="40" y="458" font-size="12" fill="#475569">补充：键要和「业务身份的维度」对齐 —— 支付回调用支付单号、退款用退款单号、MQ 消费用「消息 ID + 消费者组」，</text>
  <text x="40" y="478" font-size="12" fill="#475569">用错维度会出现「同一订单的支付回调和一个无关操作撞键」。</text>
</svg>
