<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">三道防线分工对比：被动摘除 / 主动探活 / 服务级熔断</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#64748b">口径出自本篇第一节与 2.3、五节：看什么信号、发现快慢、能兜住什么故障，三者互不替代</text>

  <!-- 被动摘除 -->
  <rect x="40" y="96" width="300" height="296" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="190" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">节点级被动摘除</text>
  <text x="56" y="158" font-size="12.5" fill="#334155">信号：真实请求的连续失败</text>
  <text x="56" y="184" font-size="12.5" fill="#334155">快慢：慢 —— 阈值 3 就意味</text>
  <text x="56" y="202" font-size="12.5" fill="#334155">前 3 个落到坏节点的用户必败</text>
  <text x="56" y="228" font-size="12.5" fill="#334155">兜住：连接拒绝、超时、5xx，</text>
  <text x="56" y="246" font-size="12.5" fill="#334155">包括探活看不出来的静默错误</text>
  <text x="56" y="272" font-size="12.5" fill="#334155">动作：跳过单个节点，</text>
  <text x="56" y="290" font-size="12.5" fill="#334155">冷却 + 一次探测决定回列</text>
  <text x="56" y="316" font-size="12.5" font-weight="bold" fill="#15803d">定位：第一道防线</text>
  <text x="56" y="334" font-size="12.5" fill="#334155">（细粒度、可自愈）</text>
  <text x="56" y="368" font-size="12" fill="#64748b">前提：有多个等价节点</text>

  <!-- 主动健康检查 -->
  <rect x="350" y="96" width="300" height="296" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">主动健康检查</text>
  <text x="366" y="158" font-size="12.5" fill="#334155">信号：定期探活请求</text>
  <text x="366" y="184" font-size="12.5" fill="#334155">快慢：快 —— 秒级剔除</text>
  <text x="366" y="210" font-size="12.5" fill="#334155">兜住：进程死了、端口不通</text>
  <text x="366" y="236" font-size="12.5" fill="#334155">盲区：探活成功 ≠ 业务成功，</text>
  <text x="366" y="254" font-size="12.5" fill="#334155">依赖下游库失败可能探不出来</text>
  <text x="366" y="280" font-size="12.5" fill="#334155">动作：标记不健康 / 移出列表，</text>
  <text x="366" y="298" font-size="12.5" fill="#334155">但探活本身也有成本</text>
  <text x="366" y="324" font-size="12.5" font-weight="bold" fill="#1d4ed8">定位：与被动摘除搭配用</text>
  <text x="366" y="342" font-size="12.5" fill="#334155">（本项目当前只有被动摘除）</text>

  <!-- 服务级熔断 -->
  <rect x="660" y="96" width="300" height="296" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="810" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">服务级熔断</text>
  <text x="676" y="158" font-size="12.5" fill="#334155">信号：整片失败率（滑动窗口）</text>
  <text x="676" y="184" font-size="12.5" fill="#334155">快慢：中 —— 攒够样本才达标</text>
  <text x="676" y="210" font-size="12.5" fill="#334155">兜住：服务级故障（依赖挂了、</text>
  <text x="676" y="228" font-size="12.5" fill="#334155">所有实例都答不了）</text>
  <text x="676" y="254" font-size="12.5" fill="#334155">盲区：3 节点坏 1 个失败率 33%，</text>
  <text x="676" y="272" font-size="12.5" fill="#334155">阈值 30% 时整片被误判</text>
  <text x="676" y="298" font-size="12.5" fill="#334155">动作：停止调用上游、503 快速</text>
  <text x="676" y="316" font-size="12.5" fill="#334155">失败，冷却 + 半开探测恢复</text>
  <text x="676" y="342" font-size="12.5" font-weight="bold" fill="#b91c1c">定位：最后兜底（粗粒度）</text>
  <text x="676" y="368" font-size="12" fill="#64748b">先摘点、后熔服务</text>

  <!-- 底部决策链 -->
  <rect x="40" y="420" width="920" height="212" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="448" font-size="13" font-weight="bold" fill="#334155">三者怎么接力（2.3 节分工表）：</text>

  <rect x="70" y="470" width="250" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="195" y="496" text-anchor="middle" font-size="12.5" fill="#15803d" font-weight="bold">还有健康节点</text>
  <text x="195" y="518" text-anchor="middle" font-size="12" fill="#334155">摘除：跳过坏的，正常服务</text>

  <line x1="320" y1="502" x2="366" y2="502" stroke="#94a3b8" stroke-width="2" marker-end="url(#arS)"/>

  <rect x="370" y="470" width="250" height="64" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="495" y="496" text-anchor="middle" font-size="12.5" fill="#b45309" font-weight="bold">一个健康节点都不剩</text>
  <text x="495" y="518" text-anchor="middle" font-size="12" fill="#334155">摘除让位：fail-open 照常发</text>

  <line x1="620" y1="502" x2="666" y2="502" stroke="#94a3b8" stroke-width="2" marker-end="url(#arS)"/>

  <rect x="670" y="470" width="250" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="795" y="496" text-anchor="middle" font-size="12.5" fill="#b91c1c" font-weight="bold">整片持续失败</text>
  <text x="795" y="518" text-anchor="middle" font-size="12" fill="#334155">熔断：快速失败保护调用方</text>

  <text x="60" y="566" font-size="12.5" fill="#64748b">fail-open 若写成 fail-closed（全摘就返回 ErrNoUpstream），摘除机制本身就成了「上游一抖动就全站不可用」的故障源。</text>
  <text x="60" y="590" font-size="12.5" fill="#64748b">摘除是数据面快路径（进程内立刻生效），通知注册中心下线是控制面慢路径（心跳过期、下游感知，秒到分钟级）：摘除止血、下线治本。</text>

  <defs>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
