<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">重复请求该返回什么：按幂等记录的状态分流</text>
  <text x="500" y="56" text-anchor="middle" font-size="14" fill="#64748b">第七节；核心一条：重复请求不能返回错误码，否则上游会一直重试</text>

  <!-- 起点 -->
  <rect x="340" y="78" width="320" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="500" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">INSERT 幂等记录（status=PROCESSING）</text>
  <text x="500" y="120" text-anchor="middle" font-size="11" fill="#b91c1c">唯一键冲突 → 说明这个请求之前来过</text>

  <path d="M500 128 L500 150" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <text x="512" y="146" font-size="11" fill="#475569">读已有记录的状态</text>

  <path d="M500 156 L500 166 L180 166 L180 194" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M500 166 L500 194" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M500 166 L820 166 L820 194" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M174 188 L180 198 L186 188" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M494 188 L500 198 L506 188" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M814 188 L820 198 L826 188" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- DONE -->
  <rect x="40" y="204" width="280" height="126" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="180" y="230" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">status = DONE ⭐</text>
  <text x="180" y="256" text-anchor="middle" font-size="12" fill="#047857">返回保存的 result_json</text>
  <text x="180" y="278" text-anchor="middle" font-size="11" fill="#475569">对调用方而言与首次成功无差别</text>
  <text x="180" y="304" text-anchor="middle" font-size="11" fill="#065f46">这是唯一能「真正幂等」的语义</text>

  <!-- PROCESSING -->
  <rect x="360" y="204" width="280" height="126" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="500" y="230" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">status = PROCESSING</text>
  <text x="500" y="256" text-anchor="middle" font-size="12" fill="#b45309">返回「处理中，请稍后查询」</text>
  <text x="500" y="278" text-anchor="middle" font-size="11" fill="#475569">首次请求还没结束，结果未定</text>
  <text x="500" y="304" text-anchor="middle" font-size="11" fill="#b45309">要配超时判定：卡太久就是异常</text>

  <!-- FAILED -->
  <rect x="680" y="204" width="280" height="126" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="820" y="230" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">status = FAILED</text>
  <text x="820" y="256" text-anchor="middle" font-size="12" fill="#475569">允许本次重新执行</text>
  <text x="820" y="278" text-anchor="middle" font-size="11" fill="#475569">或直接返回失败原因</text>
  <text x="820" y="304" text-anchor="middle" font-size="11" fill="#334155">不清理也不放行 = 永久卡死</text>

  <!-- 底部 -->
  <line x1="40" y1="354" x2="960" y2="354" stroke="#cbd5e1" stroke-width="1"/>

  <text x="40" y="378" font-size="13" font-weight="bold" fill="#b91c1c">❌ 不能这样返回：</text>
  <text x="40" y="400" font-size="12" fill="#7f1d1d">返回 400 / 409 / 500「重复请求」→ 上游按错误码重试 → 一直重试到超时上限，把一次重复放大成一串重试。</text>

  <text x="40" y="428" font-size="13" font-weight="bold" fill="#065f46">⭐ 三种状态的区分，正是「幂等表」和「唯一索引」的关键差别：</text>
  <text x="40" y="450" font-size="12" fill="#475569">唯一索引只告诉你「来过」；幂等表还能告诉你「做到哪一步、结果是什么」——需要返回首次结果的场景必须用幂等表。</text>
</svg>
