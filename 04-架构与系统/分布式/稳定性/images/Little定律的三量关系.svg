<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1100" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">限在途数等于同时约束「进来多少」与「待多久」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">L = λ × W 不依赖任何分布假设，只要求系统稳定 —— 移项成 λ = L / W 就能看出全部答案</text>
  <defs>
    <marker id="g4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="340" y="84" width="320" height="96" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="500" y="124" font-size="22" fill="#1e3a8a" text-anchor="middle" font-weight="bold">L = λ × W</text>
  <text x="500" y="162" font-size="12" fill="#1e40af" text-anchor="middle">移项：λ = L / W</text>
  <rect x="40" y="204" width="290" height="62" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="54" y="228" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">L = 同时在处理的请求数</text>
  <text x="54" y="250" font-size="11" fill="#64748B" text-anchor="start">就是并发限制器的 limit</text>
  <rect x="350" y="204" width="290" height="62" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="364" y="228" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">λ = 实际放行的到达率</text>
  <text x="364" y="250" font-size="11" fill="#64748B" text-anchor="start">也就是吞吐</text>
  <rect x="660" y="204" width="290" height="62" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="674" y="228" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">W = 单个请求的平均耗时</text>
  <text x="674" y="250" font-size="11" fill="#64748B" text-anchor="start">RTT / 响应时间</text>
  <line x1="480" y1="182" x2="185" y2="200" stroke="#2563eb" stroke-width="1.3" marker-end="url(#g4)"/>
  <line x1="500" y1="182" x2="500" y2="200" stroke="#16a34a" stroke-width="1.3" marker-end="url(#g4)"/>
  <line x1="520" y1="182" x2="805" y2="200" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#g4)"/>
  <text x="44" y="302" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">下游变慢（W 变大）时，两种策略的走向完全相反</text>
  <rect x="40" y="318" width="440" height="148" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="58" y="342" font-size="12" fill="#991b1b" text-anchor="start" font-weight="bold">只限 λ（QPS 限制）</text>
  <text x="58" y="368" font-size="11" fill="#334155" text-anchor="start">λ 被钉住 → 为了让 L = λ × W 成立</text>
  <text x="58" y="390" font-size="11" fill="#b91c1c" text-anchor="start">L 只能跟着 W 一起涨</text>
  <text x="58" y="412" font-size="11" fill="#b91c1c" text-anchor="start">→ 队列无限堆积 → W 继续涨</text>
  <text x="58" y="436" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="bold">→ 正反馈，助推雪崩</text>
  <text x="58" y="458" font-size="11" fill="#64748B" text-anchor="start">隐含前提：下游延迟必须稳定</text>
  <rect x="520" y="318" width="440" height="148" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="538" y="342" font-size="12" fill="#166534" text-anchor="start" font-weight="bold">只限 L（并发限制）</text>
  <text x="538" y="368" font-size="11" fill="#334155" text-anchor="start">L 被钉住 → λ = L / W</text>
  <text x="538" y="390" font-size="11" fill="#166534" text-anchor="start">W 变大时 λ 自动变小</text>
  <text x="538" y="412" font-size="11" fill="#166534" text-anchor="start">→ 这就是背压，系统稳定</text>
  <text x="538" y="436" font-size="11" fill="#166534" text-anchor="start" font-weight="bold">→ 吞吐下来，但延迟可控</text>
  <text x="538" y="458" font-size="11" fill="#64748B" text-anchor="start">代价：拒绝/排队，而不是无限等</text>
  <text x="44" y="494" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">实测验证（先只看还没变慢的前半段，下游容量 8）</text>
  <rect x="40" y="512" width="920" height="88" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="536" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">静态 limit</text>
  <text x="200" y="536" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">完成数</text>
  <text x="340" y="536" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">平均在途 L</text>
  <text x="500" y="536" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">平均 RTT W</text>
  <text x="650" y="536" font-size="11" fill="#0f172a" text-anchor="start" font-weight="bold">L 与 λ·W 是否吻合</text>
  <text x="60" y="560" font-size="11" fill="#334155" text-anchor="start">4</text>
  <text x="200" y="560" font-size="11" fill="#334155" text-anchor="start">396</text>
  <text x="340" y="560" font-size="11" fill="#334155" text-anchor="start">4.00</text>
  <text x="500" y="560" font-size="11" fill="#334155" text-anchor="start">1.00</text>
  <text x="650" y="560" font-size="11" fill="#166534" text-anchor="start" font-weight="bold">4.00 == 4 × 1.00 ✓</text>
  <text x="60" y="582" font-size="11" fill="#334155" text-anchor="start">8</text>
  <text x="200" y="582" font-size="11" fill="#334155" text-anchor="start">792</text>
  <text x="340" y="582" font-size="11" fill="#334155" text-anchor="start">8.00</text>
  <text x="500" y="582" font-size="11" fill="#334155" text-anchor="start">1.00</text>
  <text x="650" y="582" font-size="11" fill="#166534" text-anchor="start" font-weight="bold">8.00 == 8 × 1.00 ✓</text>
  <text x="44" y="626" font-size="11" fill="#64748B" text-anchor="start">推论：静态 limit 的有效期 = 「下游容量不变」的那段时间；下游容量从前半段的 8 掉到 2，静态值就失效了 —— 这是自适应算法存在的理由</text>
</svg>
