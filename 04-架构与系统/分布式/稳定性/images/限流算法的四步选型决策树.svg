<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">限流算法的四步选型：先问能不能突发，再问要不要精确</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">同一族算法不是并列选项，顺着四个问题走一遍就能落到具体算法</text>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="20" y="92" width="960" height="40" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="500" y="118" font-size="13" fill="#475569" text-anchor="middle">选型顺序固定：能不能允许突发 → 要不要严格匀速 → 要不要无边界误差 → 愿不愿意人工调参</text>
  <rect x="40" y="152" width="300" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="56" y="176" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="bold">Q1</text>
  <text x="56" y="197" font-size="14" fill="#0f172a" text-anchor="start" font-weight="bold">能不能允许突发？</text>
  <line x1="344" y1="182" x2="452" y2="182" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="398" y="174" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="bold">能</text>
  <rect x="456" y="152" width="210" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
  <text x="561" y="189" font-size="16" fill="#1d4ed8" text-anchor="middle" font-weight="bold">令牌桶</text>
  <text x="682" y="179" font-size="12" fill="#475569" text-anchor="start">O(1) 内存，桶内额度允许攒，互联网业务主流</text>
  <path d="M190,212 L190,248" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a1)"/>
  <text x="200" y="234" font-size="11" fill="#94a3b8" text-anchor="start">否</text>
  <rect x="40" y="248" width="300" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="56" y="272" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="bold">Q2</text>
  <text x="56" y="293" font-size="14" fill="#0f172a" text-anchor="start" font-weight="bold">要不要严格匀速保护下游？</text>
  <line x1="344" y1="278" x2="452" y2="278" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="398" y="270" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold">要</text>
  <rect x="456" y="248" width="210" height="60" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
  <text x="561" y="285" font-size="16" fill="#15803d" text-anchor="middle" font-weight="bold">漏桶</text>
  <text x="682" y="275" font-size="12" fill="#475569" text-anchor="start">流出速率恒定，把突发整形；redis-cell 原生支持</text>
  <path d="M190,308 L190,344" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a1)"/>
  <text x="200" y="330" font-size="11" fill="#94a3b8" text-anchor="start">否</text>
  <rect x="40" y="344" width="300" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="56" y="368" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="bold">Q3</text>
  <text x="56" y="389" font-size="14" fill="#0f172a" text-anchor="start" font-weight="bold">要不要无边界误差？</text>
  <line x1="344" y1="374" x2="452" y2="374" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="398" y="366" font-size="12" fill="#a16207" text-anchor="middle" font-weight="bold">要</text>
  <rect x="456" y="344" width="210" height="60" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.6"/>
  <text x="561" y="381" font-size="16" fill="#a16207" text-anchor="middle" font-weight="bold">滑动日志</text>
  <text x="682" y="371" font-size="12" fill="#475569" text-anchor="start">按时间戳逐条记，最准但内存随请求数线性涨</text>
  <path d="M190,404 L190,440" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a1)"/>
  <text x="200" y="426" font-size="11" fill="#94a3b8" text-anchor="start">否</text>
  <rect x="40" y="440" width="300" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="56" y="464" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="bold">Q4</text>
  <text x="56" y="485" font-size="14" fill="#0f172a" text-anchor="start" font-weight="bold">愿不愿意人工调参？</text>
  <line x1="344" y1="470" x2="452" y2="470" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="398" y="462" font-size="12" fill="#a21caf" text-anchor="middle" font-weight="bold">不愿意</text>
  <rect x="456" y="440" width="210" height="60" rx="8" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1.6"/>
  <text x="561" y="477" font-size="16" fill="#a21caf" text-anchor="middle" font-weight="bold">自适应</text>
  <text x="682" y="467" font-size="12" fill="#475569" text-anchor="start">按实时指标反馈调节，通常单机生效</text>
  <rect x="40" y="536" width="300" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="56" y="558" font-size="12" fill="#64748b" text-anchor="start">以上都不要</text>
  <text x="56" y="577" font-size="12" fill="#64748b" text-anchor="start">只要最省的一层防护</text>
  <line x1="344" y1="562" x2="452" y2="562" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>
  <rect x="456" y="536" width="210" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="561" y="567" font-size="15" fill="#334155" text-anchor="middle" font-weight="bold">固定窗口</text>
  <text x="682" y="567" font-size="12" fill="#475569" text-anchor="start">一个计数器就够，代价是边界处最坏漏过 2 倍</text>
  <text x="500" y="620" font-size="13" fill="#334155" text-anchor="middle" font-weight="bold">要点：真正在调的只有三个量 —— 窗口粒度（精度）、桶容量（允许多大突发）、平均速率（长期放行多少）</text>
</svg>
