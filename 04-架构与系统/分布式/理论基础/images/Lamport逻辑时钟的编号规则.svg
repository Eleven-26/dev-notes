<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Lamport 时钟把偏序扩成全序，但分不清「真有因果」与「碰巧更小」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">规则只有三条：进程内自增、发消息带 L、收消息取 max 再加 1</text>
  <defs>
    <marker id="g2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <line x1="90" y1="170" x2="940" y2="170" stroke="#cbd5e1" stroke-width="2" marker-end="url(#g2)"/>
  <text x="40" y="175" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">进程 P1</text>
  <line x1="90" y1="330" x2="940" y2="330" stroke="#cbd5e1" stroke-width="2" marker-end="url(#g2)"/>
  <text x="40" y="335" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">进程 P2</text>
  <circle cx="160" cy="170" r="7" fill="#2563eb"/>
  <text x="160" y="152" font-size="10" fill="#1e3a8a" text-anchor="middle" font-weight="bold">e1</text>
  <text x="160" y="196" font-size="9.5" fill="#64748B" text-anchor="middle">L=1</text>
  <circle cx="300" cy="170" r="7" fill="#2563eb"/>
  <text x="300" y="152" font-size="10" fill="#1e3a8a" text-anchor="middle" font-weight="bold">e2</text>
  <text x="300" y="196" font-size="9.5" fill="#64748B" text-anchor="middle">L=2</text>
  <circle cx="500" cy="170" r="7" fill="#2563eb"/>
  <text x="500" y="152" font-size="10" fill="#1e3a8a" text-anchor="middle" font-weight="bold">e3</text>
  <text x="500" y="196" font-size="9.5" fill="#64748B" text-anchor="middle">L=3</text>
  <circle cx="220" cy="330" r="7" fill="#16a34a"/>
  <text x="220" y="312" font-size="10" fill="#166534" text-anchor="middle" font-weight="bold">f1</text>
  <text x="220" y="356" font-size="9.5" fill="#64748B" text-anchor="middle">L=1</text>
  <circle cx="420" cy="330" r="7" fill="#16a34a"/>
  <text x="420" y="312" font-size="10" fill="#166534" text-anchor="middle" font-weight="bold">f2</text>
  <text x="420" y="356" font-size="9.5" fill="#64748B" text-anchor="middle">L=3</text>
  <circle cx="620" cy="330" r="7" fill="#16a34a"/>
  <text x="620" y="312" font-size="10" fill="#166534" text-anchor="middle" font-weight="bold">f3</text>
  <text x="620" y="356" font-size="9.5" fill="#64748B" text-anchor="middle">L=4</text>
  <line x1="300" y1="176" x2="420" y2="324" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#g2)"/>
  <text x="296" y="250" font-size="10" fill="#5b21b6" text-anchor="end">发消息（附带 L=2）</text>
  <text x="452" y="296" font-size="10" fill="#5b21b6" text-anchor="start">收：L = max(1, 2) + 1 = 3</text>
  <rect x="40" y="384" width="440" height="110" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="58" y="408" font-size="11.5" fill="#166534" text-anchor="start" font-weight="bold">成立：a → b 则 L(a) 小于 L(b)</text>
  <text x="58" y="432" font-size="10.5" fill="#334155" text-anchor="start">e1 → e2 → e3，数值 1 → 2 → 3</text>
  <text x="58" y="454" font-size="10.5" fill="#334155" text-anchor="start">e2 → f2，消息携带 L=2，收到后变 3</text>
  <text x="58" y="476" font-size="10.5" fill="#334155" text-anchor="start">按 (L, nodeId) 排序得到与因果一致的全序</text>
  <rect x="520" y="384" width="440" height="110" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="538" y="408" font-size="11.5" fill="#991b1b" text-anchor="start" font-weight="bold">不成立：L(a) 小于 L(b) 推不出 a → b</text>
  <text x="538" y="432" font-size="10.5" fill="#334155" text-anchor="start">f1 的 L=1 小于 e2 的 L=2</text>
  <text x="538" y="454" font-size="10.5" fill="#334155" text-anchor="start">但 f1 与 e2 之间没有任何因果 —— 只是碰巧数值小</text>
  <text x="538" y="476" font-size="10.5" fill="#b91c1c" text-anchor="start">所以它不能用来判断两个写是否冲突</text>
  <text x="44" y="528" font-size="11.5" fill="#1e3a8a" text-anchor="start" font-weight="bold">适用边界：需要「大家都同意的一个顺序」时用它（日志排序、全序广播的辅助）；判断并发与冲突要用向量时钟</text>
</svg>
