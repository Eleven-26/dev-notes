<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">超时只说明「这段时间里没收到响应」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">对方可能真的死了，也可能只是 GC 停顿、网络抖动、负载过高 —— 误判的代价往往比多等一会儿更大</text>
  <defs>
    <marker id="f6" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="40" y="84" width="920" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="58" y="112" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="bold">观察到的现象：请求超时 / 心跳超时 / 探针失败 —— 三种都是「等不到响应」，都不是「确认对方已死」</text>
  <line x1="150" y1="132" x2="150" y2="146" stroke="#16a34a" stroke-width="1.3" marker-end="url(#f6)"/>
  <rect x="40" y="148" width="216" height="96" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="54" y="172" font-size="11" fill="#166534" text-anchor="start" font-weight="bold">真的宕机</text>
  <text x="54" y="194" font-size="9.5" fill="#64748B" text-anchor="start">进程没了</text>
  <text x="54" y="220" font-size="9.5" fill="#64748B" text-anchor="start">若直接判死：</text>
  <text x="54" y="236" font-size="9.5" fill="#166534" text-anchor="start">判死是对的</text>
  <line x1="378" y1="132" x2="378" y2="146" stroke="#dc2626" stroke-width="1.3" marker-end="url(#f6)"/>
  <rect x="268" y="148" width="216" height="96" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="282" y="172" font-size="11" fill="#991b1b" text-anchor="start" font-weight="bold">Full GC / 长 STW</text>
  <text x="282" y="194" font-size="9.5" fill="#64748B" text-anchor="start">线程全停，但进程活着</text>
  <text x="282" y="220" font-size="9.5" fill="#64748B" text-anchor="start">若直接判死：</text>
  <text x="282" y="236" font-size="9.5" fill="#b91c1c" text-anchor="start">把健康主库踢下去，引发切换</text>
  <line x1="606" y1="132" x2="606" y2="146" stroke="#dc2626" stroke-width="1.3" marker-end="url(#f6)"/>
  <rect x="496" y="148" width="216" height="96" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="510" y="172" font-size="11" fill="#991b1b" text-anchor="start" font-weight="bold">网络抖动 / 丢包</text>
  <text x="510" y="194" font-size="9.5" fill="#64748B" text-anchor="start">包没到，不是人没在</text>
  <text x="510" y="220" font-size="9.5" fill="#64748B" text-anchor="start">若直接判死：</text>
  <text x="510" y="236" font-size="9.5" fill="#b91c1c" text-anchor="start">重试放大流量，把「慢」打成「死」</text>
  <line x1="834" y1="132" x2="834" y2="146" stroke="#dc2626" stroke-width="1.3" marker-end="url(#f6)"/>
  <rect x="724" y="148" width="216" height="96" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="738" y="172" font-size="11" fill="#991b1b" text-anchor="start" font-weight="bold">负载过高 / 池满</text>
  <text x="738" y="194" font-size="9.5" fill="#64748B" text-anchor="start">还在服务，只是排队</text>
  <text x="738" y="220" font-size="9.5" fill="#64748B" text-anchor="start">若直接判死：</text>
  <text x="738" y="236" font-size="9.5" fill="#b91c1c" text-anchor="start">重启一个其实还能用的 Pod</text>
  <text x="44" y="278" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="bold">超时时间是两难：设短了误切（把健康的旧主踢下去、数据分叉），设长了长时间不可用</text>
  <text x="44" y="310" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">常见做法是分级处置</text>
  <rect x="40" y="326" width="920" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="58" y="346" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">第一级：快速摘流量</text>
  <text x="58" y="366" font-size="10.5" fill="#334155" text-anchor="start">秒级、可恢复 —— 先不把请求发给它</text>
  <rect x="40" y="384" width="920" height="48" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="58" y="404" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">第二级：确认真正不可用</text>
  <text x="58" y="424" font-size="10.5" fill="#334155" text-anchor="start">慢、稳 —— 多个独立观察者给结论后才动手</text>
  <rect x="40" y="442" width="920" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="58" y="462" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">第三级：选主</text>
  <text x="58" y="482" font-size="10.5" fill="#334155" text-anchor="start">最慢、最重 —— 一旦判错就是双写与数据分叉</text>
  <rect x="40" y="508" width="920" height="74" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="58" y="534" font-size="12" fill="#5b21b6" text-anchor="start" font-weight="bold">只有检测是不够的：还必须配租约与 Fencing token</text>
  <text x="58" y="556" font-size="10.5" fill="#334155" text-anchor="start">租约给「我是主」加到期时间，旧主过期后主动停服，避免分区两侧同时自认为主；</text>
  <text x="58" y="574" font-size="10.5" fill="#334155" text-anchor="start">Fencing token 每次选主发一个单调递增令牌，存储层拒收比已见令牌更旧的写。缺了这两件，检测的误判会直接变成双写。</text>
  <text x="44" y="612" font-size="11" fill="#64748B" text-anchor="start">检测手段的演进方向是「少一点硬阈值」：多数派独立判断、Phi accrual 用分布算怀疑度、灰故障关注部分失败而不是全有全无</text>
</svg>
