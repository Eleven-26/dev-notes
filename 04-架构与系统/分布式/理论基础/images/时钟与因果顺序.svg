<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">因果顺序与 Lamport 时钟：有因果必递增，递增不一定是因果</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">时间向下流动；箭头是消息；括号内是 Lamport 值</text>

  <!-- 三条进程线与顶部标签 -->
  <g font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <rect x="70" y="82" width="120" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="130" y="103">P1</text>
    <rect x="430" y="82" width="120" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="490" y="103">P2</text>
    <rect x="790" y="82" width="120" height="30" rx="6" fill="#ffedd5" stroke="#ea580c"/>
    <text x="850" y="103">P3</text>
  </g>

  <line x1="130" y1="118" x2="130" y2="500" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="490" y1="118" x2="490" y2="500" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="850" y1="118" x2="850" y2="500" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 事件 -->
  <g font-size="12" fill="#0f172a">
    <circle cx="130" cy="150" r="6" fill="#2563eb"/>
    <text x="146" y="154">a (1)</text>

    <circle cx="130" cy="220" r="6" fill="#2563eb"/>
    <text x="146" y="224">send m1 (2)</text>

    <circle cx="130" cy="410" r="6" fill="#2563eb"/>
    <text x="146" y="414">c (3)</text>

    <circle cx="490" cy="130" r="6" fill="#16a34a"/>
    <text x="506" y="134">b (1)</text>

    <circle cx="490" cy="250" r="6" fill="#16a34a"/>
    <text x="506" y="254">recv m1 (3)</text>

    <circle cx="490" cy="310" r="6" fill="#16a34a"/>
    <text x="506" y="314">send m2 (4)</text>

    <circle cx="490" cy="430" r="6" fill="#16a34a"/>
    <text x="506" y="434">d (5)</text>

    <circle cx="850" cy="180" r="6" fill="#ea580c"/>
    <text x="866" y="184">e (1)</text>

    <circle cx="850" cy="380" r="6" fill="#ea580c"/>
    <text x="866" y="384">recv m2 (5)</text>

    <circle cx="850" cy="450" r="6" fill="#ea580c"/>
    <text x="866" y="454">f (6)</text>
  </g>

  <!-- 消息箭头 -->
  <line x1="136" y1="220" x2="484" y2="250" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="300" y="226" font-size="11" fill="#2563eb" text-anchor="middle">m1：携带 L=2</text>

  <line x1="496" y1="310" x2="844" y2="380" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="670" y="332" font-size="11" fill="#2563eb" text-anchor="middle">m2：携带 L=4</text>

  <!-- 并发标注 -->
  <rect x="112" y="136" width="44" height="28" rx="14" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="832" y="166" width="44" height="28" rx="14" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M156 150 C 300 100, 700 100, 832 180" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="500" y="128" font-size="11" fill="#dc2626" text-anchor="middle">a 与 e 都无因果路径 → 并发（Lamport 值恰好都为 1，不能据此判断先后）</text>

  <!-- 因果链说明 -->
  <rect x="70" y="510" width="560" height="76" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="86" y="534" font-size="12" fill="#334155">因果链：a → send m1 → recv m1 → send m2 → recv m2 → f</text>
  <text x="86" y="558" font-size="12" fill="#334155">Lamport 保证：有因果则数值递增；但 L(a) &lt; L(b) 不能反推 a → b</text>
  <text x="86" y="578" font-size="11.5" fill="#92400e">并发检测要看向量时钟：两个向量互不包含才是并发</text>

  <!-- 规则 -->
  <rect x="660" y="510" width="300" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="676" y="532" font-size="12" font-weight="bold" fill="#0f172a">happens-before 三规则</text>
  <text x="676" y="552" font-size="11" fill="#334155">① 同进程程序顺序</text>
  <text x="676" y="568" font-size="11" fill="#334155">② 发送 → 接收</text>
  <text x="676" y="584" font-size="11" fill="#334155">③ 传递性</text>
</svg>
