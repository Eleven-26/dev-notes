<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">故障模型谱系与「部分失效」</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">左：算法假设了哪种故障；右：观察者眼里「慢」与「死」无法区分</text>

  <!-- 左：谱系 -->
  <rect x="30" y="84" width="450" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="255" y="112" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">故障模型：越往右，协议要防的越多</text>

  <rect x="160" y="132" width="190" height="34" rx="6" fill="#e2e8f0" stroke="#475569"/>
  <text x="255" y="154" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">故障</text>

  <line x1="255" y1="166" x2="255" y2="184" stroke="#94a3b8"/>
  <line x1="130" y1="184" x2="380" y2="184" stroke="#94a3b8"/>
  <line x1="130" y1="184" x2="130" y2="204" stroke="#94a3b8"/>
  <line x1="380" y1="184" x2="380" y2="204" stroke="#94a3b8"/>

  <rect x="50" y="204" width="160" height="32" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="130" y="225" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">fail-silent（不说话）</text>
  <rect x="300" y="204" width="160" height="32" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="380" y="225" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">fail-arbitrary（任意）</text>

  <g font-size="11.5" fill="#334155">
    <rect x="50" y="252" width="160" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="60" y="274" font-weight="bold" fill="#0f172a">crash-stop</text>
    <text x="60" y="294">坏了永久停止</text>

    <rect x="50" y="318" width="160" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="60" y="340" font-weight="bold" fill="#0f172a">crash-recovery</text>
    <text x="60" y="360">可重启，内存丢失</text>

    <rect x="50" y="384" width="160" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="60" y="406" font-weight="bold" fill="#0f172a">omission</text>
    <text x="60" y="426">消息发不出 / 收不到</text>

    <rect x="50" y="450" width="160" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="60" y="470" font-weight="bold" fill="#0f172a">timing</text>
    <text x="60" y="486">延迟超预期</text>

    <rect x="300" y="252" width="160" height="80" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="310" y="274" font-weight="bold" fill="#991b1b">Byzantine</text>
    <text x="310" y="294">撒谎、伪造、选择性失联</text>
    <text x="310" y="314">需 3f+1 个节点容忍 f 个</text>

    <rect x="300" y="348" width="160" height="80" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="310" y="370" font-weight="bold" fill="#991b1b">何时才需要</text>
    <text x="310" y="390">开放网络、不可信参与者</text>
    <text x="310" y="410">可信内网通常不必</text>
  </g>
  <text x="130" y="512" font-size="10.5" fill="#64748b" text-anchor="middle">多数数据中心系统按这一支设计</text>

  <!-- 右：时间线对比 -->
  <rect x="510" y="84" width="460" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="740" y="112" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">同一次「超时」，两种真相</text>

  <!-- 场景一 -->
  <text x="540" y="150" font-size="12" font-weight="bold" fill="#991b1b">① 节点 B 真的宕机</text>
  <line x1="560" y1="180" x2="940" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <g fill="#16a34a">
    <circle cx="590" cy="180" r="5"/><circle cx="640" cy="180" r="5"/><circle cx="690" cy="180" r="5"/>
  </g>
  <g fill="#cbd5e1">
    <circle cx="740" cy="180" r="5"/><circle cx="790" cy="180" r="5"/><circle cx="840" cy="180" r="5"/><circle cx="890" cy="180" r="5"/>
  </g>
  <text x="590" y="164" font-size="10" fill="#166534" text-anchor="middle">心跳</text>
  <text x="790" y="164" font-size="10" fill="#94a3b8" text-anchor="middle">无消息</text>

  <!-- 场景二 -->
  <text x="540" y="270" font-size="12" font-weight="bold" fill="#b45309">② 节点 B 只是长时间 GC 停顿</text>
  <line x1="560" y1="300" x2="940" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
  <g fill="#16a34a">
    <circle cx="590" cy="300" r="5"/><circle cx="640" cy="300" r="5"/><circle cx="690" cy="300" r="5"/><circle cx="890" cy="300" r="5"/>
  </g>
  <g fill="#cbd5e1">
    <circle cx="740" cy="300" r="5"/><circle cx="790" cy="300" r="5"/><circle cx="840" cy="300" r="5"/>
  </g>
  <text x="790" y="284" font-size="10" fill="#b45309" text-anchor="middle">停顿中…</text>
  <text x="890" y="284" font-size="10" fill="#166534" text-anchor="middle">恢复</text>

  <!-- 观察窗口 -->
  <rect x="715" y="150" width="60" height="180" fill="#fef3c7" opacity="0.35" stroke="#f59e0b" stroke-dasharray="4 3"/>
  <line x1="745" y1="140" x2="745" y2="350" stroke="#dc2626" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="745" y="136" font-size="10.5" fill="#dc2626" text-anchor="middle">t3 超时判定</text>

  <text x="540" y="376" font-size="12" fill="#991b1b">观察者看到：t3 之后没有心跳 → 判定「挂了」</text>
  <text x="540" y="400" font-size="12" fill="#b45309">真实情况：可能只是停顿，稍后会恢复</text>
  <rect x="540" y="418" width="400" height="54" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="740" y="440" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">误判的代价：多一次选主、双写、数据分叉</text>
  <text x="740" y="460" font-size="11" fill="#991b1b" text-anchor="middle">所以「摘流量」要快，「选主」要稳</text>

  <!-- 底部 -->
  <rect x="40" y="528" width="920" height="88" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="60" y="554" font-size="13" fill="#334155">⭐ 分布式系统的本质困难是「部分失效」：一部分坏、一部分好，外部无法只凭一次超时区分慢 / 死 / 分区。</text>
  <text x="60" y="580" font-size="13" fill="#92400e">⚠️ 检测只是第一步；要安全切换，还需要租约（到期即停）与 fencing token（旧主的写被拒）。</text>
</svg>
