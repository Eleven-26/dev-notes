<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" font-family="sans-serif">
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="690" fill="#ffffff"/>
  <text x="30" y="42" font-size="19" fill="#0f172a">三个词各指系统里的哪一层：微服务切边界、集群做副本、分布式连调用</text>

  <!-- 外框：电商系统 -->
  <rect x="40" y="66" width="920" height="404" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="62" y="94" font-size="15" fill="#0f172a">电商系统 —— 一个分布式系统的整体</text>

  <!-- 服务 1：用户服务 -->
  <rect x="60" y="118" width="170" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="145" y="146" font-size="15" fill="#1e3a8a" text-anchor="middle">用户服务</text>
  <rect x="69" y="166" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="91" y="188" font-size="12" fill="#1e3a8a" text-anchor="middle">1</text>
  <rect x="123" y="166" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="145" y="188" font-size="12" fill="#1e3a8a" text-anchor="middle">2</text>
  <rect x="177" y="166" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="199" y="188" font-size="12" fill="#1e3a8a" text-anchor="middle">3</text>
  <text x="145" y="226" font-size="12" fill="#64748b" text-anchor="middle">3 个实例</text>
  <text x="145" y="248" font-size="12" fill="#64748b" text-anchor="middle">同一份代码</text>

  <!-- 服务 2：订单服务 -->
  <rect x="245" y="118" width="170" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="330" y="146" font-size="15" fill="#1e3a8a" text-anchor="middle">订单服务</text>
  <rect x="254" y="166" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="276" y="188" font-size="12" fill="#1e3a8a" text-anchor="middle">1</text>
  <rect x="308" y="166" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="330" y="188" font-size="12" fill="#1e3a8a" text-anchor="middle">2</text>
  <rect x="362" y="166" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="384" y="188" font-size="12" fill="#1e3a8a" text-anchor="middle">3</text>
  <text x="330" y="226" font-size="12" fill="#64748b" text-anchor="middle">3 个实例</text>
  <text x="330" y="248" font-size="12" fill="#64748b" text-anchor="middle">同一份代码</text>

  <!-- 服务 3：库存服务 -->
  <rect x="430" y="118" width="170" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="515" y="146" font-size="15" fill="#1e3a8a" text-anchor="middle">库存服务</text>
  <rect x="439" y="166" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="461" y="188" font-size="12" fill="#1e3a8a" text-anchor="middle">1</text>
  <rect x="493" y="166" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="515" y="188" font-size="12" fill="#1e3a8a" text-anchor="middle">2</text>
  <rect x="547" y="166" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="569" y="188" font-size="12" fill="#1e3a8a" text-anchor="middle">3</text>
  <text x="515" y="226" font-size="12" fill="#64748b" text-anchor="middle">3 个实例</text>
  <text x="515" y="248" font-size="12" fill="#64748b" text-anchor="middle">同一份代码</text>

  <!-- 服务 4：支付服务 -->
  <rect x="615" y="118" width="170" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="700" y="146" font-size="15" fill="#1e3a8a" text-anchor="middle">支付服务</text>
  <rect x="624" y="166" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="646" y="188" font-size="12" fill="#1e3a8a" text-anchor="middle">1</text>
  <rect x="678" y="166" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="700" y="188" font-size="12" fill="#1e3a8a" text-anchor="middle">2</text>
  <rect x="732" y="166" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="754" y="188" font-size="12" fill="#1e3a8a" text-anchor="middle">3</text>
  <text x="700" y="226" font-size="12" fill="#64748b" text-anchor="middle">3 个实例</text>
  <text x="700" y="248" font-size="12" fill="#64748b" text-anchor="middle">同一份代码</text>

  <!-- 右侧：集群注解 -->
  <rect x="800" y="118" width="140" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="870" y="146" font-size="15" fill="#14532d" text-anchor="middle">集群</text>
  <text x="870" y="176" font-size="12" fill="#166534" text-anchor="middle">每个服务内部</text>
  <text x="870" y="198" font-size="12" fill="#166534" text-anchor="middle">这 3 个实例</text>
  <text x="870" y="226" font-size="12" fill="#166534" text-anchor="middle">跑同一份代码</text>
  <text x="870" y="248" font-size="12" fill="#166534" text-anchor="middle">互为副本</text>

  <!-- 服务间调用 -->
  <line x1="145" y1="270" x2="145" y2="296" stroke="#64748b" stroke-width="1.6"/>
  <line x1="330" y1="270" x2="330" y2="296" stroke="#64748b" stroke-width="1.6"/>
  <line x1="515" y1="270" x2="515" y2="296" stroke="#64748b" stroke-width="1.6"/>
  <line x1="700" y1="270" x2="700" y2="296" stroke="#64748b" stroke-width="1.6"/>
  <line x1="145" y1="296" x2="700" y2="296" stroke="#64748b" stroke-width="1.6"/>
  <line x1="200" y1="322" x2="645" y2="322" stroke="#ea580c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar3)"/>
  <line x1="645" y1="340" x2="200" y2="340" stroke="#ea580c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar3)"/>
  <text x="422" y="316" font-size="14" fill="#7c2d12" text-anchor="middle">服务之间互相调用（跨进程协作）</text>
  <text x="422" y="362" font-size="12" fill="#64748b" text-anchor="middle">注意：集群里的实例之间不互相「调用」，它们靠数据复制协作 —— 这与服务间调用是两回事</text>

  <!-- 三个说明卡片 -->
  <rect x="55" y="496" width="290" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="73" y="524" font-size="15" fill="#1e3a8a">微服务 = 服务边界</text>
  <text x="73" y="552" font-size="12" fill="#334155">按业务能力「纵向」切开</text>
  <text x="73" y="576" font-size="12" fill="#334155">每个服务一份代码、一个团队</text>
  <text x="73" y="600" font-size="12" fill="#1d4ed8">问：代码按什么边界切</text>

  <rect x="370" y="496" width="290" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="388" y="524" font-size="15" fill="#14532d">集群 = 同一服务的多副本</text>
  <text x="388" y="552" font-size="12" fill="#334155">同质「横向」复制，跑同一份代码</text>
  <text x="388" y="576" font-size="12" fill="#334155">为容量与可用性，互为副本</text>
  <text x="388" y="600" font-size="12" fill="#166534">问：同一服务怎么放多份</text>

  <rect x="685" y="496" width="290" height="120" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="703" y="524" font-size="15" fill="#7c2d12">分布式 = 服务之间的调用</text>
  <text x="703" y="552" font-size="12" fill="#334155">异构进程跨边界协作</text>
  <text x="703" y="576" font-size="12" fill="#334155">走网络：会超时、会失败、会乱序</text>
  <text x="703" y="600" font-size="12" fill="#c2410c">问：不同服务怎么协作</text>

  <!-- 注记 -->
  <text x="30" y="648" font-size="13" fill="#64748b">要点：三个词回答的是三个不同的问题 —— 微服务切边界（纵向）、集群做副本（横向）、分布式连调用（跨边界）。</text>
  <text x="30" y="670" font-size="12" fill="#94a3b8">注意：三者会叠加 —— 一个分布式系统里，每个服务自己往往又是一个集群；图中每个服务都画了 3 个实例，是示意不是推荐配置。</text>
</svg>
