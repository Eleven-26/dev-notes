<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="sans-serif">
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="30" y="42" font-size="19" fill="#0f172a">同一个词在两套语言里指的不是同一件事：字段、校验、生命周期全都不同</text>

  <rect x="40" y="66" width="420" height="390" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="62" y="96" font-size="16" fill="#1e3a8a">交易上下文 —— 商品 = 可售 SKU</text>
  <text x="62" y="128" font-size="12" fill="#334155">关心的事：能不能卖、卖多少钱</text>
  <text x="62" y="164" font-size="13" fill="#1d4ed8">字段</text>
  <text x="62" y="188" font-size="12" fill="#334155">价格 / 促销 / 上下架状态</text>
  <text x="62" y="210" font-size="12" fill="#334155">限购规则 / 可售区域</text>
  <text x="62" y="246" font-size="13" fill="#1d4ed8">不变式</text>
  <text x="62" y="270" font-size="12" fill="#334155">价格大于 0；下架后不可下单</text>
  <text x="62" y="306" font-size="13" fill="#1d4ed8">误合之后</text>
  <text x="62" y="330" font-size="12" fill="#334155">把库存数也塞进商品，促销改价</text>
  <text x="62" y="352" font-size="12" fill="#334155">顺手触发一条仓储流水</text>
  <text x="62" y="390" font-size="13" fill="#1d4ed8">谁能改</text>
  <text x="62" y="414" font-size="12" fill="#334155">交易运营岗</text>
  <text x="62" y="440" font-size="12" fill="#64748b">语言边界：这一侧的模型自洽</text>

  <rect x="540" y="66" width="420" height="390" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="562" y="96" font-size="16" fill="#14532d">仓储上下文 —— 商品 = 库存单元</text>
  <text x="562" y="128" font-size="12" fill="#334155">关心的事：还有几件、在哪一格</text>
  <text x="562" y="164" font-size="13" fill="#166534">字段</text>
  <text x="562" y="188" font-size="12" fill="#334155">库位 / 批次 / 盘点状态</text>
  <text x="562" y="210" font-size="12" fill="#334155">锁定数 / 在途数</text>
  <text x="562" y="246" font-size="13" fill="#166534">不变式</text>
  <text x="562" y="270" font-size="12" fill="#334155">可用量不为负；同批次不可混放</text>
  <text x="562" y="306" font-size="13" fill="#166534">误合之后</text>
  <text x="562" y="330" font-size="12" fill="#334155">盘点结果反过来把商品改成下架</text>
  <text x="562" y="352" font-size="12" fill="#334155">交易侧的促销又改写库存口径</text>
  <text x="562" y="390" font-size="13" fill="#166534">谁能改</text>
  <text x="562" y="414" font-size="12" fill="#334155">仓管岗 + 入库流程</text>
  <text x="562" y="440" font-size="12" fill="#64748b">语言边界：跨过去就必须翻译</text>

  <line x1="500" y1="80" x2="500" y2="452" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5"/>
  <rect x="452" y="200" width="96" height="96" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="500" y="228" font-size="11.5" fill="#7c2d12" text-anchor="middle">同一个词</text>
  <text x="500" y="250" font-size="11.5" fill="#7c2d12" text-anchor="middle">两个模型</text>
  <text x="500" y="276" font-size="11.5" fill="#7c2d12" text-anchor="middle">边界处翻译</text>
  <line x1="440" y1="150" x2="556" y2="150" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar1)"/>
  <line x1="560" y1="330" x2="444" y2="330" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar1)"/>

  <rect x="40" y="486" width="920" height="58" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="62" y="514" font-size="13" fill="#0f172a">判据：同一个名字在两处有不同的字段、校验、生命周期与谁能改，它就本来就是两个模型。</text>
  <text x="62" y="534" font-size="12" fill="#64748b">共用一个结构体不是省事，是把两套不变式混在一起 —— 促销改价会触发仓储流水，盘点结果会反过来下架商品。</text>
</svg>
