<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="sans-serif">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="30" y="42" font-size="19" fill="#0f172a">限界上下文是从领域事件倒推出来的：事件 → 命令 → 聚合 → 边界</text>

  <rect x="40" y="80" width="920" height="110" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="62" y="110" font-size="15" fill="#7c2d12">① 贴事件：用过去式写下「已经发生、无法否认的事实」</text>
  <text x="62" y="140" font-size="12" fill="#334155">订单已创建 / 库存已锁定 / 支付已回调 / 包裹已签收</text>
  <text x="62" y="168" font-size="12" fill="#c2410c">判据：业务方会认账吗？不会认账的是过程，不是事件</text>
  <line x1="500" y1="190" x2="500" y2="204" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar2)"/>

  <rect x="40" y="206" width="920" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="62" y="236" font-size="15" fill="#1e3a8a">② 配命令与角色：每条命令都要能说出「谁发的」</text>
  <text x="62" y="266" font-size="12" fill="#334155">提交订单 ← 买家　｜　锁定库存 ← 订单服务　｜　确认支付 ← 支付网关</text>
  <text x="62" y="294" font-size="12" fill="#1d4ed8">判据：说不出来源的命令，往往是想象中的需求</text>
  <line x1="500" y1="316" x2="500" y2="330" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar2)"/>

  <rect x="40" y="332" width="920" height="110" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="62" y="362" font-size="15" fill="#713f12">③ 聚成聚合：哪几条不变式必须同时成立</text>
  <text x="62" y="392" font-size="12" fill="#334155">订单聚合 = 订单 + 明细（总金额必须等于明细之和）　｜　库存聚合 = 可用量（不可为负）</text>
  <text x="62" y="420" font-size="12" fill="#a16207">判据：这些改动必须在同一个事务里一起生效吗？</text>
  <line x1="500" y1="442" x2="500" y2="456" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar2)"/>

  <rect x="40" y="458" width="920" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="62" y="488" font-size="15" fill="#14532d">④ 收成限界上下文：语言一致 + 写入权唯一的一组聚合</text>
  <text x="62" y="518" font-size="12" fill="#334155">交易上下文：订单、支付单、优惠券　｜　仓储上下文：库存单元、批次、库位</text>
  <text x="62" y="546" font-size="12" fill="#166534">判据：一个团队能把这套语言完整说清吗？说不清就是划大了</text>

  <rect x="40" y="588" width="920" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="62" y="618" font-size="13" fill="#0f172a">最值钱的是第②步：一条说不出「谁发的」的命令，往往对应一个并不存在的需求。</text>
</svg>
