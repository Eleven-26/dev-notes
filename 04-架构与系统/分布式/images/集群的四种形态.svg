<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="30" y="42" font-size="19" fill="#0f172a">集群的四种形态：区别只在「谁决定写入的顺序」</text>

  <!-- 栏 1：主从 / 主备 -->
  <rect x="20" y="80" width="230" height="342" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="135" y="108" font-size="16" fill="#0f172a" text-anchor="middle">主从 / 主备</text>
  <rect x="75" y="128" width="120" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="135" y="153" font-size="14" fill="#1e3a8a" text-anchor="middle">主（唯一）</text>
  <path d="M 105 168 L 75 216" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 165 168 L 195 216" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="30" y="220" width="90" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="75" y="244" font-size="13" fill="#14532d" text-anchor="middle">从（可读）</text>
  <rect x="150" y="220" width="90" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="195" y="244" font-size="13" fill="#14532d" text-anchor="middle">从 / 备</text>
  <text x="135" y="292" font-size="13" fill="#475569" text-anchor="middle">写只走主</text>
  <text x="135" y="314" font-size="13" fill="#475569" text-anchor="middle">主备的备不接流量</text>
  <text x="135" y="362" font-size="13" fill="#0f172a" text-anchor="middle">决策者</text>
  <rect x="55" y="374" width="160" height="34" rx="17" fill="#dbeafe" stroke="#2563eb"/>
  <text x="135" y="396" font-size="13" fill="#1e3a8a" text-anchor="middle">唯一的那个主</text>

  <!-- 栏 2：多主 -->
  <rect x="262" y="80" width="230" height="342" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="377" y="108" font-size="16" fill="#0f172a" text-anchor="middle">多主（分片）</text>
  <text x="322" y="132" font-size="12" fill="#64748b" text-anchor="middle">分片 1</text>
  <text x="432" y="132" font-size="12" fill="#64748b" text-anchor="middle">分片 2</text>
  <rect x="282" y="142" width="80" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="322" y="165" font-size="13" fill="#1e3a8a" text-anchor="middle">主</text>
  <rect x="392" y="142" width="80" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="432" y="165" font-size="13" fill="#1e3a8a" text-anchor="middle">主</text>
  <path d="M 322 178 L 322 214" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 432 178 L 432 214" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="282" y="218" width="80" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="322" y="241" font-size="13" fill="#14532d" text-anchor="middle">从</text>
  <rect x="392" y="218" width="80" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="432" y="241" font-size="13" fill="#14532d" text-anchor="middle">从</text>
  <text x="377" y="292" font-size="13" fill="#475569" text-anchor="middle">分片之间互不干扰</text>
  <text x="377" y="314" font-size="13" fill="#475569" text-anchor="middle">扩容以分片为单位搬</text>
  <text x="377" y="362" font-size="13" fill="#0f172a" text-anchor="middle">决策者</text>
  <rect x="297" y="374" width="160" height="34" rx="17" fill="#dbeafe" stroke="#2563eb"/>
  <text x="377" y="396" font-size="13" fill="#1e3a8a" text-anchor="middle">每个分片各有主</text>

  <!-- 栏 3：无主 -->
  <rect x="504" y="80" width="230" height="342" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="619" y="108" font-size="16" fill="#0f172a" text-anchor="middle">无主</text>
  <rect x="524" y="136" width="66" height="38" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="557" y="160" font-size="13" fill="#7c2d12" text-anchor="middle">节点 A</text>
  <rect x="600" y="136" width="66" height="38" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="633" y="160" font-size="13" fill="#7c2d12" text-anchor="middle">节点 B</text>
  <rect x="676" y="136" width="66" height="38" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="709" y="160" font-size="13" fill="#7c2d12" text-anchor="middle">节点 C</text>
  <path d="M 533 178 L 533 214" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 590 178 L 590 214" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 647 178 L 647 214" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="549" y="218" width="140" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="619" y="241" font-size="13" fill="#334155" text-anchor="middle">客户端</text>
  <text x="619" y="288" font-size="13" fill="#475569" text-anchor="middle">写够 W 份即成功</text>
  <text x="619" y="310" font-size="13" fill="#475569" text-anchor="middle">读够 R 份取最新</text>
  <text x="619" y="362" font-size="13" fill="#0f172a" text-anchor="middle">决策者</text>
  <rect x="524" y="374" width="190" height="34" rx="17" fill="#ffedd5" stroke="#ea580c"/>
  <text x="619" y="396" font-size="13" fill="#7c2d12" text-anchor="middle">没有主，靠 Quorum</text>

  <!-- 栏 4：分层 -->
  <rect x="746" y="80" width="230" height="342" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="861" y="108" font-size="16" fill="#0f172a" text-anchor="middle">分层</text>
  <rect x="766" y="130" width="190" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="861" y="149" font-size="13" fill="#1e3a8a" text-anchor="middle">控制层</text>
  <text x="861" y="166" font-size="11" fill="#3b82f6" text-anchor="middle">调度 / 元数据 / 选主</text>
  <path d="M 806 178 L 806 214" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 861 178 L 861 214" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 916 178 L 916 214" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="771" y="218" width="70" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="806" y="242" font-size="12" fill="#334155" text-anchor="middle">工作节点</text>
  <rect x="851" y="218" width="70" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="886" y="242" font-size="12" fill="#334155" text-anchor="middle">工作节点</text>
  <rect x="931" y="218" width="20" height="38" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="861" y="292" font-size="13" fill="#475569" text-anchor="middle">控制流与数据流分开</text>
  <text x="861" y="314" font-size="13" fill="#475569" text-anchor="middle">工作节点不是控制层的副本</text>
  <text x="861" y="362" font-size="13" fill="#0f172a" text-anchor="middle">决策者</text>
  <rect x="776" y="374" width="170" height="34" rx="17" fill="#dbeafe" stroke="#2563eb"/>
  <text x="861" y="396" font-size="13" fill="#1e3a8a" text-anchor="middle">单独抽出来的控制层</text>

  <!-- 注记 -->
  <text x="30" y="456" font-size="13" fill="#64748b">要点：决策者从集中走到去中心 —— 主从有唯一主；多主是每个分片各有主；无主没有任何主，靠客户端凑多数派；</text>
  <text x="30" y="478" font-size="13" fill="#64748b">分层则是把决策权（调度 / 元数据 / 选主）单独抽成一层，与执行数据流的工作节点分离。</text>
  <text x="30" y="502" font-size="12" fill="#94a3b8">注意：无主那条的 W + R &gt; N 是 Quorum 的交集条件，展开见第四节；图中节点数均为示意，不是推荐配置。</text>
</svg>
