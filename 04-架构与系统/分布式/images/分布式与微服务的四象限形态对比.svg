<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">两个维度交叉出四种形态：分布式讲部署，微服务讲边界</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">纵轴＝进程跑在哪（部署形态）；横轴＝代码按什么切（组织方式）——两者是交叉关系，不是包含关系</text>

  <rect x="190" y="76" width="350" height="36" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
  <text x="365" y="99" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">没按业务能力切边界</text>
  <rect x="560" y="76" width="370" height="36" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
  <text x="745" y="99" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">按业务能力 / DDD 限界上下文切</text>

  <rect x="40" y="140" width="130" height="110" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
  <text x="105" y="185" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">单机部署</text>
  <text x="105" y="205" font-size="10.5" fill="#334155" text-anchor="middle">一个进程</text>
  <rect x="40" y="280" width="130" height="110" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="8"/>
  <text x="105" y="325" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">多机 / 多进程</text>
  <text x="105" y="345" font-size="10.5" fill="#334155" text-anchor="middle">分布式部署</text>

  <rect x="190" y="140" width="350" height="110" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="206" y="168" font-size="12" font-weight="bold" fill="#0f172a">单体应用</text>
  <text x="206" y="190" font-size="10.5" fill="#334155">一次 go run / java -jar 起全部，改一处发一次版</text>
  <text x="206" y="208" font-size="10.5" fill="#334155">反面是「单机单体」——分布式的对立面，与微服务无关</text>
  <text x="206" y="226" font-size="10.5" fill="#14532d">团队小、流量单机扛得住时，这是更省钱的选择</text>

  <rect x="560" y="140" width="370" height="110" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" rx="10"/>
  <text x="576" y="168" font-size="12" font-weight="bold" fill="#1e40af">单机上的微服务 / 模块化单体</text>
  <text x="576" y="190" font-size="10.5" fill="#1e40af">边界已切清，只为了独立部署跑成几个进程在同一台机器</text>
  <text x="576" y="208" font-size="10.5" fill="#1e40af">拆分前该做的准备：包结构 + 只通过接口调用</text>
  <text x="576" y="226" font-size="10.5" fill="#1e40af">「切」只是把包搬出去，而不是重写业务</text>

  <rect x="190" y="280" width="350" height="110" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" rx="10"/>
  <text x="206" y="308" font-size="12" font-weight="bold" fill="#991b1b">分布式单体 ⚠️ 微服务最经典的失败形态</text>
  <text x="206" y="330" font-size="10.5" fill="#991b1b">形似微服务：N 个进程、N 个仓库、N 条流水线</text>
  <text x="206" y="348" font-size="10.5" fill="#991b1b">实际是单体：一个需求要同时改 3~4 个服务、一起发版、一起回滚</text>
  <text x="206" y="366" font-size="10.5" fill="#991b1b">成因：共享数据库 / 同步调用成链 / 共享代码库与 DTO</text>

  <rect x="560" y="280" width="370" height="110" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="10"/>
  <text x="576" y="308" font-size="12" font-weight="bold" fill="#14532d">真正的微服务 ⭐</text>
  <text x="576" y="330" font-size="10.5" fill="#14532d">判据一句话：能不能只发布一个服务而让其他服务照常工作</text>
  <text x="576" y="348" font-size="10.5" fill="#14532d">每个服务独占自己的数据存储，其他服务只能走 API</text>
  <text x="576" y="366" font-size="10.5" fill="#14532d">代价：运维面爆炸、跨服务一致性、调用链变长、联调成本</text>

  <g transform="translate(20,410)">
    <rect x="0" y="0" width="960" height="134" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
    <text x="16" y="24" font-size="15" font-weight="bold" fill="#0f172a">三个词回答三个不同的问题（三者是交叉，不是包含）</text>
    <text x="16" y="50" font-size="10.5" fill="#334155"><tspan font-weight="bold" fill="#0f172a">集群＝复制：</tspan>同一件事派几个人去做 —— 节点跑同一份代码</text>
    <text x="16" y="70" font-size="10.5" fill="#334155"><tspan font-weight="bold" fill="#0f172a">分布式＝分工：</tspan>多件事怎么分工去做 —— 节点跑不同代码</text>
    <text x="16" y="90" font-size="10.5" fill="#334155"><tspan font-weight="bold" fill="#0f172a">微服务＝划界：</tspan>代码按什么边界切 —— 按业务能力拆</text>
    <text x="16" y="110" font-size="10.5" fill="#334155">交叉的三个例子：MySQL 主从是集群不是分布式；分布式单体有集群不是真分布式；单机微服务有拆分但没分布</text>
  </g>
</svg>
