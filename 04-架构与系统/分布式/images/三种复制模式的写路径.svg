<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="a2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="30" y="42" font-size="19" fill="#0f172a">三种复制模式的写路径：主在哪一步给客户端回 OK</text>

  <!-- 泳道头 -->
  <rect x="215" y="58" width="70" height="30" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="250" y="78" font-size="13" fill="#334155" text-anchor="middle">客户端</text>
  <rect x="445" y="58" width="70" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="480" y="78" font-size="13" fill="#1e3a8a" text-anchor="middle">主</text>
  <rect x="665" y="58" width="70" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="700" y="78" font-size="13" fill="#14532d" text-anchor="middle">从 1</text>
  <rect x="845" y="58" width="70" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="880" y="78" font-size="13" fill="#14532d" text-anchor="middle">从 2</text>

  <line x1="250" y1="92" x2="250" y2="468" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <line x1="480" y1="92" x2="480" y2="468" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <line x1="700" y1="92" x2="700" y2="468" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <line x1="880" y1="92" x2="880" y2="468" stroke="#cbd5e1" stroke-dasharray="4 4"/>

  <!-- 行 1：同步复制 -->
  <text x="100" y="150" font-size="15" fill="#0f172a" text-anchor="middle">同步复制</text>
  <text x="100" y="172" font-size="12" fill="#dc2626" text-anchor="middle">等所有从</text>
  <line x1="250" y1="132" x2="472" y2="132" stroke="#334155" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="350" y="124" font-size="12" fill="#475569" text-anchor="middle">写请求</text>
  <line x1="488" y1="162" x2="692" y2="162" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a2g)"/>
  <line x1="488" y1="184" x2="872" y2="184" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a2g)"/>
  <text x="590" y="156" font-size="12" fill="#16a34a" text-anchor="middle">复制并等确认</text>
  <line x1="472" y1="206" x2="258" y2="206" stroke="#334155" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="360" y="200" font-size="12" fill="#0f172a" text-anchor="middle">OK</text>

  <!-- 行 2：异步复制 -->
  <text x="100" y="270" font-size="15" fill="#0f172a" text-anchor="middle">异步复制</text>
  <text x="100" y="292" font-size="12" fill="#ea580c" text-anchor="middle">写完就回</text>
  <line x1="250" y1="252" x2="472" y2="252" stroke="#334155" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="350" y="244" font-size="12" fill="#475569" text-anchor="middle">写请求</text>
  <line x1="472" y1="276" x2="258" y2="276" stroke="#334155" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="360" y="270" font-size="12" fill="#0f172a" text-anchor="middle">OK</text>
  <line x1="488" y1="304" x2="692" y2="304" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a2g)"/>
  <line x1="488" y1="326" x2="872" y2="326" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a2g)"/>
  <text x="590" y="298" font-size="12" fill="#16a34a" text-anchor="middle">复制在后面追（异步）</text>

  <!-- 行 3：半同步 -->
  <text x="100" y="390" font-size="15" fill="#0f172a" text-anchor="middle">半同步</text>
  <text x="100" y="412" font-size="12" fill="#16a34a" text-anchor="middle">等多数派</text>
  <line x1="250" y1="372" x2="472" y2="372" stroke="#334155" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="350" y="364" font-size="12" fill="#475569" text-anchor="middle">写请求</text>
  <line x1="488" y1="400" x2="692" y2="400" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a2g)"/>
  <text x="590" y="394" font-size="12" fill="#16a34a" text-anchor="middle">复制并等多数派确认</text>
  <line x1="472" y1="428" x2="258" y2="428" stroke="#334155" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="360" y="422" font-size="12" fill="#0f172a" text-anchor="middle">OK</text>

  <text x="30" y="496" font-size="13" fill="#64748b">要点：三条路径的差别只在一处 —— 主在哪个位置给客户端回 OK。异步回得最早、也可能丢数据；同步回得最晚、任一从慢都会拖住写；</text>
  <text x="30" y="518" font-size="13" fill="#64748b">半同步取中间：只要多数派（N/2+1）确认即可，配合「选主也走多数派」才能做到不丢。</text>
</svg>
