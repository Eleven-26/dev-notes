<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1000" height="700" fill="#f8fafc"/>

  <text x="500" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">限流器 vs 并发限制器：限「进入速率」还是限「在途数量」</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#64748b">同一组实测数据：到达率 λ = 10/tick，下游在中途从「每 tick 处理 8 个」掉到「每 tick 处理 2 个」</text>

  <!-- ============ 上半：QPS 限制（限流速） ============ -->
  <rect x="24" y="84" width="952" height="270" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="44" y="114" font-size="18" font-weight="bold" fill="#b45309">① 限流器：卡住「每秒进来多少」（QPS 限制 = 8）</text>
  <text x="44" y="138" font-size="13" fill="#92400e">前半段它表现完美 —— 可下游一变慢，它就失效了</text>

  <rect x="44" y="158" width="120" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="104" y="190" text-anchor="middle" font-size="14" fill="#334155">请求流</text>
  <text x="104" y="210" text-anchor="middle" font-size="12" fill="#64748b">10 个/tick</text>

  <line x1="168" y1="194" x2="204" y2="194" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="204,194 194,189 194,199" fill="#94a3b8"/>

  <rect x="208" y="158" width="170" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="293" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">QPS 闸门</text>
  <text x="293" y="207" text-anchor="middle" font-size="12" fill="#92400e">只看「到达速率」</text>

  <line x1="382" y1="194" x2="418" y2="194" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="418,194 408,189 408,199" fill="#94a3b8"/>

  <rect x="422" y="158" width="300" height="72" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="572" y="182" text-anchor="middle" font-size="13" fill="#991b1b">队列（没有任何上限）</text>
  <g fill="#ef4444">
    <rect x="440" y="192" width="16" height="26"/><rect x="460" y="192" width="16" height="26"/>
    <rect x="480" y="192" width="16" height="26"/><rect x="500" y="192" width="16" height="26"/>
    <rect x="520" y="192" width="16" height="26"/><rect x="540" y="192" width="16" height="26"/>
    <rect x="560" y="192" width="16" height="26"/><rect x="580" y="192" width="16" height="26"/>
    <rect x="600" y="192" width="16" height="26"/><rect x="620" y="192" width="16" height="26"/>
    <rect x="640" y="192" width="16" height="26"/><rect x="660" y="192" width="16" height="26"/>
    <rect x="680" y="192" width="16" height="26"/>
  </g>
  <text x="572" y="222" text-anchor="middle" font-size="12" fill="#991b1b">越堆越多 → 峰值 608，超时 174 次</text>

  <line x1="726" y1="194" x2="762" y2="194" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="762,194 752,189 752,199" fill="#94a3b8"/>

  <rect x="766" y="158" width="166" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="849" y="188" text-anchor="middle" font-size="14" fill="#334155">下游</text>
  <text x="849" y="209" text-anchor="middle" font-size="12" fill="#64748b">每 tick 只处理 2 个</text>

  <rect x="44" y="250" width="888" height="84" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="64" y="276" font-size="14" font-weight="bold" fill="#b91c1c">后半段实测：完成 200 · 拒绝 200 · 超时 174 · 平均 RTT 38.50 · 峰值在途 608</text>
  <text x="64" y="300" font-size="13" fill="#334155">原因：闸门限制的是「进入速率」，它**感知不到下游已经变慢**——放行速度不变，出口却堵了，</text>
  <text x="64" y="320" font-size="13" fill="#334155">请求只能在队列里越堆越久。QPS 调得再小也没用，因为问题不在「进多快」，而在「积了多少」。</text>

  <!-- ============ 下半：并发限制（限在途） ============ -->
  <rect x="24" y="370" width="952" height="270" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="44" y="400" font-size="18" font-weight="bold" fill="#15803d">② 并发限制器：卡住「同时在处理多少个」（在途 ≤ 8）</text>
  <text x="44" y="424" font-size="13" fill="#166534">下游一变慢，它自动把吞吐压下来 —— 不需要知道下游发生了什么</text>

  <rect x="44" y="444" width="120" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="104" y="476" text-anchor="middle" font-size="14" fill="#334155">请求流</text>
  <text x="104" y="496" text-anchor="middle" font-size="12" fill="#64748b">10 个/tick</text>

  <line x1="168" y1="480" x2="204" y2="480" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="204,480 194,475 194,485" fill="#94a3b8"/>

  <rect x="208" y="444" width="170" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="293" y="472" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">在途闸门</text>
  <text x="293" y="493" text-anchor="middle" font-size="12" fill="#166534">in-flight ≤ 8</text>

  <line x1="382" y1="480" x2="418" y2="480" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="418,480 408,475 408,485" fill="#94a3b8"/>

  <rect x="422" y="444" width="300" height="72" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="572" y="468" text-anchor="middle" font-size="13" fill="#166534">队列（被在途数封顶）</text>
  <g fill="#22c55e">
    <rect x="470" y="478" width="16" height="26"/><rect x="490" y="478" width="16" height="26"/>
    <rect x="510" y="478" width="16" height="26"/><rect x="530" y="478" width="16" height="26"/>
    <rect x="550" y="478" width="16" height="26"/><rect x="570" y="478" width="16" height="26"/>
    <rect x="590" y="478" width="16" height="26"/><rect x="610" y="478" width="16" height="26"/>
    <rect x="630" y="478" width="16" height="26"/><rect x="650" y="478" width="16" height="26"/>
  </g>
  <text x="572" y="510" text-anchor="middle" font-size="12" fill="#166534">永远只有 8 个 → 零超时</text>

  <line x1="726" y1="480" x2="762" y2="480" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="762,480 752,475 752,485" fill="#94a3b8"/>

  <rect x="766" y="444" width="166" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="849" y="474" text-anchor="middle" font-size="14" fill="#334155">下游</text>
  <text x="849" y="495" text-anchor="middle" font-size="12" fill="#64748b">每 tick 只处理 2 个</text>

  <rect x="44" y="536" width="888" height="84" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="64" y="562" font-size="14" font-weight="bold" fill="#15803d">后半段实测：完成 200 · 拒绝 800 · 超时 0 · 平均 RTT 3.94 · 峰值在途 8</text>
  <text x="64" y="586" font-size="13" fill="#334155">原因：Little 定律 L = λ × W —— 把「在途数 L」钉死，等于同时约束了「进来多少 λ」和「待多久 W」。</text>
  <text x="64" y="606" font-size="13" fill="#334155">下游变慢（W 涨）时，λ 会被自动压低 —— 这正是背压；而多出来的请求被快速拒绝，不占资源。</text>
</svg>
