<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="arwGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="650" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">微服务架构：接入层 / 服务层 / 支撑层</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">服务按业务边界切、各自独占数据；注册配置与可观测性都是横切面，不在业务请求的主链路上</text>

  <text x="20" y="80" font-size="11" fill="#94a3b8">接入层</text>
  <text x="20" y="168" font-size="11" fill="#94a3b8">服务层</text>
  <text x="20" y="348" font-size="11" fill="#94a3b8">支撑层</text>

  <rect x="70" y="88" width="200" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="170" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">客户端</text>
  <text x="170" y="126" text-anchor="middle" font-size="10.5" fill="#475569">Web / App / 第三方</text>

  <line x1="272" y1="113" x2="344" y2="113" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arwBlue)"/>

  <rect x="350" y="82" width="380" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="540" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">统一入口：API 网关</text>
  <text x="540" y="126" text-anchor="middle" font-size="10.5" fill="#1e40af">认证 · 路由 · 限流 · 灰度 · 内部头剥离</text>

  <line x1="540" y1="144" x2="540" y2="158" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="155" y1="158" x2="845" y2="158" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="155" y1="158" x2="155" y2="174" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arwBlue)"/>
  <line x1="385" y1="158" x2="385" y2="174" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arwBlue)"/>
  <line x1="615" y1="158" x2="615" y2="174" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arwBlue)"/>
  <line x1="845" y1="158" x2="845" y2="174" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arwBlue)"/>
  <text x="500" y="153" text-anchor="middle" font-size="10" fill="#2563eb">按路由转发</text>

  <g>
    <rect x="55" y="176" width="200" height="132" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="155" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">用户服务</text>
    <text x="155" y="222" text-anchor="middle" font-size="10.5" fill="#1e40af">实例 ×3（集群）</text>
    <rect x="67" y="234" width="176" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="155" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">独立数据库</text>
    <text x="155" y="268" text-anchor="middle" font-size="10.5" fill="#475569">user_db</text>
    <text x="155" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">只通过 API 暴露</text>
  </g>

  <g>
    <rect x="285" y="176" width="200" height="132" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="385" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">订单服务</text>
    <text x="385" y="222" text-anchor="middle" font-size="10.5" fill="#1e40af">实例 ×3（集群）</text>
    <rect x="297" y="234" width="176" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="385" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">独立数据库</text>
    <text x="385" y="268" text-anchor="middle" font-size="10.5" fill="#475569">order_db</text>
    <text x="385" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">只通过 API 暴露</text>
  </g>

  <g>
    <rect x="515" y="176" width="200" height="132" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="615" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">库存服务</text>
    <text x="615" y="222" text-anchor="middle" font-size="10.5" fill="#1e40af">实例 ×3（集群）</text>
    <rect x="527" y="234" width="176" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="615" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">独立数据库</text>
    <text x="615" y="268" text-anchor="middle" font-size="10.5" fill="#475569">stock_db</text>
    <text x="615" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">只通过 API 暴露</text>
  </g>

  <g>
    <rect x="745" y="176" width="200" height="132" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="845" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">支付服务</text>
    <text x="845" y="222" text-anchor="middle" font-size="10.5" fill="#1e40af">实例 ×3（集群）</text>
    <rect x="757" y="234" width="176" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="845" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">独立数据库</text>
    <text x="845" y="268" text-anchor="middle" font-size="10.5" fill="#475569">pay_db</text>
    <text x="845" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">只通过 API 暴露</text>
  </g>

  <line x1="155" y1="308" x2="155" y2="336" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="385" y1="308" x2="385" y2="336" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="615" y1="308" x2="615" y2="336" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="845" y1="308" x2="845" y2="336" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="155" y1="336" x2="845" y2="336" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="330" y="320" width="340" height="18" fill="#ffffff"/>
  <text x="500" y="332" text-anchor="middle" font-size="10.5" fill="#64748b">注册 · 订阅 · 配置推送 · 消息 · trace 上报</text>
  <line x1="185" y1="336" x2="185" y2="354" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arwGray)"/>
  <line x1="500" y1="336" x2="500" y2="354" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arwGray)"/>
  <line x1="815" y1="336" x2="815" y2="354" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arwGray)"/>

  <rect x="40" y="356" width="290" height="112" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="185" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">注册与配置中心</text>
  <text x="185" y="402" text-anchor="middle" font-size="10.5" fill="#166534">Nacos / etcd / Consul</text>
  <text x="185" y="422" text-anchor="middle" font-size="10.5" fill="#166534">服务注册 · 健康检查 · 实例列表 · 配置推送</text>
  <text x="185" y="448" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">控制面：不在请求主链路上</text>

  <rect x="355" y="356" width="290" height="112" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
  <text x="500" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">消息队列</text>
  <text x="500" y="402" text-anchor="middle" font-size="10.5" fill="#92400e">Kafka / RocketMQ / RabbitMQ</text>
  <text x="500" y="422" text-anchor="middle" font-size="10.5" fill="#92400e">解耦 · 削峰 · 异步</text>
  <text x="500" y="448" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#78350f">订单 / 支付 → MQ → 库存 / 通知</text>

  <rect x="670" y="356" width="290" height="112" rx="8" fill="#f5f3ff" stroke="#4f46e5" stroke-width="1.3"/>
  <text x="815" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">可观测性</text>
  <text x="815" y="402" text-anchor="middle" font-size="10.5" fill="#4338ca">日志 · 指标 · 链路追踪</text>
  <text x="815" y="422" text-anchor="middle" font-size="10.5" fill="#4338ca">指标看趋势，日志看细节，trace 串一次请求</text>
  <text x="815" y="448" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3730a3">trace_id 每跳显式透传</text>

  <g>
    <rect x="20" y="492" width="230" height="86" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="135" y="516" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">服务边界</text>
    <text x="135" y="538" text-anchor="middle" font-size="10.5" fill="#334155">按业务能力切，数据库按服务独占</text>
    <text x="135" y="556" text-anchor="middle" font-size="10.5" fill="#64748b">不能跨服务 JOIN，也不能共写一张表</text>
  </g>
  <g>
    <rect x="262" y="492" width="230" height="86" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="377" y="516" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">入口收敛</text>
    <text x="377" y="538" text-anchor="middle" font-size="10.5" fill="#334155">认证 / 路由 / 限流 / 灰度只做一次</text>
    <text x="377" y="556" text-anchor="middle" font-size="10.5" fill="#64748b">业务逻辑不进网关</text>
  </g>
  <g>
    <rect x="504" y="492" width="230" height="86" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="619" y="516" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">控制面</text>
    <text x="619" y="538" text-anchor="middle" font-size="10.5" fill="#334155">注册中心不在请求链路上</text>
    <text x="619" y="556" text-anchor="middle" font-size="10.5" fill="#64748b">挂了靠本地缓存短时继续调用</text>
  </g>
  <g>
    <rect x="746" y="492" width="230" height="86" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="861" y="516" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">横切面</text>
    <text x="861" y="538" text-anchor="middle" font-size="10.5" fill="#334155">trace_id 每跳显式透传</text>
    <text x="861" y="556" text-anchor="middle" font-size="10.5" fill="#64748b">异步任务与线程池最容易断链</text>
  </g>

  <line x1="40" y1="606" x2="80" y2="606" stroke="#2563eb" stroke-width="1.6"/>
  <text x="88" y="610" font-size="10.5" fill="#475569">同步请求</text>
  <line x1="180" y1="606" x2="220" y2="606" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="228" y="610" font-size="10.5" fill="#475569">注册 / 配置 / 观测</text>
  <text x="420" y="610" font-size="10.5" fill="#64748b">⭐ 这里只画层与依赖方向；超时、重试与取消的实测见第六节</text>

  <text x="500" y="636" text-anchor="middle" font-size="10.5" fill="#94a3b8">逻辑架构：与语言和部署形态无关；Go / Java 的落地差异见第四节</text>
</svg>
