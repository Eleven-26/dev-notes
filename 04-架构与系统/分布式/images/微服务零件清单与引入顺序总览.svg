<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">微服务的零件清单：必需件 / 增强件 / 可选件</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">拆完不是结束，而是必须补齐一整套基础设施；按「没有就跑不起来 → 不补就等着出事 → 规模到了才需要」分档</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="300" height="300" fill="#f8fafc" stroke="#2563eb" stroke-width="1.2" rx="10"/>
    <text x="150" y="24" font-size="15" font-weight="bold" fill="#1e40af" text-anchor="middle">必需件</text>
    <text x="150" y="42" font-size="10.5" fill="#64748b" text-anchor="middle">没有它就跑不起来</text>

    <rect x="12" y="52" width="276" height="42" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="24" y="69" font-size="11" font-weight="bold" fill="#1e40af">服务注册与发现</text>
    <text x="24" y="85" font-size="10.5" fill="#1e40af">实例地址会变，调用方不能写死 IP</text>

    <rect x="12" y="100" width="276" height="42" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="24" y="117" font-size="11" font-weight="bold" fill="#1e40af">配置中心</text>
    <text x="24" y="133" font-size="10.5" fill="#1e40af">N 个服务 × M 套环境要能统一改、动态生效</text>

    <rect x="12" y="148" width="276" height="42" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="24" y="165" font-size="11" font-weight="bold" fill="#1e40af">服务间通信</text>
    <text x="24" y="181" font-size="10.5" fill="#1e40af">同步还是异步、HTTP 还是 RPC、怎么定契约</text>

    <rect x="12" y="196" width="276" height="42" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="24" y="213" font-size="11" font-weight="bold" fill="#1e40af">统一入口（网关）</text>
    <text x="24" y="229" font-size="10.5" fill="#1e40af">认证、路由、限流、灰度收在一处，别各做一遍</text>

    <rect x="12" y="244" width="276" height="42" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="24" y="261" font-size="11" font-weight="bold" fill="#1e40af">日志与链路追踪</text>
    <text x="24" y="277" font-size="10.5" fill="#1e40af">一次请求跨 5 个服务，出问题怎么定位</text>
  </g>

  <g transform="translate(330,74)">
    <rect x="0" y="0" width="300" height="300" fill="#f8fafc" stroke="#b45309" stroke-width="1.2" rx="10"/>
    <text x="150" y="24" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">增强件</text>
    <text x="150" y="42" font-size="10.5" fill="#64748b" text-anchor="middle">不补就等着出事</text>

    <rect x="12" y="52" width="276" height="36" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="24" y="74" font-size="10.5" fill="#92400e">超时 / 重试 / 取消预算 — 任一跳变慢都会拖垮上游</text>
    <rect x="12" y="94" width="276" height="36" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="24" y="116" font-size="10.5" fill="#92400e">熔断与降级 — 下游挂了，上游别跟着挂</text>
    <rect x="12" y="136" width="276" height="36" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="24" y="158" font-size="10.5" fill="#92400e">限流 — 保护自己不被突发流量打穿</text>
    <rect x="12" y="178" width="276" height="36" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="24" y="200" font-size="10.5" fill="#92400e">分布式事务 — 跨服务写入的一致性</text>
    <rect x="12" y="220" width="276" height="36" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="24" y="242" font-size="10.5" fill="#92400e">全局唯一 ID — 分库分表后自增主键不可用</text>
    <rect x="12" y="262" width="276" height="36" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="24" y="284" font-size="10.5" fill="#92400e">分布式定时任务 — 多实例下只能有一个执行</text>
  </g>

  <g transform="translate(640,74)">
    <rect x="0" y="0" width="340" height="300" fill="#f8fafc" stroke="#64748b" stroke-width="1.2" rx="10"/>
    <text x="170" y="24" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">可选件</text>
    <text x="170" y="42" font-size="10.5" fill="#64748b" text-anchor="middle">规模到了才需要</text>

    <rect x="12" y="52" width="316" height="42" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
    <text x="24" y="69" font-size="11" font-weight="bold" fill="#334155">服务网格 Service Mesh</text>
    <text x="24" y="85" font-size="10.5" fill="#334155">多语言混布、SDK 升级贵时，把治理下沉到 sidecar</text>

    <rect x="12" y="100" width="316" height="42" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
    <text x="24" y="117" font-size="11" font-weight="bold" fill="#334155">消息队列</text>
    <text x="24" y="133" font-size="10.5" fill="#334155">需要解耦、削峰、异步化时</text>

    <rect x="12" y="148" width="316" height="42" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
    <text x="24" y="165" font-size="11" font-weight="bold" fill="#334155">容器编排</text>
    <text x="24" y="181" font-size="10.5" fill="#334155">实例数量大到手工部署不现实</text>

    <rect x="12" y="196" width="316" height="42" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
    <text x="24" y="213" font-size="11" font-weight="bold" fill="#334155">多环境 / 灰度发布</text>
    <text x="24" y="229" font-size="10.5" fill="#334155">需要按流量比例验证新版本</text>

    <text x="24" y="262" font-size="10.5" fill="#334155">判据：这一件不买，系统照样能跑；</text>
    <text x="24" y="280" font-size="10.5" fill="#334155">但规模一到，欠的都会以故障形式补回来</text>
  </g>

  <g transform="translate(20,390)">
    <rect x="0" y="0" width="960" height="100" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
    <text x="16" y="22" font-size="13" font-weight="bold" fill="#0f172a">⭐ 引入顺序（顺序反了会很难受）</text>

    <rect x="20" y="34" width="150" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="95" y="55" font-size="11" fill="#14532d" text-anchor="middle">注册发现 + 配置中心</text>
    <rect x="190" y="34" width="130" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="255" y="55" font-size="11" fill="#14532d" text-anchor="middle">日志与链路追踪</text>
    <rect x="340" y="34" width="150" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="415" y="55" font-size="11" fill="#14532d" text-anchor="middle">超时 / 熔断 / 限流</text>
    <rect x="510" y="34" width="120" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="570" y="55" font-size="11" fill="#14532d" text-anchor="middle">分布式事务</text>
    <rect x="650" y="34" width="120" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="710" y="55" font-size="11" fill="#14532d" text-anchor="middle">容器编排</text>

    <line x1="172" y1="51" x2="188" y2="51" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="322" y1="51" x2="338" y2="51" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="492" y1="51" x2="508" y2="51" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="632" y1="51" x2="648" y2="51" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>

    <text x="790" y="47" font-size="10.5" fill="#991b1b">先上编排再补追踪，</text>
    <text x="790" y="65" font-size="10.5" fill="#991b1b">出问题时连「请求走到</text>
    <text x="790" y="83" font-size="10.5" fill="#991b1b">哪了」都不知道</text>
  </g>
</svg>
