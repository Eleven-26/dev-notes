<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 478" width="1000" height="478" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="478" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">分布式体系总览（本目录回答「从单机走向多机之后新增哪些问题」）</text>
  <text x="500" y="53" text-anchor="middle" font-size="12" fill="#64748b">根下两篇总纲 · 理论线（为什么难）与治理线（怎么做）两条并列 · 组件用法与容器网络在别的目录</text>

  <rect x="20" y="62" width="960" height="82" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="36" y="83" font-size="14" font-weight="bold" fill="#2563eb">① 总纲与地基（根下 2 篇）—— 先建概念地图，跨产品通用那一层</text>
  <text x="36" y="106" font-size="12.5" fill="#0f172a">分布式与微服务：分布式 vs 微服务辨析、拆分三条判据、零件清单、Go 与 Java 技术栈逐项对照</text>
  <text x="36" y="127" font-size="12.5" fill="#0f172a">集群基础：集群 / 分布式 / 微服务三词辨析、四种集群形态、无状态 vs 有状态、故障转移与脑裂</text>

  <line x1="500" y1="144" x2="500" y2="154" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="20" y="154" width="960" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="36" y="176" font-size="14" font-weight="bold" fill="#1e3a8a">② 理论线 · 理论/（6 篇）—— 为什么难</text>
  <text x="360" y="176" font-size="11" fill="#1e3a8a">一致性 → 共识 → 最终一致 → 跨服务写入 → 全局 ID</text>
  <text x="36" y="200" font-size="12.5" fill="#0f172a">一致性与 CAP</text>
  <text x="340" y="200" font-size="12.5" fill="#0f172a">Raft 协议</text>
  <text x="640" y="200" font-size="12.5" fill="#0f172a">Paxos 协议</text>
  <text x="36" y="222" font-size="12.5" fill="#0f172a">Gossip 协议</text>
  <text x="340" y="222" font-size="12.5" fill="#0f172a">分布式事务</text>
  <text x="640" y="222" font-size="12.5" fill="#0f172a">分布式 ID</text>

  <rect x="20" y="240" width="960" height="112" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="36" y="262" font-size="14" font-weight="bold" fill="#14532d">③ 治理线 · 服务治理/（12 篇）—— 怎么做</text>
  <text x="380" y="262" font-size="11" fill="#14532d">注册发现 → 负载均衡 → 限流 / 并发 → 熔断 → 保护 → 多副本</text>
  <text x="36" y="288" font-size="12.5" fill="#0f172a">服务发现与负载均衡</text>
  <text x="268" y="288" font-size="12.5" fill="#0f172a">服务注册与发现的 Go 实现</text>
  <text x="524" y="288" font-size="12.5" fill="#0f172a">客户端负载均衡的 Go 实现</text>
  <text x="784" y="288" font-size="12.5" fill="#0f172a">服务发现的 Java 实现</text>
  <text x="36" y="312" font-size="12.5" fill="#0f172a">一致性哈希</text>
  <text x="268" y="312" font-size="12.5" fill="#0f172a">限流算法</text>
  <text x="524" y="312" font-size="12.5" fill="#0f172a">并发限制器</text>
  <text x="784" y="312" font-size="12.5" fill="#0f172a">稳定性三件套</text>
  <text x="36" y="336" font-size="12.5" fill="#0f172a">熔断器</text>
  <text x="268" y="336" font-size="12.5" fill="#0f172a">节点级被动摘除</text>
  <text x="524" y="336" font-size="12.5" fill="#0f172a">负载保护</text>
  <text x="784" y="336" font-size="12.5" fill="#0f172a">多副本共享状态</text>

  <rect x="20" y="360" width="960" height="82" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="36" y="382" font-size="14" font-weight="bold" fill="#64748b">与其它目录的边界：本目录只收多机之后新增的问题</text>
  <text x="36" y="406" font-size="11.5" fill="#334155">单机的并发与锁 → 01-编程语言 各语言目录 · 组件的具体用法（Nacos / Redis / MQ）→ 03-数据与中间件 · 拼成真实系统 → 04 系统设计</text>
  <text x="36" y="426" font-size="11.5" fill="#334155">容器编排与部署形态 → 06-工程实践/部署 · 链路追踪 SDK 与采集 → 可观测性 · 网络前提（DNS 轮询 / AIMD 来源）→ 02-计算机基础/网络</text>

  <text x="20" y="462" font-size="12" fill="#94a3b8">读法：先 ① 建概念地图 → 理论线讲「为什么难」、治理线讲「怎么做」两条并列 → 具体产品的落地细节进各自专篇（见本 README 第四节）。</text>
</svg>
