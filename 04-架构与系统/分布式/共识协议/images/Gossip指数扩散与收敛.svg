<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="40" y="42" font-size="19" fill="#0f172a">指数扩散：为什么传播轮数只与 log(N) 相关</text>
  <text x="40" y="70" font-size="13" fill="#64748b">每轮每个已知节点传染 fanout 个邻居 ⇒ 已知道消息的节点数按 fanout 翻倍</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="330" x2="950" y2="330" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="300" font-size="11" fill="#64748b">已知</text>
  <text x="60" y="316" font-size="11" fill="#64748b">节点数</text>

  <!-- 柱（高度 ∝ log10，数字为真实值） -->
  <rect x="120" y="324" width="80" height="6" rx="2" fill="#93c5fd" stroke="#2563eb"/>
  <rect x="250" y="290" width="80" height="40" rx="2" fill="#93c5fd" stroke="#2563eb"/>
  <rect x="380" y="251" width="80" height="79" rx="2" fill="#93c5fd" stroke="#2563eb"/>
  <rect x="510" y="210" width="80" height="120" rx="2" fill="#93c5fd" stroke="#2563eb"/>
  <rect x="640" y="170" width="80" height="160" rx="2" fill="#93c5fd" stroke="#2563eb"/>
  <rect x="770" y="130" width="80" height="200" rx="2" fill="#93c5fd" stroke="#2563eb"/>

  <!-- 柱顶数值 -->
  <text x="160" y="316" font-size="12" fill="#1e3a8a" text-anchor="middle">1</text>
  <text x="290" y="282" font-size="12" fill="#1e3a8a" text-anchor="middle">3</text>
  <text x="420" y="243" font-size="12" fill="#1e3a8a" text-anchor="middle">9</text>
  <text x="550" y="202" font-size="12" fill="#1e3a8a" text-anchor="middle">27</text>
  <text x="680" y="162" font-size="12" fill="#1e3a8a" text-anchor="middle">81</text>
  <text x="810" y="122" font-size="12" fill="#1e3a8a" text-anchor="middle">243</text>

  <!-- 横轴标签 -->
  <text x="160" y="352" font-size="12" fill="#475569" text-anchor="middle">第 0 轮</text>
  <text x="290" y="352" font-size="12" fill="#475569" text-anchor="middle">第 1 轮</text>
  <text x="420" y="352" font-size="12" fill="#475569" text-anchor="middle">第 2 轮</text>
  <text x="550" y="352" font-size="12" fill="#475569" text-anchor="middle">第 3 轮</text>
  <text x="680" y="352" font-size="12" fill="#475569" text-anchor="middle">第 4 轮</text>
  <text x="810" y="352" font-size="12" fill="#475569" text-anchor="middle">第 5 轮</text>

  <!-- 小结 -->
  <rect x="40" y="380" width="920" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="406" font-size="13" fill="#0f172a">要点：N = 1000、fanout = 3 时，3^7 = 2187 ≥ 1000 ⇒ 理论上约 7 轮即可覆盖全网；</text>
  <text x="60" y="430" font-size="13" fill="#0f172a">节点数从 1000 涨到 100 万（多 1000 倍）时，轮数只从 7 增到约 13 —— 因为它只看 log。</text>
</svg>
