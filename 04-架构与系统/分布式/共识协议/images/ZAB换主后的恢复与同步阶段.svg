<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">换主之后：先恢复（补齐自己），再同步（对齐别人），最后才广播</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">这段时间集群不接受客户端写 —— 客户端看到的「切换尖峰」就是它</text>

  <g font-size="11.5">
    <rect x="30" y="84" width="172" height="86" rx="9" fill="#fef3c7" stroke="#b45309"/>
    <text x="116" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">① 选主完成</text>
    <text x="116" y="130" text-anchor="middle" fill="#92400e">比 zxid，谁的日志</text>
    <text x="116" y="148" text-anchor="middle" fill="#92400e">最新谁当 Leader</text>

    <rect x="222" y="84" width="172" height="86" rx="9" fill="#dbeafe" stroke="#2563eb"/>
    <text x="308" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">② 收集（发现）</text>
    <text x="308" y="126" text-anchor="middle" fill="#1e40af">要各节点的</text>
    <text x="308" y="144" text-anchor="middle" fill="#1e40af">lastLoggedZxid</text>
    <text x="308" y="162" text-anchor="middle" fill="#1e40af">与未提交提案</text>

    <rect x="414" y="84" width="172" height="86" rx="9" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="500" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">③ 定权威历史</text>
    <text x="500" y="130" text-anchor="middle" fill="#3730a3">取「多数派里最新」</text>
    <text x="500" y="148" text-anchor="middle" fill="#3730a3">的那份，补齐自己</text>

    <rect x="606" y="84" width="172" height="86" rx="9" fill="#dcfce7" stroke="#16a34a"/>
    <text x="692" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">④ 同步各节点</text>
    <text x="692" y="130" text-anchor="middle" fill="#14532d">分叉 → 回滚截断</text>
    <text x="692" y="148" text-anchor="middle" fill="#14532d">落后 → 补发前滚</text>

    <rect x="798" y="84" width="172" height="86" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="884" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">⑤ 过半追上</text>
    <text x="884" y="130" text-anchor="middle" fill="#475569">进入 LEADING，</text>
    <text x="884" y="148" text-anchor="middle" fill="#475569">才开始收客户端写</text>

    <g stroke="#475569" stroke-width="1.4">
      <line x1="202" y1="127" x2="218" y2="127" marker-end="url(#arwR)"/>
      <line x1="394" y1="127" x2="410" y2="127" marker-end="url(#arwR)"/>
      <line x1="586" y1="127" x2="602" y2="127" marker-end="url(#arwR)"/>
      <line x1="778" y1="127" x2="794" y2="127" marker-end="url(#arwR)"/>
    </g>
  </g>

  <g transform="translate(30,190)">
    <rect x="0" y="0" width="470" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="26" font-size="14" font-weight="bold" fill="#0f172a">例一：补齐（3 节点，多数派 = 2）</text>

    <g font-size="12">
      <text x="20" y="58" fill="#334155">节点 A</text>
      <rect x="110" y="44" width="196" height="20" rx="3" fill="#dbeafe" stroke="#2563eb"/>
      <text x="208" y="59" text-anchor="middle" fill="#1e40af">1:1 …… 1:7</text>
      <text x="320" y="59" font-size="11" fill="#9a3412">落后 2 条</text>

      <text x="20" y="92" fill="#334155">节点 B</text>
      <rect x="110" y="78" width="252" height="20" rx="3" fill="#dcfce7" stroke="#16a34a"/>
      <text x="236" y="93" text-anchor="middle" fill="#14532d">1:1 …… 1:9</text>
      <text x="380" y="93" font-size="11" font-weight="bold" fill="#14532d"> zxid 最大</text>

      <text x="20" y="126" fill="#334155">节点 C</text>
      <rect x="110" y="112" width="252" height="20" rx="3" fill="#dcfce7" stroke="#16a34a"/>
      <text x="236" y="127" text-anchor="middle" fill="#14532d">1:1 …… 1:9</text>
      <text x="380" y="127" font-size="11" fill="#14532d"> 与 B 相同</text>
    </g>

    <text x="20" y="158" font-size="11.5" fill="#334155">1:8、1:9 落在 B + C 上 = 多数派 → 已提交，</text>
    <text x="20" y="176" font-size="11.5" fill="#334155">绝不能因为换主就丢。所以：</text>
    <text x="20" y="198" font-size="12" font-weight="bold" fill="#14532d">新 Leader 只能是 B 或 C；A 在投票阶段就被淘汰</text>
    <text x="20" y="220" font-size="12" fill="#1e40af">A 重新加入后前滚 1:8、1:9（DIFF 同步，只补差量）</text>
  </g>

  <g transform="translate(520,190)">
    <rect x="0" y="0" width="450" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="26" font-size="14" font-weight="bold" fill="#0f172a">例二：截断（旧 Leader 被分区后的分叉）</text>

    <g font-size="12">
      <text x="20" y="58" fill="#334155">旧 Leader D</text>
      <rect x="120" y="44" width="200" height="20" rx="3" fill="#dcfce7" stroke="#16a34a"/>
      <text x="220" y="59" text-anchor="middle" fill="#14532d">1:1 …… 1:9（多数派）</text>

      <rect x="120" y="72" width="110" height="20" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="5 4"/>
      <text x="175" y="87" text-anchor="middle" fill="#991b1b">2:0 只在自己</text>
      <text x="245" y="87" font-size="11" fill="#991b1b">未过半 → 从未提交</text>

      <text x="20" y="120" fill="#334155">新 Leader</text>
      <rect x="120" y="106" width="200" height="20" rx="3" fill="#dbeafe" stroke="#2563eb"/>
      <text x="220" y="121" text-anchor="middle" fill="#1e40af">1:1 …… 1:9 → 3:1 ……</text>
    </g>

    <text x="20" y="152" font-size="11.5" fill="#334155">D 的 2:0 从未确认给任何客户端 → 换主后被回滚，</text>
    <text x="20" y="170" font-size="11.5" fill="#334155">D 重连时先截断这段分叉日志，再按新历史前滚。</text>

    <rect x="20" y="184" width="410" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="34" y="203" font-size="11.5" fill="#1e40af">不变式：已提交的不会丢，未提交的可以截断。</text>
    <text x="34" y="220" font-size="11.5" fill="#1e40af">这条替代了 2PC 的「协调者挂了怎么办」死结。</text>
  </g>

  <rect x="30" y="448" width="940" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="472" font-size="13" font-weight="bold" fill="#0f172a">两条容易踩的工程线</text>
  <text x="50" y="496" font-size="12" fill="#334155">① 同步分 DIFF 与 SNAP：差距小只补差量；节点离线太久、日志已被轮转掉，就得传整份内存快照 —— 期间它既不能读也不能投票</text>
  <text x="50" y="518" font-size="12" fill="#b45309">② initLimit 卡的就是这一步：追平还没完成就被判超时，节点反复被踢，恢复永远做不完（syncLimit 管的是之后的心跳）</text>
</svg>
