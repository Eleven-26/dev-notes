<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwZ" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arwB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ZAB：三态切换与一次写的两阶段提交</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">左＝节点在集群里的角色状态机；右＝一条写从提案到提交的完整往返</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="430" height="440" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="215" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">角色状态机</text>
    <text x="215" y="48" text-anchor="middle" font-size="10.5" fill="#64748b">quorum 丢失即回到 LOOKING</text>

    <rect x="145" y="76" width="140" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
    <text x="215" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">LOOKING</text>
    <text x="215" y="66" text-anchor="middle" font-size="10.5" fill="#92400e">选主中：比 zxid，谁的日志新谁当</text>

    <rect x="272" y="212" width="140" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="342" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">LEADING</text>

    <rect x="20" y="212" width="140" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="90" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">FOLLOWING</text>

    <rect x="145" y="332" width="140" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="215" y="357" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">OBSERVER</text>

    <line x1="255" y1="118" x2="330" y2="208" stroke="#475569" stroke-width="1.4" marker-end="url(#arwZ)"/>
    <text x="316" y="160" font-size="10.5" fill="#475569">胜出 + 完成恢复</text>
    <line x1="175" y1="118" x2="100" y2="208" stroke="#475569" stroke-width="1.4" marker-end="url(#arwZ)"/>
    <text x="30" y="160" font-size="10.5" fill="#475569">跟上选出的 Leader</text>
    <text x="215" y="392" text-anchor="middle" font-size="10.5" fill="#64748b">静态角色：只收已提交事务、可读、不投票（不计入 quorum）</text>

    <path d="M 342 256 L 342 300 L 215 300 L 215 122" fill="none" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arwZ)"/>
    <text x="352" y="292" font-size="10.5" fill="#b45309">失去多数派</text>
    <path d="M 90 256 L 90 300 L 200 300 L 200 122" fill="none" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arwZ)"/>

    <text x="20" y="412" font-size="11" fill="#334155">⭐ Leader 只有在多数派可用时才保持 LEADING；</text>
    <text x="20" y="430" font-size="11" fill="#334155">Follower 之间不通信 —— 顺序由 Leader 单独定。</text>
  </g>

  <g transform="translate(490,74)">
    <rect x="0" y="0" width="490" height="440" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="245" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">一条写的两阶段</text>
    <text x="245" y="48" text-anchor="middle" font-size="10.5" fill="#64748b">Follower 只能 ACK，不能否决</text>

    <g font-size="11.5" font-weight="bold" fill="#334155">
      <text x="45" y="76" text-anchor="middle">Client</text>
      <text x="160" y="76" text-anchor="middle">Leader</text>
      <text x="300" y="76" text-anchor="middle">Follower A</text>
      <text x="420" y="76" text-anchor="middle">Follower B</text>
    </g>
    <g stroke="#cbd5e1" stroke-width="1.2">
      <line x1="45" y1="84" x2="45" y2="392"/>
      <line x1="160" y1="84" x2="160" y2="392"/>
      <line x1="300" y1="84" x2="300" y2="392"/>
      <line x1="420" y1="84" x2="420" y2="392"/>
    </g>

    <line x1="45" y1="106" x2="156" y2="106" stroke="#475569" stroke-width="1.4" marker-end="url(#arwZ)"/>
    <text x="52" y="100" font-size="10.5" fill="#475569">写请求（同连接 FIFO）</text>

    <line x1="160" y1="140" x2="296" y2="140" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arwB)"/>
    <line x1="160" y1="140" x2="416" y2="140" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arwB)"/>
    <text x="168" y="134" font-size="10.5" fill="#1e40af">PROPOSE（zxid = epoch:counter）</text>

    <g stroke="#16a34a" stroke-width="1.4">
      <line x1="300" y1="176" x2="164" y2="176" marker-end="url(#arwZ)"/>
      <line x1="420" y1="176" x2="164" y2="176" marker-end="url(#arwZ)"/>
    </g>
    <text x="312" y="170" font-size="10.5" fill="#14532d">ACK（落盘完成，不发给客户端）</text>

    <line x1="160" y1="214" x2="164" y2="214" stroke="#b45309" stroke-width="1.4"/>
    <text x="168" y="210" font-size="10.5" fill="#b45309">多数派到 → 本地 COMMIT</text>

    <line x1="160" y1="248" x2="296" y2="248" stroke="#b45309" stroke-width="1.4" marker-end="url(#arwZ)"/>
    <line x1="160" y1="248" x2="416" y2="248" stroke="#b45309" stroke-width="1.4" marker-end="url(#arwZ)"/>
    <text x="168" y="242" font-size="10.5" fill="#b45309">COMMIT（按 zxid 顺序应用到状态机）</text>

    <line x1="160" y1="292" x2="49" y2="292" stroke="#475569" stroke-width="1.4" marker-end="url(#arwZ)"/>
    <text x="56" y="286" font-size="10.5" fill="#475569">返回成功（一定在 COMMIT 之后）</text>

    <rect x="20" y="316" width="450" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="36" y="338" font-size="11" fill="#9a3412">⚠️ 不是「多数派落盘就回 OK」，而是「多数派落盘 + 已广播 COMMIT」才回。</text>
    <text x="36" y="360" font-size="11" fill="#9a3412">这样客户端拿到的保证才是「换主之后这条写还在」。</text>

    <text x="20" y="412" font-size="11" fill="#334155">Follower 掉线时：它的未提交提案被回滚，而不是让这次写失败 ——</text>
    <text x="20" y="430" font-size="11" fill="#334155">这就是 ZAB 与 2PC 最实质的区别（参与者没有否决权）。</text>
  </g>

  <text x="500" y="622" text-anchor="middle" font-size="11.5" fill="#64748b">协议规范：ZooKeeper Atomic Broadcast（ZAB）· 图中顺序为论文口径，本轮未启动集群实测</text>
</svg>
