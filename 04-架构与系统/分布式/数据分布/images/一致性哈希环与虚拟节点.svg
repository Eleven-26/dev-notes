<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一致性哈希环：key 顺时针遇到的第一个节点即归属</text>
  <text x="500" y="60" text-anchor="middle" font-size="14" fill="#64748b">左＝只有真实节点，落点不均；右＝每台挂多个虚拟节点，区间被打散</text>

  <!-- ============ 左：真实节点不均 ============ -->
  <rect x="40" y="86" width="420" height="360" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="250" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">只有真实节点 → 一段独大</text>

  <circle cx="250" cy="268" r="120" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- C 的归属区间：从 B(100°) 顺时针到 C(300°)，共 200° -->
  <path d="M 229.2 386.2 A 120 120 0 1 1 310.0 164.1" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round" opacity="0.32"/>

  <g font-size="14" font-weight="bold">
    <circle cx="362.8" cy="309.0" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="362.8" y="314" text-anchor="middle" fill="#1e3a8a">A</text>

    <circle cx="229.2" cy="386.2" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="229.2" y="391" text-anchor="middle" fill="#166534">B</text>

    <circle cx="310.0" cy="164.1" r="20" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="310.0" y="169" text-anchor="middle" fill="#9a3412">C</text>
  </g>

  <g font-size="12" font-weight="bold">
    <circle cx="146.1" cy="328.0" r="9" fill="#334155"/>
    <text x="146.1" y="353" text-anchor="middle" fill="#334155">k1</text>
    <circle cx="209.0" cy="155.2" r="9" fill="#334155"/>
    <text x="209" y="145" text-anchor="middle" fill="#334155">k2</text>
  </g>

  <text x="250" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">C 独扛约 200°（5/9 的区间），A / B 只各扛 80°</text>

  <!-- ============ 右：虚拟节点打散 ============ -->
  <rect x="540" y="86" width="420" height="360" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="750" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">加虚拟节点 → 每段等宽</text>

  <circle cx="750" cy="268" r="120" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="750" y="264" text-anchor="middle" font-size="12" fill="#94a3b8">9 个</text>
  <text x="750" y="280" text-anchor="middle" font-size="12" fill="#94a3b8">虚拟点</text>

  <g font-size="12" font-weight="bold">
    <circle cx="870.0" cy="268.0" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="870" y="273" text-anchor="middle" fill="#1e3a8a">A</text>

    <circle cx="841.9" cy="345.2" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="841.9" y="350" text-anchor="middle" fill="#166534">B</text>

    <circle cx="770.9" cy="386.2" r="15" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="770.9" y="391" text-anchor="middle" fill="#9a3412">C</text>

    <circle cx="690.0" cy="371.9" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="690" y="377" text-anchor="middle" fill="#1e3a8a">A</text>

    <circle cx="637.2" cy="309.0" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="637.2" y="314" text-anchor="middle" fill="#166534">B</text>

    <circle cx="637.2" cy="227.0" r="15" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="637.2" y="232" text-anchor="middle" fill="#9a3412">C</text>

    <circle cx="690.0" cy="164.1" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="690" y="169" text-anchor="middle" fill="#1e3a8a">A</text>

    <circle cx="770.9" cy="149.8" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="770.9" y="155" text-anchor="middle" fill="#166534">B</text>

    <circle cx="841.9" cy="190.8" r="15" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="841.9" y="196" text-anchor="middle" fill="#9a3412">C</text>
  </g>

  <text x="750" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">每段 40°，A / B / C 各扛 3 段</text>

  <!-- 底部要点 -->
  <rect x="40" y="458" width="920" height="62" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="60" y="480" font-size="13" fill="#334155">⭐ 增删一个节点只影响它前面那一小段 key（不再是「取模」那种全量迁移）；但虚拟节点只是概率手段，</text>
  <text x="60" y="500" font-size="13" fill="#334155">物理节点极少时仍可能有偏。⚠️ 建环 = 排序 + 二分，不要在请求路径上重建环。</text>
</svg>
