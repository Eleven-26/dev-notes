<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">4 → 5 个节点：取模约 80% 的 key 换归属，一致性哈希约 20%</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">每个小格代表一个 key；红色 = 扩容后换节点，绿色 = 保持原位</text>

  <!-- 左：取模 -->
  <rect x="40" y="80" width="440" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="260" y="110" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">取模：hash(key) % N</text>
  <text x="260" y="132" font-size="11.5" fill="#64748b" text-anchor="middle">N 从 4 变 5，绝大多数余数改变</text>

  <!-- 20 格：16 红 4 绿 -->
  <g font-size="10" text-anchor="middle">
    <!-- row 1 -->
    <rect x="80" y="160" width="22" height="22" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="91" y="175" fill="#991b1b">换</text>
    <rect x="110" y="160" width="22" height="22" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="121" y="175" fill="#991b1b">换</text>
    <rect x="140" y="160" width="22" height="22" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="151" y="175" fill="#991b1b">换</text>
    <rect x="170" y="160" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="181" y="175" fill="#166534">留</text>
    <rect x="200" y="160" width="22" height="22" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="211" y="175" fill="#991b1b">换</text>
    <rect x="230" y="160" width="22" height="22" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="241" y="175" fill="#991b1b">换</text>
    <rect x="260" y="160" width="22" height="22" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="271" y="175" fill="#991b1b">换</text>
    <rect x="290" y="160" width="22" height="22" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="301" y="175" fill="#991b1b">换</text>
    <rect x="320" y="160" width="22" height="22" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="331" y="175" fill="#991b1b">换</text>
    <rect x="350" y="160" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="361" y="175" fill="#166534">留</text>

    <!-- row 2 -->
    <rect x="80" y="200" width="22" height="22" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="91" y="215" fill="#991b1b">换</text>
    <rect x="110" y="200" width="22" height="22" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="121" y="215" fill="#991b1b">换</text>
    <rect x="140" y="200" width="22" height="22" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="151" y="215" fill="#991b1b">换</text>
    <rect x="170" y="200" width="22" height="22" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="181" y="215" fill="#991b1b">换</text>
    <rect x="200" y="200" width="22" height="22" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="211" y="215" fill="#991b1b">换</text>
    <rect x="230" y="200" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="241" y="215" fill="#166534">留</text>
    <rect x="260" y="200" width="22" height="22" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="271" y="215" fill="#991b1b">换</text>
    <rect x="290" y="200" width="22" height="22" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="301" y="215" fill="#991b1b">换</text>
    <rect x="320" y="200" width="22" height="22" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="331" y="215" fill="#991b1b">换</text>
    <rect x="350" y="200" width="22" height="22" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="361" y="215" fill="#991b1b">换</text>
  </g>

  <text x="260" y="270" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">16 / 20 换节点 ≈ 80%</text>
  <text x="260" y="296" font-size="12" fill="#334155" text-anchor="middle">对缓存 = 命中率瞬间归零，请求全压后端</text>

  <rect x="80" y="322" width="360" height="62" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="260" y="346" font-size="12" fill="#991b1b" text-anchor="middle">公式：约 N / (N+1) 的 key 换归属</text>
  <text x="260" y="368" font-size="12" fill="#991b1b" text-anchor="middle">4 → 5 时是 4/5 = 80%</text>

  <!-- 右：一致性哈希 -->
  <rect x="520" y="80" width="440" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="740" y="110" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">一致性哈希：环上找后继</text>
  <text x="740" y="132" font-size="11.5" fill="#64748b" text-anchor="middle">只有新节点前驱的那一段 key 迁移</text>

  <g font-size="10" text-anchor="middle">
    <!-- row 1: 2 moved, 8 stay -->
    <rect x="560" y="160" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="571" y="175" fill="#166534">留</text>
    <rect x="590" y="160" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="601" y="175" fill="#166534">留</text>
    <rect x="620" y="160" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="631" y="175" fill="#166534">留</text>
    <rect x="650" y="160" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="661" y="175" fill="#166534">留</text>
    <rect x="680" y="160" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="691" y="175" fill="#166534">留</text>
    <rect x="710" y="160" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="721" y="175" fill="#166534">留</text>
    <rect x="740" y="160" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="751" y="175" fill="#166534">留</text>
    <rect x="770" y="160" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="781" y="175" fill="#166534">留</text>
    <rect x="800" y="160" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="811" y="175" fill="#166534">留</text>
    <rect x="830" y="160" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="841" y="175" fill="#166534">留</text>

    <!-- row 2: 2 moved, 8 stay -->
    <rect x="560" y="200" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="571" y="215" fill="#166534">留</text>
    <rect x="590" y="200" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="601" y="215" fill="#166534">留</text>
    <rect x="620" y="200" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="631" y="215" fill="#166534">留</text>
    <rect x="650" y="200" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="661" y="215" fill="#166534">留</text>
    <rect x="680" y="200" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="691" y="215" fill="#166534">留</text>
    <rect x="710" y="200" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="721" y="215" fill="#166534">留</text>
    <rect x="740" y="200" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="751" y="215" fill="#166534">留</text>
    <rect x="770" y="200" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="781" y="215" fill="#166534">留</text>
    <rect x="800" y="200" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="811" y="215" fill="#166534">留</text>
    <rect x="830" y="200" width="22" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="841" y="215" fill="#166534">留</text>
  </g>

  <!-- 标出迁移的四个 key（用外圈强调） -->
  <rect x="556" y="156" width="30" height="30" rx="5" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 2"/>
  <rect x="586" y="156" width="30" height="30" rx="5" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 2"/>
  <rect x="616" y="196" width="30" height="30" rx="5" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 2"/>
  <rect x="646" y="196" width="30" height="30" rx="5" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 2"/>

  <text x="740" y="270" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">4 / 20 换节点 ≈ 20%</text>
  <text x="740" y="296" font-size="12" fill="#334155" text-anchor="middle">其余 key 的归属不变，缓存仍可命中</text>

  <rect x="560" y="322" width="360" height="62" rx="7" fill="#ecfdf5" stroke="#86efac"/>
  <text x="740" y="346" font-size="12" fill="#065f46" text-anchor="middle">公式：约 1 / (N+1) 的 key 换归属</text>
  <text x="740" y="368" font-size="12" fill="#065f46" text-anchor="middle">4 → 5 时是 1/5 = 20%</text>

  <!-- 底部 -->
  <rect x="40" y="432" width="920" height="62" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="60" y="456" font-size="12.5" fill="#334155">⭐ 一致性哈希把「几乎全量重排」降为「新节点前驱的一段」；代价是环的维护、虚拟节点与一次二分查找。</text>
  <text x="60" y="480" font-size="12" fill="#92400e">⚠️ 比例按均匀哈希估算；虚拟节点少、节点数少或 key 分布倾斜时，实际迁移量会偏离理论值。</text>
</svg>
