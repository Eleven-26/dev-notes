<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">四种分片切法的差别在「key 怎么映射到分片」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">范围查询友好与数据均匀通常不可兼得 —— 选型按主要查询模式定，而不是按哪个更先进</text>
  <defs>
    <marker id="e4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="40" y="84" width="440" height="200" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="58" y="108" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">范围分片</text>
  <text x="58" y="128" font-size="10.5" fill="#64748B" text-anchor="start">按 key 区间切：id 1-1000、时间月份</text>
  <rect x="58" y="146" width="132" height="40" rx="4" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="124" y="172" font-size="11" fill="#334155" text-anchor="middle">片 1</text>
  <rect x="198" y="146" width="132" height="40" rx="4" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="264" y="172" font-size="11" fill="#334155" text-anchor="middle">片 2</text>
  <rect x="338" y="146" width="132" height="40" rx="4" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="404" y="172" font-size="11" fill="#334155" text-anchor="middle">片 3</text>
  <text x="58" y="208" font-size="10.5" fill="#166534" text-anchor="start">✅ 范围查询友好、可顺序扫描</text>
  <text x="58" y="230" font-size="10.5" fill="#b91c1c" text-anchor="start">⚠ 按时间递增写入全落最后一片（热点）</text>
  <text x="58" y="252" font-size="10" fill="#64748B" text-anchor="start">例：HBase rowkey、MongoDB range</text>
  <text x="58" y="272" font-size="10" fill="#64748B" text-anchor="start">扩片：按区间拆，通常要预分片或动态分裂</text>
  <rect x="510" y="84" width="450" height="200" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="528" y="108" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">哈希分片</text>
  <text x="528" y="128" font-size="10.5" fill="#64748B" text-anchor="start">hash(key) % N 或查哈希表</text>
  <rect x="528" y="146" width="92" height="40" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.1"/>
  <text x="574" y="172" font-size="10.5" fill="#334155" text-anchor="middle">key</text>
  <line x1="622" y1="166" x2="630" y2="166" stroke="#2563eb" stroke-width="1.2" marker-end="url(#e4)"/>
  <rect x="632" y="146" width="92" height="40" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.1"/>
  <text x="678" y="172" font-size="10.5" fill="#334155" text-anchor="middle">hash</text>
  <line x1="726" y1="166" x2="734" y2="166" stroke="#2563eb" stroke-width="1.2" marker-end="url(#e4)"/>
  <rect x="736" y="146" width="92" height="40" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.1"/>
  <text x="782" y="172" font-size="10.5" fill="#334155" text-anchor="middle">mod 3</text>
  <line x1="830" y1="166" x2="838" y2="166" stroke="#2563eb" stroke-width="1.2" marker-end="url(#e4)"/>
  <rect x="840" y="146" width="92" height="40" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.1"/>
  <text x="886" y="172" font-size="10.5" fill="#334155" text-anchor="middle">片</text>
  <text x="528" y="208" font-size="10.5" fill="#166534" text-anchor="start">✅ 数据均匀</text>
  <text x="528" y="230" font-size="10.5" fill="#b91c1c" text-anchor="start">⚠ 范围查询要广播；改 N 几乎全量迁移</text>
  <text x="528" y="252" font-size="10" fill="#64748B" text-anchor="start">例：取模分表、MongoDB hashed</text>
  <text x="528" y="272" font-size="10" fill="#64748B" text-anchor="start">扩片：N 变了映射全变，所以要预分片或用一致性哈希</text>
  <rect x="40" y="300" width="440" height="200" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="58" y="324" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">一致性哈希</text>
  <text x="58" y="344" font-size="10.5" fill="#64748B" text-anchor="start">key 与节点都映射到环，顺时针找归属</text>
  <circle cx="150" cy="424" r="52" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="202" cy="424" r="9" fill="#2563eb"/>
  <circle cx="124" cy="469" r="9" fill="#16a34a"/>
  <circle cx="124" cy="379" r="9" fill="#7c3aed"/>
  <text x="150" y="490" font-size="10.5" fill="#166534" text-anchor="middle">只迁 1/N</text>
  <text x="240" y="384" font-size="10.5" fill="#166534" text-anchor="start">✅ 扩容只迁 1/N 的数据</text>
  <text x="240" y="406" font-size="10.5" fill="#b91c1c" text-anchor="start">⚠ 实现复杂：虚拟节点、迁移流程</text>
  <text x="240" y="428" font-size="10" fill="#64748B" text-anchor="start">例：Redis Cluster 槽位、客户端分片</text>
  <text x="240" y="450" font-size="10" fill="#64748B" text-anchor="start">注意：节点少时数据倾斜严重，必须加虚拟节点</text>
  <text x="240" y="472" font-size="10" fill="#64748B" text-anchor="start">取模与它的迁移量对比见一致性哈希.md 第四节</text>
  <rect x="510" y="300" width="450" height="200" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="528" y="324" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">目录分片</text>
  <text x="528" y="344" font-size="10.5" fill="#64748B" text-anchor="start">维护一张 key → 分片 的映射表</text>
  <rect x="528" y="360" width="180" height="24" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="538" y="377" font-size="10" fill="#334155" text-anchor="start">user_1001</text>
  <line x1="710" y1="372" x2="736" y2="372" stroke="#94a3b8" stroke-width="1.1" marker-end="url(#e4)"/>
  <text x="744" y="377" font-size="10" fill="#1e3a8a" text-anchor="start">分片 2</text>
  <rect x="528" y="390" width="180" height="24" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="538" y="407" font-size="10" fill="#334155" text-anchor="start">user_1002</text>
  <line x1="710" y1="402" x2="736" y2="402" stroke="#94a3b8" stroke-width="1.1" marker-end="url(#e4)"/>
  <text x="744" y="407" font-size="10" fill="#1e3a8a" text-anchor="start">分片 1</text>
  <rect x="528" y="420" width="180" height="24" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="538" y="437" font-size="10" fill="#334155" text-anchor="start">order_9x</text>
  <line x1="710" y1="432" x2="736" y2="432" stroke="#94a3b8" stroke-width="1.1" marker-end="url(#e4)"/>
  <text x="744" y="437" font-size="10" fill="#1e3a8a" text-anchor="start">分片 3</text>
  <text x="528" y="468" font-size="10.5" fill="#166534" text-anchor="start">✅ 迁移灵活、可按业务调整</text>
  <text x="760" y="468" font-size="10.5" fill="#b91c1c" text-anchor="start">⚠ 目录本身要高可用，多一次查表</text>
  <text x="528" y="490" font-size="10" fill="#64748B" text-anchor="start">例：元数据服务、部分分库分表中间件</text>
  <text x="44" y="536" font-size="13" fill="#1e3a8a" text-anchor="start" font-weight="bold">没有一种切法同时满足「均匀、范围查询、少迁移」</text>
  <text x="60" y="566" font-size="11.5" fill="#334155" text-anchor="start">主要按主键点查 → 哈希；主要按范围扫 → 范围 + 拆分 / 加盐；既要又要 → 二级索引或冷热分离</text>
  <text x="60" y="596" font-size="11.5" fill="#64748B" text-anchor="start">⚠ 加盐解决「写打散」，但会让「按原 key 范围查」变成「查所有盐桶再合并」—— 用之前先确认范围查询不是主路径</text>
  <text x="60" y="620" font-size="11.5" fill="#64748B" text-anchor="start">另外三条缓解热点的手段：反转 key（范围查询失效）、预分片（元数据成本）、拆分热点 key（读时要聚合）</text>
</svg>
