<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Quorum 读写交集：W + R &gt; N 时，至少一个副本同时见过这次写</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">N = 副本数，W = 写确认数，R = 读确认数</text>

  <!-- 正例 -->
  <rect x="40" y="80" width="580" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="108" font-size="15" font-weight="bold" fill="#0f172a">N = 3，W = 2，R = 2 → 2 + 2 &gt; 3 ✓</text>

  <!-- 写集合 -->
  <text x="60" y="148" font-size="12" fill="#334155">写集合 W = 2</text>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <circle cx="180" cy="170" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="180" y="176" fill="#14532d">A</text>
    <circle cx="300" cy="170" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="300" y="176" fill="#14532d">B</text>
    <circle cx="420" cy="170" r="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="420" y="176" fill="#94a3b8">C</text>
  </g>
  <text x="180" y="214" font-size="11" fill="#166534" text-anchor="middle">已写入</text>
  <text x="300" y="214" font-size="11" fill="#166534" text-anchor="middle">已写入</text>
  <text x="420" y="214" font-size="11" fill="#94a3b8" text-anchor="middle">未写入</text>

  <!-- 读集合 -->
  <text x="60" y="248" font-size="12" fill="#334155">读集合 R = 2</text>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <circle cx="180" cy="272" r="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="180" y="278" fill="#94a3b8">A</text>
    <circle cx="300" cy="272" r="26" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
    <text x="300" y="278" fill="#9a3412">B</text>
    <circle cx="420" cy="272" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="420" y="278" fill="#1e3a8a">C</text>
  </g>
  <text x="300" y="312" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="middle">交集：B 有最新值</text>

  <!-- 公式 -->
  <rect x="650" y="80" width="310" height="230" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="670" y="108" font-size="15" font-weight="bold" fill="#1e3a8a">交集条件</text>
  <text x="670" y="142" font-size="16" font-weight="bold" fill="#1d4ed8">W + R &gt; N</text>
  <text x="670" y="172" font-size="12" fill="#334155">写集合与读集合必然重叠，</text>
  <text x="670" y="192" font-size="12" fill="#334155">至少一个副本同时见过这次写。</text>
  <line x1="670" y1="212" x2="940" y2="212" stroke="#bfdbfe"/>
  <text x="670" y="238" font-size="12" font-weight="bold" fill="#92400e">但它不等于线性一致</text>
  <text x="670" y="260" font-size="11.5" fill="#334155">还需：写入定序、版本比较、</text>
  <text x="670" y="280" font-size="11.5" fill="#334155">读修复、切换不丢已确认写。</text>
  <text x="670" y="300" font-size="11.5" fill="#b45309">交集只保证「有人知道」，不保证「返回最新的」。</text>

  <!-- 反例 -->
  <rect x="40" y="330" width="920" height="150" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="60" y="358" font-size="15" font-weight="bold" fill="#991b1b">反例：N = 3，W = 1，R = 1 → 1 + 1 ≤ 3 ✗</text>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <circle cx="180" cy="408" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="180" y="413" fill="#14532d">A</text>
    <circle cx="300" cy="408" r="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="300" y="413" fill="#94a3b8">B</text>
    <circle cx="420" cy="408" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="420" y="413" fill="#1e3a8a">C</text>
  </g>
  <text x="180" y="452" font-size="11" fill="#166534" text-anchor="middle">写入 A</text>
  <text x="420" y="452" font-size="11" fill="#1e3a8a" text-anchor="middle">读取 C</text>
  <text x="530" y="398" font-size="12" fill="#991b1b">写只落到 A，读只问 C ——</text>
  <text x="530" y="420" font-size="12" fill="#991b1b">C 上还是旧值，交集为空。</text>
  <text x="530" y="448" font-size="12" fill="#92400e">要补一致性：读全部副本、后台反熵、或提高 W / R。</text>

  <!-- 底部 -->
  <rect x="40" y="498" width="920" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="524" font-size="12.5" fill="#334155">⭐ 调参口诀：想读得快就降 R，想写得快就降 W，想强一致就让 W + R 超过 N；但都要同时检查「切换会不会丢已确认写」。</text>
</svg>
