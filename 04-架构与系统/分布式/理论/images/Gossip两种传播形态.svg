<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>
  <text x="40" y="42" font-size="19" fill="#0f172a">Gossip 的两种形态：反熵 vs 谣言传播</text>
  <text x="40" y="70" font-size="13" fill="#64748b">一个保证一定收敛但流量恒定，一个扩散快但可能漏 —— 工程上两者叠加</text>

  <!-- 反熵 -->
  <rect x="40" y="94" width="440" height="286" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="122" font-size="14" fill="#1e3a8a">反熵（Anti-Entropy）：周期性交换摘要</text>
  <circle cx="130" cy="176" r="24" fill="#dbeafe" stroke="#2563eb"/>
  <circle cx="310" cy="176" r="24" fill="#dbeafe" stroke="#2563eb"/>
  <circle cx="130" cy="272" r="24" fill="#dbeafe" stroke="#2563eb"/>
  <circle cx="310" cy="272" r="24" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="156" y1="176" x2="284" y2="176" stroke="#2563eb" stroke-width="1.2"/>
  <polygon points="156,176 168,171 168,181" fill="#2563eb"/>
  <polygon points="284,176 272,171 272,181" fill="#2563eb"/>
  <line x1="130" y1="202" x2="130" y2="246" stroke="#2563eb" stroke-width="1.2"/>
  <polygon points="130,202 125,214 135,214" fill="#2563eb"/>
  <polygon points="130,246 125,234 135,234" fill="#2563eb"/>
  <line x1="310" y1="202" x2="310" y2="246" stroke="#2563eb" stroke-width="1.2"/>
  <polygon points="310,202 305,214 315,214" fill="#2563eb"/>
  <polygon points="310,246 305,234 315,234" fill="#2563eb"/>
  <text x="60" y="326" font-size="12" fill="#334155">周期性 · 每轮随机挑一个节点，比对全量 / 摘要</text>
  <text x="60" y="348" font-size="12" fill="#16a34a">一定收敛（网络连通即可）· 流量大且恒定</text>
  <text x="60" y="370" font-size="12" fill="#64748b">用途：兜底修复</text>

  <!-- 谣言传播 -->
  <rect x="520" y="94" width="440" height="286" rx="10" fill="#f8fafc" stroke="#ea580c" stroke-width="1.5"/>
  <text x="540" y="122" font-size="14" fill="#7c2d12">谣言传播（Rumor Mongering）：只传新东西</text>
  <circle cx="580" cy="196" r="26" fill="#ffedd5" stroke="#ea580c"/>
  <circle cx="720" cy="156" r="20" fill="#ffedd5" stroke="#ea580c"/>
  <circle cx="720" cy="250" r="20" fill="#ffedd5" stroke="#ea580c"/>
  <circle cx="860" cy="126" r="17" fill="#ffedd5" stroke="#ea580c"/>
  <circle cx="860" cy="196" r="17" fill="#ffedd5" stroke="#ea580c"/>
  <circle cx="860" cy="272" r="17" fill="#ffedd5" stroke="#ea580c"/>
  <line x1="602" y1="184" x2="702" y2="162" stroke="#ea580c" stroke-width="1.2"/>
  <polygon points="702,162 691,163 695,172" fill="#ea580c"/>
  <line x1="602" y1="210" x2="702" y2="242" stroke="#ea580c" stroke-width="1.2"/>
  <polygon points="702,242 695,232 691,241" fill="#ea580c"/>
  <line x1="740" y1="150" x2="844" y2="130" stroke="#ea580c" stroke-width="1.1"/>
  <polygon points="844,130 833,130 836,139" fill="#ea580c"/>
  <line x1="740" y1="160" x2="845" y2="192" stroke="#ea580c" stroke-width="1.1"/>
  <polygon points="845,192 838,182 834,191" fill="#ea580c"/>
  <line x1="740" y1="256" x2="845" y2="268" stroke="#ea580c" stroke-width="1.1"/>
  <polygon points="845,268 835,263 834,272" fill="#ea580c"/>
  <text x="540" y="326" font-size="12" fill="#334155">有新信息时触发 · 只转发「新东西」</text>
  <text x="540" y="348" font-size="12" fill="#ea580c">不保证收敛（可能漏）· 流量小、随传播衰减</text>
  <text x="540" y="370" font-size="12" fill="#64748b">用途：快速扩散</text>

  <!-- 小结 -->
  <rect x="40" y="392" width="920" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="423" font-size="13" fill="#0f172a">要点：快的（谣言）保证体验，慢的（反熵）保证最终不漏 —— 所以真实系统两者都要有。</text>
</svg>
