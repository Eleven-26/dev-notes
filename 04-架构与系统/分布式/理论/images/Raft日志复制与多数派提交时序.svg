<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arwG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arwO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="690" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Raft 日志复制：一次写入的时序与多数派提交</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">写必须经过 Leader；只有拿到多数派确认，日志才算 Commit —— 图中 ①~⑤ 与正文「流程二」逐步对应</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="430" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="480" y="28" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">流程二：日志复制（一次写请求的完整往返）</text>
    <text x="480" y="50" font-size="11.5" fill="#64748b" text-anchor="middle">竖向虚线是各节点的时间轴（上 → 下 = 时间前进），箭头 = 消息方向</text>

    <rect x="35" y="64" width="170" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" rx="6"/>
    <text x="120" y="83" font-size="11.5" font-weight="bold" fill="#1e40af" text-anchor="middle">客户端</text>
    <rect x="295" y="64" width="170" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="6"/>
    <text x="380" y="83" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Leader（唯一写入口）</text>
    <rect x="555" y="64" width="170" height="28" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" rx="6"/>
    <text x="640" y="83" font-size="11.5" font-weight="bold" fill="#334155" text-anchor="middle">Follower B</text>
    <rect x="775" y="64" width="170" height="28" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" rx="6"/>
    <text x="860" y="83" font-size="11.5" font-weight="bold" fill="#334155" text-anchor="middle">Follower C</text>

    <line x1="120" y1="92" x2="120" y2="396" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="380" y1="92" x2="380" y2="308" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="640" y1="92" x2="640" y2="228" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="860" y1="92" x2="860" y2="228" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

    <text x="250" y="118" font-size="12" fill="#334155" text-anchor="middle">① 客户端请求到达 Leader</text>
    <line x1="120" y1="126" x2="372" y2="126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>

    <rect x="280" y="140" width="200" height="34" fill="#fef3c7" stroke="#b45309" stroke-width="1.2" rx="6"/>
    <text x="380" y="161" font-size="11.5" fill="#92400e" text-anchor="middle">② Leader 追加本地日志（未提交）</text>

    <text x="520" y="192" font-size="12" fill="#334155" text-anchor="middle">③ AppendEntries 并行发给所有 Follower</text>
    <line x1="380" y1="202" x2="632" y2="202" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="380" y1="216" x2="852" y2="216" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>

    <rect x="555" y="230" width="170" height="28" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" rx="6"/>
    <text x="640" y="248" font-size="11" fill="#334155" text-anchor="middle">追加到本地日志</text>
    <rect x="775" y="230" width="170" height="28" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" rx="6"/>
    <text x="860" y="248" font-size="11" fill="#334155" text-anchor="middle">追加到本地日志</text>

    <text x="510" y="272" font-size="12" fill="#334155" text-anchor="middle">④ 接收成功 → 向 Leader 响应确认</text>
    <line x1="640" y1="284" x2="390" y2="284" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="860" y1="298" x2="390" y2="298" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>

    <rect x="245" y="308" width="270" height="44" fill="#fef3c7" stroke="#b45309" stroke-width="1.2" rx="8"/>
    <text x="380" y="326" font-size="11" fill="#92400e" text-anchor="middle">⑤ 多数派确认：3 节点集群 = 含自己共 2 台</text>
    <text x="380" y="346" font-size="11" fill="#92400e" text-anchor="middle">→ 达成共识 → Commit → apply 到状态机</text>

    <line x1="380" y1="352" x2="380" y2="396" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="640" y1="258" x2="640" y2="396" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="860" y1="258" x2="860" y2="396" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

    <text x="660" y="374" font-size="11.5" fill="#14532d" text-anchor="middle">⚠️ etcd 的「写成功」只保证多数派已提交，不保证每台都已 apply（见使用一）</text>
    <line x1="380" y1="384" x2="632" y2="384" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>
    <line x1="380" y1="396" x2="852" y2="396" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>
  </g>

  <g transform="translate(20,520)">
    <rect x="0" y="0" width="960" height="150" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="480" y="26" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">这一步在挡什么：四个容易答错的点</text>
    <text x="40" y="54" font-size="12" fill="#334155">多数派是硬门槛：3 节点要 2 台、4 节点要 3 台、5 节点要 3 台以上（见 2.1 节「共识的基本逻辑」）</text>
    <text x="40" y="78" font-size="12" fill="#334155">没拿到多数确认时 Leader 的动作是「持续重试直到成功」而不是放弃 —— 所以写路径必须能容忍重复投递（幂等）</text>
    <text x="40" y="102" font-size="12" fill="#334155">少数派分区里的节点既选不出 Leader 也提交不了日志，自然写不进去 —— 这就是 Raft 的防脑裂方式（不靠超时仲裁）</text>
    <text x="40" y="126" font-size="12" fill="#b45309">强领导者的代价：写必须过 Leader，写性能无法横向扩展 —— 所以它适合读多写少（见 ④ 应用场景）</text>
  </g>
</svg>
