<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">ULID 的位布局与 Crockford Base32 编码</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">128 位 = 48 位毫秒时间戳 + 80 位随机，编码成 26 个字符（130 位，最左补 2 个 0）</text>

  <rect x="28" y="76" width="944" height="124" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="100" font-size="13" font-weight="bold" fill="#0f172a">第一层：128 位怎么分</text>
  <rect x="60" y="126" width="330" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="225" y="148" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">48 bit 时间戳（ms）</text>
  <text x="225" y="165" font-size="10.5" fill="#1e40af" text-anchor="middle">Unix epoch 起算，可用约 8919 年（到公元 10889 年）</text>
  <rect x="390" y="126" width="550" height="48" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <text x="665" y="148" font-size="12" font-weight="bold" fill="#115e59" text-anchor="middle">80 bit 随机数</text>
  <text x="665" y="165" font-size="10.5" fill="#115e59" text-anchor="middle">每毫秒重新取一次；跨毫秒的唯一性由时间戳保证</text>
  <text x="60" y="192" font-size="10.5" fill="#64748b">字节 [0]</text>
  <text x="712" y="192" font-size="10.5" fill="#64748b" text-anchor="middle">字节 [6] 起</text>
  <text x="940" y="192" font-size="10.5" fill="#64748b" text-anchor="end">字节 [15]</text>

  <rect x="28" y="212" width="944" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="236" font-size="13" font-weight="bold" fill="#0f172a">第二层：128 位如何切成 26 个字符</text>
  <text x="46" y="256" font-size="11" fill="#64748b">128 ÷ 5 = 25.6，向上取整到 26 个字符；26 × 5 = 130 位，多出的 2 位在最左侧补 0</text>
    <rect x="60.0" y="286" width="33.8" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="76.9" y="303" font-size="8.5" fill="#991b1b" text-anchor="middle">首位</text>
    <text x="76.9" y="317" font-size="8" fill="#991b1b" text-anchor="middle">限 0-7</text>
