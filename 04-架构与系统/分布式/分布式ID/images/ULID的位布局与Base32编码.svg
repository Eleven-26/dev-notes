  <text x="177" y="345" font-size="10.5" fill="#1e40af" text-anchor="middle">第 1~10 格承载前 50 位 = 2 位补零 + 48 位时间戳</text>
  <text x="690" y="345" font-size="10.5" fill="#115e59" text-anchor="middle">第 11~26 格承载后 80 位随机</text>

  <rect x="28" y="364" width="944" height="126" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="388" font-size="13" font-weight="bold" fill="#0f172a">第三层：Crockford Base32 的 32 个字符</text>
  <text x="46" y="408" font-size="11" fill="#64748b">标准 36 个「数字 + 字母」里去掉 I、L、O、U —— 剩下的字符在 ASCII 里仍然严格递增，所以字符串序等于数值序</text>
