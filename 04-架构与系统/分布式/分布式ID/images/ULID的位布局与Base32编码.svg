  <rect x="28" y="502" width="944" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="526" font-size="13" font-weight="bold" fill="#0f172a">与 UUIDv7 的形态对照</text>
  <line x1="46" y1="540" x2="954" y2="540" stroke="#e2e8f0"/>
  <text x="46" y="560" font-size="11.5" fill="#334155">位宽</text>
  <text x="146" y="560" font-size="11.5" fill="#334155">两者都是 128 位，时间都是 48 位毫秒</text>
  <text x="46" y="580" font-size="11.5" fill="#334155">随机位</text>
  <text x="146" y="580" font-size="11.5" fill="#334155">UUIDv7 为 74 位（版本位 4 + 变体位 2 被占用）；ULID 为 80 位（无版本概念）</text>
  <text x="46" y="600" font-size="11.5" fill="#334155">字符串</text>
  <text x="146" y="600" font-size="11.5" fill="#334155">UUIDv7 为 36 个十六进制字符加 4 个连字符；ULID 为 26 个 Base32 字符，短 10 个字符</text>
</svg>
