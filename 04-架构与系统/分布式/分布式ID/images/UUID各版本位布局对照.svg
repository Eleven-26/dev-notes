<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">UUID 八个版本的 16 字节位布局对照</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">同一行从左到右是字节 [0] 到 [15]，高位在左 —— 时间字段排在哪一段，决定字符串序能不能等于时间序</text>

  <!-- 字节下标刻度 -->
  <g font-size="10" fill="#94a3b8" text-anchor="middle">
    <text x="175" y="90">0</text>
    <text x="226" y="90">1</text>
    <text x="277" y="90">2</text>
    <text x="328" y="90">3</text>
    <text x="379" y="90">4</text>
    <text x="430" y="90">5</text>
    <text x="481" y="90">6</text>
    <text x="532" y="90">7</text>
    <text x="583" y="90">8</text>
    <text x="634" y="90">9</text>
    <text x="685" y="90">10</text>
    <text x="736" y="90">11</text>
    <text x="787" y="90">12</text>
    <text x="838" y="90">13</text>
    <text x="889" y="90">14</text>
    <text x="940" y="90">15</text>
  </g>

  <!-- v1 -->
  <text x="28" y="124" font-size="13" font-weight="bold" fill="#0f172a">v1</text>
  <rect x="28" y="130" width="72" height="16" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="64" y="142" font-size="9.5" fill="#475569" text-anchor="middle">时间 + MAC</text>
  <rect x="150" y="104" width="204" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="252" y="122" font-size="11" fill="#1e40af" text-anchor="middle">time_low</text>
  <text x="252" y="137" font-size="10" fill="#1e40af" text-anchor="middle">时间最低 32 位</text>
  <rect x="354" y="104" width="102" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="405" y="122" font-size="11" fill="#1e40af" text-anchor="middle">time_mid</text>
  <text x="405" y="137" font-size="10" fill="#1e40af" text-anchor="middle">16 位</text>
  <rect x="456" y="104" width="102" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="507" y="122" font-size="11" fill="#991b1b" text-anchor="middle">ver + time_hi</text>
  <text x="507" y="137" font-size="10" fill="#991b1b" text-anchor="middle">版本位 4 位</text>
  <rect x="558" y="104" width="102" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="609" y="122" font-size="11" fill="#991b1b" text-anchor="middle">var + clock_seq</text>
  <text x="609" y="137" font-size="10" fill="#991b1b" text-anchor="middle">变体位 2 位</text>
  <rect x="660" y="104" width="306" height="44" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2"/>
  <text x="813" y="122" font-size="11" fill="#6b21a8" text-anchor="middle">node</text>
  <text x="813" y="137" font-size="10" fill="#6b21a8" text-anchor="middle">48 位 MAC 地址（会泄漏设备信息）</text>

  <!-- v2 -->
  <text x="28" y="180" font-size="13" font-weight="bold" fill="#0f172a">v2</text>
  <rect x="28" y="186" width="72" height="16" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="64" y="198" font-size="9.5" fill="#475569" text-anchor="middle">DCE Security</text>
  <rect x="150" y="160" width="204" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="252" y="178" font-size="11" fill="#475569" text-anchor="middle">POSIX UID / GID</text>
  <text x="252" y="193" font-size="10" fill="#475569" text-anchor="middle">替代 v1 的 time_low</text>
  <rect x="354" y="160" width="102" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="405" y="178" font-size="11" fill="#1e40af" text-anchor="middle">time_mid</text>
  <text x="405" y="193" font-size="10" fill="#1e40af" text-anchor="middle">16 位</text>
  <rect x="456" y="160" width="102" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="507" y="178" font-size="11" fill="#991b1b" text-anchor="middle">ver + time_hi</text>
  <text x="507" y="193" font-size="10" fill="#991b1b" text-anchor="middle">版本位 4 位</text>
  <rect x="558" y="160" width="102" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="609" y="178" font-size="11" fill="#991b1b" text-anchor="middle">var + clock_seq</text>
  <text x="609" y="193" font-size="10" fill="#991b1b" text-anchor="middle">变体位 2 位</text>
  <rect x="660" y="160" width="306" height="44" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2"/>
  <text x="813" y="178" font-size="11" fill="#6b21a8" text-anchor="middle">node</text>
  <text x="813" y="193" font-size="10" fill="#6b21a8" text-anchor="middle">48 位节点标识</text>

  <!-- v3 -->
  <text x="28" y="236" font-size="13" font-weight="bold" fill="#0f172a">v3</text>
  <rect x="28" y="242" width="72" height="16" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="64" y="254" font-size="9.5" fill="#475569" text-anchor="middle">MD5 命名</text>
  <rect x="150" y="216" width="306" height="44" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <text x="303" y="234" font-size="11" fill="#115e59" text-anchor="middle">MD5(namespace + name) 的前 6 字节</text>
  <text x="303" y="249" font-size="10" fill="#115e59" text-anchor="middle">同名同值 —— 确定性哈希，不是随机</text>
  <rect x="456" y="216" width="102" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="507" y="234" font-size="11" fill="#991b1b" text-anchor="middle">ver + 校验值</text>
  <text x="507" y="249" font-size="10" fill="#991b1b" text-anchor="middle">版本位 4 位</text>
  <rect x="558" y="216" width="408" height="44" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <text x="762" y="234" font-size="11" fill="#115e59" text-anchor="middle">哈希剩余字节（含变体位 2 位）</text>
  <text x="762" y="249" font-size="10" fill="#115e59" text-anchor="middle">共 122 位参与哈希输出</text>

  <!-- v4 -->
  <text x="28" y="292" font-size="13" font-weight="bold" fill="#0f172a">v4</text>
  <rect x="28" y="298" width="72" height="16" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="64" y="310" font-size="9.5" fill="#475569" text-anchor="middle">纯随机</text>
  <rect x="150" y="272" width="306" height="44" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <text x="303" y="290" font-size="11" fill="#115e59" text-anchor="middle">122 位随机数</text>
  <text x="303" y="305" font-size="10" fill="#115e59" text-anchor="middle">crypto/rand，完全无序</text>
  <rect x="456" y="272" width="102" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="507" y="290" font-size="11" fill="#991b1b" text-anchor="middle">ver + 随机</text>
  <text x="507" y="305" font-size="10" fill="#991b1b" text-anchor="middle">版本位 4 位</text>
  <rect x="558" y="272" width="408" height="44" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <text x="762" y="290" font-size="11" fill="#115e59" text-anchor="middle">随机数剩余字节（含变体位 2 位）</text>
  <text x="762" y="305" font-size="10" fill="#115e59" text-anchor="middle">二进制序与字符串序都不含时间含义</text>

  <!-- v5 -->
  <text x="28" y="348" font-size="13" font-weight="bold" fill="#0f172a">v5</text>
  <rect x="28" y="354" width="72" height="16" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="64" y="366" font-size="9.5" fill="#475569" text-anchor="middle">SHA-1 命名</text>
  <rect x="150" y="328" width="306" height="44" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <text x="303" y="346" font-size="11" fill="#115e59" text-anchor="middle">SHA-1(namespace + name) 的前 6 字节</text>
  <text x="303" y="361" font-size="10" fill="#115e59" text-anchor="middle">与 v3 同构，只是换哈希函数</text>
  <rect x="456" y="328" width="102" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="507" y="346" font-size="11" fill="#991b1b" text-anchor="middle">ver + 校验值</text>
  <text x="507" y="361" font-size="10" fill="#991b1b" text-anchor="middle">版本位 4 位</text>
  <rect x="558" y="328" width="408" height="44" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <text x="762" y="346" font-size="11" fill="#115e59" text-anchor="middle">哈希剩余字节（含变体位 2 位）</text>
  <text x="762" y="361" font-size="10" fill="#115e59" text-anchor="middle">共 122 位参与哈希输出</text>

  <!-- v6 -->
  <text x="28" y="404" font-size="13" font-weight="bold" fill="#0f172a">v6</text>
  <rect x="28" y="410" width="72" height="16" rx="3" fill="#dcfce7" stroke="#16a34a"/>
  <text x="64" y="422" font-size="9.5" fill="#14532d" text-anchor="middle">有序</text>
  <rect x="150" y="384" width="102" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="201" y="402" font-size="11" fill="#991b1b" text-anchor="middle">ver + time_hi</text>
  <text x="201" y="417" font-size="10" fill="#991b1b" text-anchor="middle">时间高位在前</text>
  <rect x="252" y="384" width="102" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="303" y="402" font-size="11" fill="#1e40af" text-anchor="middle">time_mid</text>
  <text x="303" y="417" font-size="10" fill="#1e40af" text-anchor="middle">16 位</text>
  <rect x="354" y="384" width="204" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="456" y="402" font-size="11" fill="#1e40af" text-anchor="middle">time_low</text>
  <text x="456" y="417" font-size="10" fill="#1e40af" text-anchor="middle">与 v1 相比只是位序倒过来</text>
  <rect x="558" y="384" width="102" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="609" y="402" font-size="11" fill="#991b1b" text-anchor="middle">var + clock_seq</text>
  <text x="609" y="417" font-size="10" fill="#991b1b" text-anchor="middle">变体位 2 位</text>
  <rect x="660" y="384" width="306" height="44" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2"/>
  <text x="813" y="402" font-size="11" fill="#6b21a8" text-anchor="middle">node</text>
  <text x="813" y="417" font-size="10" fill="#6b21a8" text-anchor="middle">48 位节点标识（仍会泄漏 MAC）</text>

  <!-- v7 -->
  <text x="28" y="460" font-size="13" font-weight="bold" fill="#0f172a">v7</text>
  <rect x="28" y="466" width="72" height="16" rx="3" fill="#dcfce7" stroke="#16a34a"/>
  <text x="64" y="478" font-size="9.5" fill="#14532d" text-anchor="middle">有序</text>
  <rect x="150" y="440" width="306" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="303" y="458" font-size="11" fill="#1e40af" text-anchor="middle">unix_ts_ms</text>
  <text x="303" y="473" font-size="10" fill="#1e40af" text-anchor="middle">48 位毫秒时间戳，直接用最高位</text>
  <rect x="456" y="440" width="102" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="507" y="458" font-size="11" fill="#991b1b" text-anchor="middle">ver + rand_a</text>
  <text x="507" y="473" font-size="10" fill="#991b1b" text-anchor="middle">版本 4 位 + 12 位</text>
  <rect x="558" y="440" width="408" height="44" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <text x="762" y="458" font-size="11" fill="#115e59" text-anchor="middle">var + rand_b</text>
  <text x="762" y="473" font-size="10" fill="#115e59" text-anchor="middle">变体 2 位 + 随机 62 位（随机共 74 位）</text>

  <!-- v8 -->
  <text x="28" y="516" font-size="13" font-weight="bold" fill="#0f172a">v8</text>
  <rect x="28" y="522" width="72" height="16" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="64" y="534" font-size="9.5" fill="#475569" text-anchor="middle">自定义</text>
  <rect x="150" y="496" width="306" height="44" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="303" y="514" font-size="11" fill="#334155" text-anchor="middle">自定义字段</text>
  <text x="303" y="529" font-size="10" fill="#334155" text-anchor="middle">厂商私有位分配</text>
  <rect x="456" y="496" width="102" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="507" y="514" font-size="11" fill="#991b1b" text-anchor="middle">ver + 自定义</text>
  <text x="507" y="529" font-size="10" fill="#991b1b" text-anchor="middle">版本位 4 位</text>
  <rect x="558" y="496" width="408" height="44" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="762" y="514" font-size="11" fill="#334155" text-anchor="middle">自定义剩余字节（含变体位 2 位）</text>
  <text x="762" y="529" font-size="10" fill="#334155" text-anchor="middle">只能靠版本位 8 彼此约定</text>

  <!-- 图例 -->
  <g transform="translate(0,566)">
    <rect x="28" y="0" width="944" height="1" fill="#e2e8f0"/>
    <rect x="28" y="18" width="18" height="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="54" y="30" font-size="11.5" fill="#334155">时间字段</text>
    <rect x="128" y="18" width="18" height="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
    <text x="154" y="30" font-size="11.5" fill="#334155">随机 / 哈希</text>
    <rect x="240" y="18" width="18" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="266" y="30" font-size="11.5" fill="#334155">版本位 / 变体位所在字节</text>
    <rect x="428" y="18" width="18" height="14" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2"/>
    <text x="454" y="30" font-size="11.5" fill="#334155">节点 MAC</text>
    <rect x="534" y="18" width="18" height="14" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
    <text x="560" y="30" font-size="11.5" fill="#334155">自定义</text>
  </g>

  <rect x="28" y="606" width="944" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="628" font-size="12.5" font-weight="bold" fill="#0f172a">读图要点</text>
  <text x="46" y="648" font-size="11.5" fill="#334155">v1 把时间最低 32 位排在第一个：time_low 每 429.5 秒回绕一次，字符串序就在回绕点断裂（实测逆序对 2500）；v6 只改了位序，逆序对降到 0。</text>
  <text x="46" y="668" font-size="11.5" fill="#334155">v7 把 48 位毫秒时间戳放在字节 [0]，跨毫秒有序；同毫秒内 74 位随机乱序（1000 条逆序对 249312，纯随机期望 249750）。</text>
</svg>
