<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arwG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">号段模式（Segment）：取号时序与双 buffer 切换</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">一次从 DB 取一段（如 1~1000）缓存在本机内存，用完再取 —— DB 压力降低 step 倍</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="240" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="480" y="24" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">取号时序：内存发号，DB 只负责发号段</text>
    <text x="480" y="42" font-size="10.5" fill="#64748b" text-anchor="middle">竖向虚线 = 各角色的时间轴（上 → 下为时间前进）</text>

    <rect x="120" y="50" width="140" height="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" rx="6"/>
    <text x="190" y="68" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">业务请求</text>
    <rect x="410" y="50" width="150" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="6"/>
    <text x="485" y="68" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">Server（双 buffer）</text>
    <rect x="690" y="50" width="180" height="26" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" rx="6"/>
    <text x="780" y="68" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">MySQL（leaf_alloc）</text>

    <line x1="190" y1="76" x2="190" y2="210" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="485" y1="76" x2="485" y2="210" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="780" y1="76" x2="780" y2="210" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

    <text x="330" y="100" font-size="10.5" fill="#334155" text-anchor="middle">① 取号请求：内存里直接发号，无网络往返</text>
    <line x1="190" y1="108" x2="477" y2="108" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="635" y="132" font-size="10.5" fill="#92400e" text-anchor="middle">② Current 只剩 10% ⇒ 异步取下一段：UPDATE max_id = max_id + step</text>
    <line x1="485" y1="140" x2="772" y2="140" stroke="#b45309" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="635" y="164" font-size="10.5" fill="#334155" text-anchor="middle">③ 新区间 [max_id-step+1, max_id]（靠 DB 行锁保证并发安全）</text>
    <line x1="780" y1="172" x2="493" y2="172" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <text x="330" y="196" font-size="10.5" fill="#14532d" text-anchor="middle">④ 返回 ID（Current 用完时直接切到 Next）</text>
    <line x1="485" y1="204" x2="198" y2="204" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>
  </g>

  <g transform="translate(20,330)">
    <rect x="0" y="0" width="470" height="190" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="235" y="24" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">双 buffer：切换发生在内存里</text>

    <rect x="40" y="44" width="300" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" rx="6"/>
    <text x="190" y="64" font-size="11" fill="#1e40af" text-anchor="middle">Current：1 ~ 1000（已发到 900）</text>
    <line x1="310" y1="38" x2="310" y2="80" stroke="#b45309" stroke-width="1.5"/>
    <text x="340" y="60" font-size="10.5" fill="#92400e" text-anchor="middle">90% 触发预取</text>

    <rect x="40" y="90" width="300" height="30" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" rx="6"/>
    <text x="190" y="110" font-size="11" fill="#334155" text-anchor="middle">Next：1001 ~ 2000（已装好，待切换）</text>

    <text x="235" y="142" font-size="11" fill="#334155" text-anchor="middle">Current 用完 ⇒ 直接把 Next 变成 Current，不等 DB</text>
    <text x="235" y="166" font-size="11" fill="#334155" text-anchor="middle">DB 宕机时，本机剩余号段还能撑一段时间</text>
  </g>

  <g transform="translate(520,330)">
    <rect x="0" y="0" width="460" height="190" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="230" y="24" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">两个必须说清的代价</text>

    <rect x="20" y="40" width="200" height="134" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" rx="8"/>
    <text x="36" y="64" font-size="12" font-weight="bold" fill="#991b1b">① 号段耗尽瞬间阻塞</text>
    <text x="36" y="88" font-size="11" fill="#991b1b">单 buffer 时用完那一刻</text>
    <text x="36" y="106" font-size="11" fill="#991b1b">要同步等 DB 返回新号段</text>
    <text x="36" y="130" font-size="11" fill="#991b1b">⇒ 表现为 RT 尖刺</text>
    <text x="36" y="156" font-size="11" font-weight="bold" fill="#991b1b">解法：双 buffer 预取</text>

    <rect x="240" y="40" width="200" height="134" fill="#fef3c7" stroke="#b45309" stroke-width="1.2" rx="8"/>
    <text x="256" y="64" font-size="12" font-weight="bold" fill="#92400e">② 重启后 ID 跳变</text>
    <text x="256" y="88" font-size="11" fill="#92400e">内存里没用完的号被废弃</text>
    <text x="256" y="112" font-size="11" fill="#92400e">⇒ ID 不连续</text>
    <text x="256" y="136" font-size="11" fill="#92400e">但不影响唯一性</text>
    <text x="256" y="160" font-size="11" fill="#92400e">step 要按业务量调</text>
  </g>
</svg>
