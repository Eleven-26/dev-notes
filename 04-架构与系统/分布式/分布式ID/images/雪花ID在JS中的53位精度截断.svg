<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">雪花 ID 是 64 位，JS 的精确整数只到 53 位</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">常见雪花值约 1.7e18（19 位十进制），JSON.parse 之后末几位会被舍入成 0</text>
  <text x="40" y="88" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">① 一个雪花 ID 的十进制形态（19 位）</text>
