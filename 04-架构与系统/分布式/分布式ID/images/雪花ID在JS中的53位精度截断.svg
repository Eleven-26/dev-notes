  <rect x="600" y="104" width="360" height="172" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="620" y="130" font-size="12.5" fill="#991b1b" text-anchor="start" font-weight="bold">为什么这是硬伤</text>
  <text x="620" y="156" font-size="11" fill="#334155" text-anchor="start">雪花按毫秒递增，相邻两个 ID 只差 1~2</text>
  <text x="620" y="178" font-size="11" fill="#334155" text-anchor="start">舍入后它们可能变成同一个值</text>
  <text x="620" y="206" font-size="11" fill="#b91c1c" text-anchor="start">→ 前端拿到重复主键</text>
  <text x="620" y="228" font-size="11" fill="#b91c1c" text-anchor="start">→ 列表渲染 key 冲突、详情取错行</text>
  <text x="620" y="256" font-size="10.5" fill="#64748B" text-anchor="start">⚠ 同类问题：32 位 PHP、导出 Excel 转科学计数法</text>
  <text x="44" y="316" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">③ 两种修法（对内仍是 BIGINT，只在对外传输时转字符串）</text>
  <rect x="40" y="334" width="450" height="92" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="360" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">Java / Jackson</text>
  <text x="60" y="384" font-size="10.5" fill="#1e3a8a" text-anchor="start">@JsonSerialize(using = ToStringSerializer.class)</text>
  <text x="60" y="406" font-size="10.5" fill="#64748B" text-anchor="start">private Long orderId;    // 全局则注册 SimpleModule</text>
  <rect x="510" y="334" width="450" height="92" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="530" y="360" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">Go / struct tag</text>
  <text x="530" y="384" font-size="10.5" fill="#1e3a8a" text-anchor="start">ID int64 `json:"id,string"`</text>
  <text x="530" y="406" font-size="10.5" fill="#64748B" text-anchor="start">对内仍可参与索引与计算，只是序列化走字符串</text>
  <text x="44" y="468" font-size="12" fill="#1e3a8a" text-anchor="start" font-weight="bold">判据一句话：64 位整数不要以数字形态跨 JSON 边界 —— 只要对端可能是 JS，就按字符串传</text>
  <text x="44" y="502" font-size="11.5" fill="#64748B" text-anchor="start">如果确实要传数字，就得接受精度损失，或换用 ULID 这类字符串友好的形态（26 字符 Base32，全程当字符串处理）</text>
