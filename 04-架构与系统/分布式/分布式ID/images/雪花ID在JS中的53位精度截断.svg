  <text x="814" y="135" font-size="11" fill="#b91c1c" text-anchor="start">← 后 3 位</text>
  <text x="40" y="176" font-size="11.5" fill="#64748B" text-anchor="start">前 16 位在 JS 里能精确表示（2^53 − 1 = 9007199254740991 也是 16 位十进制）</text>
  <text x="40" y="216" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">② JSON.parse 之后：后 3 位被舍入成 0</text>
