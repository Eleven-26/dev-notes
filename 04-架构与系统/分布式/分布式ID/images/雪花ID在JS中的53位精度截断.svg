  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">雪花 ID 是 64 位，JS 的精确整数只到 53 位</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">常见雪花值约 1.7e18（19 位十进制），JSON.parse 之后末几位会被舍入成 0</text>
