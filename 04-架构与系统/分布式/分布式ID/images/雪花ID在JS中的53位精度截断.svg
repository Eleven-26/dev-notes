  <rect x="562" y="98" width="24" height="42" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="574" y="124" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="bold">1</text>
  <text x="586" y="157" font-size="11" fill="#b91c1c" text-anchor="end">后 3 位是 001</text>
  <text x="40" y="176" font-size="11.5" fill="#64748B" text-anchor="start">前 16 位在 JS 里能精确表示（2^53 − 1 = 9007199254740991 也是 16 位十进制）</text>
  <text x="40" y="210" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">② JSON.parse 之后：后 3 位被舍入成 0</text>
