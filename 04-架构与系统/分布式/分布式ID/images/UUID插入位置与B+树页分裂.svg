  <text x="536" y="372" font-size="11" fill="#166534" text-anchor="start">⭐ 只在最右页追加，退化成自增主键的写入形态</text>
  <text x="536" y="392" font-size="11" fill="#92400e" text-anchor="start">⚠ 但同毫秒内 74 位随机仍乱序，只在「这一毫秒」窗口内乱</text>
  <text x="44" y="420" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">两条容易被忽略的放大效应</text>
  <text x="60" y="450" font-size="11.5" fill="#334155" text-anchor="start">① 16 字节主键会被二级索引放大：InnoDB 每个二级索引叶子都要存一份完整主键，主键从 BIGINT(8) 换成 BINARY(16)</text>
  <text x="60" y="474" font-size="11.5" fill="#64748B" text-anchor="start">   键长 +8 字节；4 个二级索引就放大 5 倍（1 次聚簇 + 4 次二级）—— 这就是「对外 UUID、对内 BIGINT」的由来</text>
  <text x="60" y="504" font-size="11.5" fill="#334155" text-anchor="start">② 同毫秒乱序可以被量化：1000 条同毫秒 v7 的逆序对是 249312，纯随机期望是 n(n-1)/4 = 249750，几乎等于完全乱序</text>
  <text x="60" y="528" font-size="11.5" fill="#64748B" text-anchor="start">   把 rand_a 的 12 位改成计数器后逆序对降到 0，代价是每毫秒最多 4096 条</text>
  <text x="44" y="564" font-size="11.5" fill="#64748B" text-anchor="start">同类反例：v1 把 time_low 32 位放在最前，每 7 分 9 秒回绕一次；跨回绕点 100 条的逆序对恰为 2500 = 50 × 50，v6 重排后为 0</text>
</svg>
