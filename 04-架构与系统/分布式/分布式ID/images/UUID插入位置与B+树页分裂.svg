  <path d="M 60 330 L 138 217" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#d1)"/>
  <path d="M 60 330 L 138 269" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#d1)"/>
  <path d="M 60 330 L 138 321" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#d1)"/>
  <text x="52" y="352" font-size="10.5" fill="#b91c1c" text-anchor="start">随机插入点</text>
  <text x="56" y="376" font-size="11" fill="#b91c1c" text-anchor="start">要点：目标页满就页分裂，拆完两页各约 50% 填充</text>
  <text x="56" y="394" font-size="11" fill="#b91c1c" text-anchor="start">要点：每次插入要把目标页读进 Buffer Pool（随机 IO）</text>
  <rect x="520" y="84" width="440" height="316" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="536" y="108" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">UUIDv7：48 位毫秒时间戳在最高位</text>
  <text x="536" y="130" font-size="11" fill="#64748B" text-anchor="start">插入点始终落在最右页附近</text>
  <rect x="680" y="146" width="120" height="32" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="740" y="167" font-size="11" fill="#334155" text-anchor="middle">根节点</text>
