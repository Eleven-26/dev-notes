  <text x="56" y="108" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">UUIDv4：122 位随机</text>
  <text x="56" y="130" font-size="11" fill="#64748B" text-anchor="start">插入点均匀分布在整个叶子层</text>
  <rect x="200" y="146" width="120" height="32" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="260" y="167" font-size="11" fill="#334155" text-anchor="middle">根节点</text>
