  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">v4 与 v7 的代价差别不在 16 字节，而在插入位置</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">InnoDB 聚簇索引按主键升序排叶子页：随机主键每次插进任意一页，单调主键只在最右页追加</text>
  <defs>
