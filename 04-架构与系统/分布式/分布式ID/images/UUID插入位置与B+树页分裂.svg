  <rect x="828" y="205" width="40" height="24" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="872" y="205" width="40" height="24" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="740" y1="178" x2="740" y2="198" stroke="#94a3b8" stroke-width="1.1" marker-end="url(#d1)"/>
  <rect x="560" y="252" width="360" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="564" y="257" width="40" height="24" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="608" y="257" width="40" height="24" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
