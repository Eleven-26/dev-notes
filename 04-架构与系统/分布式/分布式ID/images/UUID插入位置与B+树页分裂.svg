  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">v4 与 v7 的代价差别不在 16 字节，而在插入位置</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">InnoDB 聚簇索引按主键升序排叶子页：随机主键每次插进任意一页，单调主键只在最右页追加</text>
  <defs>
    <marker id="d1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="40" y="84" width="440" height="316" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="56" y="108" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">UUIDv4：122 位随机</text>
  <text x="56" y="130" font-size="11" fill="#64748B" text-anchor="start">插入点均匀分布在整个叶子层</text>
  <rect x="200" y="146" width="120" height="32" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1"/>
