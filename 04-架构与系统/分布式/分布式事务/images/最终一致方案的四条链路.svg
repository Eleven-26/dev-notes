<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-dash" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">最终一致的四条链路：从本地事务到对账</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">四条路线的共同点：先保证「至少一次送达」，再靠消费幂等与对账收敛</text>

  <!-- 1 本地消息表 -->
  <g>
    <rect x="20" y="80" width="150" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="95" y="116" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">① 本地消息表</text>
    <text x="95" y="138" font-size="11" fill="#1e40af" text-anchor="middle">Outbox</text>

    <rect x="190" y="80" width="140" height="90" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="260" y="112" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">业务表 + Outbox</text>
    <text x="260" y="134" font-size="11" fill="#334155" text-anchor="middle">同一本地事务</text>

    <rect x="345" y="80" width="140" height="90" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="415" y="112" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">投递任务</text>
    <text x="415" y="134" font-size="11" fill="#334155" text-anchor="middle">扫描 PENDING</text>

    <rect x="500" y="80" width="140" height="90" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="570" y="112" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">消息队列</text>
    <text x="570" y="134" font-size="11" fill="#334155" text-anchor="middle">至少一次</text>

    <rect x="655" y="80" width="140" height="90" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="725" y="112" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">消费端</text>
    <text x="725" y="134" font-size="11" fill="#334155" text-anchor="middle">幂等消费</text>

    <rect x="810" y="80" width="140" height="90" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="880" y="112" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">标记 SENT</text>
    <text x="880" y="134" font-size="11" fill="#334155" text-anchor="middle">失败继续重试</text>

    <line x1="330" y1="125" x2="340" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="485" y1="125" x2="495" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="640" y1="125" x2="650" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="795" y1="125" x2="805" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- 2 事务消息 -->
  <g>
    <rect x="20" y="205" width="150" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="95" y="241" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">② 事务消息</text>
    <text x="95" y="263" font-size="11" fill="#14532d" text-anchor="middle">RocketMQ 半消息</text>

    <rect x="190" y="205" width="140" height="90" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
    <text x="260" y="237" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">半消息</text>
    <text x="260" y="259" font-size="11" fill="#334155" text-anchor="middle">对消费者不可见</text>

    <rect x="345" y="205" width="140" height="90" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
    <text x="415" y="237" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">执行本地事务</text>
    <text x="415" y="259" font-size="11" fill="#334155" text-anchor="middle">业务落库</text>

    <rect x="500" y="205" width="140" height="90" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
    <text x="570" y="237" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Commit / Rollback</text>
    <text x="570" y="259" font-size="11" fill="#334155" text-anchor="middle">或等待 Broker 回查</text>

    <rect x="655" y="205" width="140" height="90" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
    <text x="725" y="237" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">消息可见</text>
    <text x="725" y="259" font-size="11" fill="#334155" text-anchor="middle">Broker 投递</text>

    <rect x="810" y="205" width="140" height="90" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
    <text x="880" y="237" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">消费端幂等</text>
    <text x="880" y="259" font-size="11" fill="#334155" text-anchor="middle">重复不生效</text>

    <line x1="330" y1="250" x2="340" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="485" y1="250" x2="495" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="640" y1="250" x2="650" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="795" y1="250" x2="805" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <path d="M570,205 C570,188 260,188 260,205" fill="none" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dash)"/>
    <text x="415" y="186" font-size="10.5" fill="#b45309" text-anchor="middle">Producer 崩溃 → Broker 回查本地事务状态</text>
  </g>

  <!-- 3 CDC -->
  <g>
    <rect x="20" y="330" width="150" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="95" y="366" font-size="14" font-weight="bold" fill="#4c1d95" text-anchor="middle">③ CDC</text>
    <text x="95" y="388" font-size="11" fill="#4c1d95" text-anchor="middle">订阅数据库日志</text>

    <rect x="190" y="330" width="140" height="90" rx="8" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="260" y="362" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="middle">业务事务提交</text>
    <text x="260" y="384" font-size="11" fill="#334155" text-anchor="middle">写入数据库</text>

    <rect x="345" y="330" width="140" height="90" rx="8" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="415" y="362" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="middle">数据库日志</text>
    <text x="415" y="384" font-size="11" fill="#334155" text-anchor="middle">binlog / WAL</text>

    <rect x="500" y="330" width="140" height="90" rx="8" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="570" y="362" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="middle">CDC 连接器</text>
    <text x="570" y="384" font-size="11" fill="#334155" text-anchor="middle">解析并投递</text>

    <rect x="655" y="330" width="140" height="90" rx="8" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="725" y="362" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="middle">消息队列</text>
    <text x="725" y="384" font-size="11" fill="#334155" text-anchor="middle">可回放</text>

    <rect x="810" y="330" width="140" height="90" rx="8" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="880" y="362" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="middle">消费端幂等</text>
    <text x="880" y="384" font-size="11" fill="#334155" text-anchor="middle">重复不生效</text>

    <line x1="330" y1="375" x2="340" y2="375" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="485" y1="375" x2="495" y2="375" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="640" y1="375" x2="650" y2="375" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="795" y1="375" x2="805" y2="375" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- 4 最大努力通知 -->
  <g>
    <rect x="20" y="455" width="150" height="90" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
    <text x="95" y="491" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">④ 最大努力通知</text>
    <text x="95" y="513" font-size="11" fill="#92400e" text-anchor="middle">外部系统 / 支付回调</text>

    <rect x="190" y="455" width="140" height="90" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
    <text x="260" y="487" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">业务完成</text>
    <text x="260" y="509" font-size="11" fill="#334155" text-anchor="middle">支付 / 订单</text>

    <rect x="345" y="455" width="140" height="90" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
    <text x="415" y="487" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">通知任务</text>
    <text x="415" y="509" font-size="11" fill="#334155" text-anchor="middle">退避重试</text>

    <rect x="500" y="455" width="140" height="90" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
    <text x="570" y="487" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">接收方</text>
    <text x="570" y="509" font-size="11" fill="#334155" text-anchor="middle">幂等处理</text>

    <rect x="655" y="455" width="140" height="90" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
    <text x="725" y="487" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">查询接口</text>
    <text x="725" y="509" font-size="11" fill="#334155" text-anchor="middle">主动查最终状态</text>

    <rect x="810" y="455" width="140" height="90" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
    <text x="880" y="487" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">对账修复</text>
    <text x="880" y="509" font-size="11" fill="#334155" text-anchor="middle">兜底差异</text>

    <line x1="330" y1="500" x2="340" y2="500" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="485" y1="500" x2="495" y2="500" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="640" y1="500" x2="650" y2="500" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="795" y1="500" x2="805" y2="500" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <path d="M570,545 C570,562 415,562 415,545" fill="none" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dash)"/>
    <text x="492" y="580" font-size="10.5" fill="#b45309" text-anchor="middle">失败 / 超时 → 进入下一轮退避</text>
  </g>

  <rect x="20" y="600" width="960" height="28" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="500" y="619" font-size="12.5" font-weight="bold" fill="#334155" text-anchor="middle">共同底线：至少一次投递 · 消费幂等 · 可观测 · 对账兜底</text>
</svg>
