<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">三种方案对「中间态」的处理方式完全不同</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">2PC 靠数据库锁把中间态藏起来，TCC 靠资源冻结标记未完成，Saga 直接让每一步都生效</text>
  <defs>
    <marker id="e3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="40" y="88" width="150" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="116" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold">维度</text>
  <rect x="198" y="88" width="254" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="325" y="116" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold">2PC / XA</text>
  <rect x="460" y="88" width="254" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="587" y="116" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="bold">TCC</text>
  <rect x="722" y="88" width="238" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="841" y="116" font-size="12.5" fill="#5b21b6" text-anchor="middle" font-weight="bold">Saga</text>
  <rect x="40" y="140" width="150" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="174" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">一致性</text>
  <rect x="198" y="140" width="254" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="212" y="174" font-size="10.5" fill="#334155" text-anchor="start">强一致倾向，二阶段原子提交</text>
  <rect x="460" y="140" width="254" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="474" y="174" font-size="10.5" fill="#334155" text-anchor="start">业务层强一致倾向，Confirm 才最终完成</text>
  <rect x="722" y="140" width="238" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="736" y="174" font-size="10.5" fill="#334155" text-anchor="start">最终一致</text>
  <rect x="40" y="202" width="150" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="236" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">锁</text>
  <rect x="198" y="202" width="254" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="212" y="236" font-size="10.5" fill="#334155" text-anchor="start">数据库长锁，Prepare 后一直持有</text>
  <rect x="460" y="202" width="254" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="474" y="236" font-size="10.5" fill="#334155" text-anchor="start">无数据库长锁，靠资源冻结</text>
  <rect x="722" y="202" width="238" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="736" y="236" font-size="10.5" fill="#334155" text-anchor="start">无全局长锁，每步本地提交</text>
  <rect x="40" y="264" width="150" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="298" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">业务侵入</text>
  <rect x="198" y="264" width="254" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="212" y="298" font-size="10.5" fill="#334155" text-anchor="start">低</text>
  <rect x="460" y="264" width="254" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="474" y="298" font-size="10.5" fill="#334155" text-anchor="start">高：要写三套接口</text>
  <rect x="722" y="264" width="238" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="736" y="298" font-size="10.5" fill="#334155" text-anchor="start">中：要写补偿动作</text>
  <rect x="40" y="326" width="150" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="360" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">补偿语义</text>
  <rect x="198" y="326" width="254" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="212" y="360" font-size="10.5" fill="#334155" text-anchor="start">数据库回滚</text>
  <rect x="460" y="326" width="254" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="474" y="360" font-size="10.5" fill="#334155" text-anchor="start">释放预留，不是撤销已消费</text>
  <rect x="722" y="326" width="238" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="736" y="360" font-size="10.5" fill="#334155" text-anchor="start">执行反向业务动作</text>
  <rect x="40" y="388" width="150" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="422" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">隔离性</text>
  <rect x="198" y="388" width="254" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="212" y="422" font-size="10.5" fill="#334155" text-anchor="start">由数据库锁保证</text>
  <rect x="460" y="388" width="254" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="474" y="422" font-size="10.5" fill="#334155" text-anchor="start">业务层自己构造</text>
  <rect x="722" y="388" width="238" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="736" y="422" font-size="10.5" fill="#334155" text-anchor="start">基本没有，靠语义锁缓解</text>
  <rect x="40" y="450" width="150" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="484" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">适用</text>
  <rect x="198" y="450" width="254" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="212" y="484" font-size="10.5" fill="#334155" text-anchor="start">短事务、同构数据库</text>
  <rect x="460" y="450" width="254" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="474" y="484" font-size="10.5" fill="#334155" text-anchor="start">高并发、资源可预留、短事务</text>
  <rect x="722" y="450" width="238" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="736" y="484" font-size="10.5" fill="#334155" text-anchor="start">长流程、多服务、每步可补偿</text>
  <rect x="40" y="524" width="920" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="56" y="548" font-size="11" fill="#1e3a8a" text-anchor="start">TCC vs 2PC：把「准备」从数据库挪到业务层，换来更短的锁窗口与跨异构资源的能力，代价是三套逻辑 + 隔离性自理</text>
  <rect x="40" y="566" width="920" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="56" y="590" font-size="11" fill="#166534" text-anchor="start">TCC vs Saga：TCC 的 Try 只是预留、中间态对业务是「未完成」；Saga 每一步立即生效、失败靠补偿抵消</text>
</svg>
