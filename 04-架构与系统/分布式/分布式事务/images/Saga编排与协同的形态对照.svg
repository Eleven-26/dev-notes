<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">编排与协同的差别在「谁掌握流程」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">编排有中心协调器显式驱动并记录状态；协同靠事件串联，链路是隐式的</text>
  <defs>
    <marker id="e1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="e2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="40" y="84" width="450" height="300" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="58" y="110" font-size="12.5" fill="#1e3a8a" text-anchor="start" font-weight="bold">编排 Orchestration</text>
  <text x="58" y="132" font-size="10.5" fill="#64748B" text-anchor="start">中央协调器显式调用下一步并记录状态</text>
  <rect x="160" y="150" width="200" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="260" y="178" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="bold">编排器（记录全局状态）</text>
  <rect x="60" y="260" width="130" height="44" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="125" y="288" font-size="11" fill="#334155" text-anchor="middle">库存服务</text>
  <line x1="260" y1="196" x2="125" y2="258" stroke="#2563eb" stroke-width="1.3" marker-end="url(#e1)"/>
  <rect x="210" y="260" width="130" height="44" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="275" y="288" font-size="11" fill="#334155" text-anchor="middle">订单服务</text>
  <line x1="260" y1="196" x2="275" y2="258" stroke="#2563eb" stroke-width="1.3" marker-end="url(#e1)"/>
  <rect x="360" y="260" width="130" height="44" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="425" y="288" font-size="11" fill="#334155" text-anchor="middle">支付服务</text>
  <line x1="260" y1="196" x2="425" y2="258" stroke="#2563eb" stroke-width="1.3" marker-end="url(#e1)"/>
  <text x="58" y="330" font-size="11" fill="#166534" text-anchor="start">优点：流程可视、超时与补偿集中管理</text>
  <text x="58" y="352" font-size="11" fill="#b91c1c" text-anchor="start">风险：协调器复杂且关键，会变成发版瓶颈</text>
  <text x="58" y="374" font-size="10.5" fill="#64748B" text-anchor="start">边界：它只决定调谁、记状态、管补偿，业务规则留在各服务</text>
  <rect x="510" y="84" width="450" height="300" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="528" y="110" font-size="12.5" fill="#166534" text-anchor="start" font-weight="bold">协同 Choreography</text>
  <text x="528" y="132" font-size="10.5" fill="#64748B" text-anchor="start">服务发布领域事件，其他服务订阅后继续</text>
  <rect x="528" y="150" width="130" height="44" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="593" y="178" font-size="11" fill="#334155" text-anchor="middle">库存服务</text>
  <rect x="528" y="232" width="130" height="44" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="593" y="260" font-size="11" fill="#334155" text-anchor="middle">订单服务</text>
  <rect x="528" y="314" width="130" height="44" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="593" y="342" font-size="11" fill="#334155" text-anchor="middle">支付服务</text>
  <line x1="658" y1="172" x2="700" y2="232" stroke="#16a34a" stroke-width="1.3" marker-end="url(#e2)"/>
  <text x="706" y="196" font-size="10" fill="#166534" text-anchor="start">发事件</text>
  <line x1="658" y1="254" x2="700" y2="314" stroke="#16a34a" stroke-width="1.3" marker-end="url(#e2)"/>
  <text x="706" y="278" font-size="10" fill="#166534" text-anchor="start">发事件</text>
  <text x="528" y="380" font-size="11" fill="#166534" text-anchor="start">优点：解耦、加订阅者容易</text>
  <text x="760" y="380" font-size="11" fill="#b91c1c" text-anchor="start">风险：链路隐式、循环依赖难排障</text>
  <text x="44" y="418" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">协同必须自己补上编排器天然具备的四件事</text>
  <rect x="40" y="436" width="450" height="36" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.1"/>
  <text x="54" y="460" font-size="11" fill="#92400e" text-anchor="start">· 事件契约与版本管理</text>
  <rect x="510" y="436" width="450" height="36" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.1"/>
  <text x="524" y="460" font-size="11" fill="#92400e" text-anchor="start">· 全链路追踪 ID</text>
  <rect x="40" y="480" width="450" height="36" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.1"/>
  <text x="54" y="504" font-size="11" fill="#92400e" text-anchor="start">· 每个消费者的幂等与重试策略</text>
  <rect x="510" y="480" width="450" height="36" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.1"/>
  <text x="524" y="504" font-size="11" fill="#92400e" text-anchor="start">· 一张人工维护的「事件 → 消费者」清单</text>
  <text x="44" y="556" font-size="12" fill="#1e3a8a" text-anchor="start" font-weight="bold">判据：步骤多、规则清晰、需要集中看流程 → 编排；步骤少、团队边界清晰、本就是事件驱动 → 协同</text>
  <text x="44" y="588" font-size="11" fill="#64748B" text-anchor="start">两者都是「正向执行 + 反向补偿」，与 2PC 的「先占锁再一起提交」不是同一类解法 —— 补偿是业务动作，回滚是数据库动作</text>
</svg>
