<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="arwR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Saga：顺序提交、两种恢复策略、两种实现方式</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">长事务拆成一串可独立提交的本地事务；每个 Ti 配一个语义相反的 Ci</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="236" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
    <text x="16" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 顺序提交与中途失败</text>
    <text x="16" y="42" font-size="10.5" fill="#64748b">每步完成即提交并释放本地资源；补偿不撤销数据库日志，而是执行新的业务操作抵消影响</text>

    <rect x="30" y="56" width="120" height="36" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="90" y="79" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">T1 已提交</text>
    <rect x="190" y="56" width="120" height="36" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="250" y="79" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">T2 已提交</text>
    <rect x="350" y="56" width="120" height="36" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" rx="8"/>
    <text x="410" y="79" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">T3 失败 ✗</text>
    <rect x="510" y="56" width="120" height="36" fill="#f1f5f9" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4" rx="8"/>
    <text x="570" y="79" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">T4 未执行</text>

    <line x1="150" y1="74" x2="188" y2="74" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="310" y1="74" x2="348" y2="74" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="470" y1="74" x2="508" y2="74" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

    <line x1="90" y1="92" x2="90" y2="136" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="250" y1="92" x2="250" y2="136" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

    <rect x="30" y="136" width="120" height="36" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="90" y="159" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">C1 补偿</text>
    <rect x="190" y="136" width="120" height="36" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="250" y="159" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">C2 补偿</text>
    <line x1="188" y1="154" x2="152" y2="154" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>
    <text x="355" y="158" font-size="10.5" fill="#991b1b">T3 自身未提交，不需要 C3；已提交的 T1、T2 才要补偿</text>

    <rect x="700" y="52" width="230" height="76" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="712" y="70" font-size="12" font-weight="bold" fill="#14532d">正向恢复 Forward Recovery</text>
    <text x="712" y="88" font-size="10.5" fill="#14532d">持续重试失败步骤，走完后续流程</text>
    <text x="712" y="106" font-size="10.5" fill="#14532d">适合「必须完成」的订单履约</text>

    <rect x="700" y="140" width="230" height="76" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="712" y="158" font-size="12" font-weight="bold" fill="#92400e">逆向补偿 Backward Recovery</text>
    <text x="712" y="176" font-size="10.5" fill="#92400e">按 Cn…C2、C1 逆序执行补偿</text>
    <text x="712" y="194" font-size="10.5" fill="#92400e">适合每步都有可靠撤销语义的流程</text>

    <text x="30" y="212" font-size="10.5" fill="#334155">优点：无全局长锁，适合持续数分钟到数天、参与服务多的流程；每个服务仍只处理本地事务</text>
  </g>

  <g transform="translate(20,326)">
    <rect x="0" y="0" width="470" height="214" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
    <text x="16" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 编排 Orchestration</text>
    <text x="16" y="42" font-size="10.5" fill="#64748b">中央协调器显式调用下一步并记录状态</text>

    <rect x="150" y="54" width="170" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" rx="8"/>
    <text x="235" y="76" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">中央协调器</text>

    <rect x="14" y="118" width="100" height="28" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
    <text x="64" y="137" font-size="11" fill="#334155" text-anchor="middle">T1 服务</text>
    <rect x="124" y="118" width="100" height="28" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
    <text x="174" y="137" font-size="11" fill="#334155" text-anchor="middle">T2 服务</text>
    <rect x="234" y="118" width="100" height="28" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
    <text x="284" y="137" font-size="11" fill="#334155" text-anchor="middle">T3 服务</text>
    <rect x="344" y="118" width="100" height="28" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
    <text x="394" y="137" font-size="11" fill="#334155" text-anchor="middle">T4 服务</text>

    <line x1="235" y1="88" x2="66" y2="115" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="235" y1="88" x2="176" y2="115" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="235" y1="88" x2="282" y2="115" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="235" y1="88" x2="392" y2="115" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>

    <text x="16" y="170" font-size="10.5" fill="#14532d">优点：流程可视，超时与补偿集中管理</text>
    <text x="16" y="188" font-size="10.5" fill="#991b1b">风险：协调器复杂且关键，是流程的单点</text>
    <text x="16" y="206" font-size="10.5" fill="#334155">适用：步骤多、规则清晰的核心流程</text>
  </g>

  <g transform="translate(510,326)">
    <rect x="0" y="0" width="470" height="214" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
    <text x="16" y="24" font-size="15" font-weight="bold" fill="#0f172a">C. 协同 Choreography</text>
    <text x="16" y="42" font-size="10.5" fill="#64748b">服务发布领域事件，其他服务订阅后继续</text>

    <rect x="14" y="56" width="130" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
    <text x="79" y="78" font-size="11" fill="#334155" text-anchor="middle">服务A 已下单</text>
    <rect x="170" y="56" width="130" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
    <text x="235" y="78" font-size="11" fill="#334155" text-anchor="middle">服务B 已扣库存</text>
    <rect x="326" y="56" width="130" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
    <text x="391" y="78" font-size="11" fill="#334155" text-anchor="middle">服务C 已发货</text>

    <line x1="144" y1="73" x2="168" y2="73" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>
    <line x1="300" y1="73" x2="324" y2="73" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwD)"/>

    <rect x="14" y="104" width="442" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="30" y="124" font-size="10.5" fill="#92400e">⚠️ 链路隐式、易生循环依赖，排障困难</text>

    <text x="16" y="160" font-size="10.5" fill="#14532d">优点：解耦，扩展新订阅者容易</text>
    <text x="16" y="178" font-size="10.5" fill="#334155">适用：步骤少、事件驱动系统</text>
    <text x="16" y="196" font-size="10.5" fill="#334155">对照：编排把流程写进协调器，协同把流程散在事件里</text>
  </g>
</svg>
