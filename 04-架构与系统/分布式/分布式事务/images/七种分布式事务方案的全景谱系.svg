<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">七种方案的全景谱系：按一致性强度分组</text>
  <text x="500" y="58" font-size="13" fill="#64748b" text-anchor="middle">从左到右：用阻塞与锁换确定性 → 用短暂不一致换吞吐与可用性 → 只做通知与对账</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="300" height="300" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2" rx="10"/>
    <text x="150" y="24" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">强一致倾向</text>
    <text x="150" y="42" font-size="10.5" fill="#64748b" text-anchor="middle">阻塞、锁、较低可用性换确定性</text>

    <rect x="12" y="52" width="276" height="76" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="24" y="70" font-size="12" font-weight="bold" fill="#14532d">2PC（XA）</text>
    <text x="24" y="88" font-size="10.5" fill="#14532d">侵入低（依赖 RM/XA）；性能低：长时间占连接与锁</text>
    <text x="24" y="106" font-size="10.5" fill="#14532d">场景：同构数据库、短事务、低并发核心操作</text>
    <text x="24" y="122" font-size="10.5" fill="#14532d">失败：TM 日志恢复，二阶段重试</text>

    <rect x="12" y="136" width="276" height="76" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="24" y="154" font-size="12" font-weight="bold" fill="#14532d">3PC</text>
    <text x="24" y="172" font-size="10.5" fill="#14532d">侵入低到中；性能比 2PC 更低：多一次网络往返</text>
    <text x="24" y="190" font-size="10.5" fill="#14532d">场景：理论研究、少量特定系统</text>
    <text x="24" y="206" font-size="10.5" fill="#14532d">失败：超时自动决策、恢复协调</text>

    <rect x="12" y="220" width="276" height="76" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="24" y="238" font-size="12" font-weight="bold" fill="#14532d">TCC ⭐ 业务层强一致倾向</text>
    <text x="24" y="256" font-size="10.5" fill="#14532d">侵入 ⭐ 高（三套逻辑）；性能高：无数据库长锁</text>
    <text x="24" y="274" font-size="10.5" fill="#14532d">场景：支付、账户、库存等高并发核心链路</text>
    <text x="24" y="290" font-size="10.5" fill="#14532d">失败：幂等重试、事务栅栏、人工补偿</text>
  </g>

  <g transform="translate(340,74)">
    <rect x="0" y="0" width="320" height="300" fill="#f8fafc" stroke="#2563eb" stroke-width="1.2" rx="10"/>
    <text x="160" y="24" font-size="15" font-weight="bold" fill="#1e40af" text-anchor="middle">最终一致</text>
    <text x="160" y="42" font-size="10.5" fill="#64748b" text-anchor="middle">每个分支通常仍依靠本地 ACID</text>

    <rect x="12" y="52" width="296" height="76" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="24" y="70" font-size="12" font-weight="bold" fill="#1e40af">Saga</text>
    <text x="24" y="88" font-size="10.5" fill="#1e40af">侵入中（需补偿动作）；性能高：分支可独立提交</text>
    <text x="24" y="106" font-size="10.5" fill="#1e40af">场景：长事务、跨多个服务、流程型业务</text>
    <text x="24" y="122" font-size="10.5" fill="#1e40af">失败：正向恢复或逆向补偿</text>

    <rect x="12" y="136" width="296" height="76" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="24" y="154" font-size="12" font-weight="bold" fill="#1e40af">本地消息表</text>
    <text x="24" y="172" font-size="10.5" fill="#1e40af">侵入中（消息表 + 投递任务）；性能中到高</text>
    <text x="24" y="190" font-size="10.5" fill="#1e40af">场景：不依赖特定 MQ 的异步一致</text>
    <text x="24" y="206" font-size="10.5" fill="#1e40af">失败：扫表重投、消费幂等、对账</text>

    <rect x="12" y="220" width="296" height="76" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="24" y="238" font-size="12" font-weight="bold" fill="#1e40af">事务消息（RocketMQ 半消息）</text>
    <text x="24" y="256" font-size="10.5" fill="#1e40af">侵入低到中；性能高；一致性通常更及时</text>
    <text x="24" y="274" font-size="10.5" fill="#1e40af">场景：本地事务与事件发布的原子性</text>
    <text x="24" y="290" font-size="10.5" fill="#1e40af">失败：半消息回查、重复投递幂等</text>
  </g>

  <g transform="translate(680,74)">
    <rect x="0" y="0" width="300" height="300" fill="#f8fafc" stroke="#b45309" stroke-width="1.2" rx="10"/>
    <text x="150" y="24" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">弱一致 / 最终可对账</text>
    <text x="150" y="42" font-size="10.5" fill="#64748b" text-anchor="middle">只保证「通知过 + 能查」</text>

    <rect x="12" y="52" width="276" height="76" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="24" y="70" font-size="12" font-weight="bold" fill="#92400e">最大努力通知</text>
    <text x="24" y="88" font-size="10.5" fill="#92400e">侵入低；性能高</text>
    <text x="24" y="106" font-size="10.5" fill="#92400e">场景：支付结果通知、非核心外部通知</text>
    <text x="24" y="122" font-size="10.5" fill="#92400e">失败：有限重试、查询接口、对账</text>

    <text x="24" y="152" font-size="11" fill="#334155">落地 BASE 的五件配套：</text>
    <text x="24" y="174" font-size="11" fill="#334155">可重试操作、幂等、状态可观测</text>
    <text x="24" y="196" font-size="11" fill="#334155">补偿、对账</text>
    <text x="24" y="222" font-size="11" fill="#b45309">否则只是把错误推迟暴露</text>
    <text x="24" y="248" font-size="11" fill="#92400e">BASE：基本可用 + 软状态</text>
    <text x="24" y="270" font-size="11" fill="#92400e">+ 最终一致 —— 不是「不要一致性」</text>
    <text x="24" y="292" font-size="11" fill="#92400e">而是把一致放宽到明确时间窗口内</text>
  </g>

  <g transform="translate(20,390)">
    <rect x="0" y="0" width="960" height="130" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="40" y="26" font-size="15" font-weight="bold" fill="#0f172a">怎么选：三条判据</text>
    <text x="40" y="54" font-size="12" fill="#334155">横轴不是「哪个好」，而是「不一致窗口能容忍多久」：先确定一致性目标，再评估吞吐、资源锁定时间、改造成本与补偿可行性</text>
    <text x="40" y="80" font-size="12" fill="#334155">侵入性从低到高：XA 类（依赖 RM）→ Saga（加补偿动作）→ TCC（每个动作三套逻辑 + 冻结字段 + 状态机）</text>
    <text x="40" y="106" font-size="12" fill="#b45309">3PC 的工程收益通常抵不过复杂度：通用业务系统很少直接采用，实践中选成熟 XA、TCC 或 Saga（见 3.3 节）</text>
  </g>
</svg>
