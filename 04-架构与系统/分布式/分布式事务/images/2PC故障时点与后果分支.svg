<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">2PC 的原子性依赖协调者最终能把决议送达</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">同一个崩溃，发生在决议持久化之前还是之后，后果完全不同 —— 前者可回滚，后者只能等</text>
  <defs>
    <marker id="d5" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <line x1="80" y1="150" x2="920" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#d5)"/>
  <rect x="150" y="118" width="160" height="30" rx="5" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="230" y="138" font-size="11.5" fill="#334155" text-anchor="middle">Prepare 阶段</text>
  <rect x="420" y="118" width="160" height="30" rx="5" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="500" y="138" font-size="11.5" fill="#334155" text-anchor="middle">收集表决</text>
  <rect x="700" y="118" width="160" height="30" rx="5" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="780" y="138" font-size="11.5" fill="#334155" text-anchor="middle">写 Commit 决议</text>
  <rect x="40" y="176" width="300" height="150" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="56" y="202" font-size="12" fill="#166534" text-anchor="start" font-weight="bold">发送 Prepare 前崩溃</text>
  <text x="56" y="230" font-size="11" fill="#334155" text-anchor="start">· 参与者未收到请求</text>
  <text x="56" y="254" font-size="11" fill="#334155" text-anchor="start">· 超时后本地回滚</text>
  <text x="56" y="278" font-size="11" fill="#334155" text-anchor="start">· 尚未持有资源</text>
  <text x="56" y="310" font-size="11.5" fill="#166534" text-anchor="start" font-weight="bold">风险：低</text>
  <rect x="340" y="176" width="300" height="150" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="356" y="202" font-size="12" fill="#92400e" text-anchor="start" font-weight="bold">收集表决期间崩溃</text>
  <text x="356" y="230" font-size="11" fill="#334155" text-anchor="start">· 已投 Yes 的持有锁等待</text>
  <text x="356" y="254" font-size="11" fill="#334155" text-anchor="start">· 恢复后按日志继续</text>
  <text x="356" y="278" font-size="11" fill="#334155" text-anchor="start">· 日志缺失则长期阻塞</text>
  <text x="356" y="310" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="bold">风险：阻塞</text>
  <rect x="640" y="176" width="300" height="150" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="656" y="202" font-size="12" fill="#991b1b" text-anchor="start" font-weight="bold">写入 Commit 决议后崩溃</text>
  <text x="656" y="230" font-size="11" fill="#334155" text-anchor="start">· 部分已提交、部分未收到</text>
  <text x="656" y="254" font-size="11" fill="#334155" text-anchor="start">· 恢复后重发 Commit</text>
  <text x="656" y="278" font-size="11" fill="#334155" text-anchor="start">· 未收到者一直阻塞</text>
  <text x="656" y="310" font-size="11.5" fill="#991b1b" text-anchor="start" font-weight="bold">风险：只能等</text>
  <text x="44" y="362" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">参与者（RM）侧的四条分支</text>
  <rect x="40" y="380" width="920" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="60" y="406" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">Prepare 前崩溃</text>
  <text x="360" y="406" font-size="11" fill="#334155" text-anchor="start">该分支未准备 → TM 超时后全局回滚</text>
  <rect x="40" y="428" width="920" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.1"/>
  <text x="60" y="454" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">Prepare 后、Commit 前崩溃</text>
  <text x="360" y="454" font-size="11" fill="#334155" text-anchor="start">已准备并持锁 → 重启后从 XA 日志恢复，等 TM 决议</text>
  <rect x="40" y="476" width="920" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.1"/>
  <text x="60" y="502" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">Commit 后崩溃</text>
  <text x="360" y="502" font-size="11" fill="#334155" text-anchor="start">本地已提交 → 无法撤销，只能保证其他分支跟进</text>
  <rect x="40" y="524" width="920" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.1"/>
  <text x="60" y="550" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="bold">网络分区</text>
  <text x="360" y="550" font-size="11" fill="#334155" text-anchor="start">两侧互不可达 → 部分提交、部分阻塞</text>
  <text x="44" y="570" font-size="11" fill="#64748B" text-anchor="start">in-doubt 事务 = 已投 Yes 进入 Prepared 但收不到最终决议的分支：既不能安全提交也不能安全回滚，只能保持锁等 TM 恢复，或用 XA RECOVER 人工裁决</text>
</svg>
