<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1000" height="700" fill="#f8fafc"/>

  <text x="500" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">滑动窗口 / 滑动日志：把窗口「切碎」，还是把时间戳「记下来」</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#64748b">两者都在治同一个病 —— 固定窗口的「交界清零」；区别是「记格子」还是「记每一条」</text>

  <!-- ==================== 左：滑动窗口计数 ==================== -->
  <rect x="24" y="84" width="468" height="392" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <text x="44" y="116" font-size="18" font-weight="bold" fill="#0f766e">① 滑动窗口计数：把窗口切成 N 格</text>
  <text x="44" y="140" font-size="13" fill="#115e59">每次统计 = 当前格 + 前面 N-1 格，格子随时间向前滑</text>

  <!-- 格子 -->
  <g stroke="#14b8a6" stroke-width="1.5">
    <rect x="60" y="170" width="40" height="60" fill="#ccfbf1"/>
    <rect x="100" y="170" width="40" height="60" fill="#ccfbf1"/>
    <rect x="140" y="170" width="40" height="60" fill="#ccfbf1"/>
    <rect x="180" y="170" width="40" height="60" fill="#ccfbf1"/>
    <rect x="220" y="170" width="40" height="60" fill="#ccfbf1"/>
    <rect x="260" y="170" width="40" height="60" fill="#ccfbf1"/>
    <rect x="300" y="170" width="40" height="60" fill="#ccfbf1"/>
    <rect x="340" y="170" width="40" height="60" fill="#ccfbf1"/>
    <rect x="380" y="170" width="40" height="60" fill="#ccfbf1"/>
    <rect x="420" y="170" width="40" height="60" fill="#5eead4" stroke="#0f766e" stroke-width="2"/>
  </g>
  <text x="80" y="206" text-anchor="middle" font-size="12" fill="#115e59">3</text>
  <text x="120" y="206" text-anchor="middle" font-size="12" fill="#115e59">0</text>
  <text x="160" y="206" text-anchor="middle" font-size="12" fill="#115e59">2</text>
  <text x="200" y="206" text-anchor="middle" font-size="12" fill="#115e59">4</text>
  <text x="240" y="206" text-anchor="middle" font-size="12" fill="#115e59">1</text>
  <text x="280" y="206" text-anchor="middle" font-size="12" fill="#115e59">0</text>
  <text x="320" y="206" text-anchor="middle" font-size="12" fill="#115e59">2</text>
  <text x="360" y="206" text-anchor="middle" font-size="12" fill="#115e59">1</text>
  <text x="400" y="206" text-anchor="middle" font-size="12" fill="#115e59">0</text>
  <text x="440" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f766e">1</text>

  <text x="440" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f766e">当前格</text>
  <text x="60" y="274" font-size="12" fill="#115e59">每格 100ms（1s / N=10）—— 格子大小就是精度上限</text>

  <!-- 统计范围括号 -->
  <path d="M60,156 L60,148 L460,148 L460,156" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text x="260" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f766e">统计范围：这 10 格的计数之和（3+0+2+4+1+0+2+1+0+1 = 14）</text>

  <text x="44" y="308" font-size="13" fill="#115e59">⭐ 下一格到来时，整条窗口向前滑一格 —— 不需要「清零」，边界误差自然消失</text>
  <text x="44" y="332" font-size="13" fill="#115e59">内存 O(N)：只存 N 个整数，与请求量无关；N 越大越准、越占内存</text>
  <text x="44" y="358" font-size="13" font-weight="bold" fill="#b91c1c">⚠️ N = 1 时它就「变回」固定窗口 —— 实测放行数与固定窗口完全一致（20 个）</text>
  <text x="44" y="382" font-size="13" fill="#115e59">⚠️ 格子内部仍是瞬时爆发，滑窗只能保证「每格之和」不超限</text>
  <text x="44" y="412" font-size="12" fill="#0f766e">典型：Sentinel 默认统计、Kratos 限流</text>
  <text x="44" y="440" font-size="12" fill="#0f766e">若要更平滑，可按时间比例给「正在滑出的那一格」加权（更准，实现更绕）</text>

  <!-- ==================== 右：滑动日志 ==================== -->
  <rect x="508" y="84" width="468" height="392" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="528" y="116" font-size="18" font-weight="bold" fill="#4338ca">② 滑动日志：记下每一条请求的时间戳</text>
  <text x="528" y="140" font-size="13" fill="#3730a3">窗口是一个「过去 1 秒」的方框，框里有多少条 = 当前计数</text>

  <!-- 时间轴 + 时间戳 -->
  <line x1="540" y1="220" x2="950" y2="220" stroke="#a5b4fc" stroke-width="2"/>
  <g stroke="#4338ca" stroke-width="2">
    <line x1="560" y1="196" x2="560" y2="244"/>
    <line x1="586" y1="196" x2="586" y2="244"/>
    <line x1="604" y1="196" x2="604" y2="244"/>
    <line x1="640" y1="196" x2="640" y2="244"/>
    <line x1="668" y1="196" x2="668" y2="244"/>
    <line x1="690" y1="196" x2="690" y2="244"/>
    <line x1="712" y1="196" x2="712" y2="244"/>
    <line x1="744" y1="196" x2="744" y2="244"/>
    <line x1="768" y1="196" x2="768" y2="244"/>
    <line x1="800" y1="196" x2="800" y2="244"/>
    <line x1="826" y1="196" x2="826" y2="244"/>
    <line x1="880" y1="196" x2="880" y2="244"/>
  </g>
  <text x="560" y="266" text-anchor="middle" font-size="11" fill="#4338ca">每条 = 一个时间戳</text>

  <!-- 滑动方框 -->
  <rect x="700" y="176" width="250" height="92" rx="6" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="825" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">「过去 1 秒」的方框</text>
  <text x="825" y="292" text-anchor="middle" font-size="12" fill="#b91c1c">框内 6 条 → 计数 = 6</text>

  <text x="528" y="330" font-size="13" fill="#3730a3">每次请求：先丢掉窗口外的记录 → 数剩余条数 → 没超限就记一条新的</text>
  <text x="528" y="356" font-size="13" font-weight="bold" fill="#16a34a">⭐ 无边界误差，是这一族里最精确的</text>
  <text x="528" y="380" font-size="13" fill="#b91c1c">⚠️ 内存 = 窗口内请求数 × 每条记录开销（约 100B）</text>
  <text x="528" y="400" font-size="12" fill="#b91c1c">10 万 QPS 就是每秒 10MB 级 —— 大流量下不可用</text>
  <text x="528" y="426" font-size="12" fill="#4338ca">Redis 版骨架：ZREMRANGEBYSCORE 清窗口外 → ZCARD 计数</text>
  <text x="528" y="446" font-size="12" fill="#4338ca">→ ZADD 记一条 → PEXPIRE 兜底清理</text>
  <text x="528" y="468" font-size="12" fill="#4338ca">只在「要毫秒级精确、流量不大」的场景才划算</text>

  <!-- ==================== 实测 ==================== -->
  <rect x="24" y="492" width="952" height="184" rx="10" fill="#0f172a"/>
  <text x="44" y="524" font-size="15" font-weight="bold" fill="#f8fafc">本机实测（Go）：突刺跨交界（t=900 打 10 个 → t=1100 再打 10 个），窗口 1s / 阈值 10</text>
  <text x="44" y="556" font-size="13" fill="#cbd5e1">固定窗口 ····················································· 通过 20（= 2 倍阈值）</text>
  <text x="44" y="580" font-size="13" fill="#fca5a5">滑动窗口 N=1（格 1000ms）······································ 通过 20 ← 与固定窗口一模一样</text>
  <text x="44" y="604" font-size="13" fill="#86efac">滑动窗口 N=2 / 5 / 10 / 100（格 500 / 200 / 100 / 10ms）······· 通过 10</text>
  <text x="44" y="628" font-size="13" fill="#86efac">滑动日志 ····················································· 通过 10</text>
  <text x="44" y="652" font-size="13" fill="#93c5fd">令牌桶（容量 10 / 速率 10）···································· 通过 12（0.2 秒补回 2 个令牌）</text>
</svg>
