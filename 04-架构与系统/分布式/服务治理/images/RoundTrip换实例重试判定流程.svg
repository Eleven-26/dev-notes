<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">RoundTrip 换实例重试的判定流程：先问「请求发出去了吗」</text>
  <text x="500" y="58" text-anchor="middle" font-size="14" fill="#64748b">额度与错误分类出自本篇 §三 的 transport 代码与分类表</text>

  <rect x="300" y="92" width="260" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="430" y="110" text-anchor="middle" font-size="12" fill="#334155">RoundTrip 入口：从 LB 拿一份</text>
  <text x="430" y="126" text-anchor="middle" font-size="12" fill="#334155">实例列表快照，按策略排好顺序</text>

  <line x1="430" y1="132" x2="430" y2="154" stroke="#94a3b8" stroke-width="2" marker-end="url(#arS)"/>

  <rect x="300" y="154" width="260" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="172" text-anchor="middle" font-size="12" fill="#1e40af">tries = MaxRetries + 1 = 3</text>
  <text x="430" y="190" text-anchor="middle" font-size="12" fill="#1e40af">tries 大于台数时压成台数</text>

  <line x1="430" y1="196" x2="430" y2="218" stroke="#94a3b8" stroke-width="2" marker-end="url(#arS)"/>

  <rect x="300" y="218" width="260" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="236" text-anchor="middle" font-size="12" fill="#334155">第 i 次：取下一个实例，</text>
  <text x="430" y="252" text-anchor="middle" font-size="12" fill="#334155">req.Clone 改 host 后发出</text>

  <line x1="430" y1="260" x2="430" y2="282" stroke="#94a3b8" stroke-width="2" marker-end="url(#arS)"/>

  <rect x="300" y="282" width="260" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="307" text-anchor="middle" font-size="12" fill="#1e40af">err == nil ？</text>

  <line x1="560" y1="302" x2="636" y2="302" stroke="#16a34a" stroke-width="2" marker-end="url(#arG)"/>
  <text x="572" y="296" font-size="11.5" fill="#15803d">是</text>
  <rect x="640" y="282" width="320" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="800" y="307" text-anchor="middle" font-size="12" fill="#15803d">返回响应，循环结束</text>

  <line x1="430" y1="322" x2="430" y2="344" stroke="#94a3b8" stroke-width="2" marker-end="url(#arS)"/>
  <text x="442" y="338" font-size="11.5" fill="#64748b">否</text>

  <rect x="300" y="344" width="260" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="430" y="369" text-anchor="middle" font-size="12" fill="#78350f">还有额度吗（i &lt; tries-1）？</text>

  <line x1="560" y1="364" x2="636" y2="364" stroke="#dc2626" stroke-width="2" marker-end="url(#arR)"/>
  <text x="572" y="358" font-size="11.5" fill="#b91c1c">否</text>
  <rect x="640" y="344" width="320" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="800" y="361" text-anchor="middle" font-size="12" fill="#b91c1c">返回最后一个原始错误</text>
  <text x="800" y="378" text-anchor="middle" font-size="11" fill="#7f1d1d">不吞错误、不改写成「服务不可用」</text>

  <line x1="430" y1="384" x2="430" y2="406" stroke="#94a3b8" stroke-width="2" marker-end="url(#arS)"/>
  <text x="442" y="400" font-size="11.5" fill="#64748b">是：先分类再决定</text>

  <rect x="300" y="406" width="260" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="430" y="431" text-anchor="middle" font-size="12" fill="#78350f">哪一类错误？（errors.Is / 类型）</text>

  <path d="M 430 446 L 430 460 L 195 460 L 195 474" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arS)"/>
  <path d="M 430 446 L 430 460 L 500 460 L 500 474" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arS)"/>
  <path d="M 430 446 L 430 460 L 815 460 L 815 474" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arS)"/>

  <rect x="60" y="474" width="270" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="195" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">*net.OpError</text>
  <text x="195" y="510" text-anchor="middle" font-size="11" fill="#334155">connection refused / no such host</text>
  <text x="195" y="528" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">没发出去 → 换实例 ✅</text>

  <rect x="350" y="474" width="300" height="66" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="500" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350f">EOF / unexpected EOF</text>
  <text x="500" y="510" text-anchor="middle" font-size="11" fill="#334155">连接被切，发出去没有不确定</text>
  <text x="500" y="528" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">只有幂等接口才换 ⚠️</text>

  <rect x="670" y="474" width="290" height="66" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="815" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">超时 / 5xx</text>
  <text x="815" y="510" text-anchor="middle" font-size="11" fill="#334155">DeadlineExceeded：很可能已执行</text>
  <text x="815" y="528" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">禁止自动重试 ❌ 交幂等键</text>

  <path d="M 60 507 L 40 507 L 40 239 L 298 239" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arG)"/>
  <text x="52" y="380" font-size="11" fill="#15803d">换下一个实例（i+1）</text>

  <rect x="60" y="556" width="880" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="576" font-size="11.5" fill="#475569">口径：MaxRetries=2 → tries=3；列表只有 2 台时 tries 被压成 2 —— 重试次数不会超过可选实例数，</text>
  <text x="76" y="596" font-size="11.5" fill="#475569">所以「换实例重试」和「同实例重试」是两回事。Clone 一次是为了不让上一次的 body 消耗影响下一次。</text>

  <defs>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
