<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1000" height="660" fill="#f8fafc"/>

  <text x="500" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">令牌桶 vs 漏桶：一个「攒额度」，一个「匀速漏」</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#64748b">两者维护的是同一个量 —— 额度随时间的线性恢复；区别只在「方向」：桶里攒了多少 vs 水位有多高</text>

  <!-- ==================== 左：令牌桶 ==================== -->
  <rect x="24" y="84" width="468" height="500" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="44" y="116" font-size="18" font-weight="bold" fill="#b45309">① 令牌桶：桶里攒的是「可以花的额度」</text>
  <text x="44" y="140" font-size="13" fill="#92400e">请求必须先拿到令牌才能放行；拿不到就拒绝</text>

  <!-- 令牌生成器 -->
  <rect x="44" y="166" width="176" height="58" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="132" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">令牌生成器</text>
  <text x="132" y="211" text-anchor="middle" font-size="12" fill="#92400e">速率 Limit = 10 /秒</text>

  <line x1="224" y1="195" x2="288" y2="195" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="288,195 278,190 278,200" fill="#f59e0b"/>
  <text x="256" y="222" text-anchor="middle" font-size="11" fill="#b45309">按时间</text>
  <text x="256" y="238" text-anchor="middle" font-size="11" fill="#b45309">平滑补入</text>

  <!-- 桶容量标注 -->
  <text x="392" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">桶容量 = Burst（最多装 100 个）</text>

  <!-- 桶 -->
  <path d="M296,172 L488,172 L468,312 L316,312 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="346" cy="208" r="13" fill="#f59e0b"/>
  <circle cx="386" cy="208" r="13" fill="#f59e0b"/>
  <circle cx="426" cy="208" r="13" fill="#f59e0b"/>
  <circle cx="352" cy="254" r="13" fill="#fbbf24"/>
  <circle cx="392" cy="254" r="13" fill="#fbbf24"/>
  <circle cx="430" cy="254" r="13" fill="#fbbf24"/>
  <circle cx="372" cy="294" r="13" fill="#fcd34d"/>
  <circle cx="412" cy="294" r="13" fill="#fcd34d"/>
  <text x="392" y="340" text-anchor="middle" font-size="11" fill="#92400e">桶里每个圆点 = 一个可用令牌</text>

  <!-- 请求 → 取令牌 -->
  <rect x="44" y="366" width="150" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="119" y="398" text-anchor="middle" font-size="14" fill="#334155">请求流</text>

  <line x1="198" y1="393" x2="242" y2="393" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="242,393 232,388 232,398" fill="#94a3b8"/>

  <rect x="246" y="366" width="176" height="54" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="334" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">取 1 个令牌</text>
  <text x="334" y="410" text-anchor="middle" font-size="11" fill="#92400e">有令牌就减 1 并放行</text>

  <line x1="426" y1="382" x2="466" y2="452" stroke="#16a34a" stroke-width="2"/>
  <polygon points="466,452 465,441 456,446" fill="#16a34a"/>

  <rect x="44" y="452" width="150" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="119" y="482" text-anchor="middle" font-size="13" fill="#166534">✔ 放行</text>

  <rect x="246" y="452" width="176" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="334" y="482" text-anchor="middle" font-size="13" fill="#991b1b">✘ 桶空 → 拒绝 429</text>

  <text x="44" y="532" font-size="13" font-weight="bold" fill="#b45309">⭐ 桶里攒下的令牌可以「一次花掉」→ 允许突发</text>
  <text x="44" y="556" font-size="12" fill="#92400e">闲时用不完的令牌会累积（最多到 Burst）；桶满后新令牌直接丢弃</text>

  <!-- ==================== 右：漏桶 ==================== -->
  <rect x="508" y="84" width="468" height="500" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="528" y="116" font-size="18" font-weight="bold" fill="#1d4ed8">② 漏桶：桶里装的是「正在排队的请求」</text>
  <text x="528" y="140" font-size="13" fill="#1e40af">水先入桶，桶底按恒定速率漏出 —— 流出速率 = 系统处理上限</text>

  <rect x="528" y="166" width="140" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="598" y="189" text-anchor="middle" font-size="13" fill="#334155">请求流入</text>
  <text x="598" y="208" text-anchor="middle" font-size="11" fill="#64748b">速率任意（可突发）</text>

  <line x1="672" y1="196" x2="700" y2="196" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="700,196 690,191 690,201" fill="#3b82f6"/>

  <!-- 漏桶本体 + 水位 -->
  <path d="M708,172 L908,172 L886,332 L730,332 Z" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <path d="M714,246 L902,246 L886,332 L730,332 Z" fill="#bfdbfe"/>
  <text x="808" y="296" text-anchor="middle" font-size="13" fill="#1e3a8a">当前水位 = 排队中的请求</text>
  <text x="808" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">剩余空间 = 还能再进多少；装满了就溢出</text>
  <text x="808" y="356" text-anchor="middle" font-size="11" fill="#b91c1c">溢出的请求 → 拒绝 / 丢弃</text>

  <!-- 漏嘴 + 匀速流出 -->
  <path d="M792,332 L824,332 L816,372 L800,372 Z" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="808" y1="372" x2="808" y2="414" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="808,418 803,408 813,408" fill="#3b82f6"/>

  <rect x="708" y="420" width="200" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="808" y="443" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">恒定速率流出</text>
  <text x="808" y="462" text-anchor="middle" font-size="11" fill="#1e40af">永远 1 个/单位时间，不能这次 1、下次 2</text>

  <text x="528" y="510" font-size="13" font-weight="bold" fill="#1d4ed8">⭐ 流出速率恒定 → 把突发「整形」成稳定流量</text>
  <text x="528" y="534" font-size="12" fill="#1e40af">桶里积压的请求只能按速率排队流出 —— 是「等待」，不是「一次放行」</text>
  <text x="528" y="558" font-size="12" fill="#1e40af">因此漏桶不擅长承接突发：突刺只会变成排队或溢出</text>

  <!-- 底部结论 -->
  <rect x="24" y="598" width="952" height="46" rx="8" fill="#0f172a"/>
  <text x="500" y="627" text-anchor="middle" font-size="15" fill="#f8fafc">选择口径：要「严格卡住速率」用漏桶；要「尽量承接流量、同时防雪崩」用令牌桶</text>
</svg>
