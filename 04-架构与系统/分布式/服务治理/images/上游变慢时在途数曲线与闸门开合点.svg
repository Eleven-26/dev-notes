<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="1000" height="630" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="630" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">上游变慢时在途数 L = λ × W 的曲线与闸门开合点</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">到达率 λ = 100/s 一个没多，只是平均停留时间 W 变大；读数与算式出自本篇第一节</text>
  <rect x="90" y="90" width="760" height="470" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 90 560 L 850 560" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 90 560 L 90 90" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="98" y="112" font-size="12.5" fill="#334155">在途数 L（同时有多少个在飞）</text>
  <text x="850" y="590" text-anchor="end" font-size="12.5" fill="#334155">上游平均停留时间 W</text>
  <path d="M 90 287 L 850 287" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="98" y="279" font-size="11.5" font-weight="bold" fill="#b91c1c">闸门上限 max_inflight = 128</text>
  <path d="M 553 560 L 553 287" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M 90 560 L 553 287" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M 553 287 L 814 133" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="455" y="368" font-size="12.5" font-weight="bold" fill="#1e40af">L = 100 × W</text>
  <circle cx="97" cy="556" r="5" fill="#2563eb"/>
  <text x="109" y="586" text-anchor="start" font-size="11.5" fill="#1e40af">W = 20ms → L = 2</text>
  <circle cx="162" cy="517" r="5" fill="#2563eb"/>
  <text x="154" y="509" text-anchor="end" font-size="11.5" fill="#1e40af">W = 200ms → L = 20</text>
  <circle cx="553" cy="287" r="5" fill="#2563eb"/>
  <text x="563" y="281" text-anchor="start" font-size="11.5" fill="#1e40af">W = 1.28s → L = 128：闸门开始拒绝</text>
  <circle cx="814" cy="133" r="5" fill="#2563eb"/>
  <text x="804" y="151" text-anchor="end" font-size="11.5" fill="#1e40af">W = 2s → L = 200：持续过载</text>
  <text x="98" y="250" font-size="11.5" fill="#b91c1c">L ＞ 128：并发已满 → 排队 queue_full / queue_timeout → 503 + Retry-After</text>
  <text x="250" y="520" font-size="11.5" fill="#166534">L ＜ 128：并发未满，快路径一次拿到槽位，正常放行</text>
  <text x="60" y="612" font-size="11.5" fill="#475569">闸门开合点怎么来：W = 128 / 100 = 1.28s —— 停留时间一旦超过 1.28s，λ = 100/s 的到达率就会把在途数顶到上限。</text>
</svg>
