<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="800" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">判定窗口的滑动与打开时刻：同一序列，五种窗口各在第几个请求打开</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">读数出自本篇 3.4 节，golang:1.26-alpine 容器实测；失败率阈值 0.5、最小请求数 4、到达间隔 200ms</text>
  <text x="40" y="86" font-size="13" font-weight="bold" fill="#0f172a">请求序列（40 个）：12 成功 → 2 失败（抖动）→ 10 成功 → 16 失败（持续故障）</text>
  <rect x="40" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="60" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="80" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="100" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="120" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="140" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="160" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="180" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="200" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="220" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="240" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="260" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="280" y="98" width="18" height="28" fill="#fca5a5"/>
  <rect x="300" y="98" width="18" height="28" fill="#fca5a5"/>
  <rect x="320" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="340" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="360" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="380" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="400" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="420" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="440" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="460" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="480" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="500" y="98" width="18" height="28" fill="#86efac"/>
  <rect x="520" y="98" width="18" height="28" fill="#fca5a5"/>
  <rect x="540" y="98" width="18" height="28" fill="#fca5a5"/>
  <rect x="560" y="98" width="18" height="28" fill="#fca5a5"/>
  <rect x="580" y="98" width="18" height="28" fill="#fca5a5"/>
  <rect x="600" y="98" width="18" height="28" fill="#fca5a5"/>
  <rect x="620" y="98" width="18" height="28" fill="#fca5a5"/>
  <rect x="640" y="98" width="18" height="28" fill="#fca5a5"/>
  <rect x="660" y="98" width="18" height="28" fill="#fca5a5"/>
  <rect x="680" y="98" width="18" height="28" fill="#fca5a5"/>
  <rect x="700" y="98" width="18" height="28" fill="#fca5a5"/>
  <rect x="720" y="98" width="18" height="28" fill="#fca5a5"/>
  <rect x="740" y="98" width="18" height="28" fill="#fca5a5"/>
  <rect x="760" y="98" width="18" height="28" fill="#fca5a5"/>
  <rect x="780" y="98" width="18" height="28" fill="#fca5a5"/>
  <rect x="800" y="98" width="18" height="28" fill="#fca5a5"/>
  <rect x="820" y="98" width="18" height="28" fill="#fca5a5"/>
  <text x="49" y="144" text-anchor="middle" font-size="11" fill="#94a3b8">1</text>
  <text x="229" y="144" text-anchor="middle" font-size="11" fill="#94a3b8">10</text>
  <text x="429" y="144" text-anchor="middle" font-size="11" fill="#94a3b8">20</text>
  <text x="829" y="144" text-anchor="middle" font-size="11" fill="#94a3b8">40</text>
  <text x="148" y="164" text-anchor="middle" font-size="11.5" fill="#475569">12 成功</text>
  <text x="298" y="164" text-anchor="middle" font-size="11.5" fill="#475569">2 失败</text>
  <text x="410" y="164" text-anchor="middle" font-size="11.5" fill="#475569">10 成功</text>
  <text x="664" y="164" text-anchor="middle" font-size="11.5" fill="#475569">16 失败</text>
  <path d="M 240 224 L 240 202 L 318 202 L 318 224" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="40" y="217" font-size="12" font-weight="bold" fill="#1e40af">计数窗口 4</text>
  <text x="328" y="217" font-size="11.5" fill="#1e40af">第 14 个打开 · 2F/4 = 50%（抖动误判打开）</text>
  <path d="M 420 274 L 420 252 L 618 252 L 618 274" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="40" y="267" font-size="12" font-weight="bold" fill="#1e40af">计数窗口 10</text>
  <text x="628" y="267" font-size="11.5" fill="#1e40af">第 29 个打开 · 5F/10 = 50%</text>
  <path d="M 280 324 L 280 302 L 678 302 L 678 324" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="40" y="317" font-size="12" font-weight="bold" fill="#1e40af">计数窗口 20</text>
  <text x="688" y="317" font-size="11.5" fill="#1e40af">第 32 个打开 · 10F/20 = 50%</text>
  <text x="40" y="342" font-size="11.5" fill="#64748b">蓝色括号 = 打开那一刻窗口框住的请求；计数窗口按「最近 N 次」取，与请求序号一一对齐。</text>
  <rect x="40" y="358" width="920" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="384" font-size="12.5" font-weight="bold" fill="#0f172a">时间窗口与累计计数（同一段请求序列）</text>
  <text x="60" y="410" font-size="11.5" fill="#475569">时间窗口 400ms（实际覆盖 2 个请求） → 未打开：窗口里的样本凑不到最小请求数 4</text>
  <text x="60" y="434" font-size="11.5" fill="#475569">时间窗口 1000ms（实际覆盖 5 个请求） → 第 27 个打开 · 3F/5 = 60%</text>
  <text x="60" y="458" font-size="11.5" fill="#475569">时间窗口 4000ms（实际覆盖 20 个请求） → 第 32 个打开 · 10F/20 = 50%</text>
  <text x="60" y="482" font-size="11.5" fill="#475569">累计计数（不滑动） → 未打开：第 40 个也只有 18F/40 = 45%</text>
  <rect x="40" y="528" width="920" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="554" font-size="12.5" font-weight="bold" fill="#0f172a">计数窗口的时间跨度 = 窗口大小 × 到达间隔（同一份配置，QPS 一变含义就变）</text>
  <text x="60" y="580" font-size="11.5" fill="#475569">到达间隔 200ms：窗口 4 → 0.8s · 窗口 10 → 2.0s · 窗口 20 → 4.0s · 攒够 4 个样本 0.6s</text>
  <text x="60" y="604" font-size="11.5" fill="#475569">到达间隔 1000ms：窗口 4 → 4.0s · 窗口 10 → 10.0s · 窗口 20 → 20.0s · 攒够 4 个样本 3.0s</text>
  <rect x="40" y="654" width="920" height="126" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="60" y="682" font-size="11.5" fill="#166534">判据：窗口越大越抗抖动、但打开越晚 —— 计数 4 被 2 连失败误判打开，计数 20 要等到第 32 个请求；</text>
  <text x="60" y="706" font-size="11.5" fill="#166534">时间窗口在到达速率恒定时覆盖的请求数是固定的（1000ms 覆盖 5 个），速率一变含义就变；</text>
  <text x="60" y="730" font-size="11.5" fill="#166534">累计计数因为早期成功把分母撑大，持续故障也打不开（45% 到不了 50%），所以判定窗口必须滑动。</text>
</svg>
