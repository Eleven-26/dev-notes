<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwG" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 7,3.5 0,7 z" fill="#334155"/></marker>
  </defs>
  <rect width="1000" height="530" fill="#ffffff"/>
  <text x="40" y="34" font-size="19" font-weight="bold" fill="#0f172a">图的三种表示：系统落点全景</text>
  <text x="40" y="56" font-size="13" fill="#64748b">先问稠密度，再问算法看「某点的邻居」还是「全体边」；本篇只管怎么存，怎么算见 算法/图论算法/。⚠️ 各系统物理布局以官方文档为准</text>

  <!-- 邻接表 -->
  <rect x="40" y="80" width="230" height="112" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="56" y="108" font-size="14.5" font-weight="bold" fill="#1d4ed8">邻接表</text>
  <text x="56" y="132" font-size="11.5" fill="#334155">空间 O(V+E)</text>
  <text x="56" y="152" font-size="11.5" fill="#334155">遍历邻居按「度」</text>
  <text x="56" y="172" font-size="11.5" fill="#334155">稀疏图的默认选择</text>
  <line x1="272" y1="136" x2="296" y2="136" stroke="#334155" stroke-width="1.6" marker-end="url(#arwG)"/>
  <rect x="300" y="86" width="660" height="100" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="315" y="94" width="200" height="84" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="327" y="118" font-size="12.5" font-weight="bold" fill="#1d4ed8">社交关注 / 好友图</text>
  <text x="327" y="138" font-size="11" fill="#334155">从「人」向外扩散查询</text>
  <text x="327" y="156" font-size="11" fill="#334155">关系极稀疏：E ≪ V²</text>
  <rect x="525" y="94" width="200" height="84" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="537" y="118" font-size="12.5" font-weight="bold" fill="#1d4ed8">知识图谱 / 关系检索</text>
  <text x="537" y="138" font-size="11" fill="#334155">多跳查询 = 反复展邻居</text>
  <text x="537" y="156" font-size="11" fill="#334155">图库布局以官方文档为准</text>
  <rect x="735" y="94" width="200" height="84" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="747" y="118" font-size="12.5" font-weight="bold" fill="#1d4ed8">依赖与调度 DAG</text>
  <text x="747" y="138" font-size="11" fill="#334155">拓扑排序：邻接表+入度</text>
  <text x="747" y="156" font-size="11" fill="#334155">增删边便宜</text>

  <!-- 邻接矩阵 -->
  <rect x="40" y="206" width="230" height="112" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text x="56" y="234" font-size="14.5" font-weight="bold" fill="#ea580c">邻接矩阵</text>
  <text x="56" y="258" font-size="11.5" fill="#334155">空间 O(V²)</text>
  <text x="56" y="278" font-size="11.5" fill="#334155">判相邻 O(1)、按行连扫</text>
  <text x="56" y="298" font-size="11.5" fill="#334155">只在「稠密 + V 小」时成立</text>
  <line x1="272" y1="262" x2="296" y2="262" stroke="#334155" stroke-width="1.6" marker-end="url(#arwG)"/>
  <rect x="300" y="212" width="660" height="100" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="315" y="220" width="200" height="84" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="327" y="244" font-size="12.5" font-weight="bold" fill="#ea580c">稠密小图全源最短路</text>
  <text x="327" y="264" font-size="11" fill="#334155">Floyd：三重循环扫行</text>
  <text x="327" y="282" font-size="11" fill="#334155">V 几百~千才现实</text>
  <rect x="525" y="220" width="200" height="84" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="537" y="244" font-size="12.5" font-weight="bold" fill="#ea580c">可达 / 传递性判定</text>
  <text x="537" y="264" font-size="11" fill="#334155">判相邻一步到位</text>
  <text x="537" y="282" font-size="11" fill="#334155">矩阵语义最直白</text>
  <rect x="735" y="220" width="200" height="84" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="747" y="244" font-size="12.5" font-weight="bold" fill="#dc2626">⚠️ 反面事故位</text>
  <text x="747" y="264" font-size="11" fill="#dc2626">V=10⁵ 硬上矩阵</text>
  <text x="747" y="282" font-size="11" fill="#dc2626">10¹⁰ 格 → 内存爆</text>

  <!-- 边列表 -->
  <rect x="40" y="332" width="230" height="112" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="56" y="360" font-size="14.5" font-weight="bold" fill="#16a34a">边列表</text>
  <text x="56" y="384" font-size="11.5" fill="#334155">空间 O(E)</text>
  <text x="56" y="404" font-size="11.5" fill="#334155">只存 (u,v,w) 三元组</text>
  <text x="56" y="424" font-size="11.5" fill="#334155">查邻居不行，扫全边最快</text>
  <line x1="272" y1="388" x2="296" y2="388" stroke="#334155" stroke-width="1.6" marker-end="url(#arwG)"/>
  <rect x="300" y="338" width="660" height="100" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="315" y="346" width="200" height="84" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="327" y="370" font-size="12.5" font-weight="bold" fill="#16a34a">Bellman-Ford</text>
  <text x="327" y="390" font-size="11" fill="#334155">V−1 轮全边松弛</text>
  <text x="327" y="408" font-size="11" fill="#334155">边列表是自然输入</text>
  <rect x="525" y="346" width="200" height="84" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="537" y="370" font-size="12.5" font-weight="bold" fill="#16a34a">Kruskal 最小生成树</text>
  <text x="537" y="390" font-size="11" fill="#334155">按边权排序后加边</text>
  <text x="537" y="408" font-size="11" fill="#334155">不需要查邻居</text>
  <rect x="735" y="346" width="200" height="84" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="747" y="370" font-size="12.5" font-weight="bold" fill="#16a34a">大规模图批处理</text>
  <text x="747" y="390" font-size="11" fill="#334155">边先分区、再建邻接视图</text>
  <text x="747" y="408" font-size="11" fill="#334155">形态以各引擎为准</text>

  <!-- 底部判据 -->
  <rect x="40" y="458" width="610" height="54" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="56" y="480" font-size="12" fill="#334155">共同前提：先固定表示，再谈算法 —— 表示同时决定空间、判相邻成本、</text>
  <text x="56" y="500" font-size="12" fill="#334155">能不能高效扫全部边（第三节实测：稠密图上 Floyd 反超 V 次 Dijkstra）。</text>
  <rect x="670" y="458" width="290" height="54" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="686" y="480" font-size="11.5" fill="#dc2626">失效边界：稀疏大图上矩阵不可行；</text>
  <text x="686" y="500" font-size="11.5" fill="#dc2626">稠密小图上链表指针跳常数吃亏</text>
</svg>
