    <line x1="75.55882360407443" y1="112.56674214175243" x2="170.55147049490697" y2="189.29157232280946" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <circle cx="60" cy="100" r="18" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="60" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#334155">1</text>
    <circle cx="190" cy="100" r="18" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="190" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#334155">2</text>
