    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">邻接矩阵：V² 个格子，判相邻 O(1)</text>
    <text x="16" y="54" font-size="12" fill="#64748b">行 = 起点，列 = 终点；有边填 1（带权就填权值）</text>
    <line x1="80" y1="100" x2="165" y2="100" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <line x1="190" y1="120" x2="190" y2="180" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <line x1="170" y1="205" x2="85" y2="205" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
