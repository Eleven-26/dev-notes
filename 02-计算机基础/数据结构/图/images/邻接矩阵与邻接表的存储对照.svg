  <rect x="0" y="0" width="1000" height="630" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一张图的三种存法：邻接矩阵 / 邻接表 / 边列表</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">表示同时决定空间、判相邻的成本、能不能高效扫全部边 —— 所以「选表示」就是「选算法的一半」</text>

