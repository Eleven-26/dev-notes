    <text x="190" y="205" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#334155">3</text>
    <circle cx="60" cy="205" r="18" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="60" y="205" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#334155">4</text>
    <text x="273" y="129" text-anchor="middle" font-size="12" fill="#64748b">1</text>
