    <text x="345" y="98" text-anchor="middle" font-size="12" fill="#64748b">2</text>
    <rect x="285" y="138" width="40" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="305" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#64748b">0</text>
