    <rect x="405" y="194" width="40" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="425" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#64748b">0</text>
    <text x="16" y="246" font-size="13" fill="#334155">空间 O(V²)；无向图矩阵对称（另一半是纯浪费）</text>
    <text x="16" y="268" font-size="13" fill="#334155">买到的能力：判「i 到 j 有没有边」O(1)、扫某点邻居是顺序扫一行</text>
    <text x="16" y="290" font-size="13" fill="#334155">⚠️ V = 10⁵ 时是 10¹⁰ 个格子 → 内存直接爆（最常见的表示事故）</text>
    <text x="16" y="312" font-size="13" fill="#b45309">实测那组稠密图：300 点 / 22819 条边 → 矩阵 9 万个格子；</text>
    <text x="16" y="332" font-size="12" fill="#b45309">　这个规模下 Floyd 反超「跑 V 次 Dijkstra」1.5~1.8 倍</text>
  </g>

    <g transform="translate(510,70)">
    <rect x="0" y="0" width="470" height="375" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">邻接表：只存存在的边，空间 O(V + E)</text>
    <text x="16" y="54" font-size="12" fill="#64748b">V 个头指针 + E 个边结点（无向图 2E 个）</text>
    <text x="16" y="104" font-size="12.5" font-weight="bold" fill="#334155">每个顶点一条链：</text>
    <text x="16" y="126" font-size="12.5" fill="#334155">　头结点 + 邻居结点</text>
    <text x="16" y="158" font-size="12.5" fill="#334155">只有存在的边被存下来</text>
    <text x="16" y="180" font-size="12.5" fill="#334155">→ 空间随 E 走，不随 V² 走</text>
    <rect x="210" y="92" width="34" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="227" y="106" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">1</text>
    <line x1="246" y1="106" x2="264" y2="106" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <rect x="266" y="92" width="50" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="291" y="106" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#14532d">2</text>
    <line x1="302" y1="106" x2="320" y2="106" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <rect x="322" y="92" width="50" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="347" y="106" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#14532d">3</text>
    <rect x="210" y="128" width="34" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="227" y="142" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">2</text>
    <line x1="246" y1="142" x2="264" y2="142" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <rect x="266" y="128" width="50" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="291" y="142" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#14532d">3</text>
    <rect x="210" y="164" width="34" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="227" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">3</text>
    <line x1="246" y1="178" x2="264" y2="178" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <rect x="266" y="164" width="50" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="291" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#14532d">4</text>
    <rect x="210" y="200" width="34" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="227" y="214" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">4</text>
    <line x1="246" y1="214" x2="264" y2="214" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <rect x="266" y="200" width="50" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="291" y="214" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#14532d">1</text>
    <text x="16" y="268" font-size="13" fill="#334155">买到的能力：空间随边数走、遍历某点邻居是 O(度)</text>
    <text x="16" y="290" font-size="13" fill="#334155">丢掉的能力：判相邻要扫一遍该点的表（没有矩阵的 O(1)）</text>
    <text x="16" y="312" font-size="13" fill="#334155">⚠️ 无向图每条边在两个顶点的表里各存一次 → 条目数是边数的两倍</text>
    <text x="16" y="332" font-size="12" fill="#334155">　（判环、算度数最容易在这里出错）</text>
    <text x="16" y="354" font-size="13" fill="#b45309">同一批实测：300 点 / 22819 条边 → 矩阵固定 9 万个格子，</text>
    <text x="16" y="368" font-size="12" fill="#b45309">　表只按这 22819 条边建结点（无向图各存两次）</text>
  </g>

    <g transform="translate(20,465)">
    <rect x="0" y="0" width="960" height="155" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">第三种：边列表 —— 只把每条边依次存进数组，空间 O(E)</text>
    <text x="16" y="62" font-size="13" fill="#334155">适合「反复扫全部边、不关心邻居」的算法：Bellman-Ford 的 V−1 轮全边松弛、Kruskal 的按边权排序。</text>
    <text x="16" y="86" font-size="13" fill="#334155">代价：查邻居要扫全部边 → 与邻接表是两种取向（一个面向「边」，一个面向「点」）。</text>
    <text x="16" y="118" font-size="13" font-weight="bold" fill="#b45309">⭐ 图的表示决定了算法的一半：同一算法在矩阵上是顺序扫行、在表上要跳指针，稠密 / 稀疏下常数差一个量级。</text>
    <text x="16" y="142" font-size="12" fill="#64748b">带权图的边还要多存一个权值；共用的 type Graph 声明在 算法/图论算法/图的遍历/DFS与BFS遍历.md 末节（单一来源）。</text>
  </g>

</svg>
