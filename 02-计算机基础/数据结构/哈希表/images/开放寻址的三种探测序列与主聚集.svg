<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwS" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#94a3b8"/></marker>
  </defs>

  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="40" y="34" font-size="19" font-weight="bold" fill="#0f172a">开放寻址：同一组冲突，三种探测序列</text>
  <text x="40" y="56" font-size="13" fill="#64748b">格内数字 = 桶下标；箭头 = 前一个位置被占后，下一个去查哪个桶</text>

  <!-- 线性探测 -->
  <text x="40" y="106" font-size="15" font-weight="bold" fill="#1d4ed8">线性探测</text>
  <text x="40" y="126" font-size="12.5" fill="#64748b">pos = h + i</text>
  <rect x="230" y="84" width="56" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="250" y="112" font-size="15" fill="#1d4ed8">3</text>
  <line x1="290" y1="106" x2="302" y2="106" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arwS)"/>
  <rect x="306" y="84" width="56" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="326" y="112" font-size="15" fill="#1d4ed8">4</text>
  <line x1="366" y1="106" x2="378" y2="106" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arwS)"/>
  <rect x="382" y="84" width="56" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="402" y="112" font-size="15" fill="#1d4ed8">5</text>
  <line x1="442" y1="106" x2="454" y2="106" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arwS)"/>
  <rect x="458" y="84" width="56" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="478" y="112" font-size="15" fill="#1d4ed8">6</text>
  <text x="536" y="112" font-size="12.5" fill="#334155">连成一整段 → 主聚集（越挤越挤）</text>

  <!-- 二次探测 -->
  <text x="40" y="176" font-size="15" font-weight="bold" fill="#ea580c">二次探测</text>
  <text x="40" y="196" font-size="12.5" fill="#64748b">pos = h + i(i+1)/2</text>
  <rect x="230" y="154" width="56" height="44" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="250" y="182" font-size="15" fill="#ea580c">3</text>
  <line x1="290" y1="176" x2="302" y2="176" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arwS)"/>
  <rect x="306" y="154" width="56" height="44" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="326" y="182" font-size="15" fill="#ea580c">4</text>
  <line x1="366" y1="176" x2="378" y2="176" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arwS)"/>
  <rect x="382" y="154" width="56" height="44" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="402" y="182" font-size="15" fill="#ea580c">6</text>
  <line x1="442" y1="176" x2="454" y2="176" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arwS)"/>
  <rect x="458" y="154" width="56" height="44" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="478" y="182" font-size="15" fill="#ea580c">9</text>
  <text x="536" y="182" font-size="12.5" fill="#334155">起点相同就走同一条路 → 次聚集</text>

  <!-- 双重散列 -->
  <text x="40" y="246" font-size="15" font-weight="bold" fill="#16a34a">双重散列</text>
  <text x="40" y="266" font-size="12.5" fill="#64748b">pos = h₁ + i·h₂</text>
  <rect x="230" y="224" width="56" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="250" y="252" font-size="15" fill="#16a34a">3</text>
  <line x1="290" y1="246" x2="340" y2="246" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arwS)"/>
  <rect x="346" y="224" width="56" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="366" y="252" font-size="15" fill="#16a34a">8</text>
  <line x1="406" y1="246" x2="456" y2="246" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arwS)"/>
  <rect x="462" y="224" width="56" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="482" y="252" font-size="15" fill="#16a34a">13</text>
  <text x="540" y="252" font-size="12.5" fill="#334155">步长由第二个哈希决定 → 不聚集</text>

  <!-- 实测 -->
  <rect x="40" y="296" width="920" height="152" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="322" font-size="15" font-weight="bold" fill="#0f172a">实测（容器 Go 1.26.8，桶数 4096，α = 0.90，只数「访问了几个槽 / 链表节点」）</text>
  <text x="60" y="350" font-size="13.5" fill="#334155">成功查找：链地址 1.43 ｜ 线性探测 5.20 ｜ 二次探测 2.84 ｜ 双重散列 2.59 ｜ 罗宾汉 5.20</text>
  <text x="60" y="374" font-size="13.5" fill="#dc2626">失败查找：链地址 0.90 ｜ 线性探测 39.91 ｜ 二次探测 11.54 ｜ 双重散列 9.95 ｜ 罗宾汉 5.58</text>
  <text x="60" y="400" font-size="13.5" fill="#334155">失败查找的「最大值」：线性探测 308 ｜ 双重散列 106 ｜ 罗宾汉 28（标准差 56.3 / 9.5 / 4.4）</text>
  <text x="60" y="426" font-size="13" fill="#64748b">⭐ 平均 39.9 而最坏 308 —— 主聚集不是「平均变慢」，是「长尾长到不可控」；罗宾汉把这条尾巴砍平。</text>
</svg>
