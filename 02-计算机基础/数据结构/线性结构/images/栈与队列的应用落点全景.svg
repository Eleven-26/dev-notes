<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="650" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">栈与队列的应用落点：一个管「返回顺序」，一个管「到达顺序」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">两者都不新增存储方式，只限制存取位置；落点全部落在「顺序」二字上</text>

  <g>
    <rect x="20" y="84" width="270" height="440" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="36" y="112" font-size="16" font-weight="bold" fill="#1e3a8a">运算受限的线性表</text>
    <line x1="60" y1="150" x2="60" y2="220" stroke="#2563eb" stroke-width="2"/>
    <line x1="130" y1="150" x2="130" y2="220" stroke="#2563eb" stroke-width="2"/>
    <line x1="60" y1="220" x2="130" y2="220" stroke="#2563eb" stroke-width="2"/>
    <rect x="68" y="192" width="54" height="22" rx="4" fill="#ffffff" stroke="#2563eb"/>
    <text x="95" y="203" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1e3a8a">栈顶</text>
    <text x="95" y="142" text-anchor="middle" font-size="11" fill="#1e3a8a">栈：一端进出 LIFO</text>
    <line x1="165" y1="170" x2="262" y2="170" stroke="#2563eb" stroke-width="2"/>
    <line x1="165" y1="196" x2="262" y2="196" stroke="#2563eb" stroke-width="2"/>
    <line x1="165" y1="170" x2="165" y2="196" stroke="#2563eb" stroke-width="2"/>
    <rect x="176" y="174" width="34" height="18" rx="3" fill="#ffffff" stroke="#2563eb"/>
    <rect x="214" y="174" width="34" height="18" rx="3" fill="#ffffff" stroke="#2563eb"/>
    <text x="160" y="160" font-size="11" fill="#1e3a8a">头(出)</text>
    <text x="266" y="160" font-size="11" fill="#1e3a8a">尾(入)</text>
    <text x="214" y="222" text-anchor="middle" font-size="11" fill="#1e3a8a">队列：两端各一口 FIFO</text>
    <text x="36" y="258" font-size="12" font-weight="bold" fill="#1e3a8a">换来什么</text>
    <text x="36" y="278" font-size="12" fill="#334155">· 增删都 O(1)：只动一端</text>
    <text x="36" y="296" font-size="12" fill="#334155">· 顺序保证：后到先办 / 先到先办</text>
    <text x="36" y="314" font-size="12" fill="#334155">· 撤销与回溯的能力（栈）</text>
    <text x="36" y="344" font-size="12" font-weight="bold" fill="#1e3a8a">放弃什么</text>
    <text x="36" y="364" font-size="12" fill="#334155">· 随机访问：中间元素不可达</text>
    <text x="36" y="382" font-size="12" fill="#334155">· 队列上磁盘后目标改为</text>
    <text x="36" y="400" font-size="12" fill="#334155">　「顺序追加写 + 批量读」</text>
    <text x="36" y="430" font-size="12" fill="#1e3a8a">底层仍是线性表：数组（顺序）</text>
    <text x="36" y="448" font-size="12" fill="#1e3a8a">或链表（链式），见数组与链表篇</text>
  </g>

  <line x1="292" y1="240" x2="434" y2="126" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="292" y1="270" x2="434" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="292" y1="300" x2="434" y2="314" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="292" y1="330" x2="434" y2="408" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="292" y1="360" x2="434" y2="502" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

  <g>
    <rect x="440" y="84" width="540" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="456" y="110" font-size="14" font-weight="bold" fill="#14532d">函数调用与递归：OS 线程栈 / goroutine 栈</text>
    <text x="456" y="132" font-size="12" fill="#334155">返回地址与栈帧压栈、函数返回时弹栈恢复现场；</text>
    <text x="456" y="150" font-size="12" fill="#334155">LIFO 恰好对应「最深的调用最先返回」—— 栈的头号用户</text>
  </g>
  <g>
    <rect x="440" y="178" width="540" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="456" y="204" font-size="14" font-weight="bold" fill="#14532d">表达式求值 / 括号匹配 / 撤销回退</text>
    <text x="456" y="226" font-size="12" fill="#334155">编译器中缀转后缀、解释器配对括号；编辑器 Undo、浏览器后退：</text>
    <text x="456" y="244" font-size="12" fill="#334155">操作历史入栈、按逆序弹出 —— 「最后打开的最先关闭」的嵌套规则</text>
  </g>
  <g>
    <rect x="440" y="272" width="540" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="456" y="298" font-size="14" font-weight="bold" fill="#14532d">任务队列与削峰：线程池 / 消息队列</text>
    <text x="456" y="320" font-size="12" fill="#334155">Java 线程池 workQueue、Kafka 分区日志：生产端入队、消费端出队；</text>
    <text x="456" y="338" font-size="12" fill="#334155">FIFO 保到达顺序 —— 容量必须有界 + 拒绝/降级，无界会把 OOM 延后</text>
  </g>
  <g>
    <rect x="440" y="366" width="540" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="456" y="392" font-size="14" font-weight="bold" fill="#14532d">层序遍历与轻量队列：BFS / Redis List</text>
    <text x="456" y="414" font-size="12" fill="#334155">BFS 逐层出队保证「先发现先扩展」；Redis List 用 LPUSH+BRPOP</text>
    <text x="456" y="432" font-size="12" fill="#334155">做轻量队列与最新 N 条 —— 无 ACK/消费组，投递保证要换 Stream 或 MQ</text>
  </g>
  <g>
    <rect x="440" y="460" width="540" height="84" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="456" y="486" font-size="14" font-weight="bold" fill="#9a3412">变体：各牺牲一点 FIFO 换别的能力</text>
    <text x="456" y="508" font-size="12" fill="#334155">循环队列 / 双端队列（环形数组，两端 O(1)）；优先队列（底层是堆，</text>
    <text x="456" y="526" font-size="12" fill="#334155">出队按优先级不按到达序）；解题升级：单调栈与单调队列</text>
  </g>

  <g>
    <rect x="20" y="566" width="960" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="36" y="590" font-size="12" font-weight="bold" fill="#7f1d1d">共同前提：只消费「顺序」这一项能力，不需要随机访问与中间删除。</text>
    <text x="36" y="612" font-size="12" fill="#7f1d1d">失效边界：要按 key 随机删改 → 换散列表/树；要当前极值 → 换堆；栈深无界（递归不收敛）→ 改显式栈或直接爆栈。</text>
  </g>
</svg>
