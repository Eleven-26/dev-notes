<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="1000" height="630" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="630" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">栈与队列：开口位置决定顺序，顺序决定用途</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">栈 = 一端（后进先出）；队列 = 两端（先进先出）；变体各自牺牲一点性质换别的能力</text>

    <g transform="translate(20,70)">
    <rect x="0" y="0" width="300" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">栈：只在一端存取（LIFO）</text>
    <text x="16" y="54" font-size="12" fill="#64748b">push 与 pop 共用同一个口</text>
    <line x1="90" y1="100" x2="90" y2="250" stroke="#64748b" stroke-width="2"/>
    <line x1="210" y1="100" x2="210" y2="250" stroke="#64748b" stroke-width="2"/>
    <line x1="90" y1="250" x2="210" y2="250" stroke="#64748b" stroke-width="2"/>
    <rect x="100" y="218" width="100" height="26" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="150" y="231" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">1</text>
    <rect x="100" y="188" width="100" height="26" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="150" y="201" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">2</text>
    <rect x="100" y="158" width="100" height="26" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="150" y="171" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">3</text>
    <rect x="100" y="128" width="100" height="26" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="150" y="141" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#7f1d1d">4</text>
    <line x1="125" y1="80" x2="125" y2="108" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <line x1="185" y1="108" x2="185" y2="80" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <text x="125" y="72" text-anchor="middle" font-size="11.5" fill="#b45309">入栈</text>
    <text x="185" y="72" text-anchor="middle" font-size="11.5" fill="#b45309">出栈</text>
    <text x="16" y="280" font-size="12" fill="#334155">链栈 = 运算受限的单链表：插删都在表头，</text>
    <text x="16" y="300" font-size="12" fill="#334155">　所以栈顶指针 top 就是头指针、不必附加头结点。</text>
  </g>

    <g transform="translate(350,70)">
    <rect x="0" y="0" width="300" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">队列：表尾插、表头删（FIFO）</text>
    <text x="16" y="54" font-size="12" fill="#64748b">两个口各管一头，出队顺序 = 到达顺序</text>
    <line x1="40" y1="150" x2="260" y2="150" stroke="#64748b" stroke-width="2"/>
    <line x1="40" y1="196" x2="260" y2="196" stroke="#64748b" stroke-width="2"/>
    <rect x="45" y="154" width="50" height="38" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="70" y="173" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#7f1d1d">1</text>
    <rect x="99" y="154" width="50" height="38" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="124" y="173" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">2</text>
    <rect x="153" y="154" width="50" height="38" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="178" y="173" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">3</text>
    <rect x="207" y="154" width="50" height="38" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="232" y="173" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">4</text>
    <line x1="290" y1="173" x2="262" y2="173" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <line x1="40" y1="173" x2="12" y2="173" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <text x="250" y="138" text-anchor="middle" font-size="11.5" fill="#b45309">入队（表尾）</text>
    <text x="50" y="138" text-anchor="middle" font-size="11.5" fill="#b45309">出队（表头）</text>
    <text x="16" y="240" font-size="13" fill="#334155">链队列 = 限制在「表头删、表尾插」的单链表：</text>
    <text x="16" y="262" font-size="13" fill="#334155">　需要两类结点 —— 数据元素结点，以及存放</text>
    <text x="16" y="284" font-size="13" fill="#334155">　队首指针与队尾指针的结点。</text>
    <text x="16" y="306" font-size="12" fill="#b45309">价值在「先后顺序」：有顺序要求的业务都能用</text>
  </g>

    <g transform="translate(680,70)">
    <rect x="0" y="0" width="300" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">变体与「受限」换来什么</text>
    <text x="16" y="54" font-size="12" fill="#64748b">两个都不新增存储方式：只限制存取位置</text>
    <text x="16" y="84" font-size="13" font-weight="bold" fill="#334155">共同点</text>
    <text x="16" y="104" font-size="12" fill="#334155">增删 O(1)，代价是放弃了随机访问。</text>
    <text x="16" y="134" font-size="13" font-weight="bold" fill="#334155">优先队列（底层常是堆）</text>
    <text x="16" y="154" font-size="12" fill="#334155">形式上仍是一端进一端出，但出队顺序由优先级</text>
    <text x="16" y="172" font-size="12" fill="#334155">　决定而不是到达顺序 —— 语义上已不是队列，</text>
    <text x="16" y="190" font-size="12" fill="#334155">　而是按优先级组织的集合。</text>
    <text x="16" y="220" font-size="13" font-weight="bold" fill="#334155">另外两个变体</text>
    <text x="16" y="240" font-size="12" fill="#334155">双端队列、循环队列（本篇只列出，实现细节</text>
    <text x="16" y="258" font-size="12" fill="#334155">　在各自篇目）；栈/队列的解题升级版见</text>
    <text x="16" y="276" font-size="12" fill="#334155">　高级数据结构/单调栈与单调队列.md</text>
    <text x="16" y="300" font-size="11.5" fill="#64748b">栈的应用：递归、表达式求值、括号匹配、Undo</text>
  </g>

    <g transform="translate(20,410)">
    <rect x="0" y="0" width="960" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">搬到磁盘上，目标就从「低延迟」变成「顺序追加写 + 批量读」</text>
    <text x="16" y="64" font-size="13" fill="#334155">① 队列落盘：FIFO 恰好让写入永远是追加，把随机写变成顺序写（消息队列的分区 / 日志段就是这么组织的）。</text>
    <text x="16" y="90" font-size="13" fill="#334155">② 长度必须有上界：无界队列等于把 OOM 包装成「暂时没事」，只会把故障延后放大 —— 有界 + 拒绝 / 降级才是解。</text>
    <text x="16" y="116" font-size="13" fill="#334155">③ 优先队列（堆）是另一条取向：出队顺序由优先级决定，不是到达顺序（堆的实现见 堆与优先队列.md）。</text>
    <text x="16" y="152" font-size="13" font-weight="bold" fill="#b45309">一句话判据：谁决定顺序 —— 后进先出用栈、先进先出用队列、要当前极值用堆、要按前缀匹配用 Trie。</text>
    <text x="16" y="176" font-size="12" fill="#64748b">两者都是「运算受限的线性表」：能力比数组 / 链表少，正因为受限，才换来顺序保证与 O(1) 进出。</text>
  </g>

</svg>
