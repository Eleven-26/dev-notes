<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">循环队列与双端队列：环形数组把「搬移」换成一次取模</text>
  <text x="500" y="60" text-anchor="middle" font-size="14" fill="#64748b">左＝循环队列的 head / tail 与三种判空判满；右＝双端队列两端都是 O(1)</text>

  <defs>
    <marker id="dqHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="dqTail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="dqIn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- ============ 左：循环队列 ============ -->
  <rect x="30" y="86" width="460" height="392" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="260" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">① 循环队列：8 槽，装着 4 个元素（槽 2~5）</text>

  <circle cx="260" cy="278" r="118" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <g font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="233" y="148" width="54" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="260" y="168" fill="#1e3a8a">槽 0</text>

    <rect x="308" y="180" width="54" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="335" y="200" fill="#1e3a8a">槽 1</text>

    <rect x="340" y="263" width="54" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="367" y="283" fill="#166534">槽 2</text>

    <rect x="308" y="346" width="54" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="335" y="366" fill="#166534">槽 3</text>

    <rect x="233" y="378" width="54" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="260" y="398" fill="#166534">槽 4</text>

    <rect x="158" y="346" width="54" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="185" y="366" fill="#166534">槽 5</text>

    <rect x="126" y="263" width="54" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="153" y="283" fill="#1e3a8a">槽 6</text>

    <rect x="158" y="180" width="54" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="185" y="200" fill="#1e3a8a">槽 7</text>
  </g>

  <line x1="367" y1="263" x2="367" y2="240" stroke="#dc2626" stroke-width="2.5" marker-end="url(#dqHead)"/>
  <text x="367" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">head</text>
  <text x="367" y="222" text-anchor="middle" font-size="11" fill="#64748b">出队处</text>

  <line x1="153" y1="293" x2="153" y2="318" stroke="#ea580c" stroke-width="2.5" marker-end="url(#dqTail)"/>
  <text x="153" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">tail</text>
  <text x="153" y="352" text-anchor="middle" font-size="11" fill="#64748b">入队处</text>

  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#94a3b8">元素数</text>
  <text x="260" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">(tail−head+8)%8 = 4</text>

  <g font-size="12.5" fill="#334155">
    <text x="52" y="438">入队：buf[tail] = v；tail = (tail+1) % 槽数　→ <tspan font-weight="bold" fill="#2563eb">O(1)、不搬移</tspan></text>
    <text x="52" y="458">出队：v = buf[head]；head = (head+1) % 槽数　→ <tspan font-weight="bold" fill="#2563eb">O(1)、不搬移</tspan></text>
  </g>

  <!-- ============ 右：判空判满 + Deque ============ -->
  <rect x="530" y="86" width="440" height="392" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="750" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">② 判空判满三写法 &amp; 双端队列</text>

  <g font-size="12.5" fill="#334155">
    <rect x="552" y="128" width="396" height="30" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="566" y="148">留一个空位：head==tail 判空；满 = (tail+1)%槽数==head　→ 可用 <tspan font-weight="bold">槽数−1</tspan></text>

    <rect x="552" y="164" width="396" height="30" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="566" y="184">显式计数：size==槽数 判满　→ 可用 <tspan font-weight="bold">槽数</tspan>（不浪费）</text>

    <rect x="552" y="200" width="396" height="30" rx="6" fill="#fee2e2" stroke="#fecaca"/>
    <text x="566" y="220">只判 head==tail、不记数不留空位　→ <tspan font-weight="bold" fill="#dc2626">静默覆盖最老的元素</tspan></text>
  </g>

  <text x="750" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">双端队列（Deque）：两端都是 O(1)</text>

  <g>
    <rect x="596" y="272" width="310" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <g font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">
      <text x="640" y="299">槽 5</text>
      <text x="700" y="299">槽 6</text>
      <text x="760" y="299">槽 7</text>
      <text x="820" y="299">槽 0</text>
      <text x="875" y="299">槽 1</text>
    </g>
  </g>
  <text x="751" y="333" text-anchor="middle" font-size="11.5" fill="#64748b">逻辑顺序：左端 …… 右端（首尾各留出空位，两端都能插）</text>

  <line x1="576" y1="294" x2="592" y2="294" stroke="#2563eb" stroke-width="2.5" marker-end="url(#dqIn)"/>
  <text x="560" y="284" font-size="11.5" fill="#1e3a8a" text-anchor="middle">左插</text>
  <line x1="926" y1="294" x2="910" y2="294" stroke="#2563eb" stroke-width="2.5" marker-end="url(#dqIn)"/>
  <text x="940" y="284" font-size="11.5" fill="#1e3a8a" text-anchor="middle">右插</text>

  <rect x="552" y="350" width="396" height="112" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="566" y="372" font-size="12.5" font-weight="bold" fill="#1e3a8a">左插为什么是 O(1)</text>
  <text x="566" y="392" font-size="12.5" fill="#334155">head 往后退一格：head = (head−1+槽数) % 槽数</text>
  <text x="566" y="412" font-size="12.5" fill="#334155">退到 0 再退，就回绕到最后一个槽 —— 环形的意义。</text>
  <text x="566" y="434" font-size="12.5" fill="#334155">⚠️ 数组实现则要整体右移：实测 10000 次左插搬移</text>
  <text x="566" y="452" font-size="12.5" font-weight="bold" fill="#dc2626">49995000 次，环形版 0 次。</text>

  <!-- 底部实测 -->
  <rect x="30" y="490" width="940" height="58" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="46" y="512" font-size="13" fill="#334155">实测（容器 Go 1.26.8）：入队 10000 再全部出队 —— 朴素数组队列搬移 <tspan font-weight="bold" fill="#dc2626">49995000</tspan> 次（n(n−1)/2），环形队列 <tspan font-weight="bold" fill="#16a34a">0</tspan> 次；</text>
  <text x="46" y="534" font-size="13" fill="#334155">8 槽时「留空位法」只能装 7 个（亏 12.5%），「只判 head==tail」则静默丢掉 1 个</text>
</svg>
