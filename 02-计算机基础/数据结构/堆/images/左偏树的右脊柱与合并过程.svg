<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>

  <text x="40" y="42" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#0f172a">左偏树：merge 只沿「右脊柱」递归，右脊柱长度 ≤ log n</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">不变量：dist(左) ≥ dist(右)；dist(x) = dist(x.右) + 1 —— 节点旁小字标 dist</text>

  <!-- 树 A -->
  <rect x="40" y="86" width="290" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="58" y="112" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">堆 A（根 = 3）</text>

  <line x1="185" y1="160" x2="130" y2="235" stroke="#94a3b8" stroke-width="2"/>
  <line x1="185" y1="160" x2="240" y2="235" stroke="#ea580c" stroke-width="3"/>
  <line x1="130" y1="235" x2="100" y2="320" stroke="#94a3b8" stroke-width="2"/>
  <line x1="130" y1="235" x2="160" y2="320" stroke="#94a3b8" stroke-width="2"/>
  <line x1="240" y1="235" x2="240" y2="320" stroke="#ea580c" stroke-width="3"/>

  <circle cx="185" cy="160" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">3</text>
  <circle cx="130" cy="235" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">7</text>
  <circle cx="240" cy="235" r="20" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="240" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#9a3412">12</text>
  <circle cx="100" cy="320" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="100" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">20</text>
  <circle cx="160" cy="320" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">25</text>
  <circle cx="240" cy="320" r="18" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="240" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#9a3412">30</text>

  <text x="212" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">d2</text>
  <text x="158" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">d2</text>
  <text x="268" y="230" font-family="system-ui, sans-serif" font-size="11" fill="#ea580c">d1</text>
  <text x="266" y="318" font-family="system-ui, sans-serif" font-size="11" fill="#ea580c">d1</text>

  <text x="58" y="368" font-family="system-ui, sans-serif" font-size="12.5" fill="#ea580c">橙色 = 右脊柱：3 → 12 → 30</text>

  <!-- 树 B -->
  <rect x="348" y="86" width="230" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="366" y="112" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">堆 B（根 = 8）</text>

  <line x1="463" y1="190" x2="463" y2="270" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="463" cy="175" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="463" y="181" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">8</text>
  <circle cx="463" cy="290" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="463" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">15</text>
  <text x="490" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">d1</text>

  <text x="366" y="368" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">merge(A, B)：3 &lt; 8 → 3 当根</text>

  <!-- 结果 -->
  <rect x="596" y="86" width="364" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="614" y="112" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">合并结果（新根 = 3，右脊柱接上了 B）</text>

  <line x1="780" y1="160" x2="720" y2="235" stroke="#94a3b8" stroke-width="2"/>
  <line x1="780" y1="160" x2="858" y2="235" stroke="#ea580c" stroke-width="3"/>
  <line x1="858" y1="235" x2="830" y2="305" stroke="#94a3b8" stroke-width="2"/>
  <line x1="858" y1="235" x2="906" y2="305" stroke="#ea580c" stroke-width="3"/>
  <line x1="906" y1="305" x2="906" y2="372" stroke="#ea580c" stroke-width="3"/>

  <circle cx="780" cy="160" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="780" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">3</text>
  <circle cx="720" cy="235" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="720" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">7…</text>
  <circle cx="858" cy="235" r="20" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="858" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#9a3412">8</text>
  <circle cx="830" cy="305" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="830" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534">15…</text>
  <circle cx="906" cy="305" r="18" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="906" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#9a3412">12</text>
  <circle cx="906" cy="372" r="18" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="906" y="377" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#9a3412">30</text>

  <text x="806" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">d3</text>
  <text x="886" y="230" font-family="system-ui, sans-serif" font-size="11" fill="#ea580c">d2</text>
  <text x="614" y="368" font-family="system-ui, sans-serif" font-size="12.5" fill="#ea580c">右脊柱变长：3 → 8 → 12 → 30</text>

  <!-- 结论带 -->
  <rect x="40" y="406" width="920" height="98" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="436" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">合并 = 「比较两根 → 沿右子递归 → 回来按需交换左右子」，复杂度就是右脊柱长度 O(log n)</text>
  <text x="60" y="464" font-family="system-ui, sans-serif" font-size="14" fill="#334155">实测：两堆各 500000 个元素，一次 merge 只花 44 次比较；同样场景二叉堆重建要 1880788 次（≈ 2n）。</text>
  <text x="60" y="488" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">同一逻辑把第 ④ 步「按需交换」改成「无条件交换」就是斜堆 —— 省掉 dist 字段，但只剩摊还界。</text>
</svg>
