<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">堆的树形与数组表示对照（小顶堆，push 序列 5 3 8 1 9 2 7）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">完全二叉树按「一层一层、从左到右」编号后，父子位置可由下标直接算出，不需要任何指针</text>

  <line x1="500" y1="130" x2="310" y2="182" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="500" y1="130" x2="690" y2="182" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="310" y1="218" x2="200" y2="272" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="310" y1="218" x2="420" y2="272" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="690" y1="218" x2="580" y2="272" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="690" y1="218" x2="760" y2="272" stroke="#94a3b8" stroke-width="1.5"/>

  <circle cx="500" cy="110" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#7f1d1d">1</text>
  <circle cx="310" cy="200" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="310" y="200" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">3</text>
  <circle cx="690" cy="200" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="690" y="200" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">2</text>

  <circle cx="200" cy="290" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="200" y="290" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">5</text>
  <circle cx="420" cy="290" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="420" y="290" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">9</text>
  <circle cx="580" cy="290" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="580" y="290" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">8</text>
  <circle cx="760" cy="290" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="760" y="290" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">7</text>

  <text x="500" y="332" text-anchor="middle" font-size="12" fill="#94a3b8">中序遍历 [5 3 9 1 8 2 7]；但堆只保证偏序（父不劣于孩子），不保证有序</text>

  <text x="40" y="378" font-size="14" font-weight="bold" fill="#0f172a">数组表示（0-indexed）</text>

  <g font-family="Consolas, Courier New, monospace" font-size="12" fill="#94a3b8">
    <text x="184" y="420" text-anchor="middle">0</text>
    <text x="276" y="420" text-anchor="middle">1</text>
    <text x="368" y="420" text-anchor="middle">2</text>
    <text x="460" y="420" text-anchor="middle">3</text>
    <text x="552" y="420" text-anchor="middle">4</text>
    <text x="644" y="420" text-anchor="middle">5</text>
    <text x="736" y="420" text-anchor="middle">6</text>
  </g>

  <g fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5">
    <rect x="140" y="430" width="88" height="48"/>
    <rect x="232" y="430" width="88" height="48"/>
    <rect x="324" y="430" width="88" height="48"/>
    <rect x="416" y="430" width="88" height="48"/>
    <rect x="508" y="430" width="88" height="48"/>
    <rect x="600" y="430" width="88" height="48"/>
    <rect x="692" y="430" width="88" height="48"/>
  </g>

  <g font-family="Consolas, Courier New, monospace" font-size="18" font-weight="bold" fill="#2563eb" text-anchor="middle">
    <text x="184" y="462">1</text>
    <text x="276" y="462">3</text>
    <text x="368" y="462">2</text>
    <text x="460" y="462">5</text>
    <text x="552" y="462">9</text>
    <text x="644" y="462">8</text>
    <text x="736" y="462">7</text>
  </g>

  <line x1="40" y1="510" x2="960" y2="510" stroke="#cbd5e1" stroke-width="1"/>

  <text x="40" y="544" font-size="14" fill="#334155">0-indexed 公式：父 = (i-1)/2　左孩子 = 2i+1　右孩子 = 2i+2</text>
  <text x="40" y="572" font-size="14" fill="#334155">1-indexed 公式：父 = i/2　　左孩子 = 2i　　右孩子 = 2i+1　（下标 0 当哨兵，两式可用移位写成 i&gt;&gt;1 与 i&lt;&lt;1）</text>
  <text x="40" y="600" font-size="13" fill="#b45309">注意：0-indexed 下 i=0 时 (0-1)/2 向零截断等于 0，故 siftUp 的循环必须是 for i &gt; 0，不能靠「父为空」判终止。</text>
  <text x="40" y="628" font-size="12" fill="#94a3b8">（图：本机无法栅格化 SVG，需要 PNG 请自行导出，建议浅色底）</text>
</svg>
