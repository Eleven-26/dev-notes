<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="860" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">布隆过滤器：位数组 + k 个哈希，换来「不存在一定可信」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">没有假阴性、只有假阳性；误判率随元素加入单调上升，参数由可接受误判率 p 与预估元素数 n 反推</text>

    <g transform="translate(20,70)">
    <rect x="0" y="0" width="600" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">k 个哈希把每个元素投到 k 个位上</text>
    <text x="16" y="54" font-size="12" fill="#64748b">布隆过滤器 = 位图 + 多个哈希；不存元素本身，只存「这些位是 1」</text>
    <rect x="40" y="190" width="32" height="30" rx="4" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="56" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#f8fafc">1</text>
    <rect x="72" y="190" width="32" height="30" rx="4" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="88" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#f8fafc">1</text>
    <rect x="104" y="190" width="32" height="30" rx="4" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="120" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#f8fafc">1</text>
    <rect x="136" y="190" width="32" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="152" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#64748b">0</text>
    <rect x="168" y="190" width="32" height="30" rx="4" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="184" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#f8fafc">1</text>
    <rect x="200" y="190" width="32" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="216" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#64748b">0</text>
    <rect x="232" y="190" width="32" height="30" rx="4" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="248" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#f8fafc">1</text>
    <rect x="264" y="190" width="32" height="30" rx="4" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="280" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#f8fafc">1</text>
    <rect x="296" y="190" width="32" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="312" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#64748b">0</text>
    <rect x="328" y="190" width="32" height="30" rx="4" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="344" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#f8fafc">1</text>
    <rect x="360" y="190" width="32" height="30" rx="4" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="376" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#f8fafc">1</text>
    <rect x="392" y="190" width="32" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="408" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#64748b">0</text>
    <rect x="424" y="190" width="32" height="30" rx="4" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="440" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#f8fafc">1</text>
    <rect x="456" y="190" width="32" height="30" rx="4" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="472" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#f8fafc">1</text>
    <rect x="488" y="190" width="32" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="504" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#64748b">0</text>
    <rect x="520" y="190" width="32" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="536" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#64748b">0</text>
    <text x="16" y="240" font-size="11.5" fill="#64748b">位数组（下标 0 ~ 15）</text>
    <rect x="68" y="88" width="44" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="90" y="102" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1e40af">x</text>
    <line x1="90" y1="118" x2="120" y2="188" stroke="#b45309" stroke-width="1.5" marker-end="url(#arw)"/>
    <line x1="90" y1="118" x2="280" y2="188" stroke="#b45309" stroke-width="1.5" marker-end="url(#arw)"/>
    <line x1="90" y1="118" x2="408" y2="188" stroke="#b45309" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="248" y="88" width="44" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="270" y="102" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1e40af">y</text>
    <line x1="270" y1="118" x2="184" y2="188" stroke="#b45309" stroke-width="1.5" marker-end="url(#arw)"/>
    <line x1="270" y1="118" x2="280" y2="188" stroke="#b45309" stroke-width="1.5" marker-end="url(#arw)"/>
    <line x1="270" y1="118" x2="472" y2="188" stroke="#b45309" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="428" y="88" width="44" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="450" y="102" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1e40af">z</text>
    <line x1="450" y1="118" x2="88" y2="188" stroke="#b45309" stroke-width="1.5" marker-end="url(#arw)"/>
    <line x1="450" y1="118" x2="344" y2="188" stroke="#b45309" stroke-width="1.5" marker-end="url(#arw)"/>
    <line x1="450" y1="118" x2="408" y2="188" stroke="#b45309" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="150" y="268" width="60" height="26" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="180" y="281" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#92400e">查询 w</text>
    <line x1="180" y1="268" x2="152" y2="222" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arw)"/>
    <line x1="180" y1="268" x2="344" y2="222" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arw)"/>
    <line x1="180" y1="268" x2="408" y2="222" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arw)"/>
    <text x="224" y="286" font-size="12" fill="#334155">w 落在 3(0)、9(1)、11(0)</text>
    <text x="16" y="312" font-size="12" fill="#334155">只要有一位是 0 → w 一定不在集合里（集合其实只有 x、y、z）：不存在 = 可信结论。</text>
  </g>

    <g transform="translate(640,70)">
    <rect x="0" y="0" width="340" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">误差只有一个方向：假阳性</text>
    <text x="16" y="82" font-size="13.5" font-weight="bold" fill="#14532d">判「不存在」→ 一定不存在</text>
    <text x="16" y="102" font-size="13" fill="#334155">　只要有一位是 0，这些位就不可能</text>
    <text x="16" y="120" font-size="13" fill="#334155">　全被该元素的哈希置过 1 → 结论可信</text>
    <text x="16" y="152" font-size="13.5" font-weight="bold" fill="#7f1d1d">判「存在」→ 可能不存在</text>
    <text x="16" y="172" font-size="13" fill="#334155">　k 个位全是 1，但每一位都可能是</text>
    <text x="16" y="190" font-size="13" fill="#334155">　别的元素置的 → 必须回源确认</text>
    <rect x="16" y="210" width="308" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="28" y="230" font-size="12" fill="#7f1d1d">⚠️ 不支持删除：一个位可能被多个元素</text>
    <text x="28" y="248" font-size="12" fill="#7f1d1d">　共享，清 0 会连带删掉别人的证据</text>
    <text x="16" y="286" font-size="12" fill="#334155">要删除 → 计数布隆过滤器：每位换成计数器，</text>
    <text x="16" y="304" font-size="12" fill="#334155">　加 1 减 1；代价是内存放大数倍。</text>
  </g>

    <g transform="translate(20,410)">
    <rect x="0" y="0" width="470" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">实测：误判率只由 m、n、k 决定</text>
    <text x="16" y="54" font-size="12" fill="#64748b">m = 10⁶ 位、k = 3、插入 10⁴ 个（Go 与 Java 两侧同参数）</text>
    <text x="16" y="82" font-size="13" fill="#334155">实测误判 8 / 100000 = 0.00800%</text>
    <text x="16" y="104" font-size="13" fill="#334155">理论误判 0.00258%　公式 (1−e^(−kn/m))^k</text>
    <text x="16" y="126" font-size="12" fill="#64748b">→ 同量级即说明实现正确；差异来自哈希分布</text>
    <text x="16" y="156" font-size="13" fill="#334155">无假阴性核对：已插入 10000 / 10000 全部命中，</text>
    <text x="16" y="178" font-size="13" fill="#334155">　1000 个未插入元素全部正确判「不存在」</text>
    <text x="16" y="208" font-size="12" fill="#b45309">Java 侧同参数实测 0.006% —— 与语言无关</text>
    <text x="16" y="236" font-size="12" fill="#334155">m = 位数组长度、n = 元素数、k = 哈希个数</text>
  </g>

    <g transform="translate(510,410)">
    <rect x="0" y="0" width="470" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">k 不是越大越好（m = 10⁶、插入 5 万，理论误判率）</text>
    <text x="20" y="74" font-size="12.5" font-weight="bold" fill="#334155">k = 1</text>
    <rect x="90" y="62" width="290" height="15" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="386" y="74" font-size="12" fill="#334155">4.8771%</text>
    <text x="20" y="104" font-size="12.5" font-weight="bold" fill="#334155">k = 3</text>
    <rect x="90" y="92" width="16.218" height="15" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="112.218" y="104" font-size="12" fill="#334155">0.2703%</text>
    <text x="20" y="134" font-size="12.5" font-weight="bold" fill="#334155">k = 5</text>
    <rect x="90" y="122" width="6" height="15" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="102" y="134" font-size="12" fill="#334155">0.0530%</text>
    <text x="20" y="164" font-size="12.5" font-weight="bold" fill="#334155">k = 10</text>
    <rect x="90" y="152" width="6" height="15" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="102" y="164" font-size="12" fill="#334155">0.0089%</text>
    <text x="20" y="194" font-size="12.5" font-weight="bold" fill="#334155">k = 15</text>
    <rect x="90" y="182" width="6" height="15" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="102" y="194" font-size="12" fill="#334155">0.0068%</text>
    <text x="16" y="236" font-size="12" fill="#334155">k 从 1→5 误判率从 4.88% 降到 0.053%，加到 15 只到 0.0068%：</text>
    <text x="16" y="254" font-size="12" fill="#b45309">位数组填满后收益递减，且每次查询要多算哈希。最优 k ≈ (m/n)·ln2</text>
  </g>

    <g transform="translate(20,690)">
    <rect x="0" y="0" width="960" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">底座是位图：省下来的内存是结构性的</text>
    <text x="16" y="52" font-size="13" fill="#334155">存 100 万个整数：Go 位图 0.12 MB vs map[int]bool 36.08 MB（差 303 倍）；Java BitSet 0.83 MB vs HashSet 53.66 MB（差 64 倍）。</text>
    <text x="16" y="78" font-size="13" fill="#334155">按位算，1 亿个数只要 12.5 MB。三个经典场景：爬虫 URL 去重、反垃圾邮件名单、⭐ 缓存穿透（请求先过过滤器，判不存在直接返回）。</text>
    <text x="16" y="112" font-size="13" fill="#b45309">⚠️ 位图三条边界：只能映射到整数下标／取值范围决定内存（19 位雪花 ID 直接建会爆，要减基线偏移）／稀疏时浪费严重 → RoaringBitmap。</text>
  </g>

</svg>
