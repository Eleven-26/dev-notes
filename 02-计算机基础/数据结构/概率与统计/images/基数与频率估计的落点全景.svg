<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="730" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">基数与频率 Sketch 的落点全景</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">一条规律定落点：误差的下游只产生「成本」、不产生「事故」的地方，才是概率结构的位置</text>

  <defs>
    <marker id="hllArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- 左：三种结构 -->
  <rect x="30" y="100" width="260" height="110" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="160" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">布隆过滤器</text>
  <text x="160" y="150" text-anchor="middle" font-size="12" fill="#334155">问：在不在 · 只假阳性</text>
  <text x="160" y="172" text-anchor="middle" font-size="12" fill="#334155">作漏斗入口，落点详见</text>
  <text x="160" y="192" text-anchor="middle" font-size="12" fill="#334155">位图与布隆过滤器篇</text>

  <rect x="30" y="240" width="260" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">HyperLogLog</text>
  <text x="160" y="290" text-anchor="middle" font-size="12" fill="#334155">问：有多少个不同元素</text>
  <text x="160" y="312" text-anchor="middle" font-size="12" fill="#334155">误差：±1.04/√m 随机</text>

  <rect x="30" y="366" width="260" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Count-Min Sketch</text>
  <text x="160" y="416" text-anchor="middle" font-size="12" fill="#334155">问：出现了多少次</text>
  <text x="160" y="438" text-anchor="middle" font-size="12" fill="#334155">误差：只高不低</text>

  <!-- 右：落点 -->
  <rect x="560" y="100" width="410" height="84" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="576" y="124" font-size="14" font-weight="bold" fill="#1e3a8a">Redis PFADD / PFCOUNT / PFMERGE —— UV 统计</text>
  <text x="576" y="147" font-size="11.5" fill="#334155">每 key 约 12 KB 固定内存 · 分片统计再合并</text>
  <text x="576" y="166" font-size="11.5" fill="#334155">⚠️ 只能并集、不能交集</text>

  <rect x="560" y="192" width="410" height="84" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="576" y="216" font-size="14" font-weight="bold" fill="#1e3a8a">引擎内建的近似基数聚合</text>
  <text x="576" y="239" font-size="11.5" fill="#334155">ES cardinality（precision_threshold 默认 3000）</text>
  <text x="576" y="258" font-size="11.5" fill="#334155">ClickHouse uniq / uniqCombined 实测误差 +0.19% / +0.11%</text>

  <rect x="560" y="284" width="410" height="84" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="576" y="308" font-size="14" font-weight="bold" fill="#1e3a8a">统计报表链路</text>
  <text x="576" y="331" font-size="11.5" fill="#334155">上游按天 / 按活动算好 UV 再下发存储层</text>
  <text x="576" y="350" font-size="11.5" fill="#334155">只要量级和趋势，不要逐人精确（统计页提速）</text>

  <rect x="560" y="376" width="410" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="576" y="400" font-size="14" font-weight="bold" fill="#166534">Caffeine W-TinyLFU 的准入判断</text>
  <text x="576" y="423" font-size="11.5" fill="#334155">CMS 给任意 key 频率估计，只比两个候选大小</text>
  <text x="576" y="442" font-size="11.5" fill="#334155">高估无害：误差方向不影响「比大小」结论</text>

  <rect x="560" y="468" width="410" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="576" y="492" font-size="14" font-weight="bold" fill="#166534">热点检测 · 限流计数</text>
  <text x="576" y="515" font-size="11.5" fill="#334155">CMS 按估计频次找热点、超阈值走拦截</text>
  <text x="576" y="534" font-size="11.5" fill="#334155">高估 = 安全方向：宁可多拦，不会漏判</text>

  <rect x="560" y="560" width="410" height="76" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="576" y="584" font-size="14" font-weight="bold" fill="#991b1b">计费 · 配额 · 对账 —— 一律出局</text>
  <text x="576" y="607" font-size="11.5" fill="#334155">误差造成事故而非成本 → 精确计数器 / 哈希表</text>
  <text x="576" y="626" font-size="11.5" fill="#334155">对外承诺的独立用户数也别用 cardinality 直接出</text>

  <!-- 连线 -->
  <g stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#hllArrow)">
    <line x1="290" y1="270" x2="556" y2="142"/>
    <line x1="290" y1="288" x2="556" y2="234"/>
    <line x1="290" y1="300" x2="556" y2="326"/>
    <line x1="290" y1="400" x2="556" y2="418"/>
    <line x1="290" y1="420" x2="556" y2="510"/>
  </g>

  <!-- 底部漏斗 -->
  <rect x="30" y="668" width="940" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="690" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">漏斗式组合：布隆挡「肯定不存在」 → CMS 找热点 → HLL 出报表</text>
  <text x="500" y="708" text-anchor="middle" font-size="11.5" fill="#334155">先花 O(1) 排除绝大多数无效请求，剩余少数才走昂贵路径</text>
</svg>
