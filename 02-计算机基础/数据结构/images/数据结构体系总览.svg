<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="720" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">数据结构体系总览（本目录回答「数据怎么存」）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">逻辑结构四形态决定可选操作；五个子目录按结构族划分；「数据怎么算」在姊妹目录 算法/</text>

  <rect x="20" y="76" width="960" height="74" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="36" y="100" font-size="15" font-weight="bold" fill="#0f172a">逻辑结构四形态（数据结构 = 逻辑结构 + 物理结构 + 定义在其上的运算）</text>
  <rect x="36" y="112" width="210" height="26" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="141" y="129" text-anchor="middle" font-size="13" fill="#1e3a8a">一对一 · 线性结构</text>
  <rect x="256" y="112" width="210" height="26" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="361" y="129" text-anchor="middle" font-size="13" fill="#14532d">一对多 · 树形结构</text>
  <rect x="476" y="112" width="210" height="26" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="581" y="129" text-anchor="middle" font-size="13" fill="#7c2d12">多对多 · 图形结构</text>
  <rect x="696" y="112" width="210" height="26" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="801" y="129" text-anchor="middle" font-size="13" fill="#78350f">无其他关系 · 集合</text>

  <line x1="500" y1="152" x2="500" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="20" y="170" width="960" height="234" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="194" font-size="15" font-weight="bold" fill="#16a34a">树/（20 篇零件）—— 一族按「额外能力」分开的树</text>
  <text x="36" y="220" font-size="13" fill="#334155">地基与遍历 · 二叉树结构与性质 / 树的遍历</text>
  <text x="36" y="241" font-size="13" fill="#334155">有序查找 · 二叉搜索树 / 树的形态与选型（选型总纲）</text>
  <text x="36" y="262" font-size="13" fill="#334155">平衡（内存）· 平衡树（族总纲）/ AVL树 / 红黑树</text>
  <text x="36" y="283" font-size="13" fill="#334155">多路与写优化 · B树与B+树 / LSM树</text>
  <text x="36" y="304" font-size="13" fill="#334155">空间 · 空间索引与R树 / KD树与高维索引</text>
  <text x="36" y="325" font-size="13" fill="#334155">区间与前缀 · 区间与索引树 / Trie</text>
  <text x="36" y="346" font-size="13" fill="#334155">堆 · 堆与优先队列 / 可并堆与堆的变体</text>
  <text x="36" y="367" font-size="13" fill="#334155">度量与版本化 · 霍夫曼树 / 可持久化数据结构</text>
  <text x="36" y="388" font-size="13" fill="#334155">判据层 · 树与图的边界 / 树的缓存局部性对比 / 树的典型反模式</text>

  <line x1="500" y1="406" x2="500" y2="422" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="20" y="424" width="228" height="186" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="34" y="448" font-size="15" font-weight="bold" fill="#2563eb">线性结构/</text>
  <text x="34" y="472" font-size="13" fill="#334155">数组与链表</text>
  <text x="34" y="493" font-size="13" fill="#334155">栈与队列</text>
  <text x="34" y="514" font-size="13" fill="#334155">双端队列与循环队列</text>
  <text x="34" y="540" font-size="12" fill="#64748b">基座 到 受限表 到 结构变体</text>
  <text x="34" y="560" font-size="12" fill="#64748b">判别：在哪儿增删、要不要</text>
  <text x="34" y="580" font-size="12" fill="#64748b">按下标访问</text>

  <rect x="260" y="424" width="228" height="186" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="274" y="448" font-size="15" font-weight="bold" fill="#b45309">哈希表/</text>
  <text x="274" y="472" font-size="13" fill="#334155">散列表</text>
  <text x="274" y="493" font-size="13" fill="#334155">开放寻址与冲突解决</text>
  <text x="274" y="519" font-size="12" fill="#64748b">等值快速命中；无序</text>
  <text x="274" y="539" font-size="12" fill="#64748b">四道闸门：负载因子、</text>
  <text x="274" y="559" font-size="12" fill="#64748b">rehash、渐进式、</text>
  <text x="274" y="579" font-size="12" fill="#64748b">桶内升级</text>

  <rect x="500" y="424" width="228" height="186" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="514" y="448" font-size="15" font-weight="bold" fill="#ea580c">图/</text>
  <text x="514" y="472" font-size="13" fill="#334155">图的表示与存储</text>
  <text x="514" y="498" font-size="12" fill="#64748b">邻接表 / 邻接矩阵 /</text>
  <text x="514" y="518" font-size="12" fill="#64748b">边列表三种存储</text>
  <text x="514" y="538" font-size="12" fill="#64748b">为后续扩充预留的目录</text>
  <text x="514" y="558" font-size="12" fill="#64748b">算法在 算法/图论算法/</text>

  <rect x="740" y="424" width="240" height="186" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="754" y="448" font-size="15" font-weight="bold" fill="#7c3aed">高级数据结构/</text>
  <text x="754" y="472" font-size="13" fill="#334155">位图与布隆过滤器</text>
  <text x="754" y="493" font-size="13" fill="#334155">布谷鸟过滤器</text>
  <text x="754" y="514" font-size="13" fill="#334155">基数与频率估计</text>
  <text x="754" y="535" font-size="13" fill="#334155">单调栈与单调队列</text>
  <text x="754" y="556" font-size="13" fill="#334155">跳跃表 / 并查集</text>
  <text x="754" y="577" font-size="13" fill="#334155">倒排索引 / 时间轮</text>
  <text x="754" y="598" font-size="12" fill="#64748b">用额外假设换更快操作</text>

  <rect x="20" y="626" width="960" height="46" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="36" y="654" font-size="13" fill="#334155">跨目录出口：「数据怎么算」在 算法/；一致性哈希在 04-架构与系统/分布式/服务治理/；各语言容器在 01-编程语言/</text>
</svg>
