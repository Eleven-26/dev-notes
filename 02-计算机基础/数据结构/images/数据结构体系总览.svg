<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="900" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">数据结构体系总览（本目录回答「数据怎么存」）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">逻辑结构四形态决定可选操作；七个子目录按结构族划分；「数据怎么算」在姊妹目录 算法/</text>

  <rect x="20" y="76" width="960" height="74" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="36" y="100" font-size="15" font-weight="bold" fill="#0f172a">逻辑结构四形态（数据结构 = 逻辑结构 + 物理结构 + 定义在其上的运算）</text>
  <rect x="36" y="112" width="210" height="26" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="141" y="129" text-anchor="middle" font-size="13" fill="#1e3a8a">一对一 · 线性结构</text>
  <rect x="256" y="112" width="210" height="26" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="361" y="129" text-anchor="middle" font-size="13" fill="#14532d">一对多 · 树形结构</text>
  <rect x="476" y="112" width="210" height="26" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="581" y="129" text-anchor="middle" font-size="13" fill="#7c2d12">多对多 · 图形结构</text>
  <rect x="696" y="112" width="210" height="26" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="801" y="129" text-anchor="middle" font-size="13" fill="#78350f">无其他关系 · 集合</text>

  <line x1="500" y1="152" x2="500" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="20" y="170" width="960" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="194" font-size="15" font-weight="bold" fill="#16a34a">树/（18 篇零件，分五组）—— 根目录放地基与选型，子目录按「平衡介质 / 存储介质 / 数据形状 / 横向专题」归族</text>
  <text x="36" y="220" font-size="13" fill="#334155">根目录 · 树与图的边界 / 二叉树结构与性质 / 树的遍历 / 二叉搜索树 / 树的形态与选型</text>
  <text x="36" y="243" font-size="13" fill="#334155">内存平衡树/ · 平衡树（族总纲）/ AVL树 / 红黑树</text>
  <text x="36" y="266" font-size="13" fill="#334155">磁盘存储树/ · B树与B+树 / LSM树</text>
  <text x="36" y="289" font-size="13" fill="#334155">空间与字符串树/ · 空间索引与R树 / KD树与高维索引 / Trie</text>
  <text x="36" y="312" font-size="13" fill="#334155">进阶与总结/ · 区间与索引树 / 可持久化数据结构 / 霍夫曼树 / 树的缓存局部性对比 / 树的典型反模式</text>
  <text x="36" y="343" font-size="12" fill="#64748b">选型三问：数据在内存还是磁盘 → 读多还是写多 → 要不要「序」；堆已单列为姊妹目录 堆/</text>
  <text x="36" y="366" font-size="12" fill="#64748b">进阶与总结/ 里放两类东西：横向专题（区间 / 版本 / 加权）与判据层（局部性 / 反模式）</text>
  <text x="36" y="389" font-size="12" fill="#64748b">树的 18 篇 = 根目录 5 + 内存平衡树 3 + 磁盘存储树 2 + 空间与字符串树 3 + 进阶与总结 5</text>

  <line x1="500" y1="410" x2="500" y2="426" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="20" y="428" width="228" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="32" y="452" font-size="15" font-weight="bold" fill="#2563eb">线性结构/（3）</text>
  <text x="32" y="476" font-size="13" fill="#334155">数组与链表</text>
  <text x="32" y="497" font-size="13" fill="#334155">栈与队列</text>
  <text x="32" y="518" font-size="13" fill="#334155">双端队列与循环队列</text>
  <text x="32" y="544" font-size="12" fill="#64748b">基座 到 受限表 到 结构变体</text>
  <text x="32" y="564" font-size="12" fill="#64748b">判别：在哪儿增删、要不要</text>
  <text x="32" y="584" font-size="12" fill="#64748b">按下标访问</text>

  <rect x="264" y="428" width="228" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="276" y="452" font-size="15" font-weight="bold" fill="#0d9488">堆/（2）</text>
  <text x="276" y="476" font-size="13" fill="#334155">堆与优先队列</text>
  <text x="276" y="497" font-size="13" fill="#334155">可并堆与堆的变体</text>
  <text x="276" y="523" font-size="12" fill="#64748b">取极值 O(1)；只保证偏序</text>
  <text x="276" y="543" font-size="12" fill="#64748b">合并维度：左偏树 /</text>
  <text x="276" y="563" font-size="12" fill="#64748b">斜堆 / 配对堆</text>
  <text x="276" y="583" font-size="12" fill="#64748b">与树/ 分工：极值 vs 有序</text>

  <rect x="508" y="428" width="228" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="520" y="452" font-size="15" font-weight="bold" fill="#b45309">哈希表/（2）</text>
  <text x="520" y="476" font-size="13" fill="#334155">散列表</text>
  <text x="520" y="497" font-size="13" fill="#334155">开放寻址与冲突解决</text>
  <text x="520" y="523" font-size="12" fill="#64748b">等值快速命中；无序</text>
  <text x="520" y="543" font-size="12" fill="#64748b">四道闸门：负载因子、</text>
  <text x="520" y="563" font-size="12" fill="#64748b">rehash、渐进式、</text>
  <text x="520" y="583" font-size="12" fill="#64748b">桶内升级</text>

  <rect x="752" y="428" width="228" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="764" y="452" font-size="15" font-weight="bold" fill="#ea580c">图/（1）</text>
  <text x="764" y="476" font-size="13" fill="#334155">图的表示与存储</text>
  <text x="764" y="502" font-size="12" fill="#64748b">邻接表 / 邻接矩阵 /</text>
  <text x="764" y="522" font-size="12" fill="#64748b">边列表三种存储</text>
  <text x="764" y="542" font-size="12" fill="#64748b">为后续扩充预留的目录</text>
  <text x="764" y="562" font-size="12" fill="#64748b">算法在 算法/图论算法/</text>

  <rect x="20" y="624" width="310" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="32" y="648" font-size="15" font-weight="bold" fill="#7c3aed">高级数据结构/（5）</text>
  <text x="32" y="672" font-size="13" fill="#334155">单调栈与单调队列 / 跳跃表</text>
  <text x="32" y="693" font-size="13" fill="#334155">并查集 / 倒排索引 / 时间轮</text>
  <text x="32" y="719" font-size="12" fill="#64748b">用额外假设换更快操作</text>
  <text x="32" y="739" font-size="12" fill="#64748b">保证是「确定性」的：结果一定对</text>
  <text x="32" y="759" font-size="12" fill="#64748b">边界：概率结构已迁到 概率与统计/</text>

  <rect x="346" y="624" width="310" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="358" y="648" font-size="15" font-weight="bold" fill="#be123c">概率与统计/（3）</text>
  <text x="358" y="672" font-size="13" fill="#334155">位图与布隆过滤器 / 布谷鸟过滤器</text>
  <text x="358" y="693" font-size="13" fill="#334155">基数与频率估计（HLL / CMS）</text>
  <text x="358" y="719" font-size="12" fill="#64748b">用精度换空间；结果可能错</text>
  <text x="358" y="739" font-size="12" fill="#64748b">误差方向固定：只会假阳性 / 只会高估</text>
  <text x="358" y="759" font-size="12" fill="#64748b">判据：这个结果能不能接受近似？</text>

  <rect x="672" y="624" width="308" height="180" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="684" y="648" font-size="15" font-weight="bold" fill="#0f172a">两条跨族判据</text>
  <text x="684" y="674" font-size="12" fill="#334155">① 精确 or 近似：概率结构只做前置过滤</text>
  <text x="684" y="694" font-size="12" fill="#334155">② 基础 or 高级：基础答「存和取」，</text>
  <text x="684" y="714" font-size="12" fill="#334155">   高级答「快速取极值 / 近似回答」</text>
  <text x="684" y="740" font-size="12" fill="#64748b">全部 41 篇 = 34 篇零件 + 7 篇目录导读</text>
  <text x="684" y="760" font-size="12" fill="#64748b">结构选型的隐藏代价看各目录 README</text>

  <rect x="20" y="820" width="960" height="52" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="36" y="844" font-size="13" fill="#334155">跨目录出口：「数据怎么算」在 算法/；一致性哈希在 04-架构与系统/分布式/服务治理/；各语言容器在 01-编程语言/</text>
  <text x="36" y="863" font-size="12" fill="#64748b">配图数字全部抄自各篇正文与容器实测；图只做结构定位，不替代判据与实测</text>
</svg>
