<svg width="1000" height="900" viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="900" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">局部性谱系：一次 cache line（64 B）能覆盖多少「有用数据」</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">从左到右，一次访存搬运回来的有用数据逐档变少；越往右，每走一步越可能撞上一次 cache miss</text>

  <rect x="30" y="84" width="940" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="106" font-size="13" font-weight="bold" fill="#0f172a">内存层次：一次访存要等多久（公开的延迟量级参考，非本机实测）</text>
  <rect x="44" y="116" width="148" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="200" y="116" width="148" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="356" y="116" width="148" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="512" y="116" width="148" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="668" y="116" width="148" height="34" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <rect x="824" y="116" width="148" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="118" y="138" text-anchor="middle" font-size="12" fill="#0f172a">寄存器 &lt; 1 ns</text>
  <text x="274" y="138" text-anchor="middle" font-size="12" fill="#14532d">L1 ≈ 1 ns</text>
  <text x="430" y="138" text-anchor="middle" font-size="12" fill="#14532d">L2 ≈ 4 ns</text>
  <text x="586" y="138" text-anchor="middle" font-size="12" fill="#1e3a8a">L3 ≈ 15 ns</text>
  <text x="742" y="138" text-anchor="middle" font-size="12" fill="#9a3412">主存 ≈ 80 ns</text>
  <text x="898" y="138" text-anchor="middle" font-size="12" fill="#7f1d1d">磁盘 ≈ 10 ms</text>

  <text x="30" y="186" font-size="15" font-weight="bold" fill="#0f172a">局部性谱系（好 → 差）：每条 cache line 都固定是 64 B，差别在「搬回的东西有没有用」</text>

  <rect x="30" y="200" width="940" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="30" y="200" width="9" height="68" fill="#16a34a"/>
  <text x="54" y="228" font-size="15" font-weight="bold" fill="#16a34a">1. 数组化完全二叉树（堆）</text>
  <text x="54" y="252" font-size="12" fill="#334155">[]int 下标 2i+1 / 2i+2，树活在数组里</text>
  <text x="560" y="228" font-size="12" fill="#334155">一条 64 B 的 line 恰好装下 8 个 int64</text>
  <text x="560" y="252" font-size="12" fill="#334155">下降只需算术，地址连续，预取器跟得上</text>

  <rect x="30" y="276" width="940" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="30" y="276" width="9" height="68" fill="#16a34a"/>
  <text x="54" y="304" font-size="15" font-weight="bold" fill="#16a34a">2. B+ 树（页内多键 + 叶子链表）</text>
  <text x="54" y="328" font-size="12" fill="#334155">一个节点 = 一页，页内塞满有序键</text>
  <text x="560" y="304" font-size="12" fill="#334155">一个页（4 KiB / 16 KiB）装成百上千个键</text>
  <text x="560" y="328" font-size="12" fill="#334155">页内二分把「一次搬运的有用键」拉到最大</text>

  <rect x="30" y="352" width="940" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="30" y="352" width="9" height="68" fill="#2563eb"/>
  <text x="54" y="380" font-size="15" font-weight="bold" fill="#2563eb">3. 多路树（中等扇出）</text>
  <text x="54" y="404" font-size="12" fill="#334155">扇出比二叉树大，但仍按节点分配</text>
  <text x="560" y="380" font-size="12" fill="#334155">一次搬运覆盖的键数随扇出线性上升</text>
  <text x="560" y="404" font-size="12" fill="#334155">但页内仍要在「键 + 子页指针」数组里跳</text>

  <rect x="30" y="428" width="940" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="30" y="428" width="9" height="68" fill="#ea580c"/>
  <text x="54" y="456" font-size="15" font-weight="bold" fill="#ea580c">4. 二叉平衡树（AVL / 红黑 / 指针 BST）</text>
  <text x="54" y="480" font-size="12" fill="#334155">struct{val int; left, right *node}</text>
  <text x="560" y="456" font-size="12" fill="#334155">节点 24 B（值 8 B + 两个指针 16 B）</text>
  <text x="560" y="480" font-size="12" fill="#334155">每次下降几乎必跨新 line，且地址依赖，无法预取</text>

  <rect x="30" y="504" width="940" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="30" y="504" width="9" height="68" fill="#dc2626"/>
  <text x="54" y="532" font-size="15" font-weight="bold" fill="#dc2626">5. 跳表（多层指针）</text>
  <text x="54" y="556" font-size="12" fill="#334155">一个节点 = 一个键 + 多层 forward 指针</text>
  <text x="560" y="532" font-size="12" fill="#334155">一次访存只拿到一个键、还只用到一层指针</text>
  <text x="560" y="556" font-size="12" fill="#334155">「搬运字节 / 有用数据」在整族里最低</text>

  <text x="30" y="602" font-size="15" font-weight="bold" fill="#0f172a">本机实测：Go 1.26.8 / linux-amd64 容器，n = 1000000，取 3 次运行的最小值</text>

  <text x="30" y="628" font-size="13" fill="#334155">① 遍历全部 1000000 个元素（顺序访问 vs 指针追逐，三者和相等 = true）</text>
  <text x="44" y="656" font-size="12.5" fill="#0f172a">A1 顺序扫描连续数组</text>
  <rect x="430" y="647" width="4" height="14" rx="3" fill="#16a34a"/>
  <text x="444" y="658" font-size="12" fill="#334155">0.81 ms</text>
  <text x="44" y="682" font-size="12.5" fill="#0f172a">B1 前序指针遍历</text>
  <rect x="430" y="673" width="65" height="14" rx="3" fill="#ea580c"/>
  <text x="505" y="684" font-size="12" fill="#334155">13.45 ms　13～18×</text>
  <text x="44" y="708" font-size="12.5" fill="#0f172a">B2 前序指针遍历（节点打散分配）</text>
  <rect x="430" y="699" width="280" height="14" rx="3" fill="#dc2626"/>
  <text x="720" y="710" font-size="12" fill="#334155">57.67 ms　56～80×</text>

  <text x="30" y="742" font-size="13" fill="#334155">② 随机查找 1000000 次（三条路径节点访问次数完全相等 = 18951546）</text>
  <text x="44" y="770" font-size="12.5" fill="#0f172a">A2 有序数组二分查找</text>
  <rect x="430" y="761" width="84" height="14" rx="3" fill="#16a34a"/>
  <text x="524" y="772" font-size="12" fill="#334155">343 ms</text>
  <text x="44" y="796" font-size="12.5" fill="#0f172a">B1 BST 查找</text>
  <rect x="430" y="787" width="188" height="14" rx="3" fill="#ea580c"/>
  <text x="628" y="798" font-size="12" fill="#334155">772 ms　2.0～2.4×</text>
  <text x="44" y="822" font-size="12.5" fill="#0f172a">B2 BST 查找（节点打散分配）</text>
  <rect x="430" y="813" width="280" height="14" rx="3" fill="#dc2626"/>
  <text x="720" y="824" font-size="12" fill="#334155">1151 ms　2.9～3.6×</text>

  <text x="500" y="856" text-anchor="middle" font-size="12.5" fill="#334155">遍历差距 13～80×（顺序扫描吃满 64 B line + 硬件预取）　｜　随机查找只差 1.3～3.6×</text>
  <text x="500" y="880" text-anchor="middle" font-size="12" fill="#64748b">查找差距远小于遍历：二分的那 19 次探测本身也各落在不同 cache line 上，数组的「顺序」优势用不上</text>
</svg>
