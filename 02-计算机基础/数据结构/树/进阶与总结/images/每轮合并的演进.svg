<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <defs>
    <marker id="hm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">霍夫曼树的逐轮合并：每轮取最小两个，新节点回到候选池</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">输入 a:45 b:13 c:12 d:16 e:9 f:5；本图逐轮抄录第二节的构造过程</text>

  <text x="40" y="96" font-size="11.5" fill="#64748b">轮次</text>
  <text x="170" y="96" font-size="11.5" fill="#64748b">本轮取出的最小两个</text>
  <text x="480" y="96" font-size="11.5" fill="#64748b">合并结果</text>
  <text x="620" y="96" font-size="11.5" fill="#64748b">合并后的候选池</text>

  <path d="M 75 162 L 75 522" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="75" cy="162" r="5" fill="#2563eb"/>
  <circle cx="75" cy="252" r="5" fill="#94a3b8"/>
  <circle cx="75" cy="342" r="5" fill="#94a3b8"/>
  <circle cx="75" cy="432" r="5" fill="#94a3b8"/>
  <circle cx="75" cy="522" r="5" fill="#16a34a"/>

  <text x="40" y="167" font-size="16" font-weight="bold" fill="#64748b">①</text>
  <rect x="170" y="141" width="90" height="42" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="215" y="167" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">f:5</text>
  <rect x="280" y="141" width="90" height="42" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="325" y="167" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">e:9</text>
  <path d="M 370 162 L 480 162" stroke="#64748b" stroke-width="1.5" marker-end="url(#hm)"/>
  <rect x="480" y="141" width="110" height="42" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="535" y="167" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">14</text>
  <text x="620" y="167" font-size="11.5" fill="#475569">a:45 b:13 c:12 d:16 + 14</text>

  <text x="40" y="257" font-size="16" font-weight="bold" fill="#64748b">②</text>
  <rect x="170" y="231" width="90" height="42" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="215" y="257" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">c:12</text>
  <rect x="280" y="231" width="90" height="42" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="325" y="257" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">b:13</text>
  <path d="M 370 252 L 480 252" stroke="#64748b" stroke-width="1.5" marker-end="url(#hm)"/>
  <rect x="480" y="231" width="110" height="42" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="535" y="257" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">25</text>
  <text x="620" y="257" font-size="11.5" fill="#475569">a:45 d:16 14 + 25</text>

  <text x="40" y="347" font-size="16" font-weight="bold" fill="#64748b">③</text>
  <rect x="170" y="321" width="90" height="42" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="215" y="347" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">14</text>
  <rect x="280" y="321" width="90" height="42" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="325" y="347" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">d:16</text>
  <path d="M 370 342 L 480 342" stroke="#64748b" stroke-width="1.5" marker-end="url(#hm)"/>
  <rect x="480" y="321" width="110" height="42" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="535" y="347" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">30</text>
  <text x="620" y="347" font-size="11.5" fill="#475569">a:45 25 + 30</text>

  <text x="40" y="437" font-size="16" font-weight="bold" fill="#64748b">④</text>
  <rect x="170" y="411" width="90" height="42" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="215" y="437" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">25</text>
  <rect x="280" y="411" width="90" height="42" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="325" y="437" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">30</text>
  <path d="M 370 432 L 480 432" stroke="#64748b" stroke-width="1.5" marker-end="url(#hm)"/>
  <rect x="480" y="411" width="110" height="42" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="535" y="437" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">55</text>
  <text x="620" y="437" font-size="11.5" fill="#475569">a:45 + 55</text>

  <text x="40" y="527" font-size="16" font-weight="bold" fill="#64748b">⑤</text>
  <rect x="170" y="501" width="90" height="42" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="215" y="527" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">a:45</text>
  <rect x="280" y="501" width="90" height="42" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="325" y="527" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">55</text>
  <path d="M 370 522 L 480 522" stroke="#64748b" stroke-width="1.5" marker-end="url(#hm)"/>
  <rect x="480" y="501" width="110" height="42" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="535" y="527" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">100</text>
  <text x="620" y="527" font-size="11.5" fill="#475569">候选池只剩根</text>

  <rect x="30" y="570" width="940" height="120" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="596" font-size="13" font-weight="bold" fill="#1e40af">判据：树形完全由合并次序决定</text>
  <text x="46" y="624" font-size="12" fill="#1e3a8a">每轮都必须是「当前池里最小的两个」→ 新节点与原始叶子一起参与排序</text>
  <text x="46" y="650" font-size="12" fill="#1e3a8a">叶子数 = n，内部节点数 = n − 1，总节点 = 2n − 1（6 个符号 → 共 11 个节点）</text>
  <text x="46" y="676" font-size="12" fill="#1e3a8a">树形不唯一（tie-break 不同），但最优 WPL 唯一</text>
</svg>
