<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="lw1" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#2563eb"/>
    </marker>
    <marker id="lw2" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">LSM 树的形态总览：内存三件套 + 磁盘上「越往下越大越旧」的多层文件</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">写只碰内存与「写新文件」；读从 MemTable 出发，由上到下、由新到旧逐层找</text>

  <rect x="40" y="76" width="920" height="132" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="56" y="98" font-size="13" font-weight="bold" fill="#1e40af">内存区（易失：掉电即失，靠 WAL 恢复）</text>

  <rect x="60" y="110" width="250" height="86" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="72" y="132" font-size="12.5" font-weight="bold" fill="#1e40af">WAL（预写日志）</text>
  <text x="72" y="152" font-size="11.5" fill="#334155">顺序追加，只写不改</text>
  <text x="72" y="170" font-size="11.5" fill="#334155">崩溃恢复的唯一依据</text>
  <text x="72" y="188" font-size="11.5" fill="#64748b">不参与查询</text>

  <rect x="330" y="110" width="300" height="86" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <text x="342" y="132" font-size="12.5" font-weight="bold" fill="#14532d">MemTable（内存有序表）</text>
  <text x="342" y="152" font-size="11.5" fill="#334155">跳表 / 红黑树；查询先查它</text>
  <text x="342" y="170" font-size="11.5" fill="#334155">满了转 Immutable，另开一个继续写</text>

  <rect x="650" y="110" width="290" height="86" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
  <text x="662" y="132" font-size="12.5" font-weight="bold" fill="#92400e">Immutable MemTable</text>
  <text x="662" y="152" font-size="11.5" fill="#334155">只读，等待后台刷盘</text>
  <text x="662" y="170" font-size="11.5" fill="#64748b">写入不被它阻塞</text>

  <line x1="500" y1="208" x2="500" y2="242" stroke="#2563eb" stroke-width="1.6" marker-end="url(#lw1)"/>
  <text x="512" y="230" font-size="11.5" fill="#1e40af">后台刷盘：把 Immutable 顺序写成新的 L0 文件</text>

  <rect x="40" y="250" width="920" height="266" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="56" y="272" font-size="13" font-weight="bold" fill="#0f172a">磁盘区（持久：只追加、从不原地改）</text>
  <text x="56" y="296" font-size="11.5" fill="#1e40af">L0（最新的一层）：每次刷盘新增一个文件，键范围彼此重叠</text>

  <text x="58" y="322" font-size="11" fill="#475569">A</text>
  <rect x="78" y="312" width="170" height="10" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="58" y="340" font-size="11" fill="#475569">B</text>
  <rect x="190" y="330" width="170" height="10" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="58" y="358" font-size="11" fill="#475569">C</text>
  <rect x="120" y="348" width="190" height="10" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="58" y="376" font-size="11" fill="#475569">D</text>
  <rect x="250" y="366" width="160" height="10" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="430" y="322" font-size="11" fill="#b45309">四个文件的键范围互相交叠（横轴是键序）：</text>
  <text x="430" y="340" font-size="11" fill="#b45309">任何一个都可能含目标键</text>
  <text x="430" y="358" font-size="11" fill="#b45309">→ 读时要逐个文件查（读放大）</text>

  <text x="56" y="400" font-size="11.5" fill="#15803d">L1（合并后的较大文件）：层内键范围不重叠</text>
  <rect x="78" y="408" width="120" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="138" y="426" text-anchor="middle" font-size="11" fill="#14532d">L1-1</text>
  <rect x="208" y="408" width="120" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="268" y="426" text-anchor="middle" font-size="11" fill="#14532d">L1-2</text>
  <rect x="338" y="408" width="120" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="398" y="426" text-anchor="middle" font-size="11" fill="#14532d">L1-3</text>
  <text x="478" y="426" font-size="11" fill="#15803d">每层只需查 1 个文件</text>

  <line x1="700" y1="372" x2="700" y2="404" stroke="#b45309" stroke-width="1.6" marker-end="url(#lw2)"/>
  <text x="712" y="384" font-size="11" fill="#92400e">Compaction 逐层下压</text>
  <text x="712" y="400" font-size="11" fill="#92400e">（结果写成新文件）</text>

  <text x="56" y="458" font-size="11.5" fill="#92400e">L2 及更深层：文件越大、数据越旧</text>
  <rect x="78" y="466" width="700" height="30" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="92" y="485" font-size="11.5" fill="#92400e">更下层的文件：由 Compaction 逐层下压形成，查询优先级最低</text>

  <text x="56" y="510" font-size="11" fill="#64748b">⚠️ 同一个键可能在 L0 的多个文件里都存在旧版本 —— 读放大与空间放大的形态来源</text>

  <rect x="40" y="528" width="920" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="56" y="548" font-size="12.5" font-weight="bold" fill="#0f172a">每个 SSTable 的内部（不可变：写出后永不修改）</text>
  <rect x="56" y="556" width="180" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="146" y="576" text-anchor="middle" font-size="11" fill="#1e40af">数据块（内部有序）</text>
  <rect x="246" y="556" width="140" height="32" rx="5" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.1"/>
  <text x="316" y="576" text-anchor="middle" font-size="11" fill="#3730a3">索引块（键 → 块）</text>
  <rect x="396" y="556" width="140" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="466" y="576" text-anchor="middle" font-size="11" fill="#14532d">布隆过滤器</text>
  <rect x="546" y="556" width="110" height="32" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="601" y="576" text-anchor="middle" font-size="11" fill="#334155">文件元数据</text>
  <text x="672" y="576" font-size="11" fill="#64748b">写出即冻结 → 可压缩、可并发读、可做快照</text>
</svg>
