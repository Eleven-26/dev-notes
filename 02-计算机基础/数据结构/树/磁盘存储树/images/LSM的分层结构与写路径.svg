<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="dn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="dnA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">LSM 的写路径：所有落盘动作都是「顺序追加」，没有一次原地改页</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">左：内存层 + 磁盘层的组件与数据流向；右：本机容器实测的写放大拆解（逻辑 4.44 MB → 磁盘 31.26 MB）</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="460" height="530" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">组件分层：内存里排序，磁盘上只追加</text>

    <rect x="20" y="68" width="420" height="128" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="28" y="86" font-size="11.5" fill="#1e40af">内存</text>
    <rect x="34" y="92" width="164" height="92" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="116" y="116" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">① WAL</text>
    <text x="116" y="138" text-anchor="middle" font-size="11.5" fill="#334155">顺序追加，只写不改</text>
    <text x="116" y="158" text-anchor="middle" font-size="11.5" fill="#334155">崩溃恢复的唯一依据</text>
    <text x="116" y="176" text-anchor="middle" font-size="11.5" fill="#64748b">不参与查询</text>

    <rect x="212" y="92" width="210" height="42" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
    <text x="222" y="110" font-size="12" font-weight="bold" fill="#14532d">② MemTable（有序）</text>
    <text x="222" y="128" font-size="11" fill="#334155">跳表 / 红黑树；查询先查它</text>

    <rect x="212" y="142" width="210" height="42" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
    <text x="222" y="160" font-size="12" font-weight="bold" fill="#92400e">③ Immutable MemTable</text>
    <text x="222" y="178" font-size="11" fill="#334155">只读，等待后台刷盘</text>

    <rect x="20" y="214" width="420" height="296" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="28" y="232" font-size="11.5" fill="#334155">磁盘</text>
    <text x="28" y="252" font-size="11.5" fill="#334155">④ L0：每次刷盘生成一个新的有序文件（彼此可能有重复键）</text>

    <rect x="36" y="262" width="92" height="44" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="82" y="280" text-anchor="middle" font-size="11" fill="#1e40af">SSTable</text>
    <text x="82" y="296" text-anchor="middle" font-size="10.5" fill="#64748b">有序文件</text>
    <rect x="136" y="262" width="92" height="44" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="182" y="280" text-anchor="middle" font-size="11" fill="#1e40af">SSTable</text>
    <text x="182" y="296" text-anchor="middle" font-size="10.5" fill="#64748b">有序文件</text>
    <rect x="236" y="262" width="92" height="44" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="282" y="280" text-anchor="middle" font-size="11" fill="#1e40af">SSTable</text>
    <text x="282" y="296" text-anchor="middle" font-size="10.5" fill="#64748b">有序文件</text>
    <rect x="336" y="262" width="92" height="44" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="382" y="280" text-anchor="middle" font-size="11" fill="#1e40af">SSTable</text>
    <text x="382" y="296" text-anchor="middle" font-size="10.5" fill="#64748b">有序文件</text>

    <line x1="232" y1="310" x2="232" y2="332" stroke="#b45309" stroke-width="2" marker-end="url(#dnA)"/>
    <text x="244" y="326" font-size="11" fill="#92400e">⑤ Compaction</text>

    <rect x="36" y="338" width="392" height="60" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
    <text x="232" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">L1：合并后的大文件</text>
    <text x="232" y="382" text-anchor="middle" font-size="11" fill="#334155">只有在这里，删除与更新才被真正执行（旧版本被丢弃）</text>

    <text x="16" y="418" font-size="12" fill="#1e40af">⭐ 写一条数据的路径：WAL 追加 → MemTable 插入 → 满了转</text>
    <text x="16" y="438" font-size="12" fill="#1e40af">Immutable → 后台刷成 L0 → 定期 Compaction 并入 L1</text>
    <text x="16" y="462" font-size="12" fill="#14532d">✅ 全程只有「顺序写」与「新建文件」，从不随机改已有页</text>
    <text x="16" y="484" font-size="12" fill="#b45309">⚠️ 代价：同一个键可能在多个 SSTable 里存在 → 读要逐个查；</text>
    <text x="16" y="504" font-size="12" fill="#b45309">Compaction 会不断重写数据 → 写放大（见右图）</text>
  </g>

  <g transform="translate(520,70)">
    <rect x="0" y="0" width="460" height="530" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">写放大拆解（本机实测）</text>
    <text x="16" y="52" font-size="12" fill="#64748b">40000 条、值 100 字节；MemTable 阈值 1000、L0 满 4 个文件即 Compaction</text>

    <rect x="16" y="68" width="428" height="164" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="92" font-size="12.5" fill="#1e40af">WAL 写入（顺序追加）        5,080,000 字节</text>
    <text x="32" y="116" font-size="12.5" fill="#14532d">SSTable 刷盘（40 次 flush）  4,760,000 字节</text>
    <text x="32" y="140" font-size="12.5" fill="#92400e">Compaction 重写（8 次合并） 21,420,000 字节</text>
    <line x1="32" y1="154" x2="428" y2="154" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="176" font-size="12.5" font-weight="bold" fill="#0f172a">磁盘总写入                  31,260,000 字节</text>
    <text x="32" y="198" font-size="12.5" font-weight="bold" fill="#0f172a">逻辑数据量                   4,440,000 字节</text>
    <text x="32" y="222" font-size="13.5" font-weight="bold" fill="#7f1d1d">⭐ 写放大 = 31,260,000 / 4,440,000 = 7.04</text>

    <text x="16" y="262" font-size="12" fill="#334155">磁盘写入的构成（按字节占比）：</text>
    <rect x="30" y="274" width="65" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <rect x="95" y="274" width="61" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <rect x="156" y="274" width="274" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
    <text x="62" y="290" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#1e40af">WAL</text>
    <text x="125" y="290" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#14532d">刷盘</text>
    <text x="293" y="290" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#92400e">Compaction 重写（占 68%）</text>
    <text x="62" y="320" text-anchor="middle" font-size="10.5" fill="#1e40af">16%</text>
    <text x="125" y="320" text-anchor="middle" font-size="10.5" fill="#14532d">15%</text>
    <text x="293" y="320" text-anchor="middle" font-size="10.5" fill="#92400e">69%</text>

    <rect x="16" y="340" width="428" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="30" y="362" font-size="12.5" fill="#1e40af">对照模型：B+ 树式「每次随机改一个 16 KB 页」</text>
    <text x="30" y="384" font-size="12.5" fill="#7f1d1d">写放大 ≈ 16384 / 108 ≈ 151.7</text>
    <text x="30" y="406" font-size="11.5" fill="#334155">⚠️ 这是「模型估算」不是实测 —— 只用来看量级差：</text>
    <text x="30" y="424" font-size="11.5" fill="#334155">LSM 把写放大从「百倍级」压到「个位数」，代价是读放大与 Compaction 的 CPU</text>

    <text x="16" y="458" font-size="12" fill="#334155">⭐ 结论：</text>
    <text x="16" y="480" font-size="12" fill="#334155">写放大主要来自 Compaction，而 Compaction 是「把散在 L0 的重复键</text>
    <text x="16" y="500" font-size="12" fill="#334155">合成一份」必须付的成本 —— 层数越多、合并越勤，写放大越高。</text>
    <text x="16" y="522" font-size="12" fill="#64748b">想压低它就调 Compaction 策略（size-tiered / leveled，见下一张图）。</text>
  </g>
</svg>
