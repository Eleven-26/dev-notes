<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Splay：zig / zig-zig / zig-zag 与「树高 n、摊还 O(log n)」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">上排：三种成对旋转的「旋转前 → 旋转后」；下排：顺序访问的代价曲线 —— 第一次很贵，之后几乎免费</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="300" height="350" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">zig：p 就是根</text>
    <text x="16" y="50" font-size="11.5" fill="#64748b">单旋一次，x 直接到根</text>

    <text x="16" y="76" font-size="10.5" fill="#94a3b8">旋转前</text>
    <line x1="170" y1="105" x2="110" y2="143" stroke="#94a3b8" stroke-width="1.3"/>
    <rect x="146" y="78" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="170" y="91" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">p</text>
    <rect x="86" y="143" width="48" height="26" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
    <text x="110" y="156" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#166534">x</text>

    <text x="16" y="200" font-size="10.5" fill="#94a3b8">旋转后</text>
    <line x1="150" y1="245" x2="190" y2="279" stroke="#94a3b8" stroke-width="1.3"/>
    <rect x="126" y="219" width="48" height="26" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
    <text x="150" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#166534">x</text>
    <rect x="186" y="279" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="210" y="292" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">p</text>

    <text x="16" y="332" font-size="11" fill="#15803d">⭐ 只有这一种情况 g = 0</text>
  </g>

  <g transform="translate(340,70)">
    <rect x="0" y="0" width="300" height="350" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">zig-zig：同侧（一字形）</text>
    <text x="16" y="50" font-size="11.5" fill="#64748b">先旋 p，再旋 x（摊还界的关键）</text>

    <text x="16" y="76" font-size="10.5" fill="#94a3b8">旋转前</text>
    <line x1="160" y1="99" x2="112" y2="127" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="105" y1="153" x2="57" y2="181" stroke="#94a3b8" stroke-width="1.3"/>
    <rect x="136" y="72" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="160" y="85" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">g</text>
    <rect x="81" y="127" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="105" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">p</text>
    <rect x="26" y="181" width="48" height="26" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
    <text x="50" y="194" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#166534">x</text>

    <text x="16" y="232" font-size="10.5" fill="#94a3b8">旋转后</text>
    <line x1="150" y1="255" x2="205" y2="274" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="210" y1="300" x2="265" y2="319" stroke="#94a3b8" stroke-width="1.3"/>
    <rect x="126" y="229" width="48" height="26" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
    <text x="150" y="242" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#166534">x</text>
    <rect x="186" y="274" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="210" y="287" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">p</text>
    <rect x="246" y="319" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="270" y="332" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">g</text>
  </g>

  <g transform="translate(660,70)">
    <rect x="0" y="0" width="320" height="350" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#0f172a">zig-zag：异侧（之字形）</text>
    <text x="16" y="50" font-size="11.5" fill="#64748b">先旋自己，再旋自己（方向相反）</text>

    <text x="16" y="76" font-size="10.5" fill="#94a3b8">旋转前</text>
    <line x1="170" y1="99" x2="222" y2="127" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="220" y1="153" x2="178" y2="181" stroke="#94a3b8" stroke-width="1.3"/>
    <rect x="146" y="72" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="170" y="85" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">g</text>
    <rect x="198" y="127" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="222" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">p</text>
    <rect x="154" y="181" width="48" height="26" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
    <text x="178" y="194" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#166534">x</text>

    <text x="16" y="232" font-size="10.5" fill="#94a3b8">旋转后</text>
    <line x1="155" y1="255" x2="105" y2="287" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="165" y1="255" x2="215" y2="287" stroke="#94a3b8" stroke-width="1.3"/>
    <rect x="131" y="229" width="48" height="26" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
    <text x="155" y="242" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#166534">x</text>
    <rect x="81" y="287" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="105" y="300" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">p</text>
    <rect x="191" y="287" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="215" y="300" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">g</text>

    <text x="16" y="334" font-size="11" fill="#15803d">⭐ 连转两次 x，p 与 g 分列两侧</text>
  </g>

  <text x="500" y="452" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">顺序访问 1→n 的代价：第一次 O(n)，之后几乎 O(1)（n=20000，本机实测）</text>

  <g transform="translate(40,465)">
    <line x1="30" y1="0" x2="30" y2="175" stroke="#94a3b8" stroke-width="1"/>
    <line x1="30" y1="175" x2="470" y2="175" stroke="#94a3b8" stroke-width="1"/>
    <text x="4" y="10" font-size="10" fill="#64748b">旋转</text>
    <text x="4" y="24" font-size="10" fill="#64748b">次数</text>

    <rect x="48" y="20" width="26" height="155" rx="3" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
    <text x="61" y="14" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">19999</text>
    <text x="82" y="100" font-size="10.5" fill="#92400e">首次访问</text>
    <text x="82" y="116" font-size="10.5" fill="#92400e">走完整条链</text>

    <rect x="96" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="112" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="128" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="144" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="160" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="176" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="192" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="208" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="224" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="240" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="256" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="272" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="288" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="304" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="320" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="336" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="352" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="368" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="384" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="400" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="416" y="171" width="10" height="4" fill="#22c55e"/>
    <rect x="432" y="171" width="10" height="4" fill="#22c55e"/>

    <text x="240" y="130" font-size="11" fill="#15803d">之后每次约 2 次旋转（splay 已把路径压平）</text>
    <text x="240" y="150" font-size="11" fill="#15803d">总旋转 88248 ≈ 4.4n</text>
    <text x="150" y="196" font-size="10" fill="#94a3b8">访问序号 1 → 20000（示意图，非逐点绘制）</text>
  </g>

  <g transform="translate(550,465)">
    <rect x="0" y="0" width="410" height="200" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="24" font-size="12.5" font-weight="bold" fill="#0f172a">访问序列决定总代价（树高 20000）</text>
    <text x="16" y="52" font-size="11" fill="#334155">顺序 1→n：总旋转 88248，均 4.41，最大 19999</text>
    <text x="16" y="76" font-size="11" fill="#334155">逆序 n→1：总旋转 19999，均 1.00，最大 1</text>
    <text x="16" y="100" font-size="11" fill="#334155">随机（种子 42）：413431，均 20.67，最大 13471</text>
    <text x="16" y="124" font-size="11" fill="#334155">随机第二轮：378801，均 18.94，最大 44</text>
    <line x1="16" y1="138" x2="394" y2="138" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="158" font-size="11" fill="#1e40af">树高 20000 ≠ 每次 O(n)：摊还 O(log n)</text>
    <text x="16" y="178" font-size="11" fill="#b45309">⚠️ 单次最坏仍可能 O(n)，尾延迟敏感慎用</text>
  </g>
</svg>
