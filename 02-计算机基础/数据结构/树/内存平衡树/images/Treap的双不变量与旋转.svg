<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Treap：BST 序管「位置」，堆序管「树形」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">左：只读 key 时是一棵合法 BST；中：每个节点再带随机优先级；右：一次右旋同时保住两条不变量</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="300" height="530" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">只看 key：BST 序</text>
    <text x="16" y="52" font-size="12" fill="#64748b">左子树 &lt; 根 &lt; 右子树</text>

    <line x1="150" y1="123" x2="85" y2="177" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="150" y1="123" x2="215" y2="177" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="85" y1="203" x2="45" y2="257" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="85" y1="203" x2="125" y2="257" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="215" y1="203" x2="250" y2="257" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="250" y1="283" x2="250" y2="337" stroke="#94a3b8" stroke-width="1.3"/>

    <rect x="126" y="97" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="150" y="110" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">30</text>
    <rect x="61" y="177" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="85" y="190" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">20</text>
    <rect x="191" y="177" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="215" y="190" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">40</text>
    <rect x="21" y="257" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="45" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">10</text>
    <rect x="101" y="257" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="125" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">25</text>
    <rect x="226" y="257" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="250" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">50</text>
    <rect x="226" y="337" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="250" y="350" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">60</text>

    <rect x="16" y="396" width="268" height="104" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="418" font-size="11.5" font-weight="bold" fill="#1e40af">中序：10 20 25 30 40 50 60</text>
    <text x="28" y="440" font-size="11" fill="#334155">→ 查找 / 前驱后继按 BST 规则走</text>
    <text x="28" y="462" font-size="11" fill="#334155">→ 这半边与普通 BST 完全一样</text>
    <text x="28" y="484" font-size="11" fill="#64748b">形状尚未被第二条不变量约束</text>
  </g>

  <g transform="translate(340,70)">
    <rect x="0" y="0" width="300" height="530" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">再叠上优先级：小顶堆</text>
    <text x="16" y="52" font-size="12" fill="#64748b">父 prio &lt; 子 prio，且 prio 与 key 独立</text>

    <line x1="150" y1="123" x2="85" y2="177" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="150" y1="123" x2="215" y2="177" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="85" y1="203" x2="45" y2="257" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="85" y1="203" x2="125" y2="257" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="215" y1="203" x2="250" y2="257" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="250" y1="283" x2="250" y2="337" stroke="#94a3b8" stroke-width="1.3"/>

    <rect x="126" y="97" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="150" y="110" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">30</text>
    <circle cx="172" cy="99" r="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
    <text x="172" y="99" text-anchor="middle" dominant-baseline="central" font-size="8.5" font-weight="bold" fill="#92400e">10</text>

    <rect x="61" y="177" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="85" y="190" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">20</text>
    <circle cx="107" cy="179" r="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
    <text x="107" y="179" text-anchor="middle" dominant-baseline="central" font-size="8.5" font-weight="bold" fill="#92400e">20</text>

    <rect x="191" y="177" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="215" y="190" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">40</text>
    <circle cx="237" cy="179" r="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
    <text x="237" y="179" text-anchor="middle" dominant-baseline="central" font-size="8.5" font-weight="bold" fill="#92400e">15</text>

    <rect x="21" y="257" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="45" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">10</text>
    <circle cx="67" cy="259" r="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
    <text x="67" y="259" text-anchor="middle" dominant-baseline="central" font-size="8.5" font-weight="bold" fill="#92400e">25</text>

    <rect x="101" y="257" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="125" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">25</text>
    <circle cx="147" cy="259" r="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
    <text x="147" y="259" text-anchor="middle" dominant-baseline="central" font-size="8.5" font-weight="bold" fill="#92400e">30</text>

    <rect x="226" y="257" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="250" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">50</text>
    <circle cx="272" cy="259" r="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
    <text x="272" y="259" text-anchor="middle" dominant-baseline="central" font-size="8.5" font-weight="bold" fill="#92400e">35</text>

    <rect x="226" y="337" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="250" y="350" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">60</text>
    <circle cx="272" cy="339" r="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
    <text x="272" y="339" text-anchor="middle" dominant-baseline="central" font-size="8.5" font-weight="bold" fill="#92400e">40</text>

    <rect x="16" y="396" width="268" height="104" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
    <text x="28" y="418" font-size="11.5" font-weight="bold" fill="#92400e">⭐ key 决定「放在中序哪里」</text>
    <text x="28" y="440" font-size="11.5" font-weight="bold" fill="#92400e">⭐ prio 决定「谁在上面」</text>
    <text x="28" y="462" font-size="11" fill="#334155">两套顺序相互独立，所以能同时满足</text>
    <text x="28" y="484" font-size="11" fill="#64748b">优先级随机 ⇒ 树形等价于随机 BST</text>
  </g>

  <g transform="translate(660,70)">
    <rect x="0" y="0" width="320" height="530" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">一次右旋：改 3 条指针</text>
    <text x="16" y="52" font-size="12" fill="#64748b">x 上升、y 下降，中序仍然是 A x B y C</text>

    <text x="16" y="82" font-size="11.5" font-weight="bold" fill="#475569">旋转前</text>
    <line x1="200" y1="121" x2="130" y2="171" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="200" y1="121" x2="270" y2="171" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="130" y1="197" x2="80" y2="247" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="130" y1="197" x2="180" y2="247" stroke="#94a3b8" stroke-width="1.3"/>

    <rect x="176" y="95" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="200" y="108" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">y=30</text>
    <circle cx="222" cy="97" r="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/>
    <text x="222" y="97" text-anchor="middle" dominant-baseline="central" font-size="8" fill="#92400e">10</text>

    <rect x="106" y="171" width="48" height="26" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
    <text x="130" y="184" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#166534">x=20</text>
    <circle cx="152" cy="173" r="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/>
    <text x="152" y="173" text-anchor="middle" dominant-baseline="central" font-size="8" fill="#92400e">5</text>

    <rect x="246" y="171" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="270" y="184" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">C=40</text>

    <rect x="56" y="247" width="48" height="26" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="80" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#334155">A=15</text>
    <rect x="156" y="247" width="48" height="26" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="180" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#334155">B=25</text>

    <text x="16" y="312" font-size="11.5" fill="#1e40af">↓ 对 y 右旋（x 是 y 的左孩子）</text>

    <text x="16" y="342" font-size="11.5" font-weight="bold" fill="#475569">旋转后</text>
    <line x1="160" y1="381" x2="100" y2="431" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="160" y1="381" x2="230" y2="431" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="230" y1="457" x2="190" y2="487" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="230" y1="457" x2="280" y2="487" stroke="#94a3b8" stroke-width="1.3"/>

    <rect x="136" y="355" width="48" height="26" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
    <text x="160" y="368" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#166534">x=20</text>
    <circle cx="182" cy="357" r="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/>
    <text x="182" y="357" text-anchor="middle" dominant-baseline="central" font-size="8" fill="#92400e">5</text>

    <rect x="76" y="431" width="48" height="26" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="100" y="444" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#334155">A=15</text>

    <rect x="206" y="431" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="230" y="444" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">y=30</text>
    <circle cx="252" cy="433" r="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/>
    <text x="252" y="433" text-anchor="middle" dominant-baseline="central" font-size="8" fill="#92400e">10</text>

    <rect x="166" y="487" width="48" height="26" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="190" y="500" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#334155">B=25</text>
    <rect x="256" y="487" width="48" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="280" y="500" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e40af">C=40</text>
  </g>
</svg>
