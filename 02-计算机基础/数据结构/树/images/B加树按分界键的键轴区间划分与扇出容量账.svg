<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="570" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">B+ 树的划分依据：一页里的分界键把键轴切成 m+1 段</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#64748b">划分 = 分界键 + 子页指针（第二节第二步）；下方容量账只由「扇出 ≈ 500」与「层数 = ⌈log₅₀₀ N⌉」两个数算出</text>

  <text x="30" y="80" font-size="13.5" font-weight="bold" fill="#0f172a">① 一个内部节点把键轴切成互不重叠的区间，每段交给一个子页</text>

  <rect x="30" y="90" width="940" height="216" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="380" y="98" width="240" height="30" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="500" y="118" text-anchor="middle" font-size="12" fill="#78350f">根页：k1  k2  k3  k4</text>
  <line x1="60" y1="148" x2="940" y2="148" stroke="#64748b" stroke-width="1.4"/>
  <text x="60" y="142" font-size="10.5" fill="#64748b">键轴（10⁷ 个有序主键）</text>
  <line x1="248" y1="148" x2="248" y2="188" stroke="#b45309" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="421" y1="148" x2="421" y2="188" stroke="#b45309" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="594" y1="148" x2="594" y2="188" stroke="#b45309" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="767" y1="148" x2="767" y2="188" stroke="#b45309" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="78" y="158" width="150" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="153" y="175" text-anchor="middle" font-size="10.5" fill="#1e3a8a">区间 1 · 键 &lt; k1</text>
  <rect x="250" y="158" width="150" height="24" fill="#e0f2fe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="325" y="175" text-anchor="middle" font-size="10.5" fill="#1e3a8a">区间 2 · k1≤键&lt;k2</text>
  <rect x="423" y="158" width="150" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="498" y="175" text-anchor="middle" font-size="10.5" fill="#1e3a8a">区间 3 · k2≤键&lt;k3</text>
  <rect x="596" y="158" width="150" height="24" fill="#e0f2fe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="671" y="175" text-anchor="middle" font-size="10.5" fill="#1e3a8a">区间 4 · k3≤键&lt;k4</text>
  <rect x="769" y="158" width="150" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="844" y="175" text-anchor="middle" font-size="10.5" fill="#1e3a8a">区间 5 · 键 ≥ k4</text>
  <rect x="80" y="200" width="146" height="44" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="153" y="220" text-anchor="middle" font-size="10.5" fill="#1e3a8a">叶子页 1</text>
  <text x="153" y="236" text-anchor="middle" font-size="10.5" fill="#1e3a8a">整行数据 ★</text>
  <rect x="252" y="200" width="146" height="44" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="325" y="220" text-anchor="middle" font-size="10.5" fill="#1e3a8a">叶子页 2</text>
  <text x="325" y="236" text-anchor="middle" font-size="10.5" fill="#1e3a8a">整行数据 ★</text>
  <rect x="425" y="200" width="146" height="44" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="498" y="220" text-anchor="middle" font-size="10.5" fill="#1e3a8a">叶子页 3</text>
  <text x="498" y="236" text-anchor="middle" font-size="10.5" fill="#1e3a8a">整行数据 ★</text>
  <rect x="598" y="200" width="146" height="44" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="671" y="220" text-anchor="middle" font-size="10.5" fill="#1e3a8a">叶子页 4</text>
  <text x="671" y="236" text-anchor="middle" font-size="10.5" fill="#1e3a8a">整行数据 ★</text>
  <rect x="771" y="200" width="146" height="44" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="844" y="220" text-anchor="middle" font-size="10.5" fill="#1e3a8a">叶子页 5</text>
  <text x="844" y="236" text-anchor="middle" font-size="10.5" fill="#1e3a8a">整行数据 ★</text>
  <line x1="226" y1="222" x2="252" y2="222" stroke="#16a34a" stroke-width="1.6"/>
  <line x1="398" y1="222" x2="425" y2="222" stroke="#16a34a" stroke-width="1.6"/>
  <line x1="571" y1="222" x2="598" y2="222" stroke="#16a34a" stroke-width="1.6"/>
  <line x1="744" y1="222" x2="771" y2="222" stroke="#16a34a" stroke-width="1.6"/>
  <text x="230" y="214" font-size="10" fill="#16a34a">叶子链</text>
  <rect x="250" y="153" width="521" height="95" rx="3" fill="none" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="510" y="266" text-anchor="middle" font-size="10.5" fill="#ea580c">范围查询 [a, b] 覆盖连续几段区间：定位一次，再顺链向右扫</text>
  <text x="44" y="288" font-size="11.5" fill="#334155">区间互不重叠 ⇒ 一个键只属于一段区间、只落在一个叶子上 ⇒ 每次查找都走到叶子，读页次数恒定（第一节「数据只存于叶子并成链」）</text>

  <text x="30" y="330" font-size="13.5" font-weight="bold" fill="#0f172a">② 扇出 ≈ 500 的容量账：每往下多一层，键轴被切成的区间数就 ×500</text>
  <rect x="30" y="340" width="940" height="160" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="366" font-size="11.5" fill="#334155">1 层（只有根）→ 500 段</text>
  <rect x="290" y="354" width="121" height="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="760" y="366" font-size="11" fill="#dc2626">装不下 10⁷ 行</text>
  <text x="44" y="392" font-size="11.5" fill="#334155">2 层 → 500² = 25 万段</text>
  <rect x="290" y="380" width="243" height="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="760" y="392" font-size="11" fill="#dc2626">仍 &lt; 10⁷ 行</text>
  <text x="44" y="418" font-size="11.5" fill="#334155">3 层 → 500³ = 1.25 亿段</text>
  <rect x="290" y="406" width="364" height="16" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="760" y="418" font-size="11" fill="#16a34a">≥ 10⁷ → 3 次读页</text>
  <text x="44" y="444" font-size="11.5" fill="#334155">4 层 → 500⁴ = 6.25×10¹⁰ 段</text>
  <rect x="290" y="432" width="486" height="16" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="760" y="444" font-size="11" fill="#16a34a">≥ 10⁹ → 4 次读页</text>
  <line x1="290" y1="452" x2="290" y2="476" stroke="#94a3b8" stroke-width="1"/>
  <text x="290" y="488" font-size="10.5" text-anchor="middle" fill="#64748b">起点的值</text>
  <text x="44" y="476" font-size="10.5" fill="#64748b">横条按 log₁₀(区间数) 等比画，只用于比量级，不是线性刻度</text>

  <text x="30" y="524" font-size="12" fill="#b45309">⚠️ 这张账只是数量级推导，不能当容量规划用：实际还叠加根与内部节点常驻内存、OS page cache、二级索引回表（见第二节末的提醒）</text>
  <text x="30" y="548" font-size="12" fill="#0f172a">判据（3.4）：数据在磁盘、要范围查询、要按 key 有序 → B+ 树；B 树内部结点也带数据 → 单键命中可能少走一层，代价是各键命中层次不固定</text>
</svg>
