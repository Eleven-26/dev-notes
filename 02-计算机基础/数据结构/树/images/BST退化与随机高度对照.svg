<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 486" width="1000" height="486" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="486" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">插入顺序决定树形：退化 / 随机 / 平衡</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">同一组键、不同的插入顺序 → 完全不同的树高 → 完全不同的查找成本（下方数字为本机容器实测）</text>

  <g transform="translate(20,78)">
    <rect x="0" y="0" width="306" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">升序插入：退化成链</text>
    <text x="16" y="52" font-size="12" fill="#64748b">1, 2, 3, 4, 5, 6 … 每次都挂到最右</text>
    <line x1="83" y1="90" x2="113" y2="126" stroke="#f87171" stroke-width="1.5"/>
    <line x1="113" y1="126" x2="143" y2="162" stroke="#f87171" stroke-width="1.5"/>
    <line x1="143" y1="162" x2="173" y2="198" stroke="#f87171" stroke-width="1.5"/>
    <line x1="173" y1="198" x2="203" y2="234" stroke="#f87171" stroke-width="1.5"/>
    <line x1="203" y1="234" x2="233" y2="270" stroke="#f87171" stroke-width="1.5"/>
    <circle cx="83" cy="90" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="83" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#7f1d1d">1</text>
    <circle cx="113" cy="126" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="113" y="126" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#7f1d1d">2</text>
    <circle cx="143" cy="162" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="143" y="162" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#7f1d1d">3</text>
    <circle cx="173" cy="198" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="173" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#7f1d1d">4</text>
    <circle cx="203" cy="234" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="203" y="234" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#7f1d1d">5</text>
    <circle cx="233" cy="270" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="233" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#7f1d1d">6</text>
    <text x="16" y="302" font-size="12.5" fill="#0f172a">树高 = n = 65536（log₂n 只有 16）</text>
    <text x="16" y="322" font-size="12" fill="#334155">插入总比较 n(n−1)/2 = 2147450880</text>
  </g>

  <g transform="translate(346,78)">
    <rect x="0" y="0" width="306" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">随机插入：4.3·ln n</text>
    <text x="16" y="52" font-size="12" fill="#64748b">形状不可控，但期望高度远小于 n</text>
    <line x1="153" y1="88" x2="103" y2="148" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="153" y1="88" x2="203" y2="148" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="103" y1="148" x2="73" y2="208" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="103" y1="148" x2="133" y2="208" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="203" y1="148" x2="233" y2="208" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="153" cy="88" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
    <text x="153" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e3a8a">4</text>
    <circle cx="103" cy="148" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
    <text x="103" y="148" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e3a8a">2</text>
    <circle cx="203" cy="148" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
    <text x="203" y="148" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e3a8a">6</text>
    <circle cx="73" cy="208" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
    <text x="73" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e3a8a">1</text>
    <circle cx="133" cy="208" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
    <text x="133" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e3a8a">3</text>
    <circle cx="233" cy="208" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
    <text x="233" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1e3a8a">7</text>
    <text x="16" y="248" font-size="11.5" fill="#64748b">↑ 形态示意（6 节点）；实测规模见下方</text>
    <text x="16" y="302" font-size="12.5" fill="#0f172a">实测树高 37~39（5 个 seed）</text>
    <text x="16" y="322" font-size="12" fill="#334155">⚠️ 是 log₂n 的 2.2~2.4 倍，不是 log n</text>
  </g>

  <g transform="translate(672,78)">
    <rect x="0" y="0" width="306" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">平衡树：钉死在 log₂n</text>
    <text x="16" y="52" font-size="12" fill="#64748b">AVL / 红黑树靠旋转维持高度上界</text>
    <line x1="153" y1="88" x2="103" y2="148" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="153" y1="88" x2="203" y2="148" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="103" y1="148" x2="73" y2="208" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="103" y1="148" x2="133" y2="208" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="203" y1="148" x2="183" y2="208" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="203" y1="148" x2="233" y2="208" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="153" cy="88" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="153" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#14532d">4</text>
    <circle cx="103" cy="148" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="103" y="148" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#14532d">2</text>
    <circle cx="203" cy="148" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="203" y="148" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#14532d">6</text>
    <circle cx="73" cy="208" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="73" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#14532d">1</text>
    <circle cx="133" cy="208" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="133" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#14532d">3</text>
    <circle cx="183" cy="208" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="183" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#14532d">5</text>
    <circle cx="233" cy="208" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="233" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#14532d">7</text>
    <text x="16" y="248" font-size="11.5" fill="#64748b">↑ 同样的 7 个键，形态最规整</text>
    <text x="16" y="302" font-size="12.5" fill="#0f172a">树高有确定的最坏界，代价是插入</text>
    <text x="16" y="322" font-size="12" fill="#334155">实现细节见 平衡树.md</text>
  </g>

  <text x="500" y="434" text-anchor="middle" font-size="12.5" fill="#334155">⚠️ 「随机插入就没事」是危险的安慰：自增主键、日志时间戳、按字典序导入 —— 真实输入常常接近有序，</text>
  <text x="500" y="454" text-anchor="middle" font-size="12.5" fill="#334155">而一旦有序，树高是确定性地等于 n（不是"大概率没事"）。修法：让结构自己维持平衡，或改用哈希表。</text>
</svg>
