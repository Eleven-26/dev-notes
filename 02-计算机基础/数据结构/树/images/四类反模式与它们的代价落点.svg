<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="800" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">树的四类反模式：症状、代价落点与判据</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">每条反模式的数字都能在本目录零件篇的实测块里逐字对上（出处见正文各节）</text>

  <g transform="translate(20,72)">
    <rect x="0" y="0" width="460" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="15" font-weight="bold" fill="#0f172a">一、结构选错：需求与结构配错了</text>
    <text x="16" y="52" font-size="11.5" fill="#64748b">要点：树只为「有序 / 前缀 / 区间 / 附近」付费</text>

    <line x1="100" y1="99" x2="125" y2="139" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="125" y1="139" x2="150" y2="179" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="150" y1="179" x2="175" y2="219" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="100" cy="84" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="100" y="84" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#7f1d1d">1</text>
    <circle cx="125" cy="124" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="125" y="124" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">2</text>
    <circle cx="150" cy="164" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="150" y="164" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">3</text>
    <circle cx="175" cy="204" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="175" y="204" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">4</text>

    <text x="210" y="100" font-size="12.5" fill="#334155">升序插入 1、2、3、4：每个都右挂</text>
    <text x="210" y="124" font-size="12.5" fill="#334155">→ 树高 = n，查找退化成线性扫描</text>

    <text x="16" y="252" font-size="13" fill="#334155">「平衡」这个约束买到的，是任何时刻树高都是 O(log n)</text>
    <text x="16" y="276" font-size="12" fill="#334155">实测 升序插入 65536 个键 → 树高 65536（log₂ n 只有 16）</text>
    <text x="16" y="296" font-size="12" fill="#334155">实测 只做插入+取最小：左偏树 11078904 次 vs 二叉堆 6519019 次</text>
    <text x="16" y="320" font-size="12" fill="#ea580c">落点：树高 → 线性扫描；「更高级」的结构白付维护成本</text>
  </g>

  <g transform="translate(520,72)">
    <rect x="0" y="0" width="460" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="15" font-weight="bold" fill="#0f172a">二、介质与实现选错</text>
    <text x="16" y="52" font-size="11.5" fill="#64748b">要点：磁盘上「层数 = I/O 次数」；Trie 有指针税</text>

    <line x1="228" y1="108" x2="58" y2="166" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="228" y1="108" x2="168" y2="166" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="228" y1="108" x2="278" y2="166" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="228" y1="108" x2="388" y2="166" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="150" y="80" width="156" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="202" y1="80" x2="202" y2="108" stroke="#2563eb" stroke-width="1"/>
    <line x1="254" y1="80" x2="254" y2="108" stroke="#2563eb" stroke-width="1"/>
    <text x="176" y="94" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1e40af">10</text>
    <text x="228" y="94" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1e40af">50</text>
    <text x="280" y="94" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1e40af">90</text>
    <rect x="10" y="168" width="96" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <line x1="42" y1="168" x2="42" y2="194" stroke="#16a34a" stroke-width="1"/>
    <line x1="74" y1="168" x2="74" y2="194" stroke="#16a34a" stroke-width="1"/>
    <text x="26" y="181" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#14532d">1</text>
    <text x="58" y="181" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#14532d">2</text>
    <text x="90" y="181" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#14532d">3</text>
    <rect x="120" y="168" width="96" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <line x1="152" y1="168" x2="152" y2="194" stroke="#16a34a" stroke-width="1"/>
    <line x1="184" y1="168" x2="184" y2="194" stroke="#16a34a" stroke-width="1"/>
    <text x="136" y="181" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#14532d">5</text>
    <text x="168" y="181" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#14532d">6</text>
    <text x="200" y="181" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#14532d">7</text>
    <rect x="230" y="168" width="96" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <line x1="262" y1="168" x2="262" y2="194" stroke="#16a34a" stroke-width="1"/>
    <line x1="294" y1="168" x2="294" y2="194" stroke="#16a34a" stroke-width="1"/>
    <text x="246" y="181" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#14532d">9</text>
    <text x="278" y="181" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#14532d">…</text>
    <text x="310" y="181" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#14532d">12</text>
    <rect x="340" y="168" width="96" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <line x1="372" y1="168" x2="372" y2="194" stroke="#16a34a" stroke-width="1"/>
    <line x1="404" y1="168" x2="404" y2="194" stroke="#16a34a" stroke-width="1"/>
    <text x="356" y="181" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#14532d">…</text>
    <text x="388" y="181" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#14532d">…</text>
    <text x="420" y="181" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#14532d">99</text>

    <text x="16" y="218" font-size="12.5" fill="#334155">扇出 ≈ 500 → 10⁷ 行约 3 层，一次主键查找约 3 次读页</text>
    <text x="16" y="238" font-size="12.5" fill="#334155">同规模换成红黑树（一结点一键）→ 约 24 层</text>
    <text x="16" y="262" font-size="12" fill="#334155">实测 同一组词 app/apple/api/bat：Trie 9 个节点 → Radix 6 个</text>
    <text x="16" y="282" font-size="12" fill="#334155">R 树删除 / 重插要维护 MBR → 高频变动改网格 / GeoHash</text>
    <text x="16" y="320" font-size="12" fill="#ea580c">落点：几十次随机 I/O；指针税把内存撑爆</text>
  </g>

  <g transform="translate(20,424)">
    <rect x="0" y="0" width="460" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="15" font-weight="bold" fill="#0f172a">三、维护段与参数写错</text>
    <text x="16" y="52" font-size="11.5" fill="#64748b">要点：结构对，但标记 / 深度错 → 静默错</text>

    <text x="16" y="90" font-size="12.5" fill="#334155">线段树忘下推 / 忘清空懒标记 → 结果不报错但错</text>
    <text x="16" y="112" font-size="12.5" fill="#334155">判据：必须与无懒标记实现或暴力扫描对拍</text>
    <text x="16" y="134" font-size="12" fill="#334155">实测 对拍一致才作数：4835082 = 4835082</text>
    <text x="16" y="164" font-size="12.5" fill="#334155">树状数组求区间最值 → 不行（max 不可差分）</text>
    <text x="16" y="186" font-size="12" fill="#334155">静态最值改 ST 表 O(1)：查询期省 33268 倍</text>
    <text x="16" y="216" font-size="12.5" fill="#334155">深树用递归遍历 → 栈溢出，且不可恢复</text>
    <text x="16" y="238" font-size="12" fill="#334155">实测 链式 100 万层：递归调用栈 128 MiB</text>
    <text x="16" y="258" font-size="12" fill="#334155">迭代只需 8.7 MiB；平衡树 h=20 仅 32 KiB</text>
    <text x="16" y="320" font-size="12" fill="#ea580c">落点：不抛异常的错值；运行时才崩的调用栈</text>
  </g>

  <g transform="translate(520,424)">
    <rect x="0" y="0" width="460" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="15" font-weight="bold" fill="#0f172a">四、测量方式错</text>
    <text x="16" y="52" font-size="11.5" fill="#64748b">要点：结论常常是口径给的，不是结构给的</text>

    <text x="16" y="90" font-size="12.5" fill="#334155">只看平均不看尾延迟 → p99 被 Compaction 打爆</text>
    <text x="16" y="112" font-size="12" fill="#334155">实测 写放大 7.04，Compaction 占写盘 69%</text>
    <text x="16" y="132" font-size="12" fill="#334155">实测 布隆过滤器挡掉 61.1% 的文件读</text>
    <text x="16" y="154" font-size="12" fill="#334155">坑：全部写完再测读 → 读放大假象 = 1</text>
    <text x="16" y="186" font-size="12.5" fill="#334155">只比 Big-O → 同为 O(log n)，常数差一个量级</text>
    <text x="16" y="208" font-size="12" fill="#334155">实测 查 10 万次区间和：树状数组 1.59 ms，</text>
    <text x="16" y="228" font-size="12" fill="#334155">线段树 17.57 ms（同为 O(log n)）</text>
    <text x="16" y="258" font-size="12" fill="#334155">实测 AVL 与红黑高度同量级：n = 10000 都 16</text>
    <text x="16" y="320" font-size="12" fill="#ea580c">落点：平均掩盖长尾；常数与局部性被压掉</text>
  </g>

</svg>
