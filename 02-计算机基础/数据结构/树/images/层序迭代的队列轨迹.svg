<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">层序迭代：出队前先锁住 len(q)，一层铺完再铺下一层</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">左：队列的逐步演化（同一棵树 1/2/4/5/3/6）；右：栈与队列的分工，以及 sz := len(q) 为什么必须在出队之前</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="460" height="610" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="16" font-weight="bold" fill="#0f172a">队列演化：方框从左到右 = 队头到队尾</text>

    <text x="16" y="70" font-size="12.5" font-weight="bold" fill="#0f172a">① 第 1 层：sz 锁成 1 → 出队 1，入队左 2、右 3</text>
    <rect x="16" y="82" width="40" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="36" y="97" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1e40af">2</text>
    <rect x="56" y="82" width="40" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
    <text x="76" y="97" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#92400e">3</text>
    <text x="106" y="97" font-size="11.5" fill="#2563eb">← 队尾（新入队）</text>
    <text x="16" y="132" font-size="12" fill="#14532d">输出：1   已完成的层：[1]</text>

    <text x="16" y="186" font-size="12.5" font-weight="bold" fill="#0f172a">② 第 2 层：sz 锁成 2 → 出队 2 入队 4、5；出队 3 入队 6</text>
    <rect x="16" y="198" width="40" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="36" y="213" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1e40af">4</text>
    <rect x="56" y="198" width="40" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="76" y="213" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1e40af">5</text>
    <rect x="96" y="198" width="40" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
    <text x="116" y="213" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#92400e">6</text>
    <text x="146" y="213" font-size="11.5" fill="#2563eb">← 队尾（本树最长队列 3）</text>
    <text x="16" y="248" font-size="12" fill="#14532d">输出：1 2 3   已完成的层：[1] [2 3]</text>

    <text x="16" y="302" font-size="12.5" font-weight="bold" fill="#0f172a">③ 第 3 层：sz 锁成 3 → 出队 4、5、6，三者都无孩子</text>
    <rect x="16" y="314" width="120" height="30" fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="76" y="329" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#94a3b8">空（遍历结束）</text>
    <text x="16" y="364" font-size="12" fill="#14532d">输出：1 2 3 4 5 6   层划分：[1] [2 3] [4 5 6]</text>

    <text x="16" y="418" font-size="12.5" font-weight="bold" fill="#0f172a">④ 每轮只读一次 len(q)：sz 依次取 1、2、3</text>
    <rect x="16" y="430" width="40" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="36" y="445" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#14532d">1</text>
    <rect x="56" y="430" width="40" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="76" y="445" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#14532d">2</text>
    <rect x="96" y="430" width="40" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="116" y="445" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#14532d">3</text>
    <text x="146" y="445" font-size="11.5" fill="#16a34a">← 每层的 sz（不是队列当前长度）</text>
    <text x="16" y="480" font-size="12" fill="#334155">读出的两件事：树高 = 层数 = 3；队列长度峰值 3 = 最宽一层的节点数</text>

    <text x="16" y="534" font-size="12.5" font-weight="bold" fill="#7f1d1d">⑤ 反例：不锁 sz，出队 2 时队列已经是 3、4、5</text>
    <rect x="16" y="546" width="40" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="36" y="561" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#7f1d1d">3</text>
    <rect x="56" y="546" width="40" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="76" y="561" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#7f1d1d">4</text>
    <rect x="96" y="546" width="40" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="116" y="561" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#7f1d1d">5</text>
    <text x="146" y="561" font-size="11.5" fill="#dc2626">← 此时 len(q) = 3</text>
    <text x="16" y="596" font-size="12" fill="#7f1d1d">把 3 当成本层个数 → 4、5 被算进第 2 层，层边界整体错位</text>
  </g>

  <g transform="translate(520,70)">
    <rect x="0" y="0" width="460" height="610" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="16" font-weight="bold" fill="#0f172a">为什么层序只能用队列</text>
    <text x="16" y="50" font-size="12" fill="#64748b">树的结构不变，换的只是「从哪一端取元素」—— 取法决定次序</text>

    <rect x="16" y="66" width="428" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="90" font-size="13" font-weight="bold" fill="#1e40af">栈（LIFO）：最后进去的先出来</text>
    <text x="30" y="112" font-size="12" fill="#334155">用在 DFS：前 / 中 / 后序都把刚发现的孩子立刻处理掉</text>
    <text x="30" y="134" font-size="12" fill="#334155">结果：一条分支走到底，同一层的节点散在不同时间</text>

    <rect x="16" y="162" width="428" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="186" font-size="13" font-weight="bold" fill="#1e40af">队列（FIFO）：最早进去的先出来</text>
    <text x="30" y="208" font-size="12" fill="#334155">用在 BFS / 层序：先发现的先处理，孩子排在队尾等轮次</text>
    <text x="30" y="230" font-size="12" fill="#334155">结果：第一次到达某节点就是最小跳数 —— 无权图最短路</text>

    <rect x="16" y="258" width="428" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="282" font-size="13" font-weight="bold" fill="#14532d">sz := len(q)：出队前先锁住本层个数</text>
    <text x="30" y="304" font-size="12" fill="#334155">队列边出边被孩子追加，len(q) 一直在变大，本身不是层边界</text>
    <text x="30" y="326" font-size="12" fill="#334155">锁住长度才知道「本层还剩几个」：按层打印 / 树高 / 树宽</text>

    <text x="16" y="374" font-size="13" font-weight="bold" fill="#0f172a">本机容器实测（Go 1.26.8 linux/amd64，样本树 6 节点）</text>
    <rect x="16" y="386" width="428" height="112" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="32" y="412" font-size="12.5" fill="#1e40af">层序 逐层 : [1 2 3 4 5 6]</text>
    <text x="32" y="436" font-size="12.5" fill="#1e40af">逐层切开 : [[1] [2 3] [4 5 6]]  树高 3 层 / 最宽 3 个</text>
    <text x="32" y="460" font-size="12.5" fill="#1e40af">对照 DFS : 前 1 2 4 5 3 6  中 4 2 5 1 3 6  后 4 5 2 6 3 1</text>
    <text x="32" y="484" font-size="12" fill="#334155">注意：只把栈换成队列这一行，遍历次序就换了一套语义</text>

    <text x="16" y="526" font-size="12" fill="#334155">层序在图上就叫 BFS：组织架构逐层聚合、树高树宽、无权最短路</text>
    <text x="16" y="546" font-size="12" fill="#334155">都靠它 —— 这也是「树的遍历」与「图的遍历」共用骨架的原因。</text>
    <text x="16" y="576" font-size="12.5" fill="#1e40af">判据：要「按层」→ 队列 + sz；要「一条路走到底」→ 栈；要「到</text>
    <text x="16" y="596" font-size="12.5" fill="#1e40af">达即最短」→ 队列。三种深度优先永远用不到队列。</text>
  </g>
</svg>
