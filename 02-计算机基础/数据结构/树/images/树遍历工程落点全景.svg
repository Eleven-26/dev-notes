<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">四种遍历 = 什么时候碰根：工程落点跟着需求形状走</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">所有落点复杂度都是 O(n)；差别只在根的时机，与「栈住在哪」（调用栈 / 显式栈 / Morris 借空指针）</text>

  <g>
    <rect x="30" y="85" width="220" height="365" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="140" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">前序：先碰根</text>
    <rect x="46" y="128" width="188" height="94" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="60" y="152" font-size="13" font-weight="bold" fill="#1e40af">序列化 / 深拷贝</text>
    <text x="60" y="176" font-size="12" fill="#334155">序列开头必是根</text>
    <text x="60" y="198" font-size="12" fill="#334155">重建时即知谁是父</text>
    <rect x="46" y="234" width="188" height="94" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="60" y="258" font-size="13" font-weight="bold" fill="#1e40af">目录 / 层级列举</text>
    <text x="60" y="282" font-size="12" fill="#334155">find / WalkDir 类</text>
    <text x="60" y="304" font-size="12" fill="#334155">先目录后子树</text>
    <text x="46" y="356" font-size="12" fill="#1e40af">还原整棵树：</text>
    <text x="46" y="378" font-size="12" fill="#334155">中序 + 前序（或中序</text>
    <text x="46" y="400" font-size="12" fill="#334155">+ 后序）才够唯一</text>
  </g>

  <g>
    <rect x="272" y="85" width="220" height="365" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="382" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">中序：根居中</text>
    <rect x="288" y="128" width="188" height="94" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <text x="302" y="152" font-size="13" font-weight="bold" fill="#14532d">校验是不是 BST</text>
    <text x="302" y="176" font-size="12" fill="#334155">转数组查是否升序</text>
    <text x="302" y="198" font-size="12" fill="#334155">最便宜的合法性检查</text>
    <rect x="288" y="234" width="188" height="94" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <text x="302" y="258" font-size="13" font-weight="bold" fill="#14532d">索引 / 有序读出</text>
    <text x="302" y="282" font-size="12" fill="#334155">内存 BST 走中序</text>
    <text x="302" y="304" font-size="12" fill="#334155">磁盘 B+ 树走叶链</text>
    <text x="288" y="356" font-size="12" fill="#14532d">唯一输出升序的遍历</text>
    <text x="288" y="378" font-size="12" fill="#334155">（1.1 归纳论证）</text>
  </g>

  <g>
    <rect x="514" y="85" width="220" height="365" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="624" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">后序：孩子先完事</text>
    <rect x="530" y="128" width="188" height="94" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
    <text x="544" y="152" font-size="13" font-weight="bold" fill="#9a3412">递归删除 rm -r 类</text>
    <text x="544" y="176" font-size="12" fill="#334155">先清空目录内容</text>
    <text x="544" y="198" font-size="12" fill="#334155">最后删目录本身</text>
    <rect x="530" y="234" width="188" height="94" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
    <text x="544" y="258" font-size="13" font-weight="bold" fill="#9a3412">汇总 / 求值</text>
    <text x="544" y="282" font-size="12" fill="#334155">du 逐层汇总容量</text>
    <text x="544" y="304" font-size="12" fill="#334155">表达式树 / AST 求值</text>
    <text x="530" y="356" font-size="12" fill="#9a3412">父节点的值 = 孩子的值</text>
    <text x="530" y="378" font-size="12" fill="#334155">算完才能合成，根必须最后</text>
  </g>

  <g>
    <rect x="756" y="85" width="214" height="365" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="863" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">层序：逐层铺</text>
    <rect x="772" y="128" width="182" height="94" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="786" y="152" font-size="13" font-weight="bold" fill="#334155">按层统计 / 限宽</text>
    <text x="786" y="176" font-size="12" fill="#334155">树高 树宽 每层聚合</text>
    <text x="786" y="198" font-size="12" fill="#334155">sz=len(q) 锁层边界</text>
    <rect x="772" y="234" width="182" height="94" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="786" y="258" font-size="13" font-weight="bold" fill="#334155">图上推广 = BFS</text>
    <text x="786" y="282" font-size="12" fill="#334155">无权图最短路</text>
    <text x="786" y="304" font-size="12" fill="#334155">到达即最小跳数</text>
    <text x="772" y="356" font-size="12" fill="#334155">只有 FIFO 保证</text>
    <text x="772" y="378" font-size="12" fill="#334155">「先发现的先处理」</text>
  </g>

  <g>
    <rect x="30" y="472" width="940" height="128" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="50" y="498" font-size="15" font-weight="bold" fill="#991b1b">两条必须带上的边界</text>
    <text x="50" y="524" font-size="12.5" fill="#334155">① 深度不可控（数据近序退化成链）→ 递归本身是反模式：调用栈超限直接崩、不可恢复，内存对照实测见 2.6</text>
    <text x="50" y="548" font-size="12.5" fill="#334155">② Morris 会临时改树：单线程 + 内存极紧才用，并发读会读到中途被改过的结构（判据见 4.1）</text>
    <text x="50" y="576" font-size="12.5" font-weight="bold" fill="#991b1b">需求形状三选一：写出去 = 前序　汇总上来 = 后序　逐层铺 = 层序　要有序 = 中序</text>
  </g>
</svg>
