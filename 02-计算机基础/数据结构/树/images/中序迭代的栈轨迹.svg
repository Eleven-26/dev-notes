<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="up" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L5,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">中序迭代：一路向左 → 弹栈访问 → 转向右</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">左：栈的逐步演化（同一棵树 1/2/4/5/3/6）；右：递归 / 显式栈 / Morris 三种写法的代价对照（含本机实测）</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="460" height="610" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="16" font-weight="bold" fill="#0f172a">栈演化：方框从左到右 = 栈底到栈顶</text>

    <text x="16" y="70" font-size="12.5" font-weight="bold" fill="#0f172a">① 一路向左：把 1、2、4 依次压栈</text>
    <rect x="16" y="82" width="40" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="36" y="97" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1e40af">1</text>
    <rect x="56" y="82" width="40" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="76" y="97" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1e40af">2</text>
    <rect x="96" y="82" width="40" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="116" y="97" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1e40af">4</text>
    <text x="146" y="97" font-size="11.5" fill="#2563eb">← 栈顶</text>
    <text x="16" y="132" font-size="12" fill="#334155">输出：—（还没访问任何节点，只是把「向左的路」记下来）</text>

    <text x="16" y="186" font-size="12.5" font-weight="bold" fill="#0f172a">② 弹 4 访问；4 没有右孩子</text>
    <rect x="16" y="198" width="40" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="36" y="213" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1e40af">1</text>
    <rect x="56" y="198" width="40" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="76" y="213" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1e40af">2</text>
    <text x="106" y="213" font-size="11.5" fill="#2563eb">← 栈顶</text>
    <text x="16" y="248" font-size="12" fill="#14532d">输出：4（4 是左子树最深的节点，符合「左 → 根 → 右」）</text>

    <text x="16" y="302" font-size="12.5" font-weight="bold" fill="#0f172a">③ 弹 2 访问；转向 2 的右孩子 5 并压栈</text>
    <rect x="16" y="314" width="40" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="36" y="329" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1e40af">1</text>
    <rect x="56" y="314" width="40" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
    <text x="76" y="329" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#92400e">5</text>
    <text x="106" y="329" font-size="11.5" fill="#2563eb">← 栈顶</text>
    <text x="16" y="364" font-size="12" fill="#14532d">输出：4 2（根 2 在左孩子 4 之后被访问，顺序正确）</text>

    <text x="16" y="418" font-size="12.5" font-weight="bold" fill="#0f172a">④ 弹 5、弹 1 访问；转向 1 的右孩子 3 并压栈</text>
    <rect x="16" y="430" width="40" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
    <text x="36" y="445" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#92400e">3</text>
    <text x="66" y="445" font-size="11.5" fill="#2563eb">← 栈顶</text>
    <text x="16" y="480" font-size="12" fill="#14532d">输出：4 2 5 1（左子树全部完成，才轮到根 1）</text>

    <text x="16" y="534" font-size="12.5" font-weight="bold" fill="#0f172a">⑤ 弹 3 访问；转向 6 压栈后再弹出 6</text>
    <rect x="16" y="546" width="120" height="30" fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="76" y="561" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#94a3b8">空（遍历结束）</text>
    <text x="16" y="596" font-size="12" fill="#14532d">输出：4 2 5 1 3 6 —— 与递归版逐位相同（本机实测 true）</text>
  </g>

  <g transform="translate(520,70)">
    <rect x="0" y="0" width="460" height="610" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="16" font-weight="bold" fill="#0f172a">递归 / 显式栈 / Morris 怎么选</text>
    <text x="16" y="50" font-size="12" fill="#64748b">三者时间复杂度都是 O(n)，差别几乎全在「额外空间」和「代码复杂度」</text>

    <rect x="16" y="66" width="428" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="90" font-size="13" font-weight="bold" fill="#1e40af">递归写法</text>
    <text x="30" y="112" font-size="12" fill="#334155">代码最短、三种遍历结构高度对称；空间 = 调用栈 O(h)</text>
    <text x="30" y="134" font-size="12" fill="#b45309">⚠️ 树退化成链时 h = n，深递归可能爆栈</text>

    <rect x="16" y="162" width="428" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="186" font-size="13" font-weight="bold" fill="#1e40af">显式栈（手动模拟）</text>
    <text x="30" y="208" font-size="12" fill="#334155">空间同样 O(h)，但栈在堆上，不受系统栈深度限制</text>
    <text x="30" y="230" font-size="12" fill="#334155">前序「先压右再压左」；后序「按根右左压、最后整体反转」</text>

    <rect x="16" y="258" width="428" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="282" font-size="13" font-weight="bold" fill="#14532d">Morris 遍历</text>
    <text x="30" y="304" font-size="12" fill="#334155">用叶子节点的空右指针做「临时线索」，空间 O(1)</text>
    <text x="30" y="326" font-size="12" fill="#b45309">⚠️ 会临时改树结构；单线程才行，别和别人共享同一棵树</text>

    <text x="16" y="374" font-size="13" font-weight="bold" fill="#0f172a">本机容器实测（n = 200000 随机树，中序遍历）</text>
    <rect x="16" y="386" width="428" height="112" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="32" y="412" font-size="12.5" fill="#1e40af">递归       ~22 ms</text>
    <text x="32" y="436" font-size="12.5" fill="#1e40af">显式栈     ~21 ms</text>
    <text x="32" y="460" font-size="12.5" fill="#1e40af">Morris     ~17 ms</text>
    <text x="32" y="484" font-size="12" fill="#334155">⚠️ 时序只断言「同为 O(n)、同一量级」——容器读数波动大</text>
    <text x="16" y="526" font-size="12" fill="#334155">较小树上 Morris 反而更快（少一次分配）；大树上「每步找前驱」</text>
    <text x="16" y="546" font-size="12" fill="#334155">的额外比较才开始显出来 —— 收益取决于树的高度分布。</text>
    <text x="16" y="576" font-size="12.5" fill="#1e40af">⭐ 判据：递归够用就用递归；栈深不可控（数据可能有序）选显式栈；</text>
    <text x="16" y="596" font-size="12.5" fill="#1e40af">内存极紧且能接受改树 → Morris。</text>
  </g>
</svg>
