<svg width="1000" height="720" viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="1000" height="720" fill="#ffffff"/>

  <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">递归 vs 迭代：内存「住在哪」不一样</text>
  <text x="500" y="68" text-anchor="middle" font-size="14" fill="#475569">空间量级同为 O(h)，差的是「每层多大」与「谁管回收」</text>

  <rect x="30" y="92" width="450" height="470" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="520" y="92" width="450" height="470" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

  <rect x="60" y="118" width="390" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="550" y="118" width="390" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>

  <rect x="90" y="180" width="210" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="90" y="216" width="210" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="90" y="252" width="210" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="90" y="288" width="210" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="90" y="368" width="210" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1"/>

  <rect x="580" y="180" width="20" height="28" fill="#dcfce7" stroke="#16a34a"/>
