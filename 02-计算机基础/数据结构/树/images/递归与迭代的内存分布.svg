  <rect x="646" y="180" width="20" height="28" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="668" y="180" width="20" height="28" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="690" y="180" width="20" height="28" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="712" y="180" width="20" height="28" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="734" y="180" width="20" height="28" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="756" y="180" width="20" height="28" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="778" y="180" width="20" height="28" fill="#dcfce7" stroke="#16a34a"/>
