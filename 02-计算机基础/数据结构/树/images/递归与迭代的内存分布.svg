  <rect x="866" y="180" width="20" height="28" fill="#dcfce7" stroke="#16a34a"/>

  <rect x="580" y="262" width="20" height="28" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="602" y="262" width="20" height="28" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="624" y="262" width="20" height="28" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="646" y="262" width="20" height="28" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="668" y="262" width="20" height="28" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="690" y="262" width="20" height="28" fill="#dcfce7" stroke="#16a34a"/>

  <line x1="342" y1="176" x2="342" y2="404" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="342,410 336,398 348,398" fill="#64748b"/>

  <rect x="30" y="580" width="940" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

  <text x="255" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">递归：成本在「调用栈」</text>
  <text x="745" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">迭代：成本在「堆」</text>

  <text x="195" y="201" text-anchor="middle" font-size="13" fill="#0f172a">栈帧 ≈ 134 B</text>
  <text x="195" y="237" text-anchor="middle" font-size="13" fill="#0f172a">栈帧 ≈ 134 B</text>
  <text x="195" y="273" text-anchor="middle" font-size="13" fill="#0f172a">栈帧 ≈ 134 B</text>
  <text x="195" y="309" text-anchor="middle" font-size="13" fill="#0f172a">栈帧 ≈ 134 B</text>
  <text x="195" y="389" text-anchor="middle" font-size="13" fill="#0f172a">栈帧 ≈ 134 B</text>
  <text x="195" y="350" text-anchor="middle" font-size="18" fill="#64748b">⋮</text>
  <text x="356" y="295" font-size="13" fill="#475569">共 h 层</text>

  <text x="720" y="240" text-anchor="middle" font-size="18" fill="#64748b">⋮</text>
  <text x="720" y="316" text-anchor="middle" font-size="13" fill="#0f172a">每个元素 = 8 B 指针</text>

  <text x="60" y="446" font-size="13" fill="#334155">一个栈帧装的是：返回地址 + 保存的寄存器 + 局部变量</text>
  <text x="60" y="476" font-size="13" fill="#334155">不在 GC 管理范围，用超了直接 fatal error</text>
  <text x="60" y="506" font-size="13" fill="#334155">Go：栈自动扩容（默认上限 1 GB）</text>
  <text x="60" y="536" font-size="13" fill="#ea580c">C / Java：线程栈固定几 MB → 10 万层就崩</text>

  <text x="550" y="392" font-size="13" fill="#334155">一个待回退节点只占 8 B 指针</text>
  <text x="550" y="422" font-size="13" fill="#334155">由 GC 负责回收，数组用完能还回去</text>
  <text x="550" y="452" font-size="13" fill="#334155">可预分配：make([]*Node, 0, h)</text>
  <text x="550" y="482" font-size="13" fill="#ea580c">append 扩容会留中间数组，预分配即归零</text>

  <text x="500" y="610" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">实测对照（左斜链 n = 1000000，Go 1.26.8 / linux-amd64）</text>
  <text x="500" y="638" text-anchor="middle" font-size="13" fill="#334155">递归：调用栈 +128 MiB，堆 0 B　｜　迭代：调用栈 ≈ 0，堆 8.7 MiB</text>
  <text x="500" y="664" text-anchor="middle" font-size="13" fill="#334155">每层 ≈ 134 B　vs　每元素 8 B（≈ 17 倍）</text>
  <text x="500" y="690" text-anchor="middle" font-size="13" fill="#475569">平衡形态（h = 20，100 万节点）两者都微不足道：32 KiB vs 464 B</text>
</svg>
