<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>

  <text x="40" y="42" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#0f172a">配对堆：合并 O(1) 挂链，代价全推给「删除最小」的两趟配对</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">结构 = 多叉树 + 孩子链表（child 是第一个孩子，next 是下一个兄弟）；每个节点只存这两个指针</text>

  <!-- 删除最小：初始 -->
  <rect x="40" y="86" width="290" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="58" y="112" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">① 取走根，露出孩子链</text>

  <circle cx="185" cy="150" r="22" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="185" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#9a3412">1</text>

  <line x1="185" y1="172" x2="100" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <line x1="185" y1="172" x2="150" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <line x1="185" y1="172" x2="215" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <line x1="185" y1="172" x2="270" y2="240" stroke="#94a3b8" stroke-width="2"/>

  <circle cx="100" cy="258" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">5</text>
  <circle cx="160" cy="268" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">3</text>
  <circle cx="225" cy="268" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="225" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">9</text>
  <circle cx="285" cy="258" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="285" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">7</text>

  <line x1="120" y1="258" x2="140" y2="268" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="180" y1="268" x2="205" y2="268" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="245" y1="268" x2="265" y2="258" stroke="#cbd5e1" stroke-width="2"/>

  <text x="58" y="330" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748b">孩子链 5 → 3 → 9 → 7（用 next 串起）</text>
  <text x="58" y="356" font-family="system-ui, sans-serif" font-size="12.5" fill="#ea580c">取走的 min = 1</text>

  <!-- 第一趟 -->
  <rect x="348" y="86" width="300" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="366" y="112" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">② 第一趟：从左到右两两配对</text>

  <line x1="430" y1="190" x2="430" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="430" cy="175" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="181" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">3</text>
  <circle cx="430" cy="252" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="257" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">5</text>
  <text x="458" y="180" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">(5,3) → 3</text>

  <line x1="580" y1="190" x2="580" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="580" cy="175" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="580" y="181" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">7</text>
  <circle cx="580" cy="252" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="257" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">9</text>
  <text x="522" y="300" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">(9,7) → 7</text>

  <text x="366" y="330" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748b">孩子数从 4 个压到 2 个</text>
  <text x="366" y="356" font-family="system-ui, sans-serif" font-size="12.5" fill="#ea580c">合并次数 = ⌊4/2⌋ = 2</text>

  <!-- 第二趟 -->
  <rect x="666" y="86" width="294" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="684" y="112" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">③ 第二趟：从右往左合并</text>

  <line x1="800" y1="200" x2="800" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="800" cy="180" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="800" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">3</text>
  <circle cx="800" cy="272" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="800" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">7</text>
  <circle cx="738" cy="330" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="738" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">5</text>
  <line x1="800" y1="292" x2="756" y2="322" stroke="#94a3b8" stroke-width="2"/>
  <line x1="762" y1="330" x2="788" y2="278" stroke="#94a3b8" stroke-width="2"/>

  <text x="684" y="368" font-family="system-ui, sans-serif" font-size="12.5" fill="#ea580c">新根 = 3，删除最小完成</text>

  <!-- 结论带 -->
  <rect x="40" y="406" width="920" height="98" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="436" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">合并 O(1)：只比较一次根，把大的整棵挂到小的孩子链头 —— 没有任何递归</text>
  <text x="60" y="464" font-family="system-ui, sans-serif" font-size="14" fill="#334155">实测（n = 200000）：配对堆一次 merge 只花 1 次；插入 n 次共 199999 次（每个 O(1)）。</text>
  <text x="60" y="488" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">代价：删除最小要做两趟配对，复杂度是摊还的（精确界至今是开放问题）。</text>
</svg>
