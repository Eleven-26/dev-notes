<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一棵树、四种遍历：访问顺序完全由「根放在第几个」决定</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">节点上的小黄圈 = 第几个被访问。前序根最先、中序根居中、后序根最后；层序不是 DFS，走队列</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="460" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">前序 根 → 左 → 右</text>
    <text x="16" y="52" font-size="12" fill="#64748b">用途：序列化 / 复制整棵树（先落根再落子树）</text>
    <line x1="230" y1="100" x2="160" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="230" y1="100" x2="300" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="175" x2="125" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="175" x2="195" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="300" y1="175" x2="335" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="230" cy="100" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="230" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1e40af">1</text>
    <circle cx="160" cy="175" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="160" y="175" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">2</text>
    <circle cx="300" cy="175" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="300" y="175" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">3</text>
    <circle cx="125" cy="250" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="125" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">4</text>
    <circle cx="195" cy="250" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="195" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">5</text>
    <circle cx="335" cy="250" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="335" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">6</text>
    <circle cx="244" cy="86" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="244" y="86" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">1</text>
    <circle cx="174" cy="161" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="174" y="161" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">2</text>
    <circle cx="314" cy="161" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="314" y="161" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">5</text>
    <circle cx="139" cy="236" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="139" y="236" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">3</text>
    <circle cx="209" cy="236" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="209" y="236" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">4</text>
    <circle cx="349" cy="236" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="349" y="236" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">6</text>
    <text x="16" y="292" font-size="13.5" font-weight="bold" fill="#1e40af">前序结果：1 2 4 5 3 6</text>
    <text x="16" y="314" font-size="12" fill="#334155">迭代写法要点：栈里「先压右、再压左」，弹出时才是先左后右</text>
  </g>

  <g transform="translate(520,70)">
    <rect x="0" y="0" width="460" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">中序 左 → 根 → 右</text>
    <text x="16" y="52" font-size="12" fill="#64748b">用途：BST 上输出升序序列（唯一的排序遍历）</text>
    <line x1="230" y1="100" x2="160" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="230" y1="100" x2="300" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="175" x2="125" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="175" x2="195" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="300" y1="175" x2="335" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="230" cy="100" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="230" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1e40af">1</text>
    <circle cx="160" cy="175" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="160" y="175" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">2</text>
    <circle cx="300" cy="175" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="300" y="175" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">3</text>
    <circle cx="125" cy="250" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="125" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">4</text>
    <circle cx="195" cy="250" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="195" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">5</text>
    <circle cx="335" cy="250" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="335" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">6</text>
    <circle cx="244" cy="86" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="244" y="86" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">4</text>
    <circle cx="174" cy="161" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="174" y="161" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">2</text>
    <circle cx="314" cy="161" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="314" y="161" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">5</text>
    <circle cx="139" cy="236" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="139" y="236" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">1</text>
    <circle cx="209" cy="236" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="209" y="236" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">3</text>
    <circle cx="349" cy="236" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="349" y="236" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">6</text>
    <text x="16" y="292" font-size="13.5" font-weight="bold" fill="#1e40af">中序结果：4 2 5 1 3 6</text>
    <text x="16" y="314" font-size="12" fill="#334155">迭代模板：一路向左压栈 → 弹出访问 → 转向右子树（见下一张图）</text>
  </g>

  <g transform="translate(20,410)">
    <rect x="0" y="0" width="460" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">后序 左 → 右 → 根</text>
    <text x="16" y="52" font-size="12" fill="#64748b">用途：释放内存 / 自底向上汇总子树信息（根最后才拿到结果）</text>
    <line x1="230" y1="100" x2="160" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="230" y1="100" x2="300" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="175" x2="125" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="175" x2="195" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="300" y1="175" x2="335" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="230" cy="100" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="230" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1e40af">1</text>
    <circle cx="160" cy="175" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="160" y="175" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">2</text>
    <circle cx="300" cy="175" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="300" y="175" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">3</text>
    <circle cx="125" cy="250" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="125" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">4</text>
    <circle cx="195" cy="250" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="195" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">5</text>
    <circle cx="335" cy="250" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="335" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">6</text>
    <circle cx="244" cy="86" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="244" y="86" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">6</text>
    <circle cx="174" cy="161" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="174" y="161" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">3</text>
    <circle cx="314" cy="161" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="314" y="161" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">5</text>
    <circle cx="139" cy="236" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="139" y="236" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">1</text>
    <circle cx="209" cy="236" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="209" y="236" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">2</text>
    <circle cx="349" cy="236" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="349" y="236" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">4</text>
    <text x="16" y="292" font-size="13.5" font-weight="bold" fill="#1e40af">后序结果：4 5 2 6 3 1</text>
    <text x="16" y="314" font-size="12" fill="#334155">迭代写法要点：按「根→右→左」压栈，最后把结果整体反转</text>
  </g>

  <g transform="translate(520,410)">
    <rect x="0" y="0" width="460" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">层序（BFS）逐层从左到右</text>
    <text x="16" y="52" font-size="12" fill="#64748b">用途：求树高 / 按层打印 / 无权重图上求最短路</text>
    <line x1="230" y1="100" x2="160" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="230" y1="100" x2="300" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="175" x2="125" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="175" x2="195" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="300" y1="175" x2="335" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="230" cy="100" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="230" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1e40af">1</text>
    <circle cx="160" cy="175" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="160" y="175" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">2</text>
    <circle cx="300" cy="175" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="300" y="175" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">3</text>
    <circle cx="125" cy="250" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="125" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">4</text>
    <circle cx="195" cy="250" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="195" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">5</text>
    <circle cx="335" cy="250" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="335" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">6</text>
    <circle cx="244" cy="86" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="244" y="86" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">1</text>
    <circle cx="174" cy="161" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="174" y="161" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">2</text>
    <circle cx="314" cy="161" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="314" y="161" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">3</text>
    <circle cx="139" cy="236" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="139" y="236" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">4</text>
    <circle cx="209" cy="236" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="209" y="236" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">5</text>
    <circle cx="349" cy="236" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="349" y="236" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#92400e">6</text>
    <text x="16" y="292" font-size="13.5" font-weight="bold" fill="#1e40af">层序结果：1 2 3 4 5 6（逐层切开 [[1] [2 3] [4 5 6]]）</text>
    <text x="16" y="314" font-size="12" fill="#334155">按层处理技巧：出队前先记下当前队列长度，那一批就是同一层</text>
  </g>
</svg>
