<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">红黑树：靠两条颜色性质把树高夹在 O(log n)</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">性质 4 限制「红色不连续」、性质 5 限制「黑分布均匀」，两者合起来给出 最长 &lt; 2 × 最短</text>

    <g transform="translate(20,70)">
    <rect x="0" y="0" width="470" height="410" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">五条性质画在一棵树上（黑高怎么数）</text>
    <text x="16" y="54" font-size="12" fill="#64748b">深色实心 = 黑结点，浅红 = 红结点；NIL 叶子图里省略，数黑高时按黑算</text>
    <line x1="235" y1="100" x2="150" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="235" y1="100" x2="320" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="150" y1="165" x2="90" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="150" y1="165" x2="210" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="320" y1="165" x2="280" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="320" y1="165" x2="370" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="210" y1="230" x2="175" y2="295" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="370" y1="230" x2="410" y2="295" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="235" y1="100" x2="150" y2="165" stroke="#2563eb" stroke-width="4" stroke-dasharray="6 4"/>
    <line x1="150" y1="165" x2="90" y2="230" stroke="#2563eb" stroke-width="4" stroke-dasharray="6 4"/>
    <line x1="150" y1="165" x2="210" y2="230" stroke="#b45309" stroke-width="4" stroke-dasharray="6 4"/>
    <line x1="210" y1="230" x2="175" y2="295" stroke="#b45309" stroke-width="4" stroke-dasharray="6 4"/>
    <circle cx="235" cy="100" r="18" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="235" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#f8fafc">13</text>
    <circle cx="150" cy="165" r="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="150" y="165" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#7f1d1d">8</text>
    <circle cx="320" cy="165" r="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="320" y="165" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#7f1d1d">17</text>
    <circle cx="90" cy="230" r="18" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="90" y="230" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#f8fafc">1</text>
    <circle cx="210" cy="230" r="18" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="210" y="230" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#f8fafc">11</text>
    <circle cx="280" cy="230" r="18" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="280" y="230" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#f8fafc">16</text>
    <circle cx="370" cy="230" r="18" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="370" y="230" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#f8fafc">25</text>
    <circle cx="175" cy="295" r="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="175" y="295" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#7f1d1d">9</text>
    <circle cx="410" cy="295" r="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="410" y="295" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#7f1d1d">27</text>
    <text x="60" y="336" font-size="12" fill="#1e40af">蓝虚线 13→8→1→NIL：路径 3 个结点，其中黑 2（1 与 NIL）</text>
    <text x="60" y="356" font-size="12" fill="#b45309">橙虚线 13→8→11→9→NIL：路径 4 个结点，其中黑 2（11 与 NIL）</text>
    <text x="16" y="382" font-size="13" fill="#334155">性质 5：不含起点、含 NIL 的黑节点数处处相同（每路都是 2）</text>
    <text x="16" y="402" font-size="13" fill="#334155">性质 4：红结点不相邻 → 红不多于黑 → 路径长度 ≤ 2 × 黑数</text>
  </g>

    <g transform="translate(510,70)">
    <rect x="0" y="0" width="470" height="165" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">高度界就是这么夹出来的</text>
    <text x="16" y="58" font-size="13" fill="#334155">设某结点黑高 bh（含 NIL、不含起点）</text>
    <text x="16" y="78" font-size="13" fill="#334155">最短：那条全黑的路径 → 长度 = bh（下界）</text>
    <text x="16" y="98" font-size="13" fill="#334155">最长：红黑相间那条 → 长度 ≤ 2·bh − 1（红 ≤ 黑）</text>
    <text x="16" y="118" font-size="13" fill="#334155">合起来 最长 / 最短 ≤ (2bh − 1) / bh &lt; 2 → 树高 O(log n)</text>
    <text x="16" y="144" font-size="12" fill="#334155">界：AVL ≤ 1.44 log₂ n　　红黑 ≤ 2 log₂(n+1)　　普通 BST 退化 n</text>
  </g>

    <g transform="translate(510,255)">
    <rect x="0" y="0" width="470" height="225" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">性质校验器实测（n = 10000 随机键）</text>
    <text x="16" y="54" font-size="12" fill="#64748b">五条性质是不变量，而旋转 / 变色的 case 极易写错</text>
    <text x="16" y="78" font-size="12.5" fill="#334155">插入 1..n 的随机排列 → 性质 1~5 全部通过（根 = 5804）</text>
    <text x="16" y="102" font-size="12.5" fill="#334155">整树黑高（NIL 也算黑）= 9</text>
    <text x="16" y="122" font-size="12.5" fill="#334155">最长根到叶路径 16 个结点、最短 11 个 → 16 / 11 = 1.45 &lt; 2 通过</text>
    <text x="16" y="150" font-size="12.5" fill="#334155">故意破坏，验证校验器真的在查：</text>
    <text x="16" y="170" font-size="12.5" fill="#334155">(a) 把根染红 → 性质 2 失败</text>
    <text x="16" y="190" font-size="12.5" fill="#334155">(b) 把红结点 2737 的孩子染红 → 性质 4 失败</text>
    <text x="16" y="216" font-size="12.5" fill="#334155">校验器若永远只报「通过」，你没法确认它真的在检查。</text>
  </g>

</svg>
