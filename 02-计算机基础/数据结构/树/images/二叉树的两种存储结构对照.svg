<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一个逻辑结构，两种物理存储：链式指针 vs 数组下标</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">链式通用但缓存不友好；数组只对完全二叉树友好 —— 堆选数组、BST 选指针，分岔点就在这里</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="460" height="530" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">链式存储：节点内放左右指针</text>
    <text x="16" y="52" font-size="12" fill="#64748b">结构体 = 数据 + 左孩子指针 + 右孩子指针</text>

    <rect x="60" y="72" width="340" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="160" y1="72" x2="160" y2="118" stroke="#2563eb" stroke-width="1"/>
    <line x1="270" y1="72" x2="270" y2="118" stroke="#2563eb" stroke-width="1"/>
    <text x="110" y="95" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#1e40af">数据 val</text>
    <text x="215" y="95" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#1e40af">左指针 *left</text>
    <text x="325" y="95" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#1e40af">右指针 *right</text>

    <line x1="230" y1="160" x2="160" y2="222" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="230" y1="160" x2="300" y2="222" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="222" x2="125" y2="284" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="222" x2="195" y2="284" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="300" y1="222" x2="335" y2="284" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="230" cy="160" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="230" y="160" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">1</text>
    <circle cx="160" cy="222" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="160" y="222" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">2</text>
    <circle cx="300" cy="222" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="300" y="222" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">3</text>
    <circle cx="125" cy="284" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="125" y="284" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">4</text>
    <circle cx="195" cy="284" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="195" y="284" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">5</text>
    <circle cx="335" cy="284" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="335" y="284" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">6</text>

    <text x="16" y="336" font-size="12.5" fill="#334155">✅ 优点：任意形态的二叉树都能存，增删只改两个指针</text>
    <text x="16" y="358" font-size="12.5" fill="#b45309">⚠️ 缺点①：节点分散在堆上，指针一跳常常就是一次 cache miss</text>
    <text x="16" y="380" font-size="12.5" fill="#b45309">⚠️ 缺点②：每个节点多两个指针（64 位下 16 字节）的额外开销</text>
    <text x="16" y="402" font-size="12.5" fill="#b45309">⚠️ 缺点③：无法按下标随机访问第 k 个节点</text>
    <text x="16" y="432" font-size="12.5" fill="#334155">为什么 BST / AVL / 红黑树都用它：</text>
    <text x="16" y="454" font-size="12" fill="#64748b">这些结构随时在旋转、分裂、合并 —— 节点位置一直在变，</text>
    <text x="16" y="474" font-size="12" fill="#64748b">而数组存储要求「位置固定且由下标唯一决定」，两者根本不兼容。</text>
    <text x="16" y="504" font-size="12" fill="#1e40af">⭐ 结论：需要「结构会变形」→ 链式；需要「形态固定且紧凑」→ 数组</text>
  </g>

  <g transform="translate(520,70)">
    <rect x="0" y="0" width="460" height="530" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">顺序存储：下标即父子关系</text>
    <text x="16" y="52" font-size="12" fill="#64748b">从 0 开始编号：父 i → 左孩子 2i+1、右孩子 2i+2（求父：⌊(i−1)/2⌋）</text>

    <line x1="120" y1="98" x2="80" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="120" y1="98" x2="160" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="80" y1="150" x2="60" y2="202" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="80" y1="150" x2="100" y2="202" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="150" x2="140" y2="202" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="150" x2="180" y2="202" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="120" cy="98" r="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="120" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#334155">1</text>
    <circle cx="80" cy="150" r="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="80" y="150" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#334155">2</text>
    <circle cx="160" cy="150" r="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="160" y="150" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#334155">3</text>
    <circle cx="60" cy="202" r="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="60" y="202" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#334155">4</text>
    <circle cx="100" cy="202" r="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="100" y="202" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#334155">5</text>
    <circle cx="140" cy="202" r="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="140" y="202" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#334155">6</text>
    <circle cx="180" cy="202" r="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="180" y="202" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#334155">7</text>

    <text x="250" y="110" font-size="12" fill="#1e40af">同一个完全二叉树</text>
    <text x="250" y="132" font-size="12" fill="#1e40af">落到数组里就是一行：</text>
    <text x="250" y="154" font-size="12" fill="#64748b">节点 3 的下标 = 2</text>
    <text x="250" y="176" font-size="12" fill="#64748b">它的孩子在 5、6 号格</text>

    <rect x="330" y="192" width="30" height="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <rect x="360" y="192" width="30" height="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <rect x="390" y="192" width="30" height="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <rect x="420" y="192" width="30" height="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>

    <text x="16" y="248" font-size="12" fill="#64748b">下标</text>
    <text x="16" y="276" font-size="12" fill="#64748b">值</text>
    <rect x="52" y="256" width="34" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <rect x="86" y="256" width="34" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <rect x="120" y="256" width="34" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <rect x="154" y="256" width="34" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <rect x="188" y="256" width="34" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <rect x="222" y="256" width="34" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <rect x="256" y="256" width="34" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="69" y="269" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">0</text>
    <text x="103" y="269" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">1</text>
    <text x="137" y="269" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">2</text>
    <text x="171" y="269" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">3</text>
    <text x="205" y="269" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">4</text>
    <text x="239" y="269" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">5</text>
    <text x="273" y="269" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">6</text>
    <text x="69" y="248" text-anchor="middle" font-size="11" fill="#1e40af">0</text>
    <text x="103" y="248" text-anchor="middle" font-size="11" fill="#1e40af">1</text>
    <text x="137" y="248" text-anchor="middle" font-size="11" fill="#1e40af">2</text>
    <text x="171" y="248" text-anchor="middle" font-size="11" fill="#1e40af">3</text>
    <text x="205" y="248" text-anchor="middle" font-size="11" fill="#1e40af">4</text>
    <text x="239" y="248" text-anchor="middle" font-size="11" fill="#1e40af">5</text>
    <text x="273" y="248" text-anchor="middle" font-size="11" fill="#1e40af">6</text>
    <text x="310" y="269" font-size="12" fill="#14532d">← 一格不浪费</text>

    <text x="16" y="316" font-size="13" font-weight="bold" fill="#0f172a">代价：斜树在数组里下标指数增长（本机容器实测）</text>
    <text x="16" y="342" font-size="12" fill="#1e40af">形态        节点数   数组须开格子数   浪费率</text>
    <text x="16" y="366" font-size="12" fill="#14532d">完全二叉树      15              15        0%</text>
    <text x="16" y="390" font-size="12" fill="#b45309">右斜树          5              31     83.9%</text>
    <text x="16" y="414" font-size="12" fill="#b45309">右斜树         10            1023     99.0%</text>
    <text x="16" y="438" font-size="12" fill="#b45309">右斜树         20         1048575      近 100%</text>
    <text x="16" y="466" font-size="12" fill="#334155">右斜树每个节点都是右孩子 → 下标 = 2^(k+1) − 2 → 指数爆炸</text>
    <text x="16" y="492" font-size="12" fill="#1e40af">⭐ 所以顺序存储只对完全二叉树友好，而堆恰好是完全二叉树</text>
    <text x="16" y="514" font-size="12" fill="#64748b">⚠️ 普通二叉树若硬用数组，必须先按完全二叉树补空 → 空位也是内存</text>
  </g>
</svg>
