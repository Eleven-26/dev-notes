  <g transform="translate(668,74)">
    <rect x="0" y="0" width="312" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="26" font-size="14" font-weight="bold" fill="#0f172a">斜树</text>
    <text x="14" y="46" font-size="11" fill="#64748b">每个节点只有一个孩子（本图全为右孩子）</text>

    <line x1="56" y1="88" x2="100" y2="134" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="100" y1="134" x2="144" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="144" y1="180" x2="188" y2="226" stroke="#94a3b8" stroke-width="1.5"/>
