  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">满二叉树 / 完全二叉树 / 斜树：差别只在「空位在哪」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">满树一个空位都没有；完全树只允许缺最右边；斜树把空位浪费到极致 —— 这直接决定节点数公式与数组存法的代价</text>

