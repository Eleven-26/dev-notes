    <text x="14" y="336" font-size="11.5" fill="#334155">每层都排满，没有任何空位</text>
    <text x="14" y="358" font-size="11.5" fill="#334155">4 层 → 节点数 = 2^4 − 1 = 15</text>
    <text x="14" y="380" font-size="11.5" fill="#14532d">数组刚好 15 格，零浪费 ✅</text>
  </g>

  <g transform="translate(344,74)">
