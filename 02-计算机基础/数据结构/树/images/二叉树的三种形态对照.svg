    <text x="156" y="88" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="bold" fill="#1e40af">1</text>
    <circle cx="80" cy="148" r="13" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="80" y="148" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#334155">2</text>
    <circle cx="232" cy="148" r="13" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
