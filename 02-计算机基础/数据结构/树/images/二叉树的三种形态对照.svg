    <text x="188" y="226" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#334155">4</text>
    <circle cx="232" cy="272" r="13" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="232" y="272" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#14532d">5</text>

    <text x="14" y="296" font-size="10" fill="#b45309">每个节点只有右孩子，没有左孩子</text>

    <line x1="14" y1="312" x2="298" y2="312" stroke="#e2e8f0"/>
    <text x="14" y="336" font-size="11.5" fill="#334155">每个节点只有一个孩子 → 退化成链表</text>
    <text x="14" y="358" font-size="11.5" fill="#334155">节点数 5 → 树高 = 5（完全二叉树只需 3 层）</text>
    <text x="14" y="380" font-size="11.5" fill="#b45309">数组须开 31 格，浪费 83.9% ⚠️</text>
  </g>

  <g transform="translate(20,486)">
    <rect x="0" y="0" width="960" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" font-size="14" font-weight="bold" fill="#0f172a">包含关系与「空位」判据</text>

    <rect x="16" y="44" width="520" height="94" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="26" y="62" font-size="12" font-weight="bold" fill="#0f172a">二叉树</text>
    <rect x="44" y="70" width="340" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="54" y="88" font-size="12" font-weight="bold" fill="#1e40af">完全二叉树</text>
    <rect x="70" y="96" width="170" height="28" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="80" y="114" font-size="12" font-weight="bold" fill="#14532d">满二叉树</text>
    <rect x="396" y="70" width="126" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-dasharray="4 3"/>
    <text x="410" y="90" font-size="12" font-weight="bold" fill="#b45309">斜树</text>
    <text x="410" y="110" font-size="10" fill="#b45309">除 n=1 外</text>

    <text x="560" y="76" font-size="11.5" fill="#334155">① 满：每层排满，节点数恰为 2^k − 1</text>
    <text x="560" y="104" font-size="11.5" fill="#334155">② 完全：从上到下、从左到右连续编号</text>
    <text x="560" y="132" font-size="11.5" fill="#334155">③ 斜：每个节点只有一个孩子 → 树高 = n</text>
