<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">AVL 的选型决策树：先问数据在哪，再问读写比</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">四条路径分别落到 B+ 树 / AVL / 红黑树 / 跳表；本图为判据示意，不含实测读数</text>

  <rect x="30" y="100" width="210" height="56" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="135" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">先问：数据在内存吗？</text>
  <text x="135" y="142" text-anchor="middle" font-size="10.5" fill="#1e3a8a">介质是第一道硬分界</text>

  <rect x="290" y="70" width="200" height="48" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="390" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">否：磁盘 → B+ 树</text>

  <rect x="290" y="180" width="200" height="56" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="390" y="203" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">是：内存 → 写多吗？</text>
  <text x="390" y="222" text-anchor="middle" font-size="10.5" fill="#1e3a8a">读写比是第二道分界</text>

  <rect x="560" y="170" width="210" height="56" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="665" y="193" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">读多 → 要硬最坏界吗？</text>
  <text x="665" y="212" text-anchor="middle" font-size="10.5" fill="#475569">要的是「任何时刻都 ≤ 某界」</text>

  <rect x="560" y="310" width="210" height="56" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="665" y="333" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">写多 → 要并发写吗？</text>
  <text x="665" y="352" text-anchor="middle" font-size="10.5" fill="#475569">并发下旋转要加锁</text>

  <rect x="830" y="140" width="130" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="895" y="169" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">要 → AVL</text>
  <rect x="830" y="220" width="130" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="895" y="249" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">不要 → 红黑树</text>
  <rect x="830" y="320" width="130" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="895" y="349" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">要 → 跳表</text>
  <rect x="830" y="400" width="130" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="895" y="429" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">不要 → 红黑树</text>

  <path d="M 240 128 L 265 128 L 265 94 L 290 94" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#ad)"/>
  <path d="M 240 128 L 265 128 L 265 208 L 290 208" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#ad)"/>
  <path d="M 490 208 L 525 208 L 525 198 L 560 198" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#ad)"/>
  <path d="M 390 236 L 390 338 L 560 338" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#ad)"/>
  <path d="M 770 198 L 800 198 L 800 164 L 830 164" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#ad)"/>
  <path d="M 770 198 L 800 198 L 800 244 L 830 244" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#ad)"/>
  <path d="M 770 338 L 800 338 L 800 344 L 830 344" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#ad)"/>
  <path d="M 770 338 L 800 338 L 800 424 L 830 424" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#ad)"/>

  <rect x="30" y="470" width="940" height="170" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="498" font-size="13" font-weight="bold" fill="#1e40af">判据：AVL 的甜点区只有一句话——读远多于写，且要硬最坏界</text>
  <text x="46" y="528" font-size="12" fill="#1e3a8a">读远多于写 + 要硬最坏界 → AVL：树高 ≤ 1.44 log₂n，是平衡树里最紧的常数</text>
  <text x="46" y="554" font-size="12" fill="#1e3a8a">写多 / 读写混杂 → 红黑树：插入最多 2 次旋转、删除最多 3 次，维护代价被摊薄</text>
  <text x="46" y="580" font-size="12" fill="#1e3a8a">写极多 + 并发 → 跳表：没有旋转，并发控制更简单</text>
  <text x="46" y="606" font-size="12" fill="#1e3a8a">数据在磁盘 → B+ 树：平衡单位从「节点」换成「页」</text>
  <text x="46" y="632" font-size="12" fill="#b91c1c">常数更小 ≠ 更实用：随机插入下高度差很小，维护代价却是实打实多出来的</text>
</svg>
