<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="650" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一棵退化链，四条平衡路线：旋转、颜色、分裂、掷骰子</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">AVL 与红黑树修「一个节点」，B+ 树修「一个页」，跳表不修复、只买概率保证</text>

  <g>
    <rect x="30" y="76" width="940" height="74" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <text x="50" y="100" font-size="15" font-weight="bold" fill="#0f172a">退化现场（1.1 实测）：升序插入的 BST 长出一条链</text>
    <circle cx="560" cy="126" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="560" y="130" text-anchor="middle" font-size="11" fill="#0f172a">10</text>
    <circle cx="620" cy="126" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="620" y="130" text-anchor="middle" font-size="11" fill="#0f172a">20</text>
    <circle cx="680" cy="126" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="680" y="130" text-anchor="middle" font-size="11" fill="#0f172a">30</text>
    <circle cx="740" cy="126" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="740" y="130" text-anchor="middle" font-size="11" fill="#0f172a">40</text>
    <line x1="572" y1="126" x2="604" y2="126" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
    <line x1="632" y1="126" x2="664" y2="126" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
    <line x1="692" y1="126" x2="724" y2="126" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
    <text x="768" y="130" font-size="12.5" fill="#dc2626">树高 = n，查询退化成链表</text>
  </g>

  <g>
    <rect x="30" y="170" width="460" height="200" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="44" y="196" font-size="15" font-weight="bold" fill="#1e40af">路线一：AVL —— 旋转（严格平衡）</text>
    <text x="44" y="218" font-size="12.5" fill="#334155">失衡就重接父子指针，一次只动三个节点，中序不变</text>
    <circle cx="90" cy="265" r="13" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="90" y="269" text-anchor="middle" font-size="11" fill="#0f172a">10</text>
    <circle cx="120" cy="295" r="13" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="120" y="299" text-anchor="middle" font-size="11" fill="#0f172a">20</text>
    <circle cx="150" cy="325" r="13" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="150" y="329" text-anchor="middle" font-size="11" fill="#0f172a">30</text>
    <line x1="99" y1="275" x2="111" y2="285" stroke="#334155" stroke-width="1.5"/>
    <line x1="129" y1="305" x2="141" y2="315" stroke="#334155" stroke-width="1.5"/>
    <line x1="185" y1="292" x2="235" y2="292" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
    <text x="188" y="282" font-size="11" fill="#1e40af">旋转</text>
    <circle cx="320" cy="255" r="13" fill="#2563eb"/>
    <text x="320" y="259" text-anchor="middle" font-size="11" fill="#ffffff">20</text>
    <circle cx="270" cy="315" r="13" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="270" y="319" text-anchor="middle" font-size="11" fill="#0f172a">10</text>
    <circle cx="370" cy="315" r="13" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="370" y="319" text-anchor="middle" font-size="11" fill="#0f172a">30</text>
    <line x1="310" y1="266" x2="281" y2="304" stroke="#334155" stroke-width="1.5"/>
    <line x1="330" y1="266" x2="359" y2="304" stroke="#334155" stroke-width="1.5"/>
    <text x="425" y="290" font-size="11" fill="#64748b" text-anchor="middle">失衡 → 平衡</text>
    <text x="44" y="352" font-size="12" fill="#1e40af">高度差 ≤ 1；树高 ≤ 1.44 log₂n；删除可能沿路径多次旋转</text>
  </g>

  <g>
    <rect x="510" y="170" width="460" height="200" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="524" y="196" font-size="15" font-weight="bold" fill="#991b1b">路线二：红黑树 —— 颜色（弱平衡）</text>
    <text x="524" y="218" font-size="12.5" fill="#334155">用一个颜色 bit 换有限的修复 case：插入至多 2 次旋转</text>
    <circle cx="740" cy="255" r="13" fill="#334155"/>
    <text x="740" y="259" text-anchor="middle" font-size="11" fill="#ffffff">20</text>
    <circle cx="680" cy="305" r="13" fill="#334155"/>
    <text x="680" y="309" text-anchor="middle" font-size="11" fill="#ffffff">10</text>
    <circle cx="800" cy="305" r="13" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="800" y="309" text-anchor="middle" font-size="11" fill="#0f172a">30</text>
    <line x1="729" y1="266" x2="691" y2="294" stroke="#334155" stroke-width="1.5"/>
    <line x1="751" y1="266" x2="789" y2="294" stroke="#334155" stroke-width="1.5"/>
    <rect x="850" y="246" width="14" height="14" fill="#334155"/>
    <text x="872" y="258" font-size="12" fill="#334155">黑节点</text>
    <rect x="850" y="274" width="14" height="14" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="872" y="286" font-size="12" fill="#334155">红节点</text>
    <text x="524" y="352" font-size="12" fill="#991b1b">最长路径 ≤ 2 × 最短；树高 ≤ 2 log₂(n+1)，写维护最省</text>
  </g>

  <g>
    <rect x="30" y="390" width="460" height="200" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="44" y="416" font-size="15" font-weight="bold" fill="#14532d">路线三：B+ 树 —— 分裂与合并（按页平衡）</text>
    <text x="44" y="438" font-size="12.5" fill="#334155">一页装不下就分裂，中间键上推父节点</text>
    <rect x="190" y="460" width="90" height="32" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="235" y="480" text-anchor="middle" font-size="12" fill="#0f172a">30</text>
    <rect x="70" y="525" width="120" height="32" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="130" y="545" text-anchor="middle" font-size="12" fill="#0f172a">10 20</text>
    <rect x="290" y="525" width="120" height="32" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="350" y="545" text-anchor="middle" font-size="12" fill="#0f172a">40 50</text>
    <line x1="210" y1="492" x2="150" y2="525" stroke="#334155" stroke-width="1.5"/>
    <line x1="260" y1="492" x2="330" y2="525" stroke="#334155" stroke-width="1.5"/>
    <text x="420" y="480" font-size="11" fill="#64748b">中间键上推</text>
    <text x="420" y="545" font-size="11" fill="#64748b">一分为二</text>
    <text x="44" y="578" font-size="12" fill="#14532d">平衡单位是页：扇出几百~上千，10⁷ 行约 3 层（层数 = I/O）</text>
  </g>

  <g>
    <rect x="510" y="390" width="460" height="200" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="524" y="416" font-size="15" font-weight="bold" fill="#9a3412">路线四：跳表 —— 随机层数（不修复）</text>
    <text x="524" y="438" font-size="12.5" fill="#334155">层数由插入时掷骰子决定，增删后无需任何修复动作</text>
    <rect x="560" y="462" width="42" height="22" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
    <text x="581" y="477" text-anchor="middle" font-size="11" fill="#0f172a">1</text>
    <rect x="760" y="462" width="42" height="22" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
    <text x="781" y="477" text-anchor="middle" font-size="11" fill="#0f172a">9</text>
    <line x1="602" y1="473" x2="760" y2="473" stroke="#334155" stroke-width="1.2"/>
    <rect x="560" y="498" width="42" height="22" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
    <text x="581" y="513" text-anchor="middle" font-size="11" fill="#0f172a">1</text>
    <rect x="660" y="498" width="42" height="22" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
    <text x="681" y="513" text-anchor="middle" font-size="11" fill="#0f172a">6</text>
    <rect x="760" y="498" width="42" height="22" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
    <text x="781" y="513" text-anchor="middle" font-size="11" fill="#0f172a">9</text>
    <line x1="602" y1="509" x2="760" y2="509" stroke="#334155" stroke-width="1.2"/>
    <rect x="560" y="534" width="42" height="22" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
    <text x="581" y="549" text-anchor="middle" font-size="11" fill="#0f172a">1</text>
    <rect x="610" y="534" width="42" height="22" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
    <text x="631" y="549" text-anchor="middle" font-size="11" fill="#0f172a">3</text>
    <rect x="660" y="534" width="42" height="22" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
    <text x="681" y="549" text-anchor="middle" font-size="11" fill="#0f172a">6</text>
    <rect x="710" y="534" width="42" height="22" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
    <text x="731" y="549" text-anchor="middle" font-size="11" fill="#0f172a">7</text>
    <rect x="760" y="534" width="42" height="22" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
    <text x="781" y="549" text-anchor="middle" font-size="11" fill="#0f172a">9</text>
    <line x1="602" y1="545" x2="710" y2="545" stroke="#334155" stroke-width="1.2"/>
    <line x1="752" y1="545" x2="760" y2="545" stroke="#334155" stroke-width="1.2"/>
    <text x="850" y="477" font-size="12" fill="#64748b">L2（随机子集）</text>
    <text x="850" y="513" font-size="12" fill="#64748b">L1</text>
    <text x="850" y="549" font-size="12" fill="#64748b">L0 完整链表</text>
    <text x="524" y="578" font-size="12" fill="#9a3412">每层期望减半 → 期望 O(log n)；⚠️ 放弃最坏保证，换并发与极简实现</text>
  </g>

  <text x="30" y="624" font-size="12.5" fill="#334155">四条路线买的都是同一样东西：把「树高 O(log n)」从输入的运气，变成结构自己维持的不变量。</text>
</svg>
