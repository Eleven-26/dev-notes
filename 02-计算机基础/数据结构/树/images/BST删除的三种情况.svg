<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 384" width="1000" height="384" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="384" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">BST 删除的三种情况：同一棵树上的三次删除</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">每步删完中序都仍然升序 —— 这是「删对了」的唯一验尸口径（下方序列为实测输出逐字抄录）</text>

  <g transform="translate(20,78)">
    <rect x="0" y="0" width="306" height="286" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">情况① 叶子：直接摘掉</text>
    <text x="16" y="52" font-size="12" fill="#64748b">删 20（左右孩子都是 nil）</text>
    <line x1="153" y1="82" x2="93" y2="142" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="153" y1="82" x2="213" y2="142" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="93" y1="142" x2="63" y2="202" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="93" y1="142" x2="123" y2="202" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="213" y1="142" x2="183" y2="202" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="213" y1="142" x2="243" y2="202" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="153" cy="82" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="153" y="82" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">50</text>
    <circle cx="93" cy="142" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="93" y="142" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">30</text>
    <circle cx="213" cy="142" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="213" y="142" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">70</text>
    <circle cx="63" cy="202" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="63" y="202" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#7f1d1d">20</text>
    <circle cx="123" cy="202" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="123" y="202" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">40</text>
    <circle cx="183" cy="202" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="183" y="202" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">60</text>
    <circle cx="243" cy="202" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="243" y="202" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">80</text>
    <text x="16" y="242" font-size="12.5" fill="#334155">只动父节点的一个指针：20 消失</text>
    <text x="16" y="266" font-size="12.5" fill="#0f172a">中序：30 40 50 60 70 80</text>
  </g>

  <g transform="translate(346,78)">
    <rect x="0" y="0" width="306" height="286" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">情况② 单孩子：孩子顶替</text>
    <text x="16" y="52" font-size="12" fill="#64748b">删 30（只剩右孩子 40）</text>
    <line x1="153" y1="82" x2="93" y2="142" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="153" y1="82" x2="213" y2="142" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="93" y1="142" x2="123" y2="202" stroke="#22c55e" stroke-width="1.5"/>
    <line x1="213" y1="142" x2="183" y2="202" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="213" y1="142" x2="243" y2="202" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="153" cy="82" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="153" y="82" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">50</text>
    <circle cx="93" cy="142" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="93" y="142" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#7f1d1d">30</text>
    <circle cx="213" cy="142" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="213" y="142" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">70</text>
    <circle cx="123" cy="202" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="123" y="202" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#14532d">40</text>
    <circle cx="183" cy="202" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="183" y="202" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">60</text>
    <circle cx="243" cy="202" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="243" y="202" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">80</text>
    <text x="16" y="242" font-size="12.5" fill="#334155">子树整体上移：40 接到 50 左边</text>
    <text x="16" y="266" font-size="12.5" fill="#0f172a">中序：40 50 60 70 80</text>
  </g>

  <g transform="translate(672,78)">
    <rect x="0" y="0" width="306" height="286" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">情况③ 双孩子：后继顶替</text>
    <text x="16" y="52" font-size="12" fill="#64748b">删 50（中序后继 = 60）</text>
    <line x1="153" y1="82" x2="93" y2="142" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="153" y1="82" x2="213" y2="142" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="93" y1="142" x2="63" y2="202" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="213" y1="142" x2="183" y2="202" stroke="#22c55e" stroke-width="1.5"/>
    <line x1="213" y1="142" x2="243" y2="202" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="153" cy="82" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="153" y="82" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#7f1d1d">50</text>
    <circle cx="93" cy="142" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="93" y="142" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">40</text>
    <circle cx="213" cy="142" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="213" y="142" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">70</text>
    <circle cx="63" cy="202" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="63" y="202" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">20</text>
    <circle cx="183" cy="202" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="183" y="202" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#14532d">60</text>
    <circle cx="243" cy="202" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="243" y="202" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">80</text>
    <text x="16" y="242" font-size="12.5" fill="#334155">60 顶替 50，再接上它的左右子树</text>
    <text x="16" y="266" font-size="12.5" fill="#0f172a">中序：40 60 70 80</text>
  </g>

  <text x="500" y="378" text-anchor="middle" font-size="12" fill="#64748b">红虚线 = 被删节点　绿圈 = 顶替者　·　三种情况的判据只看「左 / 右孩子是否为 nil」，与节点位置无关</text>
</svg>
