<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 574" width="1000" height="574" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="574" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">内存布局对照：一条 64 B 的 cache line 里有多少字节「接下来要用」</text>
  <text x="500" y="53" text-anchor="middle" font-size="12.5" fill="#64748b">字节账取自 1.2 与第二节谱系表；树高、访问次数与倍率区间取自 3.2 / 3.3 实测（n = 1 000 000）</text>

  <text x="30" y="86" font-size="13.5" font-weight="bold" fill="#14532d">数组化 []int64：一条 line = 64 B，被 8 个 int64 填满</text>
  <rect x="30" y="96" width="100" height="46" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="130" y="96" width="100" height="46" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="230" y="96" width="100" height="46" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="330" y="96" width="100" height="46" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="430" y="96" width="100" height="46" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="530" y="96" width="100" height="46" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="630" y="96" width="100" height="46" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="730" y="96" width="100" height="46" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="80" y="124" font-size="12" fill="#14532d">8 B</text>
  <text x="180" y="124" font-size="12" fill="#14532d">8 B</text>
  <text x="280" y="124" font-size="12" fill="#14532d">8 B</text>
  <text x="380" y="124" font-size="12" fill="#14532d">8 B</text>
  <text x="480" y="124" font-size="12" fill="#14532d">8 B</text>
  <text x="580" y="124" font-size="12" fill="#14532d">8 B</text>
  <text x="680" y="124" font-size="12" fill="#14532d">8 B</text>
  <text x="780" y="124" font-size="12" fill="#14532d">8 B</text>
  <text x="846" y="112" font-size="12" fill="#16a34a">一次</text>
  <text x="846" y="130" font-size="12" fill="#16a34a">缺失</text>
  <text x="30" y="164" font-size="11.5" fill="#334155">节点 i 的孩子固定在 2i+1 / 2i+2：位置由下标算出来，树根本没有指针 → 一次缺失换回的 8 个值全部有用，摊到每个元素只有 1/8 次缺失</text>

  <text x="30" y="200" font-size="13.5" font-weight="bold" fill="#7c2d12">指针化 struct{val int; left, right *node} = 24 B：同一条 line 只有 3 格属于「我」</text>
  <rect x="30" y="210" width="100" height="46" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <rect x="130" y="210" width="100" height="46" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <rect x="230" y="210" width="100" height="46" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <rect x="330" y="210" width="500" height="46" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="46" y="238" font-size="12" fill="#7c2d12">val 8 B</text>
  <text x="146" y="238" font-size="12" fill="#7c2d12">left 8 B</text>
  <text x="246" y="238" font-size="12" fill="#7c2d12">right 8 B</text>
  <text x="580" y="238" text-anchor="middle" font-size="12" fill="#64748b">其余 40 B 是邻居节点：下一步根本用不到</text>
  <text x="846" y="226" font-size="12" fill="#dc2626">一次</text>
  <text x="846" y="244" font-size="12" fill="#dc2626">缺失</text>
  <text x="30" y="278" font-size="11.5" fill="#334155">有用数据 / 总字节 = 24 / 64：一次缺失只换回一个节点，几乎每次下降都要跨一条新 line；地址还是数据依赖的，预取器无从下手</text>

  <text x="30" y="316" font-size="13.5" font-weight="bold" fill="#0f172a">再叠一层：地址翻译的粒度是页（常见 4 KiB），TLB 按页记账</text>
  <rect x="30" y="330" width="410" height="96" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="352" font-size="12.5" font-weight="bold" fill="#14532d">数组化：元素挤在连续的页里</text>
  <rect x="44" y="362" width="60" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="110" y="362" width="60" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="176" y="362" width="60" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="242" y="362" width="60" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="308" y="362" width="60" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="374" y="362" width="60" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="44" y="410" font-size="11.5" fill="#334155">一个 TLB 表项覆盖的元素多</text>

  <rect x="470" y="330" width="460" height="96" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="484" y="352" font-size="12.5" font-weight="bold" fill="#7f1d1d">指针化：节点撒得满内存都是</text>
  <rect x="484" y="362" width="40" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="600" y="362" width="40" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="760" y="362" width="40" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="876" y="362" width="40" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="540" y="386" width="40" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="700" y="386" width="40" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="820" y="386" width="40" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="484" y="410" font-size="11.5" fill="#334155">一次下降踩到多页 → TLB 缺失（page walk）一起收税</text>

  <text x="30" y="452" font-size="13.5" font-weight="bold" fill="#0f172a">这套字节账在实测里兑换成什么（3.2 / 3.3，n = 1 000 000）</text>
  <text x="30" y="476" font-size="12" fill="#334155">指针 BST：节点数 1 000 000、树高 19；三条路径节点访问次数完全相等 = 18 951 546，即平均每次查找探 18.952 个节点</text>
  <text x="30" y="498" font-size="12" fill="#14532d">遍历：B1（指针）/ A1（数组）= 13～18×；B2（打散分配）/ A1 = 56～80× —— 顺序扫描吃满 64 B line 的红利，指针化两样都没有</text>
  <text x="30" y="520" font-size="12" fill="#7f1d1d">随机查找：B1 / A2 只有 2.0～2.4×，B2 / A2 是 2.9～3.6× —— 二分自己也不顺序，19 次探测各落在不同 line 上（8 MB 数组早已超出 L3）</text>
  <text x="30" y="544" font-size="12" fill="#b45309">判据：局部性 = 一次搬运的「有用数据 / 总字节」；惩罚是叠加的 —— cache line 缺失 + TLB 缺失 + 预取器失效，三者指向同一句话</text>
</svg>
