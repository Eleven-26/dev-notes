<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 476" width="1000" height="476" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwN" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#94a3b8"/></marker>
  </defs>

  <rect width="1000" height="476" fill="#ffffff"/>
  <text x="40" y="34" font-size="19" font-weight="bold" fill="#0f172a">可持久化线段树：一次修改只复制「根到叶」这一条链</text>
  <text x="40" y="56" font-size="13" fill="#64748b">其余子树不复制，直接指向旧版本的节点 —— 版本之间共享的是「没被改动的部分」</text>

  <!-- ===== v1 ===== -->
  <text x="150" y="96" font-size="15" font-weight="bold" fill="#334155">版本 v1（旧）</text>
  <!-- 连线 -->
  <line x1="270" y1="140" x2="190" y2="176" stroke="#cbd5e1" stroke-width="1.6"/>
  <line x1="270" y1="140" x2="350" y2="176" stroke="#cbd5e1" stroke-width="1.6"/>
  <line x1="190" y1="204" x2="150" y2="240" stroke="#cbd5e1" stroke-width="1.6"/>
  <line x1="190" y1="204" x2="230" y2="240" stroke="#cbd5e1" stroke-width="1.6"/>
  <line x1="350" y1="204" x2="310" y2="240" stroke="#cbd5e1" stroke-width="1.6"/>
  <line x1="350" y1="204" x2="390" y2="240" stroke="#cbd5e1" stroke-width="1.6"/>
  <!-- 节点 -->
  <circle cx="270" cy="120" r="20" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="264" y="125" font-size="11" fill="#475569">[0,3]</text>
  <circle cx="190" cy="190" r="20" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="184" y="195" font-size="11" fill="#475569">[0,1]</text>
  <circle cx="350" cy="190" r="20" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="344" y="195" font-size="11" fill="#475569">[2,3]</text>
  <circle cx="150" cy="260" r="20" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="144" y="265" font-size="11" fill="#475569">[0]</text>
  <circle cx="230" cy="260" r="20" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="224" y="265" font-size="11" fill="#475569">[1]</text>
  <circle cx="310" cy="260" r="20" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="304" y="265" font-size="11" fill="#475569">[2]</text>
  <circle cx="390" cy="260" r="20" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="384" y="265" font-size="11" fill="#475569">[3]</text>

  <!-- 箭头 v1 -> v2 -->
  <line x1="430" y1="190" x2="576" y2="190" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arwN)"/>
  <text x="452" y="180" font-size="12.5" fill="#64748b">插入一个点</text>

  <!-- ===== v2 ===== -->
  <text x="620" y="96" font-size="15" font-weight="bold" fill="#1d4ed8">版本 v2（新）</text>
  <line x1="730" y1="140" x2="650" y2="176" stroke="#2563eb" stroke-width="2"/>
  <line x1="650" y1="204" x2="610" y2="240" stroke="#2563eb" stroke-width="2"/>
  <line x1="730" y1="140" x2="810" y2="176" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="650" y1="204" x2="690" y2="240" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="810" y1="204" x2="770" y2="240" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="810" y1="204" x2="850" y2="240" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="4 3"/>
  <!-- 新建节点（蓝） -->
  <circle cx="730" cy="120" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="724" y="125" font-size="11" fill="#1d4ed8">[0,3]</text>
  <circle cx="650" cy="190" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="644" y="195" font-size="11" fill="#1d4ed8">[0,1]</text>
  <circle cx="610" cy="260" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="604" y="265" font-size="11" fill="#1d4ed8">[0]</text>
  <!-- 复用节点（虚线） -->
  <circle cx="810" cy="190" r="20" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="804" y="195" font-size="11" fill="#94a3b8">[2,3]</text>
  <circle cx="690" cy="260" r="20" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="684" y="265" font-size="11" fill="#94a3b8">[1]</text>
  <circle cx="770" cy="260" r="20" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="764" y="265" font-size="11" fill="#94a3b8">[2]</text>
  <circle cx="850" cy="260" r="20" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="844" y="265" font-size="11" fill="#94a3b8">[3]</text>

  <text x="596" y="300" font-size="12.5" fill="#1d4ed8">实线蓝圈 = 新建的 3 个节点（根到叶子这条链）</text>
  <text x="596" y="320" font-size="12.5" fill="#64748b">虚线灰圈 = 直接沿用 v1 的节点，不复制</text>

  <!-- 实测 -->
  <rect x="40" y="336" width="920" height="120" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="362" font-size="15" font-weight="bold" fill="#0f172a">实测（容器 Go 1.26.8，n = 20000 个版本，每个版本插入一个点）</text>
  <text x="60" y="390" font-size="13.5" fill="#334155">共用节点总数 307 232，平均每版只新建 <tspan font-weight="bold" fill="#1d4ed8">15.4</tspan> 个（≈ 树高）；若每版完整拷贝则要 39 999 个/版</text>
  <text x="60" y="414" font-size="13.5" fill="#334155">同样的区间第 k 小查询：主席树每次固定探 <tspan font-weight="bold" fill="#1d4ed8">15~16</tspan> 个节点（与区间长度无关），暴力则要排序整个区间</text>
  <text x="60" y="438" font-size="13" fill="#64748b">⭐ 5000 次随机区间查询，主席树与暴力排序的结果不一致 <tspan font-weight="bold" fill="#16a34a">0</tspan> 次。</text>
</svg>
