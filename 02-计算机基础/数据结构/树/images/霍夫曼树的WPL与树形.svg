<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">霍夫曼树：WPL 就是「每个叶子的频率 × 它的深度」之和</text>
  <text x="500" y="60" text-anchor="middle" font-size="14" fill="#64748b">左＝6 符号的树与 WPL 的计算；右＝同一组符号，频率分布不同 → 树形与 WPL 完全不同</text>

  <defs>
    <marker id="hfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ============ 左：6 符号的树与 WPL ============ -->
  <rect x="30" y="86" width="540" height="406" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="300" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">① 霍夫曼树（a:45 b:13 c:12 d:16 e:9 f:5）</text>

  <g stroke="#94a3b8" stroke-width="1.6">
    <line x1="250" y1="168" x2="150" y2="200"/>
    <line x1="250" y1="168" x2="360" y2="200"/>
    <line x1="360" y1="233" x2="300" y2="265"/>
    <line x1="360" y1="233" x2="450" y2="265"/>
    <line x1="300" y1="298" x2="230" y2="330"/>
    <line x1="300" y1="298" x2="330" y2="330"/>
    <line x1="450" y1="298" x2="420" y2="330"/>
    <line x1="450" y1="298" x2="520" y2="330"/>
    <line x1="420" y1="363" x2="390" y2="398"/>
    <line x1="420" y1="363" x2="455" y2="398"/>
  </g>

  <g text-anchor="middle" font-size="13">
    <circle cx="250" cy="152" r="17" fill="#e2e8f0" stroke="#64748b"/>
    <text x="250" y="157" font-weight="bold" fill="#334155">100</text>

    <circle cx="150" cy="215" r="17" fill="#dcfce7" stroke="#16a34a"/>
    <text x="150" y="220" font-weight="bold" fill="#166534">45</text>

    <circle cx="360" cy="215" r="17" fill="#e2e8f0" stroke="#64748b"/>
    <text x="360" y="220" font-weight="bold" fill="#334155">55</text>

    <circle cx="300" cy="280" r="17" fill="#e2e8f0" stroke="#64748b"/>
    <text x="300" y="285" font-weight="bold" fill="#334155">25</text>

    <circle cx="450" cy="280" r="17" fill="#e2e8f0" stroke="#64748b"/>
    <text x="450" y="285" font-weight="bold" fill="#334155">30</text>

    <circle cx="230" cy="345" r="17" fill="#dbeafe" stroke="#2563eb"/>
    <text x="230" y="350" font-weight="bold" fill="#1e3a8a">12</text>

    <circle cx="330" cy="345" r="17" fill="#dbeafe" stroke="#2563eb"/>
    <text x="330" y="350" font-weight="bold" fill="#1e3a8a">13</text>

    <circle cx="420" cy="345" r="17" fill="#e2e8f0" stroke="#64748b"/>
    <text x="420" y="350" font-weight="bold" fill="#334155">14</text>

    <circle cx="520" cy="345" r="17" fill="#dbeafe" stroke="#2563eb"/>
    <text x="520" y="350" font-weight="bold" fill="#1e3a8a">16</text>

    <circle cx="390" cy="413" r="17" fill="#dbeafe" stroke="#2563eb"/>
    <text x="390" y="418" font-weight="bold" fill="#1e3a8a">5</text>

    <circle cx="455" cy="413" r="17" fill="#dbeafe" stroke="#2563eb"/>
    <text x="455" y="418" font-weight="bold" fill="#1e3a8a">9</text>
  </g>

  <g font-size="11.5" fill="#64748b" text-anchor="middle">
    <text x="150" y="243">a · 深度 1</text>
    <text x="230" y="373">c · 深度 3</text>
    <text x="330" y="373">b · 深度 3</text>
    <text x="520" y="373">d · 深度 3</text>
    <text x="390" y="441">f · 深度 4</text>
    <text x="455" y="441">e · 深度 4</text>
  </g>

  <text x="300" y="462" text-anchor="middle" font-size="12.5" fill="#334155">WPL = 45×1 + 12×3 + 13×3 + 16×3 + 5×4 + 9×4 = <tspan font-weight="bold" fill="#2563eb">224 bit</tspan></text>
  <text x="300" y="481" text-anchor="middle" font-size="12" fill="#64748b">绿色 = 高频（浅）、蓝色 = 低频（深）—— 频率越低被推得越深</text>

  <!-- ============ 右：频率分布 → 树形 ============ -->
  <rect x="600" y="86" width="370" height="406" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="785" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">② 同样 16 个符号，分布决定树形</text>

  <g font-size="12.5" fill="#334155">
    <text x="622" y="146">频率全相等（均匀）</text>
    <rect x="622" y="154" width="120" height="18" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="752" y="168" fill="#166534">树高 <tspan font-weight="bold">4</tspan>　WPL 64</text>

    <text x="622" y="212">频率线性递减</text>
    <rect x="622" y="220" width="210" height="18" rx="4" fill="#ffedd5" stroke="#ea580c"/>
    <text x="842" y="234" fill="#9a3412">树高 <tspan font-weight="bold">7</tspan>　WPL 516</text>

    <text x="622" y="278">频率指数递增</text>
    <rect x="622" y="286" width="330" height="18" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="785" y="320" text-anchor="middle" fill="#991b1b">树高 <tspan font-weight="bold">15</tspan>　WPL 131053</text>
  </g>

  <text x="785" y="352" text-anchor="middle" font-size="12.5" fill="#334155">⭐ 均匀 → 完全平衡（高 = log₂n = 4）；</text>
  <text x="785" y="372" text-anchor="middle" font-size="12.5" fill="#334155">指数 → 退化成一条链（高 = n−1 = 15）</text>

  <rect x="622" y="392" width="326" height="86" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="638" y="413" font-size="12.5" font-weight="bold" fill="#1e3a8a">夹逼关系（实测验证）</text>
  <text x="638" y="433" font-size="12.5" fill="#334155">H ≤ WPL &lt; H + 1</text>
  <text x="638" y="453" font-size="12.5" fill="#334155">6 符号：2.2199 ≤ <tspan font-weight="bold">2.2400</tspan> &lt; 3.2199</text>
  <text x="638" y="471" font-size="12.5" fill="#334155">26 字母：4.1758 ≤ <tspan font-weight="bold">4.2051</tspan> &lt; 5.1758（定长 5）</text>

  <!-- 底部实测 -->
  <rect x="30" y="504" width="940" height="60" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="46" y="526" font-size="13" fill="#334155">实测（容器 Go 1.26.8）：26 字母英文频率 → WPL <tspan font-weight="bold">4.2051 bit/符号</tspan>，比定长（5 bit）省 <tspan font-weight="bold">15.9%</tspan>，离熵只差 0.0293；</text>
  <text x="46" y="548" font-size="13" fill="#334155">⭐ 3 叉霍夫曼必须补虚拟叶子（(n−1) % (k−1) == 0）：本例 6 符号、3 叉 → 补 1 个后 WPL 从 <tspan font-weight="bold" fill="#dc2626">181</tspan> 降到 <tspan font-weight="bold" fill="#16a34a">153</tspan></text>
</svg>
