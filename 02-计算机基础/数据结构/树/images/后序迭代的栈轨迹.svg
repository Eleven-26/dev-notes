<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">后序迭代：按「根 → 右 → 左」出栈，最后把输出整体反转</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">左：2.1 反转法的栈轨迹（同一棵树 1/2/4/5/3/6）；右：反转法 / 双栈法 / 单栈 + pre 三种写法对照</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="460" height="610" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="16" font-weight="bold" fill="#0f172a">栈演化：方框从左到右 = 栈底到栈顶</text>

    <text x="16" y="70" font-size="12.5" font-weight="bold" fill="#0f172a">① 弹 1 输出；压左 2、再压右 3（与 preIter 恰好相反）</text>
    <rect x="16" y="82" width="40" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="36" y="97" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1e40af">2</text>
    <rect x="56" y="82" width="40" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
    <text x="76" y="97" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#92400e">3</text>
    <text x="106" y="97" font-size="11.5" fill="#2563eb">← 栈顶</text>
    <text x="16" y="132" font-size="12" fill="#334155">反转前的输出：1（先弹根，所以此刻还不是后序）</text>

    <text x="16" y="186" font-size="12.5" font-weight="bold" fill="#0f172a">② 弹 3 输出；3 无左孩子，只压右 6</text>
    <rect x="16" y="198" width="40" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="36" y="213" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1e40af">2</text>
    <rect x="56" y="198" width="40" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
    <text x="76" y="213" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#92400e">6</text>
    <text x="106" y="213" font-size="11.5" fill="#2563eb">← 栈顶</text>
    <text x="16" y="248" font-size="12" fill="#334155">反转前的输出：1 3（右孩子先出，正是「根→右→左」）</text>

    <text x="16" y="302" font-size="12.5" font-weight="bold" fill="#0f172a">③ 弹 6 输出、弹 2 输出；压左 4、再压右 5</text>
    <rect x="16" y="314" width="40" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="36" y="329" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1e40af">4</text>
    <rect x="56" y="314" width="40" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
    <text x="76" y="329" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#92400e">5</text>
    <text x="106" y="329" font-size="11.5" fill="#2563eb">← 栈顶</text>
    <text x="16" y="364" font-size="12" fill="#334155">反转前的输出：1 3 6 2（1 的右子树 3、6 已排在 2 之前）</text>

    <text x="16" y="418" font-size="12.5" font-weight="bold" fill="#0f172a">④ 弹 5 输出、弹 4 输出；栈空，循环结束</text>
    <rect x="16" y="430" width="120" height="30" fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="76" y="445" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#94a3b8">空（反转前）</text>
    <text x="16" y="480" font-size="12" fill="#b45309">反转前的输出：1 3 6 2 5 4 —— 这个顺序本身没有用处</text>

    <text x="16" y="534" font-size="12.5" font-weight="bold" fill="#0f172a">⑤ 首尾对折：i、j 双下标原地交换，相遇即止</text>
    <rect x="16" y="546" width="40" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="36" y="561" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#14532d">4</text>
    <rect x="56" y="546" width="40" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="76" y="561" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#14532d">5</text>
    <rect x="96" y="546" width="40" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="116" y="561" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#14532d">2</text>
    <rect x="136" y="546" width="40" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="156" y="561" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#14532d">6</text>
    <rect x="176" y="546" width="40" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="196" y="561" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#14532d">3</text>
    <rect x="216" y="546" width="40" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="236" y="561" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#14532d">1</text>
    <text x="266" y="561" font-size="11.5" fill="#16a34a">← 反转后的 out</text>
    <text x="16" y="596" font-size="12" fill="#14532d">4 5 2 6 3 1 —— 与递归后序逐位相同（本机实测 true）</text>
  </g>

  <g transform="translate(520,70)">
    <rect x="0" y="0" width="460" height="610" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="16" font-weight="bold" fill="#0f172a">三种后序迭代：都输出 4 5 2 6 3 1，差别在代价</text>
    <text x="16" y="50" font-size="12" fill="#64748b">后序是「左右根」，根最后才拿到结果 —— 所以它最难直接迭代出来</text>

    <rect x="16" y="64" width="428" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="88" font-size="13" font-weight="bold" fill="#1e40af">2.1 反转法：1 个栈 + 原地交换</text>
    <text x="30" y="110" font-size="12" fill="#334155">按「根 → 右 → 左」弹出，最后把 out 反转</text>
    <text x="30" y="132" font-size="12" fill="#334155">代码最短；代价是中途那份输出顺序不是后序</text>

    <rect x="16" y="156" width="428" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="180" font-size="13" font-weight="bold" fill="#1e40af">2.2 双栈法：s1 弹出依次压进 s2，倒读 s2</text>
    <text x="30" y="202" font-size="12" fill="#334155">把「反转」显式放进第二个栈，代码里没有交换循环</text>
    <text x="30" y="224" font-size="12" fill="#b45309">注意：s2 收满整棵树，实测 n=100 万时峰值 1 000 000 个指针</text>

    <rect x="16" y="248" width="428" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="272" font-size="13" font-weight="bold" fill="#14532d">2.3 单栈 + pre：唯一按「左→右→根」直接输出</text>
    <text x="30" y="294" font-size="12" fill="#334155">判据只有一行：top.Right == nil 或 top.Right == pre</text>
    <text x="30" y="316" font-size="12" fill="#334155">同一个栈顶被看两次：节点 2 第一次弹出时右孩子 5 还没处理</text>
    <text x="30" y="338" font-size="12" fill="#334155">完 → cur=5 转过去；处理完 5 后 pre=5，第二次才输出 2</text>

    <text x="16" y="382" font-size="13" font-weight="bold" fill="#0f172a">本机容器实测（Go 1.26.8 linux/amd64，逐位比对）</text>
    <rect x="16" y="394" width="428" height="104" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="32" y="420" font-size="12.5" fill="#1e40af">[自检] 后序 递归==反转法 : true   递归==双栈法 : true</text>
    <text x="32" y="444" font-size="12.5" fill="#1e40af">             递归==单栈指针(pre) : true</text>
    <text x="32" y="468" font-size="12" fill="#334155">样本树 6 节点 / 满二叉树 h=10 共 1023 节点，两种树都逐位相同</text>
    <text x="32" y="490" font-size="12" fill="#334155">注意：后序写错只表现为顺序不同，不会报错，只能靠自检兜住</text>

    <text x="16" y="524" font-size="12" fill="#334155">后序是「汇总上来」的顺序：先算完孩子才算父 —— 表达式树求值、AST</text>
    <text x="16" y="544" font-size="12" fill="#334155">语义分析、递归删除与释放都落在这一档（见 1.2 与第五节）。</text>
    <text x="16" y="572" font-size="12.5" fill="#1e40af">判据：要最短 → 反转法；不接受交换循环 → 双栈法（多一份 O(n)</text>
    <text x="16" y="592" font-size="12.5" fill="#1e40af">指针数组）；要边遍历边按后序拿到结果 → 单栈 + pre。</text>
  </g>
</svg>
