<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="780" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一族结构的四种形态：退化 / 严格平衡 / 弱平衡 / 多路</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">都为了把「查找成本 = 树高」钉成 O(log n)；区别在平衡多严格、代价付在哪、能不能按页打包（实测数字来自 平衡树.md）</text>

    <g transform="translate(20,70)">
    <rect x="0" y="0" width="460" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">二叉查找树：树高由插入顺序决定</text>
    <text x="16" y="54" font-size="12" fill="#64748b">有序插入 1、2、3、4 → 每个都往右挂 → 退化成一条链</text>
    <line x1="100" y1="87" x2="125" y2="111" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="125" y1="141" x2="150" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="150" y1="195" x2="175" y2="219" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="100" cy="72" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="100" y="72" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#7f1d1d">1</text>
    <circle cx="125" cy="126" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="125" y="126" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">2</text>
    <circle cx="150" cy="180" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="150" y="180" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">3</text>
    <circle cx="175" cy="234" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="175" y="234" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#334155">4</text>
    <text x="210" y="130" font-size="12.5" fill="#334155">每个新元素都挂到最右边</text>
    <text x="210" y="150" font-size="12.5" fill="#334155">→ 查找退化成线性扫描</text>
    <text x="16" y="264" font-size="13" fill="#334155">「平衡」这个额外约束买到的，是「任何时刻树高都是 O(log n)」的保证。</text>
    <text x="16" y="284" font-size="12" fill="#334155">实测 有序插入 65536 个键 → 树高 65536，而 log₂ n 只有 16（差 4096 倍）</text>
    <text x="16" y="302" font-size="12" fill="#334155">实测 随机插入 100000 个键 → 树高 46，同一批 AVL 只有 20</text>
  </g>

    <g transform="translate(520,70)">
    <rect x="0" y="0" width="460" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">AVL：左右子树高度差 ≤ 1</text>
    <text x="16" y="54" font-size="12" fill="#64748b">严格平衡 → 树最矮 → 比较次数最少</text>
    <line x1="230" y1="91" x2="160" y2="131" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="230" y1="91" x2="300" y2="131" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="161" x2="125" y2="199" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="161" x2="195" y2="199" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="300" y1="161" x2="265" y2="199" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="300" y1="161" x2="335" y2="199" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="230" cy="75" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="230" y="75" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#14532d">4</text>
    <circle cx="160" cy="146" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="160" y="146" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">2</text>
    <circle cx="300" cy="146" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="300" y="146" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">6</text>
    <circle cx="125" cy="215" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="125" y="215" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">1</text>
    <circle cx="195" cy="215" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="195" y="215" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">3</text>
    <circle cx="265" cy="215" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="265" y="215" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">5</text>
    <circle cx="335" cy="215" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="335" y="215" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">7</text>
    <text x="16" y="264" font-size="12" fill="#334155">树高上界 ≤ 1.44 log₂ n；实测 n = 100000 时高 20，而 log₂ 100000 ≈ 16.6</text>
    <text x="16" y="284" font-size="12" fill="#334155">插入只修最靠下的那一处失衡；删除可能沿途多处失衡，要回溯继续修</text>
    <text x="16" y="302" font-size="12" fill="#b45309">代价：每次插删都可能旋转 → 写贵。读多写少、数据基本静态时选它</text>
  </g>

    <g transform="translate(20,420)">
    <rect x="0" y="0" width="460" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">红黑树：弱平衡（最长 ≤ 2 × 最短）</text>
    <text x="16" y="54" font-size="12" fill="#64748b">深色 = 黑结点，浅红 = 红结点；红结点不能相邻</text>
    <line x1="230" y1="116" x2="160" y2="151" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="230" y1="116" x2="300" y2="151" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="183" x2="125" y2="218" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="183" x2="195" y2="218" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="300" y1="183" x2="265" y2="218" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="300" y1="183" x2="335" y2="218" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="230" cy="100" r="16" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="230" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#f8fafc">13</text>
    <circle cx="160" cy="167" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="160" y="167" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#7f1d1d">8</text>
    <circle cx="300" cy="167" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="300" y="167" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#7f1d1d">17</text>
    <circle cx="125" cy="234" r="16" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="125" y="234" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#f8fafc">1</text>
    <circle cx="195" cy="234" r="16" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="195" y="234" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#f8fafc">11</text>
    <circle cx="265" cy="234" r="16" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="265" y="234" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#f8fafc">16</text>
    <circle cx="335" cy="234" r="16" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="335" y="234" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#f8fafc">25</text>
    <text x="16" y="264" font-size="13" fill="#334155">性质 4 红结点的孩子都是黑（禁父子双红）；性质 5 各路径黑节点数相同</text>
    <text x="16" y="284" font-size="12" fill="#334155">树高上界 ≤ 2 log₂(n+1)；插入最多 2 次旋转、删除最多 3 次，变色多但极便宜</text>
    <text x="16" y="302" font-size="12" fill="#334155">实测 n = 10000：AVL 高 16、红黑高 16、BST 高 29 → 查询只差常数因子</text>
  </g>

    <g transform="translate(520,420)">
    <rect x="0" y="0" width="460" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">B+ 树：多路，一页几百个分叉</text>
    <text x="16" y="54" font-size="12" fill="#64748b">平衡单位从「一个结点」换成「一个页」</text>
    <line x1="228" y1="110" x2="58" y2="168" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="228" y1="110" x2="168" y2="168" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="228" y1="110" x2="278" y2="168" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="228" y1="110" x2="388" y2="168" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="150" y="80" width="156" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="202" y1="80" x2="202" y2="110" stroke="#2563eb" stroke-width="1"/>
    <line x1="254" y1="80" x2="254" y2="110" stroke="#2563eb" stroke-width="1"/>
    <text x="176" y="95" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1e40af">10</text>
    <text x="228" y="95" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1e40af">50</text>
    <text x="280" y="95" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1e40af">90</text>
    <rect x="10" y="170" width="96" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <line x1="42" y1="170" x2="42" y2="198" stroke="#16a34a" stroke-width="1"/>
    <line x1="74" y1="170" x2="74" y2="198" stroke="#16a34a" stroke-width="1"/>
    <text x="26" y="184" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">1★</text>
    <text x="58" y="184" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">2★</text>
    <text x="90" y="184" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">3★</text>
    <rect x="120" y="170" width="96" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <line x1="152" y1="170" x2="152" y2="198" stroke="#16a34a" stroke-width="1"/>
    <line x1="184" y1="170" x2="184" y2="198" stroke="#16a34a" stroke-width="1"/>
    <text x="136" y="184" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">5★</text>
    <text x="168" y="184" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">6★</text>
    <text x="200" y="184" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">7★</text>
    <rect x="230" y="170" width="96" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <line x1="262" y1="170" x2="262" y2="198" stroke="#16a34a" stroke-width="1"/>
    <line x1="294" y1="170" x2="294" y2="198" stroke="#16a34a" stroke-width="1"/>
    <text x="246" y="184" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">9★</text>
    <text x="278" y="184" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">…</text>
    <text x="310" y="184" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">12★</text>
    <rect x="340" y="170" width="96" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <line x1="372" y1="170" x2="372" y2="198" stroke="#16a34a" stroke-width="1"/>
    <line x1="404" y1="170" x2="404" y2="198" stroke="#16a34a" stroke-width="1"/>
    <text x="356" y="184" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">…</text>
    <text x="388" y="184" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">…</text>
    <text x="420" y="184" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#14532d">99★</text>
    <line x1="106" y1="184" x2="118" y2="184" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <line x1="216" y1="184" x2="228" y2="184" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <line x1="326" y1="184" x2="338" y2="184" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <text x="16" y="226" font-size="12" fill="#334155">非叶子只有「键 + 子页指针」→ 一页装得下几百个分叉 → 树几乎不长高</text>
    <text x="16" y="264" font-size="13" fill="#334155">扇出 ≈ 500 → 层数 ⌈log₅₀₀ N⌉：10⁷ 行约 3 层 = 3 次读页</text>
    <text x="16" y="284" font-size="12" fill="#334155">代价：一次改动要按「页」加锁、写回 → 并发写比内存里的平衡树难做</text>
    <text x="16" y="302" font-size="12" fill="#b45309">数据要落盘 → 换多路（结构与树高推导见 B树与B+树.md）</text>
  </g>

</svg>
