<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">判成树 / DAG / 图之后：真实系统各归各位</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">判据只有一个动作：检查「无环、单父、只需父子单跳」三条约束还成不成立</text>

  <g>
    <rect x="30" y="85" width="300" height="385" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="180" y="113" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">树：约束全满足</text>
    <rect x="46" y="130" width="268" height="76" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <text x="60" y="154" font-size="13" font-weight="bold" fill="#14532d">浏览器 DOM / 组件树</text>
    <text x="60" y="178" font-size="12" fill="#334155">唯一父、纯嵌套无环，层级即结构</text>
    <rect x="46" y="218" width="268" height="76" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <text x="60" y="242" font-size="13" font-weight="bold" fill="#14532d">编译器 AST</text>
    <text x="60" y="266" font-size="12" fill="#334155">层级即优先级，递归下降遍历</text>
    <rect x="46" y="306" width="268" height="76" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <text x="60" y="330" font-size="13" font-weight="bold" fill="#14532d">文件目录树</text>
    <text x="60" y="354" font-size="12" fill="#334155">路径唯一；硬链接一出现即破</text>
    <rect x="46" y="394" width="268" height="64" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <text x="60" y="416" font-size="13" font-weight="bold" fill="#14532d">组织汇报线 / 商品类目</text>
    <text x="60" y="438" font-size="12" fill="#334155">关系库四种落库模型见层级篇</text>
  </g>

  <g>
    <rect x="350" y="85" width="300" height="385" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="500" y="113" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">DAG：无环，但多父</text>
    <rect x="366" y="130" width="268" height="76" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
    <text x="380" y="154" font-size="13" font-weight="bold" fill="#9a3412">构建依赖 Make / Bazel</text>
    <text x="380" y="178" font-size="12" fill="#334155">共享依赖 = 多入边，靠拓扑定序</text>
    <rect x="366" y="218" width="268" height="76" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
    <text x="380" y="242" font-size="13" font-weight="bold" fill="#9a3412">任务编排 / 先修课依赖</text>
    <text x="380" y="266" font-size="12" fill="#334155">无环才能调度；不是层级查询</text>
    <rect x="366" y="306" width="268" height="76" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
    <text x="380" y="330" font-size="13" font-weight="bold" fill="#9a3412">Git 提交图</text>
    <text x="380" y="354" font-size="12" fill="#334155">merge 节点两个父，路径不唯一</text>
    <rect x="366" y="394" width="268" height="64" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
    <text x="380" y="416" font-size="13" font-weight="bold" fill="#9a3412">该做的不是「找树」</text>
    <text x="380" y="438" font-size="12" fill="#334155">而是邻接表 + 拓扑排序</text>
  </g>

  <g>
    <rect x="670" y="85" width="300" height="385" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="820" y="113" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">一般图：环 / 双向 / 多跳</text>
    <rect x="686" y="130" width="268" height="76" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="700" y="154" font-size="13" font-weight="bold" fill="#1e40af">好友与关注网络</text>
    <text x="700" y="178" font-size="12" fill="#334155">对称或成环，多跳可达是主查询</text>
    <rect x="686" y="218" width="268" height="76" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="700" y="242" font-size="13" font-weight="bold" fill="#1e40af">推荐 / 二度三度关系</text>
    <text x="700" y="266" font-size="12" fill="#334155">路径不唯一，按跳数扩散</text>
    <rect x="686" y="306" width="268" height="76" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="700" y="330" font-size="13" font-weight="bold" fill="#1e40af">带回退 / 重试的工作流</text>
    <text x="700" y="354" font-size="12" fill="#334155">回退边 = 环，拓扑序不存在</text>
    <rect x="686" y="394" width="268" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="700" y="416" font-size="13" font-weight="bold" fill="#1e40af">多跳是主查询才上图库</text>
    <text x="700" y="438" font-size="12" fill="#334155">准入判据见图库选型篇</text>
  </g>

  <g>
    <rect x="30" y="492" width="940" height="116" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <text x="50" y="518" font-size="15" font-weight="bold" fill="#0f172a">反向：从图里取出一棵树 —— 数据仍是图，树是算法临时取的视图</text>
    <text x="50" y="542" font-size="12.5" fill="#334155">MST 网络铺设（Kruskal / Prim）　·　割点 / 桥 / 判环（DFS 树的四类边）　·　无权最短路（BFS 树的层号）</text>
    <text x="50" y="568" font-size="12.5" fill="#dc2626">收尾判据：每条边只有唯一一条到达路径 → 树；否则是图。既想要层级又容忍环与多父，先确认约束，别让树模型硬扛。</text>
  </g>
</svg>
