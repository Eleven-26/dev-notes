<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arwG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">二叉树的术语：节点怎么分类、深度与高度怎么数</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">左：节点的四种叫法与「度」；右：深度往下数、高度往上数 —— 数值常相同，方向相反（实测：n0 = n2 + 1 恒成立）</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="460" height="530" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">节点分类与「度」</text>
    <text x="16" y="54" font-size="12" fill="#64748b">度 = 这个节点有几个孩子；二叉树里每个节点的度只能是 0 / 1 / 2</text>

    <line x1="255" y1="105" x2="175" y2="185" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="255" y1="105" x2="335" y2="185" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="175" y1="185" x2="130" y2="265" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="175" y1="185" x2="220" y2="265" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="335" y1="185" x2="375" y2="265" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="130" y1="265" x2="95" y2="345" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="8" y="105" font-size="11.5" fill="#64748b">第1层</text>
    <text x="8" y="185" font-size="11.5" fill="#64748b">第2层</text>
    <text x="8" y="265" font-size="11.5" fill="#64748b">第3层</text>
    <text x="8" y="345" font-size="11.5" fill="#64748b">第4层</text>

    <circle cx="255" cy="105" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="255" y="105" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">8</text>
    <circle cx="175" cy="185" r="17" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="175" y="185" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">4</text>
    <circle cx="335" cy="185" r="17" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="335" y="185" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">12</text>
    <circle cx="130" cy="265" r="17" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="130" y="265" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">2</text>
    <circle cx="220" cy="265" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="220" y="265" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#14532d">6</text>
    <circle cx="375" cy="265" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="375" y="265" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#14532d">14</text>
    <circle cx="95" cy="345" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="95" y="345" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#14532d">1</text>

    <text x="404" y="105" font-size="11.5" fill="#1e40af">根</text>
    <text x="404" y="185" font-size="11.5" fill="#334155">分支</text>
    <text x="404" y="265" font-size="11.5" fill="#14532d">叶子</text>
    <text x="404" y="345" font-size="11.5" fill="#14532d">叶子</text>

    <text x="16" y="404" font-size="12.5" fill="#334155">根节点：没有父节点，全树唯一（这里是 8）</text>
    <text x="16" y="426" font-size="12.5" fill="#334155">分支节点：至少有一个孩子（8、4、12）</text>
    <text x="16" y="448" font-size="12.5" fill="#14532d">叶子节点：没有孩子（1、2、6、14）</text>
    <text x="16" y="474" font-size="12" fill="#1e40af">⭐ 实测：叶子数 n0 恒等于「度为 2 的节点数 n2」+ 1</text>
    <text x="16" y="494" font-size="12" fill="#334155">随机二叉树 5 次：n = 15/31/63/127/255 → n0 − n2 全部 = 1</text>
    <text x="16" y="514" font-size="12" fill="#64748b">⚠️ 推导要点：每多一个度为 2 的节点，就多「分叉」一次，叶子净增 1</text>
  </g>

  <g transform="translate(520,70)">
    <rect x="0" y="0" width="460" height="530" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">深度 vs 高度：数值常相同、方向相反</text>
    <text x="16" y="54" font-size="12" fill="#64748b">同一棵树，站在根上数叫「深度」，站在叶子上数叫「高度」</text>

    <text x="16" y="92" font-size="12" fill="#1e40af">深度：根 = 1，往下每层 +1</text>
    <text x="280" y="92" font-size="12" fill="#14532d">高度：叶 = 1，往上每层 +1</text>
    <line x1="60" y1="140" x2="60" y2="400" stroke="#2563eb" stroke-width="2" marker-end="url(#arw)"/>
    <line x1="420" y1="400" x2="420" y2="140" stroke="#16a34a" stroke-width="2" marker-end="url(#arwG)"/>

    <line x1="240" y1="150" x2="175" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="240" y1="150" x2="305" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="175" y1="230" x2="140" y2="310" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="175" y1="230" x2="210" y2="310" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="305" y1="230" x2="340" y2="310" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="140" y1="310" x2="105" y2="390" stroke="#94a3b8" stroke-width="1.5"/>

    <circle cx="240" cy="150" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="240" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">8</text>
    <circle cx="175" cy="230" r="17" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="175" y="230" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">4</text>
    <circle cx="305" cy="230" r="17" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="305" y="230" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">12</text>
    <circle cx="140" cy="310" r="17" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="140" y="310" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">2</text>
    <circle cx="210" cy="310" r="17" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="210" y="310" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">6</text>
    <circle cx="340" cy="310" r="17" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="340" y="310" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">14</text>
    <circle cx="105" cy="390" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="105" y="390" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#14532d">1</text>

    <text x="16" y="440" font-size="12.5" fill="#1e40af">节点 8：深度 1、高度 4</text>
    <text x="240" y="440" font-size="12.5" fill="#14532d">节点 1：深度 4、高度 1</text>
    <text x="16" y="466" font-size="12.5" fill="#334155">同一个节点拿到两个值，方向刚好相反 —— 这是最爱考的辨析</text>
    <text x="16" y="492" font-size="12.5" fill="#334155">树的深度 = 树的高度 = 层数（本图 4 层，两者都是 4）</text>
    <text x="16" y="516" font-size="12" fill="#b45309">⚠️ 有的教材把根所在层记为第 0 层 —— 答题前先确认口径，数值可能差 1</text>
  </g>
</svg>
