  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">堆只有两个原子动作：上浮与下沉</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">每行数组都是容器实测抄录；上浮走「比父更优就换」，下沉走「和孩子里更优的那个换」—— 终止条件就是全部难点</text>

