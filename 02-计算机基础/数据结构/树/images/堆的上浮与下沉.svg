    <g transform="translate(20,600)">
    <rect x="0" y="0" width="960" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">两个循环的对称性与各自的边界</text>
    <text x="16" y="58" font-size="13" fill="#334155">siftUp 每轮只和 1 个父亲比（i &gt; 0 保证父亲存在）；siftDown 每轮要和 2 个孩子比（l &lt; n、r &lt; n 才比）——</text>
    <text x="16" y="82" font-size="13" fill="#334155">　「孩子可能只有一个」是下沉独有的边界：完全二叉树的最后一个内部节点可能只有左孩子。</text>
    <text x="16" y="108" font-size="13" fill="#b45309">⚠️ siftUp 的循环必须写 for i &gt; 0：i=0 时 (0-1)/2 在 Go / Java 里向零截断等于 0，「下标 0 的父是它自己」→ 会自环。</text>
    <text x="16" y="132" font-size="13" fill="#334155">两个循环最多都走「树高」层 = ⌊log₂n⌋（堆是完全二叉树，每层都填满）→ push / pop 的 O(log n) 全部来自这里。</text>
  </g>

</svg>
