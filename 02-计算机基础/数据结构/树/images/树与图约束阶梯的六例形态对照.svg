<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arwB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arwO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ea580c"/>
    </marker>
    <marker id="arwR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="690" fill="#ffffff"/>

  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">树 = 图 + 无环 + 连通 + 单父：六个小例子逐个补约束、破约束</text>
  <text x="500" y="53" text-anchor="middle" font-size="12.5" fill="#64748b">n / m / 连通块 / 有环 / 最大入度 / 简单路径条数全部取自第八节 8.1 的容器实测输出（形态与判据同第一、五节）</text>

  <rect x="20" y="78" width="300" height="235" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="104" font-size="14.5" font-weight="bold" fill="#b91c1c">① 有环 / 双向：一般图（例 E6 好友）</text>
  <line x1="170" y1="138" x2="110" y2="208" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="110" y1="208" x2="240" y2="208" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="240" y1="208" x2="170" y2="138" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="170" y1="138" x2="80" y2="138" stroke="#dc2626" stroke-width="1.6"/>
  <circle cx="170" cy="138" r="13" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="170" y="138" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#7f1d1d">A</text>
  <circle cx="110" cy="208" r="13" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="110" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#7f1d1d">B</text>
  <circle cx="240" cy="208" r="13" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="240" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#7f1d1d">C</text>
  <circle cx="80" cy="138" r="13" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="80" y="138" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#7f1d1d">D</text>
  <text x="34" y="256" font-size="12" fill="#334155">n=4，m=4，最大度数 3</text>
  <text x="34" y="276" font-size="12" fill="#334155">有环 = 是（反例边 C-A）；m = n−1 = 否</text>
  <text x="34" y="296" font-size="12" fill="#dc2626">A→C 有 2 条路径：A→C / A→B→C</text>

  <line x1="322" y1="190" x2="348" y2="190" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="335" y="180" text-anchor="middle" font-size="11.5" fill="#16a34a">+ 无环</text>

  <rect x="350" y="78" width="300" height="235" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="364" y="104" font-size="14.5" font-weight="bold" fill="#475569">② 补上「无环」但不连通：森林（E3）</text>
  <line x1="405" y1="148" x2="470" y2="183" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="470" y1="183" x2="540" y2="148" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="405" y1="223" x2="480" y2="223" stroke="#94a3b8" stroke-width="1.6"/>
  <circle cx="405" cy="148" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="405" y="148" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#334155">A</text>
  <circle cx="470" cy="183" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="470" y="183" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#334155">B</text>
  <circle cx="540" cy="148" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="540" y="148" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#334155">C</text>
  <circle cx="405" cy="223" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="405" y="223" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#334155">D</text>
  <circle cx="480" cy="223" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="223" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#334155">E</text>
  <text x="364" y="256" font-size="12" fill="#334155">n=5，m=3，连通块 2（3 点 + 2 点）</text>
  <text x="364" y="276" font-size="12" fill="#334155">有环 = 否，弱连通 = 否</text>
  <text x="364" y="296" font-size="12" fill="#dc2626">m = n−1？否（3 ≠ 4）→ 还不是一棵</text>

  <line x1="652" y1="190" x2="678" y2="190" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="665" y="180" text-anchor="middle" font-size="11.5" fill="#16a34a">+ 连通</text>

  <rect x="680" y="78" width="300" height="235" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="694" y="104" font-size="14.5" font-weight="bold" fill="#15803d">③ 再补「连通」：无向树（E2）</text>
  <line x1="830" y1="133" x2="765" y2="188" stroke="#16a34a" stroke-width="1.6"/>
  <line x1="830" y1="133" x2="895" y2="188" stroke="#16a34a" stroke-width="1.6"/>
  <line x1="765" y1="188" x2="765" y2="233" stroke="#16a34a" stroke-width="1.6"/>
  <circle cx="830" cy="133" r="13" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="830" y="133" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#14532d">A</text>
  <circle cx="765" cy="188" r="13" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="765" y="188" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#14532d">B</text>
  <circle cx="895" cy="188" r="13" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="895" y="188" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#14532d">C</text>
  <circle cx="765" cy="233" r="13" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="765" y="233" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#14532d">D</text>
  <text x="694" y="256" font-size="12" fill="#334155">n=4，m=3，最大度数 2</text>
  <text x="694" y="276" font-size="12" fill="#334155">有环 = 否，弱连通 = 是</text>
  <text x="694" y="296" font-size="12" fill="#16a34a">m = n−1 且连通 → 必为树；A→D 1 条</text>

  <rect x="20" y="328" width="300" height="235" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="354" font-size="14.5" font-weight="bold" fill="#1e40af">④ 再定根定向：有根树（E1）</text>
  <line x1="170" y1="383" x2="120" y2="426" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arwB)"/>
  <line x1="170" y1="383" x2="220" y2="426" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arwB)"/>
  <line x1="105" y1="438" x2="105" y2="464" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arwB)"/>
  <circle cx="170" cy="383" r="13" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="383" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1e3a8a">A</text>
  <circle cx="105" cy="438" r="13" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="105" y="438" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1e3a8a">B</text>
  <circle cx="235" cy="438" r="13" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="235" y="438" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1e3a8a">C</text>
  <circle cx="105" cy="483" r="13" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="105" y="483" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1e3a8a">D</text>
  <text x="34" y="506" font-size="12" fill="#334155">n=4，m=3，最大入度 = 1</text>
  <text x="34" y="526" font-size="12" fill="#334155">有向 + 无环 + 弱连通 = 是</text>
  <text x="34" y="546" font-size="12" fill="#16a34a">A→D 只有 1 条：A→B→D → 层级唯一</text>

  <rect x="350" y="328" width="300" height="235" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="364" y="354" font-size="14.5" font-weight="bold" fill="#9a3412">⑤ 破掉「单父」：多父 DAG（E5）</text>
  <line x1="425" y1="383" x2="493" y2="432" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arwO)"/>
  <line x1="575" y1="383" x2="507" y2="432" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arwO)"/>
  <line x1="500" y1="438" x2="500" y2="464" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arwO)"/>
  <circle cx="425" cy="383" r="13" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="425" y="383" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#9a3412">A</text>
  <circle cx="575" cy="383" r="13" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="575" y="383" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#9a3412">B</text>
  <circle cx="500" cy="438" r="13" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="500" y="438" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#9a3412">C</text>
  <circle cx="500" cy="483" r="13" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="500" y="483" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#9a3412">D</text>
  <text x="364" y="506" font-size="12" fill="#dc2626">n=4，m=3，最大入度 = 2（点 C）</text>
  <text x="364" y="526" font-size="12" fill="#334155">无环、弱连通、m = n−1 三条全成立</text>
  <text x="364" y="546" font-size="12" fill="#334155">边数账只对无向图成立：C 有两个父</text>

  <rect x="680" y="328" width="300" height="235" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="694" y="354" font-size="14.5" font-weight="bold" fill="#b45309">⑥ 只在 E1 上加一条边（5.1 的触发）</text>
  <line x1="830" y1="378" x2="780" y2="416" stroke="#b45309" stroke-width="1.6" marker-end="url(#arwB)"/>
  <line x1="830" y1="378" x2="880" y2="416" stroke="#b45309" stroke-width="1.6" marker-end="url(#arwB)"/>
  <line x1="765" y1="428" x2="816" y2="471" stroke="#b45309" stroke-width="1.6" marker-end="url(#arwB)"/>
  <line x1="830" y1="378" x2="830" y2="464" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arwR)"/>
  <circle cx="830" cy="378" r="13" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="830" y="378" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#78350f">A</text>
  <circle cx="765" cy="428" r="13" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="765" y="428" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#78350f">B</text>
  <circle cx="895" cy="428" r="13" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="895" y="428" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#78350f">C</text>
  <circle cx="830" cy="483" r="13" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="830" y="483" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#78350f">D</text>
  <text x="838" y="406" font-size="11" fill="#dc2626">新增这条边</text>
  <text x="694" y="506" font-size="12" fill="#334155">加 A→D：m 3→4、D 入度 1→2 → DAG</text>
  <text x="694" y="526" font-size="12" fill="#334155">同一对点 A→D 变 2 条：A→B→D / A→D</text>
  <text x="694" y="546" font-size="12" fill="#dc2626">换成回退边 D→A：成环 A→B→D→A</text>

  <text x="20" y="600" font-size="12.5" fill="#334155">要点：①→④ 是第一节表格「逐个补约束」的方向（无环 → 连通 → 定根定向）；⑤⑥ 是 1.2 与 5.1 的破约束 —— 多父与环各只需要新增一条边。</text>
  <text x="20" y="626" font-size="12.5" fill="#64748b">实测口径：Go 1.26.8（linux/amd64，容器 golang:1.26-alpine），六例与两个退化触发的完整输出见 8.1；连跑两遍逐行相同。</text>
  <text x="20" y="652" font-size="12.5" fill="#64748b">注意：⑤ 与 ②③ 的差别只在「入度」这一列 —— 有向数据别只数边数，边数账是无向图才成立的等式。</text>
</svg>
