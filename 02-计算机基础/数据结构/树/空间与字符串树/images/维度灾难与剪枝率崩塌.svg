<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="40" y="44" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#0f172a">维度灾难：剪枝率随维度迅速崩塌</text>
  <text x="40" y="72" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">n = 20000 个点；纵轴 = 一次查询要碰到的节点 / 全部节点（越矮越好）</text>

  <rect x="640" y="88" width="16" height="12" rx="2" fill="#2563eb"/>
  <text x="662" y="99" font-family="system-ui, sans-serif" font-size="13" fill="#334155">范围查询检查点占比</text>
  <rect x="820" y="88" width="16" height="12" rx="2" fill="#dc2626"/>
  <text x="842" y="99" font-family="system-ui, sans-serif" font-size="13" fill="#334155">最近邻访问占比</text>

  <line x1="110" y1="360" x2="930" y2="360" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="110" y1="295" x2="930" y2="295" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="110" y1="230" x2="930" y2="230" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="110" y1="165" x2="930" y2="165" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="110" y1="100" x2="930" y2="100" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="110" y1="100" x2="110" y2="360" stroke="#cbd5e1" stroke-width="1"/>
  <text x="100" y="364" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">0%</text>
  <text x="100" y="299" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">25%</text>
  <text x="100" y="234" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">50%</text>
  <text x="100" y="169" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">75%</text>
  <text x="100" y="104" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">100%</text>

  <rect x="165" y="356" width="70" height="4" rx="2" fill="#2563eb"/>
  <rect x="245" y="356" width="70" height="4" rx="2" fill="#dc2626"/>
  <text x="200" y="348" font-family="system-ui, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">1.31%</text>
  <text x="280" y="348" font-family="system-ui, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle">0.10%</text>

  <rect x="365" y="353" width="70" height="7" rx="2" fill="#2563eb"/>
  <rect x="445" y="356" width="70" height="4" rx="2" fill="#dc2626"/>
  <text x="400" y="345" font-family="system-ui, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">2.71%</text>
  <text x="480" y="348" font-family="system-ui, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle">0.32%</text>

  <rect x="565" y="312" width="70" height="48" rx="2" fill="#2563eb"/>
  <rect x="645" y="346" width="70" height="14" rx="2" fill="#dc2626"/>
  <text x="600" y="305" font-family="system-ui, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">18.27%</text>
  <text x="680" y="339" font-family="system-ui, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle">5.31%</text>

  <rect x="765" y="240" width="70" height="120" rx="2" fill="#2563eb"/>
  <rect x="845" y="107" width="70" height="253" rx="2" fill="#dc2626"/>
  <text x="800" y="233" font-family="system-ui, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">46.02%</text>
  <text x="880" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">97.20%</text>

  <text x="240" y="382" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">d = 2</text>
  <text x="440" y="382" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">d = 4</text>
  <text x="640" y="382" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">d = 8</text>
  <text x="840" y="382" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">d = 16</text>

  <rect x="60" y="400" width="880" height="56" rx="10" fill="#ffedd5" stroke="#fed7aa"/>
  <text x="80" y="424" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b45309">⭐ 高维里没有「一小块」：要占 1% 的体积，边长必须 L = 0.01^(1/d) —— 从 0.10 一路涨到 0.75</text>
  <text x="80" y="445" font-family="system-ui, sans-serif" font-size="13" fill="#b45309">⚠️ d = 16 时最近邻平均访问 97% 的节点：剪枝失效，KD 树退化成一次线性扫描</text>
</svg>
