<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">
  <defs>
    <marker id="kdArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="40" y="44" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#0f172a">KD 树：按维度轮流切，每个节点就是一个点</text>
  <text x="40" y="72" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">轴 = 深度 % 维数；每层取该维中位数当切分点，于是左右规模相当、树高 O(log n)</text>

  <text x="60" y="112" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#2563eb">二维点集里的切分（d = 2）</text>
  <rect x="60" y="120" width="380" height="340" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="250" y1="120" x2="250" y2="460" stroke="#dc2626" stroke-width="2"/>
  <text x="256" y="140" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#dc2626">第 0 层：按 x 切</text>
  <line x1="60" y1="340" x2="250" y2="340" stroke="#2563eb" stroke-width="2"/>
  <text x="66" y="334" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2563eb">第 1 层：按 y 切</text>
  <line x1="250" y1="250" x2="440" y2="250" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="244" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2563eb">按 y 切</text>
  <line x1="155" y1="340" x2="155" y2="460" stroke="#ea580c" stroke-width="2"/>
  <text x="100" y="452" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ea580c">第 2 层：按 x 切</text>
  <rect x="270" y="190" width="110" height="90" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="386" y="188" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#16a34a">查询盒</text>
  <circle cx="110" cy="160" r="4" fill="#334155"/>
  <circle cx="150" cy="205" r="4" fill="#334155"/>
  <circle cx="200" cy="150" r="4" fill="#334155"/>
  <circle cx="310" cy="170" r="4" fill="#334155"/>
  <circle cx="390" cy="145" r="4" fill="#334155"/>
  <circle cx="90" cy="255" r="4" fill="#334155"/>
  <circle cx="175" cy="275" r="4" fill="#334155"/>
  <circle cx="215" cy="320" r="4" fill="#334155"/>
  <circle cx="120" cy="385" r="4" fill="#334155"/>
  <circle cx="205" cy="420" r="4" fill="#334155"/>
  <circle cx="285" cy="300" r="4" fill="#334155"/>
  <circle cx="345" cy="240" r="4" fill="#334155"/>
  <circle cx="400" cy="325" r="4" fill="#334155"/>
  <circle cx="360" cy="405" r="4" fill="#334155"/>
  <circle cx="420" cy="432" r="4" fill="#334155"/>
  <circle cx="300" cy="430" r="4" fill="#334155"/>
  <circle cx="335" cy="370" r="4" fill="#334155"/>
  <circle cx="140" cy="300" r="4" fill="#334155"/>
  <circle cx="180" cy="365" r="4" fill="#334155"/>
  <circle cx="265" cy="200" r="4" fill="#334155"/>

  <line x1="480" y1="100" x2="480" y2="450" stroke="#e2e8f0" stroke-width="1"/>

  <text x="510" y="112" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#16a34a">同样的切分在树里</text>
  <rect x="605" y="140" width="120" height="40" rx="8" fill="#fee2e2" stroke="#fecaca"/>
  <text x="665" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#991b1b" text-anchor="middle">轴 = x</text>
  <line x1="665" y1="180" x2="605" y2="215" stroke="#94a3b8" stroke-width="2" marker-end="url(#kdArrow)"/>
  <line x1="665" y1="180" x2="785" y2="215" stroke="#94a3b8" stroke-width="2" marker-end="url(#kdArrow)"/>
  <rect x="545" y="219" width="120" height="40" rx="8" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="605" y="244" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e40af" text-anchor="middle">轴 = y</text>
  <rect x="725" y="219" width="120" height="40" rx="8" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="785" y="244" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e40af" text-anchor="middle">轴 = y</text>
  <line x1="605" y1="259" x2="560" y2="292" stroke="#94a3b8" stroke-width="2" marker-end="url(#kdArrow)"/>
  <line x1="605" y1="259" x2="650" y2="292" stroke="#94a3b8" stroke-width="2" marker-end="url(#kdArrow)"/>
  <line x1="785" y1="259" x2="740" y2="292" stroke="#94a3b8" stroke-width="2" marker-end="url(#kdArrow)"/>
  <line x1="785" y1="259" x2="830" y2="292" stroke="#94a3b8" stroke-width="2" marker-end="url(#kdArrow)"/>
  <rect x="520" y="296" width="80" height="36" rx="7" fill="#ffedd5" stroke="#fed7aa"/>
  <text x="560" y="319" font-family="system-ui, sans-serif" font-size="12" fill="#b45309" text-anchor="middle">轴 = x</text>
  <rect x="610" y="296" width="80" height="36" rx="7" fill="#ffedd5" stroke="#fed7aa"/>
  <text x="650" y="319" font-family="system-ui, sans-serif" font-size="12" fill="#b45309" text-anchor="middle">轴 = x</text>
  <rect x="700" y="296" width="80" height="36" rx="7" fill="#ffedd5" stroke="#fed7aa"/>
  <text x="740" y="319" font-family="system-ui, sans-serif" font-size="12" fill="#b45309" text-anchor="middle">轴 = x</text>
  <rect x="790" y="296" width="80" height="36" rx="7" fill="#ffedd5" stroke="#fed7aa"/>
  <text x="830" y="319" font-family="system-ui, sans-serif" font-size="12" fill="#b45309" text-anchor="middle">轴 = x</text>
  <text x="510" y="362" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">每个矩形的节点本身就是数据集里的一个点</text>

  <rect x="510" y="378" width="450" height="68" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="528" y="402" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a">范围查询：包围盒与查询盒不相交 → 整棵子树剪掉</text>
  <text x="528" y="426" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a">最近邻：到切分平面的距离 ≥ 当前最近 → 远侧剪掉</text>

  <rect x="60" y="468" width="900" height="56" rx="10" fill="#ffedd5" stroke="#fed7aa"/>
  <text x="80" y="492" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b45309">⭐ 分区不重叠是 KD 树剪枝干净的原因，也是它只适合「点」的原因（矩形 / 多边形用 R 树）</text>
  <text x="80" y="513" font-family="system-ui, sans-serif" font-size="13" fill="#b45309">⚠️ 剪枝只影响速度、不影响结果 —— 低维下实测命中数与暴力逐点扫描完全一致</text>
</svg>
