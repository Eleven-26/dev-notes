<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 556" width="1000" height="556" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="arw_o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="556" fill="#ffffff"/>
  <text x="500" y="32" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">把有序链表想成一条站站都停的公交线</text>
  <text x="500" y="55" font-size="12.2" fill="#64748b" text-anchor="middle">同一批 10 个节点，找第 8 个：慢车要一格一格挪 7 次，快线组合只要 3 段车</text>
  <line x1="150" y1="140" x2="878" y2="140" stroke="#7e22ce" stroke-width="3"/>
  <text x="142" y="145" font-size="12" fill="#7e22ce" text-anchor="end" font-weight="bold" font-family="Consolas, Menlo, monospace">L2</text>
  <text x="30" y="133" font-size="11.5" fill="#7e22ce" text-anchor="start" font-weight="bold">超级快线</text>
  <text x="30" y="152" font-size="9.6" fill="#64748b" text-anchor="start">只停 1 / 5 / 9</text>
  <circle cx="170" cy="140" r="8" fill="#ffffff" stroke="#7e22ce" stroke-width="2.2"/>
  <line x1="244" y1="136" x2="244" y2="144" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="318" y1="136" x2="318" y2="144" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="392" y1="136" x2="392" y2="144" stroke="#cbd5e1" stroke-width="1.4"/>
  <circle cx="466" cy="140" r="8" fill="#ffffff" stroke="#7e22ce" stroke-width="2.2"/>
  <line x1="540" y1="136" x2="540" y2="144" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="614" y1="136" x2="614" y2="144" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="688" y1="136" x2="688" y2="144" stroke="#cbd5e1" stroke-width="1.4"/>
  <circle cx="762" cy="140" r="8" fill="#ffffff" stroke="#7e22ce" stroke-width="2.2"/>
  <line x1="836" y1="136" x2="836" y2="144" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="150" y1="232" x2="878" y2="232" stroke="#15803d" stroke-width="3"/>
  <text x="142" y="237" font-size="12" fill="#15803d" text-anchor="end" font-weight="bold" font-family="Consolas, Menlo, monospace">L1</text>
  <text x="30" y="225" font-size="11.5" fill="#15803d" text-anchor="start" font-weight="bold">大站快线</text>
  <text x="30" y="244" font-size="9.6" fill="#64748b" text-anchor="start">停 1 3 5 7 9</text>
  <circle cx="170" cy="232" r="8" fill="#ffffff" stroke="#15803d" stroke-width="2.2"/>
  <line x1="244" y1="228" x2="244" y2="236" stroke="#cbd5e1" stroke-width="1.4"/>
  <circle cx="318" cy="232" r="8" fill="#ffffff" stroke="#15803d" stroke-width="2.2"/>
  <line x1="392" y1="228" x2="392" y2="236" stroke="#cbd5e1" stroke-width="1.4"/>
  <circle cx="466" cy="232" r="8" fill="#ffffff" stroke="#15803d" stroke-width="2.2"/>
  <line x1="540" y1="228" x2="540" y2="236" stroke="#cbd5e1" stroke-width="1.4"/>
  <circle cx="614" cy="232" r="8" fill="#ffffff" stroke="#15803d" stroke-width="2.2"/>
  <line x1="688" y1="228" x2="688" y2="236" stroke="#cbd5e1" stroke-width="1.4"/>
  <circle cx="762" cy="232" r="8" fill="#ffffff" stroke="#15803d" stroke-width="2.2"/>
  <line x1="836" y1="228" x2="836" y2="236" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="150" y1="324" x2="878" y2="324" stroke="#2563eb" stroke-width="3"/>
  <text x="142" y="329" font-size="12" fill="#2563eb" text-anchor="end" font-weight="bold" font-family="Consolas, Menlo, monospace">L0</text>
  <text x="30" y="317" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="bold">慢车（站站停）</text>
  <text x="30" y="336" font-size="9.6" fill="#64748b" text-anchor="start">1 ~ 10 全停</text>
  <circle cx="170" cy="324" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
  <circle cx="244" cy="324" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
  <circle cx="318" cy="324" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
  <circle cx="392" cy="324" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
  <circle cx="466" cy="324" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
  <circle cx="540" cy="324" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
  <circle cx="614" cy="324" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
  <circle cx="688" cy="324" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
  <circle cx="762" cy="324" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
  <circle cx="836" cy="324" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
  <text x="170" y="350" font-size="10" fill="#64748b" text-anchor="middle" font-family="Consolas, Menlo, monospace">1</text>
  <text x="244" y="350" font-size="10" fill="#64748b" text-anchor="middle" font-family="Consolas, Menlo, monospace">2</text>
  <text x="318" y="350" font-size="10" fill="#64748b" text-anchor="middle" font-family="Consolas, Menlo, monospace">3</text>
  <text x="392" y="350" font-size="10" fill="#64748b" text-anchor="middle" font-family="Consolas, Menlo, monospace">4</text>
  <text x="466" y="350" font-size="10" fill="#64748b" text-anchor="middle" font-family="Consolas, Menlo, monospace">5</text>
  <text x="540" y="350" font-size="10" fill="#64748b" text-anchor="middle" font-family="Consolas, Menlo, monospace">6</text>
  <text x="614" y="350" font-size="10" fill="#64748b" text-anchor="middle" font-family="Consolas, Menlo, monospace">7</text>
  <text x="688" y="350" font-size="10" fill="#64748b" text-anchor="middle" font-family="Consolas, Menlo, monospace">8</text>
  <text x="762" y="350" font-size="10" fill="#64748b" text-anchor="middle" font-family="Consolas, Menlo, monospace">9</text>
  <text x="836" y="350" font-size="10" fill="#64748b" text-anchor="middle" font-family="Consolas, Menlo, monospace">10</text>
  <text x="150" y="350" font-size="9.4" fill="#64748b" text-anchor="end">第几站</text>
  <line x1="180" y1="140" x2="446" y2="140" stroke="#ea580c" stroke-width="3.4" marker-end="url(#arw_o)"/>
  <line x1="476" y1="232" x2="594" y2="232" stroke="#ea580c" stroke-width="3.4" marker-end="url(#arw_o)"/>
  <line x1="624" y1="324" x2="666" y2="324" stroke="#ea580c" stroke-width="3.4" marker-end="url(#arw_o)"/>
  <line x1="466" y1="149" x2="466" y2="222" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arw_o)"/>
  <line x1="614" y1="241" x2="614" y2="314" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arw_o)"/>
  <text x="475" y="192" font-size="9.6" fill="#ea580c" text-anchor="start">换乘</text>
  <text x="623" y="284" font-size="9.6" fill="#ea580c" text-anchor="start">换乘</text>
  <text x="318.0" y="120" font-size="9.4" fill="#ea580c" text-anchor="middle" font-weight="bold">第 1 段</text>
  <text x="540.0" y="212" font-size="9.4" fill="#ea580c" text-anchor="middle" font-weight="bold">第 2 段</text>
  <text x="651.0" y="304" font-size="9.4" fill="#ea580c" text-anchor="middle" font-weight="bold">第 3 段</text>
  <circle cx="688" cy="324" r="13" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="688" y="372" font-size="9.6" fill="#dc2626" text-anchor="middle" font-weight="bold">目标：第 8 站</text>
  <text x="170" y="372" font-size="9.6" fill="#64748b" text-anchor="middle">从这里出发</text>
  <text x="30" y="404" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="bold">类比的每一层，对应跳表里的什么：</text>
  <rect x="30" y="414" width="300" height="64" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="44" y="434" font-size="11" fill="#2563eb" text-anchor="start" font-weight="bold">站 = 节点</text>
  <text x="44" y="456" font-size="9.4" fill="#0f172a" text-anchor="start">一站就是一个 key；站号只是「第几个」，不是键值</text>
  <rect x="350" y="414" width="300" height="64" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.1"/>
  <text x="364" y="434" font-size="11" fill="#15803d" text-anchor="start" font-weight="bold">快线 = 上层索引</text>
  <text x="364" y="456" font-size="9.4" fill="#0f172a" text-anchor="start">只停一部分站，不复制数据，只多几条指针</text>
  <rect x="670" y="414" width="300" height="64" rx="7" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.1"/>
  <text x="684" y="434" font-size="11" fill="#7e22ce" text-anchor="start" font-weight="bold">换乘 = 降一层</text>
  <text x="684" y="456" font-size="9.4" fill="#0f172a" text-anchor="start">快线上跳过中间站；落到慢车才一格一格走</text>
  <rect x="30" y="492" width="940" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="512" font-size="10.6" fill="#0f172a" text-anchor="start">慢车走 7 次，快线组合只走 3 段 —— 省下的不是「比较更快」，而是「中间那些站根本不用经过」。</text>
  <text x="46" y="530" font-size="10.2" fill="#64748b" text-anchor="start">而快线没有复制任何数据：它只是把同一批节点，用更高层的指针又串了一遍（层数越高，串得越稀）。</text>
</svg>
