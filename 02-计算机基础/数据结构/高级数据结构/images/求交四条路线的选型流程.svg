<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwF" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 7,3.5 0,7 z" fill="#334155"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="40" y="34" font-size="19" font-weight="bold" fill="#0f172a">两个倒排表求交：四条路线怎么选</text>
  <text x="40" y="56" font-size="13" fill="#64748b">对应本篇第四节实测结论；前提：两张 docID 列表都有序。「倍」= 相对线性归并的比较次数优势</text>

  <!-- 起点 -->
  <rect x="380" y="84" width="240" height="48" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="500" y="113" font-size="13" fill="#334155" text-anchor="middle">取两张有序倒排表 A、B</text>
  <line x1="500" y1="132" x2="500" y2="162" stroke="#334155" stroke-width="1.8" marker-end="url(#arwF)"/>

  <!-- 判定1 -->
  <polygon points="500,168 640,214 500,260 360,214" fill="#dbeafe" stroke="#2563eb"/>
  <text x="500" y="209" font-size="13" fill="#1d4ed8" text-anchor="middle">长度比接近 1 ？</text>
  <text x="500" y="229" font-size="10.5" fill="#1d4ed8" text-anchor="middle">（|A| 与 |B| 同量级）</text>
  <line x1="640" y1="214" x2="724" y2="214" stroke="#334155" stroke-width="1.8" marker-end="url(#arwF)"/>
  <text x="670" y="206" font-size="12" fill="#16a34a">是</text>
  <rect x="730" y="182" width="230" height="64" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="744" y="204" font-size="12.5" font-weight="bold" fill="#16a34a">线性归并（双指针）</text>
  <text x="744" y="222" font-size="11" fill="#334155">O(|A|+|B|) 已是输入下界</text>
  <text x="744" y="238" font-size="11" fill="#334155">长短接近时它最强（结论 1）</text>
  <line x1="500" y1="260" x2="500" y2="292" stroke="#334155" stroke-width="1.8" marker-end="url(#arwF)"/>
  <text x="512" y="282" font-size="12" fill="#dc2626">否（长度悬殊）</text>

  <!-- 判定2 -->
  <polygon points="500,298 646,346 500,394 354,346" fill="#dbeafe" stroke="#2563eb"/>
  <text x="500" y="340" font-size="12.5" fill="#1d4ed8" text-anchor="middle">磁盘分块存放、</text>
  <text x="500" y="360" font-size="12.5" fill="#1d4ed8" text-anchor="middle">随机访问占主导？</text>
  <line x1="354" y1="346" x2="268" y2="346" stroke="#334155" stroke-width="1.8" marker-end="url(#arwF)"/>
  <text x="300" y="338" font-size="12" fill="#ea580c">是</text>
  <rect x="40" y="314" width="222" height="64" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="54" y="336" font-size="12.5" font-weight="bold" fill="#ea580c">跳点（间隔挂钩 |A|/|B|）</text>
  <text x="54" y="354" font-size="11" fill="#334155">省的是寻道，不是比较次数</text>
  <text x="54" y="370" font-size="11" fill="#dc2626">默认 √|A| 间隔反而慢近一倍</text>
  <line x1="500" y1="394" x2="500" y2="426" stroke="#334155" stroke-width="1.8" marker-end="url(#arwF)"/>
  <text x="512" y="416" font-size="12" fill="#1d4ed8">否（内存中比较）</text>

  <!-- 结果3 -->
  <rect x="360" y="432" width="280" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="374" y="454" font-size="12.5" font-weight="bold" fill="#1d4ed8">短表驱动 + 二分</text>
  <text x="374" y="472" font-size="11" fill="#334155">不扫长表：690 次二分 × 16 层</text>
  <text x="374" y="488" font-size="11" fill="#334155">长短悬殊实测 4.59 倍（结论 2）</text>

  <!-- 底部判据 -->
  <rect x="40" y="524" width="920" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="548" font-size="12" fill="#334155">通用前提：先按 df 升序排求交顺序，让候选集尽快变小 —— 这是「工程上按词频先算谁」的理论依据。</text>
  <text x="60" y="570" font-size="12" fill="#dc2626">⚠️ 没有一条路线在所有情形下最优；「用了跳表」不等于「更快」，间隔选错就是纯亏损。</text>
</svg>
