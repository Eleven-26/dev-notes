    <text x="16" y="224" font-size="12.5" font-weight="bold" fill="#334155">查询 x：取这 5 个格子的最小值 = 11</text>
    <text x="16" y="246" font-size="13" fill="#334155">为什么取最小：每格 = 真实值 + 撞进来的其它元素的计数，</text>
    <text x="16" y="266" font-size="13" fill="#334155">　每行都只会偏大；不同行噪声来源不同 → 取最小</text>
    <text x="16" y="296" font-size="12.5" fill="#b45309">⭐ 误差方向确定：CMS 估计值 ≥ 真实值（只高不低）</text>
    <text x="16" y="316" font-size="12" fill="#334155">要「只低不高」的重元素估计 → Space-Saving / Misra-Gries</text>
  </g>

    <g transform="translate(20,420)">
    <rect x="0" y="0" width="960" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">实测：一个误差是随机的、一个是系统性的（20 万次插入，真实基数 78798）</text>
    <text x="16" y="58" font-size="13" fill="#334155">HLL（m = 1024，1 KB 量级内存）：真实基数 78798 → 第 1 轮估算 77713，相对误差 −1.38%；</text>
    <text x="16" y="82" font-size="13" fill="#334155">　20 轮平均偏差 −2.05%、标准差 3.11% —— 与理论 3.25% 同量级，但单次偏 6% 也在 2σ 之内，不能拿单次结果判断实现对不对。</text>
    <text x="16" y="116" font-size="13" fill="#334155">CMS（5 行 × 2000 列，uint32 共 40000 字节）：user:40 真实 1059 → 估 1100（+41）；user:17 1058 → 1102（+44）；</text>
    <text x="16" y="140" font-size="13" fill="#334155">　user:26 1058 → 1085（+27）；user:61 1055 → 1095（+40）；user:56 1054 → 1101（+47）—— 偏差全是正号，是系统性的。</text>
    <text x="16" y="172" font-size="12.5" fill="#64748b">Redis 侧：PFADD / PFCOUNT / PFMERGE（合并 = 取各桶最大值，能分片统计再合并）；但只能求并集基数，求交集得换结构。</text>
  </g>

    <g transform="translate(20,630)">
    <rect x="0" y="0" width="960" height="165" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">三种概率结构按「问什么问题」分工</text>
    <text x="16" y="52" font-size="13" font-weight="bold" fill="#334155">布隆答「在不在」（只会假阳性，绝不假阴性）｜HLL 答「有多少个不同的」（有随机误差）｜CMS 答「出现几次」（只会高估）</text>
    <text x="16" y="78" font-size="13" fill="#334155">误差方向决定用途：反垃圾 / 限流宁可多拦 → CMS 合适；统计 UV → HLL（12 KB 且可合并，精确方案要存下全部 ID）。</text>
    <text x="16" y="104" font-size="13" fill="#334155">三者可以叠着用（漏斗式）：先用布隆挡住「肯定不存在」的请求 → 再用 CMS 找热点 → 最后用 HLL 出报表。</text>
    <text x="16" y="138" font-size="13.5" font-weight="bold" fill="#b45309">⚠️ 铁律：凡涉及钱、配额、计费、对账、报表口径，一律用精确结构 —— 它们的「省」全部来自放弃精确性。</text>
  </g>

</svg>
