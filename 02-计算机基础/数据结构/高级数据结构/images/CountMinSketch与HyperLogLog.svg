  <rect x="0" y="0" width="1000" height="815" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">HyperLogLog 与 Count-Min Sketch：用精度换常数级内存</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">一个估「有多少个不同」、一个估「出现几次」，两者误差方向不同 —— 前者随机、后者只高不低</text>

    <g transform="translate(20,70)">
    <rect x="0" y="0" width="470" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">HyperLogLog：前导零位置 ↔ 有多少个不同元素</text>
    <text x="16" y="54" font-size="12" fill="#64748b">直觉：最长连续 k 次正面 → 大概抛了 2^k 次；把「硬币」换成哈希值</text>
    <rect x="16" y="76" width="438" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="28" y="99" font-size="12.5" fill="#1e40af">元素 → 哈希成一个足够长的二进制串</text>
    <line x1="235" y1="112" x2="235" y2="126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="16" y="126" width="438" height="36" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="28" y="149" font-size="12.5" fill="#334155">低位定桶号（m 个桶）｜其余位算第一个 1 在第几位</text>
    <line x1="235" y1="162" x2="235" y2="176" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="16" y="176" width="438" height="36" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="28" y="199" font-size="12.5" fill="#334155">每个桶只记录见过的最大前导零位置 M[j]</text>
    <line x1="235" y1="212" x2="235" y2="226" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
    <rect x="16" y="226" width="438" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="28" y="249" font-size="12.5" fill="#14532d">调和平均汇总：E ≈ α_m · m² / Σ 2^(−M[j])</text>
    <text x="16" y="286" font-size="12.5" fill="#334155">误差只与桶数有关：相对标准误 ≈ 1.04 / √m</text>
    <text x="16" y="308" font-size="12.5" fill="#b45309">m=1024 → 768 B → 3.25%；m=16384（Redis 默认）→ 12 KB → 0.81%</text>
  </g>

