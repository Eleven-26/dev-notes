  <text x="500" y="605" text-anchor="middle" font-size="12" fill="#64748b">实测输出（golang:1.26-alpine / eclipse-temurin:8-jdk，两语言逐行一致）：L6=[7] L5=[7 25] L4=[7 25] L3=[7 25] L2=[3 7 21 25] L1=[3 7 12 18 21 25] L0=[1 3 6 7 9 12 18 21 25]，比较 9 次</text>
