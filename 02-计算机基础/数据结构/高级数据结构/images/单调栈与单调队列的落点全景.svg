<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">单调栈与单调队列的落点全景</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">一条判据定去留：被弹出的元素再也不会被用到 → 及时删除；要召回，就换别的结构</text>

  <defs>
    <marker id="msqArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- 左：两个容器 -->
  <rect x="30" y="100" width="250" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">单调栈（栈）</text>
  <text x="155" y="152" text-anchor="middle" font-size="12" fill="#334155">答：左右第一个更大 / 更小</text>
  <text x="155" y="174" text-anchor="middle" font-size="12" fill="#334155">一趟扫描同时拿左右答案</text>
  <text x="155" y="196" text-anchor="middle" font-size="12" fill="#334155">不过期：弹出 = 答案结算</text>

  <rect x="30" y="260" width="250" height="120" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="155" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">单调队列（deque）</text>
  <text x="155" y="312" text-anchor="middle" font-size="12" fill="#334155">答：滑动窗口的最大 / 最小</text>
  <text x="155" y="334" text-anchor="middle" font-size="12" fill="#334155">双端弹：队首过期 · 队尾被压</text>
  <text x="155" y="356" text-anchor="middle" font-size="12" fill="#334155">必须存下标（判过期）</text>

  <rect x="30" y="420" width="250" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="155" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">赌输 → 换结构</text>
  <text x="155" y="470" text-anchor="middle" font-size="11.5" fill="#64748b">第 K 大 · 分位数 · 任意区间</text>
  <text x="155" y="492" text-anchor="middle" font-size="11.5" fill="#64748b">→ 堆 / 平衡树 / 线段树</text>

  <!-- 右：落点 -->
  <rect x="440" y="100" width="260" height="96" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="456" y="124" font-size="13.5" font-weight="bold" fill="#9a3412">DP 转移加速</text>
  <text x="456" y="148" font-size="11.5" fill="#334155">转移 = 区间最值，队首直接取</text>
  <text x="456" y="170" font-size="11.5" fill="#334155">O(n·W) → O(n)（DP 优化 · 背包）</text>

  <rect x="720" y="100" width="250" height="96" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="736" y="124" font-size="13.5" font-weight="bold" fill="#9a3412">变长滑动窗口</text>
  <text x="736" y="148" font-size="11.5" fill="#334155">双指针管合法，队列管最值</text>
  <text x="736" y="170" font-size="11.5" fill="#334155">堆只够 O(n log k)</text>

  <rect x="440" y="230" width="260" height="96" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="456" y="254" font-size="13.5" font-weight="bold" fill="#9a3412">0-1 BFS</text>
  <text x="456" y="278" font-size="11.5" fill="#334155">边权 0 push_front · 1 push_back</text>
  <text x="456" y="300" font-size="11.5" fill="#334155">距离单调，省掉每步取堆</text>

  <rect x="720" y="230" width="250" height="96" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="736" y="254" font-size="13.5" font-weight="bold" fill="#9a3412">扫描线</text>
  <text x="736" y="278" font-size="11.5" fill="#334155">扫描推进 = 窗口移动</text>
  <text x="736" y="300" font-size="11.5" fill="#334155">区间内最值的配合位</text>

  <rect x="440" y="360" width="260" height="96" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="456" y="384" font-size="13.5" font-weight="bold" fill="#166534">指标峰值 / 突破</text>
  <text x="456" y="408" font-size="11.5" fill="#334155">窗口峰值 = 单调队列</text>
  <text x="456" y="430" font-size="11.5" fill="#334155">何时超阈值 = 下一个更大元素</text>

  <rect x="720" y="360" width="250" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="736" y="384" font-size="13.5" font-weight="bold" fill="#1e3a8a">价格 / 交易曲线</text>
  <text x="736" y="408" font-size="11.5" fill="#334155">下一个更高点 · 连涨连跌</text>
  <text x="736" y="430" font-size="11.5" fill="#334155">循环数组：扫 2n、只写 i &lt; n</text>

  <!-- 连线 -->
  <g stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#msqArrow)">
    <line x1="280" y1="160" x2="436" y2="400"/>
    <line x1="280" y1="160" x2="716" y2="400"/>
    <line x1="280" y1="320" x2="436" y2="160"/>
    <line x1="280" y1="320" x2="716" y2="160"/>
    <line x1="280" y1="335" x2="436" y2="290"/>
    <line x1="280" y1="335" x2="716" y2="290"/>
    <line x1="280" y1="350" x2="436" y2="415"/>
  </g>

  <!-- 底部判据 -->
  <rect x="30" y="530" width="380" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="46" y="552" font-size="12.5" font-weight="bold" fill="#334155">共同前提</text>
  <text x="46" y="572" font-size="11.5" fill="#334155">问题 = 「左右第一个大/小」或「窗口端点单调 + 窗口极值」，</text>
  <text x="46" y="590" font-size="11.5" fill="#334155">且弹出的永不复用 —— 摊还 2n 次操作</text>

  <rect x="440" y="530" width="530" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="456" y="552" font-size="12.5" font-weight="bold" fill="#991b1b">失效边界</text>
  <text x="456" y="572" font-size="11.5" fill="#334155">任意区间查询 → 线段树 / 树状数组；第 K 大、分位数 → 堆 / 平衡树 / sketch</text>
  <text x="456" y="590" font-size="11.5" fill="#334155">窗口端点不回退的前提一旦被破坏，单调容器就不成立</text>
</svg>
