<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="610" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">布谷鸟过滤器与布隆的选型决策树：要取值吗？要删吗？付得起哪种代价？</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">两者共同保证「只有假阳性、没有假阴性」；图中误判率均为同空间 8 bit/元素下的容器实测（Go 1.26.8）</text>

  <rect x="330" y="80" width="340" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Q0 只问「在不在」、不要取值？</text>
  <text x="500" y="124" text-anchor="middle" font-size="11" fill="#334155">过滤器给不出「映射到什么」，也不给次数</text>

  <line x1="330" y1="108" x2="304" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="317" y="98" text-anchor="middle" font-size="12" fill="#dc2626">否</text>
  <rect x="40" y="76" width="260" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="170" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">回到散列表</text>
  <text x="170" y="126" text-anchor="middle" font-size="11" fill="#334155">要取值或枚举成员，直接用它</text>

  <line x1="500" y1="136" x2="500" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="514" y="154" font-size="12" fill="#16a34a">是</text>

  <rect x="330" y="160" width="340" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Q1 元素会离开集合吗？</text>
  <text x="500" y="204" text-anchor="middle" font-size="11" fill="#334155">会话过期、租约到期、券码核销都算「离开」</text>

  <line x1="670" y1="188" x2="700" y2="188" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="685" y="178" text-anchor="middle" font-size="12" fill="#dc2626">不会</text>
  <rect x="700" y="150" width="260" height="96" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="830" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">布隆过滤器 —— 只增场景</text>
  <text x="830" y="196" text-anchor="middle" font-size="11" fill="#334155">同空间：8 bit/元素、k = 6</text>
  <text x="830" y="216" text-anchor="middle" font-size="11" fill="#334155">实测误判 2.14%，低于布谷鸟的 2.97%</text>
  <text x="830" y="236" text-anchor="middle" font-size="11" fill="#64748b">日志去重、爬虫 URL 去重走这里</text>

  <line x1="500" y1="216" x2="500" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="514" y="234" font-size="12" fill="#16a34a">会</text>

  <rect x="280" y="240" width="440" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Q2 补删除的三条路，付得起哪种代价？</text>
  <text x="500" y="284" text-anchor="middle" font-size="11" fill="#334155">布隆清位会连带清掉别人的记录 → 必须换形态</text>

  <line x1="500" y1="296" x2="180" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="296" x2="500" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="296" x2="820" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="40" y="330" width="280" height="76" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="180" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">Counting Bloom</text>
  <text x="180" y="378" text-anchor="middle" font-size="11" fill="#334155">把每个位换成计数器</text>
  <text x="180" y="396" text-anchor="middle" font-size="11" fill="#b91c1c">代价：内存翻 3~4 倍</text>

  <rect x="360" y="330" width="280" height="76" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="500" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">定期重建</text>
  <text x="500" y="378" text-anchor="middle" font-size="11" fill="#334155">误判率随元素数单调上升</text>
  <text x="500" y="396" text-anchor="middle" font-size="11" fill="#b91c1c">重建本身是 O(n) 全量操作</text>

  <rect x="680" y="330" width="280" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="820" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">⭐ 布谷鸟过滤器</text>
  <text x="820" y="378" text-anchor="middle" font-size="11" fill="#334155">空间与布隆同量级 · 原生支持删除</text>
  <text x="820" y="396" text-anchor="middle" font-size="11" fill="#334155">误判率由指纹位数决定，与元素数无关</text>

  <rect x="40" y="430" width="920" height="120" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="60" y="456" font-size="14" font-weight="bold" fill="#ea580c">选到布谷鸟后，三条工程硬约束必须同时满足（第三节实测与 4.3 收尾判据）</text>
  <text x="60" y="482" font-size="13" fill="#7c2d12">桶数必须是 2 的幂 —— XOR 对合性被破坏会静默漏检（实测 25000 桶时 85000 个里漏检 4525 个）</text>
  <text x="60" y="506" font-size="13" fill="#7c2d12">负载约 0.95 封顶 —— 实测 0.9688 时 63488 个中 4 个插入失败，踢出链在此附近频繁耗尽</text>
  <text x="60" y="532" font-size="13" fill="#7c2d12">「插入失败」不是异常而是容量告警 —— 扩容重建，或放弃该元素（当作「可能在」，交给下游精确校验）</text>

  <text x="40" y="584" font-size="12" fill="#94a3b8">（2.14% / 2.97% / 3~4 倍 / 4525 / 0.9688 等数字均出自本篇第一节表、第三节实测与脚注）</text>
</svg>
