  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">两个实测现场（Go 1.26.8 与 JDK 1.8.0_504 同种子 42，输出逐行一致）：插 15 只付 1 对指针；插 7 抽到 7 层触发晋升</text>

