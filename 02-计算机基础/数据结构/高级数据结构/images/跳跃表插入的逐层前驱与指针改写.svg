  <text x="500" y="276" text-anchor="middle" font-size="13" fill="#64748b">插入的代价只跟「抽到几层」有关，跟表有多大、插在哪儿无关 —— 没有再平衡阶段</text>

  <rect x="30" y="312" width="940" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
