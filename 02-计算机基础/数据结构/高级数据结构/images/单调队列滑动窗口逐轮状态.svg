<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">单调队列滑动窗口最大值：逐轮状态（输入 1 3 -1 -3 5 3 6 7，k = 3）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">deque 存下标；队首过期弹出（与值无关），队尾弹掉比当前小的（与值有关）—— 每一步的队首就是当轮窗口最大值</text>

  <g font-family="Consolas, Courier New, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">
    <text x="178" y="102">0</text>
    <text x="240" y="102">1</text>
    <text x="302" y="102">2</text>
    <text x="364" y="102">3</text>
    <text x="426" y="102">4</text>
    <text x="488" y="102">5</text>
    <text x="550" y="102">6</text>
    <text x="612" y="102">7</text>
  </g>

  <text x="40" y="134" font-size="13" font-weight="bold" fill="#0f172a">i = 1（值 3）</text>
  <g font-family="Consolas, Courier New, monospace" font-size="13" fill="#334155" text-anchor="middle">
    <rect x="150" y="108" width="56" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="212" y="108" width="56" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="274" y="108" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="336" y="108" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="398" y="108" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="460" y="108" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="522" y="108" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="584" y="108" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="178" y="136">1</text>
    <text x="240" y="136">3</text>
    <text x="302" y="136">-1</text>
    <text x="364" y="136">-3</text>
    <text x="426" y="136">5</text>
    <text x="488" y="136">3</text>
    <text x="550" y="136">6</text>
    <text x="612" y="136">7</text>
  </g>
  <text x="660" y="126" font-size="12" fill="#334155">队首过期：否；队尾弹出：0（值 1 &lt; 3）</text>
  <text x="660" y="148" font-size="12" fill="#64748b">deque [1] —— i 未到 k−1，还不出答案</text>

  <text x="40" y="194" font-size="13" font-weight="bold" fill="#0f172a">i = 3（值 -3）</text>
  <g font-family="Consolas, Courier New, monospace" font-size="13" fill="#334155" text-anchor="middle">
    <rect x="150" y="168" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="212" y="168" width="56" height="44" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="274" y="168" width="56" height="44" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="336" y="168" width="56" height="44" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="398" y="168" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="460" y="168" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="522" y="168" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="584" y="168" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="178" y="196">1</text>
    <text x="240" y="196">3</text>
    <text x="302" y="196">-1</text>
    <text x="364" y="196">-3</text>
    <text x="426" y="196">5</text>
    <text x="488" y="196">3</text>
    <text x="550" y="196">6</text>
    <text x="612" y="196">7</text>
  </g>
  <text x="660" y="186" font-size="12" fill="#334155">队首过期：否；队尾弹出：无</text>
  <text x="660" y="208" font-size="12" fill="#64748b">deque [1 2 3]，队首 1 → 窗口 [1,3] 最大值 3</text>

  <text x="40" y="254" font-size="13" font-weight="bold" fill="#0f172a">i = 4（值 5）</text>
  <g font-family="Consolas, Courier New, monospace" font-size="13" fill="#334155" text-anchor="middle">
    <rect x="150" y="228" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="212" y="228" width="56" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="274" y="228" width="56" height="44" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="336" y="228" width="56" height="44" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="398" y="228" width="56" height="44" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="460" y="228" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="522" y="228" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="584" y="228" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="178" y="256">1</text>
    <text x="240" y="256">3</text>
    <text x="302" y="256">-1</text>
    <text x="364" y="256">-3</text>
    <text x="426" y="256">5</text>
    <text x="488" y="256">3</text>
    <text x="550" y="256">6</text>
    <text x="612" y="256">7</text>
  </g>
  <text x="660" y="246" font-size="12" fill="#b91c1c">队首 1 ≤ i − k = 1 过期弹出；队尾弹出 3、2</text>
  <text x="660" y="268" font-size="12" fill="#64748b">deque [4]，队首 4 → 窗口 [2,4] 最大值 5</text>

  <text x="40" y="314" font-size="13" font-weight="bold" fill="#0f172a">i = 6（值 6）</text>
  <g font-family="Consolas, Courier New, monospace" font-size="13" fill="#334155" text-anchor="middle">
    <rect x="150" y="288" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="212" y="288" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="274" y="288" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="336" y="288" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="398" y="288" width="56" height="44" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="460" y="288" width="56" height="44" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="522" y="288" width="56" height="44" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="584" y="288" width="56" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="178" y="316">1</text>
    <text x="240" y="316">3</text>
    <text x="302" y="316">-1</text>
    <text x="364" y="316">-3</text>
    <text x="426" y="316">5</text>
    <text x="488" y="316">3</text>
    <text x="550" y="316">6</text>
    <text x="612" y="316">7</text>
  </g>
  <text x="660" y="306" font-size="12" fill="#334155">队首过期：否；队尾弹出：5、4</text>
  <text x="660" y="328" font-size="12" fill="#64748b">deque [6]，队首 6 → 窗口 [4,6] 最大值 6</text>

  <text x="150" y="352" font-size="11" fill="#64748b">图例：橙 = 当前窗口 · 红 = 刚过期被弹出的下标 · 蓝 = 窗口未完整 · deque 内数值从队首到队尾单调递减</text>

  <rect x="40" y="374" width="920" height="150" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="400" font-size="14" font-weight="bold" fill="#0f172a">两条不变量合起来 → 队首既在窗口内、又是队列最大</text>
  <text x="60" y="426" font-size="13" fill="#334155">① 队列里只有当前窗口内的下标 —— 由「队首过期弹出」维护（与值无关）</text>
  <text x="60" y="450" font-size="13" fill="#334155">② 队列值从队首到队尾单调递减 —— 由「队尾弹掉更小的」维护（与值有关）</text>
  <text x="60" y="474" font-size="13" fill="#334155">逐窗口结果 3 3 5 5 6 7 与暴力逐位一致；队尾弹用 &lt;= 还是 &lt; 都对，区别只在是否保留等值元素</text>
  <text x="60" y="502" font-size="13" fill="#b45309">⭐ 单调栈的栈顶永不过期（它只需要答案），单调队列的队首会过期（它有窗口约束）—— 唯一的实质差别</text>

  <text x="40" y="560" font-size="12" fill="#94a3b8">（每轮动作与 deque 内容逐行摘自本篇 4.3 节实测 trace 表）</text>
</svg>
