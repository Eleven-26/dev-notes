<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="760" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">高级数据结构体系总览：用额外假设，换更快的操作（确定性保证）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">硬前提违反后得到的不是「慢」，而是结果不可信或结构被破坏 · 概率结构已拆分到 概率与统计/</text>

  <rect x="20" y="76" width="960" height="112" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="36" y="100" font-size="15" font-weight="bold" fill="#0f172a">一、三条换法：都在「用假设换东西」</text>
  <rect x="36" y="112" width="300" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="186" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">用主动淘汰换时间</text>
  <text x="186" y="157" text-anchor="middle" font-size="12" fill="#1e3a8a">单调栈 / 单调队列 / 时间轮</text>
  <rect x="350" y="112" width="300" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">用随机层数换动态有序</text>
  <text x="500" y="157" text-anchor="middle" font-size="12" fill="#14532d">跳跃表（期望 O(log n)，免旋转）</text>
  <rect x="664" y="112" width="300" height="60" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="814" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">用一次预处理换直接命中</text>
  <text x="814" y="157" text-anchor="middle" font-size="12" fill="#7c2d12">倒排索引 / 并查集</text>

  <line x1="500" y1="188" x2="500" y2="204" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="20" y="206" width="960" height="214" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="230" font-size="15" font-weight="bold" fill="#0f172a">二、本目录五篇按「回答什么问题」归族</text>
  <rect x="36" y="246" width="300" height="156" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="48" y="270" font-size="13" font-weight="bold" fill="#1d4ed8">① 线性与定时（2 篇）</text>
  <text x="48" y="296" font-size="13" fill="#334155">单调栈与单调队列</text>
  <text x="48" y="318" font-size="13" fill="#334155">时间轮（定时器 O(1)）</text>
  <text x="48" y="346" font-size="12" fill="#64748b">⭐ 无窗口用栈，有滑动窗口必须用队列</text>
  <text x="48" y="366" font-size="12" fill="#64748b">⭐ 时间轮前提：延迟在一圈内</text>
  <text x="48" y="386" font-size="12" fill="#64748b">摊还账：每个元素进出各一次 = 2n</text>
  <rect x="350" y="246" width="300" height="156" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="362" y="270" font-size="13" font-weight="bold" fill="#15803d">② 动态有序（1 篇）</text>
  <text x="362" y="296" font-size="13" fill="#334155">跳跃表</text>
  <text x="362" y="324" font-size="12" fill="#64748b">多层链表 + 随机层数，免旋转</text>
  <text x="362" y="344" font-size="12" fill="#64748b">只给期望，不给最坏</text>
  <text x="362" y="364" font-size="12" fill="#64748b">实测 ≈ 30.1 次比较（理论 33）</text>
  <text x="362" y="384" font-size="12" fill="#64748b">对照：静态数据排序 + 二分（≈ 16 次）</text>
  <rect x="664" y="246" width="300" height="156" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="676" y="270" font-size="13" font-weight="bold" fill="#c2410c">③ 检索与连通（2 篇）</text>
  <text x="676" y="296" font-size="13" fill="#334155">倒排索引 / 并查集</text>
  <text x="676" y="324" font-size="12" fill="#64748b">倒排表必须有序：差分压缩 42.1%</text>
  <text x="676" y="344" font-size="12" fill="#64748b">求交：短表驱动 + 二分 4.59 倍</text>
  <text x="676" y="364" font-size="12" fill="#64748b">并查集：按秩 + 路径压缩 → α(n)</text>
  <text x="676" y="384" font-size="12" fill="#64748b">⚠️ 只支持合并，不支持删边回滚</text>

  <line x1="500" y1="420" x2="500" y2="436" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="20" y="438" width="590" height="196" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="36" y="462" font-size="15" font-weight="bold" fill="#991b1b">三、硬前提速查（违反的后果都有实测）</text>
  <text x="36" y="488" font-size="12" fill="#7f1d1d">· 时间轮延迟必须小于一圈，否则任务提前整整一圈触发且不报错（实测：期望第 261 个 tick，第 6 个就跑）</text>
  <text x="36" y="510" font-size="12" fill="#7f1d1d">· 单调栈管不了「带窗口」的问题（过期元素删不掉）→ 必须换单调队列</text>
  <text x="36" y="532" font-size="12" fill="#7f1d1d">· 倒排表必须有序，否则差分压缩、求交、跳点三件事全部失效</text>
  <text x="36" y="554" font-size="12" fill="#7f1d1d">· 跳跃表给的是期望、且数据要在内存：磁盘按页读取换 B+ 树</text>
  <text x="36" y="576" font-size="12" fill="#7f1d1d">· 并查集只支持合并与查询：拆边 / 回滚要换带删除的连通性结构</text>
  <text x="36" y="606" font-size="12" fill="#991b1b">⭐ 每条硬前提都不是「优化建议」，而是结构成立的最低条件</text>

  <rect x="626" y="438" width="354" height="196" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="642" y="462" font-size="15" font-weight="bold" fill="#6d28d9">四、与概率结构的分界</text>
  <text x="642" y="490" font-size="12" fill="#4c1d95">本目录：结果一定对（跳表只弱化最坏界）</text>
  <text x="642" y="512" font-size="12" fill="#4c1d95">概率与统计/：允许近似，误差方向固定</text>
  <text x="642" y="540" font-size="13" font-weight="bold" fill="#6d28d9">→ 位图 / 布隆 / 布谷鸟 / HLL / CMS</text>
  <text x="642" y="566" font-size="12" fill="#4c1d95">判据：这个结果能不能接受近似？</text>
  <text x="642" y="588" font-size="12" fill="#4c1d95">⚠️ 概率结构只做前置过滤，不当权威答案</text>
  <text x="642" y="614" font-size="12" fill="#4c1d95">两者常串联：布隆挡无效查询 → 倒排求交</text>

  <rect x="20" y="650" width="960" height="88" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="36" y="674" font-size="13" fill="#334155">上游（不在本目录）：「树有哪些形态」见 ../README.md 第三节；内存平衡树见 ../树/内存平衡树/；堆见 ../堆/</text>
  <text x="36" y="696" font-size="13" fill="#334155">跨目录出口：「数据怎么算」在 算法/；一致性哈希在 04-架构与系统/分布式/服务治理/</text>
  <text x="36" y="720" font-size="12" fill="#64748b">图内数字全部抄自各篇正文与容器实测；图只做结构定位，不替代判据与实测</text>
</svg>
