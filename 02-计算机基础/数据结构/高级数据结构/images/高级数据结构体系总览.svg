<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">高级数据结构体系总览：用额外假设，换更快的操作</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">硬前提违反后得到的不是「慢」，而是结果不可信或内存爆掉 · 先分清保证是「确定性」还是「概率性」</text>

  <text x="20" y="90" font-size="13" font-weight="bold" fill="#2563eb">一、三条换法：都在「用假设换东西」</text>

  <rect x="20" y="100" width="310" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="34" y="126" font-size="13.5" font-weight="bold" fill="#1e3a8a">用概率换空间</text>
  <text x="34" y="150" font-size="11.5" fill="#1e3a8a">位图 / 布隆 / 布谷鸟 / 基数估计</text>
  <text x="34" y="170" font-size="11.5" fill="#1e3a8a">只回答「可能在」或近似值</text>

  <rect x="345" y="100" width="310" height="80" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="359" y="126" font-size="13.5" font-weight="bold" fill="#14532d">用偏序 / 主动淘汰换时间</text>
  <text x="359" y="150" font-size="11.5" fill="#14532d">堆 / 单调栈 / 单调队列 / 时间轮</text>
  <text x="359" y="170" font-size="11.5" fill="#14532d">只保证「需要的那个顺序」</text>

  <rect x="670" y="100" width="310" height="80" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="684" y="126" font-size="13.5" font-weight="bold" fill="#78350f">用平衡 / 随机层数换动态有序</text>
  <text x="684" y="150" font-size="11.5" fill="#78350f">平衡树 / 跳跃表 / 倒排索引</text>
  <text x="684" y="170" font-size="11.5" fill="#78350f">免旋转，也免全表扫</text>

  <text x="20" y="206" font-size="13" font-weight="bold" fill="#2563eb">二、本目录八篇按「回答什么问题」归族</text>

  <rect x="20" y="216" width="232" height="150" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="34" y="242" font-size="13" font-weight="bold" fill="#1e3a8a">① 判存在（2 篇）</text>
  <text x="34" y="266" font-size="11.5" fill="#1e3a8a">位图与布隆过滤器</text>
  <text x="34" y="286" font-size="11.5" fill="#1e3a8a">布谷鸟过滤器（可删除）</text>
  <text x="34" y="310" font-size="11" fill="#475569">⭐ 布隆只会假阳性，</text>
  <text x="34" y="328" font-size="11" fill="#475569">不会假阴性，且不能删</text>

  <rect x="260" y="216" width="232" height="150" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="274" y="242" font-size="13" font-weight="bold" fill="#3730a3">② 估规模 · 估频次（1 篇）</text>
  <text x="274" y="266" font-size="11.5" fill="#3730a3">基数与频率估计</text>
  <text x="274" y="286" font-size="11.5" fill="#3730a3">HyperLogLog / Count-Min</text>
  <text x="274" y="310" font-size="11" fill="#475569">⭐ 不存原值，只存</text>
  <text x="274" y="328" font-size="11" fill="#475569">「有多少个 / 出现几次」</text>

  <rect x="500" y="216" width="232" height="150" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="514" y="242" font-size="13" font-weight="bold" fill="#14532d">③ 极值 · 有序（2 篇）</text>
  <text x="514" y="266" font-size="11.5" fill="#14532d">单调栈与单调队列</text>
  <text x="514" y="286" font-size="11.5" fill="#14532d">跳跃表（随机层数免旋转）</text>
  <text x="514" y="310" font-size="11" fill="#475569">⭐ 无窗口用栈，</text>
  <text x="514" y="328" font-size="11" fill="#475569">有滑动窗口必须用队列</text>

  <rect x="740" y="216" width="232" height="150" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text x="754" y="242" font-size="13" font-weight="bold" fill="#7c2d12">④ 工程结构（3 篇）</text>
  <text x="754" y="266" font-size="11.5" fill="#7c2d12">倒排索引（值 → 主键集合）</text>
  <text x="754" y="286" font-size="11.5" fill="#7c2d12">时间轮（定时器 O(1)）</text>
  <text x="754" y="306" font-size="11.5" fill="#7c2d12">并查集（按秩 + 路径压缩）</text>
  <text x="754" y="328" font-size="11" fill="#475569">⭐ 都靠一条不变式撑着</text>

  <text x="20" y="384" font-size="13" font-weight="bold" fill="#2563eb">三、硬前提速查（违反的后果都有实测）与一条实用判据</text>

  <rect x="20" y="394" width="960" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="420" font-size="13.5" font-weight="bold" fill="#0f172a">每条结构都有一条硬前提，违反它不报错只出错</text>
  <text x="34" y="444" font-size="12.5" fill="#334155">· 布谷鸟过滤器的桶数必须是 2 的幂，否则被踢出的指纹落进查不回来的桶 —— 静默漏检（实测 85000 个里漏检 4525 个）</text>
  <text x="34" y="466" font-size="12.5" fill="#334155">· 时间轮的延迟必须小于一圈，否则任务提前整整一圈触发且不报错（实测：期望第 261 个 tick，第 6 个就跑）</text>
  <text x="34" y="488" font-size="12.5" fill="#334155">· 单调栈管不了「带窗口」的问题（过期元素删不掉）→ 必须换单调队列；倒排表必须有序，否则压缩与求交全失效</text>
  <text x="34" y="510" font-size="12.5" fill="#334155">· 跳跃表给的是期望、且数据要在内存：磁盘按页读要换 B+ 树，硬时限场景该用红黑树；位图要求范围有限且较稠密</text>
  <text x="34" y="532" font-size="12" fill="#64748b">⭐ 实用判据：先问「保证是确定性还是概率性」—— 概率结构只配用来「排除 / 近似」，永远不能当权威答案</text>
</svg>
