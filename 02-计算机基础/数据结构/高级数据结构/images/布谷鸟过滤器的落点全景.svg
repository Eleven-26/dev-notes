<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">布谷鸟过滤器的落点全景</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">所有落点都在「判存在 + 要删除」的交集上 —— 不需要删的场景，布隆仍然更便宜</text>

  <defs>
    <marker id="ckfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- 左：结构本体 -->
  <rect x="30" y="100" width="320" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">布谷鸟过滤器</text>
  <text x="190" y="150" text-anchor="middle" font-size="12" fill="#334155">8 bit 指纹 · 两个候选桶 · 踢出</text>
  <text x="190" y="172" text-anchor="middle" font-size="12" fill="#334155">可删除 · 误判率与元素数无关</text>
  <text x="190" y="194" text-anchor="middle" font-size="12" fill="#334155">查询只碰 2 桶 · 与 n 无关的 O(1)</text>
  <text x="190" y="216" text-anchor="middle" font-size="12" fill="#991b1b">⚠️ 桶数必须 2 的幂（XOR 对合）</text>

  <rect x="30" y="270" width="320" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="190" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">对照线（同为补删除）</text>
  <text x="190" y="318" text-anchor="middle" font-size="11.5" fill="#64748b">布隆：误判更低（2.14% vs 2.97%）但不能删</text>
  <text x="190" y="340" text-anchor="middle" font-size="11.5" fill="#64748b">Counting Bloom：能删但内存翻 3~4 倍</text>

  <!-- 右：落点 -->
  <rect x="480" y="100" width="490" height="92" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="496" y="124" font-size="14" font-weight="bold" fill="#166534">在线会话 / 租约表</text>
  <text x="496" y="147" font-size="11.5" fill="#334155">发放 Add · 过期 Delete —— 元素真的会离开集合</text>
  <text x="496" y="166" font-size="11.5" fill="#334155">布隆在这条线上只能靠定期重建硬撑</text>

  <rect x="480" y="204" width="490" height="92" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="496" y="228" font-size="14" font-weight="bold" fill="#166534">一次性券码的「已核销」判定</text>
  <text x="496" y="251" font-size="11.5" fill="#334155">判「肯定未核销」才直接放行，假阳性只多一次校验</text>
  <text x="496" y="270" font-size="11.5" fill="#334155">删除是指纹级移除：实测删 10000、其余 52000 误删 0</text>

  <rect x="480" y="308" width="490" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="496" y="332" font-size="14" font-weight="bold" fill="#1e3a8a">LSM 每层 SSTable 过滤器</text>
  <text x="496" y="355" font-size="11.5" fill="#334155">每文件一份，先问「肯定不在」跳过读盘（实测挡 61.1%）</text>
  <text x="496" y="374" font-size="11.5" fill="#334155">Compaction 整层替换、过滤器随之释放，贴合替换语义</text>

  <rect x="480" y="412" width="490" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="496" y="436" font-size="14" font-weight="bold" fill="#1e3a8a">限流白名单 · 服务内嵌存在性索引</text>
  <text x="496" y="459" font-size="11.5" fill="#334155">单份内存同时承担 ADD 与 DEL，不维护两套结构</text>
  <text x="496" y="478" font-size="11.5" fill="#334155">Redis 侧 BF.* 是布隆形态，自建选型以官方文档为准</text>

  <!-- 连线 -->
  <g stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#ckfArrow)">
    <line x1="350" y1="150" x2="476" y2="140"/>
    <line x1="350" y1="170" x2="476" y2="245"/>
    <line x1="350" y1="190" x2="476" y2="350"/>
    <line x1="350" y1="210" x2="476" y2="455"/>
  </g>

  <!-- 底部约束 -->
  <rect x="30" y="524" width="940" height="92" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="46" y="548" font-size="13.5" font-weight="bold" fill="#991b1b">工程约束（落点成立需同时满足）</text>
  <text x="46" y="572" font-size="12" fill="#334155">负载约 0.95 封顶：附近踢出链频繁耗尽，「插入失败」= 容量告警 → 扩容重建或放弃该元素</text>
  <text x="46" y="594" font-size="12" fill="#334155">桶数必须 2 的幂（否则静默漏检）· 指纹位数不贪短（同桶同指纹有删除歧义）</text>
</svg>
