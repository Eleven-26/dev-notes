<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">跳跃表节点里到底装了什么：表 → 层 → 节点 → 指针数组的四层嵌套</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">unsafe.Sizeof 实测 + 2.2 那张表逐节点计数 · Go 1.26.8（golang:1.26-alpine，linux/amd64）· 连跑两遍逐行相同</text>

  <rect x="30" y="72" width="940" height="196" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="500" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">嵌套：一张表由 7 条层链组成，每条链由节点组成，每个节点带一个变长指针数组</text>

  <rect x="48" y="108" width="410" height="38" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="54" y="132" font-size="12" fill="#1e3a8a">第 1 层：一张表 = head 哨兵 + 全局最高层 L6 + tail</text>
  <rect x="90" y="154" width="368" height="38" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="96" y="178" font-size="12" fill="#14532d">第 2 层：7 条层链 L0~L6（L0 有 9 个、L6 只有 1 个）</text>
  <rect x="132" y="200" width="326" height="38" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="138" y="224" font-size="12" fill="#9a3412">第 3 层：一个节点 node{ key, forward }</text>
  <rect x="174" y="246" width="284" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="180" y="268" font-size="12" fill="#991b1b">第 4 层：forward 数组，长度 = 节点层数</text>

  <text x="500" y="132" font-size="12" fill="#64748b">head：32 + 17×8 = 168 字节（17 个指针槽）</text>
  <text x="500" y="154" font-size="12" fill="#64748b">tail：32 + 0×8 = 32 字节（forward 是 nil）</text>
  <text x="500" y="182" font-size="13" fill="#334155">node{} 的 unsafe.Sizeof = 32 字节</text>
  <text x="500" y="206" font-size="12" fill="#64748b">key 8 字节　切片头 []*node 24 字节</text>
  <text x="500" y="230" font-size="12" fill="#64748b">切片头拆法：指针 8 + len 8 + cap 8</text>
  <text x="500" y="254" font-size="12" fill="#9a3412">指针数组本体另算：每格 8 字节（*node = 8）</text>

  <rect x="30" y="284" width="940" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="500" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">逐节点字节账：字节 = 32 + 层数 × 8（同一张表里最大 88、最小 40）</text>
  <text x="48" y="330" font-size="12" fill="#64748b">键</text>
  <text x="100" y="330" font-size="12" fill="#64748b">层数 = 指针槽</text>
  <text x="250" y="330" font-size="12" fill="#64748b">算式</text>
  <text x="430" y="330" font-size="12" fill="#64748b">字节数</text>
  <g font-size="11">
    <text x="48" y="360" fill="#334155">1</text><text x="100" y="360" fill="#64748b">1</text><text x="250" y="360" fill="#64748b">32 + 1×8</text><rect x="430" y="349" width="69" height="15" rx="2" fill="#dbeafe" stroke="#2563eb"/><text x="508" y="360" fill="#1e3a8a">40</text>
    <text x="48" y="384" fill="#334155">3</text><text x="100" y="384" fill="#64748b">3</text><text x="250" y="384" fill="#64748b">32 + 3×8</text><rect x="430" y="373" width="137" height="15" rx="2" fill="#dbeafe" stroke="#2563eb"/><text x="576" y="384" fill="#1e3a8a">56</text>
    <text x="48" y="408" fill="#334155">6</text><text x="100" y="408" fill="#64748b">1</text><text x="250" y="408" fill="#64748b">32 + 1×8</text><rect x="430" y="397" width="69" height="15" rx="2" fill="#dbeafe" stroke="#2563eb"/><text x="508" y="408" fill="#1e3a8a">40</text>
    <text x="48" y="432" fill="#9a3412">7</text><text x="100" y="432" fill="#9a3412">7（抽到最高）</text><text x="250" y="432" fill="#9a3412">32 + 7×8</text><rect x="430" y="421" width="480" height="15" rx="2" fill="#ffedd5" stroke="#ea580c"/><text x="918" y="432" fill="#9a3412">88</text>
    <text x="48" y="456" fill="#334155">9</text><text x="100" y="456" fill="#64748b">1</text><text x="250" y="456" fill="#64748b">32 + 1×8</text><rect x="430" y="445" width="69" height="15" rx="2" fill="#dbeafe" stroke="#2563eb"/><text x="508" y="456" fill="#1e3a8a">40</text>
    <text x="48" y="480" fill="#334155">12</text><text x="100" y="480" fill="#64748b">2</text><text x="250" y="480" fill="#64748b">32 + 2×8</text><rect x="430" y="469" width="103" height="15" rx="2" fill="#dbeafe" stroke="#2563eb"/><text x="542" y="480" fill="#1e3a8a">48</text>
    <text x="48" y="504" fill="#334155">18</text><text x="100" y="504" fill="#64748b">2</text><text x="250" y="504" fill="#64748b">32 + 2×8</text><rect x="430" y="493" width="103" height="15" rx="2" fill="#dbeafe" stroke="#2563eb"/><text x="542" y="504" fill="#1e3a8a">48</text>
    <text x="48" y="528" fill="#334155">21</text><text x="100" y="528" fill="#64748b">3</text><text x="250" y="528" fill="#64748b">32 + 3×8</text><rect x="430" y="517" width="137" height="15" rx="2" fill="#dbeafe" stroke="#2563eb"/><text x="576" y="528" fill="#1e3a8a">56</text>
  </g>
  <text x="48" y="548" font-size="11" fill="#64748b">键 25：6 个槽 → 32 + 6×8 = 80 字节</text>
  <text x="300" y="548" font-size="11" fill="#334155">九键合计 496 字节 = 结构体 9×32 = 288 + 指针槽 26 个 = 208 字节</text>

  <rect x="30" y="570" width="940" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="500" y="592" text-anchor="middle" font-size="12" fill="#334155">与红黑树节点的对照：红黑树固定 2 个指针（左、右）+ 1 位颜色，条数不随插入变化</text>
  <text x="500" y="612" text-anchor="middle" font-size="12" fill="#64748b">跳表的槽数跟着抽到的层数走：本篇实测平均 2.00 个（p=1/2），Redis 取 p=1/4 时理论值 1.33 个</text>

  <rect x="30" y="642" width="940" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="500" y="670" text-anchor="middle" font-size="12" fill="#334155">规模换算：10 万键随机顺序插入，指针槽合计 200073 → 每节点约 48.0 字节，全表约 4.6 MB（4.3 实测 2.01 同口径）</text>
</svg>
