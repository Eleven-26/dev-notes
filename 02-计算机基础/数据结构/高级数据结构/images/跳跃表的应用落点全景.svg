<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="650" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">跳跃表的应用落点：内存 × 动态 × 有序，三个条件同时成立才选它</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">「有序 + 快查」在磁盘 / 内存 / 高并发下分别落成 B+ 树 / 红黑树 / 跳表 —— 跳表占的是右边那一格</text>

  <g>
    <rect x="20" y="84" width="270" height="440" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="36" y="112" font-size="16" font-weight="bold" fill="#1e3a8a">链表上的多级随机索引</text>
    <line x1="60" y1="140" x2="230" y2="140" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="70" cy="140" r="5" fill="#ffffff" stroke="#2563eb"/>
    <circle cx="150" cy="140" r="5" fill="#ffffff" stroke="#2563eb"/>
    <line x1="60" y1="165" x2="230" y2="165" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="70" cy="165" r="5" fill="#ffffff" stroke="#2563eb"/>
    <circle cx="110" cy="165" r="5" fill="#ffffff" stroke="#2563eb"/>
    <circle cx="150" cy="165" r="5" fill="#ffffff" stroke="#2563eb"/>
    <circle cx="195" cy="165" r="5" fill="#ffffff" stroke="#2563eb"/>
    <line x1="60" y1="190" x2="230" y2="190" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="70" cy="190" r="5" fill="#ffffff" stroke="#2563eb"/>
    <circle cx="90" cy="190" r="5" fill="#ffffff" stroke="#2563eb"/>
    <circle cx="110" cy="190" r="5" fill="#ffffff" stroke="#2563eb"/>
    <circle cx="130" cy="190" r="5" fill="#ffffff" stroke="#2563eb"/>
    <circle cx="150" cy="190" r="5" fill="#ffffff" stroke="#2563eb"/>
    <circle cx="172" cy="190" r="5" fill="#ffffff" stroke="#2563eb"/>
    <circle cx="195" cy="190" r="5" fill="#ffffff" stroke="#2563eb"/>
    <circle cx="215" cy="190" r="5" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <path d="M70,137 C100,118 140,118 150,135" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arw)"/>
    <path d="M150,162 C170,148 190,152 195,163" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arw)"/>
    <text x="150" y="222" text-anchor="middle" font-size="11" fill="#1e3a8a">能往右就往右，走不动就降层</text>
    <text x="36" y="256" font-size="12" font-weight="bold" fill="#1e3a8a">买到了什么</text>
    <text x="36" y="276" font-size="12" fill="#334155">· 期望 O(log n) 查/插/删</text>
    <text x="36" y="294" font-size="12" fill="#334155">· 无旋转：只改相邻前驱指针</text>
    <text x="36" y="312" font-size="12" fill="#334155">· 底层顺走即范围 / 排名结果</text>
    <text x="36" y="342" font-size="12" font-weight="bold" fill="#1e3a8a">账单</text>
    <text x="36" y="362" font-size="12" fill="#334155">· 平均 1/(1-p) 个前向指针</text>
    <text x="36" y="380" font-size="12" fill="#334155">· 比较常数约是二分的 2 倍</text>
    <text x="36" y="398" font-size="12" fill="#334155">· 只有期望、没有最坏保证</text>
    <text x="36" y="428" font-size="12" fill="#1e3a8a">p=1/2（本篇实测）/ p=1/4（Redis）</text>
    <text x="36" y="456" font-size="12" font-weight="bold" fill="#7f1d1d">不选它：磁盘 → B+ 树；</text>
    <text x="36" y="474" font-size="12" font-weight="bold" fill="#7f1d1d">只读 → 二分；硬时限 → 平衡树</text>
  </g>

  <line x1="292" y1="240" x2="434" y2="126" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="292" y1="270" x2="434" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="292" y1="300" x2="434" y2="314" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="292" y1="330" x2="434" y2="408" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="292" y1="360" x2="434" y2="502" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>

  <g>
    <rect x="440" y="84" width="540" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="456" y="110" font-size="14" font-weight="bold" fill="#14532d">Redis ZSet：排行榜与范围排名</text>
    <text x="456" y="132" font-size="12" fill="#334155">跳表 + 哈希双索引，forward 挂 span 让「按排名取第 N 个」也是 O(log n)；</text>
    <text x="456" y="150" font-size="12" fill="#334155">高层定位起点、落 L0 顺走即 ZRANGE —— 分数动态变化也扛得住</text>
  </g>
  <g>
    <rect x="440" y="178" width="540" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="456" y="204" font-size="14" font-weight="bold" fill="#14532d">延迟队列：按到期时间入队</text>
    <text x="456" y="226" font-size="12" fill="#334155">Redis ZSet 以 score=执行时间戳，每轮 ZRANGEBYSCORE 取</text>
    <text x="456" y="244" font-size="12" fill="#334155">「已到期区间」—— 查询条件正是有序 + 区间，插入还高频</text>
  </g>
  <g>
    <rect x="440" y="272" width="540" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="456" y="298" font-size="14" font-weight="bold" fill="#14532d">LSM 引擎 MemTable：写路径的有序缓冲</text>
    <text x="456" y="320" font-size="12" fill="#334155">LevelDB / RocksDB 的内存表要「写多 + 有序遍历 + 只在内存」，</text>
    <text x="456" y="338" font-size="12" fill="#334155">跳表无旋转、易并发写，刷盘时按序扫即可产出有序 SSTable</text>
  </g>
  <g>
    <rect x="440" y="366" width="540" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="456" y="392" font-size="14" font-weight="bold" fill="#14532d">Java 并发有序容器：ConcurrentSkipListMap</text>
    <text x="456" y="414" font-size="12" fill="#334155">无锁实现靠 CAS 改少数几条相邻 forward 链 —— 旋转类结构一次</text>
    <text x="456" y="432" font-size="12" fill="#334155">波及一片节点，细粒度加锁与无锁都难写，这是跳表的顺风局</text>
  </g>
  <g>
    <rect x="440" y="460" width="540" height="84" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="456" y="486" font-size="14" font-weight="bold" fill="#9a3412">对照基线：跳表不占的两格</text>
    <text x="456" y="508" font-size="12" fill="#334155">只读静态数据集：排序 + 二分更快（实测比较次数约为跳表一半）；</text>
    <text x="456" y="526" font-size="12" fill="#334155">磁盘按页读：B+ 树一次 I/O 一层 —— 跳表逐层降是逐层随机 I/O</text>
  </g>

  <g>
    <rect x="20" y="566" width="960" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="36" y="590" font-size="12" font-weight="bold" fill="#7f1d1d">共同前提：数据全在内存、持续动态插删、查询是「有序」问题（范围 / 排名 / 最近邻）。</text>
    <text x="36" y="612" font-size="12" fill="#7f1d1d">失效边界：落盘 → B+ 树；静态只读 → 排序 + 二分；硬时限要最坏保证 → 平衡树；缺「动态」二字，那 2 个前向指针就是纯浪费。</text>
  </g>
</svg>
