<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">并查集：一次 find 把路上节点全挂到根上</text>
  <text x="500" y="66" text-anchor="middle" font-size="14" fill="#64748b">左＝查 0 之前（朴素 union 造出的链）；右＝查一次之后（路径压缩顺手改写）</text>

  <!-- ============ 左：链 ============ -->
  <rect x="30" y="90" width="440" height="330" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="250" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">查之前：一条链</text>

  <defs>
    <marker id="ufArrowL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="ufArrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- 链：5(root) ← 4 ← 3 ← 2 ← 1 ← 0，节点纵向排列 -->
  <g stroke="#2563eb" stroke-width="2" marker-end="url(#ufArrowL)">
    <line x1="250" y1="392" x2="250" y2="336"/>
    <line x1="250" y1="322" x2="250" y2="266"/>
    <line x1="250" y1="252" x2="250" y2="196"/>
    <line x1="250" y1="182" x2="250" y2="156"/>
  </g>

  <g font-size="15" font-weight="700">
    <circle cx="250" cy="150" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="250" y="156" text-anchor="middle" fill="#166534">5</text>

    <circle cx="250" cy="205" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="250" y="211" text-anchor="middle" fill="#1e3a8a">4</text>

    <circle cx="250" cy="260" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="250" y="266" text-anchor="middle" fill="#1e3a8a">3</text>

    <circle cx="250" cy="315" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="250" y="321" text-anchor="middle" fill="#1e3a8a">2</text>

    <circle cx="250" cy="370" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="250" y="376" text-anchor="middle" fill="#1e3a8a">1</text>

    <circle cx="250" cy="425" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="250" y="431" text-anchor="middle" fill="#1e3a8a">0</text>
  </g>

  <text x="330" y="240" font-size="13" fill="#64748b">find(0) 要上行</text>
  <text x="330" y="260" font-size="13" font-weight="700" fill="#2563eb">5 跳</text>
  <text x="330" y="440" font-size="13" fill="#64748b">树高 = 5（示例 6 个点）</text>

  <!-- ============ 右：星 ============ -->
  <rect x="530" y="90" width="440" height="330" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="750" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">查之后：一压到底</text>

  <g stroke="#16a34a" stroke-width="2" marker-end="url(#ufArrowR)">
    <line x1="600" y1="345" x2="734" y2="196"/>
    <line x1="672" y1="360" x2="740" y2="200"/>
    <line x1="750" y1="365" x2="750" y2="200"/>
    <line x1="828" y1="360" x2="760" y2="200"/>
    <line x1="900" y1="345" x2="766" y2="196"/>
  </g>

  <g font-size="15" font-weight="700">
    <circle cx="750" cy="170" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="750" y="176" text-anchor="middle" fill="#166534">5</text>

    <circle cx="585" cy="362" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="585" y="368" text-anchor="middle" fill="#1e3a8a">0</text>

    <circle cx="667" cy="378" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="667" y="384" text-anchor="middle" fill="#1e3a8a">1</text>

    <circle cx="750" cy="384" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="750" y="390" text-anchor="middle" fill="#1e3a8a">2</text>

    <circle cx="833" cy="378" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="833" y="384" text-anchor="middle" fill="#1e3a8a">3</text>

    <circle cx="915" cy="362" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="915" y="368" text-anchor="middle" fill="#1e3a8a">4</text>
  </g>

  <text x="750" y="265" text-anchor="middle" font-size="13" fill="#64748b">每个点直接指向根</text>
  <text x="750" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">find(0) 只需 1 跳</text>
  <text x="750" y="440" text-anchor="middle" font-size="13" fill="#64748b">树高 = 1</text>

  <!-- 底部实测注释 -->
  <rect x="30" y="440" width="440" height="46" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="46" y="461" font-size="13" fill="#334155">实测 n = 20000（递增 union）：树高</text>
  <text x="46" y="479" font-size="13" fill="#334155">
    <tspan font-weight="700" fill="#dc2626">19999</tspan> → <tspan font-weight="700" fill="#16a34a">1</tspan>；全量 find 总跳数 199990000 → 19999
  </text>

  <rect x="530" y="440" width="440" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="546" y="461" font-size="13" fill="#334155">同一棵链上只开路径压缩：总跳数</text>
  <text x="546" y="479" font-size="13" fill="#334155">
    199990000 → <tspan font-weight="700" fill="#2563eb">79994</tspan>（≈ 4n），量级差约 <tspan font-weight="700">2500 倍</tspan>
  </text>
</svg>
