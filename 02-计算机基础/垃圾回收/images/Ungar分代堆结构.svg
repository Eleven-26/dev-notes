  <rect x="40" y="280" width="915" height="80" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="254" y1="280" x2="254" y2="360" stroke="#cbd5e1"/>
  <line x1="318" y1="280" x2="318" y2="360" stroke="#cbd5e1"/>
  <line x1="382" y1="280" x2="382" y2="360" stroke="#cbd5e1"/>

  <path d="M430,150 L40,150 L40,276" fill="none" stroke="#334155" marker-end="url(#ar)"/>
  <path d="M430,185 L254,185 L254,276" fill="none" stroke="#334155" marker-end="url(#ar)"/>
  <path d="M430,220 L318,220 L318,276" fill="none" stroke="#334155" marker-end="url(#ar)"/>
