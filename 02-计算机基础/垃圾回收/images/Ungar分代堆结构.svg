  <text x="668" y="396" font-size="15" fill="#0f172a" text-anchor="middle">老年代空间</text>

  <path d="M40,412 L40,424 L206,424 L211,436 L216,424 L382,424 L382,412" fill="none" stroke="#64748b"/>
  <text x="211" y="460" font-size="14" fill="#334155" text-anchor="middle">新生代空间</text>

  <text x="30" y="482" font-size="12" fill="#64748b">要点：生成空间与两个幸存空间合称新生代空间，老年代空间单独存放晋升对象。</text>
