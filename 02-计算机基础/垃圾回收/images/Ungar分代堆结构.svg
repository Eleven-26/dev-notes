      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="495" fill="#ffffff"/>

  <text x="140" y="42" font-size="15" fill="#0f172a" text-anchor="middle">记录集</text>
  <text x="32" y="88" font-size="15" fill="#334155" text-anchor="end">$rs</text>
  <rect x="55" y="62" width="200" height="36" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="105" y1="62" x2="105" y2="98" stroke="#cbd5e1"/>
  <line x1="155" y1="62" x2="155" y2="98" stroke="#cbd5e1"/>
