  <path d="M 200 485 V 460 H 104 V 448" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="30" y="548" font-size="13" fill="#64748b">要点：标记不改写对象头，只在位图表格置位；表格很小，因此与写时复制技术兼容。</text>
