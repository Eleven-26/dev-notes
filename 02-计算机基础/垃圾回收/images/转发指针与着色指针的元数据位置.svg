<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="o6" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">转发信息与颜色元数据放在哪：对象头还是指针位</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">两者都是把元数据藏进别处，代价也从读路径搬到了空间与运行时配合上</text>

  <!-- 左：Brooks -->
  <rect x="40" y="86" width="448" height="350" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="86" width="448" height="46" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="62" y="115" font-size="14" font-weight="bold" fill="#9a3412">Brooks 指针：转发藏在对象头</text>

  <rect x="70" y="164" width="100" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="120" y="199" text-anchor="middle" font-size="12.5" fill="#334155">对象头</text>
  <rect x="170" y="164" width="100" height="58" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="220" y="199" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a3412">fwd 字</text>
  <rect x="270" y="164" width="170" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="355" y="199" text-anchor="middle" font-size="12.5" fill="#334155">其余字段…</text>
  <text x="70" y="248" font-size="11.5" fill="#9a3412">每个对象头额外留一个「自转发指针」fwd</text>

  <text x="70" y="282" font-size="11.5" fill="#334155">正常时 fwd 指向自己；被移动后指向新家</text>
  <text x="70" y="306" font-size="11.5" fill="#334155">访问任意字段前先多 load 一次 fwd 再寻址</text>
  <text x="70" y="330" font-size="11.5" fill="#334155">旧地址仍可用，只是每次多一跳</text>

  <rect x="66" y="352" width="400" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="84" y="378" font-size="11.5" font-weight="bold" fill="#9a3412">三笔账：</text>
  <text x="84" y="402" font-size="11.5" fill="#334155">读放大的税、对象头膨胀的空间税、别名优化的损失税</text>

  <!-- 右：着色指针 -->
  <rect x="512" y="86" width="448" height="350" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="512" y="86" width="448" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="534" y="115" font-size="14" font-weight="bold" fill="#1e40af">着色指针：色位藏在指针高位</text>

  <rect x="542" y="164" width="130" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="607" y="199" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">色位 / 元数据</text>
  <rect x="672" y="164" width="178" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="761" y="199" text-anchor="middle" font-size="12.5" fill="#334155">真实地址位</text>
  <text x="542" y="248" font-size="11.5" fill="#1e40af">把标记色等元数据编码进指针自身的高位</text>

  <text x="542" y="282" font-size="11.5" fill="#334155">读侧检查 = 指针按位与掩码看某位是否置起</text>
  <text x="542" y="306" font-size="11.5" fill="#334155">一次寄存器级位测试，不必访问对象额外字段</text>
  <text x="542" y="330" font-size="11.5" fill="#334155">解引用前必须按位与抹掉色位才能当地址用</text>

  <rect x="538" y="352" width="400" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="556" y="378" font-size="11.5" font-weight="bold" fill="#1e40af">前提（三方共建）：</text>
  <text x="556" y="402" font-size="11.5" fill="#334155">地址有空闲高位、编译器配合解色、OS 与页表保证配合</text>

  <!-- 结论 -->
  <rect x="40" y="456" width="920" height="84" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="484" font-size="12" fill="#334155">要点：ZGC 在 JDK 11 用过 Brooks 指针，JDK 13 起重构为把转发信息直接放进对象与页表，省掉常态下的一次间接。</text>
  <text x="60" y="512" font-size="12" fill="#1e40af">着色指针只是把读屏障的热路径检查变便宜，慢路径仍要去修正指针或转发对象。</text>
</svg>
