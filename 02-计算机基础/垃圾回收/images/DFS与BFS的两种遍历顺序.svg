<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="400" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">同一棵引用树，两种标记顺序</text>
  <text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">两种顺序都能完成标记；差别只在「同时要记住多少个待处理对象」</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker><marker id="arwo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ea580c"/></marker></defs>
  <rect x="226" y="80" width="48" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="250" y="106" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">A</text>
  <text x="276" y="88" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">1</text>
  <rect x="136" y="155" width="48" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="160" y="181" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">B</text>
  <text x="186" y="163" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">2</text>
  <rect x="316" y="155" width="48" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="340" y="181" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">C</text>
  <text x="366" y="163" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">5</text>
  <rect x="86" y="230" width="48" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="110" y="256" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">D</text>
  <text x="136" y="238" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">3</text>
  <rect x="186" y="230" width="48" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="210" y="256" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">E</text>
  <text x="236" y="238" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">4</text>
  <rect x="316" y="230" width="48" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="340" y="256" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">F</text>
  <text x="366" y="238" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">6</text>
  <line x1="250" y1="120" x2="160" y2="153" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="250" y1="120" x2="340" y2="153" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="160" y1="195" x2="110" y2="228" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="160" y1="195" x2="210" y2="228" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="340" y1="195" x2="340" y2="228" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="250" y="320" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">深度优先：沿一条链走到黑再回溯</text>
  <text x="250" y="342" font-size="11" fill="#64748b" text-anchor="middle">待处理栈的深度 = 树高</text>
  <rect x="726" y="80" width="48" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="750" y="106" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">A</text>
  <text x="776" y="88" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">1</text>
  <rect x="636" y="155" width="48" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="660" y="181" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">B</text>
  <text x="686" y="163" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">2</text>
  <rect x="816" y="155" width="48" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="840" y="181" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">C</text>
  <text x="866" y="163" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">3</text>
  <rect x="586" y="230" width="48" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="610" y="256" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">D</text>
  <text x="636" y="238" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">4</text>
  <rect x="686" y="230" width="48" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="710" y="256" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">E</text>
  <text x="736" y="238" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">5</text>
  <rect x="816" y="230" width="48" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="840" y="256" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">F</text>
  <text x="866" y="238" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">6</text>
  <line x1="750" y1="120" x2="660" y2="153" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="750" y1="120" x2="840" y2="153" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="660" y1="195" x2="610" y2="228" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="660" y1="195" x2="710" y2="228" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="840" y1="195" x2="840" y2="228" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="750" y="320" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">广度优先：一层一层向外扩</text>
  <text x="750" y="342" font-size="11" fill="#64748b" text-anchor="middle">待处理队列的宽度 = 最宽一层</text>
  <line x1="500" y1="80" x2="500" y2="330" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="24" y="360" width="952" height="22" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="382" font-size="12" fill="#b45309" text-anchor="start">标记阶段要「记住接下来还要扫谁」：DFS 用栈、BFS 用队列。堆里对象越宽，BFS 的队列越长，这就是书上说「深度优先更能压低内存使用量」的原因。</text>
</svg>
