  <line x1="150" y1="113" x2="210" y2="149" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="90" y1="185" x2="60" y2="221" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="90" y1="185" x2="120" y2="221" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="210" y1="185" x2="180" y2="221" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="210" y1="185" x2="240" y2="221" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="150" y="292" font-size="11" fill="#64748b" text-anchor="middle">A 为根，B/C 为中间节点</text>
  <rect x="330" y="78" width="646" height="246" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="352" y="108" font-size="12.5" fill="#ea580c" text-anchor="start" font-weight="bold">Fenichel 深度优先</text>
  <rect x="352" y="118" width="30" height="22" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1"/>
  <text x="367.0" y="133" font-size="11" fill="#0f172a" text-anchor="middle">A</text>
  <rect x="388" y="118" width="30" height="22" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1"/>
  <text x="403.0" y="133" font-size="11" fill="#0f172a" text-anchor="middle">B</text>
  <rect x="424" y="118" width="30" height="22" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1"/>
  <text x="439.0" y="133" font-size="11" fill="#0f172a" text-anchor="middle">D</text>
