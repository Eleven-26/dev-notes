<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">同一棵树，三种复制顺序</text>
  <text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">Cheney 用堆当队列做广度优先；Fenichel 做深度优先；近似深度优先在两者之间</text>
