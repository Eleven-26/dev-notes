  <rect x="128" y="79" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="150" y="101" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">A</text>
  <rect x="68" y="151" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="90" y="173" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">B</text>
  <rect x="188" y="151" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="210" y="173" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">C</text>
  <rect x="38" y="223" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="60" y="245" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">D</text>
  <rect x="98" y="223" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="120" y="245" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">E</text>
  <rect x="158" y="223" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="180" y="245" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">F</text>
  <rect x="218" y="223" width="44" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
