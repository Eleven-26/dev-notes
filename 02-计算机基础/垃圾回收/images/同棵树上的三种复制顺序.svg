  <text x="352" y="158" font-size="10.5" fill="#64748b" text-anchor="start">递归，子对象紧挨着父对象</text>
  <text x="352" y="180" font-size="12.5" fill="#2563eb" text-anchor="start" font-weight="bold">Cheney 广度优先</text>
  <rect x="352" y="190" width="30" height="22" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="367.0" y="205" font-size="11" fill="#0f172a" text-anchor="middle">A</text>
  <rect x="388" y="190" width="30" height="22" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="403.0" y="205" font-size="11" fill="#0f172a" text-anchor="middle">B</text>
  <rect x="424" y="190" width="30" height="22" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="439.0" y="205" font-size="11" fill="#0f172a" text-anchor="middle">C</text>
  <rect x="460" y="190" width="30" height="22" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="475.0" y="205" font-size="11" fill="#0f172a" text-anchor="middle">D</text>
  <rect x="496" y="190" width="30" height="22" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="511.0" y="205" font-size="11" fill="#0f172a" text-anchor="middle">E</text>
  <rect x="532" y="190" width="30" height="22" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="547.0" y="205" font-size="11" fill="#0f172a" text-anchor="middle">F</text>
  <rect x="568" y="190" width="30" height="22" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="583.0" y="205" font-size="11" fill="#0f172a" text-anchor="middle">G</text>
  <text x="352" y="230" font-size="10.5" fill="#64748b" text-anchor="start">迭代，堆当 FIFO 队列</text>
  <text x="352" y="252" font-size="12.5" fill="#7e22ce" text-anchor="start" font-weight="bold">近似深度优先</text>
  <rect x="352" y="262" width="30" height="22" rx="4" fill="#ffffff" stroke="#7e22ce" stroke-width="1"/>
  <text x="367.0" y="277" font-size="11" fill="#0f172a" text-anchor="middle">A</text>
  <rect x="388" y="262" width="30" height="22" rx="4" fill="#ffffff" stroke="#7e22ce" stroke-width="1"/>
  <text x="403.0" y="277" font-size="11" fill="#0f172a" text-anchor="middle">B</text>
  <rect x="424" y="262" width="30" height="22" rx="4" fill="#ffffff" stroke="#7e22ce" stroke-width="1"/>
  <text x="439.0" y="277" font-size="11" fill="#0f172a" text-anchor="middle">C</text>
  <line x1="460" y1="262" x2="460" y2="282" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2"/>
  <rect x="472" y="262" width="30" height="22" rx="4" fill="#ffffff" stroke="#7e22ce" stroke-width="1"/>
  <text x="487.0" y="277" font-size="11" fill="#0f172a" text-anchor="middle">D</text>
  <rect x="508" y="262" width="30" height="22" rx="4" fill="#ffffff" stroke="#7e22ce" stroke-width="1"/>
  <text x="523.0" y="277" font-size="11" fill="#0f172a" text-anchor="middle">E</text>
  <line x1="544" y1="262" x2="544" y2="282" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2"/>
  <rect x="556" y="262" width="30" height="22" rx="4" fill="#ffffff" stroke="#7e22ce" stroke-width="1"/>
  <text x="571.0" y="277" font-size="11" fill="#0f172a" text-anchor="middle">F</text>
  <rect x="592" y="262" width="30" height="22" rx="4" fill="#ffffff" stroke="#7e22ce" stroke-width="1"/>
  <text x="607.0" y="277" font-size="11" fill="#0f172a" text-anchor="middle">G</text>
  <text x="352" y="302" font-size="10.5" fill="#64748b" text-anchor="start">分组：组间广度、组内深度</text>
  <rect x="24" y="340" width="952" height="62" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="362" font-size="12" fill="#b45309" text-anchor="start">差别只在「新地址怎么排」：Fenichel 让父子相邻（缓存友好但要递归）；Cheney 用堆当队列（省内存但不相邻）；近似深度优先分组折中。</text>
