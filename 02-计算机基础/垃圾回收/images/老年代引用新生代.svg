<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="system-ui, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>

  <ellipse cx="285" cy="90" rx="95" ry="60" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="285" y="98" font-size="16" fill="#0f172a" text-anchor="middle">根</text>

  <rect x="30" y="200" width="940" height="150" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="30" y="200" width="315" height="150" fill="#ffedd5" stroke="#ea580c"/>
  <line x1="345" y1="200" x2="345" y2="350" stroke="#cbd5e1"/>

  <rect x="60" y="220" width="80" height="50" fill="#dbeafe" stroke="#2563eb"/>
  <circle cx="100" cy="245" r="4" fill="#2563eb"/>
  <rect x="60" y="290" width="120" height="50" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="240" y="265" width="80" height="50" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="400" y="230" width="140" height="50" fill="#dbeafe" stroke="#2563eb"/>
  <circle cx="420" cy="255" r="4" fill="#2563eb"/>

  <path d="M235,138 L100,216" fill="none" stroke="#334155" marker-end="url(#ar)"/>
  <path d="M100,245 L100,288" fill="none" stroke="#2563eb" marker-end="url(#ar)"/>
  <path d="M420,255 L280,255 L280,263" fill="none" stroke="#dc2626" marker-end="url(#ar)"/>

  <text x="187" y="380" font-size="15" fill="#0f172a" text-anchor="middle">新生代空间</text>
  <text x="657" y="380" font-size="15" fill="#0f172a" text-anchor="middle">老年代空间</text>

  <text x="30" y="414" font-size="13" fill="#64748b">要点：老年代对象指向新生代对象的引用，也要被当作根一样搜索。</text>
