  <text x="40" y="418" font-size="12" fill="#b45309" text-anchor="start">灰色「→ 转发」是原位置留下的转发指针（老地方改成指向新家）。C、D 从头到尾没被碰过——它们随整个 From 空间一起作废，这是复制算法最省的地方。</text>
