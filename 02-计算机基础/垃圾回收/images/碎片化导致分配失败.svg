<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
  <text x="30" y="40" font-size="18" fill="#0f172a">碎片化：小分块散布在堆的各处</text>

  <!-- 申请发言框 -->
  <rect x="40" y="80" width="230" height="46" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="109" font-size="14" fill="#334155">请给我 3 个字的分块</text>

  <ellipse cx="540" cy="150" rx="110" ry="45" fill="#dbeafe" stroke="#2563eb"/>
  <text x="540" y="156" font-size="16" fill="#0f172a" text-anchor="middle">根</text>
  <line x1="475" y1="192" x2="295" y2="282" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="605" y1="192" x2="700" y2="282" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 拒绝发言框 -->
  <rect x="700" y="80" width="260" height="46" rx="12" fill="#ffedd5" stroke="#ea580c"/>
  <text x="716" y="109" font-size="14" fill="#334155">我只有 2 个字的分块！</text>
  <line x1="800" y1="126" x2="816" y2="282" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="30" y="260" width="940" height="100" fill="#f8fafc" stroke="#64748b"/>
  <!-- 活动对象与空闲分块交错 -->
  <rect x="50" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="78" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="150" y="288" width="28" height="44" fill="#ffffff" stroke="#64748b"/>
  <rect x="178" y="288" width="28" height="44" fill="#ffffff" stroke="#64748b"/>
  <rect x="250" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="278" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="306" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="380" y="288" width="28" height="44" fill="#ffffff" stroke="#64748b"/>
  <rect x="408" y="288" width="28" height="44" fill="#ffffff" stroke="#64748b"/>
  <rect x="460" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="488" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="560" y="288" width="28" height="44" fill="#ffffff" stroke="#64748b"/>
  <rect x="588" y="288" width="28" height="44" fill="#ffffff" stroke="#64748b"/>
  <rect x="660" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="688" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="716" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="790" y="288" width="28" height="44" fill="#ffffff" stroke="#64748b"/>
  <rect x="818" y="288" width="28" height="44" fill="#ffffff" stroke="#64748b"/>
  <rect x="890" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="918" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>

  <text x="952" y="388" font-size="14" fill="#64748b" text-anchor="end">堆</text>

  <!-- 空闲链表串起零散小分块 -->
  <text x="50" y="462" font-size="14" fill="#334155">空闲链表</text>
  <circle cx="135" cy="457" r="3" fill="#334155"/>
  <path d="M 135 454 V 452 H 178 V 336" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="192" cy="324" r="3" fill="#334155"/>
  <path d="M 192 332 V 415 H 408 V 336" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="422" cy="324" r="3" fill="#334155"/>
  <path d="M 422 332 V 430 H 588 V 336" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="602" cy="324" r="3" fill="#334155"/>
  <path d="M 602 332 V 443 H 810 V 336" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="30" y="488" font-size="13" fill="#64748b">要点：反复分配与回收后，空闲分块变小且分散；即使总量足够，也难以找到连续的 3 个字。</text>
</svg>
