<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="30" y="40" font-size="18" fill="#0f172a">广度优先搜索：按层次由近及远</text>

  <!-- 连线（父→子） -->
  <line x1="470" y1="108" x2="295" y2="208" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="470" y1="108" x2="645" y2="208" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="295" y1="248" x2="190" y2="348" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="295" y1="248" x2="400" y2="348" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="645" y1="248" x2="540" y2="348" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="645" y1="248" x2="750" y2="348" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="190" y1="388" x2="120" y2="488" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="190" y1="388" x2="260" y2="488" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="388" x2="400" y2="488" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="540" y1="388" x2="540" y2="488" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="750" y1="388" x2="680" y2="488" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="750" y1="388" x2="820" y2="488" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 第 1 层 -->
  <rect x="434" y="72" width="72" height="36" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="470" y1="72" x2="470" y2="108" stroke="#2563eb"/>
  <text x="426" y="95" font-size="14" fill="#0f172a" text-anchor="end">1</text>
  <!-- 第 2 层 -->
  <rect x="259" y="212" width="72" height="36" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="295" y1="212" x2="295" y2="248" stroke="#2563eb"/>
  <text x="251" y="235" font-size="14" fill="#0f172a" text-anchor="end">2</text>
  <rect x="609" y="212" width="72" height="36" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="645" y1="212" x2="645" y2="248" stroke="#2563eb"/>
  <text x="601" y="235" font-size="14" fill="#0f172a" text-anchor="end">3</text>
  <!-- 第 3 层 -->
  <rect x="154" y="352" width="72" height="36" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="190" y1="352" x2="190" y2="388" stroke="#2563eb"/>
  <text x="146" y="375" font-size="14" fill="#0f172a" text-anchor="end">4</text>
  <rect x="364" y="352" width="72" height="36" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="400" y1="352" x2="400" y2="388" stroke="#2563eb"/>
  <text x="356" y="375" font-size="14" fill="#0f172a" text-anchor="end">5</text>
  <rect x="504" y="352" width="72" height="36" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="540" y1="352" x2="540" y2="388" stroke="#2563eb"/>
  <text x="496" y="375" font-size="14" fill="#0f172a" text-anchor="end">6</text>
  <rect x="714" y="352" width="72" height="36" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="750" y1="352" x2="750" y2="388" stroke="#2563eb"/>
  <text x="706" y="375" font-size="14" fill="#0f172a" text-anchor="end">7</text>
  <!-- 第 4 层 -->
  <rect x="84" y="492" width="72" height="36" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="120" y1="492" x2="120" y2="528" stroke="#2563eb"/>
  <text x="76" y="515" font-size="14" fill="#0f172a" text-anchor="end">8</text>
  <rect x="224" y="492" width="72" height="36" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="260" y1="492" x2="260" y2="528" stroke="#2563eb"/>
  <text x="216" y="515" font-size="14" fill="#0f172a" text-anchor="end">9</text>
  <rect x="364" y="492" width="72" height="36" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="400" y1="492" x2="400" y2="528" stroke="#2563eb"/>
  <text x="356" y="515" font-size="14" fill="#0f172a" text-anchor="end">10</text>
  <rect x="504" y="492" width="72" height="36" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="540" y1="492" x2="540" y2="528" stroke="#2563eb"/>
  <text x="496" y="515" font-size="14" fill="#0f172a" text-anchor="end">11</text>
  <rect x="644" y="492" width="72" height="36" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="680" y1="492" x2="680" y2="528" stroke="#2563eb"/>
  <text x="636" y="515" font-size="14" fill="#0f172a" text-anchor="end">12</text>
  <rect x="784" y="492" width="72" height="36" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="820" y1="492" x2="820" y2="528" stroke="#2563eb"/>
  <text x="776" y="515" font-size="14" fill="#0f172a" text-anchor="end">13</text>

  <text x="30" y="600" font-size="13" fill="#64748b">要点：编号为标记阶段的访问顺序——先访问离根最近的全部对象，再逐层向更深处推进。</text>
  <text x="30" y="625" font-size="13" fill="#64748b">正文比较：深度优先比广度优先更能压低内存使用量，因此标记阶段经常采用深度优先。</text>
</svg>
