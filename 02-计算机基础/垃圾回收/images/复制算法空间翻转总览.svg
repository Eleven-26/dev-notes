<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="system-ui, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <rect x="700" y="16" width="278" height="92" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="712" y="28" width="20" height="20" fill="#ffffff" stroke="#334155"/>
  <text x="742" y="44" font-size="14" fill="#334155">分块</text>
  <rect x="712" y="56" width="20" height="20" fill="#dbeafe" stroke="#2563eb"/>
  <text x="742" y="72" font-size="14" fill="#334155">正在使用的空间</text>
  <rect x="712" y="84" width="20" height="20" fill="#f8fafc" stroke="#334155"/>
  <line x1="712" y1="84" x2="732" y2="104" stroke="#334155"/>
  <line x1="732" y1="84" x2="712" y2="104" stroke="#334155"/>
  <text x="742" y="100" font-size="14" fill="#334155">不能使用的空间</text>

  <rect x="40" y="130" width="440" height="66" fill="#dbeafe" stroke="#334155"/>
  <rect x="480" y="130" width="440" height="66" fill="#ffffff" stroke="#334155"/>
  <line x1="480" y1="130" x2="920" y2="196" stroke="#334155"/>
  <line x1="920" y1="130" x2="480" y2="196" stroke="#334155"/>
  <text x="260" y="218" font-size="15" fill="#0f172a" text-anchor="middle">From 空间</text>
  <text x="700" y="218" font-size="15" fill="#0f172a" text-anchor="middle">To 空间</text>

  <line x1="390" y1="226" x2="390" y2="252" stroke="#334155" marker-end="url(#ar)"/>
  <text x="410" y="246" font-size="14" fill="#334155">执行 GC</text>

  <rect x="40" y="262" width="440" height="66" fill="#ffffff" stroke="#334155"/>
  <line x1="40" y1="262" x2="480" y2="328" stroke="#334155"/>
  <line x1="480" y1="262" x2="40" y2="328" stroke="#334155"/>
  <rect x="480" y="262" width="440" height="66" fill="#f8fafc" stroke="#334155"/>
  <rect x="480" y="262" width="140" height="66" fill="#dbeafe" stroke="#2563eb"/>
  <text x="260" y="350" font-size="15" fill="#0f172a" text-anchor="middle">To 空间</text>
  <text x="700" y="350" font-size="15" fill="#0f172a" text-anchor="middle">From 空间</text>

  <line x1="390" y1="358" x2="390" y2="384" stroke="#334155" marker-end="url(#ar)"/>
  <text x="410" y="378" font-size="14" fill="#334155">执行 mutator</text>

  <rect x="40" y="394" width="440" height="66" fill="#ffffff" stroke="#334155"/>
  <line x1="40" y1="394" x2="480" y2="460" stroke="#334155"/>
  <line x1="480" y1="394" x2="40" y2="460" stroke="#334155"/>
  <rect x="480" y="394" width="440" height="66" fill="#dbeafe" stroke="#2563eb"/>
  <text x="260" y="482" font-size="15" fill="#0f172a" text-anchor="middle">To 空间</text>
  <text x="700" y="482" font-size="15" fill="#0f172a" text-anchor="middle">From 空间</text>

  <line x1="390" y1="490" x2="390" y2="516" stroke="#334155" marker-end="url(#ar)"/>
  <text x="410" y="510" font-size="14" fill="#334155">执行 GC</text>

  <rect x="40" y="526" width="440" height="66" fill="#f8fafc" stroke="#334155"/>
  <rect x="40" y="526" width="145" height="66" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="480" y="526" width="440" height="66" fill="#ffffff" stroke="#334155"/>
  <line x1="480" y1="526" x2="920" y2="592" stroke="#334155"/>
  <line x1="920" y1="526" x2="480" y2="592" stroke="#334155"/>
  <text x="260" y="614" font-size="15" fill="#0f172a" text-anchor="middle">From 空间</text>
  <text x="700" y="614" font-size="15" fill="#0f172a" text-anchor="middle">To 空间</text>

  <text x="40" y="648" font-size="13" fill="#64748b">要点：每次 GC 结束都交换 From 与 To 的角色，只有被引用的活动对象会被搬进目标空间。</text>
</svg>
