<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="dn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="up" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">存储器的四层结构：越靠近 CPU 越小越快</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">寄存器、缓存、内存（主存储器）、辅助存储器（硬盘等）</text>

  <!-- 四个层级 -->
  <rect x="320" y="110" width="360" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">寄存器</text>

  <rect x="320" y="200" width="360" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="235" text-anchor="middle" font-size="14" fill="#334155">缓存</text>

  <rect x="320" y="290" width="360" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="325" text-anchor="middle" font-size="14" fill="#334155">内存（主存储器）</text>

  <rect x="320" y="380" width="360" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="500" y="415" text-anchor="middle" font-size="14" fill="#334155">辅助存储器（硬盘等）</text>

  <!-- 层间双向箭头 -->
  <line x1="500" y1="168" x2="500" y2="198" stroke="#94a3b8" stroke-width="1.5" marker-start="url(#up)" marker-end="url(#dn)"/>
  <line x1="500" y1="258" x2="500" y2="288" stroke="#94a3b8" stroke-width="1.5" marker-start="url(#up)" marker-end="url(#dn)"/>
  <line x1="500" y1="348" x2="500" y2="378" stroke="#94a3b8" stroke-width="1.5" marker-start="url(#up)" marker-end="url(#dn)"/>

  <!-- 左侧总箭头 -->
  <line x1="180" y1="138" x2="180" y2="408" stroke="#64748b" stroke-width="1.5" marker-start="url(#up)" marker-end="url(#dn)"/>
  <text x="180" y="118" text-anchor="middle" font-size="12.5" fill="#334155">小容量 · 高速</text>
  <text x="180" y="432" text-anchor="middle" font-size="12.5" fill="#334155">大容量 · 低速</text>

  <!-- 右侧说明 -->
  <rect x="720" y="170" width="250" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="738" y="200" font-size="12" font-weight="bold" fill="#0f172a">访问的局部性</text>
  <text x="738" y="230" font-size="11.5" fill="#334155">越靠上：容量越小、速度越快</text>
  <text x="738" y="256" font-size="11.5" fill="#334155">越靠下：容量越大、速度越慢</text>
  <text x="738" y="290" font-size="11.5" fill="#334155">有引用关系的对象放在较近的</text>
  <text x="738" y="312" font-size="11.5" fill="#334155">位置，缓存命中概率更高</text>
</svg>
