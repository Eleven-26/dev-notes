<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">mutator 与 GC 交替执行：最大暂停时间从哪来</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">mutator 连续运行的时段被 GC 打断，A、B、C 就是三次 GC 工作</text>

  <!-- 两个说明框 -->
  <rect x="110" y="84" width="180" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="200" y="114" text-anchor="middle" font-size="12.5" fill="#334155">开始执行 mutator</text>
  <line x1="150" y1="136" x2="132" y2="156" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="790" y="84" width="180" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="880" y="114" text-anchor="middle" font-size="12.5" fill="#334155">mutator 执行完毕</text>
  <line x1="930" y1="136" x2="950" y2="156" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- mutator 时间线 -->
  <text x="30" y="166" font-size="13" fill="#334155">mutator</text>
  <line x1="120" y1="160" x2="960" y2="160" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>

  <rect x="120" y="153" width="166" height="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <path d="M286,146 L300,160 L286,174 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>

  <rect x="355" y="153" width="191" height="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <path d="M546,146 L560,160 L546,174 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>

  <rect x="645" y="153" width="101" height="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <path d="M746,146 L760,160 L746,174 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>

  <rect x="820" y="153" width="126" height="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <path d="M946,146 L960,160 L946,174 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>

  <!-- GC 时间线 -->
  <text x="30" y="286" font-size="13" fill="#334155">GC</text>
  <line x1="120" y1="280" x2="960" y2="280" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>

  <rect x="305" y="273" width="31" height="14" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <path d="M336,266 L350,280 L336,294 Z" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>

  <rect x="565" y="273" width="61" height="14" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <path d="M626,266 L640,280 L626,294 Z" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>

  <rect x="765" y="273" width="36" height="14" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <path d="M801,266 L815,280 L801,294 Z" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>

  <!-- 括号与标签 -->
  <path d="M305,308 Q305,324 322,324 L333,324 Q350,324 350,308" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="327" y="346" text-anchor="middle" font-size="13" fill="#334155">A</text>

  <path d="M565,308 Q565,324 582,324 L623,324 Q640,324 640,308" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="602" y="346" text-anchor="middle" font-size="13" fill="#334155">B</text>

  <path d="M765,308 Q765,324 782,324 L798,324 Q815,324 815,308" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="790" y="346" text-anchor="middle" font-size="13" fill="#334155">C</text>

  <rect x="40" y="364" width="920" height="46" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="392" font-size="12" fill="#334155">要点：暂停时长就是对应 GC 段的长度，最大暂停时间取其中最长的那一段（图中 B 段）。</text>
</svg>
