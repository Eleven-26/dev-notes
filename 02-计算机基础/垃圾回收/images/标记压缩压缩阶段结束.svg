<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="380" fill="#ffffff"/>
  <text x="30" y="40" font-size="18" fill="#0f172a">标记-压缩：压缩阶段结束（Lisp2）</text>

  <ellipse cx="500" cy="100" rx="90" ry="40" fill="#dbeafe" stroke="#2563eb"/>
  <text x="500" y="106" font-size="16" fill="#0f172a" text-anchor="middle">根</text>
  <line x1="462" y1="132" x2="105" y2="194" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="538" y1="132" x2="358" y2="194" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="40" y="180" width="920" height="90" fill="#f8fafc" stroke="#64748b"/>
  <!-- B' -->
  <rect x="60" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="88" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="116" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <!-- C' -->
  <rect x="180" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="208" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="236" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="264" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <!-- D' -->
  <rect x="320" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="348" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="376" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <!-- F' -->
  <rect x="460" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="488" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="516" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <!-- 空闲空间集中到右端 -->
  <rect x="600" y="200" width="340" height="46" fill="#ffffff" stroke="#64748b"/>
  <text x="770" y="228" font-size="13" fill="#64748b" text-anchor="middle">空闲空间</text>

  <circle cx="116" cy="242" r="3" fill="#334155"/>
  <path d="M 116 248 V 275 H 236 V 250" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="376" cy="242" r="3" fill="#334155"/>
  <path d="M 376 248 V 275 H 502 V 250" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="102" y="305" font-size="14" fill="#0f172a" text-anchor="middle">B'</text>
  <text x="236" y="305" font-size="14" fill="#0f172a" text-anchor="middle">C'</text>
  <text x="362" y="305" font-size="14" fill="#0f172a" text-anchor="middle">D'</text>
  <text x="502" y="305" font-size="14" fill="#0f172a" text-anchor="middle">F'</text>

  <text x="40" y="345" font-size="13" fill="#64748b">要点：活动对象向堆左端滑动，空闲空间集中到右端；指向活动对象的所有指针都已更新。</text>
</svg>
