<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="400" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">标记-压缩：同一份堆的三个状态</text>
  <text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">标记与标记-清除完全相同；差别在清除那一步换成了「滑动 + 改指针」</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker><marker id="arwo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ea580c"/></marker></defs>
  <rect x="24" y="72" width="300" height="274" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="174" y="96" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="bold">① 压缩前</text>
  <text x="174" y="116" font-size="10.5" fill="#64748b" text-anchor="middle">B、C、D、F 散布，中间夹着 A、E 两个空洞</text>
  <rect x="40" y="140" width="268" height="160" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <rect x="48" y="152" width="62" height="20" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="79.0" y="167.0" font-size="13" fill="#0f172a" text-anchor="middle">B</text>
  <rect x="48" y="176" width="35" height="20" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="65.5" y="191.0" font-size="13" fill="#0f172a" text-anchor="middle">A</text>
  <rect x="48" y="200" width="62" height="20" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="79.0" y="215.0" font-size="13" fill="#0f172a" text-anchor="middle">C</text>
  <rect x="48" y="224" width="35" height="20" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="65.5" y="239.0" font-size="13" fill="#0f172a" text-anchor="middle">E</text>
  <rect x="48" y="248" width="62" height="20" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="79.0" y="263.0" font-size="13" fill="#0f172a" text-anchor="middle">D</text>
  <rect x="48" y="272" width="62" height="20" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="79.0" y="287.0" font-size="13" fill="#0f172a" text-anchor="middle">F</text>
  <rect x="350" y="72" width="300" height="274" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="500" y="96" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="bold">② 标记后</text>
  <text x="500" y="116" font-size="10.5" fill="#64748b" text-anchor="middle">与标记-清除一模一样：可达者置位</text>
  <rect x="366" y="140" width="268" height="160" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <rect x="374" y="152" width="62" height="20" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="405.0" y="167.0" font-size="13" fill="#0f172a" text-anchor="middle">B</text>
  <circle cx="428" cy="160" r="4" fill="#dc2626"/>
  <rect x="374" y="176" width="35" height="20" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="391.5" y="191.0" font-size="13" fill="#0f172a" text-anchor="middle">A</text>
  <rect x="374" y="200" width="62" height="20" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="405.0" y="215.0" font-size="13" fill="#0f172a" text-anchor="middle">C</text>
  <circle cx="428" cy="208" r="4" fill="#dc2626"/>
  <rect x="374" y="224" width="35" height="20" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="391.5" y="239.0" font-size="13" fill="#0f172a" text-anchor="middle">E</text>
  <rect x="374" y="248" width="62" height="20" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="405.0" y="263.0" font-size="13" fill="#0f172a" text-anchor="middle">D</text>
  <circle cx="428" cy="256" r="4" fill="#dc2626"/>
  <rect x="374" y="272" width="62" height="20" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="405.0" y="287.0" font-size="13" fill="#0f172a" text-anchor="middle">F</text>
  <circle cx="428" cy="280" r="4" fill="#dc2626"/>
  <rect x="676" y="72" width="300" height="274" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="826" y="96" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="bold">③ 压缩后</text>
  <text x="826" y="116" font-size="10.5" fill="#64748b" text-anchor="middle">活对象滑到左端，空洞集中到右端</text>
  <rect x="692" y="140" width="268" height="160" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <rect x="700" y="152" width="62" height="20" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="731.0" y="167.0" font-size="13" fill="#0f172a" text-anchor="middle">B</text>
  <circle cx="754" cy="160" r="4" fill="#dc2626"/>
  <rect x="700" y="172" width="62" height="20" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="731.0" y="187.0" font-size="13" fill="#0f172a" text-anchor="middle">C</text>
  <circle cx="754" cy="180" r="4" fill="#dc2626"/>
  <rect x="700" y="192" width="62" height="20" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="731.0" y="207.0" font-size="13" fill="#0f172a" text-anchor="middle">D</text>
  <circle cx="754" cy="200" r="4" fill="#dc2626"/>
  <rect x="700" y="212" width="62" height="20" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="731.0" y="227.0" font-size="13" fill="#0f172a" text-anchor="middle">F</text>
  <circle cx="754" cy="220" r="4" fill="#dc2626"/>
  <rect x="700" y="232" width="236" height="60" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <text x="818" y="266" font-size="10.5" fill="#64748b" text-anchor="middle">空闲：一整块连续空间</text>
  <text x="826" y="322" font-size="9.8" fill="#64748b" text-anchor="middle">指针已改写：引用 D、F 的地方都指向新地址</text>
  <line x1="326" y1="210" x2="346" y2="210" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="652" y1="210" x2="672" y2="210" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <rect x="24" y="366" width="952" height="16" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="388" font-size="12" fill="#b45309" text-anchor="start">压缩的代价全在第三格：「搬」之外还要「找出所有指向它的引用」并改写，所以必须暂停；书上说的「前缀和」就是让新地址能在 O(1) 内算出来、省掉第二次遍历。</text>
</svg>
