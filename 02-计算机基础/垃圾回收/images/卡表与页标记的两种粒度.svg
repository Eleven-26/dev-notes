<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="410" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">两种「粗粒度记账」：卡片标记与页面标记</text>
  <text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">都用「可能脏」代替「精确记录」，差别在记账单位与位表大小</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker><marker id="arwr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker></defs>
  <rect x="24" y="70" width="952" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="94" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">① 卡片标记：老年代切成等长卡片，每卡一位</text>
  <rect x="56" y="110" width="888" height="40" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <rect x="56" y="110" width="88" height="40" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="100" y="136" font-size="10" fill="#64748b" text-anchor="middle">卡 0</text>
  <rect x="144" y="110" width="88" height="40" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="188" y="136" font-size="10" fill="#64748b" text-anchor="middle">卡 1</text>
  <rect x="232" y="110" width="88" height="40" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="276" y="136" font-size="10" fill="#ea580c" text-anchor="middle" font-weight="bold">卡 2（脏）</text>
  <rect x="320" y="110" width="88" height="40" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="364" y="136" font-size="10" fill="#64748b" text-anchor="middle">卡 3</text>
  <rect x="408" y="110" width="88" height="40" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="452" y="136" font-size="10" fill="#64748b" text-anchor="middle">卡 4</text>
  <rect x="496" y="110" width="88" height="40" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="540" y="136" font-size="10" fill="#64748b" text-anchor="middle">卡 5</text>
  <rect x="584" y="110" width="88" height="40" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="628" y="136" font-size="10" fill="#64748b" text-anchor="middle">卡 6</text>
  <rect x="672" y="110" width="88" height="40" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="716" y="136" font-size="10" fill="#ea580c" text-anchor="middle" font-weight="bold">卡 7（脏）</text>
  <rect x="760" y="110" width="88" height="40" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="804" y="136" font-size="10" fill="#64748b" text-anchor="middle">卡 8</text>
  <rect x="848" y="110" width="88" height="40" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="892" y="136" font-size="10" fill="#64748b" text-anchor="middle">卡 9</text>
  <rect x="56" y="164" width="888" height="26" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <circle cx="100" cy="177" r="7" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <circle cx="188" cy="177" r="7" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <circle cx="276" cy="177" r="7" fill="#ea580c" stroke="#64748b" stroke-width="1"/>
  <circle cx="364" cy="177" r="7" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <circle cx="452" cy="177" r="7" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <circle cx="540" cy="177" r="7" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <circle cx="628" cy="177" r="7" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <circle cx="716" cy="177" r="7" fill="#ea580c" stroke="#64748b" stroke-width="1"/>
  <circle cx="804" cy="177" r="7" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <circle cx="892" cy="177" r="7" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="56" y="208" font-size="11" fill="#64748b" text-anchor="start">位表：10 张卡只用 10 位 —— 老年代的 1/1024（约 0.1%）</text>
  <rect x="24" y="236" width="952" height="128" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="260" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">② 页面标记：按页维护重写标志位</text>
  <rect x="60" y="276" width="200" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="160" y="300" font-size="11" fill="#64748b" text-anchor="middle">页 0</text>
  <text x="160" y="318" font-size="10" fill="#64748b" text-anchor="middle">重写标志=0</text>
  <rect x="280" y="276" width="200" height="52" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="380" y="300" font-size="11" fill="#64748b" text-anchor="middle">页 1</text>
  <text x="380" y="318" font-size="10" fill="#ea580c" text-anchor="middle">重写标志=1</text>
  <rect x="500" y="276" width="200" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="600" y="300" font-size="11" fill="#64748b" text-anchor="middle">页 2</text>
  <text x="600" y="318" font-size="10" fill="#64748b" text-anchor="middle">重写标志=0</text>
  <rect x="720" y="276" width="200" height="52" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="820" y="300" font-size="11" fill="#64748b" text-anchor="middle">页 3</text>
  <text x="820" y="318" font-size="10" fill="#ea580c" text-anchor="middle">重写标志=1</text>
  <rect x="24" y="378" width="952" height="14" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="400" font-size="12" fill="#b45309" text-anchor="start">两者都是「宁可多扫」：卡片标记扫整张脏卡、页面标记扫整页，都要把无关字段一起过一遍。粒度粗=省位表、费扫描；粒度细=省扫描、费位表。</text>
</svg>
