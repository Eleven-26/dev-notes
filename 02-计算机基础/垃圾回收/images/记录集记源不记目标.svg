<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">记录集为什么记「谁引用了我」而不是「我引用了谁」</text>
  <text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">新生代对象会搬家，只记目标的话搬完就不知道该改哪条指针</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker><marker id="arwr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker></defs>
  <rect x="24" y="68" width="952" height="146" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="44" y="92" font-size="13" fill="#dc2626" text-anchor="start" font-weight="bold">① 只记目标 A：搬完就断了线索</text>
  <rect x="60" y="112" width="120" height="48" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="120" y="141" font-size="10.5" fill="#0f172a" text-anchor="middle">B（老年代）</text>
  <rect x="300" y="112" width="120" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="360" y="141" font-size="10.5" fill="#0f172a" text-anchor="middle">A（新生代）</text>
  <line x1="182" y1="136" x2="296" y2="136" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <rect x="520" y="112" width="130" height="48" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
  <text x="585" y="141" font-size="10.5" fill="#0f172a" text-anchor="middle">记录集：A</text>
  <rect x="740" y="112" width="130" height="48" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <text x="805" y="141" font-size="10.5" fill="#0f172a" text-anchor="middle">A′（已晋升）</text>
  <text x="459" y="172" font-size="9.5" fill="#dc2626" text-anchor="middle">B 的字段仍指向已搬走的 A</text>
  <line x1="182" y1="184" x2="736" y2="184" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="459" y="204" font-size="10.5" fill="#dc2626" text-anchor="middle">✗ 不知道该改哪条指针</text>
  <rect x="24" y="232" width="952" height="128" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="44" y="256" font-size="13" fill="#15803d" text-anchor="start" font-weight="bold">② 记源 B：顺着 B 找到那条指针并改写</text>
  <rect x="60" y="276" width="130" height="48" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <text x="125" y="305" font-size="10.5" fill="#0f172a" text-anchor="middle">记录集：B</text>
  <rect x="330" y="276" width="120" height="48" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="390" y="305" font-size="10.5" fill="#0f172a" text-anchor="middle">B（老年代）</text>
  <rect x="640" y="276" width="140" height="48" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <text x="710" y="305" font-size="10.5" fill="#0f172a" text-anchor="middle">A′（已晋升）</text>
  <line x1="192" y1="300" x2="326" y2="300" stroke="#15803d" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arwb)"/>
  <line x1="452" y1="300" x2="636" y2="300" stroke="#15803d" stroke-width="1.4" marker-end="url(#arwb)"/>
  <text x="262" y="292" font-size="9" fill="#15803d" text-anchor="middle">找到 B</text>
  <text x="544" y="292" font-size="9" fill="#15803d" text-anchor="middle">改 B 的字段</text>
  <rect x="24" y="378" width="952" height="24" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="400" font-size="12" fill="#b45309" text-anchor="start">判据：记录集的用途不是「知道谁是新生代」，而是「搬完之后知道该去哪改指针」。前者只需目标，后者必须知道源。</text>
</svg>
