<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">列车垃圾回收：把老年代切成车厢，一次只收一节</text>
  <text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">车厢连成列车；跨列车的引用记在列车记录集，同列车跨车厢的记在车厢记录集</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker><marker id="arwr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker></defs>
  <rect x="60" y="100" width="296" height="90" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1"/>
  <text x="208.0" y="120" font-size="10.5" fill="#7e22ce" text-anchor="middle" font-weight="bold">列车 1</text>
  <rect x="66" y="132" width="88" height="48" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="110" y="156" font-size="10" fill="#0f172a" text-anchor="middle">车厢 1-1</text>
  <text x="110" y="172" font-size="9" fill="#ea580c" text-anchor="middle" font-weight="bold">本次回收</text>
  <rect x="162" y="132" width="88" height="48" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="206" y="156" font-size="10" fill="#0f172a" text-anchor="middle">车厢 1-2</text>
  <rect x="258" y="132" width="88" height="48" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="302" y="156" font-size="10" fill="#0f172a" text-anchor="middle">车厢 1-3</text>
  <rect x="390" y="100" width="200" height="90" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1"/>
  <text x="490.0" y="120" font-size="10.5" fill="#7e22ce" text-anchor="middle" font-weight="bold">列车 2</text>
  <rect x="396" y="132" width="88" height="48" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="440" y="156" font-size="10" fill="#0f172a" text-anchor="middle">车厢 2-1</text>
  <rect x="492" y="132" width="88" height="48" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="536" y="156" font-size="10" fill="#0f172a" text-anchor="middle">车厢 2-2</text>
  <rect x="700" y="100" width="200" height="90" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1"/>
  <text x="800.0" y="120" font-size="10.5" fill="#7e22ce" text-anchor="middle" font-weight="bold">列车 3</text>
  <rect x="706" y="132" width="88" height="48" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="750" y="156" font-size="10" fill="#0f172a" text-anchor="middle">车厢 3-1</text>
  <rect x="802" y="132" width="88" height="48" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="846" y="156" font-size="10" fill="#0f172a" text-anchor="middle">车厢 3-2</text>
  <rect x="60" y="208" width="330" height="58" rx="8" fill="#cffafe" stroke="#0e7490" stroke-width="1"/>
  <text x="74" y="230" font-size="11" fill="#0e7490" text-anchor="start" font-weight="bold">列车 1 的记录集  ← 挂在「列车 1」上</text>
  <text x="74" y="250" font-size="10" fill="#0f172a" text-anchor="start">记「其它列车 → 本列车」的引用</text>
  <rect x="410" y="208" width="360" height="58" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <text x="424" y="230" font-size="11" fill="#15803d" text-anchor="start" font-weight="bold">车厢 1-1 的记录集  ← 挂在「车厢 1-1」上</text>
  <text x="424" y="250" font-size="10" fill="#0f172a" text-anchor="start">记「同一列车其它车厢 → 本节车厢」的引用</text>
  <text x="60" y="292" font-size="11" fill="#64748b" text-anchor="start">一次老年代 GC 只把「第一节车厢」当对象 → 单次暂停与车厢大小成正比，而不是与整个老年代成正比</text>
  <text x="60" y="314" font-size="11" fill="#64748b" text-anchor="start">两级记录集的分工：列车级回答「外面谁引用了我」，车厢级回答「同一列车的邻居谁引用了我」。</text>
  <rect x="24" y="338" width="952" height="64" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="360" font-size="12" fill="#b45309" text-anchor="start">关键在 7.3 那条结论：晋升时把「被引用对象」和「发出引用的对象」放进同一辆列车，于是跨车厢的循环垃圾早晚会聚到同一列车里，才能整列车一起回收。</text>
</svg>
