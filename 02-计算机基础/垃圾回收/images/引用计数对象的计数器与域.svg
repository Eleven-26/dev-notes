<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="380" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">引用计数法中的对象：计数器 + 域</text>
  <text x="500" y="64" text-anchor="middle" font-size="13" fill="#64748b">每个对象都自带一个计数器，记录自己被多少个程序引用</text>

  <rect x="140" y="112" width="720" height="96" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="140" y="112" width="110" height="96" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="555" y1="112" x2="555" y2="208" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="250" y1="112" x2="250" y2="208" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="195" y="176" text-anchor="middle" font-size="28" font-weight="bold" fill="#1e40af">1</text>

  <path d="M140,228 Q140,246 195,246 Q250,246 250,228" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="195" y1="246" x2="195" y2="253" stroke="#64748b" stroke-width="1.5"/>
  <path d="M250,228 Q250,246 555,246 Q860,246 860,228" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="555" y1="246" x2="555" y2="253" stroke="#64748b" stroke-width="1.5"/>

  <text x="195" y="280" text-anchor="middle" font-size="15" fill="#334155">计数器</text>
  <text x="555" y="280" text-anchor="middle" font-size="15" fill="#334155">域</text>

  <text x="60" y="326" font-size="13.5" fill="#334155">要点：计数器存放被引用数，域存放对象自身的数据。</text>
  <text x="60" y="352" font-size="13.5" fill="#64748b">注意：计数器必须能数完堆中所有对象的引用数，位宽要留够。</text>
</svg>
