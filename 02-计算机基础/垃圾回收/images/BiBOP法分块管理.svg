<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="30" y="40" font-size="18" fill="#0f172a">BiBOP 法：按对象大小分块管理</text>

  <ellipse cx="500" cy="100" rx="100" ry="40" fill="#dbeafe" stroke="#2563eb"/>
  <text x="500" y="106" font-size="16" fill="#0f172a" text-anchor="middle">根</text>
  <line x1="430" y1="133" x2="105" y2="197" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="133" x2="408" y2="197" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 块 1：用于 3 个字 -->
  <rect x="30" y="180" width="300" height="180" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="60" y="205" width="84" height="40" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="88" y1="205" x2="88" y2="245" stroke="#2563eb"/>
  <line x1="116" y1="205" x2="116" y2="245" stroke="#2563eb"/>
  <rect x="60" y="290" width="84" height="40" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="88" y1="290" x2="88" y2="330" stroke="#2563eb"/>
  <line x1="116" y1="290" x2="116" y2="330" stroke="#2563eb"/>
  <rect x="230" y="290" width="84" height="40" fill="#ffffff" stroke="#64748b"/>
  <line x1="258" y1="290" x2="258" y2="330" stroke="#64748b"/>
  <line x1="286" y1="290" x2="286" y2="330" stroke="#64748b"/>

  <!-- 块 2：用于 2 个字 -->
  <rect x="350" y="180" width="300" height="180" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="380" y="205" width="56" height="40" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="408" y1="205" x2="408" y2="245" stroke="#2563eb"/>
  <rect x="380" y="290" width="56" height="40" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="408" y1="290" x2="408" y2="330" stroke="#2563eb"/>
  <rect x="560" y="205" width="56" height="40" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="588" y1="205" x2="588" y2="245" stroke="#2563eb"/>
  <rect x="470" y="290" width="56" height="40" fill="#ffffff" stroke="#64748b"/>
  <line x1="498" y1="290" x2="498" y2="330" stroke="#64748b"/>

  <!-- 块 3：用于 3 个字 -->
  <rect x="670" y="180" width="300" height="180" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="700" y="205" width="84" height="40" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="728" y1="205" x2="728" y2="245" stroke="#2563eb"/>
  <line x1="756" y1="205" x2="756" y2="245" stroke="#2563eb"/>
  <rect x="700" y="290" width="84" height="40" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="728" y1="290" x2="728" y2="330" stroke="#2563eb"/>
  <line x1="756" y1="290" x2="756" y2="330" stroke="#2563eb"/>
  <rect x="840" y="205" width="84" height="40" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="868" y1="205" x2="868" y2="245" stroke="#2563eb"/>
  <line x1="896" y1="205" x2="896" y2="245" stroke="#2563eb"/>
  <rect x="840" y="290" width="84" height="40" fill="#ffffff" stroke="#64748b"/>
  <line x1="868" y1="290" x2="868" y2="330" stroke="#64748b"/>
  <line x1="896" y1="290" x2="896" y2="330" stroke="#64748b"/>

  <text x="180" y="385" font-size="13" fill="#334155" text-anchor="middle">用于 3 个字的块</text>
  <text x="500" y="385" font-size="13" fill="#334155" text-anchor="middle">用于 2 个字的块</text>
  <text x="820" y="385" font-size="13" fill="#334155" text-anchor="middle">用于 3 个字的块</text>

  <text x="40" y="420" font-size="13" fill="#64748b">空闲链表的数组：</text>
  <!-- 用于 2 个字 -->
  <rect x="40" y="435" width="110" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="95" y="457" font-size="13" fill="#0f172a" text-anchor="middle">用于 2 个字</text>
  <path d="M 95 435 V 410 H 498 V 334" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- 用于 3 个字 -->
  <rect x="40" y="490" width="110" height="34" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="95" y="512" font-size="13" fill="#0f172a" text-anchor="middle">用于 3 个字</text>
  <path d="M 80 490 V 476 H 272 V 334" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 150 507 H 882 V 334" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="30" y="545" font-size="13" fill="#64748b">要点：每个块只配置同样大小的对象；BiBOP 缓解碎片化，但同大小对象分散残留时仍会浪费堆。</text>
</svg>
