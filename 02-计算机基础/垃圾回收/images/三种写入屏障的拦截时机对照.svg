<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">三种写入屏障的拦截时机对照</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">同一个写入动作，三种不同的拦截位置与代价</text>

  <rect x="40" y="146" width="920" height="76" fill="#ffffff"/>
  <rect x="40" y="222" width="920" height="76" fill="#f8fafc"/>
  <rect x="40" y="298" width="920" height="76" fill="#ffffff"/>
  <rect x="40" y="110" width="920" height="36" fill="#f1f5f9"/>

  <rect x="40" y="146" width="6" height="76" fill="#2563eb"/>
  <rect x="40" y="222" width="6" height="76" fill="#ea580c"/>
  <rect x="40" y="298" width="6" height="76" fill="#ea580c"/>

  <text x="145" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">提出者</text>
  <text x="340" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">拦截时机</text>
  <text x="595" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">保护的对象</text>
  <text x="860" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">维护的不变式</text>

  <text x="145" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Dijkstra</text>
  <text x="145" y="198" text-anchor="middle" font-size="12.5" fill="#334155">（插入式）</text>
  <text x="340" y="189" text-anchor="middle" font-size="13" fill="#334155">写入处</text>
  <text x="595" y="176" text-anchor="middle" font-size="13" fill="#334155">新加入引用的目标对象</text>
  <text x="595" y="198" text-anchor="middle" font-size="12.5" fill="#334155">把它涂成灰色</text>
  <text x="860" y="176" text-anchor="middle" font-size="13" fill="#2563eb">强三色</text>
  <text x="860" y="198" text-anchor="middle" font-size="12.5" fill="#64748b">不需要重扫</text>

  <text x="145" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Steele</text>
  <text x="145" y="274" text-anchor="middle" font-size="12.5" fill="#334155">（删除式）</text>
  <text x="340" y="252" text-anchor="middle" font-size="13" fill="#334155">写入前</text>
  <text x="340" y="274" text-anchor="middle" font-size="12.5" fill="#334155">（前屏障）</text>
  <text x="595" y="252" text-anchor="middle" font-size="13" fill="#334155">被删除的旧引用所属目标</text>
  <text x="595" y="274" text-anchor="middle" font-size="12.5" fill="#334155">记入记录集，之后要重扫</text>
  <text x="860" y="252" text-anchor="middle" font-size="13" fill="#ea580c">弱三色</text>
  <text x="860" y="274" text-anchor="middle" font-size="12.5" fill="#64748b">需重扫记录集</text>

  <text x="145" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">汤浅</text>
  <text x="145" y="350" text-anchor="middle" font-size="11" fill="#334155">（freeze-on-attempt）</text>
  <text x="340" y="328" text-anchor="middle" font-size="13" fill="#334155">写入前</text>
  <text x="340" y="350" text-anchor="middle" font-size="12.5" fill="#334155">（前屏障）</text>
  <text x="595" y="328" text-anchor="middle" font-size="13" fill="#334155">被删除的旧值所指向的对象</text>
  <text x="595" y="350" text-anchor="middle" font-size="12.5" fill="#334155">当场冻结，基本免重扫</text>
  <text x="860" y="328" text-anchor="middle" font-size="13" fill="#ea580c">弱三色</text>
  <text x="860" y="350" text-anchor="middle" font-size="12.5" fill="#64748b">基本免重扫</text>

  <rect x="40" y="110" width="920" height="264" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="40" y1="146" x2="960" y2="146" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="40" y1="222" x2="960" y2="222" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="40" y1="298" x2="960" y2="298" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="250" y1="110" x2="250" y2="374" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="430" y1="110" x2="430" y2="374" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="760" y1="110" x2="760" y2="374" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="40" y="406" font-size="13.5" fill="#334155">要点：差别不在名字，而在拦在写入前、写入处还是写入后，以及保护的是新边还是旧边。</text>
  <text x="40" y="430" font-size="13.5" fill="#64748b">注意：Steele 与汤浅同属前屏障，区别是旧值目标「记下等重扫」还是「当场冻结」。</text>
</svg>
