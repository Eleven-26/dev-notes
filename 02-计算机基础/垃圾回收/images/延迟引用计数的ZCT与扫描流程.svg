<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto"><path d="M0,0 6.5,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwG" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto"><path d="M0,0 6.5,3 0,6 z" fill="#16a34a"/></marker>
    <marker id="arwR" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto"><path d="M0,0 6.5,3 0,6 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">延迟引用计数的 ZCT 与扫描流程</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">根引用的变化不计入计数器，先记进 ZCT，等分配不出分块时再统一扫描</text>

  <rect x="60" y="100" width="520" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="80" y="130" font-size="14" font-weight="bold" fill="#1e40af">① 改写从根出发的指针</text>
  <text x="80" y="154" font-size="12.5" fill="#1e40af">不反映到计数器，这就是「延迟」</text>

  <path d="M320,170 L320,196" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

  <rect x="60" y="198" width="520" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="80" y="228" font-size="14" font-weight="bold" fill="#1e40af">② 改写其它指针</text>
  <text x="80" y="252" font-size="12.5" fill="#1e40af">dec_ref_cnt() 把计数减到 0 的对象记入 ZCT</text>

  <path d="M320,268 L320,294" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

  <rect x="60" y="296" width="520" height="68" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="80" y="326" font-size="14" font-weight="bold" fill="#ea580c">③ 分块用尽、无法分配</text>
  <text x="80" y="350" font-size="12.5" fill="#334155">调用 scan_zct() 扫描整张 ZCT</text>

  <path d="M320,366 L320,384" fill="none" stroke="#334155" stroke-width="1.5"/>
  <path d="M185,384 L465,384" fill="none" stroke="#334155" stroke-width="1.5"/>
  <path d="M185,384 L185,392" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>
  <path d="M465,384 L465,392" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>

  <rect x="60" y="394" width="250" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="185" y="422" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">仍被根引用</text>
  <text x="185" y="446" text-anchor="middle" font-size="12.5" fill="#14532d">恢复计数器</text>

  <rect x="350" y="394" width="230" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="465" y="422" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#991b1b">不再被引用</text>
  <text x="465" y="446" text-anchor="middle" font-size="12.5" fill="#991b1b">作为垃圾回收</text>

  <rect x="620" y="100" width="340" height="360" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="640" y="132" font-size="15" font-weight="bold" fill="#0f172a">ZCT 的三条要点</text>

  <rect x="640" y="156" width="6" height="6" fill="#2563eb"/>
  <text x="656" y="166" font-size="13" fill="#334155">记录 dec_ref_cnt() 减到 0 的对象</text>
  <rect x="640" y="186" width="6" height="6" fill="#2563eb"/>
  <text x="656" y="196" font-size="13" fill="#334155">ZCT 满时才调 scan_zct()</text>
  <rect x="640" y="216" width="6" height="6" fill="#2563eb"/>
  <text x="656" y="226" font-size="13" fill="#334155">扫描成本与 ZCT 大小成正比</text>
  <rect x="640" y="246" width="6" height="6" fill="#2563eb"/>
  <text x="656" y="256" font-size="13" fill="#334155">ZCT 越大，单次暂停越长</text>
  <rect x="640" y="276" width="6" height="6" fill="#2563eb"/>
  <text x="656" y="286" font-size="13" fill="#334155">ZCT 越小，扫描越频繁、吞吐越低</text>

  <rect x="640" y="316" width="300" height="110" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="656" y="346" font-size="13" font-weight="bold" fill="#991b1b">代价：垃圾不能即刻回收</text>
  <text x="656" y="372" font-size="12" fill="#991b1b">丢掉了引用计数法「即刻回收」的优点</text>
  <text x="656" y="398" font-size="12" fill="#991b1b">暂停时间与 ZCT 大小成正比</text>

  <text x="40" y="496" font-size="13.5" fill="#334155">要点：根引用的变化不计入计数器，ZCT 里记下的对象要等 scan_zct() 扫过才知道死活。</text>
  <text x="40" y="520" font-size="13.5" fill="#64748b">注意：ZCT 越大单次暂停越长，缩小 ZCT 又会提高扫描频率、压低吞吐量。</text>
</svg>
