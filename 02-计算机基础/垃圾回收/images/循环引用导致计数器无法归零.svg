<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto"><path d="M0,0 6.5,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwR" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto"><path d="M0,0 6.5,3 0,6 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">循环引用：计数器都为 1，谁也无法归零</text>
  <text x="500" y="64" text-anchor="middle" font-size="13" fill="#64748b">花子与太郎互相引用，各自的计数器都是 1</text>

  <ellipse cx="200" cy="112" rx="80" ry="36" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e40af">根</text>

  <rect x="80" y="232" width="300" height="68" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="80" y="232" width="60" height="68" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="140" y1="232" x2="140" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="280" y1="232" x2="280" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="110" y="276" text-anchor="middle" font-size="18" font-weight="bold" fill="#dc2626">1</text>
  <text x="210" y="276" text-anchor="middle" font-size="16" fill="#0f172a">花子</text>
  <text x="330" y="272" text-anchor="middle" font-size="11" fill="#64748b">域</text>

  <rect x="600" y="232" width="300" height="68" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="600" y="232" width="60" height="68" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="660" y1="232" x2="660" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="800" y1="232" x2="800" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="630" y="276" text-anchor="middle" font-size="18" font-weight="bold" fill="#dc2626">1</text>
  <text x="730" y="276" text-anchor="middle" font-size="16" fill="#0f172a">太郎</text>
  <text x="850" y="272" text-anchor="middle" font-size="11" fill="#64748b">域</text>

  <path d="M282,112 L320,112 L320,228" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
  <text x="336" y="200" font-size="12" fill="#2563eb">根引用</text>

  <path d="M840,302 L840,372 L110,372 L110,304" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>
  <text x="430" y="394" text-anchor="middle" font-size="12" fill="#dc2626">太郎的域又指回花子</text>

  <text x="40" y="424" font-size="13.5" fill="#334155">要点：花子和太郎互相引用，各自计数都是 1，这一组对象整体已经不可达。</text>
  <text x="40" y="448" font-size="13.5" fill="#64748b">注意：判据是「计数归零」，环上各对象的计数永远大于等于 1，整个环回收不了。</text>
</svg>
