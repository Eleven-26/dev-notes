<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto"><path d="M0,0 6.5,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwG" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto"><path d="M0,0 6.5,3 0,6 z" fill="#16a34a"/></marker>
    <marker id="arwO" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto"><path d="M0,0 6.5,3 0,6 z" fill="#ea580c"/></marker>
    <marker id="arwR" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto"><path d="M0,0 6.5,3 0,6 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">1 位引用计数器：只有 0 和 1 两个值</text>
  <text x="40" y="58" font-size="13" fill="#64748b">0 表示被引用数为 1；1 表示被引用数大于等于 2</text>

  <ellipse cx="230" cy="210" rx="165" ry="72" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="230" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#ea580c">计数器 = 1</text>
  <text x="230" y="228" text-anchor="middle" font-size="13.5" fill="#334155">被引用数 大于等于 2</text>

  <ellipse cx="650" cy="210" rx="150" ry="72" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="650" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">计数器 = 0</text>
  <text x="650" y="228" text-anchor="middle" font-size="13.5" fill="#334155">被引用数 = 1</text>

  <path d="M650,56 L650,134" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>
  <text x="662" y="100" font-size="14" fill="#16a34a">生成对象</text>

  <path d="M496,210 L399,210" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
  <text x="447" y="192" text-anchor="middle" font-size="13" fill="#2563eb">被引用数 +1</text>

  <path d="M330,151 C344,70 172,70 188,141" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arwO)"/>
  <text x="259" y="116" text-anchor="middle" font-size="13" fill="#ea580c">被引用数 +1</text>

  <path d="M330,269 C400,380 490,390 560,269" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>
  <text x="445" y="396" text-anchor="middle" font-size="13" fill="#dc2626">被引用数 -1</text>

  <path d="M750,266 L750,346" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>
  <text x="764" y="310" font-size="13" fill="#dc2626">被引用数 -1</text>
  <rect x="655" y="350" width="190" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="750" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">回收对象</text>

  <text x="40" y="450" font-size="13.5" fill="#334155">要点：计数器只有 1 位，只能区分「被引用数为 1」和「被引用数大于等于 2」两种状态。</text>
  <text x="40" y="474" font-size="13.5" fill="#64748b">注意：状态 1 只说明被引用数大于等于 2，具体数目不再跟踪。</text>
</svg>
