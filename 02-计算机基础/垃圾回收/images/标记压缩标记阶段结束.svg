  <rect x="380" y="200" width="28" height="46" fill="#dcfce7" stroke="#16a34a"/>
  <path d="M 385 226 L 391 234 L 403 212" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
  <rect x="408" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="436" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="464" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <!-- D 已标记 -->
  <rect x="560" y="200" width="28" height="46" fill="#dcfce7" stroke="#16a34a"/>
  <path d="M 565 226 L 571 234 L 583 212" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
  <rect x="588" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="616" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <!-- E 空闲分块 -->
  <rect x="720" y="200" width="28" height="46" fill="#ffffff" stroke="#64748b"/>
  <rect x="748" y="200" width="28" height="46" fill="#ffffff" stroke="#64748b"/>
  <rect x="776" y="200" width="28" height="46" fill="#ffffff" stroke="#64748b"/>
  <!-- F 已标记 -->
  <rect x="860" y="200" width="28" height="46" fill="#dcfce7" stroke="#16a34a"/>
  <path d="M 865 226 L 871 234 L 883 212" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
  <rect x="888" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="916" y="200" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>

  <circle cx="296" cy="242" r="3" fill="#334155"/>
  <path d="M 296 248 V 275 H 436 V 250" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="616" cy="242" r="3" fill="#334155"/>
  <path d="M 616 248 V 275 H 902 V 250" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="116" y="305" font-size="14" fill="#0f172a" text-anchor="middle">A</text>
  <text x="282" y="305" font-size="14" fill="#0f172a" text-anchor="middle">B</text>
  <text x="436" y="305" font-size="14" fill="#0f172a" text-anchor="middle">C</text>
