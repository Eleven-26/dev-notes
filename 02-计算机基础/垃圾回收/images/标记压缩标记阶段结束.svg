      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="380" fill="#ffffff"/>
  <text x="30" y="40" font-size="18" fill="#0f172a">标记-压缩：标记阶段结束</text>

