<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="300" fill="#ffffff"/>
  <text x="30" y="40" font-size="18" fill="#0f172a">标记：在对象头里设置标志位</text>

  <!-- 未标记的对象 -->
  <rect x="180" y="90" width="180" height="70" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <line x1="240" y1="90" x2="240" y2="160" stroke="#334155" stroke-width="1.5"/>
  <line x1="300" y1="90" x2="300" y2="160" stroke="#334155" stroke-width="1.5"/>
  <rect x="150" y="210" width="240" height="46" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="270" y="239" font-size="15" fill="#334155" text-anchor="middle">未标记（mark = FALSE）</text>

  <!-- 赋值箭头 -->
  <line x1="420" y1="125" x2="580" y2="125" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <text x="500" y="110" font-size="14" fill="#0f172a" text-anchor="middle">obj.mark = TRUE</text>

  <!-- 已标记的对象 -->
  <rect x="640" y="90" width="60" height="70" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="700" y="90" width="60" height="70" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <rect x="760" y="90" width="60" height="70" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <path d="M 655 125 L 668 140 L 692 108" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <rect x="610" y="210" width="240" height="46" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="730" y="239" font-size="15" fill="#334155" text-anchor="middle">已标记（mark = TRUE）</text>

  <text x="30" y="285" font-size="13" fill="#64748b">要点：标记阶段给活动对象设置标志位；清除阶段依据有无标志位来区分活动对象与垃圾。</text>
</svg>
