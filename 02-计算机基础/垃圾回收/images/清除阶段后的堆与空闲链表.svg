<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
  <text x="30" y="40" font-size="18" fill="#0f172a">清除阶段结束：垃圾被回收到空闲链表</text>
  <text x="30" y="70" font-size="13" fill="#64748b">要点：清除阶段遍历整个堆，把未标记对象作为分块挂到空闲链表；耗时与堆大小成正比。</text>

  <ellipse cx="430" cy="150" rx="120" ry="48" fill="#dbeafe" stroke="#2563eb"/>
  <text x="430" y="156" font-size="16" fill="#0f172a" text-anchor="middle">根</text>
  <line x1="350" y1="192" x2="190" y2="314" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="515" y1="192" x2="622" y2="314" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="30" y="300" width="940" height="90" fill="#f8fafc" stroke="#64748b"/>
  <!-- O1 已回收（空闲分块） -->
  <rect x="50" y="322" width="28" height="46" fill="#ffffff" stroke="#64748b"/>
  <rect x="78" y="322" width="28" height="46" fill="#ffffff" stroke="#64748b"/>
  <rect x="106" y="322" width="28" height="46" fill="#ffffff" stroke="#64748b"/>
  <!-- O2 活动对象 -->
  <rect x="170" y="322" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="198" y="322" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="226" y="322" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <!-- O3 活动对象 -->
  <rect x="290" y="322" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="318" y="322" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="346" y="322" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="374" y="322" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <!-- O4 已回收（空闲分块） -->
  <rect x="470" y="322" width="28" height="46" fill="#ffffff" stroke="#64748b"/>
  <rect x="498" y="322" width="28" height="46" fill="#ffffff" stroke="#64748b"/>
  <rect x="526" y="322" width="28" height="46" fill="#ffffff" stroke="#64748b"/>
  <!-- O5 活动对象 -->
  <rect x="610" y="322" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="638" y="322" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="666" y="322" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <!-- O6 活动对象 -->
  <rect x="750" y="322" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="778" y="322" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="806" y="322" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <!-- O7 活动对象 -->
  <rect x="880" y="322" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="908" y="322" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="936" y="322" width="28" height="46" fill="#dbeafe" stroke="#2563eb"/>

  <circle cx="226" cy="345" r="3" fill="#334155"/>
  <path d="M 226 322 V 272 H 304 V 318" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="666" cy="345" r="3" fill="#334155"/>
  <path d="M 666 322 V 272 H 764 V 318" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="952" y="418" font-size="14" fill="#64748b" text-anchor="end">堆</text>

  <!-- 空闲链表：表头 -> O1 -> O4 -->
  <text x="50" y="462" font-size="14" fill="#334155">空闲链表</text>
  <circle cx="135" cy="457" r="3" fill="#334155"/>
  <path d="M 135 454 V 440 H 92 V 372" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="120" cy="358" r="3" fill="#334155"/>
  <path d="M 120 368 V 430 H 512 V 372" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
