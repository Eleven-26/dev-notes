<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 416" width="1000" height="416" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="416" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">同样找「3 个字」的分块：一条链表要走到尾，三条链表直接命中</text>
  <text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">多个空闲链表（segregated free list）只解决「分配慢」，不解决碎片</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker><marker id="arwo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ea580c"/></marker></defs>
  <rect x="24" y="70" width="952" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="94" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">① 一条链表：按申请大小从头遍历</text>
  <rect x="60" y="116" width="78" height="52" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="99.0" y="140" font-size="11.5" fill="#0f172a" text-anchor="middle">2 字</text>
  <text x="99.0" y="158" font-size="10" fill="#15803d" text-anchor="middle"></text>
  <line x1="140" y1="142" x2="160" y2="142" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <rect x="164" y="116" width="62" height="52" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="195.0" y="140" font-size="11.5" fill="#0f172a" text-anchor="middle">1 字</text>
  <text x="195.0" y="158" font-size="10" fill="#15803d" text-anchor="middle"></text>
  <line x1="228" y1="142" x2="248" y2="142" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <rect x="252" y="116" width="110" height="52" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="307.0" y="140" font-size="11.5" fill="#0f172a" text-anchor="middle">4 字</text>
  <text x="307.0" y="158" font-size="10" fill="#15803d" text-anchor="middle"></text>
  <line x1="364" y1="142" x2="384" y2="142" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <rect x="388" y="116" width="78" height="52" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="427.0" y="140" font-size="11.5" fill="#0f172a" text-anchor="middle">2 字</text>
  <text x="427.0" y="158" font-size="10" fill="#15803d" text-anchor="middle"></text>
  <line x1="468" y1="142" x2="488" y2="142" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <rect x="492" y="116" width="94" height="52" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <text x="539.0" y="140" font-size="11.5" fill="#0f172a" text-anchor="middle">3 字</text>
  <text x="539.0" y="158" font-size="10" fill="#15803d" text-anchor="middle">命中</text>
  <text x="44" y="196" font-size="11.5" fill="#ea580c" text-anchor="start">申请 3 字 → 前面 4 个都不够，走到第 5 个才拿到（时间随链表长度线性增长）</text>
  <rect x="24" y="226" width="952" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="250" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">② 按大小分组：先选桶，再在桶内找</text>
  <text x="60" y="278" font-size="11.5" fill="#64748b" text-anchor="start">1 字</text>
  <rect x="110" y="264" width="56" height="22" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="138.0" y="279" font-size="10.5" fill="#0f172a" text-anchor="middle">1</text>
  <rect x="180" y="264" width="56" height="22" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="208.0" y="279" font-size="10.5" fill="#0f172a" text-anchor="middle">1</text>
  <rect x="250" y="264" width="56" height="22" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="278.0" y="279" font-size="10.5" fill="#0f172a" text-anchor="middle">1</text>
  <text x="60" y="306" font-size="11.5" fill="#64748b" text-anchor="start">3 字</text>
  <rect x="110" y="292" width="88" height="22" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <text x="154.0" y="307" font-size="10.5" fill="#0f172a" text-anchor="middle">3</text>
  <rect x="212" y="292" width="88" height="22" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <text x="256.0" y="307" font-size="10.5" fill="#0f172a" text-anchor="middle">3</text>
  <text x="324" y="308" font-size="11" fill="#15803d" text-anchor="start">← 申请 3 字直接进这个桶，O(1)</text>
  <text x="60" y="334" font-size="11.5" fill="#64748b" text-anchor="start">4 字</text>
  <rect x="110" y="320" width="104" height="22" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="162.0" y="335" font-size="10.5" fill="#0f172a" text-anchor="middle">4</text>
  <rect x="24" y="372" width="952" height="26" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="394" font-size="12" fill="#b45309" text-anchor="start">两条路线的区别：① 的时间随空闲分块数量增长；② 把「找」变成「选桶」。但两条都没减少碎片的数量——碎片只能靠压缩或 BiBOP 抑制。</text>
</svg>
