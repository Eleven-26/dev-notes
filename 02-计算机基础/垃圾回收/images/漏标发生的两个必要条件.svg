<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="g2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="b2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="s2" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">漏标发生的两个必要条件：最小复现</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">两个条件缺一不可；屏障方案就是二选一地去破坏它们</text>

  <!-- ① 初始 -->
  <rect x="30" y="100" width="220" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="126" font-size="12" font-weight="bold" fill="#0f172a">① 初始：灰可达白</text>
  <circle cx="92" cy="210" r="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="92" y="215" text-anchor="middle" font-size="13" fill="#334155">灰</text>
  <circle cx="140" cy="350" r="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="140" y="355" text-anchor="middle" font-size="13" fill="#334155">白</text>
  <line x1="104" y1="228" x2="131" y2="331" stroke="#16a34a" stroke-width="2" marker-end="url(#g2)"/>
  <text x="42" y="400" font-size="11" fill="#334155">标记线程随时会从灰走到白</text>
  <text x="42" y="420" font-size="11" fill="#334155">此刻一切都安全</text>

  <!-- ② 条件 1 -->
  <rect x="270" y="100" width="220" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="282" y="126" font-size="12" font-weight="bold" fill="#0f172a">② 条件 1：新增黑→白</text>
  <circle cx="332" cy="210" r="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="332" y="215" text-anchor="middle" font-size="13" fill="#334155">灰</text>
  <circle cx="428" cy="210" r="22" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
  <text x="428" y="215" text-anchor="middle" font-size="13" fill="#f8fafc">黑</text>
  <circle cx="380" cy="350" r="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="380" y="355" text-anchor="middle" font-size="13" fill="#334155">白</text>
  <line x1="344" y1="228" x2="371" y2="331" stroke="#16a34a" stroke-width="2" marker-end="url(#g2)"/>
  <line x1="418" y1="228" x2="391" y2="331" stroke="#2563eb" stroke-width="2" marker-end="url(#b2)"/>
  <text x="282" y="400" font-size="11" fill="#334155">条件 1 出现：黑新增了指向白</text>
  <text x="282" y="420" font-size="11" fill="#334155">但灰的路径还在，仍安全</text>

  <!-- ③ 条件 2 -->
  <rect x="510" y="100" width="220" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="522" y="126" font-size="12" font-weight="bold" fill="#0f172a">③ 条件 2：删除灰→白</text>
  <circle cx="572" cy="210" r="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="572" y="215" text-anchor="middle" font-size="13" fill="#334155">灰</text>
  <circle cx="668" cy="210" r="22" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
  <text x="668" y="215" text-anchor="middle" font-size="13" fill="#f8fafc">黑</text>
  <circle cx="620" cy="350" r="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="620" y="355" text-anchor="middle" font-size="13" fill="#334155">白</text>
  <line x1="584" y1="228" x2="611" y2="331" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="596" y1="272" x2="612" y2="288" stroke="#dc2626" stroke-width="2"/>
  <line x1="612" y1="272" x2="596" y2="288" stroke="#dc2626" stroke-width="2"/>
  <line x1="658" y1="228" x2="631" y2="331" stroke="#2563eb" stroke-width="2" marker-end="url(#b2)"/>
  <text x="522" y="400" font-size="11" fill="#334155">条件 2 出现：灰到白的路径被删</text>
  <text x="522" y="420" font-size="11" fill="#334155">且这次删除没被记账</text>

  <!-- ④ 结果 -->
  <rect x="750" y="100" width="220" height="340" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="762" y="126" font-size="12" font-weight="bold" fill="#b91c1c">④ 结果：白隐身</text>
  <circle cx="812" cy="210" r="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="812" y="215" text-anchor="middle" font-size="13" fill="#334155">灰</text>
  <circle cx="908" cy="210" r="22" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
  <text x="908" y="215" text-anchor="middle" font-size="13" fill="#f8fafc">黑</text>
  <circle cx="860" cy="350" r="22" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="860" y="355" text-anchor="middle" font-size="13" fill="#b91c1c">白</text>
  <line x1="898" y1="228" x2="871" y2="331" stroke="#2563eb" stroke-width="2" marker-end="url(#b2)"/>
  <text x="762" y="400" font-size="11" fill="#334155">黑不会再被扫，白对标记线程隐身</text>
  <text x="762" y="420" font-size="11" fill="#334155">白连同下游子图被当垃圾清除</text>

  <!-- 阶段之间的箭头 -->
  <line x1="252" y1="270" x2="266" y2="270" stroke="#94a3b8" stroke-width="2" marker-end="url(#s2)"/>
  <line x1="492" y1="270" x2="506" y2="270" stroke="#94a3b8" stroke-width="2" marker-end="url(#s2)"/>
  <line x1="732" y1="270" x2="746" y2="270" stroke="#94a3b8" stroke-width="2" marker-end="url(#s2)"/>

  <!-- 结论 -->
  <rect x="30" y="460" width="940" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="50" y="488" font-size="13" font-weight="bold" fill="#1e40af">要点：漏标必须两个条件同时满足，破坏任意一个即可保证正确</text>
  <text x="50" y="514" font-size="11.5" fill="#334155">条件 1 = 黑对象新增了一条指向白对象的边且没被记账；条件 2 = 灰侧通往该白对象的路径被删除且没被记账。</text>
  <text x="50" y="538" font-size="11.5" fill="#334155">强三色（增量更新 / 插入屏障）盯条件 1，弱三色（SATB / 删除屏障）盯条件 2。</text>
</svg>
