<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="system-ui, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>

  <text x="675" y="32" font-size="15" fill="#0f172a" text-anchor="middle">标记表格</text>
  <rect x="375" y="45" width="600" height="40" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="525" y1="45" x2="525" y2="85" stroke="#cbd5e1"/>
  <line x1="675" y1="45" x2="675" y2="85" stroke="#cbd5e1"/>
  <line x1="825" y1="45" x2="825" y2="85" stroke="#cbd5e1"/>
  <path d="M580,70 l10,12 l24,-30" fill="none" stroke="#16a34a" stroke-width="4"/>

  <text x="390" y="145" font-size="14" fill="#334155">卡片</text>

  <rect x="25" y="160" width="350" height="170" fill="#ffedd5" stroke="#ea580c"/>
  <rect x="375" y="160" width="600" height="170" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="525" y1="160" x2="525" y2="330" stroke="#cbd5e1"/>
  <line x1="675" y1="160" x2="675" y2="330" stroke="#cbd5e1"/>
  <line x1="825" y1="160" x2="825" y2="330" stroke="#cbd5e1"/>

  <rect x="60" y="185" width="85" height="50" fill="#ffedd5" stroke="#ea580c"/>
  <circle cx="100" cy="210" r="4" fill="#ea580c"/>
  <rect x="60" y="265" width="85" height="50" fill="#ffedd5" stroke="#ea580c"/>
  <path d="M100,210 L100,263" fill="none" stroke="#ea580c" marker-end="url(#ar)"/>

  <rect x="395" y="195" width="85" height="50" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="700" y="195" width="85" height="50" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="545" y="265" width="100" height="50" fill="#dbeafe" stroke="#2563eb"/>
  <circle cx="565" cy="290" r="4" fill="#2563eb"/>
  <path d="M565,290 L148,290" fill="none" stroke="#dc2626" marker-end="url(#ar)"/>

  <text x="200" y="362" font-size="15" fill="#0f172a" text-anchor="middle">新生代空间</text>
  <text x="675" y="362" font-size="15" fill="#0f172a" text-anchor="middle">老年代空间</text>

  <text x="30" y="400" font-size="13" fill="#64748b">要点：卡片中的对象若引用新生代对象，该卡在标记表格里对应的位就被置位，GC 时按位找到卡片再搜索。</text>
</svg>
