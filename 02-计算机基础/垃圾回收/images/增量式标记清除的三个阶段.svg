<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwS" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto"><path d="M0,0 6.5,3 0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="650" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">增量式标记-清除的三个阶段</text>
  <text x="40" y="64" font-size="13" fill="#64748b">把一次 GC 拆成三个阶段，每个阶段只推进一小步</text>

  <rect x="600" y="50" width="18" height="18" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="626" y="64" font-size="12" fill="#334155">白：未搜索</text>
  <rect x="704" y="50" width="18" height="18" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2"/>
  <text x="730" y="64" font-size="12" fill="#334155">灰：搜索中</text>
  <rect x="808" y="50" width="18" height="18" fill="#334155" stroke="#0f172a" stroke-width="1.2"/>
  <text x="834" y="64" font-size="12" fill="#334155">黑：已完成</text>

  <g transform="translate(40,92)">
    <rect x="0" y="0" width="920" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="28" y="32" font-size="15" font-weight="bold" fill="#0f172a">① 根查找阶段</text>
    <text x="28" y="60" font-size="12.5" fill="#334155">从根能直接引用的对象，涂成灰色。</text>
    <text x="28" y="82" font-size="12.5" fill="#334155">GC 只是发现了它们，还没搜索完，所以是灰的。</text>
    <text x="28" y="110" font-size="12.5" fill="#64748b">要点：此时还没有搜索任何子对象。</text>
    <g transform="translate(540,4)">
      <ellipse cx="56" cy="66" rx="34" ry="20" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
      <text x="56" y="71" text-anchor="middle" font-size="14" font-weight="bold" fill="#ea580c">根</text>
      <circle cx="168" cy="38" r="18" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
      <text x="168" y="43" text-anchor="middle" font-size="14" fill="#0f172a">B</text>
      <circle cx="168" cy="108" r="18" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
      <text x="168" y="113" text-anchor="middle" font-size="14" fill="#0f172a">C</text>
      <circle cx="272" cy="38" r="18" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
      <text x="272" y="43" text-anchor="middle" font-size="14" fill="#334155">D</text>
      <circle cx="272" cy="108" r="18" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
      <text x="272" y="113" text-anchor="middle" font-size="14" fill="#334155">E</text>
      <path d="M88,58 L152,42" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arwS)"/>
      <path d="M88,74 L152,104" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arwS)"/>
      <path d="M188,38 L252,38" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arwS)"/>
    </g>
  </g>

  <g transform="translate(40,256)">
    <rect x="0" y="0" width="920" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="28" y="32" font-size="15" font-weight="bold" fill="#0f172a">② 标记阶段</text>
    <text x="28" y="60" font-size="12.5" fill="#334155">取出灰色对象，把它的子对象也涂成灰色。</text>
    <text x="28" y="82" font-size="12.5" fill="#334155">标记结束时灰色全部变黑，剩下的白就是垃圾。</text>
    <text x="28" y="110" font-size="12.5" fill="#64748b">要点：黑=搜索完成，白=未搜索。</text>
    <g transform="translate(540,4)">
      <ellipse cx="56" cy="66" rx="34" ry="20" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
      <text x="56" y="71" text-anchor="middle" font-size="14" font-weight="bold" fill="#ea580c">根</text>
      <circle cx="168" cy="38" r="18" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>
      <text x="168" y="43" text-anchor="middle" font-size="14" fill="#f8fafc">B</text>
      <circle cx="168" cy="108" r="18" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>
      <text x="168" y="113" text-anchor="middle" font-size="14" fill="#f8fafc">C</text>
      <circle cx="272" cy="38" r="18" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>
      <text x="272" y="43" text-anchor="middle" font-size="14" fill="#f8fafc">D</text>
      <circle cx="272" cy="108" r="18" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
      <text x="272" y="113" text-anchor="middle" font-size="14" fill="#334155">E</text>
      <path d="M88,58 L152,42" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arwS)"/>
      <path d="M88,74 L152,104" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arwS)"/>
      <path d="M188,38 L252,38" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arwS)"/>
    </g>
  </g>

  <g transform="translate(40,420)">
    <rect x="0" y="0" width="920" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="28" y="32" font-size="15" font-weight="bold" fill="#0f172a">③ 清除阶段</text>
    <text x="28" y="60" font-size="12.5" fill="#334155">查找堆：把白色对象连接到空闲链表。</text>
    <text x="28" y="82" font-size="12.5" fill="#334155">再把黑色对象变回白色，准备下一轮 GC。</text>
    <text x="28" y="110" font-size="12.5" fill="#64748b">要点：灰色对象在标记结束时就已经不存在了。</text>
    <g transform="translate(540,4)">
      <ellipse cx="56" cy="66" rx="34" ry="20" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
      <text x="56" y="71" text-anchor="middle" font-size="14" font-weight="bold" fill="#ea580c">根</text>
      <circle cx="168" cy="38" r="18" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
      <text x="168" y="43" text-anchor="middle" font-size="14" fill="#334155">B</text>
      <circle cx="168" cy="108" r="18" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
      <text x="168" y="113" text-anchor="middle" font-size="14" fill="#334155">C</text>
      <circle cx="272" cy="38" r="18" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
      <text x="272" y="43" text-anchor="middle" font-size="14" fill="#334155">D</text>
      <circle cx="272" cy="108" r="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="272" y="113" text-anchor="middle" font-size="14" fill="#991b1b">E</text>
      <path d="M88,58 L152,42" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arwS)"/>
      <path d="M88,74 L152,104" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arwS)"/>
      <path d="M188,38 L252,38" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arwS)"/>
      <text x="294" y="112" font-size="11" fill="#dc2626">已回收</text>
      <text x="294" y="132" font-size="11" fill="#dc2626">连到空闲链表</text>
    </g>
  </g>

  <text x="40" y="606" font-size="13.5" fill="#334155">要点：增量式不是把 GC 做快，而是把它切成三段，让 mutator 有机会插进来运行。</text>
  <text x="40" y="630" font-size="13.5" fill="#64748b">注意：白=未搜索、灰=搜索中、黑=已完成，颜色只是描述状态的工具。</text>
</svg>
