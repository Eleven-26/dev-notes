<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="30" y="40" font-size="18" fill="#0f172a">单个空闲链表：分配需要遍历查找</text>

  <rect x="40" y="80" width="230" height="46" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="109" font-size="14" fill="#334155">请给我 3 个字的分块</text>

  <ellipse cx="540" cy="160" rx="110" ry="45" fill="#dbeafe" stroke="#2563eb"/>
  <text x="540" y="166" font-size="16" fill="#0f172a" text-anchor="middle">根</text>
  <line x1="475" y1="200" x2="292" y2="282" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="605" y1="200" x2="488" y2="282" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="820" y="180" width="160" height="44" rx="12" fill="#ffedd5" stroke="#ea580c"/>
  <text x="836" y="208" font-size="14" fill="#334155">我想要这个</text>
  <line x1="858" y1="226" x2="832" y2="282" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="30" y="260" width="940" height="100" fill="#f8fafc" stroke="#64748b"/>
  <rect x="50" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="78" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="150" y="288" width="28" height="44" fill="#ffffff" stroke="#64748b"/>
  <rect x="178" y="288" width="28" height="44" fill="#ffffff" stroke="#64748b"/>
  <rect x="250" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="278" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="306" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="380" y="288" width="28" height="44" fill="#ffffff" stroke="#64748b"/>
  <rect x="408" y="288" width="28" height="44" fill="#ffffff" stroke="#64748b"/>
  <rect x="460" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="488" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="560" y="288" width="28" height="44" fill="#ffffff" stroke="#64748b"/>
  <rect x="588" y="288" width="28" height="44" fill="#ffffff" stroke="#64748b"/>
  <rect x="660" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="688" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="716" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="790" y="288" width="28" height="44" fill="#ffedd5" stroke="#ea580c"/>
  <rect x="818" y="288" width="28" height="44" fill="#ffedd5" stroke="#ea580c"/>
  <rect x="846" y="288" width="28" height="44" fill="#ffedd5" stroke="#ea580c"/>
  <rect x="890" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="918" y="288" width="28" height="44" fill="#dbeafe" stroke="#2563eb"/>

  <text x="952" y="388" font-size="14" fill="#64748b" text-anchor="end">堆</text>

  <!-- 单条空闲链表：150 -> 380 -> 560 -> 790 -->
  <text x="50" y="468" font-size="14" fill="#334155">空闲链表</text>
  <circle cx="135" cy="463" r="3" fill="#334155"/>
  <path d="M 135 460 H 178 V 336" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="192" cy="324" r="3" fill="#334155"/>
  <path d="M 192 332 V 412 H 408 V 336" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="422" cy="324" r="3" fill="#334155"/>
  <path d="M 422 332 V 426 H 588 V 336" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="602" cy="324" r="3" fill="#334155"/>
  <path d="M 602 332 V 440 H 832 V 336" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="30" y="502" font-size="13" fill="#64748b">要点：分块不连续，每次分配都要遍历空闲链表；最糟时要把链表遍历到最后一项才能找到合适的分块。</text>
</svg>
