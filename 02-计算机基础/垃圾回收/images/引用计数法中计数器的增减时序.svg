<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto"><path d="M0,0 6.5,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwS" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto"><path d="M0,0 6.5,3 0,6 z" fill="#334155"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">引用计数法中计数器的增减时序</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">X 的域每改指一次，A 与 B 的计数器就各增减一次</text>

  <text x="40" y="108" font-size="17" font-weight="bold" fill="#0f172a">（a）</text>
  <rect x="110" y="92" width="170" height="34" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="200" y="92" width="80" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="115" text-anchor="middle" font-size="14" fill="#0f172a">X</text>
  <circle cx="95" cy="128" r="4" fill="#334155"/>
  <path d="M97,132 L120,146" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arwS)"/>
  <circle cx="530" cy="128" r="4" fill="#334155"/>
  <path d="M530,132 L530,146" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arwS)"/>
  <path d="M240,126 L240,146" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
  <rect x="110" y="148" width="200" height="40" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="110" y="148" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="160" y1="148" x2="160" y2="188" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="235" y1="148" x2="235" y2="188" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="135" y="174" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">2</text>
  <rect x="380" y="148" width="200" height="40" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="380" y="148" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="430" y1="148" x2="430" y2="188" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="505" y1="148" x2="505" y2="188" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="405" y="174" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">1</text>
  <text x="135" y="210" text-anchor="middle" font-size="15" fill="#0f172a">A</text>
  <text x="405" y="210" text-anchor="middle" font-size="15" fill="#0f172a">B</text>
  <rect x="630" y="92" width="330" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="650" y="126" font-size="14" font-weight="bold" fill="#0f172a">初始状态</text>
  <text x="650" y="152" font-size="13" fill="#334155">X 的域指向 A</text>

  <text x="40" y="232" font-size="17" font-weight="bold" fill="#0f172a">（b）</text>
  <rect x="110" y="216" width="170" height="34" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="200" y="216" width="80" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="239" text-anchor="middle" font-size="14" fill="#0f172a">X</text>
  <circle cx="95" cy="252" r="4" fill="#334155"/>
  <path d="M97,256 L120,270" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arwS)"/>
  <circle cx="530" cy="252" r="4" fill="#334155"/>
  <path d="M530,256 L530,270" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arwS)"/>
  <path d="M240,250 L398,270" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
  <rect x="110" y="272" width="200" height="40" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="110" y="272" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="160" y1="272" x2="160" y2="312" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="235" y1="272" x2="235" y2="312" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="135" y="298" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">1</text>
  <rect x="380" y="272" width="200" height="40" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="380" y="272" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="430" y1="272" x2="430" y2="312" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="505" y1="272" x2="505" y2="312" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="405" y="298" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">2</text>
  <text x="135" y="334" text-anchor="middle" font-size="15" fill="#0f172a">A</text>
  <text x="405" y="334" text-anchor="middle" font-size="15" fill="#0f172a">B</text>
  <rect x="630" y="216" width="330" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="650" y="250" font-size="13" font-weight="bold" fill="#2563eb">（i）inc_ref_cnt(B)：B 计数 +1</text>
  <text x="650" y="276" font-size="13" fill="#334155">dec_ref_cnt(A)：A 计数 -1</text>

  <text x="40" y="356" font-size="17" font-weight="bold" fill="#0f172a">（c）</text>
  <rect x="110" y="340" width="170" height="34" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="200" y="340" width="80" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="363" text-anchor="middle" font-size="14" fill="#0f172a">X</text>
  <circle cx="95" cy="376" r="4" fill="#334155"/>
  <path d="M97,380 L120,394" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arwS)"/>
  <circle cx="530" cy="376" r="4" fill="#334155"/>
  <path d="M530,380 L530,394" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arwS)"/>
  <path d="M240,374 L240,394" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
  <rect x="110" y="396" width="200" height="40" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="110" y="396" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="160" y1="396" x2="160" y2="436" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="235" y1="396" x2="235" y2="436" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="135" y="422" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">2</text>
  <rect x="380" y="396" width="200" height="40" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="380" y="396" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="430" y1="396" x2="430" y2="436" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="505" y1="396" x2="505" y2="436" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="405" y="422" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">1</text>
  <text x="135" y="458" text-anchor="middle" font-size="15" fill="#0f172a">A</text>
  <text x="405" y="458" text-anchor="middle" font-size="15" fill="#0f172a">B</text>
  <rect x="630" y="340" width="330" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="650" y="374" font-size="13" font-weight="bold" fill="#2563eb">（ii）inc_ref_cnt(A)：A 计数 +1</text>
  <text x="650" y="400" font-size="13" fill="#334155">dec_ref_cnt(B)：B 计数 -1</text>

  <text x="40" y="480" font-size="17" font-weight="bold" fill="#0f172a">（d）</text>
  <rect x="110" y="464" width="170" height="34" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="200" y="464" width="80" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="487" text-anchor="middle" font-size="14" fill="#0f172a">X</text>
  <circle cx="95" cy="500" r="4" fill="#334155"/>
  <path d="M97,504 L120,518" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arwS)"/>
  <circle cx="530" cy="500" r="4" fill="#334155"/>
  <path d="M530,504 L530,518" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arwS)"/>
  <path d="M240,498 L398,518" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
  <rect x="110" y="520" width="200" height="40" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="110" y="520" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="160" y1="520" x2="160" y2="560" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="235" y1="520" x2="235" y2="560" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="135" y="546" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">1</text>
  <rect x="380" y="520" width="200" height="40" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="380" y="520" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="430" y1="520" x2="430" y2="560" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="505" y1="520" x2="505" y2="560" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="405" y="546" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">2</text>
  <text x="135" y="582" text-anchor="middle" font-size="15" fill="#0f172a">A</text>
  <text x="405" y="582" text-anchor="middle" font-size="15" fill="#0f172a">B</text>
  <rect x="630" y="464" width="330" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="650" y="498" font-size="13" font-weight="bold" fill="#2563eb">（iii）inc_ref_cnt(B)：B 计数 +1</text>
  <text x="650" y="524" font-size="13" fill="#334155">dec_ref_cnt(A)：A 计数 -1</text>

  <text x="40" y="624" font-size="13.5" fill="#334155">要点：X 的域每改指一次，A 与 B 的计数器就得各增减一次，这就是「增减频繁」的来源。</text>
  <text x="40" y="648" font-size="13.5" fill="#64748b">注意：指针来回改了三次，A、B 的计数反复在 1 和 2 之间跳，写入屏障被反复触发。</text>
</svg>
