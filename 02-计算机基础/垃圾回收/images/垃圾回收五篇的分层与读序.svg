<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">垃圾回收：一个总纲 + 四个算法族</text>
  <text x="500" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">总纲回答「怎么判死活、怎么评价、怎么选」；四族各自回答「空间怎么腾出来」的一侧</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect x="300" y="72" width="400" height="72" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="500" y="98" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">GC 基础算法（总纲）</text>
  <text x="500" y="120" font-size="10.5" fill="#0f172a" text-anchor="middle">判定垃圾的两条路线 · 评价四维 · 选型总表 · 调优顺序</text>
  <text x="500" y="136" font-size="9.5" fill="#64748b" text-anchor="middle">→ 入口篇，其余四篇都以它为坐标系</text>
  <rect x="24" y="196" width="224" height="108" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="136" y="218" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="bold">标记类GC算法</text>
  <text x="136" y="236" font-size="10" fill="#64748b" text-anchor="middle">不搬对象</text>
  <text x="136" y="258" font-size="9" fill="#0f172a" text-anchor="middle">标记-清除 / 标记-压缩 / 保守式</text>
  <text x="136" y="273" font-size="9" fill="#0f172a" text-anchor="middle">压缩三变体：Two-Finger·表格·Immix</text>
  <line x1="500" y1="146" x2="136" y2="192" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="266" y="196" width="224" height="108" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="378" y="218" font-size="12" fill="#047857" text-anchor="middle" font-weight="bold">复制与分代回收</text>
  <text x="378" y="236" font-size="10" fill="#64748b" text-anchor="middle">只搬活的</text>
  <text x="378" y="258" font-size="9" fill="#0f172a" text-anchor="middle">From/To 翻转 · Cheney · 多空间</text>
  <text x="378" y="273" font-size="9" fill="#0f172a" text-anchor="middle">Ungar 四空间 · 记录集与卡表 · 列车</text>
  <line x1="500" y1="146" x2="378" y2="192" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="508" y="196" width="224" height="108" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1"/>
  <text x="620" y="218" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="bold">引用计数与增量回收</text>
  <text x="620" y="236" font-size="10" fill="#64748b" text-anchor="middle">不扫全堆</text>
  <text x="620" y="258" font-size="9" fill="#0f172a" text-anchor="middle">RC / 延迟 / 增量式 RC / Sticky</text>
  <text x="620" y="273" font-size="9" fill="#0f172a" text-anchor="middle">增量式标记 · Steele·汤浅·Dijkstra</text>
  <line x1="500" y1="146" x2="620" y2="192" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="750" y="196" width="224" height="108" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1"/>
  <text x="862" y="218" font-size="12" fill="#0e7490" text-anchor="middle" font-weight="bold">并发标记与写屏障</text>
  <text x="862" y="236" font-size="10" fill="#64748b" text-anchor="middle">边跑边标</text>
  <text x="862" y="258" font-size="9" fill="#0f172a" text-anchor="middle">三色不变式 · 漏标两条件</text>
  <text x="862" y="273" font-size="9" fill="#0f172a" text-anchor="middle">读写屏障 · Brooks · 着色指针</text>
  <line x1="500" y1="146" x2="862" y2="192" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="24" y="332" width="952" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="354" font-size="11.5" fill="#0f172a" text-anchor="True">共用机制（同一件事被两族各写一次的地方）</text>
  <text x="62" y="374" font-size="10.5" fill="#64748b" text-anchor="True">· 写屏障</text>
  <text x="62" y="386" font-size="9.5" fill="#64748b" text-anchor="start">复制与分代 6.4 ⟷ 并发标记 2.1</text>
  <text x="332" y="374" font-size="10.5" fill="#64748b" text-anchor="True">· 压缩 / 搬家</text>
  <text x="332" y="386" font-size="9.5" fill="#64748b" text-anchor="start">标记类 三 ⟷ 复制与分代 1.4</text>
  <text x="622" y="374" font-size="10.5" fill="#64748b" text-anchor="True">· 块与线</text>
  <text x="622" y="386" font-size="9.5" fill="#64748b" text-anchor="start">标记类 4.3 ⟷ 引用计数 4.2</text>
  <rect x="24" y="406" width="952" height="68" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="40" y="428" font-size="11.5" fill="#dc2626" text-anchor="True">本目录止步于此 —— 落到具体运行时是 01 层的事</text>
  <text x="40" y="450" font-size="10" fill="#0f172a" text-anchor="start">JVM：堆怎么分代、收集器谱系、G1 的 region、ZGC 的着色指针 → 01-编程语言/java/运行时/垃圾回收原理与收集器.md</text>
  <text x="40" y="466" font-size="10" fill="#0f172a" text-anchor="start">Go：混合写屏障、目标堆公式、GOGC 与 GOMEMLIMIT、assist → 01-编程语言/go/运行时/垃圾回收机制.md</text>
  <rect x="24" y="490" width="952" height="52" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="510" font-size="10.5" fill="#b45309" text-anchor="start">读序：总纲（判据与选型）→ 按你手上的问题挑一族 → 需要落地时去 01 层；不要顺着目录从头读。</text>
  <text x="40" y="530" font-size="10" fill="#b45309" text-anchor="start">四族之间不是并列关系：标记类与复制是「搬不搬」的对立，引用计数是「不扫全堆」，并发标记是「怎么与 mutator 同时跑」——四个正交的问法。</text>
</svg>
