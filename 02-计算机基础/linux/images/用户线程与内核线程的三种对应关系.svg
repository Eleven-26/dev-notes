<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="t1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">用户线程与内核线程的三种对应关系</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">差别不在「线程怎么写」，而在「内核知不知道它的存在」—— 这决定了能不能吃满多核</text>

  <!-- 列标题 -->
  <text x="180" y="104" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1e40af">多对一（用户态线程）</text>
  <text x="500" y="104" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#14532d">一对一（内核线程）</text>
  <text x="820" y="104" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309">多对多（混合 / LWP）</text>

  <!-- 列1 -->
  <text x="40" y="124" font-size="10.5" fill="#64748b">N 个用户线程</text>
  <rect x="30" y="132" width="86" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="73" y="154" text-anchor="middle" font-size="11" fill="#1e40af">T1</text>
  <rect x="137" y="132" width="86" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="154" text-anchor="middle" font-size="11" fill="#1e40af">T2</text>
  <rect x="244" y="132" width="86" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="287" y="154" text-anchor="middle" font-size="11" fill="#1e40af">T3</text>

  <line x1="73" y1="166" x2="73" y2="186" stroke="#64748b" stroke-width="1.5"/>
  <line x1="180" y1="166" x2="180" y2="186" stroke="#64748b" stroke-width="1.5"/>
  <line x1="287" y1="166" x2="287" y2="186" stroke="#64748b" stroke-width="1.5"/>
  <line x1="73" y1="186" x2="287" y2="186" stroke="#64748b" stroke-width="1.5"/>
  <line x1="180" y1="186" x2="180" y2="222" stroke="#64748b" stroke-width="1.5" marker-end="url(#t1)"/>

  <rect x="80" y="226" width="200" height="40" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="180" y="251" text-anchor="middle" font-size="12" fill="#0f172a">1 个内核线程</text>
  <line x1="180" y1="266" x2="180" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#t1)"/>
  <rect x="80" y="292" width="200" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="180" y="315" text-anchor="middle" font-size="11.5" fill="#334155">1 个 CPU 核</text>

  <!-- 列2 -->
  <text x="360" y="124" font-size="10.5" fill="#64748b">N 个用户线程</text>
  <rect x="350" y="132" width="86" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="393" y="154" text-anchor="middle" font-size="11" fill="#1e40af">T1</text>
  <rect x="457" y="132" width="86" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="154" text-anchor="middle" font-size="11" fill="#1e40af">T2</text>
  <rect x="564" y="132" width="86" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="607" y="154" text-anchor="middle" font-size="11" fill="#1e40af">T3</text>

  <line x1="393" y1="166" x2="393" y2="222" stroke="#16a34a" stroke-width="1.5" marker-end="url(#t1)"/>
  <line x1="500" y1="166" x2="500" y2="222" stroke="#16a34a" stroke-width="1.5" marker-end="url(#t1)"/>
  <line x1="607" y1="166" x2="607" y2="222" stroke="#16a34a" stroke-width="1.5" marker-end="url(#t1)"/>

  <rect x="350" y="226" width="86" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="393" y="251" text-anchor="middle" font-size="10.5" fill="#14532d">内核线程</text>
  <rect x="457" y="226" width="86" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="500" y="251" text-anchor="middle" font-size="10.5" fill="#14532d">内核线程</text>
  <rect x="564" y="226" width="86" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="607" y="251" text-anchor="middle" font-size="10.5" fill="#14532d">内核线程</text>

  <line x1="393" y1="266" x2="393" y2="288" stroke="#64748b" stroke-width="1.5"/>
  <line x1="607" y1="266" x2="607" y2="288" stroke="#64748b" stroke-width="1.5"/>
  <rect x="350" y="292" width="300" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="315" text-anchor="middle" font-size="11.5" fill="#334155">多核 CPU：可真并行</text>

  <!-- 列3 -->
  <text x="680" y="124" font-size="10.5" fill="#64748b">N 个用户线程</text>
  <rect x="670" y="132" width="86" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="713" y="154" text-anchor="middle" font-size="11" fill="#1e40af">T1</text>
  <rect x="777" y="132" width="86" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="820" y="154" text-anchor="middle" font-size="11" fill="#1e40af">T2</text>
  <rect x="884" y="132" width="86" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="927" y="154" text-anchor="middle" font-size="11" fill="#1e40af">T3</text>

  <line x1="713" y1="166" x2="713" y2="172" stroke="#64748b" stroke-width="1.5"/>
  <line x1="820" y1="166" x2="820" y2="172" stroke="#64748b" stroke-width="1.5"/>
  <line x1="927" y1="166" x2="927" y2="172" stroke="#64748b" stroke-width="1.5"/>
  <rect x="690" y="176" width="260" height="32" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="820" y="197" text-anchor="middle" font-size="11" fill="#b45309">运行库 / 调度器（M:N 的中间层）</text>

  <line x1="780" y1="208" x2="750" y2="222" stroke="#64748b" stroke-width="1.5" marker-end="url(#t1)"/>
  <line x1="860" y1="208" x2="890" y2="222" stroke="#64748b" stroke-width="1.5" marker-end="url(#t1)"/>

  <rect x="690" y="226" width="120" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="750" y="251" text-anchor="middle" font-size="10.5" fill="#14532d">内核线程</text>
  <rect x="830" y="226" width="120" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="890" y="251" text-anchor="middle" font-size="10.5" fill="#14532d">内核线程</text>

  <line x1="750" y1="266" x2="750" y2="286" stroke="#64748b" stroke-width="1.5"/>
  <line x1="890" y1="266" x2="890" y2="286" stroke="#64748b" stroke-width="1.5"/>
  <rect x="690" y="292" width="260" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="820" y="315" text-anchor="middle" font-size="11.5" fill="#334155">内核线程被分配到各核</text>

  <!-- 优缺点 -->
  <text x="40" y="366" font-size="12" font-weight="bold" fill="#14532d">轻量、可定制、跨平台</text>
  <text x="40" y="386" font-size="12" fill="#334155">内核不知道这些线程存在，</text>
  <text x="40" y="403" font-size="12" fill="#334155">能用多少 CPU 全看那 1 个内核线程</text>
  <text x="40" y="420" font-size="12" fill="#334155">被分到多少 → 无法吃满多核。</text>
  <text x="40" y="442" font-size="12" font-weight="bold" fill="#b91c1c">⚠️ 一个线程阻塞，全进程跟着阻塞</text>
  <text x="40" y="462" font-size="11.5" fill="#64748b">因为内核只看到那 1 个内核线程，</text>
  <text x="40" y="478" font-size="11.5" fill="#64748b">它一停，内核不知道还有别的在等。</text>

  <text x="360" y="366" font-size="12" font-weight="bold" fill="#14532d">能真并行、内核直接调度</text>
  <text x="360" y="386" font-size="12" fill="#334155">内核知道启动了多少线程，</text>
  <text x="360" y="403" font-size="12" fill="#334155">可直接把不同线程放到不同核上；</text>
  <text x="360" y="420" font-size="12" fill="#334155">一个线程阻塞也不拖死其余的。</text>
  <text x="360" y="442" font-size="12" font-weight="bold" fill="#b45309">⚠️ 代价：创建 / 切换都要陷内核</text>
  <text x="360" y="462" font-size="11.5" fill="#64748b">开销明显大于用户态切换；</text>
  <text x="360" y="478" font-size="11.5" fill="#64748b">调度权全在内核，可定制性差。</text>

  <text x="680" y="366" font-size="12" font-weight="bold" fill="#14532d">两头的优点都想要</text>
  <text x="680" y="386" font-size="12" fill="#334155">把 M 个用户线程多路复用到 N 个内核线</text>
  <text x="680" y="403" font-size="12" fill="#334155">程上，由中间层自己调度 —— 既轻量又能</text>
  <text x="680" y="420" font-size="12" fill="#334155">利用多核，比例还能按场景配。</text>
  <text x="680" y="442" font-size="12" font-weight="bold" fill="#b45309">⭐ Go 的 GMP 就是这一类</text>
  <text x="680" y="462" font-size="11.5" fill="#64748b">G（协程）→ P（逻辑处理器）→ M（内核线程），</text>
  <text x="680" y="478" font-size="11.5" fill="#64748b">所以「G 阻塞不必然拖住整个进程」。</text>

  <!-- 底部结论 -->
  <rect x="30" y="502" width="940" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="526" font-size="12.5" font-weight="bold" fill="#0f172a">⭐ 判据</text>
  <text x="48" y="548" font-size="12" fill="#334155">问「内核能不能看见这个线程」，比问「它有多轻」更能决定结果：看得见 → 能调度到多核；看不见 → 轻量但一阻塞全阻塞。</text>
</svg>
