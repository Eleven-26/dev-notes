<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">linux 七篇：三层机制 + 一层观测 + 一本手册</text>
  <text x="500" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">判据只有一条：换一个 OS 还成立吗——成立的在 操作系统/，只在 Linux 上成立的在本书</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1d4ed8"/></marker></defs>
  <rect x="24" y="84" width="150" height="96" rx="8" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="99" y="110" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="bold">结构层</text>
  <text x="99" y="134" font-size="11.5" fill="#0f172a" text-anchor="middle">文件长什么样</text>
  <rect x="190" y="94" width="560" height="52" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="204" y="115" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="bold">文件系统与VFS</text>
  <text x="204" y="135" font-size="10.5" fill="#64748b" text-anchor="start">VFS 四层对象 / inode / dentry / 硬软链接 / fd</text>
  <line x1="176" y1="120" x2="188" y2="120" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="24" y="194" width="150" height="96" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="99" y="220" font-size="13" fill="#047857" text-anchor="middle" font-weight="bold">代价层</text>
  <text x="99" y="244" font-size="11.5" fill="#0f172a" text-anchor="middle">写下去要多久</text>
  <rect x="190" y="204" width="560" height="52" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1"/>
  <text x="204" y="225" font-size="12" fill="#047857" text-anchor="start" font-weight="bold">落盘路径与fsync代价</text>
  <text x="204" y="245" font-size="10.5" fill="#64748b" text-anchor="start">六个停留点 / 三条旁路 / 五种写法 ×3 轮实测</text>
  <line x1="176" y1="230" x2="188" y2="230" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="24" y="304" width="150" height="158" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="99" y="330" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">语义层</text>
  <text x="99" y="354" font-size="11.5" fill="#0f172a" text-anchor="middle">Linux 特有的两条</text>
  <rect x="190" y="314" width="560" height="52" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="204" y="335" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="bold">权限与能力模型</text>
  <text x="204" y="355" font-size="10.5" fill="#64748b" text-anchor="start">rwx 两套语义 / UGO 短路 / capability</text>
  <line x1="176" y1="340" x2="188" y2="340" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="190" y="376" width="560" height="52" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="204" y="397" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="bold">系统与服务</text>
  <text x="204" y="417" font-size="10.5" fill="#64748b" text-anchor="start">开机链 / unit 三段 / 两组正交状态</text>
  <line x1="176" y1="402" x2="188" y2="402" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="24" y="476" width="150" height="158" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
  <text x="99" y="502" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">观测层</text>
  <text x="99" y="526" font-size="11.5" fill="#0f172a" text-anchor="middle">怎么看出来</text>
  <rect x="190" y="486" width="560" height="52" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1"/>
  <text x="204" y="507" font-size="12" fill="#b45309" text-anchor="start" font-weight="bold">性能排查</text>
  <text x="204" y="527" font-size="10.5" fill="#64748b" text-anchor="start">USE/RED / 四类资源每一列 / 三条判据</text>
  <line x1="176" y1="512" x2="188" y2="512" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="190" y="548" width="560" height="52" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1"/>
  <text x="204" y="569" font-size="12" fill="#b45309" text-anchor="start" font-weight="bold">读数可信度</text>
  <text x="204" y="589" font-size="10.5" fill="#64748b" text-anchor="start">形状判据 / 六类测量侧故障 / 怀疑顺序</text>
  <line x1="176" y1="574" x2="188" y2="574" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="770" y="84" width="206" height="210" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="786" y="108" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">读序</text>
  <text x="786" y="136" font-size="11.5" fill="#0f172a" text-anchor="start">① 文件系统与VFS</text>
  <text x="786" y="164" font-size="11.5" fill="#0f172a" text-anchor="start">② 落盘与fsync</text>
  <text x="786" y="192" font-size="11.5" fill="#0f172a" text-anchor="start">③ 权限 / 系统与服务</text>
  <text x="786" y="220" font-size="11.5" fill="#0f172a" text-anchor="start">④ 性能排查</text>
  <text x="786" y="248" font-size="11.5" fill="#0f172a" text-anchor="start">⑤ 读数可信度</text>
  <rect x="770" y="308" width="206" height="176" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="786" y="332" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">常翻的手册</text>
  <rect x="786" y="344" width="174" height="56" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1"/>
  <text x="798" y="366" font-size="11.5" fill="#0e7490" text-anchor="start" font-weight="bold">常用命令</text>
  <text x="798" y="386" font-size="10.5" fill="#64748b" text-anchor="start">十二类命令速查</text>
  <text x="786" y="424" font-size="11" fill="#64748b" text-anchor="start">只查表，不装判据</text>
  <text x="786" y="446" font-size="11" fill="#64748b" text-anchor="start">判据一律回上面四层</text>
  <text x="786" y="468" font-size="10.5" fill="#64748b" text-anchor="start">（本册不含性能读数）</text>
  <rect x="24" y="662" width="952" height="38" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="684" font-size="12" fill="#b45309" text-anchor="start">左边四层是「同一件事的四个问法」：长什么样 → 写多贵 → 谁能动 → 怎么看出来；横向进 操作系统/ 的是机制，留在本书的是 Linux 语义与读数。</text>
</svg>
