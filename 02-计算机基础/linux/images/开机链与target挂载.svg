<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">开机这条链与 enable 的实质</text>
  <text x="500" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">UEFI → GRUB → 内核 + initramfs → systemd → target；enable 只是在 wants 目录建一个软链</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1d4ed8"/></marker></defs>
  <rect x="24" y="80" width="470" height="62" rx="8" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="40" y="105" font-size="12.5" fill="#1d4ed8" text-anchor="start" font-weight="bold">固件</text>
  <text x="40" y="127" font-size="11.5" fill="#0f172a" text-anchor="start">UEFI / BIOS 读 NVRAM 启动项</text>
  <line x1="120" y1="144" x2="120" y2="162" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="24" y="160" width="470" height="62" rx="8" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="40" y="185" font-size="12.5" fill="#1d4ed8" text-anchor="start" font-weight="bold">引导器</text>
  <text x="40" y="207" font-size="11.5" fill="#0f172a" text-anchor="start">GRUB2 读 grub.cfg，加载内核与 initramfs</text>
  <line x1="120" y1="224" x2="120" y2="242" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="24" y="240" width="470" height="62" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="1"/>
  <text x="40" y="265" font-size="12.5" fill="#0e7490" text-anchor="start" font-weight="bold">内核 + initramfs</text>
  <text x="40" y="287" font-size="11.5" fill="#0f172a" text-anchor="start">挂上真正的根文件系统，exec /sbin/init</text>
  <line x1="120" y1="304" x2="120" y2="322" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="24" y="320" width="470" height="62" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="40" y="345" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="bold">1 号进程</text>
  <text x="40" y="367" font-size="11.5" fill="#0f172a" text-anchor="start">systemd（PID 1）：读 unit、建 job 队列</text>
  <line x1="120" y1="384" x2="120" y2="402" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="24" y="400" width="470" height="62" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="40" y="425" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="bold">default.target</text>
  <text x="40" y="447" font-size="11.5" fill="#0f172a" text-anchor="start">软链指向开机要进的那个 target</text>
  <line x1="120" y1="464" x2="120" y2="482" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="24" y="480" width="470" height="62" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="40" y="505" font-size="12.5" fill="#047857" text-anchor="start" font-weight="bold">multi-user.target</text>
  <text x="40" y="527" font-size="11.5" fill="#0f172a" text-anchor="start">按 Wants / After 把服务拉起来</text>
  <rect x="540" y="320" width="436" height="200" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="556" y="344" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">multi-user.target.wants/</text>
  <text x="556" y="366" font-size="11" fill="#64748b" text-anchor="start">（enable 就是往这里建软链）</text>
  <rect x="556" y="386" width="400" height="28" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="568" y="405" font-size="11" fill="#0f172a" text-anchor="start">app.service  →  /etc/systemd/system/app.service</text>
  <line x1="516" y1="452" x2="552" y2="400" stroke="#047857" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arwb)"/>
  <rect x="556" y="424" width="400" height="28" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="568" y="443" font-size="11" fill="#0f172a" text-anchor="start">nginx.service  →  /etc/systemd/system/nginx.service</text>
  <line x1="516" y1="452" x2="552" y2="438" stroke="#047857" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arwb)"/>
  <rect x="556" y="462" width="400" height="28" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="568" y="481" font-size="11" fill="#0f172a" text-anchor="start">redis.service  →  /etc/systemd/system/redis.service</text>
  <line x1="516" y1="452" x2="552" y2="476" stroke="#047857" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arwb)"/>
  <rect x="540" y="80" width="436" height="216" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="556" y="104" font-size="12.5" fill="#b45309" text-anchor="start" font-weight="bold">三组指令，别混</text>
  <text x="556" y="130" font-size="11.5" fill="#0f172a" text-anchor="start">Wants / Requires：要不要拉起它</text>
  <text x="556" y="152" font-size="11.5" fill="#0f172a" text-anchor="start">After / Before：只排顺序，不负责拉起</text>
  <text x="556" y="174" font-size="11.5" fill="#0f172a" text-anchor="start">WantedBy：enable 时挂到哪个 target</text>
  <text x="556" y="202" font-size="11.5" fill="#64748b" text-anchor="start">「只写 After 不写 Wants」→ 顺序对了，但它</text>
  <text x="556" y="222" font-size="11.5" fill="#64748b" text-anchor="start">根本不会被拉起；反之则起来了但顺序不保证。</text>
  <text x="556" y="252" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="bold">开机慢看 critical-chain，不看 blame。</text>
  <text x="556" y="276" font-size="11.5" fill="#64748b" text-anchor="start">并行启动下耗时长 ≠ 在关键路径上。</text>
  <rect x="24" y="556" width="952" height="44" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="578" font-size="12" fill="#b45309" text-anchor="start">故障也按这条链的顺序出现：看不到引导菜单 → 固件/GRUB；Kernel panic → 内核与根挂载；停在 emergency.target → unit 或依赖。</text>
</svg>
