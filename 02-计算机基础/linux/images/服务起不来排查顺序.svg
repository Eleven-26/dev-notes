<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">服务起不来的排查顺序：先看 unit 有没有被读到，再看退出码，最后才看应用日志</text>
  <text x="500" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">systemctl status 的第一屏已经给了大部分答案；顺序反了会拿着应用日志去查一个没被加载的 unit</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1d4ed8"/></marker></defs>
  <rect x="24" y="84" width="300" height="200" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="108" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">systemctl status app</text>
  <rect x="40" y="114" width="268" height="40" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="132" font-size="11.5" fill="#1d4ed8" text-anchor="start" font-weight="bold">Loaded:</text>
  <text x="50" y="148" font-size="11" fill="#64748b" text-anchor="start">loaded / not-found</text>
  <rect x="40" y="162" width="268" height="40" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="180" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="bold">Active:</text>
  <text x="50" y="196" font-size="11" fill="#64748b" text-anchor="start">active / failed / inactive</text>
  <rect x="40" y="210" width="268" height="40" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="228" font-size="11.5" fill="#047857" text-anchor="start" font-weight="bold">Main PID:</text>
  <text x="50" y="244" font-size="11" fill="#64748b" text-anchor="start">有没有真的起进程</text>
  <rect x="356" y="84" width="304" height="52" rx="8" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="368" y="105" font-size="11.5" fill="#1d4ed8" text-anchor="start" font-weight="bold">① not-found</text>
  <text x="368" y="124" font-size="10.5" fill="#64748b" text-anchor="start">unit 文件名拼错 / 不在搜索路径</text>
  <rect x="672" y="84" width="304" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="684" y="105" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="bold">② 203/EXEC</text>
  <text x="684" y="124" font-size="10.5" fill="#64748b" text-anchor="start">路径不对、无 x 权限、解释器不存在</text>
  <rect x="356" y="146" width="304" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="368" y="167" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="bold">③ 200/CHDIR</text>
  <text x="368" y="186" font-size="10.5" fill="#64748b" text-anchor="start">WorkingDirectory 不存在或缺 x</text>
  <rect x="672" y="146" width="304" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
  <text x="684" y="167" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="bold">④ 反复重启</text>
  <text x="684" y="186" font-size="10.5" fill="#64748b" text-anchor="start">撞 start-limit → reset-failed</text>
  <rect x="356" y="208" width="304" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
  <text x="368" y="229" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="bold">⑤ 起来就 dead</text>
  <text x="368" y="248" font-size="10.5" fill="#64748b" text-anchor="start">程序自己 fork 到后台（改前台）</text>
  <rect x="672" y="208" width="304" height="52" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="684" y="229" font-size="11.5" fill="#7c3aed" text-anchor="start" font-weight="bold">⑥ stop 等 90s</text>
  <text x="684" y="248" font-size="10.5" fill="#64748b" text-anchor="start">不响应 SIGTERM；容器里 1 号进程尤甚</text>
  <rect x="356" y="270" width="304" height="52" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="1"/>
  <text x="368" y="291" font-size="11.5" fill="#0e7490" text-anchor="start" font-weight="bold">⑦ 没有日志</text>
  <text x="368" y="310" font-size="10.5" fill="#64748b" text-anchor="start">只写文件 / stdout 被重定向</text>
  <line x1="328" y1="150" x2="352" y2="108" stroke="#1d4ed8" stroke-width="1.3" marker-end="url(#arwb)"/>
  <line x1="328" y1="180" x2="352" y2="232" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arwb)"/>
  <rect x="24" y="336" width="952" height="104" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="40" y="360" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="bold">⑥ 的实测（容器里 docker stop -t 6 共两次）</text>
  <text x="40" y="386" font-size="11.5" fill="#0f172a" text-anchor="start">sleep 300 作 1 号进程：实际耗时 9 s（走满超时后被 SIGKILL）——默认处置的 SIGTERM 收不到</text>
  <text x="40" y="408" font-size="11.5" fill="#0f172a" text-anchor="start">装了 SIGTERM 处理器的 python 作 1 号进程：实际耗时 1063 ms</text>
  <text x="40" y="426" font-size="11" fill="#64748b" text-anchor="start">同一时刻 /proc/1/status：SigBlk=0、SigIgn=0x4（只忽略 SIGQUIT）、SigCgt=0</text>
  <rect x="24" y="448" width="952" height="52" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="470" font-size="12" fill="#b45309" text-anchor="start">判据：Loaded 行决定「要不要继续往下查」，Active 行决定「是启动失败还是退出失败」，最后才是应用自己的日志。</text>
</svg>
