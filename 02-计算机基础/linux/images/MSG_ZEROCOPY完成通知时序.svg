<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect width="1000" height="660" fill="#ffffff"/>
<defs>
<marker id="arMZ" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
<marker id="arMO" viewBox="0 0 7 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/></marker>
</defs>
<text x="40" y="34" font-size="20" font-weight="bold" fill="#0f172a">MSG_ZEROCOPY：发送时序与那一次异步完成通知</text>
<text x="40" y="58" font-size="13" fill="#64748b">Linux 4.14+ 给 sendmsg 加的标志：内核不拷贝，而是把用户缓冲区「钉住」直接交给网卡 DMA</text>

<rect x="80" y="84" width="200" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="180" y="104" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d4ed8">应用</text>
<text x="180" y="120" font-size="10" text-anchor="middle" fill="#334155">用户态缓冲区</text>
<rect x="400" y="84" width="200" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="500" y="104" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">内核</text>
<text x="500" y="120" font-size="10" text-anchor="middle" fill="#334155">sendmsg 与 error queue</text>
<rect x="720" y="84" width="200" height="44" rx="8" fill="#ffedd5" stroke="#ea580c"/>
<text x="820" y="104" font-size="13" font-weight="bold" text-anchor="middle" fill="#b45309">网卡</text>
<text x="820" y="120" font-size="10" text-anchor="middle" fill="#334155">DMA</text>

<line x1="180" y1="128" x2="180" y2="424" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="500" y1="128" x2="500" y2="424" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="820" y1="128" x2="820" y2="424" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/>

<line x1="180" y1="152" x2="500" y2="152" stroke="#334155" stroke-width="1.5" marker-end="url(#arMZ)"/>
<text x="340" y="146" font-size="12" text-anchor="middle" fill="#0f172a">sendmsg(MSG_ZEROCOPY)</text>
<text x="340" y="170" font-size="10" text-anchor="middle" fill="#64748b">1 次系统调用 + 1 次完成通知</text>

<rect x="400" y="184" width="200" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="500" y="202" font-size="11" text-anchor="middle" fill="#334155">不再拷进 socket 缓冲区</text>
<text x="500" y="220" font-size="11" text-anchor="middle" fill="#334155">而是把缓冲区「钉住」</text>
<text x="500" y="238" font-size="11" text-anchor="middle" fill="#16a34a">CPU 数据拷贝 0 次</text>

<line x1="500" y1="266" x2="820" y2="266" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arMO)"/>
<text x="660" y="260" font-size="11" text-anchor="middle" fill="#b45309">DMA 直接读用户缓冲区</text>

<line x1="500" y1="316" x2="180" y2="316" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arMZ)"/>
<text x="340" y="310" font-size="11" text-anchor="middle" fill="#0f172a">error queue 异步回传「内存用完了」</text>

<rect x="80" y="336" width="200" height="58" rx="6" fill="#fee2e2" stroke="#dc2626"/>
<text x="180" y="354" font-size="11" text-anchor="middle" fill="#7f1d1d">收到通知之前</text>
<text x="180" y="372" font-size="11" text-anchor="middle" fill="#7f1d1d">不得改写、不得释放</text>
<text x="180" y="390" font-size="11" text-anchor="middle" fill="#dc2626">这是它最大的使用成本</text>

<rect x="40" y="440" width="920" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="60" y="466" font-size="13" font-weight="bold" fill="#0f172a">这一行在总览对比表里的位置</text>
<text x="60" y="490" font-size="12" fill="#334155">MSG_ZEROCOPY：经过用户态「否（发送时）」｜CPU 拷贝 0 次｜系统调用 1 + 完成通知｜上下文切换 2</text>
<text x="60" y="510" font-size="12" fill="#334155">典型限制：Linux 4.14+；发送期间不得改动用户缓冲区</text>

<rect x="40" y="534" width="920" height="80" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="60" y="560" font-size="13" font-weight="bold" fill="#92400e">省的是「进内核」那一步，不是「产生数据」那一步</text>
<text x="60" y="584" font-size="12" fill="#92400e">数据本来就是用户态产生的（如序列化结果）；大块发送（几十 KB 以上）才划算，小包因通知开销反而更慢</text>
<text x="60" y="606" font-size="12" fill="#b45309">Go 标准库没有暴露它，要用得走 x/sys/unix 手写 sendmsg 并自己收通知</text>
</svg>
