<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一次访问的权限判定链：属主 → 属组 → 其他人，命中即停；root 走能力旁路</text>
  <text x="500" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">三段判定是短路求值，不是叠加；root（uid 0）不比较 rwx，去查 capability 位</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1d4ed8"/></marker></defs>
  <rect x="24" y="88" width="520" height="76" rx="8" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="40" y="116" font-size="13" fill="#1d4ed8" text-anchor="start" font-weight="bold">① euid == 文件属主？</text>
  <text x="40" y="142" font-size="11.5" fill="#0f172a" text-anchor="start">是 → 只用「属主」三位，命中即停</text>
  <line x1="100" y1="166" x2="100" y2="188" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="24" y="188" width="520" height="76" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="40" y="216" font-size="13" fill="#047857" text-anchor="start" font-weight="bold">② egid / 附加组 ∈ 属组？</text>
  <text x="40" y="242" font-size="11.5" fill="#0f172a" text-anchor="start">是 → 只用「属组」三位，命中即停</text>
  <line x1="100" y1="266" x2="100" y2="288" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="24" y="288" width="520" height="76" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
  <text x="40" y="316" font-size="13" fill="#b45309" text-anchor="start" font-weight="bold">③ 以上都不是</text>
  <text x="40" y="342" font-size="11.5" fill="#0f172a" text-anchor="start">→ 用「其他人」三位</text>
  <rect x="600" y="88" width="376" height="176" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="616" y="114" font-size="13" fill="#dc2626" text-anchor="start" font-weight="bold">root 的旁路（uid == 0）</text>
  <text x="616" y="140" font-size="11.5" fill="#0f172a" text-anchor="start">不比较 rwx，直接查 capability：</text>
  <text x="616" y="164" font-size="11.5" fill="#0f172a" text-anchor="start">CAP_DAC_OVERRIDE → 绕过读写检查</text>
  <text x="616" y="186" font-size="11.5" fill="#0f172a" text-anchor="start">CAP_CHOWN → 改属主</text>
  <text x="616" y="208" font-size="11.5" fill="#0f172a" text-anchor="start">CAP_FOWNER → 忽略属主限制</text>
  <text x="616" y="234" font-size="11.5" fill="#dc2626" text-anchor="start">⚠️ 容器里这些位可能被摘掉</text>
  <line x1="548" y1="126" x2="596" y2="126" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arwb)"/>
  <rect x="600" y="288" width="376" height="132" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="616" y="312" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="bold">为什么属主位小的时候属组位不生效</text>
  <text x="616" y="336" font-size="11.5" fill="#0f172a" text-anchor="start">链条在第 ① 段就断了：内核不会</text>
  <text x="616" y="356" font-size="11.5" fill="#0f172a" text-anchor="start">「把三组权限加起来」，也不会取最大。</text>
  <text x="616" y="380" font-size="11.5" fill="#64748b" text-anchor="start">chmod 040 的文件，属主本人不可读。</text>
  <text x="616" y="402" font-size="11.5" fill="#64748b" text-anchor="start">这不是 bug，是短路判定。</text>
  <rect x="24" y="438" width="952" height="42" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="460" font-size="12" fill="#b45309" text-anchor="start">实测支撑：文件 444 + 目录 555 → 删不掉（看目录 w）；目录 400 → 名字读得到、stat 被拒；目录 100 → 列不出但能直达。</text>
</svg>
