<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="p1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="p2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">进程的五个状态与四条主要转换</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">最容易记错的一条：阻塞结束后回到的是「就绪」，不是「运行」—— 它必须重新排队</text>

  <!-- 结束 -->
  <rect x="640" y="210" width="100" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="690" y="244" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">结束</text>

  <!-- 运行 -->
  <rect x="400" y="210" width="140" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="470" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">运行</text>
  <text x="470" y="254" text-anchor="middle" font-size="10.5" fill="#14532d">占有 CPU</text>

  <!-- 就绪 -->
  <rect x="170" y="210" width="140" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">就绪</text>
  <text x="240" y="254" text-anchor="middle" font-size="10.5" fill="#1e40af">万事俱备，只差 CPU</text>

  <!-- 新建 -->
  <rect x="40" y="210" width="80" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="244" text-anchor="middle" font-size="13" fill="#334155">新建</text>

  <!-- 阻塞 -->
  <rect x="400" y="386" width="140" height="56" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="470" y="412" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">阻塞</text>
  <text x="470" y="430" text-anchor="middle" font-size="10.5" fill="#b45309">等事件 / 等 IO</text>

  <!-- 新建 → 就绪 -->
  <line x1="124" y1="238" x2="164" y2="238" stroke="#2563eb" stroke-width="2" marker-end="url(#p1)"/>
  <text x="144" y="228" text-anchor="middle" font-size="10" fill="#2563eb">创建</text>

  <!-- 就绪 ⇄ 运行 -->
  <line x1="314" y1="226" x2="394" y2="226" stroke="#2563eb" stroke-width="2" marker-end="url(#p1)"/>
  <text x="354" y="214" text-anchor="middle" font-size="10.5" fill="#1e40af">被调度器选中</text>
  <line x1="394" y1="252" x2="314" y2="252" stroke="#b45309" stroke-width="2" marker-end="url(#p2)"/>
  <text x="354" y="270" text-anchor="middle" font-size="10.5" fill="#b45309">时间片用完</text>

  <!-- 运行 → 结束 -->
  <line x1="544" y1="238" x2="634" y2="238" stroke="#2563eb" stroke-width="2" marker-end="url(#p1)"/>
  <text x="589" y="228" text-anchor="middle" font-size="10.5" fill="#1e40af">任务执行完毕</text>

  <!-- 运行 → 阻塞 -->
  <line x1="470" y1="270" x2="470" y2="380" stroke="#b45309" stroke-width="2" marker-end="url(#p2)"/>
  <text x="482" y="310" font-size="10.5" fill="#b45309">需要等待某个事件</text>
  <text x="482" y="326" font-size="10.5" fill="#b45309">（键盘输入 / IO 返回）</text>

  <!-- 阻塞 → 就绪（绕行） -->
  <path d="M 400 414 H 240 V 272" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#p1)"/>
  <text x="250" y="434" font-size="10.5" fill="#14532d">事件完成 → 回到就绪队列重新排队</text>

  <!-- 不存在的边 -->
  <rect x="588" y="386" width="290" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="602" y="408" font-size="12" font-weight="bold" fill="#b91c1c">⚠️ 图上没有「阻塞 → 运行」这条边</text>
  <text x="602" y="428" font-size="11" fill="#334155">事件完成不等于拿到 CPU。事件（键盘/IO）很慢，</text>
  <text x="602" y="444" font-size="11" fill="#334155">而调度很快，所以必须重新竞争一次。</text>

  <!-- 挂起状态 -->
  <rect x="588" y="470" width="382" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="602" y="492" font-size="12" font-weight="bold" fill="#0f172a">另有「挂起」状态（被换出到 swap / 磁盘）</text>
  <text x="602" y="512" font-size="11" fill="#334155">就绪挂起、阻塞挂起：它在内存里被挪走了，</text>
  <text x="602" y="528" font-size="11" fill="#334155">连「等在队列里」都做不到，要再次换入才继续。</text>

  <!-- 底部结论 -->
  <rect x="40" y="510" width="520" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="534" font-size="12.5" font-weight="bold" fill="#1e40af">⭐ 一句话记住四条主转换</text>
  <text x="58" y="554" font-size="12" fill="#334155">调度器选中（就绪→运行）、时间片到（运行→就绪）、</text>
  <text x="58" y="574" font-size="12" fill="#334155">等事件（运行→阻塞）、事件完成（阻塞→就绪）。</text>
</svg>
