<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一个 inode 的三种处境：两个硬链接、一个软链接、已删除但被打开</text>
  <text x="500" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">名字在 dentry 里，数据在数据块里；Links 计数与打开计数是两个独立的门闩</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1d4ed8"/></marker></defs>
  <rect x="24" y="84" width="300" height="176" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="40" y="110" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="bold">inode（一个文件）</text>
  <text x="40" y="138" font-size="11.5" fill="#0f172a" text-anchor="start">元数据：类型 / 权限 / 属主 / 大小</text>
  <text x="40" y="160" font-size="11.5" fill="#0f172a" text-anchor="start">数据块指针 → 内容所在块</text>
  <text x="40" y="186" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">Links = 2   ← 门闩①</text>
  <text x="40" y="210" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">打开计数 = 1 ← 门闩②</text>
  <text x="40" y="238" font-size="11.5" fill="#64748b" text-anchor="start">两个都归 0，数据块才释放</text>
  <rect x="372" y="84" width="604" height="92" rx="8" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="390" y="108" font-size="12.5" fill="#1d4ed8" text-anchor="start" font-weight="bold">① 硬链接 hard.txt / hard2.txt：目录项 → 同一个 inode</text>
  <text x="390" y="132" font-size="11.5" fill="#0f172a" text-anchor="start">目录里多两条「名字 → inode 号」；Links 从 1 变 2</text>
  <text x="390" y="154" font-size="11.5" fill="#64748b" text-anchor="start">删掉任一名字，Links 减 1，数据仍在（另一条名字还在）</text>
  <line x1="324" y1="130" x2="368" y2="130" stroke="#1d4ed8" stroke-width="1.3" marker-end="url(#arwb)"/>
  <rect x="372" y="188" width="604" height="92" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="390" y="212" font-size="12.5" fill="#047857" text-anchor="start" font-weight="bold">② 软链接 soft.txt：另起一个 inode，内容是路径字符串</text>
  <text x="390" y="236" font-size="11.5" fill="#0f172a" text-anchor="start">它自己的 inode + 自己的数据块（存着 &quot;app.log&quot;）</text>
  <text x="390" y="258" font-size="11.5" fill="#64748b" text-anchor="start">目标删掉就断链；可跨文件系统、可指向目录</text>
  <line x1="324" y1="200" x2="368" y2="200" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="372" y="292" width="604" height="92" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="390" y="316" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="bold">③ rm 掉但仍有进程打开：名字没了，inode 还在</text>
  <text x="390" y="340" font-size="11.5" fill="#0f172a" text-anchor="start">Links 归 0（门闩①已开），打开计数仍 = 1（门闩②未开）</text>
  <text x="390" y="362" font-size="11.5" fill="#64748b" text-anchor="start">数据块不释放 → df 不降，du 也看不到（lsof +L1 才找得到）</text>
  <line x1="324" y1="270" x2="368" y2="300" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arwb)"/>
  <rect x="24" y="404" width="952" height="46" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="426" font-size="12" fill="#b45309" text-anchor="start">判据：Links 归 0 只说明「没有名字了」，还要「打开计数也归 0」——两个门闩独立，缺一个数据块都不走。</text>
</svg>
