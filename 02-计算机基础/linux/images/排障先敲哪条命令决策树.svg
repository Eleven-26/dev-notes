<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="1100" height="740" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1100" height="740" fill="#ffffff"/>
  <defs>
    <marker id="lx" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">线上排障：先看现象，再决定敲哪条命令</text>
  <text x="550" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">五个现象分支对应五组命令；本图为判据示意，不含新读数</text>

  <rect x="30" y="330" width="220" height="72" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">线上排障，先看什么现象？</text>
  <text x="140" y="382" text-anchor="middle" font-size="10.5" fill="#1e3a8a">先缩小到哪一类资源</text>

  <rect x="300" y="60" width="280" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="440" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">端口被占用 / 连不上</text>
  <text x="440" y="108" text-anchor="middle" font-size="10.5" fill="#475569">服务起不来、连接被拒</text>

  <rect x="300" y="160" width="280" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="440" y="187" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">磁盘写不进去</text>
  <text x="440" y="208" text-anchor="middle" font-size="10.5" fill="#475569">No space left on device</text>

  <rect x="300" y="320" width="280" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="440" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">删了文件空间没释放</text>
  <text x="440" y="368" text-anchor="middle" font-size="10.5" fill="#475569">du 看不到大文件</text>

  <rect x="300" y="420" width="280" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="440" y="447" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">进程卡 / CPU 高</text>
  <text x="440" y="468" text-anchor="middle" font-size="10.5" fill="#475569">整体慢、单核打满</text>

  <rect x="300" y="540" width="280" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="440" y="567" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">日志要定位一段</text>
  <text x="440" y="588" text-anchor="middle" font-size="10.5" fill="#475569">只知道关键词或大致时间</text>

  <rect x="640" y="64" width="430" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="855" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">ss -tunlp | grep &lt;端口&gt; → lsof -i :&lt;端口&gt;</text>

  <rect x="640" y="140" width="430" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="855" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">df -h / df -i —— 先分清空间满还是 inode 满</text>

  <rect x="640" y="200" width="430" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="855" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">du -x --max-depth=1 —— 逐层定位大目录</text>

  <rect x="640" y="324" width="430" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="855" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">lsof +L1 —— 已删除但仍被占用的文件</text>

  <rect x="640" y="424" width="430" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="855" y="457" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">top 看整体，top -Hp &lt;pid&gt; 看线程</text>

  <rect x="640" y="540" width="430" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="855" y="573" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">tail -F 实时跟；grep -n 定位行号 → sed -n 取区间</text>

  <path d="M 250 366 L 300 92" stroke="#64748b" stroke-width="1.5" marker-end="url(#lx)"/>
  <path d="M 250 366 L 300 192" stroke="#64748b" stroke-width="1.5" marker-end="url(#lx)"/>
  <path d="M 250 366 L 300 352" stroke="#64748b" stroke-width="1.5" marker-end="url(#lx)"/>
  <path d="M 250 366 L 300 452" stroke="#64748b" stroke-width="1.5" marker-end="url(#lx)"/>
  <path d="M 250 366 L 300 572" stroke="#64748b" stroke-width="1.5" marker-end="url(#lx)"/>

  <path d="M 580 92 L 640 92" stroke="#64748b" stroke-width="1.5" marker-end="url(#lx)"/>
  <path d="M 580 192 L 640 168" stroke="#64748b" stroke-width="1.5" marker-end="url(#lx)"/>
  <path d="M 580 192 L 640 228" stroke="#64748b" stroke-width="1.5" marker-end="url(#lx)"/>
  <path d="M 580 352 L 640 352" stroke="#64748b" stroke-width="1.5" marker-end="url(#lx)"/>
  <path d="M 580 452 L 640 452" stroke="#64748b" stroke-width="1.5" marker-end="url(#lx)"/>
  <path d="M 580 572 L 640 568" stroke="#64748b" stroke-width="1.5" marker-end="url(#lx)"/>

  <rect x="30" y="650" width="1040" height="58" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="676" font-size="12.5" font-weight="bold" fill="#1e40af">判据：先把现象收敛到「哪一类资源」，再敲命令。</text>
  <text x="46" y="698" font-size="12" fill="#1e3a8a">别一上来就 grep 整个日志或整块盘 —— 范围没缩小，命令越顺手越费时间。</text>
</svg>
