<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="mb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一次 write() 到落盘的完整路径：write 返回 ≠ 数据落盘</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">数据在 ② 页缓存就「成功」了，此后由内核异步回写；要断电不丢，必须在 ② 之后显式 fsync</text>

  <!-- ============ 物理硬件层 ============ -->
  <rect x="24" y="72" width="952" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="92" font-size="12" font-weight="bold" fill="#475569">物理硬件层</text>

  <rect x="40" y="100" width="180" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="130" y="122" font-size="11" text-anchor="middle" fill="#334155">磁盘 / SSD 控制器</text>
  <rect x="386" y="100" width="228" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="500" y="122" font-size="11" text-anchor="middle" fill="#78350f">CPU（含 L1 / L2 / LLC Cache）</text>
  <rect x="780" y="100" width="180" height="34" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="870" y="122" font-size="11" text-anchor="middle" fill="#075985">网卡 NIC（自带 DMA 引擎）</text>

  <line x1="40" y1="142" x2="960" y2="142" stroke="#94a3b8" stroke-width="3"/>
  <line x1="130" y1="134" x2="130" y2="142" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="500" y1="134" x2="500" y2="142" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="870" y1="134" x2="870" y2="142" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="280" y="138" font-size="10.5" text-anchor="middle" fill="#64748b">PCIe · DMA</text>
  <text x="700" y="138" font-size="10.5" text-anchor="middle" fill="#64748b">PCIe · DMA</text>

  <line x1="500" y1="142" x2="500" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="330" y="150" width="340" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="172" font-size="11" text-anchor="middle" fill="#1e3a8a">DDR 内存：①②③ 三段缓冲全在这块里</text>
  <text x="40" y="198" font-size="11.5" fill="#334155">本图只走磁盘这一端：④→⑤ 是 DMA 写盘，不占 CPU；网卡那一端的四次拷贝（含 socket 缓冲）见零拷贝篇</text>

  <!-- ============ 左列：主链 ============ -->
  <rect x="24" y="212" width="536" height="400" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <rect x="40" y="222" width="360" height="44" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="58" y="242" font-size="13" font-weight="bold" fill="#0f172a">① 用户缓冲区</text>
  <text x="58" y="258" font-size="11" fill="#64748b">bufio.Writer / BufferedWriter（用户态内存）</text>

  <line x1="220" y1="266" x2="220" y2="302" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>
  <text x="232" y="280" font-size="11" fill="#1e40af">write(fd, buf, n)</text>
  <text x="232" y="294" font-size="11" fill="#1e40af">系统调用陷入内核</text>

  <line x1="30" y1="286" x2="550" y2="286" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="40" y="282" font-size="11" fill="#94a3b8">用户态</text>
  <text x="470" y="282" font-size="11" fill="#94a3b8">内核态</text>

  <rect x="40" y="306" width="360" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="58" y="328" font-size="13" font-weight="bold" fill="#1e40af">② Page Cache 页缓存</text>
  <text x="58" y="346" font-size="11" fill="#1e40af">拷贝到此就返回，页被标记 dirty，等内核异步回写</text>

  <line x1="220" y1="360" x2="220" y2="398" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>
  <text x="232" y="376" font-size="11" fill="#1e40af">异步回写</text>
  <text x="232" y="390" font-size="11" fill="#1e40af">不阻塞 write 调用</text>

  <rect x="40" y="402" width="360" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="58" y="424" font-size="13" font-weight="bold" fill="#0f172a">③ 块层 Generic Block Layer</text>
  <text x="58" y="442" font-size="11" fill="#64748b">合并 / 排序请求 → IO 调度 mq-deadline · kyber · bfq</text>

  <line x1="220" y1="454" x2="220" y2="482" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>

  <rect x="40" y="486" width="360" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="58" y="512" font-size="13" fill="#0f172a">④ 设备驱动（SCSI / NVMe）</text>

  <line x1="220" y1="528" x2="220" y2="554" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>

  <rect x="40" y="558" width="360" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="58" y="584" font-size="13" font-weight="bold" fill="#14532d">⑤ 磁盘 / SSD（只有到这里才持久）</text>

  <!-- ============ 右列：三条旁路 ============ -->
  <rect x="570" y="222" width="400" height="190" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="586" y="246" font-size="14" font-weight="bold" fill="#b45309">三条旁路：何时算真的落盘</text>

  <text x="586" y="270" font-size="12" font-weight="bold" fill="#0f172a">fsync / fdatasync</text>
  <text x="586" y="288" font-size="11" fill="#334155">把 ② 的脏页（fsync 还含元数据）推到底并</text>
  <text x="586" y="303" font-size="11" fill="#334155">等磁盘确认。返回 0 才算断电不丢 —— 数据库</text>
  <text x="586" y="318" font-size="11" fill="#334155">WAL 靠的就是它；msync 负责 mmap 映射区。</text>

  <text x="586" y="344" font-size="12" font-weight="bold" fill="#0f172a">O_DIRECT</text>
  <text x="586" y="362" font-size="11" fill="#334155">绕过页缓存，直接在用户缓冲与设备间传输。</text>
  <text x="586" y="377" font-size="11" fill="#334155">适合自带缓存的数据库；免费午餐没有：</text>
  <text x="586" y="392" font-size="11" fill="#b45309">必须自己保证地址 / 长度 / 偏移全部按块对齐。</text>

  <rect x="570" y="430" width="400" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="586" y="454" font-size="12" font-weight="bold" fill="#1e40af">mmap：把文件映射成一段内存</text>
  <text x="586" y="474" font-size="11" fill="#334155">读写像操作字节数组，省掉 read/write 的系统</text>
  <text x="586" y="489" font-size="11" fill="#334155">调用与一次用户 / 内核拷贝，随机访问友好。</text>
  <text x="586" y="508" font-size="11" fill="#334155">⚠️ 但仍走 ② 的脏页：回写时机不可控（要</text>
  <text x="586" y="523" font-size="11" fill="#334155">msync）、大文件首次访问有缺页抖动、占 RSS。</text>
  <text x="586" y="548" font-size="12" font-weight="bold" fill="#b45309">它不消灭代价，只把代价从「拷贝」换成「缺页」。</text>
  <text x="586" y="570" font-size="11" fill="#64748b">⭐ 若只是「读大文件 + 顺序扫描」，sendfile /</text>
  <text x="586" y="585" font-size="11" fill="#64748b">splice 这类零拷贝路径比 mmap 更合适。</text>

  <!-- ============ 底部结论 ============ -->
  <rect x="40" y="612" width="920" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="58" y="636" font-size="13" font-weight="bold" fill="#0f172a">⚠️ 三句话记住这张图</text>
  <text x="58" y="658" font-size="12" fill="#334155">① write() 返回 0 只代表「数据进了页缓存」，机器此刻断电照样丢；</text>
  <text x="58" y="678" font-size="12" fill="#334155">② 只有 fsync() / fdatasync() 返回 0 才代表「落盘」，这是 WAL、刷盘策略的判据；</text>
  <text x="58" y="698" font-size="12" fill="#334155">③ O_DIRECT 与 mmap 都是在「拷贝成本」和「一致性 / 对齐责任」之间交换，不是纯优化。</text>
</svg>
