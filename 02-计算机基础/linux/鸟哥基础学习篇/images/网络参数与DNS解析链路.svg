<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#fbfcfe"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7 3 L0 6 z" fill="#3b5b8c"/>
    </marker>
  </defs>
  <text x="450" y="38" text-anchor="middle" font-size="20" fill="#14263d">网络参数与 DNS 解析链路</text>

  <rect x="40" y="80" width="250" height="170" rx="8" fill="#eef3fb" stroke="#4a76b8" stroke-width="1.5"/>
  <text x="60" y="112" font-size="16" fill="#14263d">主机参数</text>
  <text x="60" y="148" font-size="14" fill="#1f2d3d">IP  192.168.1.10/24</text>
  <text x="60" y="178" font-size="14" fill="#1f2d3d">掩码  255.255.255.0</text>
  <text x="60" y="208" font-size="14" fill="#1f2d3d">网关  192.168.1.1</text>
  <text x="60" y="238" font-size="14" fill="#1f2d3d">DNS  223.5.5.5</text>

  <rect x="350" y="80" width="250" height="170" rx="8" fill="#eef7ef" stroke="#4a8b5c" stroke-width="1.5"/>
  <text x="370" y="112" font-size="16" fill="#14263d">查路由表</text>
  <text x="370" y="148" font-size="14" fill="#1f2d3d">同网段 → 直连</text>
  <text x="370" y="178" font-size="14" fill="#1f2d3d">10.20.0.0/16</text>
  <text x="370" y="203" font-size="14" fill="#1f2d3d">→ 192.168.1.254</text>
  <text x="370" y="233" font-size="14" fill="#1f2d3d">其余 → 192.168.1.1</text>

  <rect x="660" y="80" width="200" height="170" rx="8" fill="#fdf3ec" stroke="#b8763f" stroke-width="1.5"/>
  <text x="680" y="112" font-size="16" fill="#14263d">出口</text>
  <text x="680" y="148" font-size="14" fill="#1f2d3d">默认网关</text>
  <text x="680" y="178" font-size="14" fill="#1f2d3d">192.168.1.1</text>

  <rect x="350" y="330" width="250" height="140" rx="8" fill="#f5eefb" stroke="#7a5aa8" stroke-width="1.5"/>
  <text x="370" y="362" font-size="16" fill="#14263d">DNS 解析链路</text>
  <text x="370" y="398" font-size="14" fill="#1f2d3d">/etc/resolv.conf</text>
  <text x="370" y="428" font-size="14" fill="#1f2d3d">223.5.5.5 / 8.8.8.8</text>
  <text x="370" y="456" font-size="14" fill="#1f2d3d">域名 → IP</text>

  <path d="M290 165 L350 165" fill="none" stroke="#3b5b8c" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M600 165 L660 165" fill="none" stroke="#3b5b8c" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M475 330 L475 250" fill="none" stroke="#3b5b8c" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M165 250 L165 400 L350 400" fill="none" stroke="#7a5aa8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>

  <text x="228" y="157" text-anchor="middle" font-size="12" fill="#3b5b8c">选路</text>
  <text x="627" y="157" text-anchor="middle" font-size="12" fill="#3b5b8c">转发</text>
  <text x="500" y="295" text-anchor="middle" font-size="12" fill="#3b5b8c">先解析出 IP</text>
  <text x="165" y="330" text-anchor="middle" font-size="12" fill="#7a5aa8">写 DNS</text>
  <text x="450" y="500" text-anchor="middle" font-size="13" fill="#55616f">nmcli connection modify 只改档案，connection up 才生效</text>
</svg>
