<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="pu1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="pu2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="800" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">systemd 的 unit 依赖层级：谁把谁拉起来</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">依赖靠声明：After 定顺序、Wants / Requires 定拉起、WantedBy 定 enable 挂到哪个 target</text>

  <text x="30" y="92" font-size="15" font-weight="bold" fill="#1e40af">A. 依赖树：target 把服务拉起来</text>

  <rect x="200" y="104" width="260" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">default.target</text>
  <text x="330" y="148" text-anchor="middle" font-size="11" fill="#1e40af">服务器上指向 multi-user.target</text>

  <path d="M 330 162 L 330 196" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#pu1)"/>

  <rect x="180" y="200" width="300" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="330" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">multi-user.target</text>
  <text x="330" y="244" text-anchor="middle" font-size="11" fill="#1e40af">多用户目标（相当于旧的 runlevel 3）</text>

  <rect x="30" y="300" width="180" height="58" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="120" y="336" text-anchor="middle" font-size="13" fill="#0f172a">nginx.service</text>

  <rect x="240" y="300" width="180" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="330" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">app.service</text>

  <rect x="450" y="300" width="180" height="58" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="540" y="336" text-anchor="middle" font-size="13" fill="#0f172a">sshd.service</text>

  <path d="M 330 258 L 330 284 L 120 284 L 120 294" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#pu1)"/>
  <path d="M 330 258 L 330 294" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#pu1)"/>
  <path d="M 330 258 L 330 284 L 540 284 L 540 294" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#pu1)"/>

  <text x="352" y="272" font-size="11" fill="#2563eb">WantedBy=multi-user.target</text>

  <path d="M 330 358 L 330 394" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#pu2)"/>
  <text x="345" y="384" font-size="11" fill="#b45309">After= / Wants=</text>

  <rect x="240" y="400" width="180" height="58" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="330" y="424" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b45309">network-online.target</text>
  <text x="330" y="444" text-anchor="middle" font-size="11" fill="#b45309">等网络真的可用</text>

  <text x="330" y="482" text-anchor="middle" font-size="11" fill="#64748b">（network.target 只保证网络栈已加载；online 才保证能出网）</text>

  <text x="690" y="92" font-size="15" font-weight="bold" fill="#14532d">B. 两类「按需」unit</text>

  <rect x="690" y="104" width="290" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="835" y="128" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">.socket</text>
  <text x="835" y="148" text-anchor="middle" font-size="11" fill="#14532d">套接字激活：连接到达才拉起同名 service</text>

  <rect x="690" y="190" width="290" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="835" y="214" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">.timer</text>
  <text x="835" y="234" text-anchor="middle" font-size="11" fill="#14532d">定时触发同名 service（cron 的替代）</text>

  <rect x="690" y="276" width="290" height="182" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="706" y="300" font-size="12.5" font-weight="bold" fill="#b45309">⭐ enable 到底做了什么</text>
  <text x="706" y="326" font-size="11.5" fill="#334155">在 /etc/systemd/system/</text>
  <text x="706" y="346" font-size="11.5" fill="#334155">multi-user.target.wants/ 下</text>
  <text x="706" y="366" font-size="11.5" fill="#334155">建一条指向 unit 文件的软链</text>
  <text x="706" y="392" font-size="11.5" fill="#b91c1c">所以 active 与 enabled 是两组正交状态</text>
  <text x="706" y="418" font-size="11.5" fill="#334155">disable 只删这条链，不停当前服务</text>
  <text x="706" y="444" font-size="11.5" fill="#334155">改完 unit 必须 daemon-reload</text>

  <rect x="30" y="470" width="630" height="182" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="496" font-size="12.5" font-weight="bold" fill="#1e40af">[Unit]（我是谁、依赖谁）</text>
  <text x="48" y="518" font-size="11.5" fill="#334155">After=network-online.target　Wants=network-online.target</text>
  <text x="48" y="546" font-size="12.5" font-weight="bold" fill="#1e40af">[Service]（怎么跑）</text>
  <text x="48" y="568" font-size="11.5" fill="#334155">Type=simple　Restart=on-failure　RestartSec=5　MemoryMax=512M</text>
  <text x="48" y="596" font-size="12.5" font-weight="bold" fill="#1e40af">[Install]（什么时候自启）</text>
  <text x="48" y="618" font-size="11.5" fill="#334155">WantedBy=multi-user.target</text>
  <text x="48" y="640" font-size="11.5" fill="#b91c1c">⚠️ ExecStart 必须是前台进程，程序自己 daemon 化了要配 Type=forking</text>

  <rect x="30" y="680" width="950" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="48" y="706" font-size="12.5" font-weight="bold" fill="#0f172a">📎 本图的 unit 指令与命令都是落地写法骨架，未执行</text>
  <text x="48" y="730" font-size="11.5" fill="#334155">容器里 1 号进程不是 systemd：实测 PID 1 = sleep、/run/systemd/system 不存在、systemctl 与 journalctl 均 not found</text>
  <text x="48" y="754" font-size="11.5" fill="#334155">依据与原文：.workbuddy/tmp/round495/w9b_systemd_check.txt</text>
</svg>
