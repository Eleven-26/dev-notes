<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="m12m1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="m12m2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="860" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">邮件的收发链路与各道认证校验点</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">左边是「提交 → 投递 → 落盘 → 取信」四段数据流，右边是每一跳要过的认证与信誉关口</text>

  <rect x="40" y="86" width="340" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">发件人 MUA（客户端）</text>
  <text x="210" y="130" text-anchor="middle" font-size="11.5" fill="#1e40af">Outlook / Thunderbird / 网页邮箱</text>

  <path d="M 210 138 L 210 174" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m12m1)"/>

  <rect x="40" y="176" width="340" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="210" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">提交（submission）587 + AUTH</text>
  <text x="210" y="224" text-anchor="middle" font-size="11.5" fill="#1e40af">STARTTLS → AUTH PLAIN → 235</text>
  <text x="210" y="242" text-anchor="middle" font-size="11.5" fill="#b45309">这一跳必须先认证，否则 454</text>

  <path d="M 210 248 L 210 282" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m12m1)"/>

  <rect x="40" y="286" width="340" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">发信 MTA（Postfix 3.9.14）</text>
  <text x="210" y="334" text-anchor="middle" font-size="11.5" fill="#1e40af">收下先落队列，按退避重投</text>

  <path d="M 210 350 L 210 384" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m12m1)"/>

  <rect x="40" y="388" width="340" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="210" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">DNS 查收件人域的 MX</text>
  <text x="210" y="434" text-anchor="middle" font-size="11.5" fill="#334155">无 MX 回退 A / AAAA；null MX 直接拒</text>

  <path d="M 210 448 L 210 482" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m12m1)"/>

  <rect x="40" y="486" width="340" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="512" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">收信 MTA（对方 Postfix）</text>
  <text x="210" y="534" text-anchor="middle" font-size="11.5" fill="#1e40af">是本地用户 → 交给 MDA；否则拒或转</text>

  <path d="M 210 550 L 210 584" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m12m1)"/>

  <path d="M 150 550 L 150 584" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m12m2)"/>
  <text x="142" y="564" text-anchor="end" font-size="11" fill="#16a34a">LMTP（可选）</text>
  <text x="142" y="582" text-anchor="end" font-size="11" fill="#b45309">未实测</text>

  <rect x="40" y="588" width="340" height="78" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="210" y="614" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">MDA 投递进 Maildir</text>
  <text x="210" y="636" text-anchor="middle" font-size="11.5" fill="#14532d">tmp/ → 改名进 new/ → 读过后进 cur/</text>
  <text x="210" y="656" text-anchor="middle" font-size="11.5" fill="#14532d">日志：status=sent（delivered to maildir）</text>

  <path d="M 210 666 L 210 700" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m12m1)"/>

  <rect x="40" y="704" width="340" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="730" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">收件人 MUA 取信</text>
  <text x="210" y="750" text-anchor="middle" font-size="11.5" fill="#1e40af">IMAP 993（TLS）/ 143（明文）+ POP3</text>

  <path d="M 430 212 L 386 212" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#m12m2)"/>
  <path d="M 430 318 L 386 318" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#m12m2)"/>
  <path d="M 430 518 L 386 518" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#m12m2)"/>
  <path d="M 430 627 L 386 627" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#m12m2)"/>

  <rect x="430" y="176" width="530" height="280" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="448" y="202" font-size="12.5" font-weight="bold" fill="#5b21b6">认证与信誉校验点（发信侧的关口）</text>
  <text x="448" y="228" font-size="11.5" fill="#334155">⭐ 提交口：587 上先 STARTTLS 再 AUTH，认证成功回 235</text>
  <text x="448" y="252" font-size="11.5" fill="#334155">⭐ mynetworks：写宽就等于开放中继；未认证转发回 454</text>
  <text x="448" y="276" font-size="11.5" fill="#334155">SPF：TXT 里声明哪些 IP 有权发我的域（v=spf1 … -all）</text>
  <text x="448" y="300" font-size="11.5" fill="#334155">DKIM：私钥签名，收件方按 selector._domainkey 取公钥验签</text>
  <text x="448" y="324" font-size="11.5" fill="#334155">DMARC：SPF / DKIM 都没过时的策略，p= 三档递进</text>
  <text x="448" y="348" font-size="11.5" fill="#334155">PTR：发信 IP 的反向解析要与 HELO / 发件域对得上</text>
  <text x="448" y="372" font-size="11.5" fill="#334155">RBL：发信 IP 若进了黑名单，连收都不收</text>
  <text x="448" y="396" font-size="11.5" fill="#b45309">⚠️ 校验点大多在公网侧：本机只实测了 235 / 454 / 550</text>
  <text x="448" y="420" font-size="11.5" fill="#334155">本域不存在用户：550（User unknown in local recipient table）</text>
  <text x="448" y="444" font-size="11.5" fill="#334155">对方域无 MX / A：退信 dsn=5.4.4；声明 null MX：dsn=5.1.0</text>

  <rect x="430" y="486" width="530" height="282" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="448" y="512" font-size="12.5" font-weight="bold" fill="#0f172a">会话状态码（本机实测读到）</text>
  <text x="448" y="538" font-size="11.5" fill="#334155">220 服务就绪，也是 STARTTLS 的应答；QUIT 后回 221</text>
  <text x="448" y="562" font-size="11.5" fill="#334155">250 命令成功：EHLO / MAIL FROM / RCPT TO 都回它</text>
  <text x="448" y="586" font-size="11.5" fill="#334155">235 认证成功；354 可以开始发正文（DATA 之后）</text>
  <text x="448" y="610" font-size="11.5" fill="#334155">451 临时失败（稍后重试）；454 临时拒绝（未认证转发）</text>
  <text x="448" y="634" font-size="11.5" fill="#334155">550 永久拒绝（查无此人 / 对方域不收）</text>
  <text x="448" y="658" font-size="11.5" fill="#334155">EHLO 还通告 SIZE 10240000（单封大小上限）与 CHUNKING</text>
  <text x="448" y="682" font-size="11.5" fill="#334155">143 明文端口只通告 STARTTLS；关闭明文认证后登录被拒</text>
  <text x="448" y="706" font-size="11.5" fill="#334155">143 上明文交密码会被 no；993 上同一账号登录成功</text>
  <text x="448" y="730" font-size="11.5" fill="#334155">993 问候语带 CAPABILITY 与 AUTH=PLAIN AUTH=LOGIN</text>
  <text x="448" y="754" font-size="11.5" fill="#334155">IMAP 登录后 LIST 回 INBOX；LOGIN 后 143 仍可 STARTTLS</text>

  <rect x="40" y="784" width="920" height="68" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="58" y="806" font-size="12.5" font-weight="bold" fill="#0f172a">📎 实测环境：容器 w12mail-a（postfix 3.9.14 + dovecot 2.3.21.1，Alpine 3.21.8）+ 探针容器 w12www-c</text>
  <text x="58" y="826" font-size="11.5" fill="#334155">重试路径：dsn=4.3.0 status=deferred（别名库不可用）→ newaliases + postqueue -f → delay=99 status=sent</text>
  <text x="58" y="846" font-size="11.5" fill="#334155">依据与原文：.workbuddy/tmp/round495/w12mail_09_session.txt、w12mail_10_deliver.txt、w12mail_15_deliver2.txt</text>
</svg>
