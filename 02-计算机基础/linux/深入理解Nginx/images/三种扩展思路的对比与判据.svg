<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">三种扩展思路，以及版本号里藏着的那条信息</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">OpenResty 与 Tengine 是「换发行版」，njs 是「官方模块装上就有」—— 三者不是同一条赛道的三档产品</text>

  <!-- 版本号读法 -->
  <rect x="60" y="82" width="880" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="78" y="106" font-size="12.5" font-weight="bold" fill="#0f172a">⭐ 先读版本号：openresty/1.31.1.1</text>
  <text x="78" y="130" font-size="11.5" fill="#334155">＝ 基于 <tspan font-weight="bold" fill="#1e40af">nginx 1.31.1</tspan> 的第 <tspan font-weight="bold" fill="#1e40af">1</tspan> 个补丁。版本号本身就说明了：它<tspan font-weight="bold">不是 nginx 的插件，而是换了核心的发行版</tspan>。</text>

  <!-- 表头 -->
  <rect x="60" y="158" width="880" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="180" font-size="11.5" font-weight="bold" fill="#334155">对比项</text>
  <text x="290" y="180" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">OpenResty</text>
  <text x="560" y="180" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">njs</text>
  <text x="830" y="180" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">Tengine</text>

  <!-- 行 -->
  <rect x="60" y="196" width="880" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="76" y="216" font-size="11" fill="#64748b">扩展方式</text>
  <text x="290" y="216" text-anchor="middle" font-size="11" fill="#334155">加一门语言（Lua）</text>
  <text x="560" y="216" text-anchor="middle" font-size="11" fill="#334155">加一门语言（JS）</text>
  <text x="830" y="216" text-anchor="middle" font-size="11" fill="#334155">加一批功能（C 模块）</text>

  <rect x="60" y="230" width="880" height="30" rx="4" fill="#f0fdf4" stroke="#e2e8f0" stroke-width="1"/>
  <text x="76" y="250" font-size="11" fill="#64748b">网络能力</text>
  <text x="290" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">cosocket：任意协议</text>
  <text x="560" y="250" text-anchor="middle" font-size="11" fill="#b45309">只有 HTTP（fetch）</text>
  <text x="830" y="250" text-anchor="middle" font-size="11" fill="#334155">无，靠现成模块</text>

  <rect x="60" y="264" width="880" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="76" y="284" font-size="11" fill="#64748b">性能</text>
  <text x="290" y="284" text-anchor="middle" font-size="11" fill="#14532d">高（LuaJIT）</text>
  <text x="560" y="284" text-anchor="middle" font-size="11" fill="#334155">中</text>
  <text x="830" y="284" text-anchor="middle" font-size="11" fill="#14532d">高（原生 C）</text>

  <rect x="60" y="298" width="880" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="76" y="318" font-size="11" fill="#64748b">部署形态</text>
  <text x="290" y="318" text-anchor="middle" font-size="11" fill="#334155">换整个发行版</text>
  <text x="560" y="318" text-anchor="middle" font-size="11" fill="#334155">官方模块，装上即用</text>
  <text x="830" y="318" text-anchor="middle" font-size="11" fill="#334155">换发行版</text>

  <rect x="60" y="332" width="880" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="76" y="352" font-size="11" fill="#64748b">生态</text>
  <text x="290" y="352" text-anchor="middle" font-size="11" fill="#14532d">lua-resty-* 协议客户端齐全</text>
  <text x="560" y="352" text-anchor="middle" font-size="11" fill="#b45309">小，无 npm 生态</text>
  <text x="830" y="352" text-anchor="middle" font-size="11" fill="#334155">模块清单固定</text>

  <!-- 判据 -->
  <rect x="60" y="382" width="880" height="132" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="78" y="406" font-size="12.5" font-weight="bold" fill="#1e40af">⭐ 按需求直接对号入座</text>
  <text x="78" y="430" font-size="11.5" fill="#334155">要在网关层做「连 Redis / MySQL / Kafka」这类网络 IO　　→　<tspan font-weight="bold" fill="#1e40af">OpenResty</tspan></text>
  <text x="78" y="454" font-size="11.5" fill="#334155">只做「改头改体 + 调一个 HTTP 接口 + 简单路由」　　　　→　<tspan font-weight="bold" fill="#14532d">njs 更轻</tspan></text>
  <text x="78" y="478" font-size="11.5" fill="#334155">要「国密 / 主动健康检查 / 过载保护 / 合并静态资源」　　→　<tspan font-weight="bold" fill="#b45309">Tengine</tspan></text>
  <text x="78" y="502" font-size="11.5" fill="#334155">只要标准反向代理　　　　　　　　　　　　　　　　　　→　<tspan font-weight="bold" fill="#334155">原版 Nginx（升级最及时）</tspan></text>

  <!-- 结论 -->
  <rect x="60" y="528" width="880" height="42" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="78" y="554" font-size="11.5" fill="#14532d">⭐ 护城河在 cosocket：能在 nginx 里发<tspan font-weight="bold">任意协议</tspan>的非阻塞请求 —— njs 只有 HTTP，Tengine 不提供，得自己写 C 模块。</text>
</svg>
