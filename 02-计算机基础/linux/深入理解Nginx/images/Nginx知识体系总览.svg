<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwN" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 7,3.5 0,7 z" fill="#7c3aed"/></marker>
  </defs>

  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Nginx 知识体系总览：四部分十五篇，从「怎么跑」到「怎么写」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">底层框架参考《深入理解Nginx（第 2 版）》（2016，对应 1.9.x）；现代特性按 1.25.0 起的官方文档独立整理</text>

  <text x="20" y="90" font-size="13" font-weight="bold" fill="#2563eb">一、四部分十五篇</text>

  <rect x="20" y="100" width="232" height="190" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="34" y="126" font-size="13" font-weight="bold" fill="#1e3a8a">① 架构与原理（5 篇）</text>
  <text x="34" y="152" font-size="11.5" fill="#1e3a8a">01-编译安装与配置</text>
  <text x="34" y="174" font-size="11.5" fill="#1e3a8a">02-进程模型与基础架构</text>
  <text x="34" y="196" font-size="11.5" fill="#1e3a8a">03-事件驱动与epoll</text>
  <text x="34" y="218" font-size="11.5" fill="#1e3a8a">04-HTTP框架执行流程</text>
  <text x="34" y="240" font-size="11.5" fill="#1e3a8a">05-内存管理与数据结构</text>
  <text x="34" y="266" font-size="11" fill="#475569">⭐ 回答「Nginx 怎么跑」</text>

  <rect x="260" y="100" width="232" height="190" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="274" y="126" font-size="13" font-weight="bold" fill="#14532d">② 模块开发（5 篇）</text>
  <text x="274" y="152" font-size="11.5" fill="#14532d">06-HTTP模块开发入门</text>
  <text x="274" y="174" font-size="11.5" fill="#14532d">07-配置解析与请求上下文</text>
  <text x="274" y="196" font-size="11.5" fill="#14532d">08-upstream与子请求</text>
  <text x="274" y="218" font-size="11.5" fill="#14532d">09-HTTP过滤模块</text>
  <text x="274" y="240" font-size="11.5" fill="#14532d">10-HTTP变量机制</text>
  <text x="274" y="266" font-size="11" fill="#475569">⭐ 一个项目的五步演进</text>

  <rect x="500" y="100" width="232" height="190" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="514" y="126" font-size="13" font-weight="bold" fill="#78350f">③ 现代特性（2 篇）</text>
  <text x="514" y="152" font-size="11.5" fill="#78350f">11-HTTP3与QUIC支持</text>
  <text x="514" y="174" font-size="11.5" fill="#78350f">13-njs模块与动态脚本</text>
  <text x="514" y="200" font-size="11" fill="#b91c1c">⚠️ 这两篇书中未覆盖</text>
  <text x="514" y="220" font-size="11" fill="#475569">编译门槛：OpenSSL 3.5.1 /</text>
  <text x="514" y="238" font-size="11" fill="#475569">v3 QUIC 模块</text>
  <text x="514" y="266" font-size="11" fill="#475569">⚠️ njs 篇无动态实测</text>

  <rect x="740" y="100" width="232" height="190" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text x="754" y="126" font-size="13" font-weight="bold" fill="#7c2d12">④ 生态与实战（3 篇）</text>
  <text x="754" y="152" font-size="11.5" fill="#7c2d12">14-OpenResty生态</text>
  <text x="754" y="174" font-size="11.5" fill="#7c2d12">15-Tengine生态</text>
  <text x="754" y="196" font-size="11.5" fill="#7c2d12">16-模块开发实战</text>
  <text x="754" y="222" font-size="11" fill="#475569">共享内存 / 降级策略 /</text>
  <text x="754" y="240" font-size="11" fill="#475569">配置校验（限流模块实测）</text>
  <text x="754" y="266" font-size="11" fill="#475569">⭐ 只写生态增量与实测</text>

  <text x="20" y="320" font-size="13" font-weight="bold" fill="#2563eb">二、推荐阅读顺序：先能跑 → 再看怎么跑 → 再写模块 → 最后看生态</text>

  <rect x="20" y="330" width="960" height="190" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="34" y="352" width="164" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="116" y="374" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">①~④ 架构链</text>
  <text x="116" y="392" text-anchor="middle" font-size="10.5" fill="#1e3a8a">能跑 → 怎么组织</text>
  <text x="116" y="408" text-anchor="middle" font-size="10.5" fill="#1e3a8a">→ 并发 → 请求走完</text>

  <path d="M 198 384 L 226 384" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arwN)"/>

  <rect x="226" y="352" width="164" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="308" y="374" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">⑤ 内存管理</text>
  <text x="308" y="392" text-anchor="middle" font-size="10.5" fill="#475569">写模块前的基础设施</text>
  <text x="308" y="408" text-anchor="middle" font-size="10.5" fill="#475569">内存池/slab/buf/chain</text>

  <path d="M 390 384 L 418 384" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arwN)"/>

  <rect x="418" y="352" width="164" height="64" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="374" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">⑥~⑩ 模块开发</text>
  <text x="500" y="392" text-anchor="middle" font-size="10.5" fill="#14532d">从第一个模块</text>
  <text x="500" y="408" text-anchor="middle" font-size="10.5" fill="#14532d">到变量机制</text>

  <path d="M 582 384 L 610 384" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arwN)"/>

  <rect x="610" y="352" width="164" height="64" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="692" y="374" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#78350f">⑪ 现代特性</text>
  <text x="692" y="392" text-anchor="middle" font-size="10.5" fill="#78350f">HTTP/3 · njs</text>
  <text x="692" y="408" text-anchor="middle" font-size="10.5" fill="#78350f">⚠️ 书中未覆盖</text>

  <path d="M 774 384 L 802 384" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arwN)"/>

  <rect x="802" y="352" width="164" height="64" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="884" y="374" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c2d12">⑭⑮⑯ 生态与实战</text>
  <text x="884" y="392" text-anchor="middle" font-size="10.5" fill="#7c2d12">OpenResty / Tengine</text>
  <text x="884" y="408" text-anchor="middle" font-size="10.5" fill="#7c2d12">一个完整模块（限流）</text>

  <text x="34" y="444" font-size="12.5" fill="#334155">· ① 到 ④ 是一条完整链路：能跑起来 → 进程怎么组织 → 并发怎么实现 → 请求怎么走完（前四篇合起来 = 一次请求的完整旅程）</text>
  <text x="34" y="466" font-size="12.5" fill="#334155">· ⑤ 是开发模块前必须先掌握的基础设施；⑥~⑩ 是同一个模块项目的五步演进（入门 → 配置 → upstream → 过滤 → 变量）</text>
  <text x="34" y="488" font-size="12.5" fill="#334155">· ⑨ 是唯一「与书里写法完全不同」的一篇：1.31 的 filter 注册方式已变，照书抄会静默失效</text>
  <text x="34" y="510" font-size="12" fill="#64748b">⭐ 第一次通读只走 ①~④，⑤ 之后再回头补；现代特性与生态两部分的实测口径见第四节</text>
</svg>
