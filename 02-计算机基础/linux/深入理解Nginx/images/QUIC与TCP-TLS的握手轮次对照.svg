<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">要等几个往返才能发数据：TCP+TLS 与 QUIC 的对照</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">每格 = 1 个 RTT；QUIC 的关键动作是把「传输握手」和「加密握手」合并成一次</text>

  <!-- 行1 -->
  <rect x="40" y="92" width="200" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="116" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">TCP + TLS 1.2</text>
  <text x="140" y="136" text-anchor="middle" font-size="10.5" fill="#64748b">最传统的组合</text>

  <rect x="260" y="92" width="199" height="56" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="359" y="125" text-anchor="middle" font-size="11" fill="#475569">TCP 三次握手（1 RTT）</text>
  <rect x="461" y="92" width="399" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="660" y="125" text-anchor="middle" font-size="11" fill="#1e40af">TLS 1.2 握手（2 RTT）</text>
  <text x="874" y="118" font-size="12" font-weight="bold" fill="#b45309">3 RTT</text>

  <!-- 行2 -->
  <rect x="40" y="164" width="200" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">TCP + TLS 1.3</text>
  <text x="140" y="208" text-anchor="middle" font-size="10.5" fill="#64748b">TLS 1.3 把握手压到 1 RTT</text>

  <rect x="260" y="164" width="299" height="56" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="409" y="197" text-anchor="middle" font-size="11" fill="#475569">TCP 三次握手（1 RTT）</text>
  <rect x="561" y="164" width="299" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="710" y="197" text-anchor="middle" font-size="11" fill="#1e40af">TLS 1.3 握手（1 RTT）</text>
  <text x="874" y="190" font-size="12" font-weight="bold" fill="#b45309">2 RTT</text>

  <!-- 行3 -->
  <rect x="40" y="236" width="200" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="260" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">QUIC（首次连接）</text>
  <text x="140" y="280" text-anchor="middle" font-size="10.5" fill="#14532d">跑在 UDP 上，自己实现可靠传输</text>

  <rect x="260" y="236" width="599" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="559" y="269" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">传输握手 + 加密握手合并（1 RTT）</text>
  <text x="874" y="262" font-size="12" font-weight="bold" fill="#14532d">1 RTT</text>

  <!-- 行4 -->
  <rect x="40" y="308" width="200" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">QUIC + 0-RTT</text>
  <text x="140" y="352" text-anchor="middle" font-size="10.5" fill="#14532d">复用上次的会话票据</text>

  <rect x="260" y="308" width="599" height="56" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
  <text x="559" y="341" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">第一个包就带上应用数据</text>
  <text x="874" y="334" font-size="12" font-weight="bold" fill="#14532d">0 RTT</text>

  <!-- 关键提醒 -->
  <rect x="40" y="382" width="920" height="72" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="58" y="406" font-size="12.5" font-weight="bold" fill="#b91c1c">⚠️ 最后一行的 0-RTT 有硬门槛，而且和我们平时说的「支持 HTTP/3」是两件事</text>
  <text x="58" y="428" font-size="11.5" fill="#334155">官方原话：OpenSSL 3.5.1+ 才真正支持 early data；低于该版本会退到兼容层 —— <tspan font-weight="bold">此时无论 ssl_early_data 写不写都不生效</tspan>，</text>
  <text x="58" y="446" font-size="11.5" fill="#334155">且不会有明显报错。所以「能跑 QUIC」和「能用 0-RTT」必须分开验证。</text>

  <!-- 本机实测 -->
  <rect x="40" y="468" width="920" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="492" font-size="12.5" font-weight="bold" fill="#1e40af">⭐ 本机实测的 OpenSSL 版本对照（同一台机器上两个镜像）</text>
  <text x="58" y="514" font-size="11.5" fill="#334155">自建的 nginx-dev:1.31.6 → OpenSSL <tspan font-weight="bold" fill="#b45309">3.3.7</tspan>（低于 3.5.1 门槛，拿不到 0-RTT）；</text>
  <text x="58" y="534" font-size="11.5" fill="#334155">官方 nginx:mainline-alpine → OpenSSL <tspan font-weight="bold" fill="#14532d">3.5.7 / 3.5.8</tspan>（达标，可以开 ssl_early_data）。</text>
</svg>
