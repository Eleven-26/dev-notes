<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">四种负载均衡的实测分布：格子里的 A / B 就是后端选中的顺序</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">实测 nginx:mainline-alpine 1.31.6，两个后端各自返回自己的标识；每行的格子数就是该轮实际请求次数</text>

  <!-- 轮询 -->
  <rect x="60" y="90" width="220" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="76" y="114" font-size="12.5" font-weight="bold" fill="#1e40af">默认（轮询）</text>
  <text x="76" y="134" font-size="10.5" fill="#1e40af">round-robin</text>

  <rect x="300" y="90" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="331" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <rect x="368" y="90" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="399" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <rect x="436" y="90" width="62" height="56" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="467" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">B</text>
  <rect x="504" y="90" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="535" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <rect x="572" y="90" width="62" height="56" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="603" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">B</text>
  <rect x="640" y="90" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="671" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <rect x="708" y="90" width="62" height="56" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="739" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">B</text>
  <rect x="776" y="90" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="807" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <text x="854" y="114" font-size="11" fill="#b45309">8 次：A5 B3</text>
  <text x="854" y="132" font-size="11" fill="#b45309">不是严格交替</text>

  <!-- 加权 -->
  <rect x="60" y="162" width="220" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="76" y="186" font-size="12.5" font-weight="bold" fill="#14532d">weight=3:1</text>
  <text x="76" y="206" font-size="10.5" fill="#14532d">加权轮询</text>

  <rect x="300" y="162" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="331" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <rect x="368" y="162" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="399" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <rect x="436" y="162" width="62" height="56" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="467" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">B</text>
  <rect x="504" y="162" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="535" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <rect x="572" y="162" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="603" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <rect x="640" y="162" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="671" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <rect x="708" y="162" width="62" height="56" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="739" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">B</text>
  <rect x="776" y="162" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="807" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <text x="854" y="186" font-size="11" fill="#14532d">8 次：A6 B2</text>
  <text x="854" y="204" font-size="11" fill="#14532d">= 3:1 ✅</text>

  <!-- ip_hash -->
  <rect x="60" y="234" width="220" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="76" y="258" font-size="12.5" font-weight="bold" fill="#1e40af">ip_hash</text>
  <text x="76" y="278" font-size="10.5" fill="#64748b">按客户端 IP 取模</text>

  <rect x="300" y="234" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="331" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <rect x="368" y="234" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="399" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <rect x="436" y="234" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="467" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <rect x="504" y="234" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="535" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <rect x="572" y="234" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="603" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <rect x="640" y="234" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="671" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <text x="854" y="258" font-size="11" fill="#1e40af">6 次全 A</text>
  <text x="854" y="276" font-size="11" fill="#1e40af">完全固定 ✅</text>

  <!-- least_conn -->
  <rect x="60" y="306" width="220" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="76" y="330" font-size="12.5" font-weight="bold" fill="#14532d">least_conn</text>
  <text x="76" y="350" font-size="10.5" fill="#64748b">选连接数最少的</text>

  <rect x="300" y="306" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="331" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <rect x="368" y="306" width="62" height="56" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="399" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">B</text>
  <rect x="436" y="306" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="467" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <rect x="504" y="306" width="62" height="56" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="535" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">B</text>
  <rect x="572" y="306" width="62" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="603" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">A</text>
  <rect x="640" y="306" width="62" height="56" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="671" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">B</text>
  <text x="854" y="330" font-size="11" fill="#14532d">严格交替 ✅</text>
  <text x="854" y="348" font-size="11" fill="#64748b">空闲量相等</text>

  <!-- 误读提示 -->
  <rect x="60" y="378" width="880" height="76" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="76" y="402" font-size="12.5" font-weight="bold" fill="#b91c1c">⚠️ 一个极易被误读的读数</text>
  <text x="76" y="424" font-size="11.5" fill="#334155">第一行「默认轮询」8 次里 A 出现 5 次而不是 4 次 —— <tspan font-weight="bold">不要据此认为轮询不严格</tspan>：它的实现里带</text>
  <text x="76" y="444" font-size="11.5" fill="#334155">平滑加权的 current_weight，首个请求的起点还取决于 peer 初始化顺序。</text>

  <!-- 结论 -->
  <rect x="60" y="466" width="880" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="76" y="490" font-size="12.5" font-weight="bold" fill="#1e40af">⭐ 判据</text>
  <text x="76" y="512" font-size="11.5" fill="#1e40af">要判定「分布是否均匀」，正确做法是把次数拉大（如 100 次）看比例是否收敛，而不是看前 6 次的顺序 —— 这条对所有「分布类」实测都适用。</text>
</svg>
