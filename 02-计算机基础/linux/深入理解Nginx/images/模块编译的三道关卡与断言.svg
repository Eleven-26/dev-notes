<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="c1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="570" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">模块编译的三道关卡，以及每道关卡上必须做的断言</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">三个坑的共同点：它们都不会报错 —— 都是「看起来成功了，其实没进去」</text>

  <!-- 左侧流程 -->
  <rect x="60" y="88" width="400" height="48" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="76" y="118" font-size="12.5" font-weight="bold" fill="#0f172a">① 写 config（模块清单 + 源文件列表）</text>

  <line x1="160" y1="138" x2="160" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#c1)"/>

  <rect x="60" y="164" width="400" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="76" y="194" font-size="12.5" font-weight="bold" fill="#1e40af">② ./configure --add-module=...</text>

  <line x1="160" y1="214" x2="160" y2="236" stroke="#64748b" stroke-width="2" marker-end="url(#c1)"/>

  <rect x="60" y="240" width="400" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="76" y="270" font-size="12.5" font-weight="bold" fill="#1e40af">③ make（编译各模块的 .o）</text>

  <line x1="160" y1="290" x2="160" y2="312" stroke="#64748b" stroke-width="2" marker-end="url(#c1)"/>

  <rect x="60" y="316" width="400" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="76" y="346" font-size="12.5" font-weight="bold" fill="#1e40af">④ make install → nginx -t</text>

  <line x1="160" y1="366" x2="160" y2="388" stroke="#64748b" stroke-width="2" marker-end="url(#c1)"/>

  <rect x="60" y="392" width="400" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="76" y="422" font-size="12.5" font-weight="bold" fill="#14532d">⑤ 运行：发请求看指令与 filter 是否生效</text>

  <!-- 断言① -->
  <rect x="520" y="106" width="440" height="98" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="536" y="130" font-size="12.5" font-weight="bold" fill="#b91c1c">断言① 在 ② 之后：必须查模块表</text>
  <text x="536" y="152" font-size="11" fill="#334155">grep ngx_http_demo_module objs/ngx_modules.c</text>
  <text x="536" y="172" font-size="11" fill="#334155">⚠️ 打印「+ xxx was configured」只说明 config 被 source 了，</text>
  <text x="536" y="190" font-size="11" fill="#334155">　 不代表进了模块表。根因：ngx_module_link 在 source 之前</text>

  <!-- 断言② -->
  <rect x="520" y="228" width="440" height="98" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="536" y="252" font-size="12.5" font-weight="bold" fill="#b91c1c">断言② 在 ③④ 之间：符号名要对</text>
  <text x="536" y="274" font-size="11" fill="#334155">链接期的 undefined reference 就是在说这件事：</text>
  <text x="536" y="294" font-size="11" fill="#334155">符号 = 源码里「ngx_module_t xxx;」的那个名字。</text>
  <text x="536" y="312" font-size="11" fill="#b45309">⚠️ 误设 ngx_addon_name 会让模块顺序表里出现假符号</text>

  <!-- 断言③ -->
  <rect x="520" y="350" width="440" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="536" y="374" font-size="12.5" font-weight="bold" fill="#b91c1c">断言③ 在 ⑤：filter 必须声明对类型</text>
  <text x="536" y="396" font-size="11" fill="#334155">指令报 unknown directive：模块没进表（回查断言①）。</text>
  <text x="536" y="416" font-size="11" fill="#334155">filter 完全无报错却不生效：类型写错了 —— 必须声明成</text>
  <text x="536" y="434" font-size="11" fill="#334155">HTTP_FILTER，混进 HTTP_MODULES 会让它的 postconfiguration</text>
  <text x="536" y="452" font-size="11" fill="#b45309">早于官方 filter 执行，自己的 next 指向 NULL。</text>

  <!-- 结论 -->
  <rect x="60" y="486" width="900" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="78" y="510" font-size="12.5" font-weight="bold" fill="#1e40af">⭐ 一条通用判据</text>
  <text x="78" y="532" font-size="12" fill="#334155">「构建成功」只证明<tspan font-weight="bold">语法没问题</tspan>，不证明<tspan font-weight="bold">功能进去了</tspan>。凡是从源码注册进来的东西，都要有一条<tspan font-weight="bold">可 grep 的产物断言</tspan>：</text>
  <text x="78" y="550" font-size="12" fill="#334155">模块表里有没有它、生成的 Makefile 里有没有它的 .o、运行时入口有没有打印过日志。没断言 = 靠运气。</text>
</svg>
