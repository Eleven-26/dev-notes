<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="bf1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ngx_buf_t 是「一块数据 + 一组标志」，ngx_chain_t 把它们串起来</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">同一个结构靠标志就能表达内存 / 文件 / 临时文件三种来源 —— 这就是 sendfile 冲突的根源</text>

  <!-- chain -->
  <rect x="60" y="88" width="130" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="125" y="115" text-anchor="middle" font-size="11.5" fill="#1e40af">buf 1</text>
  <line x1="192" y1="110" x2="212" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#bf1)"/>
  <rect x="216" y="88" width="130" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="281" y="115" text-anchor="middle" font-size="11.5" fill="#1e40af">buf 2</text>
  <line x1="348" y1="110" x2="368" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#bf1)"/>
  <rect x="372" y="88" width="130" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="437" y="115" text-anchor="middle" font-size="11.5" fill="#1e40af">buf 3</text>
  <line x1="504" y1="110" x2="524" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#bf1)"/>
  <text x="536" y="115" font-size="11.5" fill="#64748b">NULL（链尾）</text>
  <text x="620" y="115" font-size="11" fill="#334155">⭐ 链不是数组：过滤模块可以往中间插节点</text>

  <!-- buf 数据视图 -->
  <text x="60" y="168" font-size="12.5" font-weight="bold" fill="#0f172a">内存视角：pos 与 last 划出「有效数据」</text>

  <rect x="60" y="182" width="560" height="44" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="220" y="182" width="160" height="44" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="380" y="182" width="240" height="44" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="209" text-anchor="middle" font-size="11" fill="#475569">已消费</text>
  <text x="300" y="209" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">有效数据</text>
  <text x="500" y="209" text-anchor="middle" font-size="11" fill="#64748b">空闲可写</text>

  <line x1="60" y1="176" x2="60" y2="182" stroke="#0f172a" stroke-width="1.5"/>
  <text x="60" y="172" text-anchor="middle" font-size="10" fill="#0f172a">start</text>
  <line x1="220" y1="176" x2="220" y2="182" stroke="#0f172a" stroke-width="1.5"/>
  <text x="220" y="172" text-anchor="middle" font-size="10" fill="#0f172a">pos</text>
  <line x1="380" y1="176" x2="380" y2="182" stroke="#0f172a" stroke-width="1.5"/>
  <text x="380" y="172" text-anchor="middle" font-size="10" fill="#0f172a">last</text>
  <line x1="620" y1="176" x2="620" y2="182" stroke="#0f172a" stroke-width="1.5"/>
  <text x="620" y="172" text-anchor="middle" font-size="10" fill="#0f172a">end</text>

  <text x="60" y="248" font-size="11" fill="#64748b">start / end 是缓冲区边界；pos / last 是当前这一轮要处理的数据范围。发完只动 pos，不动 start。</text>

  <!-- file 视角 -->
  <rect x="672" y="156" width="300" height="112" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="688" y="180" font-size="12.5" font-weight="bold" fill="#b45309">文件视角：in_file 时改用这一对</text>
  <text x="688" y="202" font-size="11" fill="#334155">file_pos / file_last 给出「文件里的哪一段」。</text>
  <text x="688" y="222" font-size="11" fill="#334155">此时内存里没有这份数据 —— 它只是一个</text>
  <text x="688" y="240" font-size="11" fill="#334155">「指向文件的描述」，sendfile 就靠它直达。</text>
  <text x="688" y="260" font-size="11" fill="#64748b">同一个 buf 里，这对字段与 pos/last 并存。</text>

  <!-- 标志表 -->
  <text x="60" y="296" font-size="12.5" font-weight="bold" fill="#0f172a">标志组合决定「这块数据是什么形态」</text>

  <rect x="60" y="308" width="900" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="332" font-size="11.5" font-weight="bold" fill="#1e40af">temporary</text>
  <text x="216" y="332" font-size="11.5" fill="#334155">数据在可写的临时缓冲区里</text>
  <text x="640" y="332" font-size="11.5" fill="#64748b">主动写入 socket 的数据</text>

  <rect x="60" y="352" width="900" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="376" font-size="11.5" font-weight="bold" fill="#1e40af">memory</text>
  <text x="216" y="376" font-size="11.5" fill="#334155">数据在只读内存里（常量字符串）</text>
  <text x="640" y="376" font-size="11.5" fill="#64748b">不需修改的响应片段</text>

  <rect x="60" y="396" width="900" height="38" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="76" y="420" font-size="11.5" font-weight="bold" fill="#b45309">in_file</text>
  <text x="216" y="420" font-size="11.5" fill="#334155">数据在文件里，由 file_pos / file_last 给出范围</text>
  <text x="640" y="420" font-size="11.5" fill="#64748b">sendfile 路径</text>

  <rect x="60" y="440" width="900" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="464" font-size="11.5" font-weight="bold" fill="#1e40af">in_file + temporary</text>
  <text x="216" y="464" font-size="11.5" fill="#334155">在文件里，但允许改写</text>
  <text x="640" y="464" font-size="11.5" fill="#64748b">要改文件内容再发送</text>

  <rect x="60" y="484" width="900" height="38" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="76" y="508" font-size="11.5" font-weight="bold" fill="#14532d">flush / last_buf / last_in_chain</text>
  <text x="300" y="508" font-size="11.5" fill="#334155">控制何时推出去、链什么时候结束</text>
  <text x="700" y="508" font-size="11.5" fill="#64748b">流式响应的边界</text>

  <!-- 结论 -->
  <rect x="60" y="534" width="900" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="78" y="556" font-size="12" fill="#1e40af">⭐ sendfile 与 gzip 不能共存的原因就在这张表里：</text>
  <text x="78" y="580" font-size="12" fill="#1e40af">前者要求数据保持 in_file 形态零拷贝直达 socket，后者必须把它读进用户态加工 —— 两者对缓冲区形态的要求冲突。</text>
</svg>
