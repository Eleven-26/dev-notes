<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">njs 的引擎演进：1.0.0 是分水岭</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">「两个引擎并存」只是过渡期的状态 —— 1.0.0 起自研引擎进入弃用，新能力只做在 QuickJS 上</text>

  <!-- 时间轴 -->
  <line x1="60" y1="186" x2="940" y2="186" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 卡片 1（上） -->
  <rect x="60" y="92" width="140" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="72" y="112" font-size="11.5" font-weight="bold" fill="#0f172a">0.9.1</text>
  <text x="72" y="128" font-size="9.5" fill="#64748b">2025-07-10</text>
  <text x="72" y="148" font-size="10" fill="#334155">QuickJS 与 njs</text>
  <text x="72" y="164" font-size="10" fill="#334155">引擎「功能对等」</text>
  <line x1="130" y1="174" x2="130" y2="184" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="130" cy="186" r="5" fill="#94a3b8"/>

  <!-- 卡片 2（下） -->
  <rect x="215" y="196" width="140" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="285" cy="186" r="5" fill="#94a3b8"/>
  <line x1="285" y1="186" x2="285" y2="196" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="227" y="216" font-size="11.5" font-weight="bold" fill="#0f172a">0.9.5</text>
  <text x="227" y="232" font-size="9.5" fill="#64748b">2026-01-13</text>
  <text x="227" y="252" font-size="10" fill="#334155">QuickJS 原生模块</text>
  <text x="227" y="268" font-size="10" fill="#334155">支持（load_native）</text>

  <!-- 卡片 3（上） -->
  <rect x="370" y="92" width="140" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="382" y="112" font-size="11.5" font-weight="bold" fill="#0f172a">0.9.6</text>
  <text x="382" y="128" font-size="9.5" fill="#64748b">2026-02-04</text>
  <text x="382" y="148" font-size="10" fill="#334155">补齐 ?. ??= ||=</text>
  <text x="382" y="164" font-size="10" fill="#334155">真正接近 ES2023</text>
  <line x1="440" y1="174" x2="440" y2="184" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="440" cy="186" r="5" fill="#94a3b8"/>

  <!-- 卡片 4（下） -->
  <rect x="525" y="196" width="140" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="595" cy="186" r="5" fill="#94a3b8"/>
  <line x1="595" y1="186" x2="595" y2="196" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="537" y="216" font-size="11.5" font-weight="bold" fill="#0f172a">0.9.9</text>
  <text x="537" y="232" font-size="9.5" fill="#64748b">2026-05-19</text>
  <text x="537" y="252" font-size="10" fill="#334155">新增 js_access、</text>
  <text x="537" y="268" font-size="10" fill="#334155">读请求体等 API</text>

  <!-- 卡片 5（上，重点） -->
  <rect x="680" y="80" width="140" height="94" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="692" y="100" font-size="11.5" font-weight="bold" fill="#b91c1c">1.0.0</text>
  <text x="692" y="116" font-size="9.5" fill="#64748b">2026-06-23</text>
  <text x="692" y="136" font-size="10" font-weight="bold" fill="#b91c1c">弃用 njs 引擎、</text>
  <text x="692" y="152" font-size="10" font-weight="bold" fill="#b91c1c">转向 QuickJS</text>
  <text x="692" y="168" font-size="9.5" fill="#64748b">统一两引擎异常类</text>
  <line x1="750" y1="174" x2="750" y2="184" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="750" cy="186" r="6" fill="#dc2626"/>

  <!-- 卡片 6（下） -->
  <rect x="835" y="196" width="125" height="82" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="897" cy="186" r="5" fill="#16a34a"/>
  <line x1="897" y1="186" x2="897" y2="196" stroke="#16a34a" stroke-width="1.5"/>
  <text x="847" y="216" font-size="11.5" font-weight="bold" fill="#14532d">1.0.1</text>
  <text x="847" y="232" font-size="9.5" fill="#64748b">2026-09-02</text>
  <text x="847" y="252" font-size="10" fill="#14532d">当前最新</text>
  <text x="847" y="268" font-size="10" fill="#334155">修 js_access 绕过</text>

  <!-- 三条推论 -->
  <rect x="60" y="308" width="880" height="118" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="78" y="332" font-size="12.5" font-weight="bold" fill="#1e40af">⭐ 三条推论</text>
  <text x="78" y="356" font-size="11.5" fill="#334155">① 「ES2023 兼容」不是 0.9.1 就有的 —— 0.9.1 只是「两引擎对等」，?. 这类语法糖到 <tspan font-weight="bold">0.9.6</tspan> 才齐。</text>
  <text x="78" y="380" font-size="11.5" fill="#334155">② <tspan font-weight="bold">1.0.0 是分水岭</tspan>：之后 njs 引擎进入弃用状态，新能力只做在 QuickJS 上 —— 选版本别停在 0.9.x。</text>
  <text x="78" y="404" font-size="11.5" fill="#334155">③ ⚠️ <tspan font-weight="bold">js_engine</tspan> 这类「切引擎」指令属于过渡期产物：取值与默认值请以当前版本文档为准，本篇不做动态实测，也不给未核实的取值。</text>

  <!-- 结论 -->
  <rect x="60" y="440" width="880" height="98" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="78" y="464" font-size="12.5" font-weight="bold" fill="#b91c1c">⚠️ 本篇为什么没有动态实测</text>
  <text x="78" y="486" font-size="11.5" fill="#334155">① 官方 njs 镜像被本机镜像源白名单拦（docker pull denied）；② njs 源码在 GitHub（本机完全不可达，curl 返回 000）</text>
  <text x="78" y="506" font-size="11.5" fill="#334155">　　与 hg.nginx.org（该链接返回 HTML 而非 tar，实测 1418 字节、file 判定为 HTML），无法自建镜像。</text>
  <text x="78" y="526" font-size="11.5" fill="#64748b">⭐ 所以本篇只采用官方文档与 Changes 的表述，不给出未经核实的默认值、不含编造读数。</text>
</svg>
