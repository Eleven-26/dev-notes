<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="n1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">master-worker 进程模型：一个管事的，一群干活的</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">实测 nginx 1.31.6 / worker_processes 4；下面括号里的数值都是容器内量到的</text>

  <!-- master -->
  <rect x="250" y="92" width="280" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="390" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">master process</text>
  <text x="390" y="140" text-anchor="middle" font-size="11" fill="#1e40af">不处理请求、不做 I/O，只响应信号与管理子进程</text>

  <!-- 分支线 -->
  <path d="M 390 162 V 190 H 152 V 214" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#n1)"/>
  <path d="M 390 162 V 214" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#n1)"/>
  <path d="M 390 162 V 190 H 700 V 214" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#n1)"/>

  <!-- worker 组 -->
  <rect x="40" y="218" width="86" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="83" y="242" text-anchor="middle" font-size="11" fill="#14532d">worker 1</text>
  <text x="83" y="262" text-anchor="middle" font-size="10" fill="#64748b">3.7 MB</text>

  <rect x="134" y="218" width="86" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="177" y="242" text-anchor="middle" font-size="11" fill="#14532d">worker 2</text>
  <text x="177" y="262" text-anchor="middle" font-size="10" fill="#64748b">3.7 MB</text>

  <rect x="228" y="218" width="86" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="271" y="242" text-anchor="middle" font-size="11" fill="#14532d">worker 3</text>
  <text x="271" y="262" text-anchor="middle" font-size="10" fill="#64748b">3.7 MB</text>

  <rect x="322" y="218" width="86" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="365" y="242" text-anchor="middle" font-size="11" fill="#14532d">worker 4</text>
  <text x="365" y="262" text-anchor="middle" font-size="10" fill="#64748b">3.7 MB</text>

  <!-- cache manager -->
  <rect x="460" y="218" width="180" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="550" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">cache manager</text>
  <text x="550" y="262" text-anchor="middle" font-size="10" fill="#64748b">常驻 · 3.5 MB</text>

  <!-- cache loader -->
  <rect x="690" y="218" width="220" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="800" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">cache loader</text>
  <text x="800" y="262" text-anchor="middle" font-size="10" fill="#64748b">只在启动/重载时出现一次</text>

  <!-- 说明 -->
  <text x="40" y="304" font-size="11.5" font-weight="bold" fill="#14532d">干活的</text>
  <text x="40" y="324" font-size="11" fill="#334155">每个 worker 各自持有独立的 listen socket，</text>
  <text x="40" y="341" font-size="11" fill="#334155">内核唤醒其中一个去 accept（惊群问题，</text>
  <text x="40" y="358" font-size="11" fill="#334155">1.31 用 EPOLLEXCLUSIVE / reuseport 化解）。</text>
  <text x="40" y="380" font-size="11" fill="#64748b">单 worker 是单线程事件循环。</text>

  <text x="460" y="304" font-size="11.5" font-weight="bold" fill="#b45309">管缓存的</text>
  <text x="460" y="324" font-size="11" fill="#334155">manager 长期存在，负责按配置清理过期缓存；</text>
  <text x="460" y="341" font-size="11" fill="#334155">loader 只在启动时跑一次，把磁盘上的缓存索引</text>
  <text x="460" y="358" font-size="11" fill="#334155">读进共享内存，做完就退出。</text>
  <text x="460" y="380" font-size="11" fill="#b45309">⚠️ 别把 loader 消失当异常。</text>

  <!-- 实测数据条 -->
  <rect x="40" y="404" width="920" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="58" y="428" font-size="12.5" font-weight="bold" fill="#0f172a">⭐ 容量估算可以直接用这三个数</text>
  <text x="58" y="450" font-size="12" fill="#334155">master 约 7.2 MB · 每个 worker 空闲约 3.7 MB · cache manager 约 3.5 MB。比「Nginx 很省内存」这类说法可靠得多。</text>

  <!-- 结论 -->
  <rect x="40" y="486" width="920" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="510" font-size="12.5" font-weight="bold" fill="#1e40af">⭐ 三条容易记错的</text>
  <text x="58" y="532" font-size="12" fill="#334155">① master 不处理请求 —— 压测时它 CPU 高，通常是信号或子进程管理带来的，不是业务量大；</text>
  <text x="58" y="552" font-size="12" fill="#334155">② worker 之间的 PPID 全是 master，没有中间层；③ 选 worker 数看 CPU 核数，不是「越多越好」。</text>
</svg>
