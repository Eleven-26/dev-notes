<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="408" viewBox="0 0 1000 408" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="1000" height="408" fill="#ffffff"/>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#0f172a">三种「并行」不在一个层次上</text>
  <text x="40" y="58" font-size="12" fill="#64748b">同一时刻能跑几条指令流、抢不抢同一套执行单元，是区分它们的唯一判据</text>

  <!-- ============ 面板 1：时间片 ============ -->
  <rect x="40" y="76" width="290" height="252" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="185" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">时间片</text>
  <text x="185" y="124" text-anchor="middle" font-size="11" fill="#64748b">同一核上轮流</text>

  <text x="60" y="152" font-size="11" fill="#94a3b8">核 0</text>
  <!-- 时间轴：6 段 -->
  <rect x="60" y="160" width="42" height="34" fill="#0f766e"/>
  <text x="81" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">A</text>
  <rect x="102" y="160" width="42" height="34" fill="#f59e0b"/>
  <text x="123" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">B</text>
  <rect x="144" y="160" width="42" height="34" fill="#0f766e"/>
  <text x="165" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">A</text>
  <rect x="186" y="160" width="42" height="34" fill="#f59e0b"/>
  <text x="207" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">B</text>
  <rect x="228" y="160" width="42" height="34" fill="#0f766e"/>
  <text x="249" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">A</text>
  <rect x="270" y="160" width="42" height="34" fill="#f59e0b"/>
  <text x="291" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">B</text>
  <!-- 时间箭头 -->
  <line x1="60" y1="208" x2="312" y2="208" stroke="#cbd5e1"/>
  <path d="M 312 208 l -6 -3 l 0 6 z" fill="#cbd5e1"/>
  <text x="76" y="224" font-size="10" fill="#94a3b8">每格 2.1 ms</text>

  <text x="185" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">同一时刻：1 条</text>
  <text x="185" y="274" text-anchor="middle" font-size="11" fill="#64748b">执行单元独占</text>
  <text x="185" y="296" text-anchor="middle" font-size="11" fill="#0f766e">切换代价 9.4 µs</text>
  <text x="185" y="316" text-anchor="middle" font-size="10" fill="#94a3b8">OS 看到 1 个逻辑 CPU</text>

  <!-- ============ 面板 2：超线程 ============ -->
  <rect x="355" y="76" width="290" height="252" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="500" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">超线程 SMT</text>
  <text x="500" y="124" text-anchor="middle" font-size="11" fill="#64748b">一个物理核，两套前端</text>

  <rect x="378" y="138" width="110" height="30" rx="4" fill="#0f766e"/>
  <text x="433" y="158" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">指令流 A</text>
  <rect x="512" y="138" width="110" height="30" rx="4" fill="#f59e0b"/>
  <text x="567" y="158" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">指令流 B</text>

  <rect x="392" y="182" width="216" height="28" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="500" y="201" text-anchor="middle" font-size="10" fill="#475569">前端 ×2 + 寄存器状态 ×2</text>

  <rect x="392" y="222" width="216" height="34" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="500" y="243" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">4 个 ALU 端口（共享）</text>

  <text x="500" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">同一时刻：2 条</text>
  <text x="500" y="298" text-anchor="middle" font-size="11" fill="#b45309">执行单元争用</text>
  <text x="500" y="318" text-anchor="middle" font-size="10" fill="#94a3b8">OS 看到 2 个逻辑 CPU</text>

  <!-- ============ 面板 3：多核 ============ -->
  <rect x="670" y="76" width="290" height="252" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="815" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">多核</text>
  <text x="815" y="124" text-anchor="middle" font-size="11" fill="#64748b">两个独立的物理核</text>

  <!-- 核 1 -->
  <rect x="692" y="138" width="120" height="112" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="752" y="156" text-anchor="middle" font-size="10" fill="#1e40af">核 0</text>
  <rect x="704" y="164" width="96" height="20" rx="3" fill="#bfdbfe"/>
  <text x="752" y="178" text-anchor="middle" font-size="9" fill="#1e3a8a">前端</text>
  <rect x="704" y="190" width="44" height="20" rx="3" fill="#1d4ed8"/>
  <text x="726" y="204" text-anchor="middle" font-size="9" fill="#ffffff">ALU</text>
  <rect x="756" y="190" width="44" height="20" rx="3" fill="#1d4ed8"/>
  <text x="778" y="204" text-anchor="middle" font-size="9" fill="#ffffff">ALU</text>
  <rect x="704" y="216" width="44" height="20" rx="3" fill="#1d4ed8"/>
  <text x="726" y="230" text-anchor="middle" font-size="9" fill="#ffffff">ALU</text>
  <rect x="756" y="216" width="44" height="20" rx="3" fill="#1d4ed8"/>
  <text x="778" y="230" text-anchor="middle" font-size="9" fill="#ffffff">ALU</text>

  <!-- 核 2 -->
  <rect x="818" y="138" width="120" height="112" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="878" y="156" text-anchor="middle" font-size="10" fill="#1e40af">核 1</text>
  <rect x="830" y="164" width="96" height="20" rx="3" fill="#bfdbfe"/>
  <text x="878" y="178" text-anchor="middle" font-size="9" fill="#1e3a8a">前端</text>
  <rect x="830" y="190" width="44" height="20" rx="3" fill="#1d4ed8"/>
  <text x="852" y="204" text-anchor="middle" font-size="9" fill="#ffffff">ALU</text>
  <rect x="882" y="190" width="44" height="20" rx="3" fill="#1d4ed8"/>
  <text x="904" y="204" text-anchor="middle" font-size="9" fill="#ffffff">ALU</text>
  <rect x="830" y="216" width="44" height="20" rx="3" fill="#1d4ed8"/>
  <text x="852" y="230" text-anchor="middle" font-size="9" fill="#ffffff">ALU</text>
  <rect x="882" y="216" width="44" height="20" rx="3" fill="#1d4ed8"/>
  <text x="904" y="230" text-anchor="middle" font-size="9" fill="#ffffff">ALU</text>

  <text x="815" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">同一时刻：2 条</text>
  <text x="815" y="298" text-anchor="middle" font-size="11" fill="#1d4ed8">互不干扰</text>
  <text x="815" y="318" text-anchor="middle" font-size="10" fill="#94a3b8">OS 看到 2 个物理核</text>

  <rect x="60" y="344" width="880" height="46" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="76" y="364" font-size="12" fill="#92400e">判据只有两个字：<tspan font-weight="700">抢</tspan>还是<tspan font-weight="700">不抢</tspan>。时间片是串行的（永远在等），超线程是抢执行单元的，多核才各干各的。</text>
  <text x="76" y="382" font-size="11" fill="#a16207">本机 4 逻辑核由 2 物理核 × 2 超线程报出，但实测绑「兄弟」与绑「异核」的 IPC 都是 2.9 —— 这套拓扑在 WSL2 下不可信。</text>
</svg>
