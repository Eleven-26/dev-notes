<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="432" viewBox="0 0 1000 432" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="1000" height="432" fill="#ffffff"/>

  <text x="40" y="38" font-size="19" font-weight="700" fill="#0f172a">线程数翻倍，每个线程拿到的 CPU 占比大致减半</text>
  <text x="40" y="61" font-size="12" fill="#64748b">忙碌线程各跑 2 秒，读 se.sum_exec_runtime 增量；本机 4 逻辑核，但实测有效算力约 2 核</text>

  <rect x="40" y="80" width="920" height="266" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- 纵轴刻度 -->
  <line x1="120" y1="300" x2="900" y2="300" stroke="#cbd5e1"/>
  <line x1="120" y1="300" x2="120" y2="105" stroke="#cbd5e1"/>
  <text x="108" y="304" text-anchor="end" font-size="11" fill="#94a3b8">0</text>
  <text x="108" y="259" text-anchor="end" font-size="11" fill="#94a3b8">25%</text>
  <text x="108" y="214" text-anchor="end" font-size="11" fill="#94a3b8">50%</text>
  <text x="108" y="169" text-anchor="end" font-size="11" fill="#94a3b8">75%</text>
  <text x="108" y="124" text-anchor="end" font-size="11" fill="#94a3b8">100%</text>
  <line x1="120" y1="255" x2="900" y2="255" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="120" y1="210" x2="900" y2="210" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="120" y1="165" x2="900" y2="165" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="120" y1="120" x2="900" y2="120" stroke="#e2e8f0" stroke-dasharray="3 3"/>

  <!-- 组 1：4 线程 -->
  <!-- 理论 100% = y120；实测 53.1% -> 300 - 53.1*1.8 = 204.4 -->
  <rect x="190" y="120" width="66" height="180" rx="4" fill="#e2e8f0"/>
  <text x="223" y="112" text-anchor="middle" font-size="11" fill="#94a3b8">100%</text>
  <rect x="270" y="204" width="66" height="96" rx="4" fill="#0f766e"/>
  <text x="303" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">53.1%</text>
  <text x="263" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">4 线程</text>
  <text x="263" y="340" text-anchor="middle" font-size="11" fill="#94a3b8">= 逻辑核数</text>

  <!-- 组 2：8 线程 -->
  <!-- 理论 50% = y210；实测 30.5% -> 300 - 30.5*1.8 = 245.1 -->
  <rect x="455" y="210" width="66" height="90" rx="4" fill="#e2e8f0"/>
  <text x="488" y="202" text-anchor="middle" font-size="11" fill="#94a3b8">50%</text>
  <rect x="535" y="245" width="66" height="55" rx="4" fill="#0f766e"/>
  <text x="568" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">30.5%</text>
  <text x="528" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">8 线程</text>
  <text x="528" y="340" text-anchor="middle" font-size="11" fill="#94a3b8">2 倍超订</text>

  <!-- 组 3：16 线程 -->
  <!-- 理论 25% = y255；实测 17.9% -> 300 - 17.9*1.8 = 267.8 -->
  <rect x="720" y="255" width="66" height="45" rx="4" fill="#e2e8f0"/>
  <text x="753" y="247" text-anchor="middle" font-size="11" fill="#94a3b8">25%</text>
  <rect x="800" y="268" width="66" height="32" rx="4" fill="#0f766e"/>
  <text x="833" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">17.9%</text>
  <text x="793" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">16 线程</text>
  <text x="793" y="340" text-anchor="middle" font-size="11" fill="#94a3b8">4 倍超订</text>

  <!-- 8 -> 16 的减半箭头 -->
  <path d="M 610 258 Q 700 258 720 276" stroke="#b45309" stroke-width="1.6" fill="none" stroke-dasharray="4 3"/>
  <text x="660" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">差 1.70 倍</text>

  <!-- 图例 -->
  <rect x="620" y="96" width="12" height="12" rx="2" fill="#e2e8f0"/>
  <text x="640" y="106" font-size="11" fill="#64748b">理论值（核数 ÷ 线程数）</text>
  <rect x="790" y="96" width="12" height="12" rx="2" fill="#0f766e"/>
  <text x="810" y="106" font-size="11" fill="#64748b">实测均值</text>

  <rect x="60" y="352" width="880" height="56" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="76" y="374" font-size="13" fill="#92400e">8 线程 30.5% → 16 线程 17.9%，比例 1.70 ≈ 2：核没变多、活多一倍，每份活分到的时间就少一半。</text>
  <text x="76" y="394" font-size="12" fill="#a16207">4 线程档实测只有 53% 而不是 100%，说明宿主与其它容器占着约一半算力 —— 本机有效算力约 2 核。</text>
</svg>
