<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="c1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">同样是「搬一块内存」，DMA 与 CPU 拷贝差在哪</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">「零拷贝」这个词真正指的是「不让 CPU 参与搬运」，不是「没有数据移动」</text>

  <rect x="30" y="78" width="440" height="160" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="44" y="100" font-size="12" font-weight="bold" fill="#1e40af">DMA 拷贝：设备与内存直连</text>

  <rect x="50" y="112" width="130" height="44" rx="6" fill="#ffffff" stroke="#0284c7"/>
  <text x="115" y="139" text-anchor="middle" font-size="10.5" fill="#075985">网卡 / 磁盘</text>
  <rect x="290" y="112" width="160" height="44" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="370" y="139" text-anchor="middle" font-size="10.5" fill="#1e3a8a">DDR 缓冲</text>
  <line x1="180" y1="134" x2="286" y2="134" stroke="#475569" stroke-width="1.5" marker-end="url(#c1)"/>
  <text x="233" y="124" text-anchor="middle" font-size="9.5" fill="#64748b">不经过 CPU</text>

  <text x="44" y="178" font-size="10.5" fill="#334155">CPU 只写下描述符，然后就去干别的</text>
  <text x="44" y="200" font-size="10.5" fill="#334155">数据不进 CPU 寄存器，也不占 Cache</text>
  <text x="44" y="224" font-size="10.5" fill="#334155">适合大块、搬完就不用再看的场景</text>

  <rect x="510" y="78" width="460" height="160" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="524" y="100" font-size="12" font-weight="bold" fill="#b45309">CPU 拷贝：A → Cache → 寄存器 → B</text>

  <rect x="522" y="112" width="100" height="34" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="572" y="134" text-anchor="middle" font-size="10" fill="#78350f">内存 A</text>
  <rect x="634" y="112" width="100" height="34" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="684" y="134" text-anchor="middle" font-size="10" fill="#78350f">L1/L2 Cache</text>
  <rect x="746" y="112" width="100" height="34" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="796" y="134" text-anchor="middle" font-size="10" fill="#78350f">寄存器</text>
  <rect x="858" y="112" width="100" height="34" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="908" y="134" text-anchor="middle" font-size="10" fill="#78350f">内存 B</text>

  <line x1="626" y1="129" x2="630" y2="129" stroke="#475569" stroke-width="1.4" marker-end="url(#c1)"/>
  <line x1="738" y1="129" x2="742" y2="129" stroke="#475569" stroke-width="1.4" marker-end="url(#c1)"/>
  <line x1="850" y1="129" x2="854" y2="129" stroke="#475569" stroke-width="1.4" marker-end="url(#c1)"/>

  <text x="524" y="178" font-size="10.5" fill="#334155">每个字节都要 load 一次、再 store 一次</text>
  <text x="524" y="200" font-size="10.5" fill="#334155">Cache 带宽是上限；大块拷贝还会把别人的热数据挤出去</text>
  <text x="524" y="224" font-size="10.5" fill="#334155">也正因为过 Cache，它和 DMA 的成本不是一个量级</text>

  <rect x="30" y="252" width="940" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="276" font-size="12.5" font-weight="bold" fill="#0f172a">四处差别，只有最后一处是「性能」</text>
  <text x="44" y="302" font-size="11" fill="#334155">· 谁发起：DMA 由设备的 DMA 引擎发起；CPU 拷贝由 CPU 一条条 load / store</text>
  <text x="44" y="328" font-size="11" fill="#334155">· 过不过 Cache：DMA 直接写内存；x86 由硬件维护一致性，部分 ARM 平台要软件 invalidate</text>
  <text x="44" y="354" font-size="11" fill="#334155">· 占不占 CPU：DMA 期间这个核可以跑别的进程；CPU 拷贝期间核被占住，%sy 会涨</text>
  <text x="44" y="380" font-size="11" fill="#334155">· 块越大差越多：几 KB 时描述符开销占比高，DMA 的优势要 MB 级才明显</text>
  <text x="44" y="406" font-size="11" fill="#b45309">所以「谁更快」不是绝对的 —— 小拷贝走 DMA 反而更慢，这也是 sendfile 对小文件收益有限的原因</text>
</svg>
