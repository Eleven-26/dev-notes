<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="508" viewBox="0 0 1000 508" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="1000" height="508" fill="#ffffff"/>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#0f172a">同一个 read，SA_RESTART 决定它在 1000 ms 还是 1200 ms 返回</text>
  <text x="40" y="58" font-size="12" fill="#64748b">空管道上 read，1 s 时 SIGALRM 触发，1.2 s 时另一进程写入 1 字节</text>

  <!-- 第一行：不设 SA_RESTART -->
  <text x="40" y="106" font-size="13" font-weight="700" fill="#b45309">不设 SA_RESTART</text>

  <rect x="567" y="92" width="180" height="24" rx="4" fill="#fffbeb" stroke="#fde68a"/>
  <text x="657" y="108" font-size="10" fill="#92400e" text-anchor="middle">SIGALRM → handler</text>
  <line x1="657" y1="118" x2="657" y2="186" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 3"/>

  <rect x="140" y="130" width="517" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="398" y="152" font-size="11" fill="#92400e" text-anchor="middle">read 阻塞等待 0 → 1000 ms</text>

  <line x1="140" y1="190" x2="760" y2="190" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="140" y1="184" x2="140" y2="196" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="657" y1="184" x2="657" y2="196" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="657" cy="190" r="5" fill="#b45309"/>
  <text x="140" y="212" font-size="10" fill="#64748b" text-anchor="middle">0</text>
  <text x="657" y="212" font-size="10" fill="#b45309" text-anchor="middle">1000 ms 被信号打断</text>

  <rect x="790" y="112" width="170" height="76" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="875" y="136" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">read = -1</text>
  <text x="875" y="156" font-size="11" fill="#92400e" text-anchor="middle">errno = 4</text>
  <text x="875" y="176" font-size="11" fill="#92400e" text-anchor="middle">用时 1000.1 ms</text>

  <!-- 第二行：设 SA_RESTART -->
  <text x="40" y="296" font-size="13" font-weight="700" fill="#0f766e">设 SA_RESTART</text>

  <rect x="567" y="282" width="180" height="24" rx="4" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="657" y="298" font-size="10" fill="#0f766e" text-anchor="middle">SIGALRM → handler</text>
  <line x1="657" y1="308" x2="657" y2="376" stroke="#0f766e" stroke-width="1" stroke-dasharray="4 3"/>

  <rect x="140" y="320" width="517" height="34" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="398" y="342" font-size="11" fill="#0f766e" text-anchor="middle">read 阻塞等待 0 → 1000 ms</text>

  <rect x="657" y="320" width="103" height="34" rx="6" fill="#d1fae5" stroke="#0f766e"/>
  <text x="708" y="342" font-size="10" fill="#0f766e" text-anchor="middle">重启后继续等</text>

  <line x1="140" y1="380" x2="760" y2="380" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="140" y1="374" x2="140" y2="386" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="657" y1="374" x2="657" y2="386" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="760" y1="374" x2="760" y2="386" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="760" cy="380" r="5" fill="#0f766e"/>
  <text x="140" y="402" font-size="10" fill="#64748b" text-anchor="middle">0</text>
  <text x="657" y="402" font-size="10" fill="#0f766e" text-anchor="middle">1000 ms</text>
  <text x="760" y="402" font-size="10" fill="#0f766e" text-anchor="middle">1200 ms 数据到达</text>

  <rect x="790" y="296" width="170" height="96" rx="6" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="875" y="320" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">read = 1</text>
  <text x="875" y="340" font-size="11" fill="#0f766e" text-anchor="middle">读到那 1 字节</text>
  <text x="875" y="360" font-size="11" fill="#0f766e" text-anchor="middle">用时 1200.4 ms</text>
  <text x="875" y="378" font-size="10" fill="#64748b" text-anchor="middle">多出的 200 ms 在重启后</text>

  <!-- 说明面板 -->
  <rect x="40" y="424" width="920" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="62" y="450" font-size="12" fill="#334155">只差一个标志位：1000.1 ms 失败返回 EINTR，或者 1200.4 ms 拿到数据 —— 内核替你回头的区别。</text>
  <text x="62" y="474" font-size="12" fill="#334155">select / poll / epoll_wait / nanosleep 即使设了 SA_RESTART 也会返回 EINTR，重试循环不能省。</text>
</svg>
