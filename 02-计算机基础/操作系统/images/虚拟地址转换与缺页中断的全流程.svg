<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="g1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="g2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="g3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/>
    </marker>
    <marker id="g4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一次虚拟地址访问，内核到底走了多少步</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">日常只走左侧的 ①→②；TLB miss 才展开到页表；PTE 无效才升级成缺页中断</text>

  <!-- ① -->
  <rect x="60" y="84" width="440" height="46" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="78" y="112" font-size="13" fill="#0f172a">① 进程访问虚拟地址 VA（如 0x7f2a1c004000）</text>

  <line x1="180" y1="132" x2="180" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#g1)"/>
  <text x="194" y="150" font-size="11" fill="#64748b">地址送进 MMU</text>

  <!-- ② -->
  <rect x="60" y="162" width="440" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="78" y="182" font-size="13" font-weight="bold" fill="#1e40af">② MMU 先查 TLB（页表的高速缓存）</text>
  <text x="78" y="200" font-size="11" fill="#1e40af">绝大多数地址转换到这里就结束了，不碰页表</text>

  <line x1="180" y1="214" x2="180" y2="240" stroke="#b45309" stroke-width="2" marker-end="url(#g3)"/>
  <text x="194" y="232" font-size="11" fill="#b45309">TLB miss，只能真去查页表</text>

  <!-- ③ -->
  <rect x="60" y="244" width="440" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="78" y="266" font-size="13" font-weight="bold" fill="#0f172a">③ 逐级走页表找 PTE</text>
  <text x="78" y="286" font-size="11" fill="#334155">PGD → P4D → PUD → PMD → PTE（x86-64 为 4~5 级）</text>

  <line x1="180" y1="302" x2="180" y2="328" stroke="#64748b" stroke-width="2" marker-end="url(#g1)"/>
  <text x="194" y="320" font-size="11" fill="#64748b">拿到 PTE，看它有没有效</text>

  <!-- ④ -->
  <rect x="60" y="332" width="440" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="78" y="354" font-size="13" font-weight="bold" fill="#0f172a">④ 这个 PTE 有效吗</text>
  <text x="78" y="372" font-size="11" fill="#334155">有效 = 页已在物理内存，且映射已经建立好了</text>

  <line x1="180" y1="386" x2="180" y2="412" stroke="#b45309" stroke-width="2" marker-end="url(#g3)"/>
  <text x="194" y="404" font-size="11" fill="#b45309">无效：这个 VA 现在还没有落脚点</text>

  <!-- ⑤ -->
  <rect x="60" y="416" width="440" height="46" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="78" y="444" font-size="13" font-weight="bold" fill="#b45309">⑤ 触发缺页中断（Page Fault），进程被挂起</text>

  <line x1="180" y1="464" x2="180" y2="486" stroke="#64748b" stroke-width="2" marker-end="url(#g1)"/>
  <text x="194" y="480" font-size="11" fill="#64748b">内核来处理：分两种缺页</text>

  <!-- ⑥ 两支 -->
  <rect x="60" y="490" width="212" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="74" y="510" font-size="12.5" font-weight="bold" fill="#14532d">minor（次缺页）</text>
  <text x="74" y="528" font-size="10.5" fill="#14532d">页已在物理内存，只差建映射</text>
  <text x="74" y="544" font-size="10.5" fill="#14532d">首次写 malloc 内存、fork 后 COW</text>
  <text x="74" y="556" font-size="10.5" font-weight="bold" fill="#14532d">不读盘 · 微秒级</text>

  <rect x="288" y="490" width="212" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="302" y="510" font-size="12.5" font-weight="bold" fill="#b45309">major（主缺页）</text>
  <text x="302" y="528" font-size="10.5" fill="#b45309">页不在内存，须从磁盘 / swap 读入</text>
  <text x="302" y="544" font-size="10.5" fill="#b45309">首次 mmap 读大文件、页被换出后访问</text>
  <text x="302" y="556" font-size="10.5" font-weight="bold" fill="#b45309">读盘 · 毫秒级</text>

  <!-- 右侧旁注 -->
  <rect x="560" y="162" width="410" height="86" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="576" y="186" font-size="12.5" font-weight="bold" fill="#14532d">② 的命中支路 = 快路径</text>
  <text x="576" y="206" font-size="11.5" fill="#334155">TLB 命中时，地址转换在流水线里就完成了，</text>
  <text x="576" y="222" font-size="11.5" fill="#334155">没有额外访存。这就是 TLB 存在的全部意义 ——</text>
  <text x="576" y="238" font-size="11.5" fill="#334155">把「4~5 次访存」压到接近零。</text>

  <rect x="560" y="262" width="410" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="576" y="286" font-size="12.5" font-weight="bold" fill="#0f172a">③ 为什么这一步最贵</text>
  <text x="576" y="306" font-size="11.5" fill="#334155">4~5 级页表 ＝ 一次转换最多 4~5 次访存，</text>
  <text x="576" y="322" font-size="11.5" fill="#334155">而每次访存自己还要查 TLB。大页 HugePage</text>
  <text x="576" y="338" font-size="11.5" fill="#334155">（2MB / 1GB）的价值就在这里：层级更浅、条目更少。</text>

  <rect x="560" y="362" width="410" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="576" y="386" font-size="12.5" font-weight="bold" fill="#1e40af">④ 的有效支路</text>
  <text x="576" y="406" font-size="11.5" fill="#334155">把这次的映射填进 TLB 再重试一次；下一次访问</text>
  <text x="576" y="422" font-size="11.5" fill="#334155">同一页就走快路径了。缺页处理后同样要回到</text>
  <text x="576" y="438" font-size="11.5" fill="#334155">这一步，所以「抖动」表现为反复重建映射。</text>

  <rect x="560" y="462" width="410" height="98" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="576" y="486" font-size="12.5" font-weight="bold" fill="#b91c1c">⚠️ TLB miss 是进程切换的隐性成本</text>
  <text x="576" y="506" font-size="11.5" fill="#334155">切进程要换页表基址 CR3，整个 TLB 大面积失效，</text>
  <text x="576" y="522" font-size="11.5" fill="#334155">新进程前几百次访存全是 miss。所以「多进程 vs</text>
  <text x="576" y="538" font-size="11.5" fill="#334155">多线程」的开销差别，一部分并不在寄存器保存，</text>
  <text x="576" y="554" font-size="11.5" fill="#334155">而在页表与 TLB 的这块重建成本上。</text>

  <!-- 底部结论 -->
  <rect x="60" y="578" width="910" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="78" y="602" font-size="12.5" font-weight="bold" fill="#0f172a">⭐ 把「缺页」与「分配」分开看</text>
  <text x="78" y="622" font-size="12" fill="#334155">malloc / mmap 只拿到「虚拟地址的预约」，返回时通常一次物理内存都没分配 —— 真正的分配发生在 ⑤ 第一次写它的时候。</text>
  <text x="78" y="640" font-size="12" fill="#334155">所以「分配了但没写」的进程 RSS 很小；而 major fault 的毫秒级读盘，正是「首次访问大文件会卡一下」的来源。</text>
</svg>
