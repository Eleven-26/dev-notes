<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="na1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="na2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="510" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">NUMA：多路服务器上，内存不是「一块」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">每个 CPU 插槽挂一段直连内存：访问本地最快，跨节点要过 interconnect，延迟高 1.5~2 倍</text>

  <!-- Node 0 -->
  <rect x="50" y="92" width="380" height="210" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="70" y="118" font-size="14" font-weight="bold" fill="#1e40af">Node 0（插槽 0）</text>

  <rect x="72" y="134" width="160" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="88" y="160" font-size="13" font-weight="bold" fill="#1e40af">CPU 0</text>
  <text x="88" y="180" font-size="10.5" fill="#1e40af">核心 + 私有 cache</text>

  <rect x="252" y="134" width="160" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="268" y="160" font-size="13" font-weight="bold" fill="#14532d">本地内存</text>
  <text x="268" y="180" font-size="10.5" fill="#14532d">DRAM（直连 Node 0）</text>

  <line x1="234" y1="163" x2="250" y2="163" stroke="#16a34a" stroke-width="2" marker-end="url(#na1)"/>
  <text x="240" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">本地访问 ≈ 100ns</text>
  <text x="240" y="246" text-anchor="middle" font-size="10.5" fill="#334155">延迟最低、带宽最高</text>

  <!-- Node 1 -->
  <rect x="570" y="92" width="380" height="210" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="590" y="118" font-size="14" font-weight="bold" fill="#1e40af">Node 1（插槽 1）</text>

  <rect x="592" y="134" width="160" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="608" y="160" font-size="13" font-weight="bold" fill="#1e40af">CPU 1</text>
  <text x="608" y="180" font-size="10.5" fill="#1e40af">核心 + 私有 cache</text>

  <rect x="772" y="134" width="160" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="788" y="160" font-size="13" font-weight="bold" fill="#14532d">本地内存</text>
  <text x="788" y="180" font-size="10.5" fill="#14532d">DRAM（直连 Node 1）</text>

  <line x1="754" y1="163" x2="770" y2="163" stroke="#16a34a" stroke-width="2" marker-end="url(#na1)"/>
  <text x="760" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">本地访问 ≈ 100ns</text>
  <text x="760" y="246" text-anchor="middle" font-size="10.5" fill="#334155">延迟最低、带宽最高</text>

  <!-- interconnect -->
  <rect x="462" y="150" width="76" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="500" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">跨节点互联</text>
  <text x="500" y="194" text-anchor="middle" font-size="9.5" fill="#b45309">QPI / UPI / IF</text>
  <text x="500" y="210" text-anchor="middle" font-size="9.5" fill="#b45309">1.5~2× 延迟</text>

  <line x1="432" y1="185" x2="460" y2="185" stroke="#d97706" stroke-width="2" marker-end="url(#na2)"/>
  <line x1="568" y1="185" x2="540" y2="185" stroke="#d97706" stroke-width="2" marker-end="url(#na2)"/>
  <text x="500" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">远程访问 ≈ 150~200ns</text>
  <text x="500" y="248" text-anchor="middle" font-size="10.5" fill="#64748b">数据要过 interconnect 才能到</text>

  <!-- 要点 -->
  <rect x="60" y="330" width="880" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="78" y="356" font-size="12.5" font-weight="bold" fill="#0f172a">⭐ 要点</text>
  <text x="78" y="380" font-size="12" fill="#334155">1) 内存按 CPU 插槽分段成 Node：numactl --hardware 查看有几个节点、各节点内存多大</text>
  <text x="78" y="402" font-size="12" fill="#334155">2) 本地访问约 100ns，跨节点远程访问约 150~200ns（1.5~2 倍）—— 大内存机器性能问题的头号来源之一</text>
  <text x="78" y="424" font-size="12" fill="#334155">3) 数据库大 Buffer Pool 跨节点、单进程多线程分散在不同 Node，都会命中这一条</text>
  <text x="78" y="446" font-size="12" fill="#334155">4) 收敛手段：numactl --cpunodebind=0 --membind=0 ./app 绑核绑内存；或开启内核 NUMA balancing</text>
</svg>
