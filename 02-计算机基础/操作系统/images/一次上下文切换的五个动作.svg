<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="400" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一次上下文切换的五个动作</text>
  <text x="500" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">五步里只有「换页表基址」是进程独有；实测线程 9.4 µs、进程 10.4 µs，只差 11%</text>
  <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1d4ed8"/></marker></defs>
  <rect x="24" y="92" width="176" height="96" rx="8" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="36" y="120" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="bold">① 保存上下文</text>
  <text x="36" y="148" font-size="10.5" fill="#0f172a" text-anchor="start">寄存器写回 PCB</text>
  <line x1="202" y1="140" x2="214" y2="140" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="216" y="92" width="176" height="96" rx="8" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="228" y="120" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="bold">② 换内核栈</text>
  <text x="228" y="148" font-size="10.5" fill="#0f172a" text-anchor="start">换到 B 的内核栈</text>
  <line x1="394" y1="140" x2="406" y2="140" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="408" y="92" width="176" height="96" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="420" y="120" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">③ 换页表基址</text>
  <text x="420" y="148" font-size="10.5" fill="#0f172a" text-anchor="start">写 CR3（仅跨进程）</text>
  <line x1="586" y1="140" x2="598" y2="140" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="600" y="92" width="176" height="96" rx="8" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="612" y="120" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="bold">④ 恢复上下文</text>
  <text x="612" y="148" font-size="10.5" fill="#0f172a" text-anchor="start">取回 B 的寄存器</text>
  <line x1="778" y1="140" x2="790" y2="140" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="792" y="92" width="176" height="96" rx="8" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="804" y="120" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="bold">⑤ 返回用户态</text>
  <text x="804" y="148" font-size="10.5" fill="#0f172a" text-anchor="start">从 B 被打断处继续</text>
  <rect x="24" y="212" width="460" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="236" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">五步里两者都要做的：① ② ④ ⑤</text>
  <text x="40" y="260" font-size="11.5" fill="#64748b" text-anchor="start">只有第 ③ 步是「进程独有」——而它只让总价多了 11%</text>
  <text x="40" y="282" font-size="11.5" fill="#64748b" text-anchor="start">PCID 让 TLB 项带地址空间标签，换 CR3 不必整表刷</text>
  <rect x="500" y="212" width="476" height="92" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="516" y="236" font-size="12" fill="#047857" text-anchor="start" font-weight="bold">本机实测（WSL2，8 逻辑核）</text>
  <text x="516" y="260" font-size="11.5" fill="#0f172a" text-anchor="start">线程间切换 9.4 µs ｜ 进程间切换 10.4 µs ｜ 差 11%</text>
  <text x="516" y="282" font-size="11.5" fill="#0f172a" text-anchor="start">dTLB-load-misses：跨线程 8.5% ｜ 跨进程 9.6% ｜ 差 1.1 个点</text>
  <rect x="24" y="326" width="952" height="54" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="348" font-size="12" fill="#b45309" text-anchor="start">所以「进程切换比线程切换贵一个数量级」不成立；真正的数量级差在「协程 vs 线程」那一层（用户态切换，不陷入内核）。</text>
</svg>
