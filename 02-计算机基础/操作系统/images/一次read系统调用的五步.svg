<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="b1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="b2" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">一次 read() 到底做了什么：两次权限切换、一次拷贝</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">业务代码只看到「函数返回了 n 字节」，中间隔着一整套陷入、定位、拷贝、恢复</text>

  <rect x="34" y="86" width="370" height="18" rx="4" fill="#ffedd5" stroke="#ea580c"/>
  <text x="44" y="99" font-size="10" fill="#9a3412">用户态（CPL=3）</text>
  <rect x="404" y="86" width="562" height="18" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="414" y="99" font-size="10" fill="#1e3a8a">内核态（CPL=0，页表权限放开）</text>

  <rect x="34" y="112" width="172" height="112" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="120" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">① 用户态调 read</text>
  <text x="120" y="160" text-anchor="middle" font-size="10" fill="#334155">fd、buf、count</text>
  <text x="120" y="178" text-anchor="middle" font-size="10" fill="#334155">三个参数在用户栈上</text>

  <rect x="224" y="112" width="172" height="112" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="310" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">② syscall 陷入</text>
  <text x="310" y="160" text-anchor="middle" font-size="10" fill="#334155">换内核栈、换页表</text>
  <text x="310" y="178" text-anchor="middle" font-size="10" fill="#334155">入口地址在 MSR_LSTAR</text>

  <rect x="414" y="112" width="172" height="112" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="500" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">③ 校验并定位</text>
  <text x="500" y="160" text-anchor="middle" font-size="10" fill="#334155">fd 表 → struct file</text>
  <text x="500" y="178" text-anchor="middle" font-size="10" fill="#334155">→ socket 队列或页缓存</text>

  <rect x="604" y="112" width="172" height="112" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="690" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">④ copy_to_user</text>
  <text x="690" y="160" text-anchor="middle" font-size="10" fill="#334155">从 ③ 那段缓冲拷进 buf</text>
  <text x="690" y="178" text-anchor="middle" font-size="10" fill="#334155">唯一的一次数据搬家</text>

  <rect x="794" y="112" width="172" height="112" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="880" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">⑤ 返回用户态</text>
  <text x="880" y="160" text-anchor="middle" font-size="10" fill="#334155">返回值 = 拷贝字节数</text>
  <text x="880" y="178" text-anchor="middle" font-size="10" fill="#334155">0 是 EOF，不是出错</text>

  <line x1="206" y1="168" x2="220" y2="168" stroke="#475569" stroke-width="1.4" marker-end="url(#b1)"/>
  <line x1="396" y1="168" x2="410" y2="168" stroke="#475569" stroke-width="1.4" marker-end="url(#b1)"/>
  <line x1="586" y1="168" x2="600" y2="168" stroke="#475569" stroke-width="1.4" marker-end="url(#b1)"/>
  <line x1="776" y1="168" x2="790" y2="168" stroke="#475569" stroke-width="1.4" marker-end="url(#b1)"/>

  <rect x="34" y="232" width="932" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="930" y1="264" x2="70" y2="264" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#b2)"/>
  <text x="500" y="252" text-anchor="middle" font-size="10" fill="#64748b">↩ 返回：换回用户页表、恢复寄存器，返回值写进 rax —— 这一次切换的代价与 ② 对称</text>

  <rect x="34" y="286" width="932" height="160" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="48" y="310" font-size="12.5" font-weight="bold" fill="#0f172a">四个最容易记错的点</text>
  <text x="48" y="334" font-size="11.5" fill="#334155">· read 返回 0 不是出错，是 EOF（对端发了 FIN）；返回 -1 且 errno=EAGAIN 才是「暂无数据」</text>
  <text x="48" y="358" font-size="11.5" fill="#334155">· 一次 read 不保证读满 count：TCP 是字节流，到了多少给多少，要读满得自己循环</text>
  <text x="48" y="382" font-size="11.5" fill="#334155">· read 返回时数据只在你的缓冲里 —— 它可能还在对端的发送队列里，「读到」不等于「对端处理了」</text>
  <text x="48" y="406" font-size="11.5" fill="#334155">· 相邻两次 read 之间可能等了很久：数据在 ③ 里排队，这段等待不占 CPU、只占内存</text>
</svg>
