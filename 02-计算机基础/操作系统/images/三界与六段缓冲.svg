<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">用户态与内核态不是两块内存，而是同一块 DDR 上的两种访问权限</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">一次收包要过 6 段缓冲，其中 5 段只在核态可见；虚线那一处就是 copy_to_user 的位置</text>

  <!-- ============ DDR 大框 ============ -->
  <rect x="30" y="76" width="700" height="470" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="44" y="96" font-size="12.5" font-weight="bold" fill="#334155">DDR 物理内存（唯一的物理介质，所有缓冲都在这一块里）</text>

  <rect x="46" y="108" width="668" height="220" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="128" font-size="11.5" font-weight="bold" fill="#1e3a8a">内核态可读写 —— 页表 U/S 位 = 0</text>

  <rect x="60" y="140" width="310" height="52" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="74" y="162" font-size="11" font-weight="bold" fill="#1e3a8a">① RX ring（网卡 DMA 写入）</text>
  <text x="74" y="180" font-size="10" fill="#334155">ethtool -g eth0 看大小，环满即丢</text>

  <rect x="390" y="140" width="310" height="52" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="404" y="162" font-size="11" font-weight="bold" fill="#1e3a8a">② 协议栈 sk_buff</text>
  <text x="404" y="180" font-size="10" fill="#334155">TCP 要重组 / UDP 直接入队</text>

  <rect x="60" y="204" width="310" height="52" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="74" y="226" font-size="11" font-weight="bold" fill="#1e3a8a">③ socket 接收队列</text>
  <text x="74" y="244" font-size="10" fill="#334155">SO_RCVBUF 封顶，ss 的 Recv-Q</text>

  <rect x="390" y="204" width="310" height="52" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="404" y="226" font-size="11" font-weight="bold" fill="#1e3a8a">④ socket 发送队列</text>
  <text x="404" y="244" font-size="10" fill="#334155">SO_SNDBUF 封顶，ss 的 Send-Q</text>

  <rect x="60" y="268" width="640" height="52" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="74" y="290" font-size="11" font-weight="bold" fill="#1e3a8a">⑤ Page Cache（文件支路）</text>
  <text x="74" y="308" font-size="10" fill="#334155">与 ②③④ 并列、不是它们的下级；write 返回到这里就算成功，落盘还要 fsync</text>

  <line x1="46" y1="353" x2="272" y2="353" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 4"/>
  <line x1="490" y1="353" x2="714" y2="353" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="380" y="344" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b91c1c">copy_to_user / copy_from_user</text>
  <text x="380" y="359" text-anchor="middle" font-size="9.5" fill="#b91c1c">唯一的越界点：一次 read 只在这里拷一次</text>

  <rect x="46" y="372" width="668" height="150" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="60" y="392" font-size="11.5" font-weight="bold" fill="#9a3412">用户态可读写 —— 页表 U/S 位 = 1</text>

  <rect x="60" y="404" width="640" height="52" rx="6" fill="#ffffff" stroke="#ea580c"/>
  <text x="74" y="426" font-size="11" font-weight="bold" fill="#9a3412">⑥ 用户缓冲区 []byte</text>
  <text x="74" y="444" font-size="10" fill="#334155">应用手里那个切片，recv 拷进来的就是它；它和上面五段在同一块 DDR 里</text>

  <text x="60" y="480" font-size="10.5" fill="#9a3412">「进内核」不等于「换了一块内存」：换的是页表权限，数据一条都没搬家。</text>

  <!-- ============ 右侧硬件 ============ -->
  <rect x="744" y="88" width="226" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="756" y="108" font-size="11" font-weight="bold" fill="#475569">物理设备（都在内存这一侧）</text>

  <rect x="756" y="118" width="200" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="856" y="145" text-anchor="middle" font-size="11" fill="#78350f">CPU（含 Cache）</text>
  <text x="756" y="180" font-size="10" fill="#64748b">访问内存要过 Cache 与寄存器</text>

  <rect x="756" y="194" width="200" height="44" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="856" y="221" text-anchor="middle" font-size="11" fill="#075985">网卡 NIC（DMA 引擎）</text>
  <text x="756" y="256" font-size="10" fill="#64748b">DMA 直接写 ①，不过 CPU</text>

  <rect x="756" y="270" width="200" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="856" y="297" text-anchor="middle" font-size="11" fill="#334155">磁盘控制器（DMA）</text>
  <text x="756" y="332" font-size="10" fill="#64748b">DMA 直接写 ⑤，不过 CPU</text>

  <line x1="756" y1="140" x2="734" y2="140" stroke="#475569" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="756" y1="216" x2="734" y2="216" stroke="#475569" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="756" y1="292" x2="734" y2="292" stroke="#475569" stroke-width="1.4" marker-end="url(#a1)"/>
  <text x="856" y="368" text-anchor="middle" font-size="10" fill="#64748b">三者共用同一条内存总线</text>

  <!-- ============ 底部结论 ============ -->
  <rect x="30" y="562" width="940" height="76" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="46" y="586" font-size="12.5" font-weight="bold" fill="#0f172a">⭐ 两态之分只改一件事：这块内存「此刻」你能不能碰</text>
  <text x="46" y="610" font-size="11.5" fill="#334155">同一个进程、同一个虚拟地址空间，进内核只是把页表权限放开 —— 拷贝发生在两段缓冲之间，不是两块内存之间。</text>
  <text x="46" y="630" font-size="11.5" fill="#334155">所以「减少拷贝」减的是 CPU 的工作量，不是内存容量；零拷贝把这段虚线砍掉，物理内存一步都没少。</text>
</svg>
