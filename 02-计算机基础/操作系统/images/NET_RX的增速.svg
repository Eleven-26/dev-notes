<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="448" viewBox="0 0 1000 448" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="1000" height="448" fill="#ffffff"/>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#0f172a">造流量只把 NET_RX 一类顶了上去，其余四类纹丝不动</text>
  <text x="40" y="58" font-size="12" fill="#64748b">同为 3 秒窗口的前后对照，纵轴是对数刻度（否则 44 与 97,780 无法同图）</text>

  <rect x="40" y="76" width="920" height="290" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- 纵轴：10^1 ~ 10^5，每 decade 50px -->
  <line x1="118" y1="310" x2="908" y2="310" stroke="#cbd5e1"/>
  <line x1="118" y1="310" x2="118" y2="104" stroke="#cbd5e1"/>
  <text x="106" y="314" text-anchor="end" font-size="10" fill="#94a3b8">10</text>
  <text x="106" y="264" text-anchor="end" font-size="10" fill="#94a3b8">100</text>
  <text x="106" y="214" text-anchor="end" font-size="10" fill="#94a3b8">1k</text>
  <text x="106" y="164" text-anchor="end" font-size="10" fill="#94a3b8">10k</text>
  <text x="106" y="114" text-anchor="end" font-size="10" fill="#94a3b8">100k</text>
  <line x1="118" y1="260" x2="908" y2="260" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="118" y1="210" x2="908" y2="210" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="118" y1="160" x2="908" y2="160" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="118" y1="110" x2="908" y2="110" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <text x="112" y="98" text-anchor="end" font-size="10" fill="#94a3b8">次/秒</text>

  <!-- 组1 NET_RX：空载 592 -> y221.4；满负荷 97,780 -> y110.5 -->
  <rect x="130" y="221" width="55" height="89" fill="#cbd5e1"/>
  <text x="157" y="213" text-anchor="middle" font-size="10" fill="#64748b">592</text>
  <rect x="190" y="110" width="55" height="200" fill="#0f766e"/>
  <text x="217" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">97,780</text>
  <text x="187" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">NET_RX</text>
  <text x="187" y="350" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">165 倍</text>

  <!-- 组2 TIMER：131.3 -> y254.1；133.3 -> y253.7 -->
  <rect x="290" y="254" width="55" height="56" fill="#cbd5e1"/>
  <rect x="350" y="253" width="55" height="57" fill="#0f766e" opacity="0.55"/>
  <text x="377" y="245" text-anchor="middle" font-size="10" fill="#64748b">133</text>
  <text x="347" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">TIMER</text>
  <text x="347" y="350" text-anchor="middle" font-size="10" fill="#94a3b8">不变</text>

  <!-- 组3 SCHED：768 -> y215.7；658 -> y219.1 -->
  <rect x="450" y="215" width="55" height="95" fill="#cbd5e1"/>
  <rect x="510" y="219" width="55" height="91" fill="#0f766e" opacity="0.55"/>
  <text x="537" y="211" text-anchor="middle" font-size="10" fill="#64748b">658</text>
  <text x="507" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">SCHED</text>
  <text x="507" y="350" text-anchor="middle" font-size="10" fill="#94a3b8">略降</text>

  <!-- 组4 RCU：291.7 -> y236.8；259.3 -> y239.3 -->
  <rect x="610" y="236" width="55" height="74" fill="#cbd5e1"/>
  <rect x="670" y="239" width="55" height="71" fill="#0f766e" opacity="0.55"/>
  <text x="697" y="231" text-anchor="middle" font-size="10" fill="#64748b">259</text>
  <text x="667" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">RCU</text>
  <text x="667" y="350" text-anchor="middle" font-size="10" fill="#94a3b8">略降</text>

  <!-- 组5 TASKLET：66.3 -> y268.9；44.3 -> y277.7 -->
  <rect x="770" y="268" width="55" height="42" fill="#cbd5e1"/>
  <rect x="830" y="277" width="55" height="33" fill="#0f766e" opacity="0.55"/>
  <text x="857" y="269" text-anchor="middle" font-size="10" fill="#64748b">44</text>
  <text x="827" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">TASKLET</text>
  <text x="827" y="350" text-anchor="middle" font-size="10" fill="#94a3b8">略降</text>

  <!-- 图例 -->
  <rect x="700" y="92" width="12" height="12" rx="2" fill="#cbd5e1"/>
  <text x="718" y="102" font-size="11" fill="#64748b">空载</text>
  <rect x="770" y="92" width="12" height="12" rx="2" fill="#0f766e"/>
  <text x="788" y="102" font-size="11" fill="#64748b">造流量</text>

  <!-- 放大 NET_RX 区域 -->
  <rect x="374" y="112" width="200" height="26" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="474" y="129" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">165 倍，只此一类</text>

  <rect x="60" y="376" width="880" height="56" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="76" y="398" font-size="13" fill="#92400e">判据：看到 si（软中断 CPU 占用）高，先看是哪一类涨 —— 混在一起看总数只能得出「软中断高」，给不出方向。</text>
  <text x="76" y="418" font-size="12" fill="#a16207">NET_RX 涨 → 开 RPS/RFS 或多队列；BLOCK 涨 → 磁盘 IO 密集；RCU 涨 → 读侧临界区太频繁。</text>
</svg>
