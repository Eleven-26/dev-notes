<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">操作系统：七篇按「横切 → 等 → 搬 → 宏观 → 缝合」排</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#64748b">左边一条竖线是读序，不是流程：先有「两态之分」这张底图，才谈得上等与搬，最后把微观与宏观缝上</text>
  <line x1="46" y1="96" x2="46" y2="424" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="46" cy="114" r="13" fill="#2563eb"/>
  <text x="46" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">①</text>
  <rect x="76" y="78" width="904" height="78" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="90" y="102" font-size="12.5" font-weight="bold" fill="#0f172a">横切 · 用户态内核态与一次IO的内存路径</text>
  <text x="90" y="123" font-size="10.8" fill="#334155">一个进程为什么有「两个态」（改的是权限不是内存）；一次 I/O 过六段缓冲，只有一段越界</text>
  <text x="90" y="143" font-size="10.8" fill="#334155">把 linux/ 与 网络/ 里各讲一半的数据路径接起来</text>
  <circle cx="46" cy="214" r="13" fill="#0d9488"/>
  <text x="46" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">②</text>
  <rect x="76" y="168" width="446" height="96" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/>
  <text x="90" y="192" font-size="12.5" font-weight="bold" fill="#0f172a">等 · IO多路复用</text>
  <text x="90" y="213" font-size="10.8" fill="#334155">数据没到的时候谁在等：五种 I/O 模型、</text>
  <text x="90" y="233" font-size="10.8" fill="#334155">select/poll/epoll 三代、LT 与 ET、io_uring</text>
  <rect x="536" y="168" width="444" height="96" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/>
  <text x="550" y="192" font-size="12.5" font-weight="bold" fill="#0f172a">搬 · 零拷贝</text>
  <text x="550" y="213" font-size="10.8" fill="#334155">数据到了之后怎么搬：五种路径各</text>
  <text x="550" y="233" font-size="10.8" fill="#334155">省掉哪一次，代价又换成什么</text>
  <circle cx="46" cy="326" r="13" fill="#ea580c"/>
  <text x="46" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">③</text>
  <rect x="76" y="280" width="296" height="96" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="90" y="304" font-size="12.5" font-weight="bold" fill="#0f172a">宏观 · 进程创建与退出</text>
  <text x="90" y="325" font-size="10.8" fill="#334155">fork 复制页表不是内存、</text>
  <text x="90" y="345" font-size="10.8" fill="#334155">COW 写才复制、僵尸与孤儿</text>
  <rect x="386" y="280" width="296" height="96" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="400" y="304" font-size="12.5" font-weight="bold" fill="#0f172a">宏观 · 调度与时间片</text>
  <text x="400" y="325" font-size="10.8" fill="#334155">时间片 2.1 ms、切换 9.4 / 10.4 µs、</text>
  <text x="400" y="345" font-size="10.8" fill="#334155">三档时间尺度</text>
  <rect x="696" y="280" width="284" height="96" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="710" y="304" font-size="12.5" font-weight="bold" fill="#0f172a">宏观 · 中断机制</text>
  <text x="710" y="325" font-size="10.8" fill="#334155">谁把 CPU 抢回去：</text>
  <text x="710" y="345" font-size="10.8" fill="#334155">时钟中断与十二步换人</text>
  <circle cx="46" cy="422" r="13" fill="#7c3aed"/>
  <text x="46" y="426" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">④</text>
  <rect x="76" y="392" width="904" height="64" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="90" y="416" font-size="12.5" font-weight="bold" fill="#0f172a">缝合 · 信号机制</text>
  <text x="90" y="437" font-size="10.8" fill="#334155">返回用户态之前那笔待办：四道关、两份 pending、handler 的栈、EINTR 与 SA_RESTART</text>
  <rect x="20" y="470" width="960" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="36" y="492" font-size="12" font-weight="bold" fill="#0f172a">不进本目录的四类：判据是「换语言、换组件还成立，且原因在内核里」</text>
  <rect x="36" y="502" width="224" height="42" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="46" y="518" font-size="11" font-weight="bold" fill="#1e293b">linux/</text>
  <text x="46" y="535" font-size="9.5" fill="#64748b">命令与 /proc 怎么读，机制留在那边</text>
  <rect x="268" y="502" width="224" height="42" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="278" y="518" font-size="11" font-weight="bold" fill="#1e293b">网络/</text>
  <text x="278" y="535" font-size="9.5" fill="#64748b">协议与状态机；队列布局归这里</text>
  <rect x="500" y="502" width="224" height="42" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="510" y="518" font-size="11" font-weight="bold" fill="#1e293b">算法/</text>
  <text x="510" y="535" font-size="9.5" fill="#64748b">算法怎么设计；实测读数在这</text>
  <rect x="732" y="502" width="224" height="42" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="742" y="518" font-size="11" font-weight="bold" fill="#1e293b">Go / Java</text>
  <text x="742" y="535" font-size="9.5" fill="#64748b">netpoller、NIO 各归其位</text>
</svg>
