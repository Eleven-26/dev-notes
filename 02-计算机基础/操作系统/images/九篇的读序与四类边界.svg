<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" height="790" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="790" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">操作系统：九篇按「底图 → 等 → 搬 → 内存 → 进程 → 时间 → 缝合」排</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#64748b">左边一条竖线是读序，不是流程：先有「两态之分」这张底图，才谈得上等与搬；内存与进程是两条并列的底座，时间那一段收口到中断</text>
  <line x1="46" y1="98" x2="46" y2="638" stroke="#cbd5e1" stroke-width="2"/>

  <circle cx="46" cy="120" r="13" fill="#2563eb"/>
  <text x="46" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">①</text>
  <rect x="76" y="78" width="904" height="84" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="90" y="102" font-size="12.5" font-weight="bold" fill="#0f172a">底图 · 用户态内核态与一次IO的内存路径</text>
  <text x="90" y="124" font-size="10.8" fill="#334155">一个进程为什么有「两个态」（改的是权限不是内存）；一次 I/O 过六段缓冲，只有一段越界</text>
  <text x="90" y="144" font-size="10.8" fill="#334155">它把 linux/ 与 网络/ 里各讲一半的数据路径接起来，是后面八篇的公共坐标系</text>

  <circle cx="46" cy="220" r="13" fill="#0d9488"/>
  <text x="46" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">②</text>
  <rect x="76" y="178" width="446" height="84" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/>
  <text x="90" y="202" font-size="12.5" font-weight="bold" fill="#0f172a">等 · IO多路复用</text>
  <text x="90" y="224" font-size="10.8" fill="#334155">数据没到的时候谁在等：五种 I/O 模型、</text>
  <text x="90" y="244" font-size="10.8" fill="#334155">select/poll/epoll 三代、LT 与 ET、io_uring</text>
  <rect x="536" y="178" width="444" height="84" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/>
  <text x="550" y="202" font-size="12.5" font-weight="bold" fill="#0f172a">搬 · 零拷贝</text>
  <text x="550" y="224" font-size="10.8" fill="#334155">数据到了之后怎么搬：五种路径各</text>
  <text x="550" y="244" font-size="10.8" fill="#334155">省掉哪一次，代价又换成什么</text>

  <circle cx="46" cy="320" r="13" fill="#7c3aed"/>
  <text x="46" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">③</text>
  <rect x="76" y="278" width="904" height="84" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="90" y="302" font-size="12.5" font-weight="bold" fill="#0f172a">内存 · 虚拟内存与页缓存</text>
  <text x="90" y="324" font-size="10.8" fill="#334155">地址空间与多级页表、TLB、缺页中断；伙伴系统与 Slab、NUMA、swap</text>
  <text x="90" y="344" font-size="10.8" fill="#334155">write 落在页缓存就返回的那一半在这里，落盘的那一半在 linux/ 的文件系统篇</text>

  <circle cx="46" cy="420" r="13" fill="#ea580c"/>
  <text x="46" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">④</text>
  <rect x="76" y="378" width="446" height="84" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="90" y="402" font-size="12.5" font-weight="bold" fill="#0f172a">进程 · 进程与线程模型</text>
  <text x="90" y="424" font-size="10.8" fill="#334155">PCB 与五状态、就绪与阻塞队列；</text>
  <text x="90" y="444" font-size="10.8" fill="#334155">Linux 用 clone 与 task_struct 统一描述两者</text>
  <rect x="536" y="378" width="444" height="84" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="550" y="402" font-size="12.5" font-weight="bold" fill="#0f172a">进程 · 进程创建与退出</text>
  <text x="550" y="424" font-size="10.8" fill="#334155">fork 复制页表不是内存、COW 写才复制、</text>
  <text x="550" y="444" font-size="10.8" fill="#334155">execve 的分工、僵尸与孤儿、多线程 fork</text>

  <circle cx="46" cy="520" r="13" fill="#dc2626"/>
  <text x="46" y="524" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">⑤</text>
  <rect x="76" y="478" width="446" height="84" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="90" y="502" font-size="12.5" font-weight="bold" fill="#0f172a">时间 · 调度与时间片</text>
  <text x="90" y="524" font-size="10.8" fill="#334155">时间片 2.1 ms、切换 9.4 / 10.4 µs、</text>
  <text x="90" y="544" font-size="10.8" fill="#334155">三档时间尺度、五个调度类与 nice 的效力</text>
  <rect x="536" y="478" width="444" height="84" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="550" y="502" font-size="12.5" font-weight="bold" fill="#0f172a">时间 · 中断机制</text>
  <text x="550" y="524" font-size="10.8" fill="#334155">谁把 CPU 抢回去：时钟中断与</text>
  <text x="550" y="544" font-size="10.8" fill="#334155">十二步换人链条，微观与宏观的接缝</text>

  <circle cx="46" cy="620" r="13" fill="#4f46e5"/>
  <text x="46" y="624" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">⑥</text>
  <rect x="76" y="578" width="904" height="84" rx="9" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="90" y="602" font-size="12.5" font-weight="bold" fill="#0f172a">缝合 · 信号机制</text>
  <text x="90" y="624" font-size="10.8" fill="#334155">返回用户态之前那笔待办：四道关、两份 pending、handler 的栈、EINTR 与 SA_RESTART</text>
  <text x="90" y="644" font-size="10.8" fill="#334155">Go 装了 56 个信号、Java 把信号当内部设施——两种语言各自的接管方式</text>

  <rect x="20" y="684" width="960" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="36" y="706" font-size="12" font-weight="bold" fill="#0f172a">不进本目录的四类：判据是「换语言、换组件还成立，且原因在内核里」</text>
  <rect x="36" y="716" width="224" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="46" y="734" font-size="11" font-weight="bold" fill="#1e293b">linux/</text>
  <text x="46" y="751" font-size="9.5" fill="#64748b">命令与 /proc 怎么读；机制已迁过来</text>
  <rect x="268" y="716" width="224" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="278" y="734" font-size="11" font-weight="bold" fill="#1e293b">网络/</text>
  <text x="278" y="751" font-size="9.5" fill="#64748b">协议与状态机；队列布局归这里</text>
  <rect x="500" y="716" width="224" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="510" y="734" font-size="11" font-weight="bold" fill="#1e293b">算法/</text>
  <text x="510" y="751" font-size="9.5" fill="#64748b">调度与置换算法怎么设计</text>
  <rect x="732" y="716" width="224" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="742" y="734" font-size="11" font-weight="bold" fill="#1e293b">Go / Java</text>
  <text x="742" y="751" font-size="9.5" fill="#64748b">netpoller、NIO 各归其位</text>
</svg>
