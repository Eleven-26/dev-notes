<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">缓存行的间隔夹逼：56 还在跳，64 掉到五分之一</text>
  <rect x="32" y="52" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="70" font-size="13" fill="#64748b">起点强制 64 对齐，只改两个计数器的地址间隔；每档两个 goroutine 各加 200 万次，取三轮中位数。</text>

  <rect x="32" y="92" width="936" height="300" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <line x1="470" y1="112" x2="470" y2="352" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="478" y="128" font-size="11" fill="#475569">行宽分界在 56 与 64 之间</text>

  <rect x="110" y="143" width="70" height="197" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="118" y="135" font-size="13" font-weight="bold" fill="#991b1b">44.07</text>
  <text x="118" y="370" font-size="12" fill="#334155">间隔 8 B</text>
  <text x="118" y="388" font-size="11" fill="#64748b">同一行</text>

  <rect x="240" y="140" width="70" height="200" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="248" y="132" font-size="13" font-weight="bold" fill="#991b1b">44.82</text>
  <text x="248" y="370" font-size="12" fill="#334155">间隔 32 B</text>
  <text x="248" y="388" font-size="11" fill="#64748b">同一行</text>

  <rect x="370" y="142" width="70" height="198" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="378" y="134" font-size="13" font-weight="bold" fill="#991b1b">44.32</text>
  <text x="378" y="370" font-size="12" fill="#334155">间隔 56 B</text>
  <text x="378" y="388" font-size="11" fill="#64748b">同一行</text>

  <rect x="500" y="302" width="70" height="38" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="508" y="294" font-size="13" font-weight="bold" fill="#15803d">8.55</text>
  <text x="508" y="370" font-size="12" fill="#334155">间隔 64 B</text>
  <text x="508" y="388" font-size="11" fill="#15803d">跨行</text>

  <rect x="630" y="299" width="70" height="41" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="638" y="291" font-size="13" font-weight="bold" fill="#15803d">9.27</text>
  <text x="638" y="370" font-size="12" fill="#334155">间隔 72 B</text>
  <text x="638" y="388" font-size="11" fill="#15803d">跨行</text>

  <rect x="760" y="300" width="70" height="40" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="768" y="292" font-size="13" font-weight="bold" fill="#15803d">8.92</text>
  <text x="768" y="370" font-size="12" fill="#334155">间隔 128 B</text>
  <text x="768" y="388" font-size="11" fill="#15803d">跨行</text>

  <line x1="90" y1="340" x2="900" y2="340" stroke="#cbd5e1"/>
  <text x="90" y="334" font-size="10" fill="#94a3b8">ns/op</text>

  <rect x="32" y="406" width="936" height="50" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="44" y="426" font-size="12" fill="#1e40af">间隔 8 / 32 / 56 三档同为 37~49 ns，说明同一行内的不同偏移全都算伪共享；64 起掉到 8.5~9.3 ns。</text>
  <text x="44" y="446" font-size="12" fill="#1e40af">行宽 ∈ (56, 64]，且 64 是 2 的幂 —— 这就是「x86-64 缓存行 64 字节」的夹逼证据，不是查文档得来的。</text>
</svg>
