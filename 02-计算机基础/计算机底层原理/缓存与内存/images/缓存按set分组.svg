<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#64748b"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">缓存按 set 分组：地址第 6~11 位选 set，32 KB 步长全撞一个</text>
  <rect x="32" y="52" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="70" font-size="13" fill="#64748b">L1d 32 KB = 64 set × 8 way × 64 B；一个 set 只装 8 条行，第 9 条进来就要踢掉一条。</text>

  <rect x="32" y="90" width="936" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="114" font-size="13" font-weight="bold" fill="#0f172a">一个地址怎么选 set：只取页内偏移的一段</text>

  <rect x="48" y="126" width="600" height="50" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="316" y="147" font-size="12" fill="#475569">tag：bit 12 以上</text>
  <text x="316" y="165" font-size="11" fill="#94a3b8">命中时用来比对，不参与选 set</text>

  <rect x="656" y="126" width="150" height="50" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="731" y="147" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">bit 6..11</text>
  <text x="731" y="165" font-size="11" fill="#92400e" text-anchor="middle">64 个 set 之一</text>

  <rect x="814" y="126" width="138" height="50" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="883" y="147" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">bit 0..5</text>
  <text x="883" y="165" font-size="11" fill="#1e40af" text-anchor="middle">行内 0..63 B</text>

  <text x="48" y="198" font-size="12" fill="#475569">32 KB 步长 = 地址加 0x8000（bit 15），bit 6~11 一位不变 → 永远落回同一个 set。</text>

  <rect x="32" y="222" width="470" height="246" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="248" font-size="13" font-weight="bold" fill="#0f172a">32 KB 步长：16 条行全进 set 0</text>

  <rect x="48" y="258" width="240" height="20" rx="3" fill="#fecaca" stroke="#ef4444"/>
  <text x="58" y="272" font-size="11" fill="#991b1b">way 0 · 行 A0</text>
  <rect x="48" y="284" width="240" height="20" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <text x="58" y="298" font-size="11" fill="#991b1b">way 1 · 行 A1</text>
  <rect x="48" y="310" width="240" height="20" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <text x="58" y="324" font-size="11" fill="#991b1b">way 2 · 行 A2</text>
  <rect x="48" y="336" width="240" height="20" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <text x="58" y="350" font-size="11" fill="#991b1b">way 3 · 行 A3</text>
  <rect x="48" y="362" width="240" height="20" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <text x="58" y="376" font-size="11" fill="#991b1b">way 4 · 行 A4</text>
  <rect x="48" y="388" width="240" height="20" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <text x="58" y="402" font-size="11" fill="#991b1b">way 5 · 行 A5</text>
  <rect x="48" y="414" width="240" height="20" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <text x="58" y="428" font-size="11" fill="#991b1b">way 6 · 行 A6</text>
  <rect x="48" y="440" width="240" height="20" rx="3" fill="#fecaca" stroke="#ef4444"/>
  <text x="58" y="454" font-size="11" fill="#991b1b">way 7 · 行 A7</text>

  <rect x="322" y="320" width="158" height="78" rx="4" fill="#fff7ed" stroke="#f97316"/>
  <text x="401" y="344" font-size="11" fill="#9a3412" text-anchor="middle">行 A8 ... A15 待装入</text>
  <text x="401" y="364" font-size="11" fill="#9a3412" text-anchor="middle">同一 set，只有 8 路</text>
  <text x="401" y="384" font-size="11" fill="#9a3412" text-anchor="middle">第 9 条起互相踢</text>
  <line x1="322" y1="404" x2="296" y2="440" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="322" y="430" font-size="10" fill="#64748b">踢掉最久未用的那条</text>

  <rect x="516" y="222" width="452" height="246" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="532" y="248" font-size="13" font-weight="bold" fill="#0f172a">32 KB + 64 B：16 条行 → 16 个 set</text>

  <rect x="532" y="266" width="48" height="30" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="556" y="286" font-size="10" fill="#166534" text-anchor="middle">s0</text>
  <rect x="584" y="266" width="48" height="30" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="608" y="286" font-size="10" fill="#166534" text-anchor="middle">s1</text>
  <rect x="636" y="266" width="48" height="30" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="660" y="286" font-size="10" fill="#166534" text-anchor="middle">s2</text>
  <rect x="688" y="266" width="48" height="30" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="712" y="286" font-size="10" fill="#166534" text-anchor="middle">s3</text>
  <rect x="740" y="266" width="48" height="30" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="764" y="286" font-size="10" fill="#166534" text-anchor="middle">s4</text>
  <rect x="792" y="266" width="48" height="30" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="816" y="286" font-size="10" fill="#166534" text-anchor="middle">s5</text>
  <rect x="844" y="266" width="48" height="30" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="868" y="286" font-size="10" fill="#166534" text-anchor="middle">s6</text>
  <rect x="896" y="266" width="48" height="30" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="920" y="286" font-size="10" fill="#166534" text-anchor="middle">s7</text>

  <rect x="532" y="310" width="48" height="30" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="556" y="330" font-size="10" fill="#166534" text-anchor="middle">s8</text>
  <rect x="584" y="310" width="48" height="30" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="608" y="330" font-size="10" fill="#166534" text-anchor="middle">s9</text>
  <rect x="636" y="310" width="48" height="30" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="660" y="330" font-size="10" fill="#166534" text-anchor="middle">s10</text>
  <rect x="688" y="310" width="48" height="30" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="712" y="330" font-size="10" fill="#166534" text-anchor="middle">s11</text>
  <rect x="740" y="310" width="48" height="30" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="764" y="330" font-size="10" fill="#166534" text-anchor="middle">s12</text>
  <rect x="792" y="310" width="48" height="30" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="816" y="330" font-size="10" fill="#166534" text-anchor="middle">s13</text>
  <rect x="844" y="310" width="48" height="30" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="868" y="330" font-size="10" fill="#166534" text-anchor="middle">s14</text>
  <rect x="896" y="310" width="48" height="30" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="920" y="330" font-size="10" fill="#166534" text-anchor="middle">s15</text>

  <text x="532" y="368" font-size="12" fill="#166534">16 条行各落一个 set，8 路只用了 1/8 —— 全部命中。</text>
  <text x="532" y="392" font-size="11" fill="#64748b">被踢掉 8 条之后，剩下 8 条仍能各自留在 set 里，</text>
  <text x="532" y="410" font-size="11" fill="#64748b">所以冲突组也没有跌到内存的 100 ns。</text>
  <text x="532" y="440" font-size="11" fill="#64748b">32 KB 是把 set 数（64）× 行宽（64 B）刚好走满一圈的步长。</text>

  <rect x="32" y="484" width="936" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="508" font-size="10" font-weight="bold" fill="#64748b">摆放（16 条行）</text>
  <text x="380" y="508" font-size="10" font-weight="bold" fill="#64748b">三轮 ns/次</text>
  <text x="660" y="508" font-size="10" font-weight="bold" fill="#64748b">说明</text>
  <line x1="48" y1="516" x2="950" y2="516" stroke="#e2e8f0"/>

  <text x="48" y="540" font-size="12" fill="#334155">32 KB 步长</text>
  <text x="380" y="540" font-size="12" fill="#991b1b">6.86 / 5.09 / 10.69</text>
  <text x="660" y="540" font-size="11" fill="#475569">全挤同一个 set，8 路装不下 16 条</text>

  <text x="48" y="566" font-size="12" fill="#334155">32 KB + 64 B</text>
  <text x="380" y="566" font-size="12" fill="#15803d">2.07 / 2.04 / 2.58</text>
  <text x="660" y="566" font-size="11" fill="#475569">16 个 set 各一条，全部命中</text>

  <text x="48" y="590" font-size="12" font-weight="bold" fill="#0f172a">倍数</text>
  <text x="380" y="590" font-size="12" font-weight="bold" fill="#b91c1c">3.31 / 2.50 / 4.14</text>
  <text x="660" y="590" font-size="11" fill="#475569">冲突代价是「跌破一层」，不一定跌到底</text>

  <rect x="32" y="610" width="936" height="72" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="44" y="632" font-size="12" fill="#1e40af">跨了 8 个物理页仍冲突：L1d 是 VIPT（虚拟地址索引），set 索引取虚拟地址 bit 6~11，换页不改变 set。</text>
  <text x="44" y="654" font-size="12" fill="#1e40af">关联冲突抢的是同一个核里的 set，伪共享抢的是跨核的同一条行 —— 两者都叫「冲突」，修法完全不同。</text>
  <text x="44" y="674" font-size="12" fill="#1e40af">被踢的行还在 L2，所以这里测到 5~10 ns，远低于内存的 100 ns。</text>
</svg>
