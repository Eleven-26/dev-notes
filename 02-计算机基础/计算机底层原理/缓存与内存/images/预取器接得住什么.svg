<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">预取器接得住什么：顺序读与随机追逐差 29~132 倍</text>
  <rect x="32" y="52" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="70" font-size="13" fill="#64748b">同一块内存、同一个数组，只改访问顺序；三轮独立进程，取最小倍数。</text>

  <rect x="32" y="92" width="504" height="260" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="118" font-size="11" font-weight="bold" fill="#64748b">ns/元素 · 第 2 轮 · 横轴对数刻度</text>

  <text x="52" y="152" font-size="11" fill="#334155">1 MB 顺序</text>
  <rect x="160" y="140" width="18" height="16" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="184" y="153" font-size="10" fill="#1e40af">0.76</text>
  <text x="52" y="174" font-size="11" fill="#334155">1 MB 随机</text>
  <rect x="160" y="162" width="164" height="16" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <text x="330" y="175" font-size="10" fill="#991b1b">21.70</text>
  <text x="500" y="175" font-size="11" font-weight="bold" fill="#b91c1c">29×</text>

  <text x="52" y="206" font-size="11" fill="#334155">8 MB 顺序</text>
  <rect x="160" y="194" width="49" height="16" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="215" y="207" font-size="10" fill="#1e40af">1.54</text>
  <text x="52" y="228" font-size="11" fill="#334155">8 MB 随机</text>
  <rect x="160" y="216" width="223" height="16" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <text x="389" y="229" font-size="10" fill="#991b1b">85.27</text>
  <text x="500" y="229" font-size="11" font-weight="bold" fill="#b91c1c">48×</text>

  <text x="52" y="260" font-size="11" fill="#334155">64 MB 顺序</text>
  <rect x="160" y="248" width="35" height="16" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="201" y="261" font-size="10" fill="#1e40af">1.11</text>
  <text x="52" y="282" font-size="11" fill="#334155">64 MB 随机</text>
  <rect x="160" y="270" width="247" height="16" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <text x="413" y="283" font-size="10" fill="#991b1b">146.93</text>
  <text x="500" y="283" font-size="11" font-weight="bold" fill="#b91c1c">132×</text>

  <line x1="160" y1="304" x2="460" y2="304" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <line x1="190" y1="298" x2="190" y2="310" stroke="#cbd5e1"/>
  <line x1="290" y1="298" x2="290" y2="310" stroke="#cbd5e1"/>
  <line x1="390" y1="298" x2="390" y2="310" stroke="#cbd5e1"/>
  <text x="181" y="324" font-size="10" fill="#64748b">1</text>
  <text x="278" y="324" font-size="10" fill="#64748b">10</text>
  <text x="374" y="324" font-size="10" fill="#64748b">100</text>
  <text x="420" y="324" font-size="10" fill="#64748b">ns</text>
  <text x="52" y="324" font-size="10" fill="#64748b">0.5</text>

  <rect x="548" y="92" width="420" height="260" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="566" y="118" font-size="11" font-weight="bold" fill="#64748b">固定 8 MB 足迹，每次访问一条新行</text>

  <text x="566" y="146" font-size="10" font-weight="bold" fill="#64748b">访问模式</text>
  <text x="726" y="146" font-size="10" font-weight="bold" fill="#64748b">ns/访问（三轮）</text>
  <text x="898" y="146" font-size="10" font-weight="bold" fill="#64748b">判定</text>
  <line x1="566" y1="154" x2="950" y2="154" stroke="#e2e8f0"/>

  <text x="566" y="178" font-size="11" fill="#334155">顺序，64 B 跨步</text>
  <text x="726" y="178" font-size="10" fill="#334155">6.67 / 4.93 / 4.80</text>
  <text x="898" y="178" font-size="10" fill="#15803d">接得住</text>

  <text x="566" y="206" font-size="11" fill="#334155">512 B 跨步</text>
  <text x="726" y="206" font-size="10" fill="#334155">8.20 / 7.38 / 11.22</text>
  <text x="898" y="206" font-size="10" fill="#b45309">部分</text>

  <text x="566" y="234" font-size="11" fill="#334155">1 KB 跨步</text>
  <text x="726" y="234" font-size="10" fill="#334155">10.31 / 7.75 / 9.69</text>
  <text x="898" y="234" font-size="10" fill="#b45309">部分</text>

  <text x="566" y="262" font-size="11" fill="#334155">4 KB 跨步（页边界）</text>
  <text x="726" y="262" font-size="10" fill="#334155">12.31 / 11.95 / 13.03</text>
  <text x="898" y="262" font-size="10" fill="#b91c1c">接不住</text>

  <text x="566" y="290" font-size="11" fill="#334155">随机指针追逐（64 MB）</text>
  <text x="726" y="290" font-size="10" fill="#334155">153.49 / 146.93 / 150.83</text>
  <text x="898" y="290" font-size="10" fill="#b91c1c">接不住</text>

  <text x="566" y="318" font-size="10" fill="#92400e">注意：8 KB 档回落到 4.4~4.9，是足迹缩到 64 KB 的假象，不是预取器又生效。</text>
  <text x="566" y="338" font-size="10" fill="#92400e">跨步越大被碰到的行越少，这一列不能一路读下去。</text>

  <rect x="32" y="366" width="936" height="56" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="44" y="388" font-size="12" fill="#1e40af">可预测才有预取：顺序读一条 64 B 行装 8 个元素，预取器提前搬 k+1、k+2 行；随机追逐下一个地址要等上一次读出的值，每次都是完整往返。</text>
  <text x="44" y="410" font-size="12" fill="#1e40af">链表、树、哈希桶天然拿不到预取器；数组、环缓冲、批量扫描能拿到 —— 同样 O(n) 常差一个量级。</text>
</svg>
