<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0f172a">同一段七个参数的加法，两个编译档把变量放在两个地方</text>
  <rect x="32" y="54" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="72" font-size="13" fill="#64748b">-O0 把已经在寄存器里的参数先写回栈，用的时候再读回来；-O2 全程不碰栈，只有第 7 个参数必须读。</text>

  <rect x="36" y="96" width="460" height="310" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="56" y="122" font-size="14" font-weight="bold" fill="#b91c1c">-O0：六次 store 加六次 load</text>

  <rect x="60" y="138" width="60" height="26" rx="4" fill="#fee2e2"/>
  <text x="90" y="155" font-size="10" font-family="Consolas, monospace" fill="#b91c1c" text-anchor="middle">rdi</text>
  <rect x="128" y="138" width="60" height="26" rx="4" fill="#fee2e2"/>
  <text x="158" y="155" font-size="10" font-family="Consolas, monospace" fill="#b91c1c" text-anchor="middle">rsi</text>
  <rect x="196" y="138" width="60" height="26" rx="4" fill="#fee2e2"/>
  <text x="226" y="155" font-size="10" font-family="Consolas, monospace" fill="#b91c1c" text-anchor="middle">rdx</text>
  <rect x="264" y="138" width="60" height="26" rx="4" fill="#fee2e2"/>
  <text x="294" y="155" font-size="10" font-family="Consolas, monospace" fill="#b91c1c" text-anchor="middle">rcx</text>
  <rect x="332" y="138" width="60" height="26" rx="4" fill="#fee2e2"/>
  <text x="362" y="155" font-size="10" font-family="Consolas, monospace" fill="#b91c1c" text-anchor="middle">r8</text>
  <rect x="400" y="138" width="60" height="26" rx="4" fill="#fee2e2"/>
  <text x="430" y="155" font-size="10" font-family="Consolas, monospace" fill="#b91c1c" text-anchor="middle">r9</text>
  <text x="56" y="155" font-size="10.5" fill="#b91c1c">寄存器</text>

  <line x1="90" y1="164" x2="90" y2="196" stroke="#ef4444" stroke-width="1.6" marker-end="url(#ar1)"/>
  <line x1="158" y1="164" x2="158" y2="196" stroke="#ef4444" stroke-width="1.6" marker-end="url(#ar1)"/>
  <line x1="226" y1="164" x2="226" y2="196" stroke="#ef4444" stroke-width="1.6" marker-end="url(#ar1)"/>
  <line x1="294" y1="164" x2="294" y2="196" stroke="#ef4444" stroke-width="1.6" marker-end="url(#ar1)"/>
  <line x1="362" y1="164" x2="362" y2="196" stroke="#ef4444" stroke-width="1.6" marker-end="url(#ar1)"/>
  <line x1="430" y1="164" x2="430" y2="196" stroke="#ef4444" stroke-width="1.6" marker-end="url(#ar1)"/>
  <text x="246" y="186" font-size="10.5" fill="#dc2626" text-anchor="middle">6 次 movq %reg, -N(%rbp)</text>

  <rect x="60" y="204" width="60" height="26" rx="4" fill="#fee2e2"/>
  <text x="90" y="221" font-size="10" font-family="Consolas, monospace" fill="#b91c1c" text-anchor="middle">-8</text>
  <rect x="128" y="204" width="60" height="26" rx="4" fill="#fee2e2"/>
  <text x="158" y="221" font-size="10" font-family="Consolas, monospace" fill="#b91c1c" text-anchor="middle">-16</text>
  <rect x="196" y="204" width="60" height="26" rx="4" fill="#fee2e2"/>
  <text x="226" y="221" font-size="10" font-family="Consolas, monospace" fill="#b91c1c" text-anchor="middle">-24</text>
  <rect x="264" y="204" width="60" height="26" rx="4" fill="#fee2e2"/>
  <text x="294" y="221" font-size="10" font-family="Consolas, monospace" fill="#b91c1c" text-anchor="middle">-32</text>
  <rect x="332" y="204" width="60" height="26" rx="4" fill="#fee2e2"/>
  <text x="362" y="221" font-size="10" font-family="Consolas, monospace" fill="#b91c1c" text-anchor="middle">-40</text>
  <rect x="400" y="204" width="60" height="26" rx="4" fill="#fee2e2"/>
  <text x="430" y="221" font-size="10" font-family="Consolas, monospace" fill="#b91c1c" text-anchor="middle">-48</text>
  <text x="56" y="221" font-size="10.5" fill="#b91c1c">栈槽</text>

  <line x1="90" y1="230" x2="90" y2="266" stroke="#ef4444" stroke-width="1.6" marker-end="url(#ar1)"/>
  <line x1="158" y1="230" x2="158" y2="266" stroke="#ef4444" stroke-width="1.6" marker-end="url(#ar1)"/>
  <line x1="226" y1="230" x2="226" y2="266" stroke="#ef4444" stroke-width="1.6" marker-end="url(#ar1)"/>
  <line x1="294" y1="230" x2="294" y2="266" stroke="#ef4444" stroke-width="1.6" marker-end="url(#ar1)"/>
  <line x1="362" y1="230" x2="362" y2="266" stroke="#ef4444" stroke-width="1.6" marker-end="url(#ar1)"/>
  <line x1="430" y1="230" x2="430" y2="266" stroke="#ef4444" stroke-width="1.6" marker-end="url(#ar1)"/>

  <rect x="60" y="274" width="400" height="42" rx="6" fill="#fecaca" stroke="#ef4444" stroke-width="1.2"/>
  <text x="260" y="300" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">六次 load 之后才开始加</text>

  <text x="56" y="342" font-size="12" fill="#7f1d1d">共 12 次访存；第 7 个参数 g 从 16(%rbp) 读，是第 13 次。</text>
  <text x="56" y="366" font-size="12" fill="#7f1d1d">慢的不是加法，是这 12 次搬运。</text>

  <rect x="504" y="96" width="460" height="310" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="524" y="122" font-size="14" font-weight="bold" fill="#15803d">-O2：零次访存</text>

  <rect x="528" y="138" width="60" height="26" rx="4" fill="#dcfce7"/>
  <text x="558" y="155" font-size="10" font-family="Consolas, monospace" fill="#15803d" text-anchor="middle">rdi</text>
  <rect x="596" y="138" width="60" height="26" rx="4" fill="#dcfce7"/>
  <text x="626" y="155" font-size="10" font-family="Consolas, monospace" fill="#15803d" text-anchor="middle">rsi</text>
  <rect x="664" y="138" width="60" height="26" rx="4" fill="#dcfce7"/>
  <text x="694" y="155" font-size="10" font-family="Consolas, monospace" fill="#15803d" text-anchor="middle">rdx</text>
  <rect x="732" y="138" width="60" height="26" rx="4" fill="#dcfce7"/>
  <text x="762" y="155" font-size="10" font-family="Consolas, monospace" fill="#15803d" text-anchor="middle">rcx</text>
  <rect x="800" y="138" width="60" height="26" rx="4" fill="#dcfce7"/>
  <text x="830" y="155" font-size="10" font-family="Consolas, monospace" fill="#15803d" text-anchor="middle">r8</text>
  <rect x="868" y="138" width="60" height="26" rx="4" fill="#dcfce7"/>
  <text x="898" y="155" font-size="10" font-family="Consolas, monospace" fill="#15803d" text-anchor="middle">r9</text>
  <text x="524" y="155" font-size="10.5" fill="#15803d">寄存器</text>

  <line x1="558" y1="164" x2="558" y2="266" stroke="#22c55e" stroke-width="1.6" marker-end="url(#ar2)"/>
  <line x1="626" y1="164" x2="626" y2="266" stroke="#22c55e" stroke-width="1.6" marker-end="url(#ar2)"/>
  <line x1="694" y1="164" x2="694" y2="266" stroke="#22c55e" stroke-width="1.6" marker-end="url(#ar2)"/>
  <line x1="762" y1="164" x2="762" y2="266" stroke="#22c55e" stroke-width="1.6" marker-end="url(#ar2)"/>
  <line x1="830" y1="164" x2="830" y2="266" stroke="#22c55e" stroke-width="1.6" marker-end="url(#ar2)"/>
  <line x1="898" y1="164" x2="898" y2="266" stroke="#22c55e" stroke-width="1.6" marker-end="url(#ar2)"/>
  <text x="728" y="210" font-size="11" fill="#16a34a" text-anchor="middle">addq 直接吃寄存器</text>

  <rect x="528" y="274" width="400" height="42" rx="6" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.2"/>
  <text x="728" y="300" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">六次 addq / leaq，一条访存都没有</text>

  <text x="524" y="342" font-size="12" fill="#14532d">只有第 7 个参数 g 要读一次：movq 8(%rsp), %rax。</text>
  <text x="524" y="366" font-size="12" fill="#14532d">连 push %rbp 都没有，帧指针被省掉了。</text>

  <defs>
    <marker id="ar1" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#ef4444"/>
    </marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#22c55e"/>
    </marker>
  </defs>
</svg>
