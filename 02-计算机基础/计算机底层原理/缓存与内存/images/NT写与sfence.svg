<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#64748b"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">普通写要读回来，NT 写只写不读：sfence 的账由位置决定</text>
  <rect x="32" y="52" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="70" font-size="13" fill="#64748b">256 MB 数组写一遍；NT = 非临时写，数据进写合并缓冲、绕开缓存与 RFO。</text>

  <rect x="32" y="90" width="936" height="192" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="48" y="124" font-size="13" font-weight="bold" fill="#0f172a">普通写（WB）</text>
  <text x="48" y="142" font-size="11" fill="#64748b">读改写</text>
  <rect x="150" y="104" width="190" height="56" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="245" y="127" font-size="12" fill="#1e40af" text-anchor="middle">① RFO 读旧行</text>
  <text x="245" y="147" font-size="10" fill="#1e40af" text-anchor="middle">未命中先读进缓存</text>
  <rect x="400" y="104" width="190" height="56" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="495" y="127" font-size="12" fill="#1e40af" text-anchor="middle">② 改缓存行</text>
  <text x="495" y="147" font-size="10" fill="#1e40af" text-anchor="middle">拿到独占才能写</text>
  <rect x="650" y="104" width="190" height="56" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="745" y="127" font-size="12" fill="#1e40af" text-anchor="middle">③ 写回内存</text>
  <text x="745" y="147" font-size="10" fill="#1e40af" text-anchor="middle">稍后自然发生</text>
  <line x1="340" y1="132" x2="400" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="590" y1="132" x2="650" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="48" y="180" font-size="11" fill="#b45309">总线流量：读一遍 + 写一遍 = 两份</text>

  <text x="48" y="216" font-size="13" font-weight="bold" fill="#0f172a">NT 写</text>
  <text x="48" y="234" font-size="11" fill="#64748b">只写不读</text>
  <rect x="150" y="196" width="190" height="56" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="245" y="219" font-size="12" fill="#166534" text-anchor="middle">① 写合并缓冲</text>
  <text x="245" y="239" font-size="10" fill="#166534" text-anchor="middle">不读旧行、不占独占</text>
  <rect x="400" y="196" width="190" height="56" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="495" y="219" font-size="12" fill="#166534" text-anchor="middle">② 凑满整行</text>
  <text x="495" y="239" font-size="10" fill="#166534" text-anchor="middle">整行一次写内存</text>
  <rect x="650" y="196" width="190" height="56" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="745" y="219" font-size="12" fill="#92400e" text-anchor="middle">③ sfence 等排空</text>
  <text x="745" y="239" font-size="10" fill="#92400e" text-anchor="middle">唯一的排序手段</text>
  <line x1="340" y1="224" x2="400" y2="224" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="590" y1="224" x2="650" y2="224" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="48" y="272" font-size="11" fill="#166534">总线流量：只有写，省掉 RFO 的那次读</text>

  <rect x="32" y="298" width="936" height="188" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="322" font-size="12" font-weight="bold" fill="#0f172a">256 MB 写带宽（GB/s，五轮取最好）</text>

  <text x="48" y="355" font-size="12" fill="#334155">普通写（WB）</text>
  <rect x="230" y="340" width="231" height="22" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="467" y="356" font-size="11" fill="#1e40af">8.54</text>

  <text x="48" y="393" font-size="12" fill="#334155">NT + 末尾 sfence</text>
  <rect x="230" y="378" width="549" height="22" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="785" y="394" font-size="11" font-weight="bold" fill="#166534">20.34</text>
  <text x="500" y="369" font-size="11" font-weight="bold" fill="#166534">省掉 RFO：2.4 倍</text>

  <text x="48" y="431" font-size="12" fill="#334155">NT + 每条 sfence</text>
  <rect x="230" y="416" width="15" height="22" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <text x="251" y="432" font-size="11" font-weight="bold" fill="#991b1b">0.57</text>
  <text x="300" y="432" font-size="11" font-weight="bold" fill="#b91c1c">同一条指令，位置不同差 36 倍</text>

  <line x1="230" y1="452" x2="900" y2="452" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <line x1="500" y1="446" x2="500" y2="458" stroke="#cbd5e1"/>
  <line x1="770" y1="446" x2="770" y2="458" stroke="#cbd5e1"/>
  <text x="222" y="470" font-size="10" fill="#64748b">0</text>
  <text x="489" y="470" font-size="10" fill="#64748b">10</text>
  <text x="759" y="470" font-size="10" fill="#64748b">20</text>

  <rect x="32" y="500" width="936" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="44" y="522" font-size="12" fill="#1e40af">sfence 单价 = 前面欠的账：普通写语境 2.4 ns（3.1），NT 语境每次约 56 ns（按 32 字节一批摊销）。</text>
  <text x="44" y="544" font-size="12" fill="#1e40af">大块、一次性、写完不再读的数据可换 2.4 倍带宽；小对象不要用 —— 缓冲填不满就刷，下一次读还要回内存。</text>
</svg>
