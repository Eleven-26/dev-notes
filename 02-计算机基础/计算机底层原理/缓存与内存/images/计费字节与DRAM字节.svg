<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <text x="40" y="46" font-family="sans-serif" font-size="17" font-weight="bold" fill="#333333">计费字节与 DRAM 实际流量：同一台机器、同一份 256 MB 数据</text>

  <rect x="40" y="62" width="16" height="16" fill="#9dc3e6"/>
  <text x="64" y="76" font-family="sans-serif" font-size="14" fill="#444444">计费字节（通常报的 GB/s）</text>
  <rect x="280" y="62" width="16" height="16" fill="#2f6fba"/>
  <text x="304" y="76" font-family="sans-serif" font-size="14" fill="#444444">DRAM 流量（RFO 模型推算）</text>

  <line x1="60" y1="460" x2="960" y2="460" stroke="#999999" stroke-width="1"/>

  <rect x="90" y="301" width="55" height="159" fill="#9dc3e6"/>
  <rect x="151" y="301" width="55" height="159" fill="#2f6fba"/>
  <text x="90" y="290" font-family="sans-serif" font-size="13" fill="#1f4e79">10.6</text>
  <text x="151" y="290" font-family="sans-serif" font-size="13" fill="#1f4e79">10.6</text>
  <text x="148" y="486" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle">读</text>

  <rect x="270" y="313" width="55" height="147" fill="#9dc3e6"/>
  <rect x="331" y="166" width="55" height="294" fill="#2f6fba"/>
  <text x="270" y="302" font-family="sans-serif" font-size="13" fill="#1f4e79">9.8</text>
  <text x="331" y="155" font-family="sans-serif" font-size="13" fill="#1f4e79">19.6</text>
  <text x="328" y="486" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle">写</text>

  <rect x="450" y="283" width="55" height="177" fill="#9dc3e6"/>
  <rect x="511" y="194" width="55" height="266" fill="#2f6fba"/>
  <text x="450" y="272" font-family="sans-serif" font-size="13" fill="#1f4e79">11.8</text>
  <text x="511" y="183" font-family="sans-serif" font-size="13" fill="#1f4e79">17.7</text>
  <text x="508" y="486" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle">拷贝</text>

  <rect x="630" y="269" width="55" height="191" fill="#9dc3e6"/>
  <rect x="691" y="205" width="55" height="255" fill="#2f6fba"/>
  <text x="630" y="258" font-family="sans-serif" font-size="13" fill="#1f4e79">12.7</text>
  <text x="691" y="194" font-family="sans-serif" font-size="13" fill="#1f4e79">17.0</text>
  <text x="688" y="486" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle">三数组</text>

  <rect x="810" y="181" width="55" height="279" fill="#9dc3e6"/>
  <rect x="871" y="181" width="55" height="279" fill="#2f6fba"/>
  <text x="810" y="170" font-family="sans-serif" font-size="13" fill="#1f4e79">18.6</text>
  <text x="871" y="170" font-family="sans-serif" font-size="13" fill="#1f4e79">18.6</text>
  <text x="868" y="486" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle">NT 拷贝</text>

  <text x="40" y="524" font-family="sans-serif" font-size="15" fill="#333333">写与拷贝的深色柱几乎是浅色的两倍：普通写要先按行读进来（RFO），拷贝再读一遍源。</text>
  <text x="40" y="546" font-family="sans-serif" font-size="15" fill="#333333">NT 拷贝两根柱等高，说明它省掉了 RFO；五档换算后都落在 17~19.6 GB/s。</text>

  <rect x="40" y="558" width="920" height="32" rx="6" fill="#fff8e6" stroke="#e6c26a"/>
  <text x="56" y="579" font-family="sans-serif" font-size="14" fill="#5a4a1f">注意：深色柱是推算值，本机无 uncore PMU，读不到内存控制器计数器。</text>
</svg>
