<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>

  <text x="40" y="44" font-family="sans-serif" font-size="17" font-weight="bold" fill="#333333">单线程、同一块 64 MB 区域：每次依赖加载的摊薄时间</text>
  <text x="40" y="68" font-family="sans-serif" font-size="14" fill="#666666">纵轴单位 ns，取 4 个独立进程各 5 轮的最好值</text>

  <line x1="80" y1="380" x2="940" y2="380" stroke="#999999" stroke-width="1"/>

  <rect x="145" y="111" width="90" height="269" fill="#2f6fba"/>
  <text x="190" y="101" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f4e79" text-anchor="middle">103.6 ns</text>

  <rect x="345" y="246" width="90" height="134" fill="#4a8fd4"/>
  <text x="390" y="236" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f4e79" text-anchor="middle">51.4 ns</text>

  <rect x="545" y="310" width="90" height="70" fill="#79b0e3"/>
  <text x="590" y="300" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f4e79" text-anchor="middle">27.0 ns</text>

  <rect x="745" y="341" width="90" height="39" fill="#9dc3e6"/>
  <text x="790" y="331" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f4e79" text-anchor="middle">15.1 ns</text>

  <text x="190" y="410" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle">1 条链</text>
  <text x="390" y="410" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle">2 条链</text>
  <text x="590" y="410" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle">4 条链</text>
  <text x="790" y="410" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle">8 条链</text>

  <text x="190" y="436" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f6fba" text-anchor="middle">1.0×</text>
  <text x="390" y="436" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f6fba" text-anchor="middle">2.0×</text>
  <text x="590" y="436" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f6fba" text-anchor="middle">3.8×</text>
  <text x="790" y="436" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f6fba" text-anchor="middle">6.9×</text>

  <rect x="40" y="462" width="920" height="56" rx="8" fill="#fff8e6" stroke="#e6c26a"/>
  <text x="60" y="486" font-family="sans-serif" font-size="15" fill="#5a4a1f">8 条链的理想时间是 103.6 ÷ 8 ≈ 12.95 ns，实测 15.1 ns —— 只拿到 6.9 倍。</text>
  <text x="60" y="506" font-family="sans-serif" font-size="15" fill="#5a4a1f">缺的倍率不是软件没写好，是能同时挂起的行填充请求数到了顶。</text>
</svg>
