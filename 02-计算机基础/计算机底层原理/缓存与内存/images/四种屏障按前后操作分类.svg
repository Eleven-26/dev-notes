<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="510" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">四种屏障就是四格：前面做什么 × 后面做什么</text>
  <rect x="32" y="52" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="70" font-size="13" fill="#64748b">屏障名的前半是「前一个操作」，后半是「后一个操作」；访存只有读和写两种，前后各取一个，所以只有四格，没有第五种。</text>

  <rect x="150" y="92" width="320" height="30" rx="6" fill="#f1f5f9"/>
  <rect x="480" y="92" width="320" height="30" rx="6" fill="#f1f5f9"/>
  <text x="310" y="112" font-size="12.5" font-weight="bold" fill="#334155" text-anchor="middle">后面的操作 = Load（读）</text>
  <text x="640" y="112" font-size="12.5" font-weight="bold" fill="#334155" text-anchor="middle">后面的操作 = Store（写）</text>

  <rect x="32" y="120" width="100" height="130" rx="8" fill="#f1f5f9"/>
  <rect x="32" y="262" width="100" height="130" rx="8" fill="#f1f5f9"/>
  <text x="82" y="178" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">前面的</text>
  <text x="82" y="198" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">= Load</text>
  <text x="82" y="320" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">前面的</text>
  <text x="82" y="340" font-size="12" font-weight="bold" fill="#9a3412" text-anchor="middle">= Store</text>

  <rect x="150" y="120" width="320" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="166" y="150" font-size="15" font-weight="bold" fill="#1e40af">LoadLoad</text>
  <text x="166" y="178" font-size="11.5" fill="#334155">挡住：后一个读被提到前一个读之前</text>
  <text x="166" y="202" font-size="11.5" fill="#334155">x86：lfence（5.0~7.0 ns）</text>
  <text x="166" y="228" font-size="11" font-weight="bold" fill="#64748b">acquire 的一半</text>

  <rect x="480" y="120" width="320" height="130" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="496" y="150" font-size="15" font-weight="bold" fill="#6d28d9">LoadStore</text>
  <text x="496" y="178" font-size="11.5" fill="#334155">挡住：后一个写被提到前一个读之前</text>
  <text x="496" y="202" font-size="11.5" fill="#334155">x86：无专属指令（硬件本就不重排）</text>
  <text x="496" y="228" font-size="11" font-weight="bold" fill="#6d28d9">acquire 与 release 共用这一格</text>

  <rect x="150" y="262" width="320" height="130" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="166" y="292" font-size="15" font-weight="bold" fill="#b91c1c">StoreLoad</text>
  <text x="166" y="320" font-size="11.5" fill="#334155">挡住：后一个读被提到前一个写之前</text>
  <text x="166" y="344" font-size="11.5" fill="#334155">x86：mfence / lock or（8~15 ns）</text>
  <text x="166" y="370" font-size="11" font-weight="bold" fill="#b91c1c">x86 唯一真会重排的一格，也是唯一要付钱的</text>

  <rect x="480" y="262" width="320" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="496" y="292" font-size="15" font-weight="bold" fill="#0f766e">StoreStore</text>
  <text x="496" y="320" font-size="11.5" fill="#334155">挡住：后一个写被提到前一个写之前</text>
  <text x="496" y="344" font-size="11.5" fill="#334155">x86：sfence（2.4 ns）</text>
  <text x="496" y="370" font-size="11" font-weight="bold" fill="#64748b">release 的一半</text>

  <rect x="32" y="408" width="936" height="86" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="434" font-size="12" fill="#0f172a"><tspan font-weight="bold" fill="#1e40af">acquire</tspan>（读侧）= 上排两格：LoadLoad + LoadStore —— 挡住「后面的操作往前跑」</text>
  <text x="48" y="458" font-size="12" fill="#0f172a"><tspan font-weight="bold" fill="#0f766e">release</tspan>（写侧）= 右列两格：LoadStore + StoreStore —— 挡住「前面的操作往后跑」</text>
  <text x="48" y="482" font-size="12" fill="#0f172a"><tspan font-weight="bold" fill="#b91c1c">seq_cst</tspan>（全序）= 四格全要；x86 上只有 StoreLoad 那一格要真花钱，另外三格的拦截是硬件白送的</text>
</svg>
