<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">屏障的价目表：从 0.4 ns 到 700 ns，跨三个数量级</text>
  <rect x="32" y="52" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="70" font-size="13" fill="#64748b">每档独立进程、2 000 000 次、3 轮取最快；横轴为对数刻度（2.6 GHz，WSL2 容器 nproc=4）。</text>

  <rect x="32" y="92" width="936" height="330" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="48" y="120" font-size="11" font-weight="bold" fill="#64748b">指令</text>
  <text x="210" y="120" font-size="11" font-weight="bold" fill="#64748b">每次耗时（ns，对数刻度）</text>

  <text x="48" y="146" font-size="12" fill="#334155">空循环（基线）</text>
  <rect x="210" y="131" width="13" height="20" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="231" y="146" font-size="12" fill="#1e40af">0.468</text>

  <text x="48" y="179" font-size="12" fill="#334155">movq 写内存</text>
  <rect x="210" y="164" width="12" height="20" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="230" y="179" font-size="12" fill="#1e40af">0.460 · 与空循环同档，边际成本≈0</text>

  <text x="48" y="212" font-size="12" fill="#334155">sfence</text>
  <rect x="210" y="197" width="156" height="20" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="374" y="212" font-size="12" fill="#166534">2.459</text>

  <text x="48" y="245" font-size="12" fill="#334155">lfence</text>
  <rect x="210" y="230" width="223" height="20" rx="3" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="441" y="245" font-size="12" fill="#3730a3">5.369</text>

  <text x="48" y="278" font-size="12" fill="#334155">lock addq</text>
  <rect x="210" y="263" width="253" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="471" y="278" font-size="12" fill="#92400e">7.683</text>

  <text x="48" y="311" font-size="12" fill="#334155">xchgq 写内存</text>
  <rect x="210" y="296" width="251" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="469" y="311" font-size="12" fill="#92400e">7.493 · 隐式加锁，与 lock 系列同价</text>

  <text x="48" y="344" font-size="12" fill="#334155">lock orq $0</text>
  <rect x="210" y="329" width="252" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="470" y="344" font-size="12" fill="#92400e">7.570 · 编译器用它实现 full fence</text>

  <text x="48" y="377" font-size="12" fill="#334155">mfence</text>
  <rect x="210" y="362" width="312" height="20" rx="3" fill="#fed7aa" stroke="#f97316"/>
  <text x="530" y="377" font-size="12" fill="#9a3412">15.210 · 同样是 full fence，贵一倍</text>

  <text x="48" y="410" font-size="12" fill="#334155">cpuid</text>
  <rect x="210" y="395" width="640" height="20" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <text x="858" y="410" font-size="12" fill="#991b1b">725.57</text>

  <rect x="32" y="430" width="936" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="44" y="448" font-size="12" fill="#1e40af">纵向比较只看倍数：写 0.46 → 屏障 2.5~16.6（5~36 倍）→ 全串行化 725（1576 倍）。cpuid 被虚拟化放大，只作上界。</text>
</svg>
