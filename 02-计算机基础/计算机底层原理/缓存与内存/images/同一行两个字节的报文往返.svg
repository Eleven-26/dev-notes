<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#64748b"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">同一行的两个字节，两个核轮流改：每改一次都要走一轮报文</text>
  <rect x="32" y="52" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="70" font-size="13" fill="#64748b">一致性协议的单位是「行」不是「字节」，所以改 a 和改 b 走的是完全相同的一套流程。</text>

  <rect x="32" y="92" width="936" height="318" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="360" y="104" width="140" height="28" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="404" y="123" font-size="13" font-weight="bold" fill="#1e40af">核 0</text>
  <rect x="700" y="104" width="140" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="744" y="123" font-size="13" font-weight="bold" fill="#92400e">核 1</text>
  <line x1="430" y1="136" x2="430" y2="396" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <line x1="770" y1="136" x2="770" y2="396" stroke="#cbd5e1" stroke-dasharray="4 4"/>

  <text x="44" y="162" font-size="12" fill="#334155">① 核0 要写 a，行是 S 态</text>
  <text x="44" y="178" font-size="11" fill="#64748b">发 Invalidate 让对端作废</text>
  <line x1="430" y1="160" x2="762" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="44" y="212" font-size="12" fill="#334155">② 核1 把这份标成 I 并回确认</text>
  <text x="44" y="228" font-size="11" fill="#64748b">核0 拿到独占，写 a</text>
  <line x1="770" y1="210" x2="438" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="44" y="262" font-size="12" fill="#334155">③ 核1 要写 b，自己那份已是 I</text>
  <text x="44" y="278" font-size="11" fill="#64748b">发 RFO，把整行要过来</text>
  <line x1="770" y1="260" x2="438" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="44" y="312" font-size="12" fill="#334155">④ 核0 交出行、降为 S/I</text>
  <text x="44" y="328" font-size="11" fill="#64748b">核1 得 M，写 b</text>
  <line x1="430" y1="310" x2="762" y2="310" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="44" y="362" font-size="12" font-weight="bold" fill="#991b1b">⑤ 核0 再写 a：自己那份又变 I</text>
  <text x="44" y="378" font-size="11" fill="#991b1b">整轮从 ① 重来，字节不同也一样</text>
  <line x1="430" y1="360" x2="762" y2="360" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>

  <rect x="32" y="420" width="936" height="48" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="44" y="440" font-size="12" fill="#991b1b">每一次「写自己那个字节」都触发一次所有权转移，代价几十纳秒 —— 这就是 37~46 ns/op 的来源。</text>
  <text x="44" y="458" font-size="12" fill="#991b1b">M/E 态下写是零代价的；只有 S/I 态才要报文。所以「只读数据」不会伪共享，读可以多核同时持有 S。</text>
</svg>
