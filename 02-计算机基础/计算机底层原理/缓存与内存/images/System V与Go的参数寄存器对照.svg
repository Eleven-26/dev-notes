<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0f172a">同一颗 x86-64，C 用 6 个参数寄存器，Go 用 9 个</text>
  <rect x="32" y="54" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="72" font-size="13" fill="#64748b">参数走寄存器不是硬件事实，是一份 ABI 约定；表读错了，读出来的参数值就是错的，而且不会报错。</text>

  <rect x="36" y="96" width="440" height="230" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="56" y="122" font-size="14" font-weight="bold" fill="#1d4ed8">System V AMD64（Linux 上的 C）</text>
  <text x="56" y="142" font-size="11.5" fill="#3b82f6">整型 / 指针 6 个；浮点另走 xmm0~xmm7</text>

  <rect x="60" y="156" width="76" height="30" rx="5" fill="#dbeafe"/>
  <text x="98" y="176" font-size="11.5" font-family="Consolas, monospace" fill="#1e3a8a" text-anchor="middle">rdi</text>
  <rect x="148" y="156" width="76" height="30" rx="5" fill="#dbeafe"/>
  <text x="186" y="176" font-size="11.5" font-family="Consolas, monospace" fill="#1e3a8a" text-anchor="middle">rsi</text>
  <rect x="236" y="156" width="76" height="30" rx="5" fill="#dbeafe"/>
  <text x="274" y="176" font-size="11.5" font-family="Consolas, monospace" fill="#1e3a8a" text-anchor="middle">rdx</text>
  <text x="60" y="152" font-size="10" fill="#64748b">1</text>
  <text x="148" y="152" font-size="10" fill="#64748b">2</text>
  <text x="236" y="152" font-size="10" fill="#64748b">3</text>

  <rect x="60" y="200" width="76" height="30" rx="5" fill="#dbeafe"/>
  <text x="98" y="220" font-size="11.5" font-family="Consolas, monospace" fill="#1e3a8a" text-anchor="middle">rcx</text>
  <rect x="148" y="200" width="76" height="30" rx="5" fill="#dbeafe"/>
  <text x="186" y="220" font-size="11.5" font-family="Consolas, monospace" fill="#1e3a8a" text-anchor="middle">r8</text>
  <rect x="236" y="200" width="76" height="30" rx="5" fill="#dbeafe"/>
  <text x="274" y="220" font-size="11.5" font-family="Consolas, monospace" fill="#1e3a8a" text-anchor="middle">r9</text>
  <text x="60" y="196" font-size="10" fill="#64748b">4</text>
  <text x="148" y="196" font-size="10" fill="#64748b">5</text>
  <text x="236" y="196" font-size="10" fill="#64748b">6</text>

  <rect x="60" y="248" width="330" height="34" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="225" y="270" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">第 7 个起：压栈（16(%rbp)）</text>

  <text x="60" y="308" font-size="11.5" fill="#1e3a8a">返回值：rax（整型，高位在 rdx）/ xmm0（浮点）</text>

  <rect x="504" y="96" width="460" height="230" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="524" y="122" font-size="14" font-weight="bold" fill="#15803d">Go ABIInternal（Go 1.17 起）</text>
  <text x="524" y="142" font-size="11.5" fill="#16a34a">9 个整型寄存器，浮点也走通用寄存器</text>

  <rect x="524" y="156" width="86" height="28" rx="5" fill="#dcfce7"/>
  <text x="567" y="175" font-size="11.5" font-family="Consolas, monospace" fill="#14532d" text-anchor="middle">AX</text>
  <rect x="622" y="156" width="86" height="28" rx="5" fill="#dcfce7"/>
  <text x="665" y="175" font-size="11.5" font-family="Consolas, monospace" fill="#14532d" text-anchor="middle">BX</text>
  <rect x="720" y="156" width="86" height="28" rx="5" fill="#dcfce7"/>
  <text x="763" y="175" font-size="11.5" font-family="Consolas, monospace" fill="#14532d" text-anchor="middle">CX</text>
  <text x="524" y="152" font-size="10" fill="#64748b">1</text>
  <text x="622" y="152" font-size="10" fill="#64748b">2</text>
  <text x="720" y="152" font-size="10" fill="#64748b">3</text>

  <rect x="524" y="190" width="86" height="28" rx="5" fill="#dcfce7"/>
  <text x="567" y="209" font-size="11.5" font-family="Consolas, monospace" fill="#14532d" text-anchor="middle">DI</text>
  <rect x="622" y="190" width="86" height="28" rx="5" fill="#dcfce7"/>
  <text x="665" y="209" font-size="11.5" font-family="Consolas, monospace" fill="#14532d" text-anchor="middle">SI</text>
  <rect x="720" y="190" width="86" height="28" rx="5" fill="#dcfce7"/>
  <text x="763" y="209" font-size="11.5" font-family="Consolas, monospace" fill="#14532d" text-anchor="middle">R8</text>
  <text x="524" y="186" font-size="10" fill="#64748b">4</text>
  <text x="622" y="186" font-size="10" fill="#64748b">5</text>
  <text x="720" y="186" font-size="10" fill="#64748b">6</text>

  <rect x="524" y="224" width="86" height="28" rx="5" fill="#dcfce7"/>
  <text x="567" y="243" font-size="11.5" font-family="Consolas, monospace" fill="#14532d" text-anchor="middle">R9</text>
  <rect x="622" y="224" width="86" height="28" rx="5" fill="#dcfce7"/>
  <text x="665" y="243" font-size="11.5" font-family="Consolas, monospace" fill="#14532d" text-anchor="middle">R10</text>
  <rect x="720" y="224" width="86" height="28" rx="5" fill="#dcfce7"/>
  <text x="763" y="243" font-size="11.5" font-family="Consolas, monospace" fill="#14532d" text-anchor="middle">R11</text>
  <text x="524" y="220" font-size="10" fill="#64748b">7</text>
  <text x="622" y="220" font-size="10" fill="#64748b">8</text>
  <text x="720" y="220" font-size="10" fill="#64748b">9</text>

  <rect x="524" y="262" width="386" height="34" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="717" y="284" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">第 10 个起：压栈（main.j+8(SP)）</text>

  <text x="524" y="318" font-size="11.5" fill="#14532d">返回值也从这 9 个里出，不额外占用</text>

  <rect x="36" y="344" width="928" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="368" font-size="13" font-weight="bold" fill="#0f172a">易失与非易失，两套分工完全不同</text>
  <rect x="56" y="380" width="420" height="34" rx="5" fill="#fef2f2"/>
  <text x="266" y="402" font-size="12" fill="#b91c1c" text-anchor="middle">caller-saved：rax rcx rdx rsi rdi r8~r11（调用者自己存）</text>
  <rect x="492" y="380" width="452" height="34" rx="5" fill="#eff6ff"/>
  <text x="718" y="402" font-size="12" fill="#1d4ed8" text-anchor="middle">callee-saved：rbx rbp r12~r15（被调者 push/pop）</text>
  <text x="56" y="426" font-size="11.5" fill="#64748b">本篇 6.1 的 spill 现场开头那 6 个 push，就是在保存 callee-saved。</text>

  <rect x="36" y="448" width="928" height="66" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text x="56" y="472" font-size="13" font-weight="bold" fill="#92400e">最容易算错的一处：8 字节之差</text>
  <text x="56" y="494" font-size="12" fill="#a16207">压了 rbp 时第 7 个参数在 16(%rbp)，省略帧指针时在 8(%rsp)——差的就是「返回地址」与「旧 rbp」这两格。</text>

</svg>
