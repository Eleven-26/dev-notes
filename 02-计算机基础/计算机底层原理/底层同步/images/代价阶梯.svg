<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">代价阶梯：从普通写到系统调用，横轴是对数刻度</text>
  <rect x="32" y="52" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="70" font-size="13" fill="#64748b">同机同进程连测，单位 ns/次，3 轮取区间。横轴每格 10 倍，否则前三级会挤成一条线。</text>

  <line x1="120" y1="360" x2="920" y2="360" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="360" x2="120" y2="140" stroke="#94a3b8" stroke-width="1.5"/>

  <line x1="315" y1="360" x2="315" y2="356" stroke="#cbd5e1"/>
  <line x1="510" y1="360" x2="510" y2="356" stroke="#cbd5e1"/>
  <line x1="705" y1="360" x2="705" y2="356" stroke="#cbd5e1"/>
  <text x="120" y="378" font-size="10" fill="#94a3b8" text-anchor="middle">1</text>
  <text x="315" y="378" font-size="10" fill="#94a3b8" text-anchor="middle">10</text>
  <text x="510" y="378" font-size="10" fill="#94a3b8" text-anchor="middle">100</text>
  <text x="705" y="378" font-size="10" fill="#94a3b8" text-anchor="middle">1000</text>
  <text x="880" y="378" font-size="10" fill="#94a3b8" text-anchor="middle">ns</text>

  <rect x="178" y="306" width="26" height="54" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="191" y="298" font-size="11" fill="#1e40af" text-anchor="middle">2.3</text>

  <rect x="283" y="284" width="26" height="76" rx="3" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="296" y="276" font-size="11" fill="#1e40af" text-anchor="middle">8</text>

  <rect x="380" y="264" width="26" height="96" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="393" y="256" font-size="11" fill="#92400e" text-anchor="middle">25</text>

  <rect x="737" y="191" width="26" height="169" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <text x="750" y="183" font-size="11" fill="#991b1b" text-anchor="middle">1700</text>

  <line x1="204" y1="306" x2="283" y2="284" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <line x1="309" y1="284" x2="380" y2="264" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <line x1="406" y1="264" x2="737" y2="191" stroke="#94a3b8" stroke-dasharray="4 3"/>

  <text x="750" y="230" font-size="11" fill="#991b1b" text-anchor="middle">×740</text>

  <text x="191" y="398" font-size="11" fill="#334155" text-anchor="middle">volatile ++</text>
  <text x="296" y="398" font-size="11" fill="#334155" text-anchor="middle">lock xadd</text>
  <text x="393" y="398" font-size="11" fill="#334155" text-anchor="middle">无竞争互斥</text>
  <text x="750" y="398" font-size="11" fill="#334155" text-anchor="middle">futex 系统调用</text>

  <text x="191" y="416" font-size="10" fill="#94a3b8" text-anchor="middle">普通读写</text>
  <text x="296" y="416" font-size="10" fill="#94a3b8" text-anchor="middle">硅：一条指令</text>
  <text x="393" y="416" font-size="10" fill="#94a3b8" text-anchor="middle">壳：两条指令</text>
  <text x="750" y="416" font-size="10" fill="#94a3b8" text-anchor="middle">内核：一次陷入</text>

  <rect x="32" y="434" width="936" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="44" y="452" font-size="12" fill="#1e40af">这张阶梯解释了三个设计：互斥为什么压成两条原子指令、自旋上限为什么只有 4 次、分片为什么能把吞吐拉起来。</text>
</svg>
