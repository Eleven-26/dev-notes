<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0f172a">数据竞争不是并列概念，是 hb 定义的补集</text>
  <rect x="32" y="54" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="72" font-size="13" fill="#64748b">先问「有没有边」，再问「有没有写」——三个条件不是并列清单，是一条二分路径；红色那一块就是数据竞争。</text>

  <rect x="40" y="104" width="392" height="312" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="54" y="126" font-size="13" font-weight="bold" fill="#334155">所有「两个访问」</text>

  <rect x="56" y="138" width="168" height="262" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="140" y="162" font-size="12.5" font-weight="bold" fill="#166534" text-anchor="middle">有 hb 边</text>
  <text x="140" y="192" font-size="12" fill="#15803d" text-anchor="middle">有保证</text>
  <text x="140" y="216" font-size="11" fill="#4b5563" text-anchor="middle">读必须看到哪些写</text>
  <text x="140" y="234" font-size="11" fill="#4b5563" text-anchor="middle">由这条边决定</text>
  <text x="140" y="268" font-size="11" fill="#64748b" text-anchor="middle">条件：同位置？有没有边？</text>
  <text x="140" y="286" font-size="11" fill="#64748b" text-anchor="middle">前两问到这里就结束了</text>
  <text x="140" y="322" font-size="11" fill="#94a3b8" text-anchor="middle">1.1 的 200/200 落在这里</text>
  <text x="140" y="340" font-size="11" fill="#94a3b8" text-anchor="middle">它也可以无边，见右侧</text>

  <rect x="232" y="138" width="182" height="262" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="323" y="162" font-size="12.5" font-weight="bold" fill="#334155" text-anchor="middle">无 hb 边（不可比）</text>

  <rect x="246" y="176" width="154" height="104" rx="5" fill="#fee2e2" stroke="#f87171"/>
  <text x="323" y="198" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">至少一个写</text>
  <text x="323" y="222" font-size="12.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">数据竞争</text>
  <text x="323" y="244" font-size="11" fill="#b91c1c" text-anchor="middle">规范上是未定义行为</text>
  <text x="323" y="264" font-size="11" fill="#b91c1c" text-anchor="middle">-race 报的就是这一块</text>

  <rect x="246" y="288" width="154" height="90" rx="5" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="323" y="310" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">两个都是读</text>
  <text x="323" y="332" font-size="12" fill="#a16207" text-anchor="middle">不算竞争</text>
  <text x="323" y="354" font-size="11" fill="#a16207" text-anchor="middle">无保证，但也没东西可破坏</text>

  <rect x="448" y="104" width="256" height="180" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="462" y="126" font-size="13" font-weight="bold" fill="#0f172a">三个条件，缺一不可</text>
  <text x="462" y="152" font-size="12" fill="#334155">1　同一个内存位置</text>
  <text x="474" y="172" font-size="11" fill="#64748b">不同元素不算同一位置</text>
  <text x="462" y="198" font-size="12" fill="#334155">2　至少一个是写</text>
  <text x="474" y="218" font-size="11" fill="#64748b">读读不算，所以只读数据免同步</text>
  <text x="462" y="244" font-size="12" fill="#334155">3　之间没有被 hb 排序</text>
  <text x="474" y="264" font-size="11" fill="#64748b">是「没有边」，不是「同时发生」</text>

  <rect x="448" y="296" width="256" height="120" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="462" y="318" font-size="13" font-weight="bold" fill="#9a3412">一条边就能翻案（第 3.4 节实测）</text>
  <text x="462" y="344" font-size="11.5" font-family="Consolas, monospace" fill="#7c2d12">x = 1　在锁内　→ 不报</text>
  <text x="462" y="368" font-size="11.5" font-family="Consolas, monospace" fill="#7c2d12">y = 2　在锁外　→ 报 1 处</text>
  <text x="462" y="394" font-size="11" fill="#9a3412">同一函数、相隔一行，结论相反</text>

  <rect x="720" y="104" width="240" height="180" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="734" y="126" font-size="13" font-weight="bold" fill="#991b1b">竞争的三种后果</text>
  <text x="734" y="152" font-size="11.5" fill="#b91c1c">① 算出错误结果</text>
  <text x="746" y="170" font-size="10.5" fill="#9f1239">容易被发现</text>
  <text x="734" y="196" font-size="11.5" font-weight="bold" fill="#b91c1c">② 算出正确结果</text>
  <text x="746" y="214" font-size="10.5" fill="#9f1239">最危险：它主动隐藏了自己</text>
  <text x="734" y="240" font-size="11.5" fill="#b91c1c">③ 行为完全偏离</text>
  <text x="746" y="258" font-size="10.5" fill="#9f1239">最难查，现象与代码无关</text>

  <rect x="720" y="296" width="240" height="120" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="734" y="318" font-size="13" font-weight="bold" fill="#0f172a">为什么可以用补集定义</text>
  <text x="734" y="344" font-size="11.5" fill="#334155">若所有访问都可比，</text>
  <text x="734" y="364" font-size="11.5" fill="#334155">「不可比」这一支就是空的，</text>
  <text x="734" y="384" font-size="11.5" fill="#334155">竞争这个概念也就不需要了。</text>
  <text x="734" y="406" font-size="11" fill="#64748b">先有 hb，才谈得上竞争</text>

  <rect x="40" y="432" width="920" height="82" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="56" y="456" font-size="13" font-weight="bold" fill="#92400e">判据：画一条边，看要保护的访问是不是都落在边的两端之内</text>
  <text x="56" y="480" font-size="12.5" fill="#a16207">锁保护的是 Lock 与 Unlock 之间那一段，不是这个函数、也不是这个变量从此安全；channel 保护的是发送之前的写与接收之后的读。</text>
  <text x="56" y="502" font-size="12.5" fill="#a16207">这也是「数据竞争」与「同时发生」的分界：物理上错开一小时也可能竞争，物理上重叠但有边就不是。</text>
</svg>
