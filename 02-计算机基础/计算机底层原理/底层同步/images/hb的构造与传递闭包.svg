<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="po2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="so2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0f172a">两组边都跨不出自己那一层，传递闭包把它们焊成一条链</text>
  <rect x="32" y="54" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="72" font-size="13" fill="#64748b">蓝色实线是程序顺序 po（只在本线程内），橙色虚线是同步顺序 so（只连同步动作）；两端绿色的事件之间没有任何一条直接规则。</text>

  <text x="44" y="134" font-size="13" font-weight="bold" fill="#334155">A</text>
  <text x="44" y="274" font-size="13" font-weight="bold" fill="#334155">B</text>
  <text x="44" y="414" font-size="13" font-weight="bold" fill="#334155">C</text>
  <line x1="70" y1="140" x2="740" y2="140" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="70" y1="280" x2="740" y2="280" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="70" y1="420" x2="740" y2="420" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="96" y="123" width="88" height="34" rx="5" fill="#ecfdf5" stroke="#34d399"/>
  <text x="140" y="145" font-size="12" font-family="Consolas, monospace" fill="#065f46" text-anchor="middle">x = 11</text>
  <rect x="256" y="123" width="88" height="34" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="300" y="145" font-size="12" font-family="Consolas, monospace" fill="#1e40af" text-anchor="middle">c1 &lt;- 1</text>
  <line x1="184" y1="140" x2="252" y2="140" stroke="#2563eb" stroke-width="1.6" marker-end="url(#po2)"/>
  <text x="218" y="132" font-size="10.5" fill="#2563eb" text-anchor="middle">po</text>

  <rect x="256" y="263" width="88" height="34" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="300" y="285" font-size="12" font-family="Consolas, monospace" fill="#1e40af" text-anchor="middle">&lt;- c1</text>
  <rect x="396" y="263" width="88" height="34" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="440" y="285" font-size="12" font-family="Consolas, monospace" fill="#1e40af" text-anchor="middle">y = 22</text>
  <rect x="516" y="263" width="88" height="34" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="560" y="285" font-size="12" font-family="Consolas, monospace" fill="#1e40af" text-anchor="middle">c2 &lt;- 2</text>
  <line x1="344" y1="280" x2="392" y2="280" stroke="#2563eb" stroke-width="1.6" marker-end="url(#po2)"/>
  <line x1="484" y1="280" x2="512" y2="280" stroke="#2563eb" stroke-width="1.6" marker-end="url(#po2)"/>
  <text x="368" y="272" font-size="10.5" fill="#2563eb" text-anchor="middle">po</text>
  <text x="498" y="272" font-size="10.5" fill="#2563eb" text-anchor="middle">po</text>

  <rect x="516" y="403" width="88" height="34" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="560" y="425" font-size="12" font-family="Consolas, monospace" fill="#1e40af" text-anchor="middle">&lt;- c2</text>
  <rect x="646" y="403" width="88" height="34" rx="5" fill="#ecfdf5" stroke="#34d399"/>
  <text x="690" y="425" font-size="12" font-family="Consolas, monospace" fill="#065f46" text-anchor="middle">读 x</text>
  <line x1="604" y1="420" x2="642" y2="420" stroke="#2563eb" stroke-width="1.6" marker-end="url(#po2)"/>
  <text x="623" y="412" font-size="10.5" fill="#2563eb" text-anchor="middle">po</text>

  <line x1="300" y1="157" x2="300" y2="259" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#so2)"/>
  <text x="312" y="212" font-size="10.5" fill="#b45309">so：发送 hb 对应接收</text>
  <line x1="560" y1="297" x2="560" y2="399" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#so2)"/>
  <text x="572" y="352" font-size="10.5" fill="#b45309">so：第二个 channel</text>

  <rect x="752" y="106" width="208" height="112" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="766" y="128" font-size="12.5" font-weight="bold" fill="#991b1b">闭包之前：五条孤立的边</text>
  <text x="766" y="150" font-size="11.5" fill="#b91c1c">po：A 内 1 条、B 内 2 条、C 内 1 条</text>
  <text x="766" y="170" font-size="11.5" fill="#b91c1c">so：两条（两个 channel 各一）</text>
  <text x="766" y="196" font-size="11.5" fill="#b91c1c">没有一条从 A 直达 C</text>
  <text x="766" y="212" font-size="11" fill="#64748b">查表查不到「A 的写 hb C 的读」</text>

  <rect x="752" y="232" width="208" height="112" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="766" y="254" font-size="12.5" font-weight="bold" fill="#166534">闭包之后：一条可推的链</text>
  <text x="766" y="276" font-size="11.5" fill="#15803d">x = 11 → c1 发送</text>
  <text x="766" y="296" font-size="11.5" fill="#15803d">→ c1 接收 → y = 22</text>
  <text x="766" y="316" font-size="11.5" fill="#15803d">→ c2 发送 → c2 接收 → 读 x</text>
  <text x="766" y="336" font-size="11" fill="#166534">每段合法，整条才成立</text>

  <rect x="752" y="358" width="208" height="86" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="766" y="380" font-size="12.5" font-weight="bold" fill="#0f172a">实测</text>
  <text x="766" y="402" font-size="11.5" fill="#334155">完整链：2000 轮 0 异常</text>
  <text x="766" y="422" font-size="11.5" fill="#334155">-race：0 次报告</text>
  <text x="766" y="440" font-size="11" fill="#64748b">断链版结果同样 2000/2000</text>

  <rect x="40" y="466" width="926" height="74" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="56" y="490" font-size="13" font-weight="bold" fill="#92400e">闭包决定的是「几条规则能不能串起来用」</text>
  <text x="56" y="512" font-size="12.5" fill="#a16207">没有闭包，规则表里每条都只对「两个动作」负责，任何超过两跳的推理都不成立；有了它，判断方式从「查有没有这一条」变成「找有没有一条路径」。</text>
  <text x="56" y="532" font-size="12.5" fill="#a16207">断链版把中间那条 so 换成 sleep 之后，路径断了，结果仍然 2000/2000 全对——但那已经是运气，-race 会报。</text>
</svg>
