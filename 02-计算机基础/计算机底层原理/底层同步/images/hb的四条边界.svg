<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0f172a">hb 是一份窄而精确的合同：五格里有四格是「不」</text>
  <rect x="32" y="54" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="72" font-size="13" fill="#64748b">左边一格是它唯一无条件承诺的事，右边四格是它的边界——事故几乎都出在「我以为这条边管到了这里」。</text>

  <rect x="40" y="100" width="176" height="290" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="128" y="126" font-size="11.5" font-weight="bold" fill="#166534" text-anchor="middle">给</text>
  <text x="128" y="158" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">不穿越</text>
  <text x="128" y="186" font-size="11.5" fill="#15803d" text-anchor="middle">读不许看到</text>
  <text x="128" y="204" font-size="11.5" fill="#15803d" text-anchor="middle">被边覆盖掉的写</text>
  <text x="128" y="240" font-size="11" fill="#4b5563" text-anchor="middle">这是 hb 的</text>
  <text x="128" y="258" font-size="11" fill="#4b5563" text-anchor="middle">全部承诺</text>
  <text x="128" y="300" font-size="11" fill="#64748b" text-anchor="middle">有边就成立，</text>
  <text x="128" y="318" font-size="11" fill="#64748b" text-anchor="middle">与跑几轮无关</text>

  <rect x="224" y="100" width="176" height="290" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="312" y="126" font-size="11.5" font-weight="bold" fill="#92400e" text-anchor="middle">有条件</text>
  <text x="312" y="158" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">一定看到那一个</text>
  <text x="312" y="186" font-size="11.5" fill="#a16207" text-anchor="middle">只在「这组写里</text>
  <text x="312" y="204" font-size="11.5" fill="#a16207" text-anchor="middle">只有它是合法候选」时成立</text>
  <text x="312" y="240" font-size="11" fill="#4b5563" text-anchor="middle">中间若有并发写，</text>
  <text x="312" y="258" font-size="11" fill="#4b5563" text-anchor="middle">读到更新的那个才合法</text>
  <text x="312" y="300" font-size="11" fill="#64748b" text-anchor="middle">「设标志位发布配置」</text>
  <text x="312" y="318" font-size="11" fill="#64748b" text-anchor="middle">最容易栽在这里</text>

  <rect x="408" y="100" width="176" height="290" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="496" y="126" font-size="11.5" font-weight="bold" fill="#991b1b" text-anchor="middle">不</text>
  <text x="496" y="158" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">原子性</text>
  <text x="496" y="186" font-size="11.5" fill="#b91c1c" text-anchor="middle">读-改-写三步</text>
  <text x="496" y="204" font-size="11.5" fill="#b91c1c" text-anchor="middle">不被打断</text>
  <text x="496" y="240" font-size="11" fill="#4b5563" text-anchor="middle">hb 只排名，不打包</text>
  <text x="496" y="258" font-size="11" fill="#4b5563" text-anchor="middle">要不可分割得整段占边</text>
  <text x="496" y="300" font-size="11" font-family="Consolas, monospace" fill="#7f1d1d" text-anchor="middle">393801 / 400000</text>
  <text x="496" y="318" font-size="11" fill="#991b1b" text-anchor="middle">丢 6199（1.55%）</text>

  <rect x="592" y="100" width="176" height="290" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="680" y="126" font-size="11.5" font-weight="bold" fill="#991b1b" text-anchor="middle">不</text>
  <text x="680" y="158" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">位置全覆盖</text>
  <text x="680" y="186" font-size="11.5" fill="#b91c1c" text-anchor="middle">只覆盖这条边</text>
  <text x="680" y="204" font-size="11.5" fill="#b91c1c" text-anchor="middle">跨过的那些访问</text>
  <text x="680" y="240" font-size="11" fill="#4b5563" text-anchor="middle">锁管的是 Lock 到</text>
  <text x="680" y="258" font-size="11" fill="#4b5563" text-anchor="middle">Unlock 之间那一段</text>
  <text x="680" y="300" font-size="11" font-family="Consolas, monospace" fill="#7f1d1d" text-anchor="middle">x 锁内 → 不报</text>
  <text x="680" y="318" font-size="11" font-family="Consolas, monospace" fill="#7f1d1d" text-anchor="middle">y 锁外 → 报 1 处</text>

  <rect x="776" y="100" width="176" height="290" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="864" y="126" font-size="11.5" font-weight="bold" fill="#334155" text-anchor="middle">不在范围内</text>
  <text x="864" y="158" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">跨进程</text>
  <text x="864" y="186" font-size="11.5" fill="#475569" text-anchor="middle">两个进程 mmap</text>
  <text x="864" y="204" font-size="11.5" fill="#475569" text-anchor="middle">同一块共享内存</text>
  <text x="864" y="240" font-size="11" fill="#64748b" text-anchor="middle">语言规范只管本进程</text>
  <text x="864" y="258" font-size="11" fill="#64748b" text-anchor="middle">内的线程与 goroutine</text>
  <text x="864" y="300" font-size="11" fill="#475569" text-anchor="middle">靠 shm 的可见性、</text>
  <text x="864" y="318" font-size="11" fill="#475569" text-anchor="middle">msync 与协议层握手</text>

  <rect x="40" y="410" width="912" height="88" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="434" font-size="13" font-weight="bold" fill="#0f172a">四格「不」不是缺陷，是分工</text>
  <text x="56" y="458" font-size="12.5" fill="#334155">hb 负责「顺序可见性」这一件事，把它做到精确；原子性归 lock 前缀与 CAS，区间覆盖归你怎么摆锁的位置，跨进程归操作系统与你的协议。</text>
  <text x="56" y="480" font-size="12.5" fill="#334155">所以「加了同步就安全」是错的：加了同步只是买到了第一格，其余四格各自还得单独交代。</text>
</svg>
