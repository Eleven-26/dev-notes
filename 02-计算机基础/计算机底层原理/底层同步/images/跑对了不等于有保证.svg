<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0f172a">同一个程序，两种结局：结果对不等于有保证</text>
  <rect x="32" y="54" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="72" font-size="13" fill="#64748b">左边是代码，中间是两次执行的读写交错，右边把「结果」与「保证」拆成两列——四个象限里最危险的是「结果对、无保证」那一格。</text>

  <rect x="40" y="100" width="300" height="150" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="126" font-size="12.5" font-family="Consolas, monospace" fill="#0f172a">x = 0</text>
  <text x="56" y="152" font-size="12.5" font-family="Consolas, monospace" fill="#0f172a">go func() { x = 42 }()</text>
  <text x="56" y="178" font-size="12.5" font-family="Consolas, monospace" fill="#0f172a">time.Sleep(200µs)</text>
  <text x="56" y="204" font-size="12.5" font-family="Consolas, monospace" fill="#0f172a">print(x)</text>
  <text x="56" y="234" font-size="12" fill="#64748b">四条语句，没有一条是同步动作</text>

  <rect x="370" y="104" width="330" height="66" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="382" y="124" font-size="12.5" font-weight="bold" fill="#166534">第 1 次执行：窗口粗，先后分明</text>
  <line x1="382" y1="148" x2="688" y2="148" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arw1)"/>
  <circle cx="420" cy="148" r="4.5" fill="#2563eb"/>
  <text x="420" y="140" font-size="11" fill="#1e40af" text-anchor="middle">写</text>
  <circle cx="620" cy="148" r="4.5" fill="#2563eb"/>
  <text x="620" y="140" font-size="11" fill="#1e40af" text-anchor="middle">读</text>
  <text x="520" y="164" font-size="11" fill="#64748b" text-anchor="middle">间隔 200 000 ns</text>

  <rect x="370" y="182" width="330" height="66" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="382" y="202" font-size="12.5" font-weight="bold" fill="#991b1b">第 2 次执行：窗口细，两者交错</text>
  <line x1="382" y1="226" x2="688" y2="226" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arw1)"/>
  <circle cx="470" cy="226" r="4.5" fill="#dc2626"/>
  <text x="462" y="218" font-size="11" fill="#b91c1c" text-anchor="middle">写</text>
  <circle cx="482" cy="226" r="4.5" fill="#dc2626"/>
  <text x="496" y="218" font-size="11" fill="#b91c1c" text-anchor="middle">读</text>
  <text x="560" y="242" font-size="11" fill="#64748b" text-anchor="middle">真实竞态窗口 ~16 ns</text>

  <text x="370" y="274" font-size="12.5" fill="#334155">结果：200/200 读到 42　｜　-race 照样报 DATA RACE</text>

  <rect x="728" y="104" width="238" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="742" y="124" font-size="12" font-weight="bold" fill="#0f172a">四个象限</text>
  <rect x="742" y="132" width="210" height="24" rx="3" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="750" y="148" font-size="10.5" fill="#166534">有边 + 结果对　正常</text>
  <rect x="742" y="160" width="210" height="24" rx="3" fill="#fee2e2" stroke="#f87171"/>
  <text x="750" y="176" font-size="10.5" font-weight="bold" fill="#991b1b">无边 + 结果对　最危险</text>
  <rect x="742" y="188" width="210" height="24" rx="3" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="750" y="204" font-size="10.5" fill="#92400e">无边 + 结果错　容易被发现</text>
  <rect x="742" y="216" width="210" height="24" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="750" y="232" font-size="10.5" fill="#475569">有边 + 结果错　不可能</text>

  <rect x="40" y="290" width="926" height="86" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="314" font-size="13" font-weight="bold" fill="#0f172a">两个判断必须分开问</text>
  <text x="56" y="338" font-size="12.5" fill="#334155">「这次跑出来对不对」——主语是这一次执行。查它要靠跑，而跑只能证明「这一次没踩到」。</text>
  <text x="56" y="360" font-size="12.5" fill="#334155">「这段代码有没有保证」——主语是这份代码。查它要看规范里有没有那条边，与跑多少次无关。</text>

  <rect x="40" y="392" width="926" height="88" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="56" y="416" font-size="13" font-weight="bold" fill="#92400e">本篇的六个实测都在同一台机器上，可控且可复现，但它们只能说明「这一次执行」</text>
  <text x="56" y="440" font-size="12.5" fill="#a16207">1.1 的 200/200、1.2 的 2000/2000 都是「结果全对」；同一份代码的 -race 分别是报与不报。</text>
  <text x="56" y="462" font-size="12.5" fill="#a16207">所以后面七节不再讨论「跑几轮」，只讨论「边在哪」——那才是可以被证明的东西。</text>
</svg>
