<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="510" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0f172a">同一组输入，CF 与 OF 可以只置一个</text>
  <rect x="32" y="54" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="72" font-size="13" fill="#64748b">CF 问「无符号看进位了吗」，OF 问「有符号看符号位对吗」。两个问题，两个答案。</text>

  <rect x="50" y="100" width="280" height="320" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <rect x="70" y="118" width="240" height="30" rx="6" fill="#fee2e2"/>
  <text x="190" y="139" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">CF = 0 　OF = 1</text>
  <text x="190" y="182" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">127 + 1</text>
  <text x="190" y="216" font-size="13" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">0111 1111</text>
  <text x="190" y="238" font-size="13" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">+ 0000 0001</text>
  <text x="190" y="262" font-size="13" font-family="Consolas, monospace" fill="#b91c1c" text-anchor="middle">= 1000 0000</text>
  <line x1="80" y1="278" x2="300" y2="278" stroke="#fecaca" stroke-width="1"/>
  <text x="190" y="302" font-size="12.5" fill="#7f1d1d" text-anchor="middle">无符号：127 + 1 = 128</text>
  <text x="190" y="322" font-size="12.5" fill="#7f1d1d" text-anchor="middle">没超过 255 → 没进位</text>
  <text x="190" y="352" font-size="12.5" fill="#7f1d1d" text-anchor="middle">有符号：正 + 正 = 负</text>
  <text x="190" y="372" font-size="12.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">只有 OF 报溢出</text>
  <text x="190" y="398" font-size="12" fill="#b91c1c" text-anchor="middle">编译器发 jo</text>

  <rect x="360" y="100" width="280" height="320" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="380" y="118" width="240" height="30" rx="6" fill="#dbeafe"/>
  <text x="500" y="139" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">CF = 1 　OF = 0</text>
  <text x="500" y="182" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">−1 + 1</text>
  <text x="500" y="216" font-size="13" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">1111 1111</text>
  <text x="500" y="238" font-size="13" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">+ 0000 0001</text>
  <text x="500" y="262" font-size="13" font-family="Consolas, monospace" fill="#1d4ed8" text-anchor="middle">= 1 0000 0000</text>
  <line x1="390" y1="278" x2="610" y2="278" stroke="#bfdbfe" stroke-width="1"/>
  <text x="500" y="302" font-size="12.5" fill="#1e3a8a" text-anchor="middle">无符号：255 + 1 = 256</text>
  <text x="500" y="322" font-size="12.5" fill="#1e3a8a" text-anchor="middle">最高位进位出去 → CF</text>
  <text x="500" y="352" font-size="12.5" fill="#1e3a8a" text-anchor="middle">有符号：−1 + 1 = 0</text>
  <text x="500" y="372" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">只有 CF 报进位</text>
  <text x="500" y="398" font-size="12" fill="#1d4ed8" text-anchor="middle">编译器发 jc</text>

  <rect x="670" y="100" width="280" height="320" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <rect x="690" y="118" width="240" height="30" rx="6" fill="#ffedd5"/>
  <text x="810" y="139" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="middle">CF = 1 　OF = 1</text>
  <text x="810" y="182" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">−128 + (−1)</text>
  <text x="810" y="216" font-size="13" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">1000 0000</text>
  <text x="810" y="238" font-size="13" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">+ 1111 1111</text>
  <text x="810" y="262" font-size="13" font-family="Consolas, monospace" fill="#c2410c" text-anchor="middle">= 1 0111 1111</text>
  <line x1="700" y1="278" x2="920" y2="278" stroke="#fed7aa" stroke-width="1"/>
  <text x="810" y="302" font-size="12.5" fill="#7c2d12" text-anchor="middle">无符号：128 + 255 = 383</text>
  <text x="810" y="322" font-size="12.5" fill="#7c2d12" text-anchor="middle">进位出去 → CF</text>
  <text x="810" y="352" font-size="12.5" fill="#7c2d12" text-anchor="middle">有符号：−128 − 1 = −129</text>
  <text x="810" y="372" font-size="12.5" font-weight="bold" fill="#c2410c" text-anchor="middle">两个都报</text>
  <text x="810" y="398" font-size="12" fill="#c2410c" text-anchor="middle">jc 与 jo 都跳</text>

  <rect x="50" y="440" width="900" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="462" font-size="13" font-weight="bold" fill="#0f172a">所以「会不会溢出」这句话，必须先问按有符号还是按无符号</text>
  <text x="70" y="482" font-size="12.5" fill="#64748b">本篇 4.1 节在 8 位域实测六组，三种分叉形态全部出现；OF 的判定式是「两操作数同号、结果异号」。</text>
</svg>
