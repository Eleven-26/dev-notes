<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="424" viewBox="0 0 1000 424">
  <rect x="0" y="0" width="1000" height="424" fill="#ffffff"/>
  <rect x="40" y="16" width="920" height="56" fill="#ffffff"/>
  <text x="60" y="42" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#0f172a">往 imul 的 3 周期等待里塞无关指令：4 条免费，之后按端口收费</text>
  <text x="60" y="64" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">每步 = 1 条 imul（延迟 3）+ 若干条互不依赖的 add；柱是实测，虚线是按端口算的理论值</text>

  <rect x="40" y="80" width="920" height="268" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="76" y1="300" x2="940" y2="300" stroke="#cbd5e1"/>

  <!-- 不填时的基线 -->
  <line x1="76" y1="251.9" x2="940" y2="251.9" stroke="#fca5a5" stroke-dasharray="5 4"/>
  <text x="420" y="122" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#b91c1c">红虚线 = 不填时的 3.04</text>

  <rect x="85" y="251.9" width="50" height="48.1" rx="4" fill="#0d9488"/>
  <text x="85" y="244" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#0f766e">3.04</text>

  <rect x="182.5" y="251.9" width="50" height="48.1" rx="4" fill="#0d9488"/>
  <text x="182.5" y="244" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#0f766e">3.04</text>

  <rect x="280" y="242.8" width="50" height="57.2" rx="4" fill="#0d9488"/>
  <text x="280" y="235" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#0f766e">3.61</text>

  <rect x="377.5" y="223.7" width="50" height="76.3" rx="4" fill="#0d9488"/>
  <text x="377.5" y="216" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#0f766e">4.82</text>

  <rect x="475" y="203.3" width="50" height="96.7" rx="4" fill="#0d9488"/>
  <text x="475" y="195" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#0f766e">6.11</text>

  <rect x="572.5" y="184.6" width="50" height="115.4" rx="4" fill="#0d9488"/>
  <text x="572.5" y="177" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#0f766e">7.29</text>

  <rect x="670" y="160.7" width="50" height="139.3" rx="4" fill="#0d9488"/>
  <text x="670" y="153" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#0f766e">8.80</text>

  <rect x="767.5" y="136.3" width="50" height="163.7" rx="4" fill="#0d9488"/>
  <text x="767.5" y="128" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#0f766e">10.34</text>

  <rect x="865" y="119.8" width="50" height="180.2" rx="4" fill="#0d9488"/>
  <text x="865" y="112" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#0f766e">11.38</text>

  <!-- 理论折线 -->
  <polyline points="110,252.5 207.5,252.5 305,252.5 402.5,236.7 500,215.6 597.5,194.4 695,173.3 792.5,152.2 890,131.1"
            fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 4"/>
  <circle cx="110" cy="252.5" r="3.5" fill="#64748b"/>
  <circle cx="207.5" cy="252.5" r="3.5" fill="#64748b"/>
  <circle cx="305" cy="252.5" r="3.5" fill="#64748b"/>
  <circle cx="402.5" cy="236.7" r="3.5" fill="#64748b"/>
  <circle cx="500" cy="215.6" r="3.5" fill="#64748b"/>
  <circle cx="597.5" cy="194.4" r="3.5" fill="#64748b"/>
  <circle cx="695" cy="173.3" r="3.5" fill="#64748b"/>
  <circle cx="792.5" cy="152.2" r="3.5" fill="#64748b"/>
  <circle cx="890" cy="131.1" r="3.5" fill="#64748b"/>
  <text x="420" y="140" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#475569">灰虚线 = 按端口算的 max(3, 4n/3)</text>

  <text x="98" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">0</text>
  <text x="188" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">4</text>
  <text x="286" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">8</text>
  <text x="380" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">12</text>
  <text x="478" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">16</text>
  <text x="575" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">20</text>
  <text x="673" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">24</text>
  <text x="770" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">28</text>
  <text x="868" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">32</text>
  <text x="430" y="338" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">每步插入的无关 add 条数</text>

  <rect x="60" y="350" width="880" height="58" rx="6" fill="#fef3c7"/>
  <text x="76" y="366" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#92400e">前 4 条填进去，柱子一点没动——这 4 条的执行被完全藏进了 imul 的等待里；8 条起开始爬坡</text>
  <text x="76" y="382" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#a16207">斜率约 0.33 周期每条，不是 0.28：imul 占住 p1，填充的 add 只剩 3 个端口</text>
  <text x="76" y="398" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#a16207">免费条数的公式：等待周期 3 × 剩余端口 3 = 9 条，实测在 4~8 条之间开始收费</text>
</svg>
