<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="474" viewBox="0 0 1000 474">
  <rect x="0" y="0" width="1000" height="474" fill="#ffffff"/>
  <rect x="40" y="16" width="920" height="56" fill="#ffffff"/>
  <text x="60" y="42" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#0f172a">预测器的历史覆盖台阶：周期 64 以内全中，128 起每次翻转都要赔</text>
  <text x="60" y="64" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">纵轴是「每次翻转平均赔几次」，对数刻度（每格 ×10）；横轴是分支走向的周期</text>

  <rect x="40" y="80" width="920" height="320" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- 两个区间底色 -->
  <rect x="100" y="105" width="501" height="265" fill="#f0fdfa"/>
  <rect x="601" y="105" width="339" height="265" fill="#fef2f2"/>

  <!-- 网格 -->
  <line x1="100" y1="149" x2="940" y2="149" stroke="#e2e8f0"/>
  <line x1="100" y1="212" x2="940" y2="212" stroke="#e2e8f0"/>
  <line x1="100" y1="274" x2="940" y2="274" stroke="#e2e8f0"/>
  <line x1="100" y1="337" x2="940" y2="337" stroke="#e2e8f0"/>
  <text x="92" y="153" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">1</text>
  <text x="92" y="216" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">0.1</text>
  <text x="92" y="278" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">0.01</text>
  <text x="92" y="341" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">0.001</text>

  <line x1="100" y1="370" x2="940" y2="370" stroke="#cbd5e1"/>

  <!-- 台阶分界 -->
  <line x1="601" y1="105" x2="601" y2="370" stroke="#f59e0b" stroke-dasharray="4 4"/>
  <text x="601" y="98" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#b45309">容量台阶落在这两档之间</text>

  <!-- 折线 -->
  <polyline points="130,362 216,351 301,328 387,306 472,283 558,259 644,133 729,117 815,117 900,118" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="130" cy="362" r="5" fill="#0f766e"/>
  <circle cx="216" cy="351" r="5" fill="#0f766e"/>
  <circle cx="301" cy="328" r="5" fill="#0f766e"/>
  <circle cx="387" cy="306" r="5" fill="#0f766e"/>
  <circle cx="472" cy="283" r="5" fill="#0f766e"/>
  <circle cx="558" cy="259" r="5" fill="#0f766e"/>
  <circle cx="644" cy="133" r="5" fill="#dc2626"/>
  <circle cx="729" cy="117" r="5" fill="#dc2626"/>
  <circle cx="815" cy="117" r="5" fill="#dc2626"/>
  <circle cx="900" cy="118" r="5" fill="#dc2626"/>

  <!-- 数值 -->
  <text x="130" y="348" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#0f766e">0.0004</text>
  <text x="216" y="337" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#0f766e">0.0006</text>
  <text x="301" y="314" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#0f766e">0.0014</text>
  <text x="387" y="292" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#0f766e">0.0031</text>
  <text x="472" y="269" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#0f766e">0.0074</text>
  <text x="546" y="241" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" font-weight="700" fill="#0f766e">0.0175</text>
  <text x="632" y="128" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">1.82</text>
  <text x="729" y="136" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#b91c1c">3.24</text>
  <text x="815" y="136" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#b91c1c">3.22</text>
  <text x="900" y="137" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#b91c1c">3.13</text>

  <!-- 区间说明 -->
  <text x="330" y="200" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f766e">周期 ≤64：整个走向模式被记住</text>
  <text x="330" y="220" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#14b8a6">绝大部分翻转一分不赔</text>
  <text x="790" y="200" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#b91c1c">周期 ≥128：历史盖不住了</text>
  <text x="790" y="220" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#ef4444">每次翻转要赔 1.8 ~ 3.2 次</text>

  <text x="612" y="252" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#b45309">这一档跳了 104 倍</text>

  <!-- 横轴 -->
  <text x="130" y="392" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">2</text>
  <text x="216" y="392" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">4</text>
  <text x="301" y="392" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">8</text>
  <text x="387" y="392" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">16</text>
  <text x="472" y="392" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">32</text>
  <text x="558" y="392" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">64</text>
  <text x="644" y="392" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">128</text>
  <text x="729" y="392" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">256</text>
  <text x="815" y="392" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">512</text>
  <text x="900" y="392" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0f172a">1024</text>
  <text x="940" y="96" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#94a3b8">横轴：走向周期</text>

  <rect x="60" y="414" width="880" height="44" rx="6" fill="#fef3c7"/>
  <text x="76" y="432" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#92400e">同样一份代码，只改分支走向的周期：0.0175 次 → 1.82 次，中间没有过渡</text>
  <text x="76" y="450" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#a16207">误判「百分比」会骗人：周期越长翻转次数越少，总误判数反而下降，必须除以翻转次数</text>
</svg>
