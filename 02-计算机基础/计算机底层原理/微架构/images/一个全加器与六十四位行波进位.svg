<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0f172a">一个全加器，串成 64 位的行波进位</text>
  <rect x="32" y="54" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="72" font-size="13" fill="#64748b">单个全加器只有 5 个门；问题不在加法，在于第 63 位必须等第 0 位的进位一路传上来。</text>

  <text x="60" y="112" font-size="14" font-weight="bold" fill="#334155">① 全加器：三进两出</text>

  <rect x="150" y="130" width="120" height="96" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="210" y="172" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">FA</text>
  <text x="210" y="196" font-size="12" fill="#3b82f6" text-anchor="middle">5 个门</text>

  <rect x="40" y="136" width="46" height="24" rx="4" fill="#f1f5f9"/>
  <text x="63" y="153" font-size="12" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">a</text>
  <rect x="40" y="168" width="46" height="24" rx="4" fill="#f1f5f9"/>
  <text x="63" y="185" font-size="12" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">b</text>
  <rect x="40" y="200" width="46" height="24" rx="4" fill="#fef3c7"/>
  <text x="63" y="217" font-size="12" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">cin</text>

  <line x1="86" y1="148" x2="148" y2="148" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="86" y1="180" x2="148" y2="180" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="86" y1="212" x2="148" y2="212" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowO)"/>

  <line x1="270" y1="150" x2="330" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="270" y1="206" x2="330" y2="206" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowO)"/>
  <rect x="332" y="138" width="46" height="24" rx="4" fill="#f1f5f9"/>
  <text x="355" y="155" font-size="12" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">s</text>
  <rect x="332" y="194" width="46" height="24" rx="4" fill="#fef3c7"/>
  <text x="355" y="211" font-size="12" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">cout</text>

  <rect x="420" y="132" width="540" height="92" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="440" y="158" font-size="13" font-family="Consolas, monospace" fill="#0f172a">s    = a ^ b ^ cin</text>
  <text x="440" y="184" font-size="13" font-family="Consolas, monospace" fill="#0f172a">cout = (a &amp; b) | (a &amp; cin) | (b &amp; cin)</text>
  <text x="440" y="210" font-size="12.5" fill="#64748b">第二行是「三取二」：三个输入里有两个为 1，就进位。</text>

  <text x="60" y="272" font-size="14" font-weight="bold" fill="#334155">② 把进位串起来：cout 接下一位的 cin</text>

  <rect x="60" y="296" width="86" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="103" y="318" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">FA0</text>
  <text x="103" y="336" font-size="11" fill="#3b82f6" text-anchor="middle">第 0 位</text>

  <rect x="196" y="296" width="86" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="239" y="318" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">FA1</text>
  <text x="239" y="336" font-size="11" fill="#3b82f6" text-anchor="middle">第 1 位</text>

  <rect x="332" y="296" width="86" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="375" y="318" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">FA2</text>
  <text x="375" y="336" font-size="11" fill="#3b82f6" text-anchor="middle">第 2 位</text>

  <text x="456" y="328" font-size="18" font-weight="bold" fill="#94a3b8" text-anchor="middle">· · ·</text>

  <rect x="520" y="296" width="86" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="563" y="318" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">FA62</text>
  <text x="563" y="336" font-size="11" fill="#3b82f6" text-anchor="middle">第 62 位</text>

  <rect x="656" y="296" width="86" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="699" y="318" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">FA63</text>
  <text x="699" y="336" font-size="11" fill="#3b82f6" text-anchor="middle">第 63 位</text>

  <line x1="146" y1="322" x2="194" y2="322" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrowO)"/>
  <line x1="282" y1="322" x2="330" y2="322" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrowO)"/>
  <line x1="418" y1="322" x2="470" y2="322" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 4"/>
  <line x1="500" y1="322" x2="518" y2="322" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrowO)"/>
  <line x1="606" y1="322" x2="654" y2="322" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrowO)"/>

  <text x="60" y="376" font-size="12.5" fill="#92400e">黄线是进位链：cout 只能等 cin 到了才出结果，一位一位传。</text>

  <rect x="60" y="392" width="840" height="60" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="76" y="416" font-size="13" font-weight="bold" fill="#b91c1c">延迟与位宽成正比</text>
  <text x="76" y="438" font-size="12.5" fill="#7f1d1d">每级约 3 个门；64 级串起来远超 1 个周期（0.408 ns），所以真实 CPU 用超前进位把 log 级压回来。</text>

  <rect x="60" y="466" width="840" height="38" rx="8" fill="#f8fafc"/>
  <text x="76" y="490" font-size="12.5" fill="#475569">本篇 3.2 节用手写 64 轮循环对拍硬件加法：20 万组，和与进位均 0 组不一致。</text>

  <defs>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowO" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#d97706"/>
    </marker>
  </defs>
</svg>
