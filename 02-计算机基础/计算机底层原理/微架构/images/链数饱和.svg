<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="404" viewBox="0 0 1000 404">
  <rect x="0" y="0" width="1000" height="404" fill="#ffffff"/>
  <rect x="40" y="16" width="920" height="56" fill="#ffffff"/>
  <text x="60" y="42" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#0f172a">同时开几条互相独立的加法链：4 条之后不再变快</text>
  <text x="60" y="64" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">每轮执行的加法总数固定 64 条，只改「这 64 条分成几条互不依赖的链」</text>

  <rect x="40" y="80" width="920" height="256" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="76" y1="300" x2="940" y2="300" stroke="#cbd5e1"/>

  <!-- 平台虚线 -->
  <line x1="460" y1="248.5" x2="930" y2="248.5" stroke="#5eead4" stroke-dasharray="5 4"/>
  <text x="590" y="242" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#0f766e">平台 0.279</text>

  <!-- 端口用尽分隔线 -->
  <line x1="440" y1="96" x2="440" y2="300" stroke="#f59e0b" stroke-dasharray="4 4"/>

  <rect x="120" y="116" width="90" height="184" rx="5" fill="#dc2626"/>
  <text x="120" y="108" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">1.013</text>

  <rect x="290" y="205.3" width="90" height="94.7" rx="5" fill="#ea580c"/>
  <text x="290" y="197" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#9a3412">0.521</text>

  <rect x="460" y="247.8" width="90" height="52.2" rx="5" fill="#2563eb"/>
  <text x="460" y="240" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#1e40af">0.287</text>

  <rect x="630" y="249.3" width="90" height="50.7" rx="5" fill="#2563eb"/>
  <text x="630" y="241" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#1e40af">0.279</text>

  <rect x="800" y="249.3" width="90" height="50.7" rx="5" fill="#2563eb"/>
  <text x="800" y="241" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#1e40af">0.279</text>

  <text x="150" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0f172a">1 条链</text>
  <text x="320" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0f172a">2 条链</text>
  <text x="490" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0f172a">4 条链</text>
  <text x="660" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0f172a">8 条链</text>
  <text x="830" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0f172a">16 条链</text>

  <text x="446" y="92" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#b45309">4 个 ALU 端口用完</text>

  <rect x="60" y="346" width="880" height="44" rx="6" fill="#fef3c7"/>
  <text x="76" y="364" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#92400e">1 → 2 → 4 一路对折（1.013 / 0.521 / 0.287），第 5 条链就没有端口可用了</text>
  <text x="76" y="382" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#a16207">8 条比 4 条还略快一点：四条刚好占满端口，调度一失准就空转；多给几条作备选更稳</text>
</svg>
