<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>
  <rect x="40" y="16" width="920" height="56" fill="#ffffff"/>
  <text x="60" y="42" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#0f172a">同一个 ns 值乘 2.45，就是核心周期数</text>
  <text x="60" y="64" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">横条按对数排；右边是按本篇实测的 2.45 GHz 折出来的周期数，不是按标称 2.60 折算的值</text>

  <rect x="40" y="88" width="920" height="270" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="350" y1="100" x2="350" y2="334" stroke="#e2e8f0"/>

  <!-- 1 一个周期 -->
  <text x="60" y="132" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#0f172a">1 个时钟周期</text>
  <text x="330" y="132" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#475569">0.408 ns</text>
  <rect x="350" y="114" width="4" height="24" rx="2" fill="#93c5fd"/>
  <text x="940" y="132" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#1e40af">1 周期</text>

  <!-- 2 clock_gettime -->
  <text x="60" y="178" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#0f172a">clock_gettime</text>
  <text x="330" y="178" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#475569">31 ns</text>
  <rect x="350" y="160" width="106" height="24" rx="4" fill="#60a5fa"/>
  <text x="940" y="178" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#1e40af">76 周期</text>

  <!-- 3 cpuid -->
  <text x="60" y="224" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#0f172a">cpuid（全串行化）</text>
  <text x="330" y="224" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#475569">675 ns</text>
  <rect x="350" y="206" width="182" height="24" rx="4" fill="#2563eb"/>
  <text x="940" y="224" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#1e40af">1,654 周期</text>

  <!-- 4 线程切换 -->
  <text x="60" y="270" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#0f172a">线程切换</text>
  <text x="330" y="270" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#475569">9.4 µs</text>
  <rect x="350" y="252" width="247" height="24" rx="4" fill="#ea580c"/>
  <text x="940" y="270" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#9a3412">23,030 周期</text>

  <!-- 5 时间片 -->
  <text x="60" y="316" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#0f172a">时间片</text>
  <text x="330" y="316" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#475569">2.1 ms</text>
  <rect x="350" y="298" width="380" height="24" rx="4" fill="#7c3aed"/>
  <text x="940" y="316" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#5b21b6">5,145,000 周期</text>

  <rect x="40" y="370" width="920" height="46" rx="6" fill="#eff6ff"/>
  <text x="60" y="390" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1e40af">最左与最右差七个数量级：一个周期 0.408 ns，一个时间片 2.1 ms = 514.5 万周期</text>
  <text x="60" y="408" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#475569">改用标称 2.60 GHz 会把每一档都多算 6%；跨轮比较只比倍数，倍数不受这个系数影响</text>
</svg>
