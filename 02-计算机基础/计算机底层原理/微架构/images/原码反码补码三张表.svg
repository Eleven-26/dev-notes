<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0f172a">三张表摆在一起：只有补码的 16 个码点一个不重复</text>
  <rect x="32" y="54" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="72" font-size="13" fill="#64748b">原码与反码各浪费一个码点给负零，代价是范围少一个数；补码没有负零，多出的那个码点留给 −8。</text>

  <rect x="60" y="98" width="130" height="34" rx="5" fill="#e2e8f0"/>
  <rect x="200" y="98" width="170" height="34" rx="5" fill="#e2e8f0"/>
  <rect x="380" y="98" width="170" height="34" rx="5" fill="#e2e8f0"/>
  <rect x="560" y="98" width="170" height="34" rx="5" fill="#dbeafe"/>
  <rect x="740" y="98" width="190" height="34" rx="5" fill="#e2e8f0"/>
  <text x="125" y="120" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">真值</text>
  <text x="285" y="120" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">原码</text>
  <text x="465" y="120" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">反码</text>
  <text x="645" y="120" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">补码</text>
  <text x="835" y="120" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">补码当无符号读</text>

  <rect x="60" y="140" width="870" height="40" fill="#f1f5f9"/>
  <text x="125" y="165" font-size="13" fill="#334155" text-anchor="middle">+0</text>
  <text x="285" y="165" font-size="14" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">0000</text>
  <text x="465" y="165" font-size="14" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">0000</text>
  <text x="645" y="165" font-size="14" font-family="Consolas, monospace" fill="#1e40af" text-anchor="middle">0000</text>
  <text x="835" y="165" font-size="13" fill="#334155" text-anchor="middle">0</text>

  <rect x="60" y="182" width="870" height="40" fill="#fef2f2"/>
  <text x="125" y="207" font-size="13" fill="#b91c1c" text-anchor="middle">−0</text>
  <text x="285" y="207" font-size="14" font-family="Consolas, monospace" fill="#b91c1c" text-anchor="middle">1000</text>
  <text x="465" y="207" font-size="14" font-family="Consolas, monospace" fill="#b91c1c" text-anchor="middle">1111</text>
  <text x="645" y="207" font-size="13" fill="#94a3b8" text-anchor="middle">不存在</text>
  <text x="835" y="207" font-size="13" fill="#94a3b8" text-anchor="middle">—</text>

  <rect x="60" y="224" width="870" height="40" fill="#f1f5f9"/>
  <text x="125" y="249" font-size="13" fill="#334155" text-anchor="middle">+1</text>
  <text x="285" y="249" font-size="14" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">0001</text>
  <text x="465" y="249" font-size="14" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">0001</text>
  <text x="645" y="249" font-size="14" font-family="Consolas, monospace" fill="#1e40af" text-anchor="middle">0001</text>
  <text x="835" y="249" font-size="13" fill="#334155" text-anchor="middle">1</text>

  <rect x="60" y="266" width="870" height="40" fill="#f1f5f9"/>
  <text x="125" y="291" font-size="13" fill="#334155" text-anchor="middle">−1</text>
  <text x="285" y="291" font-size="14" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">1001</text>
  <text x="465" y="291" font-size="14" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">1110</text>
  <text x="645" y="291" font-size="14" font-family="Consolas, monospace" fill="#1e40af" text-anchor="middle">1111</text>
  <text x="835" y="291" font-size="13" fill="#334155" text-anchor="middle">15</text>

  <rect x="60" y="308" width="870" height="40" fill="#f1f5f9"/>
  <text x="125" y="333" font-size="13" fill="#334155" text-anchor="middle">+3</text>
  <text x="285" y="333" font-size="14" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">0011</text>
  <text x="465" y="333" font-size="14" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">0011</text>
  <text x="645" y="333" font-size="14" font-family="Consolas, monospace" fill="#1e40af" text-anchor="middle">0011</text>
  <text x="835" y="333" font-size="13" fill="#334155" text-anchor="middle">3</text>

  <rect x="60" y="350" width="870" height="40" fill="#f1f5f9"/>
  <text x="125" y="375" font-size="13" fill="#334155" text-anchor="middle">−3</text>
  <text x="285" y="375" font-size="14" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">1011</text>
  <text x="465" y="375" font-size="14" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">1100</text>
  <text x="645" y="375" font-size="14" font-family="Consolas, monospace" fill="#1e40af" text-anchor="middle">1101</text>
  <text x="835" y="375" font-size="13" fill="#334155" text-anchor="middle">13</text>

  <rect x="60" y="392" width="870" height="40" fill="#f1f5f9"/>
  <text x="125" y="417" font-size="13" fill="#334155" text-anchor="middle">+7</text>
  <text x="285" y="417" font-size="14" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">0111</text>
  <text x="465" y="417" font-size="14" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">0111</text>
  <text x="645" y="417" font-size="14" font-family="Consolas, monospace" fill="#1e40af" text-anchor="middle">0111</text>
  <text x="835" y="417" font-size="13" fill="#334155" text-anchor="middle">7</text>

  <rect x="60" y="434" width="870" height="40" fill="#f1f5f9"/>
  <text x="125" y="459" font-size="13" fill="#334155" text-anchor="middle">−7</text>
  <text x="285" y="459" font-size="14" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">1111</text>
  <text x="465" y="459" font-size="14" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">1000</text>
  <text x="645" y="459" font-size="14" font-family="Consolas, monospace" fill="#1e40af" text-anchor="middle">1001</text>
  <text x="835" y="459" font-size="13" fill="#334155" text-anchor="middle">9</text>

  <rect x="60" y="476" width="870" height="40" fill="#f0fdf4"/>
  <text x="125" y="501" font-size="13" fill="#15803d" text-anchor="middle">−8</text>
  <text x="285" y="501" font-size="13" fill="#94a3b8" text-anchor="middle">不存在</text>
  <text x="465" y="501" font-size="13" fill="#94a3b8" text-anchor="middle">不存在</text>
  <text x="645" y="501" font-size="14" font-family="Consolas, monospace" fill="#15803d" text-anchor="middle">1000</text>
  <text x="835" y="501" font-size="13" fill="#15803d" text-anchor="middle">8</text>

  <text x="60" y="542" font-size="12.5" fill="#475569">红：原码与反码各有一个负零，加法器要多一次修正。绿：补码用 1000 表示 −8，把浪费的码点收了回来。</text>
</svg>
