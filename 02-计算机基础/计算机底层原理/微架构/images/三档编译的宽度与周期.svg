<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
  <rect x="0" y="0" width="1000" height="400" fill="#ffffff"/>
  <rect x="40" y="16" width="920" height="58" fill="#ffffff"/>
  <text x="60" y="44" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#0f172a">三档编译：一次处理几个元素，与每元素周期</text>
  <text x="60" y="66" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">L1 档（24 KB 工作集）实测；2.592 GHz 换算，1 周期 = 0.386 ns</text>

  <rect x="40" y="84" width="920" height="296" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="60" y="104" width="116" height="52" rx="6" fill="#e2e8f0"/>
  <text x="74" y="126" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#334155">标量</text>
  <text x="74" y="145" font-family="Consolas, monospace" font-size="11" fill="#64748b">gcc -O2</text>

  <rect x="196" y="112" width="40" height="36" rx="4" fill="#94a3b8"/>
  <text x="208" y="136" font-family="Consolas, monospace" font-size="12" fill="#ffffff">a</text>
  <text x="250" y="136" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">一次 1 个 int32（4 B）</text>

  <text x="600" y="126" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#0f172a">2.10 周期/元素</text>
  <text x="600" y="145" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">每批也只有 1 个元素</text>

  <rect x="60" y="172" width="116" height="52" rx="6" fill="#dbeafe"/>
  <text x="74" y="194" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">SSE2</text>
  <text x="74" y="213" font-family="Consolas, monospace" font-size="11" fill="#64748b">-O3</text>

  <rect x="196" y="180" width="160" height="36" rx="4" fill="#3b82f6"/>
  <text x="240" y="204" font-family="Consolas, monospace" font-size="12" fill="#ffffff">xmm 128 位 = 4 个</text>
  <text x="370" y="204" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">paddd</text>

  <text x="600" y="194" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#0f172a">0.598 周期/元素</text>
  <text x="600" y="213" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">2.39 周期 / 每批 4 个</text>

  <rect x="60" y="240" width="116" height="52" rx="6" fill="#fef3c7"/>
  <text x="74" y="262" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#a16207">AVX2</text>
  <text x="74" y="281" font-family="Consolas, monospace" font-size="11" fill="#64748b">-march=native</text>

  <rect x="196" y="248" width="320" height="36" rx="4" fill="#d97706"/>
  <text x="280" y="272" font-family="Consolas, monospace" font-size="12" fill="#ffffff">ymm 256 位 = 8 个</text>
  <text x="530" y="272" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">vpaddd</text>

  <text x="600" y="262" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#0f172a">0.272 周期/元素</text>
  <text x="600" y="281" font-family="Consolas, monospace" font-size="11" fill="#a16207">2.18 周期 / 每批 8 个</text>

  <rect x="60" y="308" width="880" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="76" y="330" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#0f172a">关键：每批的周期几乎不变（2.39 → 2.18）</text>
  <text x="76" y="350" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">宽度翻倍省的是「每批几个元素」，不是「每批几次访存」。两个 load 一个 store 仍在，缓存端口才是瓶颈。</text>
</svg>
