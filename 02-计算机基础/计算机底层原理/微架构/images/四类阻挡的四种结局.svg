<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>
  <rect x="40" y="16" width="920" height="58" fill="#ffffff"/>
  <text x="60" y="44" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#0f172a">四类阻挡，四种结局</text>
  <text x="60" y="66" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">「被挡住」与「变慢了」是两件事，报告里的字样也不同</text>

  <rect x="40" y="84" width="220" height="240" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="52" y="96" width="196" height="30" rx="5" fill="#dcfce7"/>
  <text x="64" y="116" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#15803d">别名</text>
  <text x="52" y="148" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#0f172a">能向量化，但要多一条检查</text>
  <rect x="52" y="158" width="196" height="76" rx="5" fill="#ecfdf5"/>
  <text x="62" y="176" font-family="Consolas, monospace" font-size="10" fill="#166534">loop versioned for</text>
  <text x="62" y="192" font-family="Consolas, monospace" font-size="10" fill="#166534">vectorization because</text>
  <text x="62" y="208" font-family="Consolas, monospace" font-size="10" fill="#166534">of possible aliasing</text>
  <text x="62" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#64748b">运行时查重叠，分两条路</text>
  <text x="52" y="262" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#15803d">加 restrict 后这行消失</text>
  <text x="52" y="282" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">共 2 条路径 → 1 条</text>
  <text x="52" y="308" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">代价：说假话时结果错</text>

  <rect x="272" y="84" width="220" height="240" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="284" y="96" width="196" height="30" rx="5" fill="#dbeafe"/>
  <text x="296" y="116" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">跨步</text>
  <text x="284" y="148" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#0f172a">能向量化，但更慢</text>
  <rect x="284" y="158" width="196" height="76" rx="5" fill="#eff6ff"/>
  <text x="294" y="176" font-family="Consolas, monospace" font-size="10" fill="#1e40af">loop vectorized using</text>
  <text x="294" y="192" font-family="Consolas, monospace" font-size="10" fill="#1e40af">16 byte vectors</text>
  <text x="294" y="214" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#64748b">c[i*2] = a[i*2] + 1</text>
  <text x="294" y="230" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#64748b">报告里与普通循环无异</text>
  <text x="284" y="262" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#1d4ed8">报告看不出区别</text>
  <text x="284" y="282" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">带宽利用率减半</text>
  <text x="284" y="308" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">本篇只验报告，未测吞吐</text>

  <rect x="504" y="84" width="220" height="240" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="516" y="96" width="196" height="30" rx="5" fill="#fee2e2"/>
  <text x="528" y="116" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">循环携带依赖</text>
  <text x="516" y="148" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#0f172a">真的挡住，只能逐元素</text>
  <rect x="516" y="158" width="196" height="76" rx="5" fill="#fef2f2"/>
  <text x="526" y="176" font-family="Consolas, monospace" font-size="10" fill="#991b1b">missed: not vectorized,</text>
  <text x="526" y="192" font-family="Consolas, monospace" font-size="10" fill="#991b1b">possible dependence</text>
  <text x="526" y="208" font-family="Consolas, monospace" font-size="10" fill="#991b1b">between data-refs</text>
  <text x="526" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#64748b">a[i] = a[i-1] + 1</text>
  <text x="516" y="262" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#b91c1c">optimized 里没有它</text>
  <text x="516" y="282" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">missed 里给 dependence</text>
  <text x="516" y="308" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">判据：两个报告对不上</text>

  <rect x="736" y="84" width="224" height="240" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="748" y="96" width="200" height="30" rx="5" fill="#fef3c7"/>
  <text x="760" y="116" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#a16207">浮点规约</text>
  <text x="748" y="148" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#0f172a">报告说可以，汇编说不行</text>
  <rect x="748" y="158" width="200" height="76" rx="5" fill="#fffbeb"/>
  <text x="758" y="176" font-family="Consolas, monospace" font-size="10" fill="#92400e">optimized: loop</text>
  <text x="758" y="192" font-family="Consolas, monospace" font-size="10" fill="#92400e">vectorized using 16</text>
  <text x="758" y="208" font-family="Consolas, monospace" font-size="10" fill="#92400e">byte vectors</text>
  <text x="758" y="226" font-family="Consolas, monospace" font-size="10" fill="#b91c1c">但汇编：addss 7 条</text>
  <text x="748" y="262" font-family="Consolas, monospace" font-size="11" fill="#a16207">addps 0 条</text>
  <text x="748" y="282" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">加 -ffast-math 才出 3 条</text>
  <text x="748" y="308" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#b91c1c">报告字面完全相同</text>

  <rect x="40" y="340" width="920" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="364" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#0f172a">四种结局只有第三种是「被拒绝」，第四种最危险</text>
  <text x="60" y="386" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">第二种连报告都看不出来；第四种报告与汇编不一致——所以判据必须落到「有没有 p* / v* 指令」。</text>
</svg>
