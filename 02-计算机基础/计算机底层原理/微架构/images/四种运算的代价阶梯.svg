<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0f172a">四种运算的代价：除法高出整整一个数量级</text>
  <rect x="32" y="54" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="72" font-size="13" fill="#64748b">横轴为对数刻度，否则 1.35 与 30.6 摆在一起时前者只剩一条线；同一容器、同一循环结构实测。</text>

  <line x1="380" y1="104" x2="380" y2="368" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="623" y1="104" x2="623" y2="368" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="867" y1="104" x2="867" y2="368" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="380" y="98" font-size="11" fill="#94a3b8" text-anchor="middle">1 周期</text>
  <text x="623" y="98" font-size="11" fill="#94a3b8" text-anchor="middle">10 周期</text>
  <text x="867" y="98" font-size="11" fill="#94a3b8" text-anchor="middle">100 周期</text>

  <rect x="40" y="120" width="150" height="46" rx="6" fill="#f8fafc"/>
  <text x="52" y="140" font-size="13" font-weight="bold" fill="#64748b">加法 add</text>
  <text x="52" y="158" font-size="11.5" fill="#94a3b8">0.282 周期（另篇）</text>
  <rect x="210" y="132" width="36" height="30" rx="4" fill="#cbd5e1"/>
  <text x="256" y="152" font-size="12" fill="#94a3b8">0.28</text>

  <rect x="40" y="186" width="150" height="46" rx="6" fill="#eff6ff"/>
  <text x="52" y="206" font-size="13" font-weight="bold" fill="#1d4ed8">乘法 imul</text>
  <text x="52" y="224" font-size="11.5" fill="#3b82f6">0.55 ns/次</text>
  <rect x="210" y="198" width="202" height="30" rx="4" fill="#3b82f6"/>
  <text x="422" y="218" font-size="12" font-weight="bold" fill="#1d4ed8">1.35</text>

  <rect x="40" y="252" width="150" height="46" rx="6" fill="#f0fdf4"/>
  <text x="52" y="272" font-size="13" font-weight="bold" fill="#15803d">右移 shr</text>
  <text x="52" y="290" font-size="11.5" fill="#22c55e">0.61 ns/次</text>
  <rect x="210" y="264" width="213" height="30" rx="4" fill="#22c55e"/>
  <text x="433" y="284" font-size="12" font-weight="bold" fill="#15803d">1.50</text>

  <rect x="40" y="318" width="150" height="46" rx="6" fill="#fef2f2"/>
  <text x="52" y="338" font-size="13" font-weight="bold" fill="#b91c1c">除法 idiv</text>
  <text x="52" y="356" font-size="11.5" fill="#ef4444">12.48 ns/次</text>
  <rect x="210" y="330" width="532" height="30" rx="4" fill="#ef4444"/>
  <text x="752" y="350" font-size="12" font-weight="bold" fill="#b91c1c">30.6</text>

  <text x="40" y="396" font-size="12.5" fill="#475569">单位：周期（按 1 周期 = 0.408 ns 折算）。灰条是上游 <tspan font-family="Consolas, monospace">CPU怎么执行一条指令.md</tspan> 的读数，不参与下面的倍数。</text>

  <rect x="40" y="410" width="900" height="46" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="60" y="430" font-size="13" font-weight="bold" fill="#b91c1c">除法是乘法的 22.67 倍、右移的 20.53 倍</text>
  <text x="60" y="449" font-size="12" fill="#7f1d1d">除法单元不流水，下一轮要等上一轮出结果；这就是编译器把「除以常数」改写成乘法的原因。</text>
</svg>
