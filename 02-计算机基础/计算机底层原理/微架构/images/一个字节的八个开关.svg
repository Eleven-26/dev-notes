<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0f172a">一个 uint8 就是一排八个开关</text>
  <rect x="32" y="54" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="72" font-size="13" fill="#64748b">四个动作的共同点是「只碰目标位、其余原样」——这就是位掩码的全部。</text>

  <text x="60" y="112" font-size="12.5" fill="#64748b">位序</text>
  <text x="152" y="112" font-size="11.5" fill="#94a3b8" text-anchor="middle">bit7</text>
  <text x="224" y="112" font-size="11.5" fill="#94a3b8" text-anchor="middle">bit6</text>
  <text x="296" y="112" font-size="11.5" fill="#94a3b8" text-anchor="middle">bit5</text>
  <text x="368" y="112" font-size="11.5" fill="#94a3b8" text-anchor="middle">bit4</text>
  <text x="440" y="112" font-size="11.5" fill="#94a3b8" text-anchor="middle">bit3</text>
  <text x="512" y="112" font-size="11.5" fill="#94a3b8" text-anchor="middle">bit2</text>
  <text x="584" y="112" font-size="11.5" fill="#94a3b8" text-anchor="middle">bit1</text>
  <text x="656" y="112" font-size="11.5" fill="#94a3b8" text-anchor="middle">bit0</text>

  <rect x="120" y="122" width="64" height="46" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="152" y="151" font-size="15" font-weight="bold" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">1</text>
  <rect x="192" y="122" width="64" height="46" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="224" y="151" font-size="15" font-weight="bold" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">0</text>
  <rect x="264" y="122" width="64" height="46" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="296" y="151" font-size="15" font-weight="bold" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">1</text>
  <rect x="336" y="122" width="64" height="46" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="368" y="151" font-size="15" font-weight="bold" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">0</text>
  <rect x="408" y="122" width="64" height="46" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="440" y="151" font-size="15" font-weight="bold" font-family="Consolas, monospace" fill="#1e40af" text-anchor="middle">1</text>
  <rect x="480" y="122" width="64" height="46" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="512" y="151" font-size="15" font-weight="bold" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">0</text>
  <rect x="552" y="122" width="64" height="46" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="584" y="151" font-size="15" font-weight="bold" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">0</text>
  <rect x="624" y="122" width="64" height="46" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="656" y="151" font-size="15" font-weight="bold" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">0</text>

  <text x="440" y="190" font-size="11.5" fill="#1e40af" text-anchor="middle">bit3 = 已鉴权</text>

  <rect x="40" y="212" width="452" height="132" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="56" y="234" font-size="13" font-weight="bold" fill="#1e40af">置位 / 清位 / 取值 / 翻转</text>
  <text x="56" y="258" font-size="12" font-family="Consolas, monospace" fill="#1e3a8a">flags |= 1&lt;&lt;3</text>
  <text x="220" y="258" font-size="11.5" fill="#475569">第 3 位强制变 1</text>
  <text x="56" y="282" font-size="12" font-family="Consolas, monospace" fill="#1e3a8a">flags &amp;^= 1&lt;&lt;3</text>
  <text x="220" y="282" font-size="11.5" fill="#475569">第 3 位强制变 0</text>
  <text x="56" y="306" font-size="12" font-family="Consolas, monospace" fill="#1e3a8a">flags &amp; (1&lt;&lt;3) != 0</text>
  <text x="220" y="306" font-size="11.5" fill="#475569">只留第 3 位再判非零</text>
  <text x="56" y="330" font-size="12" font-family="Consolas, monospace" fill="#1e3a8a">flags ^= 1&lt;&lt;3</text>
  <text x="220" y="330" font-size="11.5" fill="#475569">第 3 位取反</text>

  <rect x="508" y="212" width="456" height="132" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="524" y="234" font-size="13" font-weight="bold" fill="#047857">权限位：4 + 2 + 1 = 7</text>
  <text x="524" y="258" font-size="12" font-family="Consolas, monospace" fill="#065f46">r = 4 = 100　　w = 2 = 010　　x = 1 = 001</text>
  <text x="524" y="282" font-size="12" font-family="Consolas, monospace" fill="#065f46">chmod 755　→　7 = 4|2|1</text>
  <text x="524" y="306" font-size="12" fill="#047857">mode &amp; 0444 非零 = 至少有一处可读</text>
  <text x="524" y="330" font-size="12" fill="#047857">加一种权限只需多占一位，判断代码不动</text>

  <rect x="40" y="360" width="452" height="96" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="56" y="382" font-size="13" font-weight="bold" fill="#92400e">判据：状态可并存 → 位掩码</text>
  <text x="56" y="406" font-size="12" fill="#78350f">熔断器 Closed / Open / HalfOpen 是互斥的三态，</text>
  <text x="56" y="426" font-size="12" fill="#78350f">写成 1&lt;&lt;0 | 1&lt;&lt;1 | 1&lt;&lt;2 会允许 open &amp;&amp; halfOpen</text>
  <text x="56" y="446" font-size="12" fill="#78350f">这种不存在的组合 —— 该用枚举，不该用掩码。</text>

  <rect x="508" y="360" width="456" height="96" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="524" y="382" font-size="13" font-weight="bold" fill="#b91c1c">空间收益要看容器</text>
  <text x="524" y="406" font-size="12" fill="#7f1d1d">[1000]struct{8 个 bool} = 8000 字节</text>
  <text x="524" y="426" font-size="12" fill="#7f1d1d">[1000]uint8　　　　　 = 1000 字节　→ 8 倍</text>
  <text x="524" y="446" font-size="12" fill="#7f1d1d">但 int64 + 8 bool 与 int64 + uint8 都是 16 字节</text>

  <rect x="40" y="472" width="924" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="495" font-size="12" fill="#334155">⭐ 位压缩只在「大批量 + 元素边界紧凑」时兑现（切片、数组、序列化字节流）；单个结构体里常被对齐填充吃干净。</text>
</svg>
