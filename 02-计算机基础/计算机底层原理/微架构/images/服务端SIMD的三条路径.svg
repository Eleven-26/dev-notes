<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">服务端 SIMD 的三条路径：同台机器上差两个数量级</text>
  <rect x="32" y="52" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="70" font-size="13" fill="#64748b">同一份 Go 代码，用 GODEBUG=cpu.*=off 关掉对应指令做 A/B；横轴对数刻度。</text>

  <rect x="32" y="90" width="936" height="442" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="48" y="108" width="14" height="14" rx="2" fill="#fee2e2" stroke="#ef4444"/>
  <text x="68" y="120" font-size="11" fill="#991b1b">关闭对应指令</text>
  <rect x="180" y="108" width="14" height="14" rx="2" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="200" y="120" font-size="11" fill="#1e40af">默认（SIMD 路径）</text>
  <rect x="330" y="108" width="14" height="14" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="350" y="120" font-size="11" fill="#475569">纯 Go 对照</text>
  <text x="880" y="120" font-size="11" fill="#64748b">GB/s</text>

  <text x="48" y="148" font-size="12" font-weight="bold" fill="#0f172a">CRC-32 / IEEE（64 KB）</text>
  <text x="600" y="148" font-size="11" font-weight="bold" fill="#b91c1c">关闭后慢 8 倍</text>
  <rect x="230" y="158" width="344" height="18" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <text x="580" y="172" font-size="10" fill="#991b1b">1.52~1.55</text>
  <rect x="230" y="184" width="553" height="18" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="789" y="198" font-size="10" fill="#1e40af">12.2~12.5</text>

  <text x="48" y="216" font-size="12" font-weight="bold" fill="#0f172a">CRC-32C / Castagnoli（64 KB）</text>
  <text x="600" y="216" font-size="11" font-weight="bold" fill="#b91c1c">关闭后慢 12 倍</text>
  <rect x="230" y="226" width="333" height="18" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <text x="569" y="240" font-size="10" fill="#991b1b">1.38</text>
  <rect x="230" y="252" width="581" height="18" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="817" y="266" font-size="10" fill="#1e40af">16.4~16.5</text>

  <text x="48" y="284" font-size="12" font-weight="bold" fill="#0f172a">bytes.IndexByte（64 KB）</text>
  <text x="600" y="284" font-size="11" fill="#b45309">关闭后慢 1.5 倍</text>
  <rect x="230" y="294" width="585" height="18" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <text x="821" y="308" font-size="10" fill="#991b1b">17.2</text>
  <rect x="230" y="320" width="628" height="18" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="864" y="334" font-size="10" fill="#1e40af">26.1~26.3</text>

  <text x="48" y="352" font-size="12" font-weight="bold" fill="#0f172a">AES-128-GCM（16 KB）</text>
  <text x="600" y="352" font-size="11" font-weight="bold" fill="#b91c1c">关 AES-NI 掉 43~51 倍，关 PCLMULQDQ 掉 21~24 倍</text>
  <rect x="230" y="362" width="18" height="18" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <text x="254" y="376" font-size="10" fill="#991b1b">0.060（关 AES-NI）</text>
  <rect x="230" y="388" width="93" height="18" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <text x="329" y="402" font-size="10" fill="#991b1b">0.126（关 PCLMULQDQ）</text>
  <rect x="230" y="414" width="414" height="18" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="650" y="428" font-size="10" fill="#1e40af">2.6~3.1</text>

  <text x="48" y="446" font-size="12" font-weight="bold" fill="#0f172a">纯 Go 对照（64 KB）</text>
  <text x="600" y="446" font-size="11" fill="#475569">比硬件路径低一到两个数量级</text>
  <rect x="230" y="456" width="176" height="18" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="412" y="470" font-size="10" fill="#475569">0.28~0.29（表驱动 CRC）</text>
  <rect x="230" y="482" width="379" height="18" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="615" y="496" font-size="10" fill="#475569">1.6~2.2（逐字节查找）</text>

  <line x1="230" y1="512" x2="930" y2="512" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <line x1="461" y1="506" x2="461" y2="518" stroke="#cbd5e1"/>
  <line x1="692" y1="506" x2="692" y2="518" stroke="#cbd5e1"/>
  <line x1="922" y1="506" x2="922" y2="518" stroke="#cbd5e1"/>
  <text x="449" y="528" font-size="10" fill="#64748b">0.1</text>
  <text x="684" y="528" font-size="10" fill="#64748b">1</text>
  <text x="910" y="528" font-size="10" fill="#64748b">10</text>

  <rect x="32" y="552" width="936" height="96" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="44" y="574" font-size="12" fill="#1e40af">同一个库，两种多项式走两条指令路径：IEEE 靠 PCLMULQDQ，Castagnoli 靠 SSE4.2 的 CRC32 —— 这也是 Kafka 选 CRC32C 的原因之一。</text>
  <text x="44" y="598" font-size="12" fill="#1e40af">判断 SIMD 的价值要跟标量比：关掉 AVX2 只慢 1.5 倍，但 IndexByte 比逐字节循环快 12~16 倍；CRC 比表驱动快 42~57 倍。</text>
  <text x="44" y="622" font-size="12" fill="#1e40af">AES-GCM 两段缺一不可：AES 轮走 AES-NI，GHASH 走 PCLMULQDQ，关哪一段都塌。</text>
  <text x="44" y="644" font-size="11" fill="#64748b">绝对值含 Go 侧分组与缓冲开销，表中比的是同一份代码在开关前后的比值。</text>
</svg>
