<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 616" width="1000" height="616" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="616" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">微架构七篇：同一颗 CPU 上的三档放大</text>
  <text x="500" y="57" text-anchor="middle" font-size="12" fill="#64748b">左列是「一次看几条指令」，中间每张卡是一篇的回答与一条硬读数，右列写这一档该问什么</text>
  <rect x="20" y="82" width="120" height="132" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="80" y="112" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">档 1</text>
  <text x="80" y="136" font-size="12" fill="#2563eb" text-anchor="middle">单条指令</text>
  <text x="80" y="162" font-size="10.5" fill="#475569" text-anchor="middle">走完五段</text>
  <text x="80" y="190" font-size="10.5" fill="#475569" text-anchor="middle">算出结果</text>
  <rect x="154" y="82" width="194" height="132" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="168" y="108" font-size="12" font-weight="bold" fill="#0f172a">CPU 怎么执行一条指令</text>
  <text x="168" y="134" font-size="10.5" fill="#334155">五段分工；编译器会删掉你要测的</text>
  <text x="168" y="158" font-size="9.5" fill="#64748b">独有读数</text>
  <text x="168" y="188" font-size="10.5" fill="#1d4ed8">8.81 / 2.55 / 1.81 周期每加法</text>
  <rect x="356" y="82" width="194" height="132" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="370" y="108" font-size="12" font-weight="bold" fill="#0f172a">补码与整数运算</text>
  <text x="370" y="134" font-size="10.5" fill="#334155">减法为什么不用单独电路</text>
  <text x="370" y="158" font-size="9.5" fill="#64748b">独有读数</text>
  <text x="370" y="188" font-size="10.5" fill="#1d4ed8">idiv 12.48 vs imul 0.55 ns</text>
  <rect x="558" y="82" width="194" height="132" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="572" y="108" font-size="12" font-weight="bold" fill="#0f172a">位运算</text>
  <text x="572" y="134" font-size="10.5" fill="#334155">ALU 里不进位的那一半</text>
  <text x="572" y="158" font-size="9.5" fill="#64748b">独有读数</text>
  <text x="572" y="188" font-size="10.5" fill="#1d4ed8">and 0.4599 vs add 0.4559 ns</text>
  <rect x="766" y="82" width="214" height="132" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="780" y="108" font-size="11" font-weight="bold" fill="#1e40af">这一档问什么</text>
  <text x="780" y="132" font-size="10.5" fill="#475569">一条指令在硅上</text>
  <text x="780" y="152" font-size="10.5" fill="#475569">花几个周期；</text>
  <text x="780" y="176" font-size="10.5" fill="#475569">编译器有没有先</text>
  <text x="780" y="196" font-size="10.5" fill="#475569">把你测的东西改掉</text>
  <rect x="20" y="228" width="120" height="132" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="80" y="258" font-size="14" font-weight="bold" fill="#ea580c" text-anchor="middle">档 2</text>
  <text x="80" y="282" font-size="12" fill="#ea580c" text-anchor="middle">多条指令</text>
  <text x="80" y="308" font-size="10.5" fill="#475569" text-anchor="middle">同时在飞</text>
  <text x="80" y="336" font-size="10.5" fill="#475569" text-anchor="middle">猜方向</text>
  <rect x="154" y="228" width="194" height="132" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
  <text x="168" y="254" font-size="12" font-weight="bold" fill="#0f172a">CPU 流水线与乱序执行</text>
  <text x="168" y="280" font-size="10.5" fill="#334155">IPC 能大于 1；写缓冲让 store 提前</text>
  <text x="168" y="304" font-size="9.5" fill="#64748b">独有读数</text>
  <text x="168" y="334" font-size="10.5" fill="#c2410c">三档 IPC 0.55 / 1.77 / 3.17</text>
  <rect x="356" y="228" width="194" height="132" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
  <text x="370" y="254" font-size="12" font-weight="bold" fill="#0f172a">分支预测</text>
  <text x="370" y="280" font-size="10.5" fill="#334155">猜错赔的是「已经做的工作」</text>
  <text x="370" y="304" font-size="9.5" fill="#64748b">独有读数</text>
  <text x="370" y="334" font-size="10.5" fill="#c2410c">µop / 指令 1.05 → 4.32</text>
  <rect x="558" y="228" width="194" height="132" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
  <text x="572" y="254" font-size="12" font-weight="bold" fill="#0f172a">向量化与 SIMD</text>
  <text x="572" y="280" font-size="10.5" fill="#334155">一条指令一次装几个元素</text>
  <text x="572" y="304" font-size="9.5" fill="#64748b">独有读数</text>
  <text x="572" y="334" font-size="10.5" fill="#c2410c">0.810 → 0.105 ns/元素</text>
  <rect x="766" y="228" width="214" height="132" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/>
  <text x="780" y="254" font-size="11" font-weight="bold" fill="#9a3412">这一档问什么</text>
  <text x="780" y="278" font-size="10.5" fill="#475569">并行度从哪来、</text>
  <text x="780" y="298" font-size="10.5" fill="#475569">又被什么挡住；</text>
  <text x="780" y="322" font-size="10.5" fill="#475569">猜错与「装不下」</text>
  <text x="780" y="342" font-size="10.5" fill="#475569">各自赔多少</text>
  <rect x="20" y="374" width="120" height="108" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="80" y="404" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">档 3</text>
  <text x="80" y="428" font-size="12" fill="#7c3aed" text-anchor="middle">量具</text>
  <text x="80" y="454" font-size="10.5" fill="#475569" text-anchor="middle">全册共用</text>
  <rect x="154" y="374" width="604" height="108" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="170" y="400" font-size="12" font-weight="bold" fill="#0f172a">时钟周期与频率</text>
  <text x="170" y="424" font-size="10.5" fill="#334155">标称 2.60 / TSC 2.592 / 实测 2.446~2.459 GHz</text>
  <text x="170" y="446" font-size="10.5" fill="#334155">一条指令可以不到一个周期：0.282 周期/条</text>
  <text x="170" y="468" font-size="10" fill="#64748b">注意：它不产出新结论，只规定上面六篇的读数怎么换算</text>
  <rect x="766" y="374" width="214" height="108" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.4"/>
  <text x="780" y="400" font-size="11" font-weight="bold" fill="#5b21b6">这一档问什么</text>
  <text x="780" y="424" font-size="10.5" fill="#475569">上面那些周期数，</text>
  <text x="780" y="444" font-size="10.5" fill="#475569">分母到底是谁；</text>
  <text x="780" y="466" font-size="10.5" fill="#475569">换台机器还能不能比</text>
  <rect x="20" y="500" width="300" height="88" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="36" y="526" font-size="11.5" font-weight="bold" fill="#334155">上游：编译原理</text>
  <text x="36" y="550" font-size="10.5" fill="#475569">字节怎么被造出来、PC 初值</text>
  <text x="36" y="572" font-size="10.5" fill="#475569">从哪来；本册从「PC 拿到地址」接起</text>
  <rect x="340" y="500" width="320" height="88" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="356" y="526" font-size="11.5" font-weight="bold" fill="#1d4ed8">本册：PC 拿到地址之后发生什么</text>
  <text x="356" y="550" font-size="10.5" fill="#475569">判据只有一条：换语言、换操作系统，</text>
  <text x="356" y="572" font-size="10.5" fill="#475569">这些结论仍然成立 —— 它由微架构决定</text>
  <rect x="680" y="500" width="300" height="88" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="696" y="526" font-size="11.5" font-weight="bold" fill="#334155">下游：缓存与内存 / 底层同步</text>
  <text x="696" y="550" font-size="10.5" fill="#475569">数据从哪来（行与延迟）；多核怎么</text>
  <text x="696" y="572" font-size="10.5" fill="#475569">看到同一个值（LOCK 与 futex）</text>
</svg>
