<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="498" viewBox="0 0 1000 498">
  <rect x="0" y="0" width="1000" height="498" fill="#ffffff"/>
  <rect x="40" y="16" width="920" height="56" fill="#ffffff"/>
  <text x="60" y="42" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#0f172a">同一份求和：随机数据上无分支快 4.8 倍，有序数据上反而慢 30%</text>
  <text x="60" y="64" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">纵轴是「每个元素花几个时钟周期」；四档的指令数都标在柱子下面，两边算的是同一个和</text>

  <rect x="40" y="80" width="920" height="344" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="120" y1="340" x2="880" y2="340" stroke="#cbd5e1"/>

  <!-- 无分支固定水位 -->
  <line x1="120" y1="294" x2="880" y2="294" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="505" y="282" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#475569">无分支的固定水位 2.69：与数据顺序无关</text>

  <!-- 分组标题 -->
  <text x="315" y="104" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#0f172a">随机数组</text>
  <text x="695" y="104" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#0f172a">排序后的同一组数</text>

  <!-- 有分支 + 随机 -->
  <rect x="200" y="120" width="90" height="220" rx="5" fill="#ea580c"/>
  <text x="245" y="110" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#9a3412">12.86</text>

  <!-- 无分支 + 随机 -->
  <rect x="340" y="294" width="90" height="46" rx="5" fill="#0f766e"/>
  <text x="385" y="322" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2.69</text>

  <!-- 有分支 + 排序 -->
  <rect x="580" y="305" width="90" height="35" rx="5" fill="#ea580c"/>
  <text x="625" y="328" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2.06</text>

  <!-- 无分支 + 排序 -->
  <rect x="720" y="294" width="90" height="46" rx="5" fill="#0f766e"/>
  <text x="765" y="322" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2.69</text>

  <!-- 比例标注 -->
  <text x="385" y="250" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#b45309">比左边省 4.8 倍</text>
  <text x="695" y="250" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#b45309">比左边多 30%</text>

  <!-- 横轴标签 -->
  <text x="245" y="360" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0f172a">有分支</text>
  <text x="385" y="360" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0f172a">无分支</text>
  <text x="625" y="360" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0f172a">有分支</text>
  <text x="765" y="360" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0f172a">无分支</text>

  <text x="245" y="380" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">6.53 条/元素</text>
  <text x="385" y="380" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#0f766e">11.02 条/元素</text>
  <text x="625" y="380" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">6.52 条/元素</text>
  <text x="765" y="380" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#0f766e">11.02 条/元素</text>

  <text x="315" y="404" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#b91c1c">条件分支误判 46%，每次赔约 23 周期</text>
  <text x="695" y="404" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#0f766e">误判 0.05%，多出的 4.5 条指令成了纯亏</text>

  <rect x="60" y="438" width="880" height="44" rx="6" fill="#fef3c7"/>
  <text x="76" y="456" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#92400e">无分支的代价是固定的（每元素多 4.5 条指令），收益却随误判率走：46% 时赚 4.8 倍，0.05% 时亏 30%</text>
  <text x="76" y="474" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#a16207">所以判据不是「这段代码有没有分支」，是「这条分支猜不猜得中」——量一次 branch-misses ÷ branches 即可</text>
</svg>
