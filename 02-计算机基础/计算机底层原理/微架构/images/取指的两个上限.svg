<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <rect x="40" y="16" width="920" height="56" fill="#ffffff"/>
  <text x="60" y="42" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#0f172a">nop 的字节长度一变，卡住的东西也变了</text>
  <text x="60" y="64" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">同为 2048 条 nop、同一个循环骨架；上格数「每周期几条」，下格折合「每周期几字节」</text>

  <!-- 上格：条 / 周期 -->
  <rect x="40" y="88" width="920" height="162" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="108" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">条 / 周期</text>
  <line x1="76" y1="246" x2="940" y2="246" stroke="#cbd5e1"/>
  <line x1="76" y1="120" x2="930" y2="120" stroke="#93c5fd" stroke-dasharray="5 4"/>
  <text x="798" y="114" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#1d4ed8">条数上限 3.78</text>

  <rect x="150" y="120" width="80" height="126" rx="4" fill="#2563eb"/>
  <text x="150" y="112" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#1e40af">3.78</text>

  <rect x="320" y="120" width="80" height="126" rx="4" fill="#2563eb"/>
  <text x="320" y="112" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#1e40af">3.78</text>

  <rect x="490" y="146" width="80" height="100" rx="4" fill="#2563eb"/>
  <text x="490" y="138" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#1e40af">3.00</text>

  <rect x="660" y="167" width="80" height="79" rx="4" fill="#2563eb"/>
  <text x="660" y="159" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#1e40af">2.37</text>

  <rect x="830" y="178" width="80" height="68" rx="4" fill="#2563eb"/>
  <text x="830" y="170" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#1e40af">2.04</text>

  <!-- 下格：字节 / 周期 -->
  <rect x="40" y="268" width="920" height="186" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="288" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">字节 / 周期</text>
  <line x1="76" y1="424" x2="940" y2="424" stroke="#cbd5e1"/>
  <line x1="76" y1="319" x2="930" y2="319" stroke="#5eead4" stroke-dasharray="5 4"/>
  <text x="86" y="313" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#0f766e">平台 18~19 字节 / 周期</text>

  <rect x="150" y="402" width="80" height="22" rx="4" fill="#0d9488"/>
  <text x="150" y="394" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f766e">3.8</text>

  <rect x="320" y="337" width="80" height="87" rx="4" fill="#0d9488"/>
  <text x="320" y="329" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f766e">15.1</text>

  <rect x="490" y="320" width="80" height="104" rx="4" fill="#0d9488"/>
  <text x="490" y="312" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f766e">18.0</text>

  <rect x="660" y="315" width="80" height="109" rx="4" fill="#0d9488"/>
  <text x="660" y="307" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f766e">19.0</text>

  <rect x="830" y="319" width="80" height="105" rx="4" fill="#0d9488"/>
  <text x="830" y="311" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f766e">18.3</text>

  <!-- x 轴 -->
  <text x="162" y="446" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0f172a">1 字节</text>
  <text x="332" y="446" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0f172a">4 字节</text>
  <text x="502" y="446" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0f172a">6 字节</text>
  <text x="672" y="446" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0f172a">8 字节</text>
  <text x="842" y="446" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0f172a">9 字节</text>

  <rect x="60" y="464" width="880" height="40" rx="6" fill="#fef3c7"/>
  <text x="76" y="482" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#92400e">1 字节与 4 字节的条数完全相同（3.78），字节数却差 4 倍——这时卡的是「条」；6 字节起条数开始掉，字节数稳在 18~19——换成「字节」在卡</text>
  <text x="76" y="498" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#a16207">两个上限同时存在，谁先触及谁说话；这也是「CISC 前端更贵」的全部物理内容</text>
</svg>
