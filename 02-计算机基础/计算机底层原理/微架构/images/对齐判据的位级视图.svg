<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0f172a">对齐就是「低 k 位全 0」，取低 k 位就是 &amp;</text>
  <rect x="32" y="54" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="72" font-size="13" fill="#64748b">64 = 2⁶，所以 64 字节对齐等价于低 6 位是 0；`addr &amp; 63` 取的就是这 6 位。</text>

  <text x="40" y="112" font-size="13" font-weight="bold" fill="#0f172a">一个地址的位</text>

  <text x="60" y="140" font-size="11.5" fill="#94a3b8">高位</text>
  <rect x="110" y="150" width="52" height="40" rx="3" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="136" y="176" font-size="14" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">1</text>
  <rect x="168" y="150" width="52" height="40" rx="3" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="194" y="176" font-size="14" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">1</text>
  <rect x="226" y="150" width="52" height="40" rx="3" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="252" y="176" font-size="14" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">0</text>
  <rect x="284" y="150" width="52" height="40" rx="3" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="310" y="176" font-size="14" font-family="Consolas, monospace" fill="#334155" text-anchor="middle">1</text>
  <text x="352" y="176" font-size="14" fill="#94a3b8">......</text>

  <rect x="392" y="150" width="52" height="40" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="418" y="176" font-size="14" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">1</text>
  <rect x="450" y="150" width="52" height="40" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="476" y="176" font-size="14" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">0</text>
  <rect x="508" y="150" width="52" height="40" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="534" y="176" font-size="14" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">1</text>
  <rect x="566" y="150" width="52" height="40" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="592" y="176" font-size="14" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">0</text>
  <rect x="624" y="150" width="52" height="40" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="650" y="176" font-size="14" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">1</text>
  <rect x="682" y="150" width="52" height="40" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="708" y="176" font-size="14" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">1</text>

  <text x="418" y="212" font-size="11.5" fill="#92400e" text-anchor="middle">这 6 位 = 余数</text>
  <line x1="392" y1="222" x2="740" y2="222" stroke="#f59e0b" stroke-width="1"/>

  <rect x="386" y="144" width="354" height="52" rx="6" fill="none" stroke="#f59e0b" stroke-dasharray="3 2"/>

  <rect x="36" y="244" width="452" height="120" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="52" y="266" font-size="13" font-weight="bold" fill="#1e40af">判对齐：低 6 位全 0 吗</text>
  <text x="52" y="292" font-size="12.5" font-family="Consolas, monospace" fill="#1e3a8a">addr &amp; 63 == 0</text>
  <text x="52" y="318" font-size="12" fill="#475569">addr &amp; 63 取的就是上面那 6 位。</text>
  <text x="52" y="340" font-size="12" fill="#475569">等于 0 就是对 64 对齐。</text>
  <text x="52" y="360" font-size="11.5" fill="#64748b">与 addr % 64 == 0 对 1024 组 0 处不一致</text>

  <rect x="508" y="244" width="456" height="120" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="524" y="266" font-size="13" font-weight="bold" fill="#047857">向上取整：先加 63，再抹低 6 位</text>
  <text x="524" y="292" font-size="12.5" font-family="Consolas, monospace" fill="#065f46">(addr + 63) &amp; ~63</text>
  <text x="524" y="318" font-size="12" fill="#475569">+63 让非对齐地址跨过下一个边界；</text>
  <text x="524" y="340" font-size="12" fill="#475569">&amp; ~63 把低 6 位抹成 0。</text>
  <text x="524" y="360" font-size="11.5" fill="#64748b">与 ((addr+63)/64)*64 对 1024 组 0 处不一致</text>

  <rect x="36" y="378" width="928" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="400" font-size="12" fill="#334155">边界：addr=0 判对齐，向上取整仍是 0（0 本来就对齐）；要「严格大于」得写 (addr+64) &amp; ~63，差一个 63 与 64。</text>

  <rect x="36" y="420" width="928" height="34" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="52" y="442" font-size="12" fill="#78350f">⚠️ 结构体里那 56 字节是编译期算的常量（64 − 8），运行时抬指针才用掩码 —— 前者决定布局，后者改指针值。</text>
</svg>
