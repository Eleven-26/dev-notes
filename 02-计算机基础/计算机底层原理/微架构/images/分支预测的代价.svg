<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>
  <rect x="40" y="16" width="920" height="58" fill="#ffffff"/>
  <text x="60" y="44" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#0f172a">分支预测失败到底浪费了什么：微操作数差 4 倍</text>
  <text x="60" y="66" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">以 sorted 为 1 倍的相对值；两边的指令数几乎相同（8.87 亿 vs 9.02 亿），这是关键的控制变量</text>

  <rect x="40" y="84" width="920" height="252" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="60" y="112" width="120" height="52" rx="6" fill="#fee2e2"/>
  <text x="74" y="134" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">指令数</text>
  <text x="74" y="153" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">两边做同样的活</text>

  <rect x="200" y="112" width="54" height="20" rx="4" fill="#b91c1c"/>
  <text x="266" y="127" font-family="Consolas, monospace" font-size="12" fill="#0f172a">0.98x</text>
  <text x="322" y="127" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">random</text>
  <rect x="200" y="140" width="55" height="20" rx="4" fill="#2563eb"/>
  <text x="266" y="155" font-family="Consolas, monospace" font-size="12" fill="#0f172a">1.00x</text>
  <text x="322" y="155" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">sorted</text>

  <rect x="60" y="176" width="120" height="52" rx="6" fill="#ffedd5"/>
  <text x="74" y="198" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#c2410c">微操作数</text>
  <text x="74" y="217" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">投机后被丢弃</text>

  <rect x="200" y="176" width="222" height="20" rx="4" fill="#ea580c"/>
  <text x="434" y="191" font-family="Consolas, monospace" font-size="12" fill="#0f172a">4.04x</text>
  <text x="490" y="191" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">random（每指令 4.32 个微操作）</text>
  <rect x="200" y="204" width="55" height="20" rx="4" fill="#2563eb"/>
  <text x="266" y="219" font-family="Consolas, monospace" font-size="12" fill="#0f172a">1.00x</text>
  <text x="322" y="219" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">sorted（每指令 1.05 个）</text>

  <rect x="60" y="240" width="120" height="52" rx="6" fill="#fef9c3"/>
  <text x="74" y="262" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#a16207">时钟周期</text>
  <text x="74" y="281" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">最终耗时</text>

  <rect x="200" y="240" width="175" height="20" rx="4" fill="#ca8a04"/>
  <text x="387" y="255" font-family="Consolas, monospace" font-size="12" fill="#0f172a">3.19x</text>
  <text x="443" y="255" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">random</text>
  <rect x="200" y="268" width="55" height="20" rx="4" fill="#2563eb"/>
  <text x="266" y="283" font-family="Consolas, monospace" font-size="12" fill="#0f172a">1.00x</text>
  <text x="322" y="283" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">sorted</text>

  <rect x="60" y="300" width="880" height="26" rx="6" fill="#e2e8f0"/>
  <text x="76" y="318" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#334155">另一组不画进条形的数：分支失败 32,019,699 次 vs 201,268 次，差 159 倍</text>

  <rect x="60" y="352" width="880" height="54" rx="6" fill="#fef3c7"/>
  <text x="76" y="374" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#92400e">指令数不变、微操作涨 4 倍 —— 多出来的不是「多做了活」，而是「做完了又整段丢掉」。</text>
  <text x="76" y="394" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#92400e">时间只慢 3.19 倍，因为乱序引擎在等待期间还能推进别的无关指令。</text>
</svg>
