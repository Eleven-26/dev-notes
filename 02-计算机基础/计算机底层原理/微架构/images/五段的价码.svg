<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="432" viewBox="0 0 1000 432">
  <rect x="0" y="0" width="1000" height="432" fill="#ffffff"/>
  <rect x="40" y="16" width="920" height="56" fill="#ffffff"/>
  <text x="60" y="42" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#0f172a">同一套循环骨架、只换指令体：每周期能完成几条</text>
  <text x="60" y="64" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">浅柱是按端口数或延迟算出来的理论值，深柱是实测；两者几乎等高，就说明上限定在端口上</text>

  <rect x="40" y="80" width="920" height="286" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="76" y1="316" x2="940" y2="316" stroke="#cbd5e1"/>

  <!-- 1 独立 add -->
  <rect x="92" y="125.5" width="40" height="190.5" rx="4" fill="#e2e8f0"/>
  <rect x="140" y="147" width="40" height="169" rx="4" fill="#2563eb"/>
  <text x="92" y="117" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#1e40af">3.55</text>
  <text x="92" y="336" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#0f172a">独立 add</text>
  <text x="92" y="352" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#475569">理论 4 条 → 4 个 ALU 端口</text>

  <!-- 2 独立 load -->
  <rect x="268" y="220.8" width="40" height="95.2" rx="4" fill="#e2e8f0"/>
  <rect x="316" y="227.9" width="40" height="88.1" rx="4" fill="#2563eb"/>
  <text x="268" y="212" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#1e40af">1.85</text>
  <text x="268" y="336" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#0f172a">独立 load</text>
  <text x="268" y="352" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#475569">理论 2 条 → 2 个 load 端口</text>

  <!-- 3 独立 store -->
  <rect x="444" y="268.4" width="40" height="47.6" rx="4" fill="#e2e8f0"/>
  <rect x="492" y="270.8" width="40" height="45.2" rx="4" fill="#2563eb"/>
  <text x="444" y="260" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#1e40af">0.95</text>
  <text x="444" y="336" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#0f172a">独立 store</text>
  <text x="444" y="352" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#475569">理论 1 条 → 1 个 store 端口</text>

  <!-- 4 依赖 add -->
  <rect x="620" y="268.4" width="40" height="47.6" rx="4" fill="#e2e8f0"/>
  <rect x="668" y="268.9" width="40" height="47.1" rx="4" fill="#ea580c"/>
  <text x="620" y="260" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#9a3412">0.99</text>
  <text x="620" y="336" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#0f172a">依赖 add</text>
  <text x="620" y="352" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#475569">理论 1 条 → 延迟 1 周期</text>

  <!-- 5 依赖 imul -->
  <rect x="796" y="300.3" width="40" height="15.7" rx="4" fill="#e2e8f0"/>
  <rect x="844" y="300.3" width="40" height="15.7" rx="4" fill="#ea580c"/>
  <text x="796" y="292" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#9a3412">0.33</text>
  <text x="796" y="336" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#0f172a">依赖 imul</text>
  <text x="796" y="352" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#475569">理论 1/3 条 → 延迟 3 周期</text>

  <rect x="60" y="374" width="880" height="40" rx="6" fill="#fef3c7"/>
  <text x="76" y="388" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#92400e">从 3.55 到 0.33：差 10.8 倍。五档的循环骨架一字不差，变的只有「这条指令能用几个端口 / 要等几个周期」</text>
  <text x="76" y="404" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#a16207">正文表格给的是每条多少周期，这里是它的倒数——柱越高越快</text>
</svg>
