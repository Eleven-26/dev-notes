<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0f172a">位运算是 64 个互不相通的门，加法是一条链</text>
  <rect x="32" y="54" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="72" font-size="13" fill="#64748b">同样的位宽，一个每位的输入只来自本位，一个每位都要等低位把进位送上来。</text>

  <rect x="36" y="96" width="440" height="300" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="56" y="122" font-size="14.5" font-weight="bold" fill="#047857">a &amp; b：每位一个门</text>

  <text x="76" y="156" font-size="12" font-family="Consolas, monospace" fill="#065f46">a7 a6 a5 a4 ... a1 a0</text>
  <text x="76" y="172" font-size="12" font-family="Consolas, monospace" fill="#065f46">b7 b6 b5 b4 ... b1 b0</text>

  <rect x="70" y="188" width="32" height="28" rx="4" fill="#d1fae5" stroke="#34d399"/>
  <text x="86" y="207" font-size="12" fill="#065f46" text-anchor="middle">&amp;</text>
  <rect x="112" y="188" width="32" height="28" rx="4" fill="#d1fae5" stroke="#34d399"/>
  <text x="128" y="207" font-size="12" fill="#065f46" text-anchor="middle">&amp;</text>
  <rect x="154" y="188" width="32" height="28" rx="4" fill="#d1fae5" stroke="#34d399"/>
  <text x="170" y="207" font-size="12" fill="#065f46" text-anchor="middle">&amp;</text>
  <rect x="196" y="188" width="32" height="28" rx="4" fill="#d1fae5" stroke="#34d399"/>
  <text x="212" y="207" font-size="12" fill="#065f46" text-anchor="middle">&amp;</text>
  <text x="250" y="207" font-size="13" fill="#047857">......</text>
  <rect x="290" y="188" width="32" height="28" rx="4" fill="#d1fae5" stroke="#34d399"/>
  <text x="306" y="207" font-size="12" fill="#065f46" text-anchor="middle">&amp;</text>
  <rect x="332" y="188" width="32" height="28" rx="4" fill="#d1fae5" stroke="#34d399"/>
  <text x="348" y="207" font-size="12" fill="#065f46" text-anchor="middle">&amp;</text>

  <text x="76" y="246" font-size="12" font-family="Consolas, monospace" fill="#065f46">r7 r6 r5 r4 ... r1 r0</text>

  <line x1="60" y1="272" x2="452" y2="272" stroke="#a7f3d0" stroke-width="1"/>
  <text x="76" y="296" font-size="12.5" fill="#065f46">门与门之间没有任何连线。</text>
  <text x="76" y="318" font-size="12.5" fill="#065f46">第 3 位算完了不必等第 2 位。</text>

  <rect x="70" y="336" width="372" height="44" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="256" y="363" font-size="12.5" fill="#047857" text-anchor="middle">延迟 = 1 个门，与位宽无关（64 位也是 1 拍）</text>

  <rect x="504" y="96" width="460" height="300" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="524" y="122" font-size="14.5" font-weight="bold" fill="#b91c1c">a + b：全加器串成一条链</text>

  <text x="536" y="156" font-size="12" font-family="Consolas, monospace" fill="#7f1d1d">a3 a2 a1 a0　+　b3 b2 b1 b0</text>

  <rect x="530" y="182" width="52" height="34" rx="4" fill="#fee2e2" stroke="#f87171"/>
  <text x="556" y="204" font-size="12" fill="#7f1d1d" text-anchor="middle">FA0</text>
  <rect x="614" y="182" width="52" height="34" rx="4" fill="#fee2e2" stroke="#f87171"/>
  <text x="640" y="204" font-size="12" fill="#7f1d1d" text-anchor="middle">FA1</text>
  <rect x="698" y="182" width="52" height="34" rx="4" fill="#fee2e2" stroke="#f87171"/>
  <text x="724" y="204" font-size="12" fill="#7f1d1d" text-anchor="middle">FA2</text>
  <rect x="782" y="182" width="52" height="34" rx="4" fill="#fee2e2" stroke="#f87171"/>
  <text x="808" y="204" font-size="12" fill="#7f1d1d" text-anchor="middle">FA3</text>
  <text x="862" y="204" font-size="13" fill="#b91c1c">......</text>

  <line x1="582" y1="199" x2="610" y2="199" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ar1)"/>
  <line x1="666" y1="199" x2="694" y2="199" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ar1)"/>
  <line x1="750" y1="199" x2="778" y2="199" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ar1)"/>
  <text x="596" y="192" font-size="10.5" fill="#dc2626" text-anchor="middle">c1</text>
  <text x="680" y="192" font-size="10.5" fill="#dc2626" text-anchor="middle">c2</text>
  <text x="764" y="192" font-size="10.5" fill="#dc2626" text-anchor="middle">c3</text>

  <text x="556" y="240" font-size="11.5" fill="#991b1b" text-anchor="middle">r0</text>
  <text x="640" y="240" font-size="11.5" fill="#991b1b" text-anchor="middle">r1</text>
  <text x="724" y="240" font-size="11.5" fill="#991b1b" text-anchor="middle">r2</text>
  <text x="808" y="240" font-size="11.5" fill="#991b1b" text-anchor="middle">r3</text>

  <line x1="516" y1="262" x2="952" y2="262" stroke="#fecaca" stroke-width="1"/>
  <text x="524" y="286" font-size="12.5" fill="#7f1d1d">FA0 算完 c1，FA1 才能算；FA1 算完 c2，FA2 才能算。</text>
  <text x="524" y="308" font-size="12.5" fill="#7f1d1d">信息必须横向流动——这是「进位」的定义。</text>

  <rect x="524" y="326" width="420" height="54" rx="6" fill="#ffffff" stroke="#fecaca"/>
  <text x="734" y="348" font-size="12.5" fill="#b91c1c" text-anchor="middle">行波进位：延迟 ∝ 位宽（64 位要串 64 级）</text>
  <text x="734" y="368" font-size="12.5" fill="#b91c1c" text-anchor="middle">超前进位：压到 log 级，所以 64 位 add 也是 1 拍</text>

  <rect x="36" y="416" width="928" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="438" font-size="12.5" fill="#334155">实测（依赖链，各 5000 万次 × 5 轮取最快）：and 0.4599 ns / add 0.4559 ns / sub 0.4432 ns —— 三条都在 1.1 周期档，差异在噪声内。</text>
  <text x="52" y="456" font-size="12.5" fill="#334155">乘除才是另一档：imul 1.2243 ns（3.00 周期）、idiv 9.3949 ns（23.03 周期）。所以「位运算更快」在 64 位整数上量不出来。</text>

  <rect x="36" y="480" width="928" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="52" y="507" font-size="12.5" fill="#1e40af">差别在别处：位宽变宽时进位链变长、逻辑门不变；每一位独立所以能并行判定、能向量化。这才是位运算真正值钱的地方。</text>

  <defs>
    <marker id="ar1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
