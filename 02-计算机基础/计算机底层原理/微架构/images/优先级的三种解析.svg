<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0f172a">同一行 a &amp; b == c，三种语言三棵树</text>
  <rect x="32" y="54" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="72" font-size="13" fill="#64748b">取 a=6, b=3, c=2。源码一模一样，解析出来的树不一样，结果就不一样。</text>

  <rect x="36" y="96" width="300" height="300" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="56" y="122" font-size="15" font-weight="bold" fill="#b91c1c">C：== 高于 &amp;</text>
  <text x="56" y="146" font-size="12" font-family="Consolas, monospace" fill="#7f1d1d">a &amp; (b == c)</text>

  <rect x="166" y="166" width="40" height="30" rx="4" fill="#fee2e2" stroke="#f87171"/>
  <text x="186" y="186" font-size="14" fill="#991b1b" text-anchor="middle">&amp;</text>
  <line x1="176" y1="196" x2="126" y2="228" stroke="#f87171"/>
  <line x1="196" y1="196" x2="246" y2="228" stroke="#f87171"/>
  <text x="126" y="248" font-size="13" font-family="Consolas, monospace" fill="#7f1d1d" text-anchor="middle">a = 6</text>
  <rect x="216" y="228" width="60" height="28" rx="4" fill="#fee2e2" stroke="#f87171"/>
  <text x="246" y="247" font-size="13" fill="#991b1b" text-anchor="middle">b == c</text>
  <text x="186" y="286" font-size="12" fill="#7f1d1d" text-anchor="middle">= 6 &amp; 0 = 0</text>

  <rect x="56" y="306" width="260" height="72" rx="6" fill="#ffffff" stroke="#fecaca"/>
  <text x="186" y="328" font-size="12" fill="#b91c1c" text-anchor="middle">结果 0</text>
  <text x="186" y="350" font-size="11.5" fill="#64748b" text-anchor="middle">gcc 给 -Wparentheses 警告</text>
  <text x="186" y="368" font-size="11.5" fill="#64748b" text-anchor="middle">但编得过</text>

  <rect x="350" y="96" width="300" height="300" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="370" y="122" font-size="15" font-weight="bold" fill="#047857">Go：&amp; 高于 ==</text>
  <text x="370" y="146" font-size="12" font-family="Consolas, monospace" fill="#065f46">(a &amp; b) == c</text>

  <rect x="480" y="166" width="40" height="30" rx="4" fill="#d1fae5" stroke="#34d399"/>
  <text x="500" y="186" font-size="14" fill="#065f46" text-anchor="middle">==</text>
  <line x1="490" y1="196" x2="440" y2="228" stroke="#34d399"/>
  <line x1="510" y1="196" x2="560" y2="228" stroke="#34d399"/>
  <rect x="410" y="228" width="60" height="28" rx="4" fill="#d1fae5" stroke="#34d399"/>
  <text x="440" y="247" font-size="13" fill="#065f46" text-anchor="middle">a &amp; b</text>
  <text x="560" y="248" font-size="13" font-family="Consolas, monospace" fill="#065f46" text-anchor="middle">c = 2</text>
  <text x="500" y="286" font-size="12" fill="#065f46" text-anchor="middle">= 2 == 2 = true</text>

  <rect x="370" y="306" width="260" height="72" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="500" y="328" font-size="12" fill="#047857" text-anchor="middle">结果 true</text>
  <text x="500" y="350" font-size="11.5" fill="#64748b" text-anchor="middle">不警告 —— 这就是 Go 里的正确写法</text>
  <text x="500" y="368" font-size="11.5" fill="#64748b" text-anchor="middle">照抄到 C 里就变意思</text>

  <rect x="664" y="96" width="300" height="300" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="684" y="122" font-size="15" font-weight="bold" fill="#92400e">Java：== 高于 &amp;</text>
  <text x="684" y="146" font-size="12" font-family="Consolas, monospace" fill="#78350f">a &amp; (b == c)</text>

  <rect x="794" y="166" width="40" height="30" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="814" y="186" font-size="14" fill="#92400e" text-anchor="middle">&amp;</text>
  <line x1="804" y1="196" x2="754" y2="228" stroke="#f59e0b"/>
  <line x1="824" y1="196" x2="874" y2="228" stroke="#f59e0b"/>
  <text x="754" y="248" font-size="13" font-family="Consolas, monospace" fill="#78350f" text-anchor="middle">int a</text>
  <rect x="844" y="228" width="60" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="874" y="247" font-size="13" fill="#92400e" text-anchor="middle">b == c</text>
  <text x="814" y="286" font-size="12" fill="#78350f" text-anchor="middle">int &amp; boolean</text>

  <rect x="684" y="306" width="260" height="72" rx="6" fill="#ffffff" stroke="#fde68a"/>
  <text x="814" y="328" font-size="12" fill="#b45309" text-anchor="middle">编译失败</text>
  <text x="814" y="350" font-size="11.5" fill="#64748b" text-anchor="middle">bad operand types for '&amp;'</text>
  <text x="814" y="368" font-size="11.5" fill="#64748b" text-anchor="middle">类型系统把它挡住了</text>

  <rect x="36" y="412" width="928" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="432" font-size="12.5" fill="#334155">⚠️ 三个结果里只有 Java 是安全的（编不过）。C 只警告、Go 不警告 —— 两个都「编得过、跑得出、可能是错的」。</text>
  <text x="52" y="450" font-size="12.5" fill="#334155">所以「加括号」不是为了好看，是因为同一行代码换个语言就是另一个意思。</text>

  <rect x="36" y="464" width="928" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="52" y="483" font-size="11.5" fill="#1e40af">⭐ 规则一句话：C / Java 里比较高于位与，Go 里位与高于比较 —— 记反了就会在跨语言搬运时静默改语义。</text>
</svg>
