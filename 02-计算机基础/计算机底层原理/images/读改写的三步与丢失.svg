<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">两次加法，只留下一次结果：读改写三步之间可以被插进来</text>
  <rect x="32" y="52" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="70" font-size="13" fill="#64748b">同一个变量 x 初值 100，两个线程各做一次 x++，期望 102，实测 101。</text>

  <rect x="32" y="92" width="936" height="248" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="60" y="120" font-size="12" font-weight="bold" fill="#64748b">线程 A</text>
  <line x1="150" y1="146" x2="930" y2="146" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="170" y="126" width="96" height="30" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="218" y="146" font-size="12" fill="#1e40af" text-anchor="middle">读 x → 100</text>

  <rect x="470" y="126" width="96" height="30" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="518" y="146" font-size="12" fill="#1e40af" text-anchor="middle">写 x = 101</text>

  <line x1="266" y1="141" x2="470" y2="141" stroke="#3b82f6" stroke-dasharray="5 4"/>
  <text x="368" y="134" font-size="11" fill="#1e40af" text-anchor="middle">寄存器里算 100+1</text>

  <text x="60" y="212" font-size="12" font-weight="bold" fill="#64748b">线程 B</text>
  <line x1="150" y1="238" x2="930" y2="238" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="240" y="218" width="96" height="30" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="288" y="238" font-size="12" fill="#92400e" text-anchor="middle">读 x → 100</text>

  <rect x="640" y="218" width="96" height="30" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="688" y="238" font-size="12" fill="#92400e" text-anchor="middle">写 x = 101</text>

  <line x1="336" y1="233" x2="640" y2="233" stroke="#f59e0b" stroke-dasharray="5 4"/>
  <text x="488" y="226" font-size="11" fill="#92400e" text-anchor="middle">寄存器里算 100+1</text>

  <line x1="518" y1="156" x2="518" y2="218" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <line x1="688" y1="156" x2="688" y2="218" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <text x="730" y="196" font-size="11" fill="#475569">两次写都基于同一个旧值 100</text>

  <rect x="170" y="272" width="770" height="48" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="188" y="292" font-size="13" fill="#991b1b">结果 x = 101，期望 102</text>
  <text x="188" y="310" font-size="12" fill="#991b1b">丢的那一次不是「没执行」，是执行完又被后一个写覆盖 —— 指令数没少，结果少了 1。</text>

  <rect x="32" y="356" width="936" height="64" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="44" y="378" font-size="12" fill="#1e40af">这不是「指令太大」的问题：INCQ 只是一条指令，但它在微架构里仍是读 → 加 → 写三步。</text>
  <text x="44" y="400" font-size="12" fill="#1e40af">要修只有两条路 —— 让这三步在硬件里不可分割（LOCK 前缀），或者在指令外面套一个同一时刻只许一个线程进入的协议（互斥）。</text>
</svg>
