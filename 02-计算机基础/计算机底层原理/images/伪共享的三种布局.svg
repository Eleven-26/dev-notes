<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">伪共享的三种布局：只有第三种把两个热点的地址真正拉开</text>
  <rect x="32" y="52" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="70" font-size="13" fill="#64748b">每格 8 字节，一行 8 格共 64 字节；右侧为两个 goroutine 各加 200 万次的三轮读数。</text>

  <rect x="32" y="92" width="936" height="104" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="116" font-size="13" font-weight="bold" fill="#0f172a">布局 A：一个结构体里两个字段，间隔 8 字节</text>
  <rect x="140" y="128" width="60" height="30" rx="3" fill="#fecaca" stroke="#ef4444"/>
  <text x="164" y="148" font-size="13" font-weight="bold" fill="#991b1b">a</text>
  <rect x="200" y="128" width="60" height="30" rx="3" fill="#fecaca" stroke="#ef4444"/>
  <text x="224" y="148" font-size="13" font-weight="bold" fill="#991b1b">b</text>
  <rect x="260" y="128" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="320" y="128" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="380" y="128" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="440" y="128" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="500" y="128" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="560" y="128" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="640" y="148" font-size="12" fill="#475569">两个核抢同一行</text>
  <text x="790" y="141" font-size="12" font-weight="bold" fill="#991b1b">37.55 / 44.07 / 45.57</text>
  <text x="790" y="159" font-size="11" fill="#64748b">ns/op 慢</text>

  <rect x="32" y="204" width="936" height="104" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="228" font-size="13" font-weight="bold" fill="#0f172a">布局 B：分片了，但元素之间只隔 16 字节</text>
  <rect x="140" y="240" width="60" height="30" rx="3" fill="#fecaca" stroke="#ef4444"/>
  <text x="152" y="260" font-size="12" font-weight="bold" fill="#991b1b">[0].a</text>
  <rect x="200" y="240" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="222" y="260" font-size="11" fill="#94a3b8">[0].b</text>
  <rect x="260" y="240" width="60" height="30" rx="3" fill="#fecaca" stroke="#ef4444"/>
  <text x="272" y="260" font-size="12" font-weight="bold" fill="#991b1b">[1].a</text>
  <rect x="320" y="240" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="380" y="240" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="440" y="240" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="500" y="240" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="560" y="240" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="640" y="260" font-size="12" fill="#475569">还是同一行</text>
  <text x="790" y="253" font-size="12" font-weight="bold" fill="#991b1b">38.16 / 36.37 / 42.45</text>
  <text x="790" y="271" font-size="11" fill="#64748b">ns/op 没好转</text>

  <rect x="32" y="316" width="936" height="140" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="52" y="340" font-size="13" font-weight="bold" fill="#0f172a">布局 C：元素补齐到 72 字节，两个 a 落在不同行</text>
  <text x="52" y="368" font-size="11" fill="#64748b">行 1</text>
  <rect x="140" y="352" width="60" height="30" rx="3" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="152" y="372" font-size="12" font-weight="bold" fill="#15803d">[0].a</text>
  <rect x="200" y="352" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="260" y="352" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="320" y="352" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="380" y="352" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="440" y="352" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="500" y="352" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="560" y="352" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="52" y="406" font-size="11" fill="#64748b">行 2</text>
  <rect x="140" y="390" width="60" height="30" rx="3" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="152" y="410" font-size="12" font-weight="bold" fill="#15803d">[1].a</text>
  <rect x="200" y="390" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="260" y="390" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="320" y="390" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="380" y="390" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="440" y="390" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="500" y="390" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="560" y="390" width="60" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="640" y="386" font-size="12" fill="#15803d">各自独占一行</text>
  <text x="790" y="379" font-size="12" font-weight="bold" fill="#15803d">8.550 / 11.65 / 8.232</text>
  <text x="790" y="397" font-size="11" fill="#15803d">ns/op 快 4~5 倍</text>

  <rect x="32" y="468" width="936" height="40" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="44" y="486" font-size="12" fill="#1e40af">布局 B 是最容易写错的一格：「每个 worker 一份」听起来已经解决了共享，但数组元素紧挨着，间隔只有结构体大小。</text>
  <text x="44" y="502" font-size="12" fill="#1e40af">分片要生效，元素之间的间隔必须 ≥ 一条缓存行；只改「谁的变量」不够。</text>
</svg>
