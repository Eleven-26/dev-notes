<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="446" viewBox="0 0 1000 446">
  <rect x="0" y="0" width="1000" height="446" fill="#ffffff"/>
  <rect x="40" y="16" width="920" height="58" fill="#ffffff"/>
  <text x="60" y="44" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#0f172a">同样的 2 亿次加法：每完成一次花几个时钟周期</text>
  <text x="60" y="66" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">柱子越矮越好；三份代码的加法次数完全相同，变化只有「同时在算的加法有几条」</text>

  <rect x="40" y="74" width="920" height="280" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="150" y="106" width="130" height="194" rx="6" fill="#dc2626"/>
  <text x="172" y="100" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#dc2626">8.81</text>
  <text x="166" y="200" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#ffffff">1 条依赖链</text>
  <text x="176" y="222" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#fee2e2">每次都要等</text>
  <text x="150" y="322" font-family="Consolas, monospace" font-size="13" fill="#0f172a">dep</text>
  <text x="150" y="340" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#475569">IPC 0.57</text>

  <rect x="420" y="244" width="130" height="56" rx="6" fill="#ea580c"/>
  <text x="442" y="234" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#ea580c">2.55</text>
  <text x="436" y="268" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#ffffff">4 条链</text>
  <text x="420" y="322" font-family="Consolas, monospace" font-size="13" fill="#0f172a">indep4</text>
  <text x="420" y="340" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#475569">IPC 1.38</text>

  <rect x="690" y="260" width="130" height="40" rx="6" fill="#0d9488"/>
  <text x="712" y="250" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#0d9488">1.81</text>
  <text x="706" y="286" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#ffffff">8 条链</text>
  <text x="690" y="322" font-family="Consolas, monospace" font-size="13" fill="#0f172a">indep8</text>
  <text x="690" y="340" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#475569">IPC 1.79</text>

  <rect x="60" y="368" width="880" height="30" rx="6" fill="#fef3c7"/>
  <text x="76" y="388" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#92400e">8.81 到 1.81：差 4.85 倍。硬件没换、加法次数没变，只是让 8 条互不依赖的链同时在飞</text>
</svg>
