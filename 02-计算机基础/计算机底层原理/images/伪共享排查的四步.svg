<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">现场排查的四步：先排除共享写，再量间隔，最后才谈 pad</text>
  <rect x="32" y="52" width="936" height="26" rx="4" fill="#f8fafc"/>
  <text x="40" y="70" font-size="13" fill="#64748b">顺序不能换：前两步没排除就加填充，可能只是把数据挪到了另一条行，也可能根本没生效。</text>

  <rect x="32" y="92" width="936" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="52" y="108" width="26" height="26" rx="13" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="60" y="126" font-size="13" font-weight="bold" fill="#1e40af">1</text>
  <text x="92" y="126" font-size="14" font-weight="bold" fill="#0f172a">确认是共享写</text>
  <text x="280" y="120" font-size="12" fill="#334155">多核都高、总吞吐不涨；CPU/墙钟 > 核数的一半 → 共享行反复易主</text>
  <text x="280" y="142" font-size="11" fill="#64748b">反例：单点竞争是「单核接近 100%」，不是多核齐高；加了线程吞吐反降也是同一信号</text>

  <rect x="32" y="176" width="936" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="52" y="192" width="26" height="26" rx="13" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="60" y="210" font-size="13" font-weight="bold" fill="#1e40af">2</text>
  <text x="92" y="210" font-size="14" font-weight="bold" fill="#0f172a">量运行时地址间隔</text>
  <text x="280" y="204" font-size="12" fill="#334155">间隔 &lt; 64 → 确定有问题；间隔 ≥ 64 → 不可能同行，直接排除</text>
  <text x="280" y="226" font-size="11" fill="#64748b">不要看字段偏移，看 uintptr(unsafe.Pointer(&amp;a)) 与 &amp;b 的差；栈上对象还要看起点 mod 64</text>

  <rect x="32" y="260" width="936" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="52" y="276" width="26" height="26" rx="13" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="60" y="294" font-size="13" font-weight="bold" fill="#1e40af">3</text>
  <text x="92" y="294" font-size="14" font-weight="bold" fill="#0f172a">改布局，先分片后填充</text>
  <text x="280" y="288" font-size="12" fill="#334155">① 每个 worker 独立分配 ② 切片元素补到 128 的倍数 ③ 才轮到给字段插 pad</text>
  <text x="280" y="310" font-size="11" fill="#64748b">第 ① 步常常就够了：独立分配的对象之间还有分配器的元数据，天然跨行</text>

  <rect x="32" y="344" width="936" height="76" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <rect x="52" y="360" width="26" height="26" rx="13" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="60" y="378" font-size="13" font-weight="bold" fill="#15803d">4</text>
  <text x="92" y="378" font-size="14" font-weight="bold" fill="#0f172a">复测三对照</text>
  <text x="280" y="372" font-size="12" fill="#334155">同负载 3 轮取区间 / 加一档单核（改动只应在多核下有效）/ 看 allocs/op 有没有被 pad 带涨</text>
  <text x="280" y="394" font-size="11" fill="#64748b">只看代码不看读数是这类改动最常见的返工原因，单核档能证伪「其实是别的原因」</text>

  <rect x="32" y="430" width="936" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="44" y="450" font-size="12" fill="#1e40af">四步都能对上读数，才敢说「这处改对了」；对不上就回到第 1 步重判，别在布局上反复试。</text>
</svg>
