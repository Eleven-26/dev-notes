<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">以太网 II 帧的三段结构</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">14 字节 MAC 首部 + 46 ~ 1500 字节载荷 + 4 字节 FCS 帧尾；MTU 指的是载荷上限，18 字节是把帧尾也算进了首部</text>

  <rect x="10" y="80" width="980" height="128" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <rect x="20" y="96" width="70" height="64" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="55" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">前导码</text>
  <text x="55" y="139" text-anchor="middle" font-size="9.5" fill="#64748b">+ SFD</text>
  <text x="55" y="154" text-anchor="middle" font-size="9.5" fill="#64748b">8 B</text>

  <rect x="90" y="96" width="110" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="145" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">目的 MAC</text>
  <text x="145" y="139" text-anchor="middle" font-size="9.5" fill="#1e40af">接收方网卡</text>
  <text x="145" y="154" text-anchor="middle" font-size="9.5" fill="#1e40af">6 字节</text>

  <rect x="200" y="96" width="110" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="255" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">源 MAC</text>
  <text x="255" y="139" text-anchor="middle" font-size="9.5" fill="#1e40af">发送方网卡</text>
  <text x="255" y="154" text-anchor="middle" font-size="9.5" fill="#1e40af">6 字节</text>

  <rect x="310" y="96" width="70" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="345" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">类型</text>
  <text x="345" y="139" text-anchor="middle" font-size="9.5" fill="#1e40af">0x0800</text>
  <text x="345" y="154" text-anchor="middle" font-size="9.5" fill="#1e40af">2 字节</text>

  <rect x="380" y="96" width="510" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="635" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">载荷 Payload：通常就是整个 IP 包</text>
  <text x="635" y="139" text-anchor="middle" font-size="9.5" fill="#14532d">MTU = 1500 字节指的就是这一段的上限</text>
  <text x="635" y="154" text-anchor="middle" font-size="9.5" fill="#14532d">46 ~ 1500 字节（不足 46 由网卡补 PAD）</text>

  <rect x="890" y="96" width="60" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="920" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">FCS</text>
  <text x="920" y="139" text-anchor="middle" font-size="9.5" fill="#991b1b">帧尾</text>
  <text x="920" y="154" text-anchor="middle" font-size="9.5" fill="#991b1b">4 B</text>

  <line x1="90" y1="180" x2="380" y2="180" stroke="#64748b" stroke-width="1.1"/>
  <line x1="90" y1="176" x2="90" y2="184" stroke="#64748b" stroke-width="1.1"/>
  <line x1="380" y1="176" x2="380" y2="184" stroke="#64748b" stroke-width="1.1"/>
  <text x="235" y="198" text-anchor="middle" font-size="11" fill="#334155">MAC 首部 14 字节（6 + 6 + 2）</text>

  <line x1="890" y1="180" x2="950" y2="180" stroke="#dc2626" stroke-width="1.1"/>
  <line x1="890" y1="176" x2="890" y2="184" stroke="#dc2626" stroke-width="1.1"/>
  <line x1="950" y1="176" x2="950" y2="184" stroke="#dc2626" stroke-width="1.1"/>
  <text x="920" y="198" text-anchor="middle" font-size="11" fill="#991b1b">帧尾 4 字节</text>

  <text x="55" y="198" text-anchor="middle" font-size="10" fill="#94a3b8">不计入帧长</text>

  <rect x="20" y="228" width="460" height="164" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="34" y="254" font-size="15" font-weight="bold" fill="#0f172a">802.1Q VLAN 标签：首部变 18 字节</text>
  <text x="34" y="282" font-size="10.5" fill="#334155">插在「源 MAC」与「类型」之间，占 4 字节</text>
  <text x="34" y="302" font-size="10.5" fill="#334155">（2 字节 TPID + 2 字节 TCI）</text>
  <text x="34" y="328" font-size="10.5" fill="#334155">此时帧最大 1522 字节，但 MTU 仍是 1500</text>
  <text x="34" y="354" font-size="10.5" fill="#334155">QinQ 双层标签再加 4 字节，帧最大 1526</text>
  <text x="34" y="378" font-size="10" fill="#64748b">首部只描述「这一跳交给谁」，逐跳都会被重写</text>

  <rect x="520" y="228" width="460" height="164" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="534" y="254" font-size="15" font-weight="bold" fill="#0f172a">三个常被记错的点</text>
  <text x="534" y="282" font-size="10.5" fill="#334155">18 不是首部长度：14 首部 + 4 帧尾被加在了一起</text>
  <text x="534" y="306" font-size="10.5" fill="#334155">抓包里通常看不到 FCS，网卡校验后会先剥掉它</text>
  <text x="534" y="330" font-size="10.5" fill="#334155">最小帧 64 字节 = 14 + 46 + 4，载荷不足时补 PAD</text>
  <text x="534" y="354" font-size="10.5" fill="#334155">单播是常态，交换机只从目的 MAC 对应的口发出</text>
  <text x="534" y="378" font-size="10" fill="#64748b">只有广播、组播与未知单播帧才会被泛洪</text>
</svg>
