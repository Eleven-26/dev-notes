<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">交换机按目的 MAC 查表转发</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">先学习源 MAC，再按目的 MAC 决定：已知单播走一个口，未知单播与广播 / 组播泛洪到其余端口</text>

  <rect x="28" y="82" width="300" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="108" font-size="13" font-weight="bold" fill="#334155">MAC 地址表（CAM）</text>
  <line x1="44" y1="120" x2="312" y2="120" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="142" font-size="11" fill="#64748b">MAC</text>
  <text x="232" y="142" font-size="11" fill="#64748b">端口</text>
  <text x="52" y="168" font-size="11.5" fill="#1e40af" font-family="Consolas, monospace">AA:AA:AA:AA:AA:01</text>
  <text x="250" y="168" font-size="11.5" fill="#1e40af">1</text>
  <text x="52" y="192" font-size="11.5" fill="#1e40af" font-family="Consolas, monospace">BB:BB:BB:BB:BB:02</text>
  <text x="250" y="192" font-size="11.5" fill="#1e40af">2</text>
  <text x="52" y="216" font-size="11.5" fill="#94a3b8" font-family="Consolas, monospace">（CC:CC:…:03 尚未学习）</text>

  <rect x="348" y="82" width="624" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="366" y="108" font-size="13" font-weight="bold" fill="#334155">收到一帧之后的三个分支</text>
  <rect x="366" y="124" width="184" height="44" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="458" y="142" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">目的 MAC 命中表项</text>
  <text x="458" y="159" text-anchor="middle" font-size="10.5" fill="#1e40af">已知单播 → 只从该端口转发</text>
  <rect x="566" y="124" width="190" height="44" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="661" y="142" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">目的 MAC 不在表里</text>
  <text x="661" y="159" text-anchor="middle" font-size="10.5" fill="#92400e">未知单播 → 泛洪到其余端口</text>
  <rect x="772" y="124" width="184" height="44" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="864" y="142" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">广播 / 组播 MAC</text>
  <text x="864" y="159" text-anchor="middle" font-size="10.5" fill="#991b1b">无论表项如何都要泛洪</text>
  <text x="366" y="196" font-size="11" fill="#64748b">每条分支之前都先做「学习」：把源 MAC 与入端口写入表项（并刷新老化计时）。</text>
  <text x="366" y="216" font-size="11" fill="#64748b">泛洪范围受 VLAN 限制；表项老化后，原本的单播会重新回到未知单播分支。</text>

  <rect x="430" y="268" width="140" height="62" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="500" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">交换机</text>
  <text x="500" y="314" text-anchor="middle" font-size="10.5" fill="#4338ca">MAC 表 + 泛洪逻辑</text>

  <rect x="60" y="372" width="150" height="54" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="135" y="394" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">主机 A</text>
  <text x="135" y="412" text-anchor="middle" font-size="10" fill="#64748b">端口 1 · …:01</text>

  <rect x="300" y="372" width="150" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="375" y="394" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">主机 B（目的）</text>
  <text x="375" y="412" text-anchor="middle" font-size="10" fill="#14532d">端口 2 · …:02</text>

  <rect x="550" y="372" width="150" height="54" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="625" y="394" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">主机 C</text>
  <text x="625" y="412" text-anchor="middle" font-size="10" fill="#64748b">端口 3 · 未学习</text>

  <rect x="790" y="372" width="150" height="54" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="865" y="394" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">主机 D</text>
  <text x="865" y="412" text-anchor="middle" font-size="10" fill="#64748b">端口 4</text>

  <line x1="452" y1="330" x2="135" y2="372" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="480" y1="330" x2="375" y2="372" stroke="#16a34a" stroke-width="2.2"/>
  <line x1="520" y1="330" x2="625" y2="372" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="548" y1="330" x2="865" y2="372" stroke="#94a3b8" stroke-width="1.4"/>

  <text x="330" y="352" font-size="10.5" fill="#16a34a">A → B（已知单播）：只走端口 2</text>
  <text x="560" y="352" font-size="10.5" fill="#92400e">A → C（未知单播）：端口 2 / 3 / 4 都收到</text>

  <text x="30" y="446" font-size="10.5" fill="#94a3b8">注：MAC 与端口为示意；实际表项还带 VLAN、老化时间等字段。「学习」发生在转发判断之前，所以 A 发出的帧会让交换机记住 A 在端口 1。</text>
</svg>
