<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">每轮 20 个并发请求，上游侧新建了几条连接</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">同一份 ReverseProxy 代码，只差 MaxIdleConnsPerHost；go1.26.8 linux/amd64，容器内跑 3 轮</text>

  <text x="40" y="80" font-size="12" font-weight="bold" fill="#0f172a">代理到上游那条腿的新建连接数</text>

  <line x1="120" y1="130" x2="940" y2="130" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="120" y1="205" x2="940" y2="205" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="120" y1="280" x2="940" y2="280" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="120" y1="355" x2="940" y2="355" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="120" y1="430" x2="940" y2="430" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="120" y1="130" x2="120" y2="430" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="112" y="434" text-anchor="end" font-size="11" fill="#64748b">0</text>
  <text x="112" y="359" text-anchor="end" font-size="11" fill="#64748b">5</text>
  <text x="112" y="284" text-anchor="end" font-size="11" fill="#64748b">10</text>
  <text x="112" y="209" text-anchor="end" font-size="11" fill="#64748b">15</text>
  <text x="112" y="134" text-anchor="end" font-size="11" fill="#64748b">20</text>
  <line x1="120" y1="400" x2="940" y2="400" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="128" y="396" font-size="11" fill="#991b1b">上限 2 时，池里最多只能留 2 条空闲连接</text>

  <rect x="180" y="235" width="70" height="195" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="215" y="228" text-anchor="middle" font-size="12" fill="#475569">13</text>
  <rect x="280" y="190" width="70" height="240" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="315" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">16</text>
  <rect x="380" y="235" width="70" height="195" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="415" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">13</text>

  <rect x="560" y="130" width="70" height="300" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="595" y="123" text-anchor="middle" font-size="12" fill="#475569">20 冷启动</text>
  <rect x="660" y="427" width="70" height="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="695" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">0</text>
  <rect x="760" y="427" width="70" height="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="795" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">0</text>

  <text x="215" y="452" text-anchor="middle" font-size="11.5" fill="#0f172a">第 1 轮</text>
  <text x="315" y="452" text-anchor="middle" font-size="11.5" fill="#0f172a">第 2 轮</text>
  <text x="415" y="452" text-anchor="middle" font-size="11.5" fill="#0f172a">第 3 轮</text>
  <text x="595" y="452" text-anchor="middle" font-size="11.5" fill="#0f172a">第 1 轮</text>
  <text x="695" y="452" text-anchor="middle" font-size="11.5" fill="#0f172a">第 2 轮</text>
  <text x="795" y="452" text-anchor="middle" font-size="11.5" fill="#0f172a">第 3 轮</text>
  <text x="315" y="476" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">A：上限保持默认 2</text>
  <text x="695" y="476" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">B：上限调到 50</text>

  <line x1="40" y1="492" x2="960" y2="492" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="512" font-size="12" fill="#0f172a">客户端到代理那条腿：A、B 两轮各 20 条新建（脚本每个请求都新拨一条 TCP，所以这条腿不反映池子效果）</text>
  <text x="40" y="534" font-size="12" fill="#991b1b">趋势断言：保持 2 时每轮仍要新建 13 到 16 条，复用率只有 20% 到 35%；调到 50 后第 2、3 轮新建 0 条，20 条全复用</text>
  <text x="40" y="556" font-size="12" fill="#0f172a">第二轮是 16 而不是 18：上限限的是留在池里的空闲连接数，不是最多能用几条 —— 请求错开到达时，先完成的连接会被后到的捡走</text>
  <text x="40" y="578" font-size="12" fill="#475569">两组第一轮都是冷启动（池子是空的），差距从第二轮才显现；判据看趋势，不看 13 与 16 之间那个差值</text>
</svg>
