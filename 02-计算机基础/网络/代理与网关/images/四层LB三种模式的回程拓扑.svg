<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arwF" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 4.5 L0 9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arwR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 4.5 L0 9 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="470" fill="#ffffff"/>
  <text x="40" y="26" font-size="15" font-weight="bold" fill="#0f172a">四层 LB 三种模式：差别只在「回程走哪」</text>
  <text x="40" y="50" font-size="10.5" fill="#64748b">上排蓝线＝请求方向（左→右），下排红线＝响应方向（右→左）；右侧写明该模式改什么、回程是否经过 LB。</text>

  <path d="M190 112 L300 112 M460 112 L620 112" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwF)"/>
  <path d="M700 142 L700 160 L115 160 L115 142" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>

  <rect x="40" y="84" width="150" height="56" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" rx="6"/>
  <text x="115" y="108" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">客户端</text>
  <text x="115" y="128" font-size="10" fill="#64748b" text-anchor="middle">发往 VIP</text>

  <rect x="300" y="84" width="160" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" rx="6"/>
  <text x="380" y="108" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">四层 LB</text>
  <text x="380" y="128" font-size="10" fill="#1e40af" text-anchor="middle">只改目的 MAC</text>

  <rect x="620" y="84" width="160" height="56" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" rx="6"/>
  <text x="700" y="108" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">后端 RS</text>
  <text x="700" y="128" font-size="10" fill="#64748b" text-anchor="middle">VIP 配在环回口</text>

  <text x="380" y="152" font-size="10" fill="#94a3b8" text-anchor="middle">回程不经这里</text>

  <text x="812" y="104" font-size="12" font-weight="bold" fill="#b45309">DR（直接路由）</text>
  <text x="812" y="126" font-size="10.5" fill="#475569">回程不过 LB，性能最好</text>
  <text x="812" y="146" font-size="10.5" fill="#475569">要求 LB 与后端二层可达</text>

  <path d="M190 242 L300 242 M460 242 L620 242" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwF)"/>
  <path d="M700 272 L700 290 L432 290" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <path d="M328 290 L115 290 L115 272" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>

  <rect x="40" y="214" width="150" height="56" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" rx="6"/>
  <text x="115" y="238" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">客户端</text>
  <text x="115" y="258" font-size="10" fill="#64748b" text-anchor="middle">仍只认识 VIP</text>

  <rect x="300" y="214" width="160" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" rx="6"/>
  <text x="380" y="238" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">四层 LB</text>
  <text x="380" y="258" font-size="10" fill="#1e40af" text-anchor="middle">改目的 IP / 端口</text>

  <rect x="620" y="214" width="160" height="56" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" rx="6"/>
  <text x="700" y="238" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">后端 RS</text>
  <text x="700" y="258" font-size="10" fill="#64748b" text-anchor="middle">默认网关指向 LB</text>

  <rect x="330" y="277" width="100" height="26" fill="#fee2e2" stroke="#b91c1c" stroke-width="1" rx="4"/>
  <text x="380" y="294" font-size="10" fill="#7f1d1d" text-anchor="middle">回程再改写</text>

  <text x="812" y="234" font-size="12" font-weight="bold" fill="#b45309">NAT（LVS-NAT）</text>
  <text x="812" y="256" font-size="10.5" fill="#475569">回程必须过 LB</text>
  <text x="812" y="276" font-size="10.5" fill="#475569">LB 成为回程瓶颈</text>

  <path d="M190 372 L300 372 M460 372 L620 372" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwF)"/>
  <path d="M700 402 L700 420 L115 420 L115 402" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>
  <path d="M380 402 L380 412" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>

  <rect x="40" y="344" width="150" height="56" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" rx="6"/>
  <text x="115" y="368" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">客户端</text>
  <text x="115" y="388" font-size="10" fill="#64748b" text-anchor="middle">外层地址不看</text>

  <rect x="300" y="344" width="160" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" rx="6"/>
  <text x="380" y="368" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">四层 LB</text>
  <text x="380" y="388" font-size="10" fill="#1e40af" text-anchor="middle">外面再套一层 IP 头</text>

  <rect x="620" y="344" width="160" height="56" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" rx="6"/>
  <text x="700" y="368" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">后端 RS</text>
  <text x="700" y="388" font-size="10" fill="#64748b" text-anchor="middle">解封装后直接回</text>

  <text x="392" y="416" font-size="9.5" fill="#94a3b8">也可经 LB</text>

  <text x="812" y="364" font-size="12" font-weight="bold" fill="#b45309">隧道（IPIP / GRE）</text>
  <text x="812" y="386" font-size="10.5" fill="#475569">可跨网段，回程看后端指向</text>
  <text x="812" y="406" font-size="10.5" fill="#475569">外层封装使 MTU 变小</text>

  <text x="40" y="452" font-size="10" fill="#64748b">七层反向代理不在此列：它终结连接，客户端↔代理与代理↔后端是两条独立 TCP。</text>
</svg>
