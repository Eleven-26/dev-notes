<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">四个容器、三跳连接：TLS 只终结在第一跳</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">容器实测网络 192.168.224.0/24，客户端请求 https://w2r2c-front/api/order/list 并带伪造的 X-Forwarded-For: 1.2.3.4</text>

  <rect x="40" y="76" width="190" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="135" y="100" text-anchor="middle" font-size="13" fill="#0f172a">客户端 cli</text>
  <text x="135" y="120" text-anchor="middle" font-size="11" fill="#64748b">192.168.224.6</text>
  <rect x="280" y="76" width="200" height="56" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="380" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">前置 nginx front</text>
  <text x="380" y="120" text-anchor="middle" font-size="11" fill="#7c2d12">TLS 终结 192.168.224.2</text>
  <rect x="520" y="76" width="200" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="620" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">网关 gw / gw2</text>
  <text x="620" y="120" text-anchor="middle" font-size="11" fill="#1e3a8a">Go 反向代理 .4 或 .5</text>
  <rect x="760" y="76" width="200" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="860" y="100" text-anchor="middle" font-size="13" fill="#14532d">上游 be 回显收到的头</text>
  <text x="860" y="120" text-anchor="middle" font-size="11" fill="#14532d">192.168.224.3:18081</text>
  <text x="253" y="98" text-anchor="middle" font-size="11" fill="#b45309">段①</text>
  <text x="498" y="98" text-anchor="middle" font-size="11" fill="#475569">段②</text>
  <text x="738" y="98" text-anchor="middle" font-size="11" fill="#475569">段③</text>
  <line x1="230" y1="112" x2="276" y2="112" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arA)"/>
  <line x1="480" y1="112" x2="516" y2="112" stroke="#64748b" stroke-width="1.8" marker-end="url(#arA)"/>
  <line x1="720" y1="112" x2="756" y2="112" stroke="#64748b" stroke-width="1.8" marker-end="url(#arA)"/>

  <line x1="40" y1="148" x2="960" y2="148" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="172" font-size="11.5" font-weight="bold" fill="#0f172a">连接段</text>
  <text x="270" y="172" font-size="11.5" font-weight="bold" fill="#0f172a">这一跳上实测到的事</text>
  <text x="40" y="196" font-size="12" fill="#7c2d12">段① 客户端 到 前置 nginx</text>
  <text x="270" y="196" font-size="12" fill="#0f172a">https / TLSv1.3，TLS 只在这一跳终结（front 的 access log 实测）</text>
  <text x="40" y="220" font-size="12" fill="#1e3a8a">段② 前置 nginx 到 网关</text>
  <text x="270" y="220" font-size="12" fill="#0f172a">明文 HTTP/1.1，r.TLS 仍为 nil；上一跳写的 xff / x-real-ip / x-forwarded-proto 原样到达</text>
  <text x="40" y="244" font-size="12" fill="#1e3a8a">段③ 网关 到 上游</text>
  <text x="270" y="244" font-size="12" fill="#0f172a">明文 HTTP/1.1：转发头被网关这一跳重写，结果见下表</text>

  <line x1="40" y1="262" x2="960" y2="262" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="284" font-size="12" font-weight="bold" fill="#0f172a">上游收到的字段</text>
  <text x="300" y="284" font-size="12" font-weight="bold" fill="#991b1b">gw：proto=force、ip=remote</text>
  <text x="650" y="284" font-size="12" font-weight="bold" fill="#14532d">gw2：proto=keep、按可信链解析</text>
  <text x="40" y="310" font-size="11.5" fill="#0f172a">x-forwarded-proto</text>
  <text x="300" y="310" font-size="11.5" fill="#991b1b">http，客户端其实用的是 https</text>
  <text x="650" y="310" font-size="11.5" fill="#14532d">https，沿用可信入口写的值</text>
  <text x="40" y="334" font-size="11.5" fill="#0f172a">x-real-ip</text>
  <text x="300" y="334" font-size="11.5" fill="#991b1b">192.168.224.2，即上一跳 nginx</text>
  <text x="650" y="334" font-size="11.5" fill="#14532d">1.2.3.4，整段 lab 网段都写进 trusted</text>
  <text x="40" y="358" font-size="11.5" fill="#0f172a">host 与 x-forwarded-host</text>
  <text x="300" y="358" font-size="11.5" fill="#991b1b">w2r2c-be:18081，原始 Host 被顺序丢掉</text>
  <text x="650" y="358" font-size="11.5" fill="#14532d">w2r2c-front，保留客户端请求的 Host</text>
  <text x="40" y="382" font-size="11.5" fill="#0f172a">x-forwarded-for</text>
  <text x="300" y="382" font-size="11.5" fill="#0f172a">1.2.3.4, 192.168.224.6, 192.168.224.2</text>
  <text x="650" y="382" font-size="11.5" fill="#0f172a">与左列完全相同，链不受出口写法影响</text>

  <line x1="40" y1="398" x2="960" y2="398" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="418" font-size="11.5" fill="#7c2d12">「客户端用了 HTTPS」这件事不会自动传到下一跳，只能靠 X-Forwarded-Proto 表达；force 写法重写后，上游拼绝对 URL、设 Secure Cookie、发重定向会一起降级。</text>

  <defs>
    <marker id="arA" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
