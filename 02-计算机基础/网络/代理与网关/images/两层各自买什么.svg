<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" font-size="18.5" fill="#0f172a" text-anchor="middle" font-weight="bold">两层叠着不是冗余：一跳买规模，一跳买语义</text>
  <text x="500" y="58" font-size="12.2" fill="#64748b" text-anchor="middle">同一份流量过两跳，每一跳都被问一次「你要不要看见请求」，答案不同</text>
  <rect x="262" y="86" width="100" height="30" rx="5" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1"/>
  <text x="312" y="105" font-size="10.5" fill="#7e22ce" text-anchor="middle" font-weight="bold" font-family="Consolas, Menlo, monospace">Internet</text>
  <path d="M 312 116 L 312 148" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="170" y="150" width="300" height="58" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="320" y="174" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">L4 负载均衡</text>
  <text x="320" y="193" font-size="9.8" fill="#64748b" text-anchor="middle" font-family="Consolas, Menlo, monospace">LVS · DPDK · XDP · 云 NLB</text>
  <path d="M 260 208 C 240 228, 220 232, 210 248" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 385 208 C 405 228, 425 232, 435 248" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="108" y="250" width="200" height="56" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
  <text x="208" y="272" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold">L7 网关 A</text>
  <text x="208" y="290" font-size="9.6" fill="#64748b" text-anchor="middle">路由 / 灰度 / TLS 卸载</text>
  <rect x="340" y="250" width="200" height="56" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
  <text x="440" y="272" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold">L7 网关 B</text>
  <text x="440" y="290" font-size="9.6" fill="#64748b" text-anchor="middle">WAF / 限流 / 重试</text>
  <path d="M 208 306 C 208 328, 250 330, 280 348" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 440 306 C 440 328, 400 330, 370 348" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="170" y="350" width="300" height="50" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="320" y="372" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold">微服务集群</text>
  <text x="320" y="390" font-size="9.6" fill="#64748b" text-anchor="middle">业务 Pod / 进程</text>
  <path d="M 60 326 L 560 326" fill="none" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arw)"/>
  <text x="40" y="318" font-size="8.8" fill="#ea580c" text-anchor="start">跨过这条线，请求才有边界</text>
  <rect x="602" y="86" width="358" height="186" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <rect x="602" y="86" width="358" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="602" y="108" width="358" height="12" fill="#dbeafe"/>
  <text x="618" y="108" font-size="12" fill="#2563eb" text-anchor="start" font-weight="bold">L4 买的是「规模」</text>
  <text x="618" y="146" font-size="10" fill="#64748b" text-anchor="start" font-weight="bold">买到</text>
  <text x="660" y="146" font-size="9.9" fill="#0f172a" text-anchor="start">单机几十万连接、带宽、一个字节都不改</text>
  <text x="618" y="176" font-size="10" fill="#64748b" text-anchor="start" font-weight="bold">代价</text>
  <text x="660" y="176" font-size="9.9" fill="#0f172a" text-anchor="start">看不见请求；按内容做的事一件都做不了</text>
  <text x="618" y="206" font-size="10" fill="#64748b" text-anchor="start" font-weight="bold">落点</text>
  <text x="660" y="206" font-size="9.9" fill="#0f172a" text-anchor="start">TLS 只能透传或只看 SNI（7.1 的 ①②）</text>
  <text x="618" y="236" font-size="10" fill="#64748b" text-anchor="start" font-weight="bold">典型</text>
  <text x="660" y="236" font-size="9.9" fill="#0f172a" text-anchor="start">LVS / DPDK / XDP / 云 NLB</text>
  <rect x="602" y="288" width="358" height="186" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.3"/>
  <rect x="602" y="288" width="358" height="34" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <rect x="602" y="310" width="358" height="12" fill="#dcfce7"/>
  <text x="618" y="310" font-size="12" fill="#15803d" text-anchor="start" font-weight="bold">L7 买的是「语义」</text>
  <text x="618" y="348" font-size="10" fill="#64748b" text-anchor="start" font-weight="bold">买到</text>
  <text x="660" y="348" font-size="9.9" fill="#0f172a" text-anchor="start">路由、灰度、限流、重试、TLS 卸载</text>
  <text x="618" y="378" font-size="10" fill="#64748b" text-anchor="start" font-weight="bold">代价</text>
  <text x="660" y="378" font-size="9.9" fill="#0f172a" text-anchor="start">用户态内存与 CPU、两套超时、缓冲落盘</text>
  <text x="618" y="408" font-size="10" fill="#64748b" text-anchor="start" font-weight="bold">盲区</text>
  <text x="660" y="408" font-size="9.9" fill="#0f172a" text-anchor="start">逐跳头要显式转发，WS 否则升不上去（9.1）</text>
  <text x="618" y="438" font-size="10" fill="#64748b" text-anchor="start" font-weight="bold">典型</text>
  <text x="660" y="438" font-size="9.9" fill="#0f172a" text-anchor="start">nginx / Envoy / 云 ALB</text>
  <text x="60" y="462" font-size="10.0" fill="#64748b" text-anchor="start">⚠️ 两层都不是「多一跳」：L4 那一跳的成本是机器数，L7 那一跳的成本是每请求的解析与缓冲。</text>
  <text x="60" y="482" font-size="10.0" fill="#64748b" text-anchor="start">   省掉哪一层，缺的能力都会在别处补回来 —— 通常是在后端每个服务里各补一遍。</text>
</svg>