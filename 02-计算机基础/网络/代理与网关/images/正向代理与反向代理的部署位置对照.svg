<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">正向代理与反向代理：部署在哪、代表谁、隐藏了谁</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">分界线是「谁配置了代理」：正向代理由客户端主动指向代理，反向代理时客户端以为自己在直连服务</text>

  <text x="40" y="92" font-size="13" font-weight="bold" fill="#b45309">正向代理：部署在客户端侧，替客户端出网</text>
  <rect x="40" y="102" width="170" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="125" y="124" text-anchor="middle" font-size="13" fill="#0f172a">客户端</text>
  <text x="125" y="142" text-anchor="middle" font-size="11" fill="#64748b">配置了代理才出网</text>
  <rect x="300" y="102" width="170" height="52" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="385" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">正向代理</text>
  <text x="385" y="142" text-anchor="middle" font-size="11" fill="#7c2d12">代表客户端</text>
  <rect x="560" y="102" width="170" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="645" y="124" text-anchor="middle" font-size="13" fill="#0f172a">互联网上的站点</text>
  <text x="645" y="142" text-anchor="middle" font-size="11" fill="#64748b">可以是任意目标</text>
  <rect x="790" y="102" width="180" height="52" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="880" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">隐藏的是客户端</text>
  <text x="880" y="142" text-anchor="middle" font-size="11" fill="#991b1b">站点只看到代理</text>
  <line x1="210" y1="128" x2="296" y2="128" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar1)"/>
  <line x1="470" y1="128" x2="556" y2="128" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar1)"/>

  <text x="40" y="212" font-size="13" font-weight="bold" fill="#1e3a8a">反向代理：部署在服务端侧，替服务端接客（网关天然是反向代理）</text>
  <rect x="40" y="222" width="170" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="125" y="244" text-anchor="middle" font-size="13" fill="#0f172a">客户端</text>
  <text x="125" y="262" text-anchor="middle" font-size="11" fill="#64748b">不需要配置代理</text>
  <rect x="300" y="222" width="170" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="385" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">反向代理</text>
  <text x="385" y="262" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Nginx 网关 CDN LB</text>
  <rect x="560" y="196" width="170" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="645" y="218" text-anchor="middle" font-size="11.5" fill="#14532d">上游实例 1</text>
  <rect x="560" y="236" width="170" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="645" y="258" text-anchor="middle" font-size="11.5" fill="#14532d">上游实例 2</text>
  <rect x="560" y="276" width="170" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="645" y="298" text-anchor="middle" font-size="11.5" fill="#14532d">上游实例 3</text>
  <rect x="790" y="222" width="180" height="52" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="880" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">隐藏的是服务端</text>
  <text x="880" y="262" text-anchor="middle" font-size="10.5" fill="#991b1b">客户端不知道后面几台</text>
  <line x1="210" y1="248" x2="296" y2="248" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar1)"/>
  <line x1="470" y1="232" x2="556" y2="213" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar1)"/>
  <line x1="470" y1="248" x2="556" y2="253" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar1)"/>
  <line x1="470" y1="264" x2="556" y2="293" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar1)"/>
  <text x="40" y="332" font-size="11.5" fill="#64748b">要点：网关把两件事分成两步 —— 先从多个上游里挑一个（负载均衡），再代服务端接客（反向代理）。</text>

  <rect x="40" y="352" width="920" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="376" font-size="13" font-weight="bold" fill="#0f172a">对照（取自本篇第一节的表）</text>
  <text x="60" y="400" font-size="12" fill="#0f172a">部署在哪</text>
  <text x="230" y="400" font-size="12" fill="#7c2d12">客户端侧</text>
  <text x="520" y="400" font-size="12" fill="#1e3a8a">服务端侧</text>
  <text x="60" y="424" font-size="12" fill="#0f172a">代表谁</text>
  <text x="230" y="424" font-size="12" fill="#7c2d12">客户端（替客户端出网）</text>
  <text x="520" y="424" font-size="12" fill="#1e3a8a">服务端（替服务端接客）</text>
  <text x="60" y="448" font-size="12" fill="#0f172a">客户端要不要配置</text>
  <text x="230" y="448" font-size="12" fill="#7c2d12">需要，要指向代理</text>
  <text x="520" y="448" font-size="12" fill="#1e3a8a">不需要，以为在直连</text>
  <text x="60" y="472" font-size="12" fill="#0f172a">典型形态</text>
  <text x="230" y="472" font-size="12" fill="#7c2d12">公司出口代理</text>
  <text x="520" y="472" font-size="12" fill="#1e3a8a">Nginx、网关、CDN、负载均衡器</text>
  <text x="60" y="494" font-size="12" fill="#0f172a">隐藏了谁</text>
  <text x="230" y="494" font-size="12" fill="#7c2d12">隐藏客户端</text>
  <text x="520" y="494" font-size="12" fill="#1e3a8a">隐藏服务端</text>

  <defs>
    <marker id="ar1" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
