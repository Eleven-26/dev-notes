<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arF1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 4.5 L0 9 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="70" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一条请求在三种形式下留下的东西不同</text>
  <text x="500" y="57" text-anchor="middle" font-size="12.5" fill="#64748b">先数 TCP 有几条，再看后端看到谁，最后看有没有「请求边界」</text>

  <rect x="24" y="110" width="112" height="32" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1"/>
  <text x="80" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">① 报文转发</text>

  <rect x="140" y="96" width="130" height="64" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="205" y="120" text-anchor="middle" font-size="13" fill="#0f172a">客户端</text>
  <text x="205" y="140" text-anchor="middle" font-size="11" fill="#475569">172.28.0.4</text>

  <rect x="326" y="96" width="150" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="401" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">LB 只改包头</text>
  <text x="401" y="140" text-anchor="middle" font-size="11" fill="#1e3a8a">不建 socket</text>

  <rect x="532" y="96" width="130" height="64" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="597" y="120" text-anchor="middle" font-size="13" fill="#14532d">后端</text>
  <text x="597" y="140" text-anchor="middle" font-size="11" fill="#14532d">看到 172.28.0.4</text>

  <rect x="684" y="96" width="292" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="700" y="120" font-size="11.5" font-weight="bold" fill="#334155">1 条 TCP，源地址不改</text>
  <text x="700" y="140" font-size="11" fill="#475569">后端看到的就是真实客户端</text>

  <line x1="272" y1="128" x2="320" y2="128" stroke="#334155" stroke-width="1.6" marker-end="url(#arF1)"/>
  <line x1="478" y1="128" x2="526" y2="128" stroke="#334155" stroke-width="1.6" marker-end="url(#arF1)"/>

  <rect x="24" y="210" width="112" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.1"/>
  <text x="80" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">② 连接级代理</text>

  <rect x="140" y="196" width="130" height="64" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="205" y="220" text-anchor="middle" font-size="13" fill="#0f172a">客户端</text>
  <text x="205" y="240" text-anchor="middle" font-size="11" fill="#475569">172.28.0.4</text>

  <rect x="326" y="196" width="150" height="64" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="401" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">nginx stream</text>
  <text x="401" y="240" text-anchor="middle" font-size="11" fill="#3730a3">只读四元组</text>

  <rect x="532" y="196" width="130" height="64" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="597" y="220" text-anchor="middle" font-size="13" fill="#14532d">后端</text>
  <text x="597" y="240" text-anchor="middle" font-size="11" fill="#14532d">看到 172.28.0.2</text>

  <rect x="684" y="196" width="292" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="700" y="220" font-size="11.5" font-weight="bold" fill="#334155">2 条 TCP，互不相通</text>
  <text x="700" y="240" font-size="11" fill="#475569">源地址在 LB 这一跳被换掉</text>

  <rect x="272" y="172" width="56" height="18" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="300" y="185" text-anchor="middle" font-size="10" fill="#3730a3">TCP ①</text>
  <rect x="478" y="172" width="56" height="18" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="506" y="185" text-anchor="middle" font-size="10" fill="#3730a3">TCP ②</text>
  <line x1="272" y1="228" x2="320" y2="228" stroke="#334155" stroke-width="1.6" marker-end="url(#arF1)"/>
  <line x1="478" y1="228" x2="526" y2="228" stroke="#334155" stroke-width="1.6" marker-end="url(#arF1)"/>

  <rect x="24" y="310" width="112" height="32" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.1"/>
  <text x="80" y="331" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">③ 请求级代理</text>

  <rect x="140" y="296" width="130" height="64" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="205" y="320" text-anchor="middle" font-size="13" fill="#0f172a">客户端</text>
  <text x="205" y="340" text-anchor="middle" font-size="11" fill="#475569">172.28.0.4</text>

  <rect x="326" y="296" width="150" height="64" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="401" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">nginx http</text>
  <text x="401" y="340" text-anchor="middle" font-size="10.5" fill="#5b21b6">读到请求行与 Header</text>

  <rect x="532" y="296" width="130" height="64" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="597" y="320" text-anchor="middle" font-size="13" fill="#14532d">后端</text>
  <text x="597" y="340" text-anchor="middle" font-size="11" fill="#14532d">看到 172.28.0.2</text>

  <rect x="684" y="296" width="292" height="64" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="700" y="320" font-size="11.5" font-weight="bold" fill="#5b21b6">2 条 TCP + 请求边界</text>
  <text x="700" y="340" font-size="11" fill="#5b21b6">请求可以在 LB 上重新分派</text>

  <rect x="272" y="272" width="56" height="18" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="300" y="285" text-anchor="middle" font-size="10" fill="#3730a3">TCP ①</text>
  <rect x="478" y="272" width="56" height="18" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="506" y="285" text-anchor="middle" font-size="10" fill="#3730a3">TCP ②</text>
  <line x1="272" y1="328" x2="320" y2="328" stroke="#334155" stroke-width="1.6" marker-end="url(#arF1)"/>
  <line x1="478" y1="328" x2="526" y2="328" stroke="#334155" stroke-width="1.6" marker-end="url(#arF1)"/>

  <rect x="24" y="392" width="952" height="104" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="44" y="418" font-size="12" font-weight="bold" fill="#92400e">判据：数 TCP 只能分出「转发 / 代理」；分出「四层 / 七层」要看它有没有把请求当成可分割的单位</text>
  <text x="44" y="444" font-size="11.5" fill="#92400e">同一条请求，三种形态留下的东西不同：转发什么都不留；连接级代理留下一条新连接；请求级代理还留下一份被重写过的请求头</text>
  <text x="44" y="470" font-size="11.5" fill="#92400e">所以「四层快、七层慢」只在转发与代理之间成立——同为用户态代理时，四层并不更快（见正文 5.3 的三轮读数）</text>
</svg>
