<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arF3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 4.5 L0 9 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="70" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">三个不同层的空闲超时，再加一档后端自己的处理超时</text>
  <text x="500" y="57" text-anchor="middle" font-size="12.5" fill="#64748b">L4 与 L7 叠着放时，用户看到的行为由最短的那个计时器决定</text>

  <rect x="24" y="118" width="150" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="99" y="148" text-anchor="middle" font-size="13" fill="#0f172a">客户端</text>
  <text x="99" y="170" text-anchor="middle" font-size="10.5" fill="#475569">一条长连接</text>

  <rect x="250" y="118" width="170" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="335" y="148" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">L4 转发 / 代理</text>
  <text x="335" y="170" text-anchor="middle" font-size="10.5" fill="#1e3a8a">conntrack 记一条表项</text>

  <rect x="500" y="118" width="170" height="70" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="585" y="148" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5b21b6">L7 代理</text>
  <text x="585" y="170" text-anchor="middle" font-size="10.5" fill="#5b21b6">前后各一条，各有一套</text>

  <rect x="750" y="118" width="160" height="70" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="830" y="148" text-anchor="middle" font-size="13" fill="#14532d">后端</text>
  <text x="830" y="170" text-anchor="middle" font-size="10.5" fill="#14532d">读超时按处理时间算</text>

  <line x1="176" y1="153" x2="244" y2="153" stroke="#334155" stroke-width="1.6" marker-end="url(#arF3)"/>
  <line x1="422" y1="153" x2="494" y2="153" stroke="#334155" stroke-width="1.6" marker-end="url(#arF3)"/>
  <line x1="672" y1="153" x2="744" y2="153" stroke="#334155" stroke-width="1.6" marker-end="url(#arF3)"/>

  <line x1="162" y1="188" x2="162" y2="204" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="346" y1="188" x2="346" y2="204" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="592" y1="188" x2="592" y2="204" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="826" y1="188" x2="826" y2="204" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>

  <rect x="52" y="206" width="220" height="44" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="68" y="224" font-size="11.5" font-weight="bold" fill="#334155">conntrack 空闲 · 5 天</text>
  <text x="68" y="242" font-size="10.5" fill="#475569">tcp_timeout_established</text>

  <rect x="246" y="206" width="200" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="262" y="224" font-size="11.5" font-weight="bold" fill="#1e3a8a">keepalive_timeout · 75s</text>
  <text x="262" y="242" font-size="10.5" fill="#1e3a8a">客户端与 L4 之间那条</text>

  <rect x="492" y="206" width="200" height="44" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="508" y="224" font-size="11.5" font-weight="bold" fill="#5b21b6">proxy_read_timeout · 60s</text>
  <text x="508" y="242" font-size="10.5" fill="#5b21b6">L7 与后端之间那条</text>

  <rect x="712" y="206" width="228" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="728" y="224" font-size="11.5" font-weight="bold" fill="#14532d">后端处理 · 30s（业务自己设）</text>
  <text x="728" y="242" font-size="10.5" fill="#14532d">超过就该由后端主动返回</text>

  <rect x="24" y="272" width="952" height="42" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="44" y="299" font-size="12" font-weight="bold" fill="#92400e">从短到长排：后端 30s 小于 L7 60s 小于 keepalive 75s 小于 conntrack 5 天——最短的那个决定用户看到什么</text>

  <rect x="24" y="330" width="952" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="356" font-size="11.5" fill="#0f172a">规矩一：越靠近后端越短。「客户端 大于 L4 大于 L7 大于 后端处理」排反了，就会出现「客户端还在等、后端早就断了」，</text>
  <text x="44" y="376" font-size="11.5" fill="#0f172a">　　　　　用户看到的是一个没有任何日志的超时。</text>
  <text x="44" y="402" font-size="11.5" fill="#0f172a">规矩二：只让一层做重试。L4 的重试是「换一台重发整条流」，L7 的重试是「换一台重发这个请求」；两层都开，</text>
  <text x="44" y="422" font-size="11.5" fill="#0f172a">　　　　　一次下游抖动会被放大成倍数级的流量。</text>
  <text x="44" y="444" font-size="11" fill="#64748b">第三档最容易漏：conntrack 默认 5 天，比谁都长，所以它几乎从不先断——排查长连接莫名失效时，先看 L7 那一档。</text>
</svg>
