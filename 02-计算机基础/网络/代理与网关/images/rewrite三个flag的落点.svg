<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="rw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">rewrite 三个 flag 的落点：差别不在改不改 URI，而在改完之后去哪儿</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">同一份 rewrite 规则、同一组请求，只换 flag —— 三个 location 的结果完全不同</text>
  <line x1="30" y1="74" x2="970" y2="74" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="30" y="92" width="300" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="180" y="119" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">last —— 改完 URI 重新匹配</text>
  <rect x="350" y="92" width="300" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="500" y="119" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">break —— 停在本 location</text>
  <rect x="670" y="92" width="300" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="820" y="119" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">redirect —— 直接回 302</text>

  <rect x="40" y="154" width="280" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="180" y="182" text-anchor="middle" font-size="12.5" fill="#0f172a">请求 /r/x → location /r/</text>
  <rect x="360" y="154" width="280" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="500" y="182" text-anchor="middle" font-size="12.5" fill="#0f172a">请求 /rb/x → location /rb/</text>
  <rect x="680" y="154" width="280" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="820" y="182" text-anchor="middle" font-size="12.5" fill="#0f172a">请求 /rd/x → location /rd/</text>

  <line x1="180" y1="200" x2="180" y2="214" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#rw)"/>
  <line x1="500" y1="200" x2="500" y2="214" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#rw)"/>
  <line x1="820" y1="200" x2="820" y2="214" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#rw)"/>

  <rect x="40" y="216" width="280" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="180" y="244" text-anchor="middle" font-size="12.5" fill="#0f172a">rewrite → /a/x（flag=last）</text>
  <rect x="360" y="216" width="280" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="500" y="244" text-anchor="middle" font-size="12.5" fill="#0f172a">rewrite → /a/x（flag=break）</text>
  <rect x="680" y="216" width="280" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="820" y="244" text-anchor="middle" font-size="12.5" fill="#0f172a">rewrite → /a/x（flag=redirect）</text>

  <line x1="180" y1="262" x2="180" y2="276" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#rw)"/>
  <line x1="500" y1="262" x2="500" y2="276" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#rw)"/>
  <line x1="820" y1="262" x2="820" y2="276" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#rw)"/>

  <rect x="40" y="278" width="280" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="180" y="306" text-anchor="middle" font-size="12.5" fill="#0f172a">重新走一遍 location 匹配</text>
  <rect x="360" y="278" width="280" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="500" y="306" text-anchor="middle" font-size="12" fill="#0f172a">停在本 location，跳过 return 200</text>
  <rect x="680" y="278" width="280" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="820" y="306" text-anchor="middle" font-size="12.5" fill="#0f172a">不改 URI，立刻回响应</text>

  <line x1="180" y1="324" x2="180" y2="338" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#rw)"/>
  <line x1="500" y1="324" x2="500" y2="338" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#rw)"/>
  <line x1="820" y1="324" x2="820" y2="338" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#rw)"/>

  <rect x="40" y="340" width="280" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="180" y="368" text-anchor="middle" font-size="12.5" fill="#0f172a">命中 /a/ 的普通前缀</text>
  <rect x="360" y="340" width="280" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="500" y="368" text-anchor="middle" font-size="12.5" fill="#0f172a">content 找文件 /a/x → 不存在</text>
  <rect x="680" y="340" width="280" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="820" y="368" text-anchor="middle" font-size="12.5" fill="#0f172a">302 + 绝对 URL 的 Location</text>

  <line x1="180" y1="386" x2="180" y2="400" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#rw)"/>
  <line x1="500" y1="386" x2="500" y2="400" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#rw)"/>
  <line x1="820" y1="386" x2="820" y2="400" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#rw)"/>

  <rect x="40" y="402" width="280" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="180" y="433" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">200 · X-Matched: 普通前缀 (/a/)</text>
  <rect x="360" y="402" width="280" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="500" y="433" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">404 · 但 X-Matched 头仍在</text>
  <rect x="680" y="402" width="280" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="820" y="433" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Location: http://127.0.0.1:18080/a/x</text>

  <line x1="30" y1="482" x2="970" y2="482" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="506" font-size="12.5" font-weight="bold" fill="#0f172a">要点一：last 改完 URI 会重新走 location 匹配，同一 server 内最多 10 次防循环。</text>
  <text x="30" y="528" font-size="12.5" fill="#0f172a">要点二：break 停在本 location，并跳过同属 rewrite 模块的后续指令，所以后面的 return 200 不执行。</text>
  <text x="30" y="550" font-size="12.5" fill="#0f172a">要点三：redirect / permanent 不改 URI，直接回 302 / 301，Location 是绝对 URL。</text>
  <text x="30" y="572" font-size="12.5" fill="#7f1d1d">注意：add_header 属于 header filter 阶段，所以那条 404 响应里仍然带着 X-Matched 头。</text>
</svg>
