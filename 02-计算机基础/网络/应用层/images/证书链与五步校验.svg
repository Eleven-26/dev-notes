<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">证书链与客户端的五步校验</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">服务端发 leaf + intermediate；根证书在客户端信任库里；任一步校验失败都会中断握手</text>

  <rect x="40" y="86" width="250" height="92" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="165" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">根证书 Root CA</text>
  <text x="165" y="132" text-anchor="middle" font-size="10.5" fill="#991b1b">预置在客户端信任库</text>
  <text x="165" y="150" text-anchor="middle" font-size="10.5" fill="#991b1b">服务端不发送</text>
  <text x="165" y="168" text-anchor="middle" font-size="10.5" fill="#991b1b">自签名（信任锚）</text>

  <rect x="375" y="86" width="250" height="92" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="500" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">中间证书 Intermediate</text>
  <text x="500" y="132" text-anchor="middle" font-size="10.5" fill="#92400e">由根 CA 签发</text>
  <text x="500" y="150" text-anchor="middle" font-size="10.5" fill="#92400e">服务端必须随握手发送</text>
  <text x="500" y="168" text-anchor="middle" font-size="10.5" fill="#92400e">漏发是「仅部分客户端失败」的主因</text>

  <rect x="710" y="86" width="250" height="92" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="835" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">站点证书 Leaf</text>
  <text x="835" y="132" text-anchor="middle" font-size="10.5" fill="#14532d">由中间 CA 签发</text>
  <text x="835" y="150" text-anchor="middle" font-size="10.5" fill="#14532d">SAN 列出覆盖的域名 / IP</text>
  <text x="835" y="168" text-anchor="middle" font-size="10.5" fill="#14532d">公钥用于握手签名</text>

  <line x1="290" y1="132" x2="371" y2="132" stroke="#64748b" stroke-width="1.8"/>
  <polygon points="371,132 360,126 360,138" fill="#64748b"/>
  <text x="330" y="120" text-anchor="middle" font-size="10" fill="#64748b">签发</text>
  <line x1="625" y1="132" x2="706" y2="132" stroke="#64748b" stroke-width="1.8"/>
  <polygon points="706,132 695,126 695,138" fill="#64748b"/>
  <text x="665" y="120" text-anchor="middle" font-size="10" fill="#64748b">签发</text>

  <text x="40" y="214" font-size="13" font-weight="bold" fill="#334155">客户端验证顺序</text>

  <rect x="40" y="228" width="172" height="62" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="126" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#3730a3">① 逐级验签</text>
  <text x="126" y="268" text-anchor="middle" font-size="10" fill="#4338ca">leaf → 中间 → 根</text>
  <text x="126" y="283" text-anchor="middle" font-size="9.5" fill="#4338ca">失败：unknown authority</text>

  <rect x="228" y="228" width="172" height="62" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="314" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#3730a3">② 有效期</text>
  <text x="314" y="268" text-anchor="middle" font-size="10" fill="#4338ca">notBefore ~ notAfter</text>
  <text x="314" y="283" text-anchor="middle" font-size="9.5" fill="#4338ca">失败：expired / not yet valid</text>

  <rect x="416" y="228" width="172" height="62" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="502" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#3730a3">③ SAN 域名</text>
  <text x="502" y="268" text-anchor="middle" font-size="10" fill="#4338ca">只认 SAN，不认 CN</text>
  <text x="502" y="283" text-anchor="middle" font-size="9.5" fill="#4338ca">失败：hostname mismatch</text>

  <rect x="604" y="228" width="172" height="62" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="690" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#3730a3">④ 吊销状态</text>
  <text x="690" y="268" text-anchor="middle" font-size="10" fill="#4338ca">CRL / OCSP / Stapling</text>
  <text x="690" y="283" text-anchor="middle" font-size="9.5" fill="#4338ca">失败：certificate revoked</text>

  <rect x="792" y="228" width="172" height="62" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="878" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#3730a3">⑤ EKU 用途</text>
  <text x="878" y="268" text-anchor="middle" font-size="10" fill="#4338ca">serverAuth / clientAuth</text>
  <text x="878" y="283" text-anchor="middle" font-size="9.5" fill="#4338ca">失败：unsupported purpose</text>

  <line x1="212" y1="259" x2="224" y2="259" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="400" y1="259" x2="412" y2="259" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="588" y1="259" x2="600" y2="259" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="776" y1="259" x2="788" y2="259" stroke="#94a3b8" stroke-width="1.4"/>

  <rect x="40" y="316" width="924" height="82" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="58" y="340" font-size="12" font-weight="bold" fill="#334155">排障口诀</text>
  <text x="58" y="362" font-size="10.5" fill="#64748b">先确认看到的是哪张证书（带 SNI）→ 再看链是否完整 → 有效期 → SAN → 吊销 → 最后才怀疑算法 / 证书固定 / 客户端信任库。</text>
  <text x="58" y="382" font-size="10.5" fill="#92400e">⚠️「浏览器正常、代码失败」优先查：客户端信任库是否不同、是否走了代理、是否显式关闭了校验。</text>

  <text x="40" y="420" font-size="10.5" fill="#94a3b8">注：根证书自签名、由客户端预置；中间证书可能有多级（链上每个中间节点都要发），图中只画一级。</text>
</svg>
