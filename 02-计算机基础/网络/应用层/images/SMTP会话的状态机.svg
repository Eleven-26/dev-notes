<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">SMTP 会话：建连协商四步，之后是一个可重复的事务</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">每条命令一行、每个应答一个三位码；事务结束的 250 让状态回到已问候，所以一条连接能连发多封</text>

  <rect x="20" y="76" width="200" height="22" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" rx="6"/>
  <text x="30" y="92" font-size="12" font-weight="bold" fill="#1e40af">① 建连与协商（只做一次）</text>

  <rect x="20" y="110" width="150" height="76" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
  <text x="32" y="134" font-size="12.5" font-weight="bold" fill="#0f172a">未连接</text>
  <text x="32" y="156" font-size="9.5" fill="#334155">服务端先发 220</text>

  <rect x="200" y="110" width="160" height="76" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
  <text x="212" y="134" font-size="12.5" font-weight="bold" fill="#0f172a">已问候</text>
  <text x="212" y="156" font-size="9.5" fill="#334155">EHLO → 250</text>
  <text x="212" y="174" font-size="9.5" fill="#334155">能力清单见第二节</text>

  <rect x="400" y="110" width="160" height="76" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
  <text x="412" y="134" font-size="12.5" font-weight="bold" fill="#0f172a">能力已知</text>
  <text x="412" y="156" font-size="9.5" fill="#334155">STARTTLS → 220</text>
  <text x="412" y="174" font-size="9.5" fill="#334155">升级后重发 EHLO</text>

  <rect x="600" y="110" width="160" height="76" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
  <text x="612" y="134" font-size="12.5" font-weight="bold" fill="#0f172a">已认证</text>
  <text x="612" y="156" font-size="9.5" fill="#334155">AUTH → 235</text>
  <text x="612" y="174" font-size="9.5" fill="#334155">仅提交口需要</text>

  <line x1="172" y1="148" x2="196" y2="148" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="362" y1="148" x2="396" y2="148" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="562" y1="148" x2="596" y2="148" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>

  <path d="M 480 188 L 480 212 L 280 212 L 280 191" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
  <text x="500" y="208" font-size="10" fill="#b45309">STARTTLS：同一 TCP 上握手，之后必须重发 EHLO（丢弃升级前的清单）</text>

  <rect x="20" y="246" width="960" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="12"/>
  <text x="40" y="270" font-size="12" font-weight="bold" fill="#0f172a">② 一次事务：MAIL FROM → RCPT TO ×N → DATA → 正文 → 单点行</text>

  <line x1="680" y1="188" x2="680" y2="242" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <text x="690" y="222" font-size="10" fill="#2563eb">进入事务</text>

  <rect x="40" y="292" width="150" height="62" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="50" y="312" font-size="11" font-weight="bold" fill="#0f172a">MAIL FROM</text>
  <text x="50" y="329" font-size="8.8" fill="#334155">&lt;bounce@example.com&gt;</text>
  <text x="50" y="345" font-size="8.8" fill="#1e40af">250 2.1.0</text>

  <rect x="220" y="292" width="150" height="62" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="230" y="312" font-size="11" font-weight="bold" fill="#0f172a">RCPT TO ×N</text>
  <text x="230" y="329" font-size="8.8" fill="#334155">&lt;receiver@example.com&gt;</text>
  <text x="230" y="345" font-size="8.8" fill="#1e40af">250 / 550 逐收件人</text>

  <rect x="400" y="292" width="125" height="62" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="410" y="312" font-size="11" font-weight="bold" fill="#0f172a">DATA</text>
  <text x="410" y="329" font-size="8.8" fill="#334155">开始收正文</text>
  <text x="410" y="345" font-size="8.8" fill="#1e40af">354</text>

  <rect x="555" y="292" width="145" height="62" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="565" y="312" font-size="11" font-weight="bold" fill="#0f172a">正文</text>
  <text x="565" y="329" font-size="8.8" fill="#334155">CRLF 行流</text>
  <text x="565" y="345" font-size="8.8" fill="#334155">每行 ≤ 998 字节</text>

  <rect x="730" y="292" width="125" height="62" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" rx="8"/>
  <text x="740" y="312" font-size="11" font-weight="bold" fill="#0f172a">单点行</text>
  <text x="740" y="329" font-size="8.8" fill="#334155">收尾标志</text>
  <text x="740" y="345" font-size="8.8" fill="#b45309">不进入正文</text>

  <rect x="885" y="292" width="65" height="62" fill="#ecfdf5" stroke="#10b981" stroke-width="1" rx="8"/>
  <text x="895" y="312" font-size="11" font-weight="bold" fill="#0f172a">250</text>
  <text x="895" y="329" font-size="8.8" fill="#334155">已入队</text>
  <text x="895" y="345" font-size="8.8" fill="#047857">→ 下一封</text>

  <line x1="192" y1="323" x2="216" y2="323" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="372" y1="323" x2="396" y2="323" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="527" y1="323" x2="551" y2="323" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="702" y1="323" x2="726" y2="323" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="857" y1="323" x2="881" y2="323" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>

  <path d="M 917 356 L 917 392 L 115 392 L 115 358" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/>
  <text x="500" y="386" text-anchor="middle" font-size="10" fill="#2563eb">同一连接可继续下一封；RSET 只中止当前事务，不断连接</text>

  <rect x="40" y="446" width="300" height="48" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" rx="8"/>
  <text x="52" y="466" font-size="10.5" font-weight="bold" fill="#b91c1c">503 5.5.1 顺序错误</text>
  <text x="52" y="484" font-size="9" fill="#7f1d1d">RCPT 先于 MAIL / DATA 无 MAIL 与 RCPT（实测）</text>

  <rect x="370" y="446" width="300" height="48" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" rx="8"/>
  <text x="382" y="466" font-size="10.5" font-weight="bold" fill="#b91c1c">554 5.5.1 无有效收件人</text>
  <text x="382" y="484" font-size="9" fill="#7f1d1d">MAIL 已发、RCPT 全被拒（toy 实测）</text>

  <rect x="700" y="446" width="280" height="48" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" rx="8"/>
  <text x="712" y="466" font-size="10.5" font-weight="bold" fill="#b91c1c">552 5.3.4 超大小</text>
  <text x="712" y="484" font-size="9" fill="#7f1d1d">MAIL FROM 带 SIZE= 提前申报（toy 实测）</text>
</svg>
