<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="510" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一次转发的两个请求对象：Header 这条路断了，context 这条路通</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">主流程手里是原请求 r，ReverseProxy 传给 ErrorHandler 的是 req.Clone 出来的 r'：Header 深拷贝，context 只复制接口值</text>

  <rect x="40" y="78" width="420" height="230" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="100" font-size="12.5" font-weight="bold" fill="#0f172a">主流程：原请求 r</text>
  <rect x="60" y="112" width="380" height="54" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="250" y="134" text-anchor="middle" font-size="12" fill="#7f1d1d">Header：map A</text>
  <text x="250" y="154" text-anchor="middle" font-size="11" fill="#7f1d1d">此刻没有 X-GW-Upstream-Error</text>
  <rect x="60" y="178" width="380" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="250" y="200" text-anchor="middle" font-size="12" fill="#1e3a8a">context：值 = 指针 P</text>
  <text x="250" y="220" text-anchor="middle" font-size="11" fill="#1e3a8a">P 指向堆上那个 ErrHolder</text>
  <text x="60" y="256" font-size="11.5" fill="#475569">ServeHTTP 返回后读值</text>
  <text x="60" y="278" font-size="11.5" fill="#991b1b">r.Header.Get 得到空串</text>
  <text x="60" y="298" font-size="11.5" fill="#14532d">ErrFrom 得到 msg</text>

  <rect x="540" y="78" width="420" height="230" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="560" y="100" font-size="12.5" font-weight="bold" fill="#0f172a">ReverseProxy 内部：出站请求 r'</text>
  <rect x="560" y="112" width="380" height="54" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="750" y="134" text-anchor="middle" font-size="12" fill="#7f1d1d">Header：map B，与 A 不共享</text>
  <text x="750" y="154" text-anchor="middle" font-size="11" fill="#7f1d1d">ErrorHandler 改的是这份副本</text>
  <rect x="560" y="178" width="380" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="750" y="200" text-anchor="middle" font-size="12" fill="#1e3a8a">context：还是指针 P</text>
  <text x="750" y="220" text-anchor="middle" font-size="11" fill="#1e3a8a">markErr 在这里写 h.msg</text>
  <text x="560" y="256" font-size="11.5" fill="#475569">两条回调路径都只拿到 r'</text>
  <text x="560" y="278" font-size="11.5" fill="#991b1b">写 map B 影响不到 map A</text>
  <text x="560" y="298" font-size="11.5" fill="#14532d">经 P 写的是同一块内存</text>

  <text x="498" y="134" text-anchor="middle" font-size="10.5" fill="#991b1b">深拷贝 Header</text>
  <line x1="440" y1="144" x2="556" y2="144" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arB)"/>
  <text x="498" y="200" text-anchor="middle" font-size="10.5" fill="#1d4ed8">浅拷贝 context</text>
  <line x1="440" y1="210" x2="556" y2="210" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arB)"/>

  <rect x="300" y="340" width="400" height="56" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="500" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">堆上唯一的 ErrHolder，含 mu 与 msg</text>
  <text x="500" y="382" text-anchor="middle" font-size="11" fill="#4c1d95">两个请求对象里的指针都是 P</text>
  <line x1="250" y1="232" x2="390" y2="340" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arB)"/>
  <line x1="750" y1="232" x2="612" y2="340" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arB)"/>

  <line x1="40" y1="412" x2="960" y2="412" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="432" font-size="12" fill="#7f1d1d">Header 这条路：ErrorHandler 里 set 的 X-GW-Upstream-Error 只写进 map B，主流程读的是 map A，于是访问日志的 err= 永远是空的</text>
  <text x="40" y="456" font-size="12" fill="#14532d">context 这条路：markErr 经 r' 的 Context 拿到同一个 P，写的就是主流程要读的那块内存，所以写得回来（值里是可写结构，要自己加锁）</text>
  <text x="40" y="480" font-size="12" fill="#0f172a">载体只剩请求本身：ReverseProxy 是同步调用，没有返回值可挂。凡要「回调里写、主流程读」，先确认那条路径上有没有发生拷贝</text>

  <defs>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
