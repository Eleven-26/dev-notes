<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 486" width="1080" height="486" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="1080" height="486" fill="#ffffff"/>
  <text x="40" y="26" font-size="15" font-weight="bold" fill="#0f172a">X.509 v3 证书的字段布局：被签名的块与签名本身要分开看</text>

  <rect x="40" y="56" width="1000" height="300" fill="#f8fafc" stroke="#475569" stroke-width="1.4" rx="8"/>
  <text x="60" y="80" font-size="12" font-weight="bold" fill="#334155">TBSCertificate（下面这一整块都参与签名）</text>

  <rect x="60" y="92" width="410" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="5"/>
  <text x="74" y="109" font-size="11" font-weight="bold" fill="#0f172a">Version / Serial Number</text>
  <text x="74" y="126" font-size="10" fill="#475569">通常 v3；序列号在 CA 内唯一，吊销与 CT 定位靠它</text>

  <rect x="60" y="136" width="410" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="5"/>
  <text x="74" y="153" font-size="11" font-weight="bold" fill="#0f172a">Issuer / Subject</text>
  <text x="74" y="170" font-size="10" fill="#475569">签发者 DN / 持有者 DN（域名不在这里，看 SAN）</text>

  <rect x="60" y="180" width="410" height="40" fill="#fff7ed" stroke="#b45309" stroke-width="1" rx="5"/>
  <text x="74" y="197" font-size="11" font-weight="bold" fill="#b45309">Validity</text>
  <text x="74" y="214" font-size="10" fill="#78350f">notBefore / notAfter，⭐ 90 天是当前主流上限</text>

  <rect x="60" y="224" width="410" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="5"/>
  <text x="74" y="241" font-size="11" font-weight="bold" fill="#0f172a">Signature Algorithm</text>
  <text x="74" y="258" font-size="10" fill="#475569">签发算法，如 sha256WithRSAEncryption</text>

  <rect x="60" y="268" width="410" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="5"/>
  <text x="74" y="285" font-size="11" font-weight="bold" fill="#0f172a">Subject Public Key Info</text>
  <text x="74" y="302" font-size="10" fill="#475569">持有者公钥 + 算法</text>

  <rect x="490" y="92" width="530" height="216" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" rx="6"/>
  <text x="506" y="112" font-size="11.5" font-weight="bold" fill="#1e40af">Extensions（v3 真正承载校验信息的地方）</text>

  <rect x="506" y="122" width="250" height="52" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="5"/>
  <text x="520" y="142" font-size="11" font-weight="bold" fill="#1e40af">SAN</text>
  <text x="520" y="160" font-size="10" fill="#475569">⭐ 域名校验只认它</text>

  <rect x="762" y="122" width="250" height="52" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="5"/>
  <text x="776" y="142" font-size="11" font-weight="bold" fill="#1e40af">Basic Constraints</text>
  <text x="776" y="160" font-size="10" fill="#475569">这张证书是不是 CA</text>

  <rect x="506" y="180" width="250" height="52" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="5"/>
  <text x="520" y="200" font-size="11" font-weight="bold" fill="#1e40af">Key Usage / EKU</text>
  <text x="520" y="218" font-size="10" fill="#475569">serverAuth / clientAuth</text>

  <rect x="762" y="180" width="250" height="52" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="5"/>
  <text x="776" y="200" font-size="11" font-weight="bold" fill="#1e40af">CRL Distribution Points</text>
  <text x="776" y="218" font-size="10" fill="#475569">吊销列表地址</text>

  <rect x="506" y="238" width="250" height="52" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="5"/>
  <text x="520" y="258" font-size="11" font-weight="bold" fill="#1e40af">AIA</text>
  <text x="520" y="276" font-size="10" fill="#475569">OCSP 查询地址</text>

  <rect x="762" y="238" width="250" height="52" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="5"/>
  <text x="776" y="258" font-size="11" font-weight="bold" fill="#1e40af">SCT</text>
  <text x="776" y="276" font-size="10" fill="#475569">证书透明度签名</text>

  <rect x="60" y="372" width="960" height="42" fill="#dcfce7" stroke="#166534" stroke-width="1.4" rx="6"/>
  <text x="74" y="390" font-size="11.5" font-weight="bold" fill="#166534">Signature</text>
  <text x="160" y="390" font-size="10.5" fill="#14532d">⭐ 上级 CA 对上面整块 TBSCertificate 的签名</text>
  <text x="74" y="408" font-size="10" fill="#14532d">第二步「逐级验签」验的就是这一项：用上级公钥验本证书，一路验到信任库里的根</text>

  <text x="40" y="440" font-size="10.5" fill="#475569">读证书先看三个字段：SAN（到底覆盖哪些域名）、Validity（是否在有效期内）、Basic Constraints（这是不是一张 CA 证书）。</text>
  <text x="40" y="464" font-size="10.5" fill="#b91c1c">⚠️ CN 已不用于域名匹配：自签证书只写 CN=localhost 会报 No subject alternative names present，必须显式加 SAN。</text>
</svg>
