<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">三层代理实测：链上每个条目都能对上写入者</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">客户端 192.168.224.6 发 https://w2r2c-front/api/order/list，并带伪造的 X-Forwarded-For: 1.2.3.4；网络 192.168.224.0/24</text>

  <rect x="40" y="88" width="270" height="54" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="175" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">① 客户端发出</text>
  <text x="175" y="130" text-anchor="middle" font-size="11" fill="#7f1d1d">cli 192.168.224.6</text>
  <text x="330" y="112" font-size="12.5" fill="#0f172a">X-Forwarded-For: 1.2.3.4</text>
  <text x="330" y="132" font-size="11" fill="#64748b">写入者：客户端自己，可以随便填</text>
  <line x1="175" y1="142" x2="175" y2="158" stroke="#64748b" stroke-width="1.6" marker-end="url(#arD)"/>

  <rect x="40" y="158" width="270" height="54" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="175" y="180" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">② 前置 nginx 追加</text>
  <text x="175" y="200" text-anchor="middle" font-size="11" fill="#7c2d12">front 192.168.224.2</text>
  <text x="330" y="182" font-size="12.5" fill="#0f172a">X-Forwarded-For: 1.2.3.4, 192.168.224.6</text>
  <text x="330" y="202" font-size="11" fill="#64748b">写入者：front 追加的是它自己看到的 $remote_addr</text>
  <line x1="175" y1="212" x2="175" y2="228" stroke="#64748b" stroke-width="1.6" marker-end="url(#arD)"/>

  <rect x="40" y="228" width="270" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="175" y="250" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">③ 网关追加</text>
  <text x="175" y="270" text-anchor="middle" font-size="11" fill="#1e3a8a">标准库 ReverseProxy</text>
  <text x="330" y="252" font-size="12.5" fill="#0f172a">X-Forwarded-For: 1.2.3.4, 192.168.224.6, 192.168.224.2</text>
  <text x="330" y="272" font-size="11" fill="#64748b">写入者：ReverseProxy 在 Director 之后补上它的对端，也就是 front</text>

  <line x1="40" y1="300" x2="960" y2="300" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="920" y1="318" x2="90" y2="318" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arE)"/>
  <text x="505" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">解析方向：从右往左，最右一段永远是上一个跟我说话的人</text>
  <rect x="60" y="330" width="200" height="54" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="160" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">1.2.3.4</text>
  <text x="160" y="372" text-anchor="middle" font-size="11" fill="#7f1d1d">客户端自称</text>
  <text x="290" y="362" text-anchor="middle" font-size="16" fill="#0f172a">,</text>
  <rect x="320" y="330" width="240" height="54" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="440" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">192.168.224.6</text>
  <text x="440" y="372" text-anchor="middle" font-size="10.5" fill="#7c2d12">front 写的，本例里正是真实客户端</text>
  <text x="590" y="362" text-anchor="middle" font-size="16" fill="#0f172a">,</text>
  <rect x="620" y="330" width="260" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="750" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">192.168.224.2</text>
  <text x="750" y="372" text-anchor="middle" font-size="11" fill="#1e3a8a">网关写的，即 front 的容器地址</text>

  <text x="40" y="412" font-size="12" fill="#475569">三跳各连跑 3 次，除上游观测到的临时端口外逐字一致；三个条目、三个写入者，一一对得上。</text>
  <text x="40" y="436" font-size="12" fill="#7c2d12">这次把整段 192.168.224.0/24 都写进了 trusted，于是 192.168.224.6 也被当成可信跳跳过，解析落到最左的自称值：X-Real-IP = 1.2.3.4</text>
  <text x="40" y="458" font-size="12" fill="#7c2d12">可信网段配多大，直接决定解析结果 —— 这就是第三节规则 ③ 的实测形态。</text>

  <defs>
    <marker id="arD" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#64748b"/>
    </marker>
    <marker id="arE" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1d4ed8"/>
    </marker>
  </defs>
</svg>
