<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">丢一个段之后，谁会一起等：1.1 多连接 / 2 单连接多流 / 3 流级交付</text>
  <text x="500" y="49" text-anchor="middle" font-size="12" fill="#64748b">同一个「洞」落在三种承载上，连坐范围完全不同；色块 = 一个 TCP 段承载的帧，红 = 丢失，灰 = 已到内核但不能交付</text>

  <rect x="16" y="64" width="964" height="24" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="28" y="81" font-size="12" font-weight="bold" fill="#0f172a">① HTTP/1.1：3 条独立连接，每条一次请求 — 洞只落在那一条上</text>

  <text x="16" y="116" font-size="11" fill="#334155">连接 1</text>
  <rect x="76" y="98" width="100" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="182" y="98" width="100" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="288" y="98" width="100" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="394" y="98" width="100" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="500" y="114" font-size="11" fill="#14532d">正常交付</text>

  <text x="16" y="148" font-size="11" fill="#334155">连接 2</text>
  <rect x="76" y="130" width="100" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="182" y="130" width="100" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="288" y="130" width="100" height="22" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
  <text x="338" y="145" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f1d1d">丢</text>
  <rect x="394" y="130" width="100" height="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="500" y="130" width="100" height="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="612" y="146" font-size="11" fill="#475569">这一条缓住等重传</text>

  <text x="16" y="180" font-size="11" fill="#334155">连接 3</text>
  <rect x="76" y="162" width="100" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="182" y="162" width="100" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="288" y="162" width="100" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="394" y="162" width="100" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="500" y="178" font-size="11" fill="#14532d">另 2 条连接照常交付</text>

  <rect x="16" y="200" width="964" height="24" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="28" y="217" font-size="12" font-weight="bold" fill="#0f172a">② HTTP/2：1 条 TCP 连接承载流 1、3、5、7，帧交错发送 — 全连接共用一套序号</text>

  <rect x="76" y="234" width="96" height="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="124" y="249" text-anchor="middle" font-size="10" fill="#1e3a8a">流 1</text>
  <rect x="178" y="234" width="96" height="22" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="226" y="249" text-anchor="middle" font-size="10" fill="#92400e">流 3</text>
  <rect x="280" y="234" width="96" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="328" y="249" text-anchor="middle" font-size="10" fill="#14532d">流 5</text>
  <rect x="382" y="234" width="96" height="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="430" y="249" text-anchor="middle" font-size="10" fill="#5b21b6">流 7</text>
  <rect x="484" y="234" width="96" height="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="532" y="249" text-anchor="middle" font-size="10" fill="#1e3a8a">流 1</text>
  <rect x="586" y="234" width="96" height="22" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
  <text x="634" y="249" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f1d1d">丢</text>
  <rect x="688" y="234" width="96" height="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="736" y="249" text-anchor="middle" font-size="10" fill="#475569">流 5</text>
  <rect x="790" y="234" width="96" height="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="838" y="249" text-anchor="middle" font-size="10" fill="#475569">流 7</text>
  <rect x="892" y="234" width="92" height="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="938" y="249" text-anchor="middle" font-size="10" fill="#475569">流 1</text>
  <path d="M 634 260 L 634 274" stroke="#dc2626" stroke-width="1.4" fill="none"/>
  <text x="28" y="288" font-size="11.5" fill="#7f1d1d">洞之后的帧不分流：流 1、5、7 一起缓住 —— 一个洞连坐 4 条流，重排发生在洞之前，交付不了就等于没复用</text>

  <rect x="16" y="300" width="964" height="24" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="28" y="317" font-size="12" font-weight="bold" fill="#0f172a">③ HTTP/3：1 条 QUIC 连接，每个流各自一套流内编号 — 洞只属于一条流</text>

  <rect x="76" y="334" width="96" height="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="124" y="349" text-anchor="middle" font-size="10" fill="#1e3a8a">流 1</text>
  <rect x="178" y="334" width="96" height="22" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
  <text x="226" y="349" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f1d1d">丢</text>
  <rect x="280" y="334" width="96" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="328" y="349" text-anchor="middle" font-size="10" fill="#14532d">流 5</text>
  <rect x="382" y="334" width="96" height="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="430" y="349" text-anchor="middle" font-size="10" fill="#5b21b6">流 7</text>
  <rect x="484" y="334" width="96" height="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="532" y="349" text-anchor="middle" font-size="10" fill="#1e3a8a">流 1</text>
  <rect x="586" y="334" width="96" height="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="634" y="349" text-anchor="middle" font-size="10" fill="#475569">流 3</text>
  <rect x="688" y="334" width="96" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="736" y="349" text-anchor="middle" font-size="10" fill="#14532d">流 5</text>
  <rect x="790" y="334" width="96" height="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="838" y="349" text-anchor="middle" font-size="10" fill="#5b21b6">流 7</text>
  <rect x="892" y="334" width="92" height="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="938" y="349" text-anchor="middle" font-size="10" fill="#1e3a8a">流 1</text>
  <text x="28" y="388" font-size="11.5" fill="#14532d">只有那个流的字节等重传，其余流的帧照常交付 —— 洞不再连坐</text>

  <rect x="16" y="404" width="964" height="24" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="28" y="421" font-size="12" font-weight="bold" fill="#92400e">应用层队头阻塞：1.1 有 → 2 消除；传输层队头阻塞：1.1 有 → 2 仍在且更集中 → 只有 3 把它消掉</text>

  <text x="16" y="456" font-size="11.5" fill="#475569">判据：TCP 只按序号连续交付 —— 序号 1000 之前的字节已经交出去、1001 那块没到，则 1001 之后即使全在内核缓冲区里也不会往上送</text>
  <text x="16" y="478" font-size="11.5" fill="#475569">HTTP/2 的帧装在这条字节流里，无法告诉内核「这段属于流 5，先跳过那个洞」；HTTP/3 把「哪段属于哪个流」搬进了传输层自己的编号</text>
  <text x="16" y="500" font-size="11.5" fill="#475569">另一个易忽略点：头块必须连续发送，超大头部本身就会造成一次阻塞 —— 与是否多路复用无关</text>
  <text x="16" y="526" font-size="11.5" font-weight="bold" fill="#7f1d1d">代价：把所有流挤进一条连接，丢包的影响面比 1.1 的多连接更集中，所以 2 在弱网下的优势会缩水</text>
  <text x="16" y="552" font-size="11" fill="#94a3b8">本图是机制对照，不含实测读数：本机没有链路丢包的注入手段；已实测的应用层并发耗时对照见正文 2.3</text>

  <rect x="16" y="566" width="14" height="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="36" y="575" font-size="10.5" fill="#475569">已交付</text>
  <rect x="96" y="566" width="14" height="10" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="116" y="575" font-size="10.5" fill="#475569">丢失</text>
  <rect x="176" y="566" width="14" height="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="196" y="575" font-size="10.5" fill="#475569">不能交付</text>
  <rect x="286" y="566" width="14" height="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="306" y="575" font-size="10.5" fill="#475569">流 1</text>
  <rect x="356" y="566" width="14" height="10" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="376" y="575" font-size="10.5" fill="#475569">流 3</text>
  <rect x="426" y="566" width="14" height="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="446" y="575" font-size="10.5" fill="#475569">流 7</text>
</svg>
