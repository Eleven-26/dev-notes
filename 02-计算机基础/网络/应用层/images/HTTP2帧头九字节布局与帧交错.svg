<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">HTTP/2 的帧头 9 字节自带长度，帧天然有边界</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">Length 只算载荷、不含这 9 字节帧头；消息结束靠 END_STREAM 标志，不再需要 chunked</text>
  <defs>
    <marker id="a5" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="a6" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="a7" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="60" y="104" width="88" height="52" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="104" y="137" font-size="13" fill="#334155" text-anchor="middle">1</text>
  <rect x="148" y="104" width="88" height="52" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="192" y="137" font-size="13" fill="#334155" text-anchor="middle">2</text>
  <rect x="236" y="104" width="88" height="52" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="280" y="137" font-size="13" fill="#334155" text-anchor="middle">3</text>
  <rect x="324" y="104" width="88" height="52" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="368" y="137" font-size="13" fill="#334155" text-anchor="middle">4</text>
  <rect x="412" y="104" width="88" height="52" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="456" y="137" font-size="13" fill="#334155" text-anchor="middle">5</text>
  <rect x="500" y="104" width="88" height="52" rx="0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="544" y="137" font-size="13" fill="#334155" text-anchor="middle">6</text>
  <rect x="588" y="104" width="88" height="52" rx="0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="632" y="137" font-size="13" fill="#334155" text-anchor="middle">7</text>
  <rect x="676" y="104" width="88" height="52" rx="0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="720" y="137" font-size="13" fill="#334155" text-anchor="middle">8</text>
  <rect x="764" y="104" width="88" height="52" rx="0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="808" y="137" font-size="13" fill="#334155" text-anchor="middle">9</text>
  <text x="60" y="98" font-size="11" fill="#64748B" text-anchor="start">字节序号 →</text>
  <path d="M60,168 L60,178 L324,178 L324,168" fill="none" stroke="#2563eb" stroke-width="1.3"/>
  <text x="192" y="200" font-size="11.5" fill="#2563eb" text-anchor="middle">Length：24 位</text>
  <path d="M324,168 L324,178 L412,178 L412,168" fill="none" stroke="#16a34a" stroke-width="1.3"/>
  <text x="368" y="200" font-size="11.5" fill="#16a34a" text-anchor="middle">Type：8 位</text>
  <path d="M412,168 L412,178 L500,178 L500,168" fill="none" stroke="#d97706" stroke-width="1.3"/>
  <text x="456" y="200" font-size="11.5" fill="#d97706" text-anchor="middle">Flags：8 位</text>
  <path d="M500,168 L500,178 L852,178 L852,168" fill="none" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="676" y="200" font-size="11.5" fill="#7c3aed" text-anchor="middle">R（1 位保留）+ StreamID（31 位）</text>
  <text x="60" y="226" font-size="11.5" fill="#64748B" text-anchor="start">Length 只算载荷 → 单帧最大 2^24 − 1 = 16777215 字节；帧之间不需要任何分隔符</text>
  <text x="60" y="262" font-size="12.5" fill="#0f172a" text-anchor="start">同一条连接上的帧可以交错发送，接收方按 StreamID 归位</text>
  <rect x="40" y="274" width="920" height="148" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="56" y="312" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="bold">流 1</text>
  <text x="56" y="370" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="bold">流 3</text>
  <rect x="100" y="288" width="110" height="40" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="155" y="313" font-size="11.5" fill="#334155" text-anchor="middle">HEADERS</text>
  <rect x="300" y="288" width="110" height="40" rx="5" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="355" y="313" font-size="11.5" fill="#334155" text-anchor="middle">DATA</text>
  <rect x="500" y="288" width="110" height="40" rx="5" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="555" y="313" font-size="11.5" fill="#334155" text-anchor="middle">DATA</text>
  <rect x="200" y="346" width="110" height="40" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="255" y="371" font-size="11.5" fill="#334155" text-anchor="middle">HEADERS</text>
  <rect x="400" y="346" width="110" height="40" rx="5" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="455" y="371" font-size="11.5" fill="#334155" text-anchor="middle">DATA</text>
  <rect x="600" y="346" width="110" height="40" rx="5" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="655" y="371" font-size="11.5" fill="#334155" text-anchor="middle">DATA</text>
  <text x="740" y="312" font-size="11.5" fill="#64748B" text-anchor="start">帧在时间轴上交错</text>
  <text x="740" y="332" font-size="11.5" fill="#64748B" text-anchor="start">但每条流内部仍有序</text>
  <text x="740" y="370" font-size="11.5" fill="#64748B" text-anchor="start">共用一条 TCP 连接</text>
  <text x="740" y="390" font-size="11.5" fill="#64748B" text-anchor="start">这是多路复用的全部含义</text>
  <text x="60" y="452" font-size="12.5" fill="#0f172a" text-anchor="start">头块过大时拆成 HEADERS + N × CONTINUATION，靠 END_HEADERS 收尾</text>
  <rect x="60" y="468" width="160" height="48" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="140" y="498" font-size="10.5" fill="#334155" text-anchor="middle">HEADERS</text>
  <rect x="236" y="468" width="160" height="48" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
  <text x="316" y="498" font-size="10.5" fill="#334155" text-anchor="middle">CONTINUATION</text>
  <rect x="412" y="468" width="160" height="48" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
  <text x="492" y="498" font-size="10.5" fill="#334155" text-anchor="middle">CONTINUATION</text>
  <rect x="588" y="468" width="200" height="48" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="688" y="498" font-size="10.5" fill="#334155" text-anchor="middle">CONTINUATION + END_HEADERS</text>
  <text x="60" y="548" font-size="11.5" fill="#64748B" text-anchor="start">不受流控约束的帧：HEADERS / CONTINUATION / SETTINGS / PING / WINDOW_UPDATE —— 否则一个巨大头块就能把自己锁死</text>
  <text x="60" y="574" font-size="11.5" fill="#64748B" text-anchor="start">Transfer-Encoding: chunked 在 HTTP/2 里被禁止；Content-Length 仍可出现，但不再承担定界职责</text>
</svg>
