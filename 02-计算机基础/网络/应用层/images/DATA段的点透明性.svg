<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="490" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">DATA 段的点透明性：正文以点开头的行，线上多一个点</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">接收方去掉一个还原；单独一行的点只在收尾位置出现——它是结束标志，不是数据</text>

  <rect x="20" y="82" width="280" height="24" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" rx="6"/>
  <text x="32" y="99" font-size="12" font-weight="bold" fill="#1e40af">① 正文里本来的样子</text>

  <rect x="350" y="82" width="300" height="24" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" rx="6"/>
  <text x="362" y="99" font-size="12" font-weight="bold" fill="#b45309">② 线上实际发出的字节</text>

  <rect x="700" y="82" width="280" height="24" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1" rx="6"/>
  <text x="712" y="99" font-size="12" font-weight="bold" fill="#047857">③ 接收方还原后</text>

  <rect x="20" y="126" width="280" height="48" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="160" y="156" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#0f172a">.dot-line</text>
  <rect x="350" y="126" width="300" height="48" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" rx="8"/>
  <text x="500" y="156" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#b45309">..dot-line</text>
  <rect x="700" y="126" width="280" height="48" fill="#ecfdf5" stroke="#10b981" stroke-width="1" rx="8"/>
  <text x="840" y="156" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#047857">.dot-line</text>

  <rect x="20" y="182" width="280" height="48" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="160" y="212" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#0f172a">..triple</text>
  <rect x="350" y="182" width="300" height="48" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" rx="8"/>
  <text x="500" y="212" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#b45309">...triple</text>
  <rect x="700" y="182" width="280" height="48" fill="#ecfdf5" stroke="#10b981" stroke-width="1" rx="8"/>
  <text x="840" y="212" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#047857">..triple</text>

  <rect x="20" y="238" width="280" height="48" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="160" y="268" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#0f172a">line-normal</text>
  <rect x="350" y="238" width="300" height="48" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" rx="8"/>
  <text x="500" y="268" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#b45309">line-normal</text>
  <rect x="700" y="238" width="280" height="48" fill="#ecfdf5" stroke="#10b981" stroke-width="1" rx="8"/>
  <text x="840" y="268" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#047857">line-normal</text>

  <rect x="20" y="294" width="280" height="48" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="160" y="324" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#0f172a">.</text>
  <rect x="350" y="294" width="300" height="48" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" rx="8"/>
  <text x="500" y="324" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#b45309">..</text>
  <rect x="700" y="294" width="280" height="48" fill="#ecfdf5" stroke="#10b981" stroke-width="1" rx="8"/>
  <text x="840" y="324" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#047857">.</text>
  <text x="258" y="368" text-anchor="middle" font-size="9.5" fill="#64748b">正文里想放一个孤立的点，也必须写成两个点</text>

  <rect x="20" y="382" width="280" height="48" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" rx="8"/>
  <text x="160" y="412" text-anchor="middle" font-size="12" fill="#b91c1c">结束标志（不是正文）</text>
  <rect x="350" y="382" width="300" height="48" fill="#fef2f2" stroke="#f87171" stroke-width="1" rx="8"/>
  <text x="500" y="412" text-anchor="middle" font-size="14" font-family="Consolas, monospace" font-weight="bold" fill="#b91c1c">.</text>
  <rect x="700" y="382" width="280" height="48" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="8"/>
  <text x="840" y="412" text-anchor="middle" font-size="11" fill="#334155">不进入报文，直接回 250</text>

  <rect x="20" y="440" width="960" height="38" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" rx="8"/>
  <text x="36" y="464" font-size="11" fill="#78350f">不做这一层：实测正文被截断在 start，后面两行被当成命令回 500 5.5.2，而整封信仍然 250 收下——发送方以为发全了，接收方以为收全了</text>
</svg>
