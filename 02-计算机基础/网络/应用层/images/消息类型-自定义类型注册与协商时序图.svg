<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<defs>
<marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
<marker id="arwB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
<marker id="arwO" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/></marker>
</defs>
<text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">自定义类型注册与协商时序图</text>
<text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">2.3 节四步：注册 → 握手上报 → 交集判定 → 文本兜底；不能随便占一个 type 编号就发</text>

<line x1="140" y1="118" x2="140" y2="450" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="400" y1="118" x2="400" y2="450" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="620" y1="118" x2="620" y2="450" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="880" y1="118" x2="880" y2="450" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 5"/>

<rect x="40" y="82" width="200" height="36" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="140" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">业务方</text>
<rect x="300" y="82" width="200" height="36" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="400" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">IM 平台类型注册表</text>
<rect x="520" y="82" width="200" height="36" rx="10" fill="#ffedd5" stroke="#ea580c"/>
<text x="620" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">服务端</text>
<rect x="780" y="82" width="200" height="36" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="880" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">客户端</text>

<polyline points="140,180 400,180" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arwB)"/>
<text x="270" y="172" text-anchor="middle" font-size="12" fill="#1e3a8a">① 注册：type 段 + 结构定义 + 版本</text>

<polyline points="880,250 620,250" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arw)"/>
<text x="750" y="242" text-anchor="middle" font-size="12" fill="#334155">② 协商（握手）：上报支持的 type 集合</text>
<text x="750" y="268" text-anchor="middle" font-size="11" fill="#64748b">能力位 / 列表</text>

<polyline points="620,325 646,325" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arwO)"/>
<rect x="650" y="296" width="196" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="748" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">③ 判定：取双方交集</text>
<text x="748" y="337" text-anchor="middle" font-size="12" fill="#334155">知道这条自定义消息</text>
<text x="748" y="354" text-anchor="middle" font-size="12" fill="#334155">对方能不能看懂</text>

<polyline points="620,410 880,410" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arw)"/>
<text x="750" y="402" text-anchor="middle" font-size="12" fill="#334155">④ 降级：不支持时改发一条 text 兜底</text>
<text x="750" y="428" text-anchor="middle" font-size="11" fill="#64748b">示例：「订单卡片 点击查看」</text>

<rect x="40" y="470" width="920" height="76" rx="10" fill="#fef3c7" stroke="#b45309"/>
<text x="60" y="493" font-size="12" fill="#78350f">注意：承载了绕不过的业务信息的类型才必须协商 + 文本兜底；对方看不懂也无伤大雅的，可以直接发、让对方降级渲染。</text>
<text x="60" y="514" font-size="12" fill="#78350f">这与协议设计 5.2 的能力协商是同一套机制，只是粒度从「特性」细化到了「消息类型」。</text>
<text x="60" y="535" font-size="11" fill="#854d0e">自定义类型从 0x8000 起、避开内置段；业务自定义类型如「订单卡片」「审批单」。</text>

<text x="500" y="578" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">要点：先注册、再协商、后判定，最后才有降级——四步缺一步，新类型上线就可能变成两端各说各话</text>
<text x="500" y="606" text-anchor="middle" font-size="12" fill="#64748b">注意：本篇未做实测，本图为交互时序示意，不含任何耗时或吞吐数字</text>
</svg>
