<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#10b981"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">两套地址：信封决定投递，头决定显示，SMTP 只搬不校验</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">实测把 MAIL FROM 写成 bounce@、From 写成 hello@，服务端照收，并在报文最前面按信封补了两行</text>

  <rect x="20" y="82" width="260" height="22" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" rx="6"/>
  <text x="30" y="98" font-size="12" font-weight="bold" fill="#1e40af">① 客户端发出的两段</text>

  <rect x="20" y="114" width="260" height="96" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
  <text x="32" y="136" font-size="11.5" font-weight="bold" fill="#0f172a">信封（在命令里）</text>
  <text x="32" y="160" font-size="9.5" font-family="Consolas, monospace" fill="#1e40af">MAIL FROM:&lt;bounce@example.com&gt;</text>
  <text x="32" y="180" font-size="9.5" font-family="Consolas, monospace" fill="#1e40af">RCPT TO:&lt;receiver@example.com&gt;</text>
  <text x="32" y="200" font-size="9" fill="#64748b">服务端参与并记录：可追溯</text>

  <rect x="20" y="226" width="260" height="96" fill="#ecfdf5" stroke="#10b981" stroke-width="1" rx="10"/>
  <text x="32" y="248" font-size="11.5" font-weight="bold" fill="#0f172a">头（DATA 正文最前面）</text>
  <text x="32" y="272" font-size="9.5" font-family="Consolas, monospace" fill="#047857">From: hello@example.com</text>
  <text x="32" y="292" font-size="9.5" font-family="Consolas, monospace" fill="#047857">To: receiver@example.com</text>
  <text x="32" y="312" font-size="9" fill="#64748b">客户端自由书写：只是文本</text>

  <rect x="360" y="82" width="300" height="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="370" y="98" font-size="12" font-weight="bold" fill="#334155">② 服务端存下来的报文</text>

  <rect x="360" y="114" width="300" height="208" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" rx="10"/>
  <circle cx="376" cy="138" r="4" fill="#2563eb"/>
  <text x="388" y="142" font-size="9.5" font-family="Consolas, monospace" fill="#0f172a">Return-Path: &lt;bounce@example.com&gt;</text>
  <circle cx="376" cy="164" r="4" fill="#2563eb"/>
  <text x="388" y="168" font-size="9.5" font-family="Consolas, monospace" fill="#0f172a">Received: … for &lt;receiver@…&gt;</text>
  <circle cx="376" cy="202" r="4" fill="#10b981"/>
  <text x="388" y="206" font-size="9.5" font-family="Consolas, monospace" fill="#0f172a">From: hello@example.com</text>
  <circle cx="376" cy="228" r="4" fill="#10b981"/>
  <text x="388" y="232" font-size="9.5" font-family="Consolas, monospace" fill="#0f172a">To: receiver@example.com</text>
  <line x1="372" y1="184" x2="648" y2="184" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="372" y="256" font-size="9" fill="#2563eb">蓝点：投递方按信封补的</text>
  <text x="372" y="272" font-size="9" fill="#047857">绿点：发信方写的，原样保留</text>
  <text x="372" y="300" font-size="9" fill="#64748b">同一封报文里两层并存，互不校验</text>

  <line x1="282" y1="162" x2="356" y2="162" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="282" y1="274" x2="356" y2="274" stroke="#10b981" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>

  <rect x="700" y="82" width="280" height="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="710" y="98" font-size="12" font-weight="bold" fill="#334155">③ 谁读哪一层</text>

  <rect x="700" y="114" width="280" height="96" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
  <text x="712" y="136" font-size="11.5" font-weight="bold" fill="#0f172a">投递与退信看信封</text>
  <text x="712" y="160" font-size="9.5" fill="#334155">收件人列表来自 RCPT TO</text>
  <text x="712" y="180" font-size="9.5" fill="#334155">退信退回 MAIL FROM</text>
  <text x="712" y="200" font-size="9" fill="#64748b">唯一可追溯的一层</text>

  <rect x="700" y="226" width="280" height="96" fill="#ecfdf5" stroke="#10b981" stroke-width="1" rx="10"/>
  <text x="712" y="248" font-size="11.5" font-weight="bold" fill="#0f172a">客户端只显示头</text>
  <text x="712" y="272" font-size="9.5" fill="#334155">From 显示成发件人</text>
  <text x="712" y="292" font-size="9.5" fill="#334155">Bcc = 信封有、头没有</text>
  <text x="712" y="312" font-size="9" fill="#64748b">写进头里等于抄送所有人</text>

  <line x1="662" y1="162" x2="696" y2="162" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="662" y1="274" x2="696" y2="274" stroke="#10b981" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>

  <rect x="20" y="348" width="960" height="64" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" rx="10"/>
  <text x="36" y="372" font-size="11" fill="#78350f">事故来源：头可以随便写 → 伪造 From 的钓鱼（SPF 查信封域，DMARC 要求与 From 域对齐）；MAIL FROM 填别人的地址 → 退信打到第三方</text>
  <text x="36" y="396" font-size="11" fill="#78350f">例外只有 Bcc：它不是字段，而是「信封里多一个 RCPT、头里什么都不写」</text>
</svg>
