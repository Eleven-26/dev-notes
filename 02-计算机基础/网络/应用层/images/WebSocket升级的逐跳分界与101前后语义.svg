<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="1080" height="480" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arwW" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 4.5 L0 9 Z" fill="#475569"/>
    </marker>
    <marker id="arwWg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 4.5 L0 9 Z" fill="#166534"/>
    </marker>
    <marker id="arwWr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 4.5 L0 9 Z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="480" fill="#ffffff"/>
  <text x="40" y="26" font-size="15" font-weight="bold" fill="#0f172a">WebSocket 升级：逐跳头在哪一跳被剥掉，101 又切开了什么</text>

  <text x="40" y="56" font-size="11.5" font-weight="bold" fill="#334155">① 同一个握手请求，在中间那一跳有两种命运</text>
  <text x="54" y="80" font-size="10.5" font-weight="bold" fill="#475569">客户端发起</text>
  <text x="344" y="80" font-size="10.5" font-weight="bold" fill="#475569">中间这一跳（Nginx / Envoy）</text>
  <text x="704" y="80" font-size="10.5" font-weight="bold" fill="#475569">服务端与之后</text>

  <path d="M300 211 L315 211 M315 164 L315 248 M315 164 L328 164 M315 248 L328 248" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arwW)"/>
  <path d="M660 164 L688 164" fill="none" stroke="#166534" stroke-width="1.5" marker-end="url(#arwWg)"/>
  <path d="M660 248 L688 248" fill="none" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arwWr)"/>

  <rect x="40" y="130" width="260" height="162" fill="#f8fafc" stroke="#475569" stroke-width="1.2" rx="6"/>
  <text x="54" y="152" font-size="11" font-weight="bold" fill="#0f172a">握手请求（就是一次 HTTP GET）</text>
  <text x="54" y="174" font-size="9.5" fill="#334155">GET /ws HTTP/1.1</text>
  <text x="54" y="192" font-size="9.5" fill="#b45309">Connection: Upgrade　← 逐跳</text>
  <text x="54" y="210" font-size="9.5" fill="#b45309">Upgrade: websocket　← 逐跳</text>
  <text x="54" y="228" font-size="9.5" fill="#334155">Sec-WebSocket-Version: 13</text>
  <text x="54" y="246" font-size="9.5" fill="#334155">Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==</text>
  <text x="54" y="264" font-size="9.5" fill="#334155">Origin 由浏览器自动带上，服务端要校验</text>
  <text x="54" y="282" font-size="9.5" fill="#b91c1c">⚠️ 浏览器不会替你加自定义头</text>

  <rect x="330" y="130" width="330" height="68" fill="#f0fdf4" stroke="#166534" stroke-width="1.2" rx="6"/>
  <text x="344" y="152" font-size="10.5" font-weight="bold" fill="#166534">代理配了 Upgrade 透传</text>
  <text x="344" y="172" font-size="9.5" fill="#14532d">Nginx：proxy_set_header Upgrade / Connection</text>
  <text x="344" y="190" font-size="9.5" fill="#14532d">两个逐跳头原样带到下一跳</text>

  <rect x="330" y="214" width="330" height="68" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2" rx="6"/>
  <text x="344" y="236" font-size="10.5" font-weight="bold" fill="#b91c1c">代理没配，或根本不认 Upgrade</text>
  <text x="344" y="256" font-size="9.5" fill="#7f1d1d">逐跳头被剥掉，或这条路径被路由到普通 HTTP handler</text>
  <text x="344" y="274" font-size="9.5" fill="#7f1d1d">鉴权 401 / 403、Origin 不通过也落在这一格</text>

  <rect x="690" y="130" width="354" height="68" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" rx="6"/>
  <text x="704" y="152" font-size="10.5" font-weight="bold" fill="#1e40af">101 Switching Protocols</text>
  <text x="704" y="172" font-size="9.5" fill="#1e3a8a">响应头里有 Upgrade 与 Sec-WebSocket-Accept</text>
  <text x="704" y="190" font-size="9.5" fill="#1e3a8a">此后这条连接只剩 WebSocket 帧</text>

  <rect x="690" y="214" width="354" height="68" fill="#fff7ed" stroke="#b45309" stroke-width="1.2" rx="6"/>
  <text x="704" y="236" font-size="10.5" font-weight="bold" fill="#b45309">升级没成：握手按普通 HTTP 返回</text>
  <text x="704" y="256" font-size="9.5" fill="#78350f">客户端只看到连接被关掉（onclose）</text>
  <text x="704" y="274" font-size="9.5" fill="#78350f">先看握手响应码与响应头，别从网络猜起</text>

  <text x="40" y="330" font-size="11.5" font-weight="bold" fill="#334155">② 101 是这条连接的分界线：前后是两套语义</text>

  <rect x="40" y="344" width="460" height="94" fill="#f8fafc" stroke="#64748b" stroke-width="1.2" rx="6"/>
  <text x="54" y="366" font-size="11" font-weight="bold" fill="#334155">101 之前：还是 HTTP</text>
  <text x="54" y="388" font-size="10" fill="#475569">有请求 / 响应配对，定界与状态码都在</text>
  <text x="54" y="406" font-size="10" fill="#475569">超时、重试、重定向、压缩自动生效</text>
  <text x="54" y="424" font-size="10" fill="#475569">抓包用 http 过滤器就能读</text>

  <rect x="502" y="366" width="36" height="40" fill="#b91c1c" rx="4"/>
  <text x="520" y="392" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">101</text>

  <rect x="540" y="344" width="504" height="94" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" rx="6"/>
  <text x="554" y="366" font-size="11" font-weight="bold" fill="#1e40af">101 之后：只剩 WebSocket 帧</text>
  <text x="554" y="388" font-size="10" fill="#1e3a8a">没有请求 / 响应配对，消息边界要自己定</text>
  <text x="554" y="406" font-size="10" fill="#1e3a8a">HTTP 的超时、重试、重定向都不再生效</text>
  <text x="554" y="424" font-size="10" fill="#1e3a8a">心跳用 ping / pong 控制帧或业务心跳兜底</text>

  <text x="40" y="466" font-size="10" fill="#64748b">抓包时过滤器要从 http 切到 websocket；代理的空闲超时仍会掐断它，心跳间隔要小于链路上最小的那个空闲超时。</text>
</svg>
