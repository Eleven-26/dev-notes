<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一跳之内请求头的三种命运与治理顺序</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">同一批头在这一跳里走三条路：内部信号剥掉、不可信值换成可信值、其余原样透传</text>

  <rect x="40" y="76" width="250" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="52" y="98" font-size="12" font-weight="bold" fill="#0f172a">入站：客户端发来的一切</text>
  <text x="52" y="116" font-size="10.5" fill="#475569">三类头混在一起，网关无法分辨</text>
  <rect x="320" y="76" width="400" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="332" y="98" font-size="11" fill="#0f172a">逐跳头（Connection 等）＋ 伪造的内部头（X-Company-Id）</text>
  <text x="332" y="116" font-size="11" fill="#0f172a">＋ 客户端自称的 XFF ＋ 端到端业务头（X-Foo、Accept）</text>
  <rect x="750" y="76" width="210" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="762" y="98" font-size="11" fill="#0f172a">实测入站：XFF=1.2.3.4</text>
  <text x="762" y="116" font-size="11" fill="#475569">X-Company-Id 由客户端塞入</text>

  <rect x="40" y="150" width="250" height="52" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="52" y="172" font-size="12" font-weight="bold" fill="#991b1b">第①道：逐跳头被拦下</text>
  <text x="52" y="190" font-size="10.5" fill="#991b1b">标准库 ReverseProxy 自动做（2.1）</text>
  <rect x="320" y="150" width="400" height="52" rx="6" fill="#fff1f2" stroke="#fecaca" stroke-width="1.2"/>
  <text x="332" y="172" font-size="11" fill="#0f172a">删除 Connection、Keep-Alive、Trailer、Upgrade，</text>
  <text x="332" y="190" font-size="11" fill="#0f172a">以及 Connection 里点名的头；TE 只在 trailers 语义时重写</text>
  <rect x="750" y="150" width="210" height="52" rx="6" fill="#fff1f2" stroke="#fecaca" stroke-width="1.2"/>
  <text x="762" y="172" font-size="11" fill="#0f172a">实测：X-Hop-Only 未到</text>
  <text x="762" y="190" font-size="11" fill="#475569">上游只收到 Te [trailers]</text>

  <rect x="40" y="224" width="250" height="52" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="52" y="246" font-size="12" font-weight="bold" fill="#991b1b">第②道：剥掉内部信号</text>
  <text x="52" y="264" font-size="10.5" fill="#991b1b">3.3：顺序唯一，先 Del 再 Set</text>
  <rect x="320" y="224" width="400" height="52" rx="6" fill="#fff1f2" stroke="#fecaca" stroke-width="1.2"/>
  <text x="332" y="246" font-size="11" fill="#0f172a">X-Company-Id、X-Tenant-Id、X-User-Id、X-Internal-Call、</text>
  <text x="332" y="264" font-size="11" fill="#0f172a">Forwarded、X-Original-URL、X-Rewrite-URL 一律删除</text>
  <rect x="750" y="224" width="210" height="52" rx="6" fill="#fff1f2" stroke="#fecaca" stroke-width="1.2"/>
  <text x="762" y="246" font-size="11" fill="#0f172a">再用鉴权结果重写</text>
  <text x="762" y="264" font-size="11" fill="#475569">X-Forwarded-User</text>

  <rect x="40" y="298" width="250" height="52" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="52" y="320" font-size="12" font-weight="bold" fill="#7c2d12">第③道：改写目标与路径</text>
  <text x="52" y="338" font-size="10.5" fill="#7c2d12">Director（3.1）</text>
  <rect x="320" y="298" width="400" height="52" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="332" y="320" font-size="11" fill="#0f172a">req.URL.Scheme / Host 指向上游；剥前缀只在段边界做</text>
  <text x="332" y="338" font-size="11" fill="#0f172a">Host 改不改取决于上游怎么用（要原始值就走 XFH）</text>
  <rect x="750" y="298" width="210" height="52" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="762" y="320" font-size="11" fill="#0f172a">/api/order/123 → /order/123</text>
  <text x="762" y="338" font-size="11" fill="#475569">/apifoo 不被误剥</text>

  <rect x="40" y="372" width="250" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="52" y="394" font-size="12" font-weight="bold" fill="#1e3a8a">第④道：补齐转发头</text>
  <text x="52" y="412" font-size="10.5" fill="#1e3a8a">Director 内 Set（3.2）</text>
  <rect x="320" y="372" width="400" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="332" y="394" font-size="11" fill="#0f172a">X-Real-IP、X-Forwarded-Host、X-Forwarded-Proto</text>
  <text x="332" y="412" font-size="11" fill="#0f172a">⚠ 这里刻意不写 X-Forwarded-For</text>
  <rect x="750" y="372" width="210" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="762" y="394" font-size="11" fill="#0f172a">取值来源决定成败</text>
  <text x="762" y="412" font-size="11" fill="#475569">见 4.2 的两组读数</text>

  <rect x="40" y="446" width="250" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="52" y="468" font-size="12" font-weight="bold" fill="#1e3a8a">第⑤道：标准库追加 XFF</text>
  <text x="52" y="486" font-size="10.5" fill="#1e3a8a">发生在 Director 返回之后</text>
  <rect x="320" y="446" width="400" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="332" y="468" font-size="11" fill="#0f172a">把「网关的直接对端」追加到链尾，并把多个同名头折成一条</text>
  <text x="332" y="486" font-size="11" fill="#0f172a">自己抢在前面写一次 → 同一个地址出现两遍</text>
  <rect x="750" y="446" width="210" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="762" y="468" font-size="11" fill="#0f172a">实测：1.2.3.4, 127.0.0.1</text>
  <text x="762" y="486" font-size="11" fill="#475569">双写时 127.0.0.1, 127.0.0.1</text>

  <rect x="40" y="520" width="250" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="52" y="542" font-size="12" font-weight="bold" fill="#14532d">上游最终看到</text>
  <text x="52" y="560" font-size="10.5" fill="#14532d">三条命运在这里汇合</text>
  <rect x="320" y="520" width="400" height="52" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="332" y="542" font-size="11" fill="#0f172a">内部头：不存在　端到端头：原样　转发头：网关写的可信值</text>
  <text x="332" y="560" font-size="11" fill="#475569">既不是全部透传（会带进伪造内部头），也不是全部重建（丢掉客户端语义）</text>
  <rect x="750" y="520" width="210" height="52" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="762" y="542" font-size="11" fill="#0f172a">实测：X-Foo 原样到达</text>
  <text x="762" y="560" font-size="11" fill="#475569">X-Company-Id 已消失</text>

  <line x1="165" y1="128" x2="165" y2="146" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar6)"/>
  <line x1="165" y1="202" x2="165" y2="220" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar6)"/>
  <line x1="165" y1="276" x2="165" y2="294" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar6)"/>
  <line x1="165" y1="350" x2="165" y2="368" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar6)"/>
  <line x1="165" y1="424" x2="165" y2="442" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar6)"/>
  <line x1="165" y1="498" x2="165" y2="516" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar6)"/>

  <text x="40" y="602" font-size="11.5" fill="#991b1b">■ 剥掉（内部信号与逐跳头）　■ 重写（换成网关这一跳的可信值，蓝）　■ 原样透传（端到端语义，绿）</text>
  <text x="40" y="628" font-size="11.5" fill="#1e3a8a">要点：判据只有一条 —— 问「这个头客户端能不能自己写」。能写的就不能采信，必须在入站处理掉。</text>
  <text x="40" y="650" font-size="11.5" fill="#64748b">注意：XFF 的追加时机在 Director 之后，所以「不手写 XFF」不是风格问题，而是会直接产生重复条目。</text>

  <defs>
    <marker id="ar6" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
