<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="590" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">HTTP/1.1 与 HTTP/2 的连接与并发模型</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">1.1 的并发靠「多开连接」、每条连接内部串行；2 的并发靠「一条连接多条流」、帧可交错</text>

  <defs>
    <marker id="arwB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>

  <rect x="20" y="74" width="460" height="310" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="34" y="98" font-size="15" font-weight="bold" fill="#0f172a">HTTP/1.1：并发 = 多开连接</text>
  <text x="34" y="118" font-size="10.5" fill="#64748b">同域常见 6 条上限（实现相关），每条连接内部仍是「一发一等」</text>

  <rect x="34" y="140" width="400" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="44" y="161" font-size="10" fill="#334155">连接 1</text>
  <rect x="130" y="146" width="76" height="22" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="168" y="161" text-anchor="middle" font-size="9" fill="#1e40af">请求 1</text>
  <line x1="208" y1="157" x2="220" y2="157" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arwB)"/>
  <rect x="222" y="146" width="76" height="22" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="260" y="161" text-anchor="middle" font-size="9" fill="#1e40af">响应 1</text>
  <line x1="300" y1="157" x2="312" y2="157" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arwB)"/>
  <rect x="314" y="146" width="76" height="22" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/>
  <text x="352" y="161" text-anchor="middle" font-size="9" fill="#92400e">请求 2</text>

  <rect x="34" y="192" width="400" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="44" y="213" font-size="10" fill="#334155">连接 2</text>
  <rect x="130" y="198" width="76" height="22" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="168" y="213" text-anchor="middle" font-size="9" fill="#1e40af">请求 3</text>
  <line x1="208" y1="209" x2="220" y2="209" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arwB)"/>
  <rect x="222" y="198" width="76" height="22" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="260" y="213" text-anchor="middle" font-size="9" fill="#1e40af">响应 3</text>
  <line x1="300" y1="209" x2="312" y2="209" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arwB)"/>
  <rect x="314" y="198" width="76" height="22" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/>
  <text x="352" y="213" text-anchor="middle" font-size="9" fill="#92400e">请求 4</text>

  <rect x="34" y="244" width="400" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="44" y="265" font-size="10" fill="#334155">连接 3</text>
  <rect x="130" y="250" width="76" height="22" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="168" y="265" text-anchor="middle" font-size="9" fill="#1e40af">请求 5</text>
  <line x1="208" y1="261" x2="220" y2="261" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arwB)"/>
  <rect x="222" y="250" width="76" height="22" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="260" y="265" text-anchor="middle" font-size="9" fill="#1e40af">响应 5</text>
  <line x1="300" y1="261" x2="312" y2="261" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arwB)"/>
  <rect x="314" y="250" width="76" height="22" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/>
  <text x="352" y="265" text-anchor="middle" font-size="9" fill="#92400e">请求 6</text>

  <text x="34" y="302" font-size="10" fill="#dc2626">黄色框：同一个响应没回来之前，这条连接上的下一个请求只能等着</text>
  <text x="34" y="324" font-size="10" fill="#334155">并发 6 个请求 = 开 6 条连接，各自都要 TCP + TLS 握手</text>
  <text x="34" y="346" font-size="10" fill="#334155">头部压缩没有跨连接上下文：Cookie 在每条连接各发一遍</text>
  <text x="34" y="368" font-size="10" fill="#64748b">1.1 的管线化规范里有，但主流浏览器都没有启用</text>

  <rect x="520" y="74" width="460" height="310" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="534" y="98" font-size="15" font-weight="bold" fill="#0f172a">HTTP/2：一条连接、多条流</text>
  <text x="534" y="118" font-size="10.5" fill="#64748b">帧可交错，接收方按 Stream ID 重排，流内部仍然有序</text>

  <rect x="534" y="134" width="432" height="150" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="546" y="158" font-size="10" fill="#334155">一条 TCP 连接：所有流的帧都在这个容器里</text>

  <rect x="546" y="170" width="62" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="577" y="189" text-anchor="middle" font-size="9.5" fill="#1e40af">H 1</text>
  <rect x="614" y="170" width="62" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="645" y="189" text-anchor="middle" font-size="9.5" fill="#14532d">D 3</text>
  <rect x="682" y="170" width="62" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="713" y="189" text-anchor="middle" font-size="9.5" fill="#1e40af">D 1</text>
  <rect x="750" y="170" width="62" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="781" y="189" text-anchor="middle" font-size="9.5" fill="#14532d">H 3</text>
  <rect x="818" y="170" width="62" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="849" y="189" text-anchor="middle" font-size="9.5" fill="#14532d">D 3</text>
  <rect x="886" y="170" width="62" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="917" y="189" text-anchor="middle" font-size="9.5" fill="#1e40af">D 1</text>

  <text x="546" y="222" font-size="9.5" fill="#334155">H = HEADERS 帧，D = DATA 帧，数字 = Stream ID；蓝色流 1，绿色流 3</text>
  <text x="546" y="244" font-size="9.5" fill="#334155">帧头有 24 位长度 → 每帧自带边界，不再需要 chunked 定界</text>
  <text x="546" y="266" font-size="9.5" fill="#334155">流 1 与流 3 的帧交错，谁也等不到谁，应用层队头阻塞消失</text>

  <text x="534" y="302" font-size="10" fill="#334155">一条连接承受并发 → 省下 N−1 次 TCP + TLS 握手</text>
  <text x="534" y="324" font-size="10" fill="#334155">HPACK 动态表按连接维护：请求越多，重复头命中得越多</text>
  <text x="534" y="346" font-size="10" fill="#dc2626">但它仍是一条 TCP：丢一个包会阻塞这条连接上的全部流</text>
  <text x="534" y="368" font-size="10" fill="#64748b">并发流上限由 SETTINGS_MAX_CONCURRENT_STREAMS 决定</text>

  <rect x="20" y="404" width="960" height="170" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="34" y="428" font-size="15" font-weight="bold" fill="#0f172a">一句话对照：差别全在「怎么把消息搬过 TCP」</text>
  <text x="34" y="456" font-size="10.5" fill="#334155">HTTP/1.1：文本报文 + 并发靠多连接 + 应用层自己划界（Content-Length / chunked）+ 头部每请求重发</text>
  <text x="34" y="480" font-size="10.5" fill="#334155">HTTP/2：二进制分帧 + 单连接多流 + 帧自带长度 + HPACK 索引表 + 连接级与流级两级流控</text>
  <text x="34" y="508" font-size="10.5" fill="#14532d">语义层完全相同：方法、状态码、头字段一套代码通吃，所以 2 能平滑替换 1.1</text>
  <text x="34" y="532" font-size="10.5" fill="#92400e">注意 1：版本是 ALPN 协商出来的结果，不是「升级」；协商不到 h2 就自动退回 1.1</text>
  <text x="34" y="556" font-size="10.5" fill="#991b1b">注意 2：2 只消除了应用层队头阻塞，TCP 层的还在，要到 HTTP/3 才解决</text>
</svg>
