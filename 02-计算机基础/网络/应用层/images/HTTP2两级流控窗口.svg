<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">HTTP/2 的流控是连接级与流级两层，只有 DATA 帧受约束</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">连接级 65535 字节被所有流共享，流级各自 65535 字节，实际能发多少取最紧的那个</text>
  <defs>
    <marker id="a10" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="a11" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="40" y="90" width="600" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="116" font-size="12.5" fill="#1e3a8a" text-anchor="start" font-weight="bold">连接级窗口：65535 字节，这条连接上所有流共享</text>
  <rect x="60" y="130" width="560" height="26" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <rect x="60" y="130" width="336" height="26" rx="4" fill="#60a5fa" stroke="#2563eb" stroke-width="1"/>
  <text x="228" y="148" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">已被占用</text>
  <text x="500" y="148" font-size="11" fill="#1e40af" text-anchor="middle">剩余</text>
  <rect x="40" y="210" width="600" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="58" y="232" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="bold">流 1</text>
  <text x="58" y="252" font-size="11" fill="#64748B" text-anchor="start">自己的流级窗口 65535 字节（可由 SETTINGS_INITIAL_WINDOW_SIZE 改）</text>
  <rect x="470" y="224" width="150" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="470" y="224" width="90" height="26" rx="4" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1"/>
  <rect x="40" y="280" width="600" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="58" y="302" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="bold">流 3</text>
  <text x="58" y="322" font-size="11" fill="#64748B" text-anchor="start">自己的流级窗口 65535 字节（可由 SETTINGS_INITIAL_WINDOW_SIZE 改）</text>
  <rect x="470" y="294" width="150" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="470" y="294" width="90" height="26" rx="4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
  <rect x="40" y="350" width="600" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="58" y="372" font-size="12" fill="#0f766e" text-anchor="start" font-weight="bold">流 5</text>
  <text x="58" y="392" font-size="11" fill="#64748B" text-anchor="start">自己的流级窗口 65535 字节（可由 SETTINGS_INITIAL_WINDOW_SIZE 改）</text>
  <rect x="470" y="364" width="150" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="470" y="364" width="90" height="26" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="1"/>
  <rect x="660" y="90" width="300" height="316" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="680" y="118" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="bold">窗口怎么补</text>
  <text x="680" y="148" font-size="11.5" fill="#1e3a8a" text-anchor="start" font-weight="bold">WINDOW_UPDATE(stream=0)</text>
  <text x="680" y="168" font-size="11" fill="#64748B" text-anchor="start">→ 补连接级，全体共享</text>
  <text x="680" y="198" font-size="11.5" fill="#1e3a8a" text-anchor="start" font-weight="bold">WINDOW_UPDATE(stream=N)</text>
  <text x="680" y="218" font-size="11" fill="#64748B" text-anchor="start">→ 补某一条流的额度</text>
  <line x1="680" y1="240" x2="940" y2="240" stroke="#cbd5e1" stroke-width="1"/>
  <text x="680" y="268" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="bold">只有 DATA 帧受流控</text>
  <text x="680" y="290" font-size="11" fill="#334155" text-anchor="start">HEADERS / SETTINGS / PING</text>
  <text x="680" y="310" font-size="11" fill="#334155" text-anchor="start">WINDOW_UPDATE 都不受约束</text>
  <text x="680" y="338" font-size="11" fill="#64748B" text-anchor="start">否则一个巨大头块</text>
  <text x="680" y="358" font-size="11" fill="#64748B" text-anchor="start">就能把自己锁死</text>
  <text x="680" y="386" font-size="11.5" fill="#b91c1c" text-anchor="start">窗口耗尽的症状是「卡住不报错」</text>
  <text x="44" y="442" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">三个不能混的东西：三者叠加生效，实际能发多少取最紧的那个</text>
  <rect x="40" y="458" width="290" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="56" y="484" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">TCP rwnd</text>
  <text x="56" y="508" font-size="11.5" fill="#334155" text-anchor="start">接收方内核缓冲还能收多少</text>
  <text x="56" y="530" font-size="11" fill="#64748B" text-anchor="start">内核维护</text>
  <rect x="350" y="458" width="290" height="86" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="366" y="484" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">TCP cwnd</text>
  <text x="366" y="508" font-size="11.5" fill="#334155" text-anchor="start">网络拥塞到什么程度</text>
  <text x="366" y="530" font-size="11" fill="#64748B" text-anchor="start">内核维护</text>
  <rect x="660" y="458" width="290" height="86" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="676" y="484" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">HTTP/2 窗口</text>
  <text x="676" y="508" font-size="11.5" fill="#334155" text-anchor="start">同连接内多条流之间的配额</text>
  <text x="676" y="530" font-size="11" fill="#64748B" text-anchor="start">HTTP/2 层维护</text>
  <text x="44" y="576" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">三句口诀：rwnd 管对端、cwnd 管网、HTTP/2 窗口管「流之间」</text>
  <text x="44" y="606" font-size="11.5" fill="#64748B" text-anchor="start">HTTP/2 的流控完全不感知网络状况，所以它不是拥塞控制；它只解决「一条流别把整条连接的份额吃光」</text>
</svg>
