<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 448" width="1000" height="448" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="448" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">应用层九篇：六个现成协议，加两个横切</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">前五个回答「同一套语义怎么在连接上跑」，SMTP 回答「一封邮件怎么在服务器之间跳」，横切管安全与自定义</text>

  <rect x="20" y="66" width="340" height="22" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" rx="6"/>
  <text x="30" y="82" font-size="12.5" font-weight="bold" fill="#1e40af">主体 · 六个现成协议（前五个是同一问题的五种答案）</text>

  <g transform="translate(20,92)">
    <rect x="0" y="0" width="150" height="118" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="12" y="24" font-size="11.5" font-weight="bold" fill="#0f172a">HTTP/1.1 与 HTTP/2</text>
    <text x="12" y="45" font-size="9.5" fill="#1e40af">同一语义两种承载</text>
    <text x="12" y="68" font-size="9.5" fill="#334155">连接与并发模型</text>
    <text x="12" y="84" font-size="9.5" fill="#334155">消息定界三法</text>
    <text x="12" y="100" font-size="9.5" fill="#334155">HPACK · 两级流控</text>
    <text x="12" y="114" font-size="9" fill="#64748b">版本差异唯一详解源</text>
  </g>

  <g transform="translate(182,92)">
    <rect x="0" y="0" width="150" height="118" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="12" y="24" font-size="11.5" font-weight="bold" fill="#0f172a">HTTP 与 gRPC</text>
    <text x="12" y="45" font-size="9.5" fill="#1e40af">HTTP/2 加 Protobuf</text>
    <text x="12" y="68" font-size="9.5" fill="#334155">连接池与复用观测</text>
    <text x="12" y="84" font-size="9.5" fill="#334155">多路复用实测</text>
    <text x="12" y="100" font-size="9.5" fill="#334155">超时 · 重试 · 单例</text>
    <text x="12" y="114" font-size="9" fill="#64748b">抓包判据</text>
  </g>

  <g transform="translate(344,92)">
    <rect x="0" y="0" width="150" height="118" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="12" y="24" font-size="11.5" font-weight="bold" fill="#0f172a">QUIC 与 HTTP/3</text>
    <text x="12" y="45" font-size="9.5" fill="#1e40af">把 TCP 换掉之后</text>
    <text x="12" y="68" font-size="9.5" fill="#334155">流隔离边界</text>
    <text x="12" y="84" font-size="9.5" fill="#334155">0-RTT 与连接迁移</text>
    <text x="12" y="100" font-size="9.5" fill="#334155">SVCB 与 Alt-Svc</text>
    <text x="12" y="114" font-size="9" fill="#64748b">失败怎么回退</text>
  </g>

  <g transform="translate(506,92)">
    <rect x="0" y="0" width="150" height="118" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="12" y="24" font-size="11.5" font-weight="bold" fill="#0f172a">WebSocket</text>
    <text x="12" y="45" font-size="9.5" fill="#1e40af">全双工，自己管一切</text>
    <text x="12" y="68" font-size="9.5" fill="#334155">101 升级握手</text>
    <text x="12" y="84" font-size="9.5" fill="#334155">帧布局与掩码</text>
    <text x="12" y="100" font-size="9.5" fill="#334155">升级后丢了什么</text>
    <text x="12" y="114" font-size="9" fill="#64748b">RFC 6455</text>
  </g>

  <g transform="translate(668,92)">
    <rect x="0" y="0" width="150" height="118" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="12" y="24" font-size="11.5" font-weight="bold" fill="#0f172a">SSE</text>
    <text x="12" y="45" font-size="9.5" fill="#1e40af">一条普通 HTTP 响应</text>
    <text x="12" y="68" font-size="9.5" fill="#334155">事件流四类行</text>
    <text x="12" y="84" font-size="9.5" fill="#334155">Last-Event-ID</text>
    <text x="12" y="100" font-size="9.5" fill="#334155">六连接上限</text>
    <text x="12" y="114" font-size="9" fill="#64748b">只能传文本</text>
  </g>

  <g transform="translate(830,92)">
    <rect x="0" y="0" width="150" height="118" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="12" y="24" font-size="11.5" font-weight="bold" fill="#0f172a">SMTP</text>
    <text x="12" y="45" font-size="9.5" fill="#1e40af">服务器之间的邮件投递</text>
    <text x="12" y="68" font-size="9.5" fill="#334155">命令-应答状态机</text>
    <text x="12" y="84" font-size="9.5" fill="#334155">信封与头两套地址</text>
    <text x="12" y="100" font-size="9.5" fill="#334155">DATA 点透明性</text>
    <text x="12" y="114" font-size="9" fill="#64748b">实测 Mailpit</text>
  </g>

  <rect x="20" y="224" width="360" height="22" fill="#fef3c7" stroke="#fcd34d" stroke-width="1" rx="6"/>
  <text x="30" y="240" font-size="12.5" font-weight="bold" fill="#92400e">横切一 · 安全：所有协议都可能跑在它上面</text>

  <rect x="660" y="224" width="320" height="22" fill="#dcfce7" stroke="#86efac" stroke-width="1" rx="6"/>
  <text x="670" y="240" font-size="12.5" font-weight="bold" fill="#166534">横切二 · 方法论：现成的都不合适时</text>

  <g transform="translate(20,250)">
    <rect x="0" y="0" width="300" height="106" fill="#fffbeb" stroke="#b45309" stroke-width="1" rx="10"/>
    <text x="12" y="24" font-size="13" font-weight="bold" fill="#0f172a">HTTPS 与 TLS</text>
    <text x="12" y="46" font-size="10" fill="#92400e">握手怎么走、会话怎么复用</text>
    <text x="12" y="68" font-size="9.5" fill="#334155">TLS 1.2 全流程 / 1.3 改了什么</text>
    <text x="12" y="86" font-size="9.5" fill="#334155">证书在握手现场怎么用 · ALPN</text>
    <text x="12" y="100" font-size="9" fill="#64748b">mTLS · 0-RTT · ECH</text>
  </g>

  <g transform="translate(340,250)">
    <rect x="0" y="0" width="300" height="106" fill="#fffbeb" stroke="#b45309" stroke-width="1" rx="10"/>
    <text x="12" y="24" font-size="13" font-weight="bold" fill="#0f172a">证书与 HTTPS 排障</text>
    <text x="12" y="46" font-size="10" fill="#92400e">握手失败该从哪一步查</text>
    <text x="12" y="68" font-size="9.5" fill="#334155">X.509 字段 · 信任链五步校验</text>
    <text x="12" y="86" font-size="9.5" fill="#334155">ACME 续期 · 证书固定</text>
    <text x="12" y="100" font-size="9" fill="#64748b">五类握手错误判据</text>
  </g>

  <g transform="translate(660,250)">
    <rect x="0" y="0" width="320" height="106" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" rx="10"/>
    <text x="12" y="24" font-size="13" font-weight="bold" fill="#0f172a">自定义协议设计</text>
    <text x="12" y="46" font-size="10" fill="#166534">一条协议要自己定哪些事</text>
    <text x="12" y="68" font-size="9.5" fill="#334155">帧格式 · 消息类型 · 粘包半包</text>
    <text x="12" y="86" font-size="9.5" fill="#334155">版本演进 · 能力协商 · 错误码</text>
    <text x="12" y="100" font-size="9" fill="#64748b">幂等重试 · 背压 · 可观测性</text>
  </g>

  <g transform="translate(20,372)">
    <rect x="0" y="0" width="960" height="60" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="22" font-size="11.5" font-weight="bold" fill="#0f172a">三块的分界：协议「长什么样、怎么跑」在应用层；「怎么加密」是横切一；「自己定一套」是横切二。</text>
    <text x="14" y="42" font-size="10.5" fill="#334155">三种服务端推送的横向选型不在本目录，在 选型/通信选型.md 3.1 ②；数据序列化在 选型/数据序列化.md。</text>
    <text x="14" y="56" font-size="10.5" fill="#64748b">SMTP 只讲发送侧；服务器怎么装、队列与 SPF/DKIM 在 02-计算机基础/linux 的 10-邮件服务器.md。</text>
  </g>
</svg>
