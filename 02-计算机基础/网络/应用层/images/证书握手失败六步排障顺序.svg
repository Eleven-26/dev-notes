<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arwT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 4.5 L0 9 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="620" fill="#ffffff"/>
  <text x="40" y="26" font-size="15" font-weight="bold" fill="#0f172a">TLS 握手失败排障顺序：六步分流，任一步命中就停</text>
  <text x="40" y="50" font-size="10.5" fill="#64748b">左列是「先查什么」，右列是「命中时报什么错、为什么」；顺序按 4.2 的清单，不要从算法和信任库倒着查。</text>

  <path d="M170 140 L170 170 M170 228 L170 258 M170 316 L170 346 M170 404 L170 434 M170 492 L170 522" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwT)"/>
  <path d="M300 112 L338 112 M300 200 L338 200 M300 288 L338 288 M300 376 L338 376 M300 464 L338 464 M300 552 L338 552" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwT)"/>

  <rect x="40" y="84" width="260" height="56" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" rx="6"/>
  <text x="54" y="106" font-size="11" font-weight="bold" fill="#1e40af">① 先确认看到的是哪张证书</text>
  <text x="54" y="126" font-size="9.5" fill="#475569">openssl s_client -showcerts</text>

  <rect x="340" y="84" width="704" height="56" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
  <text x="354" y="106" font-size="11" font-weight="bold" fill="#0f172a">命中：拿到的证书不是本站点的</text>
  <text x="354" y="127" font-size="10" fill="#475569">SNI 未匹配：同 IP 多域名，客户端没带 SNI 或服务端默认虚拟主机配错</text>

  <rect x="40" y="172" width="260" height="56" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" rx="6"/>
  <text x="54" y="194" font-size="11" font-weight="bold" fill="#1e40af">② 看链是否完整</text>
  <text x="54" y="214" font-size="9.5" fill="#475569">leaf → intermediate 都在？根由信任库给</text>

  <rect x="340" y="172" width="704" height="56" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
  <text x="354" y="194" font-size="11" font-weight="bold" fill="#0f172a">命中：unable to get local issuer certificate / unknown authority</text>
  <text x="354" y="215" font-size="10" fill="#475569">⚠️ 服务端漏发中间证书最常见；其次是客户端信任库太老（旧 JDK cacerts 缺新根）</text>

  <rect x="40" y="260" width="260" height="56" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" rx="6"/>
  <text x="54" y="282" font-size="11" font-weight="bold" fill="#1e40af">③ 看有效期与 SAN</text>
  <text x="54" y="302" font-size="9.5" fill="#475569">-dates -ext subjectAltName</text>

  <rect x="340" y="260" width="704" height="56" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
  <text x="354" y="282" font-size="11" font-weight="bold" fill="#0f172a">命中：has expired / is not yet valid / hostname mismatch</text>
  <text x="354" y="303" font-size="10" fill="#475569">过期＝忘了续期（事故 Top 1）；尚未生效＝系统时间不对（容器没同步 NTP）；不匹配＝缺对应 SAN</text>

  <rect x="40" y="348" width="260" height="56" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" rx="6"/>
  <text x="54" y="370" font-size="11" font-weight="bold" fill="#1e40af">④ 看 SNI 是否带对</text>
  <text x="54" y="390" font-size="9.5" fill="#475569">多域名站点必须带 -servername</text>

  <rect x="340" y="348" width="704" height="56" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
  <text x="354" y="370" font-size="11" font-weight="bold" fill="#0f172a">命中：带与不带 -servername 拿到的是两张证书</text>
  <text x="354" y="391" font-size="10" fill="#475569">没带 SNI 时回到 ① 重看——拿默认虚拟主机的证书做比较没有任何意义</text>

  <rect x="40" y="436" width="260" height="56" fill="#fff7ed" stroke="#b45309" stroke-width="1.3" rx="6"/>
  <text x="54" y="458" font-size="11" font-weight="bold" fill="#b45309">⑤ 看协议 / 套件被拦了吗</text>
  <text x="54" y="478" font-size="9.5" fill="#78350f">-tls1_2 与 -tls1_3 各试一次</text>

  <rect x="340" y="436" width="704" height="56" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
  <text x="354" y="458" font-size="11" font-weight="bold" fill="#0f172a">命中：只在部分网络下握手失败</text>
  <text x="354" y="479" font-size="10" fill="#475569">中间透明代理 / 老 WAF / 负载均衡固件不支持 TLS 1.3；两个版本一读就分出是谁的问题</text>

  <rect x="40" y="524" width="260" height="56" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.3" rx="6"/>
  <text x="54" y="546" font-size="11" font-weight="bold" fill="#6d28d9">⑥ 最后才轮到这三样</text>
  <text x="54" y="566" font-size="9.5" fill="#5b21b6">算法、证书固定、客户端信任库</text>

  <rect x="340" y="524" width="704" height="56" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
  <text x="354" y="546" font-size="11" font-weight="bold" fill="#0f172a">命中：浏览器能开、代码不能连</text>
  <text x="354" y="567" font-size="10" fill="#475569">代码信任库与系统不同（JVM cacerts、镜像 CA 包）、代理环境变量没走对、客户端显式关闭了校验</text>

  <text x="40" y="606" font-size="10" fill="#64748b">口诀：①~④ 全程只看证书本身，⑤ 才开始看传输协商，⑥ 才怀疑客户端——反过来查多半白忙。</text>
</svg>
