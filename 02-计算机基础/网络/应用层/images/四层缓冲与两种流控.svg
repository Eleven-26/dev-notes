<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">数据不会消失，只会堆在某一层：四层缓冲与两种控法</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#475569">任何一层没有上限，就是一次内存泄漏；跨网络的协议必须显式信用制</text>

  <!-- 四层 -->
  <rect x="24" y="82" width="952" height="208" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="106" font-size="14" font-weight="bold" fill="#334155">数据堆在哪四层</text>
  <text x="44" y="124" font-size="10.5" fill="#64748b">从左到右是数据流向；第三、四层在接收端，发送方看不见</text>

  <rect x="40" y="136" width="200" height="136" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="140" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">发送端应用队列</text>
  <text x="140" y="178" text-anchor="middle" font-size="10" fill="#334155">业务塞进来还没写的帧</text>
  <text x="140" y="200" text-anchor="middle" font-size="10" fill="#991b1b">满了：进程内存涨 → OOM</text>
  <text x="140" y="222" text-anchor="middle" font-size="10" fill="#166534">可控：代码层自己排队</text>
  <text x="140" y="248" text-anchor="middle" font-size="10" fill="#64748b">自研最常漏的就是这里</text>

  <path d="M240,204 L262,204" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="270" y="136" width="200" height="136" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="370" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">内核 send buffer</text>
  <text x="370" y="178" text-anchor="middle" font-size="10" fill="#334155">已写但未被确认的字节</text>
  <text x="370" y="200" text-anchor="middle" font-size="10" fill="#991b1b">满了：Write 阻塞或 EAGAIN</text>
  <text x="370" y="222" text-anchor="middle" font-size="10" fill="#166534">可控：SO_SNDBUF + 非阻塞</text>
  <text x="370" y="248" text-anchor="middle" font-size="10" fill="#64748b">跨网络时它先替你「吃掉」</text>

  <path d="M470,204 L492,204" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="500" y="136" width="200" height="136" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="600" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">内核 recv buffer</text>
  <text x="600" y="178" text-anchor="middle" font-size="10" fill="#334155">收到但应用还没读的字节</text>
  <text x="600" y="200" text-anchor="middle" font-size="10" fill="#991b1b">满了：对端窗口变 0</text>
  <text x="600" y="222" text-anchor="middle" font-size="10" fill="#7c2d12">不可控：只能靠窗口协商</text>
  <text x="600" y="248" text-anchor="middle" font-size="10" fill="#64748b">这是发送方唯一看得见的信号</text>

  <path d="M700,204 L722,204" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="730" y="136" width="200" height="136" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="830" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">接收端应用队列</text>
  <text x="830" y="178" text-anchor="middle" font-size="10" fill="#334155">已读出来还没处理的帧</text>
  <text x="830" y="200" text-anchor="middle" font-size="10" fill="#991b1b">满了：进程内存涨 → OOM</text>
  <text x="830" y="222" text-anchor="middle" font-size="10" fill="#166534">可控：credit 信用额度</text>
  <text x="830" y="248" text-anchor="middle" font-size="10" fill="#64748b">协程池有界、缓冲无界就堆这里</text>

  <!-- 两种控法 -->
  <rect x="24" y="306" width="466" height="204" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="44" y="330" font-size="13" font-weight="bold" fill="#1e3a8a">控法一：信用制（跨网络必须用）</text>

  <rect x="48" y="346" width="130" height="50" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="113" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">发送方</text>
  <text x="113" y="384" text-anchor="middle" font-size="10" fill="#64748b">只发额度内的量</text>

  <rect x="336" y="346" width="130" height="50" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="401" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">接收方</text>
  <text x="401" y="384" text-anchor="middle" font-size="10" fill="#64748b">按处理能力放额度</text>

  <path d="M178,360 L330,360" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrB)"/>
  <text x="254" y="354" text-anchor="middle" font-size="10" fill="#1e3a8a">数据帧（消耗额度）</text>

  <path d="M330,386 L178,386" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="254" y="400" text-anchor="middle" font-size="10" fill="#166534">credit（还能收几条 / 几字节）</text>

  <text x="48" y="424" font-size="10" fill="#1e3a8a">优点：端到端精确，慢的是接收方也压得住发送方</text>
  <text x="48" y="440" font-size="10" fill="#64748b">代价：多一类控制帧，要实现窗口记账</text>
  <text x="48" y="462" font-size="10" fill="#64748b">现成例子：AMQP link credit、HTTP/2 的两级窗口、QUIC</text>
  <text x="48" y="484" font-size="10" fill="#1e3a8a">参数：窗口至少一个 BDP；剩 30% 补水，不要每帧都发</text>

  <rect x="510" y="306" width="466" height="204" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="530" y="330" font-size="13" font-weight="bold" fill="#334155">控法二：隐式背压（只在进程内够用）</text>

  <rect x="534" y="346" width="110" height="46" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="589" y="374" text-anchor="middle" font-size="11" fill="#334155">上游 A</text>
  <rect x="676" y="346" width="110" height="46" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="731" y="374" text-anchor="middle" font-size="11" fill="#334155">下游 B</text>
  <path d="M644,369 L670,369" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="657" y="360" text-anchor="middle" font-size="9" fill="#166534">阻塞</text>
  <text x="806" y="366" font-size="10" fill="#166534">同进程：写不进去就阻塞</text>
  <text x="806" y="382" font-size="10" fill="#166534">上游自然慢下来，有效</text>

  <rect x="534" y="404" width="252" height="46" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="660" y="424" text-anchor="middle" font-size="10" fill="#991b1b">跨网络：Write 先成功，之后才慢慢堵</text>
  <text x="660" y="440" text-anchor="middle" font-size="10" fill="#991b1b">堵点在对端，你这边看不见</text>

  <text x="534" y="472" font-size="10" fill="#64748b">把「channel 满了就阻塞」当成跨网络背压，是常见误判</text>
  <text x="534" y="492" font-size="10" fill="#64748b">背压保护内存与队列；限流保护服务端 QPS，两者都要有</text>

  <!-- 小结 -->
  <rect x="24" y="528" width="952" height="56" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="44" y="550" font-size="12" fill="#78350f">要点：跨网络的协议必须显式信用制；进程内 pipeline 用阻塞背压就够。</text>
  <text x="44" y="570" font-size="10.5" fill="#78350f">拥塞时丢控制类（Typing / Presence），保 ACK 与心跳；数据类与命令类只能拒绝新请求，绝不静默丢</text>
</svg>
