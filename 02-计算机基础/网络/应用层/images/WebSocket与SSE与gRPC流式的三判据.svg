<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">三种服务端推送手段，判据只有三条</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">要不要双向、能不能穿过中间设备、浏览器是否原生支持</text>
  <defs>
    <marker id="b2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="40" y="88" width="180" height="48" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="118" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="bold">对比项</text>
  <rect x="228" y="88" width="244" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="350" y="118" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="bold">WebSocket</text>
  <rect x="480" y="88" width="244" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="602" y="118" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="bold">SSE</text>
  <rect x="732" y="88" width="228" height="48" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="846" y="118" font-size="12.5" fill="#5b21b6" text-anchor="middle" font-weight="bold">gRPC 流式</text>
  <rect x="40" y="144" width="180" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="58" y="178" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">方向</text>
  <rect x="228" y="144" width="244" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="246" y="178" font-size="11" fill="#334155" text-anchor="start">双向</text>
  <rect x="480" y="144" width="244" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="498" y="178" font-size="11" fill="#334155" text-anchor="start">单向（服务端 → 客户端）</text>
  <rect x="732" y="144" width="228" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="750" y="178" font-size="11" fill="#334155" text-anchor="start">双向</text>
  <rect x="40" y="206" width="180" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="58" y="240" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">协议底座</text>
  <rect x="228" y="206" width="244" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="246" y="240" font-size="11" fill="#334155" text-anchor="start">Upgrade 后脱离 HTTP 语义</text>
  <rect x="480" y="206" width="244" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="498" y="240" font-size="11" fill="#334155" text-anchor="start">就是一条 HTTP 响应</text>
  <rect x="732" y="206" width="228" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="750" y="240" font-size="11" fill="#334155" text-anchor="start">HTTP/2 的流</text>
  <rect x="40" y="268" width="180" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="58" y="302" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">浏览器原生</text>
  <rect x="228" y="268" width="244" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="246" y="302" font-size="11" fill="#334155" text-anchor="start">WebSocket 接口</text>
  <rect x="480" y="268" width="244" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="498" y="302" font-size="11" fill="#334155" text-anchor="start">EventSource，自带重连</text>
  <rect x="732" y="268" width="228" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="750" y="302" font-size="11" fill="#334155" text-anchor="start">需要 grpc-web + 网关</text>
  <rect x="40" y="330" width="180" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="58" y="364" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">穿透性</text>
  <rect x="228" y="330" width="244" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="246" y="364" font-size="11" fill="#334155" text-anchor="start">需中间设备认 Upgrade</text>
  <rect x="480" y="330" width="244" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="498" y="364" font-size="11" fill="#334155" text-anchor="start">最好：对代理就是个慢响应</text>
  <rect x="732" y="330" width="228" height="56" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="750" y="364" font-size="11" fill="#334155" text-anchor="start">最差：要 h2 + 代理支持</text>
  <text x="44" y="430" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">三条判据落到选择上</text>
  <rect x="40" y="448" width="300" height="92" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="58" y="476" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">① 只有服务端推</text>
  <text x="58" y="500" font-size="11.5" fill="#334155" text-anchor="start">客户端不常上行</text>
  <text x="58" y="526" font-size="12.5" fill="#166534" text-anchor="start" font-weight="bold">→ SSE</text>
  <rect x="350" y="448" width="300" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="368" y="476" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">② 真双向、要低延迟</text>
  <text x="368" y="500" font-size="11.5" fill="#334155" text-anchor="start">浏览器原生可用</text>
  <text x="368" y="526" font-size="12.5" fill="#1e3a8a" text-anchor="start" font-weight="bold">→ WebSocket</text>
  <rect x="660" y="448" width="300" height="92" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="678" y="476" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">③ 后端服务之间</text>
  <text x="678" y="500" font-size="11.5" fill="#334155" text-anchor="start">且已有 gRPC 生态</text>
  <text x="678" y="526" font-size="12.5" fill="#5b21b6" text-anchor="start" font-weight="bold">→ gRPC 流式</text>
  <text x="44" y="578" font-size="11.5" fill="#64748B" text-anchor="start">⚠ 三者都不是「谁更新」的问题：SSE 的穿透性最好，恰恰因为它对中间设备来说只是一条没发完的普通响应</text>
  <text x="44" y="602" font-size="11.5" fill="#64748B" text-anchor="start">握手细节、HTTP/1.1 的 6 连接上限、心跳与 Last-Event-ID 续传、代理缓冲等坑见 WebSocket与SSE.md</text>
</svg>
