<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">序列号与确认号的往返演算（含丢包缺口）</text>
  <text x="500" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">通用公式：确认号 = 收到段的 seq + SEG.LEN；「seq + 数据长度 + 1」只在带 SYN 或 FIN 的段上成立</text>

  <rect x="150" y="72" width="200" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="250" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">发送方</text>
  <rect x="650" y="72" width="200" height="44" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="750" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">接收方</text>

  <line x1="250" y1="116" x2="250" y2="356" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="750" y1="116" x2="750" y2="356" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>

  <line x1="250" y1="152" x2="744" y2="152" stroke="#2563eb" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="500" y="141" text-anchor="middle" font-size="13" fill="#1e3a8a">seq = 100，数据 50 字节 → 覆盖字节 100 ~ 149，SEG.LEN = 50</text>

  <line x1="750" y1="222" x2="256" y2="222" stroke="#16a34a" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="500" y="211" text-anchor="middle" font-size="13" fill="#14532d">正常：ack = 150（= 100 + 50），150 之前全收到，请从 150 发</text>

  <line x1="750" y1="300" x2="256" y2="300" stroke="#dc2626" stroke-width="1.6" marker-end="url(#r)"/>
  <text x="500" y="289" text-anchor="middle" font-size="13" fill="#991b1b">丢包：ack = 130 → 130 ~ 149 这 20 字节没收到 → 从 130 重传</text>
  <text x="760" y="322" text-anchor="start" font-size="11" fill="#991b1b">其前部分不用管</text>

  <rect x="55" y="340" width="890" height="72" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="73" y="366" font-size="12.5" fill="#0f172a">谁占序号：SEG.LEN = 数据长度 + SYN占位 + FIN占位；纯 ACK 段 SEG.LEN = 0，不消耗序号空间。</text>
  <text x="73" y="392" font-size="12.5" fill="#0f172a">默认是累计确认（还会延迟、捎带），并非每段回一个 ACK；失序时重复发同一 ack，连收 3 个触发快速重传。</text>

  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
