<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img">
<title>TCP 三次握手时序图</title>
<desc>客户端与服务端的三次握手：SYN、SYN+ACK、ACK，以及两端在各步骤后的连接状态与已知信息。</desc>
<rect x="0" y="0" width="680" height="360" fill="#1e1e1e"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="30" width="200" height="56" rx="12" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="140" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#B5D4F4">客户端</text>
<text x="140" y="70" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#85B7EB">主动打开 · SYN_SENT</text>
<rect x="440" y="30" width="200" height="56" rx="12" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/>
<text x="540" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#FAC775">服务端</text>
<text x="540" y="70" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#EF9F27">被动打开 · LISTEN</text>
<line x1="140" y1="86" x2="140" y2="262" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="540" y1="86" x2="540" y2="262" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="140" y1="130" x2="534" y2="130" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="118" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#B5D4F4">1. SYN, seq = x</text>
<text x="130" y="148" text-anchor="end" dominant-baseline="central" font-size="12" fill="#888780">SYN_SENT</text>
<text x="550" y="148" text-anchor="start" dominant-baseline="central" font-size="12" fill="#EF9F27">SYN_RCVD</text>
<line x1="540" y1="180" x2="146" y2="180" stroke="#EF9F27" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="168" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FAC775">2. SYN + ACK, seq = y, ack = x + 1</text>
<text x="130" y="198" text-anchor="end" dominant-baseline="central" font-size="12" fill="#85B7EB">ESTABLISHED</text>
<line x1="140" y1="230" x2="534" y2="230" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#B5D4F4">3. ACK, seq = x + 1, ack = y + 1</text>
<text x="550" y="248" text-anchor="start" dominant-baseline="central" font-size="12" fill="#EF9F27">ESTABLISHED</text>
<rect x="40" y="272" width="600" height="68" rx="12" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="56" y="294" dominant-baseline="central" font-size="12" fill="#D3D1C7">② 之后：只有客户端确认了双向 —— 服务端还不知道自己发的报文「客户端能不能收」</text>
<text x="56" y="320" dominant-baseline="central" font-size="12" fill="#D3D1C7">③ 之后：服务端才确认「客户端能收」，双向都被证实，连接建立</text>
</svg>
