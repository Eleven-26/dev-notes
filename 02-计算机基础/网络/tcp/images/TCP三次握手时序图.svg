<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <title>TCP 三次握手时序图</title>
  <desc>客户端与服务端的三次握手：SYN、SYN+ACK、ACK，以及两端在各步骤后的连接状态与已知信息。</desc>
  <defs>
    <marker id="m-b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="m-a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b45309"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">TCP 三次握手时序图</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">客户端与服务端的三次握手：SYN、SYN + ACK、ACK，以及两端在各步骤后的连接状态</text>

  <rect x="150" y="80" width="200" height="48" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="250" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">客户端</text>
  <text x="250" y="118" text-anchor="middle" font-size="12" fill="#1e3a8a">主动打开 · SYN_SENT</text>
  <rect x="650" y="80" width="200" height="48" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="750" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">服务端</text>
  <text x="750" y="118" text-anchor="middle" font-size="12" fill="#854d0e">被动打开 · LISTEN</text>

  <line x1="250" y1="128" x2="250" y2="300" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="750" y1="128" x2="750" y2="300" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>

  <line x1="250" y1="152" x2="744" y2="152" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m-b)"/>
  <text x="500" y="140" text-anchor="middle" font-size="14" fill="#1e3a8a">1. SYN, seq = x</text>
  <text x="240" y="172" text-anchor="end" font-size="12.5" fill="#1e3a8a">SYN_SENT</text>
  <text x="760" y="172" text-anchor="start" font-size="12.5" fill="#854d0e">SYN_RCVD</text>

  <line x1="750" y1="212" x2="256" y2="212" stroke="#b45309" stroke-width="1.6" marker-end="url(#m-a)"/>
  <text x="500" y="200" text-anchor="middle" font-size="14" fill="#854d0e">2. SYN + ACK, seq = y, ack = x + 1</text>
  <text x="240" y="232" text-anchor="end" font-size="12.5" fill="#14532d">ESTABLISHED</text>

  <line x1="250" y1="272" x2="744" y2="272" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m-b)"/>
  <text x="500" y="260" text-anchor="middle" font-size="14" fill="#1e3a8a">3. ACK, seq = x + 1, ack = y + 1</text>
  <text x="760" y="292" text-anchor="start" font-size="12.5" fill="#14532d">ESTABLISHED</text>

  <rect x="40" y="316" width="920" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="64" y="344" font-size="13" fill="#0f172a">② 之后：只有客户端确认了双向 —— 服务端还不知道自己发的报文「客户端能不能收」</text>
  <text x="64" y="380" font-size="13" fill="#0f172a">③ 之后：服务端才确认「客户端能收」，双向都被证实，连接建立</text>
</svg>
