<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <defs>
    <marker id="hs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">两次握手 vs 三次握手：第三次 ACK 补上了哪一块信息</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">第 3 个报文不是重复确认，而是把「服务端能发」的确认带回给服务端</text>

  <rect x="40" y="86" width="440" height="436" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="260" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">两次握手：省掉第三次 ACK</text>

  <rect x="70" y="140" width="150" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="145" y="168" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">客户端</text>
  <text x="145" y="190" text-anchor="middle" font-size="10.5" fill="#1e3a8a">seq = x</text>

  <rect x="300" y="140" width="150" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="375" y="165" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">服务端</text>
  <text x="375" y="184" text-anchor="middle" font-size="10.5" fill="#166534">seq = y</text>
  <text x="375" y="199" text-anchor="middle" font-size="10.5" fill="#166534">ack = x + 1</text>

  <path d="M 220 160 L 300 160" stroke="#334155" stroke-width="1.5" marker-end="url(#hs)"/>
  <text x="260" y="153" text-anchor="middle" font-size="10" fill="#334155">SYN</text>
  <path d="M 300 194 L 220 194" stroke="#334155" stroke-width="1.5" marker-end="url(#hs)"/>
  <text x="260" y="211" text-anchor="middle" font-size="10" fill="#334155">SYN + ACK</text>

  <text x="70" y="248" font-size="12.5" font-weight="bold" fill="#1e40af">客户端已知</text>
  <text x="70" y="272" font-size="11.5" fill="#334155">✓ 我能发（自己的 SYN 被 ACK）</text>
  <text x="70" y="294" font-size="11.5" fill="#334155">✓ 我能收（收到了对方的 SYN）</text>
  <text x="70" y="316" font-size="11.5" fill="#334155">✓ 对方能发、对方能收</text>
  <text x="70" y="342" font-size="11.5" font-weight="bold" fill="#166534">→ 四个方向全知道</text>

  <text x="70" y="386" font-size="12.5" font-weight="bold" fill="#166534">服务端已知</text>
  <text x="70" y="410" font-size="11.5" fill="#334155">✓ 客户端能发、我能收</text>
  <text x="70" y="432" font-size="11.5" fill="#b91c1c">✗ 我发的能不能到对方 —— 未知</text>
  <text x="70" y="458" font-size="11.5" font-weight="bold" fill="#b91c1c">→ 缺的正是第三次 ACK</text>
  <text x="70" y="492" font-size="11" fill="#64748b">序号协商同样没有闭环：客户端还没确认服务端的 SYN</text>

  <rect x="520" y="86" width="440" height="436" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="740" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">三次握手：补上第三次 ACK</text>

  <rect x="550" y="140" width="150" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="625" y="168" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">客户端</text>
  <text x="625" y="190" text-anchor="middle" font-size="10.5" fill="#1e3a8a">seq = x</text>

  <rect x="780" y="140" width="150" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="855" y="165" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">服务端</text>
  <text x="855" y="184" text-anchor="middle" font-size="10.5" fill="#166534">seq = y</text>
  <text x="855" y="199" text-anchor="middle" font-size="10.5" fill="#166534">ack = x + 1</text>

  <path d="M 700 154 L 780 154" stroke="#334155" stroke-width="1.5" marker-end="url(#hs)"/>
  <text x="740" y="147" text-anchor="middle" font-size="10" fill="#334155">SYN</text>
  <path d="M 780 178 L 700 178" stroke="#334155" stroke-width="1.5" marker-end="url(#hs)"/>
  <text x="740" y="173" text-anchor="middle" font-size="9.5" fill="#334155">SYN + ACK</text>
  <path d="M 700 202 L 780 202" stroke="#334155" stroke-width="1.5" marker-end="url(#hs)"/>
  <text x="740" y="219" text-anchor="middle" font-size="9.5" fill="#334155">ACK</text>

  <text x="550" y="248" font-size="12.5" font-weight="bold" fill="#1e40af">客户端已知</text>
  <text x="550" y="272" font-size="11.5" fill="#334155">✓ 我能发、我能收</text>
  <text x="550" y="294" font-size="11.5" fill="#334155">✓ 对方能发、对方能收</text>
  <text x="550" y="320" font-size="11.5" font-weight="bold" fill="#166534">→ 收到 SYN + ACK 就已知道</text>

  <text x="550" y="386" font-size="12.5" font-weight="bold" fill="#166534">服务端已知</text>
  <text x="550" y="410" font-size="11.5" fill="#334155">✓ 客户端能发、我能收</text>
  <text x="550" y="432" font-size="11.5" fill="#166534">✓ 客户端能收（SYN + ACK 被 ACK）</text>
  <text x="550" y="458" font-size="11.5" font-weight="bold" fill="#166534">→ 双向都被证实</text>
  <text x="550" y="492" font-size="11" fill="#64748b">第三次 ACK 同时把服务端初始序号的确认送回去</text>

  <rect x="40" y="542" width="920" height="54" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="56" y="566" font-size="12.5" font-weight="bold" fill="#1e40af">一句话：第二次握手让「客户端」确认双向，第三次握手才让「服务端」确认双向。</text>
  <text x="56" y="587" font-size="12" fill="#1e3a8a">两个目的各由哪一步达成，正文的「已知信息」表逐行拆开了。</text>
</svg>
