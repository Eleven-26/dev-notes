<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arr7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="bold" fill="#0f172a">协议演进的四种变更：谁能不升版本，谁必须升</text>
  <text x="24" y="52" font-size="12" fill="#475569">前三行是 5.1 的三处版本号，第四行是 5.3 的老客户端反应；只有最右一列才动到帧头 version。</text>

  <rect x="184" y="70" width="180" height="36" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <rect x="384" y="70" width="180" height="36" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <rect x="584" y="70" width="180" height="36" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <rect x="784" y="70" width="180" height="36" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>

  <rect x="184" y="118" width="180" height="38" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="384" y="118" width="180" height="38" rx="5" fill="#dcfce7" stroke="#166534" stroke-width="1"/>
  <rect x="584" y="118" width="180" height="38" rx="5" fill="#dcfce7" stroke="#166534" stroke-width="1"/>
  <rect x="784" y="118" width="180" height="38" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
  <rect x="184" y="160" width="180" height="38" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="384" y="160" width="180" height="38" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="584" y="160" width="180" height="38" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="784" y="160" width="180" height="38" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
  <rect x="184" y="202" width="180" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="384" y="202" width="180" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="584" y="202" width="180" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="784" y="202" width="180" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="184" y="244" width="180" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="384" y="244" width="180" height="38" rx="5" fill="#dcfce7" stroke="#166534" stroke-width="1"/>
  <rect x="584" y="244" width="180" height="38" rx="5" fill="#ffedd5" stroke="#b45309" stroke-width="1"/>
  <rect x="784" y="244" width="180" height="38" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>

  <text x="274" y="93" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">① 发布 v1</text>
  <text x="474" y="93" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">② 加字段（同版本）</text>
  <text x="674" y="93" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">③ 加新类型与能力位</text>
  <text x="874" y="93" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">④ 改语义（禁止）</text>

  <text x="24" y="142" font-size="11.5" fill="#0f172a">帧头 version</text>
  <text x="24" y="184" font-size="11.5" fill="#0f172a">握手协商版本</text>
  <text x="24" y="226" font-size="11.5" fill="#0f172a">协议文档版本</text>
  <text x="24" y="268" font-size="11.5" fill="#0f172a">老客户端会怎样</text>

  <text x="274" y="141" font-size="10.5" fill="#1e40af" text-anchor="middle">v1（发布基线）</text>
  <text x="474" y="141" font-size="10.5" fill="#14532d" text-anchor="middle">不升：同版本加字段</text>
  <text x="674" y="141" font-size="10.5" fill="#14532d" text-anchor="middle">不升：靠能力位</text>
  <text x="874" y="141" font-size="10.5" fill="#7f1d1d" text-anchor="middle">升到 v2：不兼容变更</text>

  <text x="274" y="183" font-size="10.5" fill="#1e40af" text-anchor="middle">每次连接建立时定</text>
  <text x="474" y="183" font-size="10.5" fill="#1e40af" text-anchor="middle">仍协商为 v1</text>
  <text x="674" y="183" font-size="10.5" fill="#1e40af" text-anchor="middle">按交集协商特性</text>
  <text x="874" y="183" font-size="10.5" fill="#7f1d1d" text-anchor="middle">新值，与老端并存</text>

  <text x="274" y="225" font-size="10.5" fill="#475569" text-anchor="middle">随发布递增</text>
  <text x="474" y="225" font-size="10.5" fill="#475569" text-anchor="middle">随发布递增</text>
  <text x="674" y="225" font-size="10.5" fill="#475569" text-anchor="middle">随发布递增</text>
  <text x="874" y="225" font-size="10.5" fill="#475569" text-anchor="middle">随发布递增</text>

  <text x="274" y="267" font-size="10.5" fill="#475569" text-anchor="middle">基线行为</text>
  <text x="474" y="267" font-size="10.5" fill="#14532d" text-anchor="middle">忽略未知字段，读到默认值</text>
  <text x="674" y="267" font-size="10.5" fill="#78350f" text-anchor="middle">忽略并继续（必须做到）</text>
  <text x="874" y="267" font-size="10.5" fill="#7f1d1d" text-anchor="middle">老数据被解错</text>

  <line x1="366" y1="88" x2="382" y2="88" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr7)"/>
  <line x1="566" y1="88" x2="582" y2="88" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr7)"/>
  <line x1="766" y1="88" x2="782" y2="88" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr7)"/>

  <text x="24" y="308" font-size="11.5" font-weight="bold" fill="#0f172a">原则：能加字段就不升版本——新增可选字段用「同版本加字段」即可兼容，只有语义不兼容（如改了 length 的含义）才升 version。</text>
  <text x="24" y="332" font-size="11.5" fill="#b91c1c">前提：② ③ 两列能成立，全靠老客户端「遇到未知 type 忽略并继续」；若老端遇到未知就断开，新功能上线就等于老端集体掉线。</text>
  <text x="24" y="356" font-size="11" fill="#475569">协商里还带：capabilities 用位图，每一位是一个可选特性；心跳间隔由服务端在 HelloAck 里下发，不让客户端自带常量。</text>
  <text x="24" y="380" font-size="11" fill="#64748b">字段语义变更不允许：要新增字段代替，复用字段号或改语义会让老数据被解错。</text>
  <text x="24" y="408" font-size="11" fill="#64748b">注意：本篇未做实测，本图为演进关系示意，不含真实版本号取值、灰度比例或兼容矩阵读数。</text>
</svg>
