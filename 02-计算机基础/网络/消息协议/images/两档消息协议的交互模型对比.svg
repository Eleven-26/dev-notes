<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="30" y="40" font-size="20" font-weight="bold" fill="#0f172a">两档协议、四种交互模型：服务端能不能主动开口，决定消费端是等推送还是轮询拉</text>
  <text x="30" y="64" font-size="13" fill="#64748b">上两行是标准协议（规范公开、可换 broker），下两行是 broker 原生协议（线格式与自己的存储模型绑定）</text>

  <line x1="700" y1="52" x2="740" y2="52" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="748" y="56" font-size="11" fill="#475569">客户端 → 服务端</text>
  <line x1="860" y1="52" x2="900" y2="52" stroke="#b45309" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="908" y="56" font-size="11" fill="#475569">服务端 → 客户端</text>

  <!-- ① 双向帧流 -->
  <rect x="20" y="84" width="960" height="112" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="20" y="84" width="6" height="112" fill="#2563eb"/>
  <text x="40" y="112" font-size="14" font-weight="bold" fill="#0f172a">① 双向帧流</text>
  <text x="40" y="134" font-size="11" fill="#475569">AMQP·MQTT·STOMP·XMPP</text>
  <text x="40" y="156" font-size="11" fill="#475569">服务端随时可推</text>
  <text x="40" y="178" font-size="11" fill="#475569">会话号在帧头</text>
  <rect x="200" y="112" width="110" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="255" y="137" font-size="13" fill="#1e3a8a" text-anchor="middle">客户端</text>
  <text x="255" y="155" font-size="10" fill="#1e3a8a" text-anchor="middle">生产者 / 消费者</text>
  <rect x="800" y="112" width="110" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="855" y="137" font-size="13" fill="#14532d" text-anchor="middle">Broker</text>
  <text x="855" y="155" font-size="10" fill="#14532d" text-anchor="middle">按订阅表转发</text>
  <line x1="314" y1="128" x2="794" y2="128" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="554" y="120" font-size="12" fill="#1e3a8a" text-anchor="middle">PUBLISH / 请求帧：客户端先发</text>
  <line x1="794" y1="160" x2="314" y2="160" stroke="#b45309" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="554" y="180" font-size="12" fill="#92400e" text-anchor="middle">basic.deliver / PUBLISH：服务端主动推给订阅者</text>

  <!-- ② 严格请求-响应 -->
  <rect x="20" y="206" width="960" height="112" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="20" y="206" width="6" height="112" fill="#b45309"/>
  <text x="40" y="234" font-size="14" font-weight="bold" fill="#0f172a">② 严格请求-响应</text>
  <text x="40" y="256" font-size="11" fill="#475569">Kafka·RocketMQ</text>
  <text x="40" y="278" font-size="11" fill="#475569">消息靠长轮询拉</text>
  <text x="40" y="300" font-size="11" fill="#475569">请求号配对</text>
  <rect x="200" y="234" width="110" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="255" y="259" font-size="13" fill="#1e3a8a" text-anchor="middle">客户端</text>
  <text x="255" y="277" font-size="10" fill="#1e3a8a" text-anchor="middle">流水线发多个请求</text>
  <rect x="800" y="234" width="110" height="56" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="855" y="259" font-size="13" fill="#78350f" text-anchor="middle">Broker</text>
  <text x="855" y="277" font-size="10" fill="#78350f" text-anchor="middle">只回不推</text>
  <line x1="314" y1="250" x2="794" y2="250" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="554" y="242" font-size="12" fill="#1e3a8a" text-anchor="middle">req(correlation_id = N)</text>
  <line x1="794" y1="282" x2="314" y2="282" stroke="#b45309" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="554" y="302" font-size="12" fill="#92400e" text-anchor="middle">resp(correlation_id = N)：原样回填请求号，对上这一次请求</text>

  <!-- ③ 命令 + 回执 -->
  <rect x="20" y="328" width="960" height="112" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="20" y="328" width="6" height="112" fill="#7c3aed"/>
  <text x="40" y="356" font-size="14" font-weight="bold" fill="#0f172a">③ 命令 + 回执</text>
  <text x="40" y="378" font-size="11" fill="#475569">Pulsar</text>
  <text x="40" y="400" font-size="11" fill="#475569">命令流，类型靠 oneof</text>
  <text x="40" y="422" font-size="11" fill="#475569">请求号配对</text>
  <rect x="200" y="356" width="110" height="56" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="255" y="381" font-size="13" fill="#4c1d95" text-anchor="middle">客户端</text>
  <text x="255" y="399" font-size="10" fill="#4c1d95" text-anchor="middle">producer / consumer</text>
  <rect x="800" y="356" width="110" height="56" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="855" y="381" font-size="13" fill="#4c1d95" text-anchor="middle">Broker</text>
  <text x="855" y="399" font-size="10" fill="#4c1d95" text-anchor="middle">按实体 id 找连接</text>
  <line x1="314" y1="372" x2="794" y2="372" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="554" y="364" font-size="12" fill="#1e3a8a" text-anchor="middle">SEND(producer_id, request_id)</text>
  <line x1="794" y1="404" x2="314" y2="404" stroke="#b45309" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="554" y="424" font-size="12" fill="#92400e" text-anchor="middle">SEND_RECEIPT(request_id) 或 SEND_ERROR</text>

  <!-- ④ 文本行流 -->
  <rect x="20" y="450" width="960" height="112" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="20" y="450" width="6" height="112" fill="#0f766e"/>
  <text x="40" y="478" font-size="14" font-weight="bold" fill="#0f172a">④ 文本行流</text>
  <text x="40" y="500" font-size="11" fill="#475569">NATS（Core）</text>
  <text x="40" y="522" font-size="11" fill="#475569">服务端用 MSG 推</text>
  <text x="40" y="544" font-size="11" fill="#475569">订阅号 sid</text>
  <rect x="200" y="478" width="110" height="56" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="255" y="503" font-size="13" fill="#134e4a" text-anchor="middle">客户端</text>
  <text x="255" y="521" font-size="10" fill="#134e4a" text-anchor="middle">PUB / SUB</text>
  <rect x="800" y="478" width="110" height="56" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="855" y="503" font-size="13" fill="#134e4a" text-anchor="middle">nats-server</text>
  <text x="855" y="521" font-size="10" fill="#134e4a" text-anchor="middle">按 subject 匹配</text>
  <line x1="314" y1="494" x2="794" y2="494" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="554" y="486" font-size="12" fill="#1e3a8a" text-anchor="middle">PUB demo.orders 11（11 是 payload 字节数）</text>
  <line x1="794" y1="526" x2="314" y2="526" stroke="#b45309" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="554" y="546" font-size="12" fill="#92400e" text-anchor="middle">MSG demo.orders 1 11：sid 1 对上刚才的订阅</text>

  <!-- 结论 -->
  <rect x="20" y="580" width="310" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="40" y="608" font-size="13" font-weight="bold" fill="#14532d">能主动推 → 消费端不用轮询</text>
  <text x="40" y="632" font-size="11" fill="#166534">MQTT 订阅者、XMPP 客户端是被推的一方</text>
  <rect x="345" y="580" width="310" height="76" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="365" y="608" font-size="13" font-weight="bold" fill="#78350f">只能一问一答 → 必须长轮询</text>
  <text x="365" y="632" font-size="11" fill="#92400e">Kafka 的 fetch 带 max_wait_ms 才不空转</text>
  <rect x="670" y="580" width="310" height="76" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="690" y="608" font-size="13" font-weight="bold" fill="#4c1d95">配对标识分三类</text>
  <text x="690" y="632" font-size="11" fill="#5b21b6">会话号 / 请求号 / 订阅号，职责不同</text>

  <text x="30" y="686" font-size="11" fill="#94a3b8">判据一句话：服务端能不能往这条连接上主动写 —— 决定消费端是等推送，还是自己轮询拉。</text>
</svg>
