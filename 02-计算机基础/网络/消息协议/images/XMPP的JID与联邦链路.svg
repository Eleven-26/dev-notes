<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
  <defs>
    <marker id="arw3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">XMPP 寻址：JID 三段，加上两台服务器之间的 S2S 联邦</text>
  <text x="500" y="58" text-anchor="middle" font-size="12" fill="#64748b">域名部分写在 JID 里，所以「发到别的服务器」是地址里带出来的，不用配置网关——这是它像 email 的那一面</text>

  <rect x="26" y="96" width="150" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="101" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">alice</text>
  <text x="101" y="142" text-anchor="middle" font-size="11" fill="#1e3a8a">@a.example.com</text>
  <text x="101" y="160" text-anchor="middle" font-size="11" fill="#1e3a8a">手机 / 桌面客户端</text>

  <line x1="180" y1="136" x2="238" y2="136" stroke="#475569" stroke-width="1.6" marker-end="url(#arw3)"/>
  <text x="208" y="126" text-anchor="middle" font-size="10.5" fill="#334155">C2S</text>

  <rect x="242" y="88" width="196" height="96" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="340" y="114" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4c1d95">服务器 A（a.example.com）</text>
  <text x="340" y="136" text-anchor="middle" font-size="11" fill="#4c1d95">一条长命的 XML 流</text>
  <text x="340" y="156" text-anchor="middle" font-size="11" fill="#4c1d95">TLS + SASL 后才算登录</text>
  <text x="340" y="174" text-anchor="middle" font-size="11" fill="#4c1d95">本地路由 + 转发到别的域</text>

  <line x1="442" y1="136" x2="556" y2="136" stroke="#475569" stroke-width="1.6" marker-end="url(#arw3)"/>
  <text x="499" y="126" text-anchor="middle" font-size="10.5" fill="#334155">S2S（联邦）</text>
  <text x="499" y="152" text-anchor="middle" font-size="10" fill="#64748b">DNS SRV 找对端</text>
  <text x="499" y="168" text-anchor="middle" font-size="10" fill="#64748b">再 TLS 与身份校验</text>

  <rect x="560" y="88" width="196" height="96" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="658" y="114" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4c1d95">服务器 B（b.example.com）</text>
  <text x="658" y="136" text-anchor="middle" font-size="11" fill="#4c1d95">不认识的域名就拒绝</text>
  <text x="658" y="156" text-anchor="middle" font-size="11" fill="#4c1d95">要到对端后按 JID 投递</text>
  <text x="658" y="174" text-anchor="middle" font-size="11" fill="#4c1d95">离线消息存在自己这</text>

  <line x1="760" y1="136" x2="818" y2="136" stroke="#475569" stroke-width="1.6" marker-end="url(#arw3)"/>
  <text x="789" y="126" text-anchor="middle" font-size="10.5" fill="#334155">C2S</text>

  <rect x="822" y="96" width="150" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="897" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">bob</text>
  <text x="897" y="142" text-anchor="middle" font-size="11" fill="#1e3a8a">@b.example.com</text>
  <text x="897" y="160" text-anchor="middle" font-size="11" fill="#1e3a8a">/phone（resource）</text>

  <rect x="26" y="222" width="946" height="94" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="42" y="246" font-size="12.5" font-weight="bold" fill="#334155">JID 三段：localpart@domain/resource</text>
  <text x="42" y="270" font-size="11.5" fill="#1e3a8a">bob</text>
  <text x="72" y="270" font-size="11.5" fill="#334155">= 账号（localpart），一个域里唯一</text>
  <text x="300" y="270" font-size="11.5" fill="#7c3aed">@b.example.com</text>
  <text x="404" y="270" font-size="11.5" fill="#334155">= 域（domain），决定消息交给哪台服务器</text>
  <text x="42" y="296" font-size="11.5" fill="#b45309">/phone</text>
  <text x="96" y="296" font-size="11.5" fill="#334155">= 资源（resource），同一账号的不同登录端；只给到 domain 的叫 bare JID（服务器会按优先级选一个端）</text>

  <text x="26" y="352" font-size="12.5" fill="#0f172a">要点：跨域投递是寻址的一部分，不需要额外网关或桥接——这是 XMPP 与 MQTT / STOMP 最根本的分野。</text>
  <text x="26" y="378" font-size="12.5" fill="#b91c1c">注意：联邦也意味着「你在跟一台不归你管的服务器对话」，所以身份校验（TLS + SASL / dialback）在这条链路上格外关键。</text>
  <text x="26" y="404" font-size="11" fill="#64748b">依据：RFC 6120 / 6121；本篇未做本机实测，联邦形态按规范陈述</text>
</svg>
