<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">MQTT 极简架构：所有客户端只连 Broker，按 Topic 匹配转发</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">物联网（IoT）的主战场协议：发布者与订阅者互不感知，Topic 无需预先创建</text>

  <rect x="60" y="145" width="200" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="160" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">发布者 Publisher</text>
  <text x="160" y="200" text-anchor="middle" font-size="11" fill="#1d4ed8">设备 / 服务</text>
  <text x="160" y="220" text-anchor="middle" font-size="11" fill="#1d4ed8">只发消息，不管谁收</text>

  <rect x="400" y="125" width="200" height="130" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="500" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Broker 代理服务器</text>
  <text x="500" y="185" text-anchor="middle" font-size="11" fill="#9a3412">唯一消息中枢</text>
  <text x="500" y="207" text-anchor="middle" font-size="11" fill="#9a3412">路由 / retain / 遗嘱</text>
  <text x="500" y="229" text-anchor="middle" font-size="11" fill="#9a3412">QoS 0/1/2 记账</text>

  <rect x="740" y="145" width="200" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="840" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">订阅者 Subscriber</text>
  <text x="840" y="200" text-anchor="middle" font-size="11" fill="#15803d">App / 服务</text>
  <text x="840" y="220" text-anchor="middle" font-size="11" fill="#15803d">只收消息，不管谁发</text>

  <line x1="260" y1="175" x2="396" y2="175" stroke="#2563eb" stroke-width="2"/>
  <polygon points="394,170 394,180 406,175" fill="#2563eb"/>
  <text x="330" y="160" text-anchor="middle" font-size="10.5" fill="#1e40af">PUBLISH + Topic</text>
  <text x="330" y="192" text-anchor="middle" font-size="10" fill="#64748B">dev/123/status</text>

  <line x1="600" y1="175" x2="736" y2="175" stroke="#2563eb" stroke-width="2"/>
  <polygon points="734,170 734,180 746,175" fill="#2563eb"/>
  <text x="670" y="160" text-anchor="middle" font-size="10.5" fill="#1e40af">按订阅匹配转发</text>
  <text x="670" y="192" text-anchor="middle" font-size="10" fill="#64748B">只推给订了的人</text>

  <line x1="740" y1="215" x2="604" y2="215" stroke="#16a34a" stroke-width="2"/>
  <polygon points="606,210 606,220 594,215" fill="#16a34a"/>
  <text x="670" y="233" text-anchor="middle" font-size="10.5" fill="#15803d">SUBSCRIBE 订阅主题</text>

  <text x="40" y="292" font-size="12.5" font-weight="bold" fill="#0f172a">三大标签</text>

  <rect x="40" y="302" width="290" height="88" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="185" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">极致轻量</text>
  <text x="185" y="350" text-anchor="middle" font-size="11" fill="#334155">固定头最小 2 字节，位段编码</text>
  <text x="185" y="370" text-anchor="middle" font-size="10.5" fill="#64748B">→ 第二、三节</text>

  <rect x="355" y="302" width="290" height="88" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="500" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">发布 / 订阅模式</text>
  <text x="500" y="350" text-anchor="middle" font-size="11" fill="#334155">收发双方经 Broker 与 Topic 解耦</text>
  <text x="500" y="370" text-anchor="middle" font-size="10.5" fill="#64748B">→ 本节</text>

  <rect x="670" y="302" width="290" height="88" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="815" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">三种交付质量</text>
  <text x="815" y="350" text-anchor="middle" font-size="11" fill="#334155">QoS 0 / 1 / 2 三条确认链</text>
  <text x="815" y="370" text-anchor="middle" font-size="10.5" fill="#64748B">→ 第五节</text>

  <text x="40" y="428" font-size="12" fill="#0f172a">要点：Broker 是唯一消息中枢——发送方不必知道谁在线，接收方不必知道谁在发；代价是所有消息多走一跳。</text>
  <text x="40" y="454" font-size="12" fill="#0f172a">QoS 确认链、保留消息、遗嘱、通配订阅、设备影子，都是挂在「Broker 按 Topic 路由」这一个机制上的扩展。</text>

  <text x="40" y="484" font-size="11.5" fill="#64748B">依据：OASIS MQTT 3.1.1 / 5.0 规范；本篇未做本机抓包实测，架构形态按规范陈述</text>
</svg>
