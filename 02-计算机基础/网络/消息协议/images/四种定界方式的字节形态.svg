<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">四种定界方式：一条消息到哪结束</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">TCP 只给字节流，不给边界——所以每个消息协议的第一件事都是把边界找出来</text>

  <rect x="40" y="76" width="14" height="12" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="60" y="87" font-size="11.5" fill="#1e40af">定界字段</text>
  <rect x="128" y="76" width="14" height="12" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="148" y="87" font-size="11.5" fill="#334155">载荷 / 内容</text>
  <rect x="232" y="76" width="14" height="12" rx="2" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="252" y="87" font-size="11.5" fill="#7c2d12">终止标记</text>
  <text x="960" y="87" text-anchor="end" font-size="11.5" fill="#64748B">从左到右即线上字节顺序</text>

  <text x="40" y="104" font-size="12.5" font-weight="bold" fill="#0f172a">AMQP 0-9-1</text>
  <text x="40" y="122" font-size="11" fill="#64748B">二进制 · 长度前缀</text>
  <rect x="210" y="110" width="240" height="56" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="330" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">帧头 7 B</text>
  <text x="330" y="154" text-anchor="middle" font-size="10.5" fill="#1d4ed8">类型 1 · 通道 2 · 长度 4</text>
  <rect x="450" y="110" width="380" height="56" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="640" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">payload</text>
  <text x="640" y="154" text-anchor="middle" font-size="10.5" fill="#475569">长度由 size 字段给出（4 字节）</text>
  <rect x="830" y="110" width="130" height="56" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="895" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">帧尾</text>
  <text x="895" y="154" text-anchor="middle" font-size="10.5" fill="#9a3412">0xCE 固定 1 B</text>
  <text x="40" y="186" font-size="11.5" fill="#334155">定界 = 长度 + 帧尾双保险：两者不一致是断连级错误，重传救不回来</text>

  <text x="40" y="214" font-size="12.5" font-weight="bold" fill="#0f172a">MQTT</text>
  <text x="40" y="232" font-size="11" fill="#64748B">二进制 · 变长整数</text>
  <rect x="210" y="220" width="150" height="56" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="285" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">固定头</text>
  <text x="285" y="264" text-anchor="middle" font-size="10.5" fill="#1d4ed8">1 B 位段</text>
  <rect x="360" y="220" width="190" height="56" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="455" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">剩余长度</text>
  <text x="455" y="264" text-anchor="middle" font-size="10.5" fill="#1d4ed8">1~4 B 变长整数</text>
  <rect x="550" y="220" width="410" height="56" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="755" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">可变头 + payload</text>
  <text x="755" y="264" text-anchor="middle" font-size="10.5" fill="#475569">0 ~ 268435455 字节（约 256 MiB）</text>
  <text x="40" y="296" font-size="11.5" fill="#334155">定界 = 变长整数：1 字节覆盖 0~127，4 字节到上限；解码要循环，最多 4 次</text>

  <text x="40" y="324" font-size="12.5" font-weight="bold" fill="#0f172a">STOMP</text>
  <text x="40" y="342" font-size="11" fill="#64748B">文本 · 分隔符</text>
  <rect x="210" y="330" width="210" height="56" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="315" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">COMMAND + headers</text>
  <text x="315" y="374" text-anchor="middle" font-size="10.5" fill="#475569">纯文本行，CRLF 结尾</text>
  <rect x="420" y="330" width="200" height="56" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="520" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">空行</text>
  <text x="520" y="374" text-anchor="middle" font-size="10.5" fill="#9a3412">headers 与 body 的分界</text>
  <rect x="620" y="330" width="90" height="56" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="665" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">body</text>
  <text x="665" y="374" text-anchor="middle" font-size="10.5" fill="#475569">N 字节</text>
  <rect x="710" y="330" width="170" height="56" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="795" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">NUL</text>
  <text x="795" y="374" text-anchor="middle" font-size="10.5" fill="#9a3412">帧与帧的分界</text>
  <rect x="880" y="330" width="80" height="56" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="920" y="362" text-anchor="middle" font-size="11" fill="#64748B">下一帧</text>
  <text x="40" y="406" font-size="11.5" fill="#334155">定界 = 空行分 headers/body + NUL 分帧；body 里出现 NUL 就必须写 content-length 兜底</text>

  <text x="40" y="434" font-size="12.5" font-weight="bold" fill="#0f172a">XMPP</text>
  <text x="40" y="452" font-size="11" fill="#64748B">XML · 结构解析器</text>
  <rect x="210" y="440" width="300" height="56" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="360" y="464" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">&lt;stream:stream ...&gt;</text>
  <text x="360" y="484" text-anchor="middle" font-size="10.5" fill="#475569">只发开头标签，不是合法 XML 文档</text>
  <rect x="510" y="440" width="250" height="56" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="635" y="464" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">stanza</text>
  <text x="635" y="484" text-anchor="middle" font-size="10.5" fill="#475569">message / presence / iq</text>
  <rect x="760" y="440" width="200" height="56" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="860" y="464" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">闭合标签</text>
  <text x="860" y="484" text-anchor="middle" font-size="10.5" fill="#9a3412">由 XML 解析器判结束</text>
  <text x="40" y="516" font-size="11.5" fill="#334155">定界 = 交给解析器：没有长度前缀，一条 stanza 理论上任意长，实现必须自己设上限</text>

  <text x="40" y="552" font-size="12" fill="#0f172a">要点：定界方式决定了解析器形态——长度前缀能预分配缓冲、边收边判；分隔符要逐字节扫且 body 可能有歧义；XML 需要一整个解析器。</text>
  <text x="40" y="574" font-size="12" fill="#b91c1c">注意：四种都能跑在 TCP 上，但只有 AMQP 用「长度 + 帧尾」做了两道校验；STOMP 靠 NUL、NATS 靠 CRLF 时，body 含该字节就必须用长度字段兜底。</text>
  <text x="40" y="596" font-size="12" fill="#b91c1c">注意：没有长度前缀的协议，一条报文可以任意长——接入层不设上限就是内存放大攻击面，XMPP 尤其要设。</text>

  <text x="40" y="628" font-size="11.5" fill="#64748B">依据：AMQP 0-9-1 / OASIS MQTT 3.1.1·5.0 / STOMP 1.2 / RFC 6120 规范原文；本篇未做本机抓包，字节形态按规范陈述</text>
</svg>
