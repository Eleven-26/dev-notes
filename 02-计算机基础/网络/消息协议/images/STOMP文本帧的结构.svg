<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">STOMP 文本帧的四段结构：空行分 headers 与 body，NUL 分帧与帧</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">目标是可以 telnet 手敲 —— 整个协议里没有一次二进制位运算</text>

  <rect x="40" y="100" width="420" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="56" y="128" font-size="13" font-weight="bold" fill="#1e3a8a">SEND</text>

  <rect x="40" y="144" width="420" height="44" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="56" y="172" font-size="12.5" fill="#0f172a">destination:/queue/orders</text>
  <rect x="40" y="188" width="420" height="44" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="56" y="216" font-size="12.5" fill="#0f172a">content-type:application/json</text>
  <rect x="40" y="232" width="420" height="44" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="56" y="260" font-size="12.5" fill="#0f172a">content-length:27</text>

  <rect x="40" y="276" width="420" height="44" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="56" y="304" font-size="12" fill="#713f12">（一个空行，没有内容）</text>

  <rect x="40" y="320" width="420" height="44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="56" y="348" font-size="12.5" fill="#14532d">{"orderId":"A-1","amount":9}</text>

  <rect x="40" y="364" width="420" height="44" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
  <text x="56" y="392" font-size="12.5" fill="#7f1d1d">0x00　（一个 NUL 字节收尾）</text>

  <line x1="462" y1="122" x2="498" y2="122" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="462" y1="210" x2="498" y2="210" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="462" y1="298" x2="498" y2="298" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="462" y1="342" x2="498" y2="342" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="462" y1="386" x2="498" y2="386" stroke="#94a3b8" stroke-width="1.4"/>

  <rect x="500" y="100" width="460" height="44" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="516" y="128" font-size="12" fill="#1e40af">COMMAND：全大写，行尾 EOL（1.2 规范为 CRLF）</text>

  <rect x="500" y="144" width="460" height="132" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="516" y="170" font-size="12" fill="#334155">headers：每行 key:value，以首个冒号分隔</text>
  <text x="516" y="194" font-size="12" fill="#334155">值里可以再出现冒号（如 URL 里的 ://）</text>
  <text x="516" y="220" font-size="12" fill="#b91c1c">1.1 起有转义：\c 表示冒号、\n \r \\ 同理</text>
  <text x="516" y="244" font-size="12" fill="#b91c1c">1.2 只认这四个转义，其余 \x 是协议错误</text>
  <text x="516" y="268" font-size="12" fill="#475569">content-length 数的是 body 字节数，不含 NUL</text>

  <rect x="500" y="276" width="460" height="44" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="516" y="304" font-size="12" fill="#713f12">空行：headers 与 body 的唯一分界，没 body 也要留</text>

  <rect x="500" y="320" width="460" height="44" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="516" y="348" font-size="12" fill="#14532d">body：任意字节；含 0x00 时必须给 content-length</text>

  <rect x="500" y="364" width="460" height="44" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="516" y="392" font-size="12" fill="#7f1d1d">NUL：帧与帧的分界，也是「读到这里就停」的依据</text>

  <rect x="40" y="430" width="920" height="98" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="60" y="454" font-size="12.5" font-weight="bold" fill="#0f172a">两条定界规则，混用就会偶发截断</text>
  <text x="60" y="478" font-size="12" fill="#334155">文本 body 不写 content-length：服务端读到 NUL 自然结束，省一个头。</text>
  <text x="60" y="502" font-size="12" fill="#b91c1c">二进制 body 必须写 content-length：否则 body 里第一个 0x00 被当帧尾，剩下字节被当成下一帧的 COMMAND 行。</text>

  <text x="40" y="556" font-size="11.5" fill="#64748B">依据：STOMP 1.2 规范；本篇未做本机实测（无 STOMP Broker 容器），帧格式未逐字节抓包验证</text>
</svg>
