<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="480" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">AMQP 的三种角色：生产者只认 exchange，消费者只认 queue</text>
  <text x="500" y="58" text-anchor="middle" font-size="12" fill="#64748b">exchange、binding、queue 都是协议里的名词，不是 RabbitMQ 的产品概念——这是「换 broker 不改代码」的前提</text>

  <rect x="250" y="96" width="520" height="290" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="266" y="118" font-size="12" font-weight="bold" fill="#334155">vhost /（隔离边界）</text>

  <rect x="36" y="186" width="176" height="106" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="124" y="212" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">生产者 Producer</text>
  <text x="124" y="236" text-anchor="middle" font-size="11.5" fill="#1e3a8a">带着 routing key 发消息</text>
  <text x="124" y="256" text-anchor="middle" font-size="11.5" fill="#1e3a8a">不知道下游有几个队列</text>
  <text x="124" y="276" text-anchor="middle" font-size="11" fill="#475569">连接后先开 channel</text>

  <line x1="214" y1="239" x2="292" y2="239" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="253" y="231" text-anchor="middle" font-size="10.5" fill="#334155">basic.publish</text>

  <rect x="296" y="176" width="168" height="126" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="380" y="202" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4c1d95">Exchange</text>
  <text x="380" y="226" text-anchor="middle" font-size="11.5" fill="#4c1d95">按类型决定怎么分发</text>
  <text x="380" y="246" text-anchor="middle" font-size="11.5" fill="#4c1d95">direct / fanout</text>
  <text x="380" y="266" text-anchor="middle" font-size="11.5" fill="#4c1d95">topic / headers</text>
  <text x="380" y="288" text-anchor="middle" font-size="10.5" fill="#334155">名字由客户端声明的</text>

  <line x1="466" y1="212" x2="534" y2="180" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="466" y1="266" x2="534" y2="300" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="500" y="222" font-size="10.5" fill="#334155">binding</text>
  <text x="500" y="296" font-size="10.5" fill="#334155">binding</text>

  <rect x="538" y="146" width="150" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="613" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">Queue A</text>
  <text x="613" y="194" text-anchor="middle" font-size="11" fill="#14532d">存消息的地方</text>

  <rect x="538" y="266" width="150" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="613" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">Queue B</text>
  <text x="613" y="314" text-anchor="middle" font-size="11" fill="#14532d">广播型 exchange 下</text>

  <line x1="690" y1="181" x2="758" y2="181" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="690" y1="301" x2="758" y2="301" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="724" y="172" text-anchor="middle" font-size="10.5" fill="#334155">basic.consume</text>
  <text x="724" y="292" text-anchor="middle" font-size="10.5" fill="#334155">basic.consume</text>

  <rect x="762" y="140" width="204" height="84" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="864" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">消费者 1</text>
  <text x="864" y="188" text-anchor="middle" font-size="11.5" fill="#78350f">只订 Queue A</text>
  <text x="864" y="207" text-anchor="middle" font-size="11.5" fill="#78350f">不知道消息从哪个 exchange 来</text>

  <rect x="762" y="260" width="204" height="84" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="864" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">消费者 2</text>
  <text x="864" y="308" text-anchor="middle" font-size="11.5" fill="#78350f">只订 Queue B</text>
  <text x="864" y="327" text-anchor="middle" font-size="11.5" fill="#78350f">ack 由它自己发（basic.ack）</text>

  <text x="36" y="418" font-size="12.5" fill="#0f172a">要点：生产者与消费者互不认识，中间全靠 exchange + binding 这张路由表——路由规则是协议定义的，所以符合 0-9-1 的客户端能连另一个实现。</text>
  <text x="36" y="444" font-size="12.5" fill="#b91c1c">注意：头开销固定 8 字节，小消息上不划算；大消息要拆成多个 body 帧（见第四节）。</text>
  <text x="36" y="468" font-size="11" fill="#64748b">依据：AMQP 0-9-1 规范；本机 RabbitMQ 4.3.6 容器实测（见第八节）</text>
</svg>
