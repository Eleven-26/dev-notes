<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470">
  <defs>
    <marker id="arw2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">STOMP 的角色：客户端只负责写帧，broker 决定 destination 是什么意思</text>
  <text x="500" y="58" text-anchor="middle" font-size="12" fill="#64748b">同一个 destination 字符串，在 ActiveMQ 上是队列、在别的 broker 上可能是广播——语义不在协议里</text>

  <rect x="30" y="86" width="212" height="250" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="136" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">三类客户端都发同样的帧</text>
  <rect x="46" y="124" width="180" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="136" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">浏览器</text>
  <text x="136" y="168" text-anchor="middle" font-size="11" fill="#1e3a8a">经 WebSocket / SockJS</text>
  <rect x="46" y="192" width="180" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="136" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">运维 / 排障</text>
  <text x="136" y="236" text-anchor="middle" font-size="11" fill="#1e3a8a">telnet 直接敲帧</text>
  <rect x="46" y="260" width="180" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="136" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">服务端客户端</text>
  <text x="136" y="304" text-anchor="middle" font-size="11" fill="#1e3a8a">裸 TCP 长连接</text>

  <line x1="244" y1="210" x2="304" y2="210" stroke="#475569" stroke-width="1.6" marker-end="url(#arw2)"/>
  <text x="274" y="200" text-anchor="middle" font-size="10.5" fill="#334155">纯文本帧</text>

  <rect x="308" y="120" width="196" height="180" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="406" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">帧里只有三样东西</text>
  <text x="322" y="174" font-size="11.5" fill="#78350f">COMMAND（SEND / SUBSCRIBE）</text>
  <text x="322" y="198" font-size="11.5" fill="#78350f">headers（destination: …）</text>
  <text x="322" y="222" font-size="11.5" fill="#78350f">空行 + body + NUL</text>
  <text x="322" y="252" font-size="11" fill="#b45309">没有「类型编号」</text>
  <text x="322" y="272" font-size="11" fill="#b45309">没有「路由规则」</text>
  <text x="322" y="292" font-size="11" fill="#b45309">没有确认等级</text>

  <line x1="506" y1="210" x2="566" y2="210" stroke="#475569" stroke-width="1.6" marker-end="url(#arw2)"/>
  <text x="536" y="200" text-anchor="middle" font-size="10.5" fill="#334155">交给它解释</text>

  <rect x="570" y="120" width="150" height="180" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="645" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">Broker</text>
  <text x="586" y="174" font-size="11.5" fill="#4c1d95">把 destination</text>
  <text x="586" y="194" font-size="11.5" fill="#4c1d95">映射成内部结构</text>
  <text x="586" y="224" font-size="11" fill="#4c1d95">认证 / 授权也在它这</text>
  <text x="586" y="244" font-size="11" fill="#4c1d95">协议本身没约定</text>
  <text x="586" y="276" font-size="11" fill="#b45309">换 broker = 重新理解</text>

  <line x1="722" y1="170" x2="782" y2="150" stroke="#475569" stroke-width="1.6" marker-end="url(#arw2)"/>
  <line x1="722" y1="250" x2="782" y2="270" stroke="#475569" stroke-width="1.6" marker-end="url(#arw2)"/>

  <rect x="786" y="104" width="186" height="92" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="879" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">/queue/orders</text>
  <text x="879" y="152" text-anchor="middle" font-size="11" fill="#14532d">点对点：一条只给一个消费者</text>
  <text x="879" y="172" text-anchor="middle" font-size="11" fill="#14532d">拿不到就排队等着</text>
  <text x="879" y="190" text-anchor="middle" font-size="11" fill="#14532d">（ActiveMQ 的约定）</text>

  <rect x="786" y="212" width="186" height="92" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="879" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">/topic/prices</text>
  <text x="879" y="260" text-anchor="middle" font-size="11" fill="#7f1d1d">广播：每个订阅者都收到</text>
  <text x="879" y="280" text-anchor="middle" font-size="11" fill="#7f1d1d">不做负载分摊</text>
  <text x="879" y="298" text-anchor="middle" font-size="11" fill="#7f1d1d">（同样是约定，不是协议）</text>

  <text x="30" y="372" font-size="12.5" fill="#0f172a">要点：STOMP 只把「帧怎么写在 TCP 上」标准化了——所以它能被 telnet 手敲，也所以它的语义完全依赖具体 broker。</text>
  <text x="30" y="398" font-size="12.5" fill="#b91c1c">注意：前缀（/queue、/topic）不是规范规定的，是 ActiveMQ 的写法；换 broker 必须先查它的 destination 约定。</text>
  <text x="30" y="424" font-size="12.5" fill="#0f172a">对照：要「换 broker 语义不变」得往上走 AMQP（exchange / binding 写进了规范），见 AMQP.md 第一节。</text>
  <text x="30" y="452" font-size="11" fill="#64748b">依据：STOMP 1.2 规范；本篇未做本机实测，destination 语义按 ActiveMQ 官方文档陈述</text>
</svg>
