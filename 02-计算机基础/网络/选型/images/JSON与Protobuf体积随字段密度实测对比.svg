<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">省下来的是常数，不是比例：同一份数据的八种形态实测体积</text>
  <text x="500" y="46" text-anchor="middle" font-size="11.5" fill="#64748b">横轴按字节等比（同一比例尺），柱端数字即实测字节数；橙＝JSON 文本编码，蓝＝Protobuf 二进制编码</text>

  <rect x="290" y="56" width="14" height="10" fill="#fdba74" stroke="#ea580c"/>
  <text x="310" y="65" font-size="11.5" fill="#334155">JSON</text>
  <rect x="360" y="56" width="14" height="10" fill="#93c5fd" stroke="#2563eb"/>
  <text x="380" y="65" font-size="11.5" fill="#334155">Protobuf</text>

  <path d="M 270 72 L 270 432 L 760 432" fill="none" stroke="#94a3b8" stroke-width="1.2"/>

  <text x="262" y="89" text-anchor="end" font-size="11.5" fill="#0f172a">单个 int32 = 1</text>
  <rect x="270" y="72" width="3.4" height="14" fill="#fdba74" stroke="#ea580c" stroke-width="0.6"/>
  <text x="282" y="83" font-size="11" fill="#7c2d12">JSON 7 字节</text>
  <rect x="270" y="90" width="1" height="14" fill="#93c5fd" stroke="#2563eb" stroke-width="0.6"/>
  <text x="282" y="101" font-size="11" fill="#1e40af">Protobuf 2 字节</text>

  <text x="262" y="135" text-anchor="end" font-size="11.5" fill="#0f172a">同一字段 = 300</text>
  <rect x="270" y="118" width="4.3" height="14" fill="#fdba74" stroke="#ea580c" stroke-width="0.6"/>
  <text x="282" y="129" font-size="11" fill="#7c2d12">JSON 9 字节</text>
  <rect x="270" y="136" width="1.4" height="14" fill="#93c5fd" stroke="#2563eb" stroke-width="0.6"/>
  <text x="282" y="147" font-size="11" fill="#1e40af">Protobuf 3 字节</text>

  <text x="262" y="181" text-anchor="end" font-size="11.5" fill="#0f172a">字段名 1 字符</text>
  <rect x="270" y="164" width="6.7" height="14" fill="#fdba74" stroke="#ea580c" stroke-width="0.6"/>
  <text x="284" y="175" font-size="11" fill="#7c2d12">JSON 14 字节</text>
  <rect x="270" y="182" width="3.8" height="14" fill="#93c5fd" stroke="#2563eb" stroke-width="0.6"/>
  <text x="284" y="193" font-size="11" fill="#1e40af">Protobuf 8 字节</text>

  <text x="262" y="227" text-anchor="end" font-size="11.5" fill="#0f172a">字段名 4 字符</text>
  <rect x="270" y="210" width="8.2" height="14" fill="#fdba74" stroke="#ea580c" stroke-width="0.6"/>
  <text x="286" y="221" font-size="11" fill="#7c2d12">JSON 17 字节</text>
  <rect x="270" y="228" width="3.8" height="14" fill="#93c5fd" stroke="#2563eb" stroke-width="0.6"/>
  <text x="286" y="239" font-size="11" fill="#1e40af">Protobuf 8 字节</text>

  <text x="262" y="273" text-anchor="end" font-size="11.5" fill="#0f172a">8 个短字段</text>
  <rect x="270" y="256" width="23.5" height="14" fill="#fdba74" stroke="#ea580c" stroke-width="0.6"/>
  <text x="302" y="267" font-size="11" fill="#7c2d12">JSON 49 字节</text>
  <rect x="270" y="274" width="7.7" height="14" fill="#93c5fd" stroke="#2563eb" stroke-width="0.6"/>
  <text x="286" y="285" font-size="11" fill="#1e40af">Protobuf 16 字节</text>

  <text x="262" y="319" text-anchor="end" font-size="11.5" fill="#0f172a">一条 User 基线</text>
  <rect x="270" y="302" width="25.9" height="14" fill="#fdba74" stroke="#ea580c" stroke-width="0.6"/>
  <text x="304" y="313" font-size="11" fill="#7c2d12">JSON 54 字节</text>
  <rect x="270" y="320" width="12.5" height="14" fill="#93c5fd" stroke="#2563eb" stroke-width="0.6"/>
  <text x="290" y="331" font-size="11" fill="#1e40af">Protobuf 26 字节</text>

  <text x="262" y="365" text-anchor="end" font-size="11.5" fill="#0f172a">长字符串 200 字节</text>
  <rect x="270" y="348" width="101.3" height="14" fill="#fdba74" stroke="#ea580c" stroke-width="0.6"/>
  <text x="379" y="359" font-size="11" fill="#7c2d12">JSON 211 字节</text>
  <rect x="270" y="366" width="97.4" height="14" fill="#93c5fd" stroke="#2563eb" stroke-width="0.6"/>
  <text x="375" y="377" font-size="11" fill="#1e40af">Protobuf 203 字节</text>

  <text x="262" y="411" text-anchor="end" font-size="11.5" fill="#0f172a">长字符串 1000 字节</text>
  <rect x="270" y="394" width="485.3" height="14" fill="#fdba74" stroke="#ea580c" stroke-width="0.6"/>
  <text x="500" y="405" font-size="11" fill="#7c2d12">JSON 1011 字节</text>
  <rect x="270" y="412" width="481.4" height="14" fill="#93c5fd" stroke="#2563eb" stroke-width="0.6"/>
  <text x="500" y="423" font-size="11" fill="#1e40af">Protobuf 1003 字节</text>

  <path d="M 766 344 L 776 344 L 776 430 L 766 430" fill="none" stroke="#16a34a" stroke-width="1.3"/>
  <text x="786" y="360" font-size="11.5" font-weight="bold" fill="#14532d">载荷一长</text>
  <text x="786" y="378" font-size="11.5" fill="#14532d">两根柱几乎等长</text>
  <text x="786" y="396" font-size="11.5" fill="#14532d">差值只剩 8 字节</text>
  <text x="786" y="414" font-size="11.5" fill="#14532d">比值 0.9921</text>

  <path d="M 690 76 L 700 76 L 700 152 L 690 152" fill="none" stroke="#dc2626" stroke-width="1.3"/>
  <text x="712" y="100" font-size="11.5" font-weight="bold" fill="#991b1b">短消息：</text>
  <text x="712" y="118" font-size="11.5" fill="#991b1b">字段名与符号占大头</text>
  <text x="712" y="136" font-size="11.5" fill="#991b1b">差距最大</text>

  <rect x="270" y="450" width="715" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="286" y="472" font-size="13" font-weight="bold" fill="#0f172a">要点（数字全部取自同一份编码输出的长度列）</text>
  <text x="286" y="492" font-size="11.5" fill="#334155">字段越密收益越大：8 个短字段 49 比 16，差 33 字节；字段名换成 4 字符，JSON 从 14 变 17，Protobuf 仍是 8。</text>
  <text x="286" y="512" font-size="11.5" fill="#334155">载荷越长越抵不过数据本身：200 字节差 8，1000 字节差 8，比值 0.1818 → 0.9921；零值与空数组整条不上线，36 比 8。</text>
  <text x="286" y="530" font-size="11.5" fill="#334155">最短的两根柱（2 字节、3 字节）按真实比例只有一两个像素宽，读数请以柱端数字为准。</text>
</svg>
