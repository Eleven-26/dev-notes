<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">可信代理链解析的决策树：第一问就决定要不要看转发头</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">本机实测的可信列表为 10.0.0.0/8、127.0.0.1、::1，十个用例的实际输出都标在右侧</text>

  <rect x="60" y="80" width="250" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="185" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">入口</text>
  <text x="185" y="119" text-anchor="middle" font-size="10.5" fill="#0f172a">peer = hostOnly(RemoteAddr)</text>
  <rect x="430" y="80" width="510" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="446" y="100" font-size="11.5" fill="#0f172a">对端与链上的每个条目都先剥端口、去方括号，再做 IPv4-mapped 归一</text>
  <text x="446" y="119" font-size="10.5" fill="#64748b">用例⑧ ::ffff:9.9.9.9 → 9.9.9.9　用例⑨ 对端 [::1]:5000，XFF=2001:db8::1 → 2001:db8::1</text>

  <rect x="60" y="152" width="250" height="52" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="185" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">规则① 判对端</text>
  <text x="185" y="191" text-anchor="middle" font-size="10.5" fill="#7f1d1d">peer 在 trusted 里吗</text>
  <line x1="185" y1="134" x2="185" y2="150" stroke="#64748b" stroke-width="1.6" marker-end="url(#arF)"/>
  <line x1="310" y1="178" x2="426" y2="178" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arF)"/>
  <text x="368" y="172" text-anchor="middle" font-size="10.5" fill="#991b1b">不可信</text>
  <rect x="430" y="152" width="510" height="52" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="446" y="172" font-size="11.5" font-weight="bold" fill="#7f1d1d">直接返回 peer，XFF 一个字节都不看（安全底线）</text>
  <text x="446" y="191" font-size="10.5" fill="#7f1d1d">用例① remote=203.0.113.9:5000，XFF=1.2.3.4 → 203.0.113.9，伪造完全无效</text>

  <line x1="185" y1="204" x2="185" y2="222" stroke="#64748b" stroke-width="1.6" marker-end="url(#arF)"/>
  <text x="194" y="218" font-size="10.5" fill="#14532d">对端可信，才进链</text>
  <rect x="60" y="224" width="250" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="185" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">规则② 扫链</text>
  <text x="185" y="263" text-anchor="middle" font-size="10.5" fill="#14532d">从右往左逐个判</text>
  <line x1="310" y1="250" x2="426" y2="250" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arF)"/>
  <text x="368" y="244" text-anchor="middle" font-size="10.5" fill="#14532d">扫到不可信项</text>
  <rect x="430" y="224" width="510" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="446" y="244" font-size="11.5" font-weight="bold" fill="#14532d">第一个不可信地址就是真实客户端</text>
  <text x="446" y="263" font-size="10.5" fill="#14532d">用例④ 1.1.1.1, 9.9.9.9, 10.1.1.1 → 9.9.9.9　用例⑤ garbage, 9.9.9.9 → 9.9.9.9</text>

  <line x1="185" y1="276" x2="185" y2="294" stroke="#64748b" stroke-width="1.6" marker-end="url(#arF)"/>
  <text x="194" y="290" font-size="10.5" fill="#1e3a8a">扫到左端仍全可信</text>
  <rect x="60" y="296" width="250" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="185" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">规则③ 全可信</text>
  <text x="185" y="335" text-anchor="middle" font-size="10.5" fill="#1e3a8a">取最左那条</text>
  <line x1="310" y1="322" x2="426" y2="322" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arF)"/>
  <text x="368" y="316" text-anchor="middle" font-size="10.5" fill="#1e3a8a">链非空</text>
  <rect x="430" y="296" width="510" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="446" y="316" font-size="11.5" font-weight="bold" fill="#1e3a8a">最左那条仍比退回对端更有区分度</text>
  <text x="446" y="335" font-size="10.5" fill="#1e3a8a">用例⑥ 10.7.7.7, 10.8.8.8 → 10.7.7.7；退回对端会让整段内网客户端坍缩成一个限流桶</text>

  <line x1="185" y1="348" x2="185" y2="366" stroke="#64748b" stroke-width="1.6" marker-end="url(#arF)"/>
  <text x="194" y="362" font-size="10.5" fill="#7c2d12">没有可用的链</text>
  <rect x="60" y="368" width="250" height="52" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="185" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">规则④ 回落</text>
  <text x="185" y="407" text-anchor="middle" font-size="10.5" fill="#7c2d12">改读 X-Real-IP</text>
  <line x1="310" y1="394" x2="426" y2="394" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arF)"/>
  <text x="368" y="388" text-anchor="middle" font-size="10.5" fill="#7c2d12">取到值</text>
  <rect x="430" y="368" width="510" height="52" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="446" y="388" font-size="11.5" font-weight="bold" fill="#7c2d12">XFF 不可用才看单值头</text>
  <text x="446" y="407" font-size="10.5" fill="#7c2d12">用例⑦ XFF 缺失、X-Real-IP=9.9.9.9 → 9.9.9.9</text>

  <line x1="185" y1="420" x2="185" y2="438" stroke="#64748b" stroke-width="1.6" marker-end="url(#arF)"/>
  <text x="194" y="434" font-size="10.5" fill="#475569">还是取不到</text>
  <rect x="60" y="440" width="250" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="185" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">规则⑤ 兜底</text>
  <text x="185" y="479" text-anchor="middle" font-size="10.5" fill="#0f172a">返回 peer 自己</text>
  <line x1="310" y1="466" x2="426" y2="466" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arF)"/>
  <text x="368" y="460" text-anchor="middle" font-size="10.5" fill="#475569">仍无值</text>
  <rect x="430" y="440" width="510" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="446" y="460" font-size="11.5" font-weight="bold" fill="#0f172a">peer 本身是可信代理，返回它也不算错</text>
  <text x="446" y="479" font-size="10.5" fill="#475569">用例⑩ XFF=garbage，且没有 X-Real-IP → 127.0.0.1</text>

  <line x1="40" y1="510" x2="960" y2="510" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="530" font-size="12" fill="#475569">用例② 对端可信 + XFF=9.9.9.9 → 9.9.9.9、用例③ 对端可信 + XFF=9.9.9.9, 10.1.1.1 → 9.9.9.9：走的都是规则②。</text>
  <text x="40" y="552" font-size="12" fill="#475569">规则②到规则⑤ 是一条往下落的水流：每层取不到才进下一层，任何一层取到就立刻返回。</text>

  <defs>
    <marker id="arF" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
