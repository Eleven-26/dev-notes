<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">3KB 分段与 RTT 账</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#64748b">3072 字节应用数据按 MSS 1460 切成 3 段；握手 1 个 RTT、数据 1 个 RTT</text>

  <text x="30" y="92" font-size="13" font-weight="bold" fill="#0f172a">应用数据 3072 字节</text>
  <rect x="30" y="102" width="300" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="180" y="133" text-anchor="middle" font-size="13" fill="#1e3a8a">段① 1460 B</text>
  <rect x="336" y="102" width="300" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="486" y="133" text-anchor="middle" font-size="13" fill="#1e3a8a">段② 1460 B</text>
  <rect x="642" y="102" width="130" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="707" y="133" text-anchor="middle" font-size="13" fill="#92400e">段③ 152 B</text>
  <text x="790" y="126" font-size="11" fill="#64748b">宽度为示意</text>
  <text x="790" y="144" font-size="11" fill="#64748b">不按字节比例</text>

  <rect x="30" y="170" width="740" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="188" font-size="11.5" fill="#334155">IP 20 + TCP 20 + 数据 1460 = 1500 B　→　以太网帧 1518 B</text>
  <rect x="30" y="202" width="740" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="220" font-size="11.5" fill="#334155">IP 20 + TCP 20 + 数据 1460 = 1500 B　→　以太网帧 1518 B</text>
  <rect x="30" y="234" width="740" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="252" font-size="11.5" fill="#334155">IP 20 + TCP 20 + 数据 152 = 192 B　→　以太网帧 210 B</text>

  <text x="170" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">客户端</text>
  <text x="830" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">服务端</text>
  <line x1="170" y1="300" x2="170" y2="550" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="830" y1="300" x2="830" y2="550" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>

  <text x="40" y="312" text-anchor="middle" font-size="11" fill="#64748b">时间</text>
  <line x1="40" y1="320" x2="40" y2="545" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arw)"/>

  <line x1="174" y1="330" x2="826" y2="330" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="500" y="323" text-anchor="middle" font-size="11.5" fill="#334155">SYN（MSS 1460 / 窗口缩放 / SACK）</text>

  <line x1="826" y1="370" x2="174" y2="370" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="500" y="363" text-anchor="middle" font-size="11.5" fill="#14532d">SYN+ACK</text>

  <line x1="174" y1="410" x2="826" y2="410" stroke="#334155" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="500" y="403" text-anchor="middle" font-size="11.5" fill="#334155">ACK</text>

  <line x1="174" y1="455" x2="826" y2="455" stroke="#2563eb" stroke-width="2" marker-end="url(#arw)"/>
  <text x="500" y="448" text-anchor="middle" font-size="11.5" fill="#1e3a8a">数据①②③ = 3072 B（3 个包连续发出，发三次，无需中间等 ACK）</text>

  <line x1="826" y1="495" x2="174" y2="495" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="500" y="488" text-anchor="middle" font-size="11.5" fill="#14532d">ACK 2921</text>

  <line x1="826" y1="525" x2="174" y2="525" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="500" y="518" text-anchor="middle" font-size="11.5" fill="#14532d">ACK 3072（可能延迟）</text>

  <line x1="145" y1="330" x2="145" y2="410" stroke="#b45309" stroke-width="1.3"/>
  <line x1="140" y1="330" x2="150" y2="330" stroke="#b45309" stroke-width="1.3"/>
  <line x1="140" y1="410" x2="150" y2="410" stroke="#b45309" stroke-width="1.3"/>
  <text x="136" y="374" text-anchor="end" font-size="11" fill="#92400e">握手 1 RTT</text>

  <line x1="145" y1="410" x2="145" y2="525" stroke="#b45309" stroke-width="1.3"/>
  <line x1="140" y1="525" x2="150" y2="525" stroke="#b45309" stroke-width="1.3"/>
  <text x="136" y="470" text-anchor="end" font-size="11" fill="#92400e">数据 1 RTT</text>

  <rect x="30" y="566" width="940" height="56" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="590" font-size="12.5" font-weight="bold" fill="#0f172a">最少 8 个报文 = 3 握手 + 3 数据 + 2 ACK；耗时 2 RTT（不含 DNS 与 TLS）</text>
  <text x="44" y="612" font-size="11.5" fill="#7f1d1d">若丢段：3KB 只有 3 段，重复 ACK 常凑不够 3 个 → 等 RTO / TLP 补救</text>
</svg>
