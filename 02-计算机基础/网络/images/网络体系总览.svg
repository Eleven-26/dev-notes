<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 982" width="1000" height="982" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="982" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">网络体系总览（本目录回答「一次请求怎么从本机走到服务端」）</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">纵向（分层与封装）与横向（链路与节点）各一篇总纲 · 共 46 篇按八个分类分区 · Go 接入篇在 01-编程语言/go/网络编程</text>

  <rect x="20" y="68" width="960" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="36" y="92" font-size="14" font-weight="bold" fill="#2563eb">① 总纲与端到端链路（5 篇）—— 先看层、再看每一跳改的是哪一层</text>
  <text x="36" y="114" font-size="12" fill="#334155">纵向 · 网络分层与数据包旅程：五层模型、逐层加首部、TLS 所在的层、掉进 MTU</text>
  <text x="36" y="130" font-size="12" fill="#334155">横向 · 网络通信链路详解：13 步时序、逐跳改写、NAT / CDN / LB、分层排障；案例 · 跨城传输全链路（TCP/UDP）：3KB 杭州→深圳的 OEO 账、建连与乱序、分片与重传</text>

  <line x1="500" y1="138" x2="500" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="20" y="152" width="290" height="190" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="34" y="178" font-size="14" font-weight="bold" fill="#5b21b6">② 数据链路层（1 篇）</text>
  <text x="34" y="200" font-size="11" fill="#5b21b6">同一链路上帧怎么走</text>
  <text x="34" y="228" font-size="12.5" fill="#0f172a">以太网与二层转发</text>
  <text x="34" y="252" font-size="11" fill="#475569">帧结构 / MAC 表 / 泛洪</text>
  <text x="34" y="270" font-size="11" fill="#475569">VLAN 与 ARP 的位置</text>

  <rect x="330" y="152" width="650" height="190" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="344" y="178" font-size="14" font-weight="bold" fill="#1e3a8a">③ 网络层与寻址（7 篇）</text>
  <text x="344" y="200" font-size="11" fill="#1e3a8a">地址、路由、名字解析与地址改写</text>
  <text x="346" y="228" font-size="12.5" fill="#0f172a">IP 与路由基础</text>
  <text x="346" y="250" font-size="12.5" fill="#0f172a">IPv6 与双栈</text>
  <text x="346" y="272" font-size="12.5" fill="#0f172a">DHCP</text>
  <text x="346" y="294" font-size="12.5" fill="#0f172a">DNS 解析</text>
  <text x="620" y="228" font-size="12.5" fill="#0f172a">DNS 安全与加密解析</text>
  <text x="620" y="250" font-size="12.5" fill="#0f172a">NAT 与连接跟踪</text>
  <text x="620" y="272" font-size="11" fill="#475569">五元组 / SNAT / DNAT</text>
  <text x="620" y="294" font-size="11" fill="#475569">conntrack 与超时</text>

  <line x1="500" y1="342" x2="500" y2="356" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="20" y="358" width="600" height="226" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="34" y="384" font-size="14" font-weight="bold" fill="#14532d">④ 传输层（13 篇）</text>
  <text x="34" y="406" font-size="11" fill="#14532d">报文 → 握手 → 窗口 → 拥塞 → 挥手 → 保活；另一半是 UDP 与 I/O 模型</text>
  <text x="36" y="434" font-size="12.5" fill="#0f172a">TCP 报文结构</text>
  <text x="36" y="456" font-size="12.5" fill="#0f172a">TCP 三次握手</text>
  <text x="36" y="478" font-size="12.5" fill="#0f172a">TCP 滑动窗口</text>
  <text x="36" y="500" font-size="12.5" fill="#0f172a">TCP 的 Nagle 与延迟确认</text>
  <text x="36" y="522" font-size="12.5" fill="#0f172a">TCP 拥塞控制算法</text>
  <text x="36" y="544" font-size="12.5" fill="#0f172a">TCP 四次挥手</text>
  <text x="330" y="434" font-size="12.5" fill="#0f172a">TCP 保活与连接存活</text>
  <text x="330" y="456" font-size="12.5" fill="#0f172a">UDP 与数据报传输</text>
  <text x="330" y="478" font-size="12.5" fill="#0f172a">I/O 多路复用</text>
  <text x="330" y="506" font-size="11" fill="#475569">epoll / Reactor / io_uring</text>
  <text x="330" y="526" font-size="11" fill="#475569">半开连接与事件循环</text>

  <rect x="630" y="358" width="350" height="248" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text x="644" y="384" font-size="14" font-weight="bold" fill="#7c2d12">⑤ 应用层（9 篇）</text>
  <text x="644" y="406" font-size="11" fill="#7c2d12">连接之上的加密、版本、推送、邮件投递，以及协议怎么自己定</text>
  <text x="646" y="434" font-size="12.5" fill="#0f172a">HTTPS 与 TLS</text>
  <text x="646" y="456" font-size="12.5" fill="#0f172a">证书与 HTTPS 排障</text>
  <text x="646" y="478" font-size="12.5" fill="#0f172a">HTTP1.1 与 HTTP2 的区别</text>
  <text x="646" y="500" font-size="12.5" fill="#0f172a">HTTP 与 gRPC</text>
  <text x="646" y="522" font-size="12.5" fill="#0f172a">WebSocket 与 SSE</text>
  <text x="646" y="544" font-size="12.5" fill="#0f172a">QUIC 与 HTTP3</text>
  <text x="646" y="566" font-size="12.5" fill="#0f172a">SMTP：服务器之间怎么交信</text>
  <text x="646" y="588" font-size="12.5" fill="#0f172a">自定义协议设计：定界 / 版本 / 出错与流控</text>

  <line x1="500" y1="606" x2="500" y2="620" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="20" y="622" width="960" height="200" rx="10" fill="#cffafe" stroke="#0891b2"/>
  <text x="36" y="648" font-size="14" font-weight="bold" fill="#155e75">⑥ 消息协议（5 篇）—— 消息在线上长什么样：族总纲、帧、命令、定界与确认</text>
  <text x="36" y="670" font-size="11" fill="#155e75">一篇族总纲（定界四分法 + 八维矩阵）+ 四篇标准协议；产品侧用法见 03-数据与中间件/中间件/消息队列</text>

  <text x="36" y="702" font-size="12.5" fill="#0f172a">AMQP 协议：二进制帧流，method / header / body</text>
  <text x="36" y="728" font-size="12.5" fill="#0f172a">MQTT：固定头 + 变长剩余长度，QoS 三条确认链</text>
  <text x="36" y="754" font-size="12.5" fill="#0f172a">STOMP：文本帧，NULL 定界与 receipt 事务</text>
  <text x="520" y="702" font-size="12.5" fill="#0f172a">XMPP：XML 流被重启三次，三个 stanza</text>
  <text x="520" y="754" font-size="12.5" fill="#0f172a">共同点：都在回答「一条消息到哪结束」</text>

  <text x="36" y="798" font-size="11" fill="#475569">私有协议（Kafka / Pulsar / NATS）的帧格式见 03-数据与中间件/中间件/消息队列/ 下的协议篇，与本分类逐项对照</text>
  <text x="36" y="814" font-size="11" fill="#475569">OpenWire 是 ActiveMQ Classic 的私有协议，只有一家实现，协议层学习路径是 STOMP / AMQP / MQTT 这些有公开规范的</text>

  <line x1="500" y1="822" x2="500" y2="836" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="20" y="838" width="600" height="92" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="34" y="862" font-size="14" font-weight="bold" fill="#78350f">⑦ 代理、观测与排障（4 篇）</text>
  <text x="36" y="886" font-size="12.5" fill="#0f172a">反向代理原理 · 客户端真实 IP 与可信代理 · 抓包实战</text>
  <text x="36" y="908" font-size="11" fill="#475569">Go 接入：反向代理接入 / 客户端 IP 接入（在 01-编程语言/go/网络编程）</text>

  <rect x="630" y="838" width="350" height="92" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="644" y="862" font-size="14" font-weight="bold" fill="#334155">⑧ 选型（2 篇）</text>
  <text x="646" y="886" font-size="12.5" fill="#0f172a">通信选型</text>
  <text x="646" y="908" font-size="12.5" fill="#0f172a">数据序列化</text>

  <rect x="20" y="942" width="960" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="500" y="959" text-anchor="middle" font-size="10.5" fill="#64748b">边界：本目录只收网络协议与链路本身；组件用法见 03，容器网络见 06，密码学与证书体系见 06-工程实践/安全</text>
</svg>
