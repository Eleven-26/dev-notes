<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 592" width="1000" height="592" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="592" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">网络体系总览（本目录回答「一次请求怎么从本机走到服务端」）</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">纵向（分层与封装）与横向（链路与节点）各一篇总纲 · 共 22 篇按五个主题组分区 · 组件用法与容器网络在别的目录</text>

  <rect x="20" y="68" width="960" height="74" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="36" y="90" font-size="14" font-weight="bold" fill="#2563eb">① 总纲与端到端链路（2 篇）—— 先看层、再看每一跳改的是哪一层</text>
  <text x="36" y="112" font-size="12.5" fill="#334155">纵向 · 网络分层与数据包旅程：五层模型、逐层加首部、TLS 所在的层、掉进 MTU</text>
  <text x="36" y="131" font-size="12.5" fill="#334155">横向 · 网络通信链路详解：13 步端到端时序、逐跳改写、NAT / CDN / LB、分层排障</text>

  <line x1="500" y1="142" x2="500" y2="156" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="20" y="158" width="470" height="178" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="34" y="184" font-size="14" font-weight="bold" fill="#1e3a8a">② 网络层与传输层基础（4 篇）</text>
  <text x="34" y="204" font-size="11" fill="#1e3a8a">出门前拿到四个参数、跨网段怎么寻址</text>
  <text x="34" y="226" font-size="12.5" fill="#0f172a">IP 与路由基础</text>
  <text x="34" y="246" font-size="12.5" fill="#0f172a">UDP 与数据报传输</text>
  <text x="34" y="266" font-size="12.5" fill="#0f172a">DHCP</text>
  <text x="34" y="286" font-size="12.5" fill="#0f172a">DNS 解析</text>

  <rect x="510" y="158" width="470" height="178" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="524" y="184" font-size="14" font-weight="bold" fill="#14532d">③ TCP 传输机制（6 篇）</text>
  <text x="524" y="204" font-size="11" fill="#14532d">报文 → 握手 → 窗口 → 拥塞 → 挥手</text>
  <text x="524" y="224" font-size="12.5" fill="#0f172a">TCP 报文结构</text>
  <text x="524" y="243" font-size="12.5" fill="#0f172a">TCP 三次握手</text>
  <text x="524" y="262" font-size="12.5" fill="#0f172a">TCP 滑动窗口</text>
  <text x="524" y="281" font-size="12.5" fill="#0f172a">TCP 的 Nagle 与延迟确认</text>
  <text x="524" y="300" font-size="12.5" fill="#0f172a">TCP 拥塞控制算法</text>
  <text x="524" y="319" font-size="12.5" fill="#0f172a">TCP 四次挥手</text>

  <rect x="20" y="344" width="470" height="178" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text x="34" y="370" font-size="14" font-weight="bold" fill="#7c2d12">④ 应用协议与选型（6 篇）</text>
  <text x="34" y="390" font-size="11" fill="#7c2d12">连接之上的加密、版本差异与横向选型</text>
  <text x="34" y="410" font-size="12.5" fill="#0f172a">HTTPS 与 TLS</text>
  <text x="34" y="429" font-size="12.5" fill="#0f172a">HTTP1.1 与 HTTP2 的区别</text>
  <text x="34" y="448" font-size="12.5" fill="#0f172a">HTTP 与 gRPC</text>
  <text x="34" y="467" font-size="12.5" fill="#0f172a">QUIC 与 HTTP3</text>
  <text x="34" y="486" font-size="12.5" fill="#0f172a">通信选型</text>
  <text x="34" y="505" font-size="12.5" fill="#0f172a">数据序列化</text>

  <rect x="510" y="344" width="470" height="178" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="524" y="370" font-size="14" font-weight="bold" fill="#78350f">⑤ I/O、代理与排障（4 篇）</text>
  <text x="524" y="390" font-size="11" fill="#78350f">换视角：服务端怎么接住连接、怎么观测</text>
  <text x="524" y="412" font-size="12.5" fill="#0f172a">IO 多路复用</text>
  <text x="524" y="432" font-size="12.5" fill="#0f172a">反向代理原理与实现</text>
  <text x="524" y="452" font-size="12.5" fill="#0f172a">客户端真实 IP 与可信代理</text>
  <text x="524" y="472" font-size="12.5" fill="#0f172a">抓包实战</text>

  <rect x="20" y="530" width="960" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="36" y="549" font-size="11" fill="#64748b">与其它目录的边界：本目录只收网络协议与链路本身 → 组件用法（Redis / MQ / 注册中心）见 03-数据与中间件</text>
  <text x="36" y="568" font-size="11" fill="#64748b">容器与集群网络见 06-工程实践/部署 · 密码算法与证书见 06-工程实践/安全 · 服务端框架写法见 01-编程语言 · 再往上一层见 04 分布式</text>
</svg>
