<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一个出站数据包的路由决策</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">先拿目的 IP 查路由表做最长前缀匹配，决定下一跳，再解析下一跳的 MAC 并组帧；目的 IP 端到端不变，目的 MAC 逐跳都换</text>

  <defs>
    <marker id="arwB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="arwA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b45309"/></marker>
  </defs>

  <rect x="20" y="74" width="600" height="460" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="34" y="98" font-size="15" font-weight="bold" fill="#0f172a">四步决策：查表 → 定下一跳 → 解析 MAC → 组帧</text>
  <text x="34" y="118" font-size="10.5" fill="#64748b">所有判断都只依赖目的 IP，与上层是 HTTP 还是 RPC 无关</text>

  <rect x="130" y="138" width="360" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="310" y="166" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">① 拿到目的 IP</text>

  <line x1="310" y1="182" x2="310" y2="196" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

  <rect x="130" y="198" width="360" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="310" y="218" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">② 查路由表：最长前缀匹配</text>
  <text x="310" y="234" text-anchor="middle" font-size="9.5" fill="#1e40af">命中前缀最长的那一条，得到「下一跳 + 出接口」</text>

  <line x1="310" y1="242" x2="310" y2="256" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

  <rect x="130" y="258" width="360" height="44" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="310" y="286" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">③ 命中直连路由吗？（是否同网段）</text>

  <line x1="215" y1="302" x2="215" y2="322" stroke="#b45309" stroke-width="1.5" marker-end="url(#arwA)"/>
  <text x="203" y="316" text-anchor="end" font-size="10" fill="#16a34a">命中</text>
  <line x1="405" y1="302" x2="405" y2="322" stroke="#b45309" stroke-width="1.5" marker-end="url(#arwA)"/>
  <text x="417" y="316" text-anchor="start" font-size="10" fill="#991b1b">不命中</text>

  <rect x="130" y="324" width="170" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="215" y="344" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">下一跳 = 目的主机</text>
  <text x="215" y="362" text-anchor="middle" font-size="9.5" fill="#14532d">同一网段，链路层直达</text>

  <rect x="320" y="324" width="170" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="405" y="344" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991b1b">下一跳 = 网关</text>
  <text x="405" y="362" text-anchor="middle" font-size="9.5" fill="#991b1b">默认 / 静态 / 动态路由</text>

  <line x1="215" y1="374" x2="215" y2="396" stroke="#64748b" stroke-width="1.3"/>
  <line x1="405" y1="374" x2="405" y2="396" stroke="#64748b" stroke-width="1.3"/>
  <line x1="215" y1="396" x2="405" y2="396" stroke="#64748b" stroke-width="1.3"/>
  <line x1="310" y1="396" x2="310" y2="412" stroke="#64748b" stroke-width="1.5" marker-end="url(#arwB)"/>

  <rect x="130" y="414" width="360" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="310" y="434" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">④ 查 ARP / NDP，拿到「下一跳」的 MAC</text>
  <text x="310" y="450" text-anchor="middle" font-size="9.5" fill="#1e40af">缓存没命中就发请求，超时表现为 ping 不通 / 建连失败</text>

  <line x1="310" y1="458" x2="310" y2="472" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

  <rect x="130" y="474" width="360" height="50" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.3"/>
  <text x="310" y="494" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">组帧发出：目的 MAC = 下一跳，目的 IP = 最终目标</text>
  <text x="310" y="512" text-anchor="middle" font-size="9.5" fill="#334155">之后每一跳重写 MAC 并让 TTL 减 1，目的 IP 保持不变</text>

  <rect x="640" y="74" width="340" height="460" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="654" y="98" font-size="15" font-weight="bold" fill="#0f172a">为什么必须按最长前缀匹配</text>
  <text x="654" y="126" font-size="11" font-weight="bold" fill="#334155">路由表（示意）</text>
  <text x="654" y="148" font-size="10.5" fill="#334155">0.0.0.0/0      via 192.0.2.1</text>
  <text x="864" y="148" font-size="10.5" fill="#64748b">前缀 0</text>
  <text x="654" y="168" font-size="10.5" fill="#334155">192.0.2.0/24   dev eth0</text>
  <text x="864" y="168" font-size="10.5" fill="#64748b">前缀 24</text>
  <text x="654" y="188" font-size="10.5" font-weight="bold" fill="#1e40af">192.0.2.64/26  via 192.0.2.3</text>
  <text x="864" y="188" font-size="10.5" font-weight="bold" fill="#1e40af">前缀 26</text>
  <text x="654" y="212" font-size="10" fill="#64748b">目标 192.0.2.80：三条都匹配，取最具体的那条</text>

  <line x1="654" y1="230" x2="966" y2="230" stroke="#cbd5e1" stroke-width="1.1"/>

  <text x="654" y="256" font-size="11" font-weight="bold" fill="#334155">三个要点</text>
  <text x="654" y="282" font-size="10.5" fill="#334155">① 判据是「前缀长度」，不是表的先后顺序</text>
  <text x="654" y="306" font-size="10.5" fill="#334155">② 默认路由（/0）永远最后兜底</text>
  <text x="654" y="330" font-size="10.5" fill="#334155">③ 更具体的路由会抢在默认路由之前生效</text>

  <line x1="654" y1="350" x2="966" y2="350" stroke="#cbd5e1" stroke-width="1.1"/>

  <text x="654" y="376" font-size="11" font-weight="bold" fill="#334155">两个常见误判</text>
  <text x="654" y="402" font-size="10.5" fill="#991b1b">「加了条静态路由，流量就不走默认网关了」</text>
  <text x="654" y="422" font-size="10.5" fill="#991b1b">不是覆盖，而是那条更具体</text>
  <text x="654" y="448" font-size="10.5" fill="#991b1b">「ping 通就说明服务可用」</text>
  <text x="654" y="468" font-size="10.5" fill="#991b1b">只证明网络层可达，端口监听是传输层的事</text>

  <text x="654" y="500" font-size="10" fill="#64748b">示意地址取自 RFC 5737 的文档专用段</text>
</svg>
