<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">curl -w 的五个时间点是累计值，不是每一段的耗时</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">相邻两项相减才是这一段的长度；TTFB 里混着服务端处理与网络等待</text>

  <text x="90" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">time_namelookup</text>
  <text x="210" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">time_connect</text>
  <text x="360" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">time_appconnect</text>
  <text x="610" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">time_starttransfer</text>
  <text x="900" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">time_total</text>

  <line x1="60" y1="150" x2="940" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
  <circle cx="90" cy="150" r="5" fill="#0284c7"/>
  <circle cx="210" cy="150" r="5" fill="#0284c7"/>
  <circle cx="360" cy="150" r="5" fill="#0284c7"/>
  <circle cx="610" cy="150" r="5" fill="#0284c7"/>
  <circle cx="900" cy="150" r="5" fill="#0284c7"/>

  <text x="90" y="180" text-anchor="middle" font-size="11" fill="#334155">0.0001 s</text>
  <text x="210" y="180" text-anchor="middle" font-size="11" fill="#334155">0.0016 s</text>
  <text x="360" y="180" text-anchor="middle" font-size="11" fill="#334155">0.0166 s</text>
  <text x="610" y="180" text-anchor="middle" font-size="11" fill="#334155">0.3624 s</text>
  <text x="900" y="180" text-anchor="middle" font-size="11" fill="#334155">0.3625 s</text>

  <text x="150" y="210" text-anchor="middle" font-size="11" fill="#b91c1c">DNS 0.0001</text>
  <text x="285" y="210" text-anchor="middle" font-size="11" fill="#b91c1c">TCP 0.0015</text>
  <text x="485" y="210" text-anchor="middle" font-size="11" fill="#b91c1c">TLS 0.0150</text>
  <text x="755" y="210" text-anchor="middle" font-size="11" fill="#b91c1c">等首字节 0.3459</text>
  <text x="940" y="210" text-anchor="end" font-size="11" fill="#b91c1c">传输 0.0001</text>

  <line x1="60" y1="232" x2="940" y2="232" stroke="#e2e8f0" stroke-width="1"/>

  <text x="60" y="260" font-size="11" fill="#334155">DNS = time_namelookup</text>
  <text x="60" y="286" font-size="11" fill="#334155">TCP = time_connect − time_namelookup</text>
  <text x="60" y="312" font-size="11" fill="#334155">TLS = time_appconnect − time_connect</text>

  <text x="520" y="260" font-size="11" fill="#334155">等首字节 = time_starttransfer − time_appconnect</text>
  <text x="520" y="286" font-size="11" fill="#334155">传输 = time_total − time_starttransfer</text>
  <text x="520" y="312" font-size="11" fill="#334155">总耗时 = time_total（从请求开始到最后一个字节）</text>

  <rect x="40" y="336" width="920" height="96" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="56" y="360" font-size="12" font-weight="bold" fill="#b91c1c">注意：0.3459 s 不是网络耗时</text>
  <text x="56" y="382" font-size="11" fill="#7f1d1d">本机 /slow 在服务端 sleep(300 ms)；同一环境 /echo 的「TTFB − TLS」是 0.0474 s，</text>
  <text x="56" y="402" font-size="11" fill="#7f1d1d">两者相减约 0.298 s，才对得上 300 ms 的 sleep。换客户端或换机器，这段基线都要重新量。</text>
  <text x="56" y="422" font-size="11" fill="#7f1d1d">排查时先找「哪一段的增量异常」，再决定查 DNS、握手、服务端还是带宽；不要直接读 TTFB 当网络时间。</text>
</svg>
