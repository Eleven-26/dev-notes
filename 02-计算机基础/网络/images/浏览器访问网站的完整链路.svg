<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1170" width="1040" height="1170" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ah-req" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="ah-res" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1170" fill="#ffffff"/>

  <text x="520" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">浏览器访问 https://example.com 的完整链路（13 步）</text>
  <text x="520" y="60" text-anchor="middle" font-size="14" fill="#475569">① 找路（DNS） → ② 建连（TCP / TLS / HTTP） → ③ 逐层封装（仅本机） → ④ 传输与回程</text>
  <line x1="790" y1="22" x2="836" y2="22" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-req)"/>
  <text x="844" y="27" font-size="12" fill="#334155">请求方向</text>
  <line x1="790" y1="44" x2="836" y2="44" stroke="#059669" stroke-width="2" marker-end="url(#ah-res)"/>
  <text x="844" y="49" font-size="12" fill="#334155">响应方向</text>

  <line x1="235" y1="126" x2="235" y2="1078" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="545" y1="126" x2="545" y2="1078" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="855" y1="126" x2="855" y2="1078" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>

  <rect x="150" y="86" width="170" height="34" rx="7" fill="#dbeafe" stroke="#2563eb"/>
  <text x="235" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">客户端（浏览器）</text>
  <rect x="435" y="86" width="220" height="34" rx="7" fill="#fef3c7" stroke="#d97706"/>
  <text x="545" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">中间设备（网关 / 路由 / CDN）</text>
  <rect x="755" y="86" width="200" height="34" rx="7" fill="#d1fae5" stroke="#059669"/>
  <text x="855" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">服务端 example.com</text>

  <rect x="10" y="150" width="44" height="92" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="32" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8" transform="rotate(90 32 196)">① 找路</text>
  <rect x="10" y="250" width="44" height="228" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="32" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d" transform="rotate(90 32 364)">② 建连（三次往返）</text>
  <rect x="10" y="486" width="44" height="232" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="32" y="602" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309" transform="rotate(90 32 602)">③ 封装（仅本机）</text>
  <rect x="10" y="726" width="44" height="352" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="32" y="902" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9" transform="rotate(90 32 902)">④ 传输与回程</text>

  <text x="64" y="166" font-size="13" fill="#1d4ed8">① DNS 解析：example.com → IP</text>
  <line x1="250" y1="186" x2="424" y2="186" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-req)"/>
  <text x="337" y="180" text-anchor="middle" font-size="12" fill="#334155">UDP:53 查询 A / AAAA 记录</text>
  <line x1="424" y1="212" x2="250" y2="212" stroke="#059669" stroke-width="2" marker-end="url(#ah-res)"/>
  <text x="337" y="206" text-anchor="middle" font-size="12" fill="#334155">A: 104.20.23.154 / AAAA: 2606:4700:10::…</text>
  <text x="64" y="238" font-size="12" fill="#64748b">拿到的多是 CDN / Anycast 就近节点的 IP，不是源站地址</text>

  <text x="64" y="274" font-size="13" fill="#15803d">② TCP 三次握手：确认双向可达</text>
  <line x1="250" y1="294" x2="836" y2="294" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-req)"/>
  <text x="543" y="288" text-anchor="middle" font-size="12" fill="#334155">SYN  seq=x   src=51816 → dst=443</text>
  <line x1="836" y1="320" x2="250" y2="320" stroke="#059669" stroke-width="2" marker-end="url(#ah-res)"/>
  <text x="543" y="314" text-anchor="middle" font-size="12" fill="#334155">SYN+ACK  seq=y, ack=x+1</text>
  <line x1="250" y1="346" x2="836" y2="346" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-req)"/>
  <text x="543" y="340" text-anchor="middle" font-size="12" fill="#334155">ACK  ack=y+1　→　双方 ESTABLISHED</text>

  <text x="64" y="374" font-size="13" fill="#15803d">③ TLS 握手：协商密钥 + 验证证书</text>
  <line x1="250" y1="394" x2="836" y2="394" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-req)"/>
  <text x="543" y="388" text-anchor="middle" font-size="12" fill="#334155">ClientHello（SNI=example.com + 支持的套件 + key_share）</text>
  <line x1="836" y1="420" x2="250" y2="420" stroke="#059669" stroke-width="2" marker-end="url(#ah-res)"/>
  <text x="543" y="414" text-anchor="middle" font-size="12" fill="#334155">ServerHello（选定套件 + key_share）+ 证书 + Finished</text>
  <text x="64" y="444" font-size="12" fill="#64748b">TLS 1.3 一个往返；TLS 1.2 多一个往返。证书验证：链 → 域名 → 有效期 → 用途 / 吊销</text>

  <text x="64" y="470" font-size="13" fill="#15803d">④ 发送 HTTP 请求</text>
  <line x1="250" y1="488" x2="836" y2="488" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-req)"/>
  <text x="543" y="482" text-anchor="middle" font-size="12" fill="#334155">GET / HTTP/1.1　Host: example.com</text>

  <text x="64" y="518" font-size="13" fill="#b45309">⑤~⑨ 自上而下逐层封装（一次网络往返都没有）</text>

  <rect x="140" y="530" width="290" height="28" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="150" y="549" font-size="13" fill="#1e40af">⑤ HTTP 报文（应用层，纯文本）</text>

  <rect x="140" y="566" width="100" height="28" rx="4" fill="#fed7aa" stroke="#ea580c"/>
  <text x="190" y="585" text-anchor="middle" font-size="12" fill="#7c2d12">⑥ TCP 头</text>
  <rect x="246" y="566" width="290" height="28" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="391" y="585" text-anchor="middle" font-size="12" fill="#1e40af">HTTP 报文　→　段 segment</text>

  <rect x="140" y="602" width="86" height="28" rx="4" fill="#bbf7d0" stroke="#059669"/>
  <text x="183" y="621" text-anchor="middle" font-size="12" fill="#065f46">⑦ IP 头</text>
  <rect x="232" y="602" width="96" height="28" rx="4" fill="#fed7aa" stroke="#ea580c"/>
  <text x="280" y="621" text-anchor="middle" font-size="12" fill="#7c2d12">TCP 头</text>
  <rect x="334" y="602" width="290" height="28" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="479" y="621" text-anchor="middle" font-size="12" fill="#1e40af">HTTP 报文　→　包 packet</text>

  <rect x="140" y="638" width="112" height="28" rx="4" fill="#e9d5ff" stroke="#7c3aed"/>
  <text x="196" y="657" text-anchor="middle" font-size="12" fill="#5b21b6">⑧ 以太网头</text>
  <rect x="258" y="638" width="80" height="28" rx="4" fill="#bbf7d0" stroke="#059669"/>
  <text x="298" y="657" text-anchor="middle" font-size="12" fill="#065f46">IP 头</text>
  <rect x="344" y="638" width="90" height="28" rx="4" fill="#fed7aa" stroke="#ea580c"/>
  <text x="389" y="657" text-anchor="middle" font-size="12" fill="#7c2d12">TCP 头</text>
  <rect x="440" y="638" width="230" height="28" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="555" y="657" text-anchor="middle" font-size="12" fill="#1e40af">HTTP 报文</text>
  <rect x="676" y="638" width="62" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="707" y="657" text-anchor="middle" font-size="12" fill="#334155">FCS</text>
  <text x="750" y="657" font-size="12" fill="#334155">→　帧 frame</text>

  <rect x="140" y="674" width="598" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="439" y="693" text-anchor="middle" font-size="12" fill="#334155">⑨ 物理层：转成电 / 光 / 无线信号（比特流）发出去</text>

  <text x="750" y="549" font-size="12" fill="#64748b">每层只加</text>
  <text x="750" y="567" font-size="12" fill="#64748b">自己那一层</text>
  <text x="750" y="585" font-size="12" fill="#64748b">的头，应用</text>
  <text x="750" y="603" font-size="12" fill="#64748b">数据本身</text>
  <text x="750" y="621" font-size="12" fill="#64748b">不动</text>
  <text x="64" y="722" font-size="12" fill="#64748b">📐 MTU 1500 − 20（IP 头）− 20（TCP 头）= 1460 字节 = MSS；目的 MAC 填的是「网关 MAC」</text>

  <text x="64" y="758" font-size="13" fill="#6d28d9">⑩ 逐跳转发：交换机 → 路由器 → 运营商 AS / BGP → 目标侧节点</text>
  <line x1="250" y1="778" x2="836" y2="778" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-req)"/>
  <text x="543" y="772" text-anchor="middle" font-size="12" fill="#334155">每跳重写源 / 目的 MAC、TTL − 1；NAT 处改写源 IP:端口 10.44.147.158:51816 → 203.0.113.9:40001</text>

  <text x="64" y="806" font-size="13" fill="#6d28d9">⑪ 服务端自下而上解封装（每层只剥自己的头）</text>
  <rect x="140" y="818" width="598" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="439" y="836" text-anchor="middle" font-size="12" fill="#334155">物理层收信号 → 网卡校验 FCS / MAC：这一帧是给我的吗</text>
  <rect x="140" y="850" width="598" height="26" rx="4" fill="#bbf7d0" stroke="#059669"/>
  <text x="439" y="868" text-anchor="middle" font-size="12" fill="#065f46">IP 层：目的 IP 是我吗？TTL 还有效吗？校验和对吗？协议是 TCP 吗？</text>
  <rect x="140" y="882" width="598" height="26" rx="4" fill="#fed7aa" stroke="#ea580c"/>
  <text x="439" y="900" text-anchor="middle" font-size="12" fill="#7c2d12">TCP 层：校验和、序号是否连续、四元组对应哪个 socket（找到监听 443 的进程）</text>
  <rect x="140" y="914" width="598" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="439" y="932" text-anchor="middle" font-size="12" fill="#1e40af">应用层：交给那个进程；若是 L7 反向代理 / LB，在此终结 TCP 并新开一条连后端</text>

  <text x="64" y="964" font-size="13" fill="#6d28d9">⑫ 处理请求、生成响应</text>
  <rect x="755" y="946" width="200" height="30" rx="6" fill="#d1fae5" stroke="#059669"/>
  <text x="855" y="966" text-anchor="middle" font-size="12" fill="#065f46">CDN 命中缓存 / 回源后返回</text>

  <text x="64" y="1010" font-size="13" fill="#6d28d9">⑬ 回程：源与目的对调，可能走完全不同的 AS 路径</text>
  <line x1="836" y1="1030" x2="250" y2="1030" stroke="#059669" stroke-width="2" marker-end="url(#ah-res)"/>
  <text x="543" y="1024" text-anchor="middle" font-size="12" fill="#334155">104.20.23.154:443 → 10.44.147.158:51816（网关按 conntrack 还原地址）</text>
  <path d="M836,1052 C700,1074 380,1074 250,1052" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="543" y="1072" text-anchor="middle" font-size="12" fill="#64748b">回程也可以沿另一条路径回来（跨 AS 时两个方向各自选路）</text>

  <rect x="10" y="1096" width="1020" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="520" y="1120" text-anchor="middle" font-size="13" fill="#0f172a">一句话收尾：去程「加了四层头」，回程「剥了四层头」，中间每一跳都可能改写 MAC / IP / 端口</text>
  <text x="520" y="1141" text-anchor="middle" font-size="12" fill="#475569">所以「抓包看到的源 IP 与客户端说的不一样」完全正常——取决于你在哪儿抓包</text>
</svg>
