<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">丢一个段之后谁被连坐：1.1 的 6 条连接、2 的一条 TCP、3 的独立流</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">连坐范围取决于「丢包点之后必须按序交付的那条序号流」有多宽</text>

  <rect x="40" y="78" width="280" height="58" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="180" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#075985">HTTP/1.1</text>
  <text x="180" y="124" text-anchor="middle" font-size="11" fill="#075985">6 条 TCP 连接，各自一套序号</text>

  <rect x="360" y="78" width="280" height="58" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="500" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">HTTP/2</text>
  <text x="500" y="124" text-anchor="middle" font-size="11" fill="#5b21b6">1 条 TCP，多流共用一套序号</text>

  <rect x="680" y="78" width="280" height="58" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="820" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">HTTP/3</text>
  <text x="820" y="124" text-anchor="middle" font-size="11" fill="#166534">1 条 QUIC，每条流各自一套序号</text>

  <text x="54" y="156" font-size="10" fill="#64748b">连接 1</text>
  <text x="54" y="198" font-size="10" fill="#64748b">连接 2</text>
  <text x="54" y="240" font-size="10" fill="#dc2626">连接 3</text>
  <text x="54" y="282" font-size="10" fill="#64748b">连接 4</text>
  <text x="54" y="324" font-size="10" fill="#64748b">连接 5</text>
  <text x="54" y="366" font-size="10" fill="#64748b">连接 6</text>

  <rect x="108" y="144" width="54" height="20" fill="#dcfce7" stroke="#15803d"/>
  <rect x="172" y="144" width="54" height="20" fill="#dcfce7" stroke="#15803d"/>
  <rect x="236" y="144" width="54" height="20" fill="#dcfce7" stroke="#15803d"/>
  <rect x="108" y="186" width="54" height="20" fill="#dcfce7" stroke="#15803d"/>
  <rect x="172" y="186" width="54" height="20" fill="#dcfce7" stroke="#15803d"/>
  <rect x="236" y="186" width="54" height="20" fill="#dcfce7" stroke="#15803d"/>
  <rect x="108" y="228" width="54" height="20" fill="#dcfce7" stroke="#15803d"/>
  <rect x="172" y="228" width="54" height="20" fill="#fef2f2" stroke="#dc2626"/>
  <text x="199" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">×</text>
  <rect x="236" y="228" width="54" height="20" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="263" y="243" text-anchor="middle" font-size="10" fill="#475569">等</text>
  <rect x="108" y="270" width="54" height="20" fill="#dcfce7" stroke="#15803d"/>
  <rect x="172" y="270" width="54" height="20" fill="#dcfce7" stroke="#15803d"/>
  <rect x="236" y="270" width="54" height="20" fill="#dcfce7" stroke="#15803d"/>
  <rect x="108" y="312" width="54" height="20" fill="#dcfce7" stroke="#15803d"/>
  <rect x="172" y="312" width="54" height="20" fill="#dcfce7" stroke="#15803d"/>
  <rect x="236" y="312" width="54" height="20" fill="#dcfce7" stroke="#15803d"/>
  <rect x="108" y="354" width="54" height="20" fill="#dcfce7" stroke="#15803d"/>
  <rect x="172" y="354" width="54" height="20" fill="#dcfce7" stroke="#15803d"/>
  <rect x="236" y="354" width="54" height="20" fill="#dcfce7" stroke="#15803d"/>

  <text x="300" y="243" font-size="10" fill="#b91c1c">只这条等</text>
  <text x="180" y="410" text-anchor="middle" font-size="11" fill="#334155">其余 5 条连接照常交付</text>
  <text x="180" y="448" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">丢包只影响 1 条连接</text>

  <rect x="374" y="158" width="252" height="252" rx="8" fill="#f8fafc" stroke="#475569"/>
  <text x="500" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">TCP 连接（唯一）</text>

  <text x="382" y="204" font-size="10" fill="#64748b">流 1</text>
  <text x="382" y="252" font-size="10" fill="#64748b">流 3</text>
  <text x="382" y="300" font-size="10" fill="#64748b">流 5</text>
  <text x="382" y="348" font-size="10" fill="#64748b">流 7</text>

  <rect x="430" y="188" width="50" height="24" fill="#dcfce7" stroke="#15803d"/>
  <rect x="540" y="188" width="50" height="24" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="600" y="188" width="50" height="24" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="430" y="236" width="50" height="24" fill="#dcfce7" stroke="#15803d"/>
  <rect x="540" y="236" width="50" height="24" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="600" y="236" width="50" height="24" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="430" y="284" width="50" height="24" fill="#dcfce7" stroke="#15803d"/>
  <rect x="540" y="284" width="50" height="24" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="600" y="284" width="50" height="24" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="430" y="332" width="50" height="24" fill="#dcfce7" stroke="#15803d"/>
  <rect x="540" y="332" width="50" height="24" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="600" y="332" width="50" height="24" fill="#e2e8f0" stroke="#94a3b8"/>

  <line x1="512" y1="182" x2="512" y2="366" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="512" y="392" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">这里丢一个段</text>
  <text x="500" y="448" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">洞之后的所有流一起等</text>

  <rect x="694" y="158" width="252" height="252" rx="8" fill="#f8fafc" stroke="#1e293b"/>
  <text x="820" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">QUIC 连接（唯一）</text>

  <text x="702" y="204" font-size="10" fill="#64748b">流 1</text>
  <text x="702" y="252" font-size="10" fill="#64748b">流 3</text>
  <text x="702" y="300" font-size="10" fill="#64748b">流 5</text>
  <text x="702" y="348" font-size="10" fill="#64748b">流 7</text>

  <rect x="750" y="188" width="50" height="24" fill="#dcfce7" stroke="#15803d"/>
  <rect x="810" y="188" width="50" height="24" fill="#dcfce7" stroke="#15803d"/>
  <rect x="870" y="188" width="50" height="24" fill="#dcfce7" stroke="#15803d"/>
  <rect x="750" y="236" width="50" height="24" fill="#dcfce7" stroke="#15803d"/>
  <rect x="810" y="236" width="50" height="24" fill="#fef2f2" stroke="#dc2626"/>
  <text x="835" y="253" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">×</text>
  <rect x="870" y="236" width="50" height="24" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="895" y="253" text-anchor="middle" font-size="10" fill="#475569">等</text>
  <rect x="750" y="284" width="50" height="24" fill="#dcfce7" stroke="#15803d"/>
  <rect x="810" y="284" width="50" height="24" fill="#dcfce7" stroke="#15803d"/>
  <rect x="870" y="284" width="50" height="24" fill="#dcfce7" stroke="#15803d"/>
  <rect x="750" y="332" width="50" height="24" fill="#dcfce7" stroke="#15803d"/>
  <rect x="810" y="332" width="50" height="24" fill="#dcfce7" stroke="#15803d"/>
  <rect x="870" y="332" width="50" height="24" fill="#dcfce7" stroke="#15803d"/>

  <text x="820" y="392" text-anchor="middle" font-size="10" fill="#475569">洞只属于流 3 的序号空间</text>
  <text x="820" y="410" text-anchor="middle" font-size="11" fill="#334155">拥塞窗口仍是连接级，所有流一起降速</text>
  <text x="820" y="448" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">只有丢包那条流等</text>

  <rect x="40" y="470" width="920" height="76" rx="10" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="56" y="492" font-size="12" font-weight="bold" fill="#115e59">连坐范围 = 丢包点之后必须按序交付的那条序号流</text>
  <text x="56" y="512" font-size="12" fill="#134e4a">H2 的序号流是整条 TCP，所以所有流一起等；H3 的序号流是单条 QUIC 流，所以只有丢包那条等。</text>
  <text x="56" y="532" font-size="12" fill="#134e4a">注意：H3 去掉的是「交付阻塞」，不是「拥塞控制耦合」——丢包仍会让整条连接的窗口下降，所有流一起降速。</text>
</svg>
