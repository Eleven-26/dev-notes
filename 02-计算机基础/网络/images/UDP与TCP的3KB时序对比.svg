<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arwt" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一份 3 KB：TCP 与 UDP 的时序对比</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">TCP 用两个往返换确定性；UDP 省掉这两个往返，把确定性留给应用层</text>

  <rect x="20" y="68" width="470" height="400" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="36" y="94" font-size="14" font-weight="bold" fill="#1e3a8a">TCP：8 个报文，2 个 RTT（不含 DNS）</text>
  <line x1="150" y1="112" x2="150" y2="360" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <line x1="370" y1="112" x2="370" y2="360" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <text x="150" y="108" text-anchor="middle" font-size="11.5" fill="#334155">客户端</text>
  <text x="370" y="108" text-anchor="middle" font-size="11.5" fill="#334155">服务端</text>

  <line x1="150" y1="135" x2="366" y2="135" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="258" y="129" text-anchor="middle" font-size="10.5" fill="#1e3a8a">SYN</text>
  <line x1="370" y1="160" x2="154" y2="160" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="258" y="154" text-anchor="middle" font-size="10.5" fill="#1e3a8a">SYN+ACK</text>
  <line x1="150" y1="185" x2="366" y2="185" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="258" y="179" text-anchor="middle" font-size="10.5" fill="#1e3a8a">ACK</text>

  <line x1="150" y1="220" x2="366" y2="220" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="258" y="214" text-anchor="middle" font-size="10.5" fill="#1e3a8a">数据① 1460</text>
  <line x1="150" y1="245" x2="366" y2="245" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="258" y="239" text-anchor="middle" font-size="10.5" fill="#1e3a8a">数据② 1460</text>
  <line x1="150" y1="270" x2="366" y2="270" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="258" y="264" text-anchor="middle" font-size="10.5" fill="#1e3a8a">数据③ 152</text>

  <line x1="370" y1="300" x2="154" y2="300" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="258" y="294" text-anchor="middle" font-size="10.5" fill="#1e3a8a">ACK 2921</text>
  <line x1="370" y1="325" x2="154" y2="325" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="258" y="319" text-anchor="middle" font-size="10.5" fill="#1e3a8a">ACK 3072</text>

  <line x1="392" y1="135" x2="392" y2="185" stroke="#1e3a8a" stroke-width="1.2"/>
  <text x="400" y="164" font-size="10.5" fill="#1e3a8a">握手 1 RTT</text>
  <line x1="392" y1="220" x2="392" y2="325" stroke="#1e3a8a" stroke-width="1.2"/>
  <text x="400" y="277" font-size="10.5" fill="#1e3a8a">数据 1 RTT</text>

  <text x="36" y="392" font-size="11.5" fill="#1e3a8a">8 个报文 = 3 个握手 + 3 个数据 + 2 个 ACK</text>
  <text x="36" y="416" font-size="11.5" fill="#1e3a8a">丢了内核补，应用只看到「慢了一点」</text>

  <rect x="510" y="68" width="470" height="400" rx="10" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="526" y="94" font-size="14" font-weight="bold" fill="#115e59">UDP：5 个报文（含 DNS 2 个），0 个握手 RTT</text>
  <line x1="640" y1="112" x2="640" y2="360" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <line x1="880" y1="112" x2="880" y2="360" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <text x="640" y="108" text-anchor="middle" font-size="11.5" fill="#334155">客户端</text>
  <text x="880" y="108" text-anchor="middle" font-size="11.5" fill="#334155">服务端</text>

  <line x1="640" y1="135" x2="876" y2="135" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arwt)"/>
  <text x="758" y="129" text-anchor="middle" font-size="10.5" fill="#115e59">DNS 查询（UDP 53）</text>
  <line x1="880" y1="160" x2="644" y2="160" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arwt)"/>
  <text x="758" y="154" text-anchor="middle" font-size="10.5" fill="#115e59">DNS 响应：拿到 IP</text>

  <line x1="640" y1="205" x2="876" y2="205" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arwt)"/>
  <text x="758" y="199" text-anchor="middle" font-size="10.5" fill="#115e59">数据① 1472</text>
  <line x1="640" y1="230" x2="876" y2="230" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arwt)"/>
  <text x="758" y="224" text-anchor="middle" font-size="10.5" fill="#115e59">数据② 1472</text>
  <line x1="640" y1="255" x2="876" y2="255" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arwt)"/>
  <text x="758" y="249" text-anchor="middle" font-size="10.5" fill="#115e59">数据③ 128</text>

  <line x1="880" y1="290" x2="644" y2="290" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwt)"/>
  <text x="758" y="284" text-anchor="middle" font-size="10.5" fill="#115e59">应用层确认（协议自己定义，可选）</text>

  <text x="526" y="336" font-size="10.5" fill="#115e59">拿到 IP 即发，中间没有任何握手报文</text>

  <text x="526" y="392" font-size="11.5" fill="#115e59">sendto 返回只代表交给了本机协议栈</text>
  <text x="526" y="416" font-size="11.5" fill="#b91c1c">对方收没收到，图上没有任何报文能证明</text>

  <text x="500" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">TCP 的 2 个 RTT 买到重传与排序；UDP 的 0 个 RTT 把这份工作原样交给应用</text>
</svg>
