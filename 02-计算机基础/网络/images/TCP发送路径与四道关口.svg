<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arwRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">TCP 发送路径：write 返回之后还要过四道关</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">write 返回只代表进了本机发送缓冲；后面四道关各有自己的阻塞或丢弃，应用侧都看不到</text>

  <rect x="30" y="90" width="170" height="86" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="115" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">应用 write</text>
  <text x="115" y="138" text-anchor="middle" font-size="11" fill="#075985">3072 字节一次写入</text>
  <text x="115" y="158" text-anchor="middle" font-size="11" fill="#075985">返回 = 进了发送缓冲</text>

  <rect x="220" y="90" width="170" height="86" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="305" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">发送队列</text>
  <text x="305" y="138" text-anchor="middle" font-size="11" fill="#5b21b6">sk_write_queue</text>
  <text x="305" y="158" text-anchor="middle" font-size="11" fill="#5b21b6">上限 SO_SNDBUF</text>

  <rect x="410" y="90" width="170" height="86" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="495" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">TCP 输出</text>
  <text x="495" y="138" text-anchor="middle" font-size="11" fill="#9a3412">取 min(cwnd, rwnd)</text>
  <text x="495" y="158" text-anchor="middle" font-size="11" fill="#9a3412">重传也从这里走</text>

  <rect x="600" y="90" width="170" height="86" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="685" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">qdisc 队列</text>
  <text x="685" y="138" text-anchor="middle" font-size="11" fill="#166534">fq_codel / pfifo</text>
  <text x="685" y="158" text-anchor="middle" font-size="11" fill="#166534">上限 txqueuelen</text>

  <rect x="790" y="90" width="170" height="86" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="875" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">TX ring / 网卡</text>
  <text x="875" y="138" text-anchor="middle" font-size="11" fill="#075985">TSO/GSO 才真正切段</text>
  <text x="875" y="158" text-anchor="middle" font-size="11" fill="#075985">出网卡才算上线</text>

  <line x1="200" y1="133" x2="220" y2="133" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="390" y1="133" x2="410" y2="133" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="580" y1="133" x2="600" y2="133" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="770" y1="133" x2="790" y2="133" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <line x1="115" y1="176" x2="115" y2="222" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="305" y1="176" x2="305" y2="222" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwRed)"/>
  <line x1="495" y1="176" x2="495" y2="222" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwRed)"/>
  <line x1="685" y1="176" x2="685" y2="222" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwRed)"/>
  <line x1="875" y1="176" x2="875" y2="222" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwRed)"/>

  <rect x="30" y="226" width="170" height="96" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="115" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">起点：write 返回</text>
  <text x="115" y="274" text-anchor="middle" font-size="11" fill="#475569">只代表字节进了</text>
  <text x="115" y="292" text-anchor="middle" font-size="11" fill="#475569">内核发送缓冲</text>
  <text x="115" y="310" text-anchor="middle" font-size="11" fill="#475569">不等于已上线</text>

  <rect x="220" y="226" width="170" height="96" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="305" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">① 队列满</text>
  <text x="305" y="274" text-anchor="middle" font-size="11" fill="#b91c1c">write 阻塞 / EAGAIN</text>
  <text x="305" y="292" text-anchor="middle" font-size="11" fill="#b91c1c">ss -tin 看 Send-Q</text>
  <text x="305" y="310" text-anchor="middle" font-size="11" fill="#b91c1c">ESTABLISHED 为积压</text>

  <rect x="410" y="226" width="170" height="96" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="495" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">② 发不动</text>
  <text x="495" y="274" text-anchor="middle" font-size="11" fill="#b91c1c">不是丢，是等 ACK</text>
  <text x="495" y="292" text-anchor="middle" font-size="11" fill="#b91c1c">cwnd / rwnd 决定速度</text>
  <text x="495" y="310" text-anchor="middle" font-size="11" fill="#b91c1c">窗口小则吞吐封顶</text>

  <rect x="600" y="226" width="170" height="96" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="685" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">③ qdisc 满</text>
  <text x="685" y="274" text-anchor="middle" font-size="11" fill="#b91c1c">tc -s qdisc eth0</text>
  <text x="685" y="292" text-anchor="middle" font-size="11" fill="#b91c1c">dropped / overlimits</text>
  <text x="685" y="310" text-anchor="middle" font-size="11" fill="#b91c1c">突发的第一道坎</text>

  <rect x="790" y="226" width="170" height="96" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="875" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">④ TX ring 满</text>
  <text x="875" y="274" text-anchor="middle" font-size="11" fill="#b91c1c">/proc/net/dev</text>
  <text x="875" y="292" text-anchor="middle" font-size="11" fill="#b91c1c">看 tx drop 列</text>
  <text x="875" y="310" text-anchor="middle" font-size="11" fill="#b91c1c">ethtool -S eth0</text>

  <rect x="30" y="348" width="940" height="86" rx="10" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="46" y="374" font-size="13" font-weight="bold" fill="#115e59">「写成功」有三种含义，别混为一谈</text>
  <text x="46" y="398" font-size="12" fill="#134e4a">write 返回 = 进了本机发送缓冲；出网卡 = 上线（仍可能丢在路上）；收到 ACK = 对端内核收到，还没到应用。</text>
  <text x="46" y="418" font-size="12" fill="#134e4a">本机抓包看到远超 MTU 的「段」是 TSO/GSO 卸载，不是 IP 分片；判断真实 MTU 看 SYN 里的 MSS 选项。</text>
</svg>
