<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="gBlue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="gAmber" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/></marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">跨协议组合：把协议边界放在网关</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">对外 REST / JSON，内部 gRPC / Protobuf，实时推送走 WebSocket 通道——转换集中在网关，而不是每个服务都同时支持多协议</text>

  <rect x="60" y="150" width="170" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="145" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">客户端</text>
  <text x="145" y="208" text-anchor="middle" font-size="11.5" fill="#1e3a8a">浏览器 / App</text>

  <rect x="400" y="120" width="220" height="140" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text x="510" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">API 网关</text>
  <text x="510" y="184" text-anchor="middle" font-size="12" fill="#9a3412">协议转换</text>
  <text x="510" y="208" text-anchor="middle" font-size="12" fill="#9a3412">JSON ↔ Protobuf</text>
  <text x="510" y="232" text-anchor="middle" font-size="12" fill="#9a3412">限流 / 鉴权</text>

  <rect x="780" y="80" width="170" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="865" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">内部服务 A</text>
  <text x="865" y="132" text-anchor="middle" font-size="11.5" fill="#14532d">gRPC</text>

  <rect x="780" y="230" width="170" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="865" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">内部服务 B</text>
  <text x="865" y="282" text-anchor="middle" font-size="11.5" fill="#14532d">gRPC</text>

  <line x1="230" y1="172" x2="394" y2="172" stroke="#2563eb" stroke-width="1.7" marker-end="url(#gBlue)"/>
  <text x="312" y="164" text-anchor="middle" font-size="12" fill="#1e3a8a">HTTP/2 + JSON</text>

  <line x1="394" y1="228" x2="236" y2="228" stroke="#ea580c" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#gAmber)"/>
  <text x="312" y="248" text-anchor="middle" font-size="12" fill="#9a3412">WebSocket / SSE 实时推送</text>

  <line x1="620" y1="150" x2="774" y2="115" stroke="#16a34a" stroke-width="1.7" marker-end="url(#gAmber)"/>
  <text x="697" y="120" text-anchor="middle" font-size="12" fill="#14532d">gRPC + Protobuf</text>

  <line x1="620" y1="230" x2="774" y2="265" stroke="#16a34a" stroke-width="1.7" marker-end="url(#gAmber)"/>
  <text x="697" y="262" text-anchor="middle" font-size="12" fill="#14532d">gRPC + Protobuf</text>

  <text x="60" y="352" font-size="12.5" fill="#334155">要点：请求方向 REST/JSON 进网关 → 转成 Protobuf 分发给内部服务；响应原路返回。</text>
  <text x="60" y="378" font-size="12.5" fill="#334155">要点：实时通道用 WebSocket（双向）或 SSE（单向）承载推送，业务写入仍走普通 HTTP。</text>
  <text x="60" y="404" font-size="12.5" fill="#7f1d1d">注意：长连接要落到同一后端实例（L4 转发或按连接一致性哈希），发布时支持连接优雅迁移，否则发布即掉线。</text>
</svg>
