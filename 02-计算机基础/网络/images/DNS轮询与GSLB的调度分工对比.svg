<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="gB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="gG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="gR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">DNS 轮询与 GSLB 的调度分工</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">左：同一份多值 A 记录，靠顺序轮换；右：同一域名按来源改答；两者都不负责连接级的故障摘除</text>

  <rect x="20" y="74" width="470" height="342" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="36" y="96" font-size="13" font-weight="bold" fill="#1e3a8a">DNS 轮询（Round-Robin A）</text>

  <rect x="60" y="110" width="140" height="42" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="130" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">权威区文件</text>
  <text x="130" y="144" text-anchor="middle" font-size="10.5" fill="#1e3a8a">一条名字多条 A</text>
  <rect x="240" y="110" width="234" height="42" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="252" y="128" font-size="10.5" fill="#334155">www.test. 600 IN A 10.0.0.1</text>
  <text x="252" y="144" font-size="10.5" fill="#334155">… A 10.0.0.2 ／ 10.0.0.3（每次换个顺序）</text>
  <line x1="200" y1="131" x2="236" y2="131" stroke="#2563eb" stroke-width="1.5" marker-end="url(#gB)"/>

  <rect x="60" y="168" width="130" height="42" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="125" y="186" text-anchor="middle" font-size="11" fill="#92400e">LDNS 缓存</text>
  <text x="125" y="202" text-anchor="middle" font-size="10.5" fill="#92400e">按 TTL 原样存</text>
  <line x1="130" y1="152" x2="130" y2="164" stroke="#2563eb" stroke-width="1.5" marker-end="url(#gB)"/>
  <rect x="240" y="168" width="234" height="42" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="252" y="186" font-size="10.5" fill="#7f1d1d">缓存的是「这一批」的顺序，不是每用户</text>
  <text x="252" y="202" font-size="10.5" fill="#7f1d1d">同一个 LDNS 下的人都拿到同一个首选 IP</text>
  <line x1="190" y1="189" x2="236" y2="189" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#gR)"/>

  <rect x="60" y="226" width="414" height="52" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="72" y="245" font-size="10.5" fill="#334155">客户端行为：多数实现只取返回列表的第一条，其余当备份</text>
  <text x="72" y="265" font-size="10.5" fill="#7f1d1d">后果：流量按 LDNS 分桶而不是按客户端分，天然倾斜</text>

  <rect x="60" y="292" width="196" height="106" rx="9" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
  <text x="72" y="312" font-size="11" font-weight="bold" fill="#7f1d1d">轮换管不了的事</text>
  <text x="72" y="333" font-size="10.5" fill="#7f1d1d">10.0.0.2 挂了：TTL 600 内</text>
  <text x="72" y="352" font-size="10.5" fill="#7f1d1d">权威照样把它排进去</text>
  <text x="72" y="371" font-size="10.5" fill="#7f1d1d">客户端超时才试下一条</text>
  <text x="72" y="390" font-size="10.5" fill="#7f1d1d">摘除要等 TTL 走完</text>

  <rect x="272" y="292" width="202" height="106" rx="9" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="284" y="312" font-size="11" font-weight="bold" fill="#14532d">它能做到的</text>
  <text x="284" y="333" font-size="10.5" fill="#14532d">零成本把长连接摊到几台</text>
  <text x="284" y="352" font-size="10.5" fill="#14532d">配合短 TTL（几十秒）</text>
  <text x="284" y="371" font-size="10.5" fill="#14532d">手工改记录做粗粒度切流</text>
  <text x="284" y="390" font-size="10.5" fill="#14532d">无健康检查、无权重</text>

  <rect x="510" y="74" width="470" height="342" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="526" y="96" font-size="13" font-weight="bold" fill="#14532d">GSLB / 智能解析</text>

  <rect x="550" y="110" width="140" height="42" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="620" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">GSLB 权威</text>
  <text x="620" y="144" text-anchor="middle" font-size="10.5" fill="#14532d">按来源现答</text>
  <rect x="726" y="110" width="238" height="42" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="738" y="128" font-size="10.5" fill="#334155">华东 LDNS 来问 → 10.1.0.x（就近）</text>
  <text x="738" y="144" font-size="10.5" fill="#334155">华南 LDNS 来问 → 10.2.0.x（另一机房）</text>
  <line x1="690" y1="131" x2="722" y2="131" stroke="#16a34a" stroke-width="1.5" marker-end="url(#gG)"/>

  <rect x="550" y="168" width="130" height="42" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="615" y="186" text-anchor="middle" font-size="11" fill="#1e3a8a">判据来源</text>
  <text x="615" y="202" text-anchor="middle" font-size="10.5" fill="#1e3a8a">LDNS IP / EDNS CS</text>
  <line x1="615" y1="152" x2="615" y2="164" stroke="#16a34a" stroke-width="1.5" marker-end="url(#gG)"/>
  <rect x="726" y="168" width="238" height="42" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="738" y="186" font-size="10.5" fill="#92400e">ECS 只给前缀（v4 /24、v6 /56）</text>
  <text x="738" y="202" font-size="10.5" fill="#92400e">LDNS 不支持 ECS 时退化看它自己</text>

  <rect x="550" y="226" width="414" height="52" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="562" y="245" font-size="10.5" fill="#334155">同一域名，不同人问 ⇒ 不同答案，缓存按「问题 + 来源」分桶，倾斜显著缓解</text>
  <text x="562" y="265" font-size="10.5" fill="#14532d">健康检查在 DNS 之外：探测失败 ⇒ 直接从返回集里去掉</text>

  <rect x="550" y="292" width="196" height="106" rx="9" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="562" y="312" font-size="11" font-weight="bold" fill="#14532d">GSLB 强项</text>
  <text x="562" y="333" font-size="10.5" fill="#14532d">就近接入、按机房权重</text>
  <text x="562" y="352" font-size="10.5" fill="#14532d">分钟级切大洲流量</text>
  <text x="562" y="371" font-size="10.5" fill="#14532d">挂掉的机房整体摘除</text>
  <text x="562" y="390" font-size="10.5" fill="#14532d">代价：多一跳解析 + 费用</text>

  <rect x="762" y="292" width="202" height="106" rx="9" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
  <text x="774" y="312" font-size="11" font-weight="bold" fill="#7f1d1d">仍然管不了</text>
  <text x="774" y="333" font-size="10.5" fill="#7f1d1d">单台后端 5xx / 慢</text>
  <text x="774" y="352" font-size="10.5" fill="#7f1d1d">已建立连接不受影响</text>
  <text x="774" y="371" font-size="10.5" fill="#7f1d1d">负缓存窗口内旧答案照用</text>
  <text x="774" y="390" font-size="10.5" fill="#7f1d1d">⇒ 这些是四七层 LB 的活</text>

  <rect x="20" y="430" width="960" height="172" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="36" y="456" font-size="12.5" font-weight="bold" fill="#92400e">分工一句话：DNS 决定「连哪台机器」，LB 决定「这条连接交给哪个进程」</text>
  <text x="36" y="480" font-size="12" fill="#92400e">DNS 层能看到的信息只有来源前缀和记录本身，看不到后端负载、连接数、GC 停顿，所以它只能做「粗调度」</text>
  <text x="36" y="502" font-size="12" fill="#92400e">真正按健康与负载摘除要靠四七层：keepalive 探测、连接级重试、失败转移，这些都发生在 TCP 已经建好之后</text>
  <text x="36" y="524" font-size="12" fill="#7f1d1d">常见事故组合：RR 记录 TTL 600 + 后端只有一台活着 ⇒ 切流后仍有 10 分钟流量打到死地址；改短 TTL 只是缓解</text>
  <text x="36" y="546" font-size="12" fill="#7f1d1d">要「秒级摘除」就必须把入口从 DNS 换成 LB（或 Anycast），DNS 只解析到 VIP，后端涨跌与解析无关</text>
  <text x="36" y="578" font-size="12" fill="#334155">本机实测：example.com 一条名字返回两条 A（172.66.147.243、104.20.23.154，同为 TTL 600），取哪条由本地实现决定</text>
</svg>
