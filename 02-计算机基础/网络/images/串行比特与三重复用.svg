<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">串行传输与三重复用</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">单个波长一位一位发；扩容靠加波长、加纤芯、分时隙，不是把一位拆成八路</text>

  <rect x="20" y="68" width="960" height="170" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="36" y="92" font-size="14" font-weight="bold" fill="#1e3a8a">① 单个波长：串行，同一时刻线上只有一位</text>
  <line x1="42" y1="110" x2="580" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="40" y="120" width="40" height="38" fill="#dbeafe" stroke="#2563eb"/>
  <text x="60" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">1</text>
  <rect x="86" y="120" width="40" height="38" fill="#eff6ff" stroke="#2563eb"/>
  <text x="106" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">0</text>
  <rect x="132" y="120" width="40" height="38" fill="#dbeafe" stroke="#2563eb"/>
  <text x="152" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">1</text>
  <rect x="178" y="120" width="40" height="38" fill="#dbeafe" stroke="#2563eb"/>
  <text x="198" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">1</text>
  <rect x="224" y="120" width="40" height="38" fill="#eff6ff" stroke="#2563eb"/>
  <text x="244" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">0</text>
  <rect x="270" y="120" width="40" height="38" fill="#dbeafe" stroke="#2563eb"/>
  <text x="290" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">1</text>
  <rect x="316" y="120" width="40" height="38" fill="#eff6ff" stroke="#2563eb"/>
  <text x="336" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">0</text>
  <rect x="362" y="120" width="40" height="38" fill="#eff6ff" stroke="#2563eb"/>
  <text x="382" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">0</text>
  <rect x="408" y="120" width="40" height="38" fill="#dbeafe" stroke="#2563eb"/>
  <text x="428" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">1</text>
  <rect x="454" y="120" width="40" height="38" fill="#dbeafe" stroke="#2563eb"/>
  <text x="474" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">1</text>
  <rect x="500" y="120" width="40" height="38" fill="#eff6ff" stroke="#2563eb"/>
  <text x="520" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">0</text>
  <rect x="546" y="120" width="40" height="38" fill="#dbeafe" stroke="#2563eb"/>
  <text x="566" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">1</text>

  <text x="40" y="184" font-size="12" fill="#334155">发送：字节 → 比特串，按位依次发出</text>
  <text x="40" y="206" font-size="12" fill="#334155">接收：时钟恢复 → 逐位采样 → 帧定界 → FCS 检错</text>

  <rect x="610" y="112" width="350" height="96" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="624" y="136" font-size="11.5" fill="#92400e">定界：前导码 + SFD 找帧头</text>
  <text x="624" y="160" font-size="11.5" fill="#92400e">编码：8b/10b、64b/66b 保证跳变</text>
  <text x="624" y="184" font-size="11.5" fill="#92400e">检错：FCS（CRC32）错了整帧丢</text>

  <rect x="20" y="252" width="306" height="300" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="34" y="278" font-size="14" font-weight="bold" fill="#1e3a8a">② 加波长（WDM）</text>
  <rect x="40" y="292" width="266" height="150" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <line x1="140" y1="320" x2="292" y2="320" stroke="#dc2626" stroke-width="3"/>
  <line x1="140" y1="352" x2="292" y2="352" stroke="#ea580c" stroke-width="3"/>
  <line x1="140" y1="384" x2="292" y2="384" stroke="#16a34a" stroke-width="3"/>
  <line x1="140" y1="416" x2="292" y2="416" stroke="#7c3aed" stroke-width="3"/>
  <text x="54" y="324" font-size="11" fill="#334155">λ1 10G</text>
  <text x="54" y="356" font-size="11" fill="#334155">λ2 10G</text>
  <text x="54" y="388" font-size="11" fill="#334155">λ3 10G</text>
  <text x="54" y="420" font-size="11" fill="#334155">λ4 10G</text>
  <text x="34" y="472" font-size="11.5" fill="#1e3a8a">一根纤 40~96 个波长，频率隔开</text>
  <text x="34" y="494" font-size="11.5" fill="#1e3a8a">每个波长各跑一路串行比特流</text>
  <text x="34" y="516" font-size="11.5" fill="#1e3a8a">扩容 = 加波长，不必换光纤</text>

  <rect x="336" y="252" width="306" height="300" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="350" y="278" font-size="14" font-weight="bold" fill="#5b21b6">③ 加纤芯（空间）</text>
  <circle cx="489" cy="372" r="64" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="461" cy="344" r="17" fill="#ddd6fe" stroke="#6d28d9"/>
  <circle cx="517" cy="344" r="17" fill="#ddd6fe" stroke="#6d28d9"/>
  <circle cx="461" cy="400" r="17" fill="#ddd6fe" stroke="#6d28d9"/>
  <circle cx="517" cy="400" r="17" fill="#ddd6fe" stroke="#6d28d9"/>
  <text x="350" y="472" font-size="11.5" fill="#5b21b6">光缆几十到几百芯，彼此独立</text>
  <text x="350" y="494" font-size="11.5" fill="#5b21b6">数据中心 100G 常用 4 对纤并行</text>
  <text x="350" y="516" font-size="11.5" fill="#5b21b6">400G 短距用 8 对纤（MPO）</text>

  <rect x="652" y="252" width="328" height="300" rx="10" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="666" y="278" font-size="14" font-weight="bold" fill="#115e59">④ 分时隙（PON 上行）</text>
  <line x1="672" y1="336" x2="968" y2="336" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <rect x="676" y="302" width="58" height="34" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="705" y="324" text-anchor="middle" font-size="10" fill="#115e59">ONT-1</text>
  <rect x="738" y="302" width="18" height="34" fill="#fee2e2" stroke="#dc2626"/>
  <rect x="760" y="302" width="58" height="34" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="789" y="324" text-anchor="middle" font-size="10" fill="#115e59">ONT-2</text>
  <rect x="822" y="302" width="18" height="34" fill="#fee2e2" stroke="#dc2626"/>
  <rect x="844" y="302" width="58" height="34" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="873" y="324" text-anchor="middle" font-size="10" fill="#115e59">ONT-3</text>
  <rect x="906" y="302" width="50" height="34" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="931" y="324" text-anchor="middle" font-size="10" fill="#475569">空闲</text>
  <text x="900" y="358" font-size="11" fill="#475569">时间</text>
  <text x="666" y="392" font-size="11" fill="#b91c1c">红条 = guard band（保护间隔）</text>
  <text x="666" y="472" font-size="11.5" fill="#115e59">OLT 按 DBA 给每个 ONT 分时隙</text>
  <text x="666" y="494" font-size="11.5" fill="#115e59">只有拿到授权的 ONT 才能发光</text>
  <text x="666" y="516" font-size="11.5" fill="#115e59">某台常发光（rogue ONU）→ 整口断</text>

  <text x="500" y="586" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">串行不等于共享：每段光纤同一时刻只有一束光在传，隔离靠帧标签、授权时隙、波长间隔与 FCS</text>
</svg>
