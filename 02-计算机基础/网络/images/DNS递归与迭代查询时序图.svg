<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="qB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="qO" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/></marker>
    <marker id="qG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="qR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">DNS 递归与迭代查询调用时序</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">客户端到 LDNS 只有一段递归（RD=1）；LDNS 到根、TLD、权威是三次迭代（RD=0），实测时延标在箭头上</text>

  <rect x="28" y="76" width="132" height="50" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="94" y="97" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">客户端</text>
  <text x="94" y="116" text-anchor="middle" font-size="10.5" fill="#1e3a8a">浏览器 / getaddrinfo</text>
  <rect x="196" y="76" width="128" height="50" rx="11" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="260" y="97" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">本机缓存</text>
  <text x="260" y="116" text-anchor="middle" font-size="10.5" fill="#64748b">hosts + OS 缓存</text>
  <rect x="360" y="76" width="140" height="50" rx="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="430" y="97" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">LDNS</text>
  <text x="430" y="116" text-anchor="middle" font-size="10.5" fill="#92400e">223.5.5.5（递归器）</text>
  <rect x="536" y="76" width="112" height="50" rx="11" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="592" y="97" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">根服务器</text>
  <text x="592" y="116" text-anchor="middle" font-size="10.5" fill="#64748b">a.root-servers</text>
  <rect x="682" y="76" width="122" height="50" rx="11" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="743" y="97" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">.com TLD</text>
  <text x="743" y="116" text-anchor="middle" font-size="10.5" fill="#7c2d12">a.gtld-servers</text>
  <rect x="840" y="76" width="132" height="50" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="906" y="97" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">权威 NS</text>
  <text x="906" y="116" text-anchor="middle" font-size="10.5" fill="#14532d">hera.cloudflare</text>

  <line x1="94" y1="126" x2="94" y2="486" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 5"/>
  <line x1="260" y1="126" x2="260" y2="486" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 5"/>
  <line x1="430" y1="126" x2="430" y2="486" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 5"/>
  <line x1="592" y1="126" x2="592" y2="486" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 5"/>
  <line x1="743" y1="126" x2="743" y2="486" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 5"/>
  <line x1="906" y1="126" x2="906" y2="486" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 5"/>

  <rect x="188" y="140" width="144" height="40" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="260" y="157" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">命中则止步</text>
  <text x="260" y="173" text-anchor="middle" font-size="10.5" fill="#14532d">hosts 0ms / 缓存 4ms</text>
  <line x1="98" y1="160" x2="184" y2="160" stroke="#16a34a" stroke-width="1.5" marker-end="url(#qG)"/>
  <line x1="184" y1="175" x2="100" y2="175" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#qG)"/>

  <rect x="24" y="196" width="820" height="28" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="434" y="215" text-anchor="middle" font-size="12" fill="#92400e">第一段：递归 —— 客户端把「问到答案为止」整包交给 LDNS，报文 RD=1</text>
  <line x1="98" y1="240" x2="424" y2="240" stroke="#2563eb" stroke-width="1.7" marker-end="url(#qB)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11" fill="#1e3a8a">① example.com A（RD=1） 实测 Query time 88 ms</text>
  <line x1="426" y1="262" x2="100" y2="262" stroke="#16a34a" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#qG)"/>
  <text x="264" y="252" text-anchor="middle" font-size="11" fill="#14532d">⑥ flags: qr rd ra，600 IN A ×2</text>

  <rect x="24" y="278" width="962" height="28" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="505" y="297" text-anchor="middle" font-size="12" fill="#7c2d12">第二段：迭代 —— LDNS 自己逐层问，每个上游只回「下一个该问谁」（RD=0，ANSWER: 0）</text>

  <line x1="434" y1="322" x2="586" y2="322" stroke="#ea580c" stroke-width="1.7" marker-end="url(#qO)"/>
  <text x="510" y="311" text-anchor="middle" font-size="11" fill="#7c2d12">② com NS（RD=0）</text>
  <line x1="588" y1="344" x2="436" y2="344" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="512" y="336" text-anchor="middle" font-size="10.5" fill="#64748b">AUTHORITY 13 + ADDITIONAL 27（glue）</text>

  <line x1="434" y1="372" x2="737" y2="372" stroke="#ea580c" stroke-width="1.7" marker-end="url(#qO)"/>
  <text x="586" y="361" font-size="11" fill="#7c2d12">③ example.com A（RD=0，跨过根直达 TLD）</text>
  <line x1="739" y1="394" x2="436" y2="394" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="588" y="386" text-anchor="middle" font-size="10.5" fill="#64748b">AUTHORITY 2：NS hera / elliott + glue 108.162.192.162</text>

  <line x1="434" y1="422" x2="900" y2="422" stroke="#16a34a" stroke-width="1.7" marker-end="url(#qG)"/>
  <text x="668" y="411" text-anchor="middle" font-size="11" fill="#14532d">④ example.com A（RD=0，问到权威才给答案）</text>
  <line x1="902" y1="444" x2="436" y2="444" stroke="#16a34a" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#qG)"/>
  <text x="668" y="436" text-anchor="middle" font-size="10.5" fill="#14532d">ANSWER 2 + AUTHORITY 2（SOA）+ ADDITIONAL 13</text>

  <rect x="24" y="458" width="962" height="28" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="505" y="477" text-anchor="middle" font-size="12" fill="#334155">LDNS 按各自 TTL 缓存：委派 172800（48h）走软退出，答案 600 到期后重跑 ②③④</text>

  <rect x="20" y="502" width="470" height="162" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="36" y="526" font-size="12.5" font-weight="bold" fill="#0f172a">本机实测：命中与否差一个数量级</text>
  <text x="36" y="548" font-size="11.5" fill="#334155">未命中（连查 5 次）：96 / 88 / 88 / 164 / 36 ms</text>
  <text x="36" y="569" font-size="11.5" fill="#334155">LDNS 命中：4 / 4 / 8 ms</text>
  <text x="36" y="590" font-size="11.5" fill="#334155">TTL 递减：88 → 85 → 82（每 3s 少 3）</text>
  <text x="36" y="611" font-size="11.5" fill="#334155">CNAME：www.github.com. 487 IN CNAME → 20.205.243.166</text>
  <text x="36" y="632" font-size="11.5" fill="#7f1d1d">hosts 短路：10.20.30.40 w2ra2c-hosts.test 无报文</text>

  <rect x="510" y="502" width="470" height="162" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
  <text x="526" y="526" font-size="12.5" font-weight="bold" fill="#7f1d1d">失败路径各走各的</text>
  <text x="526" y="548" font-size="11.5" fill="#7f1d1d">NXDOMAIN：权威回 RCODE=3，152 ms</text>
  <text x="526" y="569" font-size="11.5" fill="#7f1d1d">NOERROR + ANSWER: 0（NODATA）：有名字没这类记录</text>
  <text x="526" y="590" font-size="11.5" fill="#7f1d1d">SERVFAIL：权威挂了 / DNSSEC 校验失败</text>
  <text x="526" y="611" font-size="11.5" fill="#7f1d1d">超时：递归器重试耗尽，应用层看到的是空应答</text>
  <text x="526" y="632" font-size="11.5" fill="#7f1d1d">负缓存按 SOA 最后字段 1800，四类失败别当一类查</text>
</svg>
