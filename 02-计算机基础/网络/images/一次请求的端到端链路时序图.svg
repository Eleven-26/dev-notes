<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="aBlue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="aAmber" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b45309"/></marker>
    <marker id="aGreen" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一次请求的端到端链路时序图</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">请求从客户端进程出发，经本机协议栈、出口网关 SNAT、公网逐跳转发、目标负载均衡，到达服务端进程；响应原路或经不同路径返回</text>

  <rect x="20" y="142" width="960" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="20" y="186" width="960" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="20" y="286" width="960" height="36" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <rect x="20" y="330" width="960" height="36" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <rect x="20" y="374" width="960" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="20" y="418" width="960" height="36" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>

  <rect x="55" y="78" width="150" height="52" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="130" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">客户端进程</text>
  <text x="130" y="118" text-anchor="middle" font-size="11.5" fill="#1e3a8a">socket</text>
  <rect x="255" y="78" width="150" height="52" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="330" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">本机协议栈</text>
  <text x="330" y="118" text-anchor="middle" font-size="11.5" fill="#1e3a8a">路由表 + ARP</text>
  <rect x="455" y="78" width="150" height="52" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="530" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">出口网关</text>
  <text x="530" y="118" text-anchor="middle" font-size="11.5" fill="#92400e">NAT + 防火墙</text>
  <rect x="655" y="78" width="150" height="52" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="730" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">目标 LB / 代理</text>
  <text x="730" y="118" text-anchor="middle" font-size="11.5" fill="#92400e">L4 转发 / L7 终结</text>
  <rect x="825" y="78" width="150" height="52" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="900" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">服务端进程</text>
  <text x="900" y="118" text-anchor="middle" font-size="11.5" fill="#334155">accept / recv</text>

  <line x1="130" y1="130" x2="130" y2="462" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 5"/>
  <line x1="330" y1="130" x2="330" y2="462" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 5"/>
  <line x1="530" y1="130" x2="530" y2="462" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 5"/>
  <line x1="730" y1="130" x2="730" y2="462" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 5"/>
  <line x1="900" y1="130" x2="900" y2="462" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 5"/>

  <line x1="130" y1="169" x2="324" y2="169" stroke="#2563eb" stroke-width="1.6" marker-end="url(#aBlue)"/>
  <text x="227" y="156" text-anchor="middle" font-size="11.5" fill="#1e3a8a">① 查路由表 → ARP 拿网关 MAC</text>

  <line x1="330" y1="213" x2="524" y2="213" stroke="#2563eb" stroke-width="1.6" marker-end="url(#aBlue)"/>
  <text x="427" y="200" text-anchor="middle" font-size="11.5" fill="#1e3a8a">② SYN, src = 10.44.147.x:54321</text>

  <rect x="390" y="230" width="280" height="48" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="530" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">③ SNAT：改写为 203.0.113.9:40001</text>
  <text x="530" y="268" text-anchor="middle" font-size="11.5" fill="#92400e">同时在 conntrack 里记一行映射</text>

  <line x1="530" y1="313" x2="724" y2="313" stroke="#b45309" stroke-width="1.6" marker-end="url(#aAmber)"/>
  <text x="627" y="300" text-anchor="middle" font-size="11.5" fill="#92400e">④ 经运营商 AS / BGP 逐跳转发（只换 MAC、TTL−1）</text>

  <line x1="730" y1="357" x2="894" y2="357" stroke="#b45309" stroke-width="1.6" marker-end="url(#aAmber)"/>
  <text x="812" y="344" text-anchor="middle" font-size="11.5" fill="#92400e">⑤ DNAT 到后端 / 或 L7 代理新开一条 TCP</text>

  <line x1="130" y1="401" x2="894" y2="401" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aBlue)"/>
  <text x="512" y="388" text-anchor="middle" font-size="11.5" fill="#1e3a8a">⑥ 握手完成后发请求（端到端 IP 不变）</text>

  <line x1="900" y1="445" x2="136" y2="445" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aGreen)"/>
  <text x="512" y="432" text-anchor="middle" font-size="11.5" fill="#14532d">⑦ 响应回程：可能走另一条 AS 路径，经网关反向还原</text>

  <rect x="20" y="472" width="960" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="36" y="496" font-size="12.5" fill="#0f172a">改写点只有三处：网关 SNAT（改源 IP:端口）、LB DNAT（改目的 IP）或 L7 代理（新开一条 TCP）、每跳重写 MAC</text>
  <text x="36" y="519" font-size="12.5" fill="#0f172a">IP 端到端不变（NAT / LB 除外）；端口只有 NAT 会改；TTL 每跳减 1 —— 这三条决定了抓包时你会看到什么</text>
  <text x="36" y="542" font-size="12.5" fill="#334155">回程不一定与去程同路：客户端侧的 traceroute 只画得出「去程」，回程问题要找对端或中间设备配合</text>
  <text x="36" y="568" font-size="12.5" fill="#7f1d1d">长连接被"静默断开"的根因就在③与⑤：会话空闲超时 → 映射被删 → 两端都不知情（心跳要短于最小超时）</text>
</svg>
