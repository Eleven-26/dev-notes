<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">隧道把原始包再套一层头，可用 MTU 被新头吃掉</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">两端还按 1500 算 MSS，就会得到「小包正常、大包卡死」—— 这就是 PMTUD 黑洞的成因</text>
  <defs>
    <marker id="b3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <text x="40" y="120" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">VXLAN</text>
  <text x="40" y="150" font-size="10.5" fill="#64748B" text-anchor="start">K8s 跨节点 Pod（Flannel / Calico 的 VXLAN 模式）</text>
  <rect x="220" y="92" width="200" height="44" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="320" y="120" font-size="11" fill="#991b1b" text-anchor="middle">50 字节</text>
  <rect x="420" y="92" width="440" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="640" y="120" font-size="11" fill="#1e3a8a" text-anchor="middle">可用载荷空间</text>
  <text x="876" y="116" font-size="10.5" fill="#64748B" text-anchor="start">MTU</text>
  <text x="876" y="136" font-size="12.5" fill="#b91c1c" text-anchor="start" font-weight="bold">1450</text>
  <text x="40" y="212" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">IPIP / GRE</text>
  <text x="40" y="234" font-size="10.5" fill="#64748B" text-anchor="start">Calico IPIP、部分 VPN</text>
  <rect x="220" y="188" width="200" height="44" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="320" y="216" font-size="11" fill="#991b1b" text-anchor="middle">24~36 字节</text>
  <rect x="340" y="188" width="520" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="600" y="216" font-size="11" fill="#1e3a8a" text-anchor="middle">可用载荷空间</text>
  <text x="876" y="212" font-size="10.5" fill="#64748B" text-anchor="start">MTU</text>
  <text x="876" y="232" font-size="12.5" fill="#b91c1c" text-anchor="start" font-weight="bold">1476 / 1464</text>
  <text x="40" y="308" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">WireGuard</text>
  <text x="40" y="330" font-size="10.5" fill="#64748B" text-anchor="start">自建 VPN</text>
  <rect x="220" y="284" width="200" height="44" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="320" y="312" font-size="11" fill="#991b1b" text-anchor="middle">60~80 字节</text>
  <rect x="500" y="284" width="360" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="680" y="312" font-size="11" fill="#1e3a8a" text-anchor="middle">可用载荷空间</text>
  <text x="876" y="308" font-size="10.5" fill="#64748B" text-anchor="start">MTU</text>
  <text x="876" y="328" font-size="12.5" fill="#b91c1c" text-anchor="start" font-weight="bold">1420</text>
  <text x="40" y="404" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">IPv6 over IPv4</text>
  <text x="40" y="426" font-size="10.5" fill="#64748B" text-anchor="start">双栈过渡期</text>
  <rect x="220" y="380" width="200" height="44" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="320" y="408" font-size="11" fill="#991b1b" text-anchor="middle">60 字节</text>
  <rect x="460" y="380" width="400" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="660" y="408" font-size="11" fill="#1e3a8a" text-anchor="middle">可用载荷空间</text>
  <text x="876" y="404" font-size="10.5" fill="#64748B" text-anchor="start">MTU</text>
  <text x="876" y="424" font-size="12.5" fill="#b91c1c" text-anchor="start" font-weight="bold">过渡隧道</text>
  <text x="44" y="486" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">为什么是「变小」而不是「变慢」</text>
  <text x="60" y="516" font-size="12" fill="#334155" text-anchor="start">隧道把整个原始包当成新载荷，新头只能从原来 1500 的预算里扣 → 同一根链路上可用的 MSS 变小</text>
  <text x="60" y="546" font-size="12" fill="#334155" text-anchor="start">所以 K8s 的 Pod MTU 常设 1450、WireGuard 常设 1420，是 1500 − 封装开销 算出来的，不是拍脑袋</text>
  <text x="880" y="486" font-size="10" fill="#64748B" text-anchor="start">示意图，非等比</text>
</svg>
