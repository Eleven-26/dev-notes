<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="450" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">四种字符串形态，都走同一个 hostOnly</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">RemoteAddr 一定是 IP 冒号 端口，但 XFF 的条目没有统一规定带端口 —— 四种形态实测都能正确剥离</text>

  <rect x="40" y="76" width="200" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="140" y="96" text-anchor="middle" font-size="12" fill="#0f172a">拿到的原串</text>
  <text x="140" y="115" text-anchor="middle" font-size="10.5" fill="#64748b">对端地址或链的一个条目</text>
  <rect x="300" y="76" width="340" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="470" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">hostOnly，全篇只有一处实现</text>
  <text x="470" y="115" text-anchor="middle" font-size="10.5" fill="#1e3a8a">net.SplitHostPort 先试，失败才退化</text>
  <rect x="700" y="76" width="260" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="830" y="96" text-anchor="middle" font-size="12" fill="#14532d">parseIP 后再判可信</text>
  <text x="830" y="115" text-anchor="middle" font-size="10.5" fill="#14532d">解析失败就跳过该条目</text>
  <line x1="240" y1="100" x2="296" y2="100" stroke="#64748b" stroke-width="1.6" marker-end="url(#arH)"/>
  <line x1="640" y1="100" x2="696" y2="100" stroke="#64748b" stroke-width="1.6" marker-end="url(#arH)"/>

  <line x1="470" y1="124" x2="470" y2="140" stroke="#64748b" stroke-width="1.4"/>
  <line x1="290" y1="140" x2="710" y2="140" stroke="#64748b" stroke-width="1.4"/>
  <line x1="290" y1="140" x2="290" y2="156" stroke="#64748b" stroke-width="1.6" marker-end="url(#arH)"/>
  <line x1="710" y1="140" x2="710" y2="156" stroke="#64748b" stroke-width="1.6" marker-end="url(#arH)"/>

  <rect x="120" y="158" width="340" height="52" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="290" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">分支一：SplitHostPort 返回 err 为 nil</text>
  <text x="290" y="198" text-anchor="middle" font-size="10.5" fill="#475569">取 host，端口丢掉</text>
  <rect x="540" y="158" width="340" height="52" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="710" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">分支二：报错，没有端口可拆</text>
  <text x="710" y="198" text-anchor="middle" font-size="10.5" fill="#475569">去首尾方括号，整串即主机</text>

  <text x="40" y="238" font-size="12" font-weight="bold" fill="#0f172a">形态</text>
  <text x="200" y="238" font-size="12" font-weight="bold" fill="#0f172a">实测输入</text>
  <text x="520" y="238" font-size="12" font-weight="bold" fill="#0f172a">走哪个分支</text>
  <text x="790" y="238" font-size="12" font-weight="bold" fill="#0f172a">解析结果</text>
  <text x="40" y="266" font-size="11.5" fill="#0f172a">条目带端口</text>
  <text x="200" y="266" font-size="11.5" fill="#0f172a">remote=127.0.0.1:5000，XFF=9.9.9.9:1234</text>
  <text x="520" y="266" font-size="11.5" fill="#1e3a8a">分支一，取冒号前段</text>
  <text x="790" y="266" font-size="11.5" font-weight="bold" fill="#14532d">9.9.9.9</text>
  <text x="40" y="294" font-size="11.5" fill="#0f172a">链中间条目带端口</text>
  <text x="200" y="294" font-size="11.5" fill="#0f172a">XFF=1.1.1.1, 9.9.9.9:1234, 10.1.1.1</text>
  <text x="520" y="294" font-size="11.5" fill="#1e3a8a">每个条目各调一次</text>
  <text x="790" y="294" font-size="11.5" font-weight="bold" fill="#14532d">9.9.9.9</text>
  <text x="40" y="322" font-size="11.5" fill="#0f172a">对端不带端口</text>
  <text x="200" y="322" font-size="11.5" fill="#0f172a">remote=127.0.0.1，XFF=9.9.9.9</text>
  <text x="520" y="322" font-size="11.5" fill="#7c2d12">分支二，整串即主机</text>
  <text x="790" y="322" font-size="11.5" font-weight="bold" fill="#14532d">9.9.9.9</text>
  <text x="40" y="350" font-size="11.5" fill="#0f172a">对端方括号形式</text>
  <text x="200" y="350" font-size="11.5" fill="#0f172a">remote=[::1]，XFF=2001:db8::1</text>
  <text x="520" y="350" font-size="11.5" fill="#7c2d12">分支二，去方括号</text>
  <text x="790" y="350" font-size="11.5" font-weight="bold" fill="#14532d">2001:db8::1</text>

  <line x1="40" y1="372" x2="960" y2="372" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="392" font-size="12" fill="#475569">前两条的对端同为 127.0.0.1:5000（可信）；链里每个条目、以及 RemoteAddr 自己走的都是同一个 hostOnly，所以不存在某条路径忘了剥端口。</text>
  <text x="40" y="414" font-size="12" fill="#7c2d12">这正是第四节坑⑤值得单列的原因：IPv6 里到处都是冒号，自己按冒号切会把地址切坏，SplitHostPort 会连方括号一起处理。</text>
  <text x="40" y="436" font-size="12" fill="#475569">另一条同源规则：::ffff:9.9.9.9 这类 IPv4-mapped 形式必须 Unmap，否则它既不会被 IPv4 前缀命中，形态也不规范。</text>

  <defs>
    <marker id="arH" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
