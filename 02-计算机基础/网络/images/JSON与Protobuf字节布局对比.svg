<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一条 User 消息：JSON 54 字节 vs Protobuf 26 字节</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#64748b">字节与偏移取自本机 Docker（golang:1.26-alpine）实测编码并解码回验；Protobuf 按 name=1 / age=2 / hobby=3(repeated)</text>

  <rect x="60" y="72" width="820" height="40" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="470" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">{&quot;name&quot;:&quot;张三&quot;,&quot;age&quot;:18,&quot;hobby&quot;:[&quot;钓鱼&quot;,&quot;架设&quot;]}</text>
  <text x="470" y="106" text-anchor="middle" font-size="10.5" fill="#7c2d12">54 字节：字段名、引号、冒号、逗号、括号全部上线</text>

  <text x="60" y="132" font-size="12" fill="#334155">同一份数据换成 Protobuf（二进制，字段名不上线）↓</text>

  <text x="60" y="160" text-anchor="middle" font-size="9.5" fill="#94a3b8">0</text>
  <text x="120" y="160" text-anchor="middle" font-size="9.5" fill="#94a3b8">2</text>
  <text x="300" y="160" text-anchor="middle" font-size="9.5" fill="#94a3b8">8</text>
  <text x="330" y="160" text-anchor="middle" font-size="9.5" fill="#94a3b8">9</text>
  <text x="360" y="160" text-anchor="middle" font-size="9.5" fill="#94a3b8">10</text>
  <text x="420" y="160" text-anchor="middle" font-size="9.5" fill="#94a3b8">12</text>
  <text x="600" y="160" text-anchor="middle" font-size="9.5" fill="#94a3b8">18</text>
  <text x="660" y="160" text-anchor="middle" font-size="9.5" fill="#94a3b8">20</text>
  <text x="845" y="160" text-anchor="middle" font-size="9.5" fill="#94a3b8">26</text>

  <rect x="60" y="168" width="60" height="52" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="90" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">0a</text>
  <text x="90" y="208" text-anchor="middle" font-size="9" fill="#991b1b">tag f1/w2</text>
  <rect x="120" y="168" width="60" height="52" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="150" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">06</text>
  <text x="150" y="208" text-anchor="middle" font-size="9" fill="#991b1b">len</text>
  <rect x="180" y="168" width="120" height="52" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="240" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">张三</text>
  <text x="240" y="208" text-anchor="middle" font-size="9" fill="#14532d">6 字节 UTF-8</text>
  <rect x="300" y="168" width="30" height="52" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="315" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">10</text>
  <rect x="330" y="168" width="30" height="52" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="345" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">12</text>
  <text x="345" y="140" text-anchor="middle" font-size="9.5" fill="#991b1b">age varint 18</text>
  <rect x="360" y="168" width="60" height="52" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="390" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">1a 06</text>
  <text x="390" y="208" text-anchor="middle" font-size="9" fill="#991b1b">tag f3/w2</text>
  <rect x="420" y="168" width="180" height="52" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="510" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">钓鱼</text>
  <text x="510" y="208" text-anchor="middle" font-size="9" fill="#14532d">6 字节</text>
  <rect x="600" y="168" width="60" height="52" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="630" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">1a 06</text>
  <text x="630" y="208" text-anchor="middle" font-size="9" fill="#991b1b">tag f3/w2</text>
  <rect x="660" y="168" width="180" height="52" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="750" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">架设</text>
  <text x="750" y="208" text-anchor="middle" font-size="9" fill="#14532d">6 字节</text>

  <text x="850" y="188" font-size="13" font-weight="bold" fill="#14532d">26 字节</text>
  <text x="850" y="208" font-size="10" fill="#14532d">=8+2+8+8</text>

  <text x="60" y="244" font-size="10.5" fill="#dc2626">红＝结构与长度开销（7 字节）：字段名编译成 tag 号，不再有 name/age/hobby 字样</text>
  <text x="60" y="262" font-size="10.5" fill="#16a34a">绿＝真正的数据字节（19 字节）：与 JSON 里承载的 张三 / 18 / 钓鱼 / 架设 一一对应</text>

  <rect x="60" y="278" width="880" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="78" y="304" font-size="14" font-weight="bold" fill="#0f172a">要点</text>
  <text x="78" y="330" font-size="11.5" fill="#334155">Protobuf 省的是「结构与字段名」的开销：短字段越密集收益越大；主体是长字符串时两者体积几乎相同。</text>
  <text x="78" y="354" font-size="11.5" fill="#334155">tag = 字段号 &lt;&lt; 3 | wiretype；整数用 Varint（age=18 只占 1 字节 0x12），长度前缀标出变长字段。</text>
  <text x="78" y="378" font-size="11.5" fill="#334155">注意：二进制必须用 .proto 生成码严格编解码，贸然转字符串会丢信息；逐字节拆解见 Protobuf 篇。</text>
</svg>
