<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">PROXY protocol v1 那行的六个字段，与 L4 下拿真实 IP 的两条路</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#64748b">接收侧本机实测：nginx 配 listen 18444 proxy_protocol，客户端容器用 busybox nc 手工拼前缀与请求行</text>

  <rect x="40" y="72" width="150" height="42" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="115" y="98" text-anchor="middle" font-size="12.5" fill="#0f172a">PROXY</text>
  <rect x="190" y="72" width="125" height="42" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="252" y="98" text-anchor="middle" font-size="12.5" fill="#0f172a">TCP4</text>
  <rect x="315" y="72" width="200" height="42" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="415" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">1.2.3.4</text>
  <rect x="515" y="72" width="200" height="42" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="615" y="98" text-anchor="middle" font-size="12.5" fill="#1e3a8a">5.6.7.8</text>
  <rect x="715" y="72" width="130" height="42" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="780" y="98" text-anchor="middle" font-size="12.5" fill="#0f172a">40000</text>
  <rect x="845" y="72" width="115" height="42" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="902" y="98" text-anchor="middle" font-size="12.5" fill="#0f172a">80</text>

  <text x="115" y="130" text-anchor="middle" font-size="10.5" fill="#64748b">固定前缀</text>
  <text x="252" y="130" text-anchor="middle" font-size="10.5" fill="#64748b">地址族 TCP4 或 TCP6</text>
  <text x="415" y="130" text-anchor="middle" font-size="10.5" fill="#7c2d12">源地址，即客户端</text>
  <text x="615" y="130" text-anchor="middle" font-size="10.5" fill="#1e3a8a">目的地址，即 LB 对外</text>
  <text x="780" y="130" text-anchor="middle" font-size="10.5" fill="#64748b">源端口</text>
  <text x="902" y="130" text-anchor="middle" font-size="10.5" fill="#64748b">目的端口</text>
  <text x="115" y="152" text-anchor="middle" font-size="10.5" fill="#94a3b8">行尾是 CRLF</text>
  <text x="415" y="152" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7c2d12">第三个字段才是客户端</text>
  <text x="780" y="152" text-anchor="middle" font-size="10.5" fill="#94a3b8">六个字段按空格分隔</text>

  <line x1="40" y1="168" x2="960" y2="168" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="40" y="180" width="440" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="56" y="202" font-size="12.5" font-weight="bold" fill="#1e3a8a">路一：PROXY protocol</text>
  <text x="56" y="224" font-size="11" fill="#0f172a">LB 在接收连接后、转发真实数据之前先发一段独立头</text>
  <text x="56" y="244" font-size="11" fill="#0f172a">不在 HTTP 报文里，客户端伪造不了；可信由拓扑保证</text>
  <text x="56" y="262" font-size="11" fill="#7c2d12">代价：要么整条链都开，要么完全不用</text>
  <rect x="520" y="180" width="440" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="536" y="202" font-size="12.5" font-weight="bold" fill="#1e3a8a">路二：在 LB 上做 L7 终结</text>
  <text x="536" y="224" font-size="11" fill="#0f172a">让 LB 自己解析 HTTP，再按第二节的方式追加 XFF</text>
  <text x="536" y="244" font-size="11" fill="#0f172a">本篇五条规则全部照常适用，含从右往左扫描</text>
  <text x="536" y="262" font-size="11" fill="#7c2d12">代价：LB 要支持，且你愿意承担 L7 的开销</text>

  <line x1="40" y1="282" x2="960" y2="282" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="40" y="292" width="920" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="56" y="314" font-size="12" font-weight="bold" fill="#0f172a">接收侧实测读数</text>
  <text x="56" y="336" font-size="11" fill="#0f172a">发：PROXY TCP4 1.2.3.4 5.6.7.8 40000 80 紧接 GET / HTTP/1.1</text>
  <text x="56" y="356" font-size="11" fill="#0f172a">收：proxy_addr=1.2.3.4、proxy_port=40000、proxy_server=5.6.7.8、proxy_server_port=80，而 real_peer=192.168.224.6</text>
  <text x="56" y="376" font-size="11" fill="#7f1d1d">对照（同一端口不发前缀）：客户端收到 0 字节，连状态行都没有，nginx 记一条 broken header</text>
  <text x="56" y="396" font-size="10" fill="#7f1d1d">[error] 33#33: *21 broken header: "GET / HTTP/1.1" while reading PROXY protocol, client: 192.168.224.6, server: 0.0.0.0:18444</text>

  <text x="40" y="428" font-size="12" fill="#0f172a">前缀里的地址与 TCP 对端是两个来源，可交叉验证：正常拓扑下两者应当一致，本例故意写了个假地址才有差异。</text>
  <text x="40" y="450" font-size="12" fill="#7c2d12">开了 proxy_protocol 的端口不接受普通 HTTP 连接：不是回落 RemoteAddr，而是这条连接直接废掉。</text>
  <text x="40" y="472" font-size="12" fill="#7c2d12">可信仍然只来自拓扑 —— 谁能直接连上这个端口，谁就能决定 proxy_addr；它不需要网段列表去猜。</text>
  <text x="40" y="500" font-size="12" font-weight="bold" fill="#991b1b">仍未实测：本机没有真实 L4 负载均衡，发送侧（HAProxy send-proxy、NLB 的 Proxy Protocol）与 v2 二进制格式都没有复现，以上只覆盖接收侧。</text>
</svg>
