<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arwGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#15803d"/>
    </marker>
    <marker id="arwRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">CDN 把跨城请求变成同城：命中时跨城段被整个跳过</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">DNS 仍然要解析一次；被省掉的是用户到源站那段跨城的 TCP、TLS、排队与丢包</text>

  <rect x="30" y="120" width="140" height="90" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="100" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#075985">用户</text>
  <text x="100" y="176" text-anchor="middle" font-size="11" fill="#075985">杭州</text>

  <rect x="250" y="120" width="160" height="90" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="330" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">DNS / 调度</text>
  <text x="330" y="174" text-anchor="middle" font-size="10" fill="#5b21b6">返回最近边缘 IP</text>

  <rect x="470" y="110" width="190" height="110" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="565" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">边缘节点</text>
  <text x="565" y="166" text-anchor="middle" font-size="11" fill="#166534">杭州</text>
  <text x="565" y="188" text-anchor="middle" font-size="10" fill="#166534">终止 TLS / 缓存</text>

  <rect x="740" y="110" width="190" height="110" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="835" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">源站</text>
  <text x="835" y="166" text-anchor="middle" font-size="11" fill="#92400e">深圳</text>
  <text x="835" y="188" text-anchor="middle" font-size="10" fill="#92400e">业务与数据库</text>

  <line x1="170" y1="145" x2="250" y2="145" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="210" y="136" text-anchor="middle" font-size="10" fill="#475569">① 解析</text>
  <line x1="250" y1="175" x2="170" y2="175" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arw)"/>
  <text x="210" y="198" text-anchor="middle" font-size="10" fill="#475569">② 返回 IP</text>

  <polyline points="100,210 100,270 565,270 565,220" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="400" y="292" text-anchor="middle" font-size="11" fill="#334155">③ TCP / TLS + HTTP（同城 1~5 ms）</text>

  <polyline points="565,110 565,86 100,86 100,120" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#arwGreen)"/>
  <text x="330" y="76" text-anchor="middle" font-size="11" fill="#166534">④ 命中：直接返回（Age 大于 0）</text>

  <line x1="660" y1="150" x2="740" y2="150" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arwRed)"/>
  <text x="700" y="140" text-anchor="middle" font-size="10" fill="#b91c1c">⑤ 回源</text>
  <text x="700" y="170" text-anchor="middle" font-size="10" fill="#b91c1c">跨城 20~40 ms</text>
  <line x1="740" y1="195" x2="660" y2="195" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arwRed)"/>
  <text x="700" y="214" text-anchor="middle" font-size="10" fill="#b91c1c">⑥ 响应并缓存</text>

  <line x1="715" y1="96" x2="715" y2="236" stroke="#dc2626" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="715" y="252" text-anchor="middle" font-size="10" fill="#b91c1c">跨城段</text>

  <rect x="30" y="330" width="940" height="64" rx="8" fill="#f0fdf4" stroke="#15803d"/>
  <text x="46" y="354" font-size="12" font-weight="bold" fill="#166534">命中：用户到边缘只有一个同城往返</text>
  <text x="46" y="378" font-size="12" fill="#14532d">跨城的 TCP/TLS、排队与丢包全都不发生；DNS 仍然要一次（可缓存），CDN 省的是回源，不是解析。</text>

  <rect x="30" y="410" width="940" height="64" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="46" y="434" font-size="12" font-weight="bold" fill="#92400e">未命中：多出边缘到源站的一段</text>
  <text x="46" y="458" font-size="12" fill="#78350f">这一段常复用长连接，不再每次付 TCP/TLS 握手；并发回源可用 collapsed forwarding 合成一次。</text>

  <text x="500" y="500" text-anchor="middle" font-size="10" fill="#64748b">图里的同城 1~5 ms 与跨城 20~40 ms 是量级估计，实际取决于运营商组网与边缘覆盖</text>
</svg>
