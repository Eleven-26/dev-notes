<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arwRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1000" height="590" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">UDP 收包路径上的三处丢包</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">从网卡到应用要过三道缓冲，任何一道满都是「直接丢」；UDP 没有重传，丢了应用永远不知道</text>

  <!-- ============ 物理硬件层 ============ -->
  <rect x="24" y="70" width="952" height="134" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="90" font-size="12" font-weight="bold" fill="#475569">物理硬件层</text>

  <rect x="40" y="98" width="190" height="34" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="135" y="120" font-size="11" text-anchor="middle" fill="#075985">网卡 NIC（自带 DMA 引擎）</text>
  <rect x="380" y="98" width="250" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="505" y="120" font-size="11" text-anchor="middle" fill="#78350f">CPU（软中断在这个核上跑）</text>

  <line x1="40" y1="140" x2="960" y2="140" stroke="#94a3b8" stroke-width="3"/>
  <line x1="135" y1="132" x2="135" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="505" y1="132" x2="505" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="280" y="136" font-size="10.5" text-anchor="middle" fill="#64748b">PCIe · DMA</text>
  <text x="700" y="136" font-size="10.5" text-anchor="middle" fill="#64748b">软中断轮询描述符</text>

  <line x1="500" y1="140" x2="500" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="330" y="148" width="340" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="170" font-size="11" text-anchor="middle" fill="#1e3a8a">DDR 内存：RX ring 与 socket 队列都在这块里</text>
  <text x="40" y="197" font-size="11.5" fill="#334155">帧由 DMA 直接写进 DDR 的 RX ring，CPU 只在软中断里处理描述符 —— 所以① 这处丢包，CPU 完全不知情</text>

  <!-- ============ 收包链 ============ -->
  <rect x="30" y="216" width="170" height="86" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="115" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">网卡</text>
  <text x="115" y="274" text-anchor="middle" font-size="11" fill="#075985">DMA 写入收包环</text>

  <rect x="240" y="216" width="190" height="86" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="335" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">RX ring</text>
  <text x="335" y="268" text-anchor="middle" font-size="11" fill="#5b21b6">收包环，大小见</text>
  <text x="335" y="286" text-anchor="middle" font-size="11" fill="#5b21b6">ethtool -g eth0</text>

  <rect x="470" y="216" width="200" height="86" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="570" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">NAPI / 软中断</text>
  <text x="570" y="266" text-anchor="middle" font-size="11" fill="#9a3412">backlog 上限</text>
  <text x="570" y="284" text-anchor="middle" font-size="11" fill="#9a3412">netdev_max_backlog</text>

  <rect x="710" y="216" width="200" height="86" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="810" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">socket 接收队列</text>
  <text x="810" y="266" text-anchor="middle" font-size="11" fill="#166534">上限 SO_RCVBUF</text>
  <text x="810" y="284" text-anchor="middle" font-size="11" fill="#166534">应用 recvfrom 取走</text>

  <line x1="200" y1="259" x2="240" y2="259" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="430" y1="259" x2="470" y2="259" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="670" y1="259" x2="710" y2="259" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <line x1="335" y1="302" x2="335" y2="348" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwRed)"/>
  <line x1="570" y1="302" x2="570" y2="348" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwRed)"/>
  <line x1="810" y1="302" x2="810" y2="348" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwRed)"/>

  <rect x="240" y="352" width="190" height="96" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="335" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">① 环满</text>
  <text x="335" y="400" text-anchor="middle" font-size="11" fill="#b91c1c">ethtool -S eth0</text>
  <text x="335" y="418" text-anchor="middle" font-size="11" fill="#b91c1c">看 drop 计数</text>
  <text x="335" y="436" text-anchor="middle" font-size="11" fill="#b91c1c">调 ethtool -G 调大</text>

  <rect x="470" y="352" width="200" height="96" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="570" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">② 软中断处理不过来</text>
  <text x="570" y="400" text-anchor="middle" font-size="11" fill="#b91c1c">softnet_stat 第 2 列</text>
  <text x="570" y="418" text-anchor="middle" font-size="11" fill="#b91c1c">CPU 被打满</text>
  <text x="570" y="436" text-anchor="middle" font-size="11" fill="#b91c1c">开 RPS / RFS 多队列</text>

  <rect x="710" y="352" width="200" height="96" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="810" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">③ 队列满</text>
  <text x="810" y="400" text-anchor="middle" font-size="11" fill="#b91c1c">Udp:RcvbufErrors</text>
  <text x="810" y="418" text-anchor="middle" font-size="11" fill="#b91c1c">应用读得太慢</text>
  <text x="810" y="436" text-anchor="middle" font-size="11" fill="#b91c1c">见 5.3 的三条解法</text>

  <rect x="30" y="474" width="880" height="100" rx="10" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="46" y="500" font-size="13" font-weight="bold" fill="#115e59">三处的共同点：丢得无声无息</text>
  <text x="46" y="522" font-size="12" fill="#134e4a">TCP 在这三处丢了还会重传，应用最多变慢；UDP 丢了没有任何补救，应用只能靠自己的超时机制发现。</text>
  <text x="46" y="544" font-size="12" fill="#134e4a">所以「UDP 丢包」先按顺序查 Ring Buffer → 软中断 → socket 队列，最后才怀疑链路。</text>
  <text x="46" y="566" font-size="12" fill="#0f766e">本图只有收包这一条路；文件方向的 page cache 走另一条支路，见文件系统与IO 篇的 write 落盘图。</text>
</svg>
