<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Tahoe 与 Reno 在持续丢包下的平均拥塞窗口</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">场景：每 6 个 RTT 丢一次（三个重复 ACK），统计前 24 轮的平均 cwnd（单位 MSS）</text>

  <line x1="280" y1="92" x2="280" y2="330" stroke="#94a3b8" stroke-width="1.2"/>

  <text x="120" y="150" text-anchor="end" font-size="15" font-weight="bold" fill="#dc2626">Tahoe</text>
  <text x="120" y="170" text-anchor="end" font-size="11.5" fill="#64748b">丢包一律回 1</text>
  <rect x="280" y="132" width="224" height="34" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="516" y="154" font-size="14" font-weight="bold" fill="#dc2626">5.6</text>

  <text x="120" y="250" text-anchor="end" font-size="15" font-weight="bold" fill="#16a34a">Reno</text>
  <text x="120" y="270" text-anchor="end" font-size="11.5" fill="#64748b">快恢复 ssthresh+3</text>
  <rect x="280" y="232" width="476" height="34" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="768" y="254" font-size="14" font-weight="bold" fill="#16a34a">11.9</text>

  <text x="280" y="310" font-size="12" fill="#64748b">横轴：平均 cwnd（MSS），比例尺 40 px / MSS</text>

  <rect x="20" y="336" width="960" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="360" font-size="12.5" fill="#334155">要点：单次丢包两者只差约 1 个 RTT，容易被低估；反复丢包时 Reno 的平均窗口约为 Tahoe 的 2.1 倍。</text>
  <text x="36" y="384" font-size="12.5" fill="#7f1d1d">注意：Tahoe 每次丢包都退回 1 重新慢启动，爬升成本被反复放大——这正是 Reno 取代 Tahoe 的原因。</text>
</svg>
