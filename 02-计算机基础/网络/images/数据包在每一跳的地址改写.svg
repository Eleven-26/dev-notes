<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">数据包在每一跳的地址改写</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">一个数据包从客户端网卡出发，经出口网关 SNAT、途中路由器、目标负载均衡 DNAT，到达服务端，每一跳的源 IP、目的 IP、MAC 与 TTL 如何变化</text>

  <rect x="20" y="84" width="960" height="34" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="106" font-size="12.5" font-weight="bold" fill="#0f172a">跳</text>
  <text x="300" y="106" font-size="12.5" font-weight="bold" fill="#0f172a">源 IP</text>
  <text x="470" y="106" font-size="12.5" font-weight="bold" fill="#0f172a">目的 IP</text>
  <text x="650" y="106" font-size="12.5" font-weight="bold" fill="#0f172a">MAC</text>
  <text x="900" y="106" font-size="12.5" font-weight="bold" fill="#0f172a">TTL</text>

  <rect x="20" y="126" width="960" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="40" y="151" font-size="12.5" fill="#1e3a8a">① 出客户端网卡</text>
  <text x="300" y="151" font-size="12.5" fill="#1e3a8a">10.44.147.x</text>
  <text x="470" y="151" font-size="12.5" fill="#1e3a8a">203.0.113.9</text>
  <text x="650" y="151" font-size="12.5" fill="#1e3a8a">客户端 → 网关</text>
  <text x="900" y="151" font-size="12.5" fill="#1e3a8a">64</text>

  <rect x="20" y="174" width="960" height="40" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="40" y="199" font-size="12.5" fill="#92400e">② 网关 SNAT 后转发</text>
  <text x="300" y="199" font-size="12.5" font-weight="bold" fill="#92400e">203.0.113.9 ←改</text>
  <text x="470" y="199" font-size="12.5" fill="#92400e">203.0.113.9</text>
  <text x="650" y="199" font-size="12.5" fill="#92400e">逐跳重写</text>
  <text x="900" y="199" font-size="12.5" fill="#92400e">63</text>

  <rect x="20" y="222" width="960" height="40" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="40" y="247" font-size="12.5" fill="#334155">③ 途中每个路由器</text>
  <text x="300" y="247" font-size="12.5" fill="#334155">不变</text>
  <text x="470" y="247" font-size="12.5" fill="#334155">不变</text>
  <text x="650" y="247" font-size="12.5" fill="#334155">逐跳重写</text>
  <text x="900" y="247" font-size="12.5" fill="#334155">递减</text>

  <rect x="20" y="270" width="960" height="40" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="40" y="295" font-size="12.5" fill="#92400e">④ LB DNAT 后到后端</text>
  <text x="300" y="295" font-size="12.5" fill="#92400e">203.0.113.9</text>
  <text x="470" y="295" font-size="12.5" font-weight="bold" fill="#92400e">10.0.0.8 ←改</text>
  <text x="650" y="295" font-size="12.5" fill="#92400e">LB → 后端</text>
  <text x="900" y="295" font-size="12.5" fill="#92400e">62</text>

  <rect x="20" y="318" width="960" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="40" y="343" font-size="12.5" fill="#14532d">⑤ 服务端收到</text>
  <text x="300" y="343" font-size="12.5" fill="#14532d">203.0.113.9</text>
  <text x="470" y="343" font-size="12.5" fill="#14532d">10.0.0.8</text>
  <text x="650" y="343" font-size="12.5" fill="#14532d">服务端网卡</text>
  <text x="900" y="343" font-size="12.5" fill="#14532d">61</text>

  <rect x="20" y="370" width="960" height="82" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="36" y="396" font-size="12.5" fill="#334155">服务端看到的是网关公网 IP（203.0.113.9），不是客户端内网地址 —— 真实 IP 只能靠应用层头传</text>
  <text x="36" y="422" font-size="12.5" fill="#7f1d1d">若 LB 是 L7 反向代理：源 IP 变成 LB 自己的地址，且「客户端↔LB」「LB↔后端」是两条独立 TCP</text>
</svg>
