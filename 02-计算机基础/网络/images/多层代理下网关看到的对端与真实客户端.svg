<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">多层代理下，网关的 TCP 对端是上一跳，不是客户端</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">用户浏览器经 CDN 与 SLB 到达网关：每往后一跳，「谁在跟我说话」就换成上一个代理</text>

  <rect x="40" y="76" width="150" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="115" y="98" text-anchor="middle" font-size="12.5" fill="#0f172a">用户浏览器</text>
  <text x="115" y="118" text-anchor="middle" font-size="11" fill="#64748b">1.1.1.1</text>
  <rect x="230" y="76" width="150" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="305" y="98" text-anchor="middle" font-size="12.5" fill="#1e3a8a">CDN</text>
  <text x="305" y="118" text-anchor="middle" font-size="11" fill="#1e3a8a">出口 10.0.0.9</text>
  <rect x="420" y="76" width="150" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="495" y="98" text-anchor="middle" font-size="12.5" fill="#1e3a8a">SLB</text>
  <text x="495" y="118" text-anchor="middle" font-size="11" fill="#1e3a8a">10.0.1.5</text>
  <rect x="610" y="76" width="150" height="54" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="685" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">网关</text>
  <text x="685" y="118" text-anchor="middle" font-size="10.5" fill="#7c2d12">对端 = 10.0.1.5</text>
  <rect x="800" y="76" width="160" height="54" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="880" y="98" text-anchor="middle" font-size="12.5" fill="#14532d">上游服务</text>
  <text x="880" y="118" text-anchor="middle" font-size="11" fill="#14532d">对端 = 网关</text>
  <line x1="190" y1="103" x2="226" y2="103" stroke="#64748b" stroke-width="1.6" marker-end="url(#arC)"/>
  <line x1="380" y1="103" x2="416" y2="103" stroke="#64748b" stroke-width="1.6" marker-end="url(#arC)"/>
  <line x1="570" y1="103" x2="606" y2="103" stroke="#64748b" stroke-width="1.6" marker-end="url(#arC)"/>
  <line x1="760" y1="103" x2="796" y2="103" stroke="#64748b" stroke-width="1.6" marker-end="url(#arC)"/>

  <line x1="40" y1="146" x2="960" y2="146" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="168" font-size="12" font-weight="bold" fill="#0f172a">这一跳</text>
  <text x="300" y="168" font-size="12" font-weight="bold" fill="#0f172a">它的 TCP 对端</text>
  <text x="620" y="168" font-size="12" font-weight="bold" fill="#0f172a">于是</text>
  <text x="40" y="194" font-size="12" fill="#0f172a">CDN 接浏览器</text>
  <text x="300" y="194" font-size="12" fill="#0f172a">1.1.1.1</text>
  <text x="620" y="194" font-size="12" fill="#14532d">这一跳上对端就是真实客户端</text>
  <text x="40" y="218" font-size="12" fill="#0f172a">SLB 接 CDN</text>
  <text x="300" y="218" font-size="12" fill="#0f172a">10.0.0.9</text>
  <text x="620" y="218" font-size="12" fill="#0f172a">对端已经换成一台代理</text>
  <text x="40" y="242" font-size="12" fill="#7c2d12">网关 接 SLB</text>
  <text x="300" y="242" font-size="12" font-weight="bold" fill="#991b1b">10.0.1.5，永远是 SLB</text>
  <text x="620" y="242" font-size="12" fill="#991b1b">真实客户端只能靠转发头带过来</text>
  <text x="40" y="266" font-size="12" fill="#0f172a">上游 接网关</text>
  <text x="300" y="266" font-size="12" fill="#0f172a">网关地址</text>
  <text x="620" y="266" font-size="12" fill="#0f172a">只能读网关算好的 X-Real-IP</text>

  <rect x="40" y="286" width="440" height="58" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="60" y="308" font-size="12.5" font-weight="bold" fill="#7f1d1d">后果一：限流维度坍缩</text>
  <text x="60" y="330" font-size="11.5" fill="#7f1d1d">按 IP 建桶，全网匿名客户端共用一个桶，一人刷接口正常用户一起被限</text>
  <rect x="520" y="286" width="440" height="58" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="540" y="308" font-size="12.5" font-weight="bold" fill="#7f1d1d">后果二：审计日志失真</text>
  <text x="540" y="330" font-size="11.5" fill="#7f1d1d">日志里 client=10.0.1.5 永远是那台 LB，出事后定位不到真实来源</text>

  <text x="40" y="368" font-size="12" fill="#475569">这个问题会随部署架构变化突然出现：单机直连时 RemoteAddr 就是客户端 IP，一切正常；上了 LB 之后功能一行没改，限流与审计同时静默失效。</text>
  <text x="40" y="392" font-size="12" fill="#475569">每一跳把「我的对端」追加进 X-Forwarded-For，网关再从右往左按可信网段解析 —— 见本篇第二、三节。</text>

  <defs>
    <marker id="arC" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
