<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">同一份代码走三条链路：分层边界的实测读数</text>
  <text x="500" y="40" text-anchor="middle" font-size="11" fill="#64748b">三列＝三个目标，每行＝封装路上的一层；读数全部取自不抓包的内核计数与套接字选项</text>

  <path d="M 240 72 L 240 62 L 452 62 L 452 72" fill="none" stroke="#0284c7" stroke-width="1.3"/>
  <text x="346" y="56" text-anchor="middle" font-size="10.5" fill="#0c4a6e">走 lo：不经过物理网卡</text>
  <path d="M 470 72 L 470 62 L 922 62 L 922 72" fill="none" stroke="#ea580c" stroke-width="1.3"/>
  <text x="696" y="56" text-anchor="middle" font-size="10.5" fill="#7c2d12">走 eth0：天花板同为 1500，只是下一跳不同</text>

  <rect x="232" y="76" width="228" height="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="346" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0c4a6e">127.0.0.1（走 lo）</text>
  <rect x="463" y="76" width="228" height="30" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="577" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c2d12">192.168.64.3（同网段）</text>
  <rect x="694" y="76" width="228" height="30" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="808" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c2d12">203.0.113.80（跨网段）</text>

  <text x="40" y="134" font-size="11.5" font-weight="bold" fill="#0f172a">链路层：接口 MTU</text>
  <text x="40" y="152" font-size="10" fill="#64748b">读 /sys/class/net/*/mtu</text>
  <rect x="232" y="112" width="228" height="54" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="463" y="112" width="228" height="54" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="694" y="112" width="228" height="54" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="346" y="146" text-anchor="middle" font-size="17" font-weight="bold" fill="#0c4a6e">65536</text>
  <text x="577" y="146" text-anchor="middle" font-size="17" font-weight="bold" fill="#7c2d12">1500</text>
  <text x="808" y="146" text-anchor="middle" font-size="17" font-weight="bold" fill="#7c2d12">1500</text>

  <text x="40" y="194" font-size="11.5" font-weight="bold" fill="#0f172a">网络层：当前路径 MTU</text>
  <text x="40" y="212" font-size="10" fill="#64748b">connect 后读 IP_MTU</text>
  <rect x="232" y="172" width="228" height="54" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="463" y="172" width="228" height="54" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="694" y="172" width="228" height="54" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="346" y="206" text-anchor="middle" font-size="17" font-weight="bold" fill="#0c4a6e">65535</text>
  <text x="577" y="206" text-anchor="middle" font-size="17" font-weight="bold" fill="#7c2d12">1500</text>
  <text x="808" y="206" text-anchor="middle" font-size="17" font-weight="bold" fill="#7c2d12">1500</text>

  <text x="40" y="254" font-size="11.5" font-weight="bold" fill="#0f172a">网络层：DF 置 1 后发 1473</text>
  <text x="40" y="272" font-size="10" fill="#64748b">sendto 返回原文</text>
  <rect x="232" y="232" width="228" height="54" fill="#ecfdf5" stroke="#16a34a" stroke-width="1"/>
  <rect x="463" y="232" width="228" height="54" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="694" y="232" width="228" height="54" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="346" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">照发不误</text>
  <text x="346" y="276" text-anchor="middle" font-size="10" fill="#14532d">墙在 65536</text>
  <text x="577" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">message too long</text>
  <text x="577" y="276" text-anchor="middle" font-size="10" fill="#991b1b">1472 字节那封发出去了</text>
  <text x="808" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">message too long</text>
  <text x="808" y="276" text-anchor="middle" font-size="10" fill="#991b1b">与同网段一字不差</text>

  <text x="40" y="314" font-size="11.5" font-weight="bold" fill="#0f172a">网络层：一次写 20000 字节</text>
  <text x="40" y="332" font-size="10" fill="#64748b">UDP，读 FragCreates 增量</text>
  <rect x="232" y="292" width="228" height="54" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="463" y="292" width="228" height="54" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <rect x="694" y="292" width="228" height="54" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="346" y="320" text-anchor="middle" font-size="17" font-weight="bold" fill="#0c4a6e">0</text>
  <text x="346" y="338" text-anchor="middle" font-size="10" fill="#0c4a6e">一片都不用切</text>
  <text x="577" y="320" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e40af">14</text>
  <text x="577" y="338" text-anchor="middle" font-size="10" fill="#1e40af">三轮实测都是 14</text>
  <text x="808" y="320" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e40af">14</text>
  <text x="808" y="338" text-anchor="middle" font-size="10" fill="#1e40af">三轮实测都是 14</text>

  <text x="40" y="374" font-size="11.5" font-weight="bold" fill="#0f172a">链路层：邻居表里的下一跳</text>
  <text x="40" y="392" font-size="10" fill="#64748b">ip neigh show</text>
  <rect x="232" y="352" width="228" height="54" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="463" y="352" width="228" height="54" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="694" y="352" width="228" height="54" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="346" y="378" text-anchor="middle" font-size="11" fill="#334155">无条目</text>
  <text x="346" y="396" text-anchor="middle" font-size="10" fill="#64748b">本机自己，不出网</text>
  <text x="577" y="378" text-anchor="middle" font-size="10.5" fill="#334155">192.168.64.3</text>
  <text x="577" y="396" text-anchor="middle" font-size="10.5" fill="#334155">b2:af:a6:d2:5f:6d</text>
  <text x="808" y="378" text-anchor="middle" font-size="10.5" fill="#334155">192.168.64.1</text>
  <text x="808" y="396" text-anchor="middle" font-size="10.5" fill="#334155">4e:30:f4:8a:4d:51</text>

  <text x="40" y="434" font-size="11.5" font-weight="bold" fill="#0f172a">帧的目的 MAC</text>
  <text x="40" y="452" font-size="10" fill="#64748b">由上一行推得，未抓包</text>
  <rect x="232" y="412" width="228" height="54" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="463" y="412" width="228" height="54" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="694" y="412" width="228" height="54" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="346" y="438" text-anchor="middle" font-size="11" fill="#64748b">lo 无 MAC</text>
  <text x="346" y="456" text-anchor="middle" font-size="10" fill="#64748b">00:00:00:00:00:00</text>
  <text x="577" y="438" text-anchor="middle" font-size="11" fill="#334155">填对端网卡</text>
  <text x="577" y="456" text-anchor="middle" font-size="10" fill="#334155">b2:af:a6:d2:5f:6d</text>
  <text x="808" y="438" text-anchor="middle" font-size="11" fill="#334155">填网关网卡</text>
  <text x="808" y="456" text-anchor="middle" font-size="10" fill="#334155">4e:30:f4:8a:4d:51</text>

  <rect x="40" y="486" width="920" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="56" y="508" font-size="13" font-weight="bold" fill="#0f172a">要点</text>
  <text x="56" y="530" font-size="11.5" fill="#334155">同一次发送，差别全在下层：链路层换了天花板（1500 与 65536），网络层的报错与分片计数就跟着换，上层代码一行没动。</text>
  <text x="56" y="550" font-size="11.5" fill="#334155">DF 置 1 时内核不替你分片：1472 过得去，1473 直接返回 message too long，这正是 PMTUD 的起点。</text>
  <text x="56" y="570" font-size="11.5" fill="#334155">两列 eth0 的 MTU 一模一样，唯一变的是下一跳是谁：邻居表里放对端网卡，还是只放网关网卡。</text>
</svg>
