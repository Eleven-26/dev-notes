<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="530" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">3KB 从杭州到深圳：物理段与光电转换</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#64748b">黄色 = 电 ↔ 光转换（计入 OEO）；蓝色 = 纯光或无源（不计入）；灰色 = 电信号处理</text>

  <rect x="30" y="74" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="56" y="86" font-size="12" fill="#92400e">电 ↔ 光转换（计入 OEO）</text>
  <rect x="250" y="74" width="18" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="276" y="86" font-size="12" fill="#1e3a8a">纯光 / 无源（不计入）</text>
  <rect x="460" y="74" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="486" y="86" font-size="12" fill="#334155">电信号处理（不单独计）</text>

  <rect x="15" y="110" width="145" height="76" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="87.5" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">杭州主机</text>
  <text x="87.5" y="162" text-anchor="middle" font-size="11.5" fill="#475569">网卡（电）</text>

  <rect x="180" y="110" width="145" height="76" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="252.5" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">楼内交换机</text>
  <text x="252.5" y="162" text-anchor="middle" font-size="11.5" fill="#475569">二层转发（电）</text>

  <rect x="345" y="110" width="145" height="76" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="417.5" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">光猫 ONT</text>
  <text x="417.5" y="162" text-anchor="middle" font-size="11.5" fill="#92400e">电 → 光</text>

  <rect x="510" y="110" width="145" height="76" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="582.5" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">分光器</text>
  <text x="582.5" y="162" text-anchor="middle" font-size="11.5" fill="#1e3a8a">无源，不转换</text>

  <rect x="675" y="110" width="145" height="76" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="747.5" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">OLT</text>
  <text x="747.5" y="162" text-anchor="middle" font-size="11.5" fill="#92400e">光 → 电</text>

  <rect x="840" y="110" width="145" height="76" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="912.5" y="138" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">BRAS / 城域</text>
  <text x="912.5" y="160" text-anchor="middle" font-size="11" fill="#92400e">IP 转发 + 电↔光</text>

  <line x1="162" y1="148" x2="176" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="327" y1="148" x2="341" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="492" y1="148" x2="506" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="657" y1="148" x2="671" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="822" y1="148" x2="836" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <line x1="912.5" y1="188" x2="912.5" y2="246" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="924" y="222" font-size="11" fill="#475569">出省</text>

  <rect x="840" y="250" width="145" height="76" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="912.5" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">省际 DWDM</text>
  <text x="912.5" y="300" text-anchor="middle" font-size="11" fill="#1e3a8a">EDFA 纯光放大</text>

  <rect x="675" y="250" width="145" height="76" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="747.5" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">OTN 再生</text>
  <text x="747.5" y="300" text-anchor="middle" font-size="11" fill="#92400e">光 → 电 → 光</text>

  <rect x="510" y="250" width="145" height="76" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="582.5" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">深圳城域</text>
  <text x="582.5" y="300" text-anchor="middle" font-size="11" fill="#92400e">IP 转发 + 电↔光</text>

  <rect x="345" y="250" width="145" height="76" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="417.5" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">深圳 OLT</text>
  <text x="417.5" y="300" text-anchor="middle" font-size="11" fill="#92400e">电 → 光</text>

  <rect x="180" y="250" width="145" height="76" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="252.5" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">深圳 ONT</text>
  <text x="252.5" y="300" text-anchor="middle" font-size="11" fill="#92400e">光 → 电</text>

  <rect x="15" y="250" width="145" height="76" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="87.5" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">深圳主机</text>
  <text x="87.5" y="300" text-anchor="middle" font-size="11.5" fill="#475569">网卡（电）</text>

  <line x1="838" y1="288" x2="824" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="673" y1="288" x2="659" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="508" y1="288" x2="494" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="343" y1="288" x2="329" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="178" y1="288" x2="164" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="15" y="348" width="970" height="164" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="30" y="376" font-size="12.5" fill="#7f1d1d">黄色节点 = 电 ↔ 光转换：ONT、OLT、路由器光口、OTN 再生，每个节点按「收光 + 发光」计 2 次</text>
  <text x="30" y="400" font-size="12.5" fill="#1e3a8a">蓝色节点 = 纯光 / 无源：分光器只分光，EDFA 只放大，ROADM 只换波长，都不做光电转换</text>
  <text x="30" y="424" font-size="12.5" fill="#334155">灰色节点 = 电信号处理：主机网卡与二层交换机，不单独计入 OEO</text>
  <text x="30" y="454" font-size="12.5" font-weight="bold" fill="#0f172a">OEO 次数 ≈ 2 ×（L3 转发节点数 + OTN 再生节点数）+ ONT 数</text>
  <text x="30" y="478" font-size="12.5" fill="#475569">按 L3 8~15 跳、OTN 再生 0~2 个、ONT 2 个估：约 18~36 次；精确值取决于运营商实际组网</text>
  <text x="30" y="500" font-size="11.5" fill="#64748b">省际 DWDM 一根光纤可跑几十个波长；EDFA 约每 80 km 一级，只放大不转换</text>
</svg>
