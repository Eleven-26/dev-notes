<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ErrorHandler 的判错顺序：一棵照着走就能定性的决策树</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">分支条件取自 3.4 的 switch；状态码与「该查什么」取自同一节的表 —— 初值是 502 upstream error</text>

  <rect x="40" y="80" width="320" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="200" y="102" text-anchor="middle" font-size="12" fill="#0f172a">进入 ErrorHandler，拿到 err</text>
  <text x="200" y="120" text-anchor="middle" font-size="11" fill="#475569">初值 status=502，msg=upstream error</text>

  <rect x="40" y="168" width="320" height="52" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="200" y="190" text-anchor="middle" font-size="12" fill="#0f172a">判据一：超时？</text>
  <text x="200" y="208" text-anchor="middle" font-size="10.5" fill="#475569">errors.Is(err, DeadlineExceeded) 或 IsTimeout</text>

  <rect x="40" y="256" width="320" height="52" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="200" y="278" text-anchor="middle" font-size="12" fill="#0f172a">判据二：连不上？</text>
  <text x="200" y="296" text-anchor="middle" font-size="10.5" fill="#475569">isConnRefused(err)</text>

  <rect x="40" y="344" width="320" height="52" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="200" y="366" text-anchor="middle" font-size="12" fill="#0f172a">判据三：体积超限？</text>
  <text x="200" y="384" text-anchor="middle" font-size="10.5" fill="#475569">errors.As(err, &amp;mbe)，mbe 是 MaxBytesError</text>

  <rect x="40" y="432" width="320" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="200" y="454" text-anchor="middle" font-size="12" fill="#0f172a">三条都不命中</text>
  <text x="200" y="472" text-anchor="middle" font-size="11" fill="#475569">保持初值，不改写</text>

  <line x1="200" y1="132" x2="200" y2="164" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar2)"/>
  <line x1="200" y1="220" x2="200" y2="252" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar2)"/>
  <line x1="200" y1="308" x2="200" y2="340" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar2)"/>
  <line x1="200" y1="396" x2="200" y2="428" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar2)"/>
  <text x="212" y="242" font-size="10.5" fill="#64748b">否</text>
  <text x="212" y="330" font-size="10.5" fill="#64748b">否</text>
  <text x="212" y="418" font-size="10.5" fill="#64748b">否</text>

  <rect x="420" y="168" width="190" height="52" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="515" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">504</text>
  <text x="515" y="208" text-anchor="middle" font-size="11" fill="#991b1b">upstream timeout</text>
  <rect x="420" y="256" width="190" height="52" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="515" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">502</text>
  <text x="515" y="296" text-anchor="middle" font-size="11" fill="#7c2d12">upstream refused</text>
  <rect x="420" y="344" width="190" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="515" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">413</text>
  <text x="515" y="384" text-anchor="middle" font-size="11" fill="#1e3a8a">request body too large</text>
  <rect x="420" y="432" width="190" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="515" y="454" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">502</text>
  <text x="515" y="472" text-anchor="middle" font-size="11" fill="#475569">upstream error</text>

  <line x1="360" y1="194" x2="416" y2="194" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ar3)"/>
  <line x1="360" y1="282" x2="416" y2="282" stroke="#ea580c" stroke-width="1.6" marker-end="url(#ar4)"/>
  <line x1="360" y1="370" x2="416" y2="370" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar5)"/>
  <line x1="360" y1="458" x2="416" y2="458" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar2)"/>
  <text x="368" y="186" font-size="10.5" fill="#dc2626">是</text>
  <text x="368" y="274" font-size="10.5" fill="#ea580c">是</text>
  <text x="368" y="362" font-size="10.5" fill="#2563eb">是</text>

  <text x="630" y="188" font-size="11.5" fill="#0f172a">该查：上游处理太慢，</text>
  <text x="630" y="206" font-size="11.5" fill="#475569">是不是该加大超时</text>
  <text x="630" y="276" font-size="11.5" fill="#0f172a">该查：上游进程是否存活、</text>
  <text x="630" y="294" font-size="11.5" fill="#475569">端口配置对不对</text>
  <text x="630" y="364" font-size="11.5" fill="#0f172a">该查：客户端请求太大，</text>
  <text x="630" y="382" font-size="11.5" fill="#475569">或该调大 maxBodyBytes</text>
  <text x="630" y="452" font-size="11.5" fill="#0f172a">注意：502 与 504 混成一个</text>
  <text x="630" y="470" font-size="11.5" fill="#475569">「上游错误」时，只能靠猜</text>

  <text x="40" y="516" font-size="11.5" fill="#7c2d12">注意：413 这一条特别容易漏 —— MaxBytesReader 的错误只在真正读取时才暴露，所以它以「上游错误」的形式落到 ErrorHandler 里；</text>
  <text x="40" y="536" font-size="11.5" fill="#7c2d12">不显式识别的话，上传超大文件会收到 502（像是网关坏了），而不是 413（明确告诉客户端文件太大）。</text>
  <text x="40" y="562" font-size="11.5" fill="#1e3a8a">要点：三条判据的顺序不能换 —— 先判超时、再判连不上、最后判体积，处置动作分别是加超时、拉起进程、调大限制。</text>

  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#64748b"/>
    </marker>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#dc2626"/>
    </marker>
    <marker id="ar4" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#ea580c"/>
    </marker>
    <marker id="ar5" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
