<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">DNS 报文的四段与标志位布局</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">12 字节定长头部 + 四个变长段；段的条数只在头部计数里，计数为 0 的段整段不存在</text>

  <text x="40" y="82" font-size="12.5" font-weight="bold" fill="#0f172a">头部（12 字节，偏移 0–11）</text>
  <rect x="40" y="92" width="153" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <rect x="193" y="92" width="154" height="44" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <rect x="347" y="92" width="153" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="500" y="92" width="153" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="653" y="92" width="154" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="807" y="92" width="153" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="116" y="110" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">ID（2B）</text>
  <text x="116" y="128" text-anchor="middle" font-size="10.5" fill="#1e3a8a">实测 188 / 64611</text>
  <text x="270" y="110" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">FLAGS（2B）</text>
  <text x="270" y="128" text-anchor="middle" font-size="10.5" fill="#92400e">见下方位展开</text>
  <text x="423" y="110" text-anchor="middle" font-size="11.5" fill="#0f172a">QDCOUNT</text>
  <text x="423" y="128" text-anchor="middle" font-size="10.5" fill="#64748b">QUERY: 1</text>
  <text x="576" y="110" text-anchor="middle" font-size="11.5" fill="#0f172a">ANCOUNT</text>
  <text x="576" y="128" text-anchor="middle" font-size="10.5" fill="#64748b">ANSWER: 2 / 0</text>
  <text x="730" y="110" text-anchor="middle" font-size="11.5" fill="#0f172a">NSCOUNT</text>
  <text x="730" y="128" text-anchor="middle" font-size="10.5" fill="#64748b">AUTHORITY: 13 / 2 / 0</text>
  <text x="883" y="110" text-anchor="middle" font-size="11.5" fill="#0f172a">ARCOUNT</text>
  <text x="883" y="128" text-anchor="middle" font-size="10.5" fill="#64748b">ADDITIONAL: 27 / 13</text>

  <text x="40" y="166" font-size="12.5" font-weight="bold" fill="#0f172a">FLAGS 的 16 个位（dig 输出里的 flags 就是这几位）</text>
  <rect x="40" y="176" width="57" height="34" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="97" y="176" width="230" height="34" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="327" y="176" width="58" height="34" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <rect x="385" y="176" width="57" height="34" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="442" y="176" width="58" height="34" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="500" y="176" width="57" height="34" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="557" y="176" width="58" height="34" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="615" y="176" width="57" height="34" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="672" y="176" width="58" height="34" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="730" y="176" width="230" height="34" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="68" y="197" text-anchor="middle" font-size="10.5" fill="#7f1d1d">QR</text>
  <text x="212" y="197" text-anchor="middle" font-size="10.5" fill="#64748b">OPCODE（4 位）</text>
  <text x="356" y="197" text-anchor="middle" font-size="10.5" fill="#92400e">AA</text>
  <text x="413" y="197" text-anchor="middle" font-size="10.5" fill="#64748b">TC</text>
  <text x="471" y="197" text-anchor="middle" font-size="10.5" fill="#1e3a8a">RD</text>
  <text x="528" y="197" text-anchor="middle" font-size="10.5" fill="#14532d">RA</text>
  <text x="586" y="197" text-anchor="middle" font-size="10.5" fill="#64748b">Z</text>
  <text x="643" y="197" text-anchor="middle" font-size="10.5" fill="#64748b">AD</text>
  <text x="701" y="197" text-anchor="middle" font-size="10.5" fill="#64748b">CD</text>
  <text x="845" y="197" text-anchor="middle" font-size="10.5" fill="#7c2d12">RCODE（4 位）</text>
  <text x="40" y="228" font-size="11.5" fill="#14532d">实测应答一（走 LDNS 的递归应答）：flags: qr rd ra ｜ QUERY: 1, ANSWER: 2, AUTHORITY: 2, ADDITIONAL: 13</text>
  <text x="40" y="248" font-size="11.5" fill="#7c2d12">实测应答二（@根 的迭代应答）：flags: qr; ｜ QUERY: 1, ANSWER: 0, AUTHORITY: 13, ADDITIONAL: 27</text>
  <text x="40" y="268" font-size="11.5" fill="#64748b">RD 设了 =「请替我 recursion」；RA 没设 =「对方只做迭代，给你的是指路不是答案」；AA 只在权威应答里出现</text>

  <text x="40" y="298" font-size="12.5" font-weight="bold" fill="#0f172a">四个变长段（按头部计数依次排布，计数为 0 就整段缺席）</text>
  <rect x="40" y="308" width="920" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="54" y="326" font-size="11.5" font-weight="bold" fill="#1e3a8a">① Question</text>
  <text x="54" y="344" font-size="11" fill="#1e3a8a">QNAME = example.com，QTYPE = A(1)，QCLASS = IN(1) ｜ 实测 QDCOUNT 恒为 1</text>

  <rect x="40" y="360" width="920" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="54" y="378" font-size="11.5" font-weight="bold" fill="#14532d">② Answer（TYPE 与 QTYPE 一致，权威才往这里写）</text>
  <text x="54" y="396" font-size="11" fill="#14532d">example.com. 600 IN A 172.66.147.243 ／ 104.20.23.154 ｜ 委派应答里这一段是空的（ANSWER: 0）</text>

  <rect x="40" y="412" width="920" height="46" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="54" y="430" font-size="11.5" font-weight="bold" fill="#7c2d12">③ Authority（NS / SOA，委派与否定应答都在这里）</text>
  <text x="54" y="448" font-size="11" fill="#7c2d12">com. 172800 IN NS a.gtld-servers.net. ｜ example.com. 172800 IN NS hera ／ elliott ｜ SOA 10000 2400 604800 1800</text>

  <rect x="40" y="464" width="920" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="54" y="482" font-size="11.5" font-weight="bold" fill="#0f172a">④ Additional（glue A 记录 + EDNS0 的 OPT 假记录）</text>
  <text x="54" y="500" font-size="11" fill="#334155">glue 108.162.192.162 ／ 172.64.32.162 ／ 173.245.58.162 ｜ OPT: udp: 1472（本机）、udp: 4096（上游）</text>

  <rect x="40" y="524" width="920" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="54" y="541" font-size="11" fill="#334155">名称在段里是「压缩指针」：0xC0 开头两字节，指向报文前文同一个名字，所以 dig 会打印 example.com 多次而 MSG SIZE 只有几十上百字节</text>
  <text x="54" y="559" font-size="11" fill="#334155">实测 MSG SIZE rcvd: 47（NXDOMAIN 那次）—— 计数与长度对不上就是被截断或有人改包</text>

  <rect x="20" y="578" width="470" height="102" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="36" y="600" font-size="12.5" font-weight="bold" fill="#92400e">两条读包判据</text>
  <text x="36" y="621" font-size="11.5" fill="#92400e">看到 ANSWER: 0 + AUTHORITY 有 NS ⇒ 这是 referral</text>
  <text x="36" y="642" font-size="11.5" fill="#92400e">看到 AA 缺失 ⇒ 答案来自缓存，不是权威现答</text>
  <text x="36" y="666" font-size="11.5" fill="#7f1d1d">flags 只有 qr；而非 qr aa ⇒ 应答方根本不是这个区的权威</text>

  <rect x="510" y="578" width="470" height="102" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="526" y="600" font-size="12.5" font-weight="bold" fill="#14532d">长度与传输</text>
  <text x="526" y="621" font-size="11.5" fill="#14532d">UDP 首包，TC=1 才回退 TCP；EDNS0 声明能收多大</text>
  <text x="526" y="642" font-size="11.5" fill="#14532d">实测本机默认带 udp: 1472，+nocookie / 老 resolver 见 512</text>
  <text x="526" y="666" font-size="11.5" fill="#7f1d1d">超过链路 MTU 的分片被中间设备丢 ⇒ 表现就是「间歇性 SERVFAIL」</text>
</svg>
