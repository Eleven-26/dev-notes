<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="cBlue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="cGreen" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ECN 拥塞标记的端侧流转（不丢包也能报拥塞）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">① 建连时 SYN / SYN-ACK 协商 → ② 发送方标记 ECT → ③ 路由器拥塞改 CE → ④ 接收方回 ECE → ⑤ 发送方减半并回 CWR</text>

  <rect x="40" y="118" width="200" height="74" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="140" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">发送方</text>
  <text x="140" y="170" text-anchor="middle" font-size="11.5" fill="#1e3a8a">维护 cwnd</text>

  <rect x="400" y="118" width="200" height="74" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text x="500" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">中间路由器</text>
  <text x="500" y="170" text-anchor="middle" font-size="11.5" fill="#9a3412">AQM 排队</text>

  <rect x="760" y="118" width="200" height="74" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="860" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">接收方</text>
  <text x="860" y="170" text-anchor="middle" font-size="11.5" fill="#14532d">检测 CE</text>

  <line x1="240" y1="155" x2="394" y2="155" stroke="#2563eb" stroke-width="1.8" marker-end="url(#cBlue)"/>
  <text x="317" y="106" text-anchor="middle" font-size="12" fill="#1e3a8a">② 数据包 ECN=ECT</text>

  <line x1="600" y1="155" x2="754" y2="155" stroke="#ea580c" stroke-width="1.8"/>
  <text x="677" y="106" text-anchor="middle" font-size="12" fill="#9a3412">③ 拥塞改 CE 不丢包</text>

  <line x1="820" y1="300" x2="186" y2="300" stroke="#16a34a" stroke-width="1.8" marker-end="url(#cGreen)"/>
  <text x="503" y="290" text-anchor="middle" font-size="12" fill="#14532d">④ ACK 置 ECE 回传</text>

  <line x1="180" y1="230" x2="180" y2="294" stroke="#16a34a" stroke-width="1.6"/>

  <text x="40" y="352" font-size="12.5" fill="#334155">⑤ 发送方收到 ECE：像遇到丢包一样把 cwnd 减半，并在下一个报文置 CWR 告诉接收方"已响应"。</text>
  <text x="40" y="378" font-size="12.5" fill="#334155">IP 首部 ECN 两位：00 不支持 / 01=ECT(1) / 10=ECT(0) / 11=CE；响应动作仍是 AIMD 的乘法减。</text>

  <rect x="20" y="398" width="960" height="56" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="36" y="424" font-size="12.5" fill="#7f1d1d">注意：ECN 需要端到端与中间设备都正确处理标记位——历史上存在中间设备误改 ECN 位、导致"开了 ECN 反而连不上"，</text>
  <text x="36" y="444" font-size="12.5" fill="#7f1d1d">这也是许多系统默认保守的原因。</text>
</svg>
