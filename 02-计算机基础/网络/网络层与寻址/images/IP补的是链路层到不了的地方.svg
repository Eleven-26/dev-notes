<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 588" width="1000" height="588" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="588" fill="#ffffff" rx="0"/>
  <rect x="0" y="0" width="1000" height="74" fill="#ffffff" rx="0"/>
  <text x="500" y="34" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">链路层只能到隔壁，IP 才把无数个隔壁连起来</text>
  <text x="500" y="58" font-size="12" fill="#64748b" text-anchor="middle">MAC 地址扁平、不可聚合、出了这一跳就用不上；IP 地址按拓扑分配、可分层聚合，于是每台设备只记「下一跳」</text>
  <rect x="24" y="86" width="464" height="372" fill="#fafafa" stroke="#e2e8f0" stroke-width="1" rx="8"/>
  <text x="42" y="116" font-size="14" fill="#1e40af" text-anchor="start" font-weight="bold">链路层：地址扁平，只能在本段内定位</text>
  <text x="42" y="140" font-size="11" fill="#64748b" text-anchor="start">广播域 = 一台交换机连出来的这一段</text>
  <rect x="40" y="160" width="432" height="172" fill="#ffffff" stroke="#93c5fd" stroke-width="1" rx="10" stroke-dasharray="6 4"/>
  <text x="256" y="184" font-size="11" fill="#1e40af" text-anchor="middle">一个广播域</text>
  <rect x="208" y="254" width="96" height="44" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" rx="6"/>
  <text x="256" y="282" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="bold">交换机</text>
  <rect x="64" y="198" width="108" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="118" y="226" font-size="12" fill="#0f172a" text-anchor="middle">主机 A</text>
  <rect x="340" y="198" width="108" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="394" y="226" font-size="12" fill="#0f172a" text-anchor="middle">主机 B</text>
  <line x1="172" y1="220" x2="208" y2="276" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="304" y1="276" x2="340" y2="220" stroke="#cbd5e1" stroke-width="2"/>
  <text x="118" y="262" font-size="10" fill="#64748b" text-anchor="middle">00:1a:2b:…:01</text>
  <text x="394" y="262" font-size="10" fill="#64748b" text-anchor="middle">00:1a:2b:…:02</text>
  <rect x="40" y="344" width="432" height="96" fill="#f1f5f9" rx="8"/>
  <text x="56" y="368" font-size="12" fill="#0f172a" text-anchor="start">MAC 表要记「每一台设备」：N 台设备就是 N 行</text>
  <text x="56" y="390" font-size="12" fill="#0f172a" text-anchor="start">地址与位置无关，所以不可聚合——</text>
  <text x="56" y="412" font-size="12" fill="#0f172a" text-anchor="start">离开本段后，这个地址对后续路由毫无意义</text>
  <text x="56" y="430" font-size="10" fill="#64748b" text-anchor="start">（本段边界之外，靠的是「下一跳交给谁」）</text>
  <rect x="512" y="86" width="464" height="372" fill="#fafafa" stroke="#e2e8f0" stroke-width="1" rx="8"/>
  <text x="530" y="116" font-size="14" fill="#166534" text-anchor="start" font-weight="bold">IP 层：地址可聚合，一跳一跳接力到全球</text>
  <text x="530" y="140" font-size="11" fill="#64748b" text-anchor="start">每段链路各管一段，段与段之间只交换「下一跳」</text>
  <rect x="528" y="194" width="68" height="40" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="562" y="219" font-size="12" fill="#0f172a" text-anchor="middle">主机</text>
  <rect x="649" y="194" width="68" height="40" fill="#dcfce7" stroke="#86efac" stroke-width="1" rx="6"/>
  <text x="683" y="219" font-size="12" fill="#166534" text-anchor="middle" font-weight="bold">R1</text>
  <rect x="770" y="194" width="68" height="40" fill="#dcfce7" stroke="#86efac" stroke-width="1" rx="6"/>
  <text x="804" y="219" font-size="12" fill="#166534" text-anchor="middle" font-weight="bold">R2</text>
  <rect x="891" y="194" width="68" height="40" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="925" y="219" font-size="12" fill="#0f172a" text-anchor="middle">主机</text>
  <line x1="596" y1="214" x2="649" y2="214" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="717" y1="214" x2="770" y2="214" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="838" y1="214" x2="891" y2="214" stroke="#cbd5e1" stroke-width="2"/>
  <text x="622" y="186" font-size="10" fill="#64748b" text-anchor="middle">链路 1</text>
  <text x="743" y="186" font-size="10" fill="#64748b" text-anchor="middle">链路 2</text>
  <text x="864" y="186" font-size="10" fill="#64748b" text-anchor="middle">链路 3</text>
  <rect x="528" y="262" width="432" height="178" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="8"/>
  <text x="544" y="286" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">同一个包，四台设备的视角</text>
  <text x="544" y="310" font-size="11" fill="#166534" text-anchor="start">目的 IP 192.0.2.10  → 全程不变（NAT 除外）</text>
  <text x="544" y="332" font-size="11" fill="#92400e" text-anchor="start">目的 MAC → 每一跳都换成「下一跳」的</text>
  <text x="544" y="360" font-size="11" fill="#64748b" text-anchor="start">路由表只看目的 IP 的前缀：</text>
  <text x="544" y="382" font-size="11" fill="#0f172a" text-anchor="start">192.0.2.0/24 → dev eth0   ← 前缀越具体越优先</text>
  <text x="544" y="404" font-size="11" fill="#0f172a" text-anchor="start">0.0.0.0/0  → via 网关      ← 兜底，永远最后用</text>
  <text x="544" y="428" font-size="11" fill="#166534" text-anchor="start">表项数与设备数无关，只与前缀条数有关</text>
  <rect x="24" y="476" width="952" height="92" fill="#fef3c7" stroke="#fbbf24" stroke-width="1" rx="8"/>
  <text x="44" y="502" font-size="13" fill="#92400e" text-anchor="start" font-weight="bold">同一个「10 亿台设备」的世界，三种记法的表项规模</text>
  <text x="44" y="528" font-size="12" fill="#0f172a" text-anchor="start">按 MAC 逐台记：10 亿条      ｜      按 /24 聚合：约 394 万条（10 亿 ÷ 254）      ｜      按 /16 聚合：约 1.5 万条（10 亿 ÷ 65 534）</text>
  <text x="44" y="552" font-size="11" fill="#92400e" text-anchor="start">可聚合性不是优化项，而是 IP 能在全球跑起来的唯一理由</text>
</svg>
