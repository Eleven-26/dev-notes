<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 448" width="1000" height="448" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="448" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">「寻址」不是一件事，是两条线七个零件</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">上线是「地址本体怎么算、包按它往哪走」；下线是「地址和名字是谁给的」——七个零件各占一格，没有一个能替代另一个</text>

  <rect x="20" y="66" width="440" height="22" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" rx="6"/>
  <text x="30" y="82" font-size="12.5" font-weight="bold" fill="#1e40af">线一 · 地址本体：地址是什么，包按它怎么走</text>

  <g transform="translate(20,92)">
    <rect x="0" y="0" width="231" height="120" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="14" font-weight="bold" fill="#0f172a">IP 与路由基础</text>
    <text x="14" y="46" font-size="10.5" fill="#1e40af">地址是什么、下一跳是谁</text>
    <text x="14" y="70" font-size="10" fill="#334155">CIDR 判定同子网 · 最长前缀</text>
    <text x="14" y="88" font-size="10" fill="#334155">路由表与出站决策</text>
    <text x="14" y="106" font-size="10" fill="#64748b">ARP / NDP · ICMP · MTU</text>
  </g>

  <g transform="translate(263,92)">
    <rect x="0" y="0" width="231" height="120" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="13" font-weight="bold" fill="#0f172a">子网掩码与网段划分</text>
    <text x="14" y="46" font-size="10.5" fill="#1e40af">一个掩码切出一条边界</text>
    <text x="14" y="70" font-size="10" fill="#334155">块大小口算 · 可用主机数</text>
    <text x="14" y="88" font-size="10" fill="#334155">VLSM 切分 / 超网聚合</text>
    <text x="14" y="106" font-size="10" fill="#64748b">掩码配错的单向不通</text>
  </g>

  <g transform="translate(506,92)">
    <rect x="0" y="0" width="231" height="120" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="14" font-weight="bold" fill="#0f172a">IPv6 与双栈</text>
    <text x="14" y="46" font-size="10.5" fill="#1e40af">换一套地址，哪些跟着改了</text>
    <text x="14" y="70" font-size="10" fill="#334155">固定 40 字节首部 + 扩展头</text>
    <text x="14" y="88" font-size="10" fill="#334155">RA / SLAAC / DHCPv6 / DAD</text>
    <text x="14" y="106" font-size="10" fill="#64748b">双栈主机怎么选源地址</text>
  </g>

  <g transform="translate(749,92)">
    <rect x="0" y="0" width="231" height="120" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="14" font-weight="bold" fill="#0f172a">NAT 与连接跟踪</text>
    <text x="14" y="46" font-size="10.5" fill="#1e40af">地址在途中被别人改了</text>
    <text x="14" y="70" font-size="10" fill="#334155">SNAT / DNAT 各改哪一段</text>
    <text x="14" y="88" font-size="10" fill="#334155">conntrack 用五元组还原回程</text>
    <text x="14" y="106" font-size="10" fill="#64748b">各段空闲超时 · 端口耗尽</text>
  </g>

  <rect x="20" y="226" width="660" height="22" fill="#dcfce7" stroke="#86efac" stroke-width="1" rx="6"/>
  <text x="30" y="242" font-size="12.5" font-weight="bold" fill="#166534">线二 · 地址来源：这台机器的地址、这个域名的地址，是谁告诉它的</text>

  <g transform="translate(20,252)">
    <rect x="0" y="0" width="231" height="120" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="14" font-weight="bold" fill="#0f172a">DHCP</text>
    <text x="14" y="46" font-size="10.5" fill="#166534">四个参数从哪来</text>
    <text x="14" y="70" font-size="10" fill="#334155">DORA 四阶段怎么投递</text>
    <text x="14" y="88" font-size="10" fill="#334155">T1 续租 / T2 重绑定</text>
    <text x="14" y="106" font-size="10" fill="#64748b">IPv6 侧换成 RA 那一套</text>
  </g>

  <g transform="translate(263,252)">
    <rect x="0" y="0" width="231" height="120" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="14" font-weight="bold" fill="#0f172a">DNS 解析</text>
    <text x="14" y="46" font-size="10.5" fill="#166534">名字怎么换成地址</text>
    <text x="14" y="70" font-size="10" fill="#334155">层级与委派 · 递归 vs 迭代</text>
    <text x="14" y="88" font-size="10" fill="#334155">记录类型与 TTL 缓存</text>
    <text x="14" y="106" font-size="10" fill="#64748b">GSLB 就近调度</text>
  </g>

  <g transform="translate(506,252)">
    <rect x="0" y="0" width="231" height="120" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="14" font-weight="bold" fill="#0f172a">DNS 安全与加密解析</text>
    <text x="14" y="46" font-size="10.5" fill="#166534">这条链本身可信吗</text>
    <text x="14" y="70" font-size="10" fill="#334155">劫持与缓存投毒怎么区分</text>
    <text x="14" y="88" font-size="10" fill="#334155">DoH / DoT / DoQ 各保护哪段</text>
    <text x="14" y="106" font-size="10" fill="#64748b">DNSSEC 只保完整不保隐私</text>
  </g>

  <g transform="translate(749,252)">
    <rect x="0" y="0" width="231" height="120" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="12" font-weight="bold" fill="#475569">这条线只有三篇</text>
    <text x="14" y="48" font-size="10" fill="#64748b">DHCP 管「本机的地址从哪来」，</text>
    <text x="14" y="66" font-size="10" fill="#64748b">DNS 两篇管「名字的地址从哪来、</text>
    <text x="14" y="84" font-size="10" fill="#64748b">这条链可不可信」。</text>
    <text x="14" y="106" font-size="9.5" fill="#94a3b8">再往下的地址下发机制归协议层</text>
  </g>

  <g transform="translate(20,390)">
    <rect x="0" y="0" width="960" height="46" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="10"/>
    <text x="14" y="20" font-size="11.5" font-weight="bold" fill="#0f172a">两条线的分界：地址「算得对不对、走得通不通」归线一；地址「从哪来、可不可信」归线二。</text>
    <text x="14" y="38" font-size="10.5" fill="#92400e">DNS 解析出来的地址，最终怎么被路由、怎么被 NAT 改写，仍然回到线一那四篇——两条线在「地址」这个词上接起来。</text>
  </g>
</svg>
