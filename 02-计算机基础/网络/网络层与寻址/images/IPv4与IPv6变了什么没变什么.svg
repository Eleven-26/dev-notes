<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 604" width="1000" height="604" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="604" fill="#ffffff" rx="0"/>
  <rect x="0" y="0" width="1000" height="74" fill="#ffffff" rx="0"/>
  <text x="500" y="34" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">IPv6 换了做法，没换契约</text>
  <text x="500" y="58" font-size="12" fill="#64748b" text-anchor="middle">上半六处是「怎么把包送到」的做法变了；下半四条是「送到之后谁负责」的契约没变</text>
  <rect x="24" y="86" width="952" height="288" fill="#fafafa" stroke="#e2e8f0" stroke-width="1" rx="8"/>
  <text x="42" y="114" font-size="14" fill="#9f1239" text-anchor="start" font-weight="bold">变了：六处做法</text>
  <text x="42" y="136" font-size="11" fill="#64748b" text-anchor="start">每一处都在省一种代价——省掉的是中间设备的运算、状态或打扰范围</text>
  <rect x="42" y="152" width="288" height="88" fill="#ffe4e6" stroke="#fda4af" stroke-width="1" rx="7"/>
  <text x="56" y="178" font-size="12.5" fill="#9f1239" text-anchor="start" font-weight="bold">首部固定 40 字节</text>
  <text x="56" y="200" font-size="10.5" fill="#0f172a" text-anchor="start">选项挪进扩展头链，转发芯片按固定偏移取字段</text>
  <rect x="352" y="152" width="288" height="88" fill="#ffe4e6" stroke="#fda4af" stroke-width="1" rx="7"/>
  <text x="366" y="178" font-size="12.5" fill="#9f1239" text-anchor="start" font-weight="bold">取消首部校验和</text>
  <text x="366" y="200" font-size="10.5" fill="#0f172a" text-anchor="start">链路层有 FCS、传输层有校验和；省掉每跳</text>
  <text x="366" y="218" font-size="10.5" fill="#0f172a" text-anchor="start">一次全首部运算</text>
  <rect x="662" y="152" width="288" height="88" fill="#ffe4e6" stroke="#fda4af" stroke-width="1" rx="7"/>
  <text x="676" y="178" font-size="12.5" fill="#9f1239" text-anchor="start" font-weight="bold">只有源端能分片</text>
  <text x="676" y="200" font-size="10.5" fill="#0f172a" text-anchor="start">路由器不留重组状态，也没有分片重叠这类攻击</text>
  <text x="676" y="218" font-size="10.5" fill="#0f172a" text-anchor="start">面</text>
  <rect x="42" y="256" width="288" height="88" fill="#ffe4e6" stroke="#fda4af" stroke-width="1" rx="7"/>
  <text x="56" y="282" font-size="12.5" fill="#9f1239" text-anchor="start" font-weight="bold">NDP 替代 ARP</text>
  <text x="56" y="304" font-size="10.5" fill="#0f172a" text-anchor="start">组播只打扰相关的一小撮，不再向整段广播</text>
  <rect x="352" y="256" width="288" height="88" fill="#ffe4e6" stroke="#fda4af" stroke-width="1" rx="7"/>
  <text x="366" y="282" font-size="12.5" fill="#9f1239" text-anchor="start" font-weight="bold">SLAAC 主机自算</text>
  <text x="366" y="304" font-size="10.5" fill="#0f172a" text-anchor="start">路由器只通告前缀，地址由主机自己拼出来</text>
  <rect x="662" y="256" width="288" height="88" fill="#ffe4e6" stroke="#fda4af" stroke-width="1" rx="7"/>
  <text x="676" y="282" font-size="12.5" fill="#9f1239" text-anchor="start" font-weight="bold">设计上不需要 NAT</text>
  <text x="676" y="304" font-size="10.5" fill="#0f172a" text-anchor="start">地址足够，端到端可达得以保留</text>
  <rect x="24" y="392" width="952" height="148" fill="#fafafa" stroke="#e2e8f0" stroke-width="1" rx="8"/>
  <text x="42" y="420" font-size="14" fill="#166534" text-anchor="start" font-weight="bold">没变：四条契约</text>
  <text x="42" y="442" font-size="11" fill="#64748b" text-anchor="start">所以 TCP 在 v6 上一行代码都不用改，唯一的变化是 MSS 从 1460 变成 1440</text>
  <rect x="42" y="456" width="219" height="62" fill="#dcfce7" stroke="#86efac" stroke-width="1" rx="7"/>
  <text x="54" y="480" font-size="12" fill="#166534" text-anchor="start" font-weight="bold">无连接、尽力而为</text>
  <text x="54" y="501" font-size="10.5" fill="#0f172a" text-anchor="start">仍不保证送达、顺序、不重复</text>
  <rect x="279" y="456" width="219" height="62" fill="#dcfce7" stroke="#86efac" stroke-width="1" rx="7"/>
  <text x="291" y="480" font-size="12" fill="#166534" text-anchor="start" font-weight="bold">最长前缀匹配</text>
  <text x="291" y="501" font-size="10.5" fill="#0f172a" text-anchor="start">默认路由兜底、更具体的赢</text>
  <rect x="516" y="456" width="219" height="62" fill="#dcfce7" stroke="#86efac" stroke-width="1" rx="7"/>
  <text x="528" y="480" font-size="12" fill="#166534" text-anchor="start" font-weight="bold">MTU 与 ICMP 差错</text>
  <text x="528" y="501" font-size="10.5" fill="#0f172a" text-anchor="start">v6 更依赖：PMTUD 成了必答题</text>
  <rect x="753" y="456" width="219" height="62" fill="#dcfce7" stroke="#86efac" stroke-width="1" rx="7"/>
  <text x="765" y="480" font-size="12" fill="#166534" text-anchor="start" font-weight="bold">端到端地址</text>
  <text x="765" y="501" font-size="10.5" fill="#0f172a" text-anchor="start">源与目的地址在不改写时不变</text>
  <rect x="24" y="552" width="952" height="38" fill="#f1f5f9" rx="6"/>
  <text x="524" y="577" font-size="12" fill="#0f172a" text-anchor="middle">判断口径：凡是「可靠、顺序、流控」的问题，仍然归传输层；v6 一个字都没接过去</text>
</svg>
