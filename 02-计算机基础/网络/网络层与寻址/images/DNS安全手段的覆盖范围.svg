<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">DNS 安全手段各覆盖链路哪一段</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">加密解析防链路中间人，DNSSEC 防来源与完整性，HTTPS 证书校验是最后的兜底</text>

  <rect x="30" y="96" width="130" height="62" rx="9" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="95" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">App / 浏览器</text>
  <text x="95" y="142" text-anchor="middle" font-size="10" fill="#4338ca">发起域名查询</text>

  <rect x="225" y="96" width="140" height="62" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="295" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">本机 stub</text>
  <text x="295" y="142" text-anchor="middle" font-size="10" fill="#64748b">resolv.conf / hosts</text>

  <rect x="430" y="96" width="150" height="62" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="505" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">递归解析器（LDNS）</text>
  <text x="505" y="142" text-anchor="middle" font-size="10" fill="#92400e">缓存 + 迭代查询</text>

  <rect x="645" y="96" width="140" height="62" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="715" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">权威服务器</text>
  <text x="715" y="142" text-anchor="middle" font-size="10" fill="#14532d">持有该域记录</text>

  <rect x="850" y="96" width="120" height="62" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="910" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">业务服务器</text>
  <text x="910" y="142" text-anchor="middle" font-size="10" fill="#5b21b6">HTTPS 服务</text>

  <line x1="160" y1="127" x2="221" y2="127" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="221,127 211,122 211,132" fill="#94a3b8"/>
  <line x1="365" y1="127" x2="426" y2="127" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="426,127 416,122 416,132" fill="#94a3b8"/>
  <line x1="580" y1="127" x2="641" y2="127" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="641,127 631,122 631,132" fill="#94a3b8"/>
  <line x1="785" y1="127" x2="846" y2="127" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="846,127 836,122 836,132" fill="#94a3b8"/>

  <path d="M 225 188 L 365 188" stroke="#2563eb" stroke-width="2.4" fill="none"/>
  <path d="M 225 182 L 225 194 M 365 182 L 365 194" stroke="#2563eb" stroke-width="2.4"/>
  <text x="295" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">DoH / DoT / DoQ</text>
  <text x="295" y="226" text-anchor="middle" font-size="10" fill="#1e40af">只加密「客户端 ↔ 递归」</text>

  <path d="M 430 188 L 785 188" stroke="#16a34a" stroke-width="2.4" fill="none"/>
  <path d="M 430 182 L 430 194 M 785 182 L 785 194" stroke="#16a34a" stroke-width="2.4"/>
  <text x="607" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">DNSSEC</text>
  <text x="607" y="226" text-anchor="middle" font-size="10" fill="#15803d">签名链校验来源与完整性，不加密</text>

  <path d="M 30 256 L 970 256" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="6 4" fill="none"/>
  <text x="500" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">HTTPS + 严格证书校验：即使解析被改到假 IP，也因证书域名不匹配而连不上</text>

  <rect x="30" y="300" width="440" height="106" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="48" y="324" font-size="12" font-weight="bold" fill="#334155">HTTPDNS：换一条解析路径</text>
  <text x="48" y="346" font-size="10.5" fill="#64748b">App 通过 HTTPS 直接查厂商的 DNS 集群，绕开 LDNS 与运营商缓存。</text>
  <text x="48" y="364" font-size="10.5" fill="#64748b">优点：防劫持、按真实用户 IP 调度、可探测切换。</text>
  <text x="48" y="382" font-size="10.5" fill="#92400e">代价：需 SDK（Web 用不了）、自己管缓存 / 兜底、IP 直连要处理证书 SNI。</text>

  <rect x="490" y="300" width="480" height="106" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="508" y="324" font-size="12" font-weight="bold" fill="#334155">三种手段的分工（不能互相替代）</text>
  <text x="508" y="346" font-size="10.5" fill="#1e40af">DoH / DoT / DoQ → 防「客户端到递归」链路上的窃听与篡改。</text>
  <text x="508" y="364" font-size="10.5" fill="#15803d">DNSSEC → 防伪造记录与缓存投毒；失败时返回 SERVFAIL。</text>
  <text x="508" y="382" font-size="10.5" fill="#5b21b6">HTTPS 证书 → 防「解析对了但连到假站」或被劫持到假 IP。</text>

  <text x="30" y="428" font-size="10.5" fill="#94a3b8">注：三者都不提供查询隐私——递归服务器仍能看到你查了什么；要隐藏查询内容需要额外的隐私方案（如 ODoH），本仓库未展开。</text>
</svg>
