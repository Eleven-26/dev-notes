<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="vB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="vG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="vO" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">IPv6 地址配置的三条路径与 M／O 标志</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">机制说明（RFC 4861／4862／8415／8106）；本机 Windows 无可用 IPv6 链路，本节未做抓包实测</text>

  <rect x="380" y="76" width="240" height="58" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="500" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">路由器发 RA（周期／应答 RS）</text>
  <text x="500" y="119" text-anchor="middle" font-size="11" fill="#92400e">带前缀、默认路由、M 与 O 两个标志位</text>

  <rect x="60" y="176" width="180" height="56" rx="11" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="150" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">M=0 ／ O=0</text>
  <text x="150" y="218" text-anchor="middle" font-size="10.5" fill="#64748b">纯 SLAAC</text>
  <rect x="410" y="176" width="180" height="56" rx="11" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="500" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">M=0 ／ O=1</text>
  <text x="500" y="218" text-anchor="middle" font-size="10.5" fill="#64748b">SLAAC ＋ 无状态 DHCPv6</text>
  <rect x="760" y="176" width="180" height="56" rx="11" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="850" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">M=1</text>
  <text x="850" y="218" text-anchor="middle" font-size="10.5" fill="#64748b">有状态 DHCPv6</text>

  <line x1="440" y1="134" x2="170" y2="172" stroke="#ea580c" stroke-width="1.6" marker-end="url(#vO)"/>
  <line x1="500" y1="134" x2="500" y2="172" stroke="#ea580c" stroke-width="1.6" marker-end="url(#vO)"/>
  <line x1="560" y1="134" x2="830" y2="172" stroke="#ea580c" stroke-width="1.6" marker-end="url(#vO)"/>

  <rect x="46" y="252" width="208" height="128" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="150" y="274" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">地址：自己算</text>
  <text x="150" y="295" font-size="10.5" fill="#14532d">前缀 ＋ 接口标识（EUI-64</text>
  <text x="150" y="312" font-size="10.5" fill="#14532d">或随机隐私地址）</text>
  <text x="150" y="334" font-size="10.5" fill="#14532d">DNS：RA 的 RDNSS 选项</text>
  <text x="150" y="353" font-size="10.5" fill="#14532d">服务器不记状态（无状态）</text>

  <rect x="396" y="252" width="208" height="128" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="500" y="274" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">地址：仍自己算</text>
  <text x="500" y="295" font-size="10.5" fill="#1e3a8a">SLAAC 负责地址与默认路由</text>
  <text x="500" y="314" font-size="10.5" fill="#1e3a8a">DHCPv6 只补 DNS／域名</text>
  <text x="500" y="335" font-size="10.5" fill="#1e3a8a">SOLICIT 带 O 标志触发</text>
  <text x="500" y="354" font-size="10.5" fill="#1e3a8a">服务器仍不分配地址</text>

  <rect x="746" y="252" width="208" height="128" rx="11" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="850" y="274" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c2d12">地址：服务器分配</text>
  <text x="850" y="295" font-size="10.5" fill="#7c2d12">SOLICIT→ADVERTISE→</text>
  <text x="850" y="312" font-size="10.5" fill="#7c2d12">REQUEST→REPLY（四步）</text>
  <text x="850" y="334" font-size="10.5" fill="#7c2d12">有状态：服务器记绑定</text>
  <text x="850" y="353" font-size="10.5" fill="#7c2d12">RENEW／REBIND 对应 T1／T2</text>

  <line x1="150" y1="232" x2="150" y2="248" stroke="#16a34a" stroke-width="1.5" marker-end="url(#vG)"/>
  <line x1="500" y1="232" x2="500" y2="248" stroke="#2563eb" stroke-width="1.5" marker-end="url(#vB)"/>
  <line x1="850" y1="232" x2="850" y2="248" stroke="#ea580c" stroke-width="1.5" marker-end="url(#vO)"/>

  <rect x="20" y="400" width="470" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="36" y="424" font-size="12.5" font-weight="bold" fill="#0f172a">DAD：地址启用前的一轮探测（三条路径都要走）</text>
  <text x="36" y="447" font-size="12" fill="#334155">① 算出候选地址 → ② 从 :: 发 NS，目标就是候选地址本身</text>
  <text x="36" y="468" font-size="12" fill="#334155">③ 有人答 NA ⇒ 地址已被占用，换一个；无人答 ⇒ 启用</text>
  <text x="36" y="492" font-size="12" fill="#7f1d1d">⚠️ 链路不支持组播（隧道、组播被限）⇒ DAD 失败，地址永远启用不了</text>
  <text x="36" y="512" font-size="12" fill="#7f1d1d">⚠️ DAD 是秒级：接口「刚上线短暂不可用」是正常现象，不是故障</text>

  <rect x="510" y="400" width="470" height="120" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="526" y="424" font-size="12.5" font-weight="bold" fill="#7c2d12">与 DHCPv4 最容易被问的三个差别</text>
  <text x="526" y="447" font-size="12" fill="#7c2d12">① 默认路由来自 RA，不来自「发地址的那个东西」——两者解耦</text>
  <text x="526" y="468" font-size="12" fill="#7c2d12">② 地址能自己算（SLAAC），所以大多数网络里根本没有 DHCPv6</text>
  <text x="526" y="489" font-size="12" fill="#7c2d12">③ 续期靠 RA 的 Preferred／Valid Lifetime，而不是 T1／T2 定时器</text>
  <text x="526" y="512" font-size="12" fill="#334155">排障顺序也因此不同：先看有没有收到 RA，再看 M／O，最后才查 DHCPv6</text>

  <rect x="20" y="534" width="960" height="70" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="36" y="558" font-size="12.5" font-weight="bold" fill="#92400e">一句话记住这套形状</text>
  <text x="36" y="582" font-size="12" fill="#92400e">IPv6 把「拿地址」交给了路由器（RA）和主机自己（SLAAC），DHCPv6 退化成「补 DNS 的可选件」；只有 M=1 时它才回到 DHCPv4 的角色</text>
</svg>
