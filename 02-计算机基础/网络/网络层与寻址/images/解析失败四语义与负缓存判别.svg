<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arwD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 4.5 L0 9 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="580" fill="#ffffff"/>
  <text x="40" y="26" font-size="15" font-weight="bold" fill="#0f172a">解析失败先分「有没有报文回来」，再读 status；负缓存另有一步</text>

  <text x="40" y="66" font-size="11.5" font-weight="bold" fill="#334155">上半：四种失败语义的分流</text>

  <path d="M280 118 L318 118" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwD)"/>
  <path d="M160 146 L160 188" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwD)"/>
  <path d="M280 218 L300 218 M300 200 L300 374 M300 200 L318 200 M300 258 L318 258 M300 316 L318 316 M300 374 L318 374" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwD)"/>

  <rect x="40" y="90" width="240" height="56" fill="#f1f5f9" stroke="#475569" stroke-width="1.4" rx="6"/>
  <text x="160" y="114" font-size="11.5" font-weight="bold" fill="#0f172a" text-anchor="middle">① 报文回来了吗？</text>
  <text x="160" y="134" font-size="10" fill="#475569" text-anchor="middle">先看有没有应答</text>

  <rect x="320" y="90" width="724" height="56" fill="#fff7ed" stroke="#b45309" stroke-width="1" rx="6"/>
  <text x="334" y="114" font-size="11" font-weight="bold" fill="#b45309">没回来：超时 / 无响应</text>
  <text x="334" y="135" font-size="10" fill="#78350f">网络阻断、防火墙丢 UDP 53、服务器过载 —— 与下面四种在报文层面就不同，别去读 status</text>

  <rect x="40" y="190" width="240" height="56" fill="#f1f5f9" stroke="#475569" stroke-width="1.4" rx="6"/>
  <text x="160" y="214" font-size="11.5" font-weight="bold" fill="#0f172a" text-anchor="middle">② 读 status 字段</text>
  <text x="160" y="234" font-size="10" fill="#475569" text-anchor="middle">dig 输出第一行的 status:</text>

  <rect x="320" y="174" width="724" height="52" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="6"/>
  <text x="334" y="196" font-size="11" font-weight="bold" fill="#1e40af">NXDOMAIN → 权威明确说「没这个名」</text>
  <text x="334" y="216" font-size="10" fill="#475569">域名拼错、记录没配、或子域未委派</text>

  <rect x="320" y="232" width="724" height="52" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="6"/>
  <text x="334" y="254" font-size="11" font-weight="bold" fill="#1e40af">NOERROR 但无答案（NODATA）→ 名字存在，只是没有这种类型</text>
  <text x="334" y="274" font-size="10" fill="#475569">例如域名只有 A 没有 AAAA（常见于 AAAA 查询）、或只有 MX 没有 A</text>

  <rect x="320" y="290" width="724" height="52" fill="#fef2f2" stroke="#b91c1c" stroke-width="1" rx="6"/>
  <text x="334" y="312" font-size="11" font-weight="bold" fill="#b91c1c">SERVFAIL → 服务器处理不了这条查询</text>
  <text x="334" y="332" font-size="10" fill="#7f1d1d">权威不可达、DNSSEC 验签失败、上游超时被汇总；⭐ 最易被误当成「域名不存在」</text>

  <rect x="320" y="348" width="724" height="52" fill="#f0fdf4" stroke="#166534" stroke-width="1" rx="6"/>
  <text x="334" y="370" font-size="11" font-weight="bold" fill="#166534">NOERROR 且有答案 → 解析本身没问题</text>
  <text x="334" y="390" font-size="10" fill="#14532d">结果仍不符预期时去查 TTL、缓存与调度，见 DNS解析.md</text>

  <text x="40" y="428" font-size="11.5" font-weight="bold" fill="#334155">下半：「刚配好记录却仍解析不到」是不是负缓存？</text>

  <path d="M340 470 L360 470 M360 456 L360 524 M360 456 L378 456 M360 524 L378 524" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwD)"/>

  <rect x="40" y="442" width="300" height="56" fill="#f1f5f9" stroke="#475569" stroke-width="1.4" rx="6"/>
  <text x="190" y="466" font-size="11.5" font-weight="bold" fill="#0f172a" text-anchor="middle">③ 看 AUTHORITY 段</text>
  <text x="190" y="486" font-size="10" fill="#475569" text-anchor="middle">否定应答里有没有 SOA</text>

  <rect x="380" y="430" width="664" height="52" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="6"/>
  <text x="394" y="452" font-size="11" font-weight="bold" fill="#1e40af">带 SOA → 这是权威给出的否定，已被递归负缓存</text>
  <text x="394" y="472" font-size="10" fill="#475569">缓存时长由 SOA 的 minimum TTL 决定，只能等它过期或去刷递归缓存</text>

  <rect x="380" y="498" width="664" height="52" fill="#fff7ed" stroke="#b45309" stroke-width="1" rx="6"/>
  <text x="394" y="520" font-size="11" font-weight="bold" fill="#b45309">读不到 SOA → 不能证明否定来自权威</text>
  <text x="394" y="540" font-size="10" fill="#78350f">另查本机 hosts 与解析配置，并怀疑中间设备伪造了应答</text>

  <text x="40" y="570" font-size="10" fill="#64748b">另一类症状同源：偶发故障后持续不可用 —— 一次抖动导致的失败被负缓存，短时间内一直失败。</text>
</svg>
