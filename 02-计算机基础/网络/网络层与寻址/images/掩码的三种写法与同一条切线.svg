<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 476" width="1000" height="476" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="476" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一个掩码只做一件事：把 32 位切两段</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">前缀长度、点分十进制、反掩码——三种写法记的是同一条切线，切线位置由前缀位数决定</text>

  <rect x="20" y="72" width="960" height="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="30" y="90" font-size="12" fill="#334155">以 192.0.2.10/25 为例：前 25 位是网络位（决定「我在哪个网段」），剩下 7 位是主机位（决定「我是这个网段里的哪台」）</text>

  <rect x="20" y="106" width="740" height="118" fill="#fafafa" stroke="#e2e8f0" stroke-width="1" rx="8"/>

  <rect x="30" y="116" width="562.5" height="26" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" rx="5"/>
  <text x="311" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">网络位 25 位</text>

  <rect x="592.5" y="116" width="157.5" height="26" fill="#fef3c7" stroke="#fbbf24" stroke-width="1" rx="5"/>
  <text x="671" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">主机位 7 位</text>

  <rect x="30" y="162" width="180" height="44" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="6"/>
  <text x="120" y="190" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">192</text>

  <rect x="210" y="162" width="180" height="44" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="6"/>
  <text x="300" y="190" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">0</text>

  <rect x="390" y="162" width="180" height="44" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="6"/>
  <text x="480" y="190" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">2</text>

  <rect x="570" y="162" width="180" height="44" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" rx="6"/>
  <text x="660" y="190" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">10</text>

  <text x="120" y="156" text-anchor="middle" font-size="9" fill="#64748b">第 1 字节 · 8 位</text>
  <text x="300" y="156" text-anchor="middle" font-size="9" fill="#64748b">第 2 字节 · 8 位</text>
  <text x="480" y="156" text-anchor="middle" font-size="9" fill="#64748b">第 3 字节 · 8 位</text>
  <text x="660" y="156" text-anchor="middle" font-size="9" fill="#64748b">第 4 字节 · 8 位</text>

  <text x="120" y="220" text-anchor="middle" font-size="9" fill="#64748b">192.0.2 这 24 位属网络位</text>
  <text x="660" y="220" text-anchor="middle" font-size="9" fill="#b45309">10 的前 1 位属网络位、后 7 位属主机位</text>

  <rect x="776" y="106" width="204" height="118" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" rx="8"/>
  <text x="788" y="134" font-size="11.5" font-weight="bold" fill="#166534">主机位数怎么来</text>
  <text x="788" y="156" font-size="11" fill="#334155">h = 32 − 前缀 = 32 − 25 = 7</text>
  <text x="788" y="178" font-size="11" fill="#334155">整段地址 = 2^h = 128 个</text>
  <text x="788" y="200" font-size="11" fill="#334155">可用主机 = 2^h − 2 = 126 台</text>

  <rect x="20" y="236" width="940" height="52" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="8"/>
  <text x="34" y="258" font-size="12.5" font-weight="bold" fill="#0f172a">前缀长度</text>
  <text x="34" y="277" font-size="10" fill="#64748b">CIDR 的标准记法</text>
  <text x="180" y="268" font-size="15" font-weight="bold" fill="#1d4ed8">/25</text>
  <text x="320" y="268" font-size="11" fill="#334155">Linux ip、K8s、Docker --subnet、云控制台、几乎所有现代配置</text>

  <rect x="20" y="294" width="940" height="52" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="8"/>
  <text x="34" y="316" font-size="12.5" font-weight="bold" fill="#0f172a">点分十进制掩码</text>
  <text x="34" y="335" font-size="10" fill="#64748b">把 1 填满网络位</text>
  <text x="180" y="326" font-size="15" font-weight="bold" fill="#1d4ed8">255.255.255.128</text>
  <text x="320" y="326" font-size="11" fill="#334155">Windows ipconfig、DHCP Option 1、老式路由器界面、部分防火墙</text>

  <rect x="20" y="352" width="940" height="52" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="8"/>
  <text x="34" y="374" font-size="12.5" font-weight="bold" fill="#0f172a">反掩码 wildcard</text>
  <text x="34" y="393" font-size="10" fill="#64748b">把掩码按位取反</text>
  <text x="180" y="384" font-size="15" font-weight="bold" fill="#b45309">0.0.0.127</text>
  <text x="320" y="384" font-size="11" fill="#334155">Cisco ACL 的 host 匹配、OSPF network 语句、老式 iptables 写法；算法就是 255.255.255.255 减掩码</text>

  <rect x="20" y="416" width="940" height="46" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
  <text x="34" y="436" font-size="11.5" font-weight="bold" fill="#0f172a">写法可以换，切线的位置不能猜：看到 255.255.255.192 要能立刻说出这是 /26（块大小 64、62 台可用）。</text>
  <text x="34" y="454" font-size="10.5" fill="#92400e">反掩码最容易写错——它标的是「哪些位可以变」，所以 0 才是必须匹配、255 才是任意，跟直觉相反。</text>
</svg>
