<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="sB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="sG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="sR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="sO" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">DHCP 客户端状态机与六个状态转移</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">本轮实测走通 INIT → SELECTING → BOUND → RENEWING → REBINDING → 回 INIT；INIT-REBOOT 只跑到一半（未拿到 ACK／NAK）</text>

  <rect x="60" y="204" width="130" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="125" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">INIT</text>
  <text x="125" y="246" text-anchor="middle" font-size="10.5" fill="#334155">广播 DISCOVER</text>
  <text x="125" y="264" text-anchor="middle" font-size="10.5" fill="#334155">ciaddr = 0</text>

  <rect x="250" y="204" width="130" height="76" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="315" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">SELECTING</text>
  <text x="315" y="246" text-anchor="middle" font-size="10.5" fill="#7c2d12">广播 REQUEST</text>
  <text x="315" y="264" text-anchor="middle" font-size="10.5" fill="#7c2d12">带 50 ＋ 54</text>

  <rect x="440" y="204" width="130" height="76" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="505" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">BOUND</text>
  <text x="505" y="246" text-anchor="middle" font-size="10.5" fill="#14532d">地址已生效</text>
  <text x="505" y="264" text-anchor="middle" font-size="10.5" fill="#14532d">静默等到 T1</text>

  <rect x="630" y="204" width="130" height="76" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="695" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">RENEWING</text>
  <text x="695" y="246" text-anchor="middle" font-size="10.5" fill="#1e3a8a">单播 REQUEST</text>
  <text x="695" y="264" text-anchor="middle" font-size="10.5" fill="#1e3a8a">ciaddr = 自己</text>

  <rect x="820" y="204" width="130" height="76" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="885" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">REBINDING</text>
  <text x="885" y="246" text-anchor="middle" font-size="10.5" fill="#92400e">广播 REQUEST</text>
  <text x="885" y="264" text-anchor="middle" font-size="10.5" fill="#92400e">任意服务器可答</text>

  <line x1="190" y1="242" x2="246" y2="242" stroke="#2563eb" stroke-width="1.7" marker-end="url(#sB)"/>
  <text x="218" y="234" text-anchor="middle" font-size="10" fill="#334155">Offer</text>
  <line x1="380" y1="242" x2="436" y2="242" stroke="#ea580c" stroke-width="1.7" marker-end="url(#sO)"/>
  <text x="408" y="234" text-anchor="middle" font-size="10" fill="#334155">ACK</text>
  <line x1="570" y1="242" x2="626" y2="242" stroke="#2563eb" stroke-width="1.7" marker-end="url(#sB)"/>
  <text x="598" y="234" text-anchor="middle" font-size="10" fill="#334155">T1 50%</text>
  <line x1="760" y1="242" x2="816" y2="242" stroke="#b45309" stroke-width="1.7" marker-end="url(#sO)"/>
  <text x="788" y="234" text-anchor="middle" font-size="10" fill="#334155">T2 87.5%</text>

  <polyline points="695,280 695,312 545,312 545,284" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#sG)"/>
  <text x="620" y="306" text-anchor="middle" font-size="10.5" fill="#14532d">原服务器 ACK ⇒ 租期整体前移，重回 BOUND</text>

  <polyline points="885,280 885,344 465,344 465,284" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#sG)"/>
  <text x="690" y="338" text-anchor="middle" font-size="10.5" fill="#14532d">任意服务器 ACK ⇒ 重回 BOUND（实测本轮没有 ACK，走到到期）</text>

  <polyline points="885,204 885,152 125,152 125,200" fill="none" stroke="#dc2626" stroke-width="1.7" marker-end="url(#sR)"/>
  <text x="505" y="146" text-anchor="middle" font-size="11" fill="#7f1d1d">放弃旧租约：实测 +103.3 s（17:31:35.801）改广播 DISCOVER，xid 换新 0x55f8e53f</text>

  <rect x="60" y="404" width="170" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="145" y="426" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">INIT-REBOOT</text>
  <text x="145" y="446" text-anchor="middle" font-size="10.5" fill="#64748b">广播 REQUEST 带 50</text>
  <text x="145" y="464" text-anchor="middle" font-size="10.5" fill="#64748b">先验旧租约还在不在</text>

  <line x1="155" y1="280" x2="155" y2="400" stroke="#2563eb" stroke-width="1.6" marker-end="url(#sB)"/>
  <text x="238" y="356" font-size="10.5" fill="#1e3a8a">重启时本地还有租约</text>
  <line x1="95" y1="404" x2="95" y2="284" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#sR)"/>
  <text x="34" y="356" font-size="10.5" fill="#7f1d1d">NAK ／ 超时</text>

  <rect x="270" y="392" width="290" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="282" y="412" font-size="11" font-weight="bold" fill="#0f172a">INIT-REBOOT 的实测覆盖情况</text>
  <text x="282" y="433" font-size="10.5" fill="#7f1d1d">未跑到：本轮是租约中途丢失，直接回 INIT</text>
  <text x="282" y="452" font-size="10.5" fill="#7f1d1d">未跑到：服务器 ACK 回 BOUND（服务端已停）</text>
  <text x="282" y="471" font-size="10.5" fill="#7f1d1d">未跑到：收到 NAK 立刻回 INIT（无 NAK 样本）</text>

  <rect x="580" y="392" width="400" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="592" y="412" font-size="11" font-weight="bold" fill="#14532d">读状态机的三个要点</text>
  <text x="592" y="433" font-size="10.5" fill="#14532d">只有 RENEWING 是单播，其余请求态一律广播</text>
  <text x="592" y="452" font-size="10.5" fill="#14532d">每次成功续期都是「整段租约前移」而不是累加</text>
  <text x="592" y="471" font-size="10.5" fill="#14532d">回 INIT 一定换新 xid，可据此判断是否重开事务</text>

  <rect x="20" y="508" width="960" height="94" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="36" y="532" font-size="12.5" font-weight="bold" fill="#92400e">这套形状与正文「使用一」的 Go 状态机一一对应</text>
  <text x="36" y="555" font-size="12" fill="#92400e">StateBound / StateRenewing / StateRebinding 就是 BOUND / RENEWING / REBINDING；Split 里的 duration/2 与 duration*7/8 就是 50% 与 87.5%</text>
  <text x="36" y="578" font-size="12" fill="#7f1d1d">ErrLeaseLost 对应「回 INIT」那一格：调用方必须重新走申请流程，不能拿旧租约继续写（分布式锁在这里最容易出事）</text>
</svg>
