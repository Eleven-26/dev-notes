<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="450" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一根网线，两套判定，结果是一边通一边不通</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">两个容器接在同一个网桥上：A 配 /25、B 配 /24。两边的内核都按自己的掩码算「对方在不在我的网段」</text>

  <rect x="20" y="84" width="470" height="182" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
  <text x="36" y="112" font-size="14" font-weight="bold" fill="#0f172a">A 的视角：192.0.2.10/25</text>
  <text x="36" y="142" font-size="11" fill="#1e40af">ip route get 192.0.2.200</text>
  <text x="36" y="164" font-size="11.5" font-weight="bold" fill="#0f172a">192.0.2.200 via 192.0.2.1 dev eth0</text>
  <text x="36" y="194" font-size="11" fill="#334155">A 判定 B 在别的网段，包先交给网关</text>
  <text x="36" y="216" font-size="11" fill="#334155">理由：/25 只覆盖 .0~.127，.200 在范围之外</text>
  <text x="36" y="238" font-size="11" fill="#b91c1c">若删掉默认路由：Network unreachable</text>

  <rect x="510" y="84" width="470" height="182" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" rx="10"/>
  <text x="526" y="112" font-size="14" font-weight="bold" fill="#0f172a">B 的视角：192.0.2.200/24</text>
  <text x="526" y="142" font-size="11" fill="#166534">ip route get 192.0.2.10</text>
  <text x="526" y="164" font-size="11.5" font-weight="bold" fill="#0f172a">192.0.2.10 dev eth0</text>
  <text x="526" y="194" font-size="11" fill="#334155">B 判定 A 同网段，直接 ARP 取 MAC 发帧</text>
  <text x="526" y="216" font-size="11" fill="#334155">理由：/24 覆盖 .0~.255，.10 在范围之内</text>
  <text x="526" y="238" font-size="11" fill="#b45309">两边对同一根网线的判定不一致</text>

  <rect x="496" y="96" width="8" height="158" fill="#e2e8f0" stroke="none"/>

  <rect x="20" y="282" width="960" height="152" fill="#fafafa" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="36" y="308" font-size="12.5" font-weight="bold" fill="#0f172a">实测：让 B ping A 五次，看 A 侧网卡的收发计数</text>

  <text x="36" y="336" font-size="11.5" font-weight="bold" fill="#b91c1c">A 是 /25 且删掉默认路由</text>
  <text x="36" y="360" font-size="13" font-weight="bold" fill="#0f172a">rx 加 6 · tx 加 1</text>
  <text x="36" y="382" font-size="10.5" fill="#334155">那 1 个 tx 是 ARP 响应，echo reply 一个都没发出</text>
  <text x="36" y="404" font-size="10.5" fill="#b91c1c">B 侧结果：5 个请求，0 个响应</text>

  <rect x="512" y="294" width="2" height="126" fill="#e2e8f0" stroke="none"/>

  <text x="530" y="336" font-size="11.5" font-weight="bold" fill="#15803d">A 恢复成 /24</text>
  <text x="530" y="360" font-size="13" font-weight="bold" fill="#0f172a">rx 加 7 · tx 加 6</text>
  <text x="530" y="382" font-size="10.5" fill="#334155">6 个 tx 是 5 个 echo reply 加 1 个 ARP 响应</text>
  <text x="530" y="404" font-size="10.5" fill="#15803d">B 侧结果：5 个请求，5 个响应</text>

  <text x="36" y="428" font-size="10" fill="#64748b">计数取自 /sys/class/net/eth0/statistics，ping 前后各读一次取差值；镜像 alpine:3.21，网桥 192.0.2.0/24</text>
</svg>
