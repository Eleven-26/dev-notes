<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="dB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="dO" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/></marker>
    <marker id="dG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">域名层级与 NS 委派链</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">每层只回答「下一级归谁管」，不回答最终地址；右侧三格是本机 dig 的真实应答计数与 TTL</text>

  <rect x="20" y="76" width="470" height="360" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="36" y="98" font-size="12.5" font-weight="bold" fill="#0f172a">域名树：越往下越具体，委派靠 NS 记录</text>

  <rect x="180" y="112" width="150" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="255" y="131" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">根区 "."</text>
  <text x="255" y="149" text-anchor="middle" font-size="11" fill="#334155">13 组根服务器</text>

  <rect x="60" y="196" width="140" height="46" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="130" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">TLD "com."</text>
  <text x="130" y="233" text-anchor="middle" font-size="11" fill="#7c2d12">13 组 gTLD</text>
  <rect x="320" y="196" width="140" height="46" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="390" y="215" text-anchor="middle" font-size="12.5" fill="#0f172a">"net." "org."</text>
  <text x="390" y="233" text-anchor="middle" font-size="11" fill="#64748b">其他 TLD</text>

  <rect x="180" y="280" width="170" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="265" y="299" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">example.com.</text>
  <text x="265" y="317" text-anchor="middle" font-size="11" fill="#14532d">权威 NS 托管商</text>

  <rect x="36" y="364" width="150" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="111" y="383" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">example.com A</text>
  <text x="111" y="401" text-anchor="middle" font-size="11" fill="#1e3a8a">两条 A 记录</text>
  <rect x="200" y="364" width="140" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="270" y="383" text-anchor="middle" font-size="12.5" fill="#1e3a8a">www.example</text>
  <text x="270" y="401" text-anchor="middle" font-size="11" fill="#1e3a8a">CNAME → A</text>
  <rect x="354" y="364" width="118" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="413" y="383" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">不存在名</text>
  <text x="413" y="401" text-anchor="middle" font-size="10.5" fill="#7f1d1d">NXDOMAIN</text>

  <line x1="228" y1="158" x2="140" y2="192" stroke="#ea580c" stroke-width="1.6" marker-end="url(#dO)"/>
  <line x1="284" y1="158" x2="374" y2="192" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="148" y1="242" x2="238" y2="276" stroke="#16a34a" stroke-width="1.6" marker-end="url(#dG)"/>
  <line x1="240" y1="326" x2="130" y2="360" stroke="#2563eb" stroke-width="1.6" marker-end="url(#dB)"/>
  <line x1="280" y1="326" x2="272" y2="360" stroke="#2563eb" stroke-width="1.6" marker-end="url(#dB)"/>
  <line x1="312" y1="326" x2="400" y2="360" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="150" y="176" font-size="10.5" fill="#7c2d12">com. 172800 IN NS gtld</text>
  <text x="150" y="262" font-size="10.5" fill="#14532d">example.com. 172800 IN NS hera</text>
  <text x="72" y="344" font-size="10.5" fill="#1e3a8a">A 记录 TTL 600</text>

  <rect x="504" y="76" width="476" height="360" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="520" y="98" font-size="12.5" font-weight="bold" fill="#0f172a">三段应答的真实形态（本机 dig +norecurse 实测）</text>

  <rect x="520" y="112" width="444" height="96" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="534" y="132" font-size="12" font-weight="bold" fill="#0f172a">① 问根：dig @a.root-servers.net com NS</text>
  <text x="534" y="152" font-size="11" fill="#334155">flags: qr;（没有 rd，也没答）</text>
  <text x="534" y="171" font-size="11" fill="#334155">QUERY: 1, ANSWER: 0, AUTHORITY: 13, ADDITIONAL: 27</text>
  <text x="534" y="191" font-size="11" fill="#64748b">AUTHORITY 给 NS，ADDITIONAL 给这些 NS 的 A（glue）</text>

  <rect x="520" y="220" width="444" height="96" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="534" y="240" font-size="12" font-weight="bold" fill="#7c2d12">② 问 .com：dig @a.gtld-servers.net example.com A</text>
  <text x="534" y="260" font-size="11" fill="#7c2d12">ANSWER: 0, AUTHORITY: 2, ADDITIONAL: 13</text>
  <text x="534" y="279" font-size="11" fill="#7c2d12">example.com. 172800 IN NS hera / elliott.cloudflare</text>
  <text x="534" y="299" font-size="11" fill="#7c2d12">glue：108.162.192.162 / 172.64.32.162 / 173.245.58.162</text>

  <rect x="520" y="328" width="444" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="534" y="348" font-size="12" font-weight="bold" fill="#14532d">③ 问权威：dig example.com A（走本机 LDNS）</text>
  <text x="534" y="368" font-size="11" fill="#14532d">flags: qr rd ra ｜ 600 IN A 172.66.147.243</text>
  <text x="534" y="387" font-size="11" fill="#14532d">600 IN A 104.20.23.154（同一条名字两条 A）</text>
  <text x="534" y="407" font-size="11" fill="#14532d">SOA：578 IN SOA … 10000 2400 604800 1800</text>

  <rect x="20" y="450" width="960" height="172" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="36" y="474" font-size="12.5" font-weight="bold" fill="#92400e">两种 TTL 别混为一谈</text>
  <text x="36" y="497" font-size="12" fill="#92400e">委派 TTL：NS 记录自带（实测 172800 = 48h），缓存的是「这一级归谁管」，LDNS 靠它省掉重新问根和 TLD</text>
  <text x="36" y="518" font-size="12" fill="#92400e">解析 TTL：A / CNAME 自带（实测 600），缓存的是最终答案，也是排查时看到「同一个域名 TTL 递减」的那个数</text>
  <text x="36" y="539" font-size="12" fill="#92400e">负缓存 TTL：取权威 SOA 记录最后一个字段（实测 1800 = 30min），NXDOMAIN 在这段时间内不会再打到权威</text>
  <text x="36" y="566" font-size="12" fill="#7f1d1d">委派链断掉的三种表现：glue 缺失（ lame delegation 要回退到上级重问）、权威不应答超时（换下一个 NS）、</text>
  <text x="36" y="586" font-size="12" fill="#7f1d1d">TLD 还在旧托管商手里（刚换 NS 时的抖动窗口）—— 这三种都不是「客户端 DNS 配错了」，改本地 resolver 无效</text>
</svg>
