<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">掩码一变，这两个地址就从「同网段」变成「跨网段」</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">横轴是第 4 字节的取值 0 ~ 255；每根条是「192.0.2.200 在当前掩码下所属的网段」</text>

  <rect x="20" y="70" width="960" height="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="30" y="88" font-size="12" fill="#334155">要判断的是：192.0.2.10 和 192.0.2.200 还算不算同一个网段。答案随掩码变，不由地址本身决定</text>

  <rect x="20" y="100" width="960" height="18" fill="#ffffff" stroke="none"/>
  <text x="150" y="113" text-anchor="middle" font-size="10" fill="#64748b">.0</text>
  <text x="337.5" y="113" text-anchor="middle" font-size="10" fill="#64748b">.64</text>
  <text x="525" y="113" text-anchor="middle" font-size="10" fill="#64748b">.128</text>
  <text x="712.5" y="113" text-anchor="middle" font-size="10" fill="#64748b">.192</text>
  <text x="897" y="113" text-anchor="middle" font-size="10" fill="#64748b">.255</text>

  <rect x="150" y="118" width="750" height="24" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <rect x="150" y="118" width="29.3" height="24" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1" rx="3"/>
  <text x="164" y="134" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e40af">.10</text>
  <rect x="735.9" y="118" width="26" height="24" fill="#fed7aa" stroke="#ea580c" stroke-width="1" rx="3"/>
  <text x="748.9" y="134" text-anchor="middle" font-size="8" fill="#9a3412">200</text>

  <rect x="20" y="152" width="965" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <rect x="150" y="160" width="750" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="4"/>
  <text x="30" y="167" font-size="11.5" font-weight="bold" fill="#0f172a">/24</text>
  <text x="30" y="182" font-size="9" fill="#64748b">192.0.2.0/24</text>
  <text x="908" y="174" font-size="10.5" font-weight="bold" fill="#15803d">同网段</text>

  <rect x="20" y="202" width="965" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <rect x="525" y="210" width="375" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="4"/>
  <text x="30" y="217" font-size="11.5" font-weight="bold" fill="#0f172a">/25</text>
  <text x="30" y="232" font-size="9" fill="#64748b">192.0.2.128/25</text>
  <text x="908" y="224" font-size="10.5" font-weight="bold" fill="#b91c1c">不同网段</text>

  <rect x="20" y="252" width="965" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <rect x="712.5" y="260" width="187.5" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="4"/>
  <text x="30" y="267" font-size="11.5" font-weight="bold" fill="#0f172a">/26</text>
  <text x="30" y="282" font-size="9" fill="#64748b">192.0.2.192/26</text>
  <text x="908" y="274" font-size="10.5" font-weight="bold" fill="#b91c1c">不同网段</text>

  <rect x="20" y="302" width="965" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <rect x="712.5" y="310" width="93.75" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="4"/>
  <text x="30" y="317" font-size="11.5" font-weight="bold" fill="#0f172a">/27</text>
  <text x="30" y="332" font-size="9" fill="#64748b">192.0.2.192/27</text>
  <text x="908" y="324" font-size="10.5" font-weight="bold" fill="#b91c1c">不同网段</text>

  <rect x="20" y="352" width="965" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <rect x="712.5" y="360" width="46.875" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="4"/>
  <text x="30" y="367" font-size="11.5" font-weight="bold" fill="#0f172a">/28</text>
  <text x="30" y="382" font-size="9" fill="#64748b">192.0.2.192/28</text>
  <text x="908" y="374" font-size="10.5" font-weight="bold" fill="#b91c1c">不同网段</text>

  <rect x="20" y="404" width="960" height="46" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
  <text x="34" y="424" font-size="11.5" font-weight="bold" fill="#0f172a">判据只有一条：把两个地址各自与掩码 AND，结果相同才是同网段。所以「同网段」是掩码的函数，不是地址的属性。</text>
  <text x="34" y="442" font-size="10.5" fill="#92400e">.10 一直被留在 .0 那一侧，只有 /24 把 .200 也算进同一块；掩码收到 /25 及更小，两块就被切开了。</text>
</svg>
