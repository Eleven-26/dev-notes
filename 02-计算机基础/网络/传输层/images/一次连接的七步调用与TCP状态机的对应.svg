<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 668" width="1000" height="668" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="668" fill="#ffffff"/>
  <rect x="0" y="0" width="1000" height="76" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一次连接的七个调用，各落在 TCP 状态机的哪一步</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">★ 关键在于 accept 的位置：握手在它之前就完成了</text>

  <rect x="40" y="84" width="270" height="24" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" rx="6"/>
  <text x="50" y="101" font-size="12.5" font-weight="bold" fill="#1e40af">服务端进程（应用视角）</text>

  <rect x="352" y="84" width="296" height="24" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="362" y="101" font-size="12.5" font-weight="bold" fill="#334155">网络上真正发生的</text>

  <rect x="690" y="84" width="270" height="24" fill="#fef3c7" stroke="#fcd34d" stroke-width="1" rx="6"/>
  <text x="700" y="101" font-size="12.5" font-weight="bold" fill="#92400e">客户端进程</text>

  <line x1="175" y1="114" x2="175" y2="556" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="825" y1="114" x2="825" y2="556" stroke="#fcd34d" stroke-width="2" stroke-dasharray="5 4"/>

  <rect x="40" y="118" width="270" height="46" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="52" y="138" font-size="11" font-weight="bold" fill="#0f172a">socket(AF_INET, SOCK_STREAM, 0)</text>
  <text x="52" y="156" font-size="9.5" fill="#1e40af">分配 socket 对象 → 状态 CLOSED</text>

  <rect x="40" y="176" width="270" height="46" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="52" y="196" font-size="11" font-weight="bold" fill="#0f172a">bind(0.0.0.0:8080)</text>
  <text x="52" y="214" font-size="9.5" fill="#1e40af">写入本地端点 → 仍是 CLOSED</text>

  <rect x="40" y="234" width="270" height="46" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="52" y="254" font-size="11" font-weight="bold" fill="#0f172a">listen(fd, backlog)</text>
  <text x="52" y="272" font-size="9.5" fill="#1e40af">建两个队列 → LISTEN，内核开始应答 SYN</text>

  <rect x="40" y="292" width="270" height="46" fill="#fef2f2" stroke="#f87171" stroke-width="1.4" rx="8"/>
  <text x="52" y="312" font-size="11" font-weight="bold" fill="#991b1b">全连接队列：躺 1 条 ESTABLISHED</text>
  <text x="52" y="330" font-size="9.5" fill="#b91c1c">这条连接已经建好了，但还没有 fd 指向它</text>

  <rect x="40" y="350" width="270" height="46" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="52" y="370" font-size="11" font-weight="bold" fill="#0f172a">accept(lfd)</text>
  <text x="52" y="388" font-size="9.5" fill="#1e40af">从队列取队头 → 新建 cfd（新 inode）</text>

  <rect x="40" y="408" width="270" height="46" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="52" y="428" font-size="11" font-weight="bold" fill="#0f172a">read / write(cfd)</text>
  <text x="52" y="446" font-size="9.5" fill="#1e40af">在用户空间与内核缓冲区之间拷贝</text>

  <rect x="40" y="466" width="270" height="46" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="52" y="486" font-size="11" font-weight="bold" fill="#0f172a">close(cfd)</text>
  <text x="52" y="504" font-size="9.5" fill="#1e40af">引用计数减一，归零才发 FIN</text>

  <rect x="690" y="234" width="270" height="46" fill="#fffbeb" stroke="#d97706" stroke-width="1" rx="8"/>
  <text x="702" y="254" font-size="11" font-weight="bold" fill="#0f172a">connect(fd, 服务器地址)</text>
  <text x="702" y="272" font-size="9.5" fill="#92400e">阻塞，内部走完三次握手 → ESTABLISHED</text>

  <rect x="690" y="408" width="270" height="46" fill="#fffbeb" stroke="#d97706" stroke-width="1" rx="8"/>
  <text x="702" y="428" font-size="11" font-weight="bold" fill="#0f172a">write / read(fd)</text>
  <text x="702" y="446" font-size="9.5" fill="#92400e">字节流，没有消息边界</text>

  <rect x="690" y="466" width="270" height="46" fill="#fffbeb" stroke="#d97706" stroke-width="1" rx="8"/>
  <text x="702" y="486" font-size="11" font-weight="bold" fill="#0f172a">close(fd)</text>
  <text x="702" y="504" font-size="9.5" fill="#92400e">反过来也发 FIN（先关的一方进 TIME_WAIT）</text>

  <rect x="362" y="240" width="276" height="34" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="6"/>
  <text x="372" y="261" font-size="10" fill="#334155">① SYN  →　② ← SYN-ACK　③ ACK →</text>
  <line x1="360" y1="286" x2="640" y2="286" stroke="#475569" stroke-width="1.2" marker-end="url(#ar2)"/>
  <line x1="640" y1="296" x2="360" y2="296" stroke="#475569" stroke-width="1.2" marker-end="url(#ar2)"/>

  <rect x="362" y="306" width="276" height="30" fill="#fef2f2" stroke="#f87171" stroke-width="1.2" rx="6"/>
  <text x="372" y="326" font-size="10" font-weight="bold" fill="#991b1b">握手到此结束，accept 还没被调用</text>

  <rect x="362" y="416" width="276" height="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="6"/>
  <text x="372" y="436" font-size="10" fill="#334155">应用数据 ←→ 双向字节流</text>

  <rect x="362" y="452" width="276" height="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="6"/>
  <text x="372" y="472" font-size="10" fill="#334155">④ FIN → ⑤ ACK ← ⑥ FIN ← ⑦ ACK</text>
  <line x1="360" y1="498" x2="640" y2="498" stroke="#475569" stroke-width="1.2" marker-end="url(#ar2)"/>
  <line x1="640" y1="508" x2="360" y2="508" stroke="#475569" stroke-width="1.2" marker-end="url(#ar2)"/>

  <rect x="40" y="530" width="920" height="24" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1" rx="6"/>
  <text x="50" y="547" font-size="12" font-weight="bold" fill="#065f46">三句话记住这张图</text>
  <rect x="40" y="558" width="920" height="96" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="8"/>
  <text x="52" y="578" font-size="10" fill="#334155">1. listen 一返回，内核就替这个 socket 应答 SYN；应用卡在 accept 里也不影响握手成功。</text>
  <text x="52" y="600" font-size="10" fill="#334155">2. connect 是一个阻塞调用，返回 0 时 SYN / SYN-ACK / ACK 三个包已经走完。</text>
  <text x="52" y="622" font-size="10" fill="#334155">3. accept 不产生任何网络包，它只做两件事：从全连接队列取队头、新建一个 fd。</text>
  <text x="52" y="644" font-size="9" fill="#64748b">实测：服务端一次 accept 都没调，3 个客户端全部 ESTABLISHED；listen fd 与 accept 返回的 fd，inode 四组全不同。</text>
</svg>
