<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" width="1040" height="460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1040" height="460" fill="#ffffff"/>
  <text x="520" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">保活四层与空闲超时时间轴</text>
  <text x="520" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">越往下越贴近业务、也越贵；心跳间隔要小于链路上最短的空闲超时，并留一次重试余量</text>

  <defs>
    <marker id="k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="20" y="76" width="1000" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="34" y="90" width="210" height="64" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
  <text x="139" y="113" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">① TCP keepalive</text>
  <text x="139" y="131" text-anchor="middle" font-size="10.5" fill="#075985">SO_KEEPALIVE / KeepAliveConfig</text>
  <text x="139" y="147" text-anchor="middle" font-size="10.5" fill="#075985">探：对端内核还在不在</text>

  <rect x="262" y="90" width="250" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="387" y="113" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">② 协议层 keepalive</text>
  <text x="387" y="131" text-anchor="middle" font-size="10.5" fill="#14532d">HTTP/2 PING / gRPC / WebSocket</text>
  <text x="387" y="147" text-anchor="middle" font-size="10.5" fill="#14532d">探：对端协议栈是否响应</text>

  <rect x="530" y="90" width="230" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="645" y="113" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">③ 业务心跳</text>
  <text x="645" y="131" text-anchor="middle" font-size="10.5" fill="#92400e">自定义 ping / echo</text>
  <text x="645" y="147" text-anchor="middle" font-size="10.5" fill="#92400e">探：业务处理链路是否正常</text>

  <rect x="778" y="90" width="228" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="892" y="113" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5b21b6">④ 连接池探活</text>
  <text x="892" y="131" text-anchor="middle" font-size="10.5" fill="#5b21b6">借出前 Ping / 试读</text>
  <text x="892" y="147" text-anchor="middle" font-size="10.5" fill="#5b21b6">探：池里这条旧连接还能用吗</text>

  <line x1="244" y1="122" x2="260" y2="122" stroke="#64748b" stroke-width="1.4" marker-end="url(#k)"/>
  <line x1="512" y1="122" x2="528" y2="122" stroke="#64748b" stroke-width="1.4" marker-end="url(#k)"/>
  <line x1="760" y1="122" x2="776" y2="122" stroke="#64748b" stroke-width="1.4" marker-end="url(#k)"/>

  <text x="520" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">空闲超时：谁先动手，决定心跳间隔</text>

  <line x1="60" y1="270" x2="980" y2="270" stroke="#334155" stroke-width="2"/>
  <text x="60" y="296" font-size="10.5" fill="#64748b">0</text>
  <text x="980" y="296" text-anchor="end" font-size="10.5" fill="#64748b">时间 →</text>

  <line x1="250" y1="256" x2="250" y2="284" stroke="#dc2626" stroke-width="2"/>
  <rect x="190" y="214" width="120" height="38" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="250" y="230" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991b1b">LB 60s 级</text>
  <text x="250" y="245" text-anchor="middle" font-size="10" fill="#991b1b">通常最先回收</text>

  <line x1="520" y1="256" x2="520" y2="284" stroke="#d97706" stroke-width="2"/>
  <rect x="460" y="214" width="120" height="38" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="520" y="230" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">NAT 几分钟</text>
  <text x="520" y="245" text-anchor="middle" font-size="10" fill="#92400e">云厂商各不相同</text>

  <line x1="820" y1="256" x2="820" y2="284" stroke="#7c3aed" stroke-width="2"/>
  <rect x="750" y="214" width="140" height="38" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="820" y="230" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#5b21b6">内核 keepalive 7200s</text>
  <text x="820" y="245" text-anchor="middle" font-size="10" fill="#5b21b6">默认值≈没开</text>

  <rect x="96" y="316" width="1000" height="0" fill="none"/>
  <line x1="96" y1="316" x2="900" y2="316" stroke="#0ea5e9" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="96" y="310" font-size="10.5" fill="#0369a1">心跳：取最短超时的 1/2 ~ 1/3</text>

  <line x1="140" y1="304" x2="140" y2="328" stroke="#0ea5e9" stroke-width="1.6"/>
  <line x1="220" y1="304" x2="220" y2="328" stroke="#0ea5e9" stroke-width="1.6"/>
  <line x1="300" y1="304" x2="300" y2="328" stroke="#0ea5e9" stroke-width="1.6"/>
  <line x1="380" y1="304" x2="380" y2="328" stroke="#0ea5e9" stroke-width="1.6"/>
  <line x1="460" y1="304" x2="460" y2="328" stroke="#0ea5e9" stroke-width="1.6"/>
  <line x1="540" y1="304" x2="540" y2="328" stroke="#0ea5e9" stroke-width="1.6"/>
  <line x1="620" y1="304" x2="620" y2="328" stroke="#0ea5e9" stroke-width="1.6"/>
  <line x1="700" y1="304" x2="700" y2="328" stroke="#0ea5e9" stroke-width="1.6"/>

  <rect x="20" y="352" width="1000" height="88" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="40" y="376" font-size="12.5" font-weight="bold" fill="#9a3412">判据与坑</text>
  <text x="40" y="398" font-size="11" fill="#9a3412">• 检测时间 ≈ 心跳间隔 × 允许失败次数 + 单次超时；一次未响应就判死会在 GC 抖动时大量误杀</text>
  <text x="40" y="418" font-size="11" fill="#9a3412">• TCP keepalive 只探内核：对端进程卡死、死锁、依赖不可用时，探测仍会收到 ACK</text>
  <text x="40" y="438" font-size="11" fill="#9a3412">• 池里的旧连接：主动淘汰（IdleTimeout / MaxLifetime）+ 请求级重试 + 必要时借出前探活，三者组合</text>
</svg>
