<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <rect x="0" y="0" width="1000" height="56" fill="#ffffff"/>
  <text x="32" y="35" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#111827">accept() 的六条出口：只有一条是正常，一条会烧 CPU</text>

  <rect x="56" y="254" width="156" height="60" rx="8" fill="#1e293b"/>
  <text x="134" y="290" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#ffffff">accept(lfd, ...)</text>

  <line x1="212" y1="284" x2="232" y2="284" stroke="#94a3b8" stroke-width="2"/>
  <line x1="232" y1="84" x2="232" y2="484" stroke="#cbd5e1" stroke-width="2"/>

  <line x1="232" y1="84" x2="262" y2="84" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="262" y="56" width="196" height="56" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="274" y="89" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#15803d">fd &gt;= 0</text>
  <rect x="470" y="56" width="478" height="56" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="484" y="89" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#166534">正常处理。注意：不代表对端还活着，第一次 read 才知道</text>

  <line x1="232" y1="160" x2="262" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="262" y="132" width="196" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="274" y="165" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">EAGAIN / EWOULDBLOCK</text>
  <rect x="470" y="132" width="478" height="56" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="484" y="165" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e40af">非阻塞且队列空，等下一次可读事件</text>

  <line x1="232" y1="236" x2="262" y2="236" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="262" y="208" width="196" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="274" y="241" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">EINTR</text>
  <rect x="470" y="208" width="478" height="56" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="484" y="241" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e40af">被信号打断，直接重试</text>

  <line x1="232" y1="312" x2="262" y2="312" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="262" y="284" width="196" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="274" y="317" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">ECONNABORTED</text>
  <rect x="470" y="284" width="478" height="56" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="484" y="317" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e40af">队列里这条已被对端 RST，继续循环</text>

  <line x1="232" y1="388" x2="262" y2="388" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="262" y="360" width="196" height="56" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="274" y="393" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#b91c1c">EMFILE / ENFILE</text>
  <rect x="470" y="360" width="478" height="56" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="484" y="393" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#991b1b">必须停下：不加处理就每秒空转 36~62 万次</text>

  <line x1="232" y1="464" x2="262" y2="464" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="262" y="436" width="196" height="56" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="274" y="469" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#4b5563">EINVAL</text>
  <rect x="470" y="436" width="478" height="56" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="484" y="469" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4b5563">这个 fd 没 listen 过，代码 bug</text>

  <rect x="56" y="510" width="892" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="72" y="532" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">绿＝正常通行　蓝＝可以继续循环　红＝必须破例处理（预留 fd）　灰＝改代码，不是改配置</text>
</svg>
