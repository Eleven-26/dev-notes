<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">传输层十一篇：两个子目录、一条链、两组换维度</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">tcp/ 七篇（①~⑥ 是严格读序，⑦ 换时间点）；udp/ 三篇（换协议，另有打洞与组播两篇在规划中）；根目录一篇（换视角）</text>

  <rect x="20" y="70" width="560" height="22" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" rx="6"/>
  <text x="30" y="86" font-size="12.5" font-weight="bold" fill="#1e40af">tcp/ · 七篇：①→⑥ 是一条连接从建到拆，⑦ 换时间点、可后读</text>

  <g transform="translate(20,96)">
    <rect x="0" y="0" width="128" height="128" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="8" y="22" font-size="11" font-weight="bold" fill="#0f172a">① 协议基础</text>
    <text x="8" y="40" font-size="9" fill="#1e40af">地基</text>
    <text x="8" y="60" font-size="8.5" fill="#334155">首部各字段</text>
    <text x="8" y="74" font-size="8.5" fill="#334155">序号与确认号演算</text>
    <text x="8" y="88" font-size="8.5" fill="#334155">字节流没有边界</text>
    <text x="8" y="108" font-size="8" fill="#64748b">连接的本质是什么</text>
  </g>

  <g transform="translate(158,96)">
    <rect x="0" y="0" width="128" height="128" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="8" y="22" font-size="11" font-weight="bold" fill="#0f172a">② 三次握手</text>
    <text x="8" y="40" font-size="9" fill="#1e40af">建连接</text>
    <text x="8" y="60" font-size="8.5" fill="#334155">为什么必须三次</text>
    <text x="8" y="74" font-size="8.5" fill="#334155">半连接与全连接队列</text>
    <text x="8" y="88" font-size="8.5" fill="#334155">backlog 真含义</text>
    <text x="8" y="108" font-size="8" fill="#64748b">TCP Fast Open</text>
  </g>

  <g transform="translate(296,96)">
    <rect x="0" y="0" width="128" height="128" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="8" y="22" font-size="11" font-weight="bold" fill="#0f172a">③ 滑动窗口</text>
    <text x="8" y="40" font-size="9" fill="#1e40af">传数据</text>
    <text x="8" y="60" font-size="8.5" fill="#334155">rwnd 与 cwnd 取小</text>
    <text x="8" y="74" font-size="8.5" fill="#334155">窗口缩放 · SACK</text>
    <text x="8" y="88" font-size="8.5" fill="#334155">零窗口探测</text>
    <text x="8" y="108" font-size="8" fill="#64748b">吞吐上限由谁定</text>
  </g>

  <g transform="translate(434,96)">
    <rect x="0" y="0" width="128" height="128" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="8" y="22" font-size="11" font-weight="bold" fill="#0f172a">④ 小包优化</text>
    <text x="8" y="40" font-size="9" fill="#1e40af">Nagle 与延迟确认</text>
    <text x="8" y="60" font-size="8.5" fill="#334155">小包怎么被合并</text>
    <text x="8" y="74" font-size="8.5" fill="#334155">两者叠加互相伤害</text>
    <text x="8" y="88" font-size="8.5" fill="#334155">NODELAY 怎么破</text>
    <text x="8" y="108" font-size="8" fill="#64748b">两条一起看才懂</text>
  </g>

  <g transform="translate(572,96)">
    <rect x="0" y="0" width="128" height="128" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="8" y="22" font-size="11" font-weight="bold" fill="#0f172a">⑤ 拥塞控制</text>
    <text x="8" y="40" font-size="9" fill="#1e40af">窗口的另一半</text>
    <text x="8" y="60" font-size="8.5" fill="#334155">AIMD 四条机制</text>
    <text x="8" y="74" font-size="8.5" fill="#334155">Tahoe/Reno/CUBIC</text>
    <text x="8" y="88" font-size="8.5" fill="#334155">BBR 不信丢包</text>
    <text x="8" y="108" font-size="8" fill="#64748b">含 Go 模拟实测</text>
  </g>

  <g transform="translate(710,96)">
    <rect x="0" y="0" width="128" height="128" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="8" y="22" font-size="11" font-weight="bold" fill="#0f172a">⑥ 四次挥手</text>
    <text x="8" y="40" font-size="9" fill="#1e40af">断连接</text>
    <text x="8" y="60" font-size="8.5" fill="#334155">为什么是四次</text>
    <text x="8" y="74" font-size="8.5" fill="#334155">TIME_WAIT 谁在等</text>
    <text x="8" y="88" font-size="8.5" fill="#334155">CLOSE_WAIT 堆积</text>
    <text x="8" y="108" font-size="8" fill="#64748b">四种状态本机实测</text>
  </g>

  <g transform="translate(848,96)">
    <rect x="0" y="0" width="128" height="128" fill="#fffbeb" stroke="#b45309" stroke-width="1" rx="10"/>
    <text x="8" y="22" font-size="11" font-weight="bold" fill="#0f172a">⑦ 保活</text>
    <text x="8" y="40" font-size="9" fill="#92400e">换时间点</text>
    <text x="8" y="60" font-size="8.5" fill="#334155">keepalive 探什么</text>
    <text x="8" y="74" font-size="8.5" fill="#334155">四层保活分工</text>
    <text x="8" y="88" font-size="8.5" fill="#334155">半开连接成因</text>
    <text x="8" y="108" font-size="8" fill="#64748b">心跳间隔怎么定</text>
  </g>

  <rect x="20" y="238" width="640" height="22" fill="#dcfce7" stroke="#86efac" stroke-width="1" rx="6"/>
  <text x="30" y="254" font-size="12.5" font-weight="bold" fill="#166534">udp/ · 换一条传输路径：现有 3 篇（1 篇地基 + 2 篇「在 UDP 上重建可靠」），另有 2 篇在规划中</text>

  <g transform="translate(20,264)">
    <rect x="0" y="0" width="225" height="104" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" rx="10"/>
    <text x="10" y="22" font-size="11.5" font-weight="bold" fill="#0f172a">UDP 与数据报传输</text>
    <text x="10" y="40" font-size="8.5" fill="#166534">地基：没有那条链的对照物</text>
    <text x="10" y="58" font-size="8.5" fill="#334155">数据报有边界 · 8 字节首部</text>
    <text x="10" y="72" font-size="8.5" fill="#334155">明确不保证什么 · 应用要补什么</text>
    <text x="10" y="88" font-size="8" fill="#64748b">MTU 与接收队列丢包</text>
  </g>

  <g transform="translate(265,264)">
    <rect x="0" y="0" width="225" height="104" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" rx="10"/>
    <text x="10" y="22" font-size="11.5" font-weight="bold" fill="#0f172a">KCP 协议与可靠传输</text>
    <text x="10" y="40" font-size="8.5" fill="#166534">重建一：用带宽换延迟</text>
    <text x="10" y="58" font-size="8.5" fill="#334155">24 字节首部 · 选择重传</text>
    <text x="10" y="72" font-size="8.5" fill="#334155">四个旋钮各自改了什么</text>
    <text x="10" y="88" font-size="8" fill="#64748b">实测：收益几乎全在 nc</text>
  </g>

  <g transform="translate(510,264)">
    <rect x="0" y="0" width="225" height="104" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" rx="10"/>
    <text x="10" y="22" font-size="11.5" font-weight="bold" fill="#0f172a">QUIC 底层传输机制</text>
    <text x="10" y="40" font-size="8.5" fill="#166534">重建二：连身份与加密一起</text>
    <text x="10" y="58" font-size="8.5" fill="#334155">三个包号空间 · ACK 范围编码</text>
    <text x="10" y="72" font-size="8.5" fill="#334155">流与两层流控 · 连接迁移</text>
    <text x="10" y="88" font-size="8" fill="#64748b">实测：0-RTT 与 1-RTT 同空间</text>
  </g>

  <g transform="translate(755,264)">
    <rect x="0" y="0" width="225" height="104" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4" rx="10"/>
    <text x="10" y="22" font-size="11" font-weight="bold" fill="#334155">规划中的两篇</text>
    <text x="10" y="42" font-size="8.5" fill="#475569">UDP 打洞与 NAT 穿透</text>
    <text x="10" y="58" font-size="8.5" fill="#475569">STUN / TURN · 对称型 NAT</text>
    <text x="10" y="78" font-size="8.5" fill="#475569">组播与广播机制</text>
    <text x="10" y="94" font-size="8" fill="#64748b">D 类地址 · IGMP</text>
  </g>

  <rect x="20" y="382" width="320" height="22" fill="#fef3c7" stroke="#fcd34d" stroke-width="1" rx="6"/>
  <text x="30" y="398" font-size="12.5" font-weight="bold" fill="#92400e">根目录 · 换视角：现有 1 篇</text>

  <g transform="translate(20,408)">
    <rect x="0" y="0" width="960" height="74" fill="#fffbeb" stroke="#b45309" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="12" font-weight="bold" fill="#0f172a">IO 多路复用 —— 一个进程怎么同时管 N 条连接</text>
    <text x="14" y="46" font-size="9" fill="#92400e">五种 I/O 模型 · select/poll/epoll 三代演进 · LT 与 ET · 惊群与 Reactor · Go netpoller · io_uring</text>
    <text x="14" y="64" font-size="8.5" fill="#64748b">它换掉的不是协议，是「一条连接」这个观察单位</text>
  </g>

  <g transform="translate(20,492)">
    <rect x="0" y="0" width="960" height="74" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="22" font-size="11.5" font-weight="bold" fill="#0f172a">①~⑥ 不能跳着读：每一篇都用到前一篇的结论——窗口字段在报文里，握手之后才有窗口，拥塞窗口是窗口的另一半。</text>
    <text x="14" y="42" font-size="10.5" fill="#334155">udp/ 的三篇是「同一地基上的两条路」：UDP 篇给出「不保证什么」，KCP 与 QUIC 各自回答「补到什么程度、代价是什么」，要并排读才比得出取舍。</text>
    <text x="14" y="60" font-size="10.5" fill="#64748b">tcp/ 与 udp/ 都不单独设导读：七篇是一条读序，udp 的两篇是同一问题的对照答案；本目录 README 是唯一入口。</text>
  </g>
</svg>
