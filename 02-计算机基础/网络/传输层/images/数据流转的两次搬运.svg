<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <defs>
    <marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="32" y="22" width="800" height="28" fill="#ffffff"/>
  <text x="40" y="42" font-size="20" font-weight="600" fill="#0f172a">一次 read / write 要搬两趟：一趟 DMA，一趟 CPU 拷贝</text>
  <rect x="32" y="52" width="880" height="24" fill="#ffffff"/>
  <text x="40" y="70" font-size="13" fill="#64748b">应用缓冲与内核队列之间那一趟跑在 CPU 上，也正是 sendfile 能省掉的那一跳</text>

  <rect x="34" y="88" width="330" height="26" fill="#ffffff"/>
  <text x="40" y="106" font-size="14" font-weight="600" fill="#0f172a">① 收：对端的数据怎么进到你的缓冲区</text>

  <rect x="52" y="122" width="170" height="64" rx="6" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="137" y="150" font-size="14" font-weight="600" fill="#1e40af" text-anchor="middle">应用读缓冲</text>
  <text x="137" y="172" font-size="11.5" fill="#334155" text-anchor="middle">read(fd, buf, n) 的 buf</text>

  <rect x="300" y="122" width="300" height="64" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="150" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">内核接收队列</text>
  <text x="450" y="172" font-size="11.5" fill="#334155" text-anchor="middle">ss 里 Recv-Q 那一列</text>

  <rect x="690" y="122" width="210" height="64" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="795" y="150" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">网卡 · 网络</text>
  <text x="795" y="172" font-size="11.5" fill="#334155" text-anchor="middle">对端发来的报文先落这里</text>

  <line x1="686" y1="154" x2="606" y2="154" stroke="#64748b" stroke-width="2.5" marker-end="url(#agray)"/>
  <line x1="296" y1="154" x2="226" y2="154" stroke="#b45309" stroke-width="2.5" marker-end="url(#aamber)"/>
  <rect x="576" y="190" width="148" height="20" fill="#ffffff"/>
  <text x="650" y="205" font-size="12" fill="#64748b" text-anchor="middle">DMA 写入 · 不经过 CPU</text>
  <rect x="196" y="190" width="132" height="20" fill="#ffffff"/>
  <text x="262" y="205" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">1 次 CPU 拷贝</text>

  <rect x="34" y="222" width="330" height="26" fill="#ffffff"/>
  <text x="40" y="240" font-size="14" font-weight="600" fill="#0f172a">② 发：你的数据怎么出网卡</text>

  <rect x="52" y="256" width="170" height="64" rx="6" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="137" y="284" font-size="14" font-weight="600" fill="#1e40af" text-anchor="middle">应用写缓冲</text>
  <text x="137" y="306" font-size="11.5" fill="#334155" text-anchor="middle">write(fd, buf, n) 的 buf</text>

  <rect x="300" y="256" width="300" height="64" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="284" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">内核发送队列</text>
  <text x="450" y="306" font-size="11.5" fill="#334155" text-anchor="middle">ss 里 Send-Q 那一列</text>

  <rect x="690" y="256" width="210" height="64" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="795" y="284" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">网卡 · 网络</text>
  <text x="795" y="306" font-size="11.5" fill="#334155" text-anchor="middle">对端收得慢，它就腾不空</text>

  <line x1="226" y1="288" x2="296" y2="288" stroke="#b45309" stroke-width="2.5" marker-end="url(#aamber)"/>
  <line x1="606" y1="288" x2="686" y2="288" stroke="#64748b" stroke-width="2.5" marker-end="url(#agray)"/>
  <rect x="196" y="324" width="132" height="20" fill="#ffffff"/>
  <text x="262" y="339" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">1 次 CPU 拷贝</text>
  <rect x="570" y="324" width="158" height="20" fill="#ffffff"/>
  <text x="650" y="339" font-size="12" fill="#64748b" text-anchor="middle">DMA 读出 · 不经过 CPU</text>

  <rect x="40" y="372" width="920" height="140" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="64" y="398" font-size="14" font-weight="600" fill="#0f172a">三条判据都长在这次拷贝上</text>
  <text x="64" y="424" font-size="13" fill="#334155">read 返回 n：数据已经进了你的缓冲，但这只代表「我收到了」，与对端收不收得到无关</text>
  <text x="64" y="450" font-size="13" fill="#334155">write 返回 n：只代表「进了发送队列」；对端什么时候收到、有没有收到，返回值一概不反映</text>
  <text x="64" y="476" font-size="13" fill="#334155">sendfile：把中间那一跳省掉——数据不落到应用缓冲，只在内核里换一次描述，所以叫零拷贝</text>
</svg>
