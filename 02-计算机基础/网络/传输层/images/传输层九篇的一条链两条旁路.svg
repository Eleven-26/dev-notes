<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 444" width="1000" height="444" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="444" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">传输层九篇：一条链、一条旁路、两个横切</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">TCP 六篇是有严格先后的一条链，必须按序读；另外三篇各换一个维度——换协议、换视角、换时间点</text>

  <rect x="20" y="66" width="500" height="22" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" rx="6"/>
  <text x="30" y="82" font-size="12.5" font-weight="bold" fill="#1e40af">主线 · TCP 六篇：一条连接从建到拆，按 ①→⑥ 顺序读</text>

  <g transform="translate(20,92)">
    <rect x="0" y="0" width="153" height="124" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="10" y="22" font-size="12" font-weight="bold" fill="#0f172a">① 协议基础</text>
    <text x="10" y="42" font-size="9.5" fill="#1e40af">地基</text>
    <text x="10" y="64" font-size="9" fill="#334155">首部各字段</text>
    <text x="10" y="80" font-size="9" fill="#334155">序列号与确认号演算</text>
    <text x="10" y="96" font-size="9" fill="#334155">字节流没有边界</text>
    <text x="10" y="114" font-size="8.5" fill="#64748b">连接的本质是什么</text>
  </g>

  <g transform="translate(181,92)">
    <rect x="0" y="0" width="153" height="124" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="10" y="22" font-size="12" font-weight="bold" fill="#0f172a">② 三次握手</text>
    <text x="10" y="42" font-size="9.5" fill="#1e40af">建连接</text>
    <text x="10" y="64" font-size="9" fill="#334155">为什么必须三次</text>
    <text x="10" y="80" font-size="9" fill="#334155">半连接与全连接队列</text>
    <text x="10" y="96" font-size="9" fill="#334155">backlog 真实含义</text>
    <text x="10" y="114" font-size="8.5" fill="#64748b">TCP Fast Open</text>
  </g>

  <g transform="translate(342,92)">
    <rect x="0" y="0" width="153" height="124" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="10" y="22" font-size="12" font-weight="bold" fill="#0f172a">③ 滑动窗口</text>
    <text x="10" y="42" font-size="9.5" fill="#1e40af">传数据</text>
    <text x="10" y="64" font-size="9" fill="#334155">rwnd 与 cwnd 的交集</text>
    <text x="10" y="80" font-size="9" fill="#334155">窗口缩放 · SACK</text>
    <text x="10" y="96" font-size="9" fill="#334155">零窗口探测</text>
    <text x="10" y="114" font-size="8.5" fill="#64748b">吞吐上限由谁定</text>
  </g>

  <g transform="translate(503,92)">
    <rect x="0" y="0" width="153" height="124" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="10" y="22" font-size="12" font-weight="bold" fill="#0f172a">④ Nagle 与延迟确认</text>
    <text x="10" y="42" font-size="9.5" fill="#1e40af">小包优化</text>
    <text x="10" y="64" font-size="9" fill="#334155">小包怎么被合并</text>
    <text x="10" y="80" font-size="9" fill="#334155">两者叠加的互相伤害</text>
    <text x="10" y="96" font-size="9" fill="#334155">NODELAY 怎么破</text>
    <text x="10" y="114" font-size="8.5" fill="#64748b">两条一起看才懂</text>
  </g>

  <g transform="translate(664,92)">
    <rect x="0" y="0" width="153" height="124" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="10" y="22" font-size="12" font-weight="bold" fill="#0f172a">⑤ 拥塞控制</text>
    <text x="10" y="42" font-size="9.5" fill="#1e40af">窗口的另一半</text>
    <text x="10" y="64" font-size="9" fill="#334155">AIMD 四条机制</text>
    <text x="10" y="80" font-size="9" fill="#334155">Tahoe / Reno / CUBIC</text>
    <text x="10" y="96" font-size="9" fill="#334155">BBR 不信丢包</text>
    <text x="10" y="114" font-size="8.5" fill="#64748b">含 Go 模拟实测</text>
  </g>

  <g transform="translate(825,92)">
    <rect x="0" y="0" width="153" height="124" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="10"/>
    <text x="10" y="22" font-size="12" font-weight="bold" fill="#0f172a">⑥ 四次挥手</text>
    <text x="10" y="42" font-size="9.5" fill="#1e40af">断连接</text>
    <text x="10" y="64" font-size="9" fill="#334155">为什么是四次</text>
    <text x="10" y="80" font-size="9" fill="#334155">TIME_WAIT 谁在等</text>
    <text x="10" y="96" font-size="9" fill="#334155">CLOSE_WAIT 堆积</text>
    <text x="10" y="114" font-size="8.5" fill="#64748b">四种状态本机实测</text>
  </g>

  <rect x="20" y="230" width="240" height="22" fill="#dcfce7" stroke="#86efac" stroke-width="1" rx="6"/>
  <text x="30" y="246" font-size="12.5" font-weight="bold" fill="#166534">旁路 · 换一条传输路径</text>

  <rect x="350" y="230" width="630" height="22" fill="#fef3c7" stroke="#fcd34d" stroke-width="1" rx="6"/>
  <text x="360" y="246" font-size="12.5" font-weight="bold" fill="#92400e">横切 · 不换协议，换看它的角度</text>

  <g transform="translate(20,256)">
    <rect x="0" y="0" width="240" height="100" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" rx="10"/>
    <text x="10" y="22" font-size="12.5" font-weight="bold" fill="#0f172a">UDP 与数据报传输</text>
    <text x="10" y="42" font-size="9.5" fill="#166534">没有那条链的对照物</text>
    <text x="10" y="62" font-size="9" fill="#334155">数据报有边界 · 8 字节头</text>
    <text x="10" y="78" font-size="9" fill="#334155">明确不保证什么</text>
    <text x="10" y="94" font-size="9" fill="#64748b">MTU 与接收队列丢包</text>
  </g>

  <g transform="translate(350,256)">
    <rect x="0" y="0" width="300" height="100" fill="#fffbeb" stroke="#b45309" stroke-width="1" rx="10"/>
    <text x="10" y="22" font-size="12.5" font-weight="bold" fill="#0f172a">IO 多路复用</text>
    <text x="10" y="42" font-size="9.5" fill="#92400e">一个进程怎么同时管 N 条连接</text>
    <text x="10" y="62" font-size="9" fill="#334155">五种 I/O 模型 · epoll 三代</text>
    <text x="10" y="78" font-size="9" fill="#334155">LT 与 ET · 惊群与 Reactor</text>
    <text x="10" y="94" font-size="9" fill="#64748b">Go netpoller · io_uring</text>
  </g>

  <g transform="translate(660,256)">
    <rect x="0" y="0" width="320" height="100" fill="#fffbeb" stroke="#b45309" stroke-width="1" rx="10"/>
    <text x="10" y="22" font-size="12.5" font-weight="bold" fill="#0f172a">TCP 保活与连接存活</text>
    <text x="10" y="42" font-size="9.5" fill="#92400e">连接建好之后，谁发现它已经死了</text>
    <text x="10" y="62" font-size="9" fill="#334155">keepalive 探得到什么、探不到什么</text>
    <text x="10" y="78" font-size="9" fill="#334155">四层保活分工 · 半开连接</text>
    <text x="10" y="94" font-size="9" fill="#64748b">心跳间隔怎么定 · 连接池探活</text>
  </g>

  <g transform="translate(20,368)">
    <rect x="0" y="0" width="960" height="65" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="22" font-size="11.5" font-weight="bold" fill="#0f172a">为什么 TCP 那六篇不能跳着读：每一篇都用到前一篇的结论——窗口字段在报文里，握手之后才有窗口，拥塞窗口是窗口的另一半。</text>
    <text x="14" y="42" font-size="10.5" fill="#334155">旁路与横切可以随时插入：UDP 是「换一条路」的对照，IO 多路复用是「一个进程 × N 条连接」的视角，保活是「时间轴上往后延」的那个点。</text>
    <text x="14" y="56" font-size="10.5" fill="#64748b">tcp/ 六篇不单独设导读：它们是一条读序，拆成两份入口只会让顺序重复两遍。</text>
  </g>
</svg>
