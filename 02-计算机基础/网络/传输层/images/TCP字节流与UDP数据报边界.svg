<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">TCP 字节流与 UDP 数据报的边界</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">TCP 把多次写合并成不分界的字节流、接收方必须自己划界；UDP 每次写对应一个独立数据报，一次读就是一个完整消息</text>

  <defs>
    <marker id="arwB2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>

  <rect x="20" y="74" width="460" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="34" y="98" font-size="15" font-weight="bold" fill="#0f172a">TCP：字节流没有边界</text>
  <text x="34" y="118" font-size="10.5" fill="#64748b">write 三次，对端可能一次 read 拿到全部</text>

  <rect x="34" y="134" width="100" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="84" y="154" text-anchor="middle" font-size="10" fill="#1e40af">write 10 B</text>
  <rect x="144" y="134" width="100" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="194" y="154" text-anchor="middle" font-size="10" fill="#1e40af">write 10 B</text>
  <rect x="254" y="134" width="100" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="304" y="154" text-anchor="middle" font-size="10" fill="#1e40af">write 10 B</text>

  <line x1="194" y1="164" x2="194" y2="180" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arwB2)"/>

  <rect x="34" y="184" width="400" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="46" y="205" font-size="10" fill="#1e40af">字节流：10 + 10 + 10 合并成 30 字节，中间没有分界</text>

  <rect x="34" y="228" width="400" height="30" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="46" y="248" font-size="10" fill="#991b1b">read 一次可能拿到 30 B，也可能分成 10 + 20</text>

  <rect x="34" y="268" width="400" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="46" y="288" font-size="10" fill="#14532d">所以应用必须自己划界：长度前缀 / 分隔符 / 定长</text>

  <text x="34" y="324" font-size="10" fill="#64748b">TCP 只保证字节的顺序，不保证「消息」的分组形状</text>
  <text x="34" y="346" font-size="10" fill="#64748b">长度前缀的 Go 实现见 tcp/TCP报文结构.md 使用一</text>

  <rect x="520" y="74" width="460" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="534" y="98" font-size="15" font-weight="bold" fill="#0f172a">UDP：一次写就是一个数据报</text>
  <text x="534" y="118" font-size="10.5" fill="#64748b">三次 write 变成三个独立数据报，各自带 8 字节首部</text>

  <rect x="534" y="134" width="400" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="546" y="154" font-size="10" fill="#1e40af">数据报①　udp 首部 8 B ＋ 载荷 10 B</text>
  <rect x="534" y="172" width="400" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="546" y="192" font-size="10" fill="#1e40af">数据报②　udp 首部 8 B ＋ 载荷 10 B</text>
  <rect x="534" y="210" width="400" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="546" y="230" font-size="10" fill="#1e40af">数据报③　udp 首部 8 B ＋ 载荷 10 B</text>

  <rect x="534" y="256" width="400" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="546" y="276" font-size="10" fill="#14532d">对端三次 read，各拿 10 B，消息边界不会丢</text>

  <rect x="534" y="294" width="400" height="30" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="546" y="314" font-size="10" fill="#92400e">边界只在单次数据报内有效：分片丢一片就整包作废</text>

  <text x="534" y="346" font-size="10" fill="#64748b">应用不必自己分帧，但必须自己管丢包与重试</text>

  <rect x="20" y="394" width="960" height="172" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="34" y="418" font-size="15" font-weight="bold" fill="#0f172a">UDP 首部：8 字节，四个字段</text>

  <rect x="34" y="430" width="150" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="109" y="454" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">源端口 2 B</text>
  <rect x="184" y="430" width="150" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="259" y="454" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">目的端口 2 B</text>
  <rect x="334" y="430" width="150" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="409" y="454" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">长度 2 B</text>
  <rect x="484" y="430" width="150" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="559" y="454" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">校验和 2 B</text>
  <rect x="634" y="430" width="326" height="38" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="797" y="454" text-anchor="middle" font-size="11" fill="#334155">载荷 …（长度字段 = 首部 + 载荷）</text>

  <text x="34" y="492" font-size="10.5" fill="#334155">长度最小值是 8（空载荷），16 位字段 → 报文最大 65535 字节，扣掉首部后载荷上限 65527</text>
  <text x="34" y="516" font-size="10.5" fill="#334155">校验和覆盖「伪首部 + UDP 首部 + 载荷」；伪首部含源 IP、目的 IP、协议号与长度</text>
  <text x="34" y="540" font-size="10.5" fill="#991b1b">IPv4 允许填 0 表示不校验（默认仍应计算）；IPv6 强制计算，校验和字段不能省</text>
  <text x="34" y="560" font-size="10" fill="#64748b">伪首部不进报文，只参与计算：它让误投到别的主机或协议的报文校验失败而被丢弃</text>
</svg>
