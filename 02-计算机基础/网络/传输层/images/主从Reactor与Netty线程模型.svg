<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="rBlue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="rGreen" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">主从 Reactor：Netty bossGroup / workerGroup 线程模型</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">主 Reactor 只管接连接，从 Reactor（EventLoop）管读写；一个 Channel 固定绑定一个 EventLoop，事件天然串行</text>

  <rect x="40" y="128" width="120" height="60" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="100" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">客户端</text>

  <rect x="200" y="118" width="160" height="80" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="280" y="146" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#92400e">主 Reactor</text>
  <text x="280" y="168" text-anchor="middle" font-size="11.5" fill="#92400e">bossGroup</text>
  <text x="280" y="188" text-anchor="middle" font-size="11" fill="#92400e">accept 新连接</text>

  <rect x="440" y="74" width="240" height="104" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="560" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">EventLoop 1（1 线程）</text>
  <rect x="452" y="112" width="64" height="52" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="484" y="142" text-anchor="middle" font-size="11" fill="#14532d">Ch A</text>
  <rect x="528" y="112" width="64" height="52" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="560" y="142" text-anchor="middle" font-size="11" fill="#14532d">Ch B</text>
  <rect x="604" y="112" width="64" height="52" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="636" y="142" text-anchor="middle" font-size="11" fill="#14532d">Ch C</text>

  <rect x="440" y="210" width="240" height="104" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="560" y="232" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">EventLoop 2（1 线程）</text>
  <rect x="452" y="248" width="64" height="52" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="484" y="278" text-anchor="middle" font-size="11" fill="#14532d">Ch D</text>
  <rect x="528" y="248" width="64" height="52" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="560" y="278" text-anchor="middle" font-size="11" fill="#14532d">Ch E</text>

  <rect x="750" y="150" width="190" height="96" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="845" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">业务线程池</text>
  <text x="845" y="208" text-anchor="middle" font-size="11" fill="#7f1d1d">阻塞任务移出</text>
  <text x="845" y="228" text-anchor="middle" font-size="11" fill="#7f1d1d">I/O EventLoop</text>

  <line x1="160" y1="158" x2="194" y2="158" stroke="#2563eb" stroke-width="1.6" marker-end="url(#rBlue)"/>
  <text x="177" y="150" text-anchor="middle" font-size="10.5" fill="#1e3a8a">新连接</text>
  <line x1="360" y1="140" x2="434" y2="120" stroke="#2563eb" stroke-width="1.6" marker-end="url(#rBlue)"/>
  <text x="394" y="112" text-anchor="middle" font-size="10.5" fill="#1e3a8a">注册给</text>
  <line x1="360" y1="176" x2="434" y2="256" stroke="#2563eb" stroke-width="1.6" marker-end="url(#rBlue)"/>
  <line x1="680" y1="150" x2="744" y2="182" stroke="#16a34a" stroke-width="1.6" marker-end="url(#rGreen)"/>
  <text x="712" y="150" text-anchor="middle" font-size="10.5" fill="#14532d">耗时走</text>
  <line x1="680" y1="256" x2="744" y2="212" stroke="#16a34a" stroke-width="1.6" marker-end="url(#rGreen)"/>

  <text x="40" y="346" font-size="12.5" fill="#334155">要点：一个 EventLoop = 一个线程管理多个 Channel，串行执行其事件与任务；同一 Channel 固定绑一个 EventLoop。</text>
  <text x="40" y="372" font-size="12.5" fill="#334155">要点：阻塞业务必须移出 I/O EventLoop，交给业务线程池，否则会拖住该线程上其他 Channel。</text>
  <text x="40" y="398" font-size="12.5" fill="#7f1d1d">注意：Nginx 更准确是"多个 worker 进程各跑单线程 Reactor"，master 管生命周期不负责 accept，不等同主从 Reactor。</text>
  <text x="40" y="424" font-size="12.5" fill="#64748b">对照：单 Reactor 单线程接近经典 Redis；主从 Reactor 的典型实现就是 Netty。</text>
</svg>
