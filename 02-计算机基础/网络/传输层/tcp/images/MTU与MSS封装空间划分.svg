<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="340" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">MTU / MSS 的封装空间划分（以太网 MTU = 1500 字节）</text>
  <text x="500" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">MTU 指链路层载荷上限（整个 IP 包）；MSS 指 TCP 选项声明的「一段能装多少应用数据」= MTU − IP 头 − TCP 头</text>

  <text x="110" y="118" text-anchor="end" font-size="14" font-weight="bold" fill="#0f172a">IPv4</text>
  <rect x="120" y="92" width="120" height="46" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="180" y="120" text-anchor="middle" font-size="12" fill="#475569">IP 头 20</text>
  <rect x="240" y="92" width="120" height="46" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="300" y="120" text-anchor="middle" font-size="12" fill="#1e40af">TCP 头 20</text>
  <rect x="360" y="92" width="540" height="46" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="630" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">TCP 数据 = MSS 1460（1500 − 20 − 20）</text>

  <line x1="120" y1="150" x2="900" y2="150" stroke="#64748b" stroke-width="1.1"/>
  <line x1="120" y1="146" x2="120" y2="158" stroke="#64748b" stroke-width="1.1"/>
  <line x1="900" y1="146" x2="900" y2="158" stroke="#64748b" stroke-width="1.1"/>
  <text x="510" y="170" text-anchor="middle" font-size="11.5" fill="#334155">一个 IP 包 = MTU 1500 字节</text>

  <text x="110" y="228" text-anchor="end" font-size="14" font-weight="bold" fill="#0f172a">IPv6</text>
  <rect x="120" y="202" width="180" height="46" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="210" y="230" text-anchor="middle" font-size="12" fill="#475569">IP 头 40</text>
  <rect x="300" y="202" width="120" height="46" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="360" y="230" text-anchor="middle" font-size="12" fill="#1e40af">TCP 头 20</text>
  <rect x="420" y="202" width="480" height="46" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="660" y="230" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">TCP 数据 = MSS 1440（1500 − 40 − 20）</text>

  <text x="120" y="286" font-size="10.5" fill="#94a3b8">注：方块宽度未按字节等比，只为分区示意；字节数以标注为准。</text>
  <text x="120" y="312" font-size="11.5" fill="#334155">要点：TCP 的 MSS 在握手时用选项声明；MSS 的分段与 IP 层的分片是两回事（分片口径见 IP 与路由基础）。</text>
</svg>
