<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">滑动窗口在序号空间上的划分与滑动</text>
  <text x="500" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">窗口 = 已发送未确认 + 还可以发送；取正文演算值：起点 100、MSS 1000、窗口 5 段 = 5000 字节</text>

  <text x="120" y="86" text-anchor="middle" font-size="10.5" fill="#94a3b8">100</text>
  <text x="480" y="86" text-anchor="middle" font-size="10.5" fill="#94a3b8">5100</text>
  <text x="560" y="86" text-anchor="middle" font-size="10.5" fill="#94a3b8">6100</text>
  <text x="880" y="86" text-anchor="middle" font-size="10.5" fill="#94a3b8">10100</text>

  <text x="72" y="120" text-anchor="end" font-size="12" font-weight="bold" fill="#0f172a">①</text>
  <rect x="80" y="98" width="400" height="44" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="280" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a3412">已发送未确认（在途 5 段）</text>
  <rect x="480" y="98" width="480" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="720" y="124" text-anchor="middle" font-size="12.5" fill="#64748b">窗口外：序号 ≥ 5100 不能发送</text>

  <text x="72" y="196" text-anchor="end" font-size="12" font-weight="bold" fill="#0f172a">②</text>
  <rect x="80" y="174" width="400" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="280" y="200" text-anchor="middle" font-size="12.5" fill="#14532d">已确认（滑出，不必再管）</text>
  <rect x="480" y="174" width="400" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="680" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">还可以发送</text>
  <rect x="880" y="174" width="80" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 4"/>

  <text x="72" y="272" text-anchor="end" font-size="12" font-weight="bold" fill="#0f172a">③</text>
  <rect x="80" y="250" width="480" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="320" y="276" text-anchor="middle" font-size="12.5" fill="#14532d">已确认</text>
  <rect x="560" y="250" width="400" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="760" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">还可以发送</text>

  <rect x="60" y="322" width="880" height="126" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="78" y="348" font-size="14" font-weight="bold" fill="#0f172a">三行对应的正文演算（累积确认驱动窗口右移）</text>
  <text x="78" y="376" font-size="11.5" fill="#334155">① 初始窗口 [100,5100)：连发 5 段打满，未收到任何确认 → 必须停止发送等待 ACK。</text>
  <text x="78" y="400" font-size="11.5" fill="#334155">② 收到 ACK = 5100（5100 之前全收到）→ 窗口右移 5000，变为 [5100,10100)。</text>
  <text x="78" y="424" font-size="11.5" fill="#334155">③ 再发并确认 1 段得 ACK = 6100 → 再右移 1000，变为 [6100,11100)，循环往复。</text>

  <line x1="480" y1="145" x2="480" y2="168" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="560" y1="221" x2="560" y2="244" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
