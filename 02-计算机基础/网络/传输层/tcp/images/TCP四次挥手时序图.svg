<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" role="img" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <title>TCP 四次挥手时序图</title>
  <desc>客户端主动关闭、服务端被动关闭的四次挥手：FIN、ACK、FIN、ACK 四个报文，两端的 CLOSE_WAIT / FIN_WAIT_2 / TIME_WAIT 状态迁移，以及谁在等 TIME_WAIT。</desc>
  <defs>
    <marker id="m-b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="m-a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b45309"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="530" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">TCP 四次挥手时序图</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">四个报文与两端的 CLOSE_WAIT / FIN_WAIT_2 / TIME_WAIT 状态迁移 —— 谁在等 TIME_WAIT</text>

  <rect x="150" y="80" width="200" height="48" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="250" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">客户端（主动关闭）</text>
  <text x="250" y="118" text-anchor="middle" font-size="12" fill="#1e3a8a">先 close() 的一方</text>
  <rect x="650" y="80" width="200" height="48" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="750" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">服务端（被动关闭）</text>
  <text x="750" y="118" text-anchor="middle" font-size="12" fill="#854d0e">等应用 close()</text>

  <line x1="250" y1="128" x2="250" y2="372" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="750" y1="128" x2="750" y2="372" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>

  <line x1="250" y1="152" x2="744" y2="152" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m-b)"/>
  <text x="500" y="140" text-anchor="middle" font-size="14" fill="#1e3a8a">1. FIN, seq = u</text>
  <text x="240" y="174" text-anchor="end" font-size="12.5" fill="#1e3a8a">FIN_WAIT_1</text>
  <text x="760" y="174" text-anchor="start" font-size="12.5" fill="#7f1d1d">CLOSE_WAIT</text>

  <line x1="750" y1="214" x2="256" y2="214" stroke="#b45309" stroke-width="1.6" marker-end="url(#m-a)"/>
  <text x="500" y="202" text-anchor="middle" font-size="14" fill="#854d0e">2. ACK, ack = u + 1</text>
  <text x="240" y="236" text-anchor="end" font-size="12.5" fill="#1e3a8a">FIN_WAIT_2</text>
  <text x="240" y="254" text-anchor="end" font-size="12" fill="#1e3a8a">（等对方的 FIN）</text>

  <line x1="750" y1="288" x2="256" y2="288" stroke="#b45309" stroke-width="1.6" marker-end="url(#m-a)"/>
  <text x="500" y="276" text-anchor="middle" font-size="14" fill="#854d0e">3. FIN, seq = w, ack = u + 1</text>
  <text x="760" y="308" text-anchor="start" font-size="12.5" fill="#854d0e">LAST_ACK</text>

  <line x1="250" y1="340" x2="744" y2="340" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m-b)"/>
  <text x="500" y="328" text-anchor="middle" font-size="14" fill="#1e3a8a">4. ACK, ack = w + 1</text>
  <text x="240" y="364" text-anchor="end" font-size="12.5" fill="#854d0e">TIME_WAIT</text>
  <text x="760" y="364" text-anchor="start" font-size="12.5" fill="#334155">CLOSED</text>

  <rect x="40" y="392" width="920" height="118" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="64" y="420" font-size="13" fill="#0f172a">FIN 只关一个方向 → 收到 FIN 仍可继续发（半关闭，用 shutdown(SHUT_WR) 触发）</text>
  <text x="64" y="452" font-size="13" fill="#0f172a">TIME_WAIT 只在主动关闭方：等 2MSL（RFC 取 4 分钟 / Linux 固定 60 秒 / Windows 实测 ≈121 秒）</text>
  <text x="64" y="484" font-size="13" fill="#7f1d1d">CLOSE_WAIT 在被关闭方：等的是应用 close()，没有超时 —— 堆积就是代码泄漏</text>
</svg>
