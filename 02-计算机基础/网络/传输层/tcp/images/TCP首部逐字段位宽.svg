<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">TCP 首部逐字段位宽（固定 20 字节 + 选项最多 40 字节）</text>
  <text x="500" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">每行 4 字节 = 32 bit；位宽与偏移取自本篇 1.3 字段表，数据偏移最小 0101=5、最大 1111=15（单位 4 字节 → 首部 20 ~ 60 字节）</text>

  <text x="30" y="90" font-size="11" fill="#64748b">bit→</text>
  <text x="60" y="82" text-anchor="middle" font-size="10" fill="#94a3b8">0</text>
  <text x="175" y="82" text-anchor="middle" font-size="10" fill="#94a3b8">4</text>
  <text x="261" y="82" text-anchor="middle" font-size="10" fill="#94a3b8">7</text>
  <text x="520" y="82" text-anchor="middle" font-size="10" fill="#94a3b8">16</text>
  <text x="980" y="82" text-anchor="middle" font-size="10" fill="#94a3b8">31</text>

  <text x="30" y="118" font-size="10" fill="#64748b">B0-3</text>
  <rect x="60" y="98" width="460" height="42" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="290" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">源端口（16 bit）</text>
  <rect x="520" y="98" width="460" height="42" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="750" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">目的端口（16 bit）</text>

  <text x="30" y="166" font-size="10" fill="#64748b">B4-7</text>
  <rect x="60" y="146" width="920" height="42" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="520" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">序列号 Sequence Number（32 bit）— 本段数据第一个字节的编号</text>

  <text x="30" y="214" font-size="10" fill="#64748b">B8-11</text>
  <rect x="60" y="194" width="920" height="42" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="520" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">确认号 Acknowledgment Number（32 bit）— 累计确认：这个序号之前全收到</text>

  <text x="30" y="262" font-size="10" fill="#64748b">B12-15</text>
  <rect x="60" y="242" width="115" height="42" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="117" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#854d0e">数据偏移</text>
  <text x="117" y="277" text-anchor="middle" font-size="10" fill="#854d0e">4 bit</text>
  <rect x="175" y="242" width="86" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="218" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748b">保留</text>
  <text x="218" y="277" text-anchor="middle" font-size="10" fill="#64748b">3 bit</text>
  <rect x="261" y="242" width="259" height="42" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="390" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">标志位 9 bit</text>
  <text x="390" y="277" text-anchor="middle" font-size="10" fill="#9a3412">NS·CWR·ECE·URG…</text>
  <rect x="520" y="242" width="460" height="42" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="750" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">窗口（16 bit，最大 65535）</text>
  <text x="750" y="277" text-anchor="middle" font-size="10" fill="#1e40af">接收方还能收多少 → rwnd</text>

  <text x="30" y="310" font-size="10" fill="#64748b">B16-19</text>
  <rect x="60" y="290" width="460" height="42" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="290" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">校验和（16 bit）</text>
  <text x="290" y="325" text-anchor="middle" font-size="10" fill="#991b1b">覆盖 伪首部+首部+数据</text>
  <rect x="520" y="290" width="460" height="42" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="750" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">紧急指针（16 bit）</text>
  <text x="750" y="325" text-anchor="middle" font-size="10" fill="#991b1b">配 URG，现代实现很少用</text>

  <text x="30" y="358" font-size="10" fill="#64748b">B20→</text>
  <rect x="60" y="338" width="560" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="340" y="364" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">选项（变长，0 ~ 40 字节）：MSS / 窗口缩放 / SACK / 时间戳</text>
  <rect x="620" y="338" width="360" height="42" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="800" y="364" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">数据部分 payload</text>

  <rect x="60" y="398" width="920" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="78" y="424" font-size="14" font-weight="bold" fill="#0f172a">要点：标志位这 9 个 bit（含从保留位划出的 ECN 三项）</text>
  <text x="78" y="452" font-size="11.5" fill="#334155">NS(1) · CWR(1) · ECE(1) · URG(1) · ACK(1) · PSH(1) · RST(1) · SYN(1) · FIN(1)</text>
  <text x="78" y="478" font-size="11" fill="#334155">RFC 793 只有 6 个（URG/ACK/PSH/RST/SYN/FIN）；RFC 3168 为 ECN 增设 ECE/CWR，RFC 3540 增设 NS →</text>
  <text x="78" y="500" font-size="11" fill="#334155">「TCP 只有 6 个标志位」是过时说法，今天抓包里 9 个都可能出现。</text>
  <text x="78" y="524" font-size="11" fill="#64748b">SYN 与 FIN 各占 1 个序号空间；纯 ACK 段 SEG.LEN = 0，不消耗序号（见 1.4）。</text>
</svg>
