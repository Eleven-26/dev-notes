<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 596" width="1000" height="596" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="596" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">IP 缺的五件事、TCP 补的四件工具，以及它仍不保证的六条</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">上半是「为什么需要 TCP」，下半是「TCP 的可靠到什么为止」——本篇 1.2 与 1.3 的结构</text>
  <rect x="20" y="76" width="960" height="126" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="38" y="100" font-size="13" font-weight="bold" fill="#0f172a">① IP 层只承诺「尽力而为」：五件事它不管</text>
  <rect x="38" y="112" width="176" height="76" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.1"/>
  <text x="126" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">① 不保证送达</text>
  <text x="126" y="160" text-anchor="middle" font-size="10.5" fill="#991b1b">丢了没人知道，也没人补发</text>
  <rect x="226" y="112" width="176" height="76" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.1"/>
  <text x="314" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">② 不保证顺序</text>
  <text x="314" y="160" text-anchor="middle" font-size="10.5" fill="#991b1b">后发的包可能先到</text>
  <rect x="414" y="112" width="176" height="76" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.1"/>
  <text x="502" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">③ 不保证不重复</text>
  <text x="502" y="160" text-anchor="middle" font-size="10.5" fill="#991b1b">重复包会被当成新数据</text>
  <rect x="602" y="112" width="176" height="76" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.1"/>
  <text x="690" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">④ 没有连接概念</text>
  <text x="690" y="160" text-anchor="middle" font-size="10.5" fill="#991b1b">每个包独立选路，没有「会话」</text>
  <text x="690" y="176" text-anchor="middle" font-size="10.5" fill="#991b1b">旧包与新包分不清</text>
  <rect x="790" y="112" width="176" height="76" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.1"/>
  <text x="878" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">⑤ 没有流控与拥塞控制</text>
  <text x="878" y="160" text-anchor="middle" font-size="10.5" fill="#991b1b">不知道对方还剩多少空间</text>
  <text x="878" y="176" text-anchor="middle" font-size="10.5" fill="#991b1b">链路是否过载也不知道</text>
  <rect x="20" y="214" width="960" height="122" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="38" y="238" font-size="13" font-weight="bold" fill="#0f172a">② TCP 用四件工具补上：注意它补的是「后果」，不是让 IP 不再丢包</text>
  <rect x="38" y="250" width="224" height="74" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="150" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">① 三次握手</text>
  <text x="150" y="292" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">对齐起点</text>
  <text x="150" y="312" text-anchor="middle" font-size="10" fill="#1e40af">同时确认双方收发自如</text>
  <rect x="274" y="250" width="224" height="74" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="386" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">② 序号 + 确认</text>
  <text x="386" y="292" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">定位缺口</text>
  <text x="386" y="312" text-anchor="middle" font-size="10" fill="#1e40af">每个字节有编号，确认号表累计到位</text>
  <rect x="510" y="250" width="224" height="74" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="622" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">③ 重传</text>
  <text x="622" y="292" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">补缺口</text>
  <text x="622" y="312" text-anchor="middle" font-size="10" fill="#1e40af">超时重发，重复 ACK 触发快重传</text>
  <rect x="746" y="250" width="224" height="74" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>
  <text x="858" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">④ 窗口</text>
  <text x="858" y="292" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">限速</text>
  <text x="858" y="312" text-anchor="middle" font-size="10" fill="#1e40af">rwnd 看接收方，cwnd 看链路</text>
  <rect x="20" y="348" width="960" height="186" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="38" y="372" font-size="13" font-weight="bold" fill="#78350f">③ 但它仍然有边界：「TCP 是可靠的」这句话只在下面这份清单之内成立</text>
  <rect x="38" y="386" width="296" height="62" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="50" y="410" font-size="12" font-weight="bold" fill="#92400e">✗ 不保证消息边界</text>
  <text x="50" y="430" font-size="10.5" fill="#92400e">交付的是字节流，两次 Write 可能被我一次 Read 读走</text>
  <rect x="350" y="386" width="296" height="62" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="362" y="410" font-size="12" font-weight="bold" fill="#92400e">✗ 不保证应用读到</text>
  <text x="362" y="430" font-size="10.5" fill="#92400e">数据只进到接收缓冲，应用何时处理与 TCP 无关</text>
  <rect x="662" y="386" width="296" height="62" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="674" y="410" font-size="12" font-weight="bold" fill="#92400e">✗ 不保证及时</text>
  <text x="674" y="430" font-size="10.5" fill="#92400e">重传要等超时；队头阻塞在 TCP 层无法消除</text>
  <rect x="38" y="456" width="296" height="62" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="50" y="480" font-size="12" font-weight="bold" fill="#92400e">✗ 不保证链路不失败</text>
  <text x="50" y="500" font-size="10.5" fill="#92400e">对端崩溃、中间设备超时，只能重试到判死</text>
  <rect x="350" y="456" width="296" height="62" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="362" y="480" font-size="12" font-weight="bold" fill="#92400e">✗ 不保证语义正确</text>
  <text x="362" y="500" font-size="10.5" fill="#92400e">重放、越权、内容错误，都要应用层自己管</text>
  <rect x="662" y="456" width="296" height="62" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="674" y="480" font-size="12" font-weight="bold" fill="#92400e">✗ 不保证多路独立</text>
  <text x="674" y="500" font-size="10.5" fill="#92400e">一条连接上所有消息共享同一个队头</text>
  <rect x="20" y="544" width="960" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="38" y="571" font-size="12.5" fill="#0f172a">收口：TCP 把「网络会丢包、会乱序」藏起来了；但「对端会挂」「消息会粘在一起」「前面堵着大响应」从来没被藏起来。</text>
</svg>
