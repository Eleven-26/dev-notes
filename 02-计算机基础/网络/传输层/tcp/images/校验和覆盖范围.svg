<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="360" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">校验和的覆盖范围：伪首部 + TCP 首部 + 数据</text>
  <text x="500" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">校验和 16 bit（取自本篇 1.3 字段表）；伪首部 12 字节为 RFC 793 规定，只在校验时临时拼在首部前、并不发送</text>

  <rect x="90" y="86" width="220" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="200" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">伪首部（12 字节）</text>
  <text x="200" y="133" text-anchor="middle" font-size="11" fill="#1e40af">源IP·目的IP·协议·TCP长度</text>

  <rect x="310" y="86" width="200" height="60" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="410" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">TCP 首部（20 字节起）</text>
  <text x="410" y="133" text-anchor="middle" font-size="11" fill="#9a3412">计算时校验和字段置 0</text>

  <rect x="510" y="86" width="400" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="710" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">数据部分（变长）</text>
  <text x="710" y="133" text-anchor="middle" font-size="11" fill="#14532d">真正的 payload</text>

  <line x1="90" y1="160" x2="910" y2="160" stroke="#dc2626" stroke-width="1.2"/>
  <line x1="90" y1="155" x2="90" y2="165" stroke="#dc2626" stroke-width="1.2"/>
  <line x1="910" y1="155" x2="910" y2="165" stroke="#dc2626" stroke-width="1.2"/>
  <line x1="500" y1="160" x2="500" y2="182" stroke="#dc2626" stroke-width="1.2"/>
  <text x="500" y="200" text-anchor="middle" font-size="12" fill="#991b1b">三部分做 16 位反码和 → 写入首部「校验和」字段</text>

  <rect x="90" y="222" width="820" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="108" y="250" font-size="14" font-weight="bold" fill="#0f172a">要点：校验和只查错，不保证送达</text>
  <text x="108" y="278" font-size="11.5" fill="#334155">发现的差错只是「丢弃这一段」；丢包之后的恢复完全依赖序号、计时器与重传。</text>
  <text x="108" y="302" font-size="11.5" fill="#334155">16 位反码和冲突概率不为 0 → 「有校验和」不等于「数据一定正确」，也不提供送达/完整性保证。</text>
  <text x="108" y="326" font-size="11.5" fill="#334155">伪首部把源/目的 IP 也算进校验，防止数据被误投到错误的主机。</text>
</svg>
