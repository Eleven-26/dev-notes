<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="720" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Reno 拥塞窗口随 RTT 的演化（单位 MSS）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">ssthresh 初值 16；第 10 个 RTT 收到三个重复 ACK，触发快恢复：ssthresh=10、cwnd=13</text>

  <rect x="250" y="78" width="16" height="14" fill="#dbeafe" stroke="#2563eb"/>
  <text x="272" y="90" font-size="12.5" fill="#1e3a8a">慢启动（指数，每 RTT 翻倍）</text>
  <rect x="512" y="78" width="16" height="14" fill="#dcfce7" stroke="#16a34a"/>
  <text x="534" y="90" font-size="12.5" fill="#14532d">拥塞避免（线性，每 RTT +1）</text>
  <rect x="762" y="78" width="16" height="14" fill="#ffedd5" stroke="#ea580c"/>
  <text x="784" y="90" font-size="12.5" fill="#9a3412">快恢复（丢包后）</text>

  <line x1="250" y1="104" x2="250" y2="612" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="698" y1="104" x2="698" y2="612" stroke="#b45309" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="698" y="628" text-anchor="middle" font-size="11.5" fill="#92400e">ssthresh=16</text>
  <line x1="530" y1="104" x2="530" y2="612" stroke="#b45309" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="530" y="644" text-anchor="middle" font-size="11.5" fill="#92400e">丢包后 ssthresh=10</text>

  <text x="20" y="140" font-size="12" fill="#334155">RTT 1</text>
  <rect x="250" y="128" width="28" height="16" fill="#dbeafe" stroke="#2563eb"/>
  <text x="286" y="141" font-size="12" fill="#334155">1</text>

  <text x="20" y="164" font-size="12" fill="#334155">RTT 2</text>
  <rect x="250" y="152" width="56" height="16" fill="#dbeafe" stroke="#2563eb"/>
  <text x="314" y="165" font-size="12" fill="#334155">2</text>

  <text x="20" y="188" font-size="12" fill="#334155">RTT 3</text>
  <rect x="250" y="176" width="112" height="16" fill="#dbeafe" stroke="#2563eb"/>
  <text x="370" y="189" font-size="12" fill="#334155">4</text>

  <text x="20" y="212" font-size="12" fill="#334155">RTT 4</text>
  <rect x="250" y="200" width="224" height="16" fill="#dbeafe" stroke="#2563eb"/>
  <text x="482" y="213" font-size="12" fill="#334155">8</text>

  <text x="20" y="236" font-size="12" fill="#334155">RTT 5</text>
  <rect x="250" y="224" width="448" height="16" fill="#dbeafe" stroke="#2563eb"/>
  <text x="706" y="237" font-size="12" fill="#334155">16 到达 ssthresh</text>

  <text x="20" y="260" font-size="12" fill="#334155">RTT 6</text>
  <rect x="250" y="248" width="476" height="16" fill="#dcfce7" stroke="#16a34a"/>
  <text x="734" y="261" font-size="12" fill="#334155">17</text>

  <text x="20" y="284" font-size="12" fill="#334155">RTT 7</text>
  <rect x="250" y="272" width="504" height="16" fill="#dcfce7" stroke="#16a34a"/>
  <text x="762" y="285" font-size="12" fill="#334155">18</text>

  <text x="20" y="308" font-size="12" fill="#334155">RTT 8</text>
  <rect x="250" y="296" width="532" height="16" fill="#dcfce7" stroke="#16a34a"/>
  <text x="790" y="309" font-size="12" fill="#334155">19</text>

  <text x="20" y="332" font-size="12" fill="#334155">RTT 9</text>
  <rect x="250" y="320" width="560" height="16" fill="#dcfce7" stroke="#16a34a"/>
  <text x="818" y="333" font-size="12" fill="#334155">20</text>

  <text x="20" y="356" font-size="12" font-weight="bold" fill="#9a3412">RTT 10</text>
  <rect x="250" y="344" width="364" height="16" fill="#ffedd5" stroke="#ea580c"/>
  <text x="622" y="357" font-size="12" fill="#9a3412">13 快恢复</text>

  <text x="20" y="380" font-size="12" fill="#334155">RTT 11</text>
  <rect x="250" y="368" width="392" height="16" fill="#dcfce7" stroke="#16a34a"/>
  <text x="650" y="381" font-size="12" fill="#334155">14</text>

  <text x="20" y="404" font-size="12" fill="#334155">RTT 12</text>
  <rect x="250" y="392" width="420" height="16" fill="#dcfce7" stroke="#16a34a"/>
  <text x="678" y="405" font-size="12" fill="#334155">15</text>

  <text x="20" y="428" font-size="12" fill="#334155">RTT 13</text>
  <rect x="250" y="416" width="448" height="16" fill="#dcfce7" stroke="#16a34a"/>
  <text x="706" y="429" font-size="12" fill="#334155">16</text>

  <text x="20" y="452" font-size="12" fill="#334155">RTT 14</text>
  <rect x="250" y="440" width="476" height="16" fill="#dcfce7" stroke="#16a34a"/>
  <text x="734" y="453" font-size="12" fill="#334155">17</text>

  <text x="20" y="476" font-size="12" fill="#334155">RTT 15</text>
  <rect x="250" y="464" width="504" height="16" fill="#dcfce7" stroke="#16a34a"/>
  <text x="762" y="477" font-size="12" fill="#334155">18</text>

  <text x="20" y="500" font-size="12" fill="#334155">RTT 16</text>
  <rect x="250" y="488" width="532" height="16" fill="#dcfce7" stroke="#16a34a"/>
  <text x="790" y="501" font-size="12" fill="#334155">19</text>

  <text x="20" y="524" font-size="12" font-weight="bold" fill="#16a34a">RTT 17</text>
  <rect x="250" y="512" width="560" height="16" fill="#dcfce7" stroke="#16a34a"/>
  <text x="818" y="525" font-size="12" fill="#16a34a">20 回到丢包前水平</text>

  <text x="20" y="548" font-size="12" fill="#334155">RTT 18</text>
  <rect x="250" y="536" width="588" height="16" fill="#dcfce7" stroke="#16a34a"/>
  <text x="846" y="549" font-size="12" fill="#334155">21</text>

  <text x="20" y="572" font-size="12" fill="#334155">RTT 19</text>
  <rect x="250" y="560" width="616" height="16" fill="#dcfce7" stroke="#16a34a"/>
  <text x="874" y="573" font-size="12" fill="#334155">22</text>

  <text x="20" y="596" font-size="12" fill="#334155">RTT 20</text>
  <rect x="250" y="584" width="644" height="16" fill="#dcfce7" stroke="#16a34a"/>
  <text x="902" y="597" font-size="12" fill="#334155">23</text>

  <rect x="20" y="656" width="960" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="684" font-size="12.5" fill="#334155">要点：慢启动指数增长到 ssthresh 后转线性；丢包时 ssthresh=cwnd/2、cwnd 从 ssthresh+3 起步，避免退回 1 重爬。</text>
</svg>
