<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">单播 / 广播 / 组播：同一个网段里的投递范围</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">三者都走以太网帧，差别只在"目的 MAC 是哪一个"以及"交换机怎么决定往哪几个口转发"</text>

  <rect x="20" y="76" width="300" height="316" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="170" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">单播</text>
  <text x="170" y="124" text-anchor="middle" font-size="10" fill="#166534">目的 MAC = 某一台的 MAC</text>

  <rect x="140" y="140" width="60" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="170" y="159" text-anchor="middle" font-size="10" fill="#15803d">交换机</text>

  <line x1="150" y1="168" x2="62" y2="216" stroke="#86efac" stroke-width="1.2"/>
  <line x1="163" y1="168" x2="133" y2="216" stroke="#86efac" stroke-width="1.2"/>
  <line x1="177" y1="168" x2="207" y2="216" stroke="#86efac" stroke-width="1.2"/>
  <line x1="190" y1="168" x2="278" y2="216" stroke="#86efac" stroke-width="1.2"/>

  <rect x="36" y="216" width="52" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="62" y="237" text-anchor="middle" font-size="9" fill="#475569">.11</text>
  <rect x="107" y="216" width="52" height="34" rx="6" fill="#16a34a" stroke="#15803d" stroke-width="1.4"/>
  <text x="133" y="237" text-anchor="middle" font-size="9" fill="#ffffff">.12</text>
  <rect x="181" y="216" width="52" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="207" y="237" text-anchor="middle" font-size="9" fill="#475569">.13</text>
  <rect x="252" y="216" width="52" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="278" y="237" text-anchor="middle" font-size="9" fill="#475569">.14</text>

  <text x="36" y="278" font-size="10" fill="#166534">· 查 MAC 表精确转发，只出一个口</text>
  <text x="36" y="300" font-size="10" fill="#166534">· 要先 ARP 拿到对方 MAC</text>
  <text x="36" y="322" font-size="10" fill="#166534">· 别人收不到（混杂模式除外）</text>
  <text x="36" y="352" font-size="10" font-weight="bold" fill="#15803d">带宽代价：1 份</text>
  <text x="36" y="376" font-size="10" fill="#64748b">目标明确时唯一正确的选择</text>

  <rect x="340" y="76" width="300" height="316" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
  <text x="490" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">广播</text>
  <text x="490" y="124" text-anchor="middle" font-size="10" fill="#9a3412">目的 MAC = ff:ff:ff:ff:ff:ff</text>

  <rect x="460" y="140" width="60" height="28" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="490" y="159" text-anchor="middle" font-size="10" fill="#c2410c">交换机</text>

  <line x1="470" y1="168" x2="382" y2="216" stroke="#fdba74" stroke-width="1.4"/>
  <line x1="483" y1="168" x2="453" y2="216" stroke="#fdba74" stroke-width="1.4"/>
  <line x1="497" y1="168" x2="527" y2="216" stroke="#fdba74" stroke-width="1.4"/>
  <line x1="510" y1="168" x2="598" y2="216" stroke="#fdba74" stroke-width="1.4"/>

  <rect x="356" y="216" width="52" height="34" rx="6" fill="#ea580c" stroke="#c2410c" stroke-width="1.4"/>
  <text x="382" y="237" text-anchor="middle" font-size="9" fill="#ffffff">.11</text>
  <rect x="427" y="216" width="52" height="34" rx="6" fill="#ea580c" stroke="#c2410c" stroke-width="1.4"/>
  <text x="453" y="237" text-anchor="middle" font-size="9" fill="#ffffff">.12</text>
  <rect x="501" y="216" width="52" height="34" rx="6" fill="#ea580c" stroke="#c2410c" stroke-width="1.4"/>
  <text x="527" y="237" text-anchor="middle" font-size="9" fill="#ffffff">.13</text>
  <rect x="572" y="216" width="52" height="34" rx="6" fill="#ea580c" stroke="#c2410c" stroke-width="1.4"/>
  <text x="598" y="237" text-anchor="middle" font-size="9" fill="#ffffff">.14</text>

  <text x="356" y="278" font-size="10" fill="#9a3412">· 泛洪到广播域内每个端口</text>
  <text x="356" y="300" font-size="10" fill="#9a3412">· 不查 ARP、不查任何表</text>
  <text x="356" y="322" font-size="10" fill="#9a3412">· 不出网段（255.255.255.255）</text>
  <text x="356" y="352" font-size="10" font-weight="bold" fill="#c2410c">带宽代价：N 份（N = 端口数）</text>
  <text x="356" y="376" font-size="10" fill="#64748b">同网段服务发现够用，跨网段不行</text>

  <rect x="660" y="76" width="300" height="316" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="810" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">组播</text>
  <text x="810" y="124" text-anchor="middle" font-size="10" fill="#1e3a8a">目的 MAC = 01:00:5e + 低 23 位</text>

  <rect x="780" y="140" width="60" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="810" y="159" text-anchor="middle" font-size="10" fill="#1e40af">交换机</text>

  <line x1="790" y1="168" x2="702" y2="216" stroke="#93c5fd" stroke-width="1.2"/>
  <line x1="803" y1="168" x2="773" y2="216" stroke="#93c5fd" stroke-width="1.2"/>
  <line x1="817" y1="168" x2="847" y2="216" stroke="#93c5fd" stroke-width="1.2"/>
  <line x1="830" y1="168" x2="918" y2="216" stroke="#93c5fd" stroke-width="1.2"/>

  <rect x="676" y="216" width="52" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="702" y="237" text-anchor="middle" font-size="9" fill="#475569">.11</text>
  <rect x="747" y="216" width="52" height="34" rx="6" fill="#2563eb" stroke="#1e40af" stroke-width="1.4"/>
  <text x="773" y="237" text-anchor="middle" font-size="9" fill="#ffffff">.12</text>
  <rect x="821" y="216" width="52" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="847" y="237" text-anchor="middle" font-size="9" fill="#475569">.13</text>
  <rect x="892" y="216" width="52" height="34" rx="6" fill="#2563eb" stroke="#1e40af" stroke-width="1.4"/>
  <text x="918" y="237" text-anchor="middle" font-size="9" fill="#ffffff">.14</text>

  <text x="676" y="278" font-size="10" fill="#1e3a8a">· 有 mdb 时只转给加入的口</text>
  <text x="676" y="300" font-size="10" fill="#1e3a8a">· 没 mdb 时退回泛洪（本机实测）</text>
  <text x="676" y="322" font-size="10" fill="#1e3a8a">· 不查 ARP（实测 0 个 ARP 包）</text>
  <text x="676" y="352" font-size="10" font-weight="bold" fill="#1e40af">带宽代价：成员数份（理论）</text>
  <text x="676" y="376" font-size="10" fill="#64748b">snooping 失效时 = 广播的代价</text>

  <rect x="20" y="406" width="940" height="98" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="40" y="430" font-size="12" font-weight="bold" fill="#b91c1c">本机实测的落差：组播的"省带宽"只在交换机真的建了表时才成立</text>
  <text x="40" y="454" font-size="10.5" fill="#991b1b">缺省 snooping=1 但 querier=0，mdb 项到期就没了；把端口标成"永不 mrouter"、把 querier 打开，四组配置下未加入组的主机都仍收到全部 3 个包</text>
  <text x="40" y="476" font-size="10.5" fill="#991b1b">所以判据要看"未加入组的主机能不能抓到帧"，不要看开关值 —— 开关是配置意图，泛洪是实际行为</text>
  <text x="40" y="496" font-size="10" fill="#b91c1c">⚠️ 这是 Linux bridge 的实测，硬件交换机的行为需单独验证</text>
</svg>
