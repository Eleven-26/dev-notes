<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">四个旋钮对丢包恢复时间的实测影响</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">64 KB 切成 48 个包，RTT 80ms，定点丢第 5 个包；每组连跑 3 次取区间</text>

  <rect x="20" y="74" width="960" height="410" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <line x1="230" y1="96" x2="230" y2="356" stroke="#94a3b8" stroke-width="1"/>
  <line x1="450" y1="96" x2="450" y2="356" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="670" y1="96" x2="670" y2="356" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="860" y1="96" x2="860" y2="356" stroke="#e2e8f0" stroke-width="1"/>
  <text x="230" y="92" text-anchor="middle" font-size="9" fill="#94a3b8">0</text>
  <text x="450" y="92" text-anchor="middle" font-size="9" fill="#94a3b8">500 ms</text>
  <text x="670" y="92" text-anchor="middle" font-size="9" fill="#94a3b8">1000 ms</text>
  <text x="860" y="92" text-anchor="middle" font-size="9" fill="#94a3b8">1500 ms</text>

  <text x="34" y="122" font-size="12" font-weight="bold" fill="#0f172a">出厂默认</text>
  <text x="34" y="140" font-size="9.5" fill="#64748b">0 / 100 / 0 / 0</text>
  <rect x="230" y="110" width="706" height="40" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="250" y="135" font-size="11" fill="#991b1b">1680~1681 ms</text>
  <text x="944" y="135" text-anchor="end" font-size="9.5" fill="#991b1b">首轮只发 1 个包</text>

  <text x="34" y="192" font-size="12" font-weight="bold" fill="#0f172a">保留流控</text>
  <text x="34" y="210" font-size="9.5" fill="#64748b">1 / 10 / 2 / 0</text>
  <rect x="230" y="180" width="441" height="40" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.2"/>
  <text x="250" y="205" font-size="11" fill="#9a3412">1030~1070 ms</text>
  <text x="679" y="205" font-size="9.5" fill="#9a3412">首轮只发 1 个包</text>

  <text x="34" y="262" font-size="12" font-weight="bold" fill="#0f172a">官方推荐</text>
  <text x="34" y="280" font-size="9.5" fill="#64748b">1 / 10 / 2 / 1</text>
  <rect x="230" y="250" width="51" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="291" y="275" font-size="11" fill="#14532d">120~121 ms</text>
  <text x="400" y="275" font-size="9.5" fill="#14532d">首轮发出 32 个包</text>

  <text x="34" y="332" font-size="12" font-weight="bold" fill="#0f172a">极速</text>
  <text x="34" y="350" font-size="9.5" fill="#64748b">1 / 5 / 2 / 1</text>
  <rect x="230" y="320" width="51" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="291" y="345" font-size="11" fill="#1e40af">120~131 ms</text>
  <text x="400" y="345" font-size="9.5" fill="#1e40af">首轮发出 32 个包</text>

  <rect x="34" y="372" width="932" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="392" font-size="12" font-weight="bold" fill="#0f172a">三步拆开看，收益几乎全在第三步</text>
  <text x="46" y="412" font-size="10.5" fill="#334155">出厂默认 → 保留流控：改 nodelay / interval / resend 三项，1680 → 1050 ms（−39%）</text>
  <text x="46" y="430" font-size="10.5" fill="#991b1b">保留流控 → 官方推荐：只把 nc 从 0 改成 1，1050 → 120 ms（−88%），首轮发包数从 1 跳到 32</text>
  <text x="46" y="446" font-size="10.5" fill="#334155">官方推荐 → 极速：只把 interval 从 10 改成 5，120 → 120 ms（0%）</text>

  <text x="500" y="470" text-anchor="middle" font-size="9.5" fill="#64748b">读数边界：这是一次 64 KB 短传输，拥塞窗口起步的代价被完整计入；持续传输时 cwnd 会涨到链路容量附近，nc 的差异会缩小。</text>
</svg>
