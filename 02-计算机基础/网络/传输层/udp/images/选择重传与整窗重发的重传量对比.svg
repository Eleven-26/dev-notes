  <rect x="480" y="180" width="330" height="26" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
  <text x="492" y="198" font-size="10" fill="#9a3412">已经到达但被连坐，必须重发（6~48，共 43 个）</text>
  <rect x="820" y="180" width="150" height="26" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="832" y="198" font-size="10" font-weight="bold" fill="#991b1b">重传 44 个包</text>

  <rect x="30" y="216" width="940" height="26" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="42" y="234" font-size="10" fill="#9a3412">注意：现代 TCP 用 SACK 也能做到选择性重传。这里的对照是「不依赖 SACK 时的默认行为」，不是说 TCP 一定这么笨。</text>

  <rect x="20" y="266" width="960" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="34" y="290" font-size="15" font-weight="bold" fill="#0f172a">二、KCP 的逐包确认：只补丢掉的那一个</text>
  <text x="34" y="308" font-size="10.5" fill="#64748b">每个包自己的 sn 被单独确认，6~48 照常交付，发送方只需重发第 5 个</text>

