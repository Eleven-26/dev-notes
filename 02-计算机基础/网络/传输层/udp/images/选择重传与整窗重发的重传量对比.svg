<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">选择重传与整窗重发：同样是丢一个包，重传量差 44 倍</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">64 KB 切成 48 个包，定点丢掉第 5 个；本机实测两种策略下的重传包数</text>

  <rect x="20" y="74" width="960" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="34" y="98" font-size="15" font-weight="bold" fill="#0f172a">一、累计 ACK 的连坐：后面的包到了也要重发</text>
  <text x="34" y="116" font-size="10.5" fill="#64748b">接收方只能确认到 4，发送方从 5 开始整段重发 —— 这是不依赖 SACK 时 TCP 的默认行为</text>

