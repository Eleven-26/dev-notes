<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">UDP 的丢包常常发生在接收队列，而不是链路上</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748B">本机实测：发 5000 个 1000 字节数据报、接收端晚 12 秒才读 —— 内核收满 5000，应用只读到 92</text>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="40" y="84" width="170" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="125" y="108" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">① 网卡收包</text>
  <text x="125" y="130" font-size="11.5" fill="#64748B" text-anchor="middle">收到完整 IP 包</text>
  <line x1="212" y1="116" x2="238" y2="116" stroke="#334155" stroke-width="1.6" marker-end="url(#a1)"/>
  <rect x="240" y="84" width="220" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="350" y="108" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">② 协议栈校验</text>
  <text x="350" y="130" font-size="11.5" fill="#64748B" text-anchor="middle">IP 校验和 / UDP 校验和</text>
  <line x1="462" y1="116" x2="488" y2="116" stroke="#334155" stroke-width="1.6" marker-end="url(#a2)"/>
  <rect x="490" y="84" width="200" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="590" y="108" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">③ 按端口找 socket</text>
  <text x="590" y="130" font-size="11.5" fill="#64748B" text-anchor="middle">四元组 → 接收队列</text>
  <rect x="40" y="180" width="620" height="166" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="60" y="206" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">socket 接收队列：容量由 SO_RCVBUF 决定（本机默认 212992 字节）</text>
  <rect x="60" y="220" width="52" height="44" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="86" y="248" font-size="11" fill="#1d4ed8" text-anchor="middle">skb</text>
  <rect x="120" y="220" width="52" height="44" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="146" y="248" font-size="11" fill="#1d4ed8" text-anchor="middle">skb</text>
  <rect x="180" y="220" width="52" height="44" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="206" y="248" font-size="11" fill="#1d4ed8" text-anchor="middle">skb</text>
  <rect x="240" y="220" width="52" height="44" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="266" y="248" font-size="11" fill="#1d4ed8" text-anchor="middle">skb</text>
  <rect x="300" y="220" width="52" height="44" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="326" y="248" font-size="11" fill="#1d4ed8" text-anchor="middle">skb</text>
  <rect x="360" y="220" width="52" height="44" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="386" y="248" font-size="11" fill="#1d4ed8" text-anchor="middle">skb</text>
  <rect x="420" y="220" width="52" height="44" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="446" y="248" font-size="11" fill="#1d4ed8" text-anchor="middle">skb</text>
  <rect x="480" y="220" width="52" height="44" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5,3"/>
  <rect x="540" y="220" width="52" height="44" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5,3"/>
  <rect x="600" y="220" width="52" height="44" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="60" y="288" font-size="12" fill="#b91c1c" text-anchor="start">队列满了：新到的数据报直接丢弃，并且不向发送方回任何通知</text>
  <text x="60" y="314" font-size="12" fill="#b91c1c" text-anchor="start">应用读得慢 → 队列涨满 → 溢出记在 Udp:RcvbufErrors 上</text>
  <text x="60" y="338" font-size="11.5" fill="#64748B" text-anchor="start">观察点：ss -u -a 看 Recv-Q 是否贴顶；nstat -az 看 UdpRcvbufErrors</text>
  <line x1="662" y1="262" x2="696" y2="262" stroke="#334155" stroke-width="1.6" marker-end="url(#a3)"/>
  <rect x="700" y="180" width="260" height="166" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="720" y="206" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">应用进程</text>
  <text x="720" y="230" font-size="12" fill="#334155" text-anchor="start">recvfrom 取走</text>
  <text x="720" y="256" font-size="12" fill="#334155" text-anchor="start">取得快：队列不涨</text>
  <text x="720" y="282" font-size="12" fill="#b91c1c" text-anchor="start">取得慢：涨满即丢</text>
  <text x="720" y="308" font-size="11.5" fill="#64748B" text-anchor="start">解法是提高读取速度：</text>
  <text x="720" y="330" font-size="11.5" fill="#64748B" text-anchor="start">多线程收 / 批量读 / SO_REUSEPORT</text>
  <text x="44" y="382" font-size="13" fill="#0f172a" text-anchor="start" font-weight="bold">本机实测（发送端 5000 × 1000 字节，接收端晚 12 秒才开始读）</text>
  <rect x="40" y="398" width="920" height="168" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="424" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">场景</text>
  <text x="560" y="424" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">InReceives</text>
  <text x="710" y="424" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">应用读到</text>
  <text x="840" y="424" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="bold">RcvbufErrors</text>
  <line x1="40" y1="436" x2="960" y2="436" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="462" font-size="12" fill="#0f172a" text-anchor="start">默认缓冲（rmem_default = 212992）</text>
  <text x="560" y="462" font-size="12" fill="#0f172a" text-anchor="start">+5000</text>
  <text x="710" y="462" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">92</text>
  <text x="840" y="462" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">4908</text>
  <line x1="40" y1="476" x2="960" y2="476" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="502" font-size="12" fill="#0f172a" text-anchor="start">显式 SetReadBuffer(1048576)</text>
  <text x="560" y="502" font-size="12" fill="#0f172a" text-anchor="start">+5000</text>
  <text x="710" y="502" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">910</text>
  <text x="840" y="502" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">4090</text>
  <line x1="40" y1="516" x2="960" y2="516" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="542" font-size="12" fill="#b91c1c" text-anchor="start">显式设为 0（被夹到最小值）</text>
  <text x="560" y="542" font-size="12" fill="#b91c1c" text-anchor="start">—</text>
  <text x="710" y="542" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="bold">1</text>
  <text x="840" y="542" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="bold">4999</text>
  <text x="44" y="592" font-size="11.5" fill="#64748B" text-anchor="start">三次默认缓冲运行读数完全一致（92 / 4908）：队列容量是确定值，读到多少个可直接当判据</text>
  <text x="44" y="616" font-size="11.5" fill="#64748B" text-anchor="start">缓冲 ÷ 包长 = 212 只是上界：内核按 skb 的 truesize 计费，别拿它做容量规划</text>
</svg>
