<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">QUIC 的三个包号空间：每个方向、每个加密级别各从一个 0 开始</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">本机实测（quic-go v0.48.2）：0-RTT 与 1-RTT 共用 Application 空间，所以 0-RTT 占了 0 之后 1-RTT 从 1 继续</text>

  <rect x="20" y="74" width="960" height="404" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <rect x="34" y="92" width="932" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="46" y="114" font-size="13" font-weight="bold" fill="#1e40af">Initial 空间</text>
  <text x="46" y="132" font-size="9.5" fill="#1e40af">含 ClientHello，用固定盐派生的初始密钥</text>
  <text x="46" y="158" font-size="10" fill="#1e40af">客户端</text>
  <text x="46" y="184" font-size="10" fill="#1e40af">服务端</text>

  <rect x="150" y="142" width="34" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="167" y="159" text-anchor="middle" font-size="11" fill="#1e40af">0</text>
  <rect x="190" y="142" width="34" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="207" y="159" text-anchor="middle" font-size="11" fill="#1e40af">1</text>
  <rect x="230" y="142" width="34" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="247" y="159" text-anchor="middle" font-size="11" fill="#1e40af">2</text>
  <rect x="270" y="142" width="34" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="287" y="159" text-anchor="middle" font-size="11" fill="#1e40af">3</text>
  <rect x="310" y="142" width="34" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="327" y="159" text-anchor="middle" font-size="11" fill="#1e40af">4</text>

  <rect x="150" y="168" width="34" height="24" rx="4" fill="#c7d2fe" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="167" y="185" text-anchor="middle" font-size="11" fill="#312e81">0</text>
  <rect x="190" y="168" width="34" height="24" rx="4" fill="#c7d2fe" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="207" y="185" text-anchor="middle" font-size="11" fill="#312e81">1</text>
  <rect x="230" y="168" width="34" height="24" rx="4" fill="#c7d2fe" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="247" y="185" text-anchor="middle" font-size="11" fill="#312e81">2</text>
  <rect x="270" y="168" width="34" height="24" rx="4" fill="#c7d2fe" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="287" y="185" text-anchor="middle" font-size="11" fill="#312e81">3</text>

  <text x="370" y="159" font-size="10" fill="#1e40af">客户端 Initial 用到 4（1280 字节，含填充）</text>
  <text x="370" y="185" font-size="10" fill="#312e81">服务端 Initial 也从 0 起，大多是 37 字节的 ACK</text>

  <rect x="34" y="212" width="932" height="74" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="46" y="234" font-size="13" font-weight="bold" fill="#14532d">Handshake 空间</text>
  <text x="46" y="252" font-size="9.5" fill="#14532d">TLS 握手后半段，握手密钥</text>
  <text x="46" y="274" font-size="10" fill="#14532d">两端各只有 1 个包</text>

  <rect x="150" y="238" width="34" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="167" y="255" text-anchor="middle" font-size="11" fill="#14532d">0</text>
  <text x="190" y="255" font-size="9.5" fill="#14532d">客户端</text>
  <rect x="250" y="238" width="34" height="24" rx="4" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
  <text x="267" y="255" text-anchor="middle" font-size="11" fill="#14532d">0</text>
  <text x="290" y="255" font-size="9.5" fill="#14532d">服务端</text>
  <text x="370" y="255" font-size="10" fill="#14532d">Initial 已用到 4，Handshake 依然从 0 开始 —— 空间彼此独立</text>

  <rect x="34" y="296" width="932" height="104" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="46" y="318" font-size="13" font-weight="bold" fill="#991b1b">Application 空间（0-RTT 与 1-RTT 共用）</text>
  <text x="46" y="336" font-size="9.5" fill="#991b1b">这是唯一两个加密级别共用一个序列的地方</text>

  <rect x="150" y="330" width="60" height="24" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.6"/>
  <text x="180" y="347" text-anchor="middle" font-size="10" fill="#991b1b">0 = 0-RTT</text>
  <rect x="220" y="330" width="34" height="24" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="237" y="347" text-anchor="middle" font-size="11" fill="#991b1b">1</text>
  <rect x="260" y="330" width="34" height="24" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="277" y="347" text-anchor="middle" font-size="11" fill="#991b1b">2</text>
  <rect x="300" y="330" width="34" height="24" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="317" y="347" text-anchor="middle" font-size="11" fill="#991b1b">3</text>
  <rect x="340" y="330" width="34" height="24" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="357" y="347" text-anchor="middle" font-size="11" fill="#991b1b">4</text>
  <text x="384" y="347" font-size="9.5" fill="#991b1b">…（1-RTT 继续 5、6、7）</text>

  <text x="150" y="376" font-size="10" fill="#991b1b">0-RTT 包 75 字节就带了一个 STREAM 帧，第一个往返就把应用数据发出去了</text>
  <text x="150" y="392" font-size="10" fill="#991b1b">如果 0-RTT 有独立空间，后面那个包就该是 1-RTT 的 0 —— 实测是 1，所以两者共用</text>

  <rect x="34" y="412" width="450" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="432" font-size="11" font-weight="bold" fill="#0f172a">包号 ≠ TCP 的序号</text>
  <text x="46" y="450" font-size="9.5" fill="#334155">TCP 的 seq 是字节偏移，一条连接一个序列；</text>
  <text x="46" y="462" font-size="9.5" fill="#334155">QUIC 的包号是包计数，六个计数器（收发 × 三个空间）。</text>

  <rect x="500" y="412" width="466" height="54" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="512" y="432" font-size="11" font-weight="bold" fill="#9a3412">所以「重传」在 QUIC 里不是同一个包号</text>
  <text x="512" y="450" font-size="9.5" fill="#9a3412">重发同一段字节时换一个新包号，ACK 指向新号，</text>
  <text x="512" y="462" font-size="9.5" fill="#9a3412">RTT 采样没有「这到底是重传还是乱序」的歧义。</text>
</svg>
