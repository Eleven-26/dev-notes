<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555555"/>
    </marker>
  </defs>
  <text x="500" y="38" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="bold" fill="#222222" text-anchor="middle">选型决策树</text>
  <text x="500" y="64" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#666666" text-anchor="middle">先排除不需要同步的情况，再按地址空间分边界，最后才比较代价</text>

  <rect x="360" y="90" width="280" height="52" rx="8" fill="#eef4fb" stroke="#2f6fd0"/>
  <text x="500" y="122" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#222222" text-anchor="middle">① 状态可变吗？</text>
  <rect x="40" y="90" width="270" height="52" rx="8" fill="#eef7f2" stroke="#2e8b57"/>
  <text x="175" y="112" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#222222" text-anchor="middle">不需要同步</text>
  <text x="175" y="132" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#555555" text-anchor="middle">不可变 / 无状态 / 每请求副本</text>
  <line x1="355" y1="116" x2="315" y2="116" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <line x1="500" y1="142" x2="500" y2="168" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <rect x="360" y="172" width="280" height="52" rx="8" fill="#eef4fb" stroke="#2f6fd0"/>
  <text x="500" y="204" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#222222" text-anchor="middle">② 跨进程或跨机吗？</text>
  <rect x="40" y="172" width="270" height="52" rx="8" fill="#fdf4f3" stroke="#c0392b"/>
  <text x="175" y="194" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#222222" text-anchor="middle">外部存储 + 事务 / 锁</text>
  <text x="175" y="214" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#555555" text-anchor="middle">或消息队列 → 第八节</text>
  <line x1="355" y1="198" x2="315" y2="198" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <line x1="500" y1="224" x2="500" y2="250" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <rect x="340" y="254" width="320" height="52" rx="8" fill="#eef4fb" stroke="#2f6fd0"/>
  <text x="500" y="286" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#222222" text-anchor="middle">③ 交接所有权，还是多点读写？</text>
  <rect x="40" y="254" width="270" height="52" rx="8" fill="#eef7f2" stroke="#2e8b57"/>
  <text x="175" y="276" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#222222" text-anchor="middle">消息传递</text>
  <text x="175" y="296" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#555555" text-anchor="middle">channel / Actor 信箱</text>
  <line x1="335" y1="280" x2="315" y2="280" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <line x1="500" y1="306" x2="500" y2="332" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <rect x="360" y="336" width="280" height="52" rx="8" fill="#eef4fb" stroke="#2f6fd0"/>
  <text x="500" y="368" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#222222" text-anchor="middle">④ 临界区短且竞争低吗？</text>
  <rect x="700" y="336" width="260" height="52" rx="8" fill="#eef4fb" stroke="#2f6fd0"/>
  <text x="830" y="358" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#222222" text-anchor="middle">原子 / 细粒度锁</text>
  <text x="830" y="378" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#555555" text-anchor="middle">单值、短临界区</text>
  <line x1="645" y1="362" x2="695" y2="362" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <line x1="500" y1="388" x2="500" y2="414" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <rect x="340" y="418" width="320" height="52" rx="8" fill="#fff8e8" stroke="#d9822b"/>
  <text x="500" y="450" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#222222" text-anchor="middle">单所有者 + 消息，或分片</text>

  <rect x="40" y="502" width="920" height="62" rx="10" fill="#f5f7fa" stroke="#d7e0ea"/>
  <text x="500" y="528" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#222222" text-anchor="middle">顺序不能反：跳过前两步直接比「锁和 channel 哪个快」，是最常见的误选。</text>
  <text x="500" y="550" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#555555" text-anchor="middle">前三步排除掉的选项，不需要进入代价讨论。</text>

  <rect x="40" y="576" width="920" height="60" rx="10" fill="#eef7f2" stroke="#a9cfb8"/>
  <text x="500" y="612" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1f4d33" text-anchor="middle">二次判据：更能接受静默的错值，还是可观测的延迟与重复；团队更擅长对账还是不变量断言。</text>
</svg>
