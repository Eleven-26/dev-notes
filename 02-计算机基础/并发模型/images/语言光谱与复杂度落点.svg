<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <defs>
    <marker id="axisArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#999999"/>
    </marker>
  </defs>
  <text x="500" y="38" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="bold" fill="#222222" text-anchor="middle">语言光谱与复杂度落点</text>
  <text x="500" y="64" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#666666" text-anchor="middle">从左到右：共享内存的显式同步 → 编译期所有权 / 消息传递 → 进程隔离</text>

  <text x="70" y="92" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#666666">共同持有（共享内存）</text>
  <text x="930" y="92" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#666666" text-anchor="end">单点持有（隔离 / 消息）</text>
  <line x1="70" y1="110" x2="930" y2="110" stroke="#999999" stroke-width="1.5" marker-end="url(#axisArrow)"/>

  <circle cx="100" cy="110" r="5" fill="#2f6fd0"/>
  <circle cx="200" cy="110" r="5" fill="#2f6fd0"/>
  <circle cx="300" cy="110" r="5" fill="#7a5cc4"/>
  <circle cx="410" cy="110" r="5" fill="#2e8b57"/>
  <circle cx="560" cy="110" r="5" fill="#d9822b"/>
  <circle cx="740" cy="110" r="5" fill="#2e8b57"/>
  <circle cx="870" cy="110" r="5" fill="#d9822b"/>
  <text x="100" y="134" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#333333" text-anchor="middle">C / C++</text>
  <text x="200" y="134" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#333333" text-anchor="middle">Java</text>
  <text x="300" y="134" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#333333" text-anchor="middle">Rust</text>
  <text x="410" y="134" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#333333" text-anchor="middle">Go</text>
  <text x="560" y="134" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#333333" text-anchor="middle">Node.js</text>
  <text x="740" y="134" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#333333" text-anchor="middle">Erlang</text>
  <text x="870" y="134" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#333333" text-anchor="middle">PHP-FPM</text>

  <rect x="40" y="158" width="920" height="32" fill="#e9eef5" stroke="#d7e0ea"/>
  <text x="50" y="179" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#222222">语言</text>
  <text x="190" y="179" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#222222">默认路线</text>
  <text x="350" y="179" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#222222">同步靠什么</text>
  <text x="690" y="179" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#222222">复杂度落在哪</text>

  <rect x="40" y="192" width="920" height="56" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="50" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">C / C++</text>
  <text x="190" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">共享内存</text>
  <text x="350" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">互斥量 / 原子 / 内存序；C++ 有 move</text>
  <text x="690" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">程序员：每条访问路径、每个屏障</text>

  <rect x="40" y="248" width="920" height="56" fill="#f8fafc" stroke="#e3e8ef"/>
  <text x="50" y="282" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">Java</text>
  <text x="190" y="282" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">共享内存</text>
  <text x="350" y="282" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">synchronized / volatile / 原子 / j.u.c</text>
  <text x="690" y="282" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">程序员 + JMM；运行期检查弱</text>

  <rect x="40" y="304" width="920" height="56" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="50" y="338" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">Go</text>
  <text x="190" y="338" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">CSP 优先</text>
  <text x="350" y="338" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">channel 为主；sync / atomic 齐全</text>
  <text x="690" y="338" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">程序员：选路线 + 处理阻塞与背压</text>

  <rect x="40" y="360" width="920" height="56" fill="#f8fafc" stroke="#e3e8ef"/>
  <text x="50" y="394" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">Rust</text>
  <text x="190" y="394" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">所有权</text>
  <text x="350" y="394" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">Send / Sync + Mutex / Arc / channel</text>
  <text x="690" y="394" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">编译器：共享可变必须显式包装</text>

  <rect x="40" y="416" width="920" height="56" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="50" y="450" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">Node.js</text>
  <text x="190" y="450" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">单线程事件循环</text>
  <text x="350" y="450" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">进程内无并行，天然无数据竞争</text>
  <text x="690" y="450" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">运行时：CPU 密集要拆线程或进程</text>

  <rect x="40" y="472" width="920" height="56" fill="#f8fafc" stroke="#e3e8ef"/>
  <text x="50" y="506" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">Erlang</text>
  <text x="190" y="506" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">进程隔离 + 消息</text>
  <text x="350" y="506" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">独立堆，只能发消息</text>
  <text x="690" y="506" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">邮箱 / 监督树 / 消息协议</text>

  <rect x="40" y="528" width="920" height="56" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="50" y="562" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">PHP-FPM</text>
  <text x="190" y="562" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">进程隔离</text>
  <text x="350" y="562" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">请求间不共享内存</text>
  <text x="690" y="562" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#222222">外部存储：事务 / 文件锁 / 队列</text>

  <rect x="40" y="604" width="920" height="72" rx="10" fill="#f5f7fa" stroke="#d7e0ea"/>
  <text x="500" y="632" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#222222" text-anchor="middle">换语言只换默认值与检查时机，不消灭所有权问题。</text>
  <text x="500" y="656" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#555555" text-anchor="middle">越往右，共享被消除得越多，但并行形态或必须遵守的边界也越多。</text>
</svg>
