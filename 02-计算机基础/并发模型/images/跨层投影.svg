<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="38" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="bold" fill="#222222" text-anchor="middle">跨层投影：同一道题换了实现</text>
  <text x="500" y="64" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#666666" text-anchor="middle">状态归谁、如何交接 —— 从进程内一直问到跨机房</text>

  <text x="330" y="105" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">共享状态：协议约束</text>
  <text x="760" y="105" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#2e8b57" text-anchor="middle">消息传递：交接约束</text>
  <line x1="520" y1="122" x2="520" y2="520" stroke="#c8d2de" stroke-dasharray="6 5"/>

  <text x="30" y="180" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#333333">进程内</text>
  <rect x="160" y="140" width="360" height="72" rx="8" fill="#fdf4f3" stroke="#d9a7a2"/>
  <text x="180" y="170" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#222222">互斥锁 / 原子 / 内存序</text>
  <text x="180" y="194" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#666666">失败：丢更新、中间态</text>
  <rect x="540" y="140" width="420" height="72" rx="8" fill="#eef7f2" stroke="#a9cfb8"/>
  <text x="560" y="170" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#222222">channel / Actor 信箱</text>
  <text x="560" y="194" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#666666">失败：死锁</text>

  <text x="30" y="280" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#333333">单机跨进程</text>
  <rect x="160" y="240" width="360" height="72" rx="8" fill="#fdf4f3" stroke="#d9a7a2"/>
  <text x="180" y="270" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#222222">文件锁 / 共享内存 / 本机 socket</text>
  <text x="180" y="294" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#666666">失败：文件竞争、丢失更新</text>
  <rect x="540" y="240" width="420" height="72" rx="8" fill="#eef7f2" stroke="#a9cfb8"/>
  <text x="560" y="270" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#222222">本机队列 / Unix socket</text>
  <text x="560" y="294" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#666666">失败：积压</text>

  <text x="30" y="380" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#333333">跨服务</text>
  <rect x="160" y="340" width="360" height="72" rx="8" fill="#fdf4f3" stroke="#d9a7a2"/>
  <text x="180" y="370" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#222222">共享数据库 / 分布式锁 / 共享缓存</text>
  <text x="180" y="394" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#666666">失败：脏数据、死锁、锁等待</text>
  <rect x="540" y="340" width="420" height="72" rx="8" fill="#eef7f2" stroke="#a9cfb8"/>
  <text x="560" y="370" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#222222">消息队列 / 事件总线 / RPC</text>
  <text x="560" y="394" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#666666">失败：重复、乱序、最终一致</text>

  <text x="30" y="480" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#333333">跨机房</text>
  <rect x="160" y="440" width="360" height="72" rx="8" fill="#fdf4f3" stroke="#d9a7a2"/>
  <text x="180" y="470" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#222222">多副本 + 共识协议</text>
  <text x="180" y="494" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#666666">失败：分区下的取舍</text>
  <rect x="540" y="440" width="420" height="72" rx="8" fill="#eef7f2" stroke="#a9cfb8"/>
  <text x="560" y="470" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#222222">跨城复制 / 消息同步</text>
  <text x="560" y="494" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#666666">失败：复制延迟</text>

  <rect x="40" y="545" width="920" height="70" rx="10" fill="#f5f7fa" stroke="#d7e0ea"/>
  <text x="500" y="573" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#222222" text-anchor="middle">越往下，共享越依赖协议与共识，消息越依赖幂等与顺序。</text>
  <text x="500" y="597" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#555555" text-anchor="middle">跨机之后没有真正的共享内存，所谓共享都是消息。</text>
</svg>
