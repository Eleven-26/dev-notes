<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>

  <rect x="40" y="16" width="900" height="26" fill="#ffffff"/>
  <text x="40" y="35" font-size="17" font-weight="700" fill="#0f172a">启动与峰值是两条反向的曲线</text>
  <rect x="40" y="42" width="920" height="22" fill="#ffffff"/>
  <text x="40" y="58" font-size="12.5" fill="#64748b">左：从 execve 到输出第一行的耗时。右：同一份 fib(32) 的计算耗时。两张图各自独立刻度</text>

  <rect x="40" y="76" width="420" height="24" fill="#ffffff"/>
  <text x="40" y="93" font-size="12" font-weight="700" fill="#0f172a">启动（毫秒，越小越好）</text>

  <rect x="40" y="108" width="90" height="20" fill="#ffffff"/>
  <text x="40" y="122" font-size="11" fill="#334155">C 动态</text>
  <rect x="130" y="108" width="10" height="20" fill="#94a3b8"/>
  <rect x="146" y="108" width="60" height="20" fill="#ffffff"/>
  <text x="146" y="122" font-size="11" fill="#475569">2.5 ~ 2.9</text>

  <rect x="40" y="136" width="90" height="20" fill="#ffffff"/>
  <text x="40" y="150" font-size="11" fill="#334155">Go 静态</text>
  <rect x="130" y="136" width="18" height="20" fill="#3b82f6"/>
  <rect x="154" y="136" width="60" height="20" fill="#ffffff"/>
  <text x="154" y="150" font-size="11" font-weight="700" fill="#1e40af">4.5 ~ 7.0</text>

  <rect x="40" y="164" width="90" height="20" fill="#ffffff"/>
  <text x="40" y="178" font-size="11" fill="#334155">PHP CLI</text>
  <rect x="130" y="164" width="133" height="20" fill="#f59e0b"/>
  <rect x="269" y="164" width="70" height="20" fill="#ffffff"/>
  <text x="269" y="178" font-size="11" font-weight="700" fill="#92400e">33.4</text>

  <rect x="40" y="192" width="90" height="20" fill="#ffffff"/>
  <text x="40" y="206" font-size="11" fill="#334155">Java 默认</text>
  <rect x="130" y="192" width="340" height="20" fill="#6366f1"/>
  <rect x="130" y="212" width="340" height="14" fill="#ffffff"/>
  <text x="130" y="224" font-size="10.5" font-weight="700" fill="#3730a3">85.6 ~ 105.4（比 Go 慢 19 倍）</text>

  <rect x="40" y="236" width="420" height="20" fill="#ffffff"/>
  <text x="40" y="250" font-size="10.5" fill="#64748b">Java -Xint 更慢：331 ~ 388 ms，超出本图 3.7 倍，未画</text>

  <line x1="510" y1="76" x2="510" y2="370" stroke="#e2e8f0"/>

  <rect x="530" y="76" width="420" height="24" fill="#ffffff"/>
  <text x="530" y="93" font-size="12" font-weight="700" fill="#0f172a">峰值：fib(32)（毫秒，越小越好）</text>

  <rect x="530" y="108" width="110" height="34" fill="#ffffff"/>
  <text x="530" y="124" font-size="11" fill="#334155">Java 只 C1</text>
  <rect x="644" y="108" width="16" height="20" fill="#6366f1"/>
  <rect x="670" y="108" width="70" height="20" fill="#ffffff"/>
  <text x="670" y="122" font-size="11" font-weight="700" fill="#3730a3">10.7</text>

  <rect x="530" y="140" width="110" height="20" fill="#ffffff"/>
  <text x="530" y="154" font-size="11" fill="#334155">Java 默认</text>
  <rect x="644" y="140" width="17" height="20" fill="#6366f1"/>
  <rect x="670" y="140" width="70" height="20" fill="#ffffff"/>
  <text x="670" y="154" font-size="11" font-weight="700" fill="#3730a3">11.0</text>

  <rect x="530" y="168" width="110" height="20" fill="#ffffff"/>
  <text x="530" y="182" font-size="11" fill="#334155">Go（AOT）</text>
  <rect x="644" y="168" width="24" height="20" fill="#3b82f6"/>
  <rect x="679" y="168" width="70" height="20" fill="#ffffff"/>
  <text x="679" y="182" font-size="11" font-weight="700" fill="#1e40af">15.9</text>

  <rect x="530" y="196" width="110" height="20" fill="#ffffff"/>
  <text x="530" y="210" font-size="11" fill="#334155">PHP + JIT</text>
  <rect x="644" y="196" width="114" height="20" fill="#f59e0b"/>
  <rect x="764" y="196" width="70" height="20" fill="#ffffff"/>
  <text x="764" y="210" font-size="11" font-weight="700" fill="#92400e">76.1</text>

  <rect x="530" y="224" width="110" height="20" fill="#ffffff"/>
  <text x="530" y="238" font-size="11" fill="#334155">PHP 无 JIT</text>
  <rect x="644" y="224" width="317" height="20" fill="#f59e0b"/>
  <rect x="644" y="244" width="317" height="14" fill="#ffffff"/>
  <text x="644" y="256" font-size="10.5" font-weight="700" fill="#92400e">211.3 ~ 240.3</text>

  <rect x="530" y="268" width="420" height="20" fill="#ffffff"/>
  <text x="530" y="282" font-size="10.5" fill="#64748b">Java -Xint 更慢：590.6 ~ 654.4 ms，超出本图 2.8 倍，未画</text>

  <rect x="40" y="300" width="920" height="52" rx="6" fill="#f1f5f9"/>
  <text x="56" y="321" font-size="12" font-weight="700" fill="#0f172a">两条曲线是反的：启动最快的那一档（Go）在峰值上输给 Java 的 JIT；而峰值最慢的那一档（-Xint）启动也最慢</text>
  <text x="56" y="341" font-size="11.5" fill="#334155">所以任何「谁更快」的结论都必须先指定：比的是冷启动，还是稳态吞吐</text>

  <rect x="40" y="364" width="920" height="22" fill="#fffbeb"/>
  <text x="40" y="379" font-size="11.5" fill="#78350f">Java 的 JIT 版本比 Go 的 AOT 版本快 1.5 倍，这是 fib 这个基准的形状造成的（纯递归、单分支、无分配），不能推广成「Java 比 Go 快」</text>
  <rect x="40" y="392" width="920" height="22" fill="#ffffff"/>
  <text x="40" y="407" font-size="11.5" fill="#334155">PHP 无 JIT 与 Java -Xint 都是「解释执行」，但慢了 21 倍 vs 55 倍：解释器的开销取决于指令集与解释器的匹配度</text>
  <rect x="40" y="414" width="920" height="20" fill="#ffffff"/>
  <text x="40" y="428" font-size="11.5" fill="#334155">读数取自三个容器同一宿主，二进制与 class 均放在容器内路径（放宿主挂载时 Go 启动会被拖到 25 ms）</text>
</svg>
