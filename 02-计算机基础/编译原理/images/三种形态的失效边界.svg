<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410">
  <rect x="0" y="0" width="1000" height="410" fill="#ffffff"/>
  <rect x="40" y="16" width="920" height="60" rx="8" fill="#ffffff"/>
  <text x="60" y="44" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#0f172a">三种形态各在什么时候失效</text>
  <text x="60" y="66" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">「不适用」表示这种形态根本不面对这个问题，不是「也能用」</text>

  <rect x="40" y="88" width="920" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="52" y="100" width="170" height="40" rx="6" fill="#e2e8f0"/>
  <text x="70" y="126" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#0f172a">形态</text>
  <rect x="232" y="100" width="236" height="40" rx="6" fill="#e2e8f0"/>
  <text x="250" y="126" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#0f172a">换 CPU 架构</text>
  <rect x="478" y="100" width="236" height="40" rx="6" fill="#e2e8f0"/>
  <text x="496" y="126" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#0f172a">换运行时版本</text>
  <rect x="724" y="100" width="224" height="40" rx="6" fill="#e2e8f0"/>
  <text x="742" y="126" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#0f172a">换语言版本</text>

  <rect x="52" y="150" width="170" height="72" rx="6" fill="#fef2f2"/>
  <text x="70" y="180" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#dc2626">机器码</text>
  <text x="70" y="202" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">21 条 / 49 字节</text>
  <rect x="232" y="150" width="236" height="72" rx="6" fill="#ffffff" stroke="#fecaca"/>
  <rect x="250" y="160" width="76" height="24" rx="12" fill="#dc2626"/>
  <text x="262" y="177" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#ffffff">失效</text>
  <text x="336" y="177" font-family="Consolas, monospace" font-size="11" fill="#475569">exec format error</text>
  <text x="250" y="206" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">必须按目标架构重编</text>
  <rect x="478" y="150" width="236" height="72" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="496" y="188" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#94a3b8">不适用（没有运行时）</text>
  <rect x="724" y="150" width="224" height="72" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="742" y="188" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#94a3b8">不适用</text>

  <rect x="52" y="232" width="170" height="72" rx="6" fill="#eff6ff"/>
  <text x="70" y="262" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#2563eb">字节码</text>
  <text x="70" y="284" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">16 条 / 23 字节</text>
  <rect x="232" y="232" width="236" height="72" rx="6" fill="#ffffff" stroke="#99f6e4"/>
  <rect x="250" y="242" width="76" height="24" rx="12" fill="#0d9488"/>
  <text x="262" y="259" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#ffffff">可移植</text>
  <text x="336" y="259" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#475569">同一份 .class</text>
  <text x="250" y="288" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">x86 与 arm64 都认</text>
  <rect x="478" y="232" width="236" height="72" rx="6" fill="#ffffff" stroke="#fecaca"/>
  <rect x="496" y="242" width="76" height="24" rx="12" fill="#dc2626"/>
  <text x="508" y="259" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#ffffff">失效</text>
  <text x="582" y="259" font-family="Consolas, monospace" font-size="11" fill="#475569">61.0 &gt; 52.0</text>
  <text x="496" y="288" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">加载阶段就拒载，还没到执行</text>
  <rect x="724" y="232" width="224" height="72" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="742" y="270" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#94a3b8">不适用</text>

  <rect x="52" y="314" width="170" height="62" rx="6" fill="#f0fdfa"/>
  <text x="70" y="342" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#0d9488">opcode</text>
  <text x="70" y="363" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748b">19 条 / 结构体数组</text>
  <rect x="232" y="314" width="236" height="62" rx="6" fill="#ffffff" stroke="#99f6e4"/>
  <rect x="250" y="324" width="76" height="24" rx="12" fill="#0d9488"/>
  <text x="262" y="341" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#ffffff">可移植</text>
  <text x="336" y="341" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#475569">与架构无关</text>
  <rect x="478" y="314" width="236" height="62" rx="6" fill="#ffffff" stroke="#fecaca"/>
  <rect x="496" y="324" width="76" height="24" rx="12" fill="#dc2626"/>
  <text x="508" y="341" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#ffffff">失效</text>
  <text x="582" y="341" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#475569">opcache 布局变</text>
  <rect x="724" y="314" width="224" height="62" rx="6" fill="#ffffff" stroke="#fecaca"/>
  <rect x="742" y="324" width="76" height="24" rx="12" fill="#dc2626"/>
  <text x="754" y="341" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#ffffff">失效</text>
  <text x="828" y="341" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#475569">且是静默的</text>
</svg>
