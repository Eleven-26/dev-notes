<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>

  <rect x="40" y="20" width="920" height="64" fill="#ffffff"/>
  <text x="60" y="46" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#0f172a">同一段 fib，三种形态：条数几乎一样，字节数差一倍多</text>
  <text x="60" y="72" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748b">每个小方块代表一条指令（或一条 opcode）；右侧标的是这种形态的编码体积</text>

  <rect x="60" y="92" width="880" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="80" y="126" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f172a">机器码</text>
  <text x="80" y="150" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">gcc -O2</text>
  <text x="80" y="166" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">-fno-inline</text>
  <rect x="180" y="112" width="14" height="14" fill="#dc2626"/><rect x="198" y="112" width="14" height="14" fill="#dc2626"/><rect x="216" y="112" width="14" height="14" fill="#dc2626"/><rect x="234" y="112" width="14" height="14" fill="#dc2626"/><rect x="252" y="112" width="14" height="14" fill="#dc2626"/><rect x="270" y="112" width="14" height="14" fill="#dc2626"/><rect x="288" y="112" width="14" height="14" fill="#dc2626"/><rect x="306" y="112" width="14" height="14" fill="#dc2626"/><rect x="324" y="112" width="14" height="14" fill="#dc2626"/><rect x="342" y="112" width="14" height="14" fill="#dc2626"/><rect x="360" y="112" width="14" height="14" fill="#dc2626"/>
  <rect x="180" y="132" width="14" height="14" fill="#dc2626"/><rect x="198" y="132" width="14" height="14" fill="#dc2626"/><rect x="216" y="132" width="14" height="14" fill="#dc2626"/><rect x="234" y="132" width="14" height="14" fill="#dc2626"/><rect x="252" y="132" width="14" height="14" fill="#dc2626"/><rect x="270" y="132" width="14" height="14" fill="#dc2626"/><rect x="288" y="132" width="14" height="14" fill="#dc2626"/><rect x="306" y="132" width="14" height="14" fill="#dc2626"/><rect x="324" y="132" width="14" height="14" fill="#dc2626"/><rect x="342" y="132" width="14" height="14" fill="#dc2626"/>
  <text x="580" y="126" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#dc2626">21 条 / 49 字节</text>
  <text x="580" y="150" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#475569">平均 2.33 字节/条</text>
  <text x="772" y="150" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#0f172a">消费者：CPU 译码器</text>

  <rect x="60" y="194" width="880" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="80" y="228" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f172a">字节码</text>
  <text x="80" y="252" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">javac 17</text>
  <text x="80" y="268" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">class 61.0</text>
  <rect x="180" y="214" width="14" height="14" fill="#2563eb"/><rect x="198" y="214" width="14" height="14" fill="#2563eb"/><rect x="216" y="214" width="14" height="14" fill="#2563eb"/><rect x="234" y="214" width="14" height="14" fill="#2563eb"/><rect x="252" y="214" width="14" height="14" fill="#2563eb"/><rect x="270" y="214" width="14" height="14" fill="#2563eb"/><rect x="288" y="214" width="14" height="14" fill="#2563eb"/><rect x="306" y="214" width="14" height="14" fill="#2563eb"/>
  <rect x="180" y="234" width="14" height="14" fill="#2563eb"/><rect x="198" y="234" width="14" height="14" fill="#2563eb"/><rect x="216" y="234" width="14" height="14" fill="#2563eb"/><rect x="234" y="234" width="14" height="14" fill="#2563eb"/><rect x="252" y="234" width="14" height="14" fill="#2563eb"/><rect x="270" y="234" width="14" height="14" fill="#2563eb"/><rect x="288" y="234" width="14" height="14" fill="#2563eb"/><rect x="306" y="234" width="14" height="14" fill="#2563eb"/>
  <text x="580" y="228" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#2563eb">16 条 / 23 字节</text>
  <text x="580" y="252" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#475569">平均 1.44 字节/条</text>
  <text x="772" y="252" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#0f172a">消费者：JVM 解释器</text>

  <rect x="60" y="296" width="880" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="80" y="330" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f172a">opcode</text>
  <text x="80" y="354" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">PHP 8.0</text>
  <text x="80" y="370" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">opcache</text>
  <rect x="180" y="316" width="14" height="14" fill="#0d9488"/><rect x="198" y="316" width="14" height="14" fill="#0d9488"/><rect x="216" y="316" width="14" height="14" fill="#0d9488"/><rect x="234" y="316" width="14" height="14" fill="#0d9488"/><rect x="252" y="316" width="14" height="14" fill="#0d9488"/><rect x="270" y="316" width="14" height="14" fill="#0d9488"/><rect x="288" y="316" width="14" height="14" fill="#0d9488"/><rect x="306" y="316" width="14" height="14" fill="#0d9488"/><rect x="324" y="316" width="14" height="14" fill="#0d9488"/><rect x="342" y="316" width="14" height="14" fill="#0d9488"/>
  <rect x="180" y="336" width="14" height="14" fill="#0d9488"/><rect x="198" y="336" width="14" height="14" fill="#0d9488"/><rect x="216" y="336" width="14" height="14" fill="#0d9488"/><rect x="234" y="336" width="14" height="14" fill="#0d9488"/><rect x="252" y="336" width="14" height="14" fill="#0d9488"/><rect x="270" y="336" width="14" height="14" fill="#0d9488"/><rect x="288" y="336" width="14" height="14" fill="#0d9488"/><rect x="306" y="336" width="14" height="14" fill="#0d9488"/><rect x="324" y="336" width="14" height="14" fill="#0d9488"/>
  <text x="580" y="330" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#0d9488">19 条 / 结构体数组</text>
  <text x="580" y="354" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#475569">每条等长，不是字节流</text>
  <text x="772" y="354" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#0f172a">消费者：VM 的 switch</text>

  <rect x="60" y="400" width="880" height="28" rx="6" fill="#fef3c7"/>
  <text x="76" y="419" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#92400e">条数 21 / 16 / 19 几乎一致 —— 步数是语言无关的；字节数 49 / 23 差一倍多 —— 差的是编码格式</text>
</svg>
