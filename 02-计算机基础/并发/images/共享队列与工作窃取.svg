  <rect x="846" y="146" width="60" height="92" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
  <text x="876" y="140" font-size="9.5" fill="#64748b" text-anchor="middle">本地</text>
  <rect x="852" y="154" width="48" height="20" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <rect x="852" y="180" width="48" height="20" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <rect x="852" y="206" width="48" height="20" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <line x1="876" y1="256" x2="876" y2="244" stroke="#15803d" stroke-width="1.4" marker-end="url(#arwg)"/>
  <line x1="782" y1="236" x2="726" y2="236" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arwo)"/>
  <text x="754" y="252" font-size="10.5" fill="#ea580c" text-anchor="middle" font-weight="bold">偷</text>
  <text x="746" y="330" font-size="11.5" fill="#15803d" text-anchor="middle" font-weight="bold">本地无竞争，空了才去偷</text>
  <text x="746" y="350" font-size="10.5" fill="#64748b" text-anchor="middle">偷的时机正好是「本地没活干」</text>
  <rect x="24" y="394" width="952" height="42" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="40" y="420" font-size="12" fill="#b45309" text-anchor="start" font-weight="bold">工作窃取要求任务能切分：没有切分，偷来的和共享队列里的没区别，只是白白多了一套本地队列。</text>
