  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">两种拓扑：所有人抢一个入口，还是每人一个入口</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">工作窃取把「竞争」变成例外——绝大多数取任务都是本地无竞争的</text>
