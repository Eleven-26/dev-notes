<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555555"/>
    </marker>
  </defs>
  <text x="500" y="38" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="bold" fill="#222222" text-anchor="middle">两条路线的所有权对照</text>
  <text x="500" y="64" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#666666" text-anchor="middle">共享内存让多个执行体共同读写；消息传递让状态只归一个所有者</text>

  <rect x="30" y="88" width="450" height="370" rx="10" fill="#f7f9fc" stroke="#d7e0ea"/>
  <text x="255" y="120" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#2f6fd0" text-anchor="middle">共享内存：共同持有，协议约束</text>

  <rect x="65" y="155" width="90" height="38" rx="6" fill="#e8f0fb" stroke="#2f6fd0"/>
  <text x="110" y="179" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#222222" text-anchor="middle">线程 A</text>
  <rect x="205" y="155" width="90" height="38" rx="6" fill="#e8f0fb" stroke="#2f6fd0"/>
  <text x="250" y="179" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#222222" text-anchor="middle">线程 B</text>
  <rect x="345" y="155" width="90" height="38" rx="6" fill="#e8f0fb" stroke="#2f6fd0"/>
  <text x="390" y="179" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#222222" text-anchor="middle">线程 C</text>

  <line x1="110" y1="193" x2="145" y2="248" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <line x1="250" y1="193" x2="250" y2="248" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <line x1="390" y1="193" x2="355" y2="248" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <rect x="110" y="250" width="290" height="110" rx="8" fill="#fff8e8" stroke="#d9822b" stroke-dasharray="6 4"/>
  <text x="255" y="272" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#a35d16" text-anchor="middle">锁 / 原子 / 内存序</text>
  <rect x="155" y="292" width="200" height="50" rx="6" fill="#ffffff" stroke="#333333"/>
  <text x="255" y="323" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#222222" text-anchor="middle">状态 S（可变字段）</text>

  <text x="255" y="395" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#333333" text-anchor="middle">任一时刻只允许一个进入；</text>
  <text x="255" y="418" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#333333" text-anchor="middle">每条访问路径都要守同一份合同。</text>

  <rect x="520" y="88" width="450" height="370" rx="10" fill="#f7f9fc" stroke="#d7e0ea"/>
  <text x="745" y="120" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#2e8b57" text-anchor="middle">消息传递：单点持有，交接所有权</text>

  <rect x="545" y="155" width="100" height="38" rx="6" fill="#eef7f2" stroke="#2e8b57"/>
  <text x="595" y="179" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#222222" text-anchor="middle">线程 A</text>
  <rect x="675" y="150" width="120" height="50" rx="6" fill="#fff8e8" stroke="#d9822b"/>
  <text x="735" y="171" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#222222" text-anchor="middle">通道 / 信箱</text>
  <text x="735" y="190" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#a35d16" text-anchor="middle">（内部有锁）</text>
  <rect x="825" y="155" width="110" height="38" rx="6" fill="#eef7f2" stroke="#2e8b57"/>
  <text x="880" y="179" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#222222" text-anchor="middle">线程 B</text>

  <line x1="645" y1="174" x2="670" y2="174" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="657" y="145" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#666666" text-anchor="middle">发送</text>
  <line x1="795" y1="174" x2="820" y2="174" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="807" y="145" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#666666" text-anchor="middle">接收</text>
  <line x1="880" y1="193" x2="880" y2="288" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <rect x="810" y="292" width="140" height="50" rx="6" fill="#ffffff" stroke="#333333"/>
  <text x="880" y="323" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#222222" text-anchor="middle">状态 S</text>
  <text x="888" y="245" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#666666">直接读写</text>

  <text x="745" y="395" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#333333" text-anchor="middle">同一时刻只有一个所有者；</text>
  <text x="745" y="418" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#333333" text-anchor="middle">别人只能发消息，不能直接读写。</text>

  <rect x="30" y="478" width="940" height="62" rx="10" fill="#eef4ec" stroke="#2e8b57"/>
  <text x="500" y="508" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#1f4d33" text-anchor="middle">两条路线都不消灭共享：共享内存共享数据，消息传递共享通道；同步成本只是换了位置。</text>
  <text x="500" y="528" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#3d6b4f" text-anchor="middle">判据：看消息被接收之后，发送方还能不能改到它。</text>
</svg>
