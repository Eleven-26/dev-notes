<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">一条等待队列混排两个角色，就会互相吃信号</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">把两个角色分到两条队列上，不是优化——单队列版本的正确性本来就不成立</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker><marker id="arwg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#15803d"/></marker></defs>
  <rect x="24" y="74" width="452" height="330" rx="10" fill="#fdf4f3" stroke="#d9a7a2" stroke-width="1.2"/>
  <text x="250" y="102" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">一条队列：两个角色混排</text>
  <text x="250" y="124" font-size="11" fill="#64748b" text-anchor="middle">生产者等「不满」，消费者等「不空」</text>
  <rect x="52" y="142" width="396" height="30" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="250" y="162" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">条件队列（只有一条）</text>
  <rect x="52" y="186" width="92" height="34" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="98" y="208" font-size="10.5" fill="#dc2626" text-anchor="middle">P1 等不满</text>
  <rect x="152" y="186" width="92" height="34" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
  <text x="198" y="208" font-size="10.5" fill="#15803d" text-anchor="middle">C1 等不空</text>
  <rect x="252" y="186" width="92" height="34" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="298" y="208" font-size="10.5" fill="#dc2626" text-anchor="middle">P2 等不满</text>
  <rect x="352" y="186" width="92" height="34" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
  <text x="398" y="208" font-size="10.5" fill="#15803d" text-anchor="middle">C2 等不空</text>
  <line x1="300" y1="244" x2="110" y2="244" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arwr)"/>
  <text x="300" y="238" font-size="10.5" fill="#ea580c" text-anchor="middle" font-weight="bold">发出信号</text>
  <text x="250" y="268" font-size="11.5" fill="#0f172a" text-anchor="middle">被 P1 收走 → P1 发现「还是满的」→ 睡回去</text>
  <text x="250" y="290" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="bold">而 C1、C2 还在等一个已经被吃掉的信号</text>
  <rect x="52" y="306" width="396" height="76" rx="6" fill="#ffffff" stroke="#d9a7a2" stroke-width="1.2"/>
  <text x="66" y="328" font-size="11" fill="#0f172a" text-anchor="start">现场：进程活着、CPU 不涨、日志不动</text>
  <text x="66" y="350" font-size="11" fill="#0f172a" text-anchor="start">转储里没有 deadlock 段 —— 锁是空闲的</text>
  <text x="66" y="372" font-size="11" fill="#dc2626" text-anchor="start">没有持有环，只有两个人互相等信号</text>
  <rect x="524" y="74" width="452" height="330" rx="10" fill="#eef7f2" stroke="#a9cfb8" stroke-width="1.2"/>
  <text x="750" y="102" font-size="14" fill="#15803d" text-anchor="middle" font-weight="bold">两条队列：角色分开</text>
  <text x="750" y="124" font-size="11" fill="#64748b" text-anchor="middle">信号只发给对面那一条</text>
  <rect x="552" y="142" width="190" height="30" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="647" y="162" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">等「不满」的队列</text>
  <rect x="758" y="142" width="190" height="30" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
  <text x="853" y="162" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">等「不空」的队列</text>
  <rect x="552" y="186" width="92" height="34" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="598" y="208" font-size="10.5" fill="#dc2626" text-anchor="middle">P1</text>
  <rect x="758" y="186" width="92" height="34" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
  <text x="804" y="208" font-size="10.5" fill="#15803d" text-anchor="middle">C1</text>
  <rect x="652" y="186" width="92" height="34" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="698" y="208" font-size="10.5" fill="#dc2626" text-anchor="middle">P2</text>
  <rect x="858" y="186" width="92" height="34" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
  <text x="904" y="208" font-size="10.5" fill="#15803d" text-anchor="middle">C2</text>
  <line x1="720" y1="244" x2="800" y2="244" stroke="#15803d" stroke-width="1.6" marker-end="url(#arwg)"/>
  <text x="760" y="238" font-size="10.5" fill="#15803d" text-anchor="middle" font-weight="bold">只叫对面</text>
  <text x="750" y="268" font-size="11.5" fill="#0f172a" text-anchor="middle">每一个被唤醒的，条件都恰好成立</text>
  <text x="750" y="290" font-size="11.5" fill="#15803d" text-anchor="middle" font-weight="bold">需要「回去重等」的次数是零</text>
  <rect x="552" y="306" width="396" height="76" rx="6" fill="#ffffff" stroke="#a9cfb8" stroke-width="1.2"/>
  <text x="566" y="328" font-size="11" fill="#0f172a" text-anchor="start">零空转不是调优调出来的</text>
  <text x="566" y="350" font-size="11" fill="#0f172a" text-anchor="start">是队列分对了的必然结果</text>
  <text x="566" y="372" font-size="11" fill="#15803d" text-anchor="start">分成两条队列是正确性，不是性能优化</text>
  <rect x="24" y="420" width="952" height="40" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="40" y="445" font-size="12" fill="#b45309" text-anchor="start" font-weight="bold">判据：只要两个角色等待的条件不同，就必须分成两条队列。同一队列只适合「所有人等的都是同一个条件」——那种场合很少。</text>
</svg>
