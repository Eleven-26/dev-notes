<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">栈的三种给法：省内存与省搬迁是两笔不同的账</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">前两种都保留「一整块连续栈」这个假设，第三种放弃了它</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#15803d"/></marker><marker id="arwo" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/></marker><marker id="arwb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <rect x="24" y="74" width="300" height="340" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="174" y="104" font-size="14.5" fill="#dc2626" text-anchor="middle" font-weight="bold">① 固定大栈</text>
  <text x="174" y="126" font-size="10.5" fill="#64748b" text-anchor="middle">建的时候就占满</text>
  <rect x="84" y="146" width="180" height="150" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="174" y="226" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">百 KB 级</text>
  <text x="174" y="250" font-size="10.5" fill="#64748b" text-anchor="middle">一次给足</text>
  <text x="174" y="318" font-size="11.5" fill="#0f172a" text-anchor="middle">不搬迁，最简单</text>
  <text x="174" y="342" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="bold">代价：每条都浪费</text>
  <text x="174" y="372" font-size="10.5" fill="#64748b" text-anchor="middle">归属：内核线程 / 传统线程</text>
  <rect x="350" y="74" width="300" height="340" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="500" y="104" font-size="14.5" fill="#ea580c" text-anchor="middle" font-weight="bold">② 可增长栈</text>
  <text x="500" y="126" font-size="10.5" fill="#64748b" text-anchor="middle">初始很小，按需扩</text>
  <rect x="404" y="146" width="192" height="156" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="434" y="158" width="132" height="46" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
  <text x="500" y="186" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="bold">初始 KB 级</text>
  <line x1="500" y1="208" x2="500" y2="258" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arwo)"/>
  <text x="500" y="288" font-size="10.5" fill="#ea580c" text-anchor="middle" font-weight="bold">可扩到这里（上限）</text>
  <text x="500" y="318" font-size="11" fill="#0f172a" text-anchor="middle">省内存，但增长时要搬迁</text>
  <text x="500" y="342" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="bold">代价：栈上地址全变</text>
  <text x="500" y="372" font-size="10.5" fill="#64748b" text-anchor="middle">归属：有栈协程</text>
  <rect x="676" y="74" width="300" height="340" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="826" y="104" font-size="14.5" fill="#15803d" text-anchor="middle" font-weight="bold">③ 不保存整个栈</text>
  <text x="826" y="126" font-size="10.5" fill="#64748b" text-anchor="middle">只存「下次从哪继续」</text>
  <rect x="736" y="146" width="180" height="60" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.4"/>
  <text x="826" y="172" font-size="10" fill="#0f172a" text-anchor="middle">跨暂停点还活着的变量</text>
  <text x="826" y="192" font-size="10" fill="#15803d" text-anchor="middle" font-weight="bold">+ 续跑位置</text>
  <rect x="736" y="216" width="180" height="80" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="826" y="246" font-size="10.5" fill="#15803d" text-anchor="middle">没有一整块栈需要保存</text>
  <text x="826" y="268" font-size="10" fill="#64748b" text-anchor="middle">所以暂停成本与栈深无关</text>
  <text x="826" y="318" font-size="11" fill="#0f172a" text-anchor="middle">内存效率最高</text>
  <text x="826" y="342" font-size="11.5" fill="#15803d" text-anchor="middle" font-weight="bold">代价：要编译器配合</text>
  <text x="826" y="372" font-size="10.5" fill="#64748b" text-anchor="middle">归属：无栈协程 / 异步</text>
  <rect x="24" y="424" width="952" height="38" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="40" y="448" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="bold">第三种不是「栈更小」，而是根本没有一整块栈需要保存——代价是这套变换必须由编译器做，运行时单方面实现不了。</text>
</svg>
