<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">活性问题按「有没有动作」和「有没有推进」分开</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">只问「为什么卡了」不够，要先问「还有没有人在动」</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker><marker id="arwo" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/></marker><marker id="arwr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker></defs>
  <text x="370" y="92" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">没有动作</text>
  <text x="650" y="92" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">有动作（有人在跑）</text>
  <text x="108" y="200" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">没有推进</text>
  <text x="108" y="396" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">有推进</text>
  <rect x="250" y="110" width="240" height="180" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="370" y="142" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">死锁</text>
  <text x="270" y="176" font-size="12" fill="#0f172a" text-anchor="start">动作：无</text>
  <text x="270" y="202" font-size="12" fill="#0f172a" text-anchor="start">推进：无</text>
  <text x="270" y="228" font-size="12" fill="#0f172a" text-anchor="start">恢复：只能外部打断</text>
  <rect x="530" y="110" width="240" height="180" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="650" y="142" font-size="15" fill="#ea580c" text-anchor="middle" font-weight="bold">活锁</text>
  <text x="550" y="176" font-size="12" fill="#0f172a" text-anchor="start">动作：有，且很忙</text>
  <text x="550" y="202" font-size="12" fill="#0f172a" text-anchor="start">推进：无（成功数为零）</text>
  <text x="550" y="228" font-size="12" fill="#0f172a" text-anchor="start">破法：打破对称 / 加抖动</text>
  <rect x="250" y="300" width="240" height="180" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="370" y="332" font-size="15" fill="#64748b" text-anchor="middle" font-weight="bold">（不存在）</text>
  <text x="270" y="366" font-size="12" fill="#64748b" text-anchor="start">没有动作</text>
  <text x="270" y="392" font-size="12" fill="#64748b" text-anchor="start">却还在推进</text>
  <text x="270" y="418" font-size="12" fill="#64748b" text-anchor="start">—— 逻辑上不可能</text>
  <rect x="530" y="300" width="240" height="180" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="650" y="332" font-size="15" fill="#15803d" text-anchor="middle" font-weight="bold">正常，只是慢</text>
  <text x="550" y="366" font-size="12" fill="#0f172a" text-anchor="start">动作：有</text>
  <text x="550" y="392" font-size="12" fill="#0f172a" text-anchor="start">推进：有（计数在涨）</text>
  <text x="550" y="418" font-size="12" fill="#0f172a" text-anchor="start">这不是活性问题</text>
  <rect x="786" y="110" width="190" height="180" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.2"/>
  <text x="881" y="142" font-size="14" fill="#7e22ce" text-anchor="middle" font-weight="bold">饥饿</text>
  <text x="800" y="174" font-size="11.5" fill="#0f172a" text-anchor="start">动作：别人在动</text>
  <text x="800" y="196" font-size="11.5" fill="#0f172a" text-anchor="start">推进：整体在涨</text>
  <text x="800" y="218" font-size="11.5" fill="#7e22ce" text-anchor="start">　　　少数人轮不到</text>
  <text x="800" y="246" font-size="11" fill="#64748b" text-anchor="start">看等待时长的长尾</text>
  <text x="800" y="268" font-size="11" fill="#64748b" text-anchor="start">而不是平均值</text>
  <rect x="786" y="300" width="190" height="180" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
  <text x="881" y="332" font-size="13.5" fill="#ea580c" text-anchor="middle" font-weight="bold">优先级反转</text>
  <text x="800" y="364" font-size="11.5" fill="#0f172a" text-anchor="start">动作：中间人在动</text>
  <text x="800" y="386" font-size="11.5" fill="#0f172a" text-anchor="start">推进：被反转者没动</text>
  <text x="800" y="412" font-size="11" fill="#64748b" text-anchor="start">中间人与它无依赖</text>
  <text x="800" y="434" font-size="11" fill="#64748b" text-anchor="start">却间接卡住了它</text>
  <text x="800" y="458" font-size="11" fill="#ea580c" text-anchor="start">它是饥饿的特例</text>
  <rect x="24" y="496" width="952" height="34" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="40" y="518" font-size="12.5" fill="#b45309" text-anchor="start" font-weight="bold">把「卡住了」换成「完成计数在不在涨」，一半的现场报告会直接落到右下角。</text>
</svg>
