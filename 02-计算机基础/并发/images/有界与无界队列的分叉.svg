<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">有界与无界：两条路通向两个不同的终点</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">横轴是负载，纵轴是系统状态。两者都不会优雅退化，区别只在「何时、以什么形式失败」</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker><marker id="arwo" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/></marker><marker id="arwg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#15803d"/></marker><marker id="arwr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker></defs>
  <line x1="190" y1="384" x2="880" y2="384" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <line x1="190" y1="384" x2="190" y2="116" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <text x="880" y="404" font-size="11.5" fill="#64748b" text-anchor="end">负载 →</text>
  <text x="182" y="110" font-size="11.5" fill="#64748b" text-anchor="end">系统压力</text>
  <line x1="500" y1="116" x2="500" y2="384" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="500" y="106" font-size="11" fill="#64748b" text-anchor="middle" font-weight="bold">队列容量</text>
  <polyline points="190.0,360.0 420.0,310.0 620.0,232.0 740.0,176.0 800.0,130.0" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="796" y="118" font-size="11.5" fill="#dc2626" text-anchor="end" font-weight="bold">内存耗尽，进程被杀</text>
  <text x="640" y="196" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="bold">任务无限堆积</text>
  <text x="640" y="214" font-size="10.5" fill="#64748b" text-anchor="start">延迟线性变差</text>
  <polyline points="190.0,360.0 420.0,306.0 500.0,268.0 700.0,262.0 860.0,258.0" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="700" y="284" font-size="11.5" fill="#15803d" text-anchor="start" font-weight="bold">转为拒绝</text>
  <text x="700" y="304" font-size="10.5" fill="#64748b" text-anchor="start">系统保持稳定</text>
  <text x="300" y="372" font-size="10" fill="#64748b" text-anchor="start">两者此处重合</text>
  <rect x="214" y="132" width="196" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="230" y1="154" x2="266" y2="154" stroke="#dc2626" stroke-width="2.4"/>
  <text x="274" y="158" font-size="11.5" fill="#0f172a" text-anchor="start">无界队列</text>
  <line x1="230" y1="182" x2="266" y2="182" stroke="#15803d" stroke-width="2.4"/>
  <text x="274" y="186" font-size="11.5" fill="#0f172a" text-anchor="start">有界队列</text>
  <rect x="24" y="410" width="952" height="48" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="40" y="432" font-size="12.5" fill="#b45309" text-anchor="start" font-weight="bold">无界不是「更宽容」，只是把故障推迟到了更晚、且不可恢复的那一刻。</text>
  <text x="40" y="450" font-size="12" fill="#92400e" text-anchor="start">有界在容量处就把「过载」翻译成「拒绝」——失败得更早，但可观测、可处置。</text>
</svg>
