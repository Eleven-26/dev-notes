<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" width="1000" height="452" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="452" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">执行体阻塞了，它脚下的线程怎么办</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">三种答法，代价完全不同；第二种是多数运行时的实际做法</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#15803d"/></marker><marker id="arwo" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/></marker><marker id="arwb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <rect x="24" y="74" width="300" height="320" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="174" y="104" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">① 陪着一起等</text>
  <text x="174" y="126" font-size="10.5" fill="#64748b" text-anchor="middle">线程被内核挂起，谁也跑不了</text>
  <rect x="64" y="150" width="220" height="96" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="174" y="172" font-size="10.5" fill="#64748b" text-anchor="middle">线程</text>
  <rect x="94" y="186" width="160" height="44" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="174" y="213" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="bold">A 阻塞</text>
  <text x="174" y="340" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">并发度随阻塞数下降</text>
  <text x="174" y="362" font-size="11" fill="#64748b" text-anchor="middle">阻塞一多就全卡</text>
  <rect x="340" y="74" width="300" height="320" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="490" y="104" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="bold">② 先补一条线程</text>
  <text x="490" y="126" font-size="10.5" fill="#64748b" text-anchor="middle">发现要阻塞，先拉一条顶替</text>
  <rect x="380" y="150" width="220" height="96" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="490" y="172" font-size="10.5" fill="#64748b" text-anchor="middle">线程 1</text>
  <rect x="410" y="186" width="160" height="44" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="490" y="213" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="bold">A 阻塞</text>
  <rect x="380" y="254" width="220" height="66" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="490" y="274" font-size="10.5" fill="#ea580c" text-anchor="middle">线程 2</text>
  <rect x="410" y="284" width="160" height="28" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
  <text x="490" y="303" font-size="10.5" fill="#ea580c" text-anchor="middle" font-weight="bold">B 在跑</text>
  <text x="490" y="340" font-size="11" fill="#ea580c" text-anchor="middle" font-weight="bold">并发度保住了</text>
  <text x="490" y="362" font-size="11" fill="#64748b" text-anchor="middle">线程数随阻塞数波动</text>
  <rect x="656" y="74" width="300" height="320" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="806" y="104" font-size="14" fill="#15803d" text-anchor="middle" font-weight="bold">③ 把执行体搬走</text>
  <text x="806" y="126" font-size="10.5" fill="#64748b" text-anchor="middle">连同状态摘下来，线程去跑别的</text>
  <rect x="696" y="150" width="220" height="96" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="806" y="172" font-size="10.5" fill="#15803d" text-anchor="middle">线程（已空出来）</text>
  <rect x="726" y="186" width="160" height="44" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
  <text x="806" y="213" font-size="11.5" fill="#15803d" text-anchor="middle" font-weight="bold">B 在跑</text>
  <rect x="696" y="254" width="220" height="66" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="806" y="280" font-size="10.5" fill="#15803d" text-anchor="middle" font-weight="bold">等待区</text>
  <text x="806" y="302" font-size="9.5" fill="#64748b" text-anchor="middle">A 的栈与状态存在这里</text>
  <text x="806" y="340" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">并发度最好</text>
  <text x="806" y="362" font-size="11" fill="#64748b" text-anchor="middle">实现最复杂</text>
  <rect x="24" y="406" width="952" height="38" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="40" y="430" font-size="12" fill="#b45309" text-anchor="start" font-weight="bold">第三种最强，但要求执行体的状态能被完整保存与恢复——这正是「有栈协程」与「无栈协程」的分野所在。</text>
</svg>
