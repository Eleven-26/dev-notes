<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 494" width="1000" height="494" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="494" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">六种「等」：等什么、谁等谁、能不能重用</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">前四种有明确目标、语义固定；后两种是通用机制，最灵活也最容易写错</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker><marker id="arwg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#15803d"/></marker></defs>
  <rect x="24" y="76" width="300" height="166" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="40" y="106" font-size="14.5" fill="#2563eb" text-anchor="start" font-weight="bold">① 等事件</text>
  <text x="40" y="134" font-size="11.5" fill="#0f172a" text-anchor="start">等：一个计数减到零</text>
  <text x="40" y="162" font-size="11.5" fill="#0f172a" text-anchor="start">谁等谁：单向：等待方等事件方</text>
  <line x1="40" y1="182" x2="308" y2="182" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="40" y="204" font-size="10.5" fill="#64748b" text-anchor="start">重用：</text>
  <text x="40" y="224" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="bold">不能重用，归零即永久放行</text>
  <rect x="340" y="76" width="300" height="166" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="356" y="106" font-size="14.5" fill="#15803d" text-anchor="start" font-weight="bold">② 等到齐</text>
  <text x="356" y="134" font-size="11.5" fill="#0f172a" text-anchor="start">等：固定数量的参与者到齐</text>
  <text x="356" y="162" font-size="11.5" fill="#0f172a" text-anchor="start">谁等谁：互相等，全员同时走</text>
  <line x1="356" y1="182" x2="624" y2="182" stroke="#15803d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="356" y="204" font-size="10.5" fill="#64748b" text-anchor="start">重用：</text>
  <text x="356" y="224" font-size="11.5" fill="#15803d" text-anchor="start" font-weight="bold">能，换代后可再来一轮</text>
  <rect x="656" y="76" width="300" height="166" rx="10" fill="#cffafe" stroke="#0e7490" stroke-width="1.2"/>
  <text x="672" y="106" font-size="14.5" fill="#0e7490" text-anchor="start" font-weight="bold">③ 等许可</text>
  <text x="672" y="134" font-size="11.5" fill="#0f172a" text-anchor="start">等：可用名额够不够</text>
  <text x="672" y="162" font-size="11.5" fill="#0f172a" text-anchor="start">谁等谁：单向：取与还成对</text>
  <line x1="672" y1="182" x2="940" y2="182" stroke="#0e7490" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="672" y="204" font-size="10.5" fill="#64748b" text-anchor="start">重用：</text>
  <text x="672" y="224" font-size="11.5" fill="#0e7490" text-anchor="start" font-weight="bold">能，名额可增可减</text>
  <rect x="24" y="258" width="300" height="166" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.2"/>
  <text x="40" y="288" font-size="14.5" fill="#7e22ce" text-anchor="start" font-weight="bold">④ 等交换</text>
  <text x="40" y="316" font-size="11.5" fill="#0f172a" text-anchor="start">等：另一个执行体来配对</text>
  <text x="40" y="344" font-size="11.5" fill="#0f172a" text-anchor="start">谁等谁：严格一对一</text>
  <line x1="40" y1="364" x2="308" y2="364" stroke="#7e22ce" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="40" y="386" font-size="10.5" fill="#64748b" text-anchor="start">重用：</text>
  <text x="40" y="406" font-size="11.5" fill="#7e22ce" text-anchor="start" font-weight="bold">能，每次调用换一次</text>
  <rect x="340" y="258" width="300" height="166" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="356" y="288" font-size="14.5" fill="#ea580c" text-anchor="start" font-weight="bold">⑤ 等条件</text>
  <text x="356" y="316" font-size="11.5" fill="#0f172a" text-anchor="start">等：某个谓词为真</text>
  <text x="356" y="344" font-size="11.5" fill="#0f172a" text-anchor="start">谁等谁：视谁发信号而定</text>
  <line x1="356" y1="364" x2="624" y2="364" stroke="#ea580c" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="356" y="386" font-size="10.5" fill="#64748b" text-anchor="start">重用：</text>
  <text x="356" y="406" font-size="11.5" fill="#ea580c" text-anchor="start" font-weight="bold">能，但每次醒来都要重查</text>
  <rect x="656" y="258" width="300" height="166" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="672" y="288" font-size="14.5" fill="#b45309" text-anchor="start" font-weight="bold">⑥ 等超时</text>
  <text x="672" y="316" font-size="11.5" fill="#0f172a" text-anchor="start">等：给以上任一加时间预算</text>
  <text x="672" y="344" font-size="11.5" fill="#0f172a" text-anchor="start">谁等谁：同被修饰的那种</text>
  <line x1="672" y1="364" x2="940" y2="364" stroke="#b45309" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="672" y="386" font-size="10.5" fill="#64748b" text-anchor="start">重用：</text>
  <text x="672" y="406" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="bold">同被修饰的那种；到点即返回</text>
  <rect x="24" y="440" width="952" height="42" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="40" y="466" font-size="12.5" fill="#b45309" text-anchor="start" font-weight="bold">最容易踩的一条是「重用」：一次性门闩归零后永久放行，拿它做每轮同步，第二轮起形同虚设——而且不报错。</text>
</svg>
