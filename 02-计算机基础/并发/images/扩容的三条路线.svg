  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">扩容的三条路线：总工作量一样，最长暂停差很多</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">同一张表从 n 扩到 2n，三条路线把「搬迁」摊到不同粒度上</text>
