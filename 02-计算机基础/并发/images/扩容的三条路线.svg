  <rect x="24" y="328" width="952" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="358" font-size="13.5" fill="#15803d" text-anchor="start" font-weight="bold">渐进式搬迁</text>
  <text x="40" y="380" font-size="10.5" fill="#64748b" text-anchor="start">一次搬一批，新旧表并存</text>
  <text x="40" y="406" font-size="10.5" fill="#15803d" text-anchor="start">最长暂停 ≈ 一批搬迁时间</text>
