  <rect x="723.44" y="362" width="38.17" height="40" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="742.5250000000001" y="386.0" font-size="9.5" fill="#15803d" text-anchor="middle">批</text>
  <rect x="776.184" y="362" width="38.17" height="40" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="795.269" y="386.0" font-size="9.5" fill="#15803d" text-anchor="middle">批</text>
  <line x1="196" y1="452" x2="890" y2="452" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <text x="196" y="444" font-size="10.5" fill="#64748b" text-anchor="start">开始扩容</text>
  <text x="890" y="444" font-size="10.5" fill="#64748b" text-anchor="end">扩容完成</text>
  <text x="543" y="442" font-size="11" fill="#64748b" text-anchor="middle">时间 →</text>
  <rect x="24" y="464" width="952" height="26" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="40" y="482" font-size="11.5" fill="#b45309" text-anchor="start">渐进式搬迁没有减少总工作量，它只是把同样的工作摊到很多次读写上——总吞吐略降，最长暂停才降下来。</text>
