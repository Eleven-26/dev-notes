  <text x="40" y="148" font-size="10.5" fill="#64748b" text-anchor="start">一次搬完，期间所有人等</text>
  <text x="40" y="174" font-size="10.5" fill="#dc2626" text-anchor="start">最长暂停 ≈ 全表搬迁时间</text>
