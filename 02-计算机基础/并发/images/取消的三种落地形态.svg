<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" width="1000" height="452" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="452" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">取消的三种落地形态：不是替代，是叠加</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">选哪一种取决于「取消要传多远」，不取决于「哪一种更先进」</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#15803d"/></marker><marker id="arwr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker><marker id="arwo" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/></marker></defs>
  <rect x="24" y="74" width="300" height="340" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="174" y="104" font-size="14.5" fill="#15803d" text-anchor="middle" font-weight="bold">① 标志位</text>
  <text x="174" y="128" font-size="10.5" fill="#64748b" text-anchor="middle">一个原子布尔，被取消方定期检查</text>
  <text x="42" y="166" font-size="11.5" fill="#0f172a" text-anchor="start">能解决：循环里要不要停</text>
  <text x="42" y="192" font-size="11.5" fill="#0f172a" text-anchor="start">不能解决：阻塞中怎么醒来</text>
  <line x1="42" y1="216" x2="306" y2="216" stroke="#15803d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="42" y="244" font-size="11" fill="#15803d" text-anchor="start">代价：阻塞调用里看不到</text>
  <text x="42" y="268" font-size="11" fill="#15803d" text-anchor="start">补法：给每个阻塞加超时</text>
  <rect x="42" y="320" width="264" height="72" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
  <text x="174" y="348" font-size="11.5" fill="#15803d" text-anchor="middle" font-weight="bold">传播范围：本执行体</text>
  <text x="174" y="370" font-size="10.5" fill="#64748b" text-anchor="middle">只覆盖主动检查点</text>
  <rect x="340" y="74" width="300" height="340" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="490" y="104" font-size="14.5" fill="#ea580c" text-anchor="middle" font-weight="bold">② 异常中断</text>
  <text x="490" y="128" font-size="10.5" fill="#64748b" text-anchor="middle">在阻塞点抛出一个特殊异常</text>
  <text x="358" y="166" font-size="11.5" fill="#0f172a" text-anchor="start">能解决：把阻塞中的执行体叫醒</text>
  <text x="358" y="192" font-size="11.5" fill="#0f172a" text-anchor="start">不能解决：怎么自动传下去</text>
  <line x1="358" y1="216" x2="622" y2="216" stroke="#ea580c" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="358" y="244" font-size="11" fill="#ea580c" text-anchor="start">代价：被捕获语句吞掉</text>
  <text x="358" y="268" font-size="11" fill="#ea580c" text-anchor="start">代价：每层都要处理与清理</text>
  <rect x="358" y="320" width="264" height="72" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
  <text x="490" y="348" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="bold">传播范围：调用栈</text>
  <text x="490" y="370" font-size="10.5" fill="#64748b" text-anchor="middle">覆盖阻塞点，需人工转发</text>
  <rect x="656" y="74" width="300" height="340" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="806" y="104" font-size="14.5" fill="#2563eb" text-anchor="middle" font-weight="bold">③ 令牌传播</text>
  <text x="806" y="128" font-size="10.5" fill="#64748b" text-anchor="middle">可派生的令牌，父取消则子取消</text>
  <text x="674" y="166" font-size="11.5" fill="#0f172a" text-anchor="start">能解决：沿派生关系自动下行</text>
  <text x="674" y="192" font-size="11.5" fill="#0f172a" text-anchor="start">附带：原因与截止时间</text>
  <line x1="674" y1="216" x2="938" y2="216" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="674" y="244" font-size="11" fill="#2563eb" text-anchor="start">代价：多一个必须层层传的参数</text>
  <text x="674" y="268" font-size="11" fill="#2563eb" text-anchor="start">风险：省事就塞进隐式变量</text>
  <rect x="674" y="320" width="264" height="72" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="806" y="348" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="bold">传播范围：整棵执行树</text>
  <text x="806" y="370" font-size="10.5" fill="#64748b" text-anchor="middle">覆盖全树，但多一个参数</text>
  <rect x="24" y="424" width="952" height="24" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="40" y="441" font-size="11.5" fill="#b45309" text-anchor="start">三者是叠加关系：令牌传播内部仍要靠被取消方主动检查，异常中断也仍要清理——没有一种能省掉「收尾」。</text>
</svg>
