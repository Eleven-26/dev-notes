<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">把锁拆到哪里去：五种拆法</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">越往右冲突范围越小、读路径越轻；代价同步从读侧挪到写侧</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker><marker id="arwo" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/></marker></defs>
  <line x1="120" y1="84" x2="880" y2="84" stroke="#64748b" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="120" y="76" font-size="11.5" fill="#64748b" text-anchor="start">冲突范围大</text>
  <text x="880" y="76" font-size="11.5" fill="#64748b" text-anchor="end">没有冲突</text>
  <rect x="24" y="104" width="184" height="300" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="116" y="134" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">不拆</text>
  <text x="116" y="156" font-size="11" fill="#64748b" text-anchor="middle">全局锁</text>
  <text x="38" y="194" font-size="11.5" fill="#0f172a" text-anchor="start">冲突：整张表</text>
  <text x="38" y="228" font-size="11.5" fill="#0f172a" text-anchor="start">读：要加锁</text>
  <text x="38" y="262" font-size="11.5" fill="#0f172a" text-anchor="start">写：要加锁</text>
  <line x1="38" y1="300" x2="194" y2="300" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="38" y="322" font-size="10.5" fill="#64748b" text-anchor="start">代价</text>
  <text x="38" y="344" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="bold">并发度 = 1</text>
  <text x="116" y="382" font-size="10.5" fill="#64748b" text-anchor="middle">守跨 key 的不变量</text>
  <rect x="216" y="104" width="184" height="300" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="308" y="134" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">按空间拆</text>
  <text x="308" y="156" font-size="11" fill="#64748b" text-anchor="middle">分桶 / 分段</text>
  <text x="230" y="194" font-size="11.5" fill="#0f172a" text-anchor="start">冲突：一个桶或一段</text>
  <text x="230" y="228" font-size="11.5" fill="#0f172a" text-anchor="start">读：不加锁</text>
  <text x="230" y="262" font-size="11.5" fill="#0f172a" text-anchor="start">写：桶内短锁</text>
  <line x1="230" y1="300" x2="386" y2="300" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="230" y="322" font-size="10.5" fill="#64748b" text-anchor="start">代价</text>
  <text x="230" y="344" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="bold">复合操作不原子</text>
  <text x="308" y="382" font-size="10.5" fill="#64748b" text-anchor="middle">最主流的一档</text>
  <rect x="408" y="104" width="184" height="300" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="500" y="134" font-size="15" fill="#ea580c" text-anchor="middle" font-weight="bold">按时间拆</text>
  <text x="500" y="156" font-size="11" fill="#64748b" text-anchor="middle">写时复制</text>
  <text x="422" y="194" font-size="11.5" fill="#0f172a" text-anchor="start">冲突：写者之间</text>
  <text x="422" y="228" font-size="11.5" fill="#0f172a" text-anchor="start">读：不可变快照</text>
  <text x="422" y="262" font-size="11.5" fill="#0f172a" text-anchor="start">写：复制整份换引用</text>
  <line x1="422" y1="300" x2="578" y2="300" stroke="#ea580c" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="422" y="322" font-size="10.5" fill="#64748b" text-anchor="start">代价</text>
  <text x="422" y="344" font-size="11.5" fill="#ea580c" text-anchor="start" font-weight="bold">写成本 O(n)</text>
  <text x="500" y="382" font-size="10.5" fill="#64748b" text-anchor="middle">读极多写极少</text>
  <rect x="600" y="104" width="184" height="300" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="692" y="134" font-size="15" fill="#15803d" text-anchor="middle" font-weight="bold">不共享</text>
  <text x="692" y="156" font-size="11" fill="#64748b" text-anchor="middle">线程本地 / 单所有者</text>
  <text x="614" y="194" font-size="11.5" fill="#0f172a" text-anchor="start">冲突：无</text>
  <text x="614" y="228" font-size="11.5" fill="#0f172a" text-anchor="start">读：直接读本地</text>
  <text x="614" y="262" font-size="11.5" fill="#0f172a" text-anchor="start">写：只写自己的</text>
  <line x1="614" y1="300" x2="770" y2="300" stroke="#15803d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="614" y="322" font-size="10.5" fill="#64748b" text-anchor="start">代价</text>
  <text x="614" y="344" font-size="11.5" fill="#15803d" text-anchor="start" font-weight="bold">数据不跨执行体</text>
  <text x="692" y="382" font-size="10.5" fill="#64748b" text-anchor="middle">能改就别拆</text>
  <rect x="792" y="104" width="184" height="300" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.2"/>
  <text x="884" y="134" font-size="15" fill="#7e22ce" text-anchor="middle" font-weight="bold">乐观</text>
  <text x="884" y="156" font-size="11" fill="#64748b" text-anchor="middle">不锁，提交时验</text>
  <text x="806" y="194" font-size="11.5" fill="#0f172a" text-anchor="start">冲突：单个位置</text>
  <text x="806" y="228" font-size="11.5" fill="#0f172a" text-anchor="start">读：直接读</text>
  <text x="806" y="262" font-size="11.5" fill="#0f172a" text-anchor="start">写：原子指令提交</text>
  <line x1="806" y1="300" x2="962" y2="300" stroke="#7e22ce" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="806" y="322" font-size="10.5" fill="#64748b" text-anchor="start">代价</text>
  <text x="806" y="344" font-size="11.5" fill="#7e22ce" text-anchor="start" font-weight="bold">冲突高时空转重试</text>
  <text x="884" y="382" font-size="10.5" fill="#64748b" text-anchor="middle">冲突概率低才划算</text>
  <rect x="24" y="424" width="952" height="56" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="40" y="448" font-size="12.5" fill="#b45309" text-anchor="start" font-weight="bold">前三种都还在「锁」这条路上，只是锁的范围不同；后两种换了思路——一个取消共享，一个取消锁。</text>
  <text x="40" y="468" font-size="12" fill="#92400e" text-anchor="start">越往右读路径越轻，但代价没有消失，它只是从读侧挪到了写侧或重试侧。</text>
</svg>
