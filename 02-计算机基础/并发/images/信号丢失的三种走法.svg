<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 486" width="1000" height="486" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="486" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">信号为什么会丢：三种走法</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">横向是时间。第一种掉进缝里，第二种错投给同类，第三种根本没发信号</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker><marker id="arwg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#15803d"/></marker></defs>
  <rect x="24" y="80" width="952" height="118" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="108" font-size="13.5" fill="#dc2626" text-anchor="start" font-weight="bold">① 先到</text>
  <text x="40" y="128" font-size="10.5" fill="#64748b" text-anchor="start">信号落在「检查完」与「睡下」之间</text>
  <rect x="340" y="110" width="80" height="26" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="412" y="128" font-size="11" fill="#dc2626" text-anchor="end" font-weight="bold">缝</text>
  <line x1="176" y1="150" x2="748" y2="150" stroke="#64748b" stroke-width="1.2" marker-end="url(#arw)"/>
  <circle cx="340" cy="150" r="4" fill="#64748b"/>
  <circle cx="420" cy="150" r="4" fill="#64748b"/>
  <text x="340" y="170" font-size="10.5" fill="#64748b" text-anchor="middle">检查条件</text>
  <text x="420" y="170" font-size="10.5" fill="#64748b" text-anchor="middle">进入等待</text>
  <line x1="356" y1="110" x2="356" y2="144" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arwr)"/>
  <text x="380" y="104" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="bold">信号到此，无人接收</text>
  <text x="760" y="114" font-size="11" fill="#0f172a" text-anchor="start">之后它睡下去，再也没人叫</text>
  <text x="760" y="134" font-size="11" fill="#dc2626" text-anchor="start" font-weight="bold">修法：检查与等待放同一把锁内</text>
  <rect x="24" y="210" width="952" height="118" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="238" font-size="13.5" fill="#ea580c" text-anchor="start" font-weight="bold">② 错投</text>
  <text x="40" y="258" font-size="10.5" fill="#64748b" text-anchor="start">信号被同类收走，该醒的人没醒</text>
  <rect x="340" y="240" width="80" height="26" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="412" y="258" font-size="11" fill="#dc2626" text-anchor="end" font-weight="bold">缝</text>
  <line x1="176" y1="280" x2="748" y2="280" stroke="#64748b" stroke-width="1.2" marker-end="url(#arw)"/>
  <circle cx="340" cy="280" r="4" fill="#64748b"/>
  <circle cx="420" cy="280" r="4" fill="#64748b"/>
  <text x="340" y="300" font-size="10.5" fill="#64748b" text-anchor="middle">检查条件</text>
  <text x="420" y="300" font-size="10.5" fill="#64748b" text-anchor="middle">进入等待</text>
  <line x1="356" y1="240" x2="356" y2="274" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arwr)"/>
  <text x="380" y="234" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="bold">信号正常发出</text>
  <line x1="560" y1="240" x2="560" y2="274" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arwr)"/>
  <text x="560" y="234" font-size="10" fill="#ea580c" text-anchor="middle" font-weight="bold">被同类收走</text>
  <text x="760" y="244" font-size="11" fill="#0f172a" text-anchor="start">收的一方发现条件不成立，又睡回去</text>
  <text x="760" y="264" font-size="11" fill="#ea580c" text-anchor="start" font-weight="bold">修法：一类角色一条队列</text>
  <rect x="24" y="340" width="952" height="118" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="368" font-size="13.5" fill="#7e22ce" text-anchor="start" font-weight="bold">③ 假醒</text>
  <text x="40" y="388" font-size="10.5" fill="#64748b" text-anchor="start">没有任何信号，它自己醒了</text>
  <rect x="340" y="370" width="80" height="26" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="412" y="388" font-size="11" fill="#dc2626" text-anchor="end" font-weight="bold">缝</text>
  <line x1="176" y1="410" x2="748" y2="410" stroke="#64748b" stroke-width="1.2" marker-end="url(#arw)"/>
  <circle cx="340" cy="410" r="4" fill="#64748b"/>
  <circle cx="420" cy="410" r="4" fill="#64748b"/>
  <text x="340" y="430" font-size="10.5" fill="#64748b" text-anchor="middle">检查条件</text>
  <text x="420" y="430" font-size="10.5" fill="#64748b" text-anchor="middle">进入等待</text>
  <circle cx="560" cy="410" r="6" fill="none" stroke="#7e22ce" stroke-width="2"/>
  <text x="560" y="364" font-size="10" fill="#7e22ce" text-anchor="middle" font-weight="bold">无信号，凭空返回</text>
  <text x="760" y="374" font-size="11" fill="#0f172a" text-anchor="start">醒来发现条件依旧不成立</text>
  <text x="760" y="394" font-size="11" fill="#7e22ce" text-anchor="start" font-weight="bold">修法：等待包在 while 里，不是 if</text>
  <rect x="24" y="452" width="952" height="26" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="40" y="470" font-size="11.5" fill="#b45309" text-anchor="start">三条修法互不替代：第一条靠锁、第二条靠队列拆分、第三条靠循环——三条都要，少一条就还有一个洞。</text>
</svg>
