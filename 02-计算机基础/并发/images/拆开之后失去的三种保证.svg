<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">拆细锁之后必然失去的三种保证</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">退化不是全丢，而是从强保证退到弱保证——问的是业务能不能接受弱版本</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker><marker id="arwb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker><marker id="arwo" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/></marker></defs>
  <rect x="24" y="74" width="300" height="316" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="174" y="104" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">① 聚合值</text>
  <text x="174" y="126" font-size="11.5" fill="#64748b" text-anchor="middle">从精确变成估算</text>
  <text x="42" y="164" font-size="11.5" fill="#0f172a" text-anchor="start">还保证：误差有界、监控够用</text>
  <text x="42" y="190" font-size="11.5" fill="#0f172a" text-anchor="start">不保证：任意时刻的精确值</text>
  <text x="42" y="242" font-size="11.5" fill="#0f172a" text-anchor="start">咬人处：拿它当业务判据，</text>
  <text x="42" y="268" font-size="11.5" fill="#0f172a" text-anchor="start">在边界附近反复抖动</text>
  <line x1="42" y1="330" x2="306" y2="330" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="42" y="352" font-size="11" fill="#dc2626" text-anchor="start">要精确值：不并发时取，</text>
  <text x="42" y="372" font-size="11" fill="#dc2626" text-anchor="start">或自己维护原子计数器</text>
  <rect x="340" y="74" width="300" height="316" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="490" y="104" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">② 遍历</text>
  <text x="490" y="126" font-size="11.5" fill="#64748b" text-anchor="middle">从快照变成弱一致</text>
  <text x="358" y="164" font-size="11.5" fill="#0f172a" text-anchor="start">还保证：不会抛异常、不会崩</text>
  <text x="358" y="190" font-size="11.5" fill="#0f172a" text-anchor="start">不保证：看到某一时刻的全体</text>
  <text x="358" y="242" font-size="11.5" fill="#0f172a" text-anchor="start">咬人处：遍历做汇总，</text>
  <text x="358" y="268" font-size="11.5" fill="#0f172a" text-anchor="start">得到的数对不上</text>
  <line x1="358" y1="330" x2="622" y2="330" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="358" y="352" font-size="11" fill="#2563eb" text-anchor="start">要快照：只有写时复制那一档</text>
  <text x="358" y="372" font-size="11" fill="#2563eb" text-anchor="start">其余各档给的都不是快照</text>
  <rect x="656" y="74" width="300" height="316" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="806" y="104" font-size="15" fill="#ea580c" text-anchor="middle" font-weight="bold">③ 复合操作</text>
  <text x="806" y="126" font-size="11.5" fill="#64748b" text-anchor="middle">从原子变成可被打断</text>
  <text x="674" y="164" font-size="11.5" fill="#0f172a" text-anchor="start">还保证：单次调用是安全的</text>
  <text x="674" y="190" font-size="11.5" fill="#0f172a" text-anchor="start">不保证：先读再写这一组安全</text>
  <text x="674" y="242" font-size="11.5" fill="#0f172a" text-anchor="start">咬人处：读—改—写计数，</text>
  <text x="674" y="268" font-size="11.5" fill="#0f172a" text-anchor="start">丢一半以上更新</text>
  <line x1="674" y1="330" x2="938" y2="330" stroke="#ea580c" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="674" y="352" font-size="11" fill="#ea580c" text-anchor="start">要原子：用容器的原子复合方法，</text>
  <text x="674" y="372" font-size="11" fill="#ea580c" text-anchor="start">或自己加锁包住整段</text>
  <rect x="24" y="410" width="952" height="40" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="40" y="435" font-size="12.5" fill="#b45309" text-anchor="start" font-weight="bold">三种退化里，第二种最危险：弱一致迭代器不会报错，它只是安静地给你一份自相矛盾的结果。</text>
</svg>
