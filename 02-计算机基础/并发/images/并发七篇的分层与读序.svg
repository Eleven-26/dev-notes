<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 596" width="1000" height="596" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="596" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">并发七篇：一个总纲、四个组织问题、一个反常面、一个底座</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">中间四问之间没有先后依赖——按手上的问题直接跳到那一格</text>
  <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect x="300" y="76" width="400" height="72" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="500" y="102" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">共享内存与消息传递</text>
  <text x="500" y="124" font-size="11" fill="#0f172a" text-anchor="middle">总纲：状态归谁、怎么交接</text>
  <text x="500" y="140" font-size="10" fill="#64748b" text-anchor="middle">两条路线与各自的失败模式</text>
  <line x1="500" y1="150" x2="500" y2="172" stroke="#64748b" stroke-width="1.3"/>
  <line x1="152" y1="172" x2="848" y2="172" stroke="#64748b" stroke-width="1.3"/>
  <line x1="152" y1="172" x2="152" y2="196" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="42" y="198" width="220" height="96" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="152" y="224" font-size="12.5" fill="#ea580c" text-anchor="middle" font-weight="bold">等的原语谱系</text>
  <text x="152" y="248" font-size="10.5" fill="#0f172a" text-anchor="middle">谁等谁、等多久</text>
  <text x="152" y="270" font-size="9.5" fill="#64748b" text-anchor="middle">六种等 + 信号为什么会丢</text>
  <line x1="384" y1="172" x2="384" y2="196" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="274" y="198" width="220" height="96" rx="10" fill="#cffafe" stroke="#0e7490" stroke-width="1.2"/>
  <text x="384" y="224" font-size="12.5" fill="#0e7490" text-anchor="middle" font-weight="bold">并发数据结构</text>
  <text x="384" y="248" font-size="10.5" fill="#0f172a" text-anchor="middle">数据放在什么结构里</text>
  <text x="384" y="270" font-size="9.5" fill="#64748b" text-anchor="middle">五种拆法 + 三种弱一致</text>
  <line x1="616" y1="172" x2="616" y2="196" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="506" y="198" width="220" height="96" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="616" y="224" font-size="12.5" fill="#15803d" text-anchor="middle" font-weight="bold">任务池</text>
  <text x="616" y="248" font-size="10.5" fill="#0f172a" text-anchor="middle">活交给谁、交给多少</text>
  <text x="616" y="270" font-size="9.5" fill="#64748b" text-anchor="middle">四段阶梯 + 有界无界</text>
  <line x1="848" y1="172" x2="848" y2="196" stroke="#64748b" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect x="738" y="198" width="220" height="96" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.2"/>
  <text x="848" y="224" font-size="12.5" fill="#7e22ce" text-anchor="middle" font-weight="bold">协作式取消与传播</text>
  <text x="848" y="248" font-size="10.5" fill="#0f172a" text-anchor="middle">不要了怎么停</text>
  <text x="848" y="270" font-size="9.5" fill="#64748b" text-anchor="middle">三种落地 + 断链与清理</text>
  <rect x="24" y="340" width="464" height="104" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="256" y="366" font-size="13.5" fill="#dc2626" text-anchor="middle" font-weight="bold">活性与泄漏</text>
  <text x="256" y="390" font-size="11" fill="#0f172a" text-anchor="middle">反常面：四条路共同的失败区</text>
  <text x="256" y="412" font-size="10.5" fill="#64748b" text-anchor="middle">不是环的卡死、活锁与饥饿、执行体泄漏</text>
  <text x="256" y="432" font-size="10" fill="#dc2626" text-anchor="middle">工具报「没有死锁」时该看什么</text>
  <rect x="512" y="340" width="464" height="104" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="744" y="366" font-size="13.5" fill="#b45309" text-anchor="middle" font-weight="bold">用户态调度</text>
  <text x="744" y="390" font-size="11" fill="#0f172a" text-anchor="middle">底座：执行体本身从哪来</text>
  <text x="744" y="412" font-size="10.5" fill="#64748b" text-anchor="middle">三个部件、栈的三种给法、阻塞交接、钉住</text>
  <text x="744" y="432" font-size="10" fill="#b45309" text-anchor="middle">内核调度在操作系统目录，本篇只讲搬出之后</text>
  <line x1="152" y1="296" x2="240" y2="338" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <line x1="848" y1="296" x2="760" y2="338" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <line x1="24" y1="466" x2="976" y2="466" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="500" y="458" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="bold">以下三层不归本目录</text>
  <rect x="24" y="480" width="306" height="66" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="177" y="506" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold">底层同步</text>
  <text x="177" y="528" font-size="10" fill="#64748b" text-anchor="middle">内存序 / 原子指令 / 互斥实现</text>
  <rect x="347" y="480" width="306" height="66" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="500" y="506" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold">操作系统</text>
  <text x="500" y="528" font-size="10" fill="#64748b" text-anchor="middle">时间片 / 抢回 CPU / 切换成本</text>
  <rect x="670" y="480" width="306" height="66" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="823" y="506" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold">01 / 并发编程</text>
  <text x="823" y="528" font-size="10" fill="#64748b" text-anchor="middle">方法名 / 参数默认值 / 本机读数</text>
  <text x="500" y="580" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="bold">判据：换一个运行时还成立、且答案在「组织方式」这一层 → 进本目录。</text>
</svg>
