<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 504" width="1000" height="504" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwH" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 7,3.5 0,7 z" fill="#2563eb"/></marker>
    <marker id="arwH2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 7,3.5 0,7 z" fill="#16a34a"/></marker>
  </defs>

  <rect width="1000" height="504" fill="#ffffff"/>
  <text x="40" y="34" font-size="19" font-weight="bold" fill="#0f172a">树链剖分：把树拆成重链，于是「路径」和「子树」都成了连续区间</text>
  <text x="40" y="56" font-size="13" fill="#64748b">粗线 = 重边（连向 size 最大的儿子），同一条重链上的节点在 dfn 序里紧挨着</text>

  <!-- 树 -->
  <line x1="250" y1="96" x2="170" y2="150" stroke="#2563eb" stroke-width="4"/>
  <line x1="170" y1="150" x2="120" y2="204" stroke="#2563eb" stroke-width="4"/>
  <line x1="120" y1="204" x2="80" y2="258" stroke="#2563eb" stroke-width="4"/>
  <line x1="330" y1="150" x2="380" y2="204" stroke="#2563eb" stroke-width="4"/>
  <line x1="250" y1="96" x2="330" y2="150" stroke="#cbd5e1" stroke-width="1.6"/>
  <line x1="170" y1="150" x2="220" y2="204" stroke="#cbd5e1" stroke-width="1.6"/>
  <line x1="120" y1="204" x2="160" y2="258" stroke="#cbd5e1" stroke-width="1.6"/>

  <circle cx="250" cy="96" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="245" y="101" font-size="13" fill="#1d4ed8">1</text>
  <circle cx="170" cy="150" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="155" font-size="13" fill="#1d4ed8">2</text>
  <circle cx="120" cy="204" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="209" font-size="13" fill="#1d4ed8">4</text>
  <circle cx="80" cy="258" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="75" y="263" font-size="13" fill="#1d4ed8">6</text>
  <circle cx="220" cy="204" r="19" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="215" y="209" font-size="13" fill="#475569">5</text>
  <circle cx="160" cy="258" r="19" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="155" y="263" font-size="13" fill="#475569">7</text>
  <circle cx="330" cy="150" r="19" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="325" y="155" font-size="13" fill="#15803d">3</text>
  <circle cx="380" cy="204" r="19" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="375" y="209" font-size="13" fill="#15803d">8</text>

  <text x="60" y="296" font-size="12.5" fill="#1d4ed8">重链 1-2-4-6（顶 1）</text>
  <text x="60" y="314" font-size="12.5" fill="#15803d">重链 3-8（顶 3）</text>
  <text x="230" y="296" font-size="12.5" fill="#64748b">5、7 各自成链</text>
  <text x="230" y="314" font-size="12.5" fill="#64748b">（轻儿子就是新链的链顶）</text>

  <!-- dfn 数组 -->
  <text x="500" y="100" font-size="14" font-weight="bold" fill="#0f172a">dfn 序（先走重儿子）</text>

  <line x1="180" y1="140" x2="472" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arwH)" marker-start="url(#arwH)"/>
  <text x="180" y="132" font-size="12" fill="#1d4ed8">重链「顶 1」= dfn 1~4 一段</text>

  <rect x="180" y="160" width="70" height="46" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="180" y="156" font-size="11.5" fill="#64748b">dfn=1</text>
  <text x="211" y="189" font-size="15" fill="#1d4ed8">1</text>

  <rect x="254" y="160" width="70" height="46" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="254" y="156" font-size="11.5" fill="#64748b">dfn=2</text>
  <text x="285" y="189" font-size="15" fill="#1d4ed8">2</text>

  <rect x="328" y="160" width="70" height="46" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="328" y="156" font-size="11.5" fill="#64748b">dfn=3</text>
  <text x="359" y="189" font-size="15" fill="#1d4ed8">4</text>

  <rect x="402" y="160" width="70" height="46" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="402" y="156" font-size="11.5" fill="#64748b">dfn=4</text>
  <text x="433" y="189" font-size="15" fill="#1d4ed8">6</text>

  <rect x="476" y="160" width="70" height="46" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="476" y="156" font-size="11.5" fill="#64748b">dfn=5</text>
  <text x="507" y="189" font-size="15" fill="#475569">7</text>

  <rect x="550" y="160" width="70" height="46" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="550" y="156" font-size="11.5" fill="#64748b">dfn=6</text>
  <text x="581" y="189" font-size="15" fill="#475569">5</text>

  <rect x="624" y="160" width="70" height="46" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="624" y="156" font-size="11.5" fill="#64748b">dfn=7</text>
  <text x="655" y="189" font-size="15" fill="#15803d">3</text>

  <rect x="698" y="160" width="70" height="46" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="698" y="156" font-size="11.5" fill="#64748b">dfn=8</text>
  <text x="729" y="189" font-size="15" fill="#15803d">8</text>

  <line x1="254" y1="232" x2="620" y2="232" stroke="#16a34a" stroke-width="2" marker-end="url(#arwH2)" marker-start="url(#arwH2)"/>
  <text x="254" y="252" font-size="12" fill="#15803d">子树 2 = {2,4,5,6,7} → dfn 2~6，也是连续一段</text>

  <text x="800" y="180" font-size="12.5" fill="#334155">⭐ 两个「连续」</text>
  <text x="800" y="200" font-size="12" fill="#64748b">重链 → 一</text>
  <text x="800" y="218" font-size="12" fill="#64748b">段区间</text>
  <text x="800" y="238" font-size="12" fill="#64748b">子树 → 一</text>
  <text x="800" y="256" font-size="12" fill="#64748b">段区间</text>

  <!-- 实测 -->
  <rect x="40" y="288" width="920" height="200" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="314" font-size="15" font-weight="bold" fill="#0f172a">实测（容器 Go 1.26.8，n = 100000）</text>
  <text x="60" y="342" font-size="13.5" fill="#334155">· dfn 连续性：逐个检查 100000 个节点，「子树 dfn 恰好铺满 [dfn[u], dfn[u]+size[u]−1]」违反 <tspan font-weight="bold" fill="#16a34a">0</tspan> 个</text>
  <text x="60" y="368" font-size="13.5" fill="#334155">· 退化链 1→100000：剖分 <tspan font-weight="bold" fill="#1d4ed8">1</tspan> 次区间查询，暴力 <tspan font-weight="bold" fill="#dc2626">100000</tspan> 次访问（差 10 万倍）</text>
  <text x="60" y="394" font-size="13.5" fill="#334155">· 随机树 3000 条路径：剖分平均跳链 <tspan font-weight="bold">7.8</tspan> 次，暴力平均 22.1 个节点，两边结果逐条一致</text>
  <text x="60" y="420" font-size="13.5" fill="#334155">· 求 LCA（3000 对点）：剖分平均跳链 7.8 次，倍增平均跳 6.5 次，两法结果全一致</text>
  <text x="60" y="448" font-size="13" fill="#64748b">⭐ 浅随机树上剖分并不更快（常数更大）—— 它的价值是「把路径 / 子树变成 O(log n) 段连续区间」，</text>
  <text x="60" y="470" font-size="13" fill="#64748b">从而支持区间修改、以及「子树整体操作」这类暴力根本做不到的事。</text>
</svg>
