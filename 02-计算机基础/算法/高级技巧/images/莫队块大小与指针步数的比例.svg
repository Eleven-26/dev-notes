<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="40" y="44" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#0f172a">块大小与指针移动步数的比例：√n = 316 处最低，两头翘中间凹</text>
  <text x="40" y="72" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">读数全部抄第四节 4.1 的实测输出块【一】【二】【三】；Go 1.26.8（linux/amd64，golang:1.26-alpine）容器实跑，同一程序连跑三遍逐字相同</text>

  <rect x="40" y="92" width="920" height="240" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="114" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">A. 块大小 B 与指针移动步数（n = q = 100000，seed = 7、奇偶排序开启，取【三】的实测拆分）</text>
  <text x="60" y="132" font-family="system-ui, sans-serif" font-size="12" fill="#475569">蓝段 = 左指针移动步数　绿段 = 右指针移动步数　右侧灰字 = 【一】那列理论上界 qB + n²/B</text>

  <text x="140" y="166" font-family="system-ui, sans-serif" font-size="13" text-anchor="end" fill="#334155">B = 80</text>
  <rect x="150" y="150" width="26" height="22" fill="#bfdbfe" stroke="#2563eb"/>
  <rect x="176" y="150" width="594" height="22" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="790" y="166" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">64468700</text>
  <text x="872" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">上界 133000000</text>

  <text x="140" y="202" font-family="system-ui, sans-serif" font-size="13" text-anchor="end" fill="#334155">B = 160</text>
  <rect x="150" y="186" width="52" height="22" fill="#bfdbfe" stroke="#2563eb"/>
  <rect x="202" y="186" width="299" height="22" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="790" y="202" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">36489751</text>
  <text x="872" y="202" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">上界 78500000</text>

  <text x="140" y="238" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#14532d">B = 316</text>
  <rect x="150" y="222" width="102" height="22" fill="#bfdbfe" stroke="#2563eb"/>
  <rect x="252" y="222" width="152" height="22" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="790" y="238" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#14532d">26376900</text>
  <text x="872" y="238" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">上界 63245569</text>

  <text x="140" y="274" font-family="system-ui, sans-serif" font-size="13" text-anchor="end" fill="#334155">B = 640</text>
  <rect x="150" y="258" width="205" height="22" fill="#bfdbfe" stroke="#2563eb"/>
  <rect x="355" y="258" width="76" height="22" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="790" y="274" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">29172641</text>
  <text x="872" y="274" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">上界 79625000</text>

  <text x="140" y="310" font-family="system-ui, sans-serif" font-size="13" text-anchor="end" fill="#334155">B = 1250</text>
  <rect x="150" y="294" width="398" height="22" fill="#bfdbfe" stroke="#2563eb"/>
  <rect x="548" y="294" width="39" height="22" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="790" y="310" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">45477109</text>
  <text x="872" y="310" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">上界 133000000</text>

  <line x1="150" y1="326" x2="770" y2="326" stroke="#94a3b8" stroke-width="1"/>
  <line x1="150" y1="318" x2="150" y2="330" stroke="#94a3b8" stroke-width="1"/>
  <line x1="770" y1="318" x2="770" y2="330" stroke="#94a3b8" stroke-width="1"/>
  <text x="600" y="320" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">620 像素 = 64468700 步</text>

  <rect x="40" y="348" width="920" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="370" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">B. 同一个 B = 316：奇偶排序开 / 关（seed = 7，与 A 栏同一比例尺，数据取自【二】）</text>

  <text x="140" y="408" font-family="system-ui, sans-serif" font-size="13" text-anchor="end" fill="#334155">关奇偶</text>
  <rect x="150" y="392" width="403" height="24" fill="#fecaca" stroke="#dc2626"/>
  <text x="565" y="408" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">降幅 37.1%</text>
  <text x="790" y="408" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#991b1b">41923045</text>

  <text x="140" y="446" font-family="system-ui, sans-serif" font-size="13" text-anchor="end" fill="#334155">开奇偶</text>
  <rect x="150" y="430" width="254" height="24" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="414" y="446" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">与 A 栏 B = 316 那行等长</text>
  <text x="790" y="446" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#14532d">26376900</text>

  <text x="60" y="478" font-family="system-ui, sans-serif" font-size="12" fill="#475569">块越小（B = 80）关奇偶越亏：124545330 步 vs 64468700 步，降幅 48.2%；块越大越省得少，B = 1250 只降 7.8%</text>

  <rect x="40" y="514" width="920" height="100" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="60" y="540" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">口径：统计的是指针移动步数（等于 add/del 调用次数），不含计时；√n = 316，n = q = 100000，B 为块大小</text>
  <text x="60" y="564" font-family="system-ui, sans-serif" font-size="13" fill="#334155">三个 seed 的波动：B = 316 的总步数 26376900 ~ 26390477，跨度不到 0.06% → 只断言趋势，不断言严格单调</text>
  <text x="60" y="588" font-family="system-ui, sans-serif" font-size="13" fill="#334155">⚠️ 条长是步数不是耗时；复杂度结论仍看 O((n+q)√n)，理论上界只是上界（B = 316 实测约 63245569 的 0.42 倍）</text>
</svg>
