<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="40" y="44" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#0f172a">朴素做法与离线分治的代价对比：两组实测计数放在一起看</text>
  <text x="40" y="72" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">读数全部抄正文第三节（实验一）与第六节（实验二）的实测块；Go 1.26.8（linux/amd64，golang:1.26-alpine）容器实跑</text>

  <rect x="40" y="92" width="920" height="160" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="116" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">A. 实验一 · 三维偏序：n = 8000 个点，b、c 维取 [1,4000]（含大量并列）</text>

  <text x="60" y="146" font-family="system-ui, sans-serif" font-size="13" fill="#334155">暴力：两两比较</text>
  <rect x="250" y="132" width="620" height="20" fill="#fee2e2" stroke="#dc2626"/>
  <text x="880" y="147" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#991b1b">31 996 000</text>

  <text x="60" y="184" font-family="system-ui, sans-serif" font-size="13" fill="#334155">CDQ：BIT add/sum</text>
  <rect x="250" y="170" width="3" height="20" fill="#dcfce7" stroke="#16a34a"/>
  <text x="880" y="185" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#14532d">145 710</text>
  <text x="640" y="185" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">约 220 分之一</text>

  <text x="60" y="216" font-family="system-ui, sans-serif" font-size="13" fill="#334155">两法结果一致：偏序对都是 8 056 633 组　｜　双指针比较 = 归并比较 = 93 659 次</text>
  <text x="60" y="238" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">暴力 = n(n−1)/2 的 O(n²) 样子；CDQ 的 BIT 操作 ≈ n log n 量级，多出来的那个 log 全在树状数组上</text>

  <rect x="40" y="268" width="920" height="160" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="292" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">B. 实验二 · 区间第 k 小：n = 1000 个整数（值域 [1,100000]），q = 500 个查询</text>

  <text x="60" y="322" font-family="system-ui, sans-serif" font-size="13" fill="#334155">逐个二分：累计扫描</text>
  <rect x="250" y="308" width="620" height="20" fill="#fee2e2" stroke="#dc2626"/>
  <text x="880" y="323" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#991b1b">2 777 904</text>

  <text x="60" y="360" font-family="system-ui, sans-serif" font-size="13" fill="#334155">整体二分：BIT add/sum</text>
  <rect x="250" y="346" width="8" height="20" fill="#dcfce7" stroke="#16a34a"/>
  <text x="880" y="361" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#14532d">33 672</text>
  <text x="640" y="361" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">约 82.5 分之一</text>

  <text x="60" y="392" font-family="system-ui, sans-serif" font-size="13" fill="#334155">两法答案逐个一致：校验和 = 24 906 082　｜　逐个二分的 check 8 350 次 ≈ 500 × 17</text>
  <text x="60" y="414" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">逐个二分的扫描量随区间长度线性增长；整体二分的 O((n + Q) log V) 与区间长度无关，区间越长差距越大</text>

  <rect x="40" y="444" width="920" height="64" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="60" y="470" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">⚠️ 220 与 82.5 不能直接比大小：两组实验的规模、区间长度、值域都不同（第八节「实验设计」的坑）</text>
  <text x="60" y="494" font-family="system-ui, sans-serif" font-size="13" fill="#334155">稳定的判据是增长率：CDQ ≈ n log n 量级（与 n² 拉开），整体二分与区间长度无关</text>
</svg>
