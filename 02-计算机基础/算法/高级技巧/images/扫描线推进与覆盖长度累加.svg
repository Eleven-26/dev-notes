<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">扫描线推进：事件竖线把 x 轴切成三段</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">两个矩形 R1=[1,1]-[4,3]、R2=[2,2]-[5,4]，读数抄正文第二节手推表</text>

  <g transform="translate(20,88)">
    <rect x="0" y="0" width="960" height="452" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>

    <line x1="70" y1="340" x2="905" y2="340" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="70" y1="90" x2="70" y2="340" stroke="#cbd5e1" stroke-width="1"/>
    <text x="78" y="102" font-size="9.5" fill="#64748b">y（值域，左闭右开）</text>
    <text x="900" y="330" text-anchor="end" font-size="9.5" fill="#64748b">x（扫描方向从左到右）</text>

    <rect x="205" y="190" width="405" height="100" fill="#dbeafe" fill-opacity="0.45" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="340" y="140" width="405" height="100" fill="#dcfce7" fill-opacity="0.45" stroke="#16a34a" stroke-width="1.5"/>
    <text x="250" y="245" font-size="11" font-weight="bold" fill="#1e40af">R1</text>
    <text x="677" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">R2</text>
    <text x="475" y="230" text-anchor="middle" font-size="9.5" fill="#92400e">重叠区 [2,4)×[1,3)</text>

    <line x1="205" y1="90" x2="205" y2="340" stroke="#16a34a" stroke-width="2"/>
    <line x1="340" y1="90" x2="340" y2="340" stroke="#16a34a" stroke-width="2"/>
    <line x1="610" y1="90" x2="610" y2="340" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="745" y1="90" x2="745" y2="340" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>

    <text x="205" y="82" text-anchor="middle" font-size="9.5" fill="#16a34a">x=1 入边 +1</text>
    <text x="340" y="82" text-anchor="middle" font-size="9.5" fill="#16a34a">x=2 入边 +1</text>
    <text x="610" y="82" text-anchor="middle" font-size="9.5" fill="#dc2626">x=4 出边 -1</text>
    <text x="745" y="82" text-anchor="middle" font-size="9.5" fill="#dc2626">x=5 出边 -1</text>

    <rect x="266" y="190" width="7" height="100" fill="#16a34a"/>
    <rect x="441" y="140" width="7" height="150" fill="#16a34a"/>
    <rect x="643" y="140" width="7" height="100" fill="#16a34a"/>
    <text x="279" y="235" font-size="9" fill="#14532d">y [1,3)</text>
    <text x="454" y="198" font-size="9" fill="#14532d">y [1,4)</text>
    <text x="656" y="215" font-size="9" fill="#14532d">y [2,4)</text>

    <text x="205" y="358" text-anchor="middle" font-size="9.5" fill="#64748b">1</text>
    <text x="340" y="358" text-anchor="middle" font-size="9.5" fill="#64748b">2</text>
    <text x="475" y="358" text-anchor="middle" font-size="9.5" fill="#64748b">3</text>
    <text x="610" y="358" text-anchor="middle" font-size="9.5" fill="#64748b">4</text>
    <text x="745" y="358" text-anchor="middle" font-size="9.5" fill="#64748b">5</text>
    <text x="880" y="358" text-anchor="middle" font-size="9.5" fill="#64748b">6</text>

    <text x="14" y="382" font-size="10" font-weight="bold" fill="#1e40af">被覆盖长度</text>
    <text x="272" y="382" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">2</text>
    <text x="475" y="382" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">3</text>
    <text x="677" y="382" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">2</text>

    <text x="14" y="402" font-size="10" fill="#334155">段贡献</text>
    <text x="272" y="402" text-anchor="middle" font-size="10" fill="#334155">2×1=2</text>
    <text x="475" y="402" text-anchor="middle" font-size="10" fill="#334155">3×2=6</text>
    <text x="677" y="402" text-anchor="middle" font-size="10" fill="#334155">2×1=2</text>

    <text x="14" y="422" font-size="10" fill="#64748b">累计面积</text>
    <text x="272" y="422" text-anchor="middle" font-size="10" fill="#64748b">2</text>
    <text x="475" y="422" text-anchor="middle" font-size="10" fill="#64748b">8</text>
    <text x="677" y="422" text-anchor="middle" font-size="10" fill="#64748b">10</text>

    <text x="14" y="444" font-size="10" fill="#64748b">校验：R1 = 3×2 = 6，R2 = 3×2 = 6，重叠 = 2×1 = 2 → 并集 = 6 + 6 - 2 = 10 ✓</text>
  </g>
</svg>
