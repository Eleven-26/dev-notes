<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">莫队：一次询问的四段指针推进与复杂度来源</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">左栏对应第三节模板的四个 for（先扩再缩）；右栏对应第四节的复杂度两本账</text>

  <g transform="translate(20,88)">
    <rect x="0" y="0" width="470" height="360" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 从 [l, r] 走到 [q.l, q.r]</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">四段顺序不影响正确性、只影响常数，通常先扩再缩</text>

    <rect x="14" y="58" width="442" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="75" font-size="11" font-weight="bold" fill="#1e40af">① 左扩：for l &gt; q.l { l--; add(l) }</text>
    <text x="28" y="91" font-size="10" fill="#1e40af">左边界越过目标左端之前，逐个 add</text>

    <rect x="14" y="112" width="442" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="129" font-size="11" font-weight="bold" fill="#1e40af">② 右扩：for r &lt; q.r { r++; add(r) }</text>
    <text x="28" y="145" font-size="10" fill="#1e40af">右边界未到目标右端之前，逐个 add</text>

    <rect x="14" y="166" width="442" height="40" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="183" font-size="11" font-weight="bold" fill="#92400e">③ 左缩：for l &lt; q.l { del(l); l++ }</text>
    <text x="28" y="199" font-size="10" fill="#92400e">左边多出元素，先 del 再右移</text>

    <rect x="14" y="220" width="442" height="40" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="237" font-size="11" font-weight="bold" fill="#92400e">④ 右缩：for r &gt; q.r { del(r); r-- }</text>
    <text x="28" y="253" font-size="10" fill="#92400e">右边多出元素，先 del 再左移</text>

    <rect x="14" y="274" width="442" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="291" font-size="11" font-weight="bold" fill="#14532d">⑤ 落答案：ans[q.id] = curAns</text>
    <text x="28" y="307" font-size="10" fill="#14532d">q.id 记录原始下标，排序不乱序（第八节坑）</text>

    <line x1="235" y1="98" x2="235" y2="112" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="235" y1="152" x2="235" y2="166" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="235" y1="206" x2="235" y2="220" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="235" y1="260" x2="235" y2="274" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <text x="14" y="338" font-size="10.5" fill="#64748b">add / del 是插件位：换掉计数结构就换一类统计</text>
  </g>

  <g transform="translate(510,88)">
    <rect x="0" y="0" width="470" height="360" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. O((n+q)√n) 来自两本账</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">左指针按「每次查询」计，右指针按「每块」计</text>

    <rect x="14" y="58" width="442" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="80" font-size="11.5" font-weight="bold" fill="#1e40af">左指针：每次查询移动 ≤ 块大小 √n</text>
    <text x="28" y="102" font-size="10" fill="#1e40af">q 次查询 → 共 O(q√n)</text>

    <rect x="14" y="132" width="442" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="154" font-size="11.5" font-weight="bold" fill="#14532d">右指针：块内单调移动 ≤ n，跨块才重置</text>
    <text x="28" y="176" font-size="10" fill="#14532d">共 √n 块 → 总计 O(n√n)</text>

    <rect x="14" y="206" width="442" height="58" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="228" font-size="11" font-weight="bold" fill="#92400e">两项相加 + O(q log q) 排序（忽略 log 项）</text>
    <text x="28" y="250" font-size="10" fill="#92400e">→ O((n+q)√n)</text>

    <rect x="14" y="278" width="442" height="66" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="28" y="300" font-size="11" font-weight="bold" fill="#991b1b">不做奇偶排序的代价</text>
    <text x="28" y="322" font-size="10" fill="#991b1b">跨块后右指针从 n 折回 0，常数显著变大</text>
  </g>
</svg>
