<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一次区间修改：左散块、中间整块、右散块</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">三段划分抄正文第二节表格；执行顺序抄 3.2 的 update 代码</text>

  <g transform="translate(20,88)">
    <rect x="0" y="0" width="960" height="126" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="22" font-size="14" font-weight="bold" fill="#0f172a">A. 区间 [2, 8] 落在 9 个元素 / 3 个块上（示意）</text>

    <text x="329" y="42" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">l = 2</text>
    <text x="641" y="42" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">r = 8</text>
    <line x1="329" y1="46" x2="329" y2="55" stroke="#b45309" stroke-width="1.5"/>
    <line x1="641" y1="46" x2="641" y2="55" stroke="#b45309" stroke-width="1.5"/>

    <rect x="252" y="58" width="50" height="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="277" y="75" text-anchor="middle" font-size="9.5" fill="#64748b">a[1]</text>
    <rect x="304" y="58" width="50" height="26" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="4"/>
    <text x="329" y="75" text-anchor="middle" font-size="9.5" fill="#92400e">a[2]</text>
    <rect x="356" y="58" width="50" height="26" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="4"/>
    <text x="381" y="75" text-anchor="middle" font-size="9.5" fill="#92400e">a[3]</text>
    <rect x="408" y="58" width="50" height="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="4"/>
    <text x="433" y="75" text-anchor="middle" font-size="9.5" fill="#1e40af">a[4]</text>
    <rect x="460" y="58" width="50" height="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="4"/>
    <text x="485" y="75" text-anchor="middle" font-size="9.5" fill="#1e40af">a[5]</text>
    <rect x="512" y="58" width="50" height="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="4"/>
    <text x="537" y="75" text-anchor="middle" font-size="9.5" fill="#1e40af">a[6]</text>
    <rect x="564" y="58" width="50" height="26" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="4"/>
    <text x="589" y="75" text-anchor="middle" font-size="9.5" fill="#92400e">a[7]</text>
    <rect x="616" y="58" width="50" height="26" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="4"/>
    <text x="641" y="75" text-anchor="middle" font-size="9.5" fill="#92400e">a[8]</text>
    <rect x="668" y="58" width="50" height="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="693" y="75" text-anchor="middle" font-size="9.5" fill="#64748b">a[9]</text>

    <line x1="304" y1="92" x2="406" y2="92" stroke="#b45309" stroke-width="1.5"/>
    <line x1="408" y1="92" x2="562" y2="92" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="564" y1="92" x2="666" y2="92" stroke="#b45309" stroke-width="1.5"/>

    <text x="355" y="110" text-anchor="middle" font-size="9.5" fill="#92400e">左散块：逐元素</text>
    <text x="485" y="110" text-anchor="middle" font-size="9.5" fill="#1e40af">整块 2：lazy 与 sum</text>
    <text x="615" y="110" text-anchor="middle" font-size="9.5" fill="#92400e">右散块：逐元素</text>
  </g>

  <g transform="translate(20,236)">
    <rect x="0" y="0" width="960" height="226" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. update(l, r, v) 的执行顺序（对应正文 3.2 代码）</text>

    <rect x="14" y="38" width="200" height="150" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="28" y="60" font-size="11.5" font-weight="bold" fill="#334155">① 同块判断</text>
    <text x="28" y="80" font-size="9.5" fill="#334155">bel[l] == bel[r] ？</text>
    <text x="28" y="98" font-size="9.5" fill="#334155">是 → [l, r] 逐元素</text>
    <text x="28" y="116" font-size="9.5" fill="#334155">改完后直接 return</text>
    <text x="28" y="138" font-size="9.5" fill="#64748b">（3.2 代码第一段 if）</text>

    <line x1="216" y1="113" x2="234" y2="113" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="236" y="38" width="200" height="150" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="250" y="60" font-size="11.5" font-weight="bold" fill="#92400e">② 左端散块</text>
    <text x="250" y="80" font-size="9.5" fill="#92400e">i = l .. br[bel[l]]</text>
    <text x="250" y="98" font-size="9.5" fill="#92400e">a[i] += v</text>
    <text x="250" y="116" font-size="9.5" fill="#92400e">sum[bel[i]] += v</text>

    <line x1="438" y1="113" x2="456" y2="113" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="458" y="38" width="230" height="150" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="472" y="60" font-size="11.5" font-weight="bold" fill="#1e40af">③ 中间整块</text>
    <text x="472" y="80" font-size="9.5" fill="#1e40af">b = bel[l]+1 .. bel[r]-1</text>
    <text x="472" y="98" font-size="9.5" fill="#1e40af">sum[b] += v × (br[b]-bl[b]+1)</text>
    <text x="472" y="116" font-size="9.5" fill="#1e40af">lazy[b] += v</text>
    <text x="472" y="134" font-size="9.5" fill="#1e40af">（不逐个碰 a[i]）</text>

    <line x1="690" y1="113" x2="708" y2="113" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="710" y="38" width="236" height="150" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="724" y="60" font-size="11.5" font-weight="bold" fill="#92400e">④ 右端散块</text>
    <text x="724" y="80" font-size="9.5" fill="#92400e">i = bl[bel[r]] .. r</text>
    <text x="724" y="98" font-size="9.5" fill="#92400e">同 ②，逐元素改 a 与 sum</text>

    <text x="14" y="212" font-size="10" fill="#64748b">散块至多 2s 个元素 + 整块至多 n/s 块 → s = √n 时单次操作 O(√n)（正文第二节的取值结论）</text>
  </g>
</svg>
