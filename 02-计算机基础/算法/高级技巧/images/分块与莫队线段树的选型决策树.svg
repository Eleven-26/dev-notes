<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">
  <defs>
    <marker id="fbArw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="40" y="44" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#0f172a">区间问题三把刀怎么选：三问决策树</text>
  <text x="40" y="72" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">判据抄第一节「什么时候用」与第六节判据，块大小分支抄第四节表，复杂度口径抄第六节表</text>

  <rect x="60" y="98" width="260" height="52" rx="9" fill="#fef3c7" stroke="#b45309"/>
  <text x="76" y="120" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#92400e">① 聚合信息满足结合律？</text>
  <text x="76" y="140" font-family="system-ui, sans-serif" font-size="12.5" fill="#92400e">区间和满足，众数与计数不满足</text>

  <rect x="380" y="98" width="560" height="52" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="396" y="120" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e40af">线段树 / 树状数组</text>
  <text x="396" y="140" font-family="system-ui, sans-serif" font-size="12.5" fill="#1e40af">每次 O(log n)，在线，常数小；典型：区间加 + 区间和</text>

  <line x1="320" y1="124" x2="376" y2="124" stroke="#94a3b8" stroke-width="2" marker-end="url(#fbArw)"/>
  <text x="330" y="116" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#16a34a">满足</text>
  <line x1="190" y1="150" x2="190" y2="186" stroke="#94a3b8" stroke-width="2" marker-end="url(#fbArw)"/>
  <text x="200" y="172" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#dc2626">不满足</text>

  <rect x="60" y="190" width="260" height="52" rx="9" fill="#fef3c7" stroke="#b45309"/>
  <text x="76" y="212" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#92400e">② 这批查询能离线吗？</text>
  <text x="76" y="232" font-family="system-ui, sans-serif" font-size="12.5" fill="#92400e">必须在线，莫队直接出局</text>

  <rect x="380" y="190" width="560" height="52" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="396" y="212" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">莫队</text>
  <text x="396" y="232" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">整体 O((n+q)√n)，只能离线，灵活性极高</text>

  <line x1="320" y1="216" x2="376" y2="216" stroke="#94a3b8" stroke-width="2" marker-end="url(#fbArw)"/>
  <text x="336" y="208" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#16a34a">能离线</text>
  <line x1="190" y1="242" x2="190" y2="278" stroke="#94a3b8" stroke-width="2" marker-end="url(#fbArw)"/>
  <text x="200" y="264" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#dc2626">必须在线</text>

  <rect x="60" y="282" width="260" height="52" rx="9" fill="#fef3c7" stroke="#b45309"/>
  <text x="76" y="304" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#92400e">③ n ≤ 1e5，O(n√n) 能过？</text>
  <text x="76" y="324" font-family="system-ui, sans-serif" font-size="12.5" fill="#92400e">第一节的第三个条件</text>

  <rect x="380" y="282" width="560" height="52" rx="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="396" y="304" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#14532d">⭐ 分块：每次 O(√n)，在线且灵活</text>
  <text x="396" y="324" font-family="system-ui, sans-serif" font-size="12.5" fill="#14532d">典型：区间众数 / 第 K 小 / 出现次数 / mex（第五节）</text>

  <line x1="320" y1="308" x2="376" y2="308" stroke="#94a3b8" stroke-width="2" marker-end="url(#fbArw)"/>
  <text x="336" y="300" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#16a34a">能过</text>
  <line x1="190" y1="334" x2="190" y2="370" stroke="#94a3b8" stroke-width="2" marker-end="url(#fbArw)"/>
  <text x="200" y="356" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#dc2626">过不了</text>

  <rect x="60" y="374" width="260" height="56" rx="9" fill="#fee2e2" stroke="#dc2626"/>
  <text x="76" y="396" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#991b1b">三问都不成立</text>
  <text x="76" y="416" font-family="system-ui, sans-serif" font-size="12.5" fill="#991b1b">块状链表等进阶，本篇不展开</text>

  <line x1="660" y1="334" x2="660" y2="370" stroke="#94a3b8" stroke-width="2" marker-end="url(#fbArw)"/>
  <text x="670" y="356" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748b">选定分块后定 s</text>

  <rect x="380" y="374" width="560" height="112" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="396" y="398" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">块大小 s 按操作比例微调（第四节表）</text>
  <text x="396" y="420" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">通用区间操作 → s = √n</text>
  <text x="396" y="440" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">修改多、查询少 → 稍小（摊薄散块代价）</text>
  <text x="396" y="460" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">查询多、修改少 → 稍大（摊薄整块代价）</text>
  <text x="396" y="480" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">混合操作 + 块内暴力 → 常用 n / √m 或 √n</text>

  <text x="60" y="522" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">代价口径：一次操作 = O(散块长度) + O(块数) = O(2s + n/s)，s = √n 时取最小 O(√n)；实际常数比线段树大，但代码短</text>
</svg>
