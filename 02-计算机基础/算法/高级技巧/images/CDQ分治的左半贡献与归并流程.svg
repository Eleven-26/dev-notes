<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <marker id="cdqArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="40" y="44" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#0f172a">CDQ 分治：递归两半，只统计「左半 → 右半」</text>
  <text x="40" y="72" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">第一维排序后，跨半的偏序在那一维自动成立；左半内部与右半内部的贡献交给各自的递归</text>

  <text x="60" y="114" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#2563eb">分治树（按第一维 a 有序）</text>
  <rect x="180" y="130" width="130" height="40" rx="8" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="245" y="156" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e40af" text-anchor="middle">[1, 8]</text>
  <line x1="215" y1="170" x2="145" y2="202" stroke="#94a3b8" stroke-width="2" marker-end="url(#cdqArrow)"/>
  <line x1="275" y1="170" x2="345" y2="202" stroke="#94a3b8" stroke-width="2" marker-end="url(#cdqArrow)"/>
  <rect x="80" y="206" width="130" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="145" y="232" font-family="system-ui, sans-serif" font-size="14" fill="#334155" text-anchor="middle">[1, 4]</text>
  <rect x="280" y="206" width="130" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="345" y="232" font-family="system-ui, sans-serif" font-size="14" fill="#334155" text-anchor="middle">[5, 8]</text>
  <line x1="115" y1="246" x2="80" y2="276" stroke="#94a3b8" stroke-width="2" marker-end="url(#cdqArrow)"/>
  <line x1="175" y1="246" x2="200" y2="276" stroke="#94a3b8" stroke-width="2" marker-end="url(#cdqArrow)"/>
  <line x1="315" y1="246" x2="300" y2="276" stroke="#94a3b8" stroke-width="2" marker-end="url(#cdqArrow)"/>
  <line x1="375" y1="246" x2="420" y2="276" stroke="#94a3b8" stroke-width="2" marker-end="url(#cdqArrow)"/>
  <rect x="40" y="280" width="80" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="80" y="303" font-family="system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="middle">[1, 2]</text>
  <rect x="160" y="280" width="80" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="200" y="303" font-family="system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="middle">[3, 4]</text>
  <rect x="260" y="280" width="80" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="300" y="303" font-family="system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="middle">[5, 6]</text>
  <rect x="380" y="280" width="80" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="420" y="303" font-family="system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="middle">[7, 8]</text>
  <text x="60" y="348" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">共 log n 层；每层的跨半统计是 O(n log n)</text>

  <line x1="490" y1="100" x2="490" y2="470" stroke="#e2e8f0" stroke-width="1"/>

  <text x="520" y="114" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#16a34a">每一层里：把「左半 → 右半」一次算完</text>
  <rect x="520" y="128" width="440" height="58" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="538" y="152" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">① 先递归两半</text>
  <text x="538" y="174" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">递归返回时，左右两半各自已按第二维 b 升序排好</text>
  <rect x="520" y="196" width="440" height="58" rx="9" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="538" y="220" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#166534">② 双指针扫两半</text>
  <text x="538" y="242" font-family="system-ui, sans-serif" font-size="13" fill="#166534">b_left ≤ b_right 的左半点 → BIT.add(c, +1)</text>
  <rect x="520" y="264" width="440" height="58" rx="9" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="538" y="288" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e40af">③ 每个右半点 j 计数</text>
  <text x="538" y="310" font-family="system-ui, sans-serif" font-size="13" fill="#1e40af">ans += BIT.sum(c_j)　（此时 BIT 里只有 b 合法的左半点）</text>
  <rect x="520" y="332" width="440" height="58" rx="9" fill="#ffedd5" stroke="#fed7aa"/>
  <text x="538" y="356" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#b45309">④ 撤销 BIT + 归并两半</text>
  <text x="538" y="378" font-family="system-ui, sans-serif" font-size="13" fill="#b45309">撤销后 [l, r] 按 b 有序，供上一层复用</text>

  <rect x="40" y="410" width="920" height="86" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="60" y="436" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">⭐ 三个关键点：① 必须先递归后统计（双指针依赖递归归并出的有序性）</text>
  <text x="60" y="458" font-family="system-ui, sans-serif" font-size="14" fill="#334155">② 当前层只统计「跨半」—— 左右内部已在递归里算过，这样才「不重不漏」</text>
  <text x="60" y="480" font-family="system-ui, sans-serif" font-size="14" fill="#334155">③ 第一维已排序 ⇒ 跨半的 a 维自动满足，分治顶掉的就是这一维</text>
</svg>
