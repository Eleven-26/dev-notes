<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
  <defs>
    <marker id="oeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="40" y="44" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#0f172a">整体二分：分的是「答案值域」，一次切完所有查询</text>
  <text x="40" y="72" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">把所有操作摆成一列；每层扫一遍，按「答案落不落在 ≤ mid」把操作分成两组，递归下去</text>

  <rect x="40" y="92" width="920" height="54" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="116" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">操作序列（离线）：n 个插入 (pos, val) ＋ Q 个查询 (l, r, k)</text>
  <text x="60" y="137" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">树状数组维护「当前哪些位置的值 ≤ mid」，它只做区间计数</text>

  <rect x="180" y="176" width="640" height="46" rx="8" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="200" y="205" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e40af">lo</text>
  <text x="500" y="205" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">mid</text>
  <text x="800" y="205" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e40af" text-anchor="end">hi</text>
  <line x1="500" y1="176" x2="500" y2="222" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="500" y="166" font-family="system-ui, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">二分答案：mid = (lo + hi) / 2</text>

  <line x1="400" y1="224" x2="262" y2="266" stroke="#94a3b8" stroke-width="2" marker-end="url(#oeArrow)"/>
  <line x1="600" y1="224" x2="738" y2="266" stroke="#94a3b8" stroke-width="2" marker-end="url(#oeArrow)"/>

  <rect x="60" y="270" width="400" height="122" rx="10" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="80" y="296" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#166534">左组：答案 ∈ [lo, mid]</text>
  <text x="80" y="322" font-family="system-ui, sans-serif" font-size="13" fill="#166534">· 插入：val ≤ mid（同时 BIT.add(pos, +1)）</text>
  <text x="80" y="346" font-family="system-ui, sans-serif" font-size="13" fill="#166534">· 查询：c = BIT.sum(r) − BIT.sum(l−1)</text>
  <text x="80" y="370" font-family="system-ui, sans-serif" font-size="13" fill="#166534">　　　　 c ≥ k ⇒ 第 k 小就在左半边</text>

  <rect x="540" y="270" width="400" height="122" rx="10" fill="#ffedd5" stroke="#fed7aa"/>
  <text x="560" y="296" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#b45309">右组：答案 ∈ [mid+1, hi]</text>
  <text x="560" y="322" font-family="system-ui, sans-serif" font-size="13" fill="#b45309">· 插入：val &gt; mid（不进 BIT）</text>
  <text x="560" y="346" font-family="system-ui, sans-serif" font-size="13" fill="#b45309">· 查询：c &lt; k ⇒ 答案在右半边</text>
  <text x="560" y="370" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#dc2626">　　　　 ⚠️ 分到右组前必须 k -= c</text>

  <rect x="60" y="404" width="880" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="80" y="427" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">递归 solve(左组, lo, mid) 与 solve(右组, mid+1, hi)；lo == hi 时把答案落在这一组的查询上</text>
  <text x="80" y="447" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">⚠️ 每层结束要把本层插进 BIT 的左组插入全部撤销 —— 右组递归时不该看到它们</text>
</svg>
