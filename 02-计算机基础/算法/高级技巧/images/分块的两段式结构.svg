<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">分块的两段式结构：散块逐元素、整块动聚合</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">块结构与字段抄正文 3.1 模板；「散块 / 整块」口径抄第二、三节</text>

  <g transform="translate(20,88)">
    <rect x="0" y="0" width="960" height="224" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="20" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 块结构与两套记账（示意：n = 10，块大小 s = 3）</text>

    <text x="14" y="104" font-size="10" fill="#64748b">逐元素</text>
    <text x="14" y="152" font-size="10" fill="#64748b">整块</text>

    <rect x="150" y="84" width="50" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="4"/>
    <text x="175" y="104" text-anchor="middle" font-size="9.5" fill="#1e40af">a[1]</text>
    <rect x="202" y="84" width="50" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="4"/>
    <text x="227" y="104" text-anchor="middle" font-size="9.5" fill="#1e40af">a[2]</text>
    <rect x="254" y="84" width="50" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="4"/>
    <text x="279" y="104" text-anchor="middle" font-size="9.5" fill="#1e40af">a[3]</text>
    <rect x="306" y="84" width="50" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="4"/>
    <text x="331" y="104" text-anchor="middle" font-size="9.5" fill="#1e40af">a[4]</text>
    <rect x="358" y="84" width="50" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="4"/>
    <text x="383" y="104" text-anchor="middle" font-size="9.5" fill="#1e40af">a[5]</text>
    <rect x="410" y="84" width="50" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="4"/>
    <text x="435" y="104" text-anchor="middle" font-size="9.5" fill="#1e40af">a[6]</text>
    <rect x="462" y="84" width="50" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="4"/>
    <text x="487" y="104" text-anchor="middle" font-size="9.5" fill="#1e40af">a[7]</text>
    <rect x="514" y="84" width="50" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="4"/>
    <text x="539" y="104" text-anchor="middle" font-size="9.5" fill="#1e40af">a[8]</text>
    <rect x="566" y="84" width="50" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="4"/>
    <text x="591" y="104" text-anchor="middle" font-size="9.5" fill="#1e40af">a[9]</text>
    <rect x="618" y="84" width="50" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="4"/>
    <text x="643" y="104" text-anchor="middle" font-size="9.5" fill="#92400e">a[10]</text>

    <rect x="150" y="122" width="152" height="10" fill="#cbd5e1" rx="3"/>
    <rect x="304" y="122" width="152" height="10" fill="#cbd5e1" rx="3"/>
    <rect x="458" y="122" width="152" height="10" fill="#cbd5e1" rx="3"/>
    <rect x="618" y="122" width="50" height="10" fill="#fca5a5" rx="3"/>

    <text x="226" y="152" text-anchor="middle" font-size="9.5" fill="#64748b">块 1 · bel=1</text>
    <text x="380" y="152" text-anchor="middle" font-size="9.5" fill="#64748b">块 2 · bel=2</text>
    <text x="534" y="152" text-anchor="middle" font-size="9.5" fill="#64748b">块 3 · bel=3</text>
    <text x="643" y="152" text-anchor="middle" font-size="9.5" fill="#64748b">块 4</text>

    <rect x="150" y="164" width="152" height="32" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="226" y="184" text-anchor="middle" font-size="9.5" fill="#14532d">sum[1] · lazy[1]</text>
    <rect x="304" y="164" width="152" height="32" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="380" y="184" text-anchor="middle" font-size="9.5" fill="#14532d">sum[2] · lazy[2]</text>
    <rect x="458" y="164" width="152" height="32" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="534" y="184" text-anchor="middle" font-size="9.5" fill="#14532d">sum[3] · lazy[3]</text>
    <rect x="618" y="164" width="50" height="32" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="6"/>
    <text x="643" y="184" text-anchor="middle" font-size="9.5" fill="#991b1b">sum[4]</text>

    <text x="700" y="184" font-size="9.5" fill="#991b1b">最后一块不满 s，定边界时要单独检查</text>

    <text x="14" y="210" font-size="10" fill="#64748b">记账口径：sum[b] 已含 lazy 贡献；散块里的 a[i] 不含 lazy —— 查询散块元素时要补加 lazy[bel[i]]（正文 3.3 关键点）</text>
  </g>

  <g transform="translate(20,324)">
    <rect x="0" y="0" width="960" height="132" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="20" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 一次操作只有两种走法</text>

    <rect x="14" y="36" width="300" height="82" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="58" font-size="11.5" font-weight="bold" fill="#92400e">散块：逐元素暴力</text>
    <text x="28" y="76" font-size="9.5" fill="#92400e">更新：a[i] += v，同步 sum[bel[i]] += v</text>
    <text x="28" y="94" font-size="9.5" fill="#92400e">查询：累加 a[i] + lazy[bel[i]]</text>

    <rect x="330" y="36" width="300" height="82" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="344" y="58" font-size="11.5" font-weight="bold" fill="#1e40af">整块：动聚合与标记</text>
    <text x="344" y="76" font-size="9.5" fill="#1e40af">更新：sum[b] += v × (br[b]-bl[b]+1)</text>
    <text x="344" y="94" font-size="9.5" fill="#1e40af">同时 lazy[b] += v，不逐个碰 a[i]</text>

    <rect x="646" y="36" width="300" height="82" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="660" y="58" font-size="11.5" font-weight="bold" fill="#334155">一次操作代价</text>
    <text x="660" y="76" font-size="9.5" fill="#334155">O(散块长度) + O(块数) = O(2s + n/s)</text>
    <text x="660" y="94" font-size="9.5" fill="#334155">s = √n 时取最小 O(√n)（正文第二节）</text>
  </g>
</svg>
