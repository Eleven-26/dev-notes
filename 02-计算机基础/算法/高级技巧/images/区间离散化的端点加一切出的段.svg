<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">
  <defs>
    <marker id="dsArw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="40" y="44" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#0f172a">区间离散化：r+1 进不进坐标集，轴被切成的段就不一样</text>
  <text x="40" y="72" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">样例 [2,7] += 5、[4,9] += 3；A、B 两栏的坐标集、段账与判定全部抄 3.1 节的实测输出（Go 1.26.8）</text>

  <rect x="142" y="92" width="410" height="18" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="150" y="106" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e40af">区间 [2,7] += 5　（l = 2，r = 7，r+1 = 8）</text>
  <rect x="306" y="116" width="410" height="18" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="314" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#14532d">区间 [4,9] += 3　（l = 4，r = 9，r+1 = 10）</text>

  <line x1="60" y1="146" x2="940" y2="146" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dsArw)"/>
  <line x1="60" y1="142" x2="60" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <line x1="142" y1="142" x2="142" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <line x1="224" y1="142" x2="224" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <line x1="306" y1="142" x2="306" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <line x1="388" y1="142" x2="388" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <line x1="470" y1="142" x2="470" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <line x1="552" y1="142" x2="552" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <line x1="634" y1="142" x2="634" y2="150" stroke="#dc2626" stroke-width="2"/>
  <line x1="716" y1="142" x2="716" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <line x1="798" y1="142" x2="798" y2="150" stroke="#dc2626" stroke-width="2"/>
  <line x1="880" y1="142" x2="880" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <text x="60" y="166" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">1</text>
  <text x="142" y="166" font-family="system-ui, sans-serif" font-size="12" fill="#334155" text-anchor="middle">2</text>
  <text x="224" y="166" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">3</text>
  <text x="306" y="166" font-family="system-ui, sans-serif" font-size="12" fill="#334155" text-anchor="middle">4</text>
  <text x="388" y="166" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">5</text>
  <text x="470" y="166" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">6</text>
  <text x="552" y="166" font-family="system-ui, sans-serif" font-size="12" fill="#334155" text-anchor="middle">7</text>
  <text x="634" y="166" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">8</text>
  <text x="716" y="166" font-family="system-ui, sans-serif" font-size="12" fill="#334155" text-anchor="middle">9</text>
  <text x="798" y="166" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">10</text>
  <text x="880" y="166" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">11</text>
  <text x="60" y="186" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">红色刻度就是两个 r+1 = 8 与 10：A 栏的坐标集里没有它们，B 栏有</text>

  <rect x="40" y="198" width="920" height="156" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="60" y="222" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#991b1b">A. 只把 l 和 r 放进坐标集：坐标 [2 4 7 9]，4 个名次</text>

  <rect x="60" y="234" width="200" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="70" y="252" font-family="system-ui, sans-serif" font-size="12" fill="#334155">名次1 [2,4)</text>
  <text x="70" y="270" font-family="system-ui, sans-serif" font-size="12" fill="#334155">diff=+5 前缀=5</text>
  <rect x="280" y="234" width="200" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="290" y="252" font-family="system-ui, sans-serif" font-size="12" fill="#334155">名次2 [4,7)</text>
  <text x="290" y="270" font-family="system-ui, sans-serif" font-size="12" fill="#334155">diff=+3 前缀=8</text>
  <rect x="500" y="234" width="200" height="44" rx="7" fill="#ffffff" stroke="#dc2626"/>
  <text x="510" y="252" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">名次3 [7,9)</text>
  <text x="510" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">diff=+0 前缀=8</text>
  <rect x="720" y="234" width="200" height="44" rx="7" fill="#ffffff" stroke="#dc2626"/>
  <text x="730" y="252" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">名次4 [9,+inf)</text>
  <text x="730" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">diff=+0 前缀=8</text>

  <text x="60" y="302" font-family="system-ui, sans-serif" font-size="12.5" fill="#991b1b">r+1 = 8 与 10 不在坐标集里，两条 -5、-3 无处落笔被丢弃，于是名次 3、4 的 diff 都是 +0、前缀一直停在 8</text>
  <text x="60" y="326" font-family="system-ui, sans-serif" font-size="12.5" fill="#991b1b">逐点判定：x = 1、3、5、7 一致；x = 8、9、11 得 8、8、8，暴力是 3、3、0　→　❌ 不一致 3 / 7</text>

  <rect x="40" y="366" width="920" height="132" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="60" y="390" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#14532d">B. 把 l 与 r+1 一起放进去：坐标 [2 4 8 10]，同样是 4 个名次</text>

  <rect x="60" y="402" width="200" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="70" y="420" font-family="system-ui, sans-serif" font-size="12" fill="#334155">名次1 [2,4)</text>
  <text x="70" y="438" font-family="system-ui, sans-serif" font-size="12" fill="#334155">diff=+5 前缀=5</text>
  <rect x="280" y="402" width="200" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="290" y="420" font-family="system-ui, sans-serif" font-size="12" fill="#334155">名次2 [4,8)</text>
  <text x="290" y="438" font-family="system-ui, sans-serif" font-size="12" fill="#334155">diff=+3 前缀=8</text>
  <rect x="500" y="402" width="200" height="44" rx="7" fill="#ffffff" stroke="#16a34a"/>
  <text x="510" y="420" font-family="system-ui, sans-serif" font-size="12" fill="#14532d">名次3 [8,10)</text>
  <text x="510" y="438" font-family="system-ui, sans-serif" font-size="12" fill="#14532d">diff=-5 前缀=3</text>
  <rect x="720" y="402" width="200" height="44" rx="7" fill="#ffffff" stroke="#16a34a"/>
  <text x="730" y="420" font-family="system-ui, sans-serif" font-size="12" fill="#14532d">名次4 [10,+inf)</text>
  <text x="730" y="438" font-family="system-ui, sans-serif" font-size="12" fill="#14532d">diff=-3 前缀=0</text>

  <text x="60" y="470" font-family="system-ui, sans-serif" font-size="12.5" fill="#14532d">逐点判定：x = 1、3、5、7、8、9、11 得 0、5、8、8、3、3、0，与暴力逐点一致　→　不一致 0 / 7</text>

  <text x="40" y="524" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">⭐ 名次个数一样，段却不一样：A 切在 7、9 上，B 切在 8、10 上。差分的边界必须正好落在切点上，否则错只出现在越过右端点之后</text>
</svg>
