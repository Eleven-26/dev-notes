<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwG" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">期望的线性性 vs 非线性运算：谁要求独立</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">硬币例与全部公式均出自正文第二节；数字为恒等推演，非实测</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="460" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="15" font-weight="bold" fill="#0f172a">A. 加法随时可拆：指示变量法</text>
    <text x="16" y="52" font-size="10.5" fill="#64748b">抛 3 枚均匀硬币，X = 正面数</text>

    <rect x="14" y="64" width="432" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="28" y="86" font-size="11" font-weight="bold" fill="#1e40af">X = X1 + X2 + X3</text>
    <text x="28" y="106" font-size="10" fill="#1e40af">Xi = 第 i 枚为正面时取 1，否则取 0</text>

    <rect x="14" y="132" width="432" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="28" y="154" font-size="10" fill="#14532d">E(Xi) = 0 × 1/2 + 1 × 1/2 = 1/2</text>
    <text x="28" y="174" font-size="10" fill="#14532d">E(X) = E(X1) + E(X2) + E(X3) = 3/2</text>

    <rect x="14" y="200" width="432" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="222" font-size="10" fill="#334155">对照定义：P(X=0..3) = 1/8, 3/8, 3/8, 1/8</text>
    <text x="28" y="242" font-size="10" fill="#334155">加权和也是 1.5，两条路同结果</text>

    <rect x="14" y="268" width="432" height="62" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <text x="28" y="290" font-size="10.5" font-weight="bold" fill="#92400e">⭐ 拆和是恒等分解，Xi 就算不独立也成立</text>
    <text x="28" y="310" font-size="10.5" fill="#92400e">E(X + Y) = E(X) + E(Y) 无条件成立</text>
  </g>

  <g transform="translate(520,70)">
    <rect x="0" y="0" width="460" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="15" font-weight="bold" fill="#0f172a">B. 这三类运算要付出独立性</text>
    <text x="16" y="52" font-size="10.5" fill="#64748b">对照公式（含协方差项）见正文第二节</text>

    <rect x="14" y="64" width="432" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="28" y="86" font-size="10.5" fill="#991b1b">E(XY) = E(X) × E(Y) + Cov(X, Y)</text>
    <text x="28" y="106" font-size="10.5" fill="#991b1b">Cov = 0（独立）才能拆成期望之积</text>

    <rect x="14" y="132" width="432" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="28" y="154" font-size="10.5" fill="#991b1b">Var(X + Y) = Var(X) + Var(Y) + 2 × Cov(X, Y)</text>
    <text x="28" y="174" font-size="10.5" fill="#991b1b">相关时交叉项不为 0，方差不能简单加</text>

    <rect x="14" y="200" width="432" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="28" y="222" font-size="10.5" fill="#14532d">判据：加法免费（线性性），乘法与方差</text>
    <text x="28" y="242" font-size="10.5" fill="#14532d">要先验独立性；E(aX) = a × E(X) 仍免费</text>

    <rect x="14" y="272" width="432" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="298" font-size="10.5" fill="#334155">E(aX) = a × E(X) 仍是线性，同样不要求独立</text>
  </g>
</svg>
