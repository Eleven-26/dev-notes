<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwG" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">容斥原理：加多就减、减多就加，逐层纠偏</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">三集合示意；一般式与「奇加偶减」抄正文第三节公式</text>

  <g transform="translate(20,88)">
    <rect x="0" y="0" width="460" height="396" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="20" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 圈层形态：先全加，再逐层纠偏</text>
    <text x="20" y="46" font-size="10.5" fill="#64748b">样例为三集合示意；正文公式对任意 n 个集合成立</text>

    <circle cx="150" cy="175" r="100" fill="#dbeafe" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="295" cy="175" r="100" fill="#dbeafe" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="222" cy="278" r="100" fill="#dbeafe" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5"/>

    <text x="105" y="150" text-anchor="middle" font-size="10" fill="#1e40af">A：计 1 次</text>
    <text x="340" y="150" text-anchor="middle" font-size="10" fill="#1e40af">B：计 1 次</text>
    <text x="222" y="345" text-anchor="middle" font-size="10" fill="#1e40af">C：计 1 次</text>
    <text x="222" y="140" text-anchor="middle" font-size="10" fill="#92400e">A∩B：计 2 次</text>
    <text x="150" y="255" text-anchor="middle" font-size="10" fill="#92400e">A∩C：计 2 次</text>
    <text x="295" y="255" text-anchor="middle" font-size="10" fill="#92400e">B∩C：计 2 次</text>
    <text x="222" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">A∩B∩C：计 3 次</text>

    <text x="20" y="390" font-size="10" fill="#64748b">标注 = 完成第一层「加单个集合」后，该区域被计入的次数</text>
  </g>

  <g transform="translate(500,88)">
    <rect x="0" y="0" width="480" height="396" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="20" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 逐层纠偏：奇加偶减</text>
    <text x="20" y="46" font-size="10.5" fill="#64748b">每层把上一层多算的减回来、少算的加回来</text>

    <rect x="14" y="60" width="452" height="62" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="82" font-size="11.5" font-weight="bold" fill="#1e40af">① 加每个单个集合：Σ|Ai|</text>
    <text x="28" y="102" font-size="10" fill="#1e40af">二重交集元素被加了 2 次，三重交集被加了 3 次</text>

    <line x1="240" y1="122" x2="240" y2="134" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="14" y="136" width="452" height="62" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="158" font-size="11.5" font-weight="bold" fill="#92400e">② 减每两两交集：Σ|Ai ∩ Aj|</text>
    <text x="28" y="178" font-size="10" fill="#92400e">二重交集回到 1 次；三重交集 3 − 3 = 0，减过头</text>

    <line x1="240" y1="198" x2="240" y2="210" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>

    <rect x="14" y="212" width="452" height="62" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="234" font-size="11.5" font-weight="bold" fill="#14532d">③ 补回三重交集：+ |A ∩ B ∩ C|</text>
    <text x="28" y="254" font-size="10" fill="#14532d">三重交集回到 1 次，并集里每个元素恰好计 1 次</text>

    <rect x="14" y="286" width="452" height="86" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="28" y="308" font-size="11.5" font-weight="bold" fill="#334155">一般式（正文第三节公式）</text>
    <text x="28" y="328" font-size="10" fill="#334155">|A1 ∪ A2 ∪ … ∪ An| = Σ|Ai| − Σ|Ai ∩ Aj| + Σ|Ai ∩ Aj ∩ Ak| − …</text>
    <text x="28" y="348" font-size="10" fill="#334155">奇数层交集取加号，偶数层取减号（交错符号）</text>

    <text x="20" y="384" font-size="10" fill="#64748b">公式形态见左图圈层，加减次序见右侧三步，两者一一对应</text>
  </g>
</svg>
