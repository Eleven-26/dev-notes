<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwG" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
    <marker id="arwR" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Nim 的异或判据：两组按位手推与对称跟进</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">数字全部抄自本篇正文的两组对局推演：(3, 4, 5) 与 (1, 2, 3)</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="460" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="15" font-weight="bold" fill="#0f172a">A. 两组按位异或手推</text>
    <text x="16" y="52" font-size="10.5" fill="#64748b">每行是一堆的二进制，同一位上「1 的个数」决定 xor 的这一位</text>

    <text x="28" y="76" font-size="11" font-weight="bold" fill="#1e40af">(3, 4, 5)</text>
    <text x="250" y="76" font-size="11" font-weight="bold" fill="#1e40af">(1, 2, 3)</text>

    <text x="28" y="104" font-size="11" fill="#334155">3 = 0 1 1</text>
    <text x="28" y="126" font-size="11" fill="#334155">4 = 1 0 0</text>
    <text x="28" y="148" font-size="11" fill="#334155">5 = 1 0 1</text>
    <text x="250" y="104" font-size="11" fill="#334155">1 = 0 0 1</text>
    <text x="250" y="126" font-size="11" fill="#334155">2 = 0 1 0</text>
    <text x="250" y="148" font-size="11" fill="#334155">3 = 0 1 1</text>

    <line x1="28" y1="166" x2="216" y2="166" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="250" y1="166" x2="438" y2="166" stroke="#cbd5e1" stroke-width="1"/>

    <text x="28" y="190" font-size="11" font-weight="bold" fill="#1e40af">xor = 0 1 0（= 2）</text>
    <text x="250" y="190" font-size="11" font-weight="bold" fill="#1e40af">xor = 0 0 0（= 0）</text>

    <text x="28" y="216" font-size="11.5" font-weight="bold" fill="#14532d">先手必胜</text>
    <text x="250" y="216" font-size="11.5" font-weight="bold" fill="#991b1b">先手必败</text>

    <rect x="14" y="234" width="432" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="28" y="258" font-size="10.5" fill="#14532d">xor != 0 → 先手必胜：总能一步把 xor 改成 0</text>
    <text x="28" y="276" font-size="10.5" fill="#14532d">（取法：找到 xor 的最高位 1，把有一堆压到「该堆 ^ xor」）</text>

    <rect x="14" y="288" width="432" height="68" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="28" y="310" font-size="10.5" fill="#991b1b">xor == 0 → 先手必败：任何一步都会让 xor 变成非 0</text>
    <text x="28" y="331" font-size="10.5" fill="#991b1b">① 先手无论怎么取都会把 xor 变成非 0</text>
    <text x="28" y="352" font-size="10.5" fill="#991b1b">② 后手总能一步走回 xor == 0（对称跟进），终局全 0 也是 xor == 0</text>
  </g>

  <g transform="translate(520,70)">
    <rect x="0" y="0" width="460" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="15" font-weight="bold" fill="#0f172a">B. 判据与五类常改形的游戏</text>
    <text x="16" y="52" font-size="10.5" fill="#64748b">xor 与 SG 是同一件事：Nim 就是「每堆 SG = 堆大小」的组合</text>

    <rect x="14" y="66" width="432" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="28" y="88" font-size="10.5" fill="#1e40af">xor = a1 ^ a2 ^ ... ^ an</text>
    <text x="28" y="106" font-size="10.5" fill="#1e40af">xor != 0 → 先手必胜；xor == 0 → 先手必败</text>
    <text x="28" y="122" font-size="10.5" fill="#1e40af">（规则：每次从一堆取走至少 1 个，取完者胜）</text>

    <rect x="14" y="138" width="432" height="130" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="28" y="162" font-size="10.5" fill="#14532d">Nim：xor 不为 0 必胜</text>
    <text x="28" y="184" font-size="10.5" fill="#14532d">Bash：取 1~m 个，n % (m+1) != 0 必胜</text>
    <text x="28" y="206" font-size="10.5" fill="#14532d">Wythoff：两堆石子，结论与黄金分割比相关</text>
    <text x="28" y="228" font-size="10.5" fill="#14532d">阶梯 Nim：只看奇数位（从底往上数）的 xor</text>
    <text x="28" y="250" font-size="10.5" fill="#14532d">反 Nim：全是 1 时堆数为偶数必胜，否则仍看 xor</text>

    <rect x="14" y="280" width="432" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <text x="28" y="304" font-size="10.5" fill="#92400e">⚠️ 五类结论都从 Nim / SG 推出来，别死记公式：</text>
    <text x="28" y="324" font-size="10.5" fill="#92400e">Bash 的 m+1 来自「两人一轮合计取 m+1 个」；阶梯 Nim 只算奇数位。</text>
  </g>
</svg>
