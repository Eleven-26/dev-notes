<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwG" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">帕斯卡三角的递推来源与常见计数模型</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">三角中的数字抄正文第一节手推表，判据表的工具抄第四、五、七节</text>

  <g transform="translate(20,88)">
    <rect x="0" y="0" width="480" height="464" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="20" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 杨辉三角：C(n,k) = C(n-1,k-1) + C(n-1,k)</text>
    <text x="20" y="46" font-size="10.5" fill="#64748b">n 从 0 到 4，每格 = 左上 + 正上（正文第一节手推表）</text>

    <text x="20" y="94" font-size="10.5" fill="#64748b">n=0</text>
    <text x="20" y="130" font-size="10.5" fill="#64748b">n=1</text>
    <text x="20" y="166" font-size="10.5" fill="#64748b">n=2</text>
    <text x="20" y="202" font-size="10.5" fill="#64748b">n=3</text>
    <text x="20" y="238" font-size="10.5" fill="#64748b">n=4</text>

    <rect x="221" y="76" width="38" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="240" y="94" text-anchor="middle" font-size="12" fill="#334155">1</text>

    <rect x="200" y="112" width="38" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="219" y="130" text-anchor="middle" font-size="12" fill="#334155">1</text>
    <rect x="242" y="112" width="38" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="261" y="130" text-anchor="middle" font-size="12" fill="#334155">1</text>

    <rect x="179" y="148" width="38" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="198" y="166" text-anchor="middle" font-size="12" fill="#334155">1</text>
    <rect x="221" y="148" width="38" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="240" y="166" text-anchor="middle" font-size="12" fill="#334155">2</text>
    <rect x="263" y="148" width="38" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="282" y="166" text-anchor="middle" font-size="12" fill="#334155">1</text>

    <rect x="158" y="184" width="38" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="177" y="202" text-anchor="middle" font-size="12" fill="#334155">1</text>
    <rect x="200" y="184" width="38" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="4"/>
    <text x="219" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">3</text>
    <rect x="242" y="184" width="38" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="4"/>
    <text x="261" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">3</text>
    <rect x="284" y="184" width="38" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="303" y="202" text-anchor="middle" font-size="12" fill="#334155">1</text>

    <rect x="137" y="220" width="38" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="156" y="238" text-anchor="middle" font-size="12" fill="#334155">1</text>
    <rect x="179" y="220" width="38" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="198" y="238" text-anchor="middle" font-size="12" fill="#334155">4</text>
    <rect x="221" y="220" width="38" height="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="4"/>
    <text x="240" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">6</text>
    <rect x="263" y="220" width="38" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="282" y="238" text-anchor="middle" font-size="12" fill="#334155">4</text>
    <rect x="305" y="220" width="38" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="324" y="238" text-anchor="middle" font-size="12" fill="#334155">1</text>

    <line x1="219" y1="211" x2="233" y2="218" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>
    <line x1="261" y1="211" x2="247" y2="218" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>

    <text x="20" y="276" font-size="12" fill="#1e40af">C(4,2) = C(3,1) + C(3,2) = 3 + 3 = 6</text>

    <rect x="20" y="300" width="440" height="58" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="34" y="322" font-size="11.5" font-weight="bold" fill="#92400e">来源① 第 n 个「被选中」→ C(n-1, k-1)</text>
    <text x="34" y="344" font-size="11" fill="#92400e">从剩下的 n-1 个里再选 k-1 个，共 C(n-1, k-1) 种</text>

    <rect x="20" y="370" width="440" height="58" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="34" y="392" font-size="11.5" font-weight="bold" fill="#14532d">来源② 第 n 个「不被选中」→ C(n-1, k)</text>
    <text x="34" y="414" font-size="11" fill="#14532d">从剩下的 n-1 个里选满 k 个，共 C(n-1, k) 种</text>

    <text x="20" y="452" font-size="10.5" fill="#64748b">递推的两个出口是边界 C(n,0) = C(n,n) = 1；k &lt; 0 或 k &gt; n 时组合数为 0</text>
  </g>

  <g transform="translate(520,88)">
    <rect x="0" y="0" width="460" height="464" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="20" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 常见计数模型：先认形态，再选工具</text>
    <text x="20" y="46" font-size="10.5" fill="#64748b">对照正文第七节的场景表；数字抄第一、四、五节</text>

    <rect x="20" y="62" width="420" height="220" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="34" y="88" font-size="10.5" fill="#92400e">计数类 DP → 组合数（杨辉递推，或阶乘 + 逆元）</text>
    <text x="34" y="116" font-size="10.5" fill="#92400e">「至少 / 恰好」计数、错排 → 容斥原理</text>
    <text x="34" y="144" font-size="10.5" fill="#92400e">合法括号 / 出栈序列 / 二叉树形态 → Catalan 数</text>
    <text x="34" y="172" font-size="10" fill="#92400e">Catalan 数：C(2n, n) / (n+1)，前几项 1,1,2,5,14,42</text>
    <text x="34" y="200" font-size="10.5" fill="#92400e">集合划分 → 第二类斯特林 S(n,k) = S(n-1,k-1) + k×S(n-1,k)</text>
    <text x="34" y="228" font-size="10.5" fill="#92400e">圆排列分堆 → 第一类斯特林 s(n,k)</text>
    <text x="34" y="256" font-size="10.5" fill="#92400e">所有子集计数 → Σ C(n,k) = 2^n（子集共 2^n 个）</text>

    <rect x="20" y="292" width="420" height="76" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="34" y="316" font-size="10.5" fill="#334155">对称性 C(n, k) = C(n, n-k)：选 k 个等价于不选 n-k 个</text>
    <text x="34" y="340" font-size="10.5" fill="#334155">Σ (-1)^k C(n, k) = 0 与 Σ k C(n, k) = n×2^(n-1) 都要求 n ≥ 1</text>

    <rect x="20" y="380" width="420" height="70" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="34" y="402" font-size="11" font-weight="bold" fill="#991b1b">陷阱：模数 p 必须大于 n</text>
    <text x="34" y="424" font-size="10" fill="#991b1b">p ≤ n 时 fact[n] ≡ 0，inv[n] 不存在 → 要转卢卡斯</text>
  </g>
</svg>
