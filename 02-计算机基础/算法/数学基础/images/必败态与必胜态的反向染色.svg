<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwG" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
    <marker id="arwR" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">必败态与必胜态：从终态反向染色，SG 值用 mex 手推</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">左：链状游戏「每步走一格」的 P/N 染色；右：单堆取石子的 SG 值周期</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="460" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="15" font-weight="bold" fill="#0f172a">A. P/N 两态：从终态往回推</text>
    <text x="16" y="52" font-size="10.5" fill="#64748b">链状游戏「每步只能走一格」，状态 0 无法行动</text>
    <text x="16" y="76" font-size="11" fill="#64748b">染色顺序：0 → 1 → 2 → 3 → 4（与走法方向相反）</text>

    <line x1="139" y1="124" x2="103" y2="124" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="224" y1="124" x2="188" y2="124" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="309" y1="124" x2="273" y2="124" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="394" y1="124" x2="358" y2="124" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <circle cx="77" cy="124" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="77" y="124" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#991b1b">0</text>
    <circle cx="162" cy="124" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="162" y="124" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1e40af">1</text>
    <circle cx="247" cy="124" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="247" y="124" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#991b1b">2</text>
    <circle cx="332" cy="124" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="332" y="124" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1e40af">3</text>
    <circle cx="417" cy="124" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="417" y="124" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#991b1b">4</text>

    <text x="77" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">P</text>
    <text x="162" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">N</text>
    <text x="247" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">P</text>
    <text x="332" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">N</text>
    <text x="417" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">P</text>

    <text x="16" y="196" font-size="10" fill="#64748b">← 走法：每步从状态 n 走到 n−1，箭头方向即合法走法</text>

    <rect x="14" y="214" width="432" height="84" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <text x="28" y="238" font-size="11" font-weight="bold" fill="#92400e">判定规则（终态先定，再逐格反推）</text>
    <text x="28" y="260" font-size="11" fill="#92400e">终态（无法行动）→ P-position</text>
    <text x="28" y="282" font-size="11" fill="#92400e">能走到 P-position 的 → N-position；所有走法都到 N 的 → P-position</text>

    <rect x="14" y="310" width="432" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="28" y="334" font-size="10.5" fill="#991b1b">⚠️ 三条 ICG 条件必须同时成立：轮流行动、可行动作与玩家无关、无法行动者输</text>
    <text x="28" y="356" font-size="10.5" fill="#991b1b">只有满足这三条，局面才只依赖当前状态、不依赖轮到谁。</text>
  </g>

  <g transform="translate(520,70)">
    <rect x="0" y="0" width="460" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="15" font-weight="bold" fill="#0f172a">B. SG 函数：mex 手推与周期</text>
    <text x="16" y="52" font-size="10.5" fill="#64748b">单堆取石子，每次可取 1~2 颗 —— SG(x) 等价于「一堆多大的 Nim」</text>

    <rect x="14" y="66" width="432" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="28" y="92" font-size="11.5" fill="#1e40af">SG(x) = mex{ SG(y) | y 是 x 的后继状态 }</text>

    <rect x="14" y="118" width="432" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="142" font-size="11" fill="#334155">SG(0) = mex{ }　　= 0（终态无后继）</text>
    <text x="28" y="164" font-size="11" fill="#334155">SG(1) = mex{ SG(0) } = mex{ 0 } = 1</text>
    <text x="28" y="186" font-size="11" fill="#334155">SG(2) = mex{ SG(1), SG(0) } = mex{ 1, 0 } = 2</text>
    <text x="28" y="208" font-size="11" fill="#334155">SG(3) = mex{ SG(2), SG(1) } = mex{ 2, 1 } = 0 ← 回到 0</text>
    <text x="28" y="230" font-size="10.5" fill="#64748b">后继是 x−1、x−2；SG 值按 0,1,2,0,1,2… 循环，周期为 3</text>

    <rect x="14" y="250" width="432" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="28" y="274" font-size="10.5" fill="#14532d">SG(x) == 0 → x 是必败态；SG(x) != 0 → x 是必胜态</text>
    <text x="28" y="296" font-size="10.5" fill="#14532d">多个独立游戏组合：SG = SG1 ^ SG2 ^ ...，!= 0 则先手必胜</text>

    <rect x="14" y="328" width="432" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <text x="28" y="352" font-size="10.5" fill="#92400e">⚠️ mex 取「最小的不在后继集合里的非负整数」，不是最大、也不是集合大小</text>
  </g>
</svg>
