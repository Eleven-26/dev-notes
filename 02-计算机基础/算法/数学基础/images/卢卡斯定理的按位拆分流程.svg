<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwG" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">卢卡斯定理：逐层拆成小组合数再乘回</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">递推式与「查 2.1 表」抄正文 2.2；右栏为正文新增的 p=2 手推示意</text>

  <g transform="translate(20,88)">
    <rect x="0" y="0" width="460" height="346" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="20" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 对任意 (n, k, p) 的四步</text>
    <text x="20" y="46" font-size="10.5" fill="#64748b">判定顺序固定：终止 → 剥位 → 递归 → 乘回</text>

    <rect x="14" y="58" width="432" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="80" font-size="11.5" font-weight="bold" fill="#1e40af">① 终止判断：n &lt; p 且 k &lt; p ？</text>
    <text x="28" y="100" font-size="10" fill="#1e40af">是 → 小组合数直接算，或查 2.1 预处理表</text>

    <line x1="230" y1="110" x2="230" y2="124" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="14" y="126" width="432" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="148" font-size="11.5" font-weight="bold" fill="#1e40af">② 剥最低位：乘上 C(n%p, k%p)</text>
    <text x="28" y="168" font-size="10" fill="#1e40af">这一层是小于 p 的小组合数，查表 O(1)</text>

    <line x1="230" y1="178" x2="230" y2="192" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="14" y="194" width="432" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="216" font-size="11.5" font-weight="bold" fill="#1e40af">③ 递归高位：对 C(n/p, k/p) 回到 ①</text>
    <text x="28" y="236" font-size="10" fill="#1e40af">每剥一层，n 与 k 都整除一次 p</text>

    <line x1="230" y1="246" x2="230" y2="260" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>

    <rect x="14" y="262" width="432" height="56" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="284" font-size="11.5" font-weight="bold" fill="#14532d">④ 各层结果相乘再 mod p</text>
    <text x="28" y="304" font-size="10" fill="#14532d">= C(n%p, k%p) × C(n/p, k/p) mod p</text>

    <text x="20" y="338" font-size="10" fill="#64748b">任一层出现 k &gt; n → 该层组合数为 0，整条乘积归零</text>
  </g>

  <g transform="translate(500,88)">
    <rect x="0" y="0" width="480" height="346" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="20" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 手推示意：C(7, 3) mod 2</text>
    <text x="20" y="46" font-size="10.5" fill="#64748b">n = 7、k = 3、p = 2；数字抄正文 2.2 手推块</text>

    <rect x="14" y="58" width="452" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="80" font-size="11.5" font-weight="bold" fill="#1e40af">第 0 层：C(7, 3) mod 2</text>
    <text x="28" y="100" font-size="10" fill="#1e40af">= C(7%2, 3%2) × C(7/2, 3/2) = C(1,1) × C(3,1)</text>
    <text x="28" y="118" font-size="9.5" fill="#1e40af">余数层 (1,1) 已终止；商层 (3,1) 继续拆</text>

    <line x1="230" y1="122" x2="230" y2="136" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="14" y="136" width="452" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="158" font-size="11.5" font-weight="bold" fill="#1e40af">第 1 层：C(3, 1) mod 2</text>
    <text x="28" y="178" font-size="10" fill="#1e40af">= C(3%2, 1%2) × C(3/2, 1/2) = C(1,1) × C(1,0)</text>
    <text x="28" y="196" font-size="9.5" fill="#1e40af">商层 (1,0) 与余数层 (1,1) 都已 &lt; p</text>

    <line x1="230" y1="200" x2="230" y2="214" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>

    <rect x="14" y="214" width="452" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="236" font-size="11.5" font-weight="bold" fill="#14532d">第 2 层（终止）：C(1,1) = 1，C(1,0) = 1</text>
    <text x="28" y="254" font-size="10" fill="#14532d">全部是 1 位的小组合数，查表直出</text>

    <line x1="230" y1="264" x2="230" y2="278" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>

    <rect x="14" y="278" width="452" height="58" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="300" font-size="11.5" font-weight="bold" fill="#92400e">回溯相乘：C(7,3) mod 2 = 1 × 1 × 1 = 1</text>
    <text x="28" y="320" font-size="10" fill="#92400e">校验：C(7,3) = 35，35 mod 2 = 1 ✓（手算）</text>
  </g>
</svg>
