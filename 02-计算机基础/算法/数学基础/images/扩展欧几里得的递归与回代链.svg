<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwG" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">扩展欧几里得：递归下降与回代上升链</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">正文第四节例子 exGCD(12, 10) → (g=2, x=1, y=-1)；中间值为手推</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="460" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="15" font-weight="bold" fill="#0f172a">A. 调用时序：一层层下降到基准</text>
    <text x="16" y="52" font-size="10.5" fill="#64748b">蓝箭头 = 递归调用（下行），绿箭头 = 返回带回（上行）</text>

    <rect x="14" y="62" width="432" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="28" y="82" font-size="11" font-weight="bold" fill="#1e40af">exGCD(12, 10)：b ≠ 0</text>
    <text x="28" y="102" font-size="10" fill="#1e40af">→ 递归 exGCD(10, 12 % 10 = 2)</text>

    <rect x="14" y="144" width="432" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="28" y="164" font-size="11" font-weight="bold" fill="#1e40af">exGCD(10, 2)：b ≠ 0</text>
    <text x="28" y="184" font-size="10" fill="#1e40af">→ 递归 exGCD(2, 10 % 2 = 0)</text>

    <rect x="14" y="226" width="432" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="28" y="246" font-size="11" font-weight="bold" fill="#14532d">exGCD(2, 0)：基准情况 b == 0</text>
    <text x="28" y="266" font-size="10" fill="#14532d">→ 返回 (g=2, x=1, y=0)</text>

    <line x1="60" y1="116" x2="60" y2="140" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="60" y1="198" x2="60" y2="222" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="400" y1="224" x2="400" y2="200" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>
    <line x1="400" y1="142" x2="400" y2="118" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>

    <text x="150" y="133" font-size="9.5" fill="#16a34a">带回 (2, 0, 1)</text>
    <text x="150" y="215" font-size="9.5" fill="#16a34a">带回 (2, 1, 0)</text>

    <rect x="14" y="292" width="432" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="28" y="312" font-size="10.5" font-weight="bold" fill="#14532d">上升回代（每层只算常数次乘减）：</text>
    <text x="28" y="332" font-size="10" fill="#14532d">(10, 2) 层：x = y1 = 0，y = 1 − 5×0 = 1</text>
    <text x="28" y="352" font-size="10" fill="#14532d">(12, 10) 层：x = y1 = 1，y = 0 − 1×1 = −1</text>
  </g>

  <g transform="translate(520,70)">
    <rect x="0" y="0" width="460" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="15" font-weight="bold" fill="#0f172a">B. 回代公式、基准与用途</text>
    <text x="16" y="52" font-size="10.5" fill="#64748b">公式逐字取自正文第四节代码的 return 行</text>

    <rect x="14" y="64" width="432" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="28" y="86" font-size="11" font-weight="bold" fill="#1e40af">回代规则</text>
    <text x="28" y="106" font-size="10.5" fill="#1e40af">子层返回 (g, x1, y1) → 父层返回 (g, y1, x1 − (a/b) × y1)</text>
    <text x="28" y="126" font-size="10.5" fill="#1e40af">g 从基准原样上传，就是 gcd(a, b)</text>

    <rect x="14" y="152" width="432" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="28" y="174" font-size="10.5" fill="#14532d">基准 (a, 0) 返回 (a, 1, 0)，即 a×1 + 0×0 = a</text>
    <text x="28" y="194" font-size="10.5" fill="#14532d">12×1 + 10×(−1) = 2 ✓ 与正文例子的返回值一致</text>

    <rect x="14" y="220" width="432" height="58" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <text x="28" y="242" font-size="10.5" fill="#92400e">用途（正文）：a×x ≡ 1 (mod m) 的模逆元就是 x</text>
    <text x="28" y="262" font-size="10.5" fill="#92400e">解线性同余方程</text>

    <rect x="14" y="290" width="432" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="316" font-size="10.5" fill="#334155">时间：递归深度与欧几里得同级，O(log min(a, b))</text>
  </g>
</svg>
