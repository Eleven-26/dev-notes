<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">跳数少不等于代价小：BFS 的层号在带权图上失效</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">同一个 0 到 1：走 1 跳的直达边代价 4，走 2 跳的绕道边代价 1 + 2 = 3</text>

  <rect x="20" y="78" width="540" height="300" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="104" font-size="14" font-weight="bold" fill="#0f172a">同一个 0 到 1，两条路</text>

  <line x1="134" y1="180" x2="426" y2="180" stroke="#dc2626" stroke-width="3.5"/>
  <line x1="128" y1="193" x2="262" y2="287" stroke="#16a34a" stroke-width="3.5"/>
  <line x1="298" y1="287" x2="432" y2="193" stroke="#16a34a" stroke-width="3.5"/>

  <circle cx="110" cy="180" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/>
  <text x="110" y="180" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#1e3a8a">0</text>
  <circle cx="450" cy="180" r="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
  <text x="450" y="180" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#334155">1</text>
  <circle cx="280" cy="300" r="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
  <text x="280" y="300" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#334155">2</text>

  <text x="280" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">4</text>
  <text x="183" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">1</text>
  <text x="377" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">2</text>

  <text x="110" y="222" text-anchor="middle" font-size="11" fill="#64748b">源点</text>
  <text x="450" y="222" text-anchor="middle" font-size="11" fill="#64748b">目标</text>
  <text x="280" y="140" text-anchor="middle" font-size="11" fill="#991b1b">直达：1 跳，代价 4</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#166534">绕道：2 跳，代价 1 + 2 = 3</text>

  <rect x="580" y="78" width="400" height="300" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="600" y="104" font-size="14" font-weight="bold" fill="#0f172a">两种取法给出相反的答案</text>

  <rect x="600" y="120" width="360" height="110" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="616" y="145" font-size="13" font-weight="bold" fill="#991b1b">BFS 按跳数（队列一层层扩）</text>
  <text x="616" y="170" font-size="12" fill="#7f1d1d">1 跳 &lt; 2 跳，于是选直达 0 → 1</text>
  <text x="616" y="193" font-size="12" fill="#7f1d1d">给出的代价 = 4，不是最小值</text>
  <text x="616" y="216" font-size="11" fill="#7f1d1d">注意：层号 1 没错，错的是「1 跳最便宜」</text>

  <rect x="600" y="244" width="360" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="616" y="269" font-size="13" font-weight="bold" fill="#166534">Dijkstra 按累计 dist（小顶堆）</text>
  <text x="616" y="294" font-size="12" fill="#14532d">1 + 2 = 3 &lt; 4，于是选绕道 0 → 2 → 1</text>
  <text x="616" y="317" font-size="12" fill="#14532d">给出的代价 = 3，多走一跳反而便宜</text>
  <text x="616" y="340" font-size="11" fill="#334155">要点：排序键从「跳数」换成「累加代价」</text>

  <rect x="20" y="396" width="960" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="36" y="422" font-size="13.5" font-weight="bold" fill="#0f172a">BFS 的层号等于什么，取决于每条边加多少钱</text>
  <text x="36" y="448" font-size="12" fill="#334155">BFS 第 k 层 = 恰好走 k 条边。只有每条边代价相同（等权）时，层号才等于代价；边权不等，「先碰到」就不再等于「最便宜」。</text>
  <text x="36" y="472" font-size="12" fill="#334155">本例正是这一条：直达 1 跳代价 4，绕道 2 跳代价 3 —— BFS 在「跳数」上最优，Dijkstra 在「代价」上最优。</text>
  <text x="36" y="496" font-size="12" fill="#334155">下一步（1.2）的贪心规则，就是把「取谁」从队列的先进先出改成按当前 dist 取最小。</text>

  <text x="500" y="544" text-anchor="middle" font-size="11" fill="#94a3b8">图内数字（4、1、2、3 与 1 跳、2 跳）全部取自本节正文</text>
</svg>
