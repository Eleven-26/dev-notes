<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">示例图与逐步松弛过程（无向图，源点 0）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">每轮取出「当前 dist 最小」的顶点，松弛它的所有邻居 —— 顺序由小顶堆保证</text>

  <line x1="162" y1="216" x2="400" y2="133" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="162" y1="244" x2="400" y2="338" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="420" y1="142" x2="420" y2="328" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="440" y1="131" x2="680" y2="216" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="440" y1="341" x2="680" y2="244" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="722" y1="230" x2="858" y2="230" stroke="#94a3b8" stroke-width="1.5"/>

  <circle cx="140" cy="230" r="22" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="140" y="230" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#7f1d1d">0</text>
  <circle cx="420" cy="120" r="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="420" y="120" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">1</text>
  <circle cx="420" cy="350" r="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="420" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">2</text>
  <circle cx="700" cy="230" r="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="700" y="230" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">3</text>
  <circle cx="880" cy="230" r="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="880" y="230" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">4</text>

  <text x="272" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">4</text>
  <text x="268" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">1</text>
  <text x="446" y="235" text-anchor="start" font-size="13" font-weight="bold" fill="#2563eb">2</text>
  <text x="556" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">1</text>
  <text x="556" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">5</text>
  <text x="790" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">3</text>

  <line x1="40" y1="398" x2="960" y2="398" stroke="#cbd5e1" stroke-width="1"/>

  <text x="40" y="428" font-size="14" font-weight="bold" fill="#0f172a">逐步推演（本机 Go / Java 双实现实跑，输出逐行一致）</text>

  <g font-family="Consolas, Courier New, monospace" font-size="13.5">
    <text x="40" y="464" fill="#64748b">轮次</text>
    <text x="110" y="464" fill="#64748b">取出</text>
    <text x="185" y="464" fill="#64748b">这一轮被更新的 dist</text>
    <text x="520" y="464" fill="#64748b">dist = [0  1  2  3  4]</text>
    <text x="800" y="464" fill="#64748b">说明</text>

    <line x1="40" y1="476" x2="960" y2="476" stroke="#e2e8f0" stroke-width="1"/>

    <text x="40" y="506" fill="#334155">1</text>
    <text x="110" y="506" fill="#dc2626" font-weight="bold">0</text>
    <text x="185" y="506" fill="#334155">1←4、2←1</text>
    <text x="520" y="506" fill="#334155">[0  4  1  ∞  ∞]</text>
    <text x="800" y="506" fill="#94a3b8">源点出堆</text>

    <text x="40" y="536" fill="#334155">2</text>
    <text x="110" y="536" fill="#dc2626" font-weight="bold">2</text>
    <text x="185" y="536" fill="#334155">1←3、3←6</text>
    <text x="520" y="536" fill="#334155">[0  3  1  6  ∞]</text>
    <text x="800" y="536" fill="#b45309">dist[1] 第二次被松弛</text>

    <text x="40" y="566" fill="#334155">3</text>
    <text x="110" y="566" fill="#dc2626" font-weight="bold">1</text>
    <text x="185" y="566" fill="#334155">3←4</text>
    <text x="520" y="566" fill="#334155">[0  3  1  4  ∞]</text>
    <text x="800" y="566" fill="#b45309">dist[3] 第二次被松弛</text>

    <text x="40" y="596" fill="#334155">4</text>
    <text x="110" y="596" fill="#dc2626" font-weight="bold">3</text>
    <text x="185" y="596" fill="#334155">4←7</text>
    <text x="520" y="596" fill="#334155">[0  3  1  4  7]</text>
    <text x="800" y="596" fill="#94a3b8">—</text>

    <text x="40" y="626" fill="#334155">5</text>
    <text x="110" y="626" fill="#dc2626" font-weight="bold">4</text>
    <text x="185" y="626" fill="#334155">（没有邻居可改）</text>
    <text x="520" y="626" fill="#334155">[0  3  1  4  7]</text>
    <text x="800" y="626" fill="#94a3b8">堆空，结束</text>
  </g>

  <line x1="40" y1="646" x2="960" y2="646" stroke="#cbd5e1" stroke-width="1"/>

  <text x="40" y="672" font-size="13" fill="#334155">⭐ 第 2、3 轮各有一条边被「松弛两次」：先给一个较大的值，后来发现更短的路才被改小 —— 这是 Dijkstra 的常态。</text>
  <text x="40" y="694" font-size="13" fill="#334155">⚠️ 第 5 轮没有任何更新：4 只有一个邻居 3，而 dist[3] 已经更小 —— 「扫了边但什么都不改」也是常态。</text>
  <text x="40" y="714" font-size="12" fill="#94a3b8">（图：本机无法栅格化 SVG，需要 PNG 请自行导出，建议浅色底）</text>
</svg>
