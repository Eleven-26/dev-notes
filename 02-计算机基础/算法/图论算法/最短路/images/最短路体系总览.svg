<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="1000" height="630" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="630" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">最短路体系总览：一族算法，只有一处差别</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">一个原子操作 = 松弛；一句差别 = 按什么顺序取点、松弛多少轮、能处理什么权</text>

  <text x="20" y="90" font-size="13" font-weight="bold" fill="#2563eb">一、先记住这两句话</text>

  <rect x="20" y="100" width="310" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="34" y="126" font-size="13.5" font-weight="bold" fill="#1e3a8a">原子操作：松弛</text>
  <text x="34" y="150" font-size="11.5" fill="#1e3a8a">dist[u] + w &lt; dist[v] 就更新 v</text>
  <text x="34" y="170" font-size="11.5" fill="#1e3a8a">所有算法共用这一个动作</text>

  <rect x="345" y="100" width="310" height="80" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="359" y="126" font-size="13.5" font-weight="bold" fill="#14532d">一句差别：取点顺序</text>
  <text x="359" y="150" font-size="11.5" fill="#14532d">小顶堆 / 队列 / 扫全部边 / 中转点 k</text>
  <text x="359" y="170" font-size="11.5" fill="#14532d">顺序决定了「能处理什么权」</text>

  <rect x="670" y="100" width="310" height="80" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="684" y="126" font-size="13.5" font-weight="bold" fill="#78350f">一句差别：松弛轮数</text>
  <text x="684" y="150" font-size="11.5" fill="#78350f">每点一次 / V−1 轮 / 直到队空</text>
  <text x="684" y="170" font-size="11.5" fill="#78350f">轮数决定了「能不能判负环」</text>

  <text x="20" y="206" font-size="13" font-weight="bold" fill="#2563eb">二、骨架表：五族算法只看这四列</text>

  <rect x="20" y="216" width="960" height="194" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="244" font-size="12.5" font-weight="bold" fill="#0f172a">算法</text>
  <text x="204" y="244" font-size="12.5" font-weight="bold" fill="#0f172a">取点顺序</text>
  <text x="504" y="244" font-size="12.5" font-weight="bold" fill="#0f172a">松弛轮数</text>
  <text x="704" y="244" font-size="12.5" font-weight="bold" fill="#0f172a">适用前提</text>
  <path d="M 34 254 L 966 254" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>

  <text x="34" y="278" font-size="12.5" font-weight="bold" fill="#1e3a8a">Dijkstra</text>
  <text x="204" y="278" font-size="12.5" fill="#334155">小顶堆（按当前 dist）</text>
  <text x="504" y="278" font-size="12.5" fill="#334155">每点出堆一次</text>
  <text x="704" y="278" font-size="12.5" fill="#b91c1c">⚠️ 必须非负权</text>

  <text x="34" y="304" font-size="12.5" font-weight="bold" fill="#1e3a8a">Bellman-Ford</text>
  <text x="204" y="304" font-size="12.5" fill="#334155">每轮扫全部边（顺序无所谓）</text>
  <text x="504" y="304" font-size="12.5" fill="#334155">V − 1 轮</text>
  <text x="704" y="304" font-size="12.5" fill="#334155">可负权 + 能判负环</text>

  <text x="34" y="330" font-size="12.5" font-weight="bold" fill="#1e3a8a">SPFA</text>
  <text x="204" y="330" font-size="12.5" fill="#334155">队列（只放刚被改小的点）</text>
  <text x="504" y="330" font-size="12.5" fill="#334155">直到队列空</text>
  <text x="704" y="330" font-size="12.5" fill="#334155">可负权，最坏 O(VE)</text>

  <text x="34" y="356" font-size="12.5" font-weight="bold" fill="#1e3a8a">Floyd</text>
  <text x="204" y="356" font-size="12.5" fill="#334155">按中转点 k 逐层放开</text>
  <text x="504" y="356" font-size="12.5" fill="#334155">k 从 0 到 V−1</text>
  <text x="704" y="356" font-size="12.5" fill="#334155">全源 + 可负权（看对角线）</text>

  <text x="34" y="382" font-size="12.5" font-weight="bold" fill="#475569">BFS（等权对照）</text>
  <text x="204" y="382" font-size="12.5" fill="#475569">队列（按跳数）</text>
  <text x="504" y="382" font-size="12.5" fill="#475569">一层扫一遍</text>
  <text x="704" y="382" font-size="12.5" fill="#b91c1c">⚠️ 仅等权图</text>

  <text x="20" y="438" font-size="13" font-weight="bold" fill="#2563eb">三、两条翻车判据与相邻主题的边界</text>

  <rect x="20" y="448" width="960" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="474" font-size="13.5" font-weight="bold" fill="#0f172a">动手前先扫一遍边权，再谈选型</text>
  <text x="34" y="498" font-size="12.5" fill="#334155">· Dijkstra 遇负权 = ⚠️ 静默给错答案：错的不是被污染的点，而是一次局部修正没能传播出去（dist[3] 停在 3，正确是 2）</text>
  <text x="34" y="520" font-size="12.5" fill="#334155">· 存在负环 = 最短路没有定义（每绕一圈更短）→ 必须检测并报错；⭐「建图后先扫一遍边权」这个动作不能省</text>
  <text x="34" y="542" font-size="12.5" fill="#334155">· 与最小生成树（高频误区）：MST 求「连通总代价最小」，最短路求「两点间代价最小」——同一张图上解常常不同</text>
  <text x="34" y="564" font-size="12.5" fill="#334155">· 与 BFS：BFS 只等价于「等权最短路」；边权不等时「跳数少 ≠ 代价小」，Dijkstra 正是为补这一步而生</text>
  <text x="34" y="586" font-size="12" fill="#64748b">⭐ 选型顺序：① 有没有负权 → ② 单源还是全源 → ③ 才轮到效率（V / E 的规模、稠密还是稀疏）</text>
</svg>
