<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一条负权边为什么能让 Dijkstra 算错？</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">错的不在「dist 变小」，而在「变小之后没能再传播出去」</text>

  <line x1="172" y1="110" x2="426" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <polyline points="150,132 150,280 424,280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="450" y1="258" x2="450" y2="134" stroke="#dc2626" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="472" y1="110" x2="766" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <circle cx="150" cy="110" r="22" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#7f1d1d">0</text>
  <circle cx="450" cy="110" r="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="450" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">1</text>
  <circle cx="450" cy="280" r="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="450" y="280" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">2</text>
  <circle cx="790" cy="110" r="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="790" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">3</text>

  <text x="300" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">2</text>
  <text x="248" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">5</text>
  <text x="470" y="200" text-anchor="start" font-size="14" font-weight="bold" fill="#dc2626">−4</text>
  <text x="620" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">1</text>

  <rect x="40" y="352" width="440" height="316" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="60" y="380" font-size="14" font-weight="bold" fill="#991b1b">❌ 定稿版：出堆即定稿，修正传不出去</text>
  <g font-family="Consolas, Courier New, monospace" font-size="12.5" fill="#7f1d1d">
    <text x="60" y="408">第1轮 取 0（0）  → dist[1]=2  dist[2]=5</text>
    <text x="60" y="432">第2轮 取 1（2）★定稿 → dist[3]=3</text>
    <text x="60" y="456">第3轮 取 3（3）★定稿 → 无出边</text>
    <text x="60" y="480">第4轮 取 2（5）★定稿</text>
    <text x="60" y="504">       松弛 2→1：5+(-4)=1 &lt; 2</text>
    <text x="60" y="528">       → dist[1]=1 被改写</text>
    <text x="60" y="552">       ⚠️ 但 1 已定稿，不再展开</text>
    <text x="60" y="576">       → dist[3] 永远停在 3</text>
    <text x="60" y="612" font-weight="bold">结果 dist = [0 1 5 3]</text>
    <text x="60" y="640" font-weight="bold" fill="#dc2626">正确 dist = [0 1 5 2]  ← dist[3] 算错</text>
  </g>

  <rect x="520" y="352" width="440" height="316" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="540" y="380" font-size="14" font-weight="bold" fill="#166534">✅ 懒惰版：允许重复处理，修正继续传播</text>
  <g font-family="Consolas, Courier New, monospace" font-size="12.5" fill="#14532d">
    <text x="540" y="408">第1轮 取 0（0）  → dist[1]=2  dist[2]=5</text>
    <text x="540" y="432">第2轮 取 1（2）  → dist[3]=3</text>
    <text x="540" y="456">第3轮 取 3（3）  → 无出边</text>
    <text x="540" y="480">第4轮 取 2（5）  → dist[1]=1，重新入堆</text>
    <text x="540" y="504">第5轮 取 1（1）← 又处理一次 ✅</text>
    <text x="540" y="528">       松弛 1→3：1+1=2 &lt; 3</text>
    <text x="540" y="552">       → dist[3]=2 被修正</text>
    <text x="540" y="576">第6轮 取 3（2）  → 无出边</text>
    <text x="540" y="612" font-weight="bold">结果 dist = [0 1 5 2]  ✅</text>
    <text x="540" y="640" font-weight="bold" fill="#166534">与 Bellman-Ford 一致</text>
  </g>

  <text x="40" y="694" font-size="12.5" fill="#334155">⚠️ 但这不代表「懒惰版能处理负权」：一旦图里出现负环，懒惰版会无限入堆、永远不终止。真正能兼顾负权与负环检测的是 Bellman-Ford。</text>
</svg>
