<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" width="1000" height="545">
  <rect x="0" y="0" width="1000" height="545" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">字段布局：INF 哨兵在 int32 的哪一格</text>
  <text x="500" y="52" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#475569">对应正文 5.2 / 5.2.1（位宽）与 3.3（假值）；位点与数值均为本次 Docker 实测：go1.26.8 linux/amd64、openjdk 1.8.0_504</text>

  <rect x="20" y="64" width="960" height="140" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="86" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">int32 的 32 个二进制位（bit 31 在最左 = 符号位，本篇只用 bit 29 及以下）</text>

  <rect x="54" y="96" width="26" height="26" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="82" y="96" width="26" height="26" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <rect x="110" y="96" width="26" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="138" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="166" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="194" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="222" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="250" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="278" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="306" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="334" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="362" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="390" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="418" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="446" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="474" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="502" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="530" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="558" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="586" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="614" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="642" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="670" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="698" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="726" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="754" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="782" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="810" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="838" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="866" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="894" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="922" y="96" width="26" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>

  <text x="67" y="114" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="10" fill="#991b1b">31</text>
  <text x="95" y="114" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="10" fill="#7c2d12">30</text>
  <text x="123" y="114" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="10" fill="#14532d">29</text>
  <text x="935" y="114" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="10" fill="#64748b">0</text>

  <rect x="40" y="147" width="12" height="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="60" y="158" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#334155">bit 31 = 2^31 = 2147483648：越过 int32 最大正整数 2147483647，符号位被点亮，值变成 -2147483648</text>
  <rect x="40" y="165" width="12" height="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="60" y="176" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#334155">bit 30 = 1&lt;&lt;30 = 1073741824 = 取 INF = 1&lt;&lt;30 时「INF + INF」的落点 —— 自己再加一次就越界</text>
  <rect x="40" y="183" width="12" height="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="60" y="194" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#334155">bit 29 = 1&lt;&lt;29 = 536870912 = 本篇取的 INF：加到自己身上只够到 bit 30，离符号位还差一格</text>

  <rect x="20" y="212" width="960" height="126" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="234" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">同一个「1&lt;&lt;30 + 1&lt;&lt;30」，两种整数宽度落在不同的格子里</text>

  <rect x="34" y="244" width="300" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="184" y="264" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">Go 的 int（amd64 = 64 位）</text>
  <text x="184" y="284" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#334155">1&lt;&lt;30 + 1&lt;&lt;30 = 2147483648</text>
  <text x="184" y="304" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#334155">正数：哨兵只是「很大」，不会假装很短</text>

  <rect x="345" y="244" width="300" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="495" y="264" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Java 的 int（语言规定 32 位）</text>
  <text x="495" y="284" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#7f1d1d">= -2147483648（回绕成负数）</text>
  <text x="495" y="304" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#7f1d1d">比任何真实距离都小 → 整片被污染</text>

  <rect x="656" y="244" width="310" height="80" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="811" y="264" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="bold" fill="#14532d">取 1&lt;&lt;29 就两种宽度都安全</text>
  <text x="811" y="284" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#334155">INF + INF = 1073741824</text>
  <text x="811" y="304" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#334155">int32 内不溢出（做法 B 的前提）</text>

  <rect x="20" y="346" width="960" height="158" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="368" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">另一半坑跟位宽无关：负权把「不可达」往左拉一格，它并没有溢出</text>

  <line x1="80" y1="410" x2="900" y2="410" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="605" y1="402" x2="605" y2="418" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="473" y1="402" x2="473" y2="418" stroke="#b45309" stroke-width="1.6"/>
  <text x="605" y="396" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#991b1b">INF = 536870912（判据 d[i][j] &lt; INF 的分界线）</text>
  <text x="473" y="396" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#7c2d12">536870908 = INF + (-4)</text>
  <text x="80" y="430" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#64748b">0</text>
  <text x="870" y="430" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#64748b">比 INF 大 = 仍算不可达</text>
  <text x="500" y="452" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#991b1b">假值落在分界线左边一格：64 位、32 位都一样不溢出，却被读成「可达但很长」</text>

  <text x="40" y="474" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#334155">带判断 2: [∞ -4 0 -3 ]　　无判断 2: [536870908 -4 0 -3 ]　　带判断 3: [∞ ∞ ∞ 0 ]　　无判断 3: [∞ 536870908 ∞ 0 ]</text>
  <text x="40" y="494" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#334155">三条后果（正文 3.3 表）：可达性判断失效　·　负环检测暂时不受影响，但再叠一次负权就误报　·　next 矩阵被污染，还原出不存在的路径</text>

  <text x="500" y="526" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#64748b">位宽读数取自 5.2.1 的 Docker 复测块（go1.26.8 linux/amd64 / openjdk 1.8.0_504）；矩阵行取自 3.3 实验六。</text>
</svg>
