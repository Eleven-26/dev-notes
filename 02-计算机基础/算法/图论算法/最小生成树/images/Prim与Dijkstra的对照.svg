<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">同一张图，两棵完全不同的树：Prim 的最小生成树 vs Dijkstra 的最短路树（源点 0）</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">两段代码只差一行松弛量：Prim 松弛「到树的距离」，Dijkstra 松弛「到源点的距离」</text>

  <line x1="110" y1="200" x2="350" y2="90" stroke="#94a3b8" stroke-width="3"/>
  <line x1="110" y1="200" x2="600" y2="170" stroke="#94a3b8" stroke-width="3"/>
  <line x1="350" y1="90" x2="600" y2="170" stroke="#e2e8f0" stroke-width="1.4"/>
  <line x1="350" y1="90" x2="300" y2="360" stroke="#dc2626" stroke-width="3"/>
  <line x1="350" y1="90" x2="620" y2="400" stroke="#94a3b8" stroke-width="3"/>
  <line x1="300" y1="360" x2="620" y2="400" stroke="#2563eb" stroke-width="3"/>
  <line x1="600" y1="170" x2="620" y2="400" stroke="#e2e8f0" stroke-width="1.4"/>
  <line x1="600" y1="170" x2="860" y2="170" stroke="#94a3b8" stroke-width="3"/>
  <line x1="620" y1="400" x2="860" y2="170" stroke="#e2e8f0" stroke-width="1.4"/>
  <line x1="620" y1="400" x2="870" y2="400" stroke="#2563eb" stroke-width="3"/>
  <line x1="860" y1="170" x2="870" y2="400" stroke="#dc2626" stroke-width="3"/>

  <text x="220" y="138" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">7</text>
  <text x="352" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">5</text>
  <text x="470" y="122" text-anchor="middle" font-size="12.5" fill="#cbd5e1">9</text>
  <text x="318" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b91c1c">8</text>
  <text x="492" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">7</text>
  <text x="452" y="392" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">5</text>
  <text x="618" y="288" text-anchor="middle" font-size="12.5" fill="#cbd5e1">15</text>
  <text x="730" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">6</text>
  <text x="742" y="298" text-anchor="middle" font-size="12.5" fill="#cbd5e1">8</text>
  <text x="740" y="412" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">9</text>
  <text x="882" y="290" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b91c1c">11</text>

  <circle cx="110" cy="200" r="24" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="110" y="200" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#7f1d1d">0</text>
  <circle cx="350" cy="90" r="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="350" y="90" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">1</text>
  <circle cx="300" cy="360" r="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="300" y="360" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">2</text>
  <circle cx="600" cy="170" r="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="600" y="170" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">3</text>
  <circle cx="620" cy="400" r="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="620" y="400" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">4</text>
  <circle cx="860" cy="170" r="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="860" y="170" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">5</text>
  <circle cx="870" cy="400" r="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="870" y="400" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">6</text>

  <line x1="40" y1="470" x2="960" y2="470" stroke="#e2e8f0" stroke-width="1"/>

  <line x1="60" y1="512" x2="110" y2="512" stroke="#94a3b8" stroke-width="3"/>
  <text x="122" y="517" font-size="13" fill="#334155">两棵树都选中（0-1、0-3、1-4、3-5）</text>
  <line x1="420" y1="512" x2="470" y2="512" stroke="#2563eb" stroke-width="3"/>
  <text x="482" y="517" font-size="13" fill="#334155">只有 Prim 选中（2-4、4-6）</text>

  <line x1="60" y1="552" x2="110" y2="552" stroke="#dc2626" stroke-width="3"/>
  <text x="122" y="557" font-size="13" fill="#334155">只有 Dijkstra 的最短路树选中（1-2、5-6）</text>
  <line x1="420" y1="552" x2="470" y2="552" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="482" y="557" font-size="13" fill="#334155">两棵树都没选中（1-3、3-4、4-5）</text>

  <text x="40" y="596" font-size="13.5" fill="#0f172a">Prim 最小生成树总权 = 39（本机实测）　｜　Dijkstra 到各点距离 = [0 7 15 5 14 11 22]（源点 0）</text>
</svg>
