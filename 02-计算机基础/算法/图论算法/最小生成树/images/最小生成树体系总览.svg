<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">最小生成树体系总览：一棵树、一条割性质、三条硬前提</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">含全部顶点的无环连通子图，边权总和最小 · 与最短路的分界：求「总代价」还是求「某两点之间」</text>

  <text x="20" y="90" font-size="13" font-weight="bold" fill="#2563eb">一、全部理论压在一句话上</text>

  <rect x="20" y="100" width="960" height="96" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="126" font-size="13.5" font-weight="bold" fill="#0f172a">割性质（MST 的地基）：横跨任意一个割的最小边，一定属于某棵最小生成树</text>
  <text x="34" y="150" font-size="12.5" fill="#334155">直觉版：「连接两个连通块的最便宜的那条边，不可能不用」—— 换一条更贵的回来只会更亏</text>
  <text x="34" y="172" font-size="12.5" fill="#334155">Kruskal 与 Prim 就是这条性质的两种用法：一个取全局最小边，一个显式维护一个割（见下面两格）</text>

  <text x="20" y="222" font-size="13" font-weight="bold" fill="#2563eb">二、同一性质的两种取边方式</text>

  <rect x="20" y="232" width="470" height="104" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="34" y="258" font-size="13" font-weight="bold" fill="#14532d">Kruskal（按边贪心）</text>
  <text x="34" y="282" font-size="11.5" fill="#14532d">把边按权排序从小到大取，取之前用并查集判环</text>
  <text x="34" y="302" font-size="11.5" fill="#14532d">那条全局最小边，正是「某个割上的最小边」</text>
  <text x="34" y="322" font-size="11" fill="#475569">⭐ 稀疏图 / 边能排序时首选</text>

  <rect x="510" y="232" width="470" height="104" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="524" y="258" font-size="13" font-weight="bold" fill="#1e3a8a">Prim（按点贪心）</text>
  <text x="524" y="282" font-size="11.5" fill="#1e3a8a">从一个点出发，每轮拉进「离当前树最近的点」</text>
  <text x="524" y="302" font-size="11.5" fill="#1e3a8a">显式维护「已选点集 vs 未选点集」这个割</text>
  <text x="524" y="322" font-size="11" fill="#475569">⭐ 与 Dijkstra 只差一行；稠密图更顺手</text>

  <text x="20" y="362" font-size="13" font-weight="bold" fill="#2563eb">三、硬前提、允许的情况与相邻主题的边界</text>

  <rect x="20" y="372" width="960" height="160" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="398" font-size="13.5" font-weight="bold" fill="#0f172a">前提不满足 = 换问题，不是换算法</text>
  <text x="34" y="424" font-size="12.5" fill="#334155">· 硬前提：无向图（有向 → 最小树形图 / 朱刘算法）· 连通（不连通 → 最小生成森林）· 带权（无权重 → 随便一棵 DFS 树）</text>
  <text x="34" y="446" font-size="12.5" fill="#334155">· 允许：边权相等（总权重唯一、边集可能不唯一）· 有重边（最小权那条会被选中）· 有负权边不影响正确性</text>
  <text x="34" y="468" font-size="12.5" fill="#334155">· 与最短路（高频误区）：MST 求「连通所有点的总代价最小」，最短路求「两点之间的代价最小」</text>
  <text x="34" y="490" font-size="12.5" fill="#334155">· 与并查集：Kruskal 的判环靠并查集（O(α(n))），并查集本身在数据结构目录的高级数据结构一篇</text>
  <text x="34" y="516" font-size="12" fill="#64748b">⭐ 一句话分界：问「总代价」想到 MST，问「某两点之间」想到最短路；MST 对负权不敏感，比 Dijkstra 皮实</text>
</svg>
