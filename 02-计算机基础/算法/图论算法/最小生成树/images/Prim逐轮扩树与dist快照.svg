  <text x="500" y="640" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#0f172a">⭐ 改写 dist 的唯一条件是「这条边的权 w &lt; dist[v]」——只跟单条边比、从不累加，所以负权对 Prim 无害</text>
  <text x="500" y="666" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#b45309">⚠️ 取出顺序不是 dist 的历史升序：第 6 轮入树的 2 带 dist=5，比第 4 轮入树的 1（dist=7）更小 —— 只保证「当时最小」</text>
