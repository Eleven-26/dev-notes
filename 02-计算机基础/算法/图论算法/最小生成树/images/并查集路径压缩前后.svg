<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">并查集：路径压缩前后，同一条链上的查询代价</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">n = 20000，按 union(i-1, i) 依次合并；查询 find(0) … find(n-1) 各一次，统计「走过的父指针条数」</text>

  <text x="40" y="106" font-size="15" font-weight="bold" fill="#b45309">① 朴素（无压缩、无按秩）：每次合并都把前一棵树的根挂到后一棵树下 → 长成一条链</text>

  <line x1="150" y1="205" x2="238" y2="205" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="290" y1="205" x2="378" y2="205" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="430" y1="205" x2="518" y2="205" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="570" y1="205" x2="658" y2="205" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <circle cx="120" cy="205" r="26" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="120" y="205" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">0</text>
  <circle cx="270" cy="205" r="26" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="270" y="205" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">1</text>
  <circle cx="410" cy="205" r="26" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="410" y="205" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">2</text>
  <circle cx="550" cy="205" r="26" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="550" y="205" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">3</text>
  <circle cx="700" cy="205" r="28" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="700" y="205" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#7f1d1d">根</text>
  <text x="790" y="196" font-size="13" fill="#94a3b8">…（根其实是编号 n−1 的那个点）</text>
  <text x="40" y="264" font-size="13.5" fill="#334155">深度 = n − 1 = 19999；一次 find(0) 就要走完整条链，find 全量共 <tspan font-weight="bold" fill="#b45309">199990000</tspan> 步</text>

  <line x1="40" y1="296" x2="960" y2="296" stroke="#e2e8f0" stroke-width="1"/>

  <text x="40" y="336" font-size="15" font-weight="bold" fill="#2563eb">② 只加路径压缩：首次 find(0) 顺手把整条链上的点全部挂到根上</text>

  <line x1="150" y1="455" x2="640" y2="455" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arR)" opacity="0.85"/>
  <line x1="300" y1="455" x2="640" y2="430" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arR)" opacity="0.85"/>
  <line x1="440" y1="455" x2="640" y2="405" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arR)" opacity="0.85"/>
  <line x1="580" y1="440" x2="640" y2="392" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arR)" opacity="0.85"/>

  <circle cx="120" cy="455" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="120" y="455" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1e3a8a">0</text>
  <circle cx="270" cy="455" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="270" y="455" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1e3a8a">1</text>
  <circle cx="410" cy="455" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="410" y="455" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1e3a8a">2</text>
  <circle cx="550" cy="455" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="550" y="455" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1e3a8a">3</text>
  <circle cx="700" cy="440" r="28" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="700" y="440" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#7f1d1d">根</text>
  <text x="40" y="512" font-size="13.5" fill="#334155">首次 find(0) 走了 19999 步、改写 19998 条父指针；之后每个点到根都只有 1 步 —— find 全量 <tspan font-weight="bold" fill="#2563eb">39997</tspan> 步</text>

  <line x1="40" y1="544" x2="960" y2="544" stroke="#e2e8f0" stroke-width="1"/>

  <text x="40" y="580" font-size="13.5" fill="#0f172a">③ 还有一条独立的路：建树时就用「按秩合并」，树一开始就是扁的，压根不会长成链 —— find 全量 19999 步</text>
  <text x="40" y="606" font-size="13" fill="#94a3b8">两条优化各自都能掐掉最坏情况：按秩合并在「合并时」防患，路径压缩在「查询时」补救 —— 实践中两者一起用</text>
</svg>
