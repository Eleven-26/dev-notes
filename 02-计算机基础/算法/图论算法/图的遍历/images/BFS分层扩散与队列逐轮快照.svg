<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">BFS 分层扩散：队列里永远只有「当前层 + 下一层」两批</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">源点 0；每次弹出后的队列与 dist 为容器实跑读数（go1.26.8），与正文 1.2、第六节表格一致</text>

  <rect x="20" y="80" width="380" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="36" y="104" font-size="14" font-weight="bold" fill="#0f172a">A. 按层着色的拓扑</text>

  <line x1="197" y1="161" x2="118" y2="214" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="210" y1="166" x2="210" y2="209" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="223" y1="161" x2="302" y2="214" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="118" y1="236" x2="197" y2="289" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="210" y1="241" x2="210" y2="284" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="302" y1="236" x2="223" y2="289" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="210" y1="316" x2="210" y2="336" stroke="#94a3b8" stroke-width="1.6"/>

  <circle cx="210" cy="150" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="105" cy="225" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="210" cy="225" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="315" cy="225" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="210" cy="300" r="16" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <circle cx="210" cy="352" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="210" y="155" text-anchor="middle" font-size="12" fill="#1e40af">0</text>
  <text x="105" y="230" text-anchor="middle" font-size="12" fill="#14532d">1</text>
  <text x="210" y="230" text-anchor="middle" font-size="12" fill="#14532d">2</text>
  <text x="315" y="230" text-anchor="middle" font-size="12" fill="#14532d">3</text>
  <text x="210" y="305" text-anchor="middle" font-size="12" fill="#9a3412">4</text>
  <text x="210" y="357" text-anchor="middle" font-size="12" fill="#991b1b">5</text>

  <text x="250" y="130" font-size="10" fill="#2563eb">d=0</text>
  <text x="352" y="220" font-size="10" fill="#16a34a">d=1</text>
  <text x="244" y="300" font-size="10" fill="#ea580c">d=2</text>
  <text x="244" y="358" font-size="10" fill="#dc2626">d=3</text>

  <text x="36" y="392" font-size="10.5" fill="#64748b">1、2、3 同层：BFS 让它们在同一轮边界上撞见 4</text>

  <rect x="410" y="80" width="570" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="426" y="104" font-size="14" font-weight="bold" fill="#0f172a">B. 队列逐轮快照（入队时即标记 dist）</text>
  <text x="440" y="128" font-size="11" font-weight="bold" fill="#334155">弹出</text>
  <text x="560" y="128" font-size="11" font-weight="bold" fill="#334155">弹出后的队列（队头在左）</text>
  <text x="820" y="128" font-size="11" font-weight="bold" fill="#334155">新入队</text>

  <text x="440" y="156" font-size="12" fill="#334155">0</text>
  <rect x="560" y="140" width="30" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="596" y="140" width="30" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="632" y="140" width="30" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="575" y="156" text-anchor="middle" font-size="11" fill="#14532d">1</text>
  <text x="611" y="156" text-anchor="middle" font-size="11" fill="#14532d">2</text>
  <text x="647" y="156" text-anchor="middle" font-size="11" fill="#14532d">3</text>
  <text x="820" y="156" font-size="10.5" fill="#64748b">[1 2 3] 第 1 层整批</text>

  <text x="440" y="196" font-size="12" fill="#334155">1</text>
  <rect x="560" y="180" width="30" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="596" y="180" width="30" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="632" y="180" width="30" height="22" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="575" y="196" text-anchor="middle" font-size="11" fill="#14532d">2</text>
  <text x="611" y="196" text-anchor="middle" font-size="11" fill="#14532d">3</text>
  <text x="647" y="196" text-anchor="middle" font-size="11" fill="#9a3412">4</text>
  <text x="820" y="196" font-size="10.5" fill="#64748b">[4] 排到第 1 层之后</text>

  <text x="440" y="236" font-size="12" fill="#334155">2</text>
  <rect x="560" y="220" width="30" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="596" y="220" width="30" height="22" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="575" y="236" text-anchor="middle" font-size="11" fill="#14532d">3</text>
  <text x="611" y="236" text-anchor="middle" font-size="11" fill="#9a3412">4</text>
  <text x="820" y="236" font-size="10.5" fill="#64748b">[] 邻居 0、4 已标记</text>

  <text x="440" y="276" font-size="12" fill="#334155">3</text>
  <rect x="560" y="260" width="30" height="22" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="575" y="276" text-anchor="middle" font-size="11" fill="#9a3412">4</text>
  <text x="820" y="276" font-size="10.5" fill="#64748b">[] 邻居 0、4 已标记</text>

  <text x="440" y="316" font-size="12" fill="#334155">4</text>
  <rect x="560" y="300" width="30" height="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="575" y="316" text-anchor="middle" font-size="11" fill="#991b1b">5</text>
  <text x="820" y="316" font-size="10.5" fill="#64748b">[5] 第 1 层清空后才有第 2 层</text>

  <text x="440" y="356" font-size="12" fill="#334155">5</text>
  <text x="560" y="356" font-size="10.5" fill="#64748b">[] 队列清空，遍历结束</text>
  <text x="820" y="356" font-size="10.5" fill="#64748b">[]</text>

  <text x="426" y="376" font-size="10.5" fill="#16a34a">⭐ 队列 = 一条正在平移的层边界：绝不会出现第 d+2 层混在中间</text>

  <rect x="20" y="396" width="960" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="10"/>
  <text x="500" y="422" text-anchor="middle" font-size="12.5" fill="#1e40af">实测：访问序 [0 1 2 3 4 5]｜距离 [0 1 1 1 2 3]｜层分组：第 0 层 [0]、第 1 层 [1 2 3]、第 2 层 [4]、第 3 层 [5]</text>
  <text x="500" y="446" text-anchor="middle" font-size="12.5" fill="#1e40af">同一张图的递归 DFS 序是 [0 1 4 2 3 5]——顺序由容器（FIFO/LIFO）决定，不由算法名字决定</text>
</svg>
