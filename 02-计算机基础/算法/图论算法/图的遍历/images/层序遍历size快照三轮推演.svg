<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">层序遍历：每轮先快照 size，处理中途入队的算下一轮</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">例子树 1(2(4,5), 3(左孩子 6))；三轮的队列与记录为容器实跑（go1.26.8），队列最长 = 3</text>

  <rect x="20" y="80" width="300" height="290" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="36" y="104" font-size="14" font-weight="bold" fill="#0f172a">A. 例子树</text>

  <line x1="139" y1="159" x2="96" y2="221" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="161" y1="159" x2="204" y2="221" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="74" y1="239" x2="61" y2="291" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="96" y1="239" x2="109" y2="291" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="204" y1="239" x2="191" y2="291" stroke="#94a3b8" stroke-width="1.6"/>

  <circle cx="150" cy="150" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="85" cy="230" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="215" cy="230" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="55" cy="305" r="16" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <circle cx="115" cy="305" r="16" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <circle cx="185" cy="305" r="16" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="150" y="155" text-anchor="middle" font-size="12" fill="#1e40af">1</text>
  <text x="85" y="235" text-anchor="middle" font-size="12" fill="#14532d">2</text>
  <text x="215" y="235" text-anchor="middle" font-size="12" fill="#14532d">3</text>
  <text x="55" y="310" text-anchor="middle" font-size="12" fill="#9a3412">4</text>
  <text x="115" y="310" text-anchor="middle" font-size="12" fill="#9a3412">5</text>
  <text x="185" y="310" text-anchor="middle" font-size="12" fill="#9a3412">6</text>

  <text x="36" y="346" font-size="10.5" fill="#64748b">颜色 = 层号（d0/d1/d2）；注意 3 只有</text>
  <text x="36" y="362" font-size="10.5" fill="#64748b">左孩子 6，没有右孩子</text>

  <rect x="340" y="80" width="640" height="290" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="356" y="104" font-size="14" font-weight="bold" fill="#0f172a">B. 逐轮：快照 → 处理 → 下一层入队</text>

  <text x="360" y="146" font-size="12" font-weight="bold" fill="#334155">轮 1</text>
  <rect x="420" y="130" width="32" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="436" y="147" text-anchor="middle" font-size="12" fill="#1e40af">1</text>
  <text x="500" y="147" font-size="11.5" fill="#b45309">size 快照 = 1</text>
  <text x="640" y="147" font-size="11.5" fill="#334155">记 [1]；处理中 2、3 入队</text>
  <line x1="436" y1="158" x2="436" y2="196" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="360" y="236" font-size="12" font-weight="bold" fill="#334155">轮 2</text>
  <rect x="420" y="220" width="32" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <rect x="458" y="220" width="32" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="436" y="237" text-anchor="middle" font-size="12" fill="#14532d">2</text>
  <text x="474" y="237" text-anchor="middle" font-size="12" fill="#14532d">3</text>
  <text x="500" y="237" font-size="11.5" fill="#b45309">size 快照 = 2</text>
  <text x="640" y="237" font-size="11.5" fill="#334155">记 [2 3]；处理中 4、5、6 入队</text>
  <line x1="436" y1="248" x2="436" y2="286" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="360" y="326" font-size="12" font-weight="bold" fill="#334155">轮 3</text>
  <rect x="420" y="310" width="32" height="24" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <rect x="458" y="310" width="32" height="24" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <rect x="496" y="310" width="32" height="24" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="436" y="327" text-anchor="middle" font-size="12" fill="#9a3412">4</text>
  <text x="474" y="327" text-anchor="middle" font-size="12" fill="#9a3412">5</text>
  <text x="512" y="327" text-anchor="middle" font-size="12" fill="#9a3412">6</text>
  <text x="540" y="327" font-size="11.5" fill="#b45309">size 快照 = 3</text>
  <text x="640" y="327" font-size="11.5" fill="#334155">记 [4 5 6]；无孩子，队列清空</text>

  <text x="356" y="358" font-size="10.5" fill="#dc2626">⚠️ 直接 for !q.isEmpty() 弹一个处理一个 = 丢掉「层」，只剩距离</text>

  <rect x="20" y="386" width="960" height="64" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="10"/>
  <text x="500" y="412" text-anchor="middle" font-size="12.5" fill="#14532d">实测结果 [[1] [2 3] [4 5 6]]，与正文第三节一致；队列最长 3（本轮宽度，不是总节点数）</text>
  <text x="500" y="436" text-anchor="middle" font-size="12.5" fill="#14532d">快照的意义：入队会让队列变长，先记下 size 才能划出「这一轮该处理几个」的边界</text>
</svg>
