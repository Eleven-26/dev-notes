<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">同一张 5 元环，三种容器给出三种扩展顺序</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">边集 0-1 1-2 2-3 0-4 4-3｜邻接表按此顺序插入｜三条顺序均为正文 1.2、3.2、第四节实跑读数</text>

  <rect x="20" y="84" width="350" height="320" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="36" y="108" font-size="14" font-weight="bold" fill="#0f172a">A. 本篇的 5 元环对照图</text>

  <line x1="195" y1="151" x2="275" y2="209" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="275" y1="209" x2="244" y2="303" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="244" y1="303" x2="146" y2="303" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="146" y1="303" x2="115" y2="209" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="115" y1="209" x2="195" y2="151" stroke="#94a3b8" stroke-width="1.6"/>

  <circle cx="195" cy="151" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <circle cx="275" cy="209" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <circle cx="115" cy="209" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <circle cx="244" cy="303" r="17" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <circle cx="146" cy="303" r="17" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>

  <text x="195" y="156" text-anchor="middle" font-size="13" fill="#1e40af">0</text>
  <text x="275" y="214" text-anchor="middle" font-size="13" fill="#14532d">1</text>
  <text x="115" y="214" text-anchor="middle" font-size="13" fill="#14532d">4</text>
  <text x="244" y="308" text-anchor="middle" font-size="13" fill="#9a3412">2</text>
  <text x="146" y="308" text-anchor="middle" font-size="13" fill="#9a3412">3</text>

  <text x="212" y="142" font-size="10.5" fill="#2563eb">dist 0</text>
  <text x="296" y="200" font-size="10.5" fill="#16a34a">dist 1</text>
  <text x="40" y="200" font-size="10.5" fill="#16a34a">dist 1</text>
  <text x="266" y="292" font-size="10.5" fill="#ea580c">dist 2</text>
  <text x="96" y="292" font-size="10.5" fill="#ea580c">dist 2</text>

  <text x="36" y="348" font-size="11.5" fill="#0f172a">节点颜色 = BFS 层号（dist）</text>
  <text x="36" y="370" font-size="11.5" fill="#64748b">adj[0]=[1 4]、adj[1]=[0 2]、adj[2]=[1 3]</text>
  <text x="36" y="392" font-size="11.5" fill="#64748b">adj[3]=[2 4]、adj[4]=[0 3]</text>

  <rect x="386" y="84" width="594" height="320" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="402" y="108" font-size="14" font-weight="bold" fill="#0f172a">B. 起点同为 0，只换「下一个取谁」</text>

  <text x="402" y="140" font-size="13" font-weight="bold" fill="#16a34a">BFS｜容器 = 队列（FIFO：取最早放入的）</text>
  <text x="402" y="166" font-size="13.5" fill="#14532d">0 → [1 4] → [2 3]（一层铺完再铺下一层）</text>
  <text x="402" y="188" font-size="12" fill="#334155">dist = [0 1 2 2 1]：第二轮就定下 dist[4] = 1</text>

  <text x="402" y="224" font-size="13" font-weight="bold" fill="#2563eb">递归 DFS｜容器 = 调用栈（隐式 LIFO：钻到底）</text>
  <text x="402" y="250" font-size="13.5" fill="#1e40af">0 → 1 → 2 → 3 → 4（输出里没有「层」这个概念）</text>
  <text x="402" y="272" font-size="12" fill="#334155">点 4 最短距离是 1，却要沿这条路走满 4 跳才碰到</text>

  <text x="402" y="308" font-size="13" font-weight="bold" fill="#ea580c">显式栈 DFS｜容器 = 手工栈（同一份邻接表）</text>
  <text x="402" y="334" font-size="13.5" fill="#9a3412">0 → 4 → 3 → 2 → 1（4 反而第二个就被访问到）</text>
  <text x="402" y="356" font-size="12" fill="#334155">两种实现的序互为逆序：[0 1 2 3 4] vs [0 4 3 2 1]</text>

  <text x="402" y="386" font-size="11.5" fill="#64748b">要点：容器一换，访问序整个反过来——序不是图的固有属性</text>

  <rect x="20" y="420" width="960" height="88" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="10"/>
  <text x="500" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">差别不在算法，在容器决定的「下一个取谁」——同一份伪代码只换一行（1.1）</text>
  <text x="500" y="474" text-anchor="middle" font-size="12.5" fill="#1e40af">队列给层号（dist）→ 保证无权最短路；栈只给一条路径 → 保证可达。要距离只用 BFS，要携带并撤销路径状态只用 DFS + 回溯</text>
</svg>
