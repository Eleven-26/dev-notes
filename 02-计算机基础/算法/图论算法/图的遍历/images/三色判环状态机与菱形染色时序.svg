  <line x1="857" y1="470" x2="867" y2="470" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="36" y="512" font-size="10.5" fill="#334155">读法：⑥ 2 变灰后看向 3——3 已是黑色（后代早算完）⇒ 菱形依赖、不是环；若在别的路径上碰到「灰」才是回边。</text>
  <text x="36" y="536" font-size="10.5" fill="#334155">二色版在同一时刻只看到「D 访问过」，直接误报成环。真环 0→1→2→0：三色在 2→0 处「灰遇灰」返回 true，二色也 true。</text>
  <text x="36" y="560" font-size="10.5" fill="#64748b">⚠️ 二色只在无环图上判错，普通用例盖不住它——测试要专门放一个菱形依赖。</text>
</svg>
