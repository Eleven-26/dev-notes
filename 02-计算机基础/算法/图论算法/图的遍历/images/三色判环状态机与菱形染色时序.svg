  <circle cx="278" cy="470" r="9" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <circle cx="302" cy="470" r="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="326" cy="470" r="9" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <circle cx="358" cy="470" r="9" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <circle cx="382" cy="470" r="9" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <circle cx="406" cy="470" r="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="430" cy="470" r="9" fill="#334155" stroke="#0f172a" stroke-width="1"/>
  <circle cx="462" cy="470" r="9" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <circle cx="486" cy="470" r="9" fill="#334155" stroke="#0f172a" stroke-width="1"/>
