<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">三色判环状态机：白→灰→黑，灰遇灰才是环</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">菱形 A0→{1,2} 1→{3} 2→{3}：实测三色 false（无环）、二色 true（假阳性）；真环 0→1→2→0 两者均 true</text>

  <rect x="20" y="84" width="520" height="290" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="36" y="108" font-size="14" font-weight="bold" fill="#0f172a">A. 单个顶点的三态</text>

  <rect x="60" y="150" width="120" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="120" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">白 · 未访问</text>
  <rect x="240" y="150" width="120" height="56" rx="8" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <text x="300" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">灰 · 在路径上</text>
  <rect x="420" y="150" width="120" height="56" rx="8" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>
  <text x="480" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">黑 · 已完成</text>

  <line x1="180" y1="178" x2="236" y2="178" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="360" y1="178" x2="416" y2="178" stroke="#64748b" stroke-width="1.8"/>
  <text x="208" y="170" text-anchor="middle" font-size="10" fill="#2563eb">发现/压栈</text>
  <text x="388" y="170" text-anchor="middle" font-size="10" fill="#64748b">离开/弹栈</text>
  <path d="M 272 148 C 262 104 338 104 328 148" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="300" y="120" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#dc2626">灰→灰 = 回边 ⇒ 判环</text>

  <text x="60" y="232" font-size="9.5" fill="#64748b">还没被碰到</text>
  <text x="240" y="232" font-size="9.5" fill="#64748b">在当前递归栈上，后代未算完</text>
  <text x="420" y="232" font-size="9.5" fill="#64748b">子图全部查过，指向它不成环</text>

  <text x="36" y="268" font-size="11" fill="#334155">边 u→v 只看 v 的颜色：白 → 递归下去；灰 → 有环；黑 → 忽略</text>
  <text x="36" y="296" font-size="11" fill="#334155">本质 = 第三节四类边里的「回边 ⇔ 指向灰」</text>
  <text x="36" y="326" font-size="10" fill="#dc2626">⚠️ 二色只有 visited：分不清「灰」和「黑」，菱形被误报成环</text>
  <text x="36" y="350" font-size="10" fill="#64748b">坑：tin/tout 初值要填 -1，否则回边误判成交叉边</text>

  <rect x="560" y="84" width="420" height="290" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="576" y="108" font-size="14" font-weight="bold" fill="#0f172a">B. 菱形：D 被两条路径各到一次</text>

  <line x1="758" y1="152" x2="694" y2="196" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="782" y1="152" x2="846" y2="196" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="694" y1="218" x2="756" y2="262" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="846" y1="218" x2="784" y2="262" stroke="#94a3b8" stroke-width="1.8"/>
  <circle cx="770" cy="140" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="680" cy="205" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="860" cy="205" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="770" cy="275" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="770" y="145" text-anchor="middle" font-size="12" fill="#1e40af">A0</text>
  <text x="680" y="210" text-anchor="middle" font-size="12" fill="#1e40af">B1</text>
  <text x="860" y="210" text-anchor="middle" font-size="12" fill="#1e40af">C2</text>
  <text x="770" y="280" text-anchor="middle" font-size="12" fill="#1e40af">D3</text>
  <text x="576" y="310" font-size="10.5" fill="#64748b">弧表 0→{1,2} 1→{3} 2→{3}；第二次碰到 D 时它是黑色</text>

  <rect x="576" y="326" width="186" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="669" y="351" text-anchor="middle" font-size="11" fill="#14532d">三色 hasCycle = false ✅</text>
  <rect x="776" y="326" width="190" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="871" y="351" text-anchor="middle" font-size="11" fill="#991b1b">二色 hasCycle = true ❌ 假阳性</text>

  <rect x="20" y="390" width="960" height="190" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="36" y="414" font-size="13" font-weight="bold" fill="#0f172a">实测染色时间线（DFS 从 A 起；芯片顺序 = 顶点 0 1 2 3，灰=在路径、黑=完成、白=未访问）</text>

  <text x="72" y="444" text-anchor="middle" font-size="9.5" fill="#2563eb">① 0 灰</text>
  <text x="176" y="444" text-anchor="middle" font-size="9.5" fill="#2563eb">② 1 灰</text>
  <text x="280" y="444" text-anchor="middle" font-size="9.5" fill="#2563eb">③ 3 灰</text>
  <text x="384" y="444" text-anchor="middle" font-size="9.5" fill="#64748b">④ 3 黑</text>
  <text x="488" y="444" text-anchor="middle" font-size="9.5" fill="#64748b">⑤ 1 黑</text>
  <text x="592" y="444" text-anchor="middle" font-size="9.5" fill="#2563eb">⑥ 2 灰</text>
  <text x="696" y="444" text-anchor="middle" font-size="9.5" fill="#16a34a">⑦ 2→3 见黑</text>
  <text x="800" y="444" text-anchor="middle" font-size="9.5" fill="#64748b">⑧ 2 黑</text>
  <text x="904" y="444" text-anchor="middle" font-size="9.5" fill="#64748b">⑨ 0 黑</text>

  <circle cx="46" cy="470" r="9" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
