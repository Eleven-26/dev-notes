<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">DFS 时间线：一次进入、一次离开，区间包含即祖先</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">源点 0；tin/tout 与栈最大深度为容器实跑读数（go1.26.8），与正文 2.1 节时间线表一致</text>

  <text x="120" y="80" font-size="11" fill="#64748b">时间点 →</text>
  <text x="120" y="108" text-anchor="middle" font-size="10" fill="#64748b">0</text>
  <text x="190" y="108" text-anchor="middle" font-size="10" fill="#64748b">1</text>
  <text x="260" y="108" text-anchor="middle" font-size="10" fill="#64748b">2</text>
  <text x="330" y="108" text-anchor="middle" font-size="10" fill="#64748b">3</text>
  <text x="400" y="108" text-anchor="middle" font-size="10" fill="#64748b">4</text>
  <text x="470" y="108" text-anchor="middle" font-size="10" fill="#64748b">5</text>
  <text x="540" y="108" text-anchor="middle" font-size="10" fill="#64748b">6</text>
  <text x="610" y="108" text-anchor="middle" font-size="10" fill="#64748b">7</text>
  <text x="680" y="108" text-anchor="middle" font-size="10" fill="#64748b">8</text>
  <text x="750" y="108" text-anchor="middle" font-size="10" fill="#64748b">9</text>
  <text x="820" y="108" text-anchor="middle" font-size="10" fill="#64748b">10</text>
  <text x="890" y="108" text-anchor="middle" font-size="10" fill="#64748b">11</text>

  <line x1="120" y1="114" x2="120" y2="368" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="190" y1="114" x2="190" y2="368" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="260" y1="114" x2="260" y2="368" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="330" y1="114" x2="330" y2="368" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="400" y1="114" x2="400" y2="368" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="470" y1="114" x2="470" y2="368" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="540" y1="114" x2="540" y2="368" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="610" y1="114" x2="610" y2="368" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="680" y1="114" x2="680" y2="368" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="750" y1="114" x2="750" y2="368" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="820" y1="114" x2="820" y2="368" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="890" y1="114" x2="890" y2="368" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

  <rect x="120" y="122" width="770" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="132" y="140" font-size="11.5" fill="#1e40af">顶点 0　tin=0　tout=11</text>
  <rect x="190" y="154" width="630" height="26" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="202" y="172" font-size="11.5" fill="#14532d">顶点 1　tin=1　tout=10</text>
  <rect x="260" y="186" width="490" height="26" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="272" y="204" font-size="11.5" fill="#9a3412">顶点 4　tin=2　tout=9</text>

  <rect x="330" y="218" width="70" height="26" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="410" y="236" font-size="11.5" fill="#92400e">顶点 2　[3, 4)　叶子</text>
  <rect x="470" y="250" width="70" height="26" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="550" y="268" font-size="11.5" fill="#92400e">顶点 3　[5, 6)　叶子</text>
  <rect x="610" y="282" width="70" height="26" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="690" y="300" font-size="11.5" fill="#92400e">顶点 5　[7, 8)　叶子</text>

  <text x="120" y="336" text-anchor="middle" font-size="10.5" fill="#2563eb">进0</text>
  <text x="190" y="336" text-anchor="middle" font-size="10.5" fill="#2563eb">进1</text>
  <text x="260" y="336" text-anchor="middle" font-size="10.5" fill="#ea580c">进4</text>
  <text x="330" y="336" text-anchor="middle" font-size="10.5" fill="#b45309">进2</text>
  <text x="400" y="336" text-anchor="middle" font-size="10.5" fill="#dc2626">出2</text>
  <text x="470" y="336" text-anchor="middle" font-size="10.5" fill="#b45309">进3</text>
  <text x="540" y="336" text-anchor="middle" font-size="10.5" fill="#dc2626">出3</text>
  <text x="610" y="336" text-anchor="middle" font-size="10.5" fill="#b45309">进5</text>
  <text x="680" y="336" text-anchor="middle" font-size="10.5" fill="#dc2626">出5</text>
  <text x="750" y="336" text-anchor="middle" font-size="10.5" fill="#dc2626">出4</text>
  <text x="820" y="336" text-anchor="middle" font-size="10.5" fill="#dc2626">出1</text>
  <text x="890" y="336" text-anchor="middle" font-size="10.5" fill="#dc2626">出0</text>
  <text x="505" y="360" text-anchor="middle" font-size="11" fill="#64748b">每个顶点被「碰到」两次：进入记 tin、离开记 tout；栈最深 [0 1 4 2]（深度 4 = 当前路径长）</text>

  <rect x="20" y="384" width="960" height="96" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" rx="10"/>
  <text x="500" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">区间判据：u 是 v 的祖先 ⇔ [tin(v), tout(v)) 完全落在 [tin(u), tout(u)) 内</text>
  <text x="500" y="436" text-anchor="middle" font-size="12" fill="#92400e">实测复核：[2,9) ⊂ [0,11) ⇒ 0 是 4 的祖先；[3,4) ⊂ [1,10) ⇒ 1 是 2 的祖先</text>
  <text x="500" y="462" text-anchor="middle" font-size="12" fill="#92400e">⚠️ 2 的直接父节点是 4，但 2 在 1 的递归调用内部被发现——「祖先」看的是调用嵌套，不是父子边</text>
</svg>
