<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">DFS 生成树与四类边：蓝树边、绿前向、红回边、橙交叉</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">弧表 0→{1,2} 1→{3,5} 2→{4} 3→{4} 4→{2} 5→{4}；序 [0 1 3 4 2 5] 与分类为容器实跑（go1.26.8）</text>

  <text x="36" y="100" font-size="14" font-weight="bold" fill="#0f172a">A. 生成树（蓝）+ 三条非树边（虚线）</text>

  <line x1="250" y1="157" x2="250" y2="195" stroke="#2563eb" stroke-width="2"/>
  <line x1="238" y1="230" x2="178" y2="273" stroke="#2563eb" stroke-width="2"/>
  <line x1="262" y1="230" x2="337" y2="273" stroke="#2563eb" stroke-width="2"/>
  <line x1="165" y1="307" x2="165" y2="345" stroke="#2563eb" stroke-width="2"/>
  <line x1="165" y1="382" x2="165" y2="415" stroke="#2563eb" stroke-width="2"/>
  <path d="M 264 146 C 400 175 425 415 186 431" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 4"/>
  <path d="M 146 425 C 98 408 98 390 146 373" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>
  <line x1="334" y1="300" x2="186" y2="360" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="6 4"/>

  <circle cx="250" cy="140" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="250" cy="215" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="165" cy="290" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="350" cy="290" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="165" cy="365" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="165" cy="435" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="145" text-anchor="middle" font-size="13" fill="#1e40af">0</text>
  <text x="250" y="220" text-anchor="middle" font-size="13" fill="#1e40af">1</text>
  <text x="165" y="295" text-anchor="middle" font-size="13" fill="#1e40af">3</text>
  <text x="350" y="295" text-anchor="middle" font-size="13" fill="#1e40af">5</text>
  <text x="165" y="370" text-anchor="middle" font-size="13" fill="#1e40af">4</text>
  <text x="165" y="440" text-anchor="middle" font-size="13" fill="#1e40af">2</text>

  <text x="250" y="115" text-anchor="middle" font-size="9.5" fill="#64748b">0 [0,11)</text>
  <text x="272" y="212" font-size="9.5" fill="#64748b">1 [1,10)</text>
  <text x="142" y="276" text-anchor="end" font-size="9.5" fill="#64748b">3 [2,7)</text>
  <text x="372" y="276" font-size="9.5" fill="#64748b">5 [8,9)</text>
  <text x="95" y="352" text-anchor="end" font-size="9.5" fill="#64748b">4 [3,6)</text>
  <text x="95" y="422" text-anchor="end" font-size="9.5" fill="#64748b">2 [4,5)</text>

  <text x="98" y="182" font-size="9.5" fill="#2563eb">树边（发现新顶点）</text>
  <text x="418" y="300" font-size="10" fill="#16a34a">前向 0→2</text>
  <text x="60" y="404" font-size="10" fill="#dc2626">回边 2→4</text>
  <text x="262" y="322" font-size="10" fill="#ea580c">交叉 5→4</text>

  <rect x="540" y="86" width="440" height="420" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="556" y="110" font-size="14" font-weight="bold" fill="#0f172a">B. 四类边判据（区间复核实测）</text>

  <rect x="556" y="126" width="408" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="568" y="148" font-size="12" font-weight="bold" fill="#1e40af">树边：v 由 u 直接发现（parent[v]==u）</text>
  <text x="568" y="172" font-size="10.5" fill="#1e40af">实测 5 条：0→1、1→3、3→4、4→2、1→5</text>

  <rect x="556" y="198" width="408" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="568" y="220" font-size="12" font-weight="bold" fill="#14532d">前向边：指向后代但不是树边（捷径）</text>
  <text x="568" y="244" font-size="10.5" fill="#14532d">0→2：[4,5) 落在 [0,11) 内，但 parent[2]=4</text>

  <rect x="556" y="270" width="408" height="62" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="568" y="292" font-size="12" font-weight="bold" fill="#991b1b">回边：指向还在栈上的祖先 ⇒ 成环</text>
  <text x="568" y="316" font-size="10.5" fill="#991b1b">2→4：[3,6) 包住 [4,5)，4 尚未完成 ⇒ 环 4→2→4</text>

  <rect x="556" y="342" width="408" height="62" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="568" y="364" font-size="12" font-weight="bold" fill="#9a3412">交叉边：指向已完成的另一棵子树</text>
  <text x="568" y="388" font-size="10.5" fill="#9a3412">5→4：[8,9) 与 [3,6) 不相交，4 已染黑 ⇒ 不成环</text>

  <text x="556" y="424" font-size="10.5" fill="#64748b">⚠️ 单靠区间分不出树边与前向边：两者都是「后代」，</text>
  <text x="556" y="444" font-size="10.5" fill="#64748b">要再拿 parent[v]==u 补一刀（正文 3.2 节）</text>
  <text x="556" y="480" font-size="10.5" fill="#64748b">树边按「谁发现了谁」归类，与弧表书写次序无关</text>

  <rect x="20" y="514" width="960" height="88" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="10"/>
  <text x="500" y="540" text-anchor="middle" font-size="12.5" fill="#14532d">定理（实测）：无向图 DFS 生成树只有树边和回边——6 点 7 边图上树边 5 + 回边 {2-0, 3-0} 共 2 = 7 = E，前向边与交叉边均为 0</text>
  <text x="500" y="566" text-anchor="middle" font-size="12.5" fill="#14532d">推论：无向图判环 = 「有没有回边」；有向图必须用三色把回边（成环）与交叉边（不成环）分开</text>
  <text x="500" y="590" text-anchor="middle" font-size="11" fill="#14532d">SCC、桥与割点、DAG 最长路也都建立在这四类边上（见 ../割点与桥.md、../强连通分量.md）</text>
</svg>
