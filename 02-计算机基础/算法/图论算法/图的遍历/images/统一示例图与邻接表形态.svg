<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">统一示例图：6 点 7 边无向图与邻接表形态</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">邻接表按编号升序插入；全篇访问序、树边、栈/队列快照都以这张图与这份读数为准</text>

  <rect x="20" y="76" width="440" height="350" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="36" y="100" font-size="15" font-weight="bold" fill="#0f172a">A. 拓扑：分支 + 汇聚</text>
  <text x="36" y="118" font-size="10.5" fill="#64748b">0 分三个孩子；1、2、3 汇聚到 4</text>

  <line x1="225" y1="170" x2="135" y2="230" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="240" y1="178" x2="240" y2="222" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="255" y1="170" x2="345" y2="230" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="135" y1="250" x2="225" y2="310" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="240" y1="258" x2="240" y2="302" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="345" y1="250" x2="255" y2="310" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="240" y1="338" x2="240" y2="362" stroke="#94a3b8" stroke-width="1.6"/>

  <circle cx="240" cy="160" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="120" cy="240" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="240" cy="240" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="360" cy="240" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="240" cy="320" r="18" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <circle cx="240" cy="380" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="240" y="165" text-anchor="middle" font-size="14" fill="#1e40af">0</text>
  <text x="120" y="245" text-anchor="middle" font-size="14" fill="#1e40af">1</text>
  <text x="240" y="245" text-anchor="middle" font-size="14" fill="#1e40af">2</text>
  <text x="360" y="245" text-anchor="middle" font-size="14" fill="#1e40af">3</text>
  <text x="240" y="325" text-anchor="middle" font-size="14" fill="#9a3412">4</text>
  <text x="240" y="385" text-anchor="middle" font-size="14" fill="#1e40af">5</text>

  <text x="36" y="418" font-size="10.5" fill="#64748b">边集 0-1 0-2 0-3 1-4 2-4 3-4 4-5：V=6、E=7（橙色 4 是汇聚点）</text>

  <rect x="480" y="76" width="500" height="350" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="496" y="100" font-size="15" font-weight="bold" fill="#0f172a">B. 邻接表 = 顶点数组 + 邻居链表</text>

  <text x="520" y="118" text-anchor="middle" font-size="10.5" fill="#64748b">顶点数组</text>
  <text x="600" y="118" font-size="10.5" fill="#64748b">每行一条链表（度数 = 链长）</text>

  <rect x="500" y="128" width="40" height="28" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <rect x="500" y="172" width="40" height="28" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <rect x="500" y="216" width="40" height="28" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <rect x="500" y="260" width="40" height="28" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <rect x="500" y="304" width="40" height="28" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <rect x="500" y="348" width="40" height="28" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="520" y="147" text-anchor="middle" font-size="12" fill="#92400e">0</text>
  <text x="520" y="191" text-anchor="middle" font-size="12" fill="#92400e">1</text>
  <text x="520" y="235" text-anchor="middle" font-size="12" fill="#92400e">2</text>
  <text x="520" y="279" text-anchor="middle" font-size="12" fill="#92400e">3</text>
  <text x="520" y="323" text-anchor="middle" font-size="12" fill="#92400e">4</text>
  <text x="520" y="367" text-anchor="middle" font-size="12" fill="#92400e">5</text>

  <line x1="540" y1="142" x2="576" y2="142" stroke="#64748b" stroke-width="1.5"/>
  <line x1="540" y1="186" x2="576" y2="186" stroke="#64748b" stroke-width="1.5"/>
  <line x1="540" y1="230" x2="576" y2="230" stroke="#64748b" stroke-width="1.5"/>
  <line x1="540" y1="274" x2="576" y2="274" stroke="#64748b" stroke-width="1.5"/>
  <line x1="540" y1="318" x2="576" y2="318" stroke="#64748b" stroke-width="1.5"/>
  <line x1="540" y1="362" x2="576" y2="362" stroke="#64748b" stroke-width="1.5"/>

  <rect x="578" y="130" width="34" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="620" y="130" width="34" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="662" y="130" width="34" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="578" y="174" width="34" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="620" y="174" width="34" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="578" y="218" width="34" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="620" y="218" width="34" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="578" y="262" width="34" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="620" y="262" width="34" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="578" y="306" width="34" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="620" y="306" width="34" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="662" y="306" width="34" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="704" y="306" width="34" height="24" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <rect x="578" y="350" width="34" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>

  <line x1="612" y1="142" x2="620" y2="142" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="654" y1="142" x2="662" y2="142" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="612" y1="186" x2="620" y2="186" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="612" y1="230" x2="620" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="612" y1="274" x2="620" y2="274" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="612" y1="318" x2="620" y2="318" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="654" y1="318" x2="662" y2="318" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="696" y1="318" x2="704" y2="318" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="595" y="147" text-anchor="middle" font-size="12" fill="#1e40af">1</text>
  <text x="637" y="147" text-anchor="middle" font-size="12" fill="#1e40af">2</text>
  <text x="679" y="147" text-anchor="middle" font-size="12" fill="#1e40af">3</text>
  <text x="595" y="191" text-anchor="middle" font-size="12" fill="#1e40af">0</text>
  <text x="637" y="191" text-anchor="middle" font-size="12" fill="#1e40af">4</text>
  <text x="595" y="235" text-anchor="middle" font-size="12" fill="#1e40af">0</text>
  <text x="637" y="235" text-anchor="middle" font-size="12" fill="#1e40af">4</text>
  <text x="595" y="279" text-anchor="middle" font-size="12" fill="#1e40af">0</text>
  <text x="637" y="279" text-anchor="middle" font-size="12" fill="#1e40af">4</text>
  <text x="595" y="323" text-anchor="middle" font-size="12" fill="#1e40af">1</text>
  <text x="637" y="323" text-anchor="middle" font-size="12" fill="#1e40af">2</text>
  <text x="679" y="323" text-anchor="middle" font-size="12" fill="#1e40af">3</text>
  <text x="721" y="323" text-anchor="middle" font-size="12" fill="#9a3412">5</text>
  <text x="595" y="367" text-anchor="middle" font-size="12" fill="#1e40af">4</text>

  <text x="770" y="147" font-size="11" fill="#64748b">adj[0] = [1 2 3]</text>
  <text x="770" y="191" font-size="11" fill="#64748b">adj[1] = [0 4]</text>
  <text x="770" y="235" font-size="11" fill="#64748b">adj[2] = [0 4]</text>
  <text x="770" y="279" font-size="11" fill="#64748b">adj[3] = [0 4]</text>
  <text x="770" y="323" font-size="11" fill="#64748b">adj[4] = [1 2 3 5]</text>
  <text x="770" y="367" font-size="11" fill="#64748b">adj[5] = [4]</text>
  <text x="496" y="410" font-size="10.5" fill="#64748b">链表顺序改变访问序、不改变正确性；换序前先把这份升序表当作基准</text>

  <rect x="20" y="442" width="960" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="10"/>
  <text x="500" y="466" text-anchor="middle" font-size="13" fill="#14532d">复杂度 O(V+E) 的账记在这张形态图上：顶点各处理一次（V）、邻居链表各项被看一次（无向 2E / 有向 E）</text>
  <text x="500" y="490" text-anchor="middle" font-size="12" fill="#14532d">实测：V=6、E=7，递归 DFS 查看邻接表项 14 次 = 2E（与正文第九节一致）</text>
</svg>
