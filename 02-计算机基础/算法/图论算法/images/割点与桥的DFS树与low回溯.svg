<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">割点与桥：一次 DFS 里 dfn / low 怎么被回边拉低</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">图：0—1, 1—2, 2—0, 1—3, 3—4, 4—5, 5—3；从 0 起 DFS，节点下方写 dfn / low</text>

  <g transform="translate(20,78)">
    <rect x="0" y="0" width="960" height="410" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. DFS 生成树：实线是树边，虚线是回边</text>

    <line x1="110" y1="140" x2="208" y2="140" stroke="#64748b" stroke-width="1.8"/>
    <line x1="248.7" y1="133.0" x2="371.3" y2="87.0" stroke="#64748b" stroke-width="1.8"/>
    <line x1="248.7" y1="147.0" x2="371.3" y2="193.0" stroke="#64748b" stroke-width="1.8"/>
    <line x1="410" y1="200" x2="508" y2="200" stroke="#64748b" stroke-width="1.8"/>
    <line x1="550" y1="200" x2="648" y2="200" stroke="#64748b" stroke-width="1.8"/>

    <path d="M 385 62 C 360 25 150 25 95 118" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ay)"/>
    <path d="M 670 220 C 660 292 400 292 392 222" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ay)"/>

    <circle cx="90" cy="140" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="90" y="140" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">0</text>
    <circle cx="230" cy="140" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="230" y="140" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#991b1b">1</text>
    <circle cx="390" cy="80" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="390" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">2</text>
    <circle cx="390" cy="200" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="390" y="200" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#991b1b">3</text>
    <circle cx="530" cy="200" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="530" y="200" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">4</text>
    <circle cx="670" cy="200" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="670" y="200" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">5</text>

    <text x="90" y="172" text-anchor="middle" font-size="10" fill="#334155">dfn 1 / low 1</text>
    <text x="230" y="172" text-anchor="middle" font-size="10" fill="#991b1b">dfn 2 / low 1</text>
    <text x="390" y="112" text-anchor="middle" font-size="10" fill="#334155">dfn 3 / low 1</text>
    <text x="390" y="232" text-anchor="middle" font-size="10" fill="#991b1b">dfn 4 / low 4</text>
    <text x="530" y="232" text-anchor="middle" font-size="10" fill="#334155">dfn 5 / low 4</text>
    <text x="670" y="232" text-anchor="middle" font-size="10" fill="#334155">dfn 6 / low 4</text>

    <text x="245" y="56" text-anchor="middle" font-size="10" fill="#b45309">回边 2—0</text>
    <text x="530" y="316" text-anchor="middle" font-size="10" fill="#b45309">回边 5—3</text>

    <text x="30" y="356" font-size="11.5" fill="#0f172a">回边 2—0 把 low[2] 从 3 压到 1；回边 5—3 把 low[5] 从 6 压到 4</text>
    <text x="30" y="380" font-size="10.5" fill="#64748b">low[u] 的初值就是 dfn[u]；无向图的非树边全是回边（没有横叉边），所以 low 只会被 dfn 更小的点压小</text>
    <text x="30" y="402" font-size="10.5" fill="#991b1b">红色节点 1 与 3 = 割点（单点故障）：删掉任一个，图就分成两块</text>
  </g>

  <g transform="translate(20,508)">
    <rect x="0" y="0" width="960" height="116" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#92400e">B. 判定核对（数字全部抄自本篇第二节的手推结果）</text>
    <text x="14" y="54" font-size="12" fill="#92400e">点 1：孩子 3 满足 low[3]=4 ≥ dfn[1]=2 → 是割点；点 3：孩子 4 满足 low[4]=4 ≥ dfn[3]=4 → 是割点</text>
    <text x="14" y="80" font-size="12" fill="#92400e">点 0：根节点、只有 1 棵子树 → 不是割点；点 2 无孩子，点 4 的孩子 5 不满足判据 → 都不是割点</text>
    <text x="14" y="106" font-size="12" fill="#92400e">桥：low[3]=4 &gt; dfn[1]=2 → 只有边 (1,3) 是桥（low[4]=4 == dfn[3]=4、low[5]=4 &lt; dfn[4]=5，故 (3,4) 与 (4,5) 都不是桥）</text>
  </g>
</svg>
