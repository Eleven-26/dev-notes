<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <defs>
    <marker id="dcArrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="480" fill="#ffffff"/>
  <text x="40" y="46" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#0f172a">差分约束：三种不等式 → 一张有向图</text>
  <text x="40" y="74" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">先把每条约束统一成同一种形态，再按「右边减左边」定边的方向与权重</text>

  <text x="62" y="112" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b">原约束</text>
  <text x="362" y="112" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b">统一成 ≤ 型</text>
  <text x="662" y="112" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b">建的边（跑最短路）</text>

  <rect x="50" y="126" width="280" height="68" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="158" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#2563eb">x_j − x_i ≤ w</text>
  <text x="70" y="181" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">上界：j 比 i 至多大 w</text>
  <rect x="350" y="126" width="280" height="68" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="370" y="158" font-family="system-ui, sans-serif" font-size="15" fill="#334155">原样（已是 ≤ 型）</text>
  <text x="370" y="181" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">不需要变形</text>
  <rect x="650" y="126" width="300" height="68" rx="10" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="670" y="158" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#16a34a">i → j，权 w</text>
  <text x="670" y="181" font-family="system-ui, sans-serif" font-size="13" fill="#166534">dist[j] 被 dist[i]+w 压住（取 min）</text>
  <line x1="332" y1="160" x2="346" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#dcArrowA)"/>
  <line x1="632" y1="160" x2="646" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#dcArrowA)"/>

  <rect x="50" y="226" width="280" height="68" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="258" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#ea580c">x_j − x_i ≥ w</text>
  <text x="70" y="281" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">下界：j 比 i 至少大 w</text>
  <rect x="350" y="226" width="280" height="68" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="370" y="258" font-family="system-ui, sans-serif" font-size="16" fill="#334155">x_i − x_j ≤ −w</text>
  <text x="370" y="281" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">两边取负、移项</text>
  <rect x="650" y="226" width="300" height="68" rx="10" fill="#fee2e2" stroke="#fecaca"/>
  <text x="670" y="258" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#dc2626">j → i，权 −w</text>
  <text x="670" y="281" font-family="system-ui, sans-serif" font-size="13" fill="#991b1b">方向反过来、权重取负</text>
  <line x1="332" y1="260" x2="346" y2="260" stroke="#94a3b8" stroke-width="2" marker-end="url(#dcArrowA)"/>
  <line x1="632" y1="260" x2="646" y2="260" stroke="#94a3b8" stroke-width="2" marker-end="url(#dcArrowA)"/>

  <rect x="50" y="326" width="280" height="68" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="358" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#2563eb">x_j − x_i = w</text>
  <text x="70" y="381" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">恰好大 w（最难对付的一种）</text>
  <rect x="350" y="326" width="280" height="68" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="370" y="358" font-family="system-ui, sans-serif" font-size="15" fill="#334155">拆成 ≤ w 与 ≥ w 两条</text>
  <text x="370" y="381" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">少建一条就松了一半</text>
  <rect x="650" y="326" width="300" height="68" rx="10" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="670" y="358" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563eb">两条边（方向相反）</text>
  <text x="670" y="381" font-family="system-ui, sans-serif" font-size="13" fill="#1e40af">各带自己的权重</text>
  <line x1="332" y1="360" x2="346" y2="360" stroke="#94a3b8" stroke-width="2" marker-end="url(#dcArrowA)"/>
  <line x1="632" y1="360" x2="646" y2="360" stroke="#94a3b8" stroke-width="2" marker-end="url(#dcArrowA)"/>

  <rect x="50" y="414" width="900" height="52" rx="10" fill="#ffedd5" stroke="#fed7aa"/>
  <text x="70" y="438" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#b45309">⭐ 方向口诀：小的指向大的，权是那个差 —— 「≤」沿边取 min 压住、「≥」沿边取 max 顶起</text>
  <text x="70" y="458" font-family="system-ui, sans-serif" font-size="13" fill="#b45309">另加超级源点 S → 每个变量（权 0），给全体变量一个共同的界</text>
</svg>
