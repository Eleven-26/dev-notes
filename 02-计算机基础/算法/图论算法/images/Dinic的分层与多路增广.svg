<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 6,3.5 0,7 z" fill="#2563eb"/></marker>
    <marker id="arwS" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 6,3.5 0,7 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Dinic：BFS 分层 + DFS 多路增广，两轮跑出最大流 5</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">样例同第一节：s→a:3、s→b:2、a→t:2、a→b:1、b→t:3；level 不是距离，是给 DFS 限方向的水位</text>

  <g transform="translate(20,78)">
    <rect x="0" y="0" width="460" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 第 1 轮：分层 s(0) → a(1), b(1) → t(2)</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">水位：s=0、a=b=1、t=2；a→b 是 1→1 同层边，本轮不可用</text>

    <line x1="65" y1="149" x2="195" y2="99" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="64" y1="163" x2="196" y2="232" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="229" y1="98" x2="381" y2="149" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="228" y1="232" x2="382" y2="163" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="212" y1="110" x2="212" y2="222" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arwS)"/>

    <text x="125" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">推 2</text>
    <text x="124" y="209" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">推 2</text>
    <text x="309" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">推 2</text>
    <text x="310" y="209" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">推 2</text>
    <text x="222" y="169" font-size="10" fill="#64748b">同层边，本轮不可用</text>

    <circle cx="48" cy="155" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="48" y="155" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e3a8a">s</text>
    <circle cx="212" cy="92" r="18" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
    <text x="212" y="92" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">a</text>
    <circle cx="212" cy="240" r="18" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
    <text x="212" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">b</text>
    <circle cx="398" cy="155" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="398" y="155" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e3a8a">t</text>

    <text x="14" y="272" font-size="10" fill="#334155">本轮共推 4：s→a→t 推 2（a→t 饱和）、s→b→t 推 2（s→b 饱和）</text>
  </g>

  <g transform="translate(520,78)">
    <rect x="0" y="0" width="460" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 第 2 轮：水位 s(0)→a(1)→b(2)→t(3)</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">s→b 残量为 0，b 只能挂在 a 后面；a→b 残 1，水位允许了</text>

    <line x1="65" y1="149" x2="195" y2="99" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="64" y1="163" x2="196" y2="232" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arwS)"/>
    <line x1="229" y1="98" x2="381" y2="149" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arwS)"/>
    <line x1="228" y1="232" x2="382" y2="163" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="212" y1="110" x2="212" y2="222" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <text x="125" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">推 1</text>
    <text x="124" y="209" text-anchor="middle" font-size="10" fill="#94a3b8">残量 0</text>
    <text x="309" y="111" text-anchor="middle" font-size="10" fill="#94a3b8">已饱和</text>
    <text x="310" y="209" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">推 1</text>
    <text x="222" y="169" font-size="11" font-weight="bold" fill="#1e40af">推 1</text>

    <circle cx="48" cy="155" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="48" y="155" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e3a8a">s</text>
    <circle cx="212" cy="92" r="18" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
    <text x="212" y="92" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">a</text>
    <circle cx="212" cy="240" r="18" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
    <text x="212" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">b</text>
    <circle cx="398" cy="155" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="398" y="155" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e3a8a">t</text>

    <text x="14" y="272" font-size="10" fill="#334155">第 3 轮 BFS：s 的两条出边残量全为 0，t 不可达 → 结束；累计 flow = 4 + 1 = 5</text>
  </g>

  <g transform="translate(20,398)">
    <rect x="0" y="0" width="960" height="160" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#92400e">C. Dinic 的四步循环与「最大流 = 最小割」</text>

    <rect x="14" y="48" width="212" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="24" y="66" font-size="10.5" font-weight="bold" fill="#1e40af">① BFS 分层</text>
    <text x="24" y="84" font-size="9.5" fill="#1e40af">算出 level[]，汇点不可达就结束</text>

    <rect x="252" y="48" width="212" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="262" y="66" font-size="10.5" font-weight="bold" fill="#1e40af">② DFS 多路增广</text>
    <text x="262" y="84" font-size="9.5" fill="#1e40af">只走 level + 1 的边，一次推多条</text>

    <rect x="490" y="48" width="212" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="500" y="66" font-size="10.5" font-weight="bold" fill="#1e40af">③ 当前弧优化</text>
    <text x="500" y="84" font-size="9.5" fill="#1e40af">cur[] 记下一条没试过的出边</text>

    <rect x="728" y="48" width="212" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="738" y="66" font-size="10.5" font-weight="bold" fill="#14532d">④ 回到 ①，直到无增广路</text>
    <text x="738" y="84" font-size="9.5" fill="#14532d">总流量 2 + 2 + 1 = 5</text>

    <line x1="226" y1="70" x2="250" y2="70" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="464" y1="70" x2="488" y2="70" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="702" y1="70" x2="726" y2="70" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <text x="14" y="112" font-size="10.5" fill="#92400e">⭐ 分层让 DFS 只在有向无环的分层图上跑；当前弧保证每条边每轮只试一次 —— 这就是 O(V²E) 的来源</text>
    <text x="14" y="134" font-size="10.5" fill="#92400e">割的对齐：S={s,a,b} / T={t}，跨割边 a→t(2) + b→t(3) = 5 = 最大流</text>
  </g>
</svg>
