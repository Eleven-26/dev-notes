<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="mB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">增广路的形态：两端未匹配，匹配边与非匹配边交替</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">样例与步骤号抄自正文第二节「抢座」推演块：u0 连 v0、v1；u1 只连 v0</text>

  <g transform="translate(20,84)">
    <rect x="0" y="0" width="460" height="420" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 第 2 轮找到的那条增广路</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">已有匹配 v0–u0；起点 u1、终点 v1 都未匹配</text>

    <line x1="137" y1="120" x2="323" y2="120" stroke="#16a34a" stroke-width="3"/>
    <line x1="136" y1="137" x2="324" y2="263" stroke="#2563eb" stroke-width="1.6"/>
    <line x1="136" y1="263" x2="324" y2="137" stroke="#2563eb" stroke-width="1.6"/>

    <text x="230" y="110" text-anchor="middle" font-size="9.5" fill="#14532d">匹配边 v0–u0</text>
    <text x="230" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">②</text>
    <text x="172" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">①</text>
    <text x="300" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">③</text>
    <text x="175" y="285" text-anchor="middle" font-size="9.5" fill="#1e40af">非匹配边</text>
    <text x="300" y="180" text-anchor="middle" font-size="9.5" fill="#1e40af">非匹配边</text>

    <circle cx="110" cy="120" r="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1e40af">u0</text>
    <circle cx="110" cy="280" r="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="280" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1e40af">u1</text>
    <circle cx="350" cy="120" r="27" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="350" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#14532d">v0</text>
    <circle cx="350" cy="280" r="27" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="350" y="280" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#14532d">v1</text>

    <text x="110" y="335" text-anchor="middle" font-size="9.5" fill="#64748b">未匹配起点</text>
    <text x="350" y="335" text-anchor="middle" font-size="9.5" fill="#64748b">未匹配终点</text>

    <text x="14" y="370" font-size="10" fill="#334155">交替规则：非匹配边① → 匹配边② → 非匹配边③</text>
    <text x="14" y="392" font-size="10" fill="#334155">沿途取反 ⇒ 匹配数 +1：u1–v0、u0–v1 双双成立</text>
    <text x="14" y="414" font-size="10" fill="#334155">同一轮里右侧点只试一次，visited 记号挡住回头</text>
  </g>

  <g transform="translate(500,84)">
    <rect x="0" y="0" width="460" height="420" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 增广之后：两条匹配边</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">第 2 轮结束：v0–u1、v1–u0，匹配数 2</text>

    <line x1="137" y1="120" x2="323" y2="120" stroke="#2563eb" stroke-width="1.6"/>
    <line x1="136" y1="137" x2="324" y2="263" stroke="#16a34a" stroke-width="3"/>
    <line x1="136" y1="263" x2="324" y2="137" stroke="#16a34a" stroke-width="3"/>

    <text x="230" y="110" text-anchor="middle" font-size="9.5" fill="#1e40af">非匹配边（留着）</text>

    <circle cx="110" cy="120" r="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1e40af">u0</text>
    <circle cx="110" cy="280" r="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="280" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1e40af">u1</text>
    <circle cx="350" cy="120" r="27" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="350" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#14532d">v0</text>
    <circle cx="350" cy="280" r="27" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="350" y="280" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#14532d">v1</text>

    <text x="228" y="186" text-anchor="middle" font-size="9.5" fill="#14532d">匹配边 v1–u0</text>
    <text x="232" y="222" text-anchor="middle" font-size="9.5" fill="#14532d">匹配边 v0–u1</text>

    <text x="14" y="370" font-size="10" fill="#334155">每个左部点各占一席、右侧无二主 ⇒ 最大匹配 = 2</text>
    <text x="14" y="392" font-size="10" fill="#334155">再找不到两端都空的路 ⇒ 无法继续增广</text>
    <text x="14" y="414" font-size="10" fill="#334155">匹配不变式：任意两条匹配边没有公共端点</text>
  </g>

  <g transform="translate(20,528)">
    <rect x="0" y="0" width="960" height="64" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="11" fill="#14532d">三类边速记：匹配边（绿粗，成对占用）/ 非匹配边（蓝细，交错路的候选）/ 两端未匹配的起止点（一左一右）</text>
    <text x="14" y="50" font-size="10.5" fill="#166534">⚠️ 增广路必须从未匹配的左部点出发、到未匹配的右部点终止，中间严格交替 —— 缺一端就不算增广路</text>
  </g>
</svg>
