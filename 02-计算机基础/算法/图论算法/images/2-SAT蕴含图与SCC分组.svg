<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="bB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="bR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">2-SAT 的蕴含图：子句拆成边，矛盾就是「真假同群」</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">结点编号 2i=真、2i+1=假；边与 SCC 分组抄自正文第二节推演块</text>

  <g transform="translate(20,84)">
    <rect x="0" y="0" width="600" height="450" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 两变量三子句，六条边两个群</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">子句：(x1∨x2)、(¬x1∨x2)、(x1∨¬x2)</text>

    <rect x="115" y="74" width="370" height="92" fill="none" stroke="#b45309" stroke-width="1.2" stroke-dasharray="6 4" rx="10"/>
    <text x="124" y="92" font-size="9.5" font-weight="bold" fill="#92400e">SCC①：{0, 2}</text>
    <rect x="115" y="254" width="370" height="92" fill="none" stroke="#b45309" stroke-width="1.2" stroke-dasharray="6 4" rx="10"/>
    <text x="124" y="272" font-size="9.5" font-weight="bold" fill="#92400e">SCC②：{1, 3}</text>

    <line x1="194" y1="110" x2="406" y2="110" stroke="#2563eb" stroke-width="1.5" marker-end="url(#bB)"/>
    <line x1="406" y1="132" x2="194" y2="132" stroke="#2563eb" stroke-width="1.5" marker-end="url(#bB)"/>
    <line x1="194" y1="290" x2="406" y2="290" stroke="#2563eb" stroke-width="1.5" marker-end="url(#bB)"/>
    <line x1="406" y1="312" x2="194" y2="312" stroke="#2563eb" stroke-width="1.5" marker-end="url(#bB)"/>
    <line x1="189" y1="282" x2="411" y2="138" stroke="#2563eb" stroke-width="1.5" marker-end="url(#bB)"/>
    <line x1="411" y1="282" x2="189" y2="138" stroke="#2563eb" stroke-width="1.5" marker-end="url(#bB)"/>

    <line x1="160" y1="152" x2="160" y2="268" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="440" y1="152" x2="440" y2="268" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>

    <text x="300" y="100" text-anchor="middle" font-size="9.5" fill="#2563eb">0→2</text>
    <text x="300" y="148" text-anchor="middle" font-size="9.5" fill="#2563eb">2→0</text>
    <text x="300" y="282" text-anchor="middle" font-size="9.5" fill="#2563eb">1→3</text>
    <text x="300" y="330" text-anchor="middle" font-size="9.5" fill="#2563eb">3→1</text>
    <text x="245" y="240" text-anchor="middle" font-size="9.5" fill="#2563eb">1→2</text>
    <text x="355" y="240" text-anchor="middle" font-size="9.5" fill="#2563eb">3→0</text>

    <circle cx="160" cy="120" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="120" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#1e40af">0</text>
    <circle cx="160" cy="300" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="300" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#1e40af">1</text>
    <circle cx="440" cy="120" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="440" y="120" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#1e40af">2</text>
    <circle cx="440" cy="300" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="440" y="326" text-anchor="middle" font-size="9.5" fill="#64748b">x2假</text>
    <text x="440" y="300" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#1e40af">3</text>
    <text x="160" y="146" text-anchor="middle" font-size="9.5" fill="#64748b">x1真</text>
    <text x="160" y="326" text-anchor="middle" font-size="9.5" fill="#64748b">x1假</text>
    <text x="440" y="146" text-anchor="middle" font-size="9.5" fill="#64748b">x2真</text>

    <text x="14" y="370" font-size="10" fill="#334155">实线箭头 = 蕴含边；竖虚线 = 互补方（同变量真假两端，恰取其一）</text>
    <text x="14" y="392" font-size="10" fill="#334155">互相蕴含：0→2 与 2→0 同群①；1→3 与 3→1 同群②</text>
    <text x="14" y="414" font-size="10" fill="#334155">群间只剩 1→2、3→0 单向；无变量真假同群 ⇒ 有解 x1=x2=true</text>
  </g>

  <g transform="translate(620,84)">
    <rect x="0" y="0" width="360" height="450" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 再加一条子句就矛盾</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">新增 (¬x1∨¬x2)：补边 0→3、2→1</text>

    <rect x="48" y="63" width="262" height="254" fill="none" stroke="#b45309" stroke-width="1.2" stroke-dasharray="6 4" rx="10"/>
    <text x="56" y="80" font-size="10" font-weight="bold" fill="#92400e">4 点并成一个 SCC</text>

    <line x1="199" y1="113" x2="259" y2="170" stroke="#2563eb" stroke-width="1.5" marker-end="url(#bB)"/>
    <line x1="261" y1="208" x2="200" y2="266" stroke="#dc2626" stroke-width="1.8" marker-end="url(#bR)"/>
    <line x1="161" y1="267" x2="99" y2="208" stroke="#2563eb" stroke-width="1.5" marker-end="url(#bB)"/>
    <line x1="97" y1="177" x2="159" y2="118" stroke="#2563eb" stroke-width="1.5" marker-end="url(#bB)"/>
    <line x1="159" y1="108" x2="97" y2="167" stroke="#dc2626" stroke-width="1.8" marker-end="url(#bR)"/>

    <circle cx="180" cy="95" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="95" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1e40af">0</text>
    <circle cx="280" cy="190" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="280" y="190" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1e40af">2</text>
    <circle cx="180" cy="285" r="24" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="180" y="285" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#991b1b">1</text>
    <circle cx="80" cy="190" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="190" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1e40af">3</text>

    <text x="14" y="340" font-size="10" fill="#991b1b">红边是新子句补的 0→3、2→1，与 0→2、1→3、</text>
    <text x="14" y="360" font-size="10" fill="#991b1b">3→0 拼成整圈 ⇒ 4 点同群，x1 的真假撞一起</text>
    <text x="14" y="384" font-size="9.5" fill="#64748b">（1→2、2→0 等其余边未画出，补上只会环更多）</text>
    <text x="14" y="406" font-size="9.5" fill="#64748b">回代对照：x1=x2=true 时新子句 (F∨F) 不过</text>
    <text x="14" y="430" font-size="10" font-weight="bold" fill="#991b1b">存在变量真假同群 ⇒ 无解</text>
  </g>
</svg>
