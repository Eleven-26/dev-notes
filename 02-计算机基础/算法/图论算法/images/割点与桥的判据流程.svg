<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">割点与桥的判定顺序：先看根、再看孩子，桥比割点多一个严格号</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">判据来自本篇第二、三节；dfn / low 在树上长什么样，见「DFS 树与 low 回溯」那张图</text>

  <g transform="translate(20,78)">
    <rect x="0" y="0" width="960" height="270" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 回溯到 u 时，逐个孩子 v 走完这两步</text>

    <rect x="14" y="48" width="300" height="86" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="72" font-size="11.5" font-weight="bold" fill="#1e40af">① 先问 u 是不是根</text>
    <text x="28" y="92" font-size="10" fill="#1e40af">根：只能看子树个数</text>
    <text x="28" y="110" font-size="9.5" fill="#1e40af">子树 ≥ 2 ⇒ 割点（本例根 0 只有 1 棵）</text>

    <rect x="324" y="48" width="300" height="86" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="338" y="72" font-size="11.5" font-weight="bold" fill="#92400e">② 非根：逐个孩子 v 检查</text>
    <text x="338" y="92" font-size="10" fill="#92400e">low[v] ≥ dfn[u] 成立</text>
    <text x="338" y="110" font-size="9.5" fill="#92400e">⇒ u 是割点（本例是 1 与 3）</text>

    <rect x="634" y="48" width="300" height="86" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="648" y="72" font-size="11.5" font-weight="bold" fill="#334155">反例方向：low[v] &lt; dfn[u]</text>
    <text x="648" y="92" font-size="10" fill="#334155">v 的子树能挂回边到 u 的祖先</text>
    <text x="648" y="110" font-size="9.5" fill="#334155">⇒ 删掉 u 也断不开，u 不是割点</text>

    <rect x="14" y="158" width="300" height="86" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="182" font-size="11.5" font-weight="bold" fill="#1e40af">③ 桥：同一次回溯顺手判</text>
    <text x="28" y="202" font-size="10" fill="#1e40af">low[v] &gt; dfn[u] ⇒ (u,v) 是桥</text>
    <text x="28" y="220" font-size="9.5" fill="#1e40af">本例只有 (1,3)：low[3]=4 &gt; dfn[1]=2</text>

    <rect x="324" y="158" width="300" height="86" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="338" y="182" font-size="11.5" font-weight="bold" fill="#92400e">④ 与割点只差一个等号</text>
    <text x="338" y="202" font-size="10" fill="#92400e">low[v] == dfn[u]：v 能绕回 u 本身</text>
    <text x="338" y="220" font-size="9.5" fill="#92400e">⇒ 除 (u,v) 外还有第二条路，不是桥</text>

    <rect x="634" y="158" width="300" height="86" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="648" y="182" font-size="11.5" font-weight="bold" fill="#991b1b">⚠️ 重边别用 v == parent 跳</text>
    <text x="648" y="202" font-size="10" fill="#991b1b">跳父边只对简单图成立</text>
    <text x="648" y="220" font-size="9.5" fill="#991b1b">重边要按边编号跳过「来时那条」</text>
  </g>

  <g transform="translate(20,368)">
    <rect x="0" y="0" width="960" height="160" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#14532d">B. 一句话边界：无向图这边为什么不需要栈</text>
    <text x="14" y="54" font-size="11.5" fill="#14532d">无向图的非树边只有回边一类（没有横叉边、也没有前向边）→ 回边一律用 dfn[v] 更新 low[u]</text>
    <text x="14" y="80" font-size="11.5" fill="#14532d">也不存在「弹栈出分量」的动作：判定只发生在回溯到 u 的那一刻，孩子的 low 已经算完</text>
    <text x="14" y="106" font-size="11.5" fill="#14532d">代价：一次 DFS，时间 O(V+E)、dfn / low / isCut 三个数组空间 O(V)（正文第五节）</text>
    <text x="14" y="132" font-size="10.5" fill="#166534">⚠️ 桥的端点不一定是割点：「两点一条边」里两端都不是；点数 ≥ 3 时两端至少有一个是（正文第一节）</text>
  </g>
</svg>
