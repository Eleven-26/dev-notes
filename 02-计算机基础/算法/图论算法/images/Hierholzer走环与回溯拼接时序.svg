<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Hierholzer 时序：下潜一口气走到底，离开谁就记谁，反转即正解</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">图：0→1, 1→2, 2→0, 0→3, 3→4, 4→0；邻接表按出现顺序取边，数字抄自本篇第三节推演</text>

  <g transform="translate(20,78)">
    <rect x="0" y="0" width="960" height="230" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 下潜：7 层 dfs 调用首尾相接（箭头上方是刚踩过的边）</text>

    <line x1="92" y1="110" x2="184" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ag)"/>
    <line x1="230" y1="110" x2="322" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ag)"/>
    <line x1="368" y1="110" x2="460" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ag)"/>
    <line x1="506" y1="110" x2="598" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ag)"/>
    <line x1="644" y1="110" x2="736" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ag)"/>
    <line x1="782" y1="110" x2="874" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ag)"/>

    <text x="138" y="96" text-anchor="middle" font-size="10.5" fill="#64748b">0→1</text>
    <text x="276" y="96" text-anchor="middle" font-size="10.5" fill="#64748b">1→2</text>
    <text x="414" y="96" text-anchor="middle" font-size="10.5" fill="#64748b">2→0</text>
    <text x="552" y="96" text-anchor="middle" font-size="10.5" fill="#64748b">0→3</text>
    <text x="690" y="96" text-anchor="middle" font-size="10.5" fill="#64748b">3→4</text>
    <text x="828" y="96" text-anchor="middle" font-size="10.5" fill="#64748b">4→0</text>

    <circle cx="70" cy="110" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="70" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">0</text>
    <circle cx="208" cy="110" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="208" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">1</text>
    <circle cx="346" cy="110" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="346" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">2</text>
    <circle cx="484" cy="110" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="484" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">0</text>
    <circle cx="622" cy="110" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="622" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">3</text>
    <circle cx="760" cy="110" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="760" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">4</text>
    <circle cx="898" cy="110" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="898" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">0</text>

    <text x="70" y="152" text-anchor="middle" font-size="9.5" fill="#64748b">深 0</text>
    <text x="208" y="152" text-anchor="middle" font-size="9.5" fill="#64748b">深 1</text>
    <text x="346" y="152" text-anchor="middle" font-size="9.5" fill="#64748b">深 2</text>
    <text x="484" y="152" text-anchor="middle" font-size="9.5" fill="#64748b">深 3</text>
    <text x="622" y="152" text-anchor="middle" font-size="9.5" fill="#64748b">深 4</text>
    <text x="760" y="152" text-anchor="middle" font-size="9.5" fill="#64748b">深 5</text>
    <text x="898" y="152" text-anchor="middle" font-size="9.5" fill="#64748b">深 6</text>

    <text x="30" y="184" font-size="10.5" fill="#0f172a">深 3（第二次进 0）时第一个环 0→1→2→0 已闭合，但 g[0] 还剩出边 3，同一层就地续走第二个环</text>
    <text x="30" y="208" font-size="10.5" fill="#64748b">深 6 的 dfs(0) 见 g[0] 已空，下潜到此为止，从这一层开始回溯记录</text>
  </g>

  <g transform="translate(20,328)">
    <rect x="0" y="0" width="960" height="212" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#92400e">B. 回溯记录与反转</text>
    <text x="14" y="54" font-size="11.5" fill="#92400e">① 每离开一个点记一次，记录序：0, 4, 3, 0, 2, 1, 0 —— 最先记的是最深处的死角 0</text>
    <text x="14" y="80" font-size="11.5" fill="#92400e">② 反转后：0, 1, 2, 0, 3, 4, 0，六条边各踩一次、回到起点，即所求回路</text>
    <text x="14" y="106" font-size="11.5" fill="#92400e">③ 子环不漏的原因：只要 g[u] 还有出边就在原层续走，走完才记，第二个环被整段嵌进主环</text>
    <text x="14" y="132" font-size="11.5" fill="#92400e">④ 代价：每条边恰好被删一次（g[u] = g[u][1:] ），时间 O(V+E)、空间 O(V+E)</text>
    <text x="14" y="158" font-size="10.5" fill="#92400e">⚠️ 有向图欧拉路径要先找出度 − 入度 = 1 的点起走；判据不过关时这段时序只会得到漏边的半圈</text>
    <text x="14" y="184" font-size="10.5" fill="#166534">⭐ 对照「回溯时记录」：反转的不是算法，只是输出顺序（本篇第三、五节）</text>
  </g>
</svg>
