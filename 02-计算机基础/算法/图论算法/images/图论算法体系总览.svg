<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">图论算法体系总览：把问题归到母题，比背算法名字有用</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">前提不满足时，算法不是变慢，而是给出错误答案 · 图的表示（怎么存）在姊妹目录 数据结构/</text>

  <text x="20" y="90" font-size="13" font-weight="bold" fill="#2563eb">一、三个子目录（各自还有更细的导读 README）</text>

  <rect x="20" y="100" width="310" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="34" y="126" font-size="13.5" font-weight="bold" fill="#1e3a8a">图的遍历/（3 篇）</text>
  <text x="34" y="150" font-size="11.5" fill="#1e3a8a">DFS与BFS遍历（总纲，含 type Graph）</text>
  <text x="34" y="170" font-size="11.5" fill="#1e3a8a">DFS 深度优先 · BFS 广度优先</text>

  <rect x="345" y="100" width="310" height="80" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="359" y="126" font-size="13.5" font-weight="bold" fill="#14532d">最短路/（3 篇）</text>
  <text x="359" y="150" font-size="11.5" fill="#14532d">Dijkstra（单源非负）· Bellman-Ford（负权判环）</text>
  <text x="359" y="170" font-size="11.5" fill="#14532d">Floyd（全源，稠密图反超 V 次 Dijkstra）</text>

  <rect x="670" y="100" width="310" height="80" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="684" y="126" font-size="13.5" font-weight="bold" fill="#78350f">最小生成树/（2 篇）</text>
  <text x="684" y="150" font-size="11.5" fill="#78350f">Kruskal（按边贪心 + 并查集）</text>
  <text x="684" y="170" font-size="11.5" fill="#78350f">Prim（按点贪心，与 Dijkstra 只差一行）</text>

  <text x="20" y="206" font-size="13" font-weight="bold" fill="#2563eb">二、根下的十一篇按母题归族</text>

  <rect x="20" y="216" width="232" height="150" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text x="34" y="242" font-size="13" font-weight="bold" fill="#7c2d12">拓扑 · 连通性 · 一笔画</text>
  <text x="34" y="266" font-size="11.5" fill="#7c2d12">拓扑排序（Kahn / DFS 后序）</text>
  <text x="34" y="286" font-size="11.5" fill="#7c2d12">强连通分量 · 割点与桥</text>
  <text x="34" y="310" font-size="11.5" fill="#7c2d12">欧拉路径与欧拉回路</text>
  <text x="34" y="328" font-size="11" fill="#475569">⭐ 都是「一次遍历顺手记东西」</text>

  <rect x="260" y="216" width="232" height="150" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="274" y="242" font-size="13" font-weight="bold" fill="#3730a3">二分图与匹配（2 篇）</text>
  <text x="274" y="266" font-size="11.5" fill="#3730a3">二分图判定（两色染色）</text>
  <text x="274" y="286" font-size="11.5" fill="#3730a3">二分图匹配（匈牙利 / 带权 KM）</text>
  <text x="274" y="310" font-size="11" fill="#475569">⭐ 先判定，再谈匹配</text>
  <text x="274" y="328" font-size="11" fill="#475569">奇环 = 判定失败信号</text>

  <rect x="500" y="216" width="232" height="150" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="514" y="242" font-size="13" font-weight="bold" fill="#334155">流与约束（4 篇）</text>
  <text x="514" y="266" font-size="11.5" fill="#334155">网络流 · 最小费用最大流</text>
  <text x="514" y="286" font-size="11.5" fill="#334155">2-SAT（蕴含图 + 强连通分量）</text>
  <text x="514" y="310" font-size="11.5" fill="#334155">差分约束（转最短路 + 判环）</text>
  <text x="514" y="328" font-size="11" fill="#475569">⭐ 约束类都「先建图再套算法」</text>

  <rect x="740" y="216" width="232" height="150" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="754" y="242" font-size="13" font-weight="bold" fill="#14532d">树上问题（1 篇）</text>
  <text x="754" y="266" font-size="11.5" fill="#14532d">LCA（倍增 / 欧拉序 + RMQ / Tarjan）</text>
  <text x="754" y="286" font-size="11.5" fill="#14532d">树上差分 · 点分治</text>
  <text x="754" y="310" font-size="11" fill="#475569">⭐ 先把「树」当特例的图看</text>
  <text x="754" y="328" font-size="11" fill="#475569">再补树的专属工具</text>

  <text x="20" y="384" font-size="13" font-weight="bold" fill="#2563eb">三、前提与表示法：读这一栏再动手</text>

  <rect x="20" y="394" width="960" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="420" font-size="13.5" font-weight="bold" fill="#0f172a">算法前提（违反 = 给错答案）与三条共用结论</text>
  <text x="34" y="444" font-size="12.5" fill="#334155">· 负权 → Dijkstra 静默算错（错的不是 dist[1]，而是它没能传播到 dist[3]）；有负环 → 最短路没有定义</text>
  <text x="34" y="466" font-size="12.5" fill="#334155">· 有环 → 拓扑序不存在（Kahn 收不满 V 个点就是信号）；有向图 → MST 要换「最小树形图」</text>
  <text x="34" y="488" font-size="12.5" fill="#334155">· 不连通 → 只得到生成森林；⚠️ 顶点编号从 0 还是 1 —— 对全部算法生效，最常见的低级错误</text>
  <text x="34" y="510" font-size="12.5" fill="#334155">· 表示法：稀疏用邻接表、稠密用邻接矩阵、要反复扫全部边（Bellman-Ford / Kruskal）用边列表</text>
  <text x="34" y="532" font-size="12" fill="#64748b">⭐ 典型场景：路由（OSPF 用 Dijkstra / RIP 用距离向量）· 导航（+ A*）· 任务调度（依赖拓扑）· 社交（最少跳数）· 布线（MST 删最长边即聚类）</text>
</svg>
