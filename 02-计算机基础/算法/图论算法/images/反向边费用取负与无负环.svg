<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 6,3.5 0,7 z" fill="#2563eb"/></marker>
    <marker id="arwR" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 6,3.5 0,7 z" fill="#dc2626"/></marker>
    <marker id="arwS" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 6,3.5 0,7 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">反边费用取负之后，残量网络为什么没有负环</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">样例抄自第三节：第 1 轮沿 s→a→t（费用 1 + 2 = 3）推流 1 之后，残量网络上只剩这一种「换走法」的环</text>

  <g transform="translate(20,78)">
    <rect x="0" y="0" width="460" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 第 1 轮后残量网络上的环 s→b→t→a→s</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">红边是反向边（费用取负），灰虚线是已推满的正边，蓝边是还没用过的正边</text>

    <line x1="65" y1="149" x2="195" y2="99" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arwS)"/>
    <line x1="229" y1="98" x2="381" y2="149" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arwS)"/>
    <line x1="64" y1="163" x2="196" y2="232" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="228" y1="232" x2="382" y2="163" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="198" y1="106" x2="68" y2="156" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>
    <line x1="382" y1="156" x2="232" y2="106" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>

    <text x="125" y="112" text-anchor="middle" font-size="10" fill="#94a3b8">残量 0</text>
    <text x="309" y="112" text-anchor="middle" font-size="10" fill="#94a3b8">残量 0</text>
    <text x="124" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">费用 2</text>
    <text x="310" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">费用 2</text>
    <text x="118" y="148" text-anchor="middle" font-size="10" fill="#991b1b">-1</text>
    <text x="322" y="148" text-anchor="middle" font-size="10" fill="#991b1b">-2</text>

    <circle cx="48" cy="155" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="48" y="155" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e3a8a">s</text>
    <circle cx="212" cy="92" r="18" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
    <text x="212" y="92" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">a</text>
    <circle cx="212" cy="240" r="18" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
    <text x="212" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">b</text>
    <circle cx="398" cy="155" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="398" y="155" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e3a8a">t</text>

    <text x="14" y="272" font-size="10" fill="#334155">环账：2 + 2 - 2 - 1 = 1 ≥ 0，恰等于两轮最短路之差 4 - 3</text>
    <text x="14" y="290" font-size="10" fill="#64748b">沿环转一圈 = 沿 s→b→t 换走法、沿 t→a→s 退掉第 1 轮</text>
  </g>

  <g transform="translate(520,78)">
    <rect x="0" y="0" width="460" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 为什么这种环的代价必然非负</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">反证法：假设环费用小于 0，推出与「每轮走最短」矛盾的结论</text>

    <rect x="14" y="58" width="432" height="110" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="78" font-size="10" fill="#92400e">① 环的正向半段 s→b→t：新走法，费用 2 + 2 = 4</text>
    <text x="28" y="98" font-size="10" fill="#92400e">② 反向半段 t→a→s：退掉旧走法，退回 2 + 1 = 3</text>
    <text x="28" y="118" font-size="10" fill="#92400e">③ 若 ① - ② 小于 0 ⇒ 新走法本该比旧走法便宜</text>
    <text x="28" y="138" font-size="10" fill="#92400e">④ 可第 1 轮 SPFA 已挑走当时最便宜的 s→a→t（3）</text>
    <text x="28" y="158" font-size="10" fill="#92400e">⑤ ③ 与 ④ 矛盾 ⇒ 环费用必然 ≥ 0</text>

    <rect x="14" y="180" width="432" height="90" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="200" font-size="10.5" font-weight="bold" fill="#14532d">⭐ 不变式（对轮次归纳）：</text>
    <text x="28" y="220" font-size="10" fill="#14532d">每轮按当前最短路增广后，当前流都是该流值下的</text>
    <text x="28" y="240" font-size="10" fill="#14532d">最小费用流 ⇒ 残量网络无负环</text>
    <text x="28" y="260" font-size="10" fill="#14532d">起点 0 流量、正向费用全部非负，天然无负环</text>

    <text x="14" y="288" font-size="10.5" fill="#64748b">负环 ⇔ 还能「沿环转一圈」再省一笔 ⇒ 当前流不是最省的</text>
  </g>

  <g transform="translate(20,398)">
    <rect x="0" y="0" width="960" height="160" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#92400e">C. 三句结论</text>
    <text x="14" y="52" font-size="10.5" fill="#92400e">① 反边费用取负不是「制造负权」，是给「退掉一元流」记退款：退一元、退回它当初付过的费用</text>
    <text x="14" y="74" font-size="10.5" fill="#92400e">② 每轮都走最短路 ⇒ 换路组合永远不便宜（环账 ≥ 0）⇒ 残量网络推完一轮仍无负环</text>
    <text x="14" y="96" font-size="10.5" fill="#92400e">③ 模板从不留负环 ⇒ SPFA 每轮正常收敛；若图上先天带负圈，先用 Bellman-Ford 判掉再谈费用流</text>
    <text x="14" y="124" font-size="10.5" fill="#991b1b">⚠️ 前提别丢：本例正向费用全为 1、2、2、2，全部非负；负环机制本体写在 Bellman-Ford 第四节，本篇不重复</text>
    <text x="14" y="146" font-size="10" fill="#64748b">本图数字抄自第三节推演块（两轮 dist = 3、4），非实测读数</text>
  </g>
</svg>
