<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="gB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">两色染色的判定分支：撞色即有奇环，队列空再换连通分量</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">对应正文第二节 isBipartite 的代码与推演块</text>

  <g transform="translate(20,84)">
    <rect x="0" y="0" width="960" height="340" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. BFS 一圈圈染，两条分支一收一拒</text>

    <rect x="14" y="44" width="290" height="92" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="66" font-size="11.5" font-weight="bold" fill="#1e40af">① 起染：找首个未染点 i</text>
    <text x="28" y="86" font-size="10" fill="#1e40af">color[i] = 1 后入队</text>
    <text x="28" y="106" font-size="10" fill="#1e40af">⚠️ 图不连通 ⇒ 每个分量</text>
    <text x="28" y="124" font-size="10" fill="#1e40af">重起一轮，直到全部染完</text>

    <rect x="324" y="44" width="290" height="92" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="338" y="66" font-size="11.5" font-weight="bold" fill="#1e40af">② 出队 u，逐个看邻居 v</text>
    <text x="338" y="86" font-size="10" fill="#1e40af">color[v] == 0：给 v 染</text>
    <text x="338" y="106" font-size="10" fill="#1e40af">-color[u] 并入队，逐层铺开</text>
    <text x="338" y="124" font-size="10" fill="#1e40af">同层同色、相邻层异色</text>

    <rect x="634" y="44" width="290" height="92" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="648" y="66" font-size="11.5" font-weight="bold" fill="#991b1b">③ 邻居已染且同色：判负</text>
    <text x="648" y="86" font-size="10" fill="#991b1b">color[v] == color[u]</text>
    <text x="648" y="106" font-size="10" fill="#991b1b">→ return false，本轮作废</text>
    <text x="648" y="124" font-size="10" fill="#991b1b">图含奇环（推导见右下）</text>

    <line x1="304" y1="90" x2="324" y2="90" stroke="#2563eb" stroke-width="1.5" marker-end="url(#gB)"/>
    <line x1="614" y1="90" x2="634" y2="90" stroke="#2563eb" stroke-width="1.5" marker-end="url(#gB)"/>

    <rect x="14" y="156" width="290" height="76" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="178" font-size="11.5" font-weight="bold" fill="#14532d">④ 队列空：回到 ①</text>
    <text x="28" y="198" font-size="10" fill="#14532d">全部染完且无冲突</text>
    <text x="28" y="216" font-size="10" fill="#14532d">⇒ 是二分图，颜色即分组</text>

    <rect x="324" y="156" width="290" height="76" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="338" y="178" font-size="11.5" font-weight="bold" fill="#92400e">⑤ 撞色边的来历</text>
    <text x="338" y="198" font-size="10" fill="#92400e">u、v 同色 ⇒ 到起点的树路径</text>
    <text x="338" y="216" font-size="10" fill="#92400e">同奇偶，拼上 (u,v) 成奇环</text>

    <rect x="634" y="156" width="290" height="76" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="648" y="178" font-size="11.5" font-weight="bold" fill="#334155">与最短路 BFS 的唯一区别</text>
    <text x="648" y="198" font-size="10" fill="#334155">队列模板相同，这里入队的判据</text>
    <text x="648" y="216" font-size="10" fill="#334155">是 ±1 两色，同色即拒收</text>

    <text x="14" y="262" font-size="11" fill="#991b1b">奇环长度账：两条树路径同奇偶 ⇒ 相加为偶，再加撞色的这条边 = 奇数（正文第一节等价判据）</text>
    <text x="14" y="288" font-size="11" fill="#334155">代价：每点、每边各碰一次 → 时间 O(V + E)，color 数组空间 O(V)（正文第三节）</text>
    <text x="14" y="314" font-size="10" fill="#64748b">选型：静态图判一次 → BFS 染色；边持续加入 → 种类并查集增量维护（正文第五节判据）</text>
  </g>
</svg>
