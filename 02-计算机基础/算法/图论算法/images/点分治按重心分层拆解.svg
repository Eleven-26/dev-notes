<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>

  <text x="40" y="42" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#0f172a">点分治：每次取重心、统计「经过重心」的点对，再对每棵子树递归</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">重心保证「最大子树 ≤ 当前规模 / 2」⇒ 每层规模减半 ⇒ 递归层数 O(log n)</text>

  <!-- 第 0 层 -->
  <rect x="40" y="86" width="290" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="58" y="112" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">第 0 层：整棵连通块，规模 7</text>

  <line x1="185" y1="160" x2="125" y2="248" stroke="#94a3b8" stroke-width="2"/>
  <line x1="185" y1="160" x2="245" y2="248" stroke="#94a3b8" stroke-width="2"/>
  <line x1="125" y1="248" x2="95" y2="336" stroke="#94a3b8" stroke-width="2"/>
  <line x1="125" y1="248" x2="155" y2="336" stroke="#94a3b8" stroke-width="2"/>
  <line x1="245" y1="248" x2="215" y2="336" stroke="#94a3b8" stroke-width="2"/>
  <line x1="245" y1="248" x2="275" y2="336" stroke="#94a3b8" stroke-width="2"/>

  <circle cx="185" cy="160" r="22" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="185" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#9a3412">1</text>
  <circle cx="125" cy="248" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">2</text>
  <circle cx="245" cy="248" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="245" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">3</text>
  <circle cx="95" cy="336" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="95" y="341" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534">4</text>
  <circle cx="155" cy="336" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="155" y="341" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534">5</text>
  <circle cx="215" cy="336" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="215" y="341" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534">6</text>
  <circle cx="275" cy="336" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="275" y="341" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534">7</text>

  <text x="58" y="372" font-family="system-ui, sans-serif" font-size="12.5" fill="#ea580c">重心 = 1（最大子树 3 ≤ 7/2）</text>

  <!-- 第 1 层 -->
  <rect x="350" y="86" width="310" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="368" y="112" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">第 1 层：删掉重心 1 后剩两块</text>

  <line x1="425" y1="180" x2="392" y2="262" stroke="#94a3b8" stroke-width="2"/>
  <line x1="425" y1="180" x2="458" y2="262" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="425" cy="180" r="20" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="425" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#9a3412">2</text>
  <circle cx="392" cy="262" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="392" y="267" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534">4</text>
  <circle cx="458" cy="262" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="458" y="267" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534">5</text>
  <text x="425" y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748b">规模 3，重心 = 2</text>

  <line x1="600" y1="180" x2="567" y2="262" stroke="#94a3b8" stroke-width="2"/>
  <line x1="600" y1="180" x2="633" y2="262" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="600" cy="180" r="20" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="600" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#9a3412">3</text>
  <circle cx="567" cy="262" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="567" y="267" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534">6</text>
  <circle cx="633" cy="262" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="633" y="267" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534">7</text>
  <text x="600" y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748b">规模 3，重心 = 3</text>

  <text x="368" y="372" font-family="system-ui, sans-serif" font-size="12.5" fill="#ea580c">本层规模相加 = 3 + 3 = 6</text>

  <!-- 第 2 层 -->
  <rect x="680" y="86" width="280" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="698" y="112" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">第 2 层：四个单点，递归终止</text>

  <circle cx="726" cy="206" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="726" y="211" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534">4</text>
  <circle cx="796" cy="206" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="796" y="211" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534">5</text>
  <circle cx="866" cy="206" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="866" y="211" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534">6</text>
  <circle cx="932" cy="206" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="932" y="211" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534">7</text>

  <text x="698" y="262" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748b">每个点自成一块，规模 1</text>
  <text x="698" y="372" font-family="system-ui, sans-serif" font-size="12.5" fill="#ea580c">本层规模相加 = 1 × 4 = 4</text>

  <!-- 结论带 -->
  <rect x="40" y="406" width="920" height="98" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="436" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">总规模求和 = 7 + 6 + 4 = 17（≈ n × 层数）；层数 ≈ log n，故总代价 O(n log n)</text>
  <text x="60" y="464" font-family="system-ui, sans-serif" font-size="14" fill="#334155">同一层里各块互不相交、并集就是上一层 —— 所以「每层规模相加」恒等于 n，这正是 O(n log n) 的来源。</text>
  <text x="60" y="488" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">若不取重心而随便选点，链状树会退化：层数变 O(n)，总代价跌回 O(n²)。</text>
</svg>
