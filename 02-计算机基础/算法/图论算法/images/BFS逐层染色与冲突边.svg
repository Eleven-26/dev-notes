<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">BFS 逐层染色：撞在边 1—2 上的冲突，正是奇环 0—1—2—0</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">边表与染色序列抄自正文第二节推演块；+ 染 1、− 染 −1</text>

  <g transform="translate(20,84)">
    <rect x="0" y="0" width="580" height="420" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 带奇环的 4 点样例</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">边：0—1, 0—2, 1—2, 1—3, 2—3；蓝点染 +、绿点染 −</text>

    <line x1="270" y1="119" x2="171" y2="211" stroke="#94a3b8" stroke-width="1.6"/>
    <line x1="310" y1="119" x2="409" y2="211" stroke="#94a3b8" stroke-width="1.6"/>
    <line x1="176" y1="230" x2="404" y2="230" stroke="#dc2626" stroke-width="3"/>
    <line x1="173" y1="246" x2="267" y2="314" stroke="#94a3b8" stroke-width="1.6"/>
    <line x1="407" y1="246" x2="313" y2="314" stroke="#94a3b8" stroke-width="1.6"/>

    <text x="290" y="218" text-anchor="middle" font-size="10" fill="#991b1b">冲突边 1—2</text>
    <text x="290" y="252" text-anchor="middle" font-size="10" fill="#92400e">奇环 0—1—2—0：两条树边 + 这条冲突边</text>

    <circle cx="290" cy="100" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="290" y="100" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#1e40af">0</text>
    <text x="290" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">+</text>
    <circle cx="150" cy="230" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="150" y="230" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#14532d">1</text>
    <text x="150" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">−</text>
    <circle cx="430" cy="230" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="430" y="230" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#14532d">2</text>
    <text x="430" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">−</text>
    <circle cx="290" cy="330" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="290" y="330" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#1e40af">3</text>
    <text x="252" y="304" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">+</text>

    <text x="14" y="386" font-size="10" fill="#334155">第 4 步：出队 1，邻居 2 已染 −、与 1 同色 ⇒ return false</text>
    <text x="14" y="408" font-size="9.5" fill="#64748b">BFS 不变式：同层必同色；1、2 同层（−），0 与 3 隔一层但同奇偶（+）</text>
  </g>

  <g transform="translate(620,84)">
    <rect x="0" y="0" width="360" height="420" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 删掉冲突边 1—2</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">同图去掉 1—2 再染色，不再撞色</text>

    <line x1="161" y1="131" x2="99" y2="204" stroke="#94a3b8" stroke-width="1.6"/>
    <line x1="99" y1="246" x2="161" y2="319" stroke="#94a3b8" stroke-width="1.6"/>
    <line x1="199" y1="319" x2="261" y2="246" stroke="#94a3b8" stroke-width="1.6"/>
    <line x1="261" y1="204" x2="199" y2="131" stroke="#94a3b8" stroke-width="1.6"/>

    <circle cx="180" cy="110" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="110" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#1e40af">0</text>
    <circle cx="80" cy="225" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="80" y="225" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#14532d">1</text>
    <circle cx="280" cy="225" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="280" y="225" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#14532d">2</text>
    <circle cx="180" cy="340" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="340" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#1e40af">3</text>

    <text x="180" y="72" text-anchor="middle" font-size="10" fill="#1e40af">第一组 {0, 3} 染 +</text>
    <text x="180" y="386" font-size="10" fill="#334155">第二组 {1, 2} 染 −</text>
    <text x="14" y="408" font-size="9.5" fill="#64748b">每条边都跨组 ⇒ 二分图成立（偶环四边形）</text>
  </g>
</svg>
