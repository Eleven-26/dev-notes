<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Tarjan 一次 DFS：dfn / low 与栈同步推进，谁和谁比一眼可见</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">图：0→1, 1→2, 2→0, 2→3, 3→4, 4→5, 5→3（从 0 起 DFS，栈顶在右）；数字抄自本篇第二节推演</text>

  <g transform="translate(20,78)">
    <rect x="0" y="0" width="960" height="240" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 深入阶段：dfn / low 一起涨，节点按访问次序入栈</text>
    <text x="14" y="50" font-size="10.5" fill="#64748b">节点下方的两个数是 dfn / low（刚进入时的初值，两者相等）</text>

    <line x1="112" y1="110" x2="211" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ag)"/>
    <line x1="257" y1="110" x2="356" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ag)"/>
    <line x1="402" y1="110" x2="501" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ag)"/>
    <line x1="547" y1="110" x2="646" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ag)"/>
    <line x1="692" y1="110" x2="791" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ag)"/>

    <path d="M 380 132 C 340 200 130 200 92 132" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ay)"/>
    <path d="M 815 132 C 790 200 555 200 528 132" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ay)"/>

    <circle cx="90" cy="110" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="90" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">0</text>
    <circle cx="235" cy="110" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="235" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">1</text>
    <circle cx="380" cy="110" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="380" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">2</text>
    <circle cx="525" cy="110" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="525" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">3</text>
    <circle cx="670" cy="110" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="670" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">4</text>
    <circle cx="815" cy="110" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="815" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">5</text>

    <text x="90" y="150" text-anchor="middle" font-size="10" fill="#334155">1 / 1</text>
    <text x="235" y="150" text-anchor="middle" font-size="10" fill="#334155">2 / 2</text>
    <text x="380" y="150" text-anchor="middle" font-size="10" fill="#334155">3 / 3</text>
    <text x="525" y="150" text-anchor="middle" font-size="10" fill="#334155">4 / 4</text>
    <text x="670" y="150" text-anchor="middle" font-size="10" fill="#334155">5 / 5</text>
    <text x="815" y="150" text-anchor="middle" font-size="10" fill="#334155">6 / 6</text>

    <text x="236" y="216" text-anchor="middle" font-size="10" fill="#b45309">回边 2→0：low[2] 被压到 1</text>
    <text x="670" y="216" text-anchor="middle" font-size="10" fill="#b45309">回边 5→3：low[5] 被压到 4</text>
  </g>

  <g transform="translate(20,338)">
    <rect x="0" y="0" width="960" height="180" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#92400e">B. 弹栈：只有 dfn[u] == low[u] 才收网（栈顶在右）</text>
    <text x="14" y="54" font-size="11.5" fill="#92400e">① 3 回溯：dfn[3]=4 == low[3]=4 → 弹出 5、4、3 ⇒ SCC {3,4,5}，栈剩 [0,1,2]</text>
    <text x="14" y="80" font-size="11.5" fill="#92400e">② 0 回溯：dfn[0]=1 == low[0]=1 → 弹出 2、1、0 ⇒ SCC {0,1,2}，栈清空</text>
    <text x="14" y="106" font-size="10.5" fill="#92400e">不弹的两处：4 回溯时 low[4]=4 ≠ dfn[4]=5；2 回溯时 low[2]=1 ≠ dfn[2]=3（回边 2→0 早把它压到 1）</text>
    <text x="14" y="130" font-size="10.5" fill="#92400e">最终 dfn = [1,2,3,4,5,6]，low = [1,1,1,4,4,4]，共 2 个 SCC</text>
    <text x="14" y="156" font-size="10.5" fill="#166534">⭐ 第三态 onStack[v]：只有还在栈上的 v 才允许用 dfn[v] 更新 low[u]；已弹栈的 v 属于封口的 SCC，不能借道</text>
  </g>
</svg>
