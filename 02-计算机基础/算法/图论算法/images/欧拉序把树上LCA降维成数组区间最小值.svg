<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>

  <text x="40" y="42" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#0f172a">欧拉序把「树上 LCA」降维成「数组区间最小值（RMQ）」</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">欧拉序：DFS 时「每进入一个点记一次、每从一个子树回溯也记一次」，长度恰好 2n−1</text>

  <!-- 左：树 -->
  <rect x="40" y="86" width="320" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="58" y="112" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#334155">① 一棵树（以 0 为根）</text>

  <line x1="200" y1="160" x2="140" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="160" x2="260" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <line x1="140" y1="240" x2="100" y2="320" stroke="#94a3b8" stroke-width="2"/>

  <circle cx="200" cy="160" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">0</text>
  <circle cx="140" cy="240" r="22" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="140" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#334155">1</text>
  <circle cx="260" cy="240" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="260" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#166534">2</text>
  <circle cx="100" cy="320" r="22" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="100" y="326" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#9a3412">3</text>

  <text x="58" y="368" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">求 LCA(3, 2)：从 3 走到 2 的旅途中，到达的「最高点」</text>

  <!-- 右：欧拉序 -->
  <rect x="388" y="86" width="572" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="406" y="112" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#334155">② 欧拉序（下标 0..6）</text>

  <!-- 下标行 -->
  <text x="442" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">0</text>
  <text x="522" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">1</text>
  <text x="602" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">2</text>
  <text x="682" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">3</text>
  <text x="762" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">4</text>
  <text x="842" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">5</text>
  <text x="922" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">6</text>

  <!-- 值方块：区间 [2,5] 高亮；下标 4 是最小 -->
  <rect x="406" y="150" width="72" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="442" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#334155">0</text>

  <rect x="486" y="150" width="72" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="522" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#334155">1</text>

  <rect x="566" y="150" width="72" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="602" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">3</text>

  <rect x="646" y="150" width="72" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="682" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">1</text>

  <rect x="726" y="150" width="72" height="56" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="762" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#9a3412">0</text>

  <rect x="806" y="150" width="72" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="842" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">2</text>

  <rect x="886" y="150" width="72" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="922" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#334155">0</text>

  <!-- 深度行 -->
  <text x="442" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">深 0</text>
  <text x="522" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">深 1</text>
  <text x="602" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#2563eb">深 2</text>
  <text x="682" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#2563eb">深 1</text>
  <text x="762" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#ea580c">深 0</text>
  <text x="842" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#2563eb">深 1</text>
  <text x="922" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">深 0</text>

  <!-- 区间标注 -->
  <line x1="602" y1="248" x2="842" y2="248" stroke="#2563eb" stroke-width="2"/>
  <line x1="602" y1="248" x2="602" y2="262" stroke="#2563eb" stroke-width="2"/>
  <line x1="842" y1="248" x2="842" y2="262" stroke="#2563eb" stroke-width="2"/>
  <line x1="762" y1="262" x2="762" y2="288" stroke="#ea580c" stroke-width="2"/>
  <text x="722" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563eb">区间 [first[3], first[2]] = [2, 5]</text>
  <text x="790" y="308" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ea580c">深度最小 → 下标 4</text>

  <text x="406" y="360" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">第一次出现位置：first[3] = 2、first[2] = 5</text>

  <!-- 结论带 -->
  <rect x="40" y="406" width="920" height="98" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="436" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">结论：LCA(3, 2) = euler[区间 [2,5] 内深度最小的下标] = euler[4] = 0</text>
  <text x="60" y="464" font-family="system-ui, sans-serif" font-size="14" fill="#334155">于是「树上求祖先」变成「静态数组求区间最小值」；数组的 RMQ 用稀疏表即可：建表 O(n log n)、每次查询 O(1)。</text>
  <text x="60" y="488" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">代价：稀疏表要 n log n 个下标的内存与建表常数 —— 询问多、树静态时才划算。</text>
</svg>
