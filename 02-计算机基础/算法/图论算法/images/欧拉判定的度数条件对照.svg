<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">欧拉判定：先看度数能不能配平，再看边连不连成一气</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">条件抄自本篇第二节，样例用第三节那张「两个环共用点 0」的有向图</text>

  <g transform="translate(20,78)">
    <rect x="0" y="0" width="960" height="290" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 度数条件：无向看奇偶，有向看入出度差</text>

    <rect x="14" y="48" width="450" height="100" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="74" font-size="11.5" font-weight="bold" fill="#1e40af">无向图 · 欧拉回路</text>
    <text x="28" y="96" font-size="10.5" fill="#1e40af">所有顶点度数为偶数</text>
    <text x="28" y="118" font-size="10" fill="#1e40af">度数全偶 = 每个点进得来也出得去，能回到起点</text>

    <rect x="490" y="48" width="450" height="100" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="504" y="74" font-size="11.5" font-weight="bold" fill="#92400e">无向图 · 欧拉路径</text>
    <text x="504" y="96" font-size="10.5" fill="#92400e">恰好 0 或 2 个顶点度数为奇数</text>
    <text x="504" y="118" font-size="10" fill="#92400e">0 个奇数点其实就是回路；2 个时它们是起点与终点</text>

    <rect x="14" y="170" width="450" height="100" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="196" font-size="11.5" font-weight="bold" fill="#1e40af">有向图 · 欧拉回路</text>
    <text x="28" y="218" font-size="10.5" fill="#1e40af">所有顶点入度 = 出度</text>
    <text x="28" y="240" font-size="10" fill="#1e40af">本篇样例：0 出 2 入 2，1 / 2 / 3 / 4 各出 1 入 1</text>

    <rect x="490" y="170" width="450" height="100" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="504" y="196" font-size="11.5" font-weight="bold" fill="#92400e">有向图 · 欧拉路径</text>
    <text x="504" y="218" font-size="10.5" fill="#92400e">一个点出度 − 入度 = 1（起点）</text>
    <text x="504" y="240" font-size="10" fill="#92400e">一个点入度 − 出度 = 1（终点），其余入度 = 出度</text>
  </g>

  <g transform="translate(20,388)">
    <rect x="0" y="0" width="960" height="140" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#14532d">B. 连通性前提：度数对了还要「边连成一气」</text>
    <text x="14" y="54" font-size="11.5" fill="#14532d">无向图与有向图都要加这一条：所有边必须落在同一个连通分量里（有向图按无向意义看即可，孤立点不算）</text>
    <text x="14" y="80" font-size="11.5" fill="#14532d">查法：从任一个有边的点出发 dfs / bfs，数一数走过了几条边；条数 == E 才继续往下判，否则直接判否</text>
    <text x="14" y="106" font-size="10.5" fill="#166534">⚠️ 度数为 0 的孤立点不影响判定，但会让朴素写法的「图连通」误报 —— 只对含边的部分做连通性检查</text>
  </g>
</svg>
