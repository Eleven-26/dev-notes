<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 6,3.5 0,7 z" fill="#2563eb"/></marker>
    <marker id="arwR" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 6,3.5 0,7 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">网络流：残量网络里「一条边 = 一对残量边」</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">样例：s→{a,b}、a→{t,b}、b→t；容量 s→a:3、s→b:2、a→t:2、a→b:1、b→t:3</text>

  <g transform="translate(20,78)">
    <rect x="0" y="0" width="460" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 原始网络：边标「流量 / 容量」</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">样例网络的可行流：五条边全推满，总量 5</text>

    <line x1="65" y1="149" x2="195" y2="99" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="64" y1="163" x2="196" y2="232" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="229" y1="98" x2="381" y2="149" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="228" y1="232" x2="382" y2="163" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="212" y1="110" x2="212" y2="222" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <text x="125" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">3/3</text>
    <text x="124" y="209" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">2/2</text>
    <text x="309" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">2/2</text>
    <text x="310" y="209" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">3/3</text>
    <text x="222" y="169" font-size="11" font-weight="bold" fill="#1e40af">1/1</text>

    <circle cx="48" cy="155" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="48" y="155" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e3a8a">s</text>
    <circle cx="212" cy="92" r="18" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
    <text x="212" y="92" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">a</text>
    <circle cx="212" cy="240" r="18" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
    <text x="212" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">b</text>
    <circle cx="398" cy="155" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="398" y="155" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e3a8a">t</text>

    <text x="14" y="272" font-size="10" fill="#334155">可行流总量 5：s 出 3+2；a 进 3、出 2+1；b 进 2+1、出 3 —— 逐点守恒</text>
  </g>

  <g transform="translate(520,78)">
    <rect x="0" y="0" width="460" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 残量网络：一条边拆成一对</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">以样例里的 s→a 为例（容量 3、已推流量 3）</text>

    <circle cx="50" cy="160" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="50" y="160" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e3a8a">s</text>
    <circle cx="400" cy="160" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="400" y="160" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e3a8a">a</text>

    <line x1="72" y1="152" x2="376" y2="152" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="378" y1="168" x2="74" y2="168" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>

    <text x="224" y="130" text-anchor="middle" font-size="10.5" fill="#1e40af">正向 s→a：容量 3、流量 3 ⇒ 可用 = 3 - 3 = 0</text>
    <text x="224" y="194" text-anchor="middle" font-size="10.5" fill="#991b1b">反向 a→s：容量 0、已推 3 ⇒ 可用 = 3（撤回额度）</text>

    <text x="14" y="228" font-size="10" fill="#334155">① 建图时反向边容量记 0；推流时正向减、反向加</text>
    <text x="14" y="250" font-size="10" fill="#334155">② 反向边的可用额度 = 已经推过去的流量：推多少就能退多少</text>
    <text x="14" y="272" font-size="10" fill="#334155">③ 「后悔药」：绕远路时沿反向边把流量退回来改道</text>
  </g>

  <g transform="translate(20,398)">
    <rect x="0" y="0" width="960" height="160" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#92400e">C. 判据：残量网络里的两个数字</text>
    <text x="14" y="52" font-size="10.5" fill="#92400e">① 原边的可用容量 = 容量 - 流量：推满的边可用为 0，这一轮就再也走不通</text>
    <text x="14" y="74" font-size="10.5" fill="#92400e">② 反向边不是原边：它的可用额度 = 已经推过去的流量（初始容量记 0）</text>
    <text x="14" y="96" font-size="10.5" fill="#92400e">③ 残量 &gt; 0 的 s→t 路径才叫增广路；找不到增广路 ⇒ 已经到最大流</text>
    <text x="14" y="124" font-size="10.5" fill="#991b1b">⚠️ 漏建反向边 ⇒ 只能得到「可行流」，拿不到最大流 —— 这是本篇出现频率最高的坑</text>
    <text x="14" y="146" font-size="10" fill="#64748b">图中数字取自第一节样例：s→a:3、s→b:2、a→t:2、a→b:1、b→t:3；可行流总量 5 = 割容量 5</text>
  </g>
</svg>
