<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
  <defs>
    <marker id="dcArrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="40" y="46" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#0f172a">同一个约束组的两条求解路线</text>
  <text x="40" y="74" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">约束集相同，差的只是「超级源点给了上界还是下界」—— 于是走两个方向、拿到两个极值解</text>

  <rect x="350" y="104" width="300" height="60" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="500" y="130" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">同一组约束</text>
  <text x="500" y="152" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">4 个变量、6 条不等式</text>

  <line x1="430" y1="164" x2="290" y2="212" stroke="#94a3b8" stroke-width="2" marker-end="url(#dcArrowB)"/>
  <line x1="570" y1="164" x2="710" y2="212" stroke="#94a3b8" stroke-width="2" marker-end="url(#dcArrowB)"/>

  <rect x="60" y="216" width="390" height="124" rx="12" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="80" y="244" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e40af">≤ 型  →  最短路（取 min）</text>
  <text x="80" y="270" font-family="system-ui, sans-serif" font-size="14" fill="#1e40af">超级源点口径：所有 x_i ≤ 0</text>
  <text x="80" y="298" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">得到「逐分量最大解」</text>
  <text x="80" y="326" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#2563eb">x = [−7  −3  0  0]</text>

  <rect x="550" y="216" width="390" height="124" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="570" y="244" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#166534">≥ 型  →  最长路（取 max）</text>
  <text x="570" y="270" font-family="system-ui, sans-serif" font-size="14" fill="#166534">超级源点口径：所有 x_i ≥ 0</text>
  <text x="570" y="298" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">得到「逐分量最小解」</text>
  <text x="570" y="326" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#16a34a">x = [0  2  4  7]</text>

  <rect x="60" y="370" width="880" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="80" y="398" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">⭐ 同一个解集的两组极值：一组在「所有分量 ≤ 0」里取最大，一组在「所有分量 ≥ 0」里取最小</text>
  <text x="80" y="424" font-family="system-ui, sans-serif" font-size="14" fill="#dc2626">⚠️ 两者不是「取负」关系：−[−7 −3 0 0] = [7 3 0 0]，并不等于 [0 2 4 7]</text>
</svg>
