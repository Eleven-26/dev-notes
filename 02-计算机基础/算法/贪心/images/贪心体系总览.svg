<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">贪心体系总览：三句话、两条性质、一个「失败不报错」的陷阱</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">每步选当前最好 + 选完不反悔 + 指望拼出全局最优 —— 全部难度压在第三句上，必须证明</text>

  <text x="20" y="90" font-size="13" font-weight="bold" fill="#2563eb">一、三句话</text>

  <rect x="20" y="100" width="310" height="80" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="34" y="126" font-size="13.5" font-weight="bold" fill="#78350f">局部最优选择</text>
  <text x="34" y="150" font-size="11.5" fill="#78350f">每步只在当前候选里挑最好的</text>
  <text x="34" y="170" font-size="11.5" fill="#78350f">「最好」怎么排 = 贪心键</text>

  <rect x="345" y="100" width="310" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="359" y="126" font-size="13.5" font-weight="bold" fill="#334155">不回退</text>
  <text x="359" y="150" font-size="11.5" fill="#334155">做过决策就不再撤销</text>
  <text x="359" y="170" font-size="11.5" fill="#334155">所以复杂度常是「排序 + 一趟遍历」</text>

  <rect x="670" y="100" width="310" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="684" y="126" font-size="13.5" font-weight="bold" fill="#1e3a8a">期望全局最优</text>
  <text x="684" y="150" font-size="11.5" fill="#1e3a8a">⚠️ 这不是自动成立的</text>
  <text x="684" y="170" font-size="11.5" fill="#1e3a8a">必须用交换论证 / 割性质证明</text>

  <text x="20" y="206" font-size="13" font-weight="bold" fill="#2563eb">二、本目录三篇：样板篇、验键篇、边界篇</text>

  <rect x="20" y="216" width="310" height="110" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="34" y="242" font-size="13" font-weight="bold" fill="#14532d">霍夫曼编码（样板篇）</text>
  <text x="34" y="266" font-size="11.5" fill="#14532d">每轮合并频率最小的两个节点</text>
  <text x="34" y="286" font-size="11.5" fill="#14532d">最优子结构的样板：合并后仍是同型问题</text>
  <text x="34" y="310" font-size="11" fill="#475569">⭐ 前缀码 + 解码 + 编码表开销</text>

  <rect x="345" y="216" width="310" height="110" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text x="359" y="242" font-size="13" font-weight="bold" fill="#7c2d12">活动选择（验键篇）</text>
  <text x="359" y="266" font-size="11.5" fill="#7c2d12">按结束时间排序；三种键各有反例</text>
  <text x="359" y="286" font-size="11.5" fill="#7c2d12">交换论证：任何最优解都能改造成含它</text>
  <text x="359" y="310" font-size="11" fill="#475569">⭐ 键错了 = 安安静静给次优解</text>

  <rect x="670" y="216" width="310" height="110" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="684" y="242" font-size="13" font-weight="bold" fill="#3730a3">区间调度（边界篇）</text>
  <text x="684" y="266" font-size="11.5" fill="#3730a3">无权版就是活动选择，贪心成立</text>
  <text x="684" y="286" font-size="11.5" fill="#3730a3">带权版贪心失效 —— 必须回 DP</text>
  <text x="684" y="310" font-size="11" fill="#475569">⭐ 「能不能贪」的分界样板</text>

  <text x="20" y="352" font-size="13" font-weight="bold" fill="#2563eb">三、成立条件、失效出口与实用判据</text>

  <rect x="20" y="362" width="960" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="388" font-size="13.5" font-weight="bold" fill="#0f172a">两条性质同时满足才算成立，缺一条就换路</text>
  <text x="34" y="412" font-size="12.5" fill="#334155">· 贪心选择性质：每一步的局部最优都能成为某个全局最优解的一部分（是 safe move，不是「局部最优 = 全局最优」）</text>
  <text x="34" y="434" font-size="12.5" fill="#334155">· 最优子结构：选了之后，剩下的仍是同类型的最优子问题（霍夫曼合并两个最小频率后就是这条）</text>
  <text x="34" y="456" font-size="12.5" fill="#334155">· 失效出口：不满足选择性质 → 换 DP；有后效性 → 换 DP / 搜索；贪心键选错 → 换键，先用反例验证新键</text>
  <text x="34" y="478" font-size="12.5" fill="#334155">· 与动态规划的分界：贪心「选完不反悔」所以快；DP 保留所有候选所以能兜底 —— 带权区间调度是两者分水岭</text>
  <text x="34" y="500" font-size="12" fill="#64748b">⭐ 实用判据：证不出来就别贪 —— 正确性的证明通常只有一页纸（交换论证 / 割性质），写不出来大概率它本来就不成立</text>
</svg>
