<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
<text x="40" y="42" font-size="24" font-weight="bold" fill="#1f2937">区间的两条数轴：并段按开始时间，打点按结束时间</text>
<text x="40" y="72" font-size="15" fill="#475569">上图 = 正文 2.2 实验一（6 个区间并成 3 段）；下图 = 正文 3.2 实验二（6 个区间取 3 个点，并与精确解对照）</text>

<text x="40" y="104" font-size="15" font-weight="bold" fill="#1e40af">① 区间合并：按开始时间升序扫描，判据「下一个开始 ≤ 当前段结束」</text>

<text x="94" y="135" font-size="12" fill="#475569" text-anchor="end">6[0,1]</text>
<rect x="100" y="120" width="45" height="22" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="94" y="161" font-size="12" fill="#475569" text-anchor="end">1[1,3]</text>
<rect x="145" y="146" width="90" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="94" y="187" font-size="12" fill="#475569" text-anchor="end">2[2,6]</text>
<rect x="190" y="172" width="180" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="94" y="213" font-size="12" fill="#475569" text-anchor="end">3[8,10]</text>
<rect x="460" y="198" width="90" height="22" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="94" y="239" font-size="12" fill="#475569" text-anchor="end">5[9,12]</text>
<rect x="505" y="224" width="135" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="94" y="265" font-size="12" fill="#475569" text-anchor="end">4[15,18]</text>
<rect x="775" y="250" width="135" height="22" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>

<line x1="145" y1="112" x2="145" y2="278" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 3"/>

<rect x="100" y="288" width="270" height="16" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="235" y="300" font-size="11" fill="#14532d" text-anchor="middle">[0,6]</text>
<rect x="460" y="288" width="180" height="16" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="550" y="300" font-size="11" fill="#14532d" text-anchor="middle">[8,12]</text>
<rect x="775" y="288" width="135" height="16" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="842" y="300" font-size="11" fill="#14532d" text-anchor="middle">[15,18]</text>

<line x1="90" y1="320" x2="950" y2="320" stroke="#94a3b8" stroke-width="1.2"/>
<g font-size="12" fill="#64748b" text-anchor="middle">
<line x1="100" y1="320" x2="100" y2="327" stroke="#94a3b8"/><text x="100" y="344">0</text>
<line x1="145" y1="320" x2="145" y2="327" stroke="#94a3b8"/><text x="145" y="344">1</text>
<line x1="190" y1="320" x2="190" y2="327" stroke="#94a3b8"/><text x="190" y="344">2</text>
<line x1="235" y1="320" x2="235" y2="327" stroke="#94a3b8"/><text x="235" y="344">3</text>
<line x1="370" y1="320" x2="370" y2="327" stroke="#94a3b8"/><text x="370" y="344">6</text>
<line x1="460" y1="320" x2="460" y2="327" stroke="#94a3b8"/><text x="460" y="344">8</text>
<line x1="505" y1="320" x2="505" y2="327" stroke="#94a3b8"/><text x="505" y="344">9</text>
<line x1="550" y1="320" x2="550" y2="327" stroke="#94a3b8"/><text x="550" y="344">10</text>
<line x1="640" y1="320" x2="640" y2="327" stroke="#94a3b8"/><text x="640" y="344">12</text>
<line x1="775" y1="320" x2="775" y2="327" stroke="#94a3b8"/><text x="775" y="344">15</text>
<line x1="910" y1="320" x2="910" y2="327" stroke="#94a3b8"/><text x="910" y="344">18</text>
</g>
<text x="40" y="370" font-size="13" fill="#334155">橙色 = 与前一段接不上、另起一段；蓝色 = 与前一段重叠/相接、并入。合并结果是 3 段（正文 2.2）。</text>
<text x="40" y="392" font-size="13" fill="#334155">竖虚线在 v=1：6[0,1] 的结束与 1[1,3] 的开始相遇，1 ≤ 1 成立 → 并入（正文 2.2 细节）。写成 &lt; 就不并。</text>

<text x="40" y="428" font-size="15" font-weight="bold" fill="#166534">② 最少点覆盖：按结束时间升序扫描，点放在「第一个未覆盖区间」的右端点</text>

<text x="94" y="459" font-size="12" fill="#475569" text-anchor="end">2[2,3]</text>
<rect x="180" y="444" width="80" height="22" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="94" y="485" font-size="12" fill="#475569" text-anchor="end">1[1,4]</text>
<rect x="100" y="470" width="240" height="22" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="94" y="511" font-size="12" fill="#475569" text-anchor="end">3[3,6]</text>
<rect x="260" y="496" width="240" height="22" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="94" y="537" font-size="12" fill="#475569" text-anchor="end">4[5,7]</text>
<rect x="420" y="522" width="160" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="94" y="563" font-size="12" fill="#475569" text-anchor="end">5[6,8]</text>
<rect x="500" y="548" width="160" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="94" y="589" font-size="12" fill="#475569" text-anchor="end">6[9,11]</text>
<rect x="740" y="574" width="160" height="22" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>

<line x1="260" y1="444" x2="260" y2="600" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5 3"/>
<line x1="580" y1="444" x2="580" y2="600" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5 3"/>
<line x1="900" y1="444" x2="900" y2="600" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 3"/>
<circle cx="260" cy="444" r="6" fill="#16a34a"/>
<circle cx="580" cy="444" r="6" fill="#2563eb"/>
<circle cx="900" cy="444" r="6" fill="#b45309"/>
<text x="260" y="436" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">p = 3</text>
<text x="580" y="436" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">p = 7</text>
<text x="900" y="436" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">p = 11</text>

<line x1="90" y1="600" x2="950" y2="600" stroke="#94a3b8" stroke-width="1.2"/>
<g font-size="12" fill="#64748b" text-anchor="middle">
<line x1="100" y1="600" x2="100" y2="607" stroke="#94a3b8"/><text x="100" y="624">1</text>
<line x1="180" y1="600" x2="180" y2="607" stroke="#94a3b8"/><text x="180" y="624">2</text>
<line x1="260" y1="600" x2="260" y2="607" stroke="#94a3b8"/><text x="260" y="624">3</text>
<line x1="340" y1="600" x2="340" y2="607" stroke="#94a3b8"/><text x="340" y="624">4</text>
<line x1="420" y1="600" x2="420" y2="607" stroke="#94a3b8"/><text x="420" y="624">5</text>
<line x1="500" y1="600" x2="500" y2="607" stroke="#94a3b8"/><text x="500" y="624">6</text>
<line x1="580" y1="600" x2="580" y2="607" stroke="#94a3b8"/><text x="580" y="624">7</text>
<line x1="660" y1="600" x2="660" y2="607" stroke="#94a3b8"/><text x="660" y="624">8</text>
<line x1="740" y1="600" x2="740" y2="607" stroke="#94a3b8"/><text x="740" y="624">9</text>
<line x1="820" y1="600" x2="820" y2="607" stroke="#94a3b8"/><text x="820" y="624">10</text>
<line x1="900" y1="600" x2="900" y2="607" stroke="#94a3b8"/><text x="900" y="624">11</text>
</g>
<text x="40" y="648" font-size="13" fill="#334155">绿点 p=3 一次覆盖 2[2,3]、1[1,4]、3[3,6]：它是 [2,3] 的右端，却落在另外两个区间内部（正文 3.2）。</text>
<text x="40" y="670" font-size="13" fill="#334155">取点 {3, 7, 11} = 3 个点，与比特集覆盖精确解 3 相同；2 万组随机对照里点覆盖贪心 0 次不符（正文 3.2 / 3.3）。</text>

<rect x="40" y="690" width="920" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="56" y="712" font-size="13" fill="#1f2937">同一个数轴，两种动作：上轴放的是「段」（并起来），下轴放的是「点」（盖住所有区间）—— 排序键也换成对应的一个。</text>
<text x="56" y="734" font-size="13" fill="#475569">目标一换，键就换：合并按开始时间（2.1），点覆盖按结束时间（3.1）；这就是正文 1.1 那张变体表的空间形态。数字均出自本篇 2.2 与 3.2/3.3。</text>
</svg>
