<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">霍夫曼树的构造过程（输入 ABRACADABRA，5 种字符）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">每轮取「频率最小的两个」合并，直到堆里只剩一个节点 —— 这就是贪心选择</text>

  <text x="40" y="98" font-size="13" font-weight="bold" fill="#475569">初始堆</text>
  <rect x="150" y="78" width="74" height="32" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="187" y="99" text-anchor="middle" font-size="14" fill="#7f1d1d">C:1</text>
  <rect x="238" y="78" width="74" height="32" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="275" y="99" text-anchor="middle" font-size="14" fill="#7f1d1d">D:1</text>
  <rect x="326" y="78" width="74" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="363" y="99" text-anchor="middle" font-size="14" fill="#334155">B:2</text>
  <rect x="414" y="78" width="74" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="451" y="99" text-anchor="middle" font-size="14" fill="#334155">R:2</text>
  <rect x="502" y="78" width="74" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="539" y="99" text-anchor="middle" font-size="14" fill="#334155">A:5</text>
  <text x="600" y="99" font-size="13" fill="#dc2626">← 红框是这一轮要取的两个</text>

  <line x1="150" y1="128" x2="960" y2="128" stroke="#e2e8f0" stroke-width="1"/>

  <text x="40" y="170" font-size="13" font-weight="bold" fill="#475569">第 1 次合并</text>
  <text x="150" y="170" font-size="13" fill="#334155">C(1) + D(1)</text>
  <text x="270" y="170" font-size="13" fill="#94a3b8">→</text>
  <rect x="300" y="150" width="86" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="343" y="171" text-anchor="middle" font-size="14" fill="#14532d">内节点:2</text>
  <text x="410" y="170" font-size="13" fill="#334155">堆变成</text>
  <rect x="480" y="150" width="86" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="523" y="171" text-anchor="middle" font-size="14" fill="#14532d">内:2</text>
  <rect x="576" y="150" width="74" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="613" y="171" text-anchor="middle" font-size="14" fill="#334155">B:2</text>
  <rect x="660" y="150" width="74" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="697" y="171" text-anchor="middle" font-size="14" fill="#334155">R:2</text>
  <rect x="744" y="150" width="74" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="781" y="171" text-anchor="middle" font-size="14" fill="#334155">A:5</text>

  <line x1="150" y1="200" x2="960" y2="200" stroke="#e2e8f0" stroke-width="1"/>

  <text x="40" y="242" font-size="13" font-weight="bold" fill="#475569">第 2 次合并</text>
  <text x="150" y="242" font-size="13" fill="#334155">B(2) + R(2)</text>
  <text x="270" y="242" font-size="13" fill="#94a3b8">→</text>
  <rect x="300" y="222" width="86" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="343" y="243" text-anchor="middle" font-size="14" fill="#14532d">内节点:4</text>
  <text x="410" y="242" font-size="13" fill="#334155">堆变成</text>
  <rect x="480" y="222" width="86" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="523" y="243" text-anchor="middle" font-size="14" fill="#14532d">内:2</text>
  <rect x="576" y="222" width="86" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="619" y="243" text-anchor="middle" font-size="14" fill="#14532d">内:4</text>
  <rect x="672" y="222" width="74" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="709" y="243" text-anchor="middle" font-size="14" fill="#334155">A:5</text>

  <line x1="150" y1="272" x2="960" y2="272" stroke="#e2e8f0" stroke-width="1"/>

  <text x="40" y="314" font-size="13" font-weight="bold" fill="#475569">第 3 次合并</text>
  <text x="150" y="314" font-size="13" fill="#334155">内(2) + 内(4)</text>
  <text x="270" y="314" font-size="13" fill="#94a3b8">→</text>
  <rect x="300" y="294" width="86" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="343" y="315" text-anchor="middle" font-size="14" fill="#1e3a8a">内节点:6</text>
  <text x="410" y="314" font-size="13" fill="#334155">堆变成</text>
  <rect x="480" y="294" width="74" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="517" y="315" text-anchor="middle" font-size="14" fill="#334155">A:5</text>
  <rect x="568" y="294" width="86" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="611" y="315" text-anchor="middle" font-size="14" fill="#1e3a8a">内:6</text>
  <text x="680" y="314" font-size="13" fill="#64748b">⚠️ 注意顺序：此时 A(5) 比内(6) 小，A 会被先弹出</text>

  <line x1="150" y1="344" x2="960" y2="344" stroke="#e2e8f0" stroke-width="1"/>

  <text x="40" y="386" font-size="13" font-weight="bold" fill="#475569">第 4 次合并</text>
  <text x="150" y="386" font-size="13" fill="#334155">A(5) + 内(6)</text>
  <text x="270" y="386" font-size="13" fill="#94a3b8">→</text>
  <rect x="300" y="366" width="96" height="32" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="348" y="387" text-anchor="middle" font-size="14" fill="#78350f">根节点:11</text>
  <text x="420" y="386" font-size="13" fill="#64748b">堆里只剩一个 → 建树结束（共 4 次合并 = 5 种字符 - 1）</text>

  <line x1="40" y1="430" x2="960" y2="430" stroke="#cbd5e1" stroke-width="1"/>

  <text x="40" y="466" font-size="14" font-weight="bold" fill="#0f172a">关键点：为什么这是「贪心」</text>

  <text x="40" y="496" font-size="13" fill="#334155">1. 每一步只做局部最优选择：取当前频率最小的两个合并，从不回头、不做全局搜索。</text>
  <text x="40" y="522" font-size="13" fill="#334155">2. 局部最优能推出全局最优，靠的是「高频字符要更短」这一单调性质 —— 所以要先证再信（见正文第二节）。</text>
  <text x="40" y="548" font-size="13" fill="#334155">3. 合并次数恒为「字符种类数 − 1」；每次合并把两个子树接在新节点下，树自然长出来。</text>

  <text x="40" y="586" font-size="13" fill="#64748b">⚠️ 同频节点（如 B:2 与 R:2）谁先被弹出，会改变树的形状与具体码字，</text>
  <text x="40" y="608" font-size="13" fill="#64748b">   但加权总码长不变 —— 编码方与解码方必须约定同一套 tiebreak（本例按入堆顺序）。</text>

  <text x="40" y="646" font-size="12" fill="#94a3b8">本图对应正文「一、霍夫曼编码是怎么构造的」，数字与 .workbuddy/tmp/huffman_lab 的实测输出逐项一致。</text>
  <text x="40" y="668" font-size="12" fill="#94a3b8">⚠️ 本机无法栅格化 SVG，需要 PNG 时请自行导出（浅色底）。</text>
</svg>
