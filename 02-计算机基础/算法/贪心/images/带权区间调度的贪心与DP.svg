<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" rx="12" fill="#f7f9fc"/>
  <text x="40" y="46" font-size="24" font-weight="bold" fill="#1f2937">带权区间调度：同一个「按结束时间」贪心，个数最多却最亏</text>
  <text x="40" y="78" font-size="15" fill="#4b5563">5 个区间，每个带一个权值；目标不再是「个数最多」，而是「权值和最大」</text>

  <!-- 时间轴 -->
  <line x1="260" y1="440" x2="920" y2="440" stroke="#9ca3af" stroke-width="1.5"/>
  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <line x1="260" y1="440" x2="260" y2="447" stroke="#9ca3af"/><text x="260" y="465">1</text>
    <line x1="425" y1="440" x2="425" y2="447" stroke="#9ca3af"/><text x="425" y="465">2</text>
    <line x1="590" y1="440" x2="590" y2="447" stroke="#9ca3af"/><text x="590" y="465">3</text>
    <line x1="755" y1="440" x2="755" y2="447" stroke="#9ca3af"/><text x="755" y="465">4</text>
    <line x1="920" y1="440" x2="920" y2="447" stroke="#9ca3af"/><text x="920" y="465">5</text>
  </g>
  <text x="590" y="488" font-size="12" fill="#6b7280" text-anchor="middle">时间</text>

  <!-- 输入 -->
  <text x="248" y="124" font-size="13" fill="#374151" text-anchor="end">区间 1</text>
  <rect x="260" y="108" width="495" height="22" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="765" y="124" font-size="12" fill="#1e40af">权值 100</text>

  <text x="248" y="154" font-size="13" fill="#374151" text-anchor="end">区间 2</text>
  <rect x="260" y="138" width="165" height="22" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="435" y="154" font-size="12" fill="#1e40af">权值 1</text>

  <text x="248" y="184" font-size="13" fill="#374151" text-anchor="end">区间 3</text>
  <rect x="425" y="168" width="165" height="22" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="184" font-size="12" fill="#1e40af">权值 1</text>

  <text x="248" y="214" font-size="13" fill="#374151" text-anchor="end">区间 4</text>
  <rect x="590" y="198" width="165" height="22" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="765" y="214" font-size="12" fill="#1e40af">权值 1</text>

  <text x="248" y="244" font-size="13" fill="#374151" text-anchor="end">区间 5</text>
  <rect x="755" y="228" width="165" height="22" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="930" y="244" font-size="12" fill="#1e40af">权值 1</text>

  <!-- 贪心结果 -->
  <text x="248" y="316" font-size="14" font-weight="bold" fill="#166534" text-anchor="end">按结束时间贪心</text>
  <rect x="260" y="296" width="165" height="26" rx="5" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="425" y="296" width="165" height="26" rx="5" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="590" y="296" width="165" height="26" rx="5" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="755" y="296" width="165" height="26" rx="5" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
  <text x="248" y="348" font-size="13" fill="#166534" text-anchor="end">选中 4 个</text>
  <text x="260" y="348" font-size="13" font-weight="bold" fill="#166534">权值和 = 4（个数最多，权值最小）</text>

  <!-- DP 结果 -->
  <text x="248" y="400" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="end">精确 DP</text>
  <rect x="260" y="380" width="495" height="26" rx="5" fill="#93c5fd" stroke="#2563eb" stroke-width="2.5"/>
  <text x="380" y="398" font-size="13" font-weight="bold" fill="#1e3a8a">区间 1（权值 100）</text>
  <rect x="755" y="380" width="165" height="26" rx="5" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
  <text x="248" y="432" font-size="13" fill="#1e40af" text-anchor="end">选中 2 个</text>
  <text x="260" y="432" font-size="13" font-weight="bold" fill="#1e40af">权值和 = 101（个数更少，权值最大）</text>

  <text x="40" y="118" font-size="13" fill="#6b7280">输入</text>
  <text x="40" y="312" font-size="13" fill="#6b7280">两种解</text>
</svg>
