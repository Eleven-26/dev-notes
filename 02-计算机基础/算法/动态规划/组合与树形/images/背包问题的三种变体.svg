<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">背包问题的三种变体：区别只在「每件能取几次」</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">取几次决定了转移方程用哪一行，也决定了容量必须正序还是逆序</text>

  <rect x="30" y="92" width="300" height="380" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="50" y="124" font-size="16" font-weight="bold" fill="#1e3a8a">0-1 背包</text>
  <text x="50" y="148" font-size="12.5" fill="#475569">每件最多取 1 次</text>
  <line x1="50" y1="162" x2="310" y2="162" stroke="#bfdbfe" stroke-width="1"/>
  <g font-size="12.5" fill="#1e293b">
    <text x="50" y="192">二维转移：</text>
    <text x="50" y="214">dp[i][w] = max(</text>
    <text x="64" y="234">dp[i-1][w],</text>
    <text x="64" y="254">dp[i-1][w-wi] + vi )</text>
    <text x="50" y="292" font-weight="bold" fill="#1d4ed8">依赖的是「上一件」那一行 i-1</text>
    <text x="50" y="328" font-weight="bold" fill="#dc2626">一维写法：容量必须逆序 W → 0</text>
    <text x="50" y="360" fill="#475569">写成正序就变成完全背包了</text>
    <text x="50" y="398" font-weight="bold" fill="#0f172a">本机实例（容量 6）</text>
    <text x="50" y="422">最优值 10，选 A + C</text>
    <text x="50" y="446" fill="#dc2626">一维正序会算出 12（错的）</text>
  </g>

  <rect x="350" y="92" width="300" height="380" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="370" y="124" font-size="16" font-weight="bold" fill="#14532d">完全背包</text>
  <text x="370" y="148" font-size="12.5" fill="#475569">每件可以取无限次</text>
  <line x1="370" y1="162" x2="630" y2="162" stroke="#bbf7d0" stroke-width="1"/>
  <g font-size="12.5" fill="#1e293b">
    <text x="370" y="192">二维转移：</text>
    <text x="370" y="214">dp[i][w] = max(</text>
    <text x="384" y="234">dp[i-1][w],</text>
    <text x="384" y="254">dp[i][w-wi] + vi )</text>
    <text x="370" y="292" font-weight="bold" fill="#15803d">依赖的是「本件」这一行 i</text>
    <text x="370" y="328" font-weight="bold" fill="#15803d">一维写法：容量必须正序 0 → W</text>
    <text x="370" y="360" fill="#475569">写成逆序就退化成 0-1 背包</text>
    <text x="370" y="398" font-weight="bold" fill="#0f172a">本机实例（容量 6）</text>
    <text x="370" y="422">最优值 12，选 A + A + A</text>
    <text x="370" y="446" fill="#dc2626">一维逆序会算出 10（错的）</text>
  </g>

  <rect x="670" y="92" width="300" height="380" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
  <text x="690" y="124" font-size="16" font-weight="bold" fill="#713f12">多重背包</text>
  <text x="690" y="148" font-size="12.5" fill="#475569">第 i 件最多取 ci 次</text>
  <line x1="690" y1="162" x2="950" y2="162" stroke="#fef08a" stroke-width="1"/>
  <g font-size="12.5" fill="#1e293b">
    <text x="690" y="192">做法：拆成若干件 0-1 物品</text>
    <text x="690" y="222" font-weight="bold">朴素拆分</text>
    <text x="690" y="244">把 ci 件全部展开</text>
    <text x="690" y="274" font-weight="bold" fill="#a16207">二进制拆分</text>
    <text x="690" y="296">按 1, 2, 4, … 打包，余数单列</text>
    <text x="690" y="318" fill="#475569">这些包能拼出 0..ci 的任意件数</text>
    <text x="690" y="356" font-weight="bold" fill="#0f172a">本机实例</text>
    <text x="690" y="380">朴素 6 件 → 二进制 5 件</text>
    <text x="690" y="404">数量 1000 → 只需 10 件</text>
    <text x="690" y="428" fill="#15803d">两种拆分的最优值一致</text>
  </g>

  <line x1="30" y1="492" x2="970" y2="492" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="518" font-size="13" fill="#334155">同一个「dp[w] = max(dp[w], dp[w-wi] + vi)」，容量逆序就是 0-1、正序就是完全 —— 差别只在这一个方向。</text>
  <text x="30" y="542" font-size="13" fill="#334155">判据：看 dp[w-wi] 该是「上一件的旧值」还是「本件的新值」。旧值要逆序（别被本件覆盖），新值要正序（就要被本件覆盖）。</text>
</svg>
