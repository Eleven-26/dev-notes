<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">树形 DP：后序遍历自底向上，先子树后父节点</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">样例是正文 3.1 的打家劫舍 III 小树，每个节点的 dp[u] = (不选, 选)</text>

  <g transform="translate(40,88)">
    <rect x="0" y="0" width="540" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="20" y="26" font-size="15" font-weight="bold" fill="#0f172a">递归返回的顺序就是后序</text>
    <text x="20" y="46" font-size="10.5" fill="#64748b">① 两个叶子 → ② 节点 2 → ③ 节点 3（右）→ ④ 根</text>

    <line x1="270" y1="70" x2="150" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="270" y1="70" x2="390" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="150" y1="180" x2="210" y2="290" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="390" y1="180" x2="450" y2="290" stroke="#94a3b8" stroke-width="1.5"/>

    <circle cx="270" cy="70" r="26" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <text x="270" y="70" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#7c2d12">3</text>
    <text x="316" y="76" font-size="12" fill="#7c2d12">④ (6, 7)</text>

    <circle cx="150" cy="180" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="150" y="180" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#1e40af">2</text>
    <text x="34" y="185" font-size="12" fill="#1e40af">② (3, 2)</text>

    <circle cx="390" cy="180" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="390" y="180" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#14532d">3</text>
    <text x="436" y="185" font-size="12" fill="#14532d">③ (1, 3)</text>

    <circle cx="210" cy="290" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="210" y="290" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#14532d">3</text>
    <text x="158" y="338" font-size="12" fill="#14532d">① (0, 3)</text>

    <circle cx="450" cy="290" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="450" y="290" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#14532d">1</text>
    <text x="398" y="338" font-size="12" fill="#14532d">① (0, 1)</text>

    <text x="20" y="374" font-size="11" fill="#334155">同一个节点只有在子树全部算完之后才能汇总，所以骨架天然是一段后序 DFS</text>
    <text x="20" y="396" font-size="11" fill="#334155">根的两个值是 6 与 7，答案 = max(6, 7) = 7</text>
  </g>

  <g transform="translate(620,88)">
    <rect x="0" y="0" width="340" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">为什么必须是后序</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">dp[u] 依赖所有子树的结果</text>

    <rect x="14" y="62" width="312" height="90" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="84" font-size="11" fill="#1e40af">先递归所有子节点，拿回 dp[v]</text>
    <text x="28" y="106" font-size="11" fill="#1e40af">再把 dp[v] 合并到 dp[u]</text>
    <text x="28" y="128" font-size="11" fill="#1e40af">合并写在递归返回点之后</text>

    <rect x="14" y="168" width="312" height="110" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="190" font-size="11" fill="#92400e">dp[u][0] = Σ max(dp[v][0], dp[v][1])</text>
    <text x="28" y="212" font-size="11" fill="#92400e">dp[u][1] = val[u] + Σ dp[v][0]</text>
    <text x="28" y="234" font-size="11" fill="#92400e">每节点只访问一次 → 总代价 O(n)</text>
    <text x="28" y="256" font-size="11" fill="#92400e">树上没有重叠子问题，不需要缓存</text>

    <rect x="14" y="294" width="312" height="92" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="316" font-size="11" font-weight="bold" fill="#14532d">本例根节点的两个值</text>
    <text x="28" y="340" font-size="11" fill="#14532d">不选 = max(3,2) + max(1,3) = 6</text>
    <text x="28" y="364" font-size="11" fill="#14532d">选 = 3 + 3 + 1 = 7，答案取 7</text>
  </g>
</svg>
