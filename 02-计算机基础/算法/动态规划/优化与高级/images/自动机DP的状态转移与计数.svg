    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">AC 自动机：模式 {he, she, his, hers}</text>
    <text x="16" y="52" font-size="12" fill="#64748b">实线 = goto，虚线 = fail；橙色节点 = 词尾 / bad</text>

    <line x1="140" y1="175" x2="97" y2="215" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="160" y1="175" x2="213" y2="215" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="75" y1="247" x2="62" y2="284" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="95" y1="247" x2="115" y2="284" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="215" y1="247" x2="215" y2="284" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="62" y1="317" x2="62" y2="354" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="115" y1="317" x2="115" y2="354" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="215" y1="317" x2="215" y2="354" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="62" y1="387" x2="62" y2="424" stroke="#94a3b8" stroke-width="1.2"/>

    <line x1="215" y1="287" x2="102" y2="243" stroke="#d97706" stroke-width="1.1" stroke-dasharray="4 3"/>
    <line x1="205" y1="357" x2="80" y2="313" stroke="#d97706" stroke-width="1.1" stroke-dasharray="4 3"/>
    <line x1="120" y1="357" x2="212" y2="243" stroke="#d97706" stroke-width="1.1" stroke-dasharray="4 3"/>
    <line x1="63" y1="427" x2="210" y2="243" stroke="#d97706" stroke-width="1.1" stroke-dasharray="4 3" opacity="0.75"/>

    <rect x="122" y="148" width="56" height="28" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <text x="150" y="162" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#334155">root · 0</text>

    <rect x="57" y="220" width="56" height="26" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <text x="85" y="233" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#334155">h · 1</text>
    <rect x="197" y="220" width="56" height="26" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <text x="225" y="233" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#334155">s · 3</text>

    <rect x="30" y="290" width="60" height="26" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
