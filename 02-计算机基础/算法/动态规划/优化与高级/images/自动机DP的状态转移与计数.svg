    <rect x="93" y="290" width="60" height="26" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <text x="123" y="303" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#334155">hi · 6</text>
    <rect x="187" y="290" width="60" height="26" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <text x="217" y="303" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#334155">sh · 4</text>

    <rect x="32" y="360" width="60" height="26" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <text x="62" y="373" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#334155">her · 8</text>
    <rect x="89" y="360" width="58" height="26" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="118" y="373" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#92400e">his · 7</text>
    <rect x="183" y="360" width="62" height="26" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="214" y="373" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#92400e">she · 5</text>

    <rect x="28" y="430" width="66" height="26" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="61" y="443" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#92400e">hers · 9</text>

    <text x="108" y="203" font-size="9.5" fill="#64748b">h</text>
    <text x="182" y="203" font-size="9.5" fill="#64748b">s</text>
    <text x="64" y="272" font-size="9.5" fill="#64748b">e</text>
    <text x="111" y="272" font-size="9.5" fill="#64748b">i</text>
    <text x="221" y="272" font-size="9.5" fill="#64748b">h</text>
    <text x="64" y="342" font-size="9.5" fill="#64748b">r</text>
    <text x="111" y="342" font-size="9.5" fill="#64748b">s</text>
    <text x="221" y="342" font-size="9.5" fill="#64748b">e</text>
    <text x="68" y="412" font-size="9.5" fill="#64748b">s</text>

    <rect x="16" y="474" width="428" height="60" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="494" font-size="11.5" fill="#334155">第 2 节：缺失边补成 next[fail[v]][c]（图中省略）</text>
    <text x="28" y="514" font-size="11.5" fill="#334155">第 3 节：bad = 词尾 或 fail 链上有词尾</text>
  </g>

  <g transform="translate(520,70)">
    <rect x="0" y="0" width="460" height="550" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">DP 按长度分层：状态合并 + 丢弃 bad</text>
    <text x="16" y="52" font-size="12" fill="#64748b">同状态的串合并计数；命中状态的串不再往下转移</text>

    <text x="48" y="86" font-size="11" font-weight="bold" fill="#475569">i=0</text>
    <text x="150" y="86" font-size="11" font-weight="bold" fill="#475569">i=1</text>
    <text x="262" y="86" font-size="11" font-weight="bold" fill="#475569">i=2</text>
    <text x="386" y="86" font-size="11" font-weight="bold" fill="#475569">i=n</text>

    <line x1="65" y1="140" x2="145" y2="112" stroke="#cbd5e1" stroke-width="1.1"/>
    <line x1="65" y1="140" x2="145" y2="152" stroke="#cbd5e1" stroke-width="1.1"/>
    <line x1="65" y1="140" x2="145" y2="192" stroke="#cbd5e1" stroke-width="1.1"/>
    <line x1="65" y1="140" x2="145" y2="232" stroke="#fca5a5" stroke-width="1.1" stroke-dasharray="4 3"/>

    <line x1="176" y1="112" x2="259" y2="112" stroke="#cbd5e1" stroke-width="1.1"/>
    <line x1="176" y1="152" x2="259" y2="152" stroke="#cbd5e1" stroke-width="1.1"/>
    <line x1="176" y1="192" x2="259" y2="192" stroke="#cbd5e1" stroke-width="1.1"/>
    <line x1="176" y1="232" x2="259" y2="232" stroke="#fca5a5" stroke-width="1.1" stroke-dasharray="4 3"/>

    <line x1="291" y1="112" x2="384" y2="112" stroke="#cbd5e1" stroke-width="1.1"/>
    <line x1="291" y1="152" x2="384" y2="152" stroke="#cbd5e1" stroke-width="1.1"/>
    <line x1="291" y1="192" x2="384" y2="192" stroke="#cbd5e1" stroke-width="1.1"/>
    <line x1="291" y1="232" x2="384" y2="232" stroke="#fca5a5" stroke-width="1.1" stroke-dasharray="4 3"/>

    <circle cx="55" cy="140" r="15" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <circle cx="160" cy="112" r="15" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
    <circle cx="160" cy="152" r="15" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
    <circle cx="160" cy="192" r="15" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
    <circle cx="160" cy="232" r="15" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
    <circle cx="275" cy="112" r="15" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
    <circle cx="275" cy="152" r="15" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
    <circle cx="275" cy="192" r="15" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
    <circle cx="275" cy="232" r="15" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
    <circle cx="400" cy="112" r="15" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
    <circle cx="400" cy="152" r="15" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
    <circle cx="400" cy="192" r="15" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
    <circle cx="400" cy="232" r="15" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>

    <text x="55" y="140" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#166534">0</text>
    <text x="160" y="112" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#166534">0</text>
    <text x="160" y="152" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#166534">1</text>
    <text x="160" y="192" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#166534">2</text>
    <text x="160" y="232" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#92400e">bad</text>
    <text x="275" y="112" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#166534">0</text>
    <text x="275" y="152" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#166534">1</text>
    <text x="275" y="192" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#166534">2</text>
    <text x="275" y="232" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#92400e">bad</text>
    <text x="400" y="112" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#166534">0</text>
    <text x="400" y="152" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#166534">1</text>
    <text x="400" y="192" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#166534">2</text>
    <text x="400" y="232" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#92400e">bad</text>

    <line x1="152" y1="224" x2="168" y2="240" stroke="#dc2626" stroke-width="2"/>
    <line x1="168" y1="224" x2="152" y2="240" stroke="#dc2626" stroke-width="2"/>
    <line x1="392" y1="224" x2="408" y2="240" stroke="#dc2626" stroke-width="2"/>
    <line x1="408" y1="224" x2="392" y2="240" stroke="#dc2626" stroke-width="2"/>

    <text x="130" y="262" font-size="10" fill="#b91c1c">命中 → 不转移</text>
    <text x="34" y="262" font-size="10" fill="#64748b">绿色 = 安全</text>

    <rect x="16" y="278" width="428" height="126" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="300" font-size="12" font-weight="bold" fill="#1e40af">dp[0][0] = 1</text>
    <text x="28" y="322" font-size="12" fill="#334155">dp[i+1][ next[s][c] ] += dp[i][s]</text>
    <text x="28" y="342" font-size="11.5" fill="#b45309">要求 next[s][c] 不是 bad；是 bad 就丢弃</text>
    <text x="28" y="366" font-size="12" fill="#334155">avoid = Σ dp[n][s]</text>
    <text x="28" y="388" font-size="12" fill="#334155">contain = |Σ|ⁿ − avoid</text>

    <rect x="16" y="416" width="428" height="118" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="28" y="438" font-size="11.5" font-weight="bold" fill="#15803d">本机实测（Go 1.26.8 容器，mod 10⁹+7）</text>
    <text x="28" y="458" font-size="11.5" fill="#334155">{he,she,his,hers}，字母表 5，n=9</text>
    <text x="28" y="477" font-size="11.5" fill="#334155">状态 10、转移 195、避开 1301093</text>
    <text x="28" y="496" font-size="11.5" fill="#15803d">与暴力枚举 1301093 一致 ✅</text>
    <text x="28" y="515" font-size="11.5" fill="#334155">26 字母 n=20：避开 370204243，含 983418106</text>
    <text x="28" y="531" font-size="10.5" fill="#64748b">对账和 353622342 = 26²⁰ mod p ✅</text>
  </g>
</svg>
