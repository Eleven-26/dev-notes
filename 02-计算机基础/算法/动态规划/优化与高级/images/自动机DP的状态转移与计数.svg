<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">自动机 DP：把「长度为 n 的串」压成「AC 状态 × 长度」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">左：补全 goto、把 bad 沿 fail 链传下去；右：按长度分层转移，命中状态直接丢弃</text>

  <g transform="translate(20,70)">
