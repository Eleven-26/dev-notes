<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">分割点枚举：k 试三个值取 min，再加上区间代价</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">石子合并 [1 2 3 4]，dp[0][3] 的三个候选逐一抄自正文 2.1</text>

  <g transform="translate(40,88)">
    <rect x="0" y="0" width="560" height="340" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="20" y="26" font-size="15" font-weight="bold" fill="#0f172a">dp[0][3]：三个分割点各试一遍</text>
    <text x="20" y="46" font-size="10.5" fill="#64748b">cost(0,3) 就是区间总重 1+2+3+4 = 10</text>

    <rect x="20" y="62" width="520" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="34" y="84" font-size="11.5" font-weight="bold" fill="#1e40af">k = 0：dp[0][0] + dp[1][3] = 0 + 14 = 14</text>
    <text x="34" y="106" font-size="10.5" fill="#1e40af">拆成 [0,0] 与 [1,3] 两段，左边单堆零代价</text>

    <rect x="20" y="130" width="520" height="56" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/>
    <text x="34" y="152" font-size="11.5" font-weight="bold" fill="#14532d">k = 1：dp[0][1] + dp[2][3] = 3 + 7 = 10  ← 最小</text>
    <text x="34" y="174" font-size="10.5" fill="#14532d">拆成 [0,1] 与 [2,3] 两段，取它</text>

    <rect x="20" y="198" width="520" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="34" y="220" font-size="11.5" font-weight="bold" fill="#1e40af">k = 2：dp[0][2] + dp[3][3] = 11 + 0 = 11</text>
    <text x="34" y="242" font-size="10.5" fill="#1e40af">拆成 [0,2] 与 [3,3] 两段，右边单堆零代价</text>

    <rect x="20" y="266" width="520" height="56" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5" rx="8"/>
    <text x="34" y="288" font-size="11.5" font-weight="bold" fill="#7c2d12">min(14, 10, 11) = 10，再加 cost 10 → dp[0][3] = 20</text>
    <text x="34" y="310" font-size="10.5" fill="#7c2d12">四堆石子合并成一堆的最小代价 = 20</text>
  </g>

  <g transform="translate(620,88)">
    <rect x="0" y="0" width="340" height="340" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="14" font-weight="bold" fill="#0f172a">分割点 k 代表什么</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">四道题共用同一副骨架</text>

    <rect x="14" y="62" width="312" height="58" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="84" font-size="11" font-weight="bold" fill="#1e40af">最长回文子序列</text>
    <text x="28" y="104" font-size="10" fill="#1e40af">看两端配不配：s[i] == s[j]</text>

    <rect x="14" y="128" width="312" height="58" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="150" font-size="11" font-weight="bold" fill="#1e40af">戳气球</text>
    <text x="28" y="170" font-size="10" fill="#1e40af">反过来想：看最后戳破哪一个 k</text>

    <rect x="14" y="194" width="312" height="58" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="216" font-size="11" font-weight="bold" fill="#1e40af">石子合并</text>
    <text x="28" y="236" font-size="10" fill="#1e40af">只能合并相邻石子，看从哪里断开</text>

    <rect x="14" y="260" width="312" height="58" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="282" font-size="11" font-weight="bold" fill="#1e40af">括号匹配</text>
    <text x="28" y="302" font-size="10" fill="#1e40af">看首尾配不配对</text>
  </g>
</svg>
