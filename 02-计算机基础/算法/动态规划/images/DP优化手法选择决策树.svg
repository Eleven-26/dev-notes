<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwD" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#475569"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">DP 优化决策树：先看 cost 的长相，再挑那把刀</text>
  <text x="500" y="56" text-anchor="middle" font-size="11.5" fill="#64748b">分支逐字抄自正文第六节的决策树；每个叶子下的两个数是正文 2.2 / 3.2 / 4.2 / 5.2 的容器实测操作次数（Go 1.26.8）</text>

  <rect x="350" y="68" width="300" height="44" rx="10" fill="#0f172a"/>
  <text x="500" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">转移是什么形状？</text>
  <text x="500" y="104" text-anchor="middle" font-size="10.5" fill="#cbd5e1">dp[i] = min / max { dp[j] + cost(i, j) }</text>

  <g stroke="#475569" stroke-width="1.4" fill="none">
    <line x1="500" y1="112" x2="500" y2="126"/>
    <line x1="110" y1="126" x2="890" y2="126"/>
    <line x1="110" y1="126" x2="110" y2="144" marker-end="url(#arwD)"/>
    <line x1="305" y1="126" x2="305" y2="144" marker-end="url(#arwD)"/>
    <line x1="500" y1="126" x2="500" y2="144" marker-end="url(#arwD)"/>
    <line x1="695" y1="126" x2="695" y2="144" marker-end="url(#arwD)"/>
    <line x1="890" y1="126" x2="890" y2="144" marker-end="url(#arwD)"/>
  </g>

  <rect x="17" y="148" width="186" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="110" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">① cost 与 j 无关</text>
  <text x="110" y="190" text-anchor="middle" font-size="10.5" fill="#334155">只要窗口里的最值</text>

  <rect x="212" y="148" width="186" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="305" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">② cost 含交叉项</text>
  <text x="305" y="190" text-anchor="middle" font-size="10.5" fill="#334155">出现 S[i]·S[j] 这种乘积</text>

  <rect x="407" y="148" width="186" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="500" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">③ 断点单调移动</text>
  <text x="500" y="190" text-anchor="middle" font-size="10.5" fill="#334155">区间 DP 的枚举断点</text>

  <rect x="602" y="148" width="186" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="695" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">④ 要前缀上的聚合</text>
  <text x="695" y="190" text-anchor="middle" font-size="10.5" fill="#334155">值域或下标前缀的最值</text>

  <rect x="797" y="148" width="186" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="890" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">⑤ 以上都不像</text>
  <text x="890" y="190" text-anchor="middle" font-size="10.5" fill="#991b1b">先别急着换算法</text>

  <g stroke="#475569" stroke-width="1.3" fill="none">
    <line x1="110" y1="204" x2="110" y2="220" marker-end="url(#arwD)"/>
    <line x1="305" y1="204" x2="305" y2="220" marker-end="url(#arwD)"/>
    <line x1="500" y1="204" x2="500" y2="220" marker-end="url(#arwD)"/>
    <line x1="695" y1="204" x2="695" y2="220" marker-end="url(#arwD)"/>
    <line x1="890" y1="204" x2="890" y2="220" marker-end="url(#arwD)"/>
  </g>

  <rect x="17" y="224" width="186" height="118" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="110" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">单调队列</text>
  <text x="110" y="264" text-anchor="middle" font-size="10.5" fill="#065f46">O(n·m) → O(n)</text>
  <text x="110" y="288" text-anchor="middle" font-size="10.5" fill="#334155">n=20000、m=100</text>
  <text x="110" y="306" text-anchor="middle" font-size="10.5" fill="#334155">1 995 050 → 59 991</text>
  <text x="110" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">省 33.3 倍</text>

  <rect x="212" y="224" width="186" height="118" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="305" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">斜率优化</text>
  <text x="305" y="264" text-anchor="middle" font-size="10.5" fill="#065f46">O(n)，x 单调时</text>
  <text x="305" y="282" text-anchor="middle" font-size="10.5" fill="#065f46">x 不单调改二分 O(n log n)</text>
  <text x="305" y="304" text-anchor="middle" font-size="10.5" fill="#334155">n=20000</text>
  <text x="305" y="322" text-anchor="middle" font-size="10.5" fill="#334155">200 010 000 → 59 908</text>
  <text x="305" y="338" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#065f46">省 3338.6 倍</text>

  <rect x="407" y="224" width="186" height="118" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="500" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#065f46">决策单调性</text>
  <text x="500" y="261" text-anchor="middle" font-size="10" fill="#065f46">（四边形不等式）</text>
  <text x="500" y="279" text-anchor="middle" font-size="10.5" fill="#065f46">O(n³) → O(n²)</text>
  <text x="500" y="301" text-anchor="middle" font-size="10.5" fill="#334155">石子合并 n=400</text>
  <text x="500" y="319" text-anchor="middle" font-size="10.5" fill="#334155">10 666 600 → 160 652</text>
  <text x="500" y="337" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#065f46">省 66.4 倍</text>

  <rect x="602" y="224" width="186" height="118" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="695" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">BIT / 线段树</text>
  <text x="695" y="264" text-anchor="middle" font-size="10.5" fill="#065f46">O(n²) → O(n log n)</text>
  <text x="695" y="288" text-anchor="middle" font-size="10.5" fill="#334155">LIS，n=20000</text>
  <text x="695" y="306" text-anchor="middle" font-size="10.5" fill="#334155">199 990 000 → 293 865</text>
  <text x="695" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">省 680.6 倍</text>

  <rect x="797" y="224" width="186" height="118" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="5 4"/>
  <text x="890" y="242" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9a3412">两条退路</text>
  <rect x="807" y="250" width="166" height="40" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="890" y="266" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9a3412">状态数本身爆炸</text>
  <text x="890" y="282" text-anchor="middle" font-size="10" fill="#9a3412">回本体：换状态定义 / 状压</text>
  <rect x="807" y="296" width="166" height="40" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="890" y="312" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9a3412">只是常数大</text>
  <text x="890" y="328" text-anchor="middle" font-size="10" fill="#9a3412">先别优化，把 O(n²) 写对</text>

  <rect x="30" y="356" width="940" height="60" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="46" y="378" font-size="11.5" font-weight="bold" fill="#92400e">三条通用铁律：① 先有正确的朴素版再优化；② 优化前后 dp 值必须逐项一致；③ 先估数量级，再决定值不值得</text>
  <text x="46" y="400" font-size="10.5" fill="#92400e">⚠️ 四个叶子的实测都带「dp 值逐项一致 = true」；不一致就是「改快了但改错了」，只能靠与朴素版逐项对照才发现</text>

  <text x="30" y="440" font-size="10.5" fill="#94a3b8">对应关系：① → 第二节（滑动窗口最值），② → 第三节（分段平方代价），③ → 第四节（石子合并），④ → 第五节（LIS 的值域前缀最值）。</text>
  <text x="30" y="460" font-size="10.5" fill="#94a3b8">「都不像」这一支不进叶子：它把问题退回正文 README.md 的状态定义层面，或干脆维持朴素版 —— 见第六节末尾的两条退路。</text>
</svg>
