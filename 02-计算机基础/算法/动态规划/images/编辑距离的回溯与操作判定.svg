<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">回溯：从右下角往回读，每一步是哪种操作</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">判定依据是 2.1 的操作对照表；dp[5][3] = 3，说明读到 3 步就能退回起点</text>

  <g transform="translate(40,88)">
    <rect x="0" y="0" width="940" height="340" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="20" y="26" font-size="15" font-weight="bold" fill="#0f172a">回溯的判定顺序</text>
    <text x="20" y="46" font-size="10.5" fill="#64748b">相等就白配、不等就把「这一步是哪种操作」定下来</text>

    <rect x="230" y="62" width="220" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="244" y="84" font-size="12" font-weight="bold" fill="#1e40af">起点：右下角 dp[m][n]</text>
    <text x="244" y="104" font-size="10" fill="#1e40af">本例 dp[5][3] = 3</text>
    <line x1="340" y1="118" x2="340" y2="130" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="230" y="134" width="220" height="56" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="244" y="156" font-size="12" font-weight="bold" fill="#92400e">这一位 a[i-1] == b[j-1] ？</text>
    <text x="244" y="176" font-size="10" fill="#92400e">相等走对角线，不等就比三个邻居</text>
    <line x1="340" y1="190" x2="250" y2="210" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="340" y1="190" x2="590" y2="210" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="30" y="214" width="420" height="104" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="44" y="236" font-size="11.5" font-weight="bold" fill="#14532d">相等 → 白配，不花操作</text>
    <text x="44" y="258" font-size="11" fill="#14532d">斜着退到 (i-1, j-1)</text>
    <text x="44" y="280" font-size="11" fill="#14532d">本例：dp[2][2]（o 对 o）= dp[1][1] = 1</text>
    <text x="44" y="302" font-size="11" fill="#14532d">dp[3][1]（r 对 r）= dp[2][0] = 2</text>

    <rect x="490" y="214" width="420" height="104" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="504" y="236" font-size="11.5" font-weight="bold" fill="#991b1b">不等 → 1 + min(上, 左, 左上)</text>
    <text x="504" y="258" font-size="11" fill="#991b1b">上 → 删除 a[i-1]；左 → 插入 b[j-1]</text>
    <text x="504" y="280" font-size="11" fill="#991b1b">左上 → 替换 a[i-1] 成 b[j-1]</text>
    <text x="504" y="302" font-size="11" fill="#991b1b">本例：1 + min(上 2, 左 4, 左上 3) = 3</text>
  </g>

  <g transform="translate(40,452)">
    <rect x="0" y="0" width="940" height="64" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="20" y="26" font-size="12" fill="#334155">退到 i == 0 或 j == 0 就收工：a 里剩下的字符全部删除、b 里剩下的全部插入</text>
    <text x="20" y="50" font-size="12" fill="#334155">一路读下来的操作序列，就是 diff 里所说的编辑脚本（第五节）</text>
  </g>
</svg>
