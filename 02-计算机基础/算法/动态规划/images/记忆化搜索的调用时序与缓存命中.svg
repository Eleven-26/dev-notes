<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwO" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#d97706"/></marker>
    <marker id="arwG" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#059669"/></marker>
    <marker id="arwS" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">调用时序：solve(f(5)) 加缓存后的 9 次进入</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">纵向下行是时间；每条事件行一次「进入 solve」，编号 #1 到 #9 与正文 4.1 的实测打点逐条对应</text>

  <!-- 生命线表头 -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="22" y="88" width="60" height="24" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="52" y="104" fill="#334155">main</text>
    <rect x="138" y="88" width="64" height="24" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="170" y="104" fill="#1e40af">f(5)</text>
    <rect x="278" y="88" width="64" height="24" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="310" y="104" fill="#1e40af">f(4)</text>
    <rect x="418" y="88" width="64" height="24" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="450" y="104" fill="#1e40af">f(3)</text>
    <rect x="558" y="88" width="64" height="24" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="590" y="104" fill="#1e40af">f(2)</text>
    <rect x="703" y="88" width="64" height="24" rx="6" fill="#f1f5f9" stroke="#64748b"/><text x="735" y="104" fill="#334155">f(1)</text>
    <rect x="848" y="88" width="64" height="24" rx="6" fill="#f1f5f9" stroke="#64748b"/><text x="880" y="104" fill="#334155">f(0)</text>
  </g>

  <!-- 生命线 -->
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4">
    <line x1="52" y1="112" x2="52" y2="470"/>
    <line x1="170" y1="112" x2="170" y2="470"/>
    <line x1="310" y1="112" x2="310" y2="470"/>
    <line x1="450" y1="112" x2="450" y2="470"/>
    <line x1="590" y1="112" x2="590" y2="470"/>
    <line x1="735" y1="112" x2="735" y2="470"/>
    <line x1="880" y1="112" x2="880" y2="470"/>
  </g>
  <line x1="20" y1="470" x2="930" y2="470" stroke="#cbd5e1" stroke-width="1"/>
  <text x="944" y="474" font-size="10.5" fill="#94a3b8">时间向下</text>

  <!-- #1 main -> f(5) 未命中 -->
  <line x1="60" y1="140" x2="136" y2="140" stroke="#d97706" stroke-width="1.6" marker-end="url(#arwO)"/>
  <text x="98" y="132" text-anchor="middle" font-size="10.5" fill="#92400e">#1 未命中展开</text>

  <!-- #2 f(5) -> f(4) 未命中 -->
  <line x1="178" y1="178" x2="276" y2="178" stroke="#d97706" stroke-width="1.6" marker-end="url(#arwO)"/>
  <text x="227" y="170" text-anchor="middle" font-size="10.5" fill="#92400e">#2 未命中展开</text>

  <!-- #3 f(4) -> f(3) 未命中 -->
  <line x1="318" y1="216" x2="416" y2="216" stroke="#d97706" stroke-width="1.6" marker-end="url(#arwO)"/>
  <text x="367" y="208" text-anchor="middle" font-size="10.5" fill="#92400e">#3 未命中展开</text>

  <!-- #4 f(3) -> f(2) 未命中 -->
  <line x1="458" y1="254" x2="556" y2="254" stroke="#d97706" stroke-width="1.6" marker-end="url(#arwO)"/>
  <text x="507" y="246" text-anchor="middle" font-size="10.5" fill="#92400e">#4 未命中展开</text>

  <!-- #5 f(2) -> f(1) 边界 -->
  <line x1="598" y1="292" x2="701" y2="292" stroke="#64748b" stroke-width="1.6" marker-end="url(#arwS)"/>
  <text x="649" y="284" text-anchor="middle" font-size="10.5" fill="#334155">#5 边界直返 1</text>

  <!-- #6 f(2) -> f(0) 边界，随后 f(2) 写 memo[2] -->
  <line x1="598" y1="330" x2="814" y2="330" stroke="#64748b" stroke-width="1.6" marker-end="url(#arwS)"/>
  <rect x="655" y="316" width="152" height="14" fill="#ffffff"/>
  <text x="731" y="327" text-anchor="middle" font-size="10.5" fill="#334155">#6 边界直返 0 → 写 memo[2]=1</text>

  <!-- #7 f(3) -> f(1) 边界，随后 f(3) 写 memo[3] -->
  <line x1="458" y1="368" x2="679" y2="368" stroke="#64748b" stroke-width="1.6" marker-end="url(#arwS)"/>
  <rect x="495" y="354" width="150" height="14" fill="#ffffff"/>
  <text x="570" y="365" text-anchor="middle" font-size="10.5" fill="#334155">#7 边界直返 1 → 写 memo[3]=2</text>

  <!-- #8 f(4) -> f(2) 命中，随后 f(4) 写 memo[4] -->
  <line x1="318" y1="406" x2="534" y2="406" stroke="#059669" stroke-width="1.6" marker-end="url(#arwG)"/>
  <rect x="345" y="392" width="160" height="14" fill="#ffffff"/>
  <text x="425" y="403" text-anchor="middle" font-size="10.5" fill="#065f46">#8 缓存命中返 1 → 写 memo[4]=3</text>

  <!-- #9 f(5) -> f(3) 命中，随后 f(5) 写 memo[5] -->
  <line x1="178" y1="444" x2="374" y2="444" stroke="#059669" stroke-width="1.6" marker-end="url(#arwG)"/>
  <rect x="205" y="430" width="150" height="14" fill="#ffffff"/>
  <text x="280" y="441" text-anchor="middle" font-size="10.5" fill="#065f46">#9 缓存命中返 2 → 写 memo[5]=5</text>

  <!-- 图例与统计 -->
  <g transform="translate(40,486)">
    <rect x="0" y="0" width="920" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="18" y="18" width="14" height="14" fill="#fbbf24"/>
    <text x="38" y="29" font-size="12" fill="#92400e">② 查缓存未命中 → ③ 展开：4 次</text>
    <rect x="268" y="18" width="14" height="14" fill="#34d399"/>
    <text x="288" y="29" font-size="12" fill="#065f46">② 查缓存命中 → 直接返回：2 次</text>
    <rect x="548" y="18" width="14" height="14" fill="#94a3b8"/>
    <text x="568" y="29" font-size="12" fill="#334155">① 判边界 → 直接返回：3 次</text>
    <text x="782" y="29" font-size="12" font-weight="bold" fill="#0f172a">合计 9 次</text>
  </g>

  <g transform="translate(40,552)">
    <rect x="0" y="0" width="920" height="68" rx="10" fill="#eff6ff" stroke="#2563eb"/>
    <text x="18" y="26" font-size="12" fill="#1e40af">⭐ 两次命中（#8 撞 memo[2]、#9 撞 memo[3]）都排在「该状态左子树算完并写缓存之后」——</text>
    <text x="30" y="48" font-size="12" fill="#1e40af">顺序是 4 → 5 → 6 → 写 memo[2] → 7 → 写 memo[3] → 8 命中 → 写 memo[4] → 9 命中 → 写 memo[5]。</text>
  </g>

  <g transform="translate(40,632)">
    <rect x="0" y="0" width="920" height="66" rx="10" fill="#fef3c7" stroke="#b45309"/>
    <text x="18" y="24" font-size="12" fill="#92400e">对照：同一题裸递归进入 15 次、加缓存 9 次；n = 25 时是 242785 次对 49 次（记忆化那列 = 2n − 1）。</text>
    <text x="18" y="46" font-size="12" fill="#92400e">⚠️ 边界排在 ② 之前，所以 memo 里只有 f(2)..f(5) 四条，f(0)、f(1) 一次都没进缓存。</text>
  </g>
</svg>
