<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">动态规划体系总览：三个性质管三件事，十一篇按形状归族</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">无后效性 → 敢定义状态；最优子结构 → 敢写转移；重叠子问题 → 这笔账值得算</text>

  <text x="20" y="90" font-size="13" font-weight="bold" fill="#2563eb">一、DP 凭什么成立：三个性质缺一不可，各管一件事</text>

  <rect x="20" y="100" width="310" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="34" y="126" font-size="13.5" font-weight="bold" fill="#1e3a8a">无后效性</text>
  <text x="34" y="150" font-size="11.5" fill="#1e3a8a">往后怎么走与「怎么来的」无关</text>
  <text x="34" y="170" font-size="11.5" fill="#1e3a8a">它管：状态该怎么定义</text>

  <rect x="345" y="100" width="310" height="80" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="359" y="126" font-size="13.5" font-weight="bold" fill="#14532d">最优子结构</text>
  <text x="359" y="150" font-size="11.5" fill="#14532d">子问题最优能拼出父问题最优</text>
  <text x="359" y="170" font-size="11.5" fill="#14532d">它管：转移方程写不写得出来</text>

  <rect x="670" y="100" width="310" height="80" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="684" y="126" font-size="13.5" font-weight="bold" fill="#78350f">重叠子问题</text>
  <text x="684" y="150" font-size="11.5" fill="#78350f">同一个子问题被反复求解</text>
  <text x="684" y="170" font-size="11.5" fill="#78350f">它管：值不值得用 DP</text>

  <text x="20" y="206" font-size="13" font-weight="bold" fill="#2563eb">二、本目录十一篇按「问题形状」归族</text>

  <rect x="20" y="216" width="232" height="150" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="34" y="242" font-size="13" font-weight="bold" fill="#334155">① 入门与形状（3 篇）</text>
  <text x="34" y="266" font-size="11.5" fill="#334155">线性DP（一维就够）</text>
  <text x="34" y="286" font-size="11.5" fill="#334155">背包问题（0/1 · 完全 · 多重）</text>
  <text x="34" y="310" font-size="11.5" fill="#334155">记忆化搜索（自顶向下）</text>
  <text x="34" y="328" font-size="11" fill="#475569">⭐ 背包是最完整的模板</text>

  <rect x="260" y="216" width="232" height="150" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="274" y="242" font-size="13" font-weight="bold" fill="#1e3a8a">② 序列类（3 篇）</text>
  <text x="274" y="266" font-size="11.5" fill="#1e3a8a">LCS（最长公共子序列）</text>
  <text x="274" y="286" font-size="11.5" fill="#1e3a8a">LIS（最长上升子序列）</text>
  <text x="274" y="310" font-size="11.5" fill="#1e3a8a">编辑距离（增删改代价）</text>
  <text x="274" y="328" font-size="11" fill="#475569">⭐ 都是「前缀对前缀」</text>

  <rect x="500" y="216" width="232" height="150" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="514" y="242" font-size="13" font-weight="bold" fill="#14532d">③ 结构类（4 篇）</text>
  <text x="514" y="266" font-size="11.5" fill="#14532d">区间DP（小区间推大区间）</text>
  <text x="514" y="286" font-size="11.5" fill="#14532d">树形DP（子树合并）</text>
  <text x="514" y="306" font-size="11.5" fill="#14532d">数位DP（按位枚举）</text>
  <text x="514" y="326" font-size="11.5" fill="#14532d">状态压缩DP（位掩码）</text>

  <rect x="740" y="216" width="232" height="150" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text x="754" y="242" font-size="13" font-weight="bold" fill="#7c2d12">④ 收口（1 篇）</text>
  <text x="754" y="266" font-size="11.5" fill="#7c2d12">DP优化：单调队列 / 斜率</text>
  <text x="754" y="286" font-size="11.5" fill="#7c2d12">决策单调性 / 数据结构维护</text>
  <text x="754" y="310" font-size="11" fill="#475569">⭐ 先写对朴素式</text>
  <text x="754" y="328" font-size="11" fill="#475569">再谈降一维</text>

  <text x="20" y="384" font-size="13" font-weight="bold" fill="#2563eb">三、决策链与相邻专题的边界</text>

  <rect x="20" y="394" width="960" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="420" font-size="13.5" font-weight="bold" fill="#0f172a">能不能用 DP：先排除贪心，再查后效性，最后看子问题重不重叠</text>
  <text x="34" y="444" font-size="12.5" fill="#334155">· 与贪心：贪心若能证明「局部最优可推全局」就不用 DP —— DP 是它的兜底（区间调度带权版就是例子）</text>
  <text x="34" y="466" font-size="12.5" fill="#334155">· 与分治：分界线不是「能不能拆子问题」，而是「拆出来的子问题是不是被重复算」——不重叠就别用 DP</text>
  <text x="34" y="488" font-size="12.5" fill="#334155">· 与回溯：回溯枚举「所有解」，DP 求「最优值 / 计数」；DP 的边界就是「有限状态 + 明确转移 + 确定边界」</text>
  <text x="34" y="510" font-size="12.5" fill="#334155">· 写不出来的两个信号：状态漏了维度（后效没塞进状态）· 子问题之间不独立（拼不出父问题最优）</text>
  <text x="34" y="532" font-size="12" fill="#64748b">⭐ 三者串成一句话：无后效性 → 敢定义状态；最优子结构 → 敢写转移；重叠子问题 → 这笔账值得算</text>
</svg>
