    <text x="392" y="211" text-anchor="middle" font-size="13" fill="#334155">3</text>

    <rect x="56" y="232" width="64" height="42" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="88" y="259" text-anchor="middle" font-size="13" fill="#334155">o</text>
    <rect x="132" y="232" width="64" height="42" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
