    <text x="392" y="259" text-anchor="middle" font-size="13" fill="#334155">2</text>

    <rect x="56" y="280" width="64" height="42" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="88" y="307" text-anchor="middle" font-size="13" fill="#334155">r</text>
    <rect x="132" y="280" width="64" height="42" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="164" y="307" text-anchor="middle" font-size="13" fill="#64748b">3</text>
