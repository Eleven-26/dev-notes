    <rect x="281" y="373" width="70" height="48" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="357" y="373" width="70" height="48" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 3"/>

    <text x="20" y="436" font-size="11" fill="#334155">橙框 = 当前要算的格（答案 3）；绿格 = 命中的两次转移</text>
    <text x="20" y="456" font-size="11" fill="#334155">蓝虚线框 = dp[5][3] 的三个依赖（上 2、左 4、左上 3）</text>
  </g>

  <g transform="translate(580,88)">
    <rect x="0" y="0" width="380" height="460" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="14" font-weight="bold" fill="#0f172a">三个来源 = 三种操作</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">以 dp[5][3]（e 对 s，未命中）为例</text>

    <rect x="20" y="64" width="104" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="31" y="86" font-size="9.5" fill="#1e40af">左上 dp[i-1][j-1]</text>
    <text x="31" y="106" font-size="13" font-weight="bold" fill="#1e40af">3</text>
    <rect x="140" y="64" width="104" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="151" y="86" font-size="9.5" fill="#1e40af">上 dp[i-1][j]</text>
    <text x="151" y="106" font-size="13" font-weight="bold" fill="#1e40af">2</text>
    <rect x="20" y="128" width="104" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="31" y="150" font-size="9.5" fill="#1e40af">左 dp[i][j-1]</text>
    <text x="31" y="170" font-size="13" font-weight="bold" fill="#1e40af">4</text>
    <rect x="140" y="128" width="104" height="52" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5" rx="6"/>
    <text x="151" y="150" font-size="9.5" fill="#7c2d12">目标 dp[i][j]</text>
    <text x="151" y="170" font-size="13" font-weight="bold" fill="#7c2d12">3</text>

    <line x1="192" y1="116" x2="192" y2="126" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="124" y1="154" x2="138" y2="154" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="124" y1="116" x2="138" y2="126" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="14" y="196" width="352" height="116" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="218" font-size="11" fill="#1e40af">上 dp[i-1][j] → 删除 a[i-1]</text>
    <text x="28" y="240" font-size="11" fill="#1e40af">左 dp[i][j-1] → 插入 b[j-1]</text>
    <text x="28" y="262" font-size="11" fill="#1e40af">左上 dp[i-1][j-1] → 替换</text>
    <text x="28" y="284" font-size="11" fill="#1e40af">相等时走左上这条：白配，不花钱</text>

    <rect x="14" y="330" width="352" height="96" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="354" font-size="11" fill="#92400e">初始化：dp[i][0] = i（删 i 次）</text>
    <text x="28" y="378" font-size="11" fill="#92400e">dp[0][j] = j（插 j 次）</text>
    <text x="28" y="402" font-size="11" fill="#92400e">行列都正序扫，三个依赖必已算好</text>
  </g>
</svg>
