<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">记忆化搜索与递推 DP：同一副转移方程，两种驱动方式</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">六行对照逐条抄自正文第三节的对比表</text>

  <g transform="translate(40,88)">
    <rect x="0" y="0" width="450" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">记忆化搜索</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">自顶向下：递归 + 缓存</text>
    <text x="28" y="76" font-size="11.5" fill="#1e40af">方向：自顶向下</text>
    <text x="28" y="112" font-size="11.5" fill="#334155">实现：递归 + 缓存</text>
    <text x="28" y="148" font-size="11.5" fill="#334155">可读性：更直观</text>
    <text x="28" y="184" font-size="11.5" fill="#334155">复杂度：只算用到的状态</text>
    <text x="28" y="220" font-size="11.5" fill="#334155">栈深度：可能爆栈</text>
    <text x="28" y="256" font-size="11.5" fill="#334155">适用：状态稀疏、转移复杂</text>
  </g>

  <g transform="translate(520,88)">
    <rect x="0" y="0" width="440" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">递推 DP</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">自底向上：循环 + 数组</text>
    <text x="28" y="76" font-size="11.5" fill="#1e40af">方向：自底向上</text>
    <text x="28" y="112" font-size="11.5" fill="#334155">实现：循环 + 数组</text>
    <text x="28" y="148" font-size="11.5" fill="#334155">可读性：需想清遍历顺序</text>
    <text x="28" y="184" font-size="11.5" fill="#334155">复杂度：全部状态都要算</text>
    <text x="28" y="220" font-size="11.5" fill="#334155">栈深度：无栈风险</text>
    <text x="28" y="256" font-size="11.5" fill="#334155">适用：状态密集、转移规律</text>
  </g>

  <g transform="translate(40,400)">
    <rect x="0" y="0" width="940" height="72" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="10"/>
    <text x="20" y="26" font-size="12" fill="#92400e">判据：状态稀疏 → 记忆化；状态密集、转移规律 → 递推；递归深度可能很大 → 用递推避免爆栈</text>
    <text x="20" y="50" font-size="12" fill="#92400e">⚠️ 一维滚动的方向坑在记忆化版里不存在（背包问题.md 第三节），代价是放弃滚动、空间回不到 O(W)</text>
  </g>
</svg>
