<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwT" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">线性 DP 的状态依赖图：一个节点往回连几条边</text>
  <text x="500" y="50" text-anchor="middle" font-size="11.5" fill="#64748b">节点 = 状态，箭头 = 转移要读的格子；边全指向更小下标，所以图无环，拓扑序就是下标序 —— 见正文 2.6</text>

  <!-- ① 单点滚动 -->
  <rect x="20" y="62" width="470" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="84" font-size="12.5" font-weight="bold" fill="#0f172a">① 单点滚动 · 最大子数组和（2.1）</text>
  <text x="36" y="102" font-size="10" fill="#334155">dp[i] = max(a[i], dp[i-1] + a[i])</text>
  <g>
    <rect x="40" y="118" width="56" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="68" y="132" text-anchor="middle" font-size="9.5" fill="#1e40af">dp[0]</text>
    <text x="68" y="144" text-anchor="middle" font-size="9" fill="#334155">-2</text>
    <rect x="120" y="118" width="56" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="148" y="132" text-anchor="middle" font-size="9.5" fill="#1e40af">dp[1]</text>
    <text x="148" y="144" text-anchor="middle" font-size="9" fill="#334155">1</text>
    <rect x="200" y="118" width="56" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="228" y="132" text-anchor="middle" font-size="9.5" fill="#1e40af">dp[2]</text>
    <text x="228" y="144" text-anchor="middle" font-size="9" fill="#334155">-2</text>
    <rect x="280" y="118" width="56" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="308" y="132" text-anchor="middle" font-size="9.5" fill="#1e40af">dp[3]</text>
    <text x="308" y="144" text-anchor="middle" font-size="9" fill="#334155">4</text>
    <rect x="360" y="118" width="56" height="30" rx="6" fill="#fef3c7" stroke="#b45309"/>
    <text x="388" y="132" text-anchor="middle" font-size="9.5" fill="#1e40af">dp[4]</text>
    <text x="388" y="144" text-anchor="middle" font-size="9" fill="#334155">3</text>
  </g>
  <g stroke="#2563eb" stroke-width="1.5" fill="none">
    <line x1="96" y1="133" x2="118" y2="133" marker-end="url(#arwT)"/>
    <line x1="176" y1="133" x2="198" y2="133" marker-end="url(#arwT)"/>
    <line x1="256" y1="133" x2="278" y2="133" marker-end="url(#arwT)"/>
    <line x1="336" y1="133" x2="358" y2="133" marker-end="url(#arwT)"/>
  </g>
  <text x="36" y="176" font-size="10" fill="#475569">数字取自 2.1 推演表 cur 行的前 5 格（i = 0..4）</text>
  <text x="36" y="198" font-size="10.5" fill="#065f46">每格只回看 1 格：5 个节点 → 4 条边</text>
  <text x="36" y="220" font-size="10.5" fill="#065f46">边数与 n 同阶 → O(n)</text>

  <!-- ② 两层回看 -->
  <rect x="510" y="62" width="470" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="526" y="84" font-size="12.5" font-weight="bold" fill="#0f172a">② 两层回看 · 最长上升子序列（2.2）</text>
  <text x="526" y="102" font-size="10" fill="#334155">dp[i] = 1 + max(dp[j])，j &lt; i</text>
  <g>
    <rect x="530" y="112" width="56" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="558" y="131" text-anchor="middle" font-size="9.5" fill="#1e40af">dp[0]</text>
    <rect x="610" y="112" width="56" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="638" y="131" text-anchor="middle" font-size="9.5" fill="#1e40af">dp[1]</text>
    <rect x="690" y="112" width="56" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="718" y="131" text-anchor="middle" font-size="9.5" fill="#1e40af">dp[2]</text>
    <rect x="770" y="112" width="56" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="798" y="131" text-anchor="middle" font-size="9.5" fill="#1e40af">dp[3]</text>
    <rect x="850" y="112" width="56" height="30" rx="6" fill="#fef3c7" stroke="#b45309"/>
    <text x="878" y="131" text-anchor="middle" font-size="9.5" fill="#1e40af">dp[4]</text>
  </g>
  <g stroke="#2563eb" stroke-width="1.4" fill="none">
    <path d="M798,142 L798,158 L856,158 L856,144" marker-end="url(#arwT)"/>
    <path d="M718,142 L718,170 L868,170 L868,144" marker-end="url(#arwT)"/>
    <path d="M638,142 L638,182 L880,182 L880,144" marker-end="url(#arwT)"/>
    <path d="M558,142 L558,194 L892,194 L892,144" marker-end="url(#arwT)"/>
  </g>
  <text x="526" y="216" font-size="10.5" fill="#065f46">图上 4 条只是以 dp[4] 为终点的那 4 条</text>
  <text x="526" y="234" font-size="10.5" fill="#065f46">n = 5 全连起来 = 0+1+2+3+4 = 10 条边 → O(n²)</text>

  <!-- ⑤ 二维前缀 -->
  <rect x="20" y="256" width="470" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="278" font-size="12.5" font-weight="bold" fill="#0f172a">⑤ 二维前缀 · 每格固定 3 条边（2.5）</text>
  <g>
    <rect x="46" y="296" width="40" height="28" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="102" y="296" width="40" height="28" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="158" y="296" width="40" height="28" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="46" y="340" width="40" height="28" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="102" y="340" width="40" height="28" rx="4" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="158" y="340" width="40" height="28" rx="4" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="46" y="384" width="40" height="28" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="102" y="384" width="40" height="28" rx="4" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="158" y="384" width="40" height="28" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  </g>
  <text x="178" y="316" text-anchor="middle" font-size="9" fill="#334155">j</text>
  <text x="178" y="358" text-anchor="middle" font-size="9" fill="#1e40af">上</text>
  <text x="122" y="402" text-anchor="middle" font-size="9" fill="#1e40af">左</text>
  <text x="122" y="316" text-anchor="middle" font-size="9" fill="#1e40af">左上</text>
  <text x="178" y="402" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">dp[i][j]</text>
  <g stroke="#2563eb" stroke-width="1.5" fill="none">
    <line x1="178" y1="368" x2="178" y2="382" marker-end="url(#arwT)"/>
    <line x1="142" y1="398" x2="156" y2="398" marker-end="url(#arwT)"/>
    <line x1="142" y1="368" x2="157" y2="384" marker-end="url(#arwT)"/>
  </g>
  <text x="214" y="304" font-size="10.5" fill="#334155">依赖 上 / 左 / 左上 三格</text>
  <text x="214" y="324" font-size="10.5" fill="#334155">三格永远落在已算好的位置</text>
  <text x="214" y="344" font-size="10.5" fill="#334155">所以行列都正序扫即可</text>
  <text x="214" y="372" font-size="10" fill="#475569">蓝色 = 三个来源格</text>
  <text x="214" y="390" font-size="10" fill="#475569">黄色 = 本格</text>
  <text x="36" y="436" font-size="10.5" fill="#065f46">每格固定 3 条边：总边数 = 格数 × 3 → O(n · m)</text>

  <!-- ③④ -->
  <rect x="510" y="256" width="470" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="526" y="278" font-size="12.5" font-weight="bold" fill="#0f172a">③ 0/1 状态 与 ④ 带限制：同一格多摆几个节点</text>
  <text x="526" y="304" font-size="10.5" fill="#334155">③ 打家劫舍（2.3）：每个下标两个节点</text>
  <text x="540" y="322" font-size="10" fill="#475569">dp[i][1] ← dp[i-1][0] 一条</text>
  <text x="540" y="338" font-size="10" fill="#475569">dp[i][0] ← dp[i-1][0]、dp[i-1][1] 两条</text>
  <text x="526" y="360" font-size="10.5" fill="#065f46">每一代固定 3 条边，节点数翻倍</text>
  <text x="526" y="386" font-size="10.5" fill="#334155">④ 股票买卖（2.4）：状态 dp[i][k][0/1]</text>
  <text x="540" y="404" font-size="10" fill="#475569">节点数 = i × k × 2，边数比 ③ 再乘一个 k</text>
  <text x="526" y="428" font-size="10.5" fill="#065f46">画法与 ① 同构，只是每代不止一个节点</text>

  <rect x="20" y="470" width="960" height="68" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="38" y="494" font-size="11.5" font-weight="bold" fill="#1e40af">⭐ 判据：所有回看边都指向更小的下标 → 依赖图无环 → 拓扑序就是自然下标序（第一节「转移只回看不前瞻」的图形说法）</text>
  <text x="38" y="518" font-size="11" fill="#1e40af">⚠️ 一旦出现回边或环（要读更大下标、或区间两端都还没算），线性前提当场失效：改走区间 DP 的按长度拓扑序，或交给记忆化搜索的调用栈。</text>
</svg>
