<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Kadane 逐格推进：cur 何时重启、best 何时刷新</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">输入 a = [-2 1 -3 4 -1 2 1 -5 4]；表中数字逐字抄自正文 2.1 的推演表，答案 = 6</text>

  <g transform="translate(40,88)">
    <rect x="0" y="0" width="920" height="342" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="20" y="26" font-size="15" font-weight="bold" fill="#0f172a">下标 i、a[i]、cur、best 四行并排看</text>
    <text x="20" y="46" font-size="10.5" fill="#64748b">cur = 以当前位置结尾的最大子数组和；best = 到目前为止的最大值</text>

    <text x="20" y="80" font-size="11.5" fill="#334155">下标 i</text>
    <text x="20" y="118" font-size="11.5" fill="#334155">a[i]</text>
    <text x="20" y="156" font-size="11.5" fill="#334155">cur</text>
    <text x="20" y="194" font-size="11.5" fill="#334155">best</text>

    <rect x="160" y="62" width="76" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="198" y="79" text-anchor="middle" font-size="12.5" fill="#334155">0</text>
    <rect x="240" y="62" width="76" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="278" y="79" text-anchor="middle" font-size="12.5" fill="#334155">1</text>
    <rect x="320" y="62" width="76" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="358" y="79" text-anchor="middle" font-size="12.5" fill="#334155">2</text>
    <rect x="400" y="62" width="76" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="438" y="79" text-anchor="middle" font-size="12.5" fill="#334155">3</text>
    <rect x="480" y="62" width="76" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="518" y="79" text-anchor="middle" font-size="12.5" fill="#334155">4</text>
    <rect x="560" y="62" width="76" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="598" y="79" text-anchor="middle" font-size="12.5" fill="#334155">5</text>
    <rect x="640" y="62" width="76" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="678" y="79" text-anchor="middle" font-size="12.5" fill="#334155">6</text>
    <rect x="720" y="62" width="76" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="758" y="79" text-anchor="middle" font-size="12.5" fill="#334155">7</text>
    <rect x="800" y="62" width="76" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="838" y="79" text-anchor="middle" font-size="12.5" fill="#334155">8</text>

    <rect x="160" y="100" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="198" y="117" text-anchor="middle" font-size="12.5" fill="#334155">-2</text>
    <rect x="240" y="100" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="278" y="117" text-anchor="middle" font-size="12.5" fill="#334155">1</text>
    <rect x="320" y="100" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="358" y="117" text-anchor="middle" font-size="12.5" fill="#334155">-3</text>
    <rect x="400" y="100" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="438" y="117" text-anchor="middle" font-size="12.5" fill="#334155">4</text>
    <rect x="480" y="100" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="518" y="117" text-anchor="middle" font-size="12.5" fill="#334155">-1</text>
    <rect x="560" y="100" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="598" y="117" text-anchor="middle" font-size="12.5" fill="#334155">2</text>
    <rect x="640" y="100" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="678" y="117" text-anchor="middle" font-size="12.5" fill="#334155">1</text>
    <rect x="720" y="100" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="758" y="117" text-anchor="middle" font-size="12.5" fill="#334155">-5</text>
    <rect x="800" y="100" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="838" y="117" text-anchor="middle" font-size="12.5" fill="#334155">4</text>

    <rect x="160" y="138" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="198" y="155" text-anchor="middle" font-size="12.5" fill="#334155">-2</text>
    <rect x="240" y="138" width="76" height="34" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="278" y="155" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">1</text>
    <rect x="320" y="138" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="358" y="155" text-anchor="middle" font-size="12.5" fill="#334155">-2</text>
    <rect x="400" y="138" width="76" height="34" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="438" y="155" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">4</text>
    <rect x="480" y="138" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="518" y="155" text-anchor="middle" font-size="12.5" fill="#334155">3</text>
    <rect x="560" y="138" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="598" y="155" text-anchor="middle" font-size="12.5" fill="#334155">5</text>
    <rect x="640" y="138" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="678" y="155" text-anchor="middle" font-size="12.5" fill="#334155">6</text>
    <rect x="720" y="138" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="758" y="155" text-anchor="middle" font-size="12.5" fill="#334155">1</text>
    <rect x="800" y="138" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="838" y="155" text-anchor="middle" font-size="12.5" fill="#334155">5</text>

    <rect x="160" y="176" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="198" y="193" text-anchor="middle" font-size="12.5" fill="#334155">-2</text>
    <rect x="240" y="176" width="76" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="278" y="193" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">1</text>
    <rect x="320" y="176" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="358" y="193" text-anchor="middle" font-size="12.5" fill="#334155">1</text>
    <rect x="400" y="176" width="76" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="438" y="193" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">4</text>
    <rect x="480" y="176" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="518" y="193" text-anchor="middle" font-size="12.5" fill="#334155">4</text>
    <rect x="560" y="176" width="76" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="598" y="193" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">5</text>
    <rect x="640" y="176" width="76" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="678" y="193" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">6</text>
    <rect x="720" y="176" width="76" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="758" y="193" text-anchor="middle" font-size="12.5" fill="#334155">6</text>
    <rect x="800" y="176" width="76" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="838" y="193" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">6</text>

    <text x="20" y="240" font-size="11.5" fill="#334155">⭐ 黄色格 = cur 在这一格重启：a[i] 比 cur+a[i] 大，就从 a[i] 重新起算</text>
    <text x="20" y="262" font-size="11.5" fill="#334155">⭐ 绿色格 = best 在这一格被刷新（cur 超过历史最好），蓝色格 = 最后一格</text>
    <text x="20" y="284" font-size="11.5" fill="#334155">⚠️ 两件事各管各的：cur 在第 1、3 格重启，best 在第 1、3、5、6 格刷新</text>
    <text x="20" y="306" font-size="11.5" fill="#334155">答案 = max(best) = 6，对应子数组 [4 -1 2 1]（下标 3 到 6）</text>
    <text x="20" y="328" font-size="11.5" fill="#334155">⚠️ 最后一格 best 也是 6 —— 但「答案是 max(best)」的判据不能省，最优解不一定收尾于最后一个元素</text>
  </g>
</svg>
