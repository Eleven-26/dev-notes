<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 684" width="1000" height="684" role="img" aria-label="LIS 贪心加二分的三步规则流程图与严格递增、非递减两条分支">
  <style>
    text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    .mono { font-family: Consolas, "Courier New", monospace; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="684" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">LIS「贪心 + 二分」的三步规则与 strict / 非递减分支</text>
  <text x="500" y="52" text-anchor="middle" font-size="13" fill="#64748b">① 二分定位 → ② 替换 / ③ 追加，两条出口汇回同一个推进循环</text>

  <rect x="70" y="74" width="340" height="40" rx="8" fill="#1e293b"/>
  <text x="240" y="99" text-anchor="middle" font-size="14" fill="#ffffff">扫到下一个元素 x（tails 恒严格递增）</text>

  <path d="M240,114 L240,136" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <rect x="70" y="140" width="340" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="240" y="163" text-anchor="middle" font-size="14" fill="#0f172a">① 在 tails 上二分：找第一个 &gt;= x 的位置 k</text>
  <text x="240" y="183" text-anchor="middle" font-size="12.5" fill="#475569">把符号改成 &gt; 就换到右边那条分支</text>

  <path d="M240,196 L240,220" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <polygon points="240,224 372,268 240,312 108,268" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="240" y="264" text-anchor="middle" font-size="14" fill="#0f172a">tails 里存在</text>
  <text x="240" y="284" text-anchor="middle" font-size="14" fill="#0f172a">这样的 k 吗？</text>

  <path d="M108,268 L95,268 L95,346" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="86" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">是</text>

  <path d="M372,268 L385,268 L385,346" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="404" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#d97706">否</text>

  <rect x="40" y="350" width="210" height="96" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="145" y="378" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">② 替换 tails[k] = x</text>
  <text x="145" y="400" text-anchor="middle" font-size="12.5" fill="#0f172a">len(tails) 不变</text>
  <text x="145" y="422" text-anchor="middle" font-size="12.5" fill="#0f172a">这一长度的结尾变小</text>

  <rect x="280" y="350" width="210" height="96" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="385" y="378" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c2d12">③ 追加到末尾</text>
  <text x="385" y="400" text-anchor="middle" font-size="12.5" fill="#0f172a">len(tails) += 1</text>
  <text x="385" y="422" text-anchor="middle" font-size="12.5" fill="#0f172a">LIS 长度 +1</text>

  <path d="M145,446 L145,470 L150,470 L150,492" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M385,446 L385,470 L330,470 L330,492" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <rect x="70" y="496" width="340" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="240" y="519" text-anchor="middle" font-size="13" fill="#0f172a">两条出口之后 tails 仍严格递增</text>
  <text x="240" y="538" text-anchor="middle" font-size="12.5" fill="#475569">→ 处理下一个 x（2.3 就是八步这样推完的）</text>

  <path d="M410,168 L526,168" stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arb)"/>
  <text x="468" y="160" text-anchor="middle" font-size="11.5" fill="#3b82f6">比较符</text>

  <rect x="530" y="140" width="440" height="56" rx="8" fill="#1e293b"/>
  <text x="750" y="163" text-anchor="middle" font-size="14" fill="#ffffff">分支判据：二分的比较符（4.1 本机实测）</text>
  <text x="750" y="183" text-anchor="middle" font-size="12.5" fill="#cbd5e1">整段代码只差这一个符号</text>

  <rect x="530" y="230" width="440" height="112" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="548" y="256" font-size="13" font-weight="bold" fill="#14532d">lower_bound：替换第一个 &gt;= x → 严格递增</text>
  <text x="548" y="282" class="mono" font-size="13" fill="#0f172a">a = [2 2 2]     tails = [2]        长度 = 1</text>
  <text x="548" y="304" class="mono" font-size="13" fill="#0f172a">a = [1 3 3 4]   tails = [1 3 4]    长度 = 3</text>
  <text x="548" y="328" font-size="12.5" fill="#475569">等值元素必须替换掉已有的，不能追加</text>

  <rect x="530" y="372" width="440" height="112" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="548" y="398" font-size="13" font-weight="bold" fill="#7c2d12">upper_bound：替换第一个 &gt; x → 非递减</text>
  <text x="548" y="424" class="mono" font-size="13" fill="#0f172a">a = [2 2 2]     tails = [2 2 2]   长度 = 3</text>
  <text x="548" y="446" class="mono" font-size="13" fill="#0f172a">a = [1 3 3 4]   tails = [1 3 3 4]  长度 = 4</text>
  <text x="548" y="470" font-size="12.5" fill="#475569">等值元素可以接着排下去</text>

  <path d="M750,196 L750,226" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M970,178 L986,178 L986,380 L974,380" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <rect x="40" y="568" width="930" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="58" y="594" font-size="13" fill="#0f172a">⭐ 记忆锚点（4.2）：「相等要不要算递增」这个问题的答案，就写在二分的比较符里 —— 动手前先确认是哪一种。</text>
  <text x="58" y="618" font-size="13" fill="#0f172a">⚠️ 两条分支的 tails 长度都是答案，但 tails 本身不是答案序列（反例见 LIS的tails为什么不是答案.svg）。</text>
  <text x="58" y="642" font-size="13" fill="#475569">3.3 的补法：另记 tailsIdx 与 prev 两个数组并「同步」写入，实测两条反例都还原出 [3 4 5] 与 [5 6 7]（多花 O(n) 空间）。</text>
</svg>
