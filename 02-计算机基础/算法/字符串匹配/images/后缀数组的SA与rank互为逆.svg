<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">banana 的后缀排序与 SA / Rank 互为逆数组</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">样例串 s = banana；SA 与 Rank 一律按下标 0 起编号</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="560" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 后缀 → 排序 → 起始下标</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">字典序升序排列，共 6 个后缀；三个数列是同一份排序结果</text>

    <text x="28" y="76" font-size="10.5" fill="#64748b">后缀</text>
    <text x="200" y="76" font-size="10.5" fill="#64748b">排名（1 起）</text>
    <text x="340" y="76" font-size="10.5" fill="#64748b">起始下标</text>

    <rect x="14" y="86" width="532" height="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="14" y="112" width="532" height="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="14" y="138" width="532" height="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="14" y="164" width="532" height="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="14" y="190" width="532" height="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="14" y="216" width="532" height="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <g font-family="Consolas, Courier New, monospace" font-size="11" fill="#1e293b">
      <text x="28" y="102">a</text>
      <text x="28" y="128">ana</text>
      <text x="28" y="154">anana</text>
      <text x="28" y="180">banana</text>
      <text x="28" y="206">na</text>
      <text x="28" y="232">nana</text>
    </g>
    <g font-size="11" fill="#1e293b">
      <text x="200" y="102">1</text>
      <text x="200" y="128">2</text>
      <text x="200" y="154">3</text>
      <text x="200" y="180">4</text>
      <text x="200" y="206">5</text>
      <text x="200" y="232">6</text>
      <text x="340" y="102">5</text>
      <text x="340" y="128">3</text>
      <text x="340" y="154">1</text>
      <text x="340" y="180">0</text>
      <text x="340" y="206">4</text>
      <text x="340" y="232">2</text>
    </g>

    <text x="14" y="252" font-size="10" fill="#334155">右列自上而下读出，即 SA = [5, 3, 1, 0, 4, 2]</text>
    <text x="14" y="274" font-size="10" fill="#64748b">起始下标一列与 SA 数组是同一份数据（排名 1 起 → SA 下标 0 起）</text>
  </g>

  <g transform="translate(600,74)">
    <rect x="0" y="0" width="380" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. SA 与 Rank 互为逆数组</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">两个数组是同一张排序结果的正反两面</text>

    <text x="14" y="76" font-size="10.5" fill="#64748b">下标 i</text>
    <g font-size="10.5" fill="#64748b" text-anchor="middle">
      <text x="112" y="76">0</text>
      <text x="156" y="76">1</text>
      <text x="200" y="76">2</text>
      <text x="244" y="76">3</text>
      <text x="288" y="76">4</text>
      <text x="332" y="76">5</text>
    </g>

    <rect x="90" y="84" width="44" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <rect x="134" y="84" width="44" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <rect x="178" y="84" width="44" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <rect x="222" y="84" width="44" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <rect x="266" y="84" width="44" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <rect x="310" y="84" width="44" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <rect x="90" y="120" width="44" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <rect x="134" y="120" width="44" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <rect x="178" y="120" width="44" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <rect x="222" y="120" width="44" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <rect x="266" y="120" width="44" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <rect x="310" y="120" width="44" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>

    <text x="14" y="104" font-size="11" font-weight="bold" fill="#1e40af">SA[i]</text>
    <text x="14" y="140" font-size="11" font-weight="bold" fill="#92400e">Rank[i]</text>
    <g font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">
      <text x="112" y="104">5</text>
      <text x="156" y="104">3</text>
      <text x="200" y="104">1</text>
      <text x="244" y="104">0</text>
      <text x="288" y="104">4</text>
      <text x="332" y="104">2</text>
    </g>
    <g font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">
      <text x="112" y="140">3</text>
      <text x="156" y="140">2</text>
      <text x="200" y="140">5</text>
      <text x="244" y="140">1</text>
      <text x="288" y="140">4</text>
      <text x="332" y="140">0</text>
    </g>

    <rect x="14" y="164" width="352" height="64" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="186" font-size="11" font-weight="bold" fill="#14532d">互为逆数组：Rank[SA[i]] = i，SA[Rank[i]] = i</text>
    <text x="28" y="210" font-size="10" fill="#14532d">SA[0] = 5 → 排名最小的后缀从下标 5 开始，即 a</text>

    <text x="14" y="250" font-size="9.5" fill="#64748b">一个按排名查起始下标，一个按起始下标查排名</text>
    <text x="14" y="272" font-size="9.5" fill="#94a3b8">⚠️ 上表排名 1 起编号，数组中一律 0 起</text>
  </g>
</svg>
