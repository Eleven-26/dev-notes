<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Height 数组：只存「排名相邻后缀」的 LCP</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">样例串 s = banana；SA = [5, 3, 1, 0, 4, 2]，Rank = [3, 2, 5, 1, 4, 0]</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="620" height="446" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 六个后缀按字典序排好后，相邻两条比一次</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">右列就是 Height：第 i 行只和它上一行比，不和全部后缀比</text>

    <text x="28" y="74" font-size="10.5" fill="#64748b">排名 i</text>
    <text x="110" y="74" font-size="10.5" fill="#64748b">SA[i]</text>
    <text x="186" y="74" font-size="10.5" fill="#64748b">该排名上的后缀</text>
    <text x="424" y="74" font-size="10.5" fill="#64748b">Height[i]</text>

    <rect x="14" y="82" width="592" height="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
    <rect x="14" y="140" width="592" height="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
    <rect x="14" y="198" width="592" height="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
    <rect x="14" y="256" width="592" height="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
    <rect x="14" y="314" width="592" height="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
    <rect x="14" y="372" width="592" height="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>

    <g font-family="Consolas, Courier New, monospace" font-size="12" fill="#334155">
      <text x="28" y="104">0</text>
      <text x="28" y="162">1</text>
      <text x="28" y="220">2</text>
      <text x="28" y="278">3</text>
      <text x="28" y="336">4</text>
      <text x="28" y="394">5</text>

      <text x="110" y="104">5</text>
      <text x="110" y="162">3</text>
      <text x="110" y="220">1</text>
      <text x="110" y="278">0</text>
      <text x="110" y="336">4</text>
      <text x="110" y="394">2</text>
    </g>
    <g font-family="Consolas, Courier New, monospace" font-size="13" font-weight="bold" fill="#1e3a8a">
      <text x="186" y="104">a</text>
      <text x="186" y="162">ana</text>
      <text x="186" y="220">anana</text>
      <text x="186" y="278">banana</text>
      <text x="186" y="336">na</text>
      <text x="186" y="394">nana</text>
    </g>

    <text x="424" y="104" font-size="12" font-weight="bold" fill="#94a3b8">0</text>
    <text x="424" y="162" font-size="12" font-weight="bold" fill="#1e40af">1</text>
    <text x="424" y="220" font-size="12" font-weight="bold" fill="#dc2626">3</text>
    <text x="424" y="278" font-size="12" font-weight="bold" fill="#1e40af">0</text>
    <text x="424" y="336" font-size="12" font-weight="bold" fill="#1e40af">0</text>
    <text x="424" y="394" font-size="12" font-weight="bold" fill="#1e40af">2</text>

    <g font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#64748b">
      <text x="446" y="104">约定：排名 0 无上一行</text>
      <text x="446" y="162">LCP(a, ana) = 1</text>
      <text x="446" y="220">LCP(ana, anana) = 3</text>
      <text x="446" y="278">LCP(anana, banana) = 0</text>
      <text x="446" y="336">LCP(banana, na) = 0</text>
      <text x="446" y="394">LCP(na, nana) = 2</text>
    </g>

    <text x="14" y="438" font-size="10.5" fill="#334155">→ Height = [0, 1, 3, 0, 0, 2]；红字 3 是最大值 → 最长重复子串 "ana"（下标 1 与 3）</text>
  </g>

  <g transform="translate(660,74)">
    <rect x="0" y="0" width="320" height="446" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 为什么能 O(n) 递推</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">按原串下标顺序算，LCP 每轮至多掉 1</text>

    <rect x="14" y="60" width="292" height="70" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="80" font-size="11" font-weight="bold" fill="#92400e">Height[Rank[i]] ≥</text>
    <text x="28" y="98" font-size="11" fill="#92400e">Height[Rank[i − 1]] − 1</text>
    <text x="28" y="118" font-size="9.5" fill="#92400e">式里的 i 是原串下标，不是排名</text>

    <rect x="14" y="142" width="292" height="86" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="162" font-size="11" font-weight="bold" fill="#14532d">验算 i = 2</text>
    <text x="28" y="180" font-size="10" fill="#14532d">Rank[2] = 5，Rank[1] = 2</text>
    <text x="28" y="198" font-size="10" fill="#14532d">Height[5] = 2 ≥ Height[2] − 1 = 2 ✓</text>
    <text x="28" y="216" font-size="10" fill="#14532d">两条后缀都去掉首字符仍相邻</text>

    <rect x="14" y="240" width="292" height="66" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="260" font-size="11" font-weight="bold" fill="#1e40af">任意两后缀的 LCP</text>
    <text x="28" y="278" font-size="10" fill="#1e40af">= Height 上那段区间的最小值</text>
    <text x="28" y="296" font-size="10" fill="#1e40af">排名介于两者之间的后缀必经过它</text>

    <rect x="14" y="318" width="292" height="66" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="28" y="338" font-size="11" font-weight="bold" fill="#334155">一笔账（正文第四节）</text>
    <text x="28" y="356" font-size="10" fill="#334155">不同子串数 = 21 − (0+1+3+0+0+2)</text>
    <text x="28" y="374" font-size="10" fill="#334155">= 21 − 6 = 15</text>

    <text x="14" y="406" font-size="10" fill="#64748b">Height[0] 按约定是 0，所以求和时它不贡献</text>
    <text x="14" y="426" font-size="10" fill="#64748b">递推多出来的逐字符比较总量被 n 摊平</text>
  </g>
</svg>
