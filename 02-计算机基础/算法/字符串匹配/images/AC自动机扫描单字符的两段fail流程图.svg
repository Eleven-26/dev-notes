<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="acB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="acR" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#dc2626"/></marker>
    <marker id="acG" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">AC 自动机扫描阶段：读入一个字符后的两段 fail 动作</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">正文 5.2 节扫描代码的流程图；节点编号与 fail 值取自第二节实测 fail 数组 [0 0 0 0 1 2 0 3 0 3]</text>

  <text x="380" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">第一段：转移（cur 沿 fail 上退，i 不动）</text>

  <rect x="130" y="92" width="500" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="119" text-anchor="middle" font-size="14" fill="#0f172a">读入第 i 个字符，算 c = text[i] - 'a'</text>

  <rect x="130" y="158" width="500" height="44" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="380" y="185" text-anchor="middle" font-size="14" fill="#7c2d12">判定：cur != 0 且 next[cur][c] == -1 ？</text>

  <rect x="130" y="224" width="500" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="251" text-anchor="middle" font-size="14" fill="#1e3a8a">cur = fail[cur]（文本指针 i 保持不动）</text>

  <rect x="130" y="302" width="500" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="325" text-anchor="middle" font-size="14" fill="#1e3a8a">循环结束：有出边则 cur = next[cur][c]</text>
  <text x="380" y="345" text-anchor="middle" font-size="13" fill="#1e40af">cur = 0 且仍无出边时，停在根节点 0</text>

  <rect x="130" y="380" width="500" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="380" y="407" text-anchor="middle" font-size="14" fill="#14532d">t = cur：从当前节点起步收集词尾</text>

  <rect x="130" y="446" width="500" height="44" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="380" y="473" text-anchor="middle" font-size="14" fill="#7c2d12">判定：t != 0 ？</text>

  <rect x="130" y="512" width="500" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="380" y="539" text-anchor="middle" font-size="13" fill="#14532d">word[t] != -1 时 report(word[t], i - depth[t] + 1)</text>

  <rect x="130" y="578" width="500" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="380" y="605" text-anchor="middle" font-size="14" fill="#14532d">t = fail[t]：换到链上更短的后缀</text>

  <rect x="130" y="644" width="500" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="663" text-anchor="middle" font-size="14" fill="#0f172a">t = 0：本轮结束，i = i + 1</text>
  <text x="380" y="681" text-anchor="middle" font-size="12" fill="#64748b">回到第一个字符，继续下一轮</text>

  <line x1="380" y1="136" x2="380" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#acB)"/>
  <line x1="380" y1="202" x2="380" y2="224" stroke="#2563eb" stroke-width="1.5" marker-end="url(#acB)"/>
  <text x="392" y="218" font-size="12" fill="#2563eb">是</text>
  <path d="M130,246 L70,246 L70,180 L130,180" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#acR)"/>
  <path d="M630,180 L680,180 L680,328 L630,328" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#acG)"/>
  <text x="642" y="174" font-size="12" fill="#16a34a">否</text>
  <line x1="380" y1="354" x2="380" y2="380" stroke="#64748b" stroke-width="1.5" marker-end="url(#acB)"/>
  <line x1="380" y1="424" x2="380" y2="446" stroke="#64748b" stroke-width="1.5" marker-end="url(#acB)"/>
  <line x1="380" y1="490" x2="380" y2="512" stroke="#16a34a" stroke-width="1.5" marker-end="url(#acG)"/>
  <text x="392" y="506" font-size="12" fill="#16a34a">是</text>
  <line x1="380" y1="556" x2="380" y2="578" stroke="#16a34a" stroke-width="1.5" marker-end="url(#acG)"/>
  <path d="M130,600 L70,600 L70,468 L130,468" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#acR)"/>
  <path d="M630,468 L680,468 L680,666 L630,666" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#acB)"/>
  <text x="642" y="462" font-size="12" fill="#64748b">否</text>

  <text x="62" y="172" text-anchor="end" font-size="11" fill="#dc2626">退一层后</text>
  <text x="62" y="186" text-anchor="end" font-size="11" fill="#dc2626">重新判定</text>
  <text x="62" y="452" text-anchor="end" font-size="11" fill="#dc2626">换更短的</text>
  <text x="62" y="466" text-anchor="end" font-size="11" fill="#dc2626">后缀节点</text>

  <text x="700" y="112" font-size="14" font-weight="bold" fill="#0f172a">实测对照（文本 ushers）</text>
  <g font-size="12.5" fill="#334155">
    <text x="700" y="140">模式集 {he, she, his, hers}</text>
    <text x="700" y="164">fail 数组 = [0 0 0 0 1 2 0 3 0 3]</text>
    <text x="700" y="200">i = 4 的 r：节点 5 没有 r 出边</text>
    <text x="700" y="222">退到 fail[5] = 2，即节点 2</text>
    <text x="700" y="244">节点 2 有 r 出边，落到节点 8</text>
    <text x="700" y="280">i = 3 的 e：到节点 5，沿链报两处</text>
    <text x="700" y="302">she@1（节点 5）与 he@2（节点 2）</text>
    <text x="700" y="338">整句统计：转移 6 次</text>
    <text x="700" y="360">goto 处 fail 跳转 1 次</text>
    <text x="700" y="382">输出链检查 8 次，命中 3 处</text>
  </g>
  <text x="700" y="420" font-size="11.5" fill="#64748b">数字逐条来自正文 3.1、3.2、5.1 的实测行</text>
  <text x="700" y="440" font-size="11.5" fill="#64748b">漏掉第二段 = 静默漏报，这是最常见的错误</text>
</svg>
