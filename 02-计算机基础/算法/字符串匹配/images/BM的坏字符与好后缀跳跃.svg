<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">BM：从右往左比，坏字符与好后缀各算一个跳跃</text>
  <text x="500" y="64" text-anchor="middle" font-size="13" fill="#64748b">模式 p = at-that（长度 7），好后缀表 bmgs = [5 5 5 5 5 3 1]</text>

  <!-- Panel A：坏字符规则 -->
  <text x="100" y="118" font-size="14" font-weight="bold" fill="#1d4ed8">规则一　坏字符</text>
  <text x="100" y="152" text-anchor="end" font-size="13" fill="#334155">文本</text>
  <g>
    <rect x="180" y="124" width="70" height="42" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="250" y="124" width="70" height="42" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="320" y="124" width="70" height="42" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="390" y="124" width="70" height="42" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="460" y="124" width="70" height="42" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="530" y="124" width="70" height="42" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="600" y="124" width="70" height="42" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  </g>
  <g font-family="Consolas, Courier New, monospace" font-size="22" font-weight="bold" fill="#334155" text-anchor="middle">
    <text x="215" y="153">w</text>
    <text x="285" y="153">h</text>
    <text x="355" y="153">i</text>
    <text x="425" y="153">c</text>
    <text x="495" y="153">h</text>
    <text x="565" y="153">-</text>
    <text x="635" y="153" fill="#b91c1c">f</text>
  </g>

  <text x="100" y="212" text-anchor="end" font-size="13" fill="#334155">模式</text>
  <g>
    <rect x="180" y="184" width="70" height="42" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="250" y="184" width="70" height="42" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="320" y="184" width="70" height="42" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="390" y="184" width="70" height="42" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="460" y="184" width="70" height="42" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="530" y="184" width="70" height="42" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="600" y="184" width="70" height="42" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  </g>
  <g font-family="Consolas, Courier New, monospace" font-size="22" font-weight="bold" fill="#1e3a8a" text-anchor="middle">
    <text x="215" y="213">a</text>
    <text x="285" y="213">t</text>
    <text x="355" y="213">-</text>
    <text x="425" y="213">t</text>
    <text x="495" y="213">h</text>
    <text x="565" y="213">a</text>
    <text x="635" y="213" fill="#b91c1c">t</text>
  </g>
  <text x="690" y="211" font-size="12.5" fill="#b91c1c">从最右位开始比，第一位就失配</text>

  <line x1="215" y1="248" x2="670" y2="248" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="670,248 660,243 660,253" fill="#1d4ed8"/>
  <text x="300" y="240" font-size="13" fill="#1d4ed8">'f' 不在模式中 → 模式可以整体越过它，右滑 j+1 = 7 格</text>

  <!-- Panel B：好后缀规则 -->
  <text x="100" y="312" font-size="14" font-weight="bold" fill="#15803d">规则二　好后缀</text>
  <text x="100" y="356" text-anchor="end" font-size="13" fill="#334155">模式</text>
  <g>
    <rect x="180" y="330" width="70" height="42" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="250" y="330" width="70" height="42" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="320" y="330" width="70" height="42" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="390" y="330" width="70" height="42" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="460" y="330" width="70" height="42" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="530" y="330" width="70" height="42" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="600" y="330" width="70" height="42" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  </g>
  <g font-family="Consolas, Courier New, monospace" font-size="22" font-weight="bold" fill="#166534" text-anchor="middle">
    <text x="215" y="359">a</text>
    <text x="285" y="359">t</text>
    <text x="355" y="359" fill="#94a3b8">-</text>
    <text x="425" y="359" fill="#94a3b8">t</text>
    <text x="495" y="359" fill="#94a3b8">h</text>
    <text x="565" y="359">a</text>
    <text x="635" y="359">t</text>
  </g>
  <text x="690" y="353" font-size="12.5" fill="#166534">已匹配的后缀 "at"（右侧绿格）</text>
  <text x="690" y="373" font-size="12.5" fill="#166534">在模式更左边又出现一次（左侧绿格）</text>

  <line x1="530" y1="400" x2="180" y2="400" stroke="#15803d" stroke-width="2"/>
  <polygon points="180,400 190,395 190,405" fill="#15803d"/>
  <text x="240" y="392" font-size="13" fill="#15803d">让两段 "at" 对齐 → 右滑 5 格（bmgs[4] = 5）</text>

  <!-- 结论 -->
  <rect x="60" y="430" width="880" height="164" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="84" y="462" font-size="14" font-weight="bold" fill="#0f172a">实际跳跃 = max(坏字符位移, 好后缀位移)，且至少为 1</text>
  <text x="84" y="494" font-size="13" fill="#334155">坏字符规则：看失配处的文本字符 c，把模式右滑到「模式里 c 的上一处出现位置」与它对齐</text>
  <text x="84" y="522" font-size="13" fill="#334155">好后缀规则：看已匹配的后缀，把模式右滑到「该后缀在模式中再次出现」的位置对齐</text>
  <text x="84" y="554" font-size="13" fill="#64748b">本机实测（模式长度 16，文本 65536，字母表 a-z）：平均跳跃 11.88 格，96.0% 的移动跨过 1 格以上</text>
  <text x="84" y="580" font-size="13" fill="#64748b">同一输入上比较次数：朴素 68130，KMP 68031，Horspool 5740，BM(完整) 5740</text>
</svg>
