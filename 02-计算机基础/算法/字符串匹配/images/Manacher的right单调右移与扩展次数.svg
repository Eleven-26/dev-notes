<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="450" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">right 只在扩展成功时右移</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">变换串 #a#b#b#a#（n = 4，m = 2n+1 = 9），逐位数据抄自正文 2.3 的推演表</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="340" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="20" y="26" font-size="15" font-weight="bold" fill="#0f172a">五格并排看：下标、字符、半径、动作、right</text>
    <text x="20" y="46" font-size="10.5" fill="#64748b">right 行记录「这一位算完之后」的右边界，— 表示这一位没让 right 移动</text>

    <text x="20" y="79" font-size="11.5" fill="#334155">下标 i</text>
    <text x="20" y="117" font-size="11.5" fill="#334155">T[i]</text>
    <text x="20" y="155" font-size="11.5" fill="#334155">r[i]</text>
    <text x="20" y="193" font-size="11.5" fill="#334155">动作</text>
    <text x="20" y="231" font-size="11.5" fill="#334155">right</text>

    <rect x="150" y="62" width="70" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="230" y="62" width="70" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="310" y="62" width="70" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
