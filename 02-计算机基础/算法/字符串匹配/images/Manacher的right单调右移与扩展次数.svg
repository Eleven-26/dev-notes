    <text x="185" y="231" text-anchor="middle" font-size="12.5" fill="#94a3b8">—</text>
    <text x="265" y="231" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">3</text>
    <text x="345" y="231" text-anchor="middle" font-size="12.5" fill="#94a3b8">—</text>
    <text x="425" y="231" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">5</text>
    <text x="505" y="231" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">9</text>
    <text x="585" y="231" text-anchor="middle" font-size="12.5" fill="#94a3b8">—</text>
    <text x="665" y="231" text-anchor="middle" font-size="12.5" fill="#94a3b8">—</text>
    <text x="745" y="231" text-anchor="middle" font-size="12.5" fill="#94a3b8">—</text>
    <text x="825" y="231" text-anchor="middle" font-size="12.5" fill="#94a3b8">—</text>

    <text x="20" y="276" font-size="11.5" fill="#14532d">⭐ 让 right 右移的只有三次：i=1 到 3、i=3 到 5、i=4 到 9，右移总量 = 9 = 2n+1</text>
    <text x="20" y="298" font-size="11.5" fill="#334155">抄完即失配的五位（i=2、i=5、i=6、i=7、i=8）没有消耗扩展步，right 原地不动</text>
    <text x="20" y="320" font-size="11.5" fill="#92400e">⚠️ 摊还口径：每位算 min 是 O(1)，真正推进 right 的扩展步合计不超过 2n+1 → O(n)</text>
