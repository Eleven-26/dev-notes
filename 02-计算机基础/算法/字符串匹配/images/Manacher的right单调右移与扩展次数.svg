    <rect x="790" y="100" width="70" height="34" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>

    <text x="185" y="117" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">#</text>
    <text x="265" y="117" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">a</text>
    <text x="345" y="117" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">#</text>
    <text x="425" y="117" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">b</text>
    <text x="505" y="117" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">#</text>
    <text x="585" y="117" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">b</text>
    <text x="665" y="117" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">#</text>
    <text x="745" y="117" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">a</text>
    <text x="825" y="117" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">#</text>

    <rect x="150" y="138" width="70" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="230" y="138" width="70" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="310" y="138" width="70" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="390" y="138" width="70" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="470" y="138" width="70" height="34" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <rect x="550" y="138" width="70" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
