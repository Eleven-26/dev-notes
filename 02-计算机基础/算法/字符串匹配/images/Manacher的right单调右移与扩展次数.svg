    <rect x="310" y="176" width="70" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="390" y="176" width="70" height="34" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <rect x="470" y="176" width="70" height="34" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <rect x="550" y="176" width="70" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="630" y="176" width="70" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="710" y="176" width="70" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="790" y="176" width="70" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>

    <text x="185" y="193" text-anchor="middle" font-size="11.5" fill="#64748b">起</text>
    <text x="265" y="193" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">扩</text>
    <text x="345" y="193" text-anchor="middle" font-size="11.5" fill="#334155">抄</text>
    <text x="425" y="193" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">扩</text>
    <text x="505" y="193" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">抄扩</text>
    <text x="585" y="193" text-anchor="middle" font-size="11.5" fill="#334155">抄</text>
    <text x="665" y="193" text-anchor="middle" font-size="11.5" fill="#334155">抄</text>
    <text x="745" y="193" text-anchor="middle" font-size="11.5" fill="#334155">抄</text>
    <text x="825" y="193" text-anchor="middle" font-size="11.5" fill="#334155">抄</text>

    <rect x="150" y="214" width="70" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="230" y="214" width="70" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="310" y="214" width="70" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
