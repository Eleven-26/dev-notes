    <text x="185" y="155" text-anchor="middle" font-size="12.5" fill="#334155">1</text>
    <text x="265" y="155" text-anchor="middle" font-size="12.5" fill="#334155">2</text>
    <text x="345" y="155" text-anchor="middle" font-size="12.5" fill="#334155">1</text>
    <text x="425" y="155" text-anchor="middle" font-size="12.5" fill="#334155">2</text>
