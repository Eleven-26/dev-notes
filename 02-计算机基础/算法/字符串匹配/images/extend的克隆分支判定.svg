<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 7,3 0,6 Z" fill="#2563eb"/></marker>
    <marker id="arwG" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 7,3 0,6 Z" fill="#16a34a"/></marker>
    <marker id="arwR" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 7,3 0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">extend 何时造 clone：只看 len[p] + 1 是否等于 len[q]</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">实例取 banana 的第 4 次插入（pos = 3，字符 'a'），数值全部按第二节代码推演</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="460" height="470" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 一次 extend 的判定顺序</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">每加一个字符最多新增 2 个状态</text>

    <rect x="14" y="58" width="432" height="46" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="76" font-size="11" font-weight="bold" fill="#1e40af">① 新建 cur，len[cur] = len[last] + 1</text>
    <text x="28" y="94" font-size="10" fill="#1e40af">cur 代表「以新字符结尾的整个前缀」</text>

    <line x1="230" y1="104" x2="230" y2="116" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="14" y="116" width="432" height="62" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="136" font-size="11" font-weight="bold" fill="#1e40af">② 沿 link 链补转移</text>
    <text x="28" y="154" font-size="10" fill="#1e40af">p 从 last 起：只要 next[p][c] 为空就置成 cur</text>
    <text x="28" y="172" font-size="10" fill="#1e40af">然后 p = link[p]，直到 p == −1 或撞上已有转移</text>

    <line x1="230" y1="178" x2="230" y2="190" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="14" y="190" width="432" height="52" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="210" font-size="11" font-weight="bold" fill="#92400e">③ p == −1 ？</text>
    <text x="28" y="228" font-size="10" fill="#92400e">是 → link[cur] = 0，本轮结束（开头字符走这条）</text>

    <line x1="230" y1="242" x2="230" y2="254" stroke="#b45309" stroke-width="1.5" marker-end="url(#arwR)"/>

    <rect x="14" y="254" width="432" height="64" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="274" font-size="11" font-weight="bold" fill="#92400e">④ q = next[p][c]，比较 len[p] + 1 与 len[q]</text>
    <text x="28" y="292" font-size="10" fill="#92400e">相等 → link[cur] = q，直接结束，不分裂</text>
    <text x="28" y="310" font-size="10" fill="#92400e">不等 → q 里混着两档长度，必须拆开（走 ⑤）</text>

    <line x1="230" y1="318" x2="230" y2="330" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>

    <rect x="14" y="330" width="432" height="82" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="28" y="350" font-size="11" font-weight="bold" fill="#991b1b">⑤ 造 clone：把较短的那档接走</text>
    <text x="28" y="368" font-size="10" fill="#991b1b">len[clone] = len[p] + 1，link 与 next 都抄 q</text>
    <text x="28" y="386" font-size="10" fill="#991b1b">再沿 link 把 next[p][c] == q 的那些改成 clone</text>
    <text x="28" y="404" font-size="10" fill="#991b1b">最后 link[q] = link[cur] = clone</text>

    <text x="14" y="436" font-size="10.5" fill="#334155">clone 不新建「长度」，它只是把 q 的旧职责分一半走</text>
    <text x="14" y="456" font-size="10.5" fill="#64748b">这就是「每加一个字符最多新增 2 个状态」的来源</text>
  </g>

  <g transform="translate(520,74)">
    <rect x="0" y="0" width="460" height="470" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. banana pos = 3 插入 'a' 的实际走向</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">插入前 last = 3（"ban"，len 3），状态已有 0..3</text>

    <rect x="14" y="58" width="432" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="78" font-size="11" font-weight="bold" fill="#1e40af">①② 建 cur 并补转移</text>
    <text x="28" y="96" font-size="10" fill="#1e40af">cur = 4，len[4] = 4；p = 3 → next[3]['a'] = 4</text>
    <text x="28" y="114" font-size="10" fill="#1e40af">p = link[3] = 0，而 next[0]['a'] = 2 已存在 → 停</text>

    <line x1="230" y1="122" x2="230" y2="134" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="14" y="134" width="432" height="62" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="154" font-size="11" font-weight="bold" fill="#92400e">③④ 停在 p = 0，取出 q = 2</text>
    <text x="28" y="172" font-size="10" fill="#92400e">len[p] + 1 = 0 + 1 = 1，len[q] = 2 → 不相等</text>
    <text x="28" y="190" font-size="10" fill="#92400e">判据不成立 → 必须分裂，clone = 5</text>

    <line x1="230" y1="196" x2="230" y2="208" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>

    <rect x="14" y="208" width="432" height="82" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="28" y="228" font-size="11" font-weight="bold" fill="#991b1b">⑤ 分裂的三件事</text>
    <text x="28" y="246" font-size="10" fill="#991b1b">len[5] = 1，link[5] = link[2] = 0，next[5] 抄 q = {n→3}</text>
    <text x="28" y="264" font-size="10" fill="#991b1b">next[0]['a'] 由 2 改成 5（p 退到 −1 才停）</text>
    <text x="28" y="282" font-size="10" fill="#991b1b">link[2] = link[4] = 5</text>

    <rect x="14" y="302" width="432" height="66" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="322" font-size="11" font-weight="bold" fill="#14532d">本轮结果：状态数 4 → 6（cur 与 clone 各一个）</text>
    <text x="28" y="340" font-size="10" fill="#14532d">之后 next[5]['n'] 在 pos = 4 那轮被改成 7</text>
    <text x="28" y="358" font-size="10" fill="#14532d">banana 全程共触发 3 次 clone：5、7、9</text>

    <text x="14" y="392" font-size="10" fill="#64748b">不分裂的例子：换 abab，四次插入全部走 ④ 的「相等」分支，</text>
    <text x="14" y="410" font-size="10" fill="#64748b">状态只有 5 个（0..4），link 依次是 0、0、1、2</text>
    <text x="14" y="436" font-size="10" fill="#94a3b8">⚠️ 上图编号与「后缀自动机的状态图与 link 树」是同一份推演</text>
  </g>
</svg>
