<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="failArrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">AC 自动机：Trie 上的 fail 指针</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#64748b">模式集 {he, she, his, hers}；虚线 = fail 指针（未画出的均指向根节点 0）</text>

  <!-- Trie 边（无箭头，方向自上而下） -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <line x1="500" y1="84" x2="330" y2="186"/>
    <line x1="500" y1="84" x2="670" y2="186"/>
    <line x1="330" y1="186" x2="230" y2="288"/>
    <line x1="330" y1="186" x2="430" y2="288"/>
    <line x1="670" y1="186" x2="670" y2="288"/>
    <line x1="230" y1="288" x2="230" y2="390"/>
    <line x1="430" y1="288" x2="430" y2="390"/>
    <line x1="670" y1="288" x2="670" y2="390"/>
    <line x1="230" y1="390" x2="230" y2="492"/>
  </g>

  <!-- fail 指针 -->
  <g stroke="#ea580c" stroke-width="2" fill="none" stroke-dasharray="7 5">
    <path d="M648 272 Q 520 196 358 182" marker-end="url(#failArrow)"/>
    <path d="M644 378 Q 430 316 254 292" marker-end="url(#failArrow)"/>
    <path d="M452 378 Q 580 298 654 200" marker-end="url(#failArrow)"/>
    <path d="M232 512 Q 240 620 520 620 Q 784 620 784 262 Q 784 206 694 202" marker-end="url(#failArrow)"/>
  </g>

  <!-- 节点 -->
  <g>
    <circle cx="500" cy="84" r="30" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <circle cx="330" cy="186" r="29" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="670" cy="186" r="29" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="230" cy="288" r="29" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <circle cx="430" cy="288" r="29" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="670" cy="288" r="29" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="230" cy="390" r="29" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="430" cy="390" r="29" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <circle cx="670" cy="390" r="29" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <circle cx="230" cy="492" r="29" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  </g>

  <g font-family="Consolas, Courier New, monospace" font-size="22" font-weight="bold" text-anchor="middle">
    <text x="500" y="92" fill="#334155">0</text>
    <text x="330" y="194" fill="#1e3a8a">h</text>
    <text x="670" y="194" fill="#1e3a8a">s</text>
    <text x="230" y="296" fill="#166534">e</text>
    <text x="430" y="296" fill="#1e3a8a">i</text>
    <text x="670" y="296" fill="#1e3a8a">h</text>
    <text x="230" y="398" fill="#1e3a8a">r</text>
    <text x="430" y="398" fill="#166534">s</text>
    <text x="670" y="398" fill="#166534">e</text>
    <text x="230" y="500" fill="#166534">s</text>
  </g>
  <g font-family="Consolas, Courier New, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">
    <text x="330" y="156">1</text>
    <text x="670" y="156">3</text>
    <text x="230" y="258">2</text>
    <text x="430" y="258">6</text>
    <text x="670" y="258">4</text>
    <text x="230" y="360">8</text>
    <text x="430" y="360">7</text>
    <text x="670" y="360">5</text>
    <text x="230" y="462">9</text>
  </g>
  <g font-family="Consolas, Courier New, monospace" font-size="12" fill="#166534" text-anchor="middle">
    <text x="230" y="332">he</text>
    <text x="430" y="434">his</text>
    <text x="670" y="434">she</text>
    <text x="230" y="536">hers</text>
  </g>

  <!-- 图例 -->
  <rect x="60" y="592" width="420" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="82" y1="622" x2="130" y2="622" stroke="#94a3b8" stroke-width="2"/>
  <text x="142" y="626" font-size="12.5" fill="#334155">Trie 边（父子字符）</text>
  <line x1="82" y1="652" x2="130" y2="652" stroke="#ea580c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="142" y="656" font-size="12.5" fill="#334155">fail 指针（失配后跳到的最长后缀节点）</text>

  <rect x="510" y="592" width="430" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="532" y="620" font-size="12.5" fill="#166534">绿圈 = 词尾节点（he / she / his / hers）</text>
  <text x="532" y="646" font-size="12.5" fill="#334155">fail[4]=1　fail[5]=2　fail[7]=3　fail[9]=3</text>
  <text x="532" y="668" font-size="12.5" fill="#64748b">其余节点 fail 均为 0（指向根）</text>
</svg>
