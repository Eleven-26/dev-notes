<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="bmB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">BM 实验二矩阵：三种输入 × 五种算法的比较次数（数越少越好）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">数字逐字取自正文 4.2 节实测表；绿底 = 该行最少，黄底 = 该行最多</text>

  <rect x="138" y="86" width="144" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="210" y="107" text-anchor="middle" font-size="12" fill="#0f172a">朴素</text>
  <rect x="294" y="86" width="144" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="366" y="107" text-anchor="middle" font-size="12" fill="#0f172a">KMP</text>
  <rect x="450" y="86" width="144" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="522" y="107" text-anchor="middle" font-size="12" fill="#0f172a">Horspool</text>
  <rect x="606" y="86" width="144" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="678" y="107" text-anchor="middle" font-size="12" fill="#0f172a">Sunday</text>
  <rect x="762" y="86" width="144" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="834" y="107" text-anchor="middle" font-size="12" fill="#0f172a">BM 完整版</text>

  <rect x="46" y="140" width="86" height="118" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="89" y="178" text-anchor="middle" font-size="20" fill="#1e3a8a">(a)</text>
  <text x="89" y="206" text-anchor="middle" font-size="12" fill="#1e40af">全 a 串</text>
  <text x="89" y="228" text-anchor="middle" font-size="12" fill="#1e40af">文本 8000</text>
  <text x="89" y="248" text-anchor="middle" font-size="12" fill="#1e40af">模式 80</text>
  <rect x="138" y="140" width="144" height="118" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="210" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#7f1d1d">633760</text>
  <text x="210" y="214" text-anchor="middle" font-size="11" fill="#991b1b">逐位比到末尾</text>
  <rect x="294" y="140" width="144" height="118" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="366" y="190" text-anchor="middle" font-size="18" fill="#0f172a">15922</text>
  <rect x="450" y="140" width="144" height="118" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="522" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532d">8001</text>
  <text x="522" y="214" text-anchor="middle" font-size="11" fill="#166534">该行最少</text>
  <rect x="606" y="140" width="144" height="118" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="678" y="190" text-anchor="middle" font-size="18" fill="#7f1d1d">316960</text>
  <text x="678" y="214" text-anchor="middle" font-size="11" fill="#991b1b">步长恒为 2</text>
  <rect x="762" y="140" width="144" height="118" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="834" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532d">8001</text>
  <text x="834" y="214" text-anchor="middle" font-size="11" fill="#166534">并列最少</text>

  <rect x="46" y="274" width="86" height="118" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="89" y="312" text-anchor="middle" font-size="20" fill="#1e3a8a">(b)</text>
  <text x="89" y="340" text-anchor="middle" font-size="12" fill="#1e40af">大字母表</text>
  <text x="89" y="362" text-anchor="middle" font-size="12" fill="#1e40af">文本 65536</text>
  <text x="89" y="382" text-anchor="middle" font-size="12" fill="#1e40af">模式 16</text>
  <rect x="138" y="274" width="144" height="118" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="210" y="324" text-anchor="middle" font-size="18" fill="#0f172a">68130</text>
  <rect x="294" y="274" width="144" height="118" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="366" y="324" text-anchor="middle" font-size="18" font-weight="bold" fill="#7f1d1d">68031</text>
  <text x="366" y="348" text-anchor="middle" font-size="11" fill="#991b1b">该行最多</text>
  <rect x="450" y="274" width="144" height="118" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="522" y="324" text-anchor="middle" font-size="18" fill="#0f172a">5740</text>
  <rect x="606" y="274" width="144" height="118" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="678" y="324" text-anchor="middle" font-size="18" fill="#0f172a">5748</text>
  <rect x="762" y="274" width="144" height="118" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="834" y="324" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532d">5740</text>
  <text x="834" y="348" text-anchor="middle" font-size="11" fill="#166534">该行最少</text>

  <rect x="46" y="408" width="86" height="118" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="89" y="446" text-anchor="middle" font-size="20" fill="#1e3a8a">(c)</text>
  <text x="89" y="474" text-anchor="middle" font-size="12" fill="#1e40af">小字母表</text>
  <text x="89" y="496" text-anchor="middle" font-size="12" fill="#1e40af">ab 两字符</text>
  <text x="89" y="516" text-anchor="middle" font-size="12" fill="#1e40af">模式 16</text>
  <rect x="138" y="408" width="144" height="118" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="210" y="458" text-anchor="middle" font-size="18" font-weight="bold" fill="#7f1d1d">130719</text>
  <text x="210" y="482" text-anchor="middle" font-size="11" fill="#991b1b">该行最多</text>
  <rect x="294" y="408" width="144" height="118" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="366" y="458" text-anchor="middle" font-size="18" fill="#0f172a">89965</text>
  <rect x="450" y="408" width="144" height="118" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="522" y="458" text-anchor="middle" font-size="18" fill="#7f1d1d">98285</text>
  <text x="522" y="482" text-anchor="middle" font-size="11" fill="#991b1b">比 KMP 差</text>
  <rect x="606" y="408" width="144" height="118" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="678" y="458" text-anchor="middle" font-size="18" fill="#0f172a">86904</text>
  <rect x="762" y="408" width="144" height="118" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="834" y="458" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532d">33087</text>
  <text x="834" y="482" text-anchor="middle" font-size="11" fill="#166534">靠好后缀撑住</text>

  <path d="M140,556 L140,566 L260,566 L260,556" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#bmB)"/>
  <text x="200" y="552" text-anchor="middle" font-size="11" fill="#1e40af">BM 系从右往左第一位就失配</text>
  <path d="M560,556 L560,566 L690,566 L690,556" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#bmB)"/>
  <text x="625" y="552" text-anchor="middle" font-size="11" fill="#1e40af">一次跳十几格（见 5.1）</text>
  <path d="M780,556 L780,566 L900,566 L900,556" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#bmB)"/>
  <text x="840" y="552" text-anchor="middle" font-size="11" fill="#1e40af">好后缀规则兜底</text>

  <text x="46" y="606" font-size="12.5" fill="#334155">每行的冠军都不同：(a) 是 BM 系（8001），(b) 是 BM 完整版（5740，约为 KMP 的 1/12），(c) 只剩 BM 完整版（33087）</text>
  <text x="46" y="632" font-size="12.5" font-weight="bold" fill="#0f172a">结论：没有一个版本在所有输入上都最优 —— 只靠坏字符的 Horspool 与 Sunday 在小字母表上反而不如 KMP</text>
</svg>
