<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">前缀哈希数组与 O(1) 取子串</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">样例 s = aba（下标 1..3），base = 3、字符值 a=1、b=2，暂不取模；数值抄自正文第一节的手推块</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="224" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 递推：h[i] = h[i−1] * base + s[i]</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">每走一步，把已有哈希整体左移一位（乘 base），再补上新字符</text>

    <rect x="40" y="60" width="180" height="56" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
    <text x="58" y="82" font-size="11.5" font-weight="bold" fill="#334155">h[0] = 0</text>
    <text x="58" y="102" font-size="10" fill="#64748b">空前缀，减法起点</text>

    <rect x="250" y="60" width="180" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="8"/>
    <text x="268" y="82" font-size="11.5" font-weight="bold" fill="#1e40af">h[1] = 1</text>
    <text x="268" y="102" font-size="10" fill="#1e40af">0·3 + 1（字符 a）</text>

    <rect x="460" y="60" width="180" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="8"/>
    <text x="478" y="82" font-size="11.5" font-weight="bold" fill="#1e40af">h[2] = 5</text>
    <text x="478" y="102" font-size="10" fill="#1e40af">1·3 + 2（前缀 ab）</text>

    <rect x="670" y="60" width="180" height="56" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/>
    <text x="688" y="82" font-size="11.5" font-weight="bold" fill="#14532d">h[3] = 16</text>
    <text x="688" y="102" font-size="10" fill="#14532d">5·3 + 1（前缀 aba）</text>

    <line x1="220" y1="88" x2="248" y2="88" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="430" y1="88" x2="458" y2="88" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="640" y1="88" x2="668" y2="88" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <text x="14" y="146" font-size="10" fill="#334155">⭐ 展开就是「把串看成一个 3 进制数」：1·3² + 2·3¹ + 1·3⁰ = 9 + 6 + 1 = 16 = h[3]</text>
    <text x="14" y="166" font-size="10" fill="#334155">⭐ 于是 h[2] = 5 正是 "ab" 的哈希（1·3 + 2），h[1] = 1 是 "a" 的哈希</text>
    <text x="14" y="186" font-size="10" fill="#92400e">⚠️ 实际写法每步都要取模：h[i] = (h[i−1] * base + s[i]) % mod</text>
    <text x="14" y="206" font-size="10" fill="#64748b">配套还要一张幂表 pow[i] = base^i % mod，取子串时要用它把 h[l−1] 对齐</text>
  </g>

  <g transform="translate(20,318)">
    <rect x="0" y="0" width="470" height="280" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 减法形状：多乘的那段</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">目标子串 s[2..3] = "ba"（l=2、r=3、len=2）</text>

    <rect x="30" y="58" width="202" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="131" y="80" text-anchor="middle" font-size="10.5" fill="#334155">h[1]·3² = 1·9 = 9</text>
    <rect x="232" y="58" width="158" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="311" y="80" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">子串 = 7</text>
    <line x1="30" y1="102" x2="390" y2="102" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="30" y1="96" x2="30" y2="108" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="390" y1="96" x2="390" y2="108" stroke="#2563eb" stroke-width="1.5"/>

    <text x="14" y="126" font-size="10" fill="#1e40af">整条合起来就是 h[3] = 16 = 9 + 7</text>
    <text x="14" y="150" font-size="10" fill="#14532d">⭐ hash("ba") = h[3] − h[1]·3² = 16 − 9 = 7</text>
    <text x="14" y="170" font-size="10" fill="#14532d">直接按定义算 "ba" = 2·3 + 1 = 7 → 同值 ✓</text>
    <text x="14" y="194" font-size="10" fill="#334155">通式：hash(s[l..r]) = h[r] − h[l−1]·base^(r−l+1)</text>
    <text x="14" y="214" font-size="10" fill="#334155">左边那段是「前 l−1 位被多乘了 len 个 base」</text>
    <text x="14" y="238" font-size="10" fill="#92400e">⚠️ l=1 时减的是 h[0]=0，公式不用另写分支</text>
    <text x="14" y="258" font-size="10" fill="#92400e">⚠️ 取模后先加 mod 再取模，减法才不为负</text>
  </g>

  <g transform="translate(510,318)">
    <rect x="0" y="0" width="470" height="280" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">C. 换来了什么、代价是什么</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">一次预处理，之后任意子串判等只看两个数</text>

    <rect x="14" y="58" width="432" height="66" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="80" font-size="11.5" font-weight="bold" fill="#14532d">得到</text>
    <text x="28" y="100" font-size="10" fill="#14532d">预处理 O(n)，单次取子串哈希 O(1)</text>
    <text x="28" y="118" font-size="10" fill="#14532d">判等 = 比两个数，与子串长度无关</text>

    <rect x="14" y="132" width="432" height="66" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="154" font-size="11.5" font-weight="bold" fill="#92400e">代价</text>
    <text x="28" y="174" font-size="10" fill="#92400e">空间两张表：h[] 与 pow[]</text>
    <text x="28" y="192" font-size="10" fill="#92400e">数相等只意味着「大概率同串」，会冲突</text>

    <text x="14" y="222" font-size="10" fill="#334155">⭐ 要判等/去重 → 哈希；要确定性匹配 → KMP</text>
    <text x="14" y="242" font-size="10" fill="#334155">⭐ 哈希 + 二分长度 = 最长公共子串，O(n log n)</text>
    <text x="14" y="262" font-size="10" fill="#64748b">Rabin-Karp 命中后必须逐字符复核，防假命中</text>
  </g>
</svg>
