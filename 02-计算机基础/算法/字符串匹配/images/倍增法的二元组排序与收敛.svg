<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwG" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
    <marker id="arwR" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">倍增法：每轮把后缀比较降成整数二元组排序</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">样例串 s = banana；rank 是「从该下标向后若干长」的排名，越界记 0</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="460" height="420" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 一轮里发生的四件事</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">已知长度 k 的排名，拼出长度 2k 的排名</text>

    <rect x="14" y="58" width="432" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="78" font-size="11.5" font-weight="bold" fill="#1e40af">① 造二元组 (rank[i], rank[i + k])</text>
    <text x="28" y="96" font-size="10" fill="#1e40af">第二关键字取「再往后 k 长」，越界记 0</text>

    <line x1="230" y1="106" x2="230" y2="118" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="14" y="118" width="432" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="138" font-size="11.5" font-weight="bold" fill="#1e40af">② 基数排序整数对</text>
    <text x="28" y="156" font-size="10" fill="#1e40af">两个关键字都是小整数 → 每轮能做到 O(n)</text>

    <line x1="230" y1="166" x2="230" y2="178" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="14" y="178" width="432" height="48" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="198" font-size="11.5" font-weight="bold" fill="#92400e">③ 写回新 rank</text>
    <text x="28" y="216" font-size="10" fill="#92400e">二元组完全相同 → 并列同名次，否则连续名次</text>

    <line x1="230" y1="226" x2="230" y2="238" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="14" y="238" width="432" height="66" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="258" font-size="11.5" font-weight="bold" fill="#92400e">④ 收敛判定</text>
    <text x="28" y="276" font-size="10" fill="#92400e">名次已全部不同，或与上一轮完全一致 → 停</text>
    <text x="28" y="294" font-size="10" fill="#92400e">否则长度翻倍回到 ①，k ≥ n 时必然已收敛</text>

    <line x1="230" y1="304" x2="230" y2="316" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>

    <rect x="14" y="316" width="432" height="48" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="336" font-size="11.5" font-weight="bold" fill="#14532d">收敛后按 rank 反排：SA[rank[i]] = i</text>
    <text x="28" y="354" font-size="10" fill="#14532d">排名已是 0..n−1 的排列，一趟即可填出 SA</text>

    <text x="14" y="386" font-size="10.5" fill="#334155">比较两个后缀只需比两个整数，这就是倍增的全部诀窍</text>
    <text x="14" y="406" font-size="10.5" fill="#64748b">轮数 O(log n) × 每轮 O(n) → 总 O(n log n)</text>
  </g>

  <g transform="translate(520,74)">
    <rect x="0" y="0" width="460" height="420" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. banana 的逐轮推演</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">数值全部抄自正文第二节的推演块</text>

    <rect x="14" y="58" width="432" height="46" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="76" font-size="11" font-weight="bold" fill="#1e40af">起点 k = 1：单字符 a=1 b=2 n=3</text>
    <text x="28" y="94" font-size="10" fill="#1e40af">rank = [2 1 3 1 3 1]</text>

    <rect x="14" y="112" width="432" height="64" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="8"/>
    <text x="28" y="130" font-size="11" font-weight="bold" fill="#334155">长度 1 → 2：二元组 (rank[i], rank[i + 1])</text>
    <text x="28" y="148" font-size="10" fill="#334155">排序 → i5 &lt; {i1,i3} &lt; i0 &lt; {i2,i4}</text>
    <text x="28" y="166" font-size="10" fill="#334155">新 rank = [3 2 4 2 4 1]（同二元组并列）</text>

    <rect x="14" y="184" width="432" height="64" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="8"/>
    <text x="28" y="202" font-size="11" font-weight="bold" fill="#334155">长度 2 → 4：二元组 (rank[i], rank[i + 2])</text>
    <text x="28" y="220" font-size="10" fill="#334155">排序 → i5 &lt; i3 &lt; i1 &lt; i0 &lt; i4 &lt; i2</text>
    <text x="28" y="238" font-size="10" fill="#334155">新 rank = [4 3 6 2 5 1]（全部不同）</text>

    <rect x="14" y="256" width="432" height="64" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="274" font-size="11" font-weight="bold" fill="#92400e">长度 4 → 8：二元组 (rank[i], rank[i + 4])</text>
    <text x="28" y="292" font-size="10" fill="#92400e">名次与上一轮完全一致 → 已收敛</text>
    <text x="28" y="310" font-size="10" fill="#92400e">正文把这一行标成 k=8，即本轮要排的长度</text>

    <rect x="14" y="328" width="432" height="46" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="28" y="346" font-size="11" font-weight="bold" fill="#14532d">按 rank 反排 → SA = [5, 3, 1, 0, 4, 2]</text>
    <text x="28" y="364" font-size="10" fill="#14532d">与第一节的排序表一致 ✓</text>

    <text x="14" y="392" font-size="10" fill="#64748b">并列只允许出现在二元组相同的时候：长度 1→2 那轮</text>
    <text x="14" y="410" font-size="10" fill="#64748b">有两簇并列（i1/i3 与 i2/i4），到 2→4 才全部拉开</text>
  </g>
</svg>
