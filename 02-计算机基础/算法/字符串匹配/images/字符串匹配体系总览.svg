<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">字符串匹配体系总览：失配之后，能不能少比较一些字符</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">九篇都在回答同一个问题：「已经比对过的那些字符，就没用了吗？」· 选型先看几个模式，再看文本能不能预处理</text>

  <text x="20" y="90" font-size="13" font-weight="bold" fill="#2563eb">一、朴素匹配为什么慢，改进的功夫花在哪</text>

  <rect x="20" y="100" width="310" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="34" y="126" font-size="13.5" font-weight="bold" fill="#334155">朴素匹配：最坏 O(n × m)</text>
  <text x="34" y="150" font-size="11.5" fill="#334155">失配后 P 整体右移一格</text>
  <text x="34" y="170" font-size="11.5" fill="#334155">主串指针还要回退重比</text>

  <rect x="345" y="100" width="310" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="359" y="126" font-size="13.5" font-weight="bold" fill="#1e3a8a">改进的功夫只有一个方向</text>
  <text x="359" y="150" font-size="11.5" fill="#1e3a8a">利用「已比对成功」的信息</text>
  <text x="359" y="170" font-size="11.5" fill="#1e3a8a">滑得更远，或一次匹配更多</text>

  <rect x="670" y="100" width="310" height="80" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="684" y="126" font-size="13.5" font-weight="bold" fill="#78350f">两条选型轴</text>
  <text x="684" y="150" font-size="11.5" fill="#78350f">① 单模式还是多模式</text>
  <text x="684" y="170" font-size="11.5" fill="#78350f">② 文本可不可以预处理</text>

  <text x="20" y="206" font-size="13" font-weight="bold" fill="#2563eb">二、本目录九篇按「要什么」归族</text>

  <rect x="20" y="216" width="232" height="150" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="34" y="242" font-size="13" font-weight="bold" fill="#14532d">① 单模式（3 篇）</text>
  <text x="34" y="266" font-size="11.5" fill="#14532d">KMP（失配函数，线性保证）</text>
  <text x="34" y="286" font-size="11.5" fill="#14532d">BM（从右往左 + 好后缀）</text>
  <text x="34" y="306" font-size="11.5" fill="#14532d">Z算法（后缀与原串的 LCP）</text>
  <text x="34" y="328" font-size="11" fill="#475569">⭐ 文本长、字母表小用 KMP</text>

  <rect x="260" y="216" width="232" height="150" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="274" y="242" font-size="13" font-weight="bold" fill="#1e3a8a">② 字符串结构（3 篇）</text>
  <text x="274" y="266" font-size="11.5" fill="#1e3a8a">字符串哈希（判等 O(1)）</text>
  <text x="274" y="286" font-size="11.5" fill="#1e3a8a">后缀数组（排序版）</text>
  <text x="274" y="306" font-size="11.5" fill="#1e3a8a">后缀自动机（自动机版）</text>
  <text x="274" y="328" font-size="11" fill="#475569">⭐ 判等 / 去重先用哈希</text>

  <rect x="500" y="216" width="232" height="150" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text x="514" y="242" font-size="13" font-weight="bold" fill="#7c2d12">③ 多模式（1 篇）</text>
  <text x="514" y="266" font-size="11.5" fill="#7c2d12">AC 自动机：Trie + fail 指针</text>
  <text x="514" y="286" font-size="11.5" fill="#7c2d12">一趟扫完所有模式</text>
  <text x="514" y="306" font-size="11.5" fill="#7c2d12">敏感词 / 词典过滤</text>
  <text x="514" y="328" font-size="11" fill="#b91c1c">⚠️ 别跑 k 次单模式算法</text>

  <rect x="740" y="216" width="232" height="150" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="754" y="242" font-size="13" font-weight="bold" fill="#3730a3">④ 回文（2 篇）</text>
  <text x="754" y="266" font-size="11.5" fill="#3730a3">Manacher（只求最长）</text>
  <text x="754" y="286" font-size="11.5" fill="#3730a3">回文自动机（统计所有回文）</text>
  <text x="754" y="310" font-size="11" fill="#475569">⭐ 回文族靠「对称性」</text>
  <text x="754" y="328" font-size="11" fill="#475569">把 n 个中心的扩展压成线性</text>

  <text x="20" y="384" font-size="13" font-weight="bold" fill="#2563eb">三、选型决策、典型场景与两条判据</text>

  <rect x="20" y="394" width="960" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="420" font-size="13.5" font-weight="bold" fill="#0f172a">先问「要的是什么」，再问「几个模式」</text>
  <text x="34" y="444" font-size="12.5" fill="#334155">· 要位置：1 个模式 → KMP（线性不退化）/ BM（平均最快）；多个模式 → AC 自动机（一趟扫完）</text>
  <text x="34" y="466" font-size="12.5" fill="#334155">· 要判等 / 子串去重 → 字符串哈希；要后缀之间的关系、重复子串、最长公共子串 → 后缀数组或后缀自动机</text>
  <text x="34" y="488" font-size="12.5" fill="#334155">· 要每个后缀与原串的最长公共前缀 → Z 算法；要回文 → 只求最长用 Manacher，统计所有回文子串用回文自动机</text>
  <text x="34" y="510" font-size="12.5" fill="#334155">· ⭐ 最重要判据：多模式别跑 k 次单模式 —— k 次 KMP 是 O(k(n+m))，AC 自动机是 O(n + 全部模式长度和 + 命中数)</text>
  <text x="34" y="532" font-size="12" fill="#64748b">⭐ 三族的骨架同构：先预处理模式串（或结构），再一趟扫描主串 —— 差的只是「预处理出什么信息」</text>
</svg>
