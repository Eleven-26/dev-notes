<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Z 算法：窗口 [l, r] 与 z[i] 区间的三种位置</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">样例 s = aabcaabxaaaz（n = 12）；逐位取值抄自正文 2.1 的手推表</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="192" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 窗口 = 前缀的一段「已匹配」副本</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">此刻 [l, r] = [4, 6]，它来自 z[4] = 3；蓝段是前缀，绿段是窗口</text>

    <text x="140" y="66" text-anchor="middle" font-size="9.5" fill="#94a3b8">0</text>
    <text x="208" y="66" text-anchor="middle" font-size="9.5" fill="#94a3b8">1</text>
    <text x="276" y="66" text-anchor="middle" font-size="9.5" fill="#94a3b8">2</text>
    <text x="344" y="66" text-anchor="middle" font-size="9.5" fill="#94a3b8">3</text>
    <text x="412" y="66" text-anchor="middle" font-size="9.5" fill="#94a3b8">4</text>
    <text x="480" y="66" text-anchor="middle" font-size="9.5" fill="#94a3b8">5</text>
    <text x="548" y="66" text-anchor="middle" font-size="9.5" fill="#94a3b8">6</text>
    <text x="616" y="66" text-anchor="middle" font-size="9.5" fill="#94a3b8">7</text>
    <text x="684" y="66" text-anchor="middle" font-size="9.5" fill="#94a3b8">8</text>
    <text x="752" y="66" text-anchor="middle" font-size="9.5" fill="#94a3b8">9</text>
    <text x="820" y="66" text-anchor="middle" font-size="9.5" fill="#94a3b8">10</text>
    <text x="888" y="66" text-anchor="middle" font-size="9.5" fill="#94a3b8">11</text>

    <rect x="110" y="72" width="60" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="178" y="72" width="60" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="246" y="72" width="60" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="314" y="72" width="60" height="34" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="382" y="72" width="60" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="450" y="72" width="60" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="518" y="72" width="60" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="586" y="72" width="60" height="34" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="654" y="72" width="60" height="34" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="722" y="72" width="60" height="34" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="790" y="72" width="60" height="34" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="858" y="72" width="60" height="34" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <text x="140" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">a</text>
    <text x="208" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">a</text>
    <text x="276" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">b</text>
    <text x="344" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">c</text>
    <text x="412" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">a</text>
    <text x="480" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">a</text>
    <text x="548" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">b</text>
    <text x="616" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">x</text>
    <text x="684" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">a</text>
    <text x="752" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">a</text>
    <text x="820" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">a</text>
    <text x="888" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">z</text>

    <line x1="110" y1="114" x2="306" y2="114" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="110" y1="108" x2="110" y2="120" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="306" y1="108" x2="306" y2="120" stroke="#2563eb" stroke-width="1.5"/>
    <text x="120" y="134" font-size="10" fill="#1e40af">前缀段 s[0..2] = "aab"</text>
    <line x1="382" y1="114" x2="578" y2="114" stroke="#16a34a" stroke-width="1.5"/>
    <line x1="382" y1="108" x2="382" y2="120" stroke="#16a34a" stroke-width="1.5"/>
    <line x1="578" y1="108" x2="578" y2="120" stroke="#16a34a" stroke-width="1.5"/>
    <text x="392" y="134" font-size="10" fill="#14532d">窗口段 s[4..6] = "aab"</text>
    <text x="640" y="134" font-size="10" fill="#64748b">两段逐位相同，长度都是 r − l + 1 = 3</text>

    <text x="14" y="158" font-size="10" fill="#334155">⭐ 窗口是一次匹配的存档：s[l..r] 与 s[0..r−l] 对齐，i 落在窗口内时它的偏移就是 i − l</text>
    <text x="14" y="178" font-size="10" fill="#334155">⭐ 于是可以抄 z[i − l]，但最多只能抄到 r − i + 1（窗口还剩多长），即 min(z[i−l], r−i+1)</text>
  </g>

  <g transform="translate(20,286)">
    <rect x="0" y="0" width="300" height="340" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="22" font-size="13" font-weight="bold" fill="#1e40af">① i &gt; r：完全在窗口外</text>
    <text x="14" y="42" font-size="10" fill="#64748b">无信息可借，从 0 暴力扩</text>

    <rect x="20" y="78" width="260" height="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="30" y="64" width="90" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="75" y="83" text-anchor="middle" font-size="10" fill="#14532d">[l, r]</text>
    <line x1="200" y1="58" x2="200" y2="104" stroke="#dc2626" stroke-width="2"/>
    <text x="200" y="54" text-anchor="middle" font-size="10" fill="#dc2626">i</text>
    <rect x="200" y="64" width="60" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="230" y="83" text-anchor="middle" font-size="10" fill="#1e40af">z[i]</text>

    <text x="14" y="124" font-size="9.5" fill="#334155">窗口整个在 i 的左边，对齐信息用不上</text>
    <text x="14" y="150" font-size="11" font-weight="bold" fill="#0f172a">正文 2.1 的实例</text>
    <text x="14" y="172" font-size="10" fill="#1e40af">i=4：连中 3 位，x≠c 停</text>
    <text x="28" y="188" font-size="10" fill="#64748b">z[4]=3 → 新窗口 [4, 6]</text>
    <text x="14" y="208" font-size="10" fill="#1e40af">i=7：x≠a → z[7]=0</text>
    <text x="28" y="224" font-size="10" fill="#64748b">窗口 [4, 6] 保持不变</text>
    <text x="14" y="244" font-size="10" fill="#1e40af">i=8：a,a 中 2 位，a≠b 停</text>
    <text x="28" y="260" font-size="10" fill="#64748b">z[8]=2 → 新窗口 [8, 9]</text>
    <text x="14" y="280" font-size="10" fill="#1e40af">i=11：z≠a → z[11]=0</text>
    <text x="14" y="310" font-size="10" fill="#92400e">⚠️ 这一档才是「暴力」，</text>
    <text x="14" y="326" font-size="10" fill="#92400e">但每步都推动 r，总量摊到 O(n)</text>
  </g>

  <g transform="translate(350,286)">
    <rect x="0" y="0" width="300" height="340" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="22" font-size="13" font-weight="bold" fill="#14532d">② z[i−l] 整段在窗口内</text>
    <text x="14" y="42" font-size="10" fill="#64748b">抄完就是答案，直接定案</text>

    <rect x="20" y="78" width="260" height="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="30" y="64" width="180" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="55" y="83" text-anchor="middle" font-size="10" fill="#14532d">[l, r]</text>
    <line x1="120" y1="58" x2="120" y2="104" stroke="#dc2626" stroke-width="2"/>
    <text x="120" y="54" text-anchor="middle" font-size="10" fill="#dc2626">i</text>
    <rect x="120" y="70" width="60" height="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="150" y="83" text-anchor="middle" font-size="9.5" fill="#1e40af">z[i−l]</text>
    <line x1="180" y1="70" x2="210" y2="70" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

    <text x="14" y="124" font-size="9.5" fill="#334155">z[i−l] &lt; r − i + 1 → min 取到 z[i−l]</text>
    <text x="14" y="150" font-size="11" font-weight="bold" fill="#0f172a">正文 2.1 的实例</text>
    <text x="14" y="172" font-size="10" fill="#14532d">当时窗口 [l, r] = [4, 6]</text>
    <text x="14" y="192" font-size="10" fill="#14532d">i=5：min(z[1]=1, 2)=1 → z[5]=1</text>
    <text x="28" y="208" font-size="10" fill="#64748b">抄到 1，b≠a 扩不出去</text>
    <text x="14" y="228" font-size="10" fill="#14532d">i=6：min(z[2]=0, 1)=0 → z[6]=0</text>
    <text x="28" y="244" font-size="10" fill="#64748b">前缀自己在偏移 2 就没匹配</text>
    <text x="14" y="268" font-size="10" fill="#334155">⭐ 两位抄完 r 都不动，窗口仍是 [4, 6]</text>
    <text x="14" y="298" font-size="10" fill="#92400e">⚠️ 「定案」不等于「不做比较」：</text>
    <text x="14" y="314" font-size="10" fill="#92400e">仍要比一次确认扩不出去，</text>
    <text x="14" y="330" font-size="10" fill="#92400e">但那一步失败不消耗 r</text>
  </g>

  <g transform="translate(680,286)">
    <rect x="0" y="0" width="300" height="340" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="22" font-size="13" font-weight="bold" fill="#92400e">③ z[i−l] 顶到或超出 r</text>
    <text x="14" y="42" font-size="10" fill="#64748b">只抄到窗口右端，剩余自扩</text>

    <rect x="20" y="78" width="260" height="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="30" y="64" width="130" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="55" y="83" text-anchor="middle" font-size="10" fill="#14532d">[l, r]</text>
    <line x1="100" y1="58" x2="100" y2="104" stroke="#dc2626" stroke-width="2"/>
    <text x="100" y="54" text-anchor="middle" font-size="10" fill="#dc2626">i</text>
    <rect x="100" y="70" width="60" height="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="160" y="70" width="50" height="18" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="185" y="83" text-anchor="middle" font-size="9.5" fill="#92400e">要自扩</text>

    <text x="14" y="124" font-size="9.5" fill="#334155">z[i−l] ≥ r − i + 1 → min 取到 r − i + 1</text>
    <text x="14" y="150" font-size="11" font-weight="bold" fill="#0f172a">正文 2.1 的实例</text>
    <text x="14" y="172" font-size="10" fill="#92400e">当时窗口 [l, r] = [8, 9]（z[8]=2）</text>
    <text x="14" y="192" font-size="10" fill="#92400e">i=9：min(z[1]=1, 1)=1，</text>
    <text x="28" y="208" font-size="10" fill="#64748b">再扩 a==a 命中到 2，a≠z 停</text>
    <text x="28" y="224" font-size="10" fill="#64748b">z[9]=2 → 窗口右移成 [9, 10]</text>
    <text x="14" y="244" font-size="10" fill="#92400e">i=10：min(z[1]=1, 1)=1，</text>
    <text x="28" y="260" font-size="10" fill="#64748b">a≠z 扩不出去 → z[10]=1</text>
    <text x="14" y="284" font-size="10" fill="#334155">⭐ 抄到的这段一定对（窗口内的对齐）：</text>
    <text x="14" y="300" font-size="10" fill="#334155">i ≤ r 时 min 是下界，即 z[i] ≥ min(...)</text>
    <text x="14" y="324" font-size="10" fill="#991b1b">⚠️ 越过 r 的那段无保证，只能自己扩</text>
  </g>
</svg>
