<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="kmB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="kmR" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#dc2626"/></marker>
    <marker id="kmG" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">KMP 匹配过程的状态图：模式指针 j 的两条出边（模式串 ababaca）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">next = [0 0 1 2 3 0 1]（2.2 实测）；j = 已匹配的前缀长度，状态共 m + 1 = 8 个</text>

  <path d="M340,174 L340,154 L130,154 L130,174" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#kmR)"/>
  <path d="M550,174 L550,138 L346,138 L346,174" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#kmR)"/>
  <path d="M760,174 L760,122 L118,122 L118,177" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#kmR)"/>
  <text x="235" y="148" text-anchor="middle" font-size="11.5" fill="#dc2626">next[1] = 0</text>
  <text x="448" y="132" text-anchor="middle" font-size="11.5" fill="#dc2626">next[3] = 2</text>
  <text x="439" y="116" text-anchor="middle" font-size="11.5" fill="#dc2626">next[5] = 0</text>

  <circle cx="130" cy="200" r="26" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <circle cx="235" cy="200" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="340" cy="200" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="445" cy="200" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="550" cy="200" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="655" cy="200" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="760" cy="200" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="865" cy="200" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>

  <line x1="158" y1="200" x2="205" y2="200" stroke="#2563eb" stroke-width="1.8" marker-end="url(#kmB)"/>
  <line x1="263" y1="200" x2="310" y2="200" stroke="#2563eb" stroke-width="1.8" marker-end="url(#kmB)"/>
  <line x1="368" y1="200" x2="415" y2="200" stroke="#2563eb" stroke-width="1.8" marker-end="url(#kmB)"/>
  <line x1="473" y1="200" x2="520" y2="200" stroke="#2563eb" stroke-width="1.8" marker-end="url(#kmB)"/>
  <line x1="578" y1="200" x2="625" y2="200" stroke="#2563eb" stroke-width="1.8" marker-end="url(#kmB)"/>
  <line x1="683" y1="200" x2="730" y2="200" stroke="#2563eb" stroke-width="1.8" marker-end="url(#kmB)"/>
  <line x1="788" y1="200" x2="835" y2="200" stroke="#2563eb" stroke-width="1.8" marker-end="url(#kmB)"/>

  <g font-size="12" fill="#1e40af" text-anchor="middle" font-weight="bold">
    <text x="182" y="193">a</text>
    <text x="287" y="193">b</text>
    <text x="392" y="193">a</text>
    <text x="497" y="193">b</text>
    <text x="602" y="193">a</text>
    <text x="707" y="193">c</text>
    <text x="812" y="193">a</text>
  </g>
  <g font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">
    <text x="130" y="205">0</text>
    <text x="235" y="205">1</text>
    <text x="340" y="205">2</text>
    <text x="445" y="205">3</text>
    <text x="550" y="205">4</text>
    <text x="655" y="205">5</text>
    <text x="760" y="205">6</text>
    <text x="865" y="205">7</text>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="130" y="244">空</text>
    <text x="235" y="244">a</text>
    <text x="340" y="244">ab</text>
    <text x="445" y="244">aba</text>
    <text x="550" y="244">abab</text>
    <text x="655" y="244">ababa</text>
    <text x="760" y="244">ababac</text>
    <text x="865" y="244">ababaca</text>
  </g>

  <path d="M235,226 L235,256 L130,256 L130,226" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#kmR)"/>
  <path d="M440,226 L440,282 L245,282 L245,222" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#kmR)"/>
  <path d="M655,226 L655,308 L447,308 L447,222" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#kmR)"/>
  <path d="M865,226 L865,334 L240,334 L240,222" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#kmG)"/>
  <text x="182" y="272" text-anchor="middle" font-size="11.5" fill="#dc2626">next[0] = 0</text>
  <text x="342" y="298" text-anchor="middle" font-size="11.5" fill="#dc2626">next[2] = 1</text>
  <text x="551" y="324" text-anchor="middle" font-size="11.5" fill="#dc2626">next[4] = 3</text>
  <text x="600" y="352" text-anchor="middle" font-size="11.5" fill="#16a34a">报出命中后 j = next[6] = 1</text>

  <text x="60" y="392" font-size="12.5" fill="#334155">图例：蓝色实线 = 匹配边（t[i] == p[j]，j 加 1 且 i 也前进一步）；红色虚线 = 失配边（j 退回 next[j-1]，i 原地不动）</text>
  <text x="60" y="416" font-size="12.5" fill="#334155">绿色虚线 = 命中后回到 next[6] = 1，所以下一个重叠命中不用重新扫描；每个状态的两条出边都由 2.2 实测的 next 数组给出</text>
  <text x="60" y="450" font-size="12.5" font-weight="bold" fill="#0f172a">摊还账在图上就是一眼可见的事：回退边只会把状态号变小，而状态号每轮最多加 1</text>
  <text x="60" y="474" font-size="12.5" fill="#334155">所以「回退总次数 ≤ 增加总次数 ≤ n」（4.2 节）；j == 0 时仍失配则只让 i 前进一步，状态停在 0</text>
  <text x="60" y="498" font-size="11.5" fill="#64748b">注意：本图只画由 next 直接决定的两条边，完整转移函数还要为每个状态补一张 O(m × 字符集) 的表</text>
</svg>
