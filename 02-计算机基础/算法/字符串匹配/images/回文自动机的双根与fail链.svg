<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 7,3 0,6 Z" fill="#2563eb"/></marker>
    <marker id="arwO" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 8,3.5 0,7 Z" fill="#ea580c"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">回文自动机：同一棵树的两套边（next 与 fail）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">样例串 s = abba；节点编号、串、len、fail 全部抄自 2.1 的手推</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="460" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. next 转移：谁包一层字符得到谁</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">蓝实线 = 在回文串两边同加一个字符</text>

    <g stroke="#93c5fd" stroke-width="2.5" fill="none">
      <line x1="80" y1="157" x2="80" y2="216" marker-end="url(#arwB)"/>
      <line x1="102" y1="145" x2="191" y2="228" marker-end="url(#arwB)"/>
      <line x1="317" y1="149" x2="371" y2="224" marker-end="url(#arwB)"/>
      <line x1="390" y1="282" x2="390" y2="317" marker-end="url(#arwB)"/>
    </g>
    <g font-family="Consolas, Courier New, monospace" font-size="11" font-weight="bold" fill="#1e40af">
      <text x="90" y="190">a</text>
      <text x="140" y="180">b</text>
      <text x="352" y="184">b</text>
      <text x="400" y="304">a</text>
    </g>

    <g>
      <circle cx="80" cy="125" r="30" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
      <circle cx="300" cy="125" r="30" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
      <circle cx="80" cy="250" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <circle cx="215" cy="250" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <circle cx="390" cy="250" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <circle cx="390" cy="350" r="30" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    </g>
    <g font-size="8.5" fill="#94a3b8" text-anchor="middle">
      <text x="80" y="112">节点 0</text>
      <text x="300" y="112">节点 1</text>
      <text x="80" y="237">节点 2</text>
      <text x="215" y="237">节点 3</text>
      <text x="390" y="237">节点 4</text>
      <text x="390" y="337">节点 5</text>
    </g>
    <g font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">
      <text x="80" y="130">奇根</text>
      <text x="300" y="130">偶根</text>
      <text x="80" y="255">a</text>
      <text x="215" y="255">b</text>
      <text x="390" y="255">bb</text>
      <text x="390" y="355">abba</text>
    </g>
    <g font-size="8" fill="#475569" text-anchor="middle">
      <text x="80" y="145">len −1</text>
      <text x="300" y="145">len 0</text>
      <text x="80" y="270">len 1</text>
      <text x="215" y="270">len 1</text>
      <text x="390" y="270">len 2</text>
      <text x="390" y="370">len 4</text>
    </g>

    <text x="14" y="392" font-size="10" fill="#64748b">四条转移建完全部节点：0 → 2、0 → 3、1 → 4、4 → 5</text>
  </g>

  <g transform="translate(520,74)">
    <rect x="0" y="0" width="460" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. fail 链：沿最长回文后缀变短</text>
    <text x="14" y="46" font-size="10.5" fill="#64748b">橙虚线 = fail，箭头指向更短的那个回文后缀</text>

    <g stroke="#ea580c" stroke-width="2" fill="none" stroke-dasharray="7 5">
      <line x1="370" y1="125" x2="333" y2="125" marker-end="url(#arwO)"/>
      <line x1="270" y1="125" x2="223" y2="125" marker-end="url(#arwO)"/>
      <line x1="160" y1="125" x2="103" y2="125" marker-end="url(#arwO)"/>
      <line x1="370" y1="250" x2="333" y2="250" marker-end="url(#arwO)"/>
      <line x1="280" y1="228" x2="211" y2="148" marker-end="url(#arwO)"/>
      <path d="M 56 98 Q 20 74 46 102" marker-end="url(#arwO)"/>
    </g>

    <g>
      <circle cx="70" cy="125" r="30" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
      <circle cx="190" cy="125" r="30" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
      <circle cx="300" cy="125" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <circle cx="400" cy="125" r="30" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
      <circle cx="300" cy="250" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <circle cx="400" cy="250" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    </g>
    <g font-size="8.5" fill="#94a3b8" text-anchor="middle">
      <text x="70" y="112">节点 0</text>
      <text x="190" y="112">节点 1</text>
      <text x="300" y="112">节点 2</text>
      <text x="400" y="112">节点 5</text>
      <text x="300" y="237">节点 3</text>
      <text x="400" y="237">节点 4</text>
    </g>
    <g font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">
      <text x="70" y="130">奇根</text>
      <text x="190" y="130">偶根</text>
      <text x="300" y="130">a</text>
      <text x="400" y="130">abba</text>
      <text x="300" y="255">b</text>
      <text x="400" y="255">bb</text>
    </g>
    <g font-size="8" fill="#475569" text-anchor="middle">
      <text x="70" y="145">len −1</text>
      <text x="190" y="145">len 0</text>
      <text x="300" y="145">len 1</text>
      <text x="400" y="145">len 4</text>
      <text x="300" y="270">len 1</text>
      <text x="400" y="270">len 2</text>
    </g>

    <text x="136" y="82" font-size="9" fill="#ea580c">fail[1] = 0</text>
    <text x="248" y="82" font-size="9" fill="#ea580c">fail[2] = 1</text>
    <text x="350" y="82" font-size="9" fill="#ea580c">fail[5] = 2</text>
    <text x="14" y="82" font-size="9" fill="#ea580c">fail[0] = 0（自指）</text>
    <text x="332" y="207" font-size="9" fill="#ea580c">fail[4] = 3</text>
    <text x="168" y="215" font-size="9" fill="#ea580c">fail[3] = 1</text>

    <text x="14" y="322" font-size="10" fill="#64748b">链上一路都是回文后缀：abba → a → 空</text>
    <text x="14" y="344" font-size="10" fill="#64748b">bb → b → 空，所以出现次数沿这条链累加</text>
    <text x="14" y="374" font-size="10" fill="#94a3b8">⚠️ 两个根互为兜底：偶根退不动了就交给奇根</text>
  </g>

  <g transform="translate(20,494)">
    <rect x="0" y="0" width="960" height="76" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="20" y="24" font-size="11" fill="#334155">奇根 len −1 让查找必然终止：pos − 1 − (−1) = pos，比的就是刚插入的那个字符</text>
    <text x="20" y="46" font-size="11" fill="#334155">偶根 len 0 负责扩出偶回文；单字符回文一律由奇根建出（next[0]['a'] = 2、next[0]['b'] = 3）</text>
    <text x="20" y="66" font-size="11" fill="#64748b">abba 建完共 6 个节点 = n + 2 → 本质不同回文 6 − 2 = 4 种：a / b / bb / abba（与 2.1 手推一致）</text>
  </g>
</svg>
