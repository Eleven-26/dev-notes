<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwG" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
    <marker id="arwR" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">一次 DFS 的做选择 → 递归 → 撤销：调用栈推进时序</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">沿正文第一节决策树最左分支走一遍（[1 2 3] 全排列，示意，非实测）</text>

  <g transform="translate(30,80)">
    <rect x="0" y="0" width="940" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>

    <line x1="110" y1="76" x2="110" y2="336" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="340" y1="76" x2="340" y2="336" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="570" y1="76" x2="570" y2="336" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="800" y1="76" x2="800" y2="336" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

    <rect x="44" y="42" width="132" height="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="110" y="61" text-anchor="middle" font-size="11" fill="#334155">第0层 path=[]</text>
    <rect x="274" y="42" width="132" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="340" y="61" text-anchor="middle" font-size="11" fill="#1e40af">第1层 path=[1]</text>
    <rect x="504" y="42" width="132" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="570" y="61" text-anchor="middle" font-size="11" fill="#1e40af">第2层 path=[1 2]</text>
    <rect x="734" y="42" width="132" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="800" y="61" text-anchor="middle" font-size="11" fill="#1e40af">第3层 path=[1 2 3]</text>

    <line x1="110" y1="104" x2="340" y2="104" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <text x="225" y="98" text-anchor="middle" font-size="10" fill="#2563eb">① 做出选择 1，递归进入第1层</text>

    <line x1="340" y1="136" x2="570" y2="136" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <text x="455" y="130" text-anchor="middle" font-size="10" fill="#2563eb">② 做出选择 2，递归进入第2层</text>

    <line x1="570" y1="168" x2="800" y2="168" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <text x="685" y="162" text-anchor="middle" font-size="10" fill="#2563eb">③ 做出选择 3，进入第3层</text>

    <rect x="668" y="180" width="264" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="800" y="200" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">④ 结束条件满足，记录 [1 2 3]</text>

    <line x1="800" y1="236" x2="570" y2="236" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arwR)"/>
    <text x="685" y="230" text-anchor="middle" font-size="10" fill="#dc2626">⑤ return 回第2层的 for 循环</text>

    <rect x="440" y="252" width="260" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="570" y="272" text-anchor="middle" font-size="10.5" fill="#92400e">⑥ 撤销选择：弹出 3，path 回到 [1 2]</text>

    <line x1="570" y1="308" x2="340" y2="308" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arwR)"/>
    <text x="455" y="302" text-anchor="middle" font-size="10" fill="#dc2626">⑦ 第2层候选耗尽，return 回第1层</text>

    <text x="255" y="332" font-size="10" fill="#334155">⑧ 撤销 2，改选 3 → [1 3] 再往下递归</text>

    <text x="20" y="360" font-size="11.5" font-weight="bold" fill="#0f172a">⭐ 做选择与撤销严格配对：进一层 push 一次，退一层 pop 一次 —— 第五节排查清单的第一条</text>
    <text x="20" y="382" font-size="10.5" fill="#64748b">实线 = 递归进入下一层；红色虚线 = return 退回上一层；同层换分支前必须先完成撤销</text>
  </g>
</svg>
