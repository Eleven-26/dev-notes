<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="nqP" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">八皇后的三种写错方式：解数与「响度」对照（n = 8）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">解数一列逐字取自正文 2.3 的实测表；越往下越安静，也越危险</text>

  <rect x="40" y="88" width="290" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="185" y="107" text-anchor="middle" font-size="12" fill="#0f172a">写法</text>
  <rect x="336" y="88" width="250" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="461" y="107" text-anchor="middle" font-size="12" fill="#0f172a">三个集合怎么用</text>
  <rect x="592" y="88" width="100" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="642" y="107" text-anchor="middle" font-size="12" fill="#0f172a">n=8 解数</text>
  <rect x="698" y="88" width="262" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="829" y="107" text-anchor="middle" font-size="12" fill="#0f172a">表现（正文 2.3）</text>

  <rect x="40" y="124" width="290" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="185" y="158" text-anchor="middle" font-size="13" fill="#14532d">正确写法（5.2 的实现）</text>
  <text x="185" y="180" text-anchor="middle" font-size="13" fill="#14532d">列、主对角、副对角各自一个数组</text>
  <rect x="336" y="124" width="250" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="461" y="150" text-anchor="middle" font-size="12.5" fill="#334155">col[c]</text>
  <text x="461" y="172" text-anchor="middle" font-size="12.5" fill="#334155">d1[row-c+n-1]</text>
  <text x="461" y="194" text-anchor="middle" font-size="12.5" fill="#334155">d2[row+c]</text>
  <rect x="592" y="124" width="100" height="84" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="642" y="176" text-anchor="middle" font-size="24" font-weight="bold" fill="#166534">92</text>
  <rect x="698" y="124" width="262" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="829" y="158" text-anchor="middle" font-size="12.5" fill="#334155">基准：92 是公认答案</text>
  <text x="829" y="180" text-anchor="middle" font-size="12.5" fill="#334155">边放边剪只走 2057 个节点</text>

  <rect x="40" y="214" width="290" height="84" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="185" y="248" text-anchor="middle" font-size="13" fill="#7f1d1d">完全不偏移</text>
  <text x="185" y="270" text-anchor="middle" font-size="13" fill="#7f1d1d">row 减 col 直接当下标</text>
  <rect x="336" y="214" width="250" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="461" y="252" text-anchor="middle" font-size="12.5" fill="#334155">d1[row-c]</text>
  <text x="461" y="274" text-anchor="middle" font-size="12" fill="#64748b">r-c 最小取到 -7</text>
  <rect x="592" y="214" width="100" height="84" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="642" y="262" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">崩溃</text>
  <rect x="698" y="214" width="262" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="829" y="248" text-anchor="middle" font-size="11" fill="#334155">最响：Go 报 index out of range</text>
  <text x="829" y="270" text-anchor="middle" font-size="11" fill="#334155">Java 报 ArrayIndexOutOfBoundsException</text>

  <rect x="40" y="304" width="290" height="84" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="185" y="338" text-anchor="middle" font-size="13" fill="#7c2d12">偏移对了，但两条对角线</text>
  <text x="185" y="360" text-anchor="middle" font-size="13" fill="#7c2d12">共用同一个数组</text>
  <rect x="336" y="304" width="250" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="461" y="332" text-anchor="middle" font-size="12.5" fill="#334155">d[row-c+n-1]</text>
  <text x="461" y="354" text-anchor="middle" font-size="12.5" fill="#334155">d[row+c]</text>
  <text x="461" y="376" text-anchor="middle" font-size="12" fill="#64748b">同一个 d</text>
  <rect x="592" y="304" width="100" height="84" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="642" y="356" text-anchor="middle" font-size="24" font-weight="bold" fill="#b45309">0</text>
  <rect x="698" y="304" width="262" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="829" y="338" text-anchor="middle" font-size="12.5" fill="#334155">不崩：两处下标互相顶替</text>
  <text x="829" y="360" text-anchor="middle" font-size="12.5" fill="#334155">解被过度剪枝剪光</text>

  <rect x="40" y="394" width="290" height="84" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <text x="185" y="428" text-anchor="middle" font-size="13" fill="#7c2d12">偏移对了，但漏查</text>
  <text x="185" y="450" text-anchor="middle" font-size="13" fill="#7c2d12">副对角线 d2</text>
  <rect x="336" y="394" width="250" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="461" y="422" text-anchor="middle" font-size="12.5" fill="#334155">只查 col[c] 与 d1[row-c+n-1]</text>
  <text x="461" y="444" text-anchor="middle" font-size="12" fill="#64748b">r+c 那条线没人管</text>
  <rect x="592" y="394" width="100" height="84" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
  <text x="642" y="440" text-anchor="middle" font-size="22" font-weight="bold" fill="#b45309">2113</text>
  <text x="642" y="462" text-anchor="middle" font-size="11" fill="#b45309">比 92 多</text>
  <rect x="698" y="394" width="262" height="84" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="829" y="428" text-anchor="middle" font-size="12.5" fill="#7f1d1d">最安静：不报错，照常输出</text>
  <text x="829" y="450" text-anchor="middle" font-size="12.5" fill="#7f1d1d">多出一堆其实互相攻击的「解」</text>

  <path d="M972,224 L972,468" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#nqP)"/>
  <text x="968" y="490" text-anchor="end" font-size="11" fill="#64748b">响度递减</text>

  <text x="40" y="506" font-size="12.5" fill="#334155">危险度不按响度排：0 与 2113 都不崩溃、不报错，只是安静地给出错误答案，所以必须拿 92 这个精确值做断言</text>
  <text x="40" y="532" font-size="12.5" fill="#334155">同一批断言点：n=12 的解数应为 14200（4.1 实测）；只断言「解数 &gt; 0」时这三种写法全都能「跑出一堆解」</text>
</svg>
