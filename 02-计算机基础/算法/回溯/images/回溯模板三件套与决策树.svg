<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwB" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#2563eb"/></marker>
    <marker id="arwR" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">回溯模板三件套与决策树的对应关系</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">左：三要素落在伪代码模板的哪个槽位　右：正文第一节 ASCII 树的同形示意</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="460" height="332" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 三要素 = 模板的三个槽位</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">伪代码模板（第一节）里每行占位对应树的一部分</text>

    <rect x="14" y="58" width="432" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="80" font-size="11.5" font-weight="bold" fill="#1e40af">路径：已做的选择</text>
    <text x="28" y="100" font-size="10" fill="#1e40af">沿树枝向下累积，节点内容就是它</text>

    <rect x="14" y="124" width="432" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="146" font-size="11.5" font-weight="bold" fill="#1e40af">选择列表：当前还能做什么</text>
    <text x="28" y="166" font-size="10" fill="#1e40af">该节点的全部出边（剩余候选，常靠 used 标记）</text>

    <rect x="14" y="190" width="432" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="212" font-size="11.5" font-weight="bold" fill="#1e40af">结束条件：什么时候记录结果</text>
    <text x="28" y="232" font-size="10" fill="#1e40af">满足即记录并 return，通常落在叶子或某个前缀</text>

    <rect x="14" y="258" width="432" height="58" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="28" y="280" font-size="11.5" font-weight="bold" fill="#92400e">循环体三段：做出选择 → 递归 → 撤销选择</text>
    <text x="28" y="300" font-size="10" fill="#92400e">不合法的候选 continue 跳过，这就是剪枝的落点</text>
  </g>

  <g transform="translate(520,74)">
    <rect x="0" y="0" width="460" height="332" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 决策树：节点是路径，边是一次选择</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">[1 2 3] 全排列，只展开「先选 1」的分支，其余省略</text>

    <rect x="195" y="56" width="70" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="230" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">[]</text>

    <line x1="212" y1="86" x2="100" y2="108" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="230" y1="86" x2="230" y2="108" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="248" y1="86" x2="360" y2="108" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="70" y="110" width="56" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="98" y="129" text-anchor="middle" font-size="11" fill="#1e40af">[1]</text>
    <rect x="202" y="110" width="56" height="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="230" y="129" text-anchor="middle" font-size="11" fill="#64748b">[2]</text>
    <rect x="334" y="110" width="56" height="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="362" y="129" text-anchor="middle" font-size="11" fill="#64748b">[3]</text>

    <line x1="88" y1="138" x2="62" y2="160" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="108" y1="138" x2="170" y2="160" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="24" y="162" width="76" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="62" y="181" text-anchor="middle" font-size="11" fill="#1e40af">[1 2]</text>
    <rect x="132" y="162" width="76" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="170" y="181" text-anchor="middle" font-size="11" fill="#1e40af">[1 3]</text>
    <text x="270" y="181" font-size="11" fill="#94a3b8">… 每层从剩余候选里选一</text>

    <line x1="52" y1="190" x2="52" y2="212" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>
    <line x1="180" y1="190" x2="180" y2="212" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arwB)"/>

    <rect x="10" y="214" width="88" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="54" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">[1 2 3]</text>
    <rect x="136" y="214" width="88" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="180" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">[1 3 2]</text>

    <line x1="252" y1="232" x2="252" y2="176" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arwR)"/>
    <text x="262" y="222" font-size="9.5" fill="#dc2626">撤销选择</text>
    <text x="262" y="236" font-size="9.5" fill="#dc2626">退回父节点</text>

    <text x="14" y="272" font-size="10" fill="#334155">绿色 = 叶子，记录一个完整解；共 3x2x1 = 6 个</text>
    <text x="14" y="292" font-size="10" fill="#334155">红色虚线 = 记录后撤销末尾元素，退回父层换分支</text>
    <text x="14" y="312" font-size="10" fill="#64748b">⚠️ 撤销最易漏，排查口径见正文第五节</text>
  </g>
</svg>
