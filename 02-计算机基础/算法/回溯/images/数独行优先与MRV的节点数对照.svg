<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="sG" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">数独：行优先与 MRV 的对照 —— 只改「下一步选哪个空格」</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">规则两栏取自正文 2.2 与 4.2；节点数取自 2.3 的 [3.1]、4.3 的 [3.3]；首个决策的候选数取自 3.3 的 [3.2]</text>

  <rect x="40" y="84" width="430" height="34" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="255" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">行优先（无 MRV，本篇的基准）</text>
  <rect x="530" y="84" width="430" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="745" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">MRV：每步挑候选最少的空格</text>

  <rect x="40" y="130" width="430" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="255" y="152" text-anchor="middle" font-size="12" fill="#64748b">选格规则（2.2）</text>
  <text x="255" y="176" text-anchor="middle" font-size="12.5" fill="#334155">下标从 0 扫到 80，取第一个 b[i] == 0</text>
  <text x="255" y="196" text-anchor="middle" font-size="12.5" fill="#334155">数字按 1..9 依次试；格子位置决定顺序</text>
  <rect x="530" y="130" width="430" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="745" y="152" text-anchor="middle" font-size="12" fill="#64748b">选格规则（4.2：只改这一处）</text>
  <text x="745" y="176" text-anchor="middle" font-size="12.5" fill="#334155">扫满 81 格取 cnt 最小者，cnt == 1 就 break</text>
  <text x="745" y="196" text-anchor="middle" font-size="12.5" fill="#334155">平局取下标最小的：判据用的是严格小于</text>

  <rect x="40" y="220" width="430" height="76" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="255" y="242" text-anchor="middle" font-size="12" fill="#9a3412">同一个盘面的第一个决策（3.3 实测）</text>
  <text x="255" y="266" text-anchor="middle" font-size="13" fill="#7c2d12">行优先的第一个空格 = (row=0,col=2)</text>
  <text x="255" y="286" text-anchor="middle" font-size="12.5" fill="#7c2d12">候选 3 个 —— 押一个把握很小的注（4.1）</text>
  <rect x="530" y="220" width="430" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="745" y="242" text-anchor="middle" font-size="12" fill="#166534">同一个盘面的第一个决策（3.3 实测）</text>
  <text x="745" y="266" text-anchor="middle" font-size="13" fill="#14532d">MRV 的首选 = (row=4,col=4)</text>
  <text x="745" y="286" text-anchor="middle" font-size="12.5" fill="#14532d">候选 1 个；全盘这样的格子共 4 个</text>

  <rect x="40" y="310" width="430" height="96" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="255" y="332" text-anchor="middle" font-size="12" fill="#9a3412">经典题 · 空格 51 个 · 搜索节点</text>
  <text x="255" y="374" text-anchor="middle" font-size="30" font-weight="bold" fill="#b45309">4209</text>
  <text x="255" y="396" text-anchor="middle" font-size="11.5" fill="#9a3412">解出 = true</text>
  <rect x="530" y="310" width="430" height="96" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="745" y="332" text-anchor="middle" font-size="12" fill="#166534">经典题 · 空格 51 个 · 搜索节点</text>
  <text x="745" y="374" text-anchor="middle" font-size="30" font-weight="bold" fill="#166534">52</text>
  <text x="745" y="396" text-anchor="middle" font-size="11.5" fill="#166534">解出 = true</text>
  <path d="M470,358 L528,358" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#sG)"/>
  <text x="500" y="350" text-anchor="middle" font-size="11.5" fill="#16a34a">80.9 倍</text>

  <rect x="40" y="420" width="430" height="96" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="255" y="442" text-anchor="middle" font-size="12" fill="#7f1d1d">17 提示难题 · 空格 64 个 · 搜索节点</text>
  <text x="255" y="484" text-anchor="middle" font-size="30" font-weight="bold" fill="#dc2626">26590294</text>
  <text x="255" y="506" text-anchor="middle" font-size="11.5" fill="#7f1d1d">解出 = true（换题就爆，见下方）</text>
  <rect x="530" y="420" width="430" height="96" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="745" y="442" text-anchor="middle" font-size="12" fill="#166534">17 提示难题 · 空格 64 个 · 搜索节点</text>
  <text x="745" y="484" text-anchor="middle" font-size="30" font-weight="bold" fill="#166534">6037</text>
  <text x="745" y="506" text-anchor="middle" font-size="11.5" fill="#166534">解出 = true</text>
  <path d="M470,468 L528,468" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#sG)"/>
  <text x="500" y="460" text-anchor="middle" font-size="11.5" fill="#16a34a">4404.6 倍</text>

  <rect x="40" y="532" width="920" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="559" text-anchor="middle" font-size="13" fill="#1e3a8a">两栏共同点：两版解一致 = true —— 顺序只换「走了多少路」，不换「走到哪个解」（延伸追问：MRV 不改变最终解）</text>

  <text x="40" y="604" font-size="12.5" fill="#334155">读法一：同一份代码换个题目，无 MRV 从 4209 跳到 26590294（差 6300 倍）—— 难点不在代码，在顺序（4.3）</text>
  <text x="40" y="628" font-size="12.5" fill="#334155">读法二：MRV 越难的题收益越大（80.9 倍 → 4404.6 倍）；代价是每步多扫 81 格算候选数，O(81)（4.5）</text>
  <text x="40" y="652" font-size="12.5" fill="#334155">读法三：位掩码只改每个节点的常数、不改节点数（3.4）；八皇后边放边剪 2057 节点，与经典数独的 4209 同量级（1.1）</text>
  <text x="40" y="678" font-size="11.5" fill="#94a3b8">本图只放正文里的确定性节点数读数；耗时随机器负载波动、正文只断言量级与趋势（第五节），故不入图</text>
</svg>
