<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>

  <text x="600" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">哈希查找：一次查找只有两条路</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#64748b">先算桶位，再在桶内比较；命中停在目标那一次，未命中必须扫完整条冲突链</text>

  <rect x="60" y="100" width="240" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">key = 42</text>

  <path d="M 180 156 L 180 180" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="60" y="180" width="240" height="56" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="180" y="206" text-anchor="middle" font-size="15" fill="#0f172a">哈希函数 h(k)</text>
  <text x="180" y="226" text-anchor="middle" font-size="12" fill="#64748b">同一个键每次都得到同一个值</text>

  <path d="M 180 236 L 180 260" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="60" y="260" width="240" height="56" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="180" y="286" text-anchor="middle" font-size="15" fill="#0f172a">桶位 = h(k) % 8 = 6</text>
  <text x="180" y="306" text-anchor="middle" font-size="12" fill="#64748b">桶号与键的大小没有关系</text>

  <path d="M 180 316 L 180 340" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="60" y="340" width="240" height="56" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="180" y="366" text-anchor="middle" font-size="15" fill="#0f172a">在桶 6 的链里比较</text>
  <text x="180" y="386" text-anchor="middle" font-size="12" fill="#64748b">成功与失败的差别从这里开始</text>

  <path d="M 180 396 L 180 424" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="40" y="424" width="280" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="180" y="452" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">命中：比较 1 次</text>
  <text x="180" y="476" text-anchor="middle" font-size="13" fill="#166534">链头就是 42，立刻返回</text>

  <path d="M 180 498 L 180 520" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="40" y="520" width="280" height="74" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="548" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">未命中：比较 3 次</text>
  <text x="180" y="572" text-anchor="middle" font-size="13" fill="#991b1b">42 → 17 → 91 → nil，扫完才确定</text>

  <text x="460" y="104" font-size="14" font-weight="bold" fill="#0f172a">桶数组（示意 8 个桶）</text>

  <rect x="460" y="120" width="72" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="496" y="154" text-anchor="middle" font-size="14" fill="#475569">0</text>
  <rect x="540" y="120" width="72" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="576" y="154" text-anchor="middle" font-size="14" fill="#475569">1</text>
  <rect x="620" y="120" width="72" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="656" y="154" text-anchor="middle" font-size="14" fill="#475569">2</text>
  <rect x="700" y="120" width="72" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="736" y="154" text-anchor="middle" font-size="14" fill="#475569">3</text>
  <rect x="780" y="120" width="72" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="816" y="154" text-anchor="middle" font-size="14" fill="#475569">4</text>
  <rect x="860" y="120" width="72" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="896" y="154" text-anchor="middle" font-size="14" fill="#475569">5</text>
  <rect x="940" y="120" width="72" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="976" y="154" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">6</text>
  <rect x="1020" y="120" width="72" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1056" y="154" text-anchor="middle" font-size="14" fill="#475569">7</text>

  <path d="M 976 176 L 976 206" fill="none" stroke="#2563eb" stroke-width="2"/>
  <rect x="940" y="206" width="72" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="976" y="234" text-anchor="middle" font-size="14" fill="#1e3a8a">42</text>
  <path d="M 976 250 L 976 268" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="940" y="268" width="72" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="976" y="296" text-anchor="middle" font-size="14" fill="#334155">17</text>
  <path d="M 976 312 L 976 330" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="940" y="330" width="72" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="976" y="358" text-anchor="middle" font-size="14" fill="#334155">91</text>
  <path d="M 976 374 L 976 392" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="976" y="414" text-anchor="middle" font-size="13" fill="#64748b">nil</text>

  <text x="460" y="444" font-size="13" fill="#334155">桶内链表的顺序是插入顺序，不是键序。</text>
  <text x="460" y="468" font-size="13" fill="#b91c1c">所以「按桶号遍历」永远得不到排序结果。</text>

  <rect x="40" y="616" width="1120" height="132" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="646" font-size="14" font-weight="bold" fill="#0f172a">实测读数（Docker golang:1.26-alpine，go1.26.8 linux/amd64）</text>
  <text x="60" y="674" font-size="13" fill="#334155">链地址法，n = 100000，α = 1.0：成功平均比较 1.503 次；失败平均比较 1.002 次；最长链 8；空桶占比 36.95%。</text>
  <text x="60" y="700" font-size="13" fill="#334155">键 0..15 放进 4 个桶：桶 0 [4 11]、桶 1 [5 7 8 13 15]、桶 2 [0 6 9 14]、桶 3 [1 2 3 10 12]；按桶序拼起来是否升序 = false。</text>
  <text x="60" y="726" font-size="12" fill="#64748b">图里的 1 次 / 3 次是示意链长；统计口径与全部读数见正文第二节与第一节的实验 3。</text>
</svg>
