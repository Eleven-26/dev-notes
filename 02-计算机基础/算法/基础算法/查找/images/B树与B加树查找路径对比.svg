<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1200" height="740" fill="#ffffff"/>

  <text x="600" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">B 树与 B+ 树的查找路径：一个可能半路结束，一个一定走到叶子</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#64748b">同样的「页内二分 + 子页下探」，差别只在数据放在哪、以及叶子之间有没有链</text>

  <rect x="20" y="82" width="570" height="358" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="305" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">B 树：内部结点也存数据</text>

  <rect x="170" y="132" width="270" height="58" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="305" y="168" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">30 | 45 | 60</text>

  <path d="M 220 190 L 115 238" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 275 190 L 245 238" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 335 190 L 375 238" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 390 190 L 505 238" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="60" y="238" width="110" height="52" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="115" y="270" text-anchor="middle" font-size="14" fill="#334155">10 | 20</text>
  <rect x="190" y="238" width="110" height="52" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="245" y="270" text-anchor="middle" font-size="14" fill="#334155">35 | 40</text>
  <rect x="320" y="238" width="110" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="375" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">50 | 55</text>
  <rect x="450" y="238" width="110" height="52" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="505" y="270" text-anchor="middle" font-size="14" fill="#334155">70 | 80</text>

  <text x="305" y="322" text-anchor="middle" font-size="13" fill="#166534">key 45 在根页命中：只读 1 页，提前返回</text>
  <text x="305" y="348" text-anchor="middle" font-size="13" fill="#166534">key 50 下探到叶子：读 2 页</text>
  <text x="305" y="390" text-anchor="middle" font-size="12" fill="#64748b">查找深度因键而异：命中内部结点越浅，落到叶子越深</text>

  <rect x="610" y="82" width="570" height="358" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="895" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">B+ 树：数据只在叶子，叶子成链</text>

  <rect x="760" y="132" width="270" height="58" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="895" y="168" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">30 | 60</text>

  <path d="M 805 190 L 700 238" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 865 190 L 840 238" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 925 190 L 980 238" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 985 190 L 1120 238" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="650" y="238" width="100" height="52" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="700" y="270" text-anchor="middle" font-size="13" fill="#334155">10 20 25</text>
  <rect x="790" y="238" width="100" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="840" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">30 40 45</text>
  <rect x="930" y="238" width="100" height="52" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="980" y="270" text-anchor="middle" font-size="13" fill="#334155">50 55 60</text>
  <rect x="1070" y="238" width="100" height="52" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="1120" y="270" text-anchor="middle" font-size="13" fill="#334155">70 80 90</text>

  <path d="M 750 264 L 790 264" fill="none" stroke="#16a34a" stroke-width="2"/>
  <path d="M 890 264 L 930 264" fill="none" stroke="#16a34a" stroke-width="2"/>
  <path d="M 1030 264 L 1070 264" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="895" y="322" text-anchor="middle" font-size="13" fill="#166534">key 45 在叶页命中：读 2 页（根 + 叶），必须到底</text>
  <text x="895" y="348" text-anchor="middle" font-size="13" fill="#166534">所有键的查找深度都等于树高</text>
  <text x="895" y="390" text-anchor="middle" font-size="12" fill="#64748b">绿色箭头是叶子链表：范围查询从定位点顺链右扫</text>

  <rect x="40" y="468" width="1120" height="238" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="498" font-size="14" font-weight="bold" fill="#0f172a">实测读数（Docker golang:1.26-alpine，go1.26.8 linux/amd64；静态页式索引模型）</text>
  <text x="60" y="526" font-size="13" fill="#334155">N = 100000，扇出 32：B+ 树高 4，平均比较 16.87 次，最大 17 次；100 键范围覆盖 4 个叶子页。</text>
  <text x="60" y="552" font-size="13" fill="#334155">同一份键的数组二分：平均比较 16 次，最大 17 次；数组在内存时只算 1 次页访问，磁盘上每次探测约一页。</text>
  <text x="60" y="578" font-size="13" fill="#334155">B 树满扇出模型：N = 100000、扇出 32 时平均命中深度 2.662；扇出 8/128 时为 4.626/1.835。</text>
  <text x="60" y="610" font-size="13" fill="#b91c1c">⭐ 关键对照：B+ 树的比较次数没有比数组二分少（16.87 vs 16），少的是页访问（4 次 vs 约 16 次）。</text>
  <text x="60" y="640" font-size="12" fill="#64748b">B 树一列是「每个内部节点塞满 F−1 个键」的模型推算，不是插入构造，也不是磁盘 I/O 实测；</text>
  <text x="60" y="662" font-size="12" fill="#64748b">扇出与树高的完整表、范围查询的叶页数见正文第三、四、五节。</text>
  <text x="60" y="686" font-size="12" fill="#94a3b8">图中节点内容为示意；所有统计读数来自正文实验，不在图里另造数字。</text>
</svg>
