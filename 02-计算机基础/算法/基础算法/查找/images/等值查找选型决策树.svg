<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>

  <text x="600" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">等值查找的选型决策树：先问「查什么」，再问「数据在哪」</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#64748b">哈希、二分、B+ 树、顺序扫描不是互相替代，而是回答不同的问题</text>

  <rect x="450" y="92" width="300" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">这次查找要返回什么？</text>
  <text x="600" y="144" text-anchor="middle" font-size="12" fill="#1e3a8a">等值 / 范围 / 只要一个结果</text>

  <path d="M 600 156 L 600 176 L 190 176 L 190 208" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 600 176 L 600 208" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 600 176 L 1010 176 L 1010 208" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="40" y="208" width="300" height="64" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="190" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">等值 / 在不在</text>
  <text x="190" y="260" text-anchor="middle" font-size="12" fill="#64748b">key = x，或判断 x 是否存在</text>

  <rect x="450" y="208" width="300" height="64" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">范围 / 排序 / 前缀</text>
  <text x="600" y="260" text-anchor="middle" font-size="12" fill="#64748b">a ≤ key ≤ b，或要按 key 顺序输出</text>

  <rect x="860" y="208" width="300" height="64" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="1010" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">数据量很小</text>
  <text x="1010" y="260" text-anchor="middle" font-size="12" fill="#64748b">几十个元素，常数比复杂度更重要</text>

  <path d="M 190 272 L 190 304" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 600 272 L 600 304" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 1010 272 L 1010 304" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="190" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">数据在内存还是磁盘？</text>
  <text x="600" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">数据在内存还是磁盘？</text>
  <text x="1010" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">直接顺序扫描</text>

  <path d="M 190 334 L 190 356 L 110 356 L 110 384" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 190 334 L 190 356 L 270 356 L 270 384" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 600 334 L 600 356 L 520 356 L 520 384" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 600 334 L 600 356 L 680 356 L 680 384" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="30" y="384" width="160" height="94" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="110" y="412" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">内存</text>
  <text x="110" y="436" text-anchor="middle" font-size="14" fill="#166534">哈希查找</text>
  <text x="110" y="458" text-anchor="middle" font-size="12" fill="#166534">平均 O(1)</text>

  <rect x="200" y="384" width="160" height="94" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="280" y="412" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">磁盘</text>
  <text x="280" y="436" text-anchor="middle" font-size="14" fill="#334155">哈希索引</text>
  <text x="280" y="458" text-anchor="middle" font-size="12" fill="#64748b">只支持等值</text>

  <rect x="440" y="384" width="160" height="94" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="412" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">内存</text>
  <text x="520" y="436" text-anchor="middle" font-size="14" fill="#166534">有序数组 + 二分</text>
  <text x="520" y="458" text-anchor="middle" font-size="12" fill="#166534">比较 O(log n)</text>

  <rect x="610" y="384" width="160" height="94" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="690" y="412" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">磁盘</text>
  <text x="690" y="436" text-anchor="middle" font-size="14" fill="#1e3a8a">B+ 树</text>
  <text x="690" y="458" text-anchor="middle" font-size="12" fill="#1e3a8a">页访问 O(log_F n)</text>

  <rect x="860" y="384" width="300" height="94" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="1010" y="412" text-anchor="middle" font-size="14" font-weight="bold" fill="#854d0e">顺序扫描 O(n)</text>
  <text x="1010" y="436" text-anchor="middle" font-size="13" fill="#854d0e">n 很小时常数最小，别为几十个元素建索引</text>
  <text x="1010" y="458" text-anchor="middle" font-size="12" fill="#854d0e">缓存友好的顺序读常常比复杂结构更快</text>

  <rect x="40" y="516" width="520" height="150" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="546" font-size="14" font-weight="bold" fill="#0f172a">同一份 10 万键的实测对照</text>
  <text x="60" y="574" font-size="13" fill="#334155">哈希（α = 1.0）：成功平均比较 1.503 次，失败 1.002 次</text>
  <text x="60" y="598" font-size="13" fill="#334155">数组二分：平均比较 16 次，最大 17 次</text>
  <text x="60" y="622" font-size="13" fill="#334155">B+ 树（扇出 32）：树高 4，平均比较 16.87 次</text>
  <text x="60" y="646" font-size="12" fill="#64748b">三者都基于同一份 0..99999 的连续整数键；统计口径见两篇正文。</text>

  <rect x="580" y="516" width="580" height="150" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="600" y="546" font-size="14" font-weight="bold" fill="#991b1b">三条硬边界</text>
  <text x="600" y="574" font-size="13" fill="#7f1d1d">① 桶序与键序无关：实测把 0..15 按桶序拼起来，升序 = false。</text>
  <text x="600" y="598" font-size="13" fill="#7f1d1d">② 哈希的 O(1) 是平均；全部键撞一个桶时实测成功 5000.5 次。</text>
  <text x="600" y="622" font-size="13" fill="#7f1d1d">③ B+ 树的优势是页访问（4 次），不是比较次数（16.87 次）。</text>
  <text x="600" y="646" font-size="12" fill="#64748b">别混用「比较次数」与「页访问次数」这两个成本单位。</text>
</svg>
