<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530"
     font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <rect x="0" y="0" width="1000" height="530" fill="#ffffff"/>
    <text x="500" y="30" font-size="22" fill="#1f3a5f" text-anchor="middle" font-weight="bold">非比较排序的数据流转
    </text>
    <text x="500" y="50" font-size="13" fill="#5a6b7c" text-anchor="middle">三者共用一套骨架：跳过比较，用「值 / 位 /
        值域」直接定位
    </text>
    <text x="150" y="80" font-size="12" fill="#5a6b7c" text-anchor="middle">输入数组</text>
    <text x="520" y="80" font-size="12" fill="#5a6b7c" text-anchor="middle">中间结构（怎么定位）</text>
    <text x="870" y="80" font-size="12" fill="#5a6b7c" text-anchor="middle">输出（已有序）</text>
    <text x="40" y="106" font-size="16" fill="#1f3a5f" text-anchor="start" font-weight="bold">计数排序 —— 值即下标　｜　O(n
        + k)，k 是值域
    </text>
    <rect x="40" y="122" width="220" height="52" rx="8" fill="#e8f0fb" stroke="#9db4d0" stroke-width="1.5"/>
    <text x="150" y="143" font-size="11" fill="#5a6b7c" text-anchor="middle">数组（值域 0..3）</text>
    <text x="150" y="164" font-size="14" fill="#1f3a5f" text-anchor="middle">[3 1 3 0 2 3]</text>
    <line x1="265" y1="148" x2="322" y2="148" stroke="#5a6b7c" stroke-width="1.5"/>
    <polygon points="322,143 322,153 330,148" fill="#5a6b7c"/>
    <rect x="330" y="122" width="380" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="520" y="143" font-size="11" fill="#1b5e20" text-anchor="middle">值即下标 → 统计频次</text>
    <text x="520" y="164" font-size="14" fill="#1b5e20" text-anchor="middle">cnt = [1 1 1 3]</text>
    <line x1="715" y1="148" x2="772" y2="148" stroke="#5a6b7c" stroke-width="1.5"/>
    <polygon points="772,143 772,153 780,148" fill="#5a6b7c"/>
    <rect x="780" y="122" width="180" height="52" rx="8" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/>
    <text x="870" y="143" font-size="11" fill="#4a148c" text-anchor="middle">按值倒出</text>
    <text x="870" y="164" font-size="14" fill="#4a148c" text-anchor="middle">[0 1 2 3 3 3]</text>
    <text x="40" y="246" font-size="16" fill="#1f3a5f" text-anchor="start" font-weight="bold">基数排序（LSD）——
        按位从低位到高位　｜　d 轮必须稳定
    </text>
    <rect x="40" y="262" width="220" height="52" rx="8" fill="#e8f0fb" stroke="#9db4d0" stroke-width="1.5"/>
    <text x="150" y="283" font-size="11" fill="#5a6b7c" text-anchor="middle">定长整数</text>
    <text x="150" y="304" font-size="14" fill="#1f3a5f" text-anchor="middle">[170 45 75 90 802 24]</text>
    <line x1="265" y1="288" x2="322" y2="288" stroke="#5a6b7c" stroke-width="1.5"/>
    <polygon points="322,283 322,293 330,288" fill="#5a6b7c"/>
    <rect x="330" y="262" width="380" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="520" y="283" font-size="11" fill="#1b5e20" text-anchor="middle">按位分桶，逐位稳定计数排序</text>
    <text x="520" y="304" font-size="14" fill="#1b5e20" text-anchor="middle">个位 → 十位 → 百位</text>
    <line x1="715" y1="288" x2="772" y2="288" stroke="#5a6b7c" stroke-width="1.5"/>
    <polygon points="772,283 772,293 780,288" fill="#5a6b7c"/>
    <rect x="780" y="262" width="180" height="52" rx="8" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/>
    <text x="870" y="283" font-size="11" fill="#4a148c" text-anchor="middle">最后一轮已有序</text>
    <text x="870" y="304" font-size="14" fill="#4a148c" text-anchor="middle">[24 45 75 90 170 802]</text>
    <text x="40" y="386" font-size="16" fill="#1f3a5f" text-anchor="start" font-weight="bold">桶排序 ——
        值域均分成桶　｜　桶内元素少才线性
    </text>
    <rect x="40" y="402" width="220" height="52" rx="8" fill="#e8f0fb" stroke="#9db4d0" stroke-width="1.5"/>
    <text x="150" y="423" font-size="11" fill="#5a6b7c" text-anchor="middle">值域均匀，0..99</text>
    <text x="150" y="444" font-size="14" fill="#1f3a5f" text-anchor="middle">[78 17 39 26 72 94]</text>
    <line x1="265" y1="428" x2="322" y2="428" stroke="#5a6b7c" stroke-width="1.5"/>
    <polygon points="322,423 322,433 330,428" fill="#5a6b7c"/>
    <rect x="330" y="402" width="380" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="520" y="423" font-size="11" fill="#1b5e20" text-anchor="middle">按值域映射进桶，桶内再排序</text>
    <text x="520" y="444" font-size="14" fill="#1b5e20" text-anchor="middle">桶0:[17] 桶2:[26] 桶3:[39] 桶7:[72 78]
        桶9:[94]
    </text>
    <line x1="715" y1="428" x2="772" y2="428" stroke="#5a6b7c" stroke-width="1.5"/>
    <polygon points="772,423 772,433 780,428" fill="#5a6b7c"/>
    <rect x="780" y="402" width="180" height="52" rx="8" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/>
    <text x="870" y="423" font-size="11" fill="#4a148c" text-anchor="middle">按桶序拼接</text>
    <text x="870" y="444" font-size="14" fill="#4a148c" text-anchor="middle">[17 26 39 72 78 94]</text>
    <text x="500" y="496" font-size="14" fill="#1f3a5f" text-anchor="middle">共同代价：值域 k 或位数 d 必须与 n
        同量级，否则线性优势被初始化开销吞掉
    </text>
</svg>
