<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="1000" height="640" fill="#f7f9fc"/><rect x="0" y="0" width="1000" height="56" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="1.5"/><text x="500.0" y="30" font-size="22" fill="#1f3a5f" text-anchor="middle" font-weight="bold">排序算法分类与复杂度</text><text x="500.0" y="50" font-size="13" fill="#5a6b7c" text-anchor="middle" font-weight="normal">比较类靠「两两比较」，非比较类靠「值本身定位」</text><rect x="400" y="80" width="200" height="46" rx="8" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/><text x="500" y="109" font-size="17" fill="#6a1b9a" text-anchor="middle" font-weight="bold">排序算法</text><line x1="500" y1="126" x2="280" y2="180" stroke="#5a6b7c" stroke-width="1.5"/><line x1="500" y1="126" x2="720" y2="180" stroke="#5a6b7c" stroke-width="1.5"/><rect x="150" y="180" width="260" height="46" rx="8" fill="#e8f0fb" stroke="#9db4d0" stroke-width="1.5"/><text x="280" y="209" font-size="15" fill="#1f3a5f" text-anchor="middle" font-weight="bold">比较类（下界 Ω(n log n)）</text><rect x="590" y="180" width="260" height="46" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="720" y="209" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">非比较类（可突破下界）</text><rect x="90" y="250" width="380" height="38" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="280" y="275" font-size="14" fill="#22303f" text-anchor="middle" font-weight="normal">插入排序    O(n²) / 稳 / 原地</text><rect x="90" y="296" width="380" height="38" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="280" y="321" font-size="14" fill="#22303f" text-anchor="middle" font-weight="normal">希尔排序    ~O(n^1.3) / 不稳 / 原地</text><rect x="90" y="342" width="380" height="38" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="280" y="367" font-size="14" fill="#22303f" text-anchor="middle" font-weight="normal">冒泡排序    O(n²) / 稳 / 原地</text><rect x="90" y="388" width="380" height="38" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="280" y="413" font-size="14" fill="#22303f" text-anchor="middle" font-weight="normal">选择排序    O(n²) / 不稳 / 原地</text><rect x="90" y="434" width="380" height="38" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="280" y="459" font-size="14" fill="#22303f" text-anchor="middle" font-weight="normal">归并排序    O(n log n) / 稳 / O(n)</text><rect x="90" y="480" width="380" height="38" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="280" y="505" font-size="14" fill="#22303f" text-anchor="middle" font-weight="normal">快速排序    O(n log n) 均 / 不稳 / 原地</text><rect x="90" y="526" width="380" height="38" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="280" y="551" font-size="14" fill="#22303f" text-anchor="middle" font-weight="normal">堆排序    O(n log n) / 不稳 / 原地</text><rect x="530" y="250" width="380" height="38" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="720" y="275" font-size="14" fill="#22303f" text-anchor="middle" font-weight="normal">计数排序    O(n+k) / 稳 / O(k)</text><rect x="530" y="296" width="380" height="38" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="720" y="321" font-size="14" fill="#22303f" text-anchor="middle" font-weight="normal">基数排序    O(n·k) / 稳 / O(n+k)</text><rect x="530" y="342" width="380" height="38" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="720" y="367" font-size="14" fill="#22303f" text-anchor="middle" font-weight="normal">桶排序    O(n+k) / 稳 / O(n+k)</text><text x="720" y="408" font-size="13" fill="#c62828" text-anchor="middle" font-weight="normal">⚠️ 前提：值域 k 不能远大于 n</text><rect x="50" y="584" width="900" height="44" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="500" y="612" font-size="14" fill="#c62828" text-anchor="middle" font-weight="normal">稳定：插入 / 冒泡 / 归并 / 计数 / 基数 / 桶　｜　不稳定：希尔 / 选择 / 快排 / 堆排</text></svg>