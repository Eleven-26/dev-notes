<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="1000" height="610" fill="#f7f9fc"/><rect x="0" y="0" width="1000" height="56" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="1.5"/><text x="500.0" y="30" font-size="22" fill="#1f3a5f" text-anchor="middle" font-weight="bold">快速排序的分区：Lomuto 与三路划分</text><text x="500.0" y="50" font-size="13" fill="#5a6b7c" text-anchor="middle" font-weight="normal">枢轴 = 5，重复元素用三路划分一次性归位</text><rect x="180" y="100" width="82" height="50" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="221.0" y="132" font-size="18" fill="#22303f" text-anchor="middle" font-weight="normal">3</text><rect x="272" y="100" width="82" height="50" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="313.0" y="132" font-size="18" fill="#22303f" text-anchor="middle" font-weight="normal">8</text><rect x="364" y="100" width="82" height="50" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="405.0" y="132" font-size="18" fill="#22303f" text-anchor="middle" font-weight="normal">2</text><rect x="456" y="100" width="82" height="50" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="497.0" y="132" font-size="18" fill="#22303f" text-anchor="middle" font-weight="normal">5</text><rect x="548" y="100" width="82" height="50" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="589.0" y="132" font-size="18" fill="#22303f" text-anchor="middle" font-weight="normal">1</text><rect x="640" y="100" width="82" height="50" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="681.0" y="132" font-size="18" fill="#22303f" text-anchor="middle" font-weight="normal">5</text><rect x="732" y="100" width="82" height="50" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="773.0" y="132" font-size="18" fill="#22303f" text-anchor="middle" font-weight="normal">5</text><rect x="824" y="100" width="82" height="50" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="865.0" y="132" font-size="18" fill="#22303f" text-anchor="middle" font-weight="normal">4</text><text x="90" y="132" font-size="15" fill="#1f3a5f" text-anchor="middle" font-weight="bold">待分区</text><text x="60" y="200" font-size="15" fill="#1f3a5f" text-anchor="start" font-weight="bold">Lomuto（单指针）：&lt; pivot 的往左推，最后把 pivot 换到分界点</text><rect x="120" y="220" width="152" height="46" rx="8" fill="#e8f0fb" stroke="#9db4d0" stroke-width="1.5"/><text x="196.0" y="249" font-size="16" fill="#22303f" text-anchor="middle" font-weight="normal">3 2 1 4</text><text x="196.0" y="288" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">全部 &lt; 5</text><rect x="286" y="220" width="56" height="46" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="314.0" y="249" font-size="16" fill="#22303f" text-anchor="middle" font-weight="normal">5</text><text x="314.0" y="288" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">pivot</text><rect x="356" y="220" width="120" height="46" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="416.0" y="249" font-size="16" fill="#22303f" text-anchor="middle" font-weight="normal">8 5 5</text><text x="416.0" y="288" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">全部 ≥ 5</text><text x="60" y="350" font-size="15" fill="#1f3a5f" text-anchor="start" font-weight="bold">三路划分（Dutch flag）：&lt; p / == p / &gt; p 三段一次到位</text><rect x="120" y="370" width="152" height="46" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="196.0" y="399" font-size="16" fill="#22303f" text-anchor="middle" font-weight="normal">1 2 3 4</text><text x="196.0" y="438" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">&lt; 5</text><rect x="286" y="370" width="120" height="46" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="346.0" y="399" font-size="16" fill="#22303f" text-anchor="middle" font-weight="normal">5 5 5</text><text x="346.0" y="438" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">== 5（整段归位）</text><rect x="420" y="370" width="56" height="46" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="448.0" y="399" font-size="16" fill="#22303f" text-anchor="middle" font-weight="normal">8</text><text x="448.0" y="438" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">&gt; 5</text><rect x="60" y="480" width="880" height="100" rx="8" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/><text x="500" y="510" font-size="14" fill="#6a1b9a" text-anchor="middle" font-weight="bold">三路划分的意义：等于 pivot 的一整段只比较一次，不再进入递归</text><text x="500" y="538" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">全等元素数组上：普通快排退化成 O(n²)，三路划分只需一层 → O(n)</text><text x="500" y="562" font-size="13" fill="#c62828" text-anchor="middle" font-weight="normal">最坏 O(n²) 的触发：已排序数组 + 每次取到极值枢轴（每层只切掉 1 个）</text></svg>