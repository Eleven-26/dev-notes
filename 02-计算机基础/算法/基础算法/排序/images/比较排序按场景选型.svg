<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="1100" height="780" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1100" height="780" fill="#ffffff"/>
  <defs>
    <marker id="cs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">按场景选排序：先问谁在决定顺序，再问最坏会怎样</text>
  <text x="550" y="60" text-anchor="middle" font-size="12.5" fill="#64748b">四个判断分支落到不同做法；本图为判据示意，不含新读数</text>

  <rect x="30" y="330" width="240" height="72" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">这次排序的硬约束是什么？</text>
  <text x="150" y="382" text-anchor="middle" font-size="10.5" fill="#1e3a8a">先分清谁在决定顺序</text>

  <rect x="330" y="80" width="260" height="72" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="460" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">① 顺序由标准库定</text>
  <text x="460" y="132" text-anchor="middle" font-size="10.5" fill="#475569">订单列表、榜单、日志</text>

  <rect x="330" y="230" width="260" height="72" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="460" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">② 顺序要自己拼</text>
  <text x="460" y="282" text-anchor="middle" font-size="10.5" fill="#475569">多关键字 / 内存放不下</text>

  <rect x="330" y="380" width="260" height="72" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="460" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">③ 只要前 K 个</text>
  <text x="460" y="432" text-anchor="middle" font-size="10.5" fill="#475569">榜单取头部、静态数组</text>

  <rect x="330" y="530" width="260" height="72" rx="9" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
  <text x="460" y="560" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">④ 最坏不能退化</text>
  <text x="460" y="582" text-anchor="middle" font-size="10.5" fill="#991b1b">输入可能有序 / 大量重复</text>

  <rect x="650" y="90" width="420" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="860" y="121" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">混合排序：Timsort / introsort / pdqsort</text>

  <rect x="650" y="220" width="420" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="860" y="251" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">多关键字 → 先次要键、再主要键，两轮都稳定</text>

  <rect x="650" y="290" width="420" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="860" y="321" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">内存放不下 → 分块排序 + 多路归并，只顺序读写</text>

  <rect x="650" y="370" width="420" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="860" y="401" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">大小 K 的小顶堆 O(n log k)，流式数据首选</text>

  <rect x="650" y="440" width="420" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="860" y="471" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">静态数组 → 快速选择，只递归一侧</text>

  <rect x="650" y="520" width="420" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="860" y="551" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">输入可能有序 → 插入排序自适应 O(n)</text>

  <rect x="650" y="590" width="420" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="860" y="621" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">自己写快排 → 随机枢轴 / 三数取中</text>

  <rect x="650" y="650" width="420" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="860" y="681" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">大量重复键 → 三路划分</text>

  <path d="M 270 366 L 330 116" stroke="#64748b" stroke-width="1.5" marker-end="url(#cs)"/>
  <path d="M 270 366 L 330 266" stroke="#64748b" stroke-width="1.5" marker-end="url(#cs)"/>
  <path d="M 270 366 L 330 416" stroke="#64748b" stroke-width="1.5" marker-end="url(#cs)"/>
  <path d="M 270 366 L 330 566" stroke="#64748b" stroke-width="1.5" marker-end="url(#cs)"/>

  <path d="M 590 116 L 650 116" stroke="#64748b" stroke-width="1.5" marker-end="url(#cs)"/>
  <path d="M 590 266 L 650 246" stroke="#64748b" stroke-width="1.5" marker-end="url(#cs)"/>
  <path d="M 590 266 L 650 316" stroke="#64748b" stroke-width="1.5" marker-end="url(#cs)"/>
  <path d="M 590 416 L 650 396" stroke="#64748b" stroke-width="1.5" marker-end="url(#cs)"/>
  <path d="M 590 416 L 650 466" stroke="#64748b" stroke-width="1.5" marker-end="url(#cs)"/>
  <path d="M 590 566 L 650 546" stroke="#64748b" stroke-width="1.5" marker-end="url(#cs)"/>
  <path d="M 590 566 L 650 616" stroke="#64748b" stroke-width="1.5" marker-end="url(#cs)"/>
  <path d="M 590 566 L 650 676" stroke="#64748b" stroke-width="1.5" marker-end="url(#cs)"/>

  <rect x="30" y="720" width="1040" height="44" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="747" font-size="12.5" fill="#1e3a8a">判据：常规业务交给库函数；库函数不够用只有两种场合 —— 只取前 K 个、内存放不下；自己写时先防退化。</text>
</svg>
