<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <defs>
    <marker id="nc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">非比较排序的选型决策树：先看值域，再看分布</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">四条出口分别落到计数 / 基数 / 桶 / 退回比较排序；本图为判据示意，不含新读数</text>

  <rect x="40" y="100" width="220" height="56" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="150" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">排序键是什么形态？</text>
  <text x="150" y="143" text-anchor="middle" font-size="10.5" fill="#1e3a8a">不看算法名，先看数据</text>

  <rect x="320" y="66" width="250" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="445" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">小整数：k 与 n 同量级</text>
  <text x="445" y="109" text-anchor="middle" font-size="10.5" fill="#475569">年龄、分数、星级、状态码</text>

  <rect x="320" y="158" width="250" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="445" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">定长可分解键：整数 / 定长串</text>
  <text x="445" y="201" text-anchor="middle" font-size="10.5" fill="#475569">手机号、定长 ID、定长字符串</text>

  <rect x="320" y="250" width="250" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="445" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">大值域 + 分布均匀</text>
  <text x="445" y="293" text-anchor="middle" font-size="10.5" fill="#475569">时间戳、均匀分布的大整数</text>

  <rect x="320" y="342" width="250" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="445" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">k ≫ n 或值域不可分解</text>
  <text x="445" y="385" text-anchor="middle" font-size="10.5" fill="#991b1b">稀疏 ID、浮点、变长键</text>

  <rect x="650" y="70" width="310" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="805" y="99" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">计数排序（要保序就用前缀和写回）</text>

  <rect x="650" y="162" width="310" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="805" y="191" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">基数排序（LSD，每轮必须稳定）</text>

  <rect x="650" y="254" width="310" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="805" y="283" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">桶排序（桶数 ≈ n，桶内插入排序）</text>

  <rect x="650" y="346" width="310" height="48" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="805" y="375" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">退回比较排序（Ω(n log n) 保底）</text>

  <path d="M 260 128 L 290 128 L 290 94 L 320 94" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#nc)"/>
  <path d="M 260 128 L 290 128 L 290 186 L 320 186" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#nc)"/>
  <path d="M 260 128 L 290 128 L 290 278 L 320 278" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#nc)"/>
  <path d="M 260 128 L 290 128 L 290 370 L 320 370" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#nc)"/>

  <path d="M 570 94 L 650 94" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#nc)"/>
  <path d="M 570 186 L 650 186" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#nc)"/>
  <path d="M 570 278 L 650 278" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#nc)"/>
  <path d="M 570 370 L 650 370" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#nc)"/>

  <text x="46" y="434" font-size="12.5" font-weight="bold" fill="#0f172a">三个前提：任何一条不成立，线性时间就不成立</text>

  <rect x="30" y="450" width="300" height="110" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="478" font-size="12.5" font-weight="bold" fill="#1e40af">① 值域：k 与 n 同量级</text>
  <text x="46" y="506" font-size="11.5" fill="#334155">k ≫ n 时，O(k) 的空间与遍历</text>
  <text x="46" y="528" font-size="11.5" fill="#334155">会把收益吞干净</text>

  <rect x="350" y="450" width="300" height="110" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="366" y="478" font-size="12.5" font-weight="bold" fill="#1e40af">② 键：可分解且分布均匀</text>
  <text x="366" y="506" font-size="11.5" fill="#334155">分布倾斜时，元素挤进一个桶，</text>
  <text x="366" y="528" font-size="11.5" fill="#334155">退化成桶内插入排序的 O(n²)</text>

  <rect x="670" y="450" width="300" height="110" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="686" y="478" font-size="12.5" font-weight="bold" fill="#1e40af">③ 稳定：基数排序的生命线</text>
  <text x="686" y="506" font-size="11.5" fill="#334155">某一轮一乱，上一轮定下的</text>
  <text x="686" y="528" font-size="11.5" fill="#334155">高低关系就没了</text>

  <rect x="30" y="580" width="940" height="110" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="608" font-size="13" font-weight="bold" fill="#1e40af">判据：值域决定「能不能用」，分布决定「用了快不快」</text>
  <text x="46" y="638" font-size="12" fill="#1e3a8a">两者都过，才轮得到比常数——计数一趟扫完、基数要跑 d 轮、桶内还要再排</text>
  <text x="46" y="664" font-size="12" fill="#1e3a8a">前提都不满足 → 别硬套，退回比较排序拿 Ω(n log n) 保底</text>
</svg>
