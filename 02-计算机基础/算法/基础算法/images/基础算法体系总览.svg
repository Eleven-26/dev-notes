<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">基础算法体系总览：十个技巧，按「成立性质」分簇</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">性质不成立时，多数技巧不是变慢，而是静默给出错误答案 · 结构本体的归属在姊妹目录 数据结构/</text>

  <text x="20" y="90" font-size="13" font-weight="bold" fill="#2563eb">一、三条主线</text>

  <rect x="20" y="100" width="310" height="80" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="34" y="126" font-size="13.5" font-weight="bold" fill="#3730a3">度量 · 复杂度分析.md</text>
  <text x="34" y="150" font-size="11.5" fill="#3730a3">大 O / 摊还 / 递归树与主定理</text>
  <text x="34" y="170" font-size="11.5" fill="#3730a3">先判「这个解法行不行」</text>

  <rect x="345" y="100" width="310" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="359" y="126" font-size="13.5" font-weight="bold" fill="#334155">组织 · 数据结构/（跨目录）</text>
  <text x="359" y="150" font-size="11.5" fill="#475569">数组 / 树 / 堆 / 哈希 / 图的表示</text>
  <text x="359" y="170" font-size="11.5" fill="#475569">都在姊妹目录，本目录不重复</text>

  <rect x="670" y="100" width="310" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="684" y="126" font-size="13.5" font-weight="bold" fill="#1e3a8a">技巧 · 十个手段（本目录主体）</text>
  <text x="684" y="150" font-size="11.5" fill="#1e3a8a">写不出来往往不是不会写，</text>
  <text x="684" y="170" font-size="11.5" fill="#1e3a8a">而是没认出「问题形状」</text>

  <text x="20" y="206" font-size="13" font-weight="bold" fill="#2563eb">二、十个技巧按「成立性质」分簇（外加横向选型与树应用三篇）</text>

  <rect x="20" y="216" width="232" height="150" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="34" y="242" font-size="13" font-weight="bold" fill="#1e3a8a">① 单调性一族（4 篇）</text>
  <text x="34" y="266" font-size="11.5" fill="#1e3a8a">二分查找 · 双指针</text>
  <text x="34" y="286" font-size="11.5" fill="#1e3a8a">滑动窗口 · 二分答案</text>
  <text x="34" y="310" font-size="11" fill="#475569">⭐ 一次判断就永久排除</text>
  <text x="34" y="328" font-size="11" fill="#475569">一批候选：O(n²) → O(n)</text>

  <rect x="260" y="216" width="232" height="150" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="274" y="242" font-size="13" font-weight="bold" fill="#14532d">② 分治与排序族（4 篇）</text>
  <text x="274" y="266" font-size="11.5" fill="#14532d">递归与分治（母篇）</text>
  <text x="274" y="286" font-size="11.5" fill="#14532d">比较排序 · 非比较排序</text>
  <text x="274" y="310" font-size="11.5" fill="#14532d">快速选择（只需递归一侧）</text>
  <text x="274" y="328" font-size="11" fill="#475569">⚠️ 要求子问题独立且可合并</text>

  <rect x="500" y="216" width="232" height="150" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="514" y="242" font-size="13" font-weight="bold" fill="#78350f">③ 编码与计数（3 篇）</text>
  <text x="514" y="266" font-size="11.5" fill="#78350f">位运算（位独立）</text>
  <text x="514" y="286" font-size="11.5" fill="#78350f">摩尔投票（多数性）</text>
  <text x="514" y="310" font-size="11.5" fill="#78350f">前缀和与差分（端点可逆）</text>
  <text x="514" y="328" font-size="11" fill="#475569">⚠️ 都要「二次验证 / 静态前提」</text>

  <rect x="740" y="216" width="232" height="150" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text x="754" y="242" font-size="13" font-weight="bold" fill="#7c2d12">④ 横向选型与树应用</text>
  <text x="754" y="266" font-size="11.5" fill="#7c2d12">查找与排序对比</text>
  <text x="754" y="286" font-size="11.5" fill="#7c2d12">Top-K问题</text>
  <text x="754" y="310" font-size="11.5" fill="#7c2d12">树与二叉搜索树算法</text>
  <text x="754" y="328" font-size="11" fill="#475569">同题多解之间怎么选</text>

  <text x="20" y="384" font-size="13" font-weight="bold" fill="#2563eb">三、边界与阅读顺序</text>

  <rect x="20" y="394" width="960" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="420" font-size="13.5" font-weight="bold" fill="#0f172a">同一套零件在别处怎么用</text>
  <text x="34" y="444" font-size="12.5" fill="#334155">· 与数据结构（跨目录）：那边讲「怎么存」，本目录只讲「怎么算」——线段树 / 树状数组 / 堆都在姊妹目录</text>
  <text x="34" y="466" font-size="12.5" fill="#334155">· 与动态规划：子问题重叠就走 DP；本目录的分治要求子问题独立，这是两者的分界线</text>
  <text x="34" y="488" font-size="12.5" fill="#334155">· 与贪心：贪心要「局部最优能推全局」；排序往往是贪心与双指针的前置步骤</text>
  <text x="34" y="510" font-size="12.5" fill="#334155">· 与回溯：求「所有解」而不是「最优值」时走回溯；剪枝与可行性判定在那边复用</text>
  <text x="34" y="532" font-size="12" fill="#64748b">⭐ 阅读顺序：先看「度量」定复杂度上限 → 再按问题形状取技巧 → 横向选型两篇负责「同题多解之间怎么选」</text>
</svg>
