<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="1000" height="500" fill="#f7f9fc"/><rect x="0" y="0" width="1000" height="56" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="1.5"/><text x="500.0" y="30" font-size="22" fill="#1f3a5f" text-anchor="middle" font-weight="bold">同一数组上的三种查询</text><text x="500.0" y="50" font-size="13" fill="#5a6b7c" text-anchor="middle" font-weight="normal">arr = [1 3 3 3 5 7]，重复元素的边界最易写错</text><rect x="280" y="130" width="80" height="50" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="320.0" y="162" font-size="18" fill="#22303f" text-anchor="middle" font-weight="normal">1</text><text x="320.0" y="116" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">下标 0</text><rect x="370" y="130" width="80" height="50" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="410.0" y="162" font-size="18" fill="#22303f" text-anchor="middle" font-weight="normal">3</text><text x="410.0" y="116" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">下标 1</text><rect x="460" y="130" width="80" height="50" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="500.0" y="162" font-size="18" fill="#22303f" text-anchor="middle" font-weight="normal">3</text><text x="500.0" y="116" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">下标 2</text><rect x="550" y="130" width="80" height="50" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="590.0" y="162" font-size="18" fill="#22303f" text-anchor="middle" font-weight="normal">3</text><text x="590.0" y="116" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">下标 3</text><rect x="640" y="130" width="80" height="50" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="680.0" y="162" font-size="18" fill="#22303f" text-anchor="middle" font-weight="normal">5</text><text x="680.0" y="116" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">下标 4</text><rect x="730" y="130" width="80" height="50" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="770.0" y="162" font-size="18" fill="#22303f" text-anchor="middle" font-weight="normal">7</text><text x="770.0" y="116" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">下标 5</text><line x1="410.0" y1="192" x2="410.0" y2="240" stroke="#2e7d32" stroke-width="2"/><text x="410.0" y="260" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold">lowerBound(3) = 1</text><text x="410.0" y="280" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">第一个 ≥ 3</text><line x1="680.0" y1="192" x2="680.0" y2="240" stroke="#c62828" stroke-width="2"/><text x="680.0" y="260" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">upperBound(3) = 4</text><text x="680.0" y="280" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">第一个 &gt; 3</text><rect x="60" y="320" width="400" height="150" rx="8" fill="#e8f0fb" stroke="#9db4d0" stroke-width="1.5"/><text x="260" y="350" font-size="15" fill="#1f3a5f" text-anchor="middle" font-weight="bold">由两个边界推出的事实</text><text x="80" y="382" font-size="14" fill="#22303f" text-anchor="start" font-weight="normal">· 等于 3 的元素个数 = 4 − 1 = 3</text><text x="80" y="410" font-size="14" fill="#22303f" text-anchor="start" font-weight="normal">· 若 lowerBound == upperBound，则 3 不存在</text><text x="80" y="438" font-size="14" fill="#22303f" text-anchor="start" font-weight="normal">· 插入位置可选 lowerBound（保持稳定）</text><rect x="520" y="320" width="420" height="150" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="730" y="350" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">标准库就是这两个函数</text><text x="540" y="382" font-size="13" fill="#22303f" text-anchor="start" font-weight="normal">· C++ std::lower_bound / upper_bound</text><text x="540" y="410" font-size="13" fill="#22303f" text-anchor="start" font-weight="normal">· Go sort.SearchInts 等价于 lowerBound</text><text x="540" y="438" font-size="13" fill="#22303f" text-anchor="start" font-weight="normal">· Java Arrays.binarySearch 命中重复元素位置不定</text><rect x="50" y="456" width="900" height="34" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="500" y="478" font-size="13" fill="#c62828" text-anchor="middle" font-weight="normal">⚠️ 存在性查询返回一个下标即可；但要「第一个/最后一个」就必须用边界模板</text></svg>