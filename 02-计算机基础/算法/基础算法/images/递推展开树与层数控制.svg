<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">递推展开树：复杂度 = 每层代价 × 层数，差距全在"层数"上</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">与第五节表格与三形状示意一一对应；n、n/2、n-1 为符号刻度（结构性质，非计时读数）</text>

  <rect x="20" y="76" width="228" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="34" y="100" font-size="14" font-weight="bold" fill="#0f172a">二分查找：一根斜线</text>
  <line x1="86" y1="132" x2="120" y2="182" stroke="#64748b" stroke-width="1.6"/>
  <line x1="124" y1="198" x2="158" y2="248" stroke="#64748b" stroke-width="1.6"/>
  <line x1="162" y1="264" x2="196" y2="314" stroke="#64748b" stroke-width="1.6"/>
  <circle cx="76" cy="124" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="76" y="128" text-anchor="middle" font-size="10" fill="#1e40af">n</text>
  <circle cx="126" cy="190" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="126" y="194" text-anchor="middle" font-size="10" fill="#1e40af">n/2</text>
  <circle cx="176" cy="256" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="176" y="260" text-anchor="middle" font-size="10" fill="#1e40af">n/4</text>
  <circle cx="204" cy="322" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="204" y="326" text-anchor="middle" font-size="9" fill="#1e40af">1</text>
  <text x="34" y="352" font-size="10.5" fill="#0f172a">每层只递归一边：每层 O(1)</text>
  <text x="34" y="368" font-size="10.5" fill="#0f172a">× log n 层 = O(log n)</text>

  <rect x="264" y="76" width="228" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="278" y="100" font-size="14" font-weight="bold" fill="#0f172a">归并：满二叉、永远平衡</text>
  <circle cx="378" cy="130" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="378" y="134" text-anchor="middle" font-size="10" fill="#166534">n</text>
  <line x1="366" y1="144" x2="326" y2="186" stroke="#64748b" stroke-width="1.6"/>
  <line x1="390" y1="144" x2="430" y2="186" stroke="#64748b" stroke-width="1.6"/>
  <circle cx="318" cy="198" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="318" y="202" text-anchor="middle" font-size="10" fill="#166534">n/2</text>
  <circle cx="438" cy="198" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="438" y="202" text-anchor="middle" font-size="10" fill="#166534">n/2</text>
  <line x1="310" y1="212" x2="284" y2="248" stroke="#64748b" stroke-width="1.6"/>
  <line x1="326" y1="212" x2="352" y2="248" stroke="#64748b" stroke-width="1.6"/>
  <line x1="430" y1="212" x2="404" y2="248" stroke="#64748b" stroke-width="1.6"/>
  <line x1="446" y1="212" x2="472" y2="248" stroke="#64748b" stroke-width="1.6"/>
  <circle cx="278" cy="258" r="13" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="278" y="262" text-anchor="middle" font-size="9" fill="#166534">n/4</text>
  <circle cx="358" cy="258" r="13" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="358" y="262" text-anchor="middle" font-size="9" fill="#166534">n/4</text>
  <circle cx="398" cy="258" r="13" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="398" y="262" text-anchor="middle" font-size="9" fill="#166534">n/4</text>
  <circle cx="478" cy="258" r="13" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="478" y="262" text-anchor="middle" font-size="9" fill="#166534">n/4</text>
  <text x="378" y="300" text-anchor="middle" font-size="12" fill="#64748b">… 共 log n 层 …</text>
  <text x="278" y="334" font-size="10.5" fill="#0f172a">同层加起来就是 n 个元素：每层 O(n)</text>
  <text x="278" y="352" font-size="10.5" fill="#0f172a">× log n 层 = O(n log n)，不会退化</text>
  <text x="278" y="368" font-size="10.5" fill="#64748b">宽度抵消深度</text>

  <rect x="508" y="76" width="228" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="522" y="100" font-size="14" font-weight="bold" fill="#0f172a">快排：划分均匀时</text>
  <circle cx="622" cy="130" r="17" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="622" y="134" text-anchor="middle" font-size="10" fill="#9a3412">n</text>
  <line x1="610" y1="144" x2="570" y2="186" stroke="#64748b" stroke-width="1.6"/>
  <line x1="634" y1="144" x2="674" y2="186" stroke="#64748b" stroke-width="1.6"/>
  <circle cx="562" cy="198" r="15" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="562" y="202" text-anchor="middle" font-size="10" fill="#9a3412">n/2</text>
  <circle cx="682" cy="198" r="15" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="682" y="202" text-anchor="middle" font-size="10" fill="#9a3412">n/2</text>
  <line x1="554" y1="212" x2="528" y2="248" stroke="#64748b" stroke-width="1.6"/>
  <line x1="570" y1="212" x2="596" y2="248" stroke="#64748b" stroke-width="1.6"/>
  <line x1="674" y1="212" x2="648" y2="248" stroke="#64748b" stroke-width="1.6"/>
  <line x1="690" y1="212" x2="716" y2="248" stroke="#64748b" stroke-width="1.6"/>
  <circle cx="522" cy="258" r="13" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="522" y="262" text-anchor="middle" font-size="9" fill="#9a3412">n/4</text>
  <circle cx="602" cy="258" r="13" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="602" y="262" text-anchor="middle" font-size="9" fill="#9a3412">n/4</text>
  <circle cx="642" cy="258" r="13" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="642" y="262" text-anchor="middle" font-size="9" fill="#9a3412">n/4</text>
  <circle cx="722" cy="258" r="13" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="722" y="262" text-anchor="middle" font-size="9" fill="#9a3412">n/4</text>
  <text x="622" y="300" text-anchor="middle" font-size="12" fill="#64748b">… log n 层 …</text>
  <text x="522" y="334" font-size="10.5" fill="#0f172a">划分扫描整层：每层 O(n)</text>
  <text x="522" y="352" font-size="10.5" fill="#0f172a">× log n 层 = 平均 O(n log n)</text>
  <text x="522" y="368" font-size="10.5" fill="#64748b">与归并同形，但每层是"原地扫"</text>

  <rect x="752" y="76" width="228" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="766" y="100" font-size="14" font-weight="bold" fill="#0f172a">快排：每次取到极值</text>
  <circle cx="816" cy="128" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="816" y="132" text-anchor="middle" font-size="9" fill="#991b1b">n</text>
  <line x1="828" y1="138" x2="852" y2="176" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="864" y1="190" x2="888" y2="228" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="900" y1="242" x2="924" y2="280" stroke="#dc2626" stroke-width="1.6"/>
  <circle cx="860" cy="186" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="860" y="190" text-anchor="middle" font-size="9" fill="#991b1b">n-1</text>
  <circle cx="896" cy="238" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="896" y="242" text-anchor="middle" font-size="9" fill="#991b1b">n-2</text>
  <circle cx="932" cy="290" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="932" y="294" text-anchor="middle" font-size="9" fill="#991b1b">…</text>
  <text x="766" y="330" font-size="10.5" fill="#0f172a">每层只切掉 1 个：树高变成 n</text>
  <text x="766" y="348" font-size="10.5" fill="#0f172a">每层仍 O(n) × n 层 = O(n²)</text>
  <text x="766" y="366" font-size="10.5" fill="#64748b">所以快排优化都在"控层数"</text>

  <text x="500" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">主定理直觉：子问题总量涨得比根层快 → 叶子主导；根层快 → 根主导；持平 → 多一个 log 因子</text>
  <text x="500" y="436" text-anchor="middle" font-size="11.5" fill="#64748b">快排与归并每层代价同为 O(n)，全部差距来自层数（log n 还是 n）——随机 pivot / 三数取中 / 深度上限转堆排都是层数控制手段</text>
</svg>
