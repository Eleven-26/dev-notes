<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">验证 BST：为什么「只比较父子」一定会漏判</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">同一棵反例树，左图是错解（每对父子都合规），右图是正确解法（把上下界一路传下去）</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="460" height="530" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">❌ 错解：只检查每一对父子（大小关系局部成立）</text>

    <line x1="230" y1="150" x2="160" y2="225" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="230" y1="150" x2="300" y2="225" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="225" x2="200" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="230" cy="150" r="17" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="230" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">10</text>
    <circle cx="160" cy="225" r="17" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="160" y="225" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">5</text>
    <circle cx="300" cy="225" r="17" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="300" y="225" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">15</text>
    <circle cx="200" cy="300" r="17" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="200" y="300" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#7f1d1d">12</text>

    <text x="260" y="292" font-size="12" fill="#7f1d1d">← 12 挂在 5 的右边</text>
    <text x="260" y="312" font-size="12" fill="#7f1d1d">局部判据 12 &gt; 5 通过</text>
    <text x="260" y="332" font-size="12" fill="#7f1d1d">但它比祖先 10 还大</text>

    <text x="16" y="366" font-size="12.5" fill="#334155">错解的检查清单（逐条都「通过」）：</text>
    <text x="16" y="390" font-size="12" fill="#14532d">5 &lt; 10 ✅　　15 &gt; 10 ✅　　12 &gt; 5 ✅</text>
    <text x="16" y="414" font-size="12.5" fill="#b45309">→ 错解返回 true，把这棵「不是 BST」的树判成了 BST</text>
    <rect x="16" y="430" width="428" height="74" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="30" y="452" font-size="12.5" fill="#7f1d1d">本机实测：只比较父子节点 → true（错）</text>
    <text x="30" y="474" font-size="12.5" fill="#7f1d1d">中序遍历：[5 12 10 15] —— 不是升序，铁证</text>
    <text x="30" y="494" font-size="11.5" fill="#7f1d1d">⚠️ 漏判是「静默」的：不报错、不崩溃，只是悄悄放行错数据</text>
    <text x="16" y="524" font-size="12" fill="#64748b">根因：BST 的性质是「相对整棵子树」的，不是「相对父节点」的。</text>
  </g>

  <g transform="translate(520,70)">
    <rect x="0" y="0" width="460" height="530" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">✅ 正解：把 (下界, 上界) 一路传下去</text>
    <text x="16" y="52" font-size="12" fill="#64748b">每个节点都必须落进「祖先传下来的开区间」里</text>

    <line x1="230" y1="150" x2="160" y2="225" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="230" y1="150" x2="300" y2="225" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="225" x2="200" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="230" cy="150" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="230" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#1e40af">10</text>
    <circle cx="160" cy="225" r="17" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="160" y="225" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">5</text>
    <circle cx="300" cy="225" r="17" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="300" y="225" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">15</text>
    <circle cx="200" cy="300" r="17" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="200" y="300" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#7f1d1d">12</text>

    <text x="258" y="146" font-size="11.5" fill="#1e40af">区间 (−∞, +∞)</text>
    <text x="16" y="221" font-size="11.5" fill="#334155">(−∞, 10)</text>
    <text x="330" y="221" font-size="11.5" fill="#334155">(10, +∞)</text>
    <text x="228" y="304" font-size="11.5" fill="#7f1d1d">(5, 10) ← 12 落在区间外</text>

    <text x="16" y="352" font-size="12.5" fill="#1e40af">传递规则（递归参数就是这两个界）：</text>
    <text x="16" y="376" font-size="12" fill="#334155">左子树：上界收紧为当前值 → (lo, node.val)</text>
    <text x="16" y="398" font-size="12" fill="#334155">右子树：下界收紧为当前值 → (node.val, hi)</text>
    <text x="16" y="420" font-size="12" fill="#334155">进入节点先判：node.val 必须严格落在 (lo, hi) 内</text>

    <rect x="16" y="438" width="428" height="68" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
    <text x="30" y="460" font-size="12.5" fill="#14532d">本机实测：上下界法 → false（正确抓到 12 越界）</text>
    <text x="30" y="482" font-size="12" fill="#14532d">中序遍历 [5 12 10 15] 不是升序，与判定结果一致 ✅</text>
    <text x="30" y="500" font-size="11.5" fill="#334155">另一条等价路线：中序遍历必须严格递增（但要小心「相等值」的题设）</text>
    <text x="16" y="524" font-size="12" fill="#64748b">⭐ 同一套「带上下界往下传」的写法，也用于「求 BST 第 k 小 / 修剪 BST」。</text>
  </g>
</svg>
