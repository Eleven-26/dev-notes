<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 672" font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="1000" height="672" fill="#f7f9fc"/><rect x="0" y="0" width="1000" height="56" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="1.5"/><text x="500.0" y="30" font-size="22" fill="#1f3a5f" text-anchor="middle" font-weight="bold">位掩码的四个基本操作</text><text x="500.0" y="50" font-size="13" fill="#5a6b7c" text-anchor="middle" font-weight="normal">以 8 位为例，x 初始 = 0000 1010</text><rect x="70" y="100" width="860" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="240" y="134" font-size="17" fill="#2e7d32" text-anchor="middle" font-weight="bold">置位 bit i</text><text x="240" y="162" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal">x | (1 &lt;&lt; i)</text><text x="560" y="134" font-size="14" fill="#5a6b7c" text-anchor="middle" font-weight="normal">把第 i 位变成 1</text><text x="560" y="166" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">0000 1010  | 0000 0001 → 0000 1011</text><rect x="70" y="216" width="860" height="100" rx="8" fill="#e8f0fb" stroke="#9db4d0" stroke-width="1.5"/><text x="240" y="250" font-size="17" fill="#9db4d0" text-anchor="middle" font-weight="bold">清位 bit i</text><text x="240" y="278" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal">x &amp; ~(1 &lt;&lt; i)</text><text x="560" y="250" font-size="14" fill="#5a6b7c" text-anchor="middle" font-weight="normal">把第 i 位变成 0</text><text x="560" y="282" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">0000 1010  &amp; 1111 1101 → 0000 1000</text><rect x="70" y="332" width="860" height="100" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="240" y="366" font-size="17" fill="#e65100" text-anchor="middle" font-weight="bold">取位 bit i</text><text x="240" y="394" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal">(x &gt;&gt; i) &amp; 1</text><text x="560" y="366" font-size="14" fill="#5a6b7c" text-anchor="middle" font-weight="normal">读出第 i 位是 0 还是 1</text><text x="560" y="398" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">x = 0000 1010，取 bit3：(x&gt;&gt;3)&amp;1 → 1</text><rect x="70" y="448" width="860" height="100" rx="8" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/><text x="240" y="482" font-size="17" fill="#6a1b9a" text-anchor="middle" font-weight="bold">翻转 bit i</text><text x="240" y="510" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal">x ^ (1 &lt;&lt; i)</text><text x="560" y="482" font-size="14" fill="#5a6b7c" text-anchor="middle" font-weight="normal">第 i 位取反</text><text x="560" y="514" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">0000 1010  ^ 0000 1000 → 0000 0010</text><rect x="70" y="564" width="860" height="88" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="500" y="594" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold">工程用法：权限位 RWX=4/2/1（一个整数存一套开关）</text><text x="500" y="620" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">状态压缩：一个 int 的 32 位表示 32 个开关；标志合并：flags = A | B | C</text><text x="500" y="642" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">判 2 的幂：n &gt; 0 &amp;&amp; (n &amp; (n-1)) == 0（漏掉 n&gt;0 会把 0 判成真）</text></svg>