<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">快速选择的代价形态：规模等比收缩 → 总比较 ≤ 2n</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">条形长度 = 每轮要扫的元素个数；平均与最坏的差别只在每轮切得多匀</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="170" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 平均情形：每轮规模约减半（随机 pivot 保证）</text>

    <text x="14" y="70" font-size="10" fill="#334155">第 1 轮</text>
    <rect x="60" y="52" width="800" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="68" y="69" font-size="10" fill="#1e40af">比较约 n 次</text>
    <text x="14" y="102" font-size="10" fill="#334155">第 2 轮</text>
    <rect x="60" y="84" width="400" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="68" y="101" font-size="10" fill="#1e40af">n/2</text>
    <text x="14" y="134" font-size="10" fill="#334155">第 3 轮</text>
    <rect x="60" y="116" width="200" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="68" y="133" font-size="10" fill="#1e40af">n/4</text>
    <text x="480" y="133" font-size="10" fill="#64748b">… 一直减半，区间缩到 1 个元素</text>
    <text x="60" y="160" font-size="11" font-weight="bold" fill="#14532d">总比较 = n + n/2 + n/4 + … ≤ 2n → 平均 O(n)（正文第三节）</text>
  </g>

  <g transform="translate(20,264)">
    <rect x="0" y="0" width="960" height="170" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 最坏情形：每次分区只切掉 1 个</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">触发：有序输入 + 固定取端点做 pivot —— 随机选 pivot 正是为了防这一条（正文第二节）</text>

    <rect x="60" y="56" width="800" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="6"/>
    <text x="68" y="71" font-size="10" fill="#991b1b">n</text>
    <rect x="60" y="80" width="760" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="6"/>
    <text x="68" y="95" font-size="10" fill="#991b1b">n-1</text>
    <rect x="60" y="104" width="720" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="6"/>
    <text x="68" y="119" font-size="10" fill="#991b1b">n-2</text>
    <rect x="60" y="128" width="680" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="6"/>
    <text x="68" y="143" font-size="10" fill="#991b1b">…</text>
    <text x="770" y="143" font-size="10" fill="#64748b">每层只剥掉 1 个，几乎不缩</text>
    <text x="60" y="162" font-size="11" font-weight="bold" fill="#991b1b">n + (n-1) + … + 1 = n(n+1)/2 → 最坏 O(n²)</text>
  </g>

  <g transform="translate(20,454)">
    <rect x="0" y="0" width="960" height="108" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">C. 正文手推实例的真实收缩：5 → 3 → 2</text>

    <rect x="120" y="40" width="380" height="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="128" y="58" font-size="10" fill="#1e40af">第1轮 [0,4] = 5 个</text>
    <rect x="500" y="40" width="228" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="508" y="58" font-size="10" fill="#14532d">第2轮 [0,2] = 3 个</text>
    <rect x="728" y="40" width="152" height="26" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="736" y="58" font-size="10" fill="#92400e">第3轮 [1,2] = 2</text>
    <text x="20" y="58" font-size="10" fill="#334155">规模</text>
    <text x="120" y="92" font-size="11" font-weight="bold" fill="#14532d">总比较 5 + 3 + 2 = 10 = 2n —— 例子恰好贴着「≤ 2n」这条上界（区间抄自正文第二节手推）</text>
  </g>
</svg>
