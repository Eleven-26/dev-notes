<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">答案轴上的真假分界：二分的对象是答案的取值</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">check 把整条答案轴切成「假 | 真」两段，二分只是去夹那道分界线</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="196" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 答案轴：check 把取值区间切成「假 | 真」</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">与正文第二节手推同例：区间 [1,10]，check(mid) 当且仅当 mid ≥ 7 为真</text>

    <rect x="30" y="60" width="84" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="72" y="85" text-anchor="middle" font-size="13" fill="#991b1b">1</text>
    <text x="72" y="116" text-anchor="middle" font-size="10" fill="#991b1b">假</text>
    <rect x="122" y="60" width="84" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="164" y="85" text-anchor="middle" font-size="13" fill="#991b1b">2</text>
    <text x="164" y="116" text-anchor="middle" font-size="10" fill="#991b1b">假</text>
    <rect x="214" y="60" width="84" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="256" y="85" text-anchor="middle" font-size="13" fill="#991b1b">3</text>
    <text x="256" y="116" text-anchor="middle" font-size="10" fill="#991b1b">假</text>
    <rect x="306" y="60" width="84" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="348" y="85" text-anchor="middle" font-size="13" fill="#991b1b">4</text>
    <text x="348" y="116" text-anchor="middle" font-size="10" fill="#991b1b">假</text>
    <rect x="398" y="60" width="84" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="440" y="85" text-anchor="middle" font-size="13" fill="#991b1b">5</text>
    <text x="440" y="116" text-anchor="middle" font-size="10" fill="#991b1b">假</text>
    <rect x="490" y="60" width="84" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="8"/>
    <text x="532" y="85" text-anchor="middle" font-size="13" fill="#991b1b">6</text>
    <text x="532" y="116" text-anchor="middle" font-size="10" fill="#991b1b">假</text>
    <rect x="582" y="60" width="84" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/>
    <text x="624" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">7</text>
    <text x="624" y="116" text-anchor="middle" font-size="10" fill="#14532d">真</text>
    <rect x="674" y="60" width="84" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="716" y="85" text-anchor="middle" font-size="13" fill="#14532d">8</text>
    <text x="716" y="116" text-anchor="middle" font-size="10" fill="#14532d">真</text>
    <rect x="766" y="60" width="84" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="808" y="85" text-anchor="middle" font-size="13" fill="#14532d">9</text>
    <text x="808" y="116" text-anchor="middle" font-size="10" fill="#14532d">真</text>
    <rect x="858" y="60" width="84" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="900" y="85" text-anchor="middle" font-size="13" fill="#14532d">10</text>
    <text x="900" y="116" text-anchor="middle" font-size="10" fill="#14532d">真</text>

    <line x1="578" y1="54" x2="578" y2="132" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="578" y="148" text-anchor="middle" font-size="10.5" fill="#dc2626">分界 = 第一个真</text>
    <text x="30" y="178" font-size="10" fill="#334155">手推：lo=1 hi=10 → mid=5(假) lo=6 → mid=8(真) hi=8 → mid=7(真) hi=7 → mid=6(假) lo=7 → lo==hi 返回 7</text>
  </g>

  <g transform="translate(20,286)">
    <rect x="0" y="0" width="960" height="150" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 同一根轴，两种停法：找最左真，还是找最右真</text>

    <rect x="14" y="44" width="454" height="98" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="28" y="66" font-size="11.5" font-weight="bold" fill="#1e40af">最小满足 = 最左边的真（正文 3.1）</text>
    <text x="28" y="88" font-size="10.5" fill="#1e40af">check 真 → hi = mid；假 → lo = mid + 1</text>
    <text x="28" y="108" font-size="10.5" fill="#1e40af">mid 下取整即可，lo == hi 时停</text>
    <text x="28" y="128" font-size="10.5" fill="#1e40af">轴形态：左假右真 —— mid 越大越容易满足</text>

    <rect x="488" y="44" width="458" height="98" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="8"/>
    <text x="502" y="66" font-size="11.5" font-weight="bold" fill="#92400e">最大满足 = 最右边的真（正文 3.2）</text>
    <text x="502" y="88" font-size="10.5" fill="#92400e">check 真 → lo = mid；假 → hi = mid - 1</text>
    <text x="502" y="108" font-size="10.5" fill="#92400e">⚠️ mid 必须上取整 (lo + hi + 1) / 2，否则死循环</text>
    <text x="502" y="128" font-size="10.5" fill="#92400e">轴形态：左真右假 —— mid 越小越容易满足</text>
  </g>
</svg>
