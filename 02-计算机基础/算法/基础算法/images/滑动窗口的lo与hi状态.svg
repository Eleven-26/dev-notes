<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">滑动窗口每一步的 lo / hi 状态</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">以 s = "pwwkew" 为例：右侧扩张 → 不满足条件时左侧收缩 → 更新答案。窗口是左闭右开 [lo, hi)</text>

  <text x="40" y="96" font-size="13" fill="#475569">索引</text>
  <text x="181" y="96" text-anchor="middle" font-size="13" fill="#94a3b8">0</text>
  <text x="251" y="96" text-anchor="middle" font-size="13" fill="#94a3b8">1</text>
  <text x="321" y="96" text-anchor="middle" font-size="13" fill="#94a3b8">2</text>
  <text x="391" y="96" text-anchor="middle" font-size="13" fill="#94a3b8">3</text>
  <text x="461" y="96" text-anchor="middle" font-size="13" fill="#94a3b8">4</text>
  <text x="531" y="96" text-anchor="middle" font-size="13" fill="#94a3b8">5</text>

  <g>
    <text x="40" y="146" font-size="13" font-weight="bold" fill="#334155">hi=0</text>
    <rect x="150" y="120" width="62" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="181" y="146" text-anchor="middle" font-size="16" fill="#1e3a8a">p</text>
    <rect x="220" y="120" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="251" y="146" text-anchor="middle" font-size="16" fill="#64748b">w</text>
    <rect x="290" y="120" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="321" y="146" text-anchor="middle" font-size="16" fill="#64748b">w</text>
    <rect x="360" y="120" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="391" y="146" text-anchor="middle" font-size="16" fill="#64748b">k</text>
    <rect x="430" y="120" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="461" y="146" text-anchor="middle" font-size="16" fill="#64748b">e</text>
    <rect x="500" y="120" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="531" y="146" text-anchor="middle" font-size="16" fill="#64748b">w</text>
    <text x="181" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">lo</text>
    <text x="600" y="138" font-size="13" fill="#334155">窗口[0,1)="p"　计数 {p:1}</text>
    <text x="600" y="158" font-size="13" font-weight="bold" fill="#2563eb">best = 1</text>
  </g>

  <g>
    <text x="40" y="224" font-size="13" font-weight="bold" fill="#334155">hi=1</text>
    <rect x="150" y="198" width="62" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="181" y="224" text-anchor="middle" font-size="16" fill="#1e3a8a">p</text>
    <rect x="220" y="198" width="62" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="251" y="224" text-anchor="middle" font-size="16" fill="#1e3a8a">w</text>
    <rect x="290" y="198" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="321" y="224" text-anchor="middle" font-size="16" fill="#64748b">w</text>
    <rect x="360" y="198" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="391" y="224" text-anchor="middle" font-size="16" fill="#64748b">k</text>
    <rect x="430" y="198" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="461" y="224" text-anchor="middle" font-size="16" fill="#64748b">e</text>
    <rect x="500" y="198" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="531" y="224" text-anchor="middle" font-size="16" fill="#64748b">w</text>
    <text x="181" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">lo</text>
    <text x="251" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">hi</text>
    <text x="600" y="216" font-size="13" fill="#334155">窗口[0,2)="pw"　计数 {p:1 w:1}</text>
    <text x="600" y="236" font-size="13" font-weight="bold" fill="#2563eb">best = 2</text>
  </g>

  <g>
    <text x="40" y="302" font-size="13" font-weight="bold" fill="#b91c1c">hi=2</text>
    <rect x="150" y="276" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="181" y="302" text-anchor="middle" font-size="16" fill="#94a3b8">p</text>
    <rect x="220" y="276" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="251" y="302" text-anchor="middle" font-size="16" fill="#94a3b8">w</text>
    <rect x="290" y="276" width="62" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="321" y="302" text-anchor="middle" font-size="16" fill="#1e3a8a">w</text>
    <rect x="360" y="276" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="391" y="302" text-anchor="middle" font-size="16" fill="#64748b">k</text>
    <rect x="430" y="276" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="461" y="302" text-anchor="middle" font-size="16" fill="#64748b">e</text>
    <rect x="500" y="276" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="531" y="302" text-anchor="middle" font-size="16" fill="#64748b">w</text>
    <text x="321" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">lo</text>
    <text x="321" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">hi</text>
    <text x="600" y="294" font-size="13" fill="#334155">窗口[2,3)="w"　计数 {w:1}</text>
    <text x="600" y="314" font-size="13" font-weight="bold" fill="#2563eb">best = 2</text>
    <text x="600" y="334" font-size="13" fill="#b91c1c">重复 w → while 收缩到 lo=2</text>
  </g>

  <g>
    <text x="40" y="380" font-size="13" font-weight="bold" fill="#334155">hi=3</text>
    <rect x="150" y="354" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="181" y="380" text-anchor="middle" font-size="16" fill="#94a3b8">p</text>
    <rect x="220" y="354" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="251" y="380" text-anchor="middle" font-size="16" fill="#94a3b8">w</text>
    <rect x="290" y="354" width="62" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="321" y="380" text-anchor="middle" font-size="16" fill="#1e3a8a">w</text>
    <rect x="360" y="354" width="62" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="391" y="380" text-anchor="middle" font-size="16" fill="#1e3a8a">k</text>
    <rect x="430" y="354" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="461" y="380" text-anchor="middle" font-size="16" fill="#64748b">e</text>
    <rect x="500" y="354" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="531" y="380" text-anchor="middle" font-size="16" fill="#64748b">w</text>
    <text x="321" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">lo</text>
    <text x="391" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">hi</text>
    <text x="600" y="372" font-size="13" fill="#334155">窗口[2,4)="wk"　计数 {k:1 w:1}</text>
    <text x="600" y="392" font-size="13" font-weight="bold" fill="#2563eb">best = 2</text>
  </g>

  <g>
    <text x="40" y="458" font-size="13" font-weight="bold" fill="#334155">hi=4</text>
    <rect x="150" y="432" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="181" y="458" text-anchor="middle" font-size="16" fill="#94a3b8">p</text>
    <rect x="220" y="432" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="251" y="458" text-anchor="middle" font-size="16" fill="#94a3b8">w</text>
    <rect x="290" y="432" width="62" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="321" y="458" text-anchor="middle" font-size="16" fill="#1e3a8a">w</text>
    <rect x="360" y="432" width="62" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="391" y="458" text-anchor="middle" font-size="16" fill="#1e3a8a">k</text>
    <rect x="430" y="432" width="62" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="461" y="458" text-anchor="middle" font-size="16" fill="#1e3a8a">e</text>
    <rect x="500" y="432" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="531" y="458" text-anchor="middle" font-size="16" fill="#64748b">w</text>
    <text x="321" y="488" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">lo</text>
    <text x="461" y="488" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">hi</text>
    <text x="600" y="450" font-size="13" fill="#334155">窗口[2,5)="wke"　计数 {e:1 k:1 w:1}</text>
    <text x="600" y="470" font-size="13" font-weight="bold" fill="#16a34a">best = 3（答案出现）</text>
  </g>

  <g>
    <text x="40" y="536" font-size="13" font-weight="bold" fill="#b91c1c">hi=5</text>
    <rect x="150" y="510" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="181" y="536" text-anchor="middle" font-size="16" fill="#94a3b8">p</text>
    <rect x="220" y="510" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="251" y="536" text-anchor="middle" font-size="16" fill="#94a3b8">w</text>
    <rect x="290" y="510" width="62" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="321" y="536" text-anchor="middle" font-size="16" fill="#94a3b8">w</text>
    <rect x="360" y="510" width="62" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="391" y="536" text-anchor="middle" font-size="16" fill="#1e3a8a">k</text>
    <rect x="430" y="510" width="62" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="461" y="536" text-anchor="middle" font-size="16" fill="#1e3a8a">e</text>
    <rect x="500" y="510" width="62" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="531" y="536" text-anchor="middle" font-size="16" fill="#1e3a8a">w</text>
    <text x="391" y="566" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">lo</text>
    <text x="531" y="566" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">hi</text>
    <text x="600" y="528" font-size="13" fill="#334155">窗口[3,6)="kew"　计数 {e:1 k:1 w:1}</text>
    <text x="600" y="548" font-size="13" font-weight="bold" fill="#2563eb">best = 3（不变）</text>
    <text x="600" y="568" font-size="13" fill="#b91c1c">重复 w → while 收缩到 lo=3</text>
  </g>

  <line x1="40" y1="596" x2="960" y2="596" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="624" font-size="13" fill="#334155">1. lo 与 hi 都只增不减 —— 这是 O(n) 的来源：两个指针合计最多移动 2n 次</text>
  <text x="40" y="648" font-size="13" fill="#334155">2. 收缩必须用 while：hi=2 与 hi=5 各收缩了两次，写成 if 只收缩一次，窗口会保持非法状态</text>
  <text x="40" y="672" font-size="13" fill="#b91c1c">3. best 在收缩之后更新（窗口内判断），而不是在扩张之前 —— 顺序反了会读到非法窗口的长度</text>
  <text x="40" y="700" font-size="12" fill="#94a3b8">本图对应正文第二节，数值与 .workbuddy/tmp/basic_lab 的实测输出逐行一致。⚠️ 本机无法栅格化 SVG，需要 PNG 时请自行导出。</text>
</svg>
