<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>

  <text x="20" y="30" font-size="20" font-weight="bold" fill="#0f172a">同一份数组两种查找：顺序逐格比 6 次命中 vs 二分 2 步命中 / 3 步逼空</text>

  <rect x="16" y="44" width="968" height="176" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="32" y="70" font-size="16" font-weight="bold" fill="#1e293b">面板 A：顺序查找，目标 11，命中前比了 6 次</text>

  <g font-size="13" fill="#64748b" text-anchor="middle">
    <text x="78" y="98">下标 0</text>
    <text x="198" y="98">下标 1</text>
    <text x="318" y="98">下标 2</text>
    <text x="438" y="98">下标 3</text>
    <text x="558" y="98">下标 4</text>
    <text x="678" y="98">下标 5</text>
    <text x="798" y="98">下标 6</text>
    <text x="918" y="98">下标 7</text>
  </g>
  <g stroke-width="1.5">
    <rect x="44" y="106" width="68" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="164" y="106" width="68" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="284" y="106" width="68" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="404" y="106" width="68" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="524" y="106" width="68" height="40" rx="6" fill="#ffedd5" stroke="#ea580c"/>
    <rect x="644" y="106" width="68" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="764" y="106" width="68" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="884" y="106" width="68" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  </g>
  <g font-size="18" font-weight="bold" text-anchor="middle">
    <text x="78" y="132" fill="#334155">1</text>
    <text x="198" y="132" fill="#334155">3</text>
    <text x="318" y="132" fill="#334155">5</text>
    <text x="438" y="132" fill="#334155">7</text>
    <text x="558" y="132" fill="#ea580c">9</text>
    <text x="678" y="132" fill="#16a34a">11</text>
    <text x="798" y="132" fill="#334155">13</text>
    <text x="918" y="132" fill="#334155">15</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="78" y="172" fill="#2563eb">比① 1≠11</text>
    <text x="198" y="172" fill="#2563eb">比② 3≠11</text>
    <text x="318" y="172" fill="#2563eb">比③ 5≠11</text>
    <text x="438" y="172" fill="#2563eb">比④ 7≠11</text>
    <text x="558" y="172" fill="#ea580c">比⑤ 9≠11</text>
    <text x="678" y="172" fill="#16a34a">比⑥ 11=11 命中</text>
    <text x="798" y="172" fill="#94a3b8">不再看</text>
    <text x="918" y="172" fill="#94a3b8">不再看</text>
  </g>
  <path d="M78 152 L 672 152" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrB)"/>
  <text x="375" y="200" font-size="13" fill="#64748b">箭头 = 逐个下标扫描：一路比到下标 5，共 6 次比较；下标 6、7 的值 13、15 根本没被读</text>

  <rect x="16" y="230" width="968" height="196" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="32" y="256" font-size="16" font-weight="bold" fill="#1e293b">面板 B：二分查找，区间 [lo, hi] 每步对半砍</text>

  <g font-size="12" fill="#64748b">
    <text x="44" y="286">目标 11（命中，2 步）</text>
    <text x="44" y="332">目标 8（未命中，3 步逼空）</text>
  </g>

  <rect x="200" y="272" width="600" height="26" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="212" y="290" font-size="12" fill="#1e3a5f">第1步 lo=0 hi=7 mid=3 a[3]=7 &lt; 11 → lo=4</text>
  <rect x="476" y="272" width="324" height="26" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="486" y="290" font-size="12" fill="#14532d">第2步 mid=5 a[5]=11 命中</text>

  <rect x="200" y="318" width="600" height="26" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="212" y="336" font-size="12" fill="#1e3a5f">第1步 mid=3 a[3]=7 &lt; 8 → lo=4</text>
  <rect x="476" y="318" width="324" height="26" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="486" y="336" font-size="12" fill="#1e3a5f">第2步 mid=5 a[5]=11 &gt; 8 → hi=4</text>
  <rect x="480" y="350" width="230" height="24" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="490" y="367" font-size="12" fill="#991b1b">第3步 mid=4 a[4]=9 &gt; 8 → hi=3</text>
  <text x="724" y="367" font-size="12" fill="#dc2626">lo=4 &gt; hi=3 区间为空 → 未命中</text>

  <text x="32" y="404" font-size="13" fill="#64748b">8 个元素最多 log2(8)+1 = 4 步；本例命中只用 2 步，未命中 3 步逼空（hi ← mid-1 把区间挤没）</text>
  <text x="32" y="426" font-size="13" fill="#64748b">前提：数组必须有序 [1 3 5 7 9 11 13 15]；顺序查找不要求有序，但代价是可能扫完全程</text>
  <text x="32" y="446" font-size="12" fill="#94a3b8">数字出处：正文 §1「实测查找」块（Go 1.26.8 容器实测，步数与 a[mid] 读数逐一对应）</text>

  <defs>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
