<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">动态数组的两种生长规则：翻倍扩容 vs 每次 +1</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">口径同第四节：第 k 次扩容时元素数 2^k、拷 2^k 个；条长与拷贝量都是确定算术，可直接手验</text>

  <rect x="20" y="76" width="960" height="168" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="36" y="100" font-size="15" font-weight="bold" fill="#0f172a">A. 翻倍扩容：写满才扩，容量 1 → 2 → 4 → 8 → 16 → 32</text>

  <rect x="60" y="118" width="10" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="136" y="118" width="20" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="240" y="118" width="40" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="368" y="118" width="80" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="536" y="118" width="160" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="784" y="118" width="160" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="65" y="172" font-size="10.5" fill="#64748b">1</text>
  <text x="146" y="172" font-size="10.5" fill="#64748b">2</text>
  <text x="260" y="172" font-size="10.5" fill="#64748b">4</text>
  <text x="408" y="172" font-size="10.5" fill="#64748b">8</text>
  <text x="616" y="172" font-size="10.5" fill="#64748b">16</text>
  <text x="864" y="172" font-size="10.5" fill="#166534">32</text>
  <text x="103" y="140" text-anchor="middle" font-size="10.5" fill="#16a34a">拷1</text>
  <text x="208" y="140" text-anchor="middle" font-size="10.5" fill="#16a34a">拷2</text>
  <text x="320" y="140" text-anchor="middle" font-size="10.5" fill="#16a34a">拷4</text>
  <text x="488" y="140" text-anchor="middle" font-size="10.5" fill="#16a34a">拷8</text>
  <text x="744" y="140" text-anchor="middle" font-size="10.5" fill="#16a34a">拷16</text>
  <text x="36" y="196" font-size="11.5" fill="#0f172a">总拷贝 = 1+2+4+8+16 = 31 &lt; 2n（n=32）——等比级数的和由最后一项主导</text>
  <text x="620" y="212" font-size="10.5" fill="#64748b">绿色 = 最后一次扩容后，平均约一半容量空着</text>

  <rect x="20" y="258" width="960" height="126" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="36" y="282" font-size="15" font-weight="bold" fill="#0f172a">B. 每次只 +1 扩容：满一次拷一次，拷贝量 1+2+3+…+n = n(n+1)/2（第四节原式）</text>
  <rect x="60" y="300" width="12" height="36" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="90" y="300" width="24" height="36" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="132" y="300" width="36" height="36" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="186" y="300" width="48" height="36" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="252" y="300" width="60" height="36" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="66" y="350" font-size="10.5" fill="#64748b">2</text>
  <text x="102" y="350" font-size="10.5" fill="#64748b">3</text>
  <text x="150" y="350" font-size="10.5" fill="#64748b">4</text>
  <text x="210" y="350" font-size="10.5" fill="#64748b">5</text>
  <text x="282" y="350" font-size="10.5" fill="#64748b">6 …</text>
  <text x="400" y="330" font-size="11.5" fill="#0f172a">写到 n=32 共需 1+2+…+31 = 31×32/2 = 496 次拷贝：是翻倍方案（31 次）的 16 倍，且随 n 按 n² 走</text>

  <rect x="60" y="396" width="380" height="42" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="6"/>
  <text x="250" y="414" text-anchor="middle" font-size="11.5" fill="#166534">翻倍：摊到每次插入 ≈ 1 次拷贝 = 摊还 O(1)</text>
  <text x="250" y="432" text-anchor="middle" font-size="11.5" fill="#166534">那一次 O(n) 大拷贝仍在（尾延迟毛刺）</text>

  <rect x="560" y="396" width="380" height="42" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" rx="6"/>
  <text x="750" y="414" text-anchor="middle" font-size="11.5" fill="#991b1b">+1：摊到每次插入 ≈ n/2 次拷贝 = 摊还 O(n)</text>
  <text x="750" y="432" text-anchor="middle" font-size="11.5" fill="#991b1b">倍数增长买的是「总量从 n² 拉回 n」</text>
</svg>
