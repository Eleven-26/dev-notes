<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">n 翻倍（指数类 +1）时，真实耗时涨几倍？——容器 3 轮实测区间</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">golang:1.26-alpine（go1.26.8 linux/amd64）连跑 3 轮，实心柱=轮间中位倍数，须线=最小–最大；只断言趋势</text>

  <rect x="20" y="76" width="640" height="356" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="36" y="100" font-size="15" font-weight="bold" fill="#0f172a">A. 实测涨幅（虚线 = 该量级大 O 预告的倍数）</text>

  <line x1="80" y1="392" x2="620" y2="392" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="66" y="396" text-anchor="end" font-size="10" fill="#64748b">0</text>
  <text x="66" y="340" text-anchor="end" font-size="10" fill="#64748b">1</text>
  <text x="66" y="288" text-anchor="end" font-size="10" fill="#64748b">2</text>
  <text x="66" y="236" text-anchor="end" font-size="10" fill="#64748b">3</text>
  <text x="66" y="184" text-anchor="end" font-size="10" fill="#64748b">4</text>
  <text x="66" y="132" text-anchor="end" font-size="10" fill="#64748b">5</text>
  <line x1="80" y1="336" x2="128" y2="336" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="136" y1="336" x2="544" y2="336" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="552" y1="336" x2="620" y2="336" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="80" y1="284" x2="232" y2="284" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="240" y1="284" x2="336" y2="284" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="344" y1="284" x2="544" y2="284" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="552" y1="284" x2="620" y2="284" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="80" y1="232" x2="440" y2="232" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="448" y1="232" x2="620" y2="232" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="80" y1="180" x2="620" y2="180" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="80" y1="128" x2="620" y2="128" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="100" y="331" width="64" height="61" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="132" y1="326" x2="132" y2="336" stroke="#64748b" stroke-width="1.6"/>
  <text x="132" y="318" text-anchor="middle" font-size="10.5" fill="#0f172a">×1.0</text>
  <text x="132" y="412" text-anchor="middle" font-size="12" fill="#0f172a">O(1)</text>
  <text x="132" y="426" text-anchor="middle" font-size="10" fill="#64748b">10–12ms 平</text>

  <rect x="204" y="281" width="64" height="111" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <line x1="236" y1="260" x2="236" y2="297" stroke="#2563eb" stroke-width="1.6"/>
  <text x="236" y="250" text-anchor="middle" font-size="10.5" fill="#1e40af">×2.2</text>
  <text x="236" y="412" text-anchor="middle" font-size="12" fill="#0f172a">O(n)</text>
  <text x="236" y="426" text-anchor="middle" font-size="10" fill="#64748b">区间 ×1.9–2.5</text>

  <rect x="308" y="277" width="64" height="115" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <line x1="340" y1="263" x2="340" y2="291" stroke="#16a34a" stroke-width="1.6"/>
  <text x="340" y="253" text-anchor="middle" font-size="10.5" fill="#166534">×2.1</text>
  <text x="340" y="412" text-anchor="middle" font-size="12" fill="#0f172a">O(n log n)</text>
  <text x="340" y="426" text-anchor="middle" font-size="10" fill="#64748b">区间 ×1.9–2.4</text>

  <rect x="412" y="227" width="64" height="165" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <line x1="444" y1="198" x2="444" y2="262" stroke="#ea580c" stroke-width="1.6"/>
  <text x="444" y="188" text-anchor="middle" font-size="10.5" fill="#9a3412">×4.0</text>
  <text x="444" y="412" text-anchor="middle" font-size="12" fill="#0f172a">O(n²)</text>
  <text x="444" y="426" text-anchor="middle" font-size="10" fill="#64748b">区间 ×3.6–4.7</text>

  <rect x="516" y="305" width="64" height="87" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <line x1="548" y1="268" x2="548" y2="342" stroke="#dc2626" stroke-width="1.6"/>
  <text x="548" y="258" text-anchor="middle" font-size="10.5" fill="#991b1b">×1.6</text>
  <text x="548" y="412" text-anchor="middle" font-size="12" fill="#0f172a">O(2ⁿ) n+1</text>
  <text x="548" y="426" text-anchor="middle" font-size="10" fill="#64748b">区间 ×1.3–2.0</text>

  <text x="112" y="454" font-size="10.5" fill="#64748b">预告：×1 / ×2 / ×2.0–2.2 / ×4 / ×φ≈1.618 —— 四类趋势全部对上</text>

  <rect x="676" y="76" width="304" height="356" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="692" y="100" font-size="15" font-weight="bold" fill="#0f172a">B. 例外：O(log n) 的"名不副实"</text>
  <text x="692" y="126" font-size="11.5" fill="#0f172a">固定 2e5 次二分，数组 ×8192：</text>
  <text x="692" y="148" font-size="11.5" fill="#1e40af">比较次数只 ×2.3（log2 10→23）</text>
  <text x="692" y="170" font-size="11.5" fill="#991b1b">实测耗时 ×10–13（15→160–204ms）</text>
  <line x1="692" y1="184" x2="960" y2="184" stroke="#cbd5e1" stroke-width="1"/>
  <text x="692" y="206" font-size="11.5" fill="#0f172a">多出来的不是算法变慢，是</text>
  <text x="692" y="226" font-size="11.5" fill="#0f172a">大数组随机访问的 cache miss</text>
  <text x="692" y="246" font-size="11.5" fill="#0f172a">（第七节陷阱①的镜像实例）。</text>
  <rect x="692" y="262" width="272" height="66" fill="#fffbeb" stroke="#b45309" stroke-width="1.2" rx="6"/>
  <text x="704" y="282" font-size="11" font-weight="bold" fill="#9a3412">轮间波动最大单点</text>
  <text x="704" y="300" font-size="11" fill="#9a3412">n=1048576：88.55–128.44ms（±40%）</text>
  <text x="704" y="318" font-size="11" fill="#9a3412">其余各档 ±5–20%，只用于比趋势</text>
  <text x="692" y="356" font-size="11.5" fill="#64748b">定性结论未被推翻：增长仍远慢</text>
  <text x="692" y="376" font-size="11.5" fill="#64748b">于线性的 ×8192（实测表见第八节）</text>

  <text x="500" y="466" text-anchor="middle" font-size="11.5" fill="#0f172a">读数出处：第八节「每档规模 3 轮的单次平均耗时（min–max）」与「实测倍数（3 轮）」两表；倍数由同一轮相邻规模读数相除得到</text>
  <text x="500" y="488" text-anchor="middle" font-size="10.5" fill="#64748b">O(2ⁿ) 档刻度为 n+1 涨幅（非翻倍）；O(n log n) 的预告倍数 2.0–2.2 随 n 缓慢趋近 2</text>
</svg>
