<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="580" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Top-K 解法选型：按「装不装得下」与「要不要精确」两问依次筛</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">默认解永远是「大小为 K 的小顶堆」——它同时解决「装不下」和「流式」两个问题</text>

  <rect x="392" y="74" width="216" height="46" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="500" y="103" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730a3">Top-K：前 K 个是谁？</text>

  <line x1="500" y1="120" x2="500" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="374" y="150" width="252" height="44" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="500" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">数据能全部装进内存吗？</text>

  <line x1="430" y1="194" x2="430" y2="222" stroke="#64748b" stroke-width="1.5"/>
  <line x1="430" y1="222" x2="230" y2="222" stroke="#64748b" stroke-width="1.5"/>
  <line x1="230" y1="222" x2="230" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="300" y="216" font-size="13" font-weight="bold" fill="#16a34a">能</text>

  <line x1="570" y1="194" x2="570" y2="222" stroke="#64748b" stroke-width="1.5"/>
  <line x1="570" y1="222" x2="770" y2="222" stroke="#64748b" stroke-width="1.5"/>
  <line x1="770" y1="222" x2="770" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="676" y="216" font-size="13" font-weight="bold" fill="#ea580c">不能</text>

  <rect x="118" y="250" width="224" height="44" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="230" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">静态 + 只求一次 + 可随机访问？</text>

  <rect x="656" y="250" width="228" height="44" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text x="770" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">允许近似吗？（频次类问题）</text>

  <line x1="180" y1="294" x2="180" y2="326" stroke="#64748b" stroke-width="1.5"/>
  <line x1="180" y1="326" x2="140" y2="326" stroke="#64748b" stroke-width="1.5"/>
  <line x1="140" y1="326" x2="140" y2="356" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="280" y1="294" x2="280" y2="326" stroke="#64748b" stroke-width="1.5"/>
  <line x1="280" y1="326" x2="322" y2="326" stroke="#64748b" stroke-width="1.5"/>
  <line x1="322" y1="326" x2="322" y2="356" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="86" y="350" font-size="12" fill="#334155">是</text>
  <text x="292" y="350" font-size="12" fill="#334155">否</text>

  <rect x="30" y="356" width="220" height="92" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="140" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">快速选择</text>
  <text x="140" y="403" text-anchor="middle" font-size="12" fill="#334155">平均 O(n)（最坏 O(n²)）</text>
  <text x="140" y="422" text-anchor="middle" font-size="12" fill="#334155">会打乱原数组；K 接近 n 反而慢</text>
  <text x="140" y="440" text-anchor="middle" font-size="12" fill="#64748b">静数组、只求一次的首选</text>

  <rect x="264" y="356" width="230" height="92" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="379" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">大小为 K 的小顶堆</text>
  <text x="379" y="403" text-anchor="middle" font-size="12" fill="#334155">O(n log K)，内存只占 O(K)</text>
  <text x="379" y="422" text-anchor="middle" font-size="12" fill="#334155">堆顶当「第 K 大」门槛（O(1) 判断）</text>
  <text x="379" y="440" text-anchor="middle" font-size="12" fill="#64748b">流式 / 多次查询的默认解</text>

  <text x="212" y="470" font-size="12" fill="#0d9488">⭐ 值域小且可映射（年龄 / 分数）→ 计数 / 桶排序也能到 O(n)</text>

  <line x1="710" y1="294" x2="710" y2="326" stroke="#64748b" stroke-width="1.5"/>
  <line x1="710" y1="326" x2="672" y2="326" stroke="#64748b" stroke-width="1.5"/>
  <line x1="672" y1="326" x2="672" y2="356" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="830" y1="294" x2="830" y2="326" stroke="#64748b" stroke-width="1.5"/>
  <line x1="830" y1="326" x2="868" y2="326" stroke="#64748b" stroke-width="1.5"/>
  <line x1="868" y1="326" x2="868" y2="356" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="618" y="350" font-size="12" fill="#334155">允许</text>
  <text x="840" y="350" font-size="12" fill="#334155">不允许</text>

  <rect x="576" y="356" width="192" height="92" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="672" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350f">Space-Saving / Misra-Gries</text>
  <text x="672" y="403" text-anchor="middle" font-size="12" fill="#334155">重元素（只高 / 只低）</text>
  <text x="672" y="422" text-anchor="middle" font-size="12" fill="#334155">真实频次 &gt; N/k 才有保证</text>
  <text x="672" y="440" text-anchor="middle" font-size="12" fill="#64748b">Count-Min Sketch：只高不低</text>

  <rect x="784" y="356" width="196" height="92" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text x="882" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">分片局部堆 + 归并</text>
  <text x="882" y="403" text-anchor="middle" font-size="12" fill="#334155">每片取局部 Top-K</text>
  <text x="882" y="422" text-anchor="middle" font-size="12" fill="#334155">候选池 m×K，再归并</text>
  <text x="882" y="440" text-anchor="middle" font-size="12" fill="#64748b">结果与全局精确解一致</text>

  <rect x="20" y="500" width="960" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="36" y="524" font-size="13" fill="#334155">判据：能不能全装下决定「堆 vs 快速选择 / 桶排序」；要不要精确决定「分片归并 vs 近似结构」；</text>
  <text x="36" y="546" font-size="13" fill="#334155">而「大小为 K 的小顶堆」是跨这两问的默认解 —— 只在「能装下 + 只求一次 + 可随机访问」或「值域小」时才让位。</text>
</svg>
