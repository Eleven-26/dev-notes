30" y="230" width="60" height="36" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="460" y="254" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal">43</text><line x1="460" y1="196" x2="460" y2="230" stroke="#9db4d0" stroke-width="1.5"/><rect x="500" y="230" width="60" height="36" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="530" y="254" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal">3</text><line x1="530" y1="196" x2="530" y2="230" stroke="#9db4d0" stroke-width="1.5"/><rect x="570" y="230" width="60" height="36" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="600" y="254" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal">9</text><line x1="600" y1="196" x2="600" y2="230" stroke="#9db4d0" stroke-width="1.5"/><rect x="640" y="230" width="60" height="36" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="670" y="254" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal">82</text><line x1="670" y1="196" x2="670" y2="230" stroke="#9db4d0" stroke-width="1.5"/><text x="150" y="254" font-size="14" fill="#5a6b7c" text-anchor="middle" font-weight="normal">单元素视为天然有序</text><text x="150" y="300" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">② 治 + ③ 合：两两归并</text><text x="150" y="322" font-size="13" fill="#5a6b7c" text-anchor="middle" font-weight="normal">合并时必须能由两个有序段拼出有序段</text><rect x="290" y="345" width="93" height="36" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="336.5" y="369" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">27,38</text><rect x="395" y="345" width="82" height="36" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="436.0" y="369" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">3,43</text><rect x="489" y="345" width="82" height="36" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>