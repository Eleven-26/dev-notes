<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="1000" height="545" fill="#f7f9fc"/><rect x="0" y="0" width="1000" height="56" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="1.5"/><text x="500.0" y="30" font-size="22" fill="#1f3a5f" text-anchor="middle" font-weight="bold">分治三步：分 — 治 — 合</text><text x="500.0" y="50" font-size="13" fill="#5a6b7c" text-anchor="middle" font-weight="normal">以归并排序为例：递归拆分到单元素，再两两合并回有序</text><rect x="290" y="90" width="60" height="36" rx="8" fill="#e8f0fb" stroke="#9db4d0" stroke-width="1.5"/><text x="320" y="114" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal">38</text><rect x="360" y="90" width="60" height="36" rx="8" fill="#e8f0fb" stroke="#9db4d0" stroke-width="1.5"/><text x="390" y="114" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal">27</text><rect x="430" y="90" width="60" height="36" rx="8" fill="#e8f0fb" stroke="#9db4d0" stroke-width="1.5"/><text x="460" y="114" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal">43</text><rect x="500" y="90" width="60" height="36" rx="8" fill="#e8f0fb" stroke="#9db4d0" stroke-width="1.5"/><text x="530" y="114" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal">3</text><rect x="570" y="90" width="60" height="36" rx="8" fill="#e8f0fb" stroke="#9db4d0" stroke-width="1.5"/><text x="600" y="114" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal">9</text><rect x="640" y="90" width="60" height="36" rx="8" fill="#e8f0fb" stroke="#9db4d0" stroke-width="1.5"/><text x="670" y="114" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal">82</text><text x="150" y="114" font-size="15" fill="#1f3a5f" text-anchor="middle" font-weight="bold">① 分：对半切开</text><rect x="290" y="160" width="60" height="36" rx="8" fill="#ffffff" stroke="#9db4d0" stroke-width="1.5"/><text x="320" y="184" font-size="1