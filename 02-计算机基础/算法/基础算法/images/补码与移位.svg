<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="1000" height="590" fill="#f7f9fc"/><rect x="0" y="0" width="1000" height="56" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="1.5"/><text x="500.0" y="30" font-size="22" fill="#1f3a5f" text-anchor="middle" font-weight="bold">补码与两种右移</text><text x="500.0" y="50" font-size="13" fill="#5a6b7c" text-anchor="middle" font-weight="normal">-x = ~x + 1；算术右移补符号位，逻辑右移补 0</text><text x="60" y="88" font-size="16" fill="#1f3a5f" text-anchor="start" font-weight="bold">① 8 位补码：-8 = ~8 + 1</text><text x="140" y="138" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal"> 8</text><rect x="240" y="110" width="420" height="40" rx="8" fill="#e8f0fb" stroke="#9db4d0" stroke-width="1.5"/><text x="450" y="137" font-size="17" fill="#22303f" text-anchor="middle" font-weight="normal">0000 1000</text><text x="140" y="190" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal">~8</text><rect x="240" y="162" width="420" height="40" rx="8" fill="#e8f0fb" stroke="#9db4d0" stroke-width="1.5"/><text x="450" y="189" font-size="17" fill="#22303f" text-anchor="middle" font-weight="normal">1111 0111</text><text x="140" y="242" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal">~8 + 1 = -8</text><rect x="240" y="214" width="420" height="40" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="450" y="241" font-size="17" fill="#22303f" text-anchor="middle" font-weight="normal">1111 1000</text><text x="720" y="158" font-size="13" fill="#5a6b7c" text-anchor="start" font-weight="normal">最高位 = 符号位，负数取反加一即为补码</text><text x="60" y="300" font-size="16" fill="#1f3a5f" text-anchor="start" font-weight="bold">② 对 -8 右移两位：算术 vs 逻辑</text><rect x="60" y="322" width="420" height="80" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="270" y="352" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">-8 &gt;&gt; 1  （算术右移）</text><text x="270" y="378" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal">1111 1000 → 1111 1100 = -4</text><text x="270" y="396" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">空出的高位补「符号位 1」</text><rect x="520" y="322" width="420" height="80" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="730" y="352" font-size="15" fill="#e65100" text-anchor="middle" font-weight="bold">-8 &gt;&gt;&gt; 1 （逻辑右移）</text><text x="730" y="378" font-size="15" fill="#22303f" text-anchor="middle" font-weight="normal">1111 1000 → 0111 1100 = 124</text><text x="730" y="396" font-size="12" fill="#5a6b7c" text-anchor="middle" font-weight="normal">空出的高位一律补 0</text><rect x="60" y="430" width="880" height="130" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="500" y="462" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold">跨语言差异（实测）</text><text x="500" y="490" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">Java：有 &gt;&gt;&gt; （逻辑）；移位次数按 int 低 5 位取模 → 1&lt;&lt;32 == 1&lt;&lt;0 == 1</text><text x="500" y="514" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">Go：没有 &gt;&gt;&gt; ，用 uint 强转模拟；int 是 64 位 → 1&lt;&lt;32 == 4294967296</text><text x="500" y="538" font-size="13" fill="#22303f" text-anchor="middle" font-weight="normal">C/C++：移位超过位宽是未定义行为（UB），结果不可依赖</text></svg>