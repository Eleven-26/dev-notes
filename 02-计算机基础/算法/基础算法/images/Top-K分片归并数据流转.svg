<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1100" height="600" fill="#ffffff"/>
  <defs>
    <marker id="tk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">分片归并：每片只留 K 个候选，全局再归并一次</text>
  <text x="550" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">数据装不下又必须精确时的结构；本图为数据流转示意，不含新读数</text>

  <rect x="30" y="250" width="110" height="70" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="85" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">数据流</text>
  <text x="85" y="301" text-anchor="middle" font-size="10.5" fill="#1e3a8a">装不下</text>

  <rect x="180" y="70" width="190" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="275" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">分片 1 → 局部小顶堆（K）</text>

  <rect x="180" y="140" width="190" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="275" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">分片 2 → 局部小顶堆（K）</text>

  <rect x="180" y="210" width="190" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="275" y="241" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">分片 3 → 局部小顶堆（K）</text>

  <rect x="180" y="280" width="190" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="275" y="311" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">……</text>

  <rect x="180" y="350" width="190" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="275" y="381" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">分片 m → 局部小顶堆（K）</text>

  <rect x="430" y="230" width="200" height="100" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="530" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">候选池 m × K</text>
  <text x="530" y="292" text-anchor="middle" font-size="10.5" fill="#92400e">每片只交前 K 名</text>

  <rect x="680" y="230" width="180" height="100" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="770" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">归并小顶堆（K）</text>
  <text x="770" y="292" text-anchor="middle" font-size="10.5" fill="#166534">一次归并出结果</text>

  <rect x="910" y="250" width="160" height="60" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="990" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">全局 Top-K</text>

  <path d="M 140 285 L 180 96" stroke="#64748b" stroke-width="1.5" marker-end="url(#tk)"/>
  <path d="M 140 285 L 180 166" stroke="#64748b" stroke-width="1.5" marker-end="url(#tk)"/>
  <path d="M 140 285 L 180 236" stroke="#64748b" stroke-width="1.5" marker-end="url(#tk)"/>
  <path d="M 140 285 L 180 306" stroke="#64748b" stroke-width="1.5" marker-end="url(#tk)"/>
  <path d="M 140 285 L 180 376" stroke="#64748b" stroke-width="1.5" marker-end="url(#tk)"/>

  <path d="M 370 96 L 430 270" stroke="#64748b" stroke-width="1.5" marker-end="url(#tk)"/>
  <path d="M 370 166 L 430 272" stroke="#64748b" stroke-width="1.5" marker-end="url(#tk)"/>
  <path d="M 370 236 L 430 278" stroke="#64748b" stroke-width="1.5" marker-end="url(#tk)"/>
  <path d="M 370 306 L 430 286" stroke="#64748b" stroke-width="1.5" marker-end="url(#tk)"/>
  <path d="M 370 376 L 430 292" stroke="#64748b" stroke-width="1.5" marker-end="url(#tk)"/>

  <path d="M 630 280 L 680 280" stroke="#64748b" stroke-width="1.5" marker-end="url(#tk)"/>
  <path d="M 860 280 L 910 280" stroke="#64748b" stroke-width="1.5" marker-end="url(#tk)"/>

  <rect x="30" y="440" width="1040" height="120" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="468" font-size="13" font-weight="bold" fill="#1e40af">为什么每片只取前 K 不会漏</text>
  <text x="46" y="494" font-size="12" fill="#1e3a8a">全局前 K 里的每一个元素，都必然落在它所在分片的前 K 名之内 —— 所以候选池 m × K 已经包含全部答案。</text>
  <text x="46" y="518" font-size="12" fill="#1e3a8a">代价：候选池要能放进一台机器的内存；分片数 m 越大，候选池线性膨胀，归并也会变重。</text>
  <text x="46" y="542" font-size="12" font-weight="bold" fill="#b91c1c">⚠️ 这是精确解，不是近似：前 K 名与全排序结果逐项一致。</text>
</svg>
