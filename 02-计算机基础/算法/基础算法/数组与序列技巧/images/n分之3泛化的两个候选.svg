<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">n/3 泛化：两个候选 + 两个净票数</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">求出现次数超过 n/(k+1) 的元素，就需要 k 个候选位和 k 个计数器；k=2 对应「超过 n/3」</text>

  <rect x="30" y="80" width="940" height="72" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="50" y="110" font-size="14" fill="#1e3a8a">同一个数组里，超过 n/3 的元素最多只有 2 个（三个都超过 n/3 会超过 n）；超过 n/2 的最多只有 1 个。</text>
  <text x="50" y="136" font-size="14" fill="#1e3a8a">所以候选位的个数 = 阈值分母 - 1：k=1 求超过 n/2，k=2 求超过 n/3，k=3 求超过 n/4。</text>

  <text x="40" y="192" font-size="14" font-weight="bold" fill="#0f172a">数组 [1 1 1 2 2 2 3]（n=7，阈值 ⌊n/3⌋ = 2，需出现 ≥ 3 次）</text>

  <g font-size="15">
    <rect x="50" y="210" width="88" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="94" y="239" text-anchor="middle" fill="#14532d">1</text>
    <rect x="146" y="210" width="88" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="190" y="239" text-anchor="middle" fill="#14532d">1</text>
    <rect x="242" y="210" width="88" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="286" y="239" text-anchor="middle" fill="#14532d">1</text>
    <rect x="338" y="210" width="88" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="382" y="239" text-anchor="middle" fill="#1e3a8a">2</text>
    <rect x="434" y="210" width="88" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="478" y="239" text-anchor="middle" fill="#1e3a8a">2</text>
    <rect x="530" y="210" width="88" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="574" y="239" text-anchor="middle" fill="#1e3a8a">2</text>
    <rect x="626" y="210" width="88" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="670" y="239" text-anchor="middle" fill="#334155">3</text>
  </g>

  <g font-size="12" fill="#475569">
    <text x="94" y="274" text-anchor="middle">c1=1 n1=1</text>
    <text x="190" y="274" text-anchor="middle">c1=1 n1=2</text>
    <text x="286" y="274" text-anchor="middle">c1=1 n1=3</text>
    <text x="382" y="274" text-anchor="middle">c2=2 n2=1</text>
    <text x="478" y="274" text-anchor="middle">c2=2 n2=2</text>
    <text x="574" y="274" text-anchor="middle">c2=2 n2=3</text>
    <text x="670" y="274" text-anchor="middle" fill="#b91c1c">n1=2 n2=2</text>
  </g>
  <text x="730" y="232" font-size="13" fill="#334155">读入 3 时：既不是 c1 也不是 c2，</text>
  <text x="730" y="252" font-size="13" fill="#334155">且两个计数器都 &gt; 0 →</text>
  <text x="730" y="272" font-size="13" fill="#b91c1c">两个计数器同时减 1（三票互相抵消）</text>

  <rect x="50" y="300" width="300" height="86" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="70" y="328" font-size="14" font-weight="bold" fill="#14532d">候选一 c1 = 1，净票数 n1 = 2</text>
  <text x="70" y="352" font-size="13" fill="#334155">二次验证：1 实际出现 3 次</text>
  <text x="70" y="374" font-size="13" fill="#16a34a">3 &gt; 2 → 通过，1 是答案之一</text>

  <rect x="370" y="300" width="300" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="390" y="328" font-size="14" font-weight="bold" fill="#1e3a8a">候选二 c2 = 2，净票数 n2 = 2</text>
  <text x="390" y="352" font-size="13" fill="#334155">二次验证：2 实际出现 3 次</text>
  <text x="390" y="374" font-size="13" fill="#2563eb">3 &gt; 2 → 通过，2 也是答案</text>

  <rect x="690" y="300" width="280" height="86" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="710" y="326" font-size="13" fill="#78350f">⚠️ 净票数只是「抵消后剩余」，</text>
  <text x="710" y="348" font-size="13" fill="#78350f">不等于实际出现次数：这里 n1 = 2，</text>
  <text x="710" y="370" font-size="13" fill="#78350f">而 1 实际出现了 3 次。</text>

  <line x1="40" y1="412" x2="940" y2="412" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="440" font-size="14" font-weight="bold" fill="#0f172a">为什么是 k 个候选、阈值 n/(k+1)</text>
  <text x="40" y="468" font-size="13" fill="#334155">抵消的本质是「每次拿 k+1 个不同的元素互相消掉一个」。若某元素出现次数 &gt; n/(k+1)，</text>
  <text x="40" y="492" font-size="13" fill="#334155">那么即使每一轮都把它算作被消掉的那一个，它最多也被消掉 n/(k+1) 次，剩下的仍 &gt; 0 —— 计数器不会归零。</text>
  <text x="40" y="516" font-size="13" fill="#334155">反过来说，如果没有元素超过 n/(k+1)，所有计数器仍可能留下非零值，所以泛化版同样必须二次验证。</text>

  <rect x="40" y="536" width="900" height="32" rx="5" fill="#e2e8f0"/>
  <text x="60" y="557" font-size="13" font-weight="bold" fill="#334155">k</text>
  <text x="180" y="557" font-size="13" font-weight="bold" fill="#334155">目标阈值</text>
  <text x="380" y="557" font-size="13" font-weight="bold" fill="#334155">候选位个数</text>
  <text x="620" y="557" font-size="13" font-weight="bold" fill="#334155">最多有几个这样的元素</text>
  <text x="60" y="590" font-size="13" fill="#334155">1</text>
  <text x="180" y="590" font-size="13" fill="#334155">出现次数 &gt; n/2</text>
  <text x="380" y="590" font-size="13" fill="#334155">1 个候选 + 1 个计数器</text>
  <text x="620" y="590" font-size="13" fill="#334155">至多 1 个</text>
  <text x="60" y="614" font-size="13" fill="#334155">2</text>
  <text x="180" y="614" font-size="13" fill="#334155">出现次数 &gt; n/3</text>
  <text x="380" y="614" font-size="13" fill="#334155">2 个候选 + 2 个计数器</text>
  <text x="620" y="614" font-size="13" fill="#334155">至多 2 个</text>
  <text x="60" y="638" font-size="13" fill="#334155">k</text>
  <text x="180" y="638" font-size="13" fill="#334155">出现次数 &gt; n/(k+1)</text>
  <text x="380" y="638" font-size="13" fill="#334155">k 个候选 + k 个计数器</text>
  <text x="620" y="638" font-size="13" fill="#334155">至多 k 个</text>
</svg>
