<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwG2" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
    <marker id="arwR2" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="610" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">前缀和与差分：a、prefix、diff 三个数组的换算</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">样例数字全部抄自正文 1.1 与 2.1 的手推块</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="960" height="210" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">A. 前缀和：区间查询 = 两个前缀相减</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">a = [1 3 5]，prefix = [0 1 4 9]（长度 n+1，prefix[0] 是哨兵）</text>

    <text x="28" y="92" font-size="12" font-weight="bold" fill="#334155">a</text>
    <rect x="64" y="70" width="60" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="94" y="92" text-anchor="middle" font-size="13" fill="#334155">1</text>
    <rect x="128" y="70" width="60" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="158" y="92" text-anchor="middle" font-size="13" fill="#334155">3</text>
    <rect x="192" y="70" width="60" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="222" y="92" text-anchor="middle" font-size="13" fill="#334155">5</text>

    <text x="18" y="154" font-size="11" font-weight="bold" fill="#334155">prefix</text>
    <rect x="64" y="132" width="60" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="94" y="154" text-anchor="middle" font-size="13" fill="#1e40af">0</text>
    <rect x="128" y="132" width="60" height="34" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" rx="6"/>
    <text x="158" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">1</text>
    <rect x="192" y="132" width="60" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="222" y="154" text-anchor="middle" font-size="13" fill="#1e40af">4</text>
    <rect x="256" y="132" width="60" height="34" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" rx="6"/>
    <text x="286" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">9</text>

    <text x="94" y="180" text-anchor="middle" font-size="9" fill="#64748b">prefix[0]</text>
    <text x="158" y="180" text-anchor="middle" font-size="9" fill="#64748b">prefix[1]</text>
    <text x="222" y="180" text-anchor="middle" font-size="9" fill="#64748b">prefix[2]</text>
    <text x="286" y="180" text-anchor="middle" font-size="9" fill="#64748b">prefix[3]</text>
    <text x="20" y="202" font-size="10" fill="#334155">查询 [1,3)：prefix[3] − prefix[1] = 9 − 1 = 8 ✓（两个黄格相减）</text>

    <rect x="430" y="56" width="514" height="124" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="444" y="78" font-size="11.5" font-weight="bold" fill="#1e40af">定义与代价（正文 1.1）</text>
    <text x="444" y="98" font-size="10.5" fill="#1e40af">prefix[i] = 前 i 个元素之和，长度开 n+1</text>
    <text x="444" y="118" font-size="10.5" fill="#1e40af">递推：prefix[i+1] = prefix[i] + a[i]</text>
    <text x="444" y="138" font-size="10.5" fill="#1e40af">区间和：sum(l, r) = prefix[r+1] − prefix[l]</text>
    <text x="444" y="158" font-size="10.5" fill="#1e40af">预处理 O(n)，单次查询 O(1)</text>
    <text x="430" y="202" font-size="10" fill="#991b1b">失效边界（正文 1.3）：单点修改 → 其后所有前缀重算，改一个 O(n)</text>
  </g>

  <g transform="translate(20,304)">
    <rect x="0" y="0" width="960" height="210" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="15" font-weight="bold" fill="#0f172a">B. 差分：区间加只改两个端点</text>
    <text x="14" y="44" font-size="10.5" fill="#64748b">对 a = [0 0 0 0 0] 的区间 [1,2] 整体加 2（正文 2.1 手推）</text>

    <text x="24" y="92" font-size="11" font-weight="bold" fill="#334155">diff</text>
    <rect x="64" y="72" width="60" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="94" y="94" text-anchor="middle" font-size="13" fill="#334155">0</text>
    <rect x="128" y="72" width="60" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="6"/>
    <text x="158" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">2</text>
    <rect x="192" y="72" width="60" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="222" y="94" text-anchor="middle" font-size="13" fill="#334155">0</text>
    <rect x="256" y="72" width="60" height="34" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" rx="6"/>
    <text x="286" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">-2</text>
    <rect x="320" y="72" width="60" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="350" y="94" text-anchor="middle" font-size="13" fill="#334155">0</text>

    <text x="94" y="120" text-anchor="middle" font-size="9" fill="#64748b">diff[0]</text>
    <text x="158" y="120" text-anchor="middle" font-size="9" fill="#64748b">diff[1]</text>
    <text x="222" y="120" text-anchor="middle" font-size="9" fill="#64748b">diff[2]</text>
    <text x="286" y="120" text-anchor="middle" font-size="9" fill="#64748b">diff[3]</text>
    <text x="350" y="120" text-anchor="middle" font-size="9" fill="#64748b">diff[4]</text>

    <line x1="158" y1="130" x2="158" y2="144" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG2)"/>
    <text x="70" y="164" font-size="10" fill="#14532d">+2：从下标 1 起每个前缀和多 2</text>
    <text x="70" y="182" font-size="10" fill="#991b1b">-2：从下标 3 起抵消回去</text>
    <text x="20" y="202" font-size="10" fill="#334155">对 diff 求前缀和还原 a = [0 2 2 0 0] ✓（只有 [1,2] 加了 2）</text>

    <rect x="430" y="56" width="514" height="124" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="8"/>
    <text x="444" y="78" font-size="11.5" font-weight="bold" fill="#14532d">写法与代价（正文 2.1）</text>
    <text x="444" y="98" font-size="10.5" fill="#14532d">区间 [l, r] 全部加 v：diff[l] += v；diff[r+1] -= v</text>
    <text x="444" y="118" font-size="10.5" fill="#14532d">最后对 diff 求一次前缀和即还原 a</text>
    <text x="444" y="138" font-size="10.5" fill="#14532d">diff[0] = a[0]；r = n-1 时 diff[r+1] 落在哨兵位</text>
    <text x="444" y="158" font-size="10.5" fill="#14532d">预处理 O(n)，单次区间修改 O(1)，最终还原 O(n)</text>
    <text x="430" y="202" font-size="10" fill="#991b1b">失效边界（正文 2.3）：查询要 O(n) 扫回前缀和，只适合先批量改、最后统一查</text>
  </g>

  <g transform="translate(20,534)">
    <rect x="0" y="0" width="960" height="64" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="10"/>
    <text x="14" y="26" font-size="12" font-weight="bold" fill="#92400e">互逆的两对通道：a →前缀和→ prefix（为查）；a →差分→ diff（为改）；diff →前缀和→ a（还原）</text>
    <text x="14" y="48" font-size="10.5" fill="#92400e">两边失效边界正好互补：前缀和只擅长查、差分只擅长改；读写交错 → 线段树 / 树状数组（正文第三节）</text>
  </g>
</svg>
