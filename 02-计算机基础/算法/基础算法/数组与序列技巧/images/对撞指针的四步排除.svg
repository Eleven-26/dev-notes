<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">对撞指针的四步排除：每一步作废一整条边</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">数组 [1 3 4 6 8 11 15 20 22 27]，目标 26：两个下标只相向而行，被作废的格子只增不减</text>

  <rect x="20" y="76" width="960" height="510" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <text x="30" y="110" font-size="13" fill="#0f172a">第 1 步：a[0] + a[9] = 1 + 27 = 28 &gt; 26 → 必须 hi--</text>
  <text x="69" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">lo</text>
  <text x="609" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">hi</text>
  <rect x="40" y="138" width="58" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="69" y="160" text-anchor="middle" font-size="15" fill="#1e3a8a">1</text>
  <rect x="100" y="138" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="129" y="160" text-anchor="middle" font-size="15" fill="#334155">3</text>
  <rect x="160" y="138" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="189" y="160" text-anchor="middle" font-size="15" fill="#334155">4</text>
  <rect x="220" y="138" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="249" y="160" text-anchor="middle" font-size="15" fill="#334155">6</text>
  <rect x="280" y="138" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="309" y="160" text-anchor="middle" font-size="15" fill="#334155">8</text>
  <rect x="340" y="138" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="369" y="160" text-anchor="middle" font-size="15" fill="#334155">11</text>
  <rect x="400" y="138" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="429" y="160" text-anchor="middle" font-size="15" fill="#334155">15</text>
  <rect x="460" y="138" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="489" y="160" text-anchor="middle" font-size="15" fill="#334155">20</text>
  <rect x="520" y="138" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="549" y="160" text-anchor="middle" font-size="15" fill="#334155">22</text>
  <rect x="580" y="138" width="58" height="34" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="609" y="160" text-anchor="middle" font-size="15" fill="#7f1d1d">27</text>
  <text x="680" y="152" font-size="13" fill="#b91c1c">hi--：27 作废，整列 9 个候选对全排掉</text>
  <text x="680" y="172" font-size="12" fill="#64748b">和偏大 ⇒ 只能换掉右端</text>

  <text x="30" y="232" font-size="13" fill="#0f172a">第 2 步：a[0] + a[8] = 1 + 22 = 23 &lt; 26 → 必须 lo++</text>
  <text x="69" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">lo</text>
  <text x="549" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">hi</text>
  <rect x="40" y="260" width="58" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="69" y="282" text-anchor="middle" font-size="15" fill="#1e3a8a">1</text>
  <rect x="100" y="260" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="129" y="282" text-anchor="middle" font-size="15" fill="#334155">3</text>
  <rect x="160" y="260" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="189" y="282" text-anchor="middle" font-size="15" fill="#334155">4</text>
  <rect x="220" y="260" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="249" y="282" text-anchor="middle" font-size="15" fill="#334155">6</text>
  <rect x="280" y="260" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="309" y="282" text-anchor="middle" font-size="15" fill="#334155">8</text>
  <rect x="340" y="260" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="369" y="282" text-anchor="middle" font-size="15" fill="#334155">11</text>
  <rect x="400" y="260" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="429" y="282" text-anchor="middle" font-size="15" fill="#334155">15</text>
  <rect x="460" y="260" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="489" y="282" text-anchor="middle" font-size="15" fill="#334155">20</text>
  <rect x="520" y="260" width="58" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="549" y="282" text-anchor="middle" font-size="15" fill="#14532d">22</text>
  <rect x="580" y="260" width="58" height="34" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="609" y="282" text-anchor="middle" font-size="15" fill="#94a3b8">27</text>
  <text x="680" y="274" font-size="13" fill="#b45309">lo++：1 作废，整行候选全排掉</text>
  <text x="680" y="294" font-size="12" fill="#64748b">和偏小 ⇒ 只能换掉左端</text>

  <text x="30" y="354" font-size="13" fill="#0f172a">第 3 步：a[1] + a[8] = 3 + 22 = 25 &lt; 26 → 必须 lo++</text>
  <text x="129" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">lo</text>
  <text x="549" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">hi</text>
  <rect x="40" y="382" width="58" height="34" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="69" y="404" text-anchor="middle" font-size="15" fill="#94a3b8">1</text>
  <rect x="100" y="382" width="58" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="129" y="404" text-anchor="middle" font-size="15" fill="#1e3a8a">3</text>
  <rect x="160" y="382" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="189" y="404" text-anchor="middle" font-size="15" fill="#334155">4</text>
  <rect x="220" y="382" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="249" y="404" text-anchor="middle" font-size="15" fill="#334155">6</text>
  <rect x="280" y="382" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="309" y="404" text-anchor="middle" font-size="15" fill="#334155">8</text>
  <rect x="340" y="382" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="369" y="404" text-anchor="middle" font-size="15" fill="#334155">11</text>
  <rect x="400" y="382" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="429" y="404" text-anchor="middle" font-size="15" fill="#334155">15</text>
  <rect x="460" y="382" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="489" y="404" text-anchor="middle" font-size="15" fill="#334155">20</text>
  <rect x="520" y="382" width="58" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="549" y="404" text-anchor="middle" font-size="15" fill="#14532d">22</text>
  <rect x="580" y="382" width="58" height="34" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="609" y="404" text-anchor="middle" font-size="15" fill="#94a3b8">27</text>
  <text x="680" y="396" font-size="13" fill="#b45309">lo++：3 作废，整行候选全排掉</text>
  <text x="680" y="416" font-size="12" fill="#64748b">和仍偏小 ⇒ 继续换左端</text>

  <text x="30" y="476" font-size="13" fill="#0f172a">第 4 步：a[2] + a[8] = 4 + 22 = 26 → 命中</text>
  <text x="189" y="498" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">lo</text>
  <text x="549" y="498" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">hi</text>
  <rect x="40" y="504" width="58" height="34" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="69" y="526" text-anchor="middle" font-size="15" fill="#94a3b8">1</text>
  <rect x="100" y="504" width="58" height="34" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="129" y="526" text-anchor="middle" font-size="15" fill="#94a3b8">3</text>
  <rect x="160" y="504" width="58" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="189" y="526" text-anchor="middle" font-size="15" fill="#1e3a8a">4</text>
  <rect x="220" y="504" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="249" y="526" text-anchor="middle" font-size="15" fill="#334155">6</text>
  <rect x="280" y="504" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="309" y="526" text-anchor="middle" font-size="15" fill="#334155">8</text>
  <rect x="340" y="504" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="369" y="526" text-anchor="middle" font-size="15" fill="#334155">11</text>
  <rect x="400" y="504" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="429" y="526" text-anchor="middle" font-size="15" fill="#334155">15</text>
  <rect x="460" y="504" width="58" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="489" y="526" text-anchor="middle" font-size="15" fill="#334155">20</text>
  <rect x="520" y="504" width="58" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="549" y="526" text-anchor="middle" font-size="15" fill="#14532d">22</text>
  <rect x="580" y="504" width="58" height="34" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="609" y="526" text-anchor="middle" font-size="15" fill="#94a3b8">27</text>
  <text x="680" y="518" font-size="13" fill="#15803d">命中：共比较 4 次</text>
  <text x="680" y="538" font-size="12" fill="#64748b">命中 (2, 8)，值 4 与 22</text>

  <text x="30" y="566" font-size="12" fill="#64748b">阴影格 = 已作废：lo 左侧的格子不会再做左端，hi 右侧的格子不会再做右端</text>

  <text x="30" y="620" font-size="12" fill="#94a3b8">本图对应正文第二节 2.2：数组、目标、四步的和与「比较 4 次」均取自该节的实测输出，图不引入新读数。</text>
  <text x="30" y="640" font-size="12" fill="#94a3b8">同型图已另有「双指针的三种形态」（形态对照），本图是同一题的四步推进，不重复。</text>
</svg>
