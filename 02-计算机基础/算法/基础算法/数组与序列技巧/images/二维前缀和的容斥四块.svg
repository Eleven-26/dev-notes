<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arwG3" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#16a34a"/></marker>
    <marker id="arwR3" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 6,3 0,6 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="410" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">二维前缀和的容斥：哪块加、哪块减</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">记 P = prefix，公式抄自正文 1.2；绿色 = 目标，红色 = 被减的带，黄色 = 被多减一次要回补的角</text>

  <g transform="translate(20,74)">
    <rect x="0" y="0" width="460" height="310" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">A. 矩形查询：一加两减一回补</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">求 (r1,c1) 到 (r2,c2) 的矩形和，整图 = P[r2+1][c2+1]</text>

    <rect x="60" y="64" width="180" height="86" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="150" y="100" text-anchor="middle" font-size="10" fill="#92400e">+ P[r1][c1]</text>
    <text x="150" y="120" text-anchor="middle" font-size="9.5" fill="#92400e">（被多减一次，回补）</text>
    <rect x="240" y="64" width="120" height="86" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="6"/>
    <text x="300" y="100" text-anchor="middle" font-size="10" fill="#991b1b">− P[r1][c2+1]</text>
    <text x="300" y="120" text-anchor="middle" font-size="9.5" fill="#991b1b">（减上带）</text>
    <rect x="60" y="150" width="180" height="94" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="6"/>
    <text x="150" y="192" text-anchor="middle" font-size="10" fill="#991b1b">− P[r2+1][c1]</text>
    <text x="150" y="212" text-anchor="middle" font-size="9.5" fill="#991b1b">（减左带）</text>
    <rect x="240" y="150" width="120" height="94" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
    <text x="300" y="192" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">目标矩形</text>
    <text x="300" y="212" text-anchor="middle" font-size="9.5" fill="#14532d">(r1..r2)×(c1..c2)</text>
    <rect x="60" y="64" width="300" height="180" fill="none" stroke="#64748b" stroke-width="1.5"/>

    <text x="240" y="258" text-anchor="middle" font-size="9.5" fill="#64748b">c1</text>
    <text x="52" y="154" text-anchor="end" font-size="9.5" fill="#64748b">r1</text>
    <text x="20" y="284" font-size="10.5" fill="#334155">和 = P[r2+1][c2+1] − P[r1][c2+1] − P[r2+1][c1] + P[r1][c1]</text>
    <text x="20" y="304" font-size="10" fill="#64748b">整块减上带、减左带时，左上角被减了两次 → 加回一次</text>
  </g>

  <g transform="translate(520,74)">
    <rect x="0" y="0" width="460" height="310" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
    <text x="14" y="24" font-size="15" font-weight="bold" fill="#0f172a">B. 建表递推：上 + 左 − 左上 + 本格</text>
    <text x="14" y="42" font-size="10.5" fill="#64748b">填 P[i][j] 时四个加数各对应哪一格</text>

    <text x="120" y="58" text-anchor="middle" font-size="9.5" fill="#64748b">j-1 列</text>
    <text x="260" y="58" text-anchor="middle" font-size="9.5" fill="#64748b">j 列</text>
    <text x="52" y="96" text-anchor="end" font-size="9.5" fill="#64748b">i-1 行</text>
    <text x="52" y="182" text-anchor="end" font-size="9.5" fill="#64748b">i 行</text>

    <rect x="60" y="64" width="120" height="56" fill="#fef3c7" stroke="#b45309" stroke-width="1" rx="6"/>
    <text x="120" y="97" text-anchor="middle" font-size="10.5" fill="#92400e">P[i-1][j-1]</text>
    <rect x="200" y="64" width="120" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="260" y="97" text-anchor="middle" font-size="10.5" fill="#1e40af">P[i-1][j]</text>
    <rect x="60" y="150" width="120" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="120" y="183" text-anchor="middle" font-size="10.5" fill="#1e40af">P[i][j-1]</text>
    <rect x="200" y="150" width="120" height="56" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="6"/>
    <text x="260" y="176" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">P[i][j]</text>
    <text x="260" y="194" text-anchor="middle" font-size="9.5" fill="#14532d">本格</text>

    <line x1="260" y1="120" x2="260" y2="148" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG3)"/>
    <text x="268" y="140" font-size="11" font-weight="bold" fill="#16a34a">+</text>
    <line x1="180" y1="178" x2="198" y2="178" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG3)"/>
    <text x="184" y="172" font-size="11" font-weight="bold" fill="#16a34a">+</text>
    <line x1="178" y1="118" x2="199" y2="149" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR3)"/>
    <text x="160" y="142" font-size="11" font-weight="bold" fill="#dc2626">-</text>

    <text x="20" y="236" font-size="10" fill="#334155">上块 + 左块都把左上格算了进去 → 左上被算两遍，减一次</text>
    <text x="20" y="260" font-size="10.5" fill="#334155">prefix[i][j] = P[i-1][j] + P[i][j-1] − P[i-1][j-1] + a[i-1][j-1]</text>
    <text x="20" y="284" font-size="10" fill="#64748b">新增的本格 a[i-1][j-1] 不在任何前缀里，单独加</text>
    <text x="20" y="302" font-size="10" fill="#64748b">行列都正序扫 → 三个依赖格永远已填好</text>
  </g>
</svg>
