<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="780" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">AVL 的四种旋转（失衡形态只有四种，每种一组固定旋转）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">旋转不变量：中序不变（保持 BST 性质）、高度降低（把长的一侧往上提）；四种形态的终局都是同一棵平衡树</text>

  <g transform="translate(20,70)">
    <rect x="0" y="0" width="460" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">LL 型（左左）</text>
    <text x="16" y="54" font-size="12" fill="#64748b">3 的左孩子 2 又有左孩子 1，平衡因子 +2 / +1</text>
    <text x="16" y="90" font-size="13" fill="#334155">旋转前（高 3）</text>
    <text x="250" y="90" font-size="13" fill="#334155">旋转后（高 2）</text>
    <line x1="96" y1="132" x2="70" y2="198" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="70" y1="198" x2="52" y2="264" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="96" cy="132" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="96" y="132" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#7f1d1d">3</text>
    <circle cx="70" cy="198" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="70" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">2</text>
    <circle cx="52" cy="264" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="52" y="264" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">1</text>
    <line x1="160" y1="198" x2="228" y2="198" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <text x="194" y="182" text-anchor="middle" font-size="12" fill="#b45309">一次右旋</text>
    <line x1="310" y1="198" x2="274" y2="264" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="310" y1="198" x2="346" y2="264" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="310" cy="198" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="310" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#14532d">2</text>
    <circle cx="274" cy="264" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="274" y="264" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">1</text>
    <circle cx="346" cy="264" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="346" y="264" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">3</text>
    <text x="16" y="310" font-size="12" fill="#334155">中序 [1 2 3] 不变　高度 3 -&gt; 2</text>
  </g>

  <g transform="translate(520,70)">
    <rect x="0" y="0" width="460" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">RR 型（右右）</text>
    <text x="16" y="54" font-size="12" fill="#64748b">1 的右孩子 2 又有右孩子 3，平衡因子 -2 / -1</text>
    <text x="16" y="90" font-size="13" fill="#334155">旋转前（高 3）</text>
    <text x="250" y="90" font-size="13" fill="#334155">旋转后（高 2）</text>
    <line x1="96" y1="132" x2="122" y2="198" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="122" y1="198" x2="140" y2="264" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="96" cy="132" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="96" y="132" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#7f1d1d">1</text>
    <circle cx="122" cy="198" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="122" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">2</text>
    <circle cx="140" cy="264" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="140" y="264" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">3</text>
    <line x1="160" y1="198" x2="228" y2="198" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <text x="194" y="182" text-anchor="middle" font-size="12" fill="#b45309">一次左旋</text>
    <line x1="310" y1="198" x2="274" y2="264" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="310" y1="198" x2="346" y2="264" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="310" cy="198" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="310" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#14532d">2</text>
    <circle cx="274" cy="264" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="274" y="264" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">1</text>
    <circle cx="346" cy="264" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="346" y="264" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">3</text>
    <text x="16" y="310" font-size="12" fill="#334155">中序 [1 2 3] 不变　高度 3 -&gt; 2</text>
  </g>

  <g transform="translate(20,420)">
    <rect x="0" y="0" width="460" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">LR 型（左右）</text>
    <text x="16" y="54" font-size="12" fill="#64748b">3 的左孩子 1 有右孩子 2，平衡因子 +2 / -1</text>
    <text x="16" y="90" font-size="13" fill="#334155">旋转前（高 3）</text>
    <text x="250" y="90" font-size="13" fill="#334155">旋转后（高 2）</text>
    <line x1="96" y1="132" x2="70" y2="198" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="70" y1="198" x2="96" y2="264" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="96" cy="132" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="96" y="132" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#7f1d1d">3</text>
    <circle cx="70" cy="198" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="70" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">1</text>
    <circle cx="96" cy="264" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="96" y="264" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">2</text>
    <line x1="150" y1="198" x2="238" y2="198" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <text x="194" y="178" text-anchor="middle" font-size="11" fill="#b45309">先左旋 1，再右旋 3</text>
    <line x1="310" y1="198" x2="274" y2="264" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="310" y1="198" x2="346" y2="264" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="310" cy="198" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="310" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#14532d">2</text>
    <circle cx="274" cy="264" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="274" y="264" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">1</text>
    <circle cx="346" cy="264" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="346" y="264" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">3</text>
    <text x="16" y="310" font-size="12" fill="#334155">中序 [1 2 3] 不变　高度 3 -&gt; 2</text>
  </g>

  <g transform="translate(520,420)">
    <rect x="0" y="0" width="460" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="16" y="30" font-size="16" font-weight="bold" fill="#0f172a">RL 型（右左）</text>
    <text x="16" y="54" font-size="12" fill="#64748b">1 的右孩子 3 有左孩子 2，平衡因子 -2 / +1</text>
    <text x="16" y="90" font-size="13" fill="#334155">旋转前（高 3）</text>
    <text x="250" y="90" font-size="13" fill="#334155">旋转后（高 2）</text>
    <line x1="96" y1="132" x2="122" y2="198" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="122" y1="198" x2="96" y2="264" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="96" cy="132" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="96" y="132" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#7f1d1d">1</text>
    <circle cx="122" cy="198" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="122" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">3</text>
    <circle cx="96" cy="264" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="96" y="264" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">2</text>
    <line x1="150" y1="198" x2="238" y2="198" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
    <text x="194" y="178" text-anchor="middle" font-size="11" fill="#b45309">先右旋 3，再左旋 1</text>
    <line x1="310" y1="198" x2="274" y2="264" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="310" y1="198" x2="346" y2="264" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="310" cy="198" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="310" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#14532d">2</text>
    <circle cx="274" cy="264" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="274" y="264" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">1</text>
    <circle cx="346" cy="264" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="346" y="264" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#334155">3</text>
    <text x="16" y="310" font-size="12" fill="#334155">中序 [1 2 3] 不变　高度 3 -&gt; 2</text>
  </g>
</svg>
