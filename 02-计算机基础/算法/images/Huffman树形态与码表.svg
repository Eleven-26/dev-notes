<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Huffman 树的形态与码表（输入 A：4 种字符，频次 10/10/10/20）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">同频次合并约定「字节值小者先合并」；树形、码长、总比特为 golang:1.26-alpine（go1.26.8）容器实跑读数</text>

  <rect x="20" y="76" width="560" height="374" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="36" y="100" font-size="15" font-weight="bold" fill="#0f172a">A. 由频次建出的前缀码树（边上 0/1 = 码位）</text>

  <line x1="300" y1="166" x2="176" y2="222" stroke="#64748b" stroke-width="1.6"/>
  <line x1="300" y1="166" x2="424" y2="222" stroke="#64748b" stroke-width="1.6"/>
  <line x1="424" y1="238" x2="336" y2="294" stroke="#64748b" stroke-width="1.6"/>
  <line x1="424" y1="238" x2="512" y2="294" stroke="#64748b" stroke-width="1.6"/>
  <line x1="512" y1="310" x2="452" y2="366" stroke="#64748b" stroke-width="1.6"/>
  <line x1="512" y1="310" x2="572" y2="366" stroke="#64748b" stroke-width="1.6"/>

  <text x="228" y="186" font-size="11" fill="#dc2626">0</text>
  <text x="368" y="186" font-size="11" fill="#dc2626">1</text>
  <text x="372" y="262" font-size="11" fill="#dc2626">0</text>
  <text x="478" y="262" font-size="11" fill="#dc2626">1</text>
  <text x="472" y="338" font-size="11" fill="#dc2626">0</text>
  <text x="548" y="338" font-size="11" fill="#dc2626">1</text>

  <circle cx="300" cy="150" r="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="300" y="155" text-anchor="middle" font-size="12" fill="#334155">50</text>

  <circle cx="160" cy="240" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="160" y="245" text-anchor="middle" font-size="13" fill="#166534">d·20</text>
  <circle cx="320" cy="312" r="26" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="320" y="317" text-anchor="middle" font-size="13" fill="#9a3412">c·10</text>
  <circle cx="436" cy="384" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="436" y="389" text-anchor="middle" font-size="13" fill="#1e40af">a·10</text>
  <circle cx="572" cy="384" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="572" y="389" text-anchor="middle" font-size="13" fill="#1e40af">b·10</text>
  <circle cx="424" cy="230" r="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="424" y="235" text-anchor="middle" font-size="11" fill="#334155">30</text>
  <circle cx="512" cy="302" r="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="512" y="307" text-anchor="middle" font-size="11" fill="#334155">20</text>

  <text x="36" y="428" font-size="11.5" fill="#0f172a">读树：d 一步到叶（1 位码）；c 两步（2 位）；a、b 三步（3 位）——频次越高离根越近</text>
  <text x="36" y="446" font-size="10.5" fill="#64748b">合并顺序（同频取字节值小者）：a+b=20 → c+(ab)=30 → d+(cab)=50</text>

  <rect x="600" y="76" width="380" height="374" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <text x="616" y="100" font-size="15" font-weight="bold" fill="#0f172a">B. 实测码表与总长（输入 A，50 字节）</text>

  <rect x="616" y="114" width="348" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="650" y="131" font-size="12" fill="#0f172a">字符</text>
  <text x="710" y="131" font-size="12" fill="#0f172a">频次</text>
  <text x="790" y="131" font-size="12" fill="#0f172a">码字</text>
  <text x="890" y="131" font-size="12" fill="#0f172a">码长</text>

  <text x="650" y="163" font-size="12" fill="#1e40af">a</text>
  <text x="710" y="163" font-size="12" fill="#0f172a">10</text>
  <text x="790" y="163" font-size="12" fill="#0f172a">110</text>
  <text x="890" y="163" font-size="12" fill="#0f172a">3 位</text>
  <text x="650" y="191" font-size="12" fill="#1e40af">b</text>
  <text x="710" y="191" font-size="12" fill="#0f172a">10</text>
  <text x="790" y="191" font-size="12" fill="#0f172a">111</text>
  <text x="890" y="191" font-size="12" fill="#0f172a">3 位</text>
  <text x="650" y="219" font-size="12" fill="#9a3412">c</text>
  <text x="710" y="219" font-size="12" fill="#0f172a">10</text>
  <text x="790" y="219" font-size="12" fill="#0f172a">10</text>
  <text x="890" y="219" font-size="12" fill="#0f172a">2 位</text>
  <text x="650" y="247" font-size="12" fill="#166534">d</text>
  <text x="710" y="247" font-size="12" fill="#0f172a">20</text>
  <text x="790" y="247" font-size="12" fill="#0f172a">0</text>
  <text x="890" y="247" font-size="12" fill="#0f172a">1 位</text>

  <line x1="616" y1="262" x2="964" y2="262" stroke="#cbd5e1" stroke-width="1"/>
  <text x="616" y="286" font-size="12" fill="#0f172a">总比特 = 10×3 + 10×3 + 10×2 + 20×1 = 100</text>
  <text x="616" y="310" font-size="12" fill="#0f172a">= 13 字节（50 → 13），平均 2.00 比特/字节</text>
  <text x="616" y="334" font-size="12" fill="#0f172a">对照：原始 8 位/字节 = 400 比特</text>

  <rect x="616" y="352" width="348" height="80" fill="#fffbeb" stroke="#b45309" stroke-width="1.2" rx="6"/>
  <text x="628" y="372" font-size="11.5" font-weight="bold" fill="#9a3412">注意：tie-break 不唯一</text>
  <text x="628" y="392" font-size="11" fill="#9a3412">本机 go1.26.5 读数总长同为 100 比特，但最长码</text>
  <text x="628" y="410" font-size="11" fill="#9a3412">2 位；容器 go1.26.8 按「值小先合并」最长码 3 位。</text>
  <text x="628" y="426" font-size="11" fill="#9a3412">码形可变，总比特不变——与正文口径一致。</text>
</svg>
