<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">算法体系总览（本目录回答「数据怎么算」）</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">收「语言无关、有独立原理层」的通用算法 · 八个二级目录 · 结构本体在姊妹目录 数据结构/</text>

  <text x="20" y="86" font-size="13" font-weight="bold" fill="#2563eb">一、按解题路线分的八个二级目录（篇数为目录实数）</text>

  <rect x="20" y="94" width="470" height="98" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="34" y="120" font-size="14" font-weight="bold" fill="#1e3a8a">基础算法／ 17 篇 —— 先按规模定路线</text>
  <text x="34" y="142" font-size="12" fill="#1e3a8a">根目录 5：复杂度 · 递归与分治 · 查找与排序对比 · Top-K · 树算法</text>
  <text x="34" y="162" font-size="12" fill="#1e3a8a">数组与序列技巧 6：双指针 · 滑窗 · 前缀和 · 摩尔投票 · 位运算 · 二分答案</text>
  <text x="34" y="182" font-size="12" fill="#1e3a8a">查找 3（二分 / B树+ / 哈希） · 排序 3（比较 / 非比较 / 快速选择）</text>

  <rect x="510" y="94" width="470" height="98" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="524" y="120" font-size="14" font-weight="bold" fill="#14532d">动态规划／ 12 篇 —— 定状态再写转移</text>
  <text x="524" y="142" font-size="12" fill="#14532d">背包问题 · LCS · LIS · 编辑距离 · 线性DP</text>
  <text x="524" y="162" font-size="12" fill="#14532d">区间DP · 树形DP · 数位DP · 状态压缩DP · 记忆化搜索</text>
  <text x="524" y="182" font-size="12" fill="#14532d">DP优化（四类加速） · 自动机DP（AC 状态分层）</text>

  <rect x="20" y="204" width="470" height="98" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="34" y="230" font-size="14" font-weight="bold" fill="#78350f">贪心／ 3 篇 —— 排序键 + 交换论证</text>
  <text x="34" y="252" font-size="12" fill="#78350f">霍夫曼编码（贪心范式的样板篇）</text>
  <text x="34" y="272" font-size="12" fill="#78350f">活动选择（排序键必须是结束时间）</text>
  <text x="34" y="292" font-size="12" fill="#78350f">区间调度（带权版贪心失效，必须回 DP）</text>

  <rect x="510" y="204" width="470" height="98" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text x="524" y="230" font-size="14" font-weight="bold" fill="#7c2d12">回溯／ 4 篇 —— 选择 → 递归 → 撤销</text>
  <text x="524" y="252" font-size="12" fill="#7c2d12">回溯模板与剪枝（可行性 / 最优性 / 对称性）</text>
  <text x="524" y="272" font-size="12" fill="#7c2d12">全排列（母模板） · 八皇后 · 数独</text>
  <text x="524" y="292" font-size="12" fill="#7c2d12">与 DFS / 动态规划 / 贪心的边界见其 README</text>

  <rect x="20" y="314" width="470" height="98" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="34" y="340" font-size="14" font-weight="bold" fill="#1e3a8a">字符串匹配／ 9 篇 —— 先问要什么</text>
  <text x="34" y="362" font-size="12" fill="#1e3a8a">KMP · BM · Z算法（单模式匹配三条路线）</text>
  <text x="34" y="382" font-size="12" fill="#1e3a8a">AC自动机（多模式：Trie + fail 指针）</text>
  <text x="34" y="402" font-size="12" fill="#1e3a8a">后缀数组 / 后缀自动机 · Manacher · 回文自动机 · 字符串哈希</text>

  <rect x="510" y="314" width="470" height="98" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="524" y="340" font-size="14" font-weight="bold" fill="#14532d">数学基础／ 6 篇 —— 计数与概率地基</text>
  <text x="524" y="362" font-size="12" fill="#14532d">数论基础（GCD / 筛 / 快速幂 / CRT / 莫比乌斯反演）</text>
  <text x="524" y="382" font-size="12" fill="#14532d">组合数学 · 概率与期望 · 博弈论（Nim / SG）</text>
  <text x="524" y="402" font-size="12" fill="#14532d">FFT与多项式（卷积加速） · 计算几何</text>

  <rect x="20" y="424" width="470" height="98" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="34" y="450" font-size="14" font-weight="bold" fill="#78350f">高级技巧／ 7 篇 —— 把什么转成什么</text>
  <text x="34" y="472" font-size="12" fill="#78350f">离散化（值域压缩） · 分块 · 莫队算法（离线重排）</text>
  <text x="34" y="492" font-size="12" fill="#78350f">扫描线（二维降一维） · 矩阵快速幂（线性递推加速）</text>
  <text x="34" y="512" font-size="12" fill="#78350f">树链剖分 · CDQ分治与整体二分 · √n 是公分母</text>

  <rect x="510" y="424" width="470" height="98" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text x="524" y="450" font-size="14" font-weight="bold" fill="#7c2d12">图论算法／ 11 篇 + 三个三级目录 8 篇</text>
  <text x="524" y="472" font-size="12" fill="#7c2d12">拓扑排序 · 强连通分量 · 割点与桥 · 二分图判定 / 匹配</text>
  <text x="524" y="492" font-size="12" fill="#7c2d12">网络流 · 最小费用最大流 · 2-SAT · 差分约束 · 树上问题</text>
  <text x="524" y="512" font-size="12" fill="#7c2d12">图的遍历／ · 最短路／ · 最小生成树／（各有 README）</text>

  <line x1="500" y1="528" x2="500" y2="546" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>

  <text x="20" y="566" font-size="13" font-weight="bold" fill="#64748b">二、不在这八个类里的篇目（README 第 1.2 节与第二节）</text>

  <rect x="20" y="574" width="312" height="86" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="32" y="598" font-size="14" font-weight="bold" fill="#334155">本目录根下 1 篇</text>
  <text x="32" y="620" font-size="12" fill="#334155">压缩算法.md：Snappy / LZW / zstd / lz4</text>
  <text x="32" y="640" font-size="12" fill="#334155">加编码层 Huffman / 算术 / RLE / LZ</text>

  <rect x="344" y="574" width="312" height="86" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="356" y="598" font-size="14" font-weight="bold" fill="#1e3a8a">姊妹目录 数据结构／</text>
  <text x="356" y="620" font-size="12" fill="#1e3a8a">结构本体：树 / 堆 / 哈希 / 图的表示</text>
  <text x="356" y="640" font-size="12" fill="#1e3a8a">概率结构：布隆 / HLL / Count-Min</text>

  <rect x="668" y="574" width="312" height="86" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="680" y="598" font-size="14" font-weight="bold" fill="#334155">散落在各领域（按主题索引）</text>
  <text x="680" y="620" font-size="12" fill="#334155">限流 / 缓存淘汰 → 服务治理 · 缓存</text>
  <text x="680" y="640" font-size="12" fill="#334155">分布式ID / Raft → 分布式 · GC → 垃圾回收</text>

  <text x="20" y="684" font-size="12" fill="#94a3b8">具体语言的实现与工程用法留在 01-编程语言／ 各语言目录；按「算法」复习从本图进，按「技术栈」复习从 目录.md 进。</text>
</svg>
