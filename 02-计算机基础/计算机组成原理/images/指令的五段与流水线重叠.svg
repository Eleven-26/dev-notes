<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>
  <rect x="40" y="16" width="920" height="58" fill="#ffffff"/>
  <text x="60" y="44" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#0f172a">五段流水线：单条 5 周期，稳态每周期完成一条</text>
  <text x="60" y="66" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">带宽上的矛盾靠重叠解决：延迟不变，吞吐变成 1 条/周期，于是 IPC 可以大于 1</text>

  <rect x="40" y="82" width="920" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="200" y="96" width="78" height="26" rx="4" fill="#e2e8f0"/>
  <text x="230" y="114" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#334155">周期 1</text>
  <rect x="290" y="96" width="78" height="26" rx="4" fill="#e2e8f0"/>
  <text x="320" y="114" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#334155">周期 2</text>
  <rect x="380" y="96" width="78" height="26" rx="4" fill="#e2e8f0"/>
  <text x="410" y="114" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#334155">周期 3</text>
  <rect x="470" y="96" width="78" height="26" rx="4" fill="#e2e8f0"/>
  <text x="500" y="114" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#334155">周期 4</text>
  <rect x="560" y="96" width="78" height="26" rx="4" fill="#e2e8f0"/>
  <text x="590" y="114" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#334155">周期 5</text>
  <rect x="650" y="96" width="78" height="26" rx="4" fill="#e2e8f0"/>
  <text x="680" y="114" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#334155">周期 6</text>
  <rect x="740" y="96" width="78" height="26" rx="4" fill="#e2e8f0"/>
  <text x="770" y="114" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#334155">周期 7</text>

  <rect x="60" y="132" width="120" height="40" rx="5" fill="#e0e7ff"/>
  <text x="76" y="157" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#3730a3">指令 A</text>

  <rect x="200" y="132" width="78" height="40" rx="5" fill="#2563eb"/>
  <text x="222" y="157" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#ffffff">取指</text>
  <rect x="290" y="132" width="78" height="40" rx="5" fill="#0ea5e9"/>
  <text x="312" y="157" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#ffffff">译码</text>
  <rect x="380" y="132" width="78" height="40" rx="5" fill="#0d9488"/>
  <text x="402" y="157" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#ffffff">执行</text>
  <rect x="470" y="132" width="78" height="40" rx="5" fill="#65a30d"/>
  <text x="492" y="157" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#ffffff">访存</text>
  <rect x="560" y="132" width="78" height="40" rx="5" fill="#7c3aed"/>
  <text x="582" y="157" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#ffffff">退休</text>

  <rect x="60" y="184" width="120" height="40" rx="5" fill="#e0e7ff"/>
  <text x="76" y="209" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#3730a3">指令 B</text>

  <rect x="290" y="184" width="78" height="40" rx="5" fill="#2563eb"/>
  <text x="312" y="209" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#ffffff">取指</text>
  <rect x="380" y="184" width="78" height="40" rx="5" fill="#0ea5e9"/>
  <text x="402" y="209" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#ffffff">译码</text>
  <rect x="470" y="184" width="78" height="40" rx="5" fill="#0d9488"/>
  <text x="492" y="209" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#ffffff">执行</text>
  <rect x="560" y="184" width="78" height="40" rx="5" fill="#65a30d"/>
  <text x="582" y="209" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#ffffff">访存</text>
  <rect x="650" y="184" width="78" height="40" rx="5" fill="#7c3aed"/>
  <text x="672" y="209" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#ffffff">退休</text>

  <rect x="60" y="236" width="120" height="40" rx="5" fill="#e0e7ff"/>
  <text x="76" y="261" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#3730a3">指令 C</text>

  <rect x="380" y="236" width="78" height="40" rx="5" fill="#2563eb"/>
  <text x="402" y="261" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#ffffff">取指</text>
  <rect x="470" y="236" width="78" height="40" rx="5" fill="#0ea5e9"/>
  <text x="492" y="261" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#ffffff">译码</text>
  <rect x="560" y="236" width="78" height="40" rx="5" fill="#0d9488"/>
  <text x="582" y="261" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#ffffff">执行</text>
  <rect x="650" y="236" width="78" height="40" rx="5" fill="#65a30d"/>
  <text x="672" y="261" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#ffffff">访存</text>
  <rect x="740" y="236" width="78" height="40" rx="5" fill="#7c3aed"/>
  <text x="762" y="261" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#ffffff">退休</text>

  <rect x="60" y="292" width="120" height="28" rx="4" fill="#fef3c7"/>
  <text x="74" y="311" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#92400e">同时在第几段</text>
  <text x="200" y="311" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#475569">周期 3 起每列都是满的：同一时刻有 3 条指令在不同段上</text>

  <rect x="60" y="330" width="120" height="28" rx="4" fill="#dbeafe"/>
  <text x="74" y="349" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1e40af">隐含前提</text>
  <text x="200" y="349" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#475569">三条指令之间无依赖；若有依赖，后一条必须在「执行」段前等前一条算完</text>
</svg>
